<!DOCTYPE html>
<!--
  Connect Lite — observation tasks
  © 2026 Ramy Sakr. All rights reserved.

  A CELTA trainee observes six hours of teaching and writes up what they saw,
  and the completed sheets go in the portfolio (Administration Handbook 12.1.1).
  Lite had nowhere for them.

  WHAT CHANGED THE DESIGN. The first version of this screen was a checklist:
  tick what you have observed, the sheet itself lives in Classroom. Ramy, 27
  Sep 2026: "you're just ticking boxes here. I was talking about the actual
  observation tasks." He was right, and it failed the test I had set two
  minutes earlier — for an observation, the completed sheet IS the record. A
  tick saying a document exists elsewhere carries no information.

  So the task is the document, and it lives here. The trainee writes into it
  and turns it in, exactly as with a written assignment, and it lands in their
  portfolio with a date on it.

  SIX SHAPES, because the centre's sheets are not all one thing and flattening
  them would lose what makes them good:
    grid       focus rows answered for Teacher 1, 2 and 3   peer TP1-5, 7
    single     questions answered once across all teachers   peer TP6
    focus      a focus area per teacher, no set questions     peer TP8
    notes      focus rows with one notes column               the four filmed
    questions  numbered questions, open answers               live demo 1
    parts      lettered parts, some with choices              live task 2

  The task wording is the centre's (observation-defaults.js, generated from
  their own Word sheets by store/build-observation-defaults.mjs). The SHAPE is
  not editable: a centre can change any question, and cannot turn the peer grid
  into something that will not print.

  Each peer task is done TWICE -- the a and b halves of a TP day -- which is
  why a sitting is part of the record's key rather than a second task.

  ONLY THE FILMED AND LIVE SHEETS ARE TURNED IN. Ramy, 27 Sep 2026: "they
  don't need to turn in peer observations, only demo lesson observations and
  experienced teacher observations, whether it's filmed or not." The peer
  sheets are the trainee's own notes: they save, the tutor can read them,
  and nothing about them is dated or counted.
-->

<style>
  /* The palette lives on each screen, not in hub-house.css. */
  :root{
    --sync-bottom:66px; /* the sync pill clears the Turn in bar */
  }
  body{background:var(--sand); color:var(--ink); font-family:'Karla',sans-serif; margin:0;}
  .board{max-width:1020px; margin:0 auto; padding:26px 20px 64px;}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}

  /* ---- the list of tasks ------------------------------------------------ */
  .grp{background:var(--surface); border:1px solid var(--sand-line); border-radius:10px;
    padding:18px 20px 8px; margin:16px 0;}
  .grp > .hd{display:flex; align-items:center; gap:10px; justify-content:space-between; margin-bottom:3px;}
  .grp h2{font-family:'Newsreader',Georgia,serif; font-size:1.15rem; color:var(--ink); margin:0;}
  .grp > .note{margin:0 0 14px; color:var(--grey); font-size:0.85rem; line-height:1.55;}
  .sub{background:var(--paper); border:1px solid var(--sand-line); border-radius:8px; padding:6px 14px; margin:0 0 14px;}
  .sub h3{font-family:'Newsreader',Georgia,serif; font-size:1rem; color:var(--ink); margin:12px 0 2px;}
  .sub > .note{color:var(--grey); font-size:0.82rem; margin:0 0 8px;}

  .task{display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--sand-line);
    text-decoration:none; color:inherit;}
  .task:first-of-type{border-top:0;}
  .task .tp{flex:none; width:52px; font-size:0.72rem; font-weight:700; letter-spacing:.05em; color:var(--grey);}
  .task .nm{flex:1; min-width:0; font-size:0.92rem; font-weight:600; color:var(--ink);}
  .task .nm small{display:block; font-weight:400; font-size:0.79rem; color:var(--grey); margin-top:1px;}
  /* a row that opens: the house ring, no colour change (hover carries no hue) */
  .task:hover{box-shadow:var(--hub-ring, 0 0 0 2px oklch(86% 0.014 82)); border-radius:6px;}
  .st{flex:none; font-size:0.71rem; font-weight:700; padding:3px 9px; border-radius:999px;
    background:var(--box); color:var(--grey);}
  /* the tracker's 'fine' chip, so done reads the same everywhere */
  .st.done{background:oklch(95% 0.02 155); color:oklch(35% 0.08 155);}
  .st.part{background:oklch(94% 0.05 85); color:var(--gold);}
  .after{margin-top:22px; padding-top:16px; border-top:1px solid var(--sand-line);}
  .after h4{font-family:'Newsreader',Georgia,serif; font-size:1rem; margin:0 0 10px;}
  .tally{font-size:0.75rem; font-weight:700; color:var(--teal); background:var(--box);
    border-radius:999px; padding:3px 10px; white-space:nowrap;}

  /* ---- one task, open --------------------------------------------------- */
  .brief{white-space:pre-line; background:var(--box); border-radius:7px; padding:11px 13px; font-size:0.85rem;
    line-height:1.55; margin:0 0 16px;}
  table.sheet{width:100%; border-collapse:collapse; margin:0 0 18px;}
  table.sheet th{font-size:0.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--grey);
    text-align:left; font-weight:700; padding:0 8px 7px; border-bottom:1px solid var(--sand-line);}
  table.sheet th.n{width:26px;} table.sheet th.q{width:38%;}
  table.sheet td{vertical-align:top; padding:9px 8px; border-bottom:1px solid var(--sand-line);}
  table.sheet td.n{color:var(--grey); font-size:0.8rem; padding-top:13px;}
  table.sheet td.q{font-size:0.86rem; line-height:1.5;}
  /* On a phone the grid stops being a grid. Five columns in 375px crushed
     each teacher's box to 53px and stretched a question over eight lines
     (Ramy, 29 Sep 2026, looking at it in the pane). Below 600px each row is a
     block: the question, then one full-width box per teacher, labelled. Same
     cells, same record -- only the layout changes. */
  @media(max-width:600px){
    table.sheet.stack, table.sheet.stack tbody, table.sheet.stack tr, table.sheet.stack td{display:block; width:100%;}
    table.sheet.stack thead{display:none;}
    table.sheet.stack tr{padding:12px 0 14px; border-bottom:1px solid var(--sand-line);}
    table.sheet.stack td{border:none; padding:0;}
    table.sheet.stack td.n{display:inline; padding:0 8px 0 0; font-size:0.78rem; vertical-align:baseline;}
    table.sheet.stack td.q{display:inline; font-size:0.9rem; line-height:1.5; vertical-align:baseline;}
    table.sheet.stack td[data-t]{margin-top:10px;}
    table.sheet.stack td[data-t]::before{content:attr(data-t); display:block; font-size:0.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--grey); margin:0 0 4px;}
    table.sheet.stack td[data-t] textarea{width:100%; min-height:64px;}
  }
  textarea{width:100%; font-family:'Karla',sans-serif; font-size:0.86rem; line-height:1.5;
    color:var(--ink); background:var(--paper); border:1px solid var(--sand-line); border-radius:6px;
    padding:7px 9px; resize:vertical; min-height:46px; box-sizing:border-box;}
  textarea:focus{outline:none; border-color:var(--teal);}
  /* six fields, as Cambridge's observation record has: lesson, level, length,
     learners present, date, and the observed teacher's signature */
  /* Each cell is its own column so the boxes line up however long a label
     runs -- the signature label is two lines and used to drag its box below
     the two beside it. */
  .hdrow{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 16px; align-items:end;}
  .hdrow > div{display:flex; flex-direction:column;}
  .hdrow > div > label{flex:1;}
  @media(max-width:700px){ .hdrow{grid-template-columns:repeat(2,1fr);} }
  .hdrow label{display:block; font-size:0.7rem; letter-spacing:.06em; text-transform:uppercase;
    color:var(--grey); font-weight:700; margin-bottom:4px;}
  .hdrow input{width:100%; font-family:'Karla',sans-serif; font-size:0.86rem; color:var(--ink);
    background:var(--paper); border:1px solid var(--sand-line); border-radius:6px; padding:7px 9px; box-sizing:border-box;}
  .part{margin:0 0 20px;}
  .part h4{font-family:'Newsreader',Georgia,serif; font-size:1.02rem; margin:0 0 4px;}
  .part .lines{font-size:0.84rem; color:var(--grey); line-height:1.6; margin:0 0 9px; white-space:pre-line;}
  /* a tick list: one choice, as pills; the document's group labels above each run */
  .tick{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 10px;}
  .tick-g{flex-basis:100%; font-size:0.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--grey); margin:4px 0 0;}
  .set{margin:0 0 14px;}
  .set .tick-g{margin:0 0 6px;}
  .set textarea{min-height:72px;}
  .tick-o{font-size:0.82rem; border:1px solid var(--sand-line); border-radius:999px; padding:5px 11px; cursor:pointer; background:var(--paper);}
  .tick-o input{display:none;}
  .tick-o:has(input:checked){background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .tick-o:has(input:disabled){cursor:default;}
  /* A phone is tapped with a thumb: the pills grow to a 44px target, the size
     the peer checkboxes already use, and each takes its own line. */
  @media(max-width:600px){ .tick{gap:8px;} .tick-o{flex-basis:100%; box-sizing:border-box; min-height:44px; display:flex; align-items:center; padding:8px 14px; font-size:0.9rem;} }
  /* a grid to fill in: text inputs in Cambridge-style cells; stacks on a phone like the rest */
  .tablewrap{overflow-x:auto; margin:0 0 10px;}
  table.sheet.fill td{padding:5px 4px;}
  table.sheet.fill td.narrow{width:76px;}
  table.sheet.fill input{width:100%; box-sizing:border-box; font-family:'Karla',sans-serif; font-size:0.84rem; color:var(--ink); background:var(--field); border:1px solid var(--sand-line); border-radius:6px; padding:6px 8px;}
  table.sheet.fill input:focus{outline:2px solid var(--teal); outline-offset:1px;}
  @media(max-width:600px){ table.sheet.stack.fill td.n{display:block; font-weight:700; color:var(--ink); margin:0 0 4px;} table.sheet.stack.fill td[data-t]{margin-top:8px;} }
  .bar{position:sticky; bottom:0; background:var(--sand); border-top:1px solid var(--sand-line);
    padding:12px 0; margin-top:8px; display:flex; align-items:center; gap:12px;}
  .status{font-size:0.8rem; color:var(--grey);}
  .turned{background:oklch(92% 0.05 150); color:oklch(38% 0.09 150); border-radius:7px;
    padding:10px 13px; font-size:0.85rem; margin:0 0 16px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.6rem; margin:0 0 4px;}
  .lede{color:var(--grey); font-size:0.88rem; line-height:1.6; margin:0 0 18px; max-width:66ch;}
</style>

<script type="text/x-hub-app">
/* A trainee's own work. A tutor or an assessor READS it -- they have to, it
   is portfolio evidence -- so the page is not refused them; the fields are
   simply not theirs to type in. */
const READONLY = window.HubMode !== 'trainee';

const KEY = 'connect_observations_v1';
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const P = new URLSearchParams(location.search);
/* Whichever key opened this page comes along on every link inside it. */
const KEYQ = ['t','k','ak','trainee'].filter(n => P.get(n)).map(n => n + '=' + encodeURIComponent(P.get(n))).join('&');

/* The centre's own wording, once it has saved any (19_observation_wording,
   course kind `observations`); otherwise the set Lite ships, generated from
   the centre's Word sheets. Whole record or nothing -- never a merge. */
let WORDING = null; try { WORDING = JSON.parse(localStorage.getItem('connect_observation_wording_v1')); } catch(e) {}
const TASKS = (WORDING && WORDING.peer) ? WORDING : (window.CONNECT_HUB_OBSERVATION_DEFAULTS || { peer:[], filmed:[], live:[] });

/* The trainee's own copy, or -- for a tutor or assessor -- the trainee
   named in the link, out of the roster the boot brought down. */
let WORK = {}, WHO = '';
try {
  if (!READONLY) WORK = JSON.parse(localStorage.getItem(KEY) || '{}') || {};
  else {
    const roster = JSON.parse(localStorage.getItem('connect_roster_v1') || '{}') || {};
    const tr = ((roster.trainees || {})[P.get('trainee') || ''] || null);
    if (tr) { WORK = tr.observations || {}; WHO = tr.name || ''; }
  }
} catch(e) {}
/* The first version of this screen was a checklist under the same key; its
   ticks are not sheets and are dropped rather than carried. */
const KNOWN = {}; ['peer','filmed','live'].forEach(g => (TASKS[g]||[]).forEach(t => KNOWN[t.id] = 1));
Object.keys(WORK).forEach(k => { if (!KNOWN[k.split('#')[0]] || !WORK[k] || typeof WORK[k].a !== 'object') delete WORK[k]; });
const save = () => { if (READONLY) return; try { localStorage.setItem(KEY, JSON.stringify(WORK)); } catch(e) {} };
/* Peer sheets are notes; the filmed and live ones are turned in. */
const turnsIn = t => !t.tp;

/* A peer task is done twice, for the two halves of a TP day, so a sitting is
   part of the key. Everything else is done once. */
const recKey = (id, sit) => sit ? id + '#' + sit : id;
/* A filmed or live sheet is numbered by its position in the course's own
   order, which the trainer sets on Course admin. The line under the title
   reads "Recording: observation N" from that, with the film's name after it
   where the trainer gave one; the Word file's own "Recording: observation N"
   is only the fallback. */
const posOf = t => { const g = t.id.startsWith('filmed') ? TASKS.filmed : t.id.startsWith('live') ? TASKS.live : null; const i = g ? g.findIndex(x => x.id === t.id) : -1; return i >= 0 ? i + 1 : null; };
const subOf = t => { if (t.id.startsWith('live')) return 'Demonstration class led by a tutor with the TP students \u00b7 two 45-minute lessons' + (t.sub ? ' \u00b7 ' + t.sub : ''); if (t.sub) return t.sub; if (!t.id.startsWith('filmed')) return t.recording || ''; const n = posOf(t); return (n ? 'Recording: observation ' + n : (t.recording || '')) + (t.film ? ' \u00b7 ' + t.film : ''); };
const rec = k => (WORK[k] = WORK[k] || { a:{}, turnedInAt:null });
/* How much of a sheet is done. A parts sheet counts PARTS with anything in
   them, not fields -- its stage map alone is twenty-eight cells, which would
   have read as "Complete" on its own. Every other shape counts filled boxes. */
const answered = k => {
  const a = (WORK[k] || {}).a || {};
  const keys = Object.keys(a).filter(f => String(a[f]||'').trim());
  const parts = new Set(keys.map(f => (f.match(/^p(\d+)/) || [])[1]).filter(Boolean));
  return parts.size ? parts.size : keys.length;
};

const TEACHERS = ['Teacher 1','Teacher 2','Teacher 3'];

/* ---------------------------------------------------------------- the list */
const expectedOf = t =>
  t.shape === 'grid'  ? t.rows.length * 3 :
  t.shape === 'focus' ? TEACHERS.length :
  t.shape === 'parts' ? (t.parts||[]).length : (t.rows||[]).length;

function statusOf(k, expected, dated){
  const r = WORK[k];
  if (dated && r && r.turnedInAt) return '<span class="st done">Turned in</span>';
  const n = answered(k);
  if (!n) return '<span class="st">Not started</span>';
  if (expected && n >= expected) return '<span class="st done">Complete</span>';
  return `<span class="st part">${n}${expected ? ' of ' + expected : ''} answered</span>`;
}
function row(t, sit){
  const k = recKey(t.id, sit);
  const label = sit ? `TP${t.tp}${sit}` : (t.tp ? 'TP'+t.tp : (posOf(t) ? (t.id.startsWith('filmed') ? 'Film ' : 'Live ') + posOf(t) : ''));
  const q = `?task=${encodeURIComponent(t.id)}${sit ? '&sit=' + sit : ''}${KEYQ ? '&' + KEYQ : ''}`;
  return `<a class="task" href="${q}">
    <span class="tp">${esc(label)}</span>
    <span class="nm">${esc(t.title)}${subOf(t) ? `<small>${esc(subOf(t))}</small>` : ''}</span>
    ${statusOf(k, expectedOf(t), turnsIn(t))}
  </a>`;
}
const tallyOf = keys => `<span class="tally">${keys.filter(k => (WORK[k]||{}).turnedInAt).length} of ${keys.length} turned in</span>`;

function list(){
  const otherKeys = TASKS.filmed.concat(TASKS.live).map(t => t.id);
  $('back').href = READONLY && P.get('trainee') ? '12_assessor_pack.html?' + KEYQ : 'index.html' + (KEYQ ? '?' + KEYQ : '');
  $('app').innerHTML = `
    <p class="eyebrow">${READONLY ? 'Trainee record' : 'Your course'}</p>
    <h1>Observation tasks</h1>
    <p class="lede">${READONLY
      ? (WHO ? `<b>${esc(WHO)}</b>’s observation sheets, as they wrote them. Not yours to type in.` : 'Name a trainee in the link to read their sheets.')
      : 'Watching other people teach, and writing up what you saw. The sheets for filmed and live lessons are turned in here and go in your portfolio with the date on them; the peer sheets are your own notes.'}</p>

    <div class="grp">
      <div class="hd"><h2>Peer observations</h2></div>
      <p class="note">${READONLY ? 'The trainee’s own teaching practice group. Each task is done twice — once for each half of the TP day. Notes, not turned in.'
        : 'Your own teaching practice group. Each task is done twice — once for each half of the TP day. These are your notes for feedback; they save as you go and are not turned in.'}</p>
      <div class="sub">${TASKS.peer.map(t => ['a','b'].map(s => row(t, s)).join('')).join('')}</div>
    </div>

    <div class="grp">
      <div class="hd"><h2>Experienced teachers</h2>${tallyOf(otherKeys)}</div>
      <p class="note">The observations Cambridge asks for outside your own group.</p>
      <div class="sub">
        <h3>Filmed lessons</h3>
        <p class="note">${READONLY ? 'Watched in the trainee’s own time; turned in and dated.' : 'Watched in your own time. Pause and rewind — these are not meant to be done in one viewing.'}</p>
        ${TASKS.filmed.map(t => row(t)).join('')}
      </div>
      <div class="sub">
        <h3>Live observation of experienced teachers</h3>
        <p class="note">A real class, watched as it happens.</p>
        ${TASKS.live.map(t => row(t)).join('')}
      </div>
    </div>`;
}

/* ------------------------------------------------------------- one task */
function findTask(id){
  for (const g of ['peer','filmed','live']) { const t = (TASKS[g]||[]).find(x => x.id === id); if (t) return t; }
  return null;
}
const box = (k, field) => {
  const v = ((WORK[k]||{}).a || {})[field] || '';
  return `<textarea data-f="${esc(field)}"${READONLY ? ' readonly' : ''}>${esc(v)}</textarea>`;
};
/* A sheet may declare its own length: live teaching is 90 minutes at each
   level, so those two start filled in and the trainee can still change it.
   The filmed recordings vary course to course and declare none. */
const field = (k, name, label, fallback, hint) => {
  const v = (((WORK[k]||{}).a)||{})[name];
  const shown = (v === undefined || v === '') && fallback != null ? String(fallback) : (v || '');
  return `<div><label>${label}</label><input data-f="${name}" value="${esc(shown)}"${hint ? ` placeholder="${esc(hint)}"` : ''}${READONLY ? ' readonly' : ''}></div>`;
};

function sheet(t, sit){
  const k = recKey(t.id, sit);
  rec(k);
  const turned = WORK[k].turnedInAt;

  let body = '';
  if (t.shape === 'grid') {
    body = `<table class="sheet stack"><thead><tr><th class="n"></th><th class="q">Observation focus</th>
      ${TEACHERS.map(n => `<th>${n}</th>`).join('')}</tr></thead><tbody>
      ${t.rows.map((q,i) => `<tr><td class="n">${i+1}</td><td class="q">${esc(q)}</td>
        ${TEACHERS.map((n,c) => `<td data-t="${esc(n)}">${box(k, 'r'+i+'c'+c)}</td>`).join('')}</tr>`).join('')}
      </tbody></table>`;
  } else if (t.shape === 'single' || t.shape === 'notes') {
    const head = t.shape === 'notes' ? 'Your notes' : 'Notes (all teachers)';
    body = `<table class="sheet stack"><thead><tr><th class="n"></th><th class="q">Observation focus</th><th>${head}</th></tr></thead><tbody>
      ${t.rows.map((q,i) => `<tr><td class="n">${i+1}</td><td class="q">${esc(q)}</td><td data-t="${esc(head)}">${box(k, 'r'+i)}</td></tr>`).join('')}
      </tbody></table>`;
    /* The sheet's own closing section. These used to be glued onto the end of
       the last row, heading and all, so nobody could answer them separately. */
    if ((t.after || []).length) body += `<div class="after"><h4>After watching</h4>
      ${t.after.map((q,i) => `<div class="part"><p class="lines">${esc(q)}</p>${box(k, 'a'+i)}</div>`).join('')}</div>`;
  } else if (t.shape === 'focus') {
    body = TEACHERS.map((n,c) => `<div class="part"><h4>${n}</h4>
      <p class="lines">Focus area — what they asked you to watch for, and what you saw.</p>${box(k, 'f'+c)}</div>`).join('');
  } else if (t.shape === 'questions') {
    body = t.rows.map((q,i) => `<div class="part"><h4>${i+1}. ${esc(q)}</h4>${box(k, 'q'+i)}</div>`).join('');
    if ((t.after || []).length) body += `<div class="after"><h4>After the lesson</h4>
      ${t.after.map((q,i) => `<div class="part"><p class="lines">${esc(q)}</p>${box(k, 'a'+i)}</div>`).join('')}</div>`;
  } else if (t.shape === 'parts') {
    /* A part is a run of blocks from the centre's own document: lines of
       instruction, tick lists, and grids to fill in. Until 29 Sep 2026 the
       document's tables and tick-boxes were flattened to text, so the stage
       map in Live Task 2 read as its column names and the digits one to seven
       over a single box, and "Tick the one that fits best" had nothing to
       tick. A part with no blocks (an older wording record) renders as before. */
    const tick = (pi, bi, g) => {
      const f = 'p' + pi + 't' + bi, v = ((WORK[k]||{}).a || {})[f] || '';
      return `<div class="tick">${g.groups.map(gr => `${gr.label ? `<div class="tick-g">${esc(gr.label)}</div>` : ''}
        ${gr.options.map(o => `<label class="tick-o"><input type="radio" name="${esc(f)}" data-f="${esc(f)}" value="${esc(o)}"${v===o?' checked':''}${READONLY ? ' disabled' : ''}><span>${esc(o)}</span></label>`).join('')}`).join('')}</div>`;
    };
    const grid = (pi, bi, g) => `<div class="tablewrap"><table class="sheet stack fill"><thead><tr><th class="n"></th>${g.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>
      ${Array.from({ length: g.rows }, (_, r) => `<tr><td class="n">${r+1}</td>${g.head.map((h, c) => { const f = 'p' + pi + 'g' + r + 'c' + c, v = ((WORK[k]||{}).a || {})[f] || '';
        return `<td data-t="${esc(h)}"${/minute/i.test(h) ? ' class="narrow"' : ''}><input data-f="${esc(f)}" value="${esc(v)}"${READONLY ? ' readonly' : ''}></td>`; }).join('')}</tr>`).join('')}
      </tbody></table></div>`;
    /* A set is the document's own grouping: its label in small capitals, its
       prompts, and one answer for the set. Items are one answer each. A part
       built of sets, items or a grid has its answers inside it and no box at
       the end. */
    const set = (pi, bi, b) => `<div class="set"><div class="tick-g">${esc(b.label)}</div>${b.prompts.map(t => `<p class="lines">${esc(t)}</p>`).join('')}${box(k, 'p' + pi + 's' + bi)}</div>`;
    const items = (pi, bi, b) => b.items.map((t, n) => `<div class="set"><p class="lines">${esc(t)}</p>${box(k, 'p' + pi + 'i' + bi + '_' + n)}</div>`).join('');
    body = (t.parts||[]).map((p,i) => {
      const blocks = p.blocks && p.blocks.length ? p.blocks : (p.lines||[]).map(text => ({ kind:'text', text }));
      const selfAnswered = blocks.some(b => b.kind === 'grid' || b.kind === 'set' || b.kind === 'items');
      const inner = blocks.map((b, bi) => b.kind === 'tick' ? tick(i, bi, b) : b.kind === 'grid' ? grid(i, bi, b) : b.kind === 'set' ? set(i, bi, b) : b.kind === 'items' ? items(i, bi, b) : `<p class="lines">${esc(b.text)}</p>`).join('');
      return `<div class="part"><h4>${esc(p.letter)}. ${esc(p.title)}</h4>${inner}${selfAnswered ? '' : box(k, 'p'+i)}</div>`;
    }).join('');
  }

  /* The filmed and live sheets open with the lesson's particulars; the peer
     ones do not -- the trainee was in the room. */
  const header = /^(notes|parts|questions)$/.test(t.shape)
    ? `<div class="hdrow">${t.id.startsWith('live') ? field(k,'hTeacher','Teacher observed') : ''}${field(k,'hLesson','Lesson')}${field(k,'hLevel','Level')}${field(k,'hLength','Length',t.minutes)}${field(k,'hLearners','Learners present')}${field(k,'hDate', t.id.startsWith('live') ? 'Date' : 'Date watched')}${field(k,'hSigned','Signature of observed teacher', null, 'if your centre asks')}</div>` : '';

  $('back').href = location.pathname + (KEYQ ? '?' + KEYQ : '');
  $('app').innerHTML = `
    <p class="eyebrow">${READONLY && WHO ? esc(WHO) + ' · ' : ''}${t.tp ? 'Peer observation · TP' + t.tp + (sit||'') : (t.id.startsWith('filmed') ? 'Filmed observation' : 'Live observation of experienced teachers')}</p>
    <h1>${esc(t.title)}</h1>
    ${subOf(t) ? `<p class="lede">${esc(subOf(t))}</p>` : ''}
    ${turnsIn(t) && turned ? `<div class="turned"><b>Turned in</b> — ${new Date(turned).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}.${READONLY ? '' : ' It is on your record; you can still add to it.'}</div>` : ''}
    ${t.brief ? `<div class="brief">${esc(t.brief)}</div>` : ''}
    ${header}
    ${body}
    ${READONLY ? '' : turnsIn(t)
      ? `<div class="bar"><button class="btn primary" id="turnIn">${turned ? 'Turn in again' : 'Turn in'}</button><span class="status" id="status"></span></div>`
      : `<div class="bar"><span class="status" id="status">Your notes save as you type.</span></div>`}`;

  if (READONLY) return;
  let t0;
  const touch = el => {
    WORK[k].a[el.dataset.f] = el.value; save();
    const s = $('status'); if (s) { s.textContent = 'Saved'; clearTimeout(t0); t0 = setTimeout(() => { if ($('status')) $('status').textContent = turnsIn(t) ? '' : 'Your notes save as you type.'; }, 1200); }
  };
  document.querySelectorAll('textarea[data-f], input[data-f]').forEach(el => { el.addEventListener('input', () => touch(el)); if (el.type === 'radio') el.addEventListener('change', () => touch(el)); });
  /* Bullets that carry themselves (Ramy, 29 Sep 2026: "just makes it easier
     to take notes"). In any notes box, a line that starts with a bullet --
     "• ", "- ", "– " or "* " -- continues onto the next line when Enter is
     pressed, and Enter on an empty bullet ends the list. Nothing is stored
     differently; a trainee who never types a bullet never sees one. */
  document.querySelectorAll('textarea[data-f]').forEach(ta => ta.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || ta.readOnly) return;
    const v = ta.value, at = ta.selectionStart;
    if (at !== ta.selectionEnd) return;
    const lineStart = v.lastIndexOf('\n', at - 1) + 1;
    const line = v.slice(lineStart, at);
    const m = line.match(/^(\s*)([\u2022\-\u2013*])\s(.*)$/);
    if (!m) return;
    e.preventDefault();
    let next, caret;
    if (!m[3].trim()) { next = v.slice(0, lineStart) + v.slice(at); caret = lineStart; }          // empty bullet: end the list
    else { const ins = '\n' + m[1] + m[2] + ' '; next = v.slice(0, at) + ins + v.slice(at); caret = at + ins.length; }
    ta.value = next; ta.setSelectionRange(caret, caret);
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  }));
  if ($('turnIn')) $('turnIn').addEventListener('click', () => {
    /* Handbook 12.1.2 asks for the tutor's name and date on feedback and progress records; dating a turned-in sheet is the centre's own practice. */
    WORK[k].turnedInAt = new Date().toISOString(); save(); sheet(t, sit);
  });
}

const id = P.get('task');
if (id && findTask(id)) sheet(findTask(id), P.get('sit') || '');
else list();
</script>
</body>
</html>
