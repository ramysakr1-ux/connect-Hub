<!DOCTYPE html>
<!--
  Connect Hub — assignment record (printable), assembled from submission + marking
  © 2026 Ramy Sakr. All rights reserved.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Hub — Assignment record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(92.5% 0.012 85); --sand-line:oklch(89.5% 0.012 82);
    --paper:oklch(99.5% 0.004 90); --ink:oklch(23.5% 0.017 65);
    --teal:oklch(37.5% 0.058 195); --grey:oklch(51% 0.017 70); --brick:oklch(45% 0.15 27);
  }
  *{box-sizing:border-box;}
  a{color:var(--teal);} a:hover{color:oklch(30% 0.06 195);}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:32px 16px 80px; display:flex; flex-direction:column; align-items:center;}
  .doc{max-width:760px; width:100%; background:var(--paper); padding:44px 52px; border-radius:6px;}
  .back{display:block; margin:0 auto 16px; max-width:760px; width:100%; font-size:0.85rem; font-weight:600; text-decoration:none;}
  .doc h1{font-family:'Newsreader',Georgia,serif; font-size:1.6rem; margin:0 0 2px;}
  .eyebrow{font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--grey); margin:0 0 6px;}
  .outcome-badge{display:inline-block; font-weight:700; font-size:0.9rem; padding:5px 14px; border-radius:12px; margin:10px 0 22px;}
  .outcome-badge.pass{background:oklch(93% 0.05 145); color:oklch(35% 0.08 145);}
  .outcome-badge.fail{background:oklch(92% 0.08 27); color:var(--brick);}
  .section{border-top:1px solid var(--sand-line); padding:20px 0;}
  .section:first-of-type{border-top:none;}
  .section h2{font-family:'Newsreader',Georgia,serif; font-size:1.15rem; margin:0 0 12px; color:var(--ink);}
  .roundlabel{font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--teal); margin:14px 0 6px;}
  .roundlabel:first-child{margin-top:0;}
  .readonly{white-space:pre-wrap; font-size:0.9rem; line-height:1.6; background:oklch(97.5% 0.008 85); border:1px solid var(--sand-line); border-radius:6px; padding:10px 12px; margin-bottom:8px;}
  table.crit{width:100%; border-collapse:collapse; font-size:0.87rem; margin-top:6px;}
  table.crit th{text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--grey); padding:6px 8px; border-bottom:1.5px solid var(--sand-line);}
  table.crit td{padding:8px; border-bottom:1px solid var(--sand-line); vertical-align:top;}
  table.crit td.mark{text-align:center; font-weight:700; white-space:nowrap;}
  table.crit td.mark.met{color:oklch(35% 0.08 145);}
  table.crit td.mark.not{color:var(--brick);}
  .comment{font-size:0.9rem; line-height:1.6; background:oklch(97.8% 0.02 72); border-left:4px solid oklch(63% 0.096 72); padding:12px 16px; border-radius:6px; margin-top:10px;}
  .empty{text-align:center; color:var(--grey); padding:60px 20px;}
  .actions{max-width:760px; width:100%; display:flex; justify-content:center; margin-top:18px;}
  .actions button{font-family:'Karla',sans-serif; font-size:0.85rem; font-weight:600; padding:10px 22px; border-radius:20px;
    border:1.5px solid var(--teal); background:var(--paper); color:var(--teal); cursor:pointer;}
  @media print{ .back,.actions{display:none !important;} body{background:#fff; padding:0;} .doc{border-radius:0; padding:0.4in;} }
</style>
</head>
<body>
<a class="back" href="5_tutor_dashboard.html">&#8592; Back to dashboard</a>
<div class="doc" id="doc"></div>
<div class="actions"><button id="printBtn">Print / Save as PDF</button></div>
<script>
const WORDING_KEY = 'connect_assignment_wording_v2';
const SUB_KEY = 'connect_assignment_submissions_v1';
const $ = id => document.getElementById(id);
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

let WORDING = null; try { WORDING = JSON.parse(localStorage.getItem(WORDING_KEY)); } catch(e) {}
if (WORDING) { Object.keys(WORDING).forEach(k => {
  const aa = WORDING[k]; if (!aa || !aa.criteria) return;
  aa.criteria = aa.criteria.map(c => typeof c === 'string' ? {text:c, sectionIndex:null} : c);
}); }
const params = new URLSearchParams(location.search);
const TRAINEE_ID = params.get('trainee') || '';
const ROSTER_KEY = 'connect_roster_v1';
function loadRoster(){ try{ return JSON.parse(localStorage.getItem(ROSTER_KEY)) || {trainees:{}}; }catch(e){ return {trainees:{}}; } }

let SUBS = null;
if (TRAINEE_ID) { const tr = loadRoster().trainees[TRAINEE_ID]; SUBS = (tr && tr.assignments) || {}; }
else { try { SUBS = JSON.parse(localStorage.getItem(SUB_KEY)); } catch(e) {} }

const key = params.get('a') || 'lrt';
const a = WORDING && WORDING[key];
const sub = SUBS && SUBS[key];

function submissionHTML(a, snap){
  if (!snap) return '<p class="readonly">Nothing submitted.</p>';
  let out = '';
  a.sections.forEach((s,i) => {
    if (s.type==='text' && !/before you start/i.test(s.label) && snap.text && snap.text[i]) {
      out += `<div class="roundlabel">${esc(s.label)}</div><div class="readonly">${nl2br(snap.text[i])}</div>`;
    } else if (s.type==='picker' && snap.picked && snap.picked[i]) {
      const p = snap.picked[i];
      out += `<div class="roundlabel">${esc(s.label)}</div><div class="readonly">${esc(s.catA.label)}: ${p.A.map(esc).join(', ')||'\u2014'}\n${esc(s.catB.label)}: ${p.B.map(esc).join(', ')||'\u2014'}</div>`;
    } else if (s.type==='fields' && snap.fields) {
      const items = (snap.picked && (function(){ for(let j=i-1;j>=0;j--){ if(a.sections[j].type==='picker'){ const p=snap.picked[j]||{A:[],B:[]}; return p.A.concat(p.B);} } return []; })());
      (items||[]).forEach((item, ii) => {
        out += `<div class="roundlabel">${esc(s.label)} \u2014 ${esc(item)}</div>`;
        s.fields.forEach((f,fi) => {
          const v = snap.fields[`s${i}_i${ii}_f${fi}`];
          if (v) out += `<div class="readonly"><strong>${esc(f.label)}:</strong> ${nl2br(v)}</div>`;
        });
      });
    } else if (s.type==='declaration' && snap.decl && snap.decl[i]) {
      const d = snap.decl[i];
      out += `<div class="roundlabel">Declaration</div><div class="readonly">${s.items.map((it,ci)=>`${d.checks[ci]?'\u2611':'\u2610'} ${esc(it)}`).join('\n')}${s.aiToggle?`\nAI used: ${d.aiUsed==='yes'?('Yes \u2014 '+esc(d.aiPurpose)+' \u2014 '+esc(d.aiLink)):'No'}`:''}</div>`;
    }
  });
  return out || '<p class="readonly">Nothing submitted.</p>';
}

function criteriaTable(a, marksRound1, marksRound2, commentsRound1, commentsRound2, hasRound2){
  const crit = a.criteria || [];
  if (!crit.length) return '';
  return `<table class="crit"><tr><th>Criterion</th><th>1st sub.</th>${hasRound2?'<th>2nd sub.</th>':''}</tr>
    ${crit.map((c,i)=>{
      const m1 = marksRound1[i]; const m2 = hasRound2 ? marksRound2[i] : undefined;
      const cm1 = commentsRound1[i]; const cm2 = hasRound2 ? commentsRound2[i] : '';
      const cell = (m,cm) => m===true ? '<td class="mark met">Met</td>' : m===false ? `<td class="mark not">Not met${cm?`<div style="font-weight:400; text-transform:none; font-size:0.8rem; margin-top:3px; color:var(--ink);">${nl2br(cm)}</div>`:''}</td>` : '<td class="mark">\u2014</td>';
      return `<tr><td>${esc(c.text)}</td>${cell(m1,cm1)}${hasRound2?cell(m2,cm2):''}</tr>`;
    }).join('')}
  </table>`;
}

function render(){
  if (!a || !sub || sub.stage === 'draft') {
    $('doc').innerHTML = '<div class="empty">Nothing to show yet \u2014 this assignment hasn\u2019t been submitted and marked.</div>';
    return;
  }
  const fb = sub.feedback || {};
  const isPass = /Pass/.test(fb.outcome||'');
  const marks = sub.criteriaMarks || {sub1:[],sub2:[]};
  let html = `<div class="eyebrow">Cambridge CELTA \u00b7 written assignment record</div>
    <h1>${esc(a.title)}</h1>
    ${fb.outcome ? `<div class="outcome-badge ${isPass?'pass':'fail'}">${esc(fb.outcome)}</div>` : ''}

    <div class="section"><h2>First submission</h2>${submissionHTML(a, sub.sub1)}</div>`;

  if (sub.sub2) {
    html += `<div class="section"><h2>Resubmission</h2>${submissionHTML(a, sub.sub2)}</div>`;
  }

  const comments = sub.criteriaComments || {sub1:[],sub2:[]};
  html += `<div class="section"><h2>Assessment criteria</h2>${criteriaTable(a, marks.sub1||[], marks.sub2||[], comments.sub1||[], comments.sub2||[], !!sub.sub2)}</div>`;

  html += `<div class="section"><h2>Tutor's general comments</h2>
    ${fb.generalComment1 ? `<div class="roundlabel">On the first submission</div><div class="comment">${nl2br(fb.generalComment1)}</div>` : ''}
    ${fb.generalComment2 ? `<div class="roundlabel">On the resubmission</div><div class="comment">${nl2br(fb.generalComment2)}</div>` : ''}
    ${(!fb.generalComment1 && !fb.generalComment2) ? '<p class="readonly">No general comment \u2014 feedback is per-criterion above.</p>' : ''}
  </div>`;

  $('doc').innerHTML = html;
}

render();
$('printBtn').addEventListener('click', () => window.print());
</script>
</body>
</html>
