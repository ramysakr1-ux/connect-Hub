<body class="hub-assign">
<a class="back" id="backLink" href="5_tutor_dashboard.html">&#8592; Back to dashboard</a>
<div class="doc" id="doc"></div>
<div class="actions"><button type="button" class="btn-print" id="printBtn">Print / Save as PDF</button></div>
<script src="hub-shared.js?v=202609232334"></script>
<script src="assignment-defaults.js?v=202609232334"></script>
<script src="hub-store.js?v=202609232334"></script>
<script src="hub-sync.js?v=202609232334"></script>
<script type="text/x-hub-app">
const WORDING_KEY = 'connect_assignment_wording_v2';
const SUB_KEY = 'connect_assignment_submissions_v1';
const $ = id => document.getElementById(id);
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

let WORDING = null; try { WORDING = JSON.parse(localStorage.getItem(WORDING_KEY)); } catch(e) {}
// Nothing saved in this browser: the centre's standard wording (assignment-defaults.js).
if (!WORDING && window.CONNECT_HUB_DEFAULT_WORDING) WORDING = JSON.parse(JSON.stringify(window.CONNECT_HUB_DEFAULT_WORDING));
if (WORDING) { Object.keys(WORDING).forEach(k => {
  const aa = WORDING[k]; if (!aa || !aa.criteria) return;
  aa.criteria = aa.criteria.map(c => typeof c === 'string' ? {text:c, sectionIndex:null} : c);
}); }
const params = new URLSearchParams(location.search);
const TRAINEE_ID = params.get('trainee') || '';
const ROSTER_KEY = 'connect_roster_v1';
function loadRoster(){ try{ return JSON.parse(localStorage.getItem(ROSTER_KEY)) || {trainees:{}}; }catch(e){ return {trainees:{}}; } }

let SUBS = null;
if (TRAINEE_ID) { const tr = loadRoster().trainees[TRAINEE_ID]; SUBS = (tr && tr.assignments) || {}; }
else { try { SUBS = JSON.parse(localStorage.getItem(SUB_KEY)); } catch(e) {} }

/* No assignment named: open the first one in the CENTRE's order, not a
   hard-coded one. This read defaulted to 'lrt', so the trainee home's
   "Written assignments" door landed on the second assignment however the
   centre had ordered them (trainee walk, 21 Sep 2026). */
const key = params.get('a') || (hubAssignmentOrder(WORDING).filter(k => k !== 'a5')[0] || 'fol');
const a = WORDING && WORDING[key];
const sub = SUBS && SUBS[key];



function render(){
  /* The record itself is hubAssignmentRecordHTML (hub-shared.js) so that this
     screen and the whole-course record (15) print the same document rather
     than two that drift. */
  const body = window.hubAssignmentRecordHTML ? hubAssignmentRecordHTML(a, sub) : '';
  if (!body) {
    $('doc').innerHTML = '<div class="empty">Nothing to show yet \u2014 this assignment hasn\u2019t been submitted and marked.</div>';
    return;
  }
  $('doc').innerHTML = (window.hubLetterheadHTML ? hubLetterheadHTML('') : '') + body;
}

render();
$('printBtn').addEventListener('click', () => window.print());
if (window.HubMode === 'assessor') { const b=document.getElementById('backLink'); b.href='12_assessor_pack.html' + (TRAINEE_ID ? '?trainee='+encodeURIComponent(TRAINEE_ID) : ''); b.innerHTML='&#8592; Back to the candidate\u2019s pack'; }
// A candidate reading their own record goes back to their assignments, not to the tutor's desk.
if (window.HubMode === 'trainee' || (!TRAINEE_ID && new URLSearchParams(location.search).get('me'))) { const b=document.getElementById('backLink'); b.href='9_assignment_submission.html' + (params.get('a') ? '?a='+params.get('a') : ''); b.innerHTML='&#8592; Back to your assignments'; }
</script>
</body>
</html>
