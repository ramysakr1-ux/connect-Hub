<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Candidate Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7fa; --paper:#fff; --ink:#1c2b3a; --sub:#5b6b7c; --line:#d9e2ec; --soft:#eef2f7;
    --navy:#1F497D; --navy-deep:#163a63; --teal:#2a8c82; --teal-deep:#1f6f66;
    --above:#1f6f66; --above-bg:#dff2ee; --std:#1F497D; --std-bg:#e3ecf7; --notstd:#a3322a; --notstd-bg:#f9e2df;
    --amber:#8a5a00; --amber-bg:#fff2cc; --shadow:0 8px 24px rgba(28,43,58,.07);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--ink);font-size:14px;}
  header{background:var(--paper);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5;}
  header img{height:38px;}
  .mast{flex:1;min-width:220px;}
  .eyebrow{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.66rem;color:var(--navy);margin:0;}
  h1{margin:2px 0 0;font-size:1.35rem;color:var(--navy-deep);}
  .tools{display:flex;gap:8px;flex-wrap:wrap;}
  button{font-family:inherit;}
  .btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.82rem;color:var(--navy-deep);cursor:pointer;}
  .btn:hover{border-color:var(--navy);}
  .btn.primary{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff;}
  main{max-width:1180px;margin:0 auto;padding:18px 16px 70px;}
  #health{display:none;background:var(--notstd-bg);color:var(--notstd);border:1px solid #e9b8b2;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:.86rem;}
  #status{font-size:.8rem;color:var(--sub);min-height:1.2em;margin:0 0 8px;}
  .group{margin:0 0 26px;}
  .group h2{font-size:1rem;color:var(--navy-deep);margin:0 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .group h2 small{font-weight:600;color:var(--sub);font-size:.8rem;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin:0 0 12px;}
  .card.withdrawn{opacity:.6;}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;}
  .name{font-weight:800;font-size:1.02rem;}
  .chip{font-size:.66rem;font-weight:800;letter-spacing:.08em;padding:3px 9px;border-radius:999px;}
  .tk-above{background:var(--above-bg);color:var(--above);} .tk-std{background:var(--std-bg);color:var(--std);}
  .tk-notstd{background:var(--notstd-bg);color:var(--notstd);} .tk-none{background:var(--soft);color:var(--sub);}
  .pf{background:var(--notstd);color:#fff;}
  .rowl{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:start;margin:6px 0;}
  .rowl > .lab{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);padding-top:7px;}
  .badges{display:flex;flex-wrap:wrap;gap:6px;}
  .b{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:5px 9px;font-size:.78rem;font-weight:700;color:var(--ink);cursor:pointer;min-width:74px;text-align:left;line-height:1.25;}
  .b small{display:block;font-size:.66rem;font-weight:700;color:var(--sub);letter-spacing:.02em;}
  .b small .lv{font-weight:800;color:var(--navy);} .b small .lv.swap{color:var(--teal-deep);}
  .b.ABOVE{background:var(--above-bg);border-color:#b9e0d8;color:var(--above);} .b.STD{background:var(--std-bg);border-color:#c3d4ea;color:var(--std);}
  .b.NOTSTD{background:var(--notstd-bg);border-color:#efc2bc;color:var(--notstd);}
  .b.PASS,.b.RES,.b.GIVEN{background:var(--above-bg);border-color:#b9e0d8;color:var(--above);}
  .b.FAIL{background:var(--notstd-bg);border-color:#efc2bc;color:var(--notstd);} .b.FAILRES{background:var(--amber-bg);border-color:#ecd28c;color:var(--amber);}
  .dm{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;color:var(--sub);margin-top:3px;cursor:pointer;}
  .assign{display:flex;flex-direction:column;}
  .inline{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .inline input[type=text]{font-family:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:8px;padding:5px 8px;width:150px;}
  .notes{margin:10px 0 0;padding:0;list-style:none;font-size:.82rem;}
  .notes li{padding:4px 0 4px 12px;border-left:3px solid var(--line);margin:3px 0;color:var(--sub);}
  .notes li.red{border-color:var(--notstd);color:var(--notstd);} .notes li.amber{border-color:#d9a400;color:var(--amber);} .notes li.blue{border-color:var(--navy);color:var(--navy-deep);}
  /* the TP grid: three grades by seven aims, one tap saves both */
  #pop{display:none;position:fixed;z-index:20;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(28,43,58,.22);padding:12px;max-width:96vw;}
  #pop h3{margin:0 0 8px;font-size:.9rem;color:var(--navy-deep);}
  #pop table{border-collapse:collapse;}
  #pop th{font-size:.64rem;color:var(--sub);font-weight:800;padding:2px 4px;text-align:center;}
  #pop th.rh{text-align:right;padding-right:8px;}
  #pop td{padding:2px;}
  #pop td button{width:44px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-size:.66rem;font-weight:800;}
  #pop tr.ABOVE td button:hover,#pop tr.ABOVE td button.on{background:var(--above-bg);border-color:var(--above);}
  #pop tr.STD td button:hover,#pop tr.STD td button.on{background:var(--std-bg);border-color:var(--std);}
  #pop tr.NOTSTD td button:hover,#pop tr.NOTSTD td button.on{background:var(--notstd-bg);border-color:var(--notstd);}
  #pop .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;}
  #pop .foot small{color:var(--sub);font-size:.72rem;}
  details.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:20px 0 0;}
  details.panel summary{font-weight:800;color:var(--navy-deep);cursor:pointer;}
  details.panel textarea{width:100%;min-height:110px;font-family:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:8px;padding:8px;}
  details.panel input{font-family:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:8px;padding:6px 8px;}
  .credit{position:fixed;right:12px;bottom:10px;background:#9fc7c1;color:#fff;font-size:.62rem;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:999px;}
  @media (max-width:640px){ header{position:static;} .rowl{grid-template-columns:1fr;} .rowl > .lab{padding-top:0;} #pop td button{width:36px;} }
</style>
</head>
<body>
<header>
  <img src="__LOGO__" alt="International House Istanbul">
  <div class="mast"><p class="eyebrow">IH Istanbul · CELTA · Trainers only</p><h1 id="title">Candidate Tracker</h1></div>
  <div class="tools"><button class="btn" id="copy">Copy summary</button><button class="btn" id="reload">Reload</button></div>
</header>
<main>
  <div id="health"></div>
  <div id="status">Loading…</div>
  <div id="groups"></div>
  <details class="panel" id="newcourse">
    <summary>Groups and candidates</summary>
    <div id="rosterList" style="margin:10px 0;font-size:.86rem;color:var(--sub);"></div>
    <p style="font-size:.86rem;color:var(--sub);margin:12px 0 6px;"><b>Start a new course.</b> Paste two columns from Sheets or Excel: group, then candidate. This clears every grade on the current course.</p>
    <textarea id="paste" placeholder="ABC	Billur Manav&#10;ABC	Iris Ersoy&#10;DEF	Koray Yeşilyayla"></textarea>
    <div id="preview" style="font-size:.82rem;color:var(--sub);margin:6px 0;"></div>
    <div class="inline" style="margin-top:6px;">
      <label style="font-size:.82rem;">New course code <input id="newCode" placeholder="C19/2026"></label>
      <label style="font-size:.82rem;">Type the current code to confirm <input id="confirmCode"></label>
      <button class="btn primary" id="startNew">Start the new course</button>
    </div>
  </details>
</main>
<div id="pop"></div>
<div class="credit">designed and built by Ramy</div>

<script>
/* ---- the C/17 tracker's rules, as Connect Lite's hub-tracker.js holds them
   (ported line for line there on 20 Sep 2026; Handbook 10.2, 11.6, 15.1,
   CELTA 5 p22). Only the facts' source differs: here they are the cells. ---- */
var ASSIGNMENTS = ['FOL', 'LRT', 'SRT', 'LFC'];
var SHOW_AS = { SRT:'LSRT', FOL:'FOL', LRT:'LRT', LFC:'LFC' };
var TP_GRADES = [ { key:'ABOVE', label:'Above standard', short:'AS' }, { key:'STD', label:'To standard', short:'S' }, { key:'NOTSTD', label:'Not to standard', short:'NS' } ];
var LEGACY = { S:'STD', 'S+':'STD', AS:'ABOVE' };
var AIMS = [ { key:'Grammar', short:'GR' }, { key:'Lexis', short:'LEX' }, { key:'Functional language', short:'FL' }, { key:'Reading', short:'R' }, { key:'Listening', short:'L' }, { key:'Speaking', short:'SP' }, { key:'Writing', short:'WR' } ];
var ASSIGN_CYCLE = ['', 'PASS', 'FAILRES', 'RES', 'FAIL'];
var ASSIGN_LABEL = { '':'–', PASS:'PASS', FAILRES:'FAIL · resub pending', RES:'PASS on RES', FAIL:'FAIL' };
var GIVEN_CYCLE = ['', 'GIVEN'], GIVEN_LABEL = { '':'–', GIVEN:'Record completed' };
var STAGE2_CYCLE = ['', 'NOTSTD', 'STD', 'ABOVE'], STAGE2_LABEL = { '':'–', NOTSTD:'Not to standard', STD:'To standard', ABOVE:'Above standard' };
var STAGES = [ { field:'stage1', label:'Stage 1', cycle:GIVEN_CYCLE, labels:GIVEN_LABEL }, { field:'stage2', label:'Stage 2', cycle:STAGE2_CYCLE, labels:STAGE2_LABEL }, { field:'stage3', label:'Stage 3', cycle:STAGE2_CYCLE, labels:STAGE2_LABEL } ];
var CFG = { course:'', levels:{first:'',second:''}, secondHalfFrom:5, tpTotal:8 };

function tpKey(v){ v = String(v || ''); return LEGACY[v] || v; }
function tpGrade(v){ v = tpKey(v); for (var i = 0; i < TP_GRADES.length; i++) if (TP_GRADES[i].key === v) return TP_GRADES[i]; return null; }
function aimShort(k){ for (var i = 0; i < AIMS.length; i++) if (AIMS[i].key === k) return AIMS[i].short; return ''; }
function tpTotal(){ return CFG.tpTotal || 8; }
function stageBands(n){ n = n || tpTotal(); var s1End = Math.max(1, Math.floor(n / 3)); var s3Start = Math.max(s1End + 1, n - Math.ceil(n / 3) + 1); return { s1End:s1End, s3Start:s3Start, total:n }; }
function secondHalfFrom(){ return CFG.secondHalfFrom || (Math.floor(tpTotal() / 2) + 1); }
function levelAt(tp){ return tp >= secondHalfFrom() ? CFG.levels.second : CFG.levels.first; }

function readCandidate(c){
  var latest = null, latestN = 0, graded = 0, notStd = 0, above = 0, notStdAt = [], run = 0, backToBack = null;
  for (var k = 1; k <= tpTotal(); k++) {
    var g = tpGrade(c['tp'+k]);
    if (!g) continue;
    graded++; latest = g; latestN = k;
    if (g.key === 'NOTSTD') { notStd++; notStdAt.push(k); run++; if (run >= 2 && !backToBack) backToBack = [k-1, k]; } else { run = 0; }
    if (g.key === 'ABOVE') above++;
  }
  var fails = [], resubs = [], pending = [];
  ASSIGNMENTS.forEach(function(code){ var v = c[code.toLowerCase()+'_r'] || ''; if (v === 'FAIL') fails.push(SHOW_AS[code]); else if (v === 'FAILRES') pending.push(SHOW_AS[code]); else if (v === 'RES') resubs.push(SHOW_AS[code]); });
  var ceiling = fails.length > 1 ? fails.join(', ') + ' failed — not eligible for a Pass (11.6)'
    : fails.length === 1 ? fails[0] + ' failed — a Pass is still open on other evidence, but not Pass A (11.6)' : null;
  var standard = null, from = '';
  if (c.stage3) { standard = c.stage3; from = 'Stage 3'; }
  else if (c.stage2) { standard = c.stage2; from = 'Stage 2'; }
  else if (latest) { standard = latest.key; from = 'TP' + latestN; }
  var failWhy = [];
  if (standard === 'NOTSTD' && from.indexOf('Stage') === 0) failWhy.push(from + ' not to standard');
  if (fails.length > 1) failWhy.push(fails.join(' and ') + ' failed — not eligible for a Pass (11.6)');
  var potentialFail = failWhy.length > 0;
  var watch = (backToBack && backToBack[1] >= secondHalfFrom() && !potentialFail)
    ? 'TP' + backToBack[0] + ' and TP' + backToBack[1] + ' not to standard back to back — worth a look (the centre\'s own signal, not a Cambridge rule)' : null;
  var letterIssued = !!(c.failLetter && String(c.failLetter).trim());
  var letterDue = potentialFail && !letterIssued;
  var lessonsLeft = tpTotal() - graded;
  if (letterDue) failWhy.push('no Fail letter issued · ' + (lessonsLeft <= 0 ? 'no lessons left to teach' : lessonsLeft + ' lesson' + (lessonsLeft === 1 ? '' : 's') + ' left to teach') + ' — 10.2: one should be issued, ideally with at least two lessons left');
  var lateNotStd = notStdAt.filter(function(k){ return k >= secondHalfFrom(); });
  var lateOnlyStd = [];
  if (c.stage2 === 'ABOVE') for (var k2 = secondHalfFrom(); k2 <= tpTotal(); k2++) { var g2 = tpGrade(c['tp'+k2]); if (g2 && g2.key === 'STD') lateOnlyStd.push(k2); }
  var stage3Why = null;
  if (!c.stage3) {
    if (c.stage2 === 'NOTSTD') stage3Why = 'not to standard at Stage 2';
    else if (c.stage2 === 'ABOVE' && lateOnlyStd.length && !lateNotStd.length && !fails.length) stage3Why = 'above standard at Stage 2, then TP' + lateOnlyStd.join(' and TP') + ' only to standard — progress not maintained';
    else if (c.stage2 && lateNotStd.length) stage3Why = (c.stage2 === 'ABOVE' ? 'above standard' : 'to standard') + ' at Stage 2, then TP' + lateNotStd.join(' and TP') + ' not to standard';
  }
  var bands = stageBands();
  var stage1Due = (graded >= bands.s1End && !c.stage1);
  var stage2Due = (graded >= secondHalfFrom() - 1 && !c.stage2);
  var recorded = graded > 0 || fails.length > 0 || resubs.length > 0 || !!c.stage2 || !!c.stage3;
  var withdrawnFlag = c.withdrawn === 'TRUE';
  var state = withdrawnFlag ? 'withdrawn' : !recorded ? 'none' : standard === 'NOTSTD' ? 'notstd' : standard === 'ABOVE' ? 'above' : standard === 'STD' ? 'std' : 'none';
  return { state:state, from:from, graded:graded, fails:fails, resubs:resubs, pending:pending, ceiling:ceiling, potentialFail:potentialFail, failWhy:failWhy,
    letterDue:letterDue, letterIssued:letterIssued, watch:watch, lessonsLeft:lessonsLeft, stage3Why:stage3Why, stage1Due:stage1Due, stage2Due:stage2Due };
}
var STATE_CHIP = { withdrawn:{text:'WITHDRAWN',cls:'tk-none'}, notstd:{text:'NOT TO STANDARD',cls:'tk-notstd'}, std:{text:'TO STANDARD',cls:'tk-std'}, above:{text:'ABOVE STANDARD',cls:'tk-above'}, none:{text:'NOT STARTED',cls:'tk-none'} };

/* ---- the page ---- */
var ROSTER = [], ROWS = {};
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function rec(id){ return ROWS[id] || (ROWS[id] = { id:id }); }
function status(t){ document.getElementById('status').textContent = t || ''; }
function run(fn, args, ok, bad){
  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ (bad || showErr)(e); });
  r[fn].apply(r, args || []);
}
function showErr(e){
  var m = String(e && e.message || e);
  status(/STALE_ROSTER/.test(m) ? 'The list of candidates changed in another tab. Reloading…' : 'Not saved: ' + m);
  if (/STALE_ROSTER/.test(m)) load();
}

function load(){
  status('Loading…');
  run('getData', [], function(d){
    CFG = d.config; ROSTER = d.roster; ROWS = d.rows || {};
    document.getElementById('title').textContent = CFG.course + ' Candidate Tracker';
    document.title = CFG.course + ' Candidate Tracker';
    renderHealth(d.health); render(); status('');
  });
}

function renderHealth(h){
  var box = document.getElementById('health'), lines = [];
  (h && h.orphans || []).forEach(function(id){ lines.push('A row in the sheet belongs to nobody: <b>' + esc(id) + '</b> (usually a candidate who was renamed in the sheet).'); });
  (h && h.bad || []).forEach(function(b){ lines.push('<b>' + esc(b.name) + '</b>: ' + esc(b.field) + ' holds “' + esc(b.value) + '”, which is not one of the tracker’s codes.'); });
  box.style.display = lines.length ? 'block' : 'none';
  box.innerHTML = lines.length ? '<b>Something in the sheet does not match the tracker.</b><br>' + lines.join('<br>') : '';
}

function groups(){
  var order = [], by = {};
  ROSTER.forEach(function(c){ if (!by[c.group]) { by[c.group] = []; order.push(c.group); } by[c.group].push(c); });
  return order.map(function(g){ return { name:g, list:by[g] }; });
}

function tpBadge(c, r, n){
  var g = tpGrade(r['tp'+n]), aim = r['tp'+n+'_aim'] || '';
  var lv = levelAt(n), swap = n === secondHalfFrom();
  return '<button class="b ' + (g ? g.key : '') + '" data-tp="' + n + '" data-id="' + esc(c.id) + '" title="' + esc((g ? g.label : 'Not yet graded') + (aim ? ' · ' + aim : '')) + '">'
    + 'TP' + n + (g ? ' · ' + g.short : '') + '<small><span class="lv' + (swap ? ' swap' : '') + '">' + esc(lv) + '</span>' + (aim ? ' · ' + esc(aimShort(aim)) : '') + '</small></button>';
}

function card(c){
  var r = rec(c.id), a = readCandidate(r), chip = STATE_CHIP[a.state];
  var h = '<div class="card' + (a.state === 'withdrawn' ? ' withdrawn' : '') + '">';
  h += '<div class="top"><span class="name">' + esc(c.name) + '</span><span class="chip ' + chip.cls + '">' + chip.text + (a.from && a.state !== 'none' && a.state !== 'withdrawn' ? ' · ' + esc(a.from) : '') + '</span>'
    + (a.potentialFail ? '<span class="chip pf">POTENTIAL FAIL</span>' : '') + '</div>';
  h += '<div class="rowl"><div class="lab">Stages</div><div class="badges">' + STAGES.map(function(s){
      var v = r[s.field] || ''; return '<button class="b ' + esc(v) + '" data-cycle="' + s.field + '" data-id="' + esc(c.id) + '">' + s.label + '<small>' + esc(s.labels[v] || v) + '</small></button>';
    }).join('') + '</div></div>';
  var tps = ''; for (var n = 1; n <= tpTotal(); n++) tps += tpBadge(c, r, n);
  h += '<div class="rowl"><div class="lab">Teaching practice</div><div class="badges">' + tps + '</div></div>';
  h += '<div class="rowl"><div class="lab">Assignments</div><div class="badges">' + ASSIGNMENTS.map(function(code){
      var lc = code.toLowerCase(), v = r[lc+'_r'] || '', dm = r[lc+'_dm'] === 'TRUE';
      return '<div class="assign"><button class="b ' + esc(v) + '" data-assign="' + lc + '" data-id="' + esc(c.id) + '">' + SHOW_AS[code] + '<small>' + esc(ASSIGN_LABEL[v] || v) + '</small></button>'
        + '<label class="dm"><input type="checkbox" data-dm="' + lc + '" data-id="' + esc(c.id) + '"' + (dm ? ' checked' : '') + '> double marked</label></div>';
    }).join('') + '</div></div>';
  h += '<div class="rowl"><div class="lab">Fail letter</div><div class="inline"><input type="text" data-text="failLetter" data-id="' + esc(c.id) + '" value="' + esc(r.failLetter || '') + '" placeholder="date issued">'
    + '<label class="dm" style="margin:0;"><input type="checkbox" data-withdrawn="1" data-id="' + esc(c.id) + '"' + (r.withdrawn === 'TRUE' ? ' checked' : '') + '> withdrawn</label></div></div>';
  var notes = [];
  a.failWhy.forEach(function(t){ notes.push(['red', t]); });
  if (a.ceiling && a.fails.length === 1) notes.push(['amber', a.ceiling]);
  if (a.stage3Why) notes.push(['amber', 'Stage 3 required — ' + a.stage3Why]);
  if (a.stage1Due) notes.push(['blue', 'Stage 1 is due (the first third of the course)']);
  if (a.stage2Due) notes.push(['blue', 'Stage 2 is due (the halfway point)']);
  if (a.pending.length) notes.push(['amber', a.pending.join(', ') + ' — resubmission pending']);
  if (a.watch) notes.push(['blue', a.watch]);
  if (notes.length) h += '<ul class="notes">' + notes.map(function(n){ return '<li class="' + n[0] + '">' + esc(n[1]) + '</li>'; }).join('') + '</ul>';
  return h + '</div>';
}

function render(){
  var lv = CFG.levels.first === CFG.levels.second ? CFG.levels.first : 'TP1–' + (secondHalfFrom() - 1) + ' ' + CFG.levels.first + ' · TP' + secondHalfFrom() + '–' + tpTotal() + ' ' + CFG.levels.second;
  document.getElementById('groups').innerHTML = groups().map(function(g){
    return '<section class="group"><h2>Group ' + esc(g.name) + ' <small>' + esc(lv) + ' · ' + g.list.length + ' candidate' + (g.list.length === 1 ? '' : 's') + '</small></h2>' + g.list.map(card).join('') + '</section>';
  }).join('') || '<p>No candidates yet — add them under “Groups and candidates” below.</p>';
  document.getElementById('rosterList').innerHTML = groups().map(function(g){ return '<b>' + esc(g.name) + '</b>: ' + g.list.map(function(c){ return esc(c.name); }).join(', '); }).join('<br>');
}

function save(id, field, value){
  var r = rec(id), before = r[field];
  r[field] = value; render(); status('Saving…');
  run('saveField', [id, field, value], function(back){ ROWS[id] = back; render(); status('Saved'); setTimeout(function(){ status(''); }, 1500); },
    function(e){ r[field] = before; render(); showErr(e); });
}
function saveTP(id, n, grade, aim){
  var r = rec(id), b1 = r['tp'+n], b2 = r['tp'+n+'_aim'];
  r['tp'+n] = grade; r['tp'+n+'_aim'] = aim; render(); status('Saving…');
  run('saveField', [id, 'tp'+n, grade], function(){
    run('saveField', [id, 'tp'+n+'_aim', aim], function(back){ ROWS[id] = back; render(); status('Saved'); setTimeout(function(){ status(''); }, 1500); },
      function(e){ r['tp'+n+'_aim'] = b2; render(); showErr(e); });
  }, function(e){ r['tp'+n] = b1; r['tp'+n+'_aim'] = b2; render(); showErr(e); });
}

/* The TP grid: three grade rows by seven aim columns; one tap saves both. */
function openGrid(btn){
  var id = btn.getAttribute('data-id'), n = +btn.getAttribute('data-tp'), r = rec(id), cur = tpKey(r['tp'+n]), curAim = r['tp'+n+'_aim'] || '';
  var c = ROSTER.filter(function(x){ return x.id === id; })[0];
  var pop = document.getElementById('pop');
  var notYet = [];
  for (var k = 1; k <= tpTotal(); k++) if (!tpGrade(r['tp'+k])) notYet.push('TP' + k);
  pop.innerHTML = '<h3>' + esc(c.name) + ' · TP' + n + ' · ' + esc(levelAt(n)) + '</h3><table><tr><th></th>' + AIMS.map(function(a){ return '<th title="' + esc(a.key) + '">' + a.short + '</th>'; }).join('') + '</tr>'
    + TP_GRADES.map(function(g){ return '<tr class="' + g.key + '"><th class="rh">' + g.label + '</th>' + AIMS.map(function(a){
        return '<td><button data-g="' + g.key + '" data-a="' + esc(a.key) + '" class="' + (cur === g.key && curAim === a.key ? 'on' : '') + '" title="' + esc(g.label + ' · ' + a.key) + '">' + g.short + '</button></td>'; }).join('') + '</tr>'; }).join('')
    + '</table><div class="foot"><small>' + (notYet.length ? 'Not yet taught: ' + notYet.join(', ') : 'Every TP graded') + '</small><span><button class="btn" data-clear="1">Clear</button> <button class="btn" data-close="1">Close</button></span></div>';
  var rc = btn.getBoundingClientRect();
  pop.style.display = 'block';
  var w = pop.offsetWidth, hgt = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(rc.left, innerWidth - w - 8)) + 'px';
  pop.style.top = Math.max(8, (rc.bottom + hgt + 8 < innerHeight ? rc.bottom + 6 : rc.top - hgt - 6)) + 'px';
  pop.onclick = function(e){
    var t = e.target;
    if (t.getAttribute('data-g')) { closeGrid(); saveTP(id, n, t.getAttribute('data-g'), t.getAttribute('data-a')); }
    else if (t.getAttribute('data-clear')) { closeGrid(); saveTP(id, n, '', ''); }
    else if (t.getAttribute('data-close')) closeGrid();
  };
}
function closeGrid(){ document.getElementById('pop').style.display = 'none'; }

document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('button,input') : e.target;
  if (!t) { if (!e.target.closest || !e.target.closest('#pop')) closeGrid(); return; }
  if (t.closest && t.closest('#pop')) return;
  var id = t.getAttribute('data-id');
  if (t.getAttribute('data-tp')) { openGrid(t); return; }
  closeGrid();
  if (t.getAttribute('data-cycle')) {
    var f = t.getAttribute('data-cycle'), s = STAGES.filter(function(x){ return x.field === f; })[0], v = rec(id)[f] || '';
    save(id, f, s.cycle[(s.cycle.indexOf(v) + 1) % s.cycle.length]);
  } else if (t.getAttribute('data-assign')) {
    var lc = t.getAttribute('data-assign'), v2 = rec(id)[lc+'_r'] || '';
    save(id, lc + '_r', ASSIGN_CYCLE[(ASSIGN_CYCLE.indexOf(v2) + 1) % ASSIGN_CYCLE.length]);
  } else if (t.getAttribute('data-dm')) {
    save(id, t.getAttribute('data-dm') + '_dm', t.checked ? 'TRUE' : 'FALSE');
  } else if (t.getAttribute('data-withdrawn')) {
    save(id, 'withdrawn', t.checked ? 'TRUE' : 'FALSE');
  }
});
document.addEventListener('change', function(e){
  var t = e.target; if (t.getAttribute && t.getAttribute('data-text')) save(t.getAttribute('data-id'), t.getAttribute('data-text'), t.value.trim());
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeGrid(); });

function summary(){
  var out = [CFG.course + ' Candidate Tracker — ' + new Date().toLocaleDateString('en-GB')];
  groups().forEach(function(g){
    out.push('', 'GROUP ' + g.name);
    g.list.forEach(function(c){
      var r = rec(c.id), a = readCandidate(r);
      out.push('', c.name + ' — ' + STATE_CHIP[a.state].text + (a.from ? ' (' + a.from + ')' : '') + (a.potentialFail ? ' — POTENTIAL FAIL' : ''));
      var tps = []; for (var n = 1; n <= tpTotal(); n++) { var gr = tpGrade(r['tp'+n]); if (gr) tps.push('TP' + n + ' ' + gr.short + (r['tp'+n+'_aim'] ? ' (' + r['tp'+n+'_aim'] + ')' : '')); }
      out.push('  TP: ' + (tps.join(', ') || 'none graded yet'));
      out.push('  Stages: ' + STAGES.map(function(s){ return s.label + ' ' + (s.labels[r[s.field] || ''] || '–'); }).join(' · '));
      out.push('  Assignments: ' + ASSIGNMENTS.map(function(code){ var lc = code.toLowerCase(); return SHOW_AS[code] + ' ' + (ASSIGN_LABEL[r[lc+'_r'] || ''] || '–') + (r[lc+'_dm'] === 'TRUE' ? ' (double marked)' : ''); }).join(' · '));
      a.failWhy.concat(a.stage3Why ? ['Stage 3 required — ' + a.stage3Why] : []).forEach(function(t){ out.push('  ! ' + t); });
    });
  });
  return out.join('\n');
}
document.getElementById('copy').onclick = function(){
  var text = summary(), b = this;
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function(){ b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy summary'; }, 1500); },
    function(){ var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); b.textContent = 'Copied'; });
};
document.getElementById('reload').onclick = load;

/* Start a new course */
function parse(text){
  return String(text || '').split(/\r?\n/).map(function(l){ if (!l.trim()) return null; var cs = (l.indexOf('\t') >= 0 ? l.split('\t') : l.split(',')).map(function(x){ return x.trim(); });
    if (cs.length < 2 || !cs[0] || !cs[1]) return null; if (/^group$/i.test(cs[0])) return null; return [cs[0], cs[1]]; }).filter(Boolean);
}
document.getElementById('paste').oninput = function(){
  var rows = parse(this.value), by = {};
  rows.forEach(function(r){ by[r[0]] = (by[r[0]] || 0) + 1; });
  document.getElementById('preview').textContent = rows.length ? Object.keys(by).map(function(g){ return 'Group ' + g + ': ' + by[g]; }).join(' · ') + ' — ' + rows.length + ' candidates' : '';
};
document.getElementById('startNew').onclick = function(){
  var rows = document.getElementById('paste').value, code = document.getElementById('newCode').value.trim(), conf = document.getElementById('confirmCode').value.trim();
  if (conf !== CFG.course) { status('Type the current course code, ' + CFG.course + ', to confirm.'); return; }
  if (!code) { status('Give the new course a code.'); return; }
  status('Starting the new course…');
  run('startNewCourse', [conf, code, rows], function(d){ CFG = d.config; ROSTER = d.roster; ROWS = d.rows || {}; document.getElementById('title').textContent = CFG.course + ' Candidate Tracker'; render(); renderHealth(d.health); status('New course started.'); document.getElementById('newcourse').open = false; });
};

load();
</script>
