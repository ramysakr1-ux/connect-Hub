<html lang="en">
<head>

<title>Connect Lite — Mark assignment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Karla:wght@400;500;600;700&family=Instrument+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202611261523">
<style>
  *{box-sizing:border-box;}
  a{color:var(--teal);} a:hover{color:oklch(30% 0.06 195);}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:32px 16px 80px; display:flex; justify-content:center;}
  .board{max-width:var(--doc-width, 1120px); width:100%;}
  /* ---- the front page on top, the whole assignment below (18 Oct 2026) ----
     Ramy: "follow the example from C18... the front page on top where the
     trainer double marks, they make their comments, met, not met... then
     collapsibles for all that part on the right... and the whole page will be
     the assignment." The criteria stay with you as a thin bar (hub-marking.js). */
  .mk-cover{display:grid; grid-template-columns:minmax(0,1fr); gap:14px; margin:0 0 14px;}
  .mk-cover > .card{margin-bottom:0;}
  .mk-work > .card{margin-bottom:14px;}
  .mk-help{margin:0 0 14px;}
  .mk-cgrid{display:block;} .mk-mh{font-family:'Newsreader',Georgia,serif; font-size:1rem; margin:14px 0 6px;}
  .mk-mrow{display:grid; grid-template-columns:1fr 1fr; gap:10px;} .mk-mrow .row{margin:0 !important;} .mk-mrow input{width:100%; box-sizing:border-box;}
  .mk-markers{margin-top:6px; padding-top:4px; border-top:1px solid var(--sand-line);}
  @media (max-width:560px){ .mk-mrow{grid-template-columns:1fr;} }
  #mkCrit{scroll-margin-top:64px;}
  /* the assignment's color: the heading band, the section labels, the picker */
  .mk-head{border-top:4px solid var(--as, var(--teal)) !important; background:color-mix(in oklab, var(--as, var(--teal)) 7%, var(--surface)) !important;}
  .mk-head h1{color:var(--as, var(--teal)) !important;}
  .mk-head .eyebrow{color:var(--as, var(--teal)) !important;}
  .mk-head{text-align:left !important; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 24px; align-items:start; padding:18px 24px 16px !important;}
  .mk-head h1{font-size:1.7rem !important; text-align:left !important; margin:2px 0 0 !important;}
  .mk-head .eyebrow{text-align:left !important; margin:0 !important;}
  .mk-hmeta{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:8px 0 0;}
  .mk-who{margin:0; font-family:'Newsreader',Georgia,serif; font-size:1.15rem; color:var(--ink);}
  .mk-head .stage-pill{margin-top:0;}
  .mk-head .duerow{display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap; background:none !important; border:none !important; padding:0 !important; margin:10px 0 0 !important;}
  .mk-head .duerow .dueline{flex:none; min-width:0; font-size:0.86rem; font-weight:600;}
  .mk-head .duerow .dueacts{display:flex; align-items:center; gap:6px; flex-wrap:wrap;} .mk-head .duerow input{font-size:0.8rem; padding:5px 8px; max-width:190px;} .mk-head .duerow .btn{padding:6px 12px; font-size:0.78rem;}
  .mk-hside{text-align:right; font-size:0.8rem; color:var(--grey); padding-top:2px;}
  .mk-a5 button{background:none; border:none; padding:0; font:600 0.8rem 'Karla',sans-serif; color:var(--teal); text-decoration:underline; text-decoration-color:var(--sand-line); text-underline-offset:3px; cursor:pointer;} .mk-a5 button:hover{background:none !important; box-shadow:none !important; text-decoration-color:var(--teal);}
  @media (max-width:760px){ .mk-head{grid-template-columns:1fr;} .mk-hside{text-align:left;} .mk-head h1{font-size:1.45rem !important;} }
  body[class*="as-"] .picker button.active{background:var(--as); border-color:var(--as);}
  body[class*="as-"] .roundlabel{color:var(--as);}
  .mk-round > h2{color:var(--as, var(--ink));}
  #mkPanel [hidden]{display:none !important;} .mk-linked:empty{display:none;}
  #mkCrit .actions{flex-wrap:wrap;} #mkCrit .actions .btn{flex:1 1 auto;}
  .mk-pair{display:grid; grid-template-columns:1fr; gap:8px; margin:0 0 6px;}
  @media (min-width:1280px){ .mk-pair{grid-template-columns:1fr 1fr;} }
  .mk-pl{font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--grey); margin:0 0 4px;}
  .mk-r2 .mk-pl{color:var(--gold-deep);}
  .mk-r2 .readonly{background:var(--gold-wash); border-color:var(--amber-edge);}
  .mk-pair.same .mk-r2 .readonly{background:var(--field); border-color:var(--sand-line); color:var(--grey);}
  .mk-compare del{text-decoration:line-through; text-decoration-color:oklch(55% 0.12 27 / .7); color:var(--grey); background:color-mix(in oklab, var(--brick) 6%, transparent);}
  .mk-compare ins{text-decoration:underline; text-decoration-color:var(--gold); text-decoration-thickness:2px; text-underline-offset:3px; background:color-mix(in oklab, var(--gold-lifted) 22%, transparent);}
  .mk-carried{margin:0 0 10px; font-size:0.84rem;} .mk-carried summary{cursor:pointer; color:var(--mark-met-text); font-weight:600; padding:4px 0;}
  .mk-resub{background:var(--gold-wash); border-left-color:var(--amber-edge);}
  .mk-resub > h2{color:var(--gold-deep);}
  .mk-addnote, .mk-tiplink{align-self:flex-start; background:none; border:none; padding:2px 0; margin:6px 14px 0 0; font:600 0.8rem 'Karla',sans-serif; color:var(--teal); text-decoration:underline; text-decoration-color:var(--sand-line); text-underline-offset:3px; cursor:pointer;}
  .mk-addnote:hover, .mk-tiplink:hover{background:none !important; box-shadow:none !important; text-decoration-color:var(--teal);}
  .mk-how{font-size:0.86rem; line-height:1.55; color:var(--ink); margin:0 0 12px;}
  .mk-n{display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; margin-right:8px; border-radius:10px; background:var(--sand-deep); color:var(--ink); font-size:0.72rem; font-weight:700; vertical-align:1px;}
  .mk-amber{background:var(--gold-wash); border:1px solid var(--amber-edge); border-radius:var(--r-strip); padding:8px 11px; color:var(--ink);}
  body.hub-paper{padding-bottom:84px;}
  .guide-box.g-link{margin:6px 0 0;}
  .guide-box.g-link:not([open]){background:none; border-color:transparent;}
  .guide-box.g-link:not([open]) > summary{padding:4px 26px 4px 0; font-size:0.82rem; text-decoration:underline; text-decoration-color:var(--sand-line); text-underline-offset:3px;}
  .guide-box.g-link:not([open]) > summary::after{right:8px; width:5px; height:5px;}
  .guide-box.g-link:not([open]){display:inline-block;}
  .mv2-seg{height:auto !important; padding:5px 0 !important; display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.15;}
  .mv2-seg small{font-size:10px; font-weight:600; opacity:.85;}
  @media (min-width:1080px){
    /* the whole screen (Ramy, 17 Oct 2026: "use the full width... we're almost using only half") */
    body.hub-assign.hub-paper .board{max-width:none;}
    body.hub-paper{padding-left:28px; padding-right:28px;}
    .board > #picker, .board > .back{max-width:none;}
    /* inside the front page: the criteria on the left, the decision on the right */
    .mk-cgrid{display:grid; grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr); gap:28px; align-items:start;}
    .mk-cright{position:sticky; top:70px;}
    /* the work runs the full width of the screen (Ramy, 18 Oct 2026) */
    body.hub-paper{padding-bottom:40px;}
  }
  @media print{ .mk-cover{display:block;} }
  .back{display:inline-block; margin-bottom:16px; font-size:0.85rem; font-weight:600; text-decoration:none;}
  .back:hover{text-decoration:underline;}
  .picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .picker button{font-family:'Karla',sans-serif; font-size:0.82rem; font-weight:600; padding:7px 14px; border-radius:16px;
    border:1.5px solid var(--sand-line); background:var(--card); color:var(--ink); cursor:pointer;}
  .picker button.active{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .header{background:var(--surface); border-radius:6px; margin-bottom:20px; border-top:2px solid var(--teal); padding:22px 26px;}
  .header h1{font-family:'Newsreader',Georgia,serif; font-size:1.6rem; margin:0;}
  .duerow{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:12px;
    padding:10px 14px; border-radius:6px; background:var(--box); border:1.5px solid var(--sand-line);}
  .duerow.past{background:oklch(96% 0.03 27); border-color:oklch(45% 0.15 27);}
  .duerow .dueline{flex:1; min-width:220px; font-size:0.84rem; font-weight:600; color:var(--ink-warm);}
  .duerow.past .dueline{color:oklch(45% 0.15 27);}
  .duerow .dueacts{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .duerow input{font-family:'Karla',sans-serif; font-size:0.82rem; padding:6px 10px;
    border:1.5px solid var(--sand-line); border-radius:6px; background:var(--field);}
  .stage-pill{display:inline-block; font-size:0.78rem; font-weight:700; padding:3px 10px; border-radius:10px; margin-top:8px;}
  .stage-pill.submitted{background:oklch(90% 0.05 260); color:oklch(40% 0.1 260);}
  .stage-pill.resubmitted{background:oklch(93% 0.06 60); color:oklch(40% 0.1 60);}
  .stage-pill.closed{background:oklch(93% 0.05 145); color:oklch(35% 0.08 145);}
  .stage-pill.draft{background:var(--sand-deep); color:var(--grey);}
  /* Gold edges the assignment card -- the same rule as the exchange card below and the trainee's screen. */
  .card{background:var(--surface); border-radius:6px; padding:18px 22px; margin-bottom:16px; border-left:5px solid var(--gold);}
  .card h2{font-family:'Newsreader',Georgia,serif; font-size:1.05rem; margin:0 0 8px;}
  .roundlabel{font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--teal); margin:0 0 6px;}
  .readonly{white-space:pre-wrap; font-size:0.88rem; line-height:1.6; background:var(--field); border:1.5px solid var(--sand-line); border-radius:6px; padding:10px 12px; margin-bottom:10px;}
  textarea, select, input[type=text]{width:100%; font-family:'Karla',sans-serif; font-size:0.9rem; padding:9px 12px; border:1.5px solid var(--sand-line);
    border-radius:6px; background:var(--box); color:var(--ink); line-height:1.55; resize:vertical;}
  .xchg{margin:14px 0 4px; padding:12px 14px; border:1.5px solid var(--gold); border-left-width:5px; border-radius:6px; background:var(--box);}
  .xchg-acts{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  #xText{width:100%; font-family:ui-monospace,Menlo,monospace; font-size:0.8rem; line-height:1.5; padding:10px 12px; border:1.5px solid var(--sand-line); border-radius:6px; background:var(--field);}
  .mats-open{display:inline-block; font-size:0.78rem; font-weight:700; padding:5px 12px; border-radius:16px;
    background:var(--teal); color:var(--paper); text-decoration:none;}
  .outcomes{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .outcomes button{font-family:'Karla',sans-serif; font-size:0.85rem; font-weight:600; padding:8px 16px; border-radius:16px;
    border:1.5px solid var(--sand-line); background:var(--card); cursor:pointer;}
  .outcomes button.active{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .critrow{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid var(--sand-line);}
  .critrow:last-child{border-bottom:none;}
  /* The marking guidance (17 Oct 2026): folded away until the tutor opens it. */
  .guide-top{margin:0 0 10px;}
  .trap-hit{margin:0 0 10px; padding:10px 13px; border-radius:var(--r-strip); background:var(--gold-wash); border:1px solid var(--amber-edge); border-left:4px solid var(--amber-edge); color:var(--ink); font-size:0.86rem; line-height:1.5;}
  .critrow .txt{font-size:0.87rem; line-height:1.5; flex:1;}
  .critline{display:flex; align-items:flex-start; justify-content:space-between; gap:14px;}
  /* A phone. The criterion was squeezed into a narrow column beside its pill
     and wrapped to four lines, and the pill itself was 26px tall -- half a
     thumb (Ramy, 24 Sep 2026). The pill drops under the text and becomes
     something you can actually hit, and the two buttons at the foot stop
     sharing a line and wrapping their own labels. */
  @media(max-width:560px){
    .critline{flex-direction:column; align-items:stretch; gap:8px;}
    .crit-toggle{width:100%; min-height:44px;}
    .mats-open{display:inline-flex; align-items:center; min-height:44px;}
    .actions{flex-direction:column; align-items:stretch; gap:8px;}
    .actions .btn{width:100%; min-height:46px;}
  }
  .crit-toggle{font-family:'Karla',sans-serif; font-size:0.78rem; font-weight:700; padding:5px 12px; border-radius:14px; border:1.5px solid var(--sand-line);
    background:var(--card); color:var(--grey); cursor:pointer; flex:none; white-space:nowrap;}
  .crit-toggle.met{background:var(--mark-met-bg); border-color:var(--mark-met-line); color:var(--mark-met-text);}
  .crit-toggle.not{background:var(--mark-not-bg); border-color:var(--mark-not-line); color:var(--mark-not-text);}
  .derived{font-size:0.9rem; font-weight:700; padding:8px 14px; border-radius:8px; margin:12px 0; display:inline-block;}
  .derived.pending{background:var(--sand-deep); color:var(--grey);}
  .derived.pass{background:var(--mark-met-bg); color:var(--mark-met-text);}
  .derived.fail{background:var(--mark-not-bg); color:var(--mark-not-text);}
  .row label{display:block; font-size:0.75rem; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
  /* Room between the two markers (Ramy, 28 Sep 2026: "second marker is
     squashed between first marker and the placeholder"). */
  .row + .row{margin-top:16px;}
  .actions{display:flex; justify-content:flex-end; gap:10px; margin-top:16px;}
  .btn{font-family:'Karla',sans-serif; font-size:0.88rem; font-weight:700; padding:10px 22px; border-radius:var(--r-control); border:none; cursor:pointer;}
  .btn-teal{background:var(--teal); color:var(--paper);}
  .btn-teal:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-sand{background:var(--sand-deep); color:var(--ink);}
  .note{font-size:0.8rem; color:var(--grey); margin:0 0 14px;}

  /* ---- v3 (7 Oct 2026): the tally strip ---- */
  .mv2{margin:4px 0 16px;}
  .mv2-segs{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:4px;}
  .mv2-seg{height:28px; padding:0; border-radius:6px; cursor:pointer; font:700 11px 'Karla',sans-serif;
    background:var(--box); border:1.5px solid var(--sand-line); color:var(--grey); transition:transform .15s ease, background-color .2s, border-color .2s;}
  .mv2-seg.met{background:var(--mark-met-bg); border-color:var(--mark-met-line); color:var(--mark-met-text);}
  .mv2-seg.not{background:var(--mark-not-bg); border-color:var(--mark-not-line); color:var(--mark-not-text);}
  .mv2-seg:hover{transform:translateY(-2px);}
  .mv2-seg:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
  .mv2-n{display:flex; gap:16px; flex-wrap:wrap; margin:10px 0 0; font-size:0.82rem; color:var(--grey);}
  .mv2-n b{font-family:'Newsreader',Georgia,serif; font-size:1.05rem; color:var(--ink); margin-right:3px;}
  .mv2-n .met b{color:var(--mark-met-text);} .mv2-n .not b{color:var(--mark-not-text);}
  .critrow.mv2-hit{animation:mv2-hit 1.4s ease-out 1; border-radius:8px;}
  @keyframes mv2-hit{0%{box-shadow:0 0 0 3px oklch(70% 0.12 72 / .7); background:var(--gold-wash);}100%{box-shadow:0 0 0 3px oklch(70% 0.12 72 / 0); background:transparent;}}
  @media(prefers-reduced-motion:reduce){ .mv2-seg{transition:none;} .critrow.mv2-hit{animation:none;} }
  @media print{ .mv2{display:none;} }
  /* Is it their own work? */
  .mk-h3{font-family:'Instrument Sans','Karla',sans-serif; font-weight:600; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--brick); margin:16px 0 6px;}
  .mk-match{border-top:1px solid var(--row-line); padding:10px 0; font-size:0.9rem; line-height:1.5;}
  .mk-match blockquote{margin:6px 0 0; padding:8px 12px; background:var(--sand); border-left:3px solid var(--sand-line); border-radius:0 8px 8px 0; font-size:0.88rem; color:var(--ink);}
  .mk-hit{display:flex; flex-direction:column; gap:2px; margin:8px 0 0 12px; font-size:0.86rem;} .mk-hit span{color:var(--grey);}
  .mk-attach, .mk-unflag{margin-top:6px; font-size:0.78rem !important; padding:5px 11px !important;} .mk-attach:disabled{opacity:.6; cursor:default;}
  .mk-flag blockquote{border-left-color:var(--a-red);} .mk-where{font-size:0.86rem; color:var(--grey); margin-top:6px;}
  .mk-pair{margin-top:8px;} .mk-pair .note{display:block; margin-top:4px;}
  .mk-same{color:var(--brick); font-weight:700;}

  /* ---- THE NEW LAYOUT: READ, MARK, RETURN (24 Nov 2026) ----
     Agreed with the course tutor on 23 Nov 2026 and drawn by renderNew. Everything here is under body.mkn or a
     class that starts .mkn-, so the layout tutors have used since October is not touched by a line of it.
     Forest is the bar and a mark of Met; the mustard is the one thing to do next, Return; the red is Not met.
     A status is always a word: the color only supports it. */
  body.mkn{padding:0 !important; display:block;}
  body.mkn .board{max-width:none !important; width:100%;}
  /* the old doors and the assignment picker are not part of this layout: the bar carries the way back */
  body.mkn .board > .back, body.mkn #picker{display:none !important;}
  .mkn-sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap;}
  body.mkn [hidden]{display:none !important;}
  /* the top bar */
  .mkn-bar{position:sticky; top:0; z-index:45; display:flex; align-items:center; flex-wrap:wrap; gap:8px 16px; padding:10px 28px; background:var(--a-forest); color:var(--paper);}
  .mkn-all{display:inline-flex; align-items:center; min-height:40px; padding:0 4px; color:var(--paper) !important; font-size:0.86rem; font-weight:700; text-decoration:none; white-space:nowrap;}
  .mkn-all:hover{text-decoration:underline; text-underline-offset:3px;}
  .mkn-avi{flex:none; display:inline-flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:50%; background:var(--paper); color:var(--a-forest); font-size:0.86rem; font-weight:700;}
  .mkn-who{min-width:0;}
  .mkn-name{margin:0; font-family:'Newsreader',Georgia,serif; font-size:1.3rem; font-weight:600; line-height:1.15; color:var(--paper);}
  .mkn-what{margin:1px 0 0; font-size:0.82rem; color:color-mix(in oklab, var(--paper) 80%, transparent);}
  .mkn-nav{display:inline-flex; align-items:center; gap:8px; font-size:0.82rem; font-weight:600; white-space:nowrap;}
  .mkn-go{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; padding:0; border-radius:50%; border:1.5px solid color-mix(in oklab, var(--paper) 45%, transparent); background:transparent; color:var(--paper); cursor:pointer;}
  .mkn-go:hover:not(:disabled){border-color:var(--paper); background:transparent !important; box-shadow:none !important;}
  .mkn-go:disabled{opacity:.35; cursor:default;}
  .mkn-gap{flex:1 1 0;}
  .mkn-steps{display:flex; align-items:center; gap:10px; list-style:none; margin:0; padding:0; font-size:0.86rem; font-weight:600;}
  .mkn-step{display:inline-flex; align-items:center; gap:8px; color:color-mix(in oklab, var(--paper) 62%, transparent); white-space:nowrap;}
  .mkn-step + .mkn-step::before{content:''; width:28px; height:1.5px; margin-right:2px; background:color-mix(in oklab, var(--paper) 38%, transparent);}
  .mkn-step i{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; border:1.5px solid currentColor; font-style:normal; font-size:0.78rem; font-weight:700;}
  .mkn-step b{font-weight:600;}
  .mkn-step.now{color:var(--paper);} .mkn-step.now i{background:var(--paper); border-color:var(--paper); color:var(--a-forest);}
  .mkn-step.done{color:var(--paper);} .mkn-step.done i{background:var(--a-mustard); border-color:var(--a-mustard); color:var(--ink);}
  .mkn-more{min-height:40px; padding:0 16px; border-radius:999px; border:1.5px solid color-mix(in oklab, var(--paper) 45%, transparent); background:transparent; color:var(--paper); font:700 0.86rem 'Karla',sans-serif; cursor:pointer;}
  .mkn-more:hover{border-color:var(--paper); background:transparent !important; box-shadow:none !important;}
  .mkn-return{min-height:44px; padding:0 24px; border-radius:999px; border:none; background:var(--a-mustard); color:var(--ink); font:700 0.95rem 'Karla',sans-serif; cursor:pointer; white-space:nowrap;}
  .mkn-return:hover:not(:disabled){background:color-mix(in oklab, var(--a-mustard) 88%, var(--paper)) !important; box-shadow:none !important;}
  .mkn-return:disabled{background:color-mix(in oklab, var(--paper) 16%, transparent); color:color-mix(in oklab, var(--paper) 72%, transparent); cursor:not-allowed;}
  .mkn-bar :is(a, button):focus-visible{outline:2px solid var(--paper); outline-offset:2px;}
  /* the second row: doors on the left, pills on the right */
  .mkn-row{position:sticky; top:var(--mkn-bar-h, 64px); z-index:44; display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:10px 28px; background:var(--paper); border-bottom:1px solid var(--sand-line);}
  .mkn-row.is-empty{display:none;}
  .mkn-doors, .mkn-pills{display:flex; align-items:center; gap:8px; flex-wrap:wrap;} .mkn-pills{margin-left:auto; justify-content:flex-end;}
  /* the work on the left, the panel on the right */
  .mkn-main{display:grid; grid-template-columns:minmax(0,1fr); gap:20px; padding:20px 16px 96px;}
  .mkn-work{min-width:0;}
  .mkn-sec{margin:0 0 16px; padding:22px 26px; background:var(--paper); border-radius:var(--r-card); box-shadow:var(--nb-shadow);}
  body.mkn .mkn-sec > .roundlabel{margin:0 0 12px; font-family:'Newsreader',Georgia,serif; font-size:1.3rem; font-weight:600; line-height:1.25; letter-spacing:0; text-transform:none; color:var(--ink);}
  .mkn-sec .mloc + .mloc{margin-top:10px;}
  /* prose reads as prose; a table cell keeps its box */
  .mkn-sec .readonly{margin:0; padding:0; background:none; border:none; border-radius:0; font-size:1rem; line-height:1.65; overflow-wrap:anywhere;}
  .mkn-sec .readonly.mkn-box{padding:10px 12px; background:var(--sand); border-radius:var(--r-strip); font-size:0.9rem; line-height:1.6;}
  .mkn-sec .hl{margin:16px 0 2px; color:var(--a-forest);} .mkn-sec .readonly > .hl:first-child{margin-top:0;}
  .mkn-colon, .mkn-gapbr{display:none;}
  .mkn-plain{margin:0; font-size:0.9rem; line-height:1.6; color:var(--grey);}
  .mkn-sec .duerow{margin-top:14px;}
  .mkn-work > details.card{margin:0 0 16px; border-left:none; background:var(--paper); border-radius:var(--r-card); box-shadow:var(--nb-shadow);}
  .mkn-panel{min-width:0; padding:20px; background:var(--paper); border-radius:var(--r-card); box-shadow:var(--nb-shadow);}
  .mkn-out{display:flex; align-items:center; gap:14px; margin:0 0 16px;}
  .mkn-out p{margin:3px 0 0; font-size:0.86rem; line-height:1.4; color:var(--grey);}
  .mkn-outcome{margin:0; font-family:'Newsreader',Georgia,serif; font-size:1.6rem; font-weight:600; line-height:1.15; color:var(--ink);}
  .mkn-outcome.is-pass{color:var(--a-green);} .mkn-outcome.is-fail{color:var(--a-red);}
  .mkn-ring{position:relative; flex:none; display:inline-flex; width:64px; height:64px;}
  .mkn-ring svg{display:block;} .mkn-ring circle{fill:none; stroke-width:6;}
  .mkn-ring .rg-bed{stroke:var(--sand-deep);} .mkn-ring .rg-arc{stroke:var(--a-forest); stroke-linecap:round; transition:stroke-dasharray .25s ease;}
  .mkn-ring b{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:0.95rem; font-weight:700; color:var(--ink);}
  @media (prefers-reduced-motion:reduce){ .mkn-ring .rg-arc{transition:none;} }
  /* one card for each criterion; its edge is green once Met, red once Not met */
  .critrow.mkn-card{display:block; margin:0 0 12px; padding:14px 16px; border:1.5px solid var(--sand-line); border-radius:var(--r-card); background:var(--paper);}
  .critrow.mkn-card:last-child{border-bottom:1.5px solid var(--sand-line);}
  .critrow.mkn-card.is-met{border-color:var(--a-green);} .critrow.mkn-card.is-not{border-color:var(--a-red);}
  .mkn-ct{display:flex; align-items:flex-start; gap:10px; font-size:0.9rem; font-weight:600; line-height:1.45; color:var(--ink);}
  .mkn-num{flex:none; display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; background:var(--sand-deep); font-size:0.78rem; font-weight:700;}
  .mkn-first{margin:8px 0 0; padding:7px 10px; border-radius:var(--r-strip); background:var(--sand); font-size:0.82rem; line-height:1.5; color:var(--ink);}
  .mkn-acts{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:12px 0 0;}
  .mkn-acts .mkn-met, .mkn-acts .mkn-not{width:auto; min-width:88px; min-height:40px; padding:0 16px; border-radius:999px; border:1.5px solid var(--sand-line); background:var(--paper); color:var(--grey); font:700 0.86rem 'Karla',sans-serif; cursor:pointer;}
  .mkn-acts .mkn-met:hover, .mkn-acts .mkn-not:hover{border-color:var(--a-forest); box-shadow:none !important;}
  .mkn-acts .mkn-met.on{background:var(--a-forest) !important; border-color:var(--a-forest); color:var(--paper);}
  .mkn-acts .mkn-not.on{background:var(--a-red) !important; border-color:var(--a-red); color:var(--paper);}
  .mkn-addc{min-height:40px; padding:0 8px; border:none; background:none; color:var(--a-forest); font:700 0.86rem 'Karla',sans-serif; text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
  .mkn-addc:hover{background:none !important; box-shadow:none !important; text-decoration-thickness:2px;}
  .mkn-panel :is(button, textarea):focus-visible{outline:2px solid var(--a-forest); outline-offset:2px;}
  .mkn-fixed{display:inline-flex; align-items:center; min-height:32px; padding:0 14px; border-radius:999px; background:var(--sand-deep); color:var(--grey); font-size:0.82rem; font-weight:700;}
  .mkn-fixed.is-met{background:var(--a-forest); color:var(--paper);} .mkn-fixed.is-not{background:var(--a-red); color:var(--paper);}
  .mkn-own{margin:12px 0 0; padding:9px 12px; border-left:3px solid var(--a-forest); border-radius:0 var(--r-strip) var(--r-strip) 0; background:var(--sand);}
  .mkn-own p{margin:3px 0 0; font-size:0.9rem; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--ink);}
  .mkn-cap{display:block; font-size:0.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--grey);}
  .mkn-card textarea{margin-top:12px;}
  .mkn-panel textarea{background:var(--field); border:1.5px solid var(--sand-line); border-radius:var(--r-strip);}
  .mkn-ol{display:block; margin:18px 0 6px; font-size:0.9rem; font-weight:700; color:var(--ink);}
  .mkn-quiet{margin:10px 0 0; font-size:0.82rem; color:var(--grey);}
  .mkn-panel > .mkn-own{margin-top:14px;}
  .mkn-panel > .duerow{margin-top:14px;}
  /* the criterion the keys are on */
  body.mkn .critrow.mkn-card.mk-cur{padding-left:16px !important; border-radius:var(--r-card); box-shadow:none;}
  /* shown once a key has been used, so a tutor with a mouse sees four plain cards */
  body.mkn.mkn-keys .critrow.mkn-card.mk-cur{box-shadow:0 0 0 3px color-mix(in oklab, var(--a-forest) 22%, transparent);}
  @media (min-width:1080px){
    .mkn-main{grid-template-columns:minmax(0,1fr) minmax(380px,30%); gap:28px; padding:24px 28px 60px; align-items:start;}
    .mkn-main.mkn-solo{grid-template-columns:minmax(0,720px);}
    /* the panel scrolls inside itself; the room at its foot lets the last line clear the round button in the corner */
    .mkn-panel{position:sticky; top:calc(var(--mkn-top, 64px) + 16px); max-height:calc(100vh - var(--mkn-top, 64px) - 32px); overflow:auto; padding-bottom:72px;}
    /* ONE LINE EACH ON A LAPTOP (24 Nov 2026, reviewers' findings). The bar does not wrap: a long name is cut with an
       ellipsis, so Return keeps its place at the right. The doors and pills keep one line too: when the pills do not
       fit, they slide sideways inside their own row, as they do on a phone. */
    .mkn-bar{flex-wrap:nowrap;}
    .mkn-who{flex:0 1 auto; min-width:0;}
    .mkn-name, .mkn-what{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;} .mkn-name{padding-bottom:2px;}
    /* EVERY PILL IN SIGHT (24 Nov 2026, the course tutor): on a laptop nothing slides or hides under another pill.
       The doors keep the left; when the pills do not fit beside them they wrap to a second line, right-aligned,
       with the 1st and 2nd marker pills last. The panel's sticky top is measured, so it follows the row's height. */
    .mkn-row{flex-wrap:wrap; justify-content:flex-end; row-gap:8px;}
    .mkn-doors{flex:none; flex-wrap:nowrap; margin-right:auto;}
    .mkn-pills, .mkn-pills .mkn-mpills{display:contents;}
    .mkn-pills > *, .mkn-mpills > *{flex:none;}
  }
  .mkn-mpills{display:contents;}
  /* a narrow screen: one column, the panel under the work; the steps take a line of their own */
  @media (max-width:1079px){
    .mkn-bar{padding:8px 16px; gap:6px 10px;}
    .mkn-name{font-size:1.05rem;} .mkn-avi{width:40px; height:40px;}
    .mkn-who{flex:1 1 0;}
    .mkn-gap{display:none;}
    .mkn-steps{order:9; flex:1 1 100%; gap:6px; font-size:0.8rem;} .mkn-step + .mkn-step::before{width:12px;}
    .mkn-row{padding:8px 16px;}
    .mkn-sec{padding:18px 16px;}
  }
  @media (max-width:560px){
    .mkn-step i{width:22px; height:22px;}
  }
  @media print{ .mkn-bar, .mkn-row{display:none !important;} .mkn-main{display:block; padding:0;} .mkn-panel{position:static; max-height:none; overflow:visible;} }

  /* ---- THE DOORS, THE PILLS, THE MORE MENU AND THE SHEETS (24 Nov 2026) ----
     A door opens something to read (the marking guidelines, the text the trainee chose, what they attached). A pill
     says where one fact stands, always in words; the check and the color only support the words. A pill that can
     be pressed is a button and looks pressable; one that cannot is plain. The More menu holds what is used now and
     then. A sheet is the one box everything here opens in. */
  .mkn-door{display:inline-flex; align-items:baseline; gap:10px; min-height:40px; padding:8px 14px; border:1.5px solid var(--a-forest); border-radius:var(--r-control); background:var(--paper); color:var(--ink); font:700 0.9rem 'Karla',sans-serif; cursor:pointer; white-space:nowrap;}
  /* the chosen text's link in the work: on a phone its tap target is 40px or more, and the line looks the same */
  @media (max-width:1079px){ body.mkn #mkWork a.mkn-txt{padding:12px 8px; margin:0 -8px; -webkit-tap-highlight-color:transparent;} body.mkn #mkWork .hl a.mkn-txt{padding:14px 8px;} }
  .mkn-door:hover{background:color-mix(in oklab, var(--a-forest) 6%, var(--paper)) !important; box-shadow:none !important;}
  .mkn-pill{display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 14px; border:1.5px solid transparent; border-radius:999px; background:var(--a-stone); color:var(--ink); font:700 0.86rem 'Karla',sans-serif; white-space:nowrap;}
  .mkn-pill svg{flex:none;}
  button.mkn-pill{cursor:pointer;}
  button.mkn-pill:hover{border-color:var(--a-forest); background:var(--a-stone) !important; box-shadow:none !important;}
  .mkn-pill.is-plain{background:var(--paper); border-color:var(--sand-line); color:var(--grey);}
  .mkn-pill.is-dash{background:var(--paper); border:1.5px dashed color-mix(in oklab, var(--grey) 55%, transparent); color:var(--grey);}
  button.mkn-pill.is-dash:hover{background:var(--paper) !important; border-style:solid;}
  .mkn-pill.is-amber{background:color-mix(in oklab, var(--a-mustard) 20%, var(--paper)); color:var(--ink);}
  button.mkn-pill.is-amber:hover{background:color-mix(in oklab, var(--a-mustard) 20%, var(--paper)) !important; border-color:var(--a-mustard);}
  .mkn-pillact{min-height:40px; margin:0 -6px 0 2px; padding:0 6px; border:none; background:none; color:var(--a-forest); font:700 0.82rem 'Karla',sans-serif; text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
  .mkn-pillact:hover{background:none !important; box-shadow:none !important; text-decoration-thickness:2px;}
  .mkn-row :is(button, a):focus-visible, .mkn-sheet :is(button, a, input, textarea):focus-visible, .mkn-menu :is(button, a):focus-visible{outline:2px solid var(--a-forest); outline-offset:2px;}
  /* the More menu, under its button */
  .mkn-morewrap{position:relative; display:inline-flex;}
  .mkn-menu{position:absolute; right:0; top:calc(100% + 10px); z-index:60; width:min(340px, calc(100vw - 32px)); max-height:calc(100vh - var(--mkn-bar-h, 64px) - 24px); overflow:auto; padding:8px; background:var(--paper); border-radius:var(--r-card); box-shadow:0 18px 50px color-mix(in oklab, var(--ink) 28%, transparent); color:var(--ink);}
  .mkn-mi{display:block; width:100%; min-height:44px; padding:9px 14px; border:none; border-radius:var(--r-strip); background:none; color:var(--ink); font:inherit; text-align:left; text-decoration:none; cursor:pointer;}
  .mkn-mi b{display:block; font:700 0.95rem 'Karla',sans-serif; color:var(--ink);}
  .mkn-mi span{display:block; margin-top:1px; font-size:0.82rem; font-weight:500; color:var(--grey);}
  .mkn-mi:hover, .mkn-mi:focus-visible{background:var(--a-stone) !important; box-shadow:none !important; color:var(--ink);}
  .mkn-mi.is-brick b{color:var(--a-red);}
  .mkn-mi[aria-disabled="true"]{cursor:default;} .mkn-mi[aria-disabled="true"] b{color:var(--grey);} .mkn-mi[aria-disabled="true"]:hover{background:none !important;}
  .mkn-menu hr{height:1px; margin:6px 8px; border:none; background:var(--sand-line);}
  .mkn-menu .mkn-mi:focus-visible{outline-offset:-2px;}
  /* a sheet: one box over the page, closed by Close, by Escape, or by a click outside it */
  .mkn-sheetwrap{position:fixed; inset:0; z-index:80; display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow:auto; background:color-mix(in oklab, var(--a-forest) 45%, transparent);}
  .mkn-sheetwrap[hidden]{display:none !important;}
  .mkn-sheet{width:min(880px, 100%); padding:28px 32px 26px; background:var(--paper); border-radius:var(--r-card); box-shadow:0 24px 70px color-mix(in oklab, var(--ink) 35%, transparent); color:var(--ink); font-family:'Karla',sans-serif;}
  .mkn-sheet.is-narrow{width:min(560px, 100%);}
  /* the sheet's head stays at the top while a long sheet scrolls, so Close is always in reach (24 Nov 2026) */
  .mkn-sh-top{position:sticky; top:-5vh; z-index:2; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin:-28px -32px 14px; padding:28px 32px 10px; background:var(--paper); border-radius:var(--r-card) var(--r-card) 0 0;}
  .mkn-sh-cap{margin:0 0 2px; font-size:0.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--a-forest);}
  .mkn-sheet h2{margin:0; font-family:'Newsreader',Georgia,serif; font-size:1.6rem; font-weight:600; line-height:1.2; color:var(--ink);}
  .mkn-sh-x{flex:none; min-height:40px; padding:0 8px; border:none; background:none; color:var(--grey); font:700 0.9rem 'Karla',sans-serif; cursor:pointer;}
  .mkn-sh-x:hover{background:none !important; box-shadow:none !important; color:var(--ink); text-decoration:underline; text-underline-offset:3px;}
  .mkn-sh-body{font-size:0.95rem; line-height:1.65; overflow-wrap:anywhere;}
  .mkn-sh-body h3{margin:20px 0 6px; font:700 0.78rem 'Karla',sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--a-forest);}
  .mkn-sh-body h3:first-child{margin-top:0;}
  .mkn-sh-body h4{margin:12px 0 2px; font:700 0.95rem 'Karla',sans-serif; color:var(--ink);}
  .mkn-sh-body p{margin:0 0 10px;} .mkn-sh-body ul{margin:4px 0 10px; padding-left:20px;} .mkn-sh-body li{margin:3px 0;}
  .mkn-sh-body a{color:var(--a-forest); font-weight:700;}
  .mkn-sh-foot{margin:16px 0 0; font-size:0.82rem; line-height:1.5; color:var(--grey);}
  .mkn-sh-acts{display:flex; justify-content:flex-end; flex-wrap:wrap; gap:10px; margin:16px 0 0;}
  .mkn-btn{min-height:44px; padding:0 20px; border-radius:999px; border:1.5px solid var(--a-forest); background:var(--a-forest); color:var(--paper); font:700 0.9rem 'Karla',sans-serif; cursor:pointer;}
  .mkn-btn:hover{background:var(--a-forest) !important; box-shadow:0 0 0 2px color-mix(in oklab, var(--a-forest) 30%, transparent) !important;}
  .mkn-btn.is-quiet{background:var(--paper); color:var(--ink); border-color:var(--sand-line);}
  .mkn-btn.is-quiet:hover{background:var(--paper) !important; border-color:var(--a-forest); box-shadow:none !important;}
  .mkn-sheet textarea, .mkn-sheet input[type=text], .mkn-sheet input[type=datetime-local], .mkn-sheet select.hub-namepick{background:var(--field); border:1.5px solid var(--sand-line); border-radius:var(--r-strip); font-family:'Karla',sans-serif; font-size:0.95rem; padding:9px 12px; color:var(--ink);}
  .mkn-sheet #xText{font-family:ui-monospace,Menlo,monospace; font-size:0.82rem;}
  .mkn-list{list-style:none; margin:0; padding:0;} .mkn-list li{margin:0; padding:11px 0; border-top:1px solid var(--sand-line);} .mkn-list li:first-child{border-top:none; padding-top:0;}
  .mkn-list b{display:block; font-weight:700;} .mkn-list span{display:block; color:var(--grey); font-size:0.9rem;}
  .mkn-dl{display:grid; grid-template-columns:minmax(120px,auto) minmax(0,1fr); gap:6px 16px; margin:0;} .mkn-dl dt{font-weight:700; color:var(--grey); font-size:0.86rem;} .mkn-dl dd{margin:0;}
  .mkn-files{display:flex; flex-wrap:wrap; gap:8px; margin:0;}
  .mkn-files a{display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border:1.5px solid var(--a-forest); border-radius:999px; color:var(--a-forest); font-weight:700; text-decoration:none;}
  .mkn-files a:hover{background:color-mix(in oklab, var(--a-forest) 6%, var(--paper));}
  .mkn-sheet .duerow{margin:0;} .mkn-sheet .duerow .dueline{flex:1 1 100%;}
  .mkn-sheet .xchg-acts{margin-top:10px;}
  @media (max-width:1079px){
    /* doors and pills are one line that slides sideways: the only sideways scroll on the page. It does not stick, so the
       work keeps the screen. The menu opens across the screen, under the bar. */
    .mkn-row{position:static; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;} .mkn-row::-webkit-scrollbar{display:none;}
    .mkn-doors, .mkn-pills{flex-wrap:nowrap; flex:none;} .mkn-pills{margin-left:0;}
    .mkn-morewrap{position:static;}
    .mkn-menu{position:fixed; left:16px; right:16px; top:calc(var(--mkn-bar-h, 64px) + 6px); width:auto;}
    .mkn-sheetwrap{padding:16px 10px;} .mkn-sheet{padding:20px 18px;} .mkn-sheet h2{font-size:1.3rem;}
    .mkn-sh-top{top:-16px; margin:-20px -18px 12px; padding:20px 18px 8px;}
    .mkn-dl{grid-template-columns:1fr; gap:0;} .mkn-dl dd{margin:0 0 8px;}
  }
  @media print{ .mkn-sheetwrap, .mkn-menu{display:none !important;} }

  /* ---- OWN WORK, A RESUBMISSION, THE SECOND MARKER (24 Nov 2026) ----
     A small word tag says where a section or a pass stands (Unchanged, Changed, Nothing found). A found passage and
     its card are mustard. The second marker's box has a forest edge and the one gold button on that screen. */
  .mkn-tag{display:inline-flex; align-items:center; gap:5px; min-height:28px; padding:0 11px; border-radius:999px; background:var(--a-stone); color:var(--grey); font:700 0.82rem 'Karla',sans-serif; white-space:nowrap;}
  .mkn-tag.is-gold{background:color-mix(in oklab, var(--a-mustard) 75%, var(--paper)); color:var(--ink);}
  .mkn-tag.is-ok{background:var(--a-stone); color:var(--ink);}
  /* a resubmission: one line for what did not change, the switch for what did */
  .mkn-foldhead{display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px;}
  body.mkn .mkn-foldhead .roundlabel{margin:0; font-family:'Newsreader',Georgia,serif; font-size:1.3rem; font-weight:600; line-height:1.25; letter-spacing:0; text-transform:none; color:var(--ink);}
  .mkn-sec.is-fold{padding-top:14px; padding-bottom:14px;}
  .mkn-sec.is-fold .mkn-foldbody{margin-top:14px;}
  .mkn-foldbtn{margin-left:auto; min-height:40px; padding:0 6px; border:none; background:none; color:var(--a-forest); font:700 0.9rem 'Karla',sans-serif; text-decoration:underline; text-underline-offset:3px; cursor:pointer;}
  .mkn-foldbtn:hover{background:none !important; box-shadow:none !important; text-decoration-thickness:2px;}
  .mkn-switch{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 16px;}
  .mkn-switch button{min-height:40px; padding:0 16px; border-radius:999px; border:1.5px solid var(--sand-line); background:var(--paper); color:var(--ink); font:700 0.86rem 'Karla',sans-serif; cursor:pointer;}
  .mkn-switch button:hover{border-color:var(--a-forest); background:var(--paper) !important; box-shadow:none !important;}
  .mkn-switch button[aria-pressed="true"]{background:var(--a-forest) !important; border-color:var(--a-forest); color:var(--paper);}
  .mkn-both{display:grid; grid-template-columns:minmax(0,1fr); gap:18px;}

<script type="text/x-hub-app">
/* Whose room this is -- see hubTutorRoomOnly in hub-shared.js. A trainee or an
   assessor who reached this page got the whole editable feedback form, grade
   dropdown and all (walk, 22 Sep 2026). */
if (window.hubTutorRoomOnly && hubTutorRoomOnly())
  throw new Error('Connect Lite: stopping this page on purpose \u2014 the tutors\u2019 room is not open to this link.');

const WORDING_KEY = 'connect_assignment_wording_v2';
const SUB_KEY = 'connect_assignment_submissions_v1';
let ORDER = ['fol','lrt','lsrt','lfc','a5']; // replaced by the center's order once the wording is read
const NAMES = { lrt:'LRT', lsrt:'LSRT', fol:'FOL', lfc:'LFC', a5:'Assignment 5' };
const $ = id => document.getElementById(id);
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

let WORDING = null;
try { WORDING = JSON.parse(localStorage.getItem(WORDING_KEY)); } catch(e) {}
// Nothing saved in this browser: the center's standard wording (assignment-defaults.js).
if (!WORDING && window.CONNECT_HUB_DEFAULT_WORDING) WORDING = JSON.parse(JSON.stringify(window.CONNECT_HUB_DEFAULT_WORDING));
if (WORDING) { Object.keys(WORDING).forEach(k => {
  const a = WORDING[k]; if (!a || !a.criteria) return;
  a.criteria = a.criteria.map(c => typeof c === 'string' ? {text:c, sectionIndex:null} : c);
}); }
ORDER = hubAssignmentOrder(WORDING);

const ROSTER_KEY = 'connect_roster_v1';
function loadRoster(){ try{ return JSON.parse(localStorage.getItem(ROSTER_KEY)) || {trainees:{}}; }catch(e){ return {trainees:{}}; } }
function saveRoster(r){ localStorage.setItem(ROSTER_KEY, JSON.stringify(r)); }

const params = new URLSearchParams(location.search);
/* No assignment named: open the first one in the CENTRE's order, not a
   hard-coded one. This read defaulted to 'lrt', so the trainee home's
   "Written assignments" door landed on the second assignment however the
   center had ordered them (trainee walk, 21 Sep 2026). */
let CURRENT = params.get('a') || (hubAssignmentOrder(WORDING).filter(k => k !== 'a5')[0] || 'fol');
const TRAINEE_ID = params.get('trainee') || '';
let OUTCOME = '';

/* WHICH LAYOUT (24 Nov 2026). The marking page has two layouts for one night: the one tutors have used since
   October (render) and the new one, read, mark, return (renderNew, further down). They write the same record
   through the same functions. MK_NEW_DEFAULT says which one a tutor gets; ?old=1 in the address asks for the old
   one and ?new=1 for the new one, and the choice is kept for this tab only (sessionStorage 'mk:new', '1' or '0'),
   so Previous and Next stay in the layout that was asked for. Nothing about the layout is ever stored on a record. */
const MK_NEW_DEFAULT = true;
const MK_NEW = (function(){
  let kept = null;
  try {
    if (params.get('old') === '1') sessionStorage.setItem('mk:new', '0');
    else if (params.get('new') === '1') sessionStorage.setItem('mk:new', '1');
    kept = sessionStorage.getItem('mk:new');
  } catch (e) { if (params.get('old') === '1') return false; if (params.get('new') === '1') return true; }
  return kept === '1' ? true : kept === '0' ? false : MK_NEW_DEFAULT;
})();
/* What the page holds between draws, declared here because the first draw runs before the rest of this script is
   read (24 Nov 2026). X_READ: the exchange card's reader, for the one paste listener. MKN_READ: step 1 has turned
   gold (this page's life only, never stored). MKN_OPEN: the criterion whose comment box is open. MKN_END: the
   watcher for the end of the work. */
let X_READ = null, MKN_READ = false, MKN_OPEN = null, MKN_END = null;
/* MKN_BRING: the sheet for comments brought back is open (it is drawn with the page, so the page must remember).
   MKN_FOCUS: what the keyboard was on when a sheet opened, to go back to when it closes. */
let MKN_BRING = false, MKN_FOCUS = null;
/* Own work, a resubmission and the second marker (24 Nov 2026). MKN_OWN: the last own-work check of this script in
   this tab (kept in sessionStorage too, never on the record); MKN_OWN_BUSY: a check is running. MKN_VER: for each
   changed section of a resubmission, "new" or "both". MKN_SHOW: the unchanged sections a tutor has opened. MKN_DIFFS:
   the words to underline, worked out while the page is drawn. MKN_VIEW2: this tutor has the second marker's page.
   MKN_SEC_MSG: the one sentence said when the marks moved under a second marker before they signed. */
let MKN_OWN = null, MKN_OWN_BUSY = false, MKN_VER = {}, MKN_SHOW = {}, MKN_DIFFS = [], MKN_VIEW2 = false, MKN_SEC_MSG = '';
/* The phone (24 Nov 2026). MKN_PANEL: the panel is up as a sheet, kept across a redraw so a mark does not drop it.
   MKN_NARROW: which way the page was last drawn, so a turn of the phone that crosses 1080px draws it again. */
let MKN_PANEL = false, MKN_NARROW = null;
/* The 1st marker's write checked against the store (24 Nov 2026, mknVerify further down). MKN_VT and MKN_VLATE: the
   two timers; MKN_VERIFY: a check is running; MKN_HEALING: the page is sending its copy again. MKN_SEC_KEPT: the words
   of a second marker's comment that was not signed, shown when the box is no longer offered. */
let MKN_VT = null, MKN_VLATE = null, MKN_VERIFY = 0, MKN_HEALING = false, MKN_SEC_KEPT = '';

/* Every door into this screen -- the dashboard's rows and the tracker's
   actions -- carries ?trainee=. Reached without one (a stale bookmark, a
   hand-typed URL), it used to fall through to connect_assignment_submissions_v1,
   which is a TRAINEE's own key and means nothing in a tutor's browser: an empty
   mark sheet, headed with the assignment's real name, that a tutor could type
   marks into for nobody. Found walking the tutor role, 21 Sep 2026. A mark
   sheet needs to know whose work it is. */
let SUBS = null;
if (TRAINEE_ID) {
  const roster = loadRoster();
  const tr = roster.trainees[TRAINEE_ID];
  SUBS = (tr && tr.assignments) || {};
} else {
  try { SUBS = JSON.parse(localStorage.getItem(SUB_KEY)); } catch(e) {}
}
if (!SUBS) SUBS = {};

/* Giving ONE trainee more time.
 *
 * The deadline belongs to the assignment and to everybody on the course. An
 * extension belongs to one person, so it is written into that trainee's own
 * tracker record -- TUTOR_ONLY in hub-sync, which is what stops a trainee
 * granting themselves one -- and hub-due only ever lets it ADD time.
 *
 * Offered whether or not the deadline has passed: a tutor who knows on Tuesday
 * that someone is in hospital should not have to wait until Friday night for
 * the button to appear (24 Sep 2026). */
function extKey(sub){
  return 'a:' + CURRENT + (sub && sub.stage === 'resubmission_needed' ? ':resub' : '');
}
function extensionsOf(){
  if (!TRAINEE_ID) return {};
  const tr = loadRoster().trainees[TRAINEE_ID];
  return (tr && tr.tracker && tr.tracker.extensions) || {};
}
function setExtension(sub, iso){
  if (!TRAINEE_ID) return;
  const roster = loadRoster();
  const tr = roster.trainees[TRAINEE_ID] || (roster.trainees[TRAINEE_ID] = { id:TRAINEE_ID, name:'Trainee', tp:{}, assignments:{} });
  tr.tracker = tr.tracker || {};
  tr.tracker.extensions = tr.tracker.extensions || {};
  if (iso) tr.tracker.extensions[extKey(sub)] = iso; else delete tr.tracker.extensions[extKey(sub)];
  saveRoster(roster);
  render();
}
function baseDue(a, sub){
  if (sub && sub.stage === 'resubmission_needed') return HubDue.resubFor(a, sub);
  /* the deadline of the teaching set this trainee is in, where the assignment has one per set */
  const tr = TRAINEE_ID ? (loadRoster().trainees || {})[TRAINEE_ID] : null;
  return window.hubDueFor ? hubDueFor(a, TRAINEE_ID, tr && tr.group) : (a && a.dueAt) || '';
}
function dueRowHTML(a, sub){
  if (!TRAINEE_ID) return '';                       // nobody to extend
  const mine = HubDue.forPerson(baseDue(a, sub), extensionsOf()[extKey(sub)]);
  const st = HubDue.state(mine.iso);
  const isResub = sub.stage === 'resubmission_needed';
  const settled = sub.stage === 'submitted' || sub.stage === 'resubmitted' || sub.stage === 'closed';
  if (!st.has && settled) return '';
  const line = !st.has
    ? (isResub ? 'No resubmission window set for this assignment.' : 'No deadline set for this assignment.')
    : (st.past ? (isResub ? 'Resubmission closed ' : 'Closed ') + esc(st.due)
               : 'Due ' + esc(st.due) + ' \u00b7 ' + esc(st.text))
      + (mine.extended ? ' \u2014 extended for this trainee' : '');
  /* Three days after the deadline as it stands, so the box offers a real extension.
     It was three days from the machine's clock, which on a demo pinned to March
     offered "Mon 26 Oct" beside a 17 March deadline (tutor walk, 24 Oct 2026). */
  const fromMs = st.has && isFinite(new Date(mine.iso).getTime()) ? new Date(mine.iso).getTime()
    : (window.hubToday && hubToday() ? new Date(hubToday() + 'T17:00:00').getTime() : Date.now());
  const prefill = HubDue.toLocalInput(new Date(fromMs + 3 * HubDue.DAY).toISOString());
  /* red only while the passed deadline still needs somebody: once the work is
     in (or the assignment closed) the date is a fact, not an alarm */
  return `<div class="duerow ${st.past && !settled ? 'past' : ''}">
    <span class="dueline">${line}</span>
    ${settled ? '' : `<span class="dueacts">
      <input type="datetime-local" id="extAt" value="${esc(HubDue.toLocalInput(mine.extended ? mine.iso : '') || prefill)}">
      <button type="button" class="btn btn-quiet" id="extSet">${mine.extended ? 'Change it' : 'Give more time'}</button>
      ${mine.extended ? '<button type="button" class="btn btn-quiet" id="extClear">Remove</button>' : ''}
    </span>`}
  </div>`;
}

function saveSubs(){
  if (TRAINEE_ID) {
    const roster = loadRoster();
    if (!roster.trainees[TRAINEE_ID]) roster.trainees[TRAINEE_ID] = { id:TRAINEE_ID, name:'Trainee', tp:{}, assignments:{} };
    /* A SIGNATURE IS NEVER WRITTEN OVER (24 Nov 2026, the new layout). This tab's copy may be older than the stored
       one: the 2nd marker can sign after this page was opened, and the course is taken again in the background. Before
       this tab writes, a signed second marker's record and the 2nd marker's name that the stored copy has and this
       copy lacks are carried into this copy, so a Return from a tab opened before the signature keeps it. */
    if (document.body && document.body.classList.contains('mkn')) mknCarrySecond(roster.trainees[TRAINEE_ID].assignments || {});

  } else {

  }
}

/* RESUBMISSION, SIDE BY SIDE (17 Oct 2026). Section by section: her first
   answer, with your first-round margin comments still on it, beside the
   amber resubmission, the changed words lightly marked in both. A section
   whose criteria were all Met the first time was locked on her side and
   carried forward; it folds here with a note saying so. On a phone the two
   stack, first above resubmission. */
function wordDiff(x, y){
  const A = String(x || '').split(/(\s+)/), B = String(y || '').split(/(\s+)/);
  const n = A.length, m = B.length;
  if (n * m > 4000000) return [nl2br(x), nl2br(y)];
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, oa = '', ob = '';
  const w = (t, tag) => /^\s+$/.test(t) ? nl2br(t) : `<${tag}>${nl2br(t)}</${tag}>`;
  while (i < n && j < m) {
    if (A[i] === B[j]) { oa += nl2br(A[i]); ob += nl2br(B[j]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { oa += w(A[i], 'del'); i++; }
    else { ob += w(B[j], 'ins'); j++; }
  }
  while (i < n) oa += w(A[i++], 'del');
  while (j < m) ob += w(B[j++], 'ins');
  return [oa, ob];
}
/* IS IT THEIR OWN WORK? (Ramy, 25 Oct 2026: "anything to do with another assignment
   that was maybe written on Lite, like other courses ... anything that's been published
   online"). Three passes, each pressed by the tutor, none of them marking anything:
   similar (every other assignment on Lite, by runs of eight words; the other trainee

    + (b.sections || []).map(x => '<h4>' + esc(x.label || '') + '</h4><p>' + nl2br(esc(x.body || x.text || '')) + '</p>').join('')
    + ((b.criteria || []).length ? '<h4>Criteria</h4><ul>' + b.criteria.map(c => '<li>' + esc(c.text || c) + '</li>').join('') + '</ul>' : '') + '</div>';

async function runCheck(round){
  const out = $('checkOut'), st = $('checkState'), b = $('ownCheck'); if (!out) return;
  const S = window.HubStore, body = { code: CURRENT, round, token: TRAINEE_ID };
  const name = c => NAMES[c] || String(c || '').toUpperCase();
  b.disabled = true; st.textContent = 'Reading every assignment on Lite…'; out.innerHTML = '';
  let sim = null;
  try { sim = await S.call(Object.assign({ op: 'similar' }, body)); }
  catch (e) { out.innerHTML = `<p class="note">It could not be compared: ${esc(e.message)}</p>`; b.disabled = false; st.textContent = ''; return; }
  let html = `<h3 class="mk-h3">Across Lite</h3>`;
  if (!sim.matches.length) html += `<p class="note">Compared with ${sim.compared} other submission${sim.compared === 1 ? '' : 's'}. Nothing shared beyond the brief's own phrases and the references everyone cites.</p>`;
  else html += sim.matches.map(m => `<div class="mk-match"><b>${esc(m.course)}${m.centre ? ' · ' + esc(m.centre) : ''}</b> · ${esc(name(m.code))}${m.round === 'sub2' ? ' (resubmission)' : ''} · ${m.shared} shared run${m.shared === 1 ? '' : 's'} of eight words, ${m.pct}% of this text${m.sameCourse ? ' · <span class="mk-same">same course</span>' : ''}${m.passages.map(x => `<blockquote>${esc(x)}</blockquote>${attachBtn({ kind:'lite', quote:x, course:m.course, centre:m.centre || '', code:m.code, round:m.round, pct:m.pct, round0: round })}`).join('')}</div>`).join('');
  out.innerHTML = html;
  st.textContent = 'Searching the web…';
  html += `<h3 class="mk-h3">On the web</h3>`;
  try {
    const web = await S.call(Object.assign({ op: 'webCheck' }, body));
    if (web.off) html += `<p class="note">Web search is not switched on. The owner adds a Brave Search key in the console.</p>`;
    else if (!web.found) html += `<p class="note">${web.checked} distinctive sentences searched in quotation marks. None found on a page in Brave Search's index.</p>`;
    else html += web.sentences.filter(x => x.hits.length).map(x => `<div class="mk-match"><blockquote>${esc(x.sentence)}</blockquote>${x.hits.map(h => `<div class="mk-hit"><a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.title || h.link)}</a><span>${esc(h.snippet)}</span>${attachBtn({ kind:'web', quote:x.sentence, link:h.link, title:h.title || '', round0: round })}</div>`).join('')}</div>`).join('') + `<p class="note">${web.found} of ${web.checked} sentences found. A lead, not proof: open the page and read it. Web results by Brave Search.</p>`;
  } catch (e) { html += `<p class="note">${esc(e.message)}</p>`; }
  out.innerHTML = html;
  if (sim.matches.length) {
    st.textContent = 'Reading the pairs for paraphrase…';
    html += `<h3 class="mk-h3">Paraphrase</h3>`;
    try {
      const ai = await S.call(Object.assign({ op: 'aiCheck' }, body));
      if (ai.off) html += `<p class="note">The paraphrase pass is not switched on. The owner adds a Claude key in the console.</p>`;
      else if (!ai.results.length) html += `<p class="note">${esc(ai.note || 'Nothing to read.')}</p>`;
      else html += ai.results.map(r => `<div class="mk-match"><b>${esc(r.course)}</b> · ${esc(name(r.code))}${r.round === 'sub2' ? ' (resubmission)' : ''}: ${r.error ? 'could not be read (' + esc(r.error) + ')' : r.verdict === 'none' ? 'nothing beyond the brief' : r.verdict === 'substantial' ? 'substantial paraphrase' : r.verdict === 'some' ? 'some paraphrase' : esc(r.raw || 'no answer')}${(r.pairs || []).map(x => `<div class="mk-pair"><blockquote>${esc(x.a)}</blockquote><blockquote>${esc(x.b)}</blockquote><span class="note">${esc(x.note)}</span>${attachBtn({ kind:'paraphrase', quote:x.a, pair:x.b, note:x.note || '', course:r.course, centre:r.centre || '', code:r.code, round:r.round, round0: round })}</div>`).join('')}</div>`).join('');
    } catch (e) { html += `<p class="note">${esc(e.message)}</p>`; }
    out.innerHTML = html;
  }
  st.textContent = 'Checked at ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '.';

}

function compareRounds(a, sub){
  const s1 = sub.sub1 || {}, s2 = sub.sub2 || {}, m1 = sub.criteriaMarks.sub1 || [];
  const locked = i => { const cs = (a.criteria || []).map((c, ci) => ({ c, ci })).filter(x => x.c.sectionIndex === i); return cs.length > 0 && cs.every(x => m1[x.ci] === true); };
  const pair = (loc, sec, field, label, v1, v2) => {
    const same = String(v1 || '') === String(v2 || '');
    const [h1, h2] = same ? [nl2br(v1), nl2br(v2)] : wordDiff(v1, v2);
    const lab = label ? `<strong>${esc(label)}:</strong> ` : '';
    return `<div class="mk-pair${same ? ' same' : ''}">
      <div class="mloc" data-loc="${loc}" data-round="sub1" data-sec="${sec}"${field ? ` data-field="${esc(field)}"` : ''}><div class="mk-pl">First submission</div><div class="readonly">${lab}${h1 || '<span class="note">Nothing written.</span>'}</div><div class="mgut"></div></div>
      <div class="mloc mk-r2" data-loc="${loc}" data-round="sub2" data-sec="${sec}"${field ? ` data-field="${esc(field)}"` : ''}><div class="mk-pl">Resubmission${same ? ': unchanged' : ''}</div><div class="readonly">${lab}${h2 || '<span class="note">Nothing written.</span>'}</div><div class="mgut"></div></div>
    </div>`;
  };
  let out = `<div class="card mk-round mk-compare"><h2>First submission and resubmission</h2>
    <p class="note" style="margin:0 0 12px;">Section by section. Words she changed are marked in both: struck through in the first, underlined in the resubmission.</p>`;
  a.sections.forEach((s, i) => {
    if (s.type === 'text' && !hubIsReference(s)) {
      const v1 = (s1.text || {})[i], v2 = (s2.text || {})[i];
      if (!v1 && !v2) return;
      out += `<div class="roundlabel" data-sec="${i}">${esc(s.label)}</div>`;
      if (locked(i)) { out += `<details class="mk-carried"><summary>Met the first time, so carried forward unchanged</summary><div class="readonly">${nl2br(v1)}</div></details>`; return; }
      out += pair('t' + i, i, '', '', v1, v2);
    } else if (s.type === 'fields') {
      const picked = (snap) => { for (let j = i - 1; j >= 0; j--) if (a.sections[j].type === 'picker') return hubPickedItems(a.sections[j], (snap.picked || {})[j]); return []; };
      const items = picked(s2).length ? picked(s2) : picked(s1);
      items.forEach((item, ii) => {
        out += `<div class="roundlabel" data-sec="${i}">${esc(s.label)} \u2014 ${esc(item)}</div>`;
        if (locked(i)) { out += `<details class="mk-carried"><summary>Met the first time, so carried forward unchanged</summary>${s.fields.map((f, fi) => { const v = (s1.fields || {})[`s${i}_i${ii}_f${fi}`]; return v ? `<div class="readonly"><strong>${esc(f.label)}:</strong> ${nl2br(v)}</div>` : ''; }).join('')}</details>`; return; }
        s.fields.forEach((f, fi) => {
          const k = `s${i}_i${ii}_f${fi}`, v1 = (s1.fields || {})[k], v2 = (s2.fields || {})[k];
          if (v1 || v2) out += pair('f:' + k, i, f.label, f.label, v1, v2);
        });
      });
    }
  });
  return out + `</div>`;
}
