  /* ---- v3 (7 Oct 2026): the tally strip ---- */

  .mv2-seg.not{background:var(--mark-not-bg); border-color:var(--mark-not-line); color:var(--mark-not-text);}

<script type="text/x-hub-app">
/* Whose room this is -- see hubTutorRoomOnly in hub-shared.js. A trainee or an
   assessor who reached this page got the whole editable feedback form, grade
   dropdown and all (walk, 22 Sep 2026). */
if (window.hubTutorRoomOnly && hubTutorRoomOnly())
  throw new Error('Connect Lite: stopping this page on purpose \u2014 the tutors\u2019 room is not open to this link.');

const WORDING_KEY = 'connect_assignment_wording_v2';
const SUB_KEY = 'connect_assignment_submissions_v1';
let ORDER = ['fol','lrt','lsrt','lfc','a5']; // replaced by the center's order once the wording is read
const NAMES = { lrt:'LRT', lsrt:'LSRT', fol:'FOL', lfc:'LFC', a5:'Assignment 5' };
const $ = id => document.getElementById(id);
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

let WORDING = null;
try { WORDING = JSON.parse(localStorage.getItem(WORDING_KEY)); } catch(e) {}
// Nothing saved in this browser: the center's standard wording (assignment-defaults.js).
if (!WORDING && window.CONNECT_HUB_DEFAULT_WORDING) WORDING = JSON.parse(JSON.stringify(window.CONNECT_HUB_DEFAULT_WORDING));
if (WORDING) { Object.keys(WORDING).forEach(k => {
  const a = WORDING[k]; if (!a || !a.criteria) return;
  a.criteria = a.criteria.map(c => typeof c === 'string' ? {text:c, sectionIndex:null} : c);
}); }
ORDER = hubAssignmentOrder(WORDING);

const ROSTER_KEY = 'connect_roster_v1';
function loadRoster(){ try{ return JSON.parse(localStorage.getItem(ROSTER_KEY)) || {trainees:{}}; }catch(e){ return {trainees:{}}; } }
function saveRoster(r){ localStorage.setItem(ROSTER_KEY, JSON.stringify(r)); }

const params = new URLSearchParams(location.search);
/* No assignment named: open the first one in the CENTRE's order, not a
   hard-coded one. This read defaulted to 'lrt', so the trainee home's
   "Written assignments" door landed on the second assignment however the
   center had ordered them (trainee walk, 21 Sep 2026). */
let CURRENT = params.get('a') || (hubAssignmentOrder(WORDING).filter(k => k !== 'a5')[0] || 'fol');
const TRAINEE_ID = params.get('trainee') || '';
let OUTCOME = '';

/* Every door into this screen -- the dashboard's rows and the tracker's
   actions -- carries ?trainee=. Reached without one (a stale bookmark, a
   hand-typed URL), it used to fall through to connect_assignment_submissions_v1,
   which is a TRAINEE's own key and means nothing in a tutor's browser: an empty
   mark sheet, headed with the assignment's real name, that a tutor could type
   marks into for nobody. Found walking the tutor role, 21 Sep 2026. A mark
   sheet needs to know whose work it is. */
let SUBS = null;
if (TRAINEE_ID) {
  const roster = loadRoster();
  const tr = roster.trainees[TRAINEE_ID];
  SUBS = (tr && tr.assignments) || {};
} else {
  try { SUBS = JSON.parse(localStorage.getItem(SUB_KEY)); } catch(e) {}
}

/* Giving ONE trainee more time.
 *
 * The deadline belongs to the assignment and to everybody on the course. An
 * extension belongs to one person, so it is written into that trainee's own
 * tracker record -- TUTOR_ONLY in hub-sync, which is what stops a trainee
 * granting themselves one -- and hub-due only ever lets it ADD time.
 *
 * Offered whether or not the deadline has passed: a tutor who knows on Tuesday
 * that someone is in hospital should not have to wait until Friday night for
 * the button to appear (24 Sep 2026). */
function extKey(sub){
  return 'a:' + CURRENT + (sub && sub.stage === 'resubmission_needed' ? ':resub' : '');
}
function extensionsOf(){
  if (!TRAINEE_ID) return {};
  const tr = loadRoster().trainees[TRAINEE_ID];

function setExtension(sub, iso){
  if (!TRAINEE_ID) return;

  const tr = roster.trainees[TRAINEE_ID] || (roster.trainees[TRAINEE_ID] = { id:TRAINEE_ID, name:'Trainee', tp:{}, assignments:{} });
  tr.tracker = tr.tracker || {};
  tr.tracker.extensions = tr.tracker.extensions || {};
  if (iso) tr.tracker.extensions[extKey(sub)] = iso; else delete tr.tracker.extensions[extKey(sub)];
  saveRoster(roster);
  render();
}
function baseDue(a, sub){
  if (sub && sub.stage === 'resubmission_needed') return HubDue.resubFor(a, sub);
  /* the deadline of the teaching set this trainee is in, where the assignment has one per set */
  const tr = TRAINEE_ID ? (loadRoster().trainees || {})[TRAINEE_ID] : null;
  return window.hubDueFor ? hubDueFor(a, TRAINEE_ID, tr && tr.group) : (a && a.dueAt) || '';
}
function dueRowHTML(a, sub){
  if (!TRAINEE_ID) return '';                       // nobody to extend
  const mine = HubDue.forPerson(baseDue(a, sub), extensionsOf()[extKey(sub)]);
  const st = HubDue.state(mine.iso);
  const isResub = sub.stage === 'resubmission_needed';
  const settled = sub.stage === 'submitted' || sub.stage === 'resubmitted' || sub.stage === 'closed';
  if (!st.has && settled) return '';
  const line = !st.has
    ? (isResub ? 'No resubmission window set for this assignment.' : 'No deadline set for this assignment.')
    : (st.past ? (isResub ? 'Resubmission closed ' : 'Closed ') + esc(st.due)
               : 'Due ' + esc(st.due) + ' \u00b7 ' + esc(st.text))
      + (mine.extended ? ' \u2014 extended for this trainee' : '');
  /* Three days after the deadline as it stands, so the box offers a real extension.
     It was three days from the machine's clock, which on a demo pinned to March
     offered "Mon 26 Oct" beside a 17 March deadline (tutor walk, 24 Oct 2026). */
  const fromMs = st.has && isFinite(new Date(mine.iso).getTime()) ? new Date(mine.iso).getTime()
    : (window.hubToday && hubToday() ? new Date(hubToday() + 'T17:00:00').getTime() : Date.now());
  const prefill = HubDue.toLocalInput(new Date(fromMs + 3 * HubDue.DAY).toISOString());
  /* red only while the passed deadline still needs somebody: once the work is
     in (or the assignment closed) the date is a fact, not an alarm */
  return `<div class="duerow ${st.past && !settled ? 'past' : ''}">
    <span class="dueline">${line}</span>
    ${settled ? '' : `<span class="dueacts">
      <input type="datetime-local" id="extAt" value="${esc(HubDue.toLocalInput(mine.extended ? mine.iso : '') || prefill)}">
      <button type="button" class="btn btn-quiet" id="extSet">${mine.extended ? 'Change it' : 'Give more time'}</button>
      ${mine.extended ? '<button type="button" class="btn btn-quiet" id="extClear">Remove</button>' : ''}
    </span>`}
  </div>`;
}

function summarize(a, snap, round){

  let out = '';

     among the criteria a trainee is judged on (syllabus, Component 2), and
     the center's own cover sheets put it under "Submission requirements"
     beside the declaration. Lite had it as a fifth/sixth/seventh criterion
     instead, which is where the tutor's only sight of the word count lived --
     so taking it out of the criteria lists (25 Sep 2026) had to put it here,
     or a tutor would have marked a 1,400-word assignment with nothing saying

  if (a.wordMin) {

  const ml = (snap.materialsLink||'').trim();
  if (ml) out += `<p style="margin:0 0 10px;"><a class="mats-open" href="${esc(ml)}" target="_blank" rel="noopener">Open the materials \u2197</a></p>`;
  a.sections.forEach((s,i) => {
    // Reference material has no answer in it, so there is nothing to show a
    // tutor: hubIsReference covers both "Before you start" and the read-only
    // blocks an assignment can now carry (a letter, a text, a class profile).
    if (s.type==='text' && !hubIsReference(s) && snap.text && snap.text[i]) {
      out += `<div class="roundlabel" data-sec="${i}">${esc(s.label)}</div><div class="mloc" data-loc="t${i}" data-round="${round || ''}" data-sec="${i}"><div class="readonly">${hubHeadHTML(snap.text[i], s.heads)}</div><div class="mgut"></div></div>`;
    } else if (s.type==='picker' && snap.picked && snap.picked[i]) {

      out += `<div class="roundlabel">${esc(s.label)}</div><div class="readonly">${hubPickerCats(s).map(c =>
        `${esc(c.label)}: ${((c.fixed ? c.options : (p[c.key] || [])).map(esc).join(', ')) || '\u2014'}`).join('\n')}</div>`;
    } else if (s.type==='fields' && snap.fields) {
      const items = (snap.picked && (function(){ for(let j=i-1;j>=0;j--){ if(a.sections[j].type==='picker'){ return hubPickedItems(a.sections[j], snap.picked[j]); } } return []; })());
      (items||[]).forEach((item, ii) => {
        out += `<div class="roundlabel" data-sec="${i}">${esc(s.label)} \u2014 ${esc(item)}</div>`;
        s.fields.forEach((f,fi) => {
          const v = snap.fields[`s${i}_i${ii}_f${fi}`];
          if (v) out += `<div class="mloc" data-loc="f:s${i}_i${ii}_f${fi}" data-round="${round || ''}" data-sec="${i}" data-field="${esc(f.label)}"><div class="readonly"><strong>${esc(f.label)}:</strong> ${nl2br(v)}</div><div class="mgut"></div></div>`;
        });
      });
    } else if (s.type==='declaration' && snap.decl && snap.decl[i]) {
      const d = snap.decl[i];
      out += `<div class="roundlabel">Declaration</div><div class="readonly">${s.items.map((it,ci)=>`${d.checks[ci]?'\u2611':'\u2610'} ${esc(it)}`).join('\n')}${s.aiToggle?`\nAI used: ${d.aiUsed==='yes'?('Yes \u2014 '+esc(d.aiPurpose)+' \u2014 '+esc(d.aiLink)):'No'}`:''}</div>`;

/* RESUBMISSION, SIDE BY SIDE (17 Oct 2026). Section by section: her first
   answer, with your first-round margin comments still on it, beside the
   amber resubmission, the changed words lightly marked in both. A section
   whose criteria were all Met the first time was locked on her side and
   carried forward; it folds here with a note saying so. On a phone the two
   stack, first above resubmission. */
function wordDiff(x, y){
  const A = String(x || '').split(/(\s+)/), B = String(y || '').split(/(\s+)/);
  const n = A.length, m = B.length;
  if (n * m > 4000000) return [nl2br(x), nl2br(y)];
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, oa = '', ob = '';
  const w = (t, tag) => /^\s+$/.test(t) ? nl2br(t) : `<${tag}>${nl2br(t)}</${tag}>`;
  while (i < n && j < m) {
    if (A[i] === B[j]) { oa += nl2br(A[i]); ob += nl2br(B[j]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { oa += w(A[i], 'del'); i++; }
    else { ob += w(B[j], 'ins'); j++; }
  }
  while (i < n) oa += w(A[i++], 'del');
  while (j < m) ob += w(B[j++], 'ins');
  return [oa, ob];
}
/* IS IT THEIR OWN WORK? (Ramy, 25 Oct 2026: "anything to do with another assignment
   that was maybe written on Lite, like other courses ... anything that's been published
   online"). Three passes, each pressed by the tutor, none of them marking anything:
   similar (every other assignment on Lite, by runs of eight words; the other trainee
   never named), webCheck (six distinctive sentences through a Google search key),
   aiCheck (the pairs the first pass found, read for paraphrase). The store refuses the
   last two on a demo course, so nothing leaves Lite there. */
function checkCard(sub){
  const round = sub.sub2 ? 'sub2' : 'sub1';
  return `<div class="card mk-check" id="checkCard"><h2>Is it their own work?</h2>
    <p class="note" style="margin:0 0 10px;">Three passes, when you press: every other assignment on Lite, by shared runs of words; the web, sentence by sentence; then paraphrase between any pair the first pass finds. It marks nothing and names nobody. What it finds is for you to read.</p>
    <div class="actions" style="margin:0; justify-content:flex-start;"><button type="button" class="btn btn-quiet" id="ownCheck" data-round="${round}">Check this assignment</button><span class="note" id="checkState"></span></div>
    <div id="checkOut"></div>
    <div id="flagsOut">${flagsHTML(sub, round)}</div></div>`;
}
/* ATTACHED TO THE RECORD (Ramy, 25 Oct 2026: "the plagiarized section should be attached to the
   assignment ... and then returned to the trainee as view-only, so everyone can see it, trainee and
   assessor; and then the letter is just the letter"). A passage the tutor attaches is kept on the
   assignment itself (sub.flags[round]) and travels with it: the marked record marks the passage in
   the text and lists where it was found, the trainee's page lists it under the feedback, the
   assessor's pack counts it. Where it was found names a course and a center, never a person. */
function flagsOf(sub, round){ return ((sub.flags || {})[round] || []).filter(Boolean); }
function whereHTML(f){
  if (f.kind === 'web') return 'On the web: <a href="' + esc(f.link || '') + '" target="_blank" rel="noopener">' + esc(f.title || f.link || '') + '</a>';
  if (f.kind === 'paraphrase') return 'Says the same, in other words, as a passage in ' + esc(f.course || 'another course') + (f.centre ? ' (' + esc(f.centre) + ')' : '') + ', ' + esc((NAMES[f.code] || String(f.code || '').toUpperCase())) + (f.pair ? ': <em>\u201C' + esc(f.pair) + '\u201D</em>' : '') + (f.note ? ' \u2014 ' + esc(f.note) : '');
  return 'Also in ' + esc((NAMES[f.code] || String(f.code || '').toUpperCase())) + ' on ' + esc(f.course || 'another course') + (f.centre ? ' (' + esc(f.centre) + ')' : '') + (f.round === 'sub2' ? ', the resubmission' : '') + (f.pct ? ' \u00b7 ' + f.pct + '% of this text shared' : '');
}
function flagsHTML(sub, round){
  const l = flagsOf(sub, round); if (!l.length) return '';
  return `<h3 class="mk-h3">Attached to the record \u00b7 ${l.length}</h3><p class="note" style="margin:0 0 6px;">These go back with the assignment: marked in the text on the record, listed under the feedback for the trainee, counted in the assessor\u2019s pack.</p>` +
    l.map((f, i) => `<div class="mk-match mk-flag"><blockquote>${esc(f.quote)}</blockquote><div class="mk-where">${whereHTML(f)}</div><button type="button" class="btn btn-quiet sm mk-unflag" data-i="${i}">Take it off the record</button></div>`).join('');
}
function attachBtn(obj){ return `<button type="button" class="btn btn-quiet sm mk-attach" data-flag="${encodeURIComponent(JSON.stringify(obj))}">Attach to the record</button>`; }
function addFlag(obj){
  const sub = subFor(CURRENT); const round = obj.round0 || (sub.sub2 ? 'sub2' : 'sub1'); delete obj.round0;
  sub.flags = sub.flags || {}; sub.flags[round] = sub.flags[round] || [];
  if (sub.flags[round].some(f => f.quote === obj.quote && f.kind === obj.kind)) return;
  let by = ''; try { by = localStorage.getItem('chub:tutorName') || ''; } catch (e) {}
  sub.flags[round].push(Object.assign({ at: new Date().toISOString(), by }, obj)); saveSubs();
  const out = $('flagsOut'); if (out) out.innerHTML = flagsHTML(sub, round);
}
function removeFlag(i){
  const sub = subFor(CURRENT); const round = sub.sub2 ? 'sub2' : 'sub1';
  if (sub.flags && sub.flags[round]) sub.flags[round].splice(i, 1); saveSubs();
  const out = $('flagsOut'); if (out) out.innerHTML = flagsHTML(sub, round);
}
document.addEventListener('click', e => {
  const a = e.target.closest('.mk-attach'); if (a) { try { addFlag(JSON.parse(decodeURIComponent(a.dataset.flag))); a.textContent = 'Attached'; a.disabled = true; } catch (err) {} return; }
  const r = e.target.closest('.mk-unflag'); if (r) removeFlag(+r.dataset.i);
});
async function runCheck(round){
  const out = $('checkOut'), st = $('checkState'), b = $('ownCheck'); if (!out) return;
  const S = window.HubStore, body = { code: CURRENT, round, token: TRAINEE_ID };
  const name = c => NAMES[c] || String(c || '').toUpperCase();
  b.disabled = true; st.textContent = 'Reading every assignment on Lite…'; out.innerHTML = '';
  let sim = null;
  try { sim = await S.call(Object.assign({ op: 'similar' }, body)); }
  catch (e) { out.innerHTML = `<p class="note">It could not be compared: ${esc(e.message)}</p>`; b.disabled = false; st.textContent = ''; return; }
  let html = `<h3 class="mk-h3">Across Lite</h3>`;
  if (!sim.matches.length) html += `<p class="note">Compared with ${sim.compared} other submission${sim.compared === 1 ? '' : 's'}. Nothing shared beyond the brief's own phrases and the references everyone cites.</p>`;
  else html += sim.matches.map(m => `<div class="mk-match"><b>${esc(m.course)}${m.centre ? ' · ' + esc(m.centre) : ''}</b> · ${esc(name(m.code))}${m.round === 'sub2' ? ' (resubmission)' : ''} · ${m.shared} shared run${m.shared === 1 ? '' : 's'} of eight words, ${m.pct}% of this text${m.sameCourse ? ' · <span class="mk-same">same course</span>' : ''}${m.passages.map(x => `<blockquote>${esc(x)}</blockquote>${attachBtn({ kind:'lite', quote:x, course:m.course, centre:m.centre || '', code:m.code, round:m.round, pct:m.pct, round0: round })}`).join('')}</div>`).join('');
  out.innerHTML = html;
  st.textContent = 'Searching the web…';
  html += `<h3 class="mk-h3">On the web</h3>`;
  try {
    const web = await S.call(Object.assign({ op: 'webCheck' }, body));
    if (web.off) html += `<p class="note">Web search is not switched on. The owner adds a Brave Search key in the console.</p>`;
    else if (!web.found) html += `<p class="note">${web.checked} distinctive sentences searched in quotation marks. None found on a page in Brave Search's index.</p>`;
    else html += web.sentences.filter(x => x.hits.length).map(x => `<div class="mk-match"><blockquote>${esc(x.sentence)}</blockquote>${x.hits.map(h => `<div class="mk-hit"><a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.title || h.link)}</a><span>${esc(h.snippet)}</span>${attachBtn({ kind:'web', quote:x.sentence, link:h.link, title:h.title || '', round0: round })}</div>`).join('')}</div>`).join('') + `<p class="note">${web.found} of ${web.checked} sentences found. A lead, not proof: open the page and read it. Web results by Brave Search.</p>`;
  } catch (e) { html += `<p class="note">${esc(e.message)}</p>`; }
  out.innerHTML = html;
  if (sim.matches.length) {
    st.textContent = 'Reading the pairs for paraphrase…';
    html += `<h3 class="mk-h3">Paraphrase</h3>`;
    try {
      const ai = await S.call(Object.assign({ op: 'aiCheck' }, body));
      if (ai.off) html += `<p class="note">The paraphrase pass is not switched on. The owner adds a Claude key in the console.</p>`;
      else if (!ai.results.length) html += `<p class="note">${esc(ai.note || 'Nothing to read.')}</p>`;
      else html += ai.results.map(r => `<div class="mk-match"><b>${esc(r.course)}</b> · ${esc(name(r.code))}${r.round === 'sub2' ? ' (resubmission)' : ''}: ${r.error ? 'could not be read (' + esc(r.error) + ')' : r.verdict === 'none' ? 'nothing beyond the brief' : r.verdict === 'substantial' ? 'substantial paraphrase' : r.verdict === 'some' ? 'some paraphrase' : esc(r.raw || 'no answer')}${(r.pairs || []).map(x => `<div class="mk-pair"><blockquote>${esc(x.a)}</blockquote><blockquote>${esc(x.b)}</blockquote><span class="note">${esc(x.note)}</span>${attachBtn({ kind:'paraphrase', quote:x.a, pair:x.b, note:x.note || '', course:r.course, centre:r.centre || '', code:r.code, round:r.round, round0: round })}</div>`).join('')}</div>`).join('');
    } catch (e) { html += `<p class="note">${esc(e.message)}</p>`; }
    out.innerHTML = html;
  }
  st.textContent = 'Checked at ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '.';
  b.disabled = false; b.textContent = 'Check again';
}
document.addEventListener('click', e => { const b = e.target.closest('#ownCheck'); if (b) runCheck(b.dataset.round); });

function compareRounds(a, sub){
  const s1 = sub.sub1 || {}, s2 = sub.sub2 || {}, m1 = sub.criteriaMarks.sub1 || [];
  const locked = i => { const cs = (a.criteria || []).map((c, ci) => ({ c, ci })).filter(x => x.c.sectionIndex === i); return cs.length > 0 && cs.every(x => m1[x.ci] === true); };
  const pair = (loc, sec, field, label, v1, v2) => {
    const same = String(v1 || '') === String(v2 || '');
    const [h1, h2] = same ? [nl2br(v1), nl2br(v2)] : wordDiff(v1, v2);
    const lab = label ? `<strong>${esc(label)}:</strong> ` : '';
    return `<div class="mk-pair${same ? ' same' : ''}">
      <div class="mloc" data-loc="${loc}" data-round="sub1" data-sec="${sec}"${field ? ` data-field="${esc(field)}"` : ''}><div class="mk-pl">First submission</div><div class="readonly">${lab}${h1 || '<span class="note">Nothing written.</span>'}</div><div class="mgut"></div></div>
      <div class="mloc mk-r2" data-loc="${loc}" data-round="sub2" data-sec="${sec}"${field ? ` data-field="${esc(field)}"` : ''}><div class="mk-pl">Resubmission${same ? ': unchanged' : ''}</div><div class="readonly">${lab}${h2 || '<span class="note">Nothing written.</span>'}</div><div class="mgut"></div></div>
    </div>`;
  };
  let out = `<div class="card mk-round mk-compare"><h2>First submission and resubmission</h2>
    <p class="note" style="margin:0 0 12px;">Section by section. Words she changed are marked in both: struck through in the first, underlined in the resubmission.</p>`;
  a.sections.forEach((s, i) => {
    if (s.type === 'text' && !hubIsReference(s)) {
      const v1 = (s1.text || {})[i], v2 = (s2.text || {})[i];
      if (!v1 && !v2) return;
      out += `<div class="roundlabel" data-sec="${i}">${esc(s.label)}</div>`;
      if (locked(i)) { out += `<details class="mk-carried"><summary>Met the first time, so carried forward unchanged</summary><div class="readonly">${nl2br(v1)}</div></details>`; return; }
      out += pair('t' + i, i, '', '', v1, v2);
    } else if (s.type === 'fields') {
      const picked = (snap) => { for (let j = i - 1; j >= 0; j--) if (a.sections[j].type === 'picker') return hubPickedItems(a.sections[j], (snap.picked || {})[j]); return []; };
      const items = picked(s2).length ? picked(s2) : picked(s1);
      items.forEach((item, ii) => {
        out += `<div class="roundlabel" data-sec="${i}">${esc(s.label)} \u2014 ${esc(item)}</div>`;
        if (locked(i)) { out += `<details class="mk-carried"><summary>Met the first time, so carried forward unchanged</summary>${s.fields.map((f, fi) => { const v = (s1.fields || {})[`s${i}_i${ii}_f${fi}`]; return v ? `<div class="readonly"><strong>${esc(f.label)}:</strong> ${nl2br(v)}</div>` : ''; }).join('')}</details>`; return; }
        s.fields.forEach((f, fi) => {
          const k = `s${i}_i${ii}_f${fi}`, v1 = (s1.fields || {})[k], v2 = (s2.fields || {})[k];
          if (v1 || v2) out += pair('f:' + k, i, f.label, f.label, v1, v2);
        });
      });
    }
  });
  return out + `</div>`;
}

function render(){
  /* Every door into this screen -- the dashboard's rows, the tracker's actions
     -- carries ?trainee=. Reached without one (a stale bookmark, a hand-typed
     URL), this used to fall through to connect_assignment_submissions_v1, which
     is a TRAINEE's own key and means nothing in a tutor's browser: an empty
     mark sheet under the assignment's real name, which a tutor could type marks
     into for nobody. Found walking the tutor role, 21 Sep 2026. */
  if (!TRAINEE_ID) {
    $('picker').innerHTML = '';
    $('app').innerHTML =
      '<div style="max-width:560px; padding:26px 0;">' +
      '<h2 style="margin:0 0 10px; font-family:\'Newsreader\',Georgia,serif; font-weight:600; font-size:1.3rem;">Which trainee’s work?</h2>' +

  }

  if (CURRENT === 'a5' && !a5InPlay(SUBS)){ $('app').innerHTML = '<div class="card"><p class="note">Assignment 5 has not been set for this trainee. Set it from the assignment where the plagiarism was found.</p></div>'; return; }

  let html = `<div class="header mk-head"><div class="mk-hmain"><p class="eyebrow">Written assignment · ${esc(CURRENT === 'a5' ? 'Assignment 5' : CURRENT.toUpperCase())}</p><h1>${esc(a.title)}</h1>

  let left = '', right = '', markerHtml = '', markerInlineHtml = '';   /* left: the work. right: the front page. */
  if (sub.stage !== 'draft') {
    /* Handbook 9.2.1: materials prepared for the language related task and the

       It used to compare against `tp.plan` ALONE -- the one live plan -- so it
       could see roughly one lesson out of eight, and a tutor who had watched
       it fire once would read its silence as clearance. Every returned lesson
       keeps its own plan at state.doc.plan, so the whole course is in reach
       (audit, 29 Sep 2026). Both submission rounds are checked, not just the

    let overlapFlag = '';

    try { if (!/^(lrt|lsrt)$/.test(CURRENT)) throw 0;

    const markerInner = `<h3 class="mk-mh">Marker record</h3>

    /* Ramy, 18 Oct 2026: "the marker record... I'm not sure why it's sitting on the right".

    markerHtml = (sub.stage === 'submitted' || sub.stage === 'resubmitted') ? '' : `<div class="card mk-marker">${markerInner}</div>`;
    markerInlineHtml = (sub.stage === 'submitted' || sub.stage === 'resubmitted') ? `<div class="mk-markers">${markerInner}</div>` : '';
  }

  if (sub.stage === 'draft') {
    html += `<div class="card"><p class="note">Nothing to mark yet \u2014 the trainee hasn\u2019t submitted this assignment.</p></div>`;
  } else {
    if (sub.sub2) left += compareRounds(a, sub);
    else left += `<div class="card mk-round"><h2>First submission</h2>${summarize(a, sub.sub1, 'sub1')}</div>`;
    left += checkCard(sub);
    if (sub.feedback && sub.feedback.outcome) {
      right += `${sub.stage === 'closed' ? '<div class="card"><h2>Marked and returned</h2><p class="mk-how" style="margin:0;">This assignment is finished. The work and your feedback are kept here as the record; there is nothing to do.</p></div>' : ''}<div class="card"><h2>Your feedback</h2><div class="readonly">${esc(sub.feedback.outcome)}${sub.feedback.generalComment1?('\n\n'+nl2br(sub.feedback.generalComment1)):''}${sub.feedback.generalComment2?('\n\n'+nl2br(sub.feedback.generalComment2)):''}</div></div>`;

    if (sub.stage === 'resubmission_needed' || sub.stage === 'returned_unmarked') {

      const crit1 = (a.criteria||[]), m1 = sub.criteriaMarks.sub1 || [], c1 = sub.criteriaComments.sub1 || [];
      if (crit1.length && (m1.length || c1.some(Boolean))) {
        right += `<div class="card"><h2>Assessment criteria <small style="font-family:'Karla',sans-serif;font-size:0.8rem;font-weight:500;color:var(--grey)">first submission, as marked</small></h2>
          ${crit1.map((c,i)=>{ const m=m1[i]; const cls=m===true?'met':m===false?'not':''; const label=m===true?'Met':m===false?'Not met':'Not marked';
            return `<div class="critrow" style="flex-direction:column; align-items:stretch;"><div class="critline"><div class="txt">${esc(c.text)}</div><span class="crit-toggle ${cls}" style="cursor:default">${label}</span></div>${c1[i] ? `<div class="readonly" style="margin:8px 0 0">${nl2br(c1[i])}</div>` : ''}</div>`; }).join('')}

      }
      right += `<div class="card"><p class="note">${sub.stage === 'returned_unmarked' ? 'Returned unmarked \u2014 waiting on the trainee to submit again.' : 'Waiting on the trainee to resubmit \u2014 nothing more to mark until they do.'}</p></div>`;
    } else if (sub.stage === 'submitted' || sub.stage === 'resubmitted') {
      const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
      const crit = (a.criteria||[]);
      const marks = sub.criteriaMarks[round];
      const allMarked = crit.length>0 && crit.every((c,i)=>marks[i]===true||marks[i]===false);
      const allMet = allMarked && crit.every((c,i)=>marks[i]===true);
      let derivedLabel, derivedCls;
      if (!allMarked) { derivedLabel = 'Mark every criterion to see the outcome'; derivedCls='pending'; }
      else {
        /* The SAME rule the save uses -- outcomeFor(). This pill used to work
           the answer out for itself and keyed only on the round, so for a
           trainee who had already used their one resubmission it read
           "Resubmission needed" while the note directly above it said the

           the assignment. The tutor was shown one decision and made another,
           on a trainee's pass or fail (walk, 21 Sep 2026). */
        derivedLabel = outcomeFor(round, allMet, sub);
        derivedCls = /^Pass/.test(derivedLabel) ? 'pass' : 'fail';
      }

      /* The resubmission-window note (may run past the course end, Handbook 9.2.3)

      const guide = window.hubGuidance ? hubGuidance(CURRENT) : null;
      /* The hidden word (17 Oct 2026): found anywhere in either round. */
      const trapHit = !!(a.trap && window.hubTrapFound && hubTrapFound(a.trap, sub));
      const gBox = (title, text, cls) => text ? `<details class="guide-box g-link${cls ? ' ' + cls : ''}"><summary>${title}</summary><div class="gb">${hubGuidanceHTML(text)}</div></details>` : '';
      right += `<div class="card mk-crit" id="mkCrit"><h2>Front page</h2>

        <div class="mk-cgrid"><div class="mk-cleft">
        ${mv2HTML(crit, marks)}
        ${sub.stage==='submitted' && sub.usedResubmission ? '<p class="note">This trainee has already used their one resubmission for this assignment \u2014 any criterion Not met here is a final Fail.</p>' : ''}
        ${crit.length ? crit.map((c,i)=>{
          const m = marks[i];
          const cls = m===true?'met':m===false?'not':'';
          const label = m===true?'Met':m===false?'Not met':'Not yet marked';
          const cm = (sub.criteriaComments[round]||[])[i] || '';
          /* Marking a RESUBMISSION is the act of checking whether what you

          const prevMark = round==='sub2' ? (sub.criteriaMarks.sub1||[])[i] : undefined;
          const prevComment = round==='sub2' ? ((sub.criteriaComments.sub1||[])[i] || '') : '';
          const prevLine = prevMark===undefined && !prevComment ? '' :
            `<div class="note" style="margin:6px 0 0; padding:6px 9px; border-radius:6px; background:var(--sand); font-size:0.78rem; line-height:1.5;">

            ${prevLine}
            <div class="mk-linked" data-linked="${i}"></div>
            <button type="button" class="mk-addnote" data-addnote="${i}"${cm ? ' hidden' : ''}>Add a note</button>
            <textarea data-crit-comment="${i}" rows="2" placeholder="Why, in a sentence or two. The trainee reads this." style="margin-top:8px;"${cm ? '' : ' hidden'}>${esc(cm)}</textarea>
          </div>`;
        }).join('') : '<p class="note">No marking criteria set for this assignment yet \u2014 add them in the assignment builder.</p>'}
        </div><div class="mk-cright">
        <div class="derived ${derivedCls}">${derivedLabel}</div>
        <div class="xchg" id="xchg">
          <div class="xchg-acts">
            <button type="button" class="btn btn-gold" id="xCopy">Copy</button>
            <span class="note" style="margin:0;">the submission and the criteria, as text.</span>
            <button type="button" class="btn btn-quiet" id="xPasteToggle" style="margin-left:auto;">Paste something back</button>
            <button type="button" class="btn btn-quiet" id="xDocx" title="A Word file (.docx) with comments on the side: download your Google Doc as Word and bring it here">Bring back a Word file</button>
            <input type="file" id="xDocxFile" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
          </div>
          <div id="xPaste" style="display:none; margin-top:12px;">
            <textarea id="xText" rows="4" placeholder="Paste here — it goes straight into the criteria. The outcome is still worked out from the marks."></textarea>
          </div>
          <p class="note" id="xDone" style="display:none; margin:8px 0 0;"></p>
        </div>
        <div class="row" style="margin-top:12px;"><label>General comment${round==='sub2'?' on the resubmission':''} (optional)</label>
          <textarea id="comment" rows="3" placeholder="Anything that does not belong to one criterion.">${esc((sub.feedback&&(round==='sub2'?sub.feedback.generalComment2:sub.feedback.generalComment1))||'')}</textarea></div>
        ${markerInlineHtml}
        <div class="actions">
          <button type="button" class="btn btn-quiet" id="unmarkedBtn">Return unmarked</button>
          <button class="btn btn-teal" id="saveBtn" ${allMarked?'':'disabled'}>Save & return to trainee</button>
        </div>
        </div></div>
      </div>`;
    }
  }

  if (left || right) {
    const marking = sub.stage === 'submitted' || sub.stage === 'resubmitted';
    html += `<section class="mk-cover" id="mkPanel" aria-label="Front page">${right}${markerHtml}</section>`;
    html += `<div class="mk-help" id="mkHelp"></div>`;
    html += `<div class="mk-work" id="mkWork">${left}</div>`;
  }
  if (CX) html += hubConnectFooter();
  $('app').innerHTML = html;
  if (window.hubMarking) hubMarking.afterRender({ key: CURRENT, trainee: TRAINEE_ID, a, sub, round: sub.stage === 'resubmitted' ? 'sub2' : 'sub1', marking: sub.stage === 'submitted' || sub.stage === 'resubmitted', guide: window.hubGuidance ? hubGuidance(CURRENT) : null, save: saveSubs, rerender: render,
    setNote: (i, v) => { const r = sub.stage === 'resubmitted' ? 'sub2' : 'sub1'; sub.criteriaComments[r] = sub.criteriaComments[r] || []; sub.criteriaComments[r][i] = v; saveSubs(); },
    setMark: (i, v) => { const r = sub.stage === 'resubmitted' ? 'sub2' : 'sub1'; sub.criteriaMarks[r][i] = v; saveSubs(); render(); },
    outcome: () => { const r = sub.stage === 'resubmitted' ? 'sub2' : 'sub1', cr = a.criteria || [], mk = sub.criteriaMarks[r] || []; const all = cr.length > 0 && cr.every((c, i) => mk[i] === true || mk[i] === false); return all ? outcomeFor(r, cr.every((c, i) => mk[i] === true), sub) : ''; }, me: (function(){ try { return localStorage.getItem('chub:tutorName') || ''; } catch (e) { return ''; } })() });
  document.querySelectorAll('[data-crit]').forEach(b => b.addEventListener('click', () => {
    const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';

    const cur = sub.criteriaMarks[round][i];
    sub.criteriaMarks[round][i] = cur===true ? false : cur===false ? null : true;

  }));
  const saveBtn = $('saveBtn');
  if (saveBtn) saveBtn.addEventListener('click', doSave);
  const unmarkedBtn = $('unmarkedBtn');
  if (unmarkedBtn) unmarkedBtn.addEventListener('click', doReturnUnmarked);

  const extBtn = $('extSet');
  if (extBtn) extBtn.addEventListener('click', () => {
    const v = ($('extAt') || {}).value;

  if (extClr) extClr.addEventListener('click', () => setExtension(subFor(CURRENT), ''));

  const setBtn = $('a5SetBtn');
  if (setBtn) setBtn.addEventListener('click', async () => {
    if (!(await confirmModal('Set Assignment 5, the plagiarism reflection, for this trainee? It appears in their assignment list once you return this file to them.', 'Set Assignment 5'))) return;
    const a5 = subFor('a5');

    saveSubs(); renderPicker(); render();
  });
  const wBtn = $('a5WithdrawBtn');
  if (wBtn) wBtn.addEventListener('click', async () => {
    if (!(await confirmModal('Withdraw Assignment 5 for this trainee? Nothing has been submitted for it.', 'Withdraw'))) return;
    delete SUBS.a5;

  });
  const m1 = $('marker1'), m2 = $('marker2');
  // First marker defaults to the tutor's own name from the dashboard.
  try{ const tn=localStorage.getItem('chub:tutorName'); if(m1 && tn && !m1.value){ m1.value=tn; sub.markers.first=tn; saveSubs(); } }catch(e){}
  if (m1) m1.addEventListener('input', () => { sub.markers.first = m1.value; saveSubs(); });
  if (m2) m2.addEventListener('input', () => { sub.markers.second = m2.value; sub.markers.doubleMarked = !!m2.value.trim(); saveSubs(); });
  /* Comments keep as they are typed. Until 24 Sep 2026 only Save read them,
     and render() rebuilds the whole form on every pill click -- so a comment
     typed on criterion 1 vanished the moment criterion 2 was marked, and a
     tutor who switched trainee lost everything but the pills. */
  const rnd = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
  document.querySelectorAll('[data-crit-comment]').forEach(el => el.addEventListener('input', () => {
    sub.criteriaComments[rnd] = sub.criteriaComments[rnd] || [];

  }));
  const gc = $('comment');
  if (gc) gc.addEventListener('input', () => {
    if (!sub.feedback) sub.feedback = { outcome:'', generalComment1:'', generalComment2:'' };
    sub.feedback[rnd==='sub2' ? 'generalComment2' : 'generalComment1'] = gc.value; saveSubs();
  });
}

function doSave(){
  const sub = subFor(CURRENT);
  const a = WORDING[CURRENT];
  const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
  const crit = (a.criteria||[]);
  const marks = sub.criteriaMarks[round];
  const allMet = crit.length>0 && crit.every((c,i)=>marks[i]===true);
  const comment = $('comment').value;
  sub.criteriaComments[round] = crit.map((c,i)=>{ const el=document.querySelector(`[data-crit-comment="${i}"]`); return el?el.value:''; });
  if (!sub.feedback) sub.feedback = { outcome:'', generalComment1:'', generalComment2:'' };

  sub[round === 'sub2' ? 'marked2At' : 'marked1At'] = new Date().toISOString();
  if (round === 'sub2') sub.feedback.generalComment2 = comment;
  else sub.feedback.generalComment1 = comment;
  sub.feedback.outcome = outcomeFor(round, allMet, sub);
  sub.stage = sub.feedback.outcome === 'Resubmission needed' ? 'resubmission_needed' : 'closed';
  saveSubs();
  render();
}

/* What this marking comes to, in the words the trainee will see. Read by the
   pill the tutor is looking at AND by the save, so the screen cannot promise
   one outcome and record another. Handbook 9.2.3, not 9.2.2 (checked against
   the June 2025 Administration Handbook, 21 Sep 2026): 9.2.2 is "Providing
   support for written assignments"; the one-occasion rule is in 9.2.3, which
   says trainees must have the opportunity, within the time span of the
   course, to resubmit "on one occasion only for each assignment". Once it is
   used, a criterion not met is a Fail, not another chance. */
/* ---- v3 (7 Oct 2026): the tally strip ------------------------------------
   One segment per criterion, in order, colored by its mark, over a count.
   A segment is a door to its criterion. Reads the marks render() already
   has; writes nothing. */
/* The phone's bar: how far the marking has got, and a jump between the work
   and the criteria. */
function mkBarLabel(a, sub){
  const round = sub.stage === 'resubmitted' ? 'sub2' : 'sub1', n = (a.criteria || []).length;
  const done = (sub.criteriaMarks[round] || []).filter(v => v === true || v === false).length;
  return 'Mark: ' + done + ' of ' + n + ' done';
}
let MK_BACK = null;
document.addEventListener('click', e => {
  if (!e.target.closest || !e.target.closest('#mkJump')) return;
  const crit = $('mkCrit'); if (!crit) return;
  const top = crit.getBoundingClientRect().top;
  if (MK_BACK != null && top < innerHeight && top > -crit.offsetHeight) { window.scrollTo({ top: MK_BACK, behavior: 'smooth' }); MK_BACK = null; return; }
  MK_BACK = window.scrollY; crit.scrollIntoView({ block: 'start', behavior: 'smooth' });
});
function mv2HTML(crit, marks){
  if (!crit || !crit.length) return '';
  const m = i => (marks || [])[i];
  const met = crit.filter((c, i) => m(i) === true).length, not = crit.filter((c, i) => m(i) === false).length, left = crit.length - met - not;
  return '<div class="mv2"><div class="mv2-segs">' + crit.map((c, i) => {
      const st = m(i) === true ? 'met' : m(i) === false ? 'not' : '';
      return '<button type="button" class="mv2-seg ' + st + '" data-mv2="' + i + '" title="' + esc((i + 1) + '. ' + c.text) + '" aria-label="' + esc('Criterion ' + (i + 1) + ': ' + (st === 'met' ? 'Met' : st === 'not' ? 'Not met' : 'not yet marked')) + '"><b>' + (i + 1) + '</b><small>' + (st === 'met' ? 'Met' : st === 'not' ? 'Not met' : 'To mark') + '</small></button>';
    }).join('') + '</div><p class="mv2-n"><span class="met"><b>' + met + '</b> met</span><span class="not"><b>' + not + '</b> not met</span><span><b>' + left + '</b> to mark</span></p></div>';
}
document.addEventListener('click', e => {

function outcomeFor(round, allMet, sub){
  if (round === 'sub2') return allMet ? 'Pass (on resubmission)' : 'Fail (on resubmission)';
  if (allMet) return 'Pass';
  return sub.usedResubmission ? 'Fail' : 'Resubmission needed';
}

function doReturnUnmarked(){
  const sub = subFor(CURRENT);
  const comment = $('comment').value;
  if (!sub.feedback) sub.feedback = { outcome:'', generalComment1:'', generalComment2:'' };
  const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
  // Returned unmarked does NOT spend the one resubmission (Handbook 9.2.3;
  // DESIGN-HANDOFF-README's core rule). It used to set resubmission_needed,
  // and the trainee's next submit then counted as their resubmission -- so an
  // incomplete first attempt sent back for a missing section cost them their
  // only second chance (Hub walk, 20 Sep 2026). The round stays what it was:
  // the trainee edits what they sent, declares again, and submits it again.
  if (round==='sub2') {
    sub.feedback.generalComment2 = 'Returned unmarked: ' + comment;
    sub.stage = 'resubmission_needed';
    sub.draft = Object.assign({}, sub.sub2 || {}, { decl:{} });
    sub.round2Seeded = true;
  } else {
    sub.feedback.generalComment1 = 'Returned unmarked: ' + comment;
    sub.stage = 'returned_unmarked';
    sub.draft = Object.assign({}, sub.sub1 || {}, { decl:{} });
  }
  sub.criteriaMarks[round] = [];
  sub.feedback.outcome = 'Returned unmarked';
  saveSubs();
  render();
}

/* ---- the exchange for a marked assignment (hub-exchange.js) ----
   Slots: one per criterion (first line Met / Not met, then the comment), and
   the general comment. The OUTCOME is never a slot: outcomeFor() derives it
   from the marks under the Handbook's rule, and an AI must not be able to
   award a pass. */
function xSlotsFor(a){
  const crit = (a.criteria||[]);
  return crit.map((c,i)=>({ id:'crit'+i, heading:'Criterion '+(i+1)+' \u2014 '+String(c.text||'').replace(/\s+/g,' ').trim() }))
    .concat([{ id:'comment', heading:'General comment' }]);
}
function xWho(){
  /* NAMES maps assignment keys to labels; a person's name lives on the roster. */
  const tr = TRAINEE_ID && loadRoster().trainees[TRAINEE_ID];
  return (tr && tr.name) || 'trainee';
}
function xSubmissionMd(a, sub, round){
  const snap = round==='sub2' ? sub.sub2 : sub.sub1;
  const md = [];
  md.push('# Assignment \u2014 ' + xWho() + ', ' + (a.title||CURRENT.toUpperCase()) + (round==='sub2' ? ' (resubmission)' : ''));
  md.push('');
  const div = document.createElement('div'); div.innerHTML = summarize(a, snap);
  // the on-screen summary, as text: each label becomes a heading, each body a paragraph
  div.querySelectorAll('.roundlabel, .readonly').forEach(n => {
    if (n.classList.contains('roundlabel')) md.push('### ' + n.textContent.trim());
    else { md.push(n.textContent.trim()); md.push(''); }   /* textContent: innerText is empty on a node that is not in the page */
  });
  return md.join('\n');
}
function xBrief(a, sub, round){
  const sl = xSlotsFor(a);
  const md = [xSubmissionMd(a, sub, round), '---', '', '# Marking \u2014 fill in below', '',
    'You are helping a CELTA tutor mark the written assignment above against its criteria. The tutor will dictate. Under each criterion write, on the first line, exactly "Met" or "Not met", then the tutor\u2019s comment to the trainee (second person, specific). Keep every heading exactly as it is. Leave a criterion empty if the tutor has not decided.', '',
    'To comment on the work itself, put a line starting with >> right under the paragraph it is about, with the exact words in quotes, then the comment: >> "the exact words": your comment. Start the comment with "Good:" or "To work on:" if it is one of those.', ''];
  sl.forEach(s => { md.push('## ' + s.heading); md.push(''); md.push(''); });
  md.push('<!-- lite:slots ' + JSON.stringify(sl.map(s=>[s.id,s.heading])) + ' -->');
  return md.join('\n');
}
function wireExchange(){
  const card = $('xchg'); if (!card || !window.HubExchange) return;
  const a = WORDING[CURRENT], sub = subFor(CURRENT);
  const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
  let PENDING = null;
  /* what the last read placed in the margin: a re-read replaces it, never doubles it. On window,
     because every render builds this panel afresh and a local would forget. */
  if (!window.X_LAST_PUT) window.X_LAST_PUT = { ids: [] };
  $('xCopy').addEventListener('click', ()=> hubCopyButton($('xCopy'), xBrief(a, sub, round)));
  $('xPasteToggle').addEventListener('click', ()=>{ const open = $('xPaste').style.display==='none'; $('xPaste').style.display = open?'':'none'; $('xPasteToggle').textContent = open ? 'Hide' : 'Paste something back'; if (open) $('xText').focus(); });
  $('xDocx').addEventListener('click', ()=> $('xDocxFile').click());
  $('xDocxFile').addEventListener('change', async ()=>{
    const f = $('xDocxFile').files[0]; $('xDocxFile').value = ''; if (!f) return;
    const d = $('xDone'); d.style.display = ''; d.textContent = 'Reading ' + f.name + '\u2026';
    try {
      const got = await window.hubDocxComments(f);
      if (!got.comments.length && !/Criterion \d|General comment/i.test(got.text) && !/^\s*>>/m.test(got.text) && !/[\u2713\u2714\u221a]/.test(got.text)) { d.textContent = 'There were no comments in that file. Comments made on the side of a Google Doc come with it when you download it as Word (File, Download, Microsoft Word).'; return; }
      readNow(got.text, got.comments);
    } catch (e) { d.textContent = String(e && e.message || e); }
  });
  let readTimer = null;
  $('xText').addEventListener('input', ()=>{ clearTimeout(readTimer); readTimer = setTimeout(readNow, 250); });
  document.addEventListener('paste', (e)=>{
    const t = e.target; if (t && t.closest && t.closest('input, textarea, [contenteditable]')) return;
    const txt = (e.clipboardData||window.clipboardData).getData('text/plain');
    /* A model that bolds its headings writes a reply with no '#' in it, and
       this gate swallowed the paste silently even though the reader handles
       bold (24 Sep 2026). Same two shapes the reader accepts. */
    if (!txt) return;
    if (!/^\s*#/m.test(txt) && !/^\s*(?:\*\*|__).+(?:\*\*|__)\s*:?\s*$/m.test(txt) && !/^\s*>>/m.test(txt) && !/[\u2713\u2714\u221a]/.test(txt)) {
      /* Said out loud, not ignored (Ramy, 18 Oct 2026: "I pasted and nothing happened"). */
      if (txt.length > 20) { const d = $('xDone'); if (d) { d.style.display = ''; d.textContent = 'That paste did not look like a marked reply, so nothing was filled in. A marked reply keeps its headings (\u201CCriterion 1 \u2014 \u2026\u201D, \u201CGeneral comment\u201D), and each criterion starts with Met or Not met.'; $('xchg').scrollIntoView({block:'center', behavior:'smooth'}); } }
      return;
    }
    e.preventDefault(); if ($('xPaste').style.display==='none') $('xPasteToggle').click();
    $('xText').value = txt; readNow(); $('xchg').scrollIntoView({block:'start', behavior:'smooth'});
  });
  /* Lines that start with >> are comments on the work: >> "the words": the comment,
     or >> the comment, right under the paragraph it is about (19 Oct 2026). */
  /* Ticks typed INTO the paragraph (Ramy, 19 Oct 2026: a trainer who marks in
     Word puts a ✓ after the words, not a comment on the side). Each ✓ becomes a
     tick on the words just before it, back to the last tick or the last full
     stop; ✓✓ is two ticks. Only the work is read, never the marking frame. */
  function inlineTicks(txt){
    const out = []; let body = String(txt||''); const at = body.search(/^\s*#\s+Marking\b/m); if (at >= 0) body = body.slice(0, at);
    body.split(/\r?\n/).forEach(line => {
      if (/^\s*>>/.test(line)) return;
      const re = /[\u2713\u2714\u221a]+/g; let m, from = 0;
      while ((m = re.exec(line))) {
        const before = line.slice(from, m.index); from = m.index + m[0].length;
        const parts = before.trim().split(/(?<=[.!?])\s+/); let words = parts[parts.length - 1].trim();
        const ws = words.split(/\s+/); if (ws.length > 8) words = ws.slice(-8).join(' ');
        words = words.replace(/^[\s"\u201c\u2018'(\[]+/, '').trim();
        if (words.replace(/[^a-z0-9]/gi, '').length >= 3) out.push({ anchor: words, text: '\u2713'.repeat(m[0].length) });
      }
    });
    return out;
  }
  function markerComments(txt){
    const out = []; let prev = '';
    String(txt||'').split(/\r?\n/).forEach(raw => {
      const l = raw.trim(); if (!l) return;
      const m = l.match(/^>>\s*(.*)$/);
      if (!m) { prev = l.replace(/^#+\s*/, '').replace(/[\u2713\u2714\u221a]/g, ''); return; }
      let body = m[1], anchor = prev, text = body;
      const q = body.match(/^["\u201c'\u2018](.+?)["\u201d'\u2019]\s*[:\-\u2013\u2014]?\s*([\s\S]*)$/);
      if (q) { anchor = q[1]; text = q[2]; }
      if (text.trim()) out.push({ anchor, text: text.trim() });
    });
    return out;
  }
  function readNow(srcText, sideComments){
    const txt = typeof srcText === 'string' ? srcText : $('xText').value; if (!txt.trim()) return;
    const notes = (sideComments || []).concat(markerComments(txt), inlineTicks(txt));
    const man = xSlotsFor(a); const byName = {}; man.forEach(m => byName[m.heading.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()] = m.id);
    man.forEach(m => { const mm = m.heading.match(/^(Criterion \d+)/); if (mm) byName[mm[1].toLowerCase()] = m.id; });
    const norm = h => String(h||'').toLowerCase().replace(/[\u2018\u2019\u201c\u201d"']/g,'').replace(/[^a-z0-9]+/g,' ').trim();
    let body = txt.replace(/<!--\s*lite:slots[\s\S]*?-->/g,''); const at = body.search(/^\s*#\s+Marking\b/m); if (at>=0) body = body.slice(at);
    const found = {}, unplaced = [];
    /* Same two habits as the feedback form: a model may render the slots as
       H3, or number them. Both were landing nothing here (24 Sep 2026). */
    let secs = HubExchange.sections(body);
    const named = ss => ss.some(sec => byName[norm(sec.heading)] || byName[norm((HubExchange.deNumber||(x=>x))(sec.heading))]);
    if (!named(secs)) secs = HubExchange.sections(body, true);   // the model bolded its headings
    const useLevel = HubExchange.bestLevel ? HubExchange.bestLevel(secs, byName) : 2;
    const dn = HubExchange.deNumber || (x => x);
    secs.forEach(sec => {
      if (sec.level !== useLevel) return;
      let id = byName[norm(sec.heading)] || byName[norm(dn(sec.heading))]
            || byName[norm(dn(sec.heading).split(/\s[\u2014\-\u2013]\s/)[0])];
      if (!id) { if (sec.text) unplaced.push(sec.heading); return; }
      if (!sec.text) return;
      if (id === 'comment') { found[id] = { text: sec.text }; return; }
      const ls = sec.text.split(/\r?\n/).map(l=>l.replace(/^\s*[\u2022\-*]\s*/,'').trim()).filter(Boolean);
      const first = norm(ls[0]||''); let mark = null;
      if (/^not met\b/.test(first)) mark = false; else if (/^met\b/.test(first)) mark = true;
      found[id] = { mark, text: (mark===null ? ls : ls.slice(1)).join('\n') };
    });
    const done = $('xDone'); done.style.display = '';
    const ids = Object.keys(found);
    if (!ids.length && !notes.length) { done.textContent = 'Nothing in that landed \u2014 the headings ("Criterion 1 \u2014 \u2026", "General comment") need to be kept, and a comment on the work needs a line starting with >>, a comment on the side of a Word file, or a \u2713 typed after the words.'; return; }
    /* the form as it was, for Undo */
    const before = { marks: (sub.criteriaMarks[round]||[]).slice(), comments: [...document.querySelectorAll('[data-crit-comment]')].map(el=>el.value), general: ($('comment')||{}).value || '' };
    sub.criteriaMarks[round] = sub.criteriaMarks[round] || []; sub.criteriaComments[round] = sub.criteriaComments[round] || [];
    document.querySelectorAll('[data-crit-comment]').forEach(el => { sub.criteriaComments[round][+el.dataset.critComment] = el.value; });
    if (!sub.feedback) sub.feedback = { outcome:'', generalComment1:'', generalComment2:'' };
    const gk = round==='sub2' ? 'generalComment2' : 'generalComment1';
    if (!found.comment && before.general) sub.feedback[gk] = before.general;
    ids.forEach(id => {
      if (id === 'comment') { sub.feedback[gk] = found[id].text; return; }
      const i = +id.slice(4);
      if (found[id].mark !== null) sub.criteriaMarks[round][i] = found[id].mark;
      if (found[id].text) sub.criteriaComments[round][i] = found[id].text;
    });
    saveSubs(); render();
    /* the comments on the work, into the margin beside their words */
    if (window.X_LAST_PUT.ids.length && window.hubMarking && hubMarking.removeIds) hubMarking.removeIds(window.X_LAST_PUT.ids);
    const put = (notes.length && window.hubMarking && hubMarking.placeComments) ? hubMarking.placeComments(notes) : { placed: 0, unplaced: [], ids: [] };
    window.X_LAST_PUT = put;
    const names = {}; man.forEach(m => names[m.id] = m.heading);
    const d2 = $('xDone'); d2.style.display = '';
    const nc = ids.filter(id => /^crit/.test(id)).length, gc = ids.indexOf('comment') >= 0;
    const parts = [];
    if (nc || gc) parts.push('filled ' + (nc ? nc + (nc === 1 ? ' criterion' : ' criteria') : '') + (nc && gc ? ' and ' : '') + (gc ? 'the general comment' : ''));
    const nTk = notes.filter(n => /^[\u2713\u2714\u221a]+$/.test(String(n.text||'').trim())).length, nPl = put.placed - Math.min(put.placed, nTk);
    if (nPl) parts.push('placed ' + nPl + (nPl === 1 ? ' comment' : ' comments') + ' in the margin');
    if (put.placed && nTk) parts.push('put ' + Math.min(put.placed, nTk) + (Math.min(put.placed, nTk) === 1 ? ' tick' : ' ticks') + ' on the work');
    const said = parts.join(', and ');
    d2.innerHTML = (said ? said.charAt(0).toUpperCase() + said.slice(1) + '. Check them, then save.' : '')
      + (put.unplaced.length ? ' <span class="x-unplaced">' + (put.unplaced.length === 1 ? 'One comment' : put.unplaced.length + ' comments') + ' could not be matched to the words in the work, so ' + (put.unplaced.length === 1 ? 'it is' : 'they are') + ' here to add by hand: ' + put.unplaced.map(t => '\u201c' + esc(t.length > 90 ? t.slice(0, 88) + '\u2026' : t) + '\u201d').join('; ') + '.</span>' : '')
      + (unplaced.length ? ' Headings not recognized: ' + unplaced.map(esc).join(', ') + '.' : '') + ' <button type="button" class="example-btn" id="xUndo">Undo</button>';
    $('xUndo').addEventListener('click', ()=>{
      sub.criteriaMarks[round] = before.marks; before.comments.forEach((v,i)=>{ sub.criteriaComments[round][i] = v; });
      sub.feedback[gk] = before.general; saveSubs(); render();
      if (put.ids.length && window.hubMarking && hubMarking.removeIds) hubMarking.removeIds(put.ids);
      window.X_LAST_PUT = { ids: [] };
      const d3 = $('xDone'); if (d3) { d3.style.display=''; d3.textContent = 'Put back as it was.'; }
    });
  }
}
