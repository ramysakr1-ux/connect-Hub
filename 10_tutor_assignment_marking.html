      '<a class="btn" data-back href="5_tutor_dashboard.html">Back to dashboard</a></div>';
    return;
  }
  const a = WORDING && WORDING[CURRENT];
  if (!a){ $('app').innerHTML = '<div class="card"><p class="note">This assignment isn\u2019t set up yet.</p></div>'; return; }
  if (CURRENT === 'a5' && !a5InPlay(SUBS)){ $('app').innerHTML = '<div class="card"><p class="note">Assignment 5 has not been set for this trainee. Set it from the assignment where the plagiarism was found.</p></div>'; return; }
  const sub = subFor(CURRENT);
  OUTCOME = (sub.feedback && sub.feedback.outcome) || OUTCOME;

  const who = (loadRoster().trainees[TRAINEE_ID] || {}).name || '';
  document.body.className = document.body.className.replace(/\bas-\w+/g, '').trim() + ' as-' + CURRENT;
  /* THE HEADING, TIDIED (Ramy, 18 Oct 2026: "tidy up the heading... too wide...
     doesn't look nice"). Left-aligned: the title with who and where it stands in
     one line under it; the deadline and "give more time" on one line; the
     rarely used Assignment 5 control a small link in the corner. */
  const a5Link = CURRENT !== 'a5' ? (a5InPlay(SUBS)
      ? `<span class="mk-a5">Assignment 5 is set${SUBS.a5 && SUBS.a5.assignedAfter ? ' after ' + esc(NAMES[SUBS.a5.assignedAfter] || SUBS.a5.assignedAfter) : ''}.${SUBS.a5 && SUBS.a5.stage === 'draft' ? ' <button type="button" id="a5WithdrawBtn">Withdraw it</button>' : ''}</span>`
      : `<span class="mk-a5"><button type="button" id="a5SetBtn" title="A center sanction, not one of the four. It stays out of sight until set.">Plagiarism found? Set Assignment 5</button></span>`) : '';
  /* Connect's assignment ends with a small Connect footer (28 Oct 2026: "a footer ... not in someone's face") */
  const CX = !!(window.hubIsConnectsAsg && hubIsConnectsAsg(CURRENT, a));
  let html = `<div class="header mk-head"><div class="mk-hmain"><p class="eyebrow">Written assignment · ${esc(CURRENT === 'a5' ? 'Assignment 5' : CURRENT.toUpperCase())}</p><h1>${esc(a.title)}</h1>
    <div class="mk-hmeta">${who ? `<span class="mk-who">${esc(who)}</span>` : ''}<span class="stage-pill ${sub.stage}">${({draft:'Not submitted', submitted:'Awaiting marking', returned_unmarked:'Returned unmarked', resubmission_needed:'Resubmission needed', resubmitted:'Resubmission awaiting marking', closed:'Closed'})[sub.stage]}</span></div>
    ${dueRowHTML(a, sub)}</div>
    <div class="mk-hside">${a5Link}</div>
  </div>`;

  /* TWO COLUMNS (Ramy, 17 Oct 2026, of every assignment: "hard to decipher...
     not very happy with the layout"). It was one column four screens long --
     the work, then the criteria at the foot -- so a tutor read section C and
     scrolled three screens down to mark it. Now the work is on the left and
     the marking sits beside it in a panel that stays in view; on a phone the
     two stack and a bar at the foot jumps between them. */
  let left = '', right = '', markerHtml = '', markerInlineHtml = '';   /* left: the work. right: the front page. */
  if (sub.stage !== 'draft') {
    /* Handbook 9.2.1: materials prepared for the language related task and the
       language skills task "SHOULD not be used as the basis for assessed TP
       lessons, or vice versa... This avoids the same content being assessed
       for two different components of assessment". A recommendation, so this
       is a flag in Cambridge's words and never a block.

       It used to compare against `tp.plan` ALONE -- the one live plan -- so it
       could see roughly one lesson out of eight, and a tutor who had watched
       it fire once would read its silence as clearance. Every returned lesson
       keeps its own plan at state.doc.plan, so the whole course is in reach
       (audit, 29 Sep 2026). Both submission rounds are checked, not just the
       first. */
    let overlapFlag = '';
    /* 9.2.1 names "the language related task and the language skills task";
       it says nothing about the other two, so they are not flagged. */
    try { if (!/^(lrt|lsrt)$/.test(CURRENT)) throw 0;
      const tr = TRAINEE_ID ? (loadRoster().trainees[TRAINEE_ID] || {}) : null;
      const norm = v => String(v || '').trim().replace(/[?#].*$/, '').replace(/\/+$/, '').toLowerCase();
      const lessons = [];
      const live = tr ? (tr.tp || {}).plan : JSON.parse(localStorage.getItem('chub:plan') || 'null');
      const liveLink = live && live.state && live.state.plan && live.state.plan.matsLink;
      if (liveLink) lessons.push({ tp: (live.state.meta || {}).tp || 'the current plan', link: liveLink });
      const hist = tr ? ((tr.tp || {}).history || {}) : (JSON.parse(localStorage.getItem('chub:tpHistory') || '{}') || {});
      Object.keys(hist).forEach(n => {
        const d = ((hist[n] || {}).state || {}).doc || {};
        const l = (d.plan || {}).matsLink;
        if (l) lessons.push({ tp: 'TP' + n, link: l });
      });
      const rounds = [['first submission', sub.sub1], ['resubmission', sub.sub2]];
      const hits = [];
      rounds.forEach(([label, r]) => {
        const sl = norm(r && r.materialsLink);
        if (!sl) return;
        lessons.forEach(L => { if (norm(L.link) === sl) hits.push(label + ' \u2014 same materials as ' + L.tp); });
      });
      if (hits.length) {        overlapFlag = `<div class="card" style="border-left-color:var(--brick);"><h2 style="color:var(--brick);">The same materials used twice</h2><p class="note" style="margin:0;">${hits.map(esc).join('<br>')}<br><br>Handbook 9.2.1: materials prepared for the language related task and the language skills task <b>should</b> not be used as the basis for assessed TP lessons, or vice versa \u2014 it avoids the same content being assessed twice, and the trainee being doubly credited or doubly penalised. A recommendation; the call is yours.</p></div>`;
      }
    } catch(e) {}
    html += overlapFlag;
    const markerInner = `<h3 class="mk-mh">Marker record</h3>
      <div class="mk-mrow"><div class="row"><label for="marker1">1st marker</label><input type="text" id="marker1" value="${esc(sub.markers.first)}" placeholder="Name"></div>
      <div class="row"><label for="marker2">2nd marker (double-marking)</label><input type="text" id="marker2" value="${esc(sub.markers.second)}" placeholder="Only if this one is in the double-marked sample"></div></div>
      <p class="note" style="margin:0;">Handbook 9.2.3: a proportion of each assignment <b>must</b> be double-marked (3 up to 9 trainees, 4 up to 16, 5 up to 24); double-marked ones <b>should</b> be initialled by both tutors.</p>`;
    /* Ramy, 18 Oct 2026: "the marker record... I'm not sure why it's sitting on the right".
       While you mark it is part of the front page, as on C/18's cover; otherwise a card of its own. */
    markerHtml = (sub.stage === 'submitted' || sub.stage === 'resubmitted') ? '' : `<div class="card mk-marker">${markerInner}</div>`;
    markerInlineHtml = (sub.stage === 'submitted' || sub.stage === 'resubmitted') ? `<div class="mk-markers">${markerInner}</div>` : '';
  }

  if (sub.stage === 'draft') {
    html += `<div class="card"><p class="note">Nothing to mark yet \u2014 the trainee hasn\u2019t submitted this assignment.</p></div>`;
  } else {
    if (sub.sub2) left += compareRounds(a, sub);
    else left += `<div class="card mk-round"><h2>First submission</h2>${summarize(a, sub.sub1, 'sub1')}</div>`;
    left += '<div class="card mk-brief" id="briefLine"><p class="note" style="margin:0;">Checking which brief this answered\u2026</p></div>';
    left += checkCard(sub);
    if (sub.feedback && sub.feedback.outcome) {
      right += `${sub.stage === 'closed' ? '<div class="card"><h2>Marked and returned</h2><p class="mk-how" style="margin:0;">This assignment is finished. The work and your feedback are kept here as the record; there is nothing to do.</p></div>' : ''}<div class="card"><h2>Your feedback</h2><div class="readonly">${esc(sub.feedback.outcome)}${sub.feedback.generalComment1?('\n\n'+nl2br(sub.feedback.generalComment1)):''}${sub.feedback.generalComment2?('\n\n'+nl2br(sub.feedback.generalComment2)):''}</div></div>`;
    }

    if (sub.stage === 'resubmission_needed' || sub.stage === 'returned_unmarked') {
      /* Sent back: the criteria stay in view, read-only, with each mark and
         note as given in round one -- the trainee has always seen these on
         their page; the tutor had no view of their own marking until the
         resubmission arrived (Ramy, 28 Sep 2026: "I don't see this criteria").
         Round two, when it comes, draws these beside the fresh controls. */
      const crit1 = (a.criteria||[]), m1 = sub.criteriaMarks.sub1 || [], c1 = sub.criteriaComments.sub1 || [];
      if (crit1.length && (m1.length || c1.some(Boolean))) {
        right += `<div class="card"><h2>Assessment criteria <small style="font-family:'Karla',sans-serif;font-size:0.8rem;font-weight:500;color:var(--grey)">first submission, as marked</small></h2>
          ${crit1.map((c,i)=>{ const m=m1[i]; const cls=m===true?'met':m===false?'not':''; const label=m===true?'Met':m===false?'Not met':'Not marked';
            return `<div class="critrow" style="flex-direction:column; align-items:stretch;"><div class="critline"><div class="txt">${esc(c.text)}</div><span class="crit-toggle ${cls}" style="cursor:default">${label}</span></div>${c1[i] ? `<div class="readonly" style="margin:8px 0 0">${nl2br(c1[i])}</div>` : ''}</div>`; }).join('')}
        </div>`;
      }
      right += `<div class="card"><p class="note">${sub.stage === 'returned_unmarked' ? 'Returned unmarked \u2014 waiting on the trainee to submit again.' : 'Waiting on the trainee to resubmit \u2014 nothing more to mark until they do.'}</p></div>`;
    } else if (sub.stage === 'submitted' || sub.stage === 'resubmitted') {
      const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
      const crit = (a.criteria||[]);
      const marks = sub.criteriaMarks[round];
      const allMarked = crit.length>0 && crit.every((c,i)=>marks[i]===true||marks[i]===false);
      const allMet = allMarked && crit.every((c,i)=>marks[i]===true);
      let derivedLabel, derivedCls;
      if (!allMarked) { derivedLabel = 'Mark every criterion to see the outcome'; derivedCls='pending'; }
      else {
        /* The SAME rule the save uses -- outcomeFor(). This pill used to work
           the answer out for itself and keyed only on the round, so for a
           trainee who had already used their one resubmission it read
           "Resubmission needed" while the note directly above it said the
           mark was a final Fail and the save recorded exactly that, closing
           the assignment. The tutor was shown one decision and made another,
           on a trainee's pass or fail (walk, 21 Sep 2026). */
        derivedLabel = outcomeFor(round, allMet, sub);
        derivedCls = /^Pass/.test(derivedLabel) ? 'pass' : 'fail';
      }

      /* The resubmission-window note (may run past the course end, Handbook 9.2.3)
         is gone: Ramy, 18 Oct 2026, "we know that. Let's remove that." */
      const guide = window.hubGuidance ? hubGuidance(CURRENT) : null;
      /* The hidden word (17 Oct 2026): found anywhere in either round. */
      const trapHit = !!(a.trap && window.hubTrapFound && hubTrapFound(a.trap, sub));
      const gBox = (title, text, cls) => text ? `<details class="guide-box g-link${cls ? ' ' + cls : ''}"><summary>${title}</summary><div class="gb">${hubGuidanceHTML(text)}</div></details>` : '';
      right += `<div class="card mk-crit" id="mkCrit"><h2>Front page</h2>
        <p class="mk-how">Mark each criterion Met or Not met. What you tie to a criterion collects under it. A note is optional: the trainee reads it. Then Save &amp; return.</p>
        ${trapHit ? `<div class="trap-hit" role="note"><b>The hidden word is used in this work.</b> The trainee is not told.</div>` : ''}
        <div class="mk-cgrid"><div class="mk-cleft">
        ${mv2HTML(crit, marks)}
        ${sub.stage==='submitted' && sub.usedResubmission ? '<p class="note">This trainee has already used their one resubmission for this assignment \u2014 any criterion Not met here is a final Fail.</p>' : ''}
        ${crit.length ? crit.map((c,i)=>{
          const m = marks[i];
          const cls = m===true?'met':m===false?'not':'';
          const label = m===true?'Met':m===false?'Not met':'Not yet marked';
          const cm = (sub.criteriaComments[round]||[])[i] || '';
          /* Marking a RESUBMISSION is the act of checking whether what you
             flagged got fixed -- so the first round's verdict and your own note
             belong here, beside the control you are about to press. They were
             stored and rendered on the record, but this screen showed eight
             criteria all reading "Not yet marked" and nothing else, so the
             tutor re-judged blind or went hunting for their own words on
             another screen (walk, 21 Sep 2026). The trainee's own screen has
             always shown them these comments; the tutor had the worse view of
             the two. */
          const prevMark = round==='sub2' ? (sub.criteriaMarks.sub1||[])[i] : undefined;
          const prevComment = round==='sub2' ? ((sub.criteriaComments.sub1||[])[i] || '') : '';
          const prevLine = prevMark===undefined && !prevComment ? '' :
            `<div class="note" style="margin:6px 0 0; padding:6px 9px; border-radius:6px; background:var(--sand); font-size:0.78rem; line-height:1.5;">
              <b>First submission:</b> ${prevMark===true?'Met':prevMark===false?'Not met':'not marked'}${prevComment?` \u2014 ${esc(prevComment)}`:''}
            </div>`;
          return `<div class="critrow" style="flex-direction:column; align-items:stretch;">
            <div class="critline">
              <div class="txt"><span class="mk-n">${i + 1}</span>${esc(c.text)}</div>
              <button class="crit-toggle ${cls}" data-crit="${i}">${label}</button>
            </div>
            ${guide && guide.crit && guide.crit[i] ? `<button type="button" class="mk-tiplink" data-tip="${i}">Guidance</button>` : ''}
            ${prevLine}
            <div class="mk-linked" data-linked="${i}"></div>
            <button type="button" class="mk-addnote" data-addnote="${i}"${cm ? ' hidden' : ''}>Add a note</button>
            <textarea data-crit-comment="${i}" rows="2" placeholder="Why, in a sentence or two. The trainee reads this." style="margin-top:8px;"${cm ? '' : ' hidden'}>${esc(cm)}</textarea>
          </div>`;
        }).join('') : '<p class="note">No marking criteria set for this assignment yet \u2014 add them in the assignment builder.</p>'}
        </div><div class="mk-cright">
        <div class="derived ${derivedCls}">${derivedLabel}</div>
        <div class="xchg" id="xchg">
          <div class="xchg-acts">
            <button type="button" class="btn btn-gold" id="xCopy">Copy</button>
            <span class="note" style="margin:0;">the submission and the criteria, as text.</span>
            <button type="button" class="btn btn-quiet" id="xPasteToggle" style="margin-left:auto;">Paste something back</button>
            <button type="button" class="btn btn-quiet" id="xDocx" title="A Word file (.docx) with comments on the side: download your Google Doc as Word and bring it here">Bring back a Word file</button>
            <input type="file" id="xDocxFile" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
          </div>
          <div id="xPaste" style="display:none; margin-top:12px;">
            <textarea id="xText" rows="4" placeholder="Paste here — it goes straight into the criteria. The outcome is still worked out from the marks."></textarea>
          </div>
          <p class="note" id="xDone" style="display:none; margin:8px 0 0;"></p>
        </div>
        <div class="row" style="margin-top:12px;"><label>General comment${round==='sub2'?' on the resubmission':''} (optional)</label>
          <textarea id="comment" rows="3" placeholder="Anything that does not belong to one criterion.">${esc((sub.feedback&&(round==='sub2'?sub.feedback.generalComment2:sub.feedback.generalComment1))||'')}</textarea></div>
        ${markerInlineHtml}
        <div class="actions">
          <button type="button" class="btn btn-quiet" id="unmarkedBtn">Return unmarked</button>
          <button class="btn btn-teal" id="saveBtn" ${allMarked?'':'disabled'}>Save & return to trainee</button>
        </div>
        </div></div>
      </div>`;
    }
  }

  if (left || right) {
    const marking = sub.stage === 'submitted' || sub.stage === 'resubmitted';
    html += `<section class="mk-cover" id="mkPanel" aria-label="Front page">${right}${markerHtml}</section>`;
    html += `<div class="mk-help" id="mkHelp"></div>`;
    html += `<div class="mk-work" id="mkWork">${left}</div>`;
  }
  if (CX) html += hubConnectFooter();
  $('app').innerHTML = html;
  if (sub && sub.stage !== 'draft') briefLine(a, sub);
  if (window.hubMarking) hubMarking.afterRender({ key: CURRENT, trainee: TRAINEE_ID, a, sub, round: sub.stage === 'resubmitted' ? 'sub2' : 'sub1', marking: sub.stage === 'submitted' || sub.stage === 'resubmitted', guide: window.hubGuidance ? hubGuidance(CURRENT) : null, save: saveSubs, rerender: render,
    setNote: (i, v) => { const r = sub.stage === 'resubmitted' ? 'sub2' : 'sub1'; sub.criteriaComments[r] = sub.criteriaComments[r] || []; sub.criteriaComments[r][i] = v; saveSubs(); },
    setMark: (i, v) => { const r = sub.stage === 'resubmitted' ? 'sub2' : 'sub1'; sub.criteriaMarks[r][i] = v; saveSubs(); render(); },
    outcome: () => { const r = sub.stage === 'resubmitted' ? 'sub2' : 'sub1', cr = a.criteria || [], mk = sub.criteriaMarks[r] || []; const all = cr.length > 0 && cr.every((c, i) => mk[i] === true || mk[i] === false); return all ? outcomeFor(r, cr.every((c, i) => mk[i] === true), sub) : ''; }, me: (function(){ try { return localStorage.getItem('chub:tutorName') || ''; } catch (e) { return ''; } })() });
  document.querySelectorAll('[data-crit]').forEach(b => b.addEventListener('click', () => {
    const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
    const i = +b.dataset.crit;
    const cur = sub.criteriaMarks[round][i];
    sub.criteriaMarks[round][i] = cur===true ? false : cur===false ? null : true;
    saveSubs(); render();
  }));
  const saveBtn = $('saveBtn');
  if (saveBtn) saveBtn.addEventListener('click', doSave);
  const unmarkedBtn = $('unmarkedBtn');
  if (unmarkedBtn) unmarkedBtn.addEventListener('click', doReturnUnmarked);
  wireExchange();
  const extBtn = $('extSet');
  if (extBtn) extBtn.addEventListener('click', () => {
    const v = ($('extAt') || {}).value;
    if (!v) return;
    setExtension(subFor(CURRENT), HubDue.fromLocalInput(v));
  });
  const extClr = $('extClear');
  if (extClr) extClr.addEventListener('click', () => setExtension(subFor(CURRENT), ''));

  const setBtn = $('a5SetBtn');
  if (setBtn) setBtn.addEventListener('click', async () => {
    if (!(await confirmModal('Set Assignment 5, the plagiarism reflection, for this trainee? It appears in their assignment list once you return this file to them.', 'Set Assignment 5'))) return;
    const a5 = subFor('a5');
    a5.assigned = true; a5.assignedAt = new Date().toISOString(); a5.assignedAfter = CURRENT;
    saveSubs(); renderPicker(); render();
  });
  const wBtn = $('a5WithdrawBtn');
  if (wBtn) wBtn.addEventListener('click', async () => {
    if (!(await confirmModal('Withdraw Assignment 5 for this trainee? Nothing has been submitted for it.', 'Withdraw'))) return;
    delete SUBS.a5;
    saveSubs(); renderPicker(); render();
  });
  const m1 = $('marker1'), m2 = $('marker2');
  /* NOT FILLED IN BY OPENING THE PAGE (Ramy, 23 Nov 2026: he opened a trainee's LSRT in the other tutor's group to
     look, and was saved as its 1st marker). The 1st marker is whoever types their name here. */
  if (m1) m1.addEventListener('input', () => { sub.markers.first = m1.value; saveSubs(); });
  if (m2) m2.addEventListener('input', () => { sub.markers.second = m2.value; sub.markers.doubleMarked = !!m2.value.trim(); saveSubs(); });
  /* Comments keep as they are typed. Until 24 Sep 2026 only Save read them,
     and render() rebuilds the whole form on every pill click -- so a comment
     typed on criterion 1 vanished the moment criterion 2 was marked, and a
     tutor who switched trainee lost everything but the pills. */
  const rnd = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
  document.querySelectorAll('[data-crit-comment]').forEach(el => el.addEventListener('input', () => {
    sub.criteriaComments[rnd] = sub.criteriaComments[rnd] || [];
    sub.criteriaComments[rnd][+el.dataset.critComment] = el.value; saveSubs();
  }));
  const gc = $('comment');
  if (gc) gc.addEventListener('input', () => {
    if (!sub.feedback) sub.feedback = { outcome:'', generalComment1:'', generalComment2:'' };
    sub.feedback[rnd==='sub2' ? 'generalComment2' : 'generalComment1'] = gc.value; saveSubs();
  });
}

/* A COMMENT IS READ FROM ITS BOX WHEN THE BOX IS THERE, AND FROM THE RECORD WHEN IT IS NOT (24 Nov 2026). Return
   used to read every box straight from the page: a criterion whose box was not drawn came back empty and wiped the
   comment saved as it was typed, and a page with no overall box stopped with an error. Both layouts read through
   these two, so a missing box can never blank a saved comment. */
function critCommentVal(round, i){
  const el = document.querySelector(`[data-crit-comment="${i}"]`);
  if (el) return el.value;
  const sub = subFor(CURRENT);
  return ((sub.criteriaComments || {})[round] || [])[i] || '';
}
function overallVal(round){
  const el = $('comment');
  if (el) return el.value;
  const fb = subFor(CURRENT).feedback || {};
  return (round === 'sub2' ? fb.generalComment2 : fb.generalComment1) || '';
}

function doSave(){
  const sub = subFor(CURRENT);
  const a = WORDING[CURRENT];
  const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
  const crit = (a.criteria||[]);
  const marks = sub.criteriaMarks[round];
  const allMet = crit.length>0 && crit.every((c,i)=>marks[i]===true);
  const comment = overallVal(round);
  sub.criteriaComments[round] = crit.map((c,i)=>critCommentVal(round, i));
  if (!sub.feedback) sub.feedback = { outcome:'', generalComment1:'', generalComment2:'' };

  sub[round === 'sub2' ? 'marked2At' : 'marked1At'] = new Date().toISOString();
  if (round === 'sub2') sub.feedback.generalComment2 = comment;
  else sub.feedback.generalComment1 = comment;
  sub.feedback.outcome = outcomeFor(round, allMet, sub);
  sub.stage = sub.feedback.outcome === 'Resubmission needed' ? 'resubmission_needed' : 'closed';
  saveSubs();
  /* MARKING IS FINAL: THE RECORD GOES TO THE CENTER'S FOLDER (21 Nov 2026). The finished record (the work, the criteria,
     the comments, who marked it) is filed as a PDF in this trainee's folder, as the store's fileDoc does it. Quiet:
     a course with no center folder, or a demo, files nothing. */
  /* the new layout files from the store's copy once the store has answered (mknReturn, 24 Nov 2026) */
  if (sub.stage === 'closed' && TRAINEE_ID && window.hubFileDoc && window.hubAssignmentRecordHTML && !document.body.classList.contains('mkn')) {
    try { const aDoc = WORDING[CURRENT]; hubFileDoc({ token: TRAINEE_ID, name: 'Assignment - ' + (aDoc && aDoc.title || CURRENT), html: hubAssignmentRecordHTML(aDoc, sub) }); } catch (e) {}
  }
  render();
}

/* What this marking comes to, in the words the trainee will see. Read by the
   pill the tutor is looking at AND by the save, so the screen cannot promise
   one outcome and record another. Handbook 9.2.3, not 9.2.2 (checked against
   the June 2025 Administration Handbook, 21 Sep 2026): 9.2.2 is "Providing
   support for written assignments"; the one-occasion rule is in 9.2.3, which
   says trainees must have the opportunity, within the time span of the
   course, to resubmit "on one occasion only for each assignment". Once it is
   used, a criterion not met is a Fail, not another chance. */
/* ---- v3 (7 Oct 2026): the tally strip ------------------------------------
   One segment per criterion, in order, colored by its mark, over a count.
   A segment is a door to its criterion. Reads the marks render() already
   has; writes nothing. */
/* The phone's bar: how far the marking has got, and a jump between the work
   and the criteria. */
function mkBarLabel(a, sub){
  const round = sub.stage === 'resubmitted' ? 'sub2' : 'sub1', n = (a.criteria || []).length;
  const done = (sub.criteriaMarks[round] || []).filter(v => v === true || v === false).length;
  return 'Mark: ' + done + ' of ' + n + ' done';
}
let MK_BACK = null;
document.addEventListener('click', e => {
  if (!e.target.closest || !e.target.closest('#mkJump')) return;
  const crit = $('mkCrit'); if (!crit) return;

/* The reason is whatever is in the overall comment box, as it always was. A caller may hand the reason over as

function doReturnUnmarked(reason){
  const sub = subFor(CURRENT);

  const comment = typeof reason === 'string' ? reason : overallVal(round);
  if (!sub.feedback) sub.feedback = { outcome:'', generalComment1:'', generalComment2:'' };
  // Returned unmarked does NOT spend the one resubmission (Handbook 9.2.3;
  // DESIGN-HANDOFF-README's core rule). It used to set resubmission_needed,

  // incomplete first attempt sent back for a missing section cost them their
  // only second chance (Hub walk, 20 Sep 2026). The round stays what it was:
  // the trainee edits what they sent, declares again, and submits it again.
  if (round==='sub2') {

/* when a round was turned in, and how early or late against that deadline, in words */
function mknTurnedIn(a, sub, round){

  if (!isFinite(t)) return null;

/* PREVIOUS AND NEXT (24 Nov 2026): everyone on the course who has submitted this assignment, returned scripts

function mknList(key){

function mknSame(x, y){ const n = v => String(v || '').replace(/\s+/g, ' ').trim().toLowerCase(); return !!n(x) && n(x) === n(y); }
/* CLOSE ENOUGH TO BE THE SAME TUTOR (24 Nov 2026, a reviewer's finding). The name on this computer is typed by hand,
   so the 1st marker who typed only a first name, or made a slip, was offered the second marker's box on their own
   script and could sign it: one person's marking would then count as double-marked. A name counts as the 1st marker's
   when it is the same, when one is the other's first name, or when it is one letter away (two in a long name). Two
   real tutors this close get the marking page instead of the box, which loses nothing. */
function mknNear(x, y){
  const n = v => String(v || '').replace(/\s+/g, ' ').trim().toLowerCase(), a = n(x), b = n(y);
  if (!a || !b) return false;
  if (a === b) return true;
  const wa = a.split(' '), wb = b.split(' ');
  if ((wa.length === 1 || wb.length === 1) && wa[0] === wb[0]) return true;
  /* an initial and the same surname ("C. Tutor"), or the surname alone ("Tutor") (24 Nov 2026, a reviewer's finding) */
  const pa = a.replace(/\./g, ' ').split(' ').filter(Boolean), pb = b.replace(/\./g, ' ').split(' ').filter(Boolean);
  const la = pa[pa.length - 1] || '', lb = pb[pb.length - 1] || '';
  if (pa.length > 1 && pb.length > 1 && la === lb && pa[0].charAt(0) === pb[0].charAt(0) && (pa[0].length === 1 || pb[0].length === 1)) return true;
  if ((pa.length === 1 && pb.length > 1 && pa[0].length >= 3 && pa[0] === lb) || (pb.length === 1 && pa.length > 1 && pb[0].length >= 3 && pb[0] === la)) return true;
  if (Math.abs(a.length - b.length) > 2) return false;

  for (let i = 1; i <= a.length; i++) { const cur = [i]; for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[b.length] <= (Math.min(a.length, b.length) >= 10 ? 2 : 1);

/* THE COURSE'S TUTORS, AGAINST A TYPED NAME (24 Nov 2026, a reviewer's finding). A tutor may type a nickname on one

   more than one). Two names that come to the same listed tutor are the same person. */

/* Handbook 9.2.1, the same materials in an assignment and an assessed lesson: the test the page has made since

function mknOverlap(sub){
  const hits = [];
  try {
    if (!/^(lrt|lsrt)$/.test(CURRENT)) return hits;
    const tr = mknTrainee();
    const norm = v => String(v || '').trim().replace(/[?#].*$/, '').replace(/\/+$/, '').toLowerCase();
    const lessons = [], live = (tr.tp || {}).plan;
    const liveLink = live && live.state && live.state.plan && live.state.plan.matsLink;
    if (liveLink) lessons.push({ tp: (live.state.meta || {}).tp || 'the current plan', link: liveLink });
    const hist = (tr.tp || {}).history || {};
    Object.keys(hist).forEach(n => { const l = ((((hist[n] || {}).state || {}).doc || {}).plan || {}).matsLink; if (l) lessons.push({ tp: 'TP' + n, link: l }); });
    [['First submission', sub.sub1], ['Resubmission', sub.sub2]].forEach(([label, r]) => {
      const sl = norm(r && r.materialsLink); if (!sl) return;
      lessons.forEach(L => { if (norm(L.link) === sl) hits.push(label + ': the same materials as ' + L.tp); });
    });
  } catch (e) {}
  return hits;
}
/* WHAT LITE'S OWN CHECKS FLAG (24 Nov 2026): sources, phonemic script, materials missing, the declaration, the same
   materials used twice, an older brief. Only what is flagged; the word count has its own pill and is not said
   twice. A requirement, never a mark: the list is for the tutor to read. */
/* the short words a flagged check has on the pill, when it is the only one (the sheet keeps the full label) */
function mknReqShort(x){
  const l = String((x && x.label) || '');
  if (/^Sources in the text:/.test(l)) return 'Sources missing from the bibliography';
  if (/^AI declared/.test(l)) return 'AI record not complete';
  return l;
}
function mknRequirements(st){
  const out = [], a = st.a, sub = st.sub;
  if (!mknHasWork(st.snap)) return out;
  try { if (window.hubWorkChecks) hubWorkChecks(a, st.snap, CURRENT, 'tutor').forEach(x => { if (x.state === 'look' && !/^\d+ words$/.test(x.label)) out.push({ label: x.label, detail: x.detail || '' }); }); } catch (e) {}
  const twice = mknOverlap(sub);
  if (twice.length) out.push({ label: 'The same materials used twice', detail: twice.join('. ') + '.', html: 'Handbook 9.2.1: materials prepared for the language related task and the language skills task <b>should</b> not be used as the basis for assessed TP lessons, or vice versa. A recommendation. The call is yours.' });
  const rec = st.round === 'sub2' ? sub.brief2 : sub.brief1;
  try { if (rec && rec.h && window.hubBriefKey && !(window.hubBriefSame ? hubBriefSame(rec.h, a) : rec.h === hubBriefKey(a))) out.push({ label: 'An earlier version of the brief', detail: 'This work answers the brief as it was before it was last changed.', brief: true }); } catch (e) {}
  try { if (a.trap && window.hubTrapFound && hubTrapFound(a.trap, sub)) out.push({ label: 'The hidden word is used in this work', detail: 'The trainee is not told.' }); } catch (e) {}
  return out;
}

/* ---- THE PILLS (24 Nov 2026). A check stands beside words that say all is well; the words say it either way. ---- */
function mknPillsHTML(st){
  const sub = st.sub, a = st.a;
  if (sub.stage === 'draft' || !mknHasWork(st.snap)) return '';
  const out = [], pill = (text, cls, ok) => `<span class="mkn-pill${cls ? ' ' + cls : ''}">${ok ? MKN_CHECK : ''}${text}</span>`;
  if (st.round === 'sub2') {
    const m1 = sub.criteriaMarks.sub1 || [], met = st.crit.filter((c, i) => m1[i] === true).length, not = st.crit.filter((c, i) => m1[i] === false).length;
    if (met + not) out.push(pill('First round: ' + met + ' met, ' + not + ' not met', 'is-plain'));
  }
  /* ONE PILL FOR WHEN AND HOW LONG (24 Nov 2026): "Turned in 23 Nov · 2 days early · 872 words", with ", under" or
     ", over" when the count is out of range; mustard when it was late or the count is out of range */
  const ti = mknTurnedIn(a, sub, st.round), w = mknWords(a, st.snap);
  const wout = !!w && w.state !== 'in range', wtxt = w ? w.n + (w.n === 1 ? ' word' : ' words') + (wout ? ', ' + w.state : '') : '';
  if (ti || w) out.push(`<span class="mkn-pill${(ti && ti.late) || wout ? ' is-amber' : ''}" id="mknWhen">${esc([ti ? ti.text : '', wtxt].filter(Boolean).join(' · '))}</span>`);
  /* own work: the check runs only when a tutor presses this pill (24 Nov 2026) */
  out.push(mknOwnPillHTML(st));
  const d = mknDecl(a, st.snap);
  if (d && d.has && (d.ai === 'yes' || d.ai === 'no')) out.push(`<button type="button" class="mkn-pill" id="mknDecl">${d.ai === 'no' ? MKN_CHECK + 'Did not use AI' : 'Used AI'}</button>`);
  /* THINGS TO CHECK (24 Nov 2026): one thing flagged is said in its own words; two or more are counted */
  const req = mknRequirements(st);
  if (req.length) out.push(`<button type="button" class="mkn-pill is-amber" id="mknReq">${esc(req.length === 1 ? mknReqShort(req[0]) : req.length + ' things to check')}</button>`);
  /* THE 1ST MARKER IS WHOEVER PRESSES THIS. Opening the page never sets it. Any tutor may take a script, and any
     tutor may change the name, while the script is with the tutors (the store keeps a tutor's write only then). */
  const first = String((sub.markers || {}).first || '').replace(/\s+/g, ' ').trim(), can = st.marking || sub.stage === 'closed';
  /* the markers' pills are held together, so on a laptop they stay in sight at the right of the one line (24 Nov 2026) */
  const lead = out.length; 
  if (first) out.push(`<span class="mkn-pill" id="mknFirstIs">${MKN_CHECK}1st marker · ${esc(first)}${can ? '<button type="button" class="mkn-pillact" id="mknFirstChange">Change</button>' : ''}</span>`);
  else if (can) out.push('<button type="button" class="mkn-pill is-dash" id="mknFirst" data-role="marker1">1st marker · take it</button>');
  /* THE 2ND MARKER (24 Nov 2026): signed, with the name and the day; a name recorded by hand, with the name; and, to a
     tutor who is not the 1st marker on a fully marked script, a pill that takes them to the box where they sign */
  const s2 = st.s2;
  if (s2.signed) out.push(pill('2nd marker · ' + esc(s2.by) + (s2.at ? ' · ' + esc(mknWhen(s2.at, false, true)) : ''), '', true));
  else if (s2.typedName) out.push(pill('2nd marker · ' + esc(s2.by), '', true));
  else if (s2.canSign) out.push('<button type="button" class="mkn-pill is-dash" id="mknToSecond">2nd marker · not signed</button>');
  const marker = out.splice(lead);
  /* WHAT NEEDS A LOOK COMES FIRST (24 Nov 2026, a reviewer's finding). On a laptop the pills that did not fit slid out
     of sight at the right, and those were the ones that flag something: Requirements, own work to look at. So the
     mustard pills (late, words over or under, Requirements) and the own-work pill lead, in their own order, and the
     plain facts follow. */
  const flag = h => /\bis-amber\b|id="mknOwn"/.test(h), look = out.filter(flag), rest = out.filter(h => !flag(h));
  return look.concat(rest).join('') + (marker.length ? `<span class="mkn-mpills">${marker.join('')}</span>` : '');
}

/* ---- dates said the way the course says them (its time zone, its 12 or 24 hour clock) ---- */
function mknWhen(iso, withTime, short){
  const t = new Date(iso); if (!iso || !isFinite(t.getTime())) return '';
  let S = {}; try { S = JSON.parse(localStorage.getItem('connect_course_settings') || '{}') || {}; } catch (e) {}
  const o = short ? { day: 'numeric', month: 'short' } : { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
  if (withTime) Object.assign(o, { hour: 'numeric', minute: '2-digit', hour12: String(S.clock) === '12' });
  const make = z => { const p = {}; new Intl.DateTimeFormat('en-GB', Object.assign({}, o, z ? { timeZone: z } : {})).formatToParts(t).forEach(x => { p[x.type] = x.value; }); return p; };
  let p; try { p = make(S.timeZone || ''); } catch (e) { p = make(''); }
  const day = [p.weekday, p.day, p.month, p.year].filter(Boolean).join(' ');
  return day + (withTime ? ', ' + p.hour + ':' + p.minute + (p.dayPeriod ? ' ' + p.dayPeriod.toUpperCase() : '') : '');
}

/* ======================= A RESUBMISSION ======================= */
/* Where the resubmission added words: character ranges in the new text, from a word by word comparison with the
   first round (the same comparison the old layout's side by side view makes). Spaces between two added words join
   them into one underline. */
function mknInsRanges(v1, v2){
  const A = String(v1 || '').split(/(\s+)/), B = String(v2 || '').split(/(\s+)/), n = A.length, m = B.length;
  if (n * m > 4000000) return [];
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0, pos = 0;
  const add = (t) => { if (!/^\s*$/.test(t)) { const last = out[out.length - 1]; if (last && /^\s*$/.test(String(v2).slice(last[1], pos))) last[1] = pos + t.length; else out.push([pos, pos + t.length]); } };
  while (i < n && j < m) {
    if (A[i] === B[j]) { pos += B[j].length; i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) i++;
    else { add(B[j]); pos += B[j].length; j++; }
  }
  while (j < m) { add(B[j]); pos += B[j].length; j++; }
  return out;
}
/* underline those ranges in a drawn block, but only when the block reads exactly as the text it was drawn from */
function mknApplyDiffs(){
  (MKN_DIFFS || []).forEach((d, n) => {
    const box = document.querySelector(`#mkWork [data-mknins="${n}"]`); if (!box || !window.hubFlat) return;
    const flat = hubFlat(box).all, want = String(d.v2 || '').replace(/\n/g, ' ');
    if (flat.slice(d.off) !== want) return;                        /* drawn differently (an old answer's heads): no underline rather than a wrong one */
    mknInsRanges(d.v1, d.v2).forEach(([x, y]) => {
      const f = hubFlat(box), at = d.off + x, end = d.off + y;
      f.nodes.forEach(pair => {
        const node = pair[0], s0 = pair[1], s1 = s0 + node.nodeValue.length;
        if (s1 <= at || s0 >= end) return;
        const a = Math.max(0, at - s0), b = Math.min(node.nodeValue.length, end - s0);
        const mid = node.splitText(a); mid.splitText(b - a);
        const ins = document.createElement('ins'); ins.className = 'mkn-ins'; mid.parentNode.insertBefore(ins, mid); ins.appendChild(mid);
      });
    });
  });
}
/* one block of words, in a round, with its comment gutter. first: the first round's comments are drawn beside it

    + `<div class="readonly${o.field ? ' mkn-box' : ''}"${n >= 0 ? ` data-mknins="${n}"` : ''}>${o.html}</div><div class="mgut"></div></div>`;

/* THE RESUBMISSION, SECTION BY SECTION (spec part 8; critique 14 and 17). A section the trainee did not change folds
   to one line ("Unchanged", Show); its words stay in the page, so a comment brought back can still find them. A

/* ======================= OWN WORK ======================= */
function mknOwnKey(round){ return 'mk:own:' + TRAINEE_ID + ':' + CURRENT + ':' + round; }
/* the last check of this script in this tab; never on the record */
function mknOwnGet(round){
  const k = mknOwnKey(round);
  if (MKN_OWN && MKN_OWN.key === k) return MKN_OWN;
  try { const o = JSON.parse(sessionStorage.getItem(k) || 'null'); if (o && o.key === k) { MKN_OWN = o; return o; } } catch (e) {}
  return null;
}
/* "Not a concern", remembered with the record so the other tutor sees it too: sub.flags.notConcern[round][key] */
function mknOffOf(sub, round){ const n = (sub.flags || {}).notConcern; return (n && typeof n === 'object' && n[round] && typeof n[round] === 'object') ? n[round] : {}; }
/* what the checks found, and what is attached to the record, as one list. Each passage has a key (its kind and its
   words) for "Not a concern", and says whether it is attached. */
function mknOwnList(st){
  const o = mknOwnGet(st.round), fl = flagsOf(st.sub, st.round), off = mknOffOf(st.sub, st.round), list = [];
  if (o) ['course', 'web', 'para'].forEach(p => ((o[p] || {}).items || []).forEach(x => list.push(Object.assign({ part: p }, x, { whereH: esc(x.where || '') }))));
  fl.forEach(f => { if (!list.some(x => x.kind === f.kind && x.quote === f.quote)) list.push({ part: f.kind === 'web' ? 'web' : f.kind === 'paraphrase' ? 'para' : 'course', kind: f.kind, quote: f.quote, whereH: whereHTML(f), link: f.link || '', flag: f, fromRecord: true }); });
  list.forEach((x, n) => { x.n = n; x.key = x.kind + '|' + (x.quote || x.where || ''); x.att = fl.findIndex(f => f.kind === x.kind && f.quote === x.quote); x.off = !!off[x.key]; x.offBy = (off[x.key] || {}).by || ''; });
  return list;
}
/* THE PILL. Never green before the check has run, and never green when a pass did not run. */
function mknOwnPillHTML(st){

/* THE CHECK: the same three passes the page has always run, when pressed (every other assignment on Lite, the web,
   paraphrase between the pairs the first pass finds). It reads; it writes nothing to the record. */
async function mknOwnRun(){
  const st = mknState(); if (!st || MKN_OWN_BUSY || !mknHasWork(st.snap)) return;
  const S = window.HubStore, round = st.round, body = { code: CURRENT, round, token: TRAINEE_ID };
  const name = c => NAMES[c] || String(c || '').toUpperCase();
  const o = { key: mknOwnKey(round), at: '', course: { state: '', note: '', items: [] }, web: { state: '', note: '', items: [] }, para: { state: '', note: '', items: [] } };
  const call = op => { if (!S || !S.call) return Promise.reject(new Error('Lite cannot reach the check from this page.')); return S.call(Object.assign({ op }, body)); };
  const why = e => String((e && e.message) || e || 'No answer.');
  MKN_OWN_BUSY = true; mknSheetClose(); { const p = $('mknOwn'); if (p) p.outerHTML = mknOwnPillHTML(st); }
  let sim = null;
  try {
    sim = await call('similar');
    ((sim && sim.matches) || []).forEach(m => {
      const where = 'Also in ' + name(m.code) + ' on ' + (m.course || 'another course') + (m.centre ? ' (' + m.centre + ')' : '') + (m.round === 'sub2' ? ', the resubmission' : '') + (m.pct ? ' · ' + m.pct + '% of this text shared' : '') + (m.sameCourse ? ' · this course' : '');
      const ps = (m.passages || []).filter(Boolean);
      if (!ps.length) o.course.items.push({ kind: 'lite', quote: '', where });
      ps.forEach(x => o.course.items.push({ kind: 'lite', quote: x, where, flag: { kind: 'lite', quote: x, course: m.course, centre: m.centre || '', code: m.code, round: m.round, pct: m.pct } }));
    });
    o.course.state = o.course.items.length ? 'found' : 'clear';
    o.course.note = 'Compared with ' + ((sim && sim.compared) || 0) + ' other submission' + (sim && sim.compared === 1 ? '' : 's') + '. Shared runs of eight words or more.';
  } catch (e) { o.course.state = 'error'; o.course.note = why(e); }
  try {
    const w = await call('webCheck');
    if (w && w.off) { o.web.state = 'off'; o.web.note = 'Web search is not switched on. The owner adds a search key in the console.'; }
    else if (!w || !w.found) { o.web.state = 'clear'; o.web.note = ((w && w.checked) || 0) + ' distinctive sentences searched. None was found on a page in Brave Search’s index.'; }
    else {
      (w.sentences || []).filter(x => x && (x.hits || []).length).forEach(x => { const h = x.hits[0];
        o.web.items.push({ kind: 'web', quote: x.sentence, where: 'On the web: ' + (h.title || h.link || ''), link: h.link || '', flag: { kind: 'web', quote: x.sentence, link: h.link || '', title: h.title || '' } }); });
      o.web.state = o.web.items.length ? 'found' : 'clear';
      o.web.note = w.found + ' of ' + w.checked + ' sentences found. A lead, not proof: open the page and read it. Web results by Brave Search.';
    }
  } catch (e) { o.web.state = 'error'; o.web.note = why(e); }
  if (!sim) { o.para.state = 'error'; o.para.note = 'It reads the passages the first pass finds, and the first pass could not run.'; }
  else if (!(sim.matches || []).length) { o.para.state = 'skip'; o.para.note = 'It reads the passages the first pass finds, and the first pass found none.'; }
  else {
    try {
      const ai = await call('aiCheck');
      if (ai && ai.off) { o.para.state = 'off'; o.para.note = 'The paraphrase pass is not switched on. The owner adds a key in the console.'; }
      else {
        let errs = 0;
        ((ai && ai.results) || []).forEach(r => { if (r.error) errs++;
          (r.pairs || []).forEach(x => o.para.items.push({ kind: 'paraphrase', quote: x.a, where: 'Says the same, in other words, as a passage in ' + (r.course || 'another course') + ' (' + name(r.code) + '): “' + (x.b || '') + '”' + (x.note ? ' ' + x.note : ''), flag: { kind: 'paraphrase', quote: x.a, pair: x.b, note: x.note || '', course: r.course, centre: r.centre || '', code: r.code, round: r.round } })); });
        o.para.state = o.para.items.length ? 'found' : errs ? 'error' : 'clear';
        o.para.note = o.para.items.length ? '' : errs ? 'A pair could not be read.' : ((ai && ai.note) || 'Nothing beyond the brief.');
      }
    } catch (e) { o.para.state = 'error'; o.para.note = why(e); }
  }
  o.at = new Date().toISOString(); MKN_OWN = o; MKN_OWN_BUSY = false;

}
/* THE OWN-WORK SHEET (drawing v4-12) */

  /* the paste listener is the page's one, above; it reads through X_READ, set once readNow exists */
  /* Lines that start with >> are comments on the work: >> "the words": the comment,
     or >> the comment, right under the paragraph it is about (19 Oct 2026). */
  /* Ticks typed INTO the paragraph (Ramy, 19 Oct 2026: a trainer who marks in
     Word puts a ✓ after the words, not a comment on the side). Each ✓ becomes a
     tick on the words just before it, back to the last tick or the last full
     stop; ✓✓ is two ticks. Only the work is read, never the marking frame. */
  function inlineTicks(txt){
    const out = []; let body = String(txt||''); const at = body.search(/^\s*#\s+Marking\b/m); if (at >= 0) body = body.slice(0, at);
    body.split(/\r?\n/).forEach(line => {
      if (/^\s*>>/.test(line)) return;
      const re = /[\u2713\u2714\u221a]+/g; let m, from = 0;
      while ((m = re.exec(line))) {
        const before = line.slice(from, m.index); from = m.index + m[0].length;
        const parts = before.trim().split(/(?<=[.!?])\s+/); let words = parts[parts.length - 1].trim();
        const ws = words.split(/\s+/); if (ws.length > 8) words = ws.slice(-8).join(' ');
        words = words.replace(/^[\s"\u201c\u2018'(\[]+/, '').trim();
        if (words.replace(/[^a-z0-9]/gi, '').length >= 3) out.push({ anchor: words, text: '\u2713'.repeat(m[0].length) });
      }
    });
    return out;
  }
  function markerComments(txt){
    const out = []; let prev = '';
    String(txt||'').split(/\r?\n/).forEach(raw => {
      const l = raw.trim(); if (!l) return;
      const m = l.match(/^>>\s*(.*)$/);
      if (!m) { prev = l.replace(/^#+\s*/, '').replace(/[\u2713\u2714\u221a]/g, ''); return; }
      let body = m[1], anchor = prev, text = body;
      const q = body.match(/^["\u201c'\u2018](.+?)["\u201d'\u2019]\s*[:\-\u2013\u2014]?\s*([\s\S]*)$/);
      if (q) { anchor = q[1]; text = q[2]; }
      if (text.trim()) out.push({ anchor, text: text.trim() });
    });
    return out;
  }
  X_READ = () => readNow();
  function readNow(srcText, sideComments){
    const txt = typeof srcText === 'string' ? srcText : $('xText').value; if (!txt.trim()) return;
    const notes = (sideComments || []).concat(markerComments(txt), inlineTicks(txt));
    const man = xSlotsFor(a); const byName = {}; man.forEach(m => byName[m.heading.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()] = m.id);
    man.forEach(m => { const mm = m.heading.match(/^(Criterion \d+)/); if (mm) byName[mm[1].toLowerCase()] = m.id; });
    const norm = h => String(h||'').toLowerCase().replace(/[\u2018\u2019\u201c\u201d"']/g,'').replace(/[^a-z0-9]+/g,' ').trim();
    let body = txt.replace(/<!--\s*lite:slots[\s\S]*?-->/g,''); const at = body.search(/^\s*#\s+Marking\b/m); if (at>=0) body = body.slice(at);
    const found = {}, unplaced = [];
    /* Same two habits as the feedback form: a model may render the slots as
       H3, or number them. Both were landing nothing here (24 Sep 2026). */
    let secs = HubExchange.sections(body);
    const named = ss => ss.some(sec => byName[norm(sec.heading)] || byName[norm((HubExchange.deNumber||(x=>x))(sec.heading))]);
    if (!named(secs)) secs = HubExchange.sections(body, true);   // the model bolded its headings
    const useLevel = HubExchange.bestLevel ? HubExchange.bestLevel(secs, byName) : 2;
    const dn = HubExchange.deNumber || (x => x);
    secs.forEach(sec => {
      if (sec.level !== useLevel) return;
      let id = byName[norm(sec.heading)] || byName[norm(dn(sec.heading))]
            || byName[norm(dn(sec.heading).split(/\s[\u2014\-\u2013]\s/)[0])];
      if (!id) { if (sec.text) unplaced.push(sec.heading); return; }
      if (!sec.text) return;
      if (id === 'comment') { found[id] = { text: sec.text }; return; }
      const ls = sec.text.split(/\r?\n/).map(l=>l.replace(/^\s*[\u2022\-*]\s*/,'').trim()).filter(Boolean);
      const first = norm(ls[0]||''); let mark = null;
      if (/^not met\b/.test(first)) mark = false; else if (/^met\b/.test(first)) mark = true;
      found[id] = { mark, text: (mark===null ? ls : ls.slice(1)).join('\n') };
    });
    const done = $('xDone'); done.style.display = '';
    const ids = Object.keys(found);
    if (!ids.length && !notes.length) { done.textContent = 'Nothing in that landed \u2014 the headings ("Criterion 1 \u2014 \u2026", "General comment") need to be kept, and a comment on the work needs a line starting with >>, a comment on the side of a Word file, or a \u2713 typed after the words.'; return; }
    /* the form as it was, for Undo */
    const before = { marks: (sub.criteriaMarks[round]||[]).slice(), comments: [...document.querySelectorAll('[data-crit-comment]')].map(el=>el.value), general: ($('comment')||{}).value || '' };
    sub.criteriaMarks[round] = sub.criteriaMarks[round] || []; sub.criteriaComments[round] = sub.criteriaComments[round] || [];
    document.querySelectorAll('[data-crit-comment]').forEach(el => { sub.criteriaComments[round][+el.dataset.critComment] = el.value; });
    if (!sub.feedback) sub.feedback = { outcome:'', generalComment1:'', generalComment2:'' };
    const gk = round==='sub2' ? 'generalComment2' : 'generalComment1';
    if (!found.comment && before.general) sub.feedback[gk] = before.general;
    ids.forEach(id => {
      if (id === 'comment') { sub.feedback[gk] = found[id].text; return; }
      const i = +id.slice(4);
      if (found[id].mark !== null) sub.criteriaMarks[round][i] = found[id].mark;
      if (found[id].text) sub.criteriaComments[round][i] = found[id].text;
    });
    saveSubs(); render();
    /* the comments on the work, into the margin beside their words */
    if (window.X_LAST_PUT.ids.length && window.hubMarking && hubMarking.removeIds) hubMarking.removeIds(window.X_LAST_PUT.ids);
    const put = (notes.length && window.hubMarking && hubMarking.placeComments) ? hubMarking.placeComments(notes) : { placed: 0, unplaced: [], ids: [] };
    window.X_LAST_PUT = put;
    const names = {}; man.forEach(m => names[m.id] = m.heading);
    const d2 = $('xDone'); d2.style.display = '';
    const nc = ids.filter(id => /^crit/.test(id)).length, gc = ids.indexOf('comment') >= 0;
    const parts = [];
    /* the new layout calls that box the overall comment, and has no Save: the two sentences follow it (24 Nov 2026) */
    const NEW = document.body.classList.contains('mkn');
    if (nc || gc) parts.push('filled ' + (nc ? nc + (nc === 1 ? ' criterion' : ' criteria') : '') + (nc && gc ? ' and ' : '') + (gc ? (NEW ? 'the overall comment' : 'the general comment') : ''));
    const nTk = notes.filter(n => /^[\u2713\u2714\u221a]+$/.test(String(n.text||'').trim())).length, nPl = put.placed - Math.min(put.placed, nTk);
    if (nPl) parts.push('placed ' + nPl + (nPl === 1 ? ' comment' : ' comments') + (NEW ? ' on the text' : ' in the margin'));
    if (put.placed && nTk) parts.push('put ' + Math.min(put.placed, nTk) + (Math.min(put.placed, nTk) === 1 ? ' tick' : ' ticks') + ' on the work');
    const said = parts.join(', and ');
    d2.innerHTML = (said ? said.charAt(0).toUpperCase() + said.slice(1) + (NEW ? '. Check them before you return it.' : '. Check them, then save.') : '')
      + (put.unplaced.length ? ' <span class="x-unplaced">' + (put.unplaced.length === 1 ? 'One comment' : put.unplaced.length + ' comments') + ' could not be matched to the words in the work, so ' + (put.unplaced.length === 1 ? 'it is' : 'they are') + ' here to add by hand: ' + put.unplaced.map(t => '\u201c' + esc(t.length > 90 ? t.slice(0, 88) + '\u2026' : t) + '\u201d').join('; ') + '.</span>' : '')
      + (unplaced.length ? ' Headings not recognized: ' + unplaced.map(esc).join(', ') + '.' : '') + ' <button type="button" class="example-btn" id="xUndo">Undo</button>';
    $('xUndo').addEventListener('click', ()=>{
      sub.criteriaMarks[round] = before.marks; before.comments.forEach((v,i)=>{ sub.criteriaComments[round][i] = v; });
      sub.feedback[gk] = before.general; saveSubs(); render();
      if (put.ids.length && window.hubMarking && hubMarking.removeIds) hubMarking.removeIds(put.ids);
      window.X_LAST_PUT = { ids: [] };
      const d3 = $('xDone'); if (d3) { d3.style.display=''; d3.textContent = 'Put back as it was.'; }
    });
  }
}

/* ---- FROM THE STUDENT INTERVIEW (15 Oct 2026) -----------------------------
   Focus on the Learner only: what this trainee wrote and heard in their student
   interview, folded above the work, for the tutor to read against the claims.
   Read-only; the notes are the trainee's own, on their link. */
function folIvMount(){
  try {
    const old = document.getElementById('folIv'); if (old) old.remove();
    if (CURRENT !== 'fol' || !window.CONNECT_HUB_FOL || !TRAINEE_ID) return;
    const tr = (loadRoster().trainees || {})[TRAINEE_ID];
    const inner = window.CONNECT_HUB_FOL.summaryHtml(tr && tr.interview);
    let pool = []; try { pool = JSON.parse(localStorage.getItem('connect_fol_pool_v1') || '[]') || []; } catch (e) {}
    if (!inner && !pool.length) return;
    const box = document.createElement('details'); box.id = 'folIv'; box.className = 'card'; box.style.marginTop = '14px';
    box.innerHTML = '<summary style="cursor:pointer;font-weight:700">From their student interview</summary><div style="margin-top:8px;font-size:.9rem;line-height:1.55">' + (inner || '<p class="note" style="margin:0">They have not written their interview yet.</p>') + '<p style="margin:14px 0 4px;font-weight:700">The pool, the whole course</p>' + window.CONNECT_HUB_FOL.poolHtml(pool) + '</div>';
    /* under the new layout the fold sits at the foot of the work, never above the bar (24 Nov 2026) */
    const app = document.getElementById('app');
    if (document.body.classList.contains('mkn')) { const foot = document.getElementById('mkWork') || app; if (foot) foot.appendChild(box); }
    else if (app) app.insertBefore(box, app.firstChild);
    window.CONNECT_HUB_FOL.wirePlay(box);
  } catch (e) {}
}
(function(){ if (typeof render !== 'function') return; const r0 = render; render = function(){ r0.apply(this, arguments); folIvMount(); }; folIvMount(); })();
