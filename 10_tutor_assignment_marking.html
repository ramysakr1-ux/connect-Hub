<style>
  :root{
    --sand:oklch(92.5% 0.012 85); --sand-line:oklch(89.5% 0.012 82); --sand-deep:oklch(94.8% 0.01 85);
    --paper:oklch(96.4% 0.014 85);
    /* the control fill, for the shared confirm modal's Cancel button */
    --box:oklch(96.2% 0.02 80); --card:oklch(96.2% 0.02 80); --ink:oklch(23.5% 0.017 65);
    --teal:oklch(37.5% 0.058 195); --grey:oklch(51% 0.017 70); --brick:oklch(45% 0.15 27);
  }
  *{box-sizing:border-box;}
  a{color:var(--teal);} a:hover{color:oklch(30% 0.06 195);}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:32px 16px 80px; display:flex; justify-content:center;}
  .board{max-width:760px; width:100%;}
  .back{display:inline-block; margin-bottom:16px; font-size:0.85rem; font-weight:600; text-decoration:none;}
  .back:hover{text-decoration:underline;}
  .picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .picker button{font-family:'Karla',sans-serif; font-size:0.82rem; font-weight:600; padding:7px 14px; border-radius:16px;
    border:1.5px solid var(--sand-line); background:var(--card); color:var(--ink); cursor:pointer;}
  .picker button.active{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .header{background:var(--paper); border-radius:6px; margin-bottom:20px; border-top:2px solid var(--teal); padding:22px 26px;}
  .header h1{font-family:'Newsreader',Georgia,serif; font-size:1.6rem; margin:0;}
  .duerow{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:12px;
    padding:10px 14px; border-radius:6px; background:var(--box); border:1.5px solid var(--sand-line);}
  .duerow.past{background:oklch(96% 0.03 27); border-color:oklch(45% 0.15 27);}
  .duerow .dueline{flex:1; min-width:220px; font-size:0.84rem; font-weight:600; color:var(--ink-warm);}
  .duerow.past .dueline{color:oklch(45% 0.15 27);}
  .duerow .dueacts{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .duerow input{font-family:'Karla',sans-serif; font-size:0.82rem; padding:6px 10px;
    border:1.5px solid var(--sand-line); border-radius:6px; background:#FFFDF8;}
  .stage-pill{display:inline-block; font-size:0.78rem; font-weight:700; padding:3px 10px; border-radius:10px; margin-top:8px;}
  .stage-pill.submitted{background:oklch(90% 0.05 260); color:oklch(40% 0.1 260);}
  .stage-pill.resubmitted{background:oklch(93% 0.06 60); color:oklch(40% 0.1 60);}
  .stage-pill.closed{background:oklch(93% 0.05 145); color:oklch(35% 0.08 145);}
  .stage-pill.draft{background:var(--sand-deep); color:var(--grey);}
  /* Gold edges the assignment card -- the same rule as the exchange card below and the candidate's screen. */
  .card{background:var(--paper); border-radius:6px; padding:18px 22px; margin-bottom:16px; border-left:5px solid var(--gold, oklch(63% 0.096 72));}
  .card h2{font-family:'Newsreader',Georgia,serif; font-size:1.05rem; margin:0 0 8px;}
  .roundlabel{font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--teal); margin:0 0 6px;}
  .readonly{white-space:pre-wrap; font-size:0.88rem; line-height:1.6; background:#FFFDF8; border:1.5px solid var(--sand-line); border-radius:6px; padding:10px 12px; margin-bottom:10px;}
  textarea, select, input[type=text]{width:100%; font-family:'Karla',sans-serif; font-size:0.9rem; padding:9px 12px; border:1.5px solid var(--sand-line);
    border-radius:6px; background:var(--box); color:var(--ink); line-height:1.55; resize:vertical;}
  .xchg{margin:14px 0 4px; padding:12px 14px; border:1.5px solid var(--gold, oklch(63% 0.096 72)); border-left-width:5px; border-radius:6px; background:var(--box, oklch(96.2% 0.02 80));}
  .xchg-acts{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  #xText{width:100%; font-family:ui-monospace,Menlo,monospace; font-size:0.8rem; line-height:1.5; padding:10px 12px; border:1.5px solid var(--sand-line); border-radius:6px; background:#FFFDF8;}
  .mats-open{display:inline-block; font-size:0.78rem; font-weight:700; padding:5px 12px; border-radius:16px;
    background:var(--teal); color:var(--paper); text-decoration:none;}
  .outcomes{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .outcomes button{font-family:'Karla',sans-serif; font-size:0.85rem; font-weight:600; padding:8px 16px; border-radius:16px;
    border:1.5px solid var(--sand-line); background:var(--card); cursor:pointer;}
  .outcomes button.active{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .critrow{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid var(--sand-line);}
  .critrow:last-child{border-bottom:none;}
  .critrow .txt{font-size:0.87rem; line-height:1.5; flex:1;}
  .critline{display:flex; align-items:flex-start; justify-content:space-between; gap:14px;}
  /* A phone. The criterion was squeezed into a narrow column beside its pill
     and wrapped to four lines, and the pill itself was 26px tall -- half a
     thumb (Ramy, 24 Sep 2026). The pill drops under the text and becomes
     something you can actually hit, and the two buttons at the foot stop
     sharing a line and wrapping their own labels. */
  @media(max-width:560px){
    .critline{flex-direction:column; align-items:stretch; gap:8px;}
    .crit-toggle{width:100%; min-height:44px;}
    .mats-open{display:inline-flex; align-items:center; min-height:44px;}
    .actions{flex-direction:column; align-items:stretch; gap:8px;}
    .actions .btn{width:100%; min-height:46px;}
  }
  .crit-toggle{font-family:'Karla',sans-serif; font-size:0.78rem; font-weight:700; padding:5px 12px; border-radius:14px; border:1.5px solid var(--sand-line);
    background:var(--card); color:var(--grey); cursor:pointer; flex:none; white-space:nowrap;}
  .crit-toggle.met{background:oklch(93% 0.05 145); border-color:oklch(70% 0.1 145); color:oklch(35% 0.08 145);}
  .crit-toggle.not{background:oklch(92% 0.08 27); border-color:oklch(70% 0.12 27); color:var(--brick);}
  .derived{font-size:0.9rem; font-weight:700; padding:8px 14px; border-radius:8px; margin:12px 0; display:inline-block;}
  .derived.pending{background:var(--sand-deep); color:var(--grey);}
  .derived.pass{background:oklch(93% 0.05 145); color:oklch(35% 0.08 145);}
  .derived.fail{background:oklch(92% 0.08 27); color:var(--brick);}
  .row label{display:block; font-size:0.75rem; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px;}
  .actions{display:flex; justify-content:flex-end; gap:10px; margin-top:16px;}
  .btn{font-family:'Karla',sans-serif; font-size:0.88rem; font-weight:700; padding:10px 22px; border-radius:20px; border:none; cursor:pointer;}
  .btn-teal{background:var(--teal); color:var(--paper);}
  .btn-teal:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-sand{background:var(--sand-deep); color:var(--ink);}
  .note{font-size:0.8rem; color:var(--grey); margin:0 0 14px;}
</style>

<body class="hub-assign">
<div class="board">
  <a class="back" href="5_tutor_dashboard.html">&#8592; Back to dashboard</a>
<div class="picker" id="picker"></div>
  <div id="app"></div>
</div>
<script src="assignment-defaults.js?v=202609241900"></script>
<script src="hub-exchange.js?v=202609240203"></script>
<script src="hub-due.js?v=202609240203"></script>
<script src="hub-shared.js?v=202609241900"></script>
<script src="hub-store.js?v=202609241900"></script>
<script src="hub-sync.js?v=202609241900"></script>
<script type="text/x-hub-app">
/* Whose room this is -- see hubTutorRoomOnly in hub-shared.js. A trainee or an
   assessor who reached this page got the whole editable feedback form, grade
   dropdown and all (walk, 22 Sep 2026). */
if (window.hubTutorRoomOnly && hubTutorRoomOnly())
  throw new Error('Connect Lite: stopping this page on purpose \u2014 the tutors\u2019 room is not open to this link.');

const WORDING_KEY = 'connect_assignment_wording_v2';
const SUB_KEY = 'connect_assignment_submissions_v1';
let ORDER = ['fol','lrt','lsrt','lfc','a5']; // replaced by the centre's order once the wording is read
const NAMES = { lrt:'LRT', lsrt:'LSRT', fol:'FOL', lfc:'LFC', a5:'Assignment 5' };
const $ = id => document.getElementById(id);
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

let WORDING = null;
try { WORDING = JSON.parse(localStorage.getItem(WORDING_KEY)); } catch(e) {}
// Nothing saved in this browser: the centre's standard wording (assignment-defaults.js).
if (!WORDING && window.CONNECT_HUB_DEFAULT_WORDING) WORDING = JSON.parse(JSON.stringify(window.CONNECT_HUB_DEFAULT_WORDING));
if (WORDING) { Object.keys(WORDING).forEach(k => {
  const a = WORDING[k]; if (!a || !a.criteria) return;
  a.criteria = a.criteria.map(c => typeof c === 'string' ? {text:c, sectionIndex:null} : c);
}); }
ORDER = hubAssignmentOrder(WORDING);

const ROSTER_KEY = 'connect_roster_v1';
function loadRoster(){ try{ return JSON.parse(localStorage.getItem(ROSTER_KEY)) || {trainees:{}}; }catch(e){ return {trainees:{}}; } }
function saveRoster(r){ localStorage.setItem(ROSTER_KEY, JSON.stringify(r)); }

const params = new URLSearchParams(location.search);
/* No assignment named: open the first one in the CENTRE's order, not a
   hard-coded one. This read defaulted to 'lrt', so the trainee home's
   "Written assignments" door landed on the second assignment however the
   centre had ordered them (trainee walk, 21 Sep 2026). */
let CURRENT = params.get('a') || (hubAssignmentOrder(WORDING).filter(k => k !== 'a5')[0] || 'fol');
const TRAINEE_ID = params.get('trainee') || '';
let OUTCOME = '';

/* Every door into this screen -- the dashboard's rows and the tracker's
   actions -- carries ?trainee=. Reached without one (a stale bookmark, a
   hand-typed URL), it used to fall through to connect_assignment_submissions_v1,
   which is a TRAINEE's own key and means nothing in a tutor's browser: an empty
   mark sheet, headed with the assignment's real name, that a tutor could type
   marks into for nobody. Found walking the tutor role, 21 Sep 2026. A mark
   sheet needs to know whose work it is. */
let SUBS = null;
if (TRAINEE_ID) {
  const roster = loadRoster();
  const tr = roster.trainees[TRAINEE_ID];
  SUBS = (tr && tr.assignments) || {};
} else {
  try { SUBS = JSON.parse(localStorage.getItem(SUB_KEY)); } catch(e) {}
}
if (!SUBS) SUBS = {};

/* Giving ONE candidate more time.
 *
 * The deadline belongs to the assignment and to everybody on the course. An
 * extension belongs to one person, so it is written into that candidate's own
 * tracker record -- TUTOR_ONLY in hub-sync, which is what stops a candidate
 * granting themselves one -- and hub-due only ever lets it ADD time.
 *
 * Offered whether or not the deadline has passed: a tutor who knows on Tuesday
 * that someone is in hospital should not have to wait until Friday night for
 * the button to appear (24 Sep 2026). */
function extKey(sub){
  return 'a:' + CURRENT + (sub && sub.stage === 'resubmission_needed' ? ':resub' : '');
}
function extensionsOf(){
  if (!TRAINEE_ID) return {};
  const tr = loadRoster().trainees[TRAINEE_ID];
  return (tr && tr.tracker && tr.tracker.extensions) || {};
}
function setExtension(sub, iso){
  if (!TRAINEE_ID) return;
  const roster = loadRoster();
  const tr = roster.trainees[TRAINEE_ID] || (roster.trainees[TRAINEE_ID] = { id:TRAINEE_ID, name:'Trainee', tp:{}, assignments:{} });
  tr.tracker = tr.tracker || {};
  tr.tracker.extensions = tr.tracker.extensions || {};
  if (iso) tr.tracker.extensions[extKey(sub)] = iso; else delete tr.tracker.extensions[extKey(sub)];
  saveRoster(roster);
  render();
}
function baseDue(a, sub){
  return sub && sub.stage === 'resubmission_needed'
    ? HubDue.windowFrom(sub.marked1At || sub.returnedAt, a && a.resubDays)
    : (a && a.dueAt) || '';
}
function dueRowHTML(a, sub){
  if (!TRAINEE_ID) return '';                       // nobody to extend
  const mine = HubDue.forPerson(baseDue(a, sub), extensionsOf()[extKey(sub)]);
  const st = HubDue.state(mine.iso);
  const isResub = sub.stage === 'resubmission_needed';
  const settled = sub.stage === 'submitted' || sub.stage === 'resubmitted' || sub.stage === 'closed';
  if (!st.has && settled) return '';
  const line = !st.has
    ? (isResub ? 'No resubmission window set for this assignment.' : 'No deadline set for this assignment.')
    : (st.past ? (isResub ? 'Resubmission closed ' : 'Closed ') + esc(st.due)
               : 'Due ' + esc(st.due) + ' \u00b7 ' + esc(st.text))
      + (mine.extended ? ' \u2014 extended for this candidate' : '');
  const prefill = HubDue.toLocalInput(new Date(Date.now() + 3 * HubDue.DAY).toISOString());
  return `<div class="duerow ${st.past ? 'past' : ''}">
    <span class="dueline">${line}</span>
    ${settled ? '' : `<span class="dueacts">
      <input type="datetime-local" id="extAt" value="${esc(HubDue.toLocalInput(mine.extended ? mine.iso : '') || prefill)}">
      <button type="button" class="btn btn-quiet" id="extSet">${mine.extended ? 'Change it' : 'Give more time'}</button>
      ${mine.extended ? '<button type="button" class="btn btn-quiet" id="extClear">Remove</button>' : ''}
    </span>`}
  </div>`;
}

function saveSubs(){
  if (TRAINEE_ID) {
    const roster = loadRoster();
    if (!roster.trainees[TRAINEE_ID]) roster.trainees[TRAINEE_ID] = { id:TRAINEE_ID, name:'Trainee', tp:{}, assignments:{} };
    roster.trainees[TRAINEE_ID].assignments = SUBS;
    saveRoster(roster);
  } else {
    localStorage.setItem(SUB_KEY, JSON.stringify(SUBS));
  }
}
function subFor(key){ if (!SUBS[key]) SUBS[key] = { stage:'draft', usedResubmission:false, sub1:null, sub2:null, feedback:null, criteriaMarks:{sub1:[],sub2:[]}, criteriaComments:{sub1:[],sub2:[]}, markers:{first:'',second:'',doubleMarked:false} }; if(!SUBS[key].criteriaMarks) SUBS[key].criteriaMarks={sub1:[],sub2:[]}; if(!SUBS[key].criteriaComments) SUBS[key].criteriaComments={sub1:[],sub2:[]}; if(!SUBS[key].markers) SUBS[key].markers={first:'',second:'',doubleMarked:false}; return SUBS[key]; }

function renderPicker(){
  const suffix = TRAINEE_ID ? '&trainee='+encodeURIComponent(TRAINEE_ID) : '';
  $('picker').innerHTML = ORDER.filter(k => WORDING && WORDING[k] && (k !== 'a5' || a5InPlay(SUBS))).map(k =>
    `<button class="${k===CURRENT?'active':''}" data-a="${k}">${NAMES[k]}</button>`).join('')
    + (TRAINEE_ID ? `<span style="margin-left:12px; color:var(--grey); font-size:0.85rem; align-self:center;">Marking: ${esc((loadRoster().trainees[TRAINEE_ID]||{}).name||'trainee')}</span>` : '');
}
$('picker').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; location.search='?a='+b.dataset.a+(TRAINEE_ID?'&trainee='+encodeURIComponent(TRAINEE_ID):''); });

function summarize(a, snap){
  if (!snap) return '<p class="note">Nothing submitted yet.</p>';
  let out = '';
  /* The materials the candidate linked -- worksheets, the coursebook page, a
     recording -- as something to OPEN, at the top of the submission. It was
     stored on every snapshot and read only for the overlap check; a tutor
     marking the assignment had no way to look at what it referred to
     (Ramy, 24 Sep 2026: "for assignments as well"). */
  const ml = (snap.materialsLink||'').trim();
  if (ml) out += `<p style="margin:0 0 10px;"><a class="mats-open" href="${esc(ml)}" target="_blank" rel="noopener">Open the materials \u2197</a></p>`;
  a.sections.forEach((s,i) => {
    if (s.type==='text' && !/before you start/i.test(s.label) && snap.text && snap.text[i]) {
      out += `<div class="roundlabel">${esc(s.label)}</div><div class="readonly">${nl2br(snap.text[i])}</div>`;
    } else if (s.type==='picker' && snap.picked && snap.picked[i]) {
      const p = snap.picked[i];
      out += `<div class="roundlabel">${esc(s.label)}</div><div class="readonly">${esc(s.catA.label)}: ${p.A.map(esc).join(', ')||'\u2014'}\n${esc(s.catB.label)}: ${p.B.map(esc).join(', ')||'\u2014'}</div>`;
    } else if (s.type==='fields' && snap.fields) {
      const items = (snap.picked && (function(){ for(let j=i-1;j>=0;j--){ if(a.sections[j].type==='picker'){ const p=snap.picked[j]||{A:[],B:[]}; return p.A.concat(p.B);} } return []; })());
      (items||[]).forEach((item, ii) => {
        out += `<div class="roundlabel">${esc(s.label)} \u2014 ${esc(item)}</div>`;
        s.fields.forEach((f,fi) => {
          const v = snap.fields[`s${i}_i${ii}_f${fi}`];
          if (v) out += `<div class="readonly"><strong>${esc(f.label)}:</strong> ${nl2br(v)}</div>`;
        });
      });
    } else if (s.type==='declaration' && snap.decl && snap.decl[i]) {
      const d = snap.decl[i];
      out += `<div class="roundlabel">Declaration</div><div class="readonly">${s.items.map((it,ci)=>`${d.checks[ci]?'\u2611':'\u2610'} ${esc(it)}`).join('\n')}${s.aiToggle?`\nAI used: ${d.aiUsed==='yes'?('Yes \u2014 '+esc(d.aiPurpose)+' \u2014 '+esc(d.aiLink)):'No'}`:''}</div>`;
    }
  });
  return out || '<p class="note">Nothing submitted yet.</p>';
}

function render(){
  /* Every door into this screen -- the dashboard's rows, the tracker's actions
     -- carries ?trainee=. Reached without one (a stale bookmark, a hand-typed
     URL), this used to fall through to connect_assignment_submissions_v1, which
     is a TRAINEE's own key and means nothing in a tutor's browser: an empty
     mark sheet under the assignment's real name, which a tutor could type marks
     into for nobody. Found walking the tutor role, 21 Sep 2026. */
  if (!TRAINEE_ID) {
    $('picker').innerHTML = '';
    $('app').innerHTML =
      '<div style="max-width:560px; padding:26px 0;">' +
      '<h2 style="margin:0 0 10px; font-family:\'Newsreader\',Georgia,serif; font-weight:600; font-size:1.3rem;">Whose work?</h2>' +
      '<p style="margin:0 0 20px; font-size:0.9rem; line-height:1.6; color:var(--grey);">A mark sheet belongs to one candidate and one assignment. Open it from the dashboard or the candidate tracker, where the row you click says which.</p>' +
      '<a class="btn" href="5_tutor_dashboard.html">Back to dashboard</a></div>';
    return;
  }
  const a = WORDING && WORDING[CURRENT];
  if (!a){ $('app').innerHTML = '<div class="card"><p class="note">This assignment isn\u2019t set up yet.</p></div>'; return; }
  if (CURRENT === 'a5' && !a5InPlay(SUBS)){ $('app').innerHTML = '<div class="card"><p class="note">Assignment 5 has not been set for this candidate. Set it from the assignment where the plagiarism was found.</p></div>'; return; }
  const sub = subFor(CURRENT);
  OUTCOME = (sub.feedback && sub.feedback.outcome) || OUTCOME;

  let html = `<div class="header"><p class="eyebrow">Written assignments · marking</p><h1>${esc(a.title)}</h1>
    <span class="stage-pill ${sub.stage}">${({draft:'Not submitted', submitted:'Awaiting marking', returned_unmarked:'Returned unmarked', resubmission_needed:'Resubmission needed', resubmitted:'Resubmission awaiting marking', closed:'Closed'})[sub.stage]}</span>
    ${dueRowHTML(a, sub)}
    ${CURRENT !== 'a5' ? (a5InPlay(SUBS)
      ? `<p class="note" style="margin:12px 0 0;">Assignment 5 (plagiarism reflection) is set for this candidate${SUBS.a5 && SUBS.a5.assignedAfter ? ' after ' + esc(NAMES[SUBS.a5.assignedAfter] || SUBS.a5.assignedAfter) : ''}.${SUBS.a5 && SUBS.a5.stage === 'draft' ? ' <button type="button" class="btn btn-quiet" id="a5WithdrawBtn" style="margin-left:8px;">Withdraw it</button>' : ''}</p>`
      : `<p class="note" style="margin:12px 0 0;">Plagiarism found here? <button type="button" class="btn btn-quiet" id="a5SetBtn">Set Assignment 5 (plagiarism reflection)</button> It is a centre sanction, not one of the four, and stays out of sight until set.</p>`) : ''}
  </div>`;

  if (sub.stage !== 'draft') {
    let overlapFlag = '';
    try {
      const plan = TRAINEE_ID ? ((loadRoster().trainees[TRAINEE_ID]||{}).tp||{}).plan : JSON.parse(localStorage.getItem('chub:plan'));
      const matsLink = plan && plan.state && plan.state.plan && plan.state.plan.matsLink && plan.state.plan.matsLink.trim();
      const subLink = sub.sub1 && sub.sub1.materialsLink && sub.sub1.materialsLink.trim();
      if (matsLink && subLink && matsLink === subLink) {
        overlapFlag = `<div class="card" style="border-left-color:var(--brick);"><h2 style="color:var(--brick);">Materials overlap flagged</h2><p class="note" style="margin:0;">This assignment's materials link matches the trainee's TP lesson plan materials link. Handbook 9.2.1: materials for LRT/LSRT should not be the basis for an assessed TP lesson, or vice versa. Worth a look before marking \u2014 this is a flag, not an accusation.</p></div>`;
      }
    } catch(e) {}
    html += overlapFlag;
    html += `<div class="card"><h2>Marker record</h2>
      <div class="row"><label>1st marker</label><input type="text" id="marker1" value="${esc(sub.markers.first)}" placeholder="Name"></div>
      <div class="row"><label>2nd marker (double-marking)</label><input type="text" id="marker2" value="${esc(sub.markers.second)}" placeholder="Leave blank if this assignment isn\u2019t in the double-marked sample"></div>
      <p class="note" style="margin:0;">Handbook 9.2.3: a set proportion of each assignment must be double-marked (3 up to 9 candidates, 4 up to 16, 5 up to 24), initialled by both tutors.</p>
    </div>`;
  }

  if (sub.stage === 'draft') {
    html += `<div class="card"><p class="note">Nothing to mark yet \u2014 the trainee hasn\u2019t submitted this assignment.</p></div>`;
  } else {
    html += `<div class="card"><h2>First submission</h2>${summarize(a, sub.sub1)}</div>`;
    if (sub.sub2) html += `<div class="card"><h2>Resubmission</h2>${summarize(a, sub.sub2)}</div>`;
    if (sub.feedback && sub.feedback.outcome) {
      html += `<div class="card"><h2>Your feedback</h2><div class="readonly">${esc(sub.feedback.outcome)}${sub.feedback.generalComment1?('\n\n'+nl2br(sub.feedback.generalComment1)):''}${sub.feedback.generalComment2?('\n\n'+nl2br(sub.feedback.generalComment2)):''}</div></div>`;
    }

    if (sub.stage === 'resubmission_needed') {
      html += `<div class="card"><p class="note">Waiting on the trainee to resubmit \u2014 nothing more to mark until they do.</p></div>`;
    } else if (sub.stage === 'submitted' || sub.stage === 'resubmitted') {
      const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
      const crit = (a.criteria||[]);
      const marks = sub.criteriaMarks[round];
      const allMarked = crit.length>0 && crit.every((c,i)=>marks[i]===true||marks[i]===false);
      const allMet = allMarked && crit.every((c,i)=>marks[i]===true);
      let derivedLabel, derivedCls;
      if (!allMarked) { derivedLabel = 'Mark every criterion to see the outcome'; derivedCls='pending'; }
      else {
        /* The SAME rule the save uses -- outcomeFor(). This pill used to work
           the answer out for itself and keyed only on the round, so for a
           candidate who had already used their one resubmission it read
           "Resubmission needed" while the note directly above it said the
           mark was a final Fail and the save recorded exactly that, closing
           the assignment. The tutor was shown one decision and made another,
           on a candidate's pass or fail (walk, 21 Sep 2026). */
        derivedLabel = outcomeFor(round, allMet, sub);
        derivedCls = /^Pass/.test(derivedLabel) ? 'pass' : 'fail';
      }

      let deadlineWarn = '';
      try {
        const cs = JSON.parse(localStorage.getItem('connect_course_settings'));
        if (cs && cs.end) {
          const end = new Date(cs.end + 'T23:59:59');
          const threeDaysOut = new Date(); threeDaysOut.setDate(threeDaysOut.getDate() + 3);
          if (round === 'sub1' && threeDaysOut > end) {
            deadlineWarn = `<p class="note" style="color:var(--brick);">A resubmission window (typically a few days) may run past the course end date (${esc(cs.end)}) \u2014 Handbook 9.2.3 requires the chance to resubmit within the span of the course. Check the trainee has real time left before sending this back.</p>`;
          }
        }
      } catch(e) {}
      html += `<div class="card"><h2>Assessment criteria</h2>
        ${deadlineWarn}
        ${sub.stage==='submitted' && sub.usedResubmission ? '<p class="note">This candidate has already used their one resubmission for this assignment \u2014 any criterion Not met here is a final Fail.</p>' : ''}
        ${crit.length ? crit.map((c,i)=>{
          const m = marks[i];
          const cls = m===true?'met':m===false?'not':'';
          const label = m===true?'Met':m===false?'Not met':'Not yet marked';
          const cm = (sub.criteriaComments[round]||[])[i] || '';
          /* Marking a RESUBMISSION is the act of checking whether what you
             flagged got fixed -- so the first round's verdict and your own note
             belong here, beside the control you are about to press. They were
             stored and rendered on the record, but this screen showed eight
             criteria all reading "Not yet marked" and nothing else, so the
             tutor re-judged blind or went hunting for their own words on
             another screen (walk, 21 Sep 2026). The candidate's own screen has
             always shown them these comments; the tutor had the worse view of
             the two. */
          const prevMark = round==='sub2' ? (sub.criteriaMarks.sub1||[])[i] : undefined;
          const prevComment = round==='sub2' ? ((sub.criteriaComments.sub1||[])[i] || '') : '';
          const prevLine = prevMark===undefined && !prevComment ? '' :
            `<div class="note" style="margin:6px 0 0; padding:6px 9px; border-radius:6px; background:var(--sand); font-size:0.78rem; line-height:1.5;">
              <b>First submission:</b> ${prevMark===true?'Met':prevMark===false?'Not met':'not marked'}${prevComment?` \u2014 ${esc(prevComment)}`:''}
            </div>`;
          return `<div class="critrow" style="flex-direction:column; align-items:stretch;">
            <div class="critline">
              <div class="txt">${esc(c.text)}</div>
              <button class="crit-toggle ${cls}" data-crit="${i}">${label}</button>
            </div>
            ${prevLine}
            <textarea data-crit-comment="${i}" rows="2" placeholder="Comment on this criterion (shown to the trainee if resubmitting)" style="margin-top:8px;">${esc(cm)}</textarea>
          </div>`;
        }).join('') : '<p class="note">No marking criteria set for this assignment yet \u2014 add them in the assignment builder.</p>'}
        <div class="derived ${derivedCls}">${derivedLabel}</div>
        <div class="xchg" id="xchg">
          <div class="xchg-acts">
            <button type="button" class="btn btn-gold" id="xCopy">Copy</button>
            <span class="note" style="margin:0;">the submission and the criteria, as text.</span>
            <button type="button" class="btn btn-quiet" id="xPasteToggle" style="margin-left:auto;">Paste something back</button>
          </div>
          <div id="xPaste" style="display:none; margin-top:12px;">
            <textarea id="xText" rows="4" placeholder="Paste here — it goes straight into the criteria. The outcome is still worked out from the marks."></textarea>
          </div>
          <p class="note" id="xDone" style="display:none; margin:8px 0 0;"></p>
        </div>
        <div class="row" style="margin-top:12px;"><label>General comment${round==='sub2'?' on the resubmission':''} (optional)</label>
          <textarea id="comment" rows="3">${esc((sub.feedback&&(round==='sub2'?sub.feedback.generalComment2:sub.feedback.generalComment1))||'')}</textarea></div>
        <div class="actions">
          <button type="button" class="btn btn-quiet" id="unmarkedBtn">Return unmarked</button>
          <button class="btn btn-teal" id="saveBtn" ${allMarked?'':'disabled'}>Save & return to trainee</button>
        </div>
      </div>`;
    }
  }

  $('app').innerHTML = html;
  document.querySelectorAll('[data-crit]').forEach(b => b.addEventListener('click', () => {
    const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
    const i = +b.dataset.crit;
    const cur = sub.criteriaMarks[round][i];
    sub.criteriaMarks[round][i] = cur===true ? false : cur===false ? null : true;
    saveSubs(); render();
  }));
  const saveBtn = $('saveBtn');
  if (saveBtn) saveBtn.addEventListener('click', doSave);
  const unmarkedBtn = $('unmarkedBtn');
  if (unmarkedBtn) unmarkedBtn.addEventListener('click', doReturnUnmarked);
  wireExchange();
  const extBtn = $('extSet');
  if (extBtn) extBtn.addEventListener('click', () => {
    const v = ($('extAt') || {}).value;
    if (!v) return;
    setExtension(subFor(CURRENT), HubDue.fromLocalInput(v));
  });
  const extClr = $('extClear');
  if (extClr) extClr.addEventListener('click', () => setExtension(subFor(CURRENT), ''));

  const setBtn = $('a5SetBtn');
  if (setBtn) setBtn.addEventListener('click', async () => {
    if (!(await confirmModal('Set Assignment 5, the plagiarism reflection, for this candidate? It appears in their assignment list once you return this file to them.', 'Set Assignment 5'))) return;
    const a5 = subFor('a5');
    a5.assigned = true; a5.assignedAt = new Date().toISOString(); a5.assignedAfter = CURRENT;
    saveSubs(); renderPicker(); render();
  });
  const wBtn = $('a5WithdrawBtn');
  if (wBtn) wBtn.addEventListener('click', async () => {
    if (!(await confirmModal('Withdraw Assignment 5 for this candidate? Nothing has been submitted for it.', 'Withdraw'))) return;
    delete SUBS.a5;
    saveSubs(); renderPicker(); render();
  });
  const m1 = $('marker1'), m2 = $('marker2');
  // First marker defaults to the tutor's own name from the dashboard.
  try{ const tn=localStorage.getItem('chub:tutorName'); if(m1 && tn && !m1.value){ m1.value=tn; sub.markers.first=tn; saveSubs(); } }catch(e){}
  if (m1) m1.addEventListener('input', () => { sub.markers.first = m1.value; saveSubs(); });
  if (m2) m2.addEventListener('input', () => { sub.markers.second = m2.value; sub.markers.doubleMarked = !!m2.value.trim(); saveSubs(); });
  /* Comments keep as they are typed. Until 24 Sep 2026 only Save read them,
     and render() rebuilds the whole form on every pill click -- so a comment
     typed on criterion 1 vanished the moment criterion 2 was marked, and a
     tutor who switched candidate lost everything but the pills. */
  const rnd = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
  document.querySelectorAll('[data-crit-comment]').forEach(el => el.addEventListener('input', () => {
    sub.criteriaComments[rnd] = sub.criteriaComments[rnd] || [];
    sub.criteriaComments[rnd][+el.dataset.critComment] = el.value; saveSubs();
  }));
  const gc = $('comment');
  if (gc) gc.addEventListener('input', () => {
    if (!sub.feedback) sub.feedback = { outcome:'', generalComment1:'', generalComment2:'' };
    sub.feedback[rnd==='sub2' ? 'generalComment2' : 'generalComment1'] = gc.value; saveSubs();
  });
}

function doSave(){
  const sub = subFor(CURRENT);
  const a = WORDING[CURRENT];
  const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
  const crit = (a.criteria||[]);
  const marks = sub.criteriaMarks[round];
  const allMet = crit.length>0 && crit.every((c,i)=>marks[i]===true);
  const comment = $('comment').value;
  sub.criteriaComments[round] = crit.map((c,i)=>{ const el=document.querySelector(`[data-crit-comment="${i}"]`); return el?el.value:''; });
  if (!sub.feedback) sub.feedback = { outcome:'', generalComment1:'', generalComment2:'' };

  sub[round === 'sub2' ? 'marked2At' : 'marked1At'] = new Date().toISOString();
  if (round === 'sub2') sub.feedback.generalComment2 = comment;
  else sub.feedback.generalComment1 = comment;
  sub.feedback.outcome = outcomeFor(round, allMet, sub);
  sub.stage = sub.feedback.outcome === 'Resubmission needed' ? 'resubmission_needed' : 'closed';
  saveSubs();
  render();
}

/* What this marking comes to, in the words the candidate will see. Read by the
   pill the tutor is looking at AND by the save, so the screen cannot promise
   one outcome and record another. Handbook 9.2.3, not 9.2.2 (checked against
   the June 2025 Administration Handbook, 21 Sep 2026): 9.2.2 is "Providing
   support for written assignments"; the one-occasion rule is in 9.2.3, which
   says candidates must have the opportunity, within the time span of the
   course, to resubmit "on one occasion only for each assignment". Once it is
   used, a criterion not met is a Fail, not another chance. */
function outcomeFor(round, allMet, sub){
  if (round === 'sub2') return allMet ? 'Pass (on resubmission)' : 'Fail (on resubmission)';
  if (allMet) return 'Pass';
  return sub.usedResubmission ? 'Fail' : 'Resubmission needed';
}

function doReturnUnmarked(){
  const sub = subFor(CURRENT);
  const comment = $('comment').value;
  if (!sub.feedback) sub.feedback = { outcome:'', generalComment1:'', generalComment2:'' };
  const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
  // Returned unmarked does NOT spend the one resubmission (Handbook 9.2.3;
  // DESIGN-HANDOFF-README's core rule). It used to set resubmission_needed,
  // and the trainee's next submit then counted as their resubmission -- so an
  // incomplete first attempt sent back for a missing section cost them their
  // only second chance (Hub walk, 20 Sep 2026). The round stays what it was:
  // the trainee edits what they sent, declares again, and submits it again.
  if (round==='sub2') {
    sub.feedback.generalComment2 = 'Returned unmarked: ' + comment;
    sub.stage = 'resubmission_needed';
    sub.draft = Object.assign({}, sub.sub2 || {}, { decl:{} });
    sub.round2Seeded = true;
  } else {
    sub.feedback.generalComment1 = 'Returned unmarked: ' + comment;
    sub.stage = 'returned_unmarked';
    sub.draft = Object.assign({}, sub.sub1 || {}, { decl:{} });
  }
  sub.criteriaMarks[round] = [];
  sub.feedback.outcome = 'Returned unmarked';
  saveSubs();
  render();
}

renderPicker();
render();
/* ---- the exchange for a marked assignment (hub-exchange.js) ----
   Slots: one per criterion (first line Met / Not met, then the comment), and
   the general comment. The OUTCOME is never a slot: outcomeFor() derives it
   from the marks under the Handbook's rule, and an AI must not be able to
   award a pass. */
function xSlotsFor(a){
  const crit = (a.criteria||[]);
  return crit.map((c,i)=>({ id:'crit'+i, heading:'Criterion '+(i+1)+' \u2014 '+String(c.text||'').slice(0,80) }))
    .concat([{ id:'comment', heading:'General comment' }]);
}
function xWho(){
  /* NAMES maps assignment keys to labels; a person's name lives on the roster. */
  const tr = TRAINEE_ID && loadRoster().trainees[TRAINEE_ID];
  return (tr && tr.name) || 'candidate';
}
function xSubmissionMd(a, sub, round){
  const snap = round==='sub2' ? sub.sub2 : sub.sub1;
  const md = [];
  md.push('# Assignment \u2014 ' + xWho() + ', ' + (a.title||CURRENT.toUpperCase()) + (round==='sub2' ? ' (resubmission)' : ''));
  md.push('');
  const div = document.createElement('div'); div.innerHTML = summarize(a, snap);
  // the on-screen summary, as text: each label becomes a heading, each body a paragraph
  div.querySelectorAll('.roundlabel, .readonly').forEach(n => {
    if (n.classList.contains('roundlabel')) md.push('### ' + n.textContent.trim());
    else { md.push(n.textContent.trim()); md.push(''); }   /* textContent: innerText is empty on a node that is not in the page */
  });
  return md.join('\n');
}
function xBrief(a, sub, round){
  const sl = xSlotsFor(a);
  const md = [xSubmissionMd(a, sub, round), '---', '', '# Marking \u2014 fill in below', '',
    'You are helping a CELTA tutor mark the written assignment above against its criteria. The tutor will dictate. Under each criterion write, on the first line, exactly "Met" or "Not met", then the tutor\u2019s comment to the candidate (second person, specific). Keep every heading exactly as it is. Leave a criterion empty if the tutor has not decided.', ''];
  sl.forEach(s => { md.push('## ' + s.heading); md.push(''); md.push(''); });
  md.push('<!-- lite:slots ' + JSON.stringify(sl.map(s=>[s.id,s.heading])) + ' -->');
  return md.join('\n');
}
function wireExchange(){
  const card = $('xchg'); if (!card || !window.HubExchange) return;
  const a = WORDING[CURRENT], sub = subFor(CURRENT);
  const round = sub.stage==='resubmitted' ? 'sub2' : 'sub1';
  let PENDING = null;
  $('xCopy').addEventListener('click', ()=> hubCopyButton($('xCopy'), xBrief(a, sub, round)));
  $('xPasteToggle').addEventListener('click', ()=>{ const open = $('xPaste').style.display==='none'; $('xPaste').style.display = open?'':'none'; $('xPasteToggle').textContent = open ? 'Hide' : 'Paste something back'; if (open) $('xText').focus(); });
  let readTimer = null;
  $('xText').addEventListener('input', ()=>{ clearTimeout(readTimer); readTimer = setTimeout(readNow, 250); });
  document.addEventListener('paste', (e)=>{
    const t = e.target; if (t && t.closest && t.closest('input, textarea, [contenteditable]')) return;
    const txt = (e.clipboardData||window.clipboardData).getData('text/plain'); if (!txt || !/^\s*#/m.test(txt)) return;
    e.preventDefault(); if ($('xPaste').style.display==='none') $('xPasteToggle').click();
    $('xText').value = txt; readNow(); $('xchg').scrollIntoView({block:'start', behavior:'smooth'});
  });
  function readNow(){
    const txt = $('xText').value; if (!txt.trim()) return;
    const man = xSlotsFor(a); const byName = {}; man.forEach(m => byName[m.heading.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()] = m.id);
    man.forEach(m => { const mm = m.heading.match(/^(Criterion \d+)/); if (mm) byName[mm[1].toLowerCase()] = m.id; });
    const norm = h => String(h||'').toLowerCase().replace(/[\u2018\u2019\u201c\u201d"']/g,'').replace(/[^a-z0-9]+/g,' ').trim();
    let body = txt.replace(/<!--\s*lite:slots[\s\S]*?-->/g,''); const at = body.search(/^\s*#\s+Marking\b/m); if (at>=0) body = body.slice(at);
    const found = {}, unplaced = [];
    HubExchange.sections(body).forEach(sec => {
      if (sec.level !== 2) return;
      let id = byName[norm(sec.heading)] || byName[norm(sec.heading.split(/\s[\u2014\-\u2013]\s/)[0])];
      if (!id) { if (sec.text) unplaced.push(sec.heading); return; }
      if (!sec.text) return;
      if (id === 'comment') { found[id] = { text: sec.text }; return; }
      const ls = sec.text.split(/\r?\n/).map(l=>l.replace(/^\s*[\u2022\-*]\s*/,'').trim()).filter(Boolean);
      const first = norm(ls[0]||''); let mark = null;
      if (/^not met\b/.test(first)) mark = false; else if (/^met\b/.test(first)) mark = true;
      found[id] = { mark, text: (mark===null ? ls : ls.slice(1)).join('\n') };
    });
    const done = $('xDone'); done.style.display = '';
    const ids = Object.keys(found);
    if (!ids.length) { done.textContent = 'Nothing in that landed \u2014 the headings ("Criterion 1 \u2014 \u2026", "General comment") need to be kept.'; return; }
    /* the form as it was, for Undo */
    const before = { marks: (sub.criteriaMarks[round]||[]).slice(), comments: [...document.querySelectorAll('[data-crit-comment]')].map(el=>el.value), general: ($('comment')||{}).value || '' };
    sub.criteriaMarks[round] = sub.criteriaMarks[round] || []; sub.criteriaComments[round] = sub.criteriaComments[round] || [];
    document.querySelectorAll('[data-crit-comment]').forEach(el => { sub.criteriaComments[round][+el.dataset.critComment] = el.value; });
    if (!sub.feedback) sub.feedback = { outcome:'', generalComment1:'', generalComment2:'' };
    const gk = round==='sub2' ? 'generalComment2' : 'generalComment1';
    if (!found.comment && before.general) sub.feedback[gk] = before.general;
    ids.forEach(id => {
      if (id === 'comment') { sub.feedback[gk] = found[id].text; return; }
      const i = +id.slice(4);
      if (found[id].mark !== null) sub.criteriaMarks[round][i] = found[id].mark;
      if (found[id].text) sub.criteriaComments[round][i] = found[id].text;
    });
    saveSubs(); render();
    const names = {}; man.forEach(m => names[m.id] = m.heading);
    const d2 = $('xDone'); d2.style.display = '';
    d2.innerHTML = 'Filled ' + ids.length + ': ' + ids.map(id => esc(names[id]||id)).join(', ') + '.' + (unplaced.length ? ' Not placed: ' + unplaced.map(esc).join(', ') + '.' : '') + ' <button type="button" class="example-btn" id="xUndo">Undo</button>';
    $('xUndo').addEventListener('click', ()=>{
      sub.criteriaMarks[round] = before.marks; before.comments.forEach((v,i)=>{ sub.criteriaComments[round][i] = v; });
      sub.feedback[gk] = before.general; saveSubs(); render(); const d3 = $('xDone'); if (d3) { d3.style.display=''; d3.textContent = 'Put back as it was.'; }
    });
  }
}
</script>
</body>
</html>
