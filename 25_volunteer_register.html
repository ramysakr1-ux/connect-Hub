<!DOCTYPE html>
<!--
  Connect Lite — the volunteer register
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 30 Sep 2026: "you have no idea how big a problem finding volunteer
  students is for a course." The people who come in to be taught are the one
  part of a CELTA that a centre begs for and then treats worst: a paper list,
  a biro, and nothing back at the end.

  WHAT THIS IS. The register itself, one row per student, with a bar of small
  blocks for the teaching days — the shape Connect uses and Ramy asked for.
  Attended, missed, still to come, at a glance across the whole course, and
  the hours that follow from it.

  WHY IT COULD ONLY BE BUILT NOW. Attendance has to be attendance AT
  something. Until the timetable went native there was no notion of a teaching
  day in Lite, so the columns are not invented here: they are the days the
  timetable says have teaching practice, and the hours are that day's own
  teaching slots added up. Change the day shape and the hours follow.

  WHO SEES IT. Tutors and the assessor, nobody else. The store sends it to
  them and returns null to a trainee: these are members of the public, and
  a trainee has no business holding a list of their names and who turned up
  when. (The assessor does need it — Handbook 14.1 lists attendance registers
  among the documents for the visit.)

  Marking is a tap, and nothing is ever ticked on somebody's behalf. A record
  that says a person was in the room when they were not is worse than an
  empty one, and a certificate is going to be printed off the back of it.
-->

  /* Whether they have agreed to the centre's joining note, stamped by their

<body class="hub-grid hub-paper hub-course">
<div class="board">
  <a class="back" id="back" href="5_tutor_dashboard.html">&larr; Back</a>
  <div id="app"></div>
</div>
<script src="hub-due.js?v=202610062232"></script>
<script src="hub-shared.js?v=202610062232"></script>
<script src="hub-timetable-parse.js?v=202610062232"></script>
<script src="hub-xlsx.js?v=202610062232"></script>
<script src="hub-attendance.js?v=202610062232"></script>
<script src="hub-store.js?v=202610062232"></script>
<script src="hub-say.js?v=202610062232"></script>
<script src="hub-sync.js?v=202610062232"></script>
<script type="text/x-hub-app">
const MODE = window.HubMode;
/* The register is the tutors' room and the assessor reads it (Handbook 14.1
   lists attendance registers among the documents for the visit). A trainee
   saw an empty room with a Back link instead of being told it was not theirs
   -- no names, because the store sends them none, but an empty room is still
   the wrong answer (sweep, 30 Sep 2026). */
if (window.hubTutorRoomOnly && hubTutorRoomOnly({ assessor: true }))
  throw new Error('Connect Lite: stopping this page on purpose \u2014 the register is the tutors\u2019 room.');
const IS_TUTOR = MODE === 'tutor';
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const SETTINGS = rec('connect_course_settings') || {};
const KEY = 'connect_volunteers_v1';
$('back').href = IS_TUTOR ? '5_tutor_dashboard.html' : '12_assessor_pack.html';

let REG = rec(KEY) || null;
let note = '', ADD_OPEN = false;

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const parse = s => { const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const dm = iso => { const d = parse(iso); return d ? d.getDate() + ' ' + MON[d.getMonth()] : iso; };
const TODAY = window.hubToday ? hubToday() : ymd(new Date());   // the demo clock, when the course is pinned

/* THE DAYS ARE THE TIMETABLE'S, NOT THIS SCREEN'S. A teaching day is a day
   the timetable gives a practice to, and the hours on it are that day's own
   teaching slots added up. Nothing here invents a schedule, so changing the
   day shape changes the register with it. */
function teachingDays(){
  const tt = rec('connect_timetable_v1');
  if (!tt || !tt.days) return { days: [], hoursPerDay: 0 };
  const slots = (tt.slots || []).filter(s => s.kind === 'tp');
  const mins = slots.reduce((n, sl) => {
    const a = String(sl.from||'').match(/^(\d{1,2}):(\d{2})/), b = String(sl.to||'').match(/^(\d{1,2}):(\d{2})/);
    if (!a || !b) return n;
    const d = (+b[1]*60 + +b[2]) - (+a[1]*60 + +a[2]);
    return d > 0 ? n + d : n;
  }, 0);
  return { days: tt.days.filter(d => d.tp).map(d => d.date), hoursPerDay: mins / 60,
           lessons: slots.length, lessonMinutes: slots.length ? Math.round(mins / slots.length) : 0 };
}

const students = () => (REG && Array.isArray(REG.students)) ? REG.students : [];
const A = window.hubAttendance;
const LEVELS = ['A1','A2','A2+','B1','B2','C1','C2'];

/* A register written before the three tiers existed held `here: [dates]`,
   which meant "in the room". They become marks of 'present', so nothing a
   tutor recorded is lost and nobody's hours move (30 Sep 2026). */
function migrateMarks(){
  if (!REG || !Array.isArray(REG.students)) return false;
  let changed = false;
  REG.students.forEach(st => {
    if (st.marks) return;
    st.marks = {};
    (st.here || []).forEach(d => { st.marks[d] = 'present'; });
    delete st.here;
    changed = true;
  });
  if (changed && IS_TUTOR) { try { localStorage.setItem(KEY, JSON.stringify(REG)); } catch(e) {} }
  return changed;
}

/* EACH STUDENT'S OWN LINK. Minted here, in the tutor's browser, as
   "<courseId>-<20 hex>": the course half lets the store find the register
   without scanning, the random half is the secret. The course id arrives in
   the tutor's boot (store version 43) -- before that lands there is nothing
   to mint from, so the button says so rather than minting a link that opens
   nothing. A row keeps its token for the life of the course: re-minting would
   silently kill a link somebody already has on their phone. */
const courseId = () => { try { return localStorage.getItem('hub:course') || ''; } catch(e) { return ''; } };
function mintToken(){
  const id = courseId(); if (!id) return '';
  let hex = '';
  try { const a = new Uint8Array(10); crypto.getRandomValues(a); hex = Array.from(a).map(b => b.toString(16).padStart(2,'0')).join(''); }
  catch(e) { for (let i = 0; i < 20; i++) hex += Math.floor(Math.random()*16).toString(16); }
  return id + '-' + hex;
}
/* Rows added before links existed get one, once, from a tutor's browser. */
function mintMissing(){
  if (!IS_TUTOR || !REG || !courseId()) return false;
  let changed = false;
  students().forEach(st => { if (!st.token) { st.token = mintToken(); changed = true; } });
  if (changed) { try { localStorage.setItem(KEY, JSON.stringify(REG)); } catch(e) {} }
  return changed;
}
/* Hours come from the shared engine, never from counting marks here: the
   register, the student's page and the certificate all read the same file so
   they cannot drift. */
const recordOf = (st, days, lessons, lessonMinutes) => A.record(st.marks || {}, days, lessons, lessonMinutes);
const fmtH = h => (Math.round(h * 100) / 100).toString().replace(/\.00$/, '');

/* v56: who is coming to the next class, from the store's own count. */
const COMING = (() => { try { const c = JSON.parse(localStorage.getItem('connect_coming_v1')); return c && c.day ? c : null; } catch (e) { return null; } })();
function persist(word){
  REG = REG || { students: [] };
  try { localStorage.setItem(KEY, JSON.stringify(REG)); } catch(e) {}
  note = word || 'Saved';
  render();
  setTimeout(() => { if (note === word) { note = ''; const s = document.querySelector('.status'); if (s) s.textContent = ''; } }, 2200);
}

function render(){
  mintMissing();
  migrateMarks();
  const app = $('app');
  const { days, hoursPerDay, lessons, lessonMinutes } = teachingDays();
  const list = students();
  const head = `<p class="eyebrow">Course</p><h1>Volunteer register</h1>
    <p class="lede">${IS_TUTOR
      ? 'The students who come in to be taught. One row each, one block per teaching day — tap a block to mark somebody in the room. The days and the hours come from the timetable, so nothing here is a second schedule to keep.'
      : 'The students who came in to be taught, and which teaching days each of them attended.'}</p>`;

  if (!days.length) {
    app.innerHTML = head + `<div class="empty">There are no teaching days yet. The register counts attendance against the timetable, so ${IS_TUTOR ? 'build the timetable first and the days will appear here.' : 'the course has not set its timetable yet.'}</div>`;
    return;
  }

  const bar = IS_TUTOR ? `<div class="bar">
      <button class="btn" id="addOpen">${ADD_OPEN ? 'Close' : 'Add students'}</button>
      <span class="status">${esc(note)}</span></div>` + (ADD_OPEN ? addHTML() : '') : '';
  /* Who has agreed to the centre's joining note, counted at the top. The
     per-row lines say it one at a time, which means reading down a list of
     twenty to learn that two have not opened their link at all. */
  const waiting = list.filter(st => st.token && !st.agreed).length;
  const consent = !IS_TUTOR || !list.length ? '' : `<p class="consent-count">${waiting
    ? `<b>${waiting} of ${list.length}</b> ${waiting === 1 ? 'has' : 'have'} not yet agreed to the centre\u2019s joining note. It opens by itself the first time they open their own link, so this usually means the link has not been sent on.`
    : `All ${list.length} ${list.length === 1 ? 'has' : 'have'} agreed to the centre\u2019s joining note.`}</p>`;

  if (!list.length) {
    app.innerHTML = head + bar + `<div class="empty">Nobody on the register yet.${IS_TUTOR ? ' Add them one at a time, or paste a list from a spreadsheet.' : ''}</div>`;
    wire();
    return;
  }

  app.innerHTML = head + bar + consent + `<div class="reg">${list.map((st, i) => {
    const r = recordOf(st, days, lessons, lessonMinutes);
    return `<div class="who">
      <div>
        <div class="nm">${esc(st.name)}${IS_TUTOR
          ? `<span class="lvl"><select data-lvl="${i}"><option value="">Level</option>${LEVELS.map(l => `<option value="${l}"${st.level === l ? ' selected' : ''}>${l}</option>`).join('')}</select></span>`
          : (st.level ? '<span class="lvltag">' + esc(st.level) + '</span>' : '')}${IS_TUTOR
          ? `<span class="carried"><input type="number" min="0" step="0.25" data-carried="${i}" value="${st.carried != null ? esc(st.carried) : ''}" placeholder="0" title="Hours this student already had at the centre, before this course"><small>h before</small></span>`
          : (st.carried ? '<small>' + esc(st.carried) + ' h before this course</small>' : '')}${st.note ? '<small>' + esc(st.note) + '</small>' : ''}</div>
        ${IS_TUTOR ? `<div class="mailrow"><input type="email" class="email" data-email="${i}" value="${esc(st.email || '')}" placeholder="Email, for the reminders">${st.email && st.notify === false ? '<small>asked for no emails</small>' : ''}</div>` : ''}
        ${st.token ? (st.agreed
          ? `<span class="agreed yes">✓ Agreed to the joining note, ${dm(String(st.agreed).slice(0, 10))}</span>`
          : `<span class="agreed no">Has not yet agreed to the joining note (it opens with their link)</span>`) : ''}
        <div class="segs">${r.days.map(x => {
          const past = x.date < TODAY;
          const cls = x.tier === 'present' ? 'here' : x.tier === 'partial' ? 'part' : past ? 'miss' : 'soon';
          const what = x.tier === 'absent' && !past ? 'Still to come' : A.describe(x.tier, lessons, lessonMinutes);
          return IS_TUTOR
            ? `<button type="button" class="seg ${cls}" data-i="${i}" data-d="${esc(x.date)}" title="${dm(x.date)} — ${esc(what)}"></button>`
            : `<span class="seg ${cls}" title="${dm(x.date)} — ${esc(what)}"></span>`;
        }).join('')}</div>
      </div>
      <div class="hrs"><b>${fmtH(r.hours)} h</b><small>${r.present} of ${days.length} days${r.partial ? ' · ' + r.partial + ' part' : ''}</small>
        ${IS_TUTOR ? `<div class="acts">${st.token
            ? `<button type="button" class="btn sm" data-copy="${i}">Copy their link</button><a class="btn quiet sm" href="27_volunteer_certificate.html?who=${encodeURIComponent(st.token)}">Certificate</a>`
            : `<span class="nolink" title="The course id has not arrived from the store yet">No link yet</span>`}<button type="button" class="btn quiet sm" data-rm="${i}">Remove</button></div>` : ''}</div>
    </div>`;
  }).join('')}</div>
  ${COMING ? `<p class="legend coming"><b>Next class, ${esc(dm(COMING.day))} — TP ${esc(COMING.tp)} at ${esc(COMING.from)}:</b> expect about ${COMING.yes + COMING.noAnswer}. ${COMING.yes} said yes, ${COMING.no} said no, ${COMING.noAnswer} have not answered.</p>` : ''}
  <p class="legend">
    <span><span class="seg here"></span>in the room</span>
    <span><span class="seg part"></span>came for part of it</span>
    <span><span class="seg miss"></span>not marked, day has passed</span>
    <span><span class="seg soon"></span>still to come</span>
    <span>Tap to change.</span>
  </p>
  <p class="legend">${lessons} lesson${lessons === 1 ? '' : 's'} of ${lessonMinutes} minutes a day · ${A.lessonsNeededForPresent(lessons)} of them counts as being in the room, and credits the whole ${fmtH(hoursPerDay)} hours · ${days.length} teaching days, ${fmtH(days.length * hoursPerDay)} h if somebody comes to all of them.</p>`;

  wire();
}

function addHTML(){
  return `<div class="panel"><h3>Add students</h3>
    <p>One at a time, paste a list, or choose an Excel or CSV file — one name a line, or a spreadsheet column. A second column is kept as a note (a phone number, a level, whatever you use).</p>
    <div class="row"><input type="text" id="oneName" placeholder="Name"><button class="btn" id="addOne">Add</button></div>
    <p style="margin:12px 0 6px">Or paste:</p>
    <textarea id="paste" placeholder="Ayşe Demir&#10;Mehmet Yılmaz&#10;Elena Petrova"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="addMany">Add the pasted list</button>
      <input type="file" id="addFile" accept=".xlsx,.csv,.tsv,.txt" style="font-size:0.78rem" aria-label="Or choose a file"></div></div>`;
}

function addNames(rows){
  REG = REG || { students: [] };
  const have = new Set(students().map(s => s.name.trim().toLowerCase()));
  /* A header row, when the sheet has one, says which column is which: the
     name, a level (kept as the level when it is a CEFR code), and anything
     else as the note. Without one: first column the name, second the note. */
  let col = { name: 0, level: -1, note: 1 };
  const head = rows[0] || [];
  if (head.some(h => /^(name|student|volunteer|full name)$/i.test(String(h || '').trim()))) {
    col = { name: -1, level: -1, note: -1 };
    head.forEach((h, i) => {
      const t = String(h || '').trim().toLowerCase();
      if (col.name < 0 && /^(name|student|volunteer|full name)$/.test(t)) col.name = i;
      else if (col.level < 0 && /^(level|cefr)$/.test(t)) col.level = i;
      else if (col.email == null && /^(e-?mail|email address)$/.test(t)) col.email = i;
      else if (col.note < 0 && t) col.note = i;
    });
    if (col.name < 0) col.name = 0;
  }
  let added = 0;
  rows.forEach(r => {
    const name = String(r[col.name] || '').trim();
    if (!name) return;
    /* A header row from a spreadsheet is not a person. */
    if (/^(name|student|volunteer|full name)$/i.test(name)) return;
    if (have.has(name.toLowerCase())) return;      // adding the same list twice is a mistake, not a second person
    have.add(name.toLowerCase());
    const lvl = col.level >= 0 ? String(r[col.level] || '').trim().toUpperCase() : '';
    /* v56: an address, from its own column or from any cell shaped like one. */
    const isMail = x => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(x || '').trim());
    const email = col.email != null ? String(r[col.email] || '').trim() : (r.find(isMail) || '');
    const note = col.note >= 0 ? String(r[col.note] || '').trim() : '';
    REG.students.push({ name, note: isMail(note) ? '' : note, email: isMail(email) ? email : '', marks: {}, level: LEVELS.includes(lvl) ? lvl : '', token: mintToken() });
    added++;
  });
  REG.students.sort((a, b) => a.name.localeCompare(b.name));
  persist(added ? added + (added === 1 ? ' student added' : ' students added') : 'Nobody new in that list');
}

function wire(){
  if (!IS_TUTOR) return;
  if ($('addOpen')) $('addOpen').addEventListener('click', () => { ADD_OPEN = !ADD_OPEN; render(); });
  if ($('addOne')) $('addOne').addEventListener('click', () => {
    const v = $('oneName').value.trim(); if (!v) return;
    addNames([[v]]);
  });
  if ($('addMany')) $('addMany').addEventListener('click', () => {
    const text = $('paste').value;
    if (!text.trim()) { note = 'Nothing pasted yet.'; render(); return; }
    addNames(window.hubTimetableParse.rowsFromText(text));
  });
  /* An Excel file straight in (hub-xlsx.js reads the first sheet); CSV and
     text go through the same reader as a paste. */
  if ($('addFile')) $('addFile').addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    try {
      const rows = window.hubIsXlsx && window.hubIsXlsx(file) ? await window.hubXlsxRows(file) : window.hubTimetableParse.rowsFromText(await file.text());
      addNames(rows);
    } catch (err) { note = err && err.message ? err.message : 'That file could not be read.'; render(); }
  });
  document.querySelectorAll('[data-copy]').forEach(el => el.addEventListener('click', async () => {
    const st = students()[+el.dataset.copy]; if (!st || !st.token) return;
    const link = window.HubStore.volunteerLinkFor(st.token);
    try { await navigator.clipboard.writeText(link); el.textContent = 'Copied'; setTimeout(() => { el.textContent = 'Copy their link'; }, 1600); }
    catch(e) { prompt('Their link:', link); }
  }));
  document.querySelectorAll('[data-rm]').forEach(el => el.addEventListener('click', () => {
    const st = students()[+el.dataset.rm]; if (!st) return;
    if (!confirm('Remove ' + st.name + ' from the register? Their attendance goes with them.')) return;
    REG.students.splice(+el.dataset.rm, 1); persist('Removed');
  }));
  /* Marking: a tap, and only ever by a person. Nothing is ticked on anyone's
     behalf -- a register that says somebody was in the room when they were
     not is worse than an empty one, and a certificate is printed off it. */
  document.querySelectorAll('.seg[data-i]').forEach(el => el.addEventListener('click', () => {
    const st = students()[+el.dataset.i]; if (!st) return;
    st.marks = st.marks || {};
    const next = A.nextMark(st.marks[el.dataset.d] || '');
    if (next) st.marks[el.dataset.d] = next; else delete st.marks[el.dataset.d];
    persist(next === 'present' ? 'In the room' : next === 'partial' ? 'Part of it' : 'Unmarked');
  }));
  /* The level this volunteer's class is at. Bare CEFR codes, the same list
     Connect uses -- Ramy, 20 Aug 2026: "Elementary" and "A2" are the same
     fact twice. It goes on their certificate. */
  /* Hours from earlier courses at this centre. The certificate is 160 hours
     ACROSS THE CENTRE (Ramy, 1 Oct 2026) and a four-week course gives a
     volunteer about thirty-six, so the number has to come forward. Lite has no
     identity across courses -- a volunteer is a token on one course -- so the
     centre carries it by hand, here, and the certificate adds it on. */
  document.querySelectorAll('[data-email]').forEach(el => el.addEventListener('change', () => {
    const st = students()[+el.dataset.email]; if (!st) return;
    const v = el.value.trim();
    if (v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { el.setCustomValidity('Not an email address'); el.reportValidity(); return; }
    el.setCustomValidity(''); st.email = v; persist(v ? 'Email saved' : 'Email cleared');
  }));
  document.querySelectorAll('[data-carried]').forEach(el => el.addEventListener('change', () => {
    const st = students()[+el.dataset.carried]; if (!st) return;
    const v = parseFloat(el.value);
    if (el.value === '' || isNaN(v) || v < 0) { delete st.carried; persist('Earlier hours cleared'); return; }
    st.carried = Math.round(v * 100) / 100;
    persist(st.carried + ' hours carried in');
  }));
  document.querySelectorAll('[data-lvl]').forEach(el => el.addEventListener('change', () => {
    const st = students()[+el.dataset.lvl]; if (!st) return;
    st.level = el.value;
    persist(el.value ? 'Level ' + el.value : 'Level cleared');
  }));
}

render();
</script>
</body>
</html>
