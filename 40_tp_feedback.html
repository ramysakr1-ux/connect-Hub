<!DOCTYPE html>
<!--
  TP feedback — the tutor's screen for oral feedback.
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 30 Oct 2026, on a mock-up he chose (docs/mockups/feedback-remembers.html):
  "feedback that remembers" and the first feedback after the change of class;
  "we want feedback to be positive as well, not just negative"; "it's coming from
  the tutor's feedback"; "the trainees never actually see it".

  Everything on a card is read from the tutors' own written TP feedback
  (records.tpHistory and records.feedback: Strengths in planning and teaching,
  Action points in planning and teaching, the grade, the tutor): what worked
  today, the last action points, the next step. Nothing is generated. The one
  thing the tutor sets here is whether each earlier action point was met, partly
  met or not yet: kept in the trainee's staffLinks record as an entry
  { fbcheck: true, marks }, the kind the store never hands to a trainee (as the
  handover line is). No store change.

  On the first feedback after the change of class each card also carries TP1
  onward, the best moment so far, what came up more than once, and the
  handover line.

  Opened from the TP feedback tile on the timetable, or the tutor's dashboard.
  Tutors only.
-->

<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);}
  .wrap{max-width:980px; margin:0 auto; padding:32px 20px 90px;}
  .back{display:inline-block; margin-bottom:14px; font-weight:600; font-size:.9rem; color:var(--teal); text-decoration:none;}
  .back:hover{text-decoration:underline;}
  .k{font-family:'Instrument Sans','Karla',sans-serif; font-weight:600; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--brick); margin:0 0 6px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:32px; line-height:1.08; margin:0 0 8px;}
  .lede{color:var(--grey); font-size:15px; line-height:1.5; margin:0 0 20px; max-width:680px;}
  .tabs{display:flex; gap:8px; margin:0 0 18px; flex-wrap:wrap;}
  .tabs button{font:inherit; font-weight:700; font-size:13.5px; padding:8px 14px; border-radius:999px; border:1px solid var(--sand-line); background:var(--paper); color:var(--teal); cursor:pointer;}
  .tabs button[aria-pressed="true"]{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .hand{display:flex; gap:12px 18px; align-items:center; flex-wrap:wrap; background:var(--teal); color:var(--paper); border-radius:var(--r-card); padding:16px 20px; margin:0 0 24px;}
  .hand .who{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-family:'Newsreader',Georgia,serif; font-size:19px; font-weight:600;}
  .hand select{font:inherit; font-family:'Karla',sans-serif; font-size:14px; font-weight:700; color:var(--teal); background:var(--paper); border:0; border-radius:8px; padding:6px 10px;}
  .hand .when{color:var(--paper); opacity:.8; font-size:13.5px; flex-basis:100%;}
  .hand .acts{margin-left:auto; display:flex; gap:8px;}
  .hand .print{background:var(--paper); color:var(--teal); border:0; border-radius:999px; padding:9px 16px; font:inherit; font-weight:700; font-size:13.5px; cursor:pointer;}
  .hand .print.go{background:var(--a-lemon); color:var(--ink);}
  .hand .when b{color:var(--paper); font-weight:700;}
  .hand .check{flex-basis:100%; background:var(--paper); color:var(--ink); border-radius:var(--r-strip); padding:12px 14px; font-size:14px; line-height:1.5;}
  .hand .check .row{margin-top:8px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;}
  .tr{background:var(--paper); border-radius:var(--r-card); box-shadow:var(--nb-shadow); padding:18px 20px 16px; border-top:3px solid var(--teal); break-inside:avoid;}
  .tr.amber{border-top-color:var(--a-mustard);} .tr.red{border-top-color:var(--brick);}
  .tr header{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .tr h2{font-family:'Newsreader',Georgia,serif; font-size:21px; font-weight:700; margin:0;}
  .letter{font-family:'Instrument Sans','Karla',sans-serif; font-weight:600; font-size:12px; color:var(--grey); background:var(--sand); border-radius:6px; padding:3px 8px; white-space:nowrap;}
  .grades{display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 2px;}
  .g{font-size:11.5px; font-weight:600; border-radius:6px; padding:4px 8px; background:var(--sand); color:var(--grey);}
  .g.above{background:var(--teal); color:var(--paper);} .g.not{background:var(--brick); color:var(--paper);} .g.to{background:var(--sand-deep); color:var(--ink);}
  .stages{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 0;}
  .st{font-size:11.5px; font-weight:600; border-radius:6px; padding:4px 8px; border:1px solid var(--sand-line); color:var(--ink); background:var(--paper);}
  .st.above{border-color:var(--teal); color:var(--teal);} .st.not{border-color:var(--brick); color:var(--brick);} .st.pending{color:var(--grey); border-style:dashed;}
  .tr .k{margin:14px 0 4px; font-size:10.5px; letter-spacing:.2em;}
  ul{margin:0; padding-left:18px; font-size:14px; line-height:1.5;}
  ul.plain{list-style:none; padding:0; color:var(--grey);}
  .note{margin:0; font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:16.5px; line-height:1.4; color:var(--ink);}
  .note.empty{color:var(--grey);}
  textarea{width:100%; min-height:64px; font:inherit; font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:16px; line-height:1.4; color:var(--ink); background:var(--field); border:1px solid var(--sand-line); border-radius:var(--r-control); padding:8px 10px; resize:vertical;}
  textarea:focus{outline:2px solid var(--teal); outline-offset:1px;}
  .row{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap;}
  .row button{font:inherit; font-weight:700; font-size:13px; padding:7px 14px; border-radius:999px; border:0; background:var(--teal); color:var(--paper); cursor:pointer;}
  .row button.quiet{background:var(--paper); color:var(--teal); border:1px solid var(--sand-line);}
  .row .saved{font-size:12.5px; color:var(--grey);}
  .empty-group{color:var(--grey); font-size:15px;}
  @media (max-width:480px){ .wrap{padding:22px 16px 70px;} h1{font-size:27px;} .hand .acts{margin-left:0;} }
  @media print{
    body{background:var(--paper);} .wrap{max-width:none; padding:0;}
    .back, .tabs, .hand .acts, .hand .check, .row, textarea{display:none !important;}
    .hand{background:none; color:var(--ink); border:1px solid var(--sand-line); padding:10px 14px;} .hand .who{font-size:16px;} .hand select{appearance:none; -webkit-appearance:none; background:none; color:var(--ink); padding:0; font-size:15px;}
    .hand .when{color:var(--grey); opacity:1;}
    .grid{grid-template-columns:1fr 1fr; gap:12px;} .tr{box-shadow:none; border:1px solid var(--sand-line); border-top:3px solid var(--teal);}
    .note.empty{display:none;}
  }

  .daybar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 16px;}
  .daybar select{font:inherit; font-weight:700; font-size:14px; padding:7px 10px; border-radius:var(--r-control); border:1px solid var(--sand-line); background:var(--paper); color:var(--ink);}
  .daybar .meta{color:var(--grey); font-size:14px;}
  .grp{background:var(--paper); border-radius:var(--r-card); box-shadow:var(--nb-shadow); padding:14px 18px; margin:0 0 18px; font-size:14.5px; line-height:1.5;}
  .grp b{font-family:'Newsreader',Georgia,serif; font-size:17px; display:block; margin:0 0 4px;}
  .grp .plus{color:var(--teal); font-weight:700;} .grp .minus{color:var(--brick); font-weight:700;}
  .fbgood{margin:12px 0 0; padding:10px 12px; border-radius:10px; background:oklch(95% 0.035 145); border-left:3px solid oklch(62% 0.1 145); box-shadow:none; color:var(--ink); font-size:14px; line-height:1.45;}
  .fbgood .k, .fbnext .k{margin:0 0 4px;} .fbgood .k{color:oklch(40% 0.08 145);}
  .fbgood ul, .fbnext ul{padding-left:16px;}
  .fbgood small, .ap small, .fbnext small{display:block; color:var(--grey); font-size:12px;}
  .fbnext{margin:12px 0 0; padding:10px 12px; border-radius:10px; background:oklch(95% 0.035 85); border-left:3px solid var(--a-mustard); box-shadow:none; color:var(--ink); font-size:14px; line-height:1.45;}
  .wait{margin:12px 0 0; color:var(--grey); font-size:13.5px; font-style:italic;}
  .ap{padding:8px 0; border-top:1px solid var(--row-line); font-size:14px; line-height:1.4;}
  .ap:first-of-type{border-top:0;}
  .marks{display:flex; gap:5px; margin:6px 0 0; flex-wrap:wrap;}
  .marks button{font:inherit; font-size:12px; font-weight:700; padding:3px 10px; border-radius:999px; border:1px solid var(--sand-line); background:var(--paper); color:var(--grey); cursor:pointer;}
  .marks button.on[data-m="met"]{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .marks button.on[data-m="part"]{background:var(--a-mustard); border-color:var(--a-mustard); color:var(--ink);}
  .marks button.on[data-m="not"]{background:var(--brick); border-color:var(--brick); color:var(--paper);}
  .rep{display:inline-block; margin:0 6px 6px 0; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; background:color-mix(in oklch, var(--a-mustard) 28%, var(--paper));}
  .swap{margin:12px 0 0; padding:10px 0 0; border-top:2px solid var(--sand-line);}
  .code{font-family:'Instrument Sans','Karla',sans-serif; font-size:11px; font-weight:600; color:var(--grey); margin-left:4px;}

  .act{background:var(--paper); border-radius:var(--r-card); box-shadow:var(--nb-shadow); border-top:3px solid var(--a-mustard); padding:18px 20px; margin:0 0 18px;}
  .act .top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .act h2{font-family:'Newsreader',Georgia,serif; font-size:24px; margin:2px 0 4px;}
  .act .why{color:var(--grey); font-size:14px; margin:0;}
  .act .mins{font-size:12.5px; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--field); white-space:nowrap;}
  .act .steps{margin:14px 0 0; padding:0; list-style:none; counter-reset:s; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px;}
  .act .steps li{counter-increment:s; background:var(--field); border-radius:10px; padding:11px 13px 11px 42px; position:relative; font-size:14px; line-height:1.45;}
  .act .steps li::before{content:counter(s); position:absolute; left:11px; top:10px; width:22px; height:22px; border-radius:50%; background:var(--ink); color:var(--paper); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px;}
  .act .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .act .chip{font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:999px; border:1px solid var(--sand-line); background:var(--paper);}
  .act .chip em{font-style:normal; font-weight:500; color:var(--grey);}
  .act .chip.now{background:var(--a-mustard); border-color:var(--a-mustard);}
  @media (max-width:760px){ .act .steps{grid-template-columns:1fr;} }

</style>

<body>
<div class="wrap">
  <a class="back" href="23_timetable.html">Back</a>
  <div id="app"><p class="lede">Loading the course…</p></div>
</div>
<script src="celta5-criteria.js?v=202610301358"></script>
<script src="hub-fbgames.js?v=202610300038"></script>
<script src="hub-shared.js?v=202610301358"></script>
<script src="hub-store.js?v=202610301358"></script>
<script src="hub-say.js?v=202610301358"></script>
<script src="hub-rotation.js?v=202610301358"></script>
<script src="hub-sync.js?v=202610301358"></script>
<script src="hub-notebook.js?v=202610301358"></script>
<script>
if (window.hubTutorRoomOnly && hubTutorRoomOnly()) { /* refused; hubTutorRoomOnly drew the room */ }
else (async function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const bare = s => String(s == null ? '' : s).replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').replace(/\s*\b\d[a-z]\b\s*$/, '').trim();
  const codeOf = x => { const m = /data-c="([0-9][a-z])"/.exec(String((x && x.html) || '')); return m ? m[1] : ''; };
  const S = window.HubStore, R = window.hubRotation;
  let course, roster;
  try {
    const [c, r] = await Promise.all([S.call({ op: 'course' }), S.call({ op: 'roster' })]);
    course = c || {}; roster = Object.values((r && r.trainees) || {}).filter(Boolean);
  } catch (e) { $('app').innerHTML = '<p class="lede">The course could not be read: ' + esc(e.message) + '</p>'; return; }
  const cs = course.settings || {};
  const tz = cs.timeZone || undefined;
  const tpCount = parseInt(cs.tpCount, 10) || 8, half = Math.floor(tpCount / 2) + 1;
  const days = ((course.timetable && course.timetable.days) || []).filter(d => d && d.date && d.tp && !d.closed);
  const groups = [...new Set(roster.map(t => String(t.group || '')).filter(Boolean))].sort();
  const Q = new URLSearchParams(location.search);
  let group = (Q.get('group') && groups.includes(Q.get('group'))) ? Q.get('group') : (groups[0] || '');
  const today = window.hubToday ? hubToday() : new Date().toISOString().slice(0, 10);
  let date = Q.get('date') && days.some(d => d.date === Q.get('date')) ? Q.get('date') : ((days.filter(d => d.date <= today).pop() || days[0] || {}).date || '');
  const fmtDay = s => { try { return new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).format(hubDateOf(s)); } catch (e) { return s; } };
  const tpsPoints = (() => { try { return JSON.parse(localStorage.getItem('connect_tp_points_v1') || '{}') || {}; } catch (e) { return {}; } })();

  /* every written feedback a trainee has, by TP number */
  const historyOf = t => { const Rr = t.records || {}; const H = Object.assign({}, Rr.tpHistory || {});
    if (Rr.feedback && Rr.feedback.state) { const n = String((Rr.feedback.state.f || {}).fTP || '').replace(/\D/g, ''); if (n) H[n] = Rr.feedback; }
    const out = {}; Object.keys(H).forEach(k => { const st = H[k] && H[k].state; if (st && st.f) out[+k] = st; }); return out; };
  const items = (st, keys) => { const L = (st && st.lists) || {}; const all = []; keys.forEach(k => (L[k] || []).forEach(x => { const t = bare(x && (x.html || x.t || x.text || '')); if (t) all.push({ t, star: !!(x && x.star), c: codeOf(x), k }); })); return all.sort((a, b) => (b.star - a.star)); };
  const strengths = st => items(st, ['lST', 'lSP']);
  const actions = st => items(st, ['lAT', 'lAP']);
  const checkOf = t => (((t.records || {}).staffLinks || []).find(x => x && x.fbcheck)) || { fbcheck: true, marks: {} };
  const MW = { met: 'Met', part: 'Partly', not: 'Not yet' };

  /* who taught on the day: the day's teaching set in this group, in the order they taught */
  function taughtOn(day){
    const people = roster.filter(t => String(t.group || '') === group).map(t => ({ token: t.token, name: t.name, group }));
    const sets = R ? R.setsFor(people) : [people];
    const set = sets[day.setIndex || 0] || [];
    const rows = (tpsPoints.groups && tpsPoints.groups[group]) || tpsPoints.points || {};
    const order = R && R.orderDealt ? R.orderDealt(set, day.tp, (tok, tp) => (rows[tok] || {})['tp' + tp]) : set;
    return order.map(p => Object.assign({ letter: p.letter }, roster.find(t => t.token === p.token) || {})).filter(t => t.token);
  }

  function card(t, day){
    const H = historyOf(t), tp = +day.tp, now = H[tp] || null;
    const prev = Object.keys(H).map(Number).filter(n => n < tp).sort((a, b) => a - b);
    const chk = checkOf(t);
    const last = prev.slice(-3).map(n => { const a = actions(H[n])[0]; return a ? Object.assign({ tp: n }, a) : null; }).filter(Boolean);
    const good = now ? strengths(now).slice(0, 3) : [];
    const next = now ? actions(now).slice(0, 2) : [];
    const count = {}; prev.concat(now ? [tp] : []).forEach(n => { new Set(actions(H[n]).map(a => a.c).filter(Boolean)).forEach(c => { (count[c] = count[c] || { n: 0, t: '' }); count[c].n++; count[c].t = (actions(H[n]).find(a => a.c === c) || {}).t; }); });
    const reps = Object.keys(count).filter(c => count[c].n >= 2).sort((a, b) => count[b].n - count[a].n);
    const firstTutor = prev.length ? H[prev[0]].f.fTutor : '';
    const swap = tp === half && prev.length > 0;
    const grade = n => (H[n].f.fGrade || '').trim();
    const GR = { 'Above standard': ['above', 'Above'], 'To standard': ['to', 'To'], 'Not to standard': ['not', 'Not to'], 'Below standard': ['not', 'Not to'] };
    const rank = g => ({ 'Above standard': 3, 'To standard': 2 }[g] || 1);
    const bestTp = prev.slice().sort((a, b) => rank(grade(b)) - rank(grade(a)) || b - a)[0];
    const best = bestTp ? strengths(H[bestTp])[0] : null;
    const hand = ((t.records || {}).staffLinks || []).find(x => x && x.handover) || null;
    return `<article class="tr${reps.length ? ' amber' : ''}" data-token="${esc(t.token)}">
      <header><h2>${esc(t.name)}</h2><span class="letter">${esc(t.letter || '')}</span></header>
      ${now ? `<div class="fbgood"><p class="k">What worked</p><ul>${good.length ? good.map(x => `<li>${esc(x.t)}${x.c ? '<span class="code">' + esc(x.c) + '</span>' : ''}<small>TP${tp} feedback, Strengths</small></li>`).join('') : '<li>No strengths written yet.</li>'}</ul></div>`
        : `<p class="wait">TP${tp} feedback is not written yet. What worked and the next step appear here once it is.</p>`}
      ${last.length ? `<p class="k">Last action points</p>${last.map(a => { const key = a.tp + '|' + a.t.slice(0, 40); const m = (chk.marks || {})[key] || ''; return `<div class="ap">${esc(a.t)}${a.c ? '<span class="code">' + esc(a.c) + '</span>' : ''}<small>Set in TP${a.tp} feedback</small><div class="marks" data-key="${esc(key)}">${Object.keys(MW).map(k => `<button type="button" data-m="${k}" class="${m === k ? 'on' : ''}" aria-pressed="${m === k}">${MW[k]}</button>`).join('')}</div></div>`; }).join('')}` : ''}
      ${now && next.length ? `<div class="fbnext"><p class="k">Next step</p><ul>${next.map(x => `<li>${esc(x.t)}${x.c ? '<span class="code">' + esc(x.c) + '</span>' : ''}<small>TP${tp} feedback, Action points</small></li>`).join('')}</ul></div>` : ''}
      ${reps.length ? `<p class="k">Came up more than once</p>${reps.map(c => `<span class="rep" title="${esc(count[c].t)}">${esc(c)} · ${count[c].n === 2 ? 'twice' : count[c].n + ' times'}</span>`).join('')}` : ''}
      ${swap ? `<div class="swap"><p class="k">TP1 to TP${half - 1}${firstTutor ? ' with ' + esc(firstTutor) : ''}</p>
        <div class="grades">${prev.map(n => { const m = GR[grade(n)] || ['', grade(n) || '?']; return `<span class="g ${m[0]}">TP${n} · ${esc(m[1])}</span>`; }).join('')}</div>
        ${best ? `<div class="fbgood"><p class="k">Best moment so far</p>${esc(best.t)}<small>TP${bestTp} feedback, Strengths</small></div>` : ''}
        ${hand && hand.text ? `<p class="k">From ${esc(hand.by || 'the tutor')}</p><p class="note">${esc(hand.text)}</p>` : ''}</div>` : ''}
    </article>`;
  }

  function groupLine(list, day){
    const tp = +day.tp, have = list.map(t => historyOf(t)[tp]).filter(Boolean);
    if (have.length < 2) return '';
    const shared = fn => { const c = {}; have.forEach(st => new Set(fn(st).map(x => x.c).filter(Boolean)).forEach(k => { c[k] = (c[k] || 0) + 1; })); return Object.keys(c).filter(k => c[k] >= 2).sort((a, b) => c[b] - c[a]).map(k => [k, c[k], (have.map(st => fn(st).find(x => x.c === k)).find(Boolean) || {}).t]); };
    const s = shared(strengths), a = shared(actions);
    if (!s.length && !a.length) return '';
    return `<div class="grp"><b>The whole group first</b>${s.length ? `<span class="plus">${s[0][1]} of ${have.length}</span> have ${esc(s[0][0])} in today’s strengths: ${esc(s[0][2] || '')}. ` : ''}${a.length ? `<span class="minus">${a[0][1]} of ${have.length}</span> have ${esc(a[0][0])} in today’s action points: ${esc(a[0][2] || '')}.` : ''}</div>`;
  }


  /* TODAY'S ACTIVITY (Ramy, 30 Oct 2026: "a pool of games ... keep the feedback fun and interactive ... a good balance of
     positive things and some action points ... learner-centered, not too preachy"; mock-up docs/mockups/feedback-activity.html).
     One a day for the group, never the same twice in a row; kept in the course settings as fbActs, so every tutor sees the
     same. The peer sheets stay private until after the oral feedback (25 Oct), so the observers read from their own. */
  const ACTS = [
    ['steal', 'Steal a strength', 10, 'Starts from what the peers noticed. Everyone leaves with one thing to try, borrowed from a colleague.',
      ['Each observer reads one line from their sheet: something that worked in a colleague’s lesson.', 'The teacher says what they were thinking at that moment.', 'Everyone picks one strength to “steal” for their next TP, and says when they’ll use it.']],
    ['moment', 'Find the moment', 10, 'The observers’ notes take the group back into the lesson, one moment at a time.',
      ['An observer reads one line from their sheet without saying which stage it was.', 'The teacher guesses the stage and says what was happening for the students.', 'The group names what made it work, or what one change would do.']],
    ['eyes', 'Through the students’ eyes', 8, 'The lesson as the class lived it, not as the plan said.',
      ['Each trainee takes one student from the class they watched.', 'As that student: what was easy, what was confusing, what helped?', 'The teacher picks one thing to keep and one to try next time.']],
    ['rewind', 'One-minute rewind', 10, 'Talk turns into a quick try, in the room.',
      ['The teacher chooses one minute of their lesson they would teach differently.', 'They teach that minute again, to the group, as they now would.', 'The observers say what was different and what it would do for the students.']],
    ['criteria', 'Criteria match', 10, 'Connects what happened in the room to CELTA 5, without anyone reading it aloud.',
      ['Each observer picks one note from their sheet.', 'The group matches it to a criterion together.', 'The teacher says whether it was a strength today or a next step.']],
    ['line', 'Line up', 8, 'Everyone moves, everyone has a view.',
      ['The tutor reads a statement about today’s lessons, such as “the instructions were clear”.', 'Trainees stand along a line from agree to disagree.', 'Two people at different ends say why, starting with something that worked.']],
    ['ask', 'Ask your observer', 10, 'The teacher leads; the tutor comes in last.',
      ['The teacher asks each observer one question about their lesson.', 'The observer answers from their sheet: one thing that worked, one to try.', 'The tutor adds what nobody has said yet.']],
    /* five more (Ramy, 30 Oct 2026: "add five more"): twelve, so each comes round about once per group */
    ['stars', 'Two stars and a wish', 8, 'Two things that worked for every one about something to try: the balance is built in.',
      ['Each observer gives the teacher two stars: two things that worked, and when.', 'Then one wish: one thing they’d like to see next time.', 'The teacher picks the wish they’ll act on in their next TP.']],
    ['headline', 'The headline', 8, 'A light way in: one line that sums up a lesson.',
      ['Everyone writes a short newspaper headline for a colleague’s lesson.', 'The headlines are read out; the teacher picks the truest.', 'The group says what in the lesson earned that headline, and what the next headline could be.']],
    ['seconds', 'The best ten seconds', 8, 'Starts small and specific, so the praise is real.',
      ['Each person names the best ten seconds of a colleague’s lesson.', 'The teacher says what they did in those ten seconds and why.', 'The group finds one place in the lesson where the same move would have helped.']],
    ['question', 'Question first', 10, 'The teacher decides what the feedback is about.',
      ['Before anyone speaks, the teacher asks the group one question they want answered about their lesson.', 'The observers answer it from what they saw, starting with what worked.', 'The teacher sums up in one sentence: what they’ll keep and what they’ll change.']],
    /* three from "Feedback for TP: a few ideas" (the IH list in Ramy's Drive) */
    ['circle', 'Round the circle', 8, 'One sentence each, and everyone hears something good first.',
      ['The group sits in a circle with the tutor.', 'Each person finishes “What I really liked about your lesson was…” for the teacher.', 'Round again with “Something I wondered about was…”. The group decides the order.']],
    ['tutor', 'Be the tutor', 10, 'The trainees step into the tutor’s chair.',
      ['The tutor stands back and listens.', 'The trainees give the feedback they think the tutor would give: what worked, then what to try.', 'The tutor says one thing they would add, and one they would not have said.']],
    ['learned', 'Taught and learned', 8, 'Moves the talk from the teacher to the students.',
      ['What was taught today?', 'What was learned today? The group gives evidence from the room.', 'Where the two are different, the teacher says what they would change.']],
    ['replan', 'Plan it again', 12, 'From talking about a lesson to building one, together.',
      ['The teacher shows one stage of their plan.', 'In pairs, the others plan that stage again in two minutes, keeping what worked.', 'The teacher picks one idea to take into their next lesson.']]
  ];
  const actsOf = () => { const a = ((cs.fbActs || {})[group]) || []; return Array.isArray(a) ? a : []; };
  function dealFor(dateISO, skip){
    const used = actsOf(), today = used.find(x => x.date === dateISO);
    if (today && !skip) return today.a;
    const prev = used.filter(x => x.date < dateISO).sort((a, b) => a.date < b.date ? 1 : -1)[0];
    const count = id => used.filter(x => x.a === id).length;
    const pool = ACTS.map(x => x[0]).filter(id => id !== (prev && prev.a) && id !== skip).sort((a, b) => count(a) - count(b));
    return pool[0] || ACTS[0][0];
  }
  async function keepAct(dateISO, id, loud){
    const all = Object.assign({}, cs.fbActs || {}); const list = actsOf().filter(x => x.date !== dateISO).concat([{ date: dateISO, a: id }]).slice(-40);
    all[group] = list; cs.fbActs = all;
    try { const next = Object.assign({}, JSON.parse(localStorage.getItem('connect_course_settings') || '{}'), { fbActs: all }); localStorage.setItem('connect_course_settings', JSON.stringify(next)); const r = await S.putCourse('settings', next); if (loud && r && r.demo && window.hubDemoSay) hubDemoSay('This is a demo course. The activity is kept on this device.'); } catch (e) {}
  }
  function actHTML(day){
    const id = dealFor(day.date), A = ACTS.find(x => x[0] === id) || ACTS[0], used = actsOf();
    if (!used.some(x => x.date === day.date)) keepAct(day.date, id);
    const usedAt = a => { const u = used.filter(x => x.a === a && x.date !== day.date).map(x => { const d = days.find(y => y.date === x.date); return d ? 'TP' + d.tp : ''; }).filter(Boolean); return u.length ? ' · used ' + u.join(', ') : ''; };
    return `<section class="act"><div class="top"><div><p class="k">Today’s activity</p><h2>${esc(A[1])}</h2><p class="why">${esc(A[3])}</p></div><span class="mins">${A[2]} minutes</span></div>
      <ol class="steps">${A[4].map(t => '<li>' + esc(t) + '</li>').join('')}</ol>
      <div class="row"><button type="button" id="wheel">Spin the criteria</button><button type="button" id="bingo">Criteria bingo</button><button type="button" id="xo">XO</button><button type="button" class="quiet" id="deal">Deal another</button><span class="saved">Then each trainee’s card, below.</span></div>
      <p class="k" style="margin-top:14px">The pool</p><div class="chips">${ACTS.map(x => `<span class="chip${x[0] === A[0] ? ' now' : ''}">${esc(x[1])}<em>${esc(usedAt(x[0]))}</em></span>`).join('')}</div></section>`;
  }

  function draw(){
    const day = days.find(d => d.date === date);
    if (!day) { $('app').innerHTML = '<p class="k">Teaching practice</p><h1>TP feedback</h1><p class="lede">This course has no teaching practice days on its timetable yet.</p>'; return; }
    const list = taughtOn(day);
    const fbTile = (day.sessions || []).find(x => x.k === 'feedback');
    $('app').innerHTML = `
      <p class="k">Teaching practice · ${esc(cs.courseName || '')}</p>
      <h1>TP${esc(day.tp)} feedback${group ? ' · Group ' + esc(group) : ''}</h1>
      <p class="lede">Your screen for oral feedback. Everything here comes from the written TP feedback. Trainees never see this page.</p>
      <div class="daybar"><select id="day" aria-label="Which day">${days.map(d => `<option value="${esc(d.date)}"${d.date === date ? ' selected' : ''}>${esc(fmtDay(d.date))} · TP${esc(d.tp)}</option>`).join('')}</select>
        <span class="meta">${fbTile ? esc(hubClockRange ? hubClockRange(fbTile.s, fbTile.e) : fbTile.s + '–' + fbTile.e) : ''}${list.length ? ' · ' + list.length + ' taught' : ''}</span></div>
      ${groups.length > 1 ? '<div class="tabs">' + groups.map(g => `<button type="button" data-group="${esc(g)}" aria-pressed="${g === group}">Group ${esc(g)}</button>`).join('') + '</div>' : ''}
      ${list.length ? actHTML(day) : ''}
      ${groupLine(list, day)}
      <div class="grid">${list.length ? list.map(t => card(t, day)).join('') : '<p class="empty-group">Nobody in this group teaches on this day.</p>'}</div>`;
    $('day').onchange = e => { date = e.target.value; history2(); draw(); };
    document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { group = b.dataset.group; history2(); draw(); });
    document.querySelectorAll('.marks button').forEach(b => b.onclick = () => mark(b));
    HubFbGames.use(() => (course.timetable && course.timetable.days) || []);
    if ($('wheel')) $('wheel').onclick = () => HubFbGames.wheel(day, list);
    if ($('bingo')) $('bingo').onclick = () => HubFbGames.game('bingo', day, list);
    if ($('xo')) $('xo').onclick = () => HubFbGames.game('xo', day, list);
    if ($('deal')) $('deal').onclick = async () => { const cur = dealFor(date); const nx = dealFor(date, cur); await keepAct(date, nx, true); draw(); };
  }
  function history2(){ try { history.replaceState(null, '', '?date=' + encodeURIComponent(date) + '&group=' + encodeURIComponent(group) + (Q.get('k') ? '&k=' + encodeURIComponent(Q.get('k')) : '')); } catch (e) {} }
  async function mark(b){
    const art = b.closest('.tr'), token = art.dataset.token, key = b.closest('.marks').dataset.key, m = b.dataset.m;
    const t = roster.find(x => x.token === token); if (!t) return;
    const links = ((t.records || {}).staffLinks || []);
    const cur = Object.assign({ fbcheck: true, marks: {} }, links.find(x => x && x.fbcheck) || {});
    cur.marks = Object.assign({}, cur.marks); if (cur.marks[key] === m) delete cur.marks[key]; else cur.marks[key] = m;
    const next = links.filter(x => x && !x.fbcheck).concat([cur]);
    t.records = t.records || {}; t.records.staffLinks = next; draw();
    try { const r = await S.put('staffLinks', next, token); if (r && r.demo && window.hubDemoSay) hubDemoSay('This is a demo course. The marks stay on this device.'); }
    catch (e) { if (window.hubSay) hubSay('Not saved: ' + e.message); }
  }
  draw();
})();
</script>
</body>
</html>
