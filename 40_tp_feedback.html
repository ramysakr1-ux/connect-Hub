<!DOCTYPE html>
<!--
  TP feedback — the tutor's screen for oral feedback.
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 30 Oct 2026, on a mock-up he chose (docs/mockups/feedback-remembers.html):
  "feedback that remembers" and the first feedback after the change of class;
  "we want feedback to be positive as well, not just negative"; "it's coming from
  the tutor's feedback"; "the trainees never actually see it".

  Everything on a card is read from the tutors' own written TP feedback
  (records.tpHistory and records.feedback: Strengths in planning and teaching,
  Action points in planning and teaching, the grade, the tutor): what worked
  today, the last action points, the next step. Nothing is generated. The one
  thing the tutor sets here is whether each earlier action point was met, partly
  met or not yet: kept in the trainee's staffLinks record as an entry
  { fbcheck: true, marks }, the kind the store never hands to a trainee (as the
  handover line is). No store change.

  On the first feedback after the change of class each card also carries TP1
  onward, the best moment so far, what came up more than once, and the
  handover line.

  Opened from the TP feedback tile on the timetable, or the tutor's dashboard.
  Tutors only.
-->

  const codeOf = x => { const m = /data-c="([0-9][a-z])"/.exec(String((x && x.html) || '')); return m ? m[1] : ''; };
  const S = window.HubStore, R = window.hubRotation;
  let course, roster;

  const cs = course.settings || {};

  const groups = [...new Set(roster.map(t => String(t.group || '')).filter(Boolean))].sort();
  const Q = new URLSearchParams(location.search);

  const today = window.hubToday ? hubToday() : new Date().toISOString().slice(0, 10);
  let date = Q.get('date') && days.some(d => d.date === Q.get('date')) ? Q.get('date') : ((days.filter(d => d.date <= today).pop() || days[0] || {}).date || '');
  const fmtDay = s => { try { return new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).format(hubDateOf(s)); } catch (e) { return s; } };
  const tpsPoints = (() => { try { return JSON.parse(localStorage.getItem('connect_tp_points_v1') || '{}') || {}; } catch (e) { return {}; } })();

  /* every written feedback a trainee has, by TP number */
  const historyOf = t => { const Rr = t.records || {}; const H = Object.assign({}, Rr.tpHistory || {});
    if (Rr.feedback && Rr.feedback.state) { const n = String((Rr.feedback.state.f || {}).fTP || '').replace(/\D/g, ''); if (n) H[n] = Rr.feedback; }
    const out = {}; Object.keys(H).forEach(k => { const st = H[k] && H[k].state; if (st && st.f) out[+k] = st; }); return out; };
  const items = (st, keys) => { const L = (st && st.lists) || {}; const all = []; keys.forEach(k => (L[k] || []).forEach(x => { const t = bare(x && (x.html || x.t || x.text || '')); if (t) all.push({ t, star: !!(x && x.star), c: codeOf(x), k }); })); return all.sort((a, b) => (b.star - a.star)); };
  const strengths = st => items(st, ['lST', 'lSP']);
  const actions = st => items(st, ['lAT', 'lAP']);
  const sayOf = t => (((t.records || {}).staffLinks || []).find(x => x && x.fbsay)) || { fbsay: true, tps: {} };

  /* who taught on the day: the day's teaching set in this group, in the order they taught */
  function taughtOn(day){
    const people = roster.filter(t => String(t.group || '') === group).map(t => ({ token: t.token, name: t.name, group }));
    /* WHO TEACHES IN WHICH SET comes from the places the tutors chose (settings.slotOf), read from the course this page
       has just fetched (23 Nov 2026, walking a TP day: on a fresh phone the rotation helper read this browser's copy of the
       settings before the sync had written it, fell back on name order, and one group's card named the other set as
       the trainees who taught). The helper is the fallback for a group nobody has placed. */
    const slot = (cs && cs.slotOf) || {}, PL = 'ABCDEF';
    let sets;
    if (people.length && people.every(p => PL.indexOf(String(slot[p.token] || '')) !== -1)) {
      const lettered = people.map(p => Object.assign({}, p, { letter: String(slot[p.token]), idx: PL.indexOf(String(slot[p.token])) })).sort((a, b) => a.idx - b.idx);
      sets = [lettered.filter(p => p.idx < 3), lettered.filter(p => p.idx >= 3)];
    } else sets = R ? R.setsFor(people) : [people];
    const set = sets[day.setIndex || 0] || [];
    const rows = (tpsPoints.groups && tpsPoints.groups[group]) || tpsPoints.points || {};
    const order = R && R.orderDealt ? R.orderDealt(set, day.tp, (tok, tp) => (rows[tok] || {})['tp' + tp]) : set;
    return order.map(p => Object.assign({ letter: p.letter }, roster.find(t => t.token === p.token) || {})).filter(t => t.token);
  }

  function card(t, day){
    const H = historyOf(t), tp = +day.tp, now = H[tp] || null;
    const prev = Object.keys(H).map(Number).filter(n => n < tp).sort((a, b) => a - b);
    const last = prev.slice(-3).map(n => { const a = actions(H[n])[0]; return a ? Object.assign({ tp: n }, a) : null; }).filter(Boolean);
        const count = {}; prev.concat(now ? [tp] : []).forEach(n => { new Set(actions(H[n]).map(a => a.c).filter(Boolean)).forEach(c => { (count[c] = count[c] || { n: 0, t: '' }); count[c].n++; count[c].t = (actions(H[n]).find(a => a.c === c) || {}).t; }); });
    const reps = Object.keys(count).filter(c => count[c].n >= 2).sort((a, b) => count[b].n - count[a].n);
    const firstTutor = prev.length ? H[prev[0]].f.fTutor : '';
    const swap = tp === half && prev.length > 0;
    const grade = n => (H[n].f.fGrade || '').trim();
    const GR = { 'Above standard': ['above', 'Above'], 'To standard': ['to', 'To'], 'Not to standard': ['not', 'Not to'], 'Below standard': ['not', 'Not to'] };
    const rank = g => ({ 'Above standard': 3, 'To standard': 2 }[g] || 1);
    const bestTp = prev.slice().sort((a, b) => rank(grade(b)) - rank(grade(a)) || b - a)[0];
    const best = bestTp ? strengths(H[bestTp])[0] : null;
    const hand = ((t.records || {}).staffLinks || []).find(x => x && x.handover) || null;
    /* ONE CARD PER TRAINEE WHO TAUGHT (22 Nov 2026). The name, the lesson and the grade; then what to say about today's
       lesson, What worked and To work on, the largest words on the card, starred points first and in bold; then what was
       set in earlier TPs, as a reminder to ask about. The words are the tutors' own written feedback, nothing generated.
       A BOX CAN BE EDITED IN PLACE ("if the trainer wants to edit, they can just edit inside the boxes, similar to the
       handover"): click it, change the lines, save. That is the tutor's own wording for the talk, kept for tutors only in
       the trainee's staffLinks as { fbsay: true, tps: { n: { s, a } } }; the written TP feedback is never changed by it.
       TAKEN OFF: the Met / Partly / Not yet buttons (nothing in Lite ever read them; the marks already saved stay in the
       store), the criterion code after each point, and the "small" source lines. */
    const f = now ? (now.f || {}) : {}, gNow = now ? (f.fGrade || '').trim() : '', gm = GR[gNow];
    const good = now ? strengths(now).slice(0, 4) : [], work = now ? actions(now).slice(0, 4) : [];
    const say = (sayOf(t).tps || {})[tp] || {};
    const lines = v => String(v).split('\n').map(x => x.trim()).filter(Boolean);
    const li = x => `<p${x.star ? ' class="star"' : ''}>${esc(x.t)}</p>`;
    const box = (k, title, written, none) => { const own = typeof say[k] === 'string'; const ps = own ? lines(say[k]).map(t => ({ t })) : written;
      return `<div class="box ${k}" data-box="${k}" data-tp="${tp}" tabindex="0" role="button" aria-label="${title}: click to edit" data-text="${esc((own ? lines(say[k]) : written.map(x => x.t)).join('\n'))}" data-own="${own ? 1 : ''}"><b class="h">${title}<em>${own ? 'your wording' : ''}</em></b>${ps.length ? ps.map(li).join('') : '<p class="none">' + none + '</p>'}</div>`; };

    const before = `${last.length ? `<p class="lab">Action points from earlier TPs: better today?</p>${last.slice().reverse().filter((a, i, all) => all.findIndex(x => x.t === a.t) === i).map(a => `<div class="ap">${esc(a.t)}<small>TP${a.tp}</small></div>`).join('')}` : ''}${reps.length ? `<p class="lab" style="margin-top:12px">Keeps coming back</p>${reps.slice(0, 3).map(c => `<div class="ap">${esc(count[c].t || c)}<span class="rep" style="margin:0 0 0 8px">${count[c].n === 2 ? 'twice' : count[c].n + ' times'}</span></div>`).join('')}` : ''}`;
    const fold = window.hubBeforeFold ? hubBeforeFold(t) : '';
    return `<article class="tr tf${gm && gm[0] === 'not' ? ' red' : ''}" data-token="${esc(t.token)}">
      <div class="tf-head"><div><h2>${esc(t.name)}</h2>${sub ? '<small>' + sub + '</small>' : ''}</div>${gNow ? `<span class="tf-grade ${gm ? gm[0] : ''}">${esc(gNow)}</span>` : ''}</div>

  }

  /* "The whole group first" (which criteria two or more shared today) is off the page (22 Nov 2026): one thing fewer to read. */

  const ACTS = [

  ];
  const actsOf = () => { const a = ((cs.fbActs || {})[group]) || []; return Array.isArray(a) ? a : []; };
  function dealFor(dateISO, skip){

      <div class="grid n${Math.min(3, Math.max(1, list.length))}" id="each">${list.length ? list.map(t => card(t, day)).join('') : '<p class="empty-group">Nobody in this group teaches on this day.</p>'}</div>
      ${list.length ? '<div class="games"><p class="lab">Or play a game</p>'
        + '<button type="button" id="wheel" class="gm g1"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 4v32M4 20h32M8.7 8.7l22.6 22.6M31.3 8.7 8.7 31.3" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="3.5" fill="currentColor"/></svg><b>Spin the criteria</b><small>The wheel picks one</small></button>'

        + '<button type="button" id="xo" class="gm g3"><svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M6 6l11 11M17 6 6 17"/><circle cx="29" cy="28" r="6.5"/></g></svg><b>XO</b><small>Two teams</small></button>'
        + '<button type="button" id="dice" class="gm g4"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="5" width="30" height="30" rx="7" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="13" cy="13" r="2.8" fill="currentColor"/><circle cx="27" cy="13" r="2.8" fill="currentColor"/><circle cx="20" cy="20" r="2.8" fill="currentColor"/><circle cx="13" cy="27" r="2.8" fill="currentColor"/><circle cx="27" cy="27" r="2.8" fill="currentColor"/></svg><b>Roll for it</b><small>Six questions</small></button>'
        + '<button type="button" id="cards" class="gm g5"><svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="5" y="9" width="19" height="25" rx="3" transform="rotate(-10 14 21)"/><rect x="17" y="7" width="19" height="25" rx="3" transform="rotate(8 26 19)"/></g></svg><b>Flip a card</b><small>Finish the sentence</small></button></div>' : ''}
      <p class="foot-note">Everything on the cards comes from the written TP feedback. Click a box to change the wording for your talk. Trainees never see this page.</p>`;
    document.querySelectorAll('.box[data-box]').forEach(b => { b.onclick = () => editBox(b); b.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === b) { e.preventDefault(); editBox(b); } }; });

    document.querySelectorAll('.tabs button[data-day]').forEach(b => b.onclick = () => { date = b.dataset.day; history2(); draw(); });
    document.querySelectorAll('.tabs button[data-group]').forEach(b => b.onclick = () => { group = b.dataset.group; history2(); draw(); });
    HubFbGames.use(() => (course.timetable && course.timetable.days) || []);
    if ($('wheel')) $('wheel').onclick = () => HubFbGames.wheel(day, list);
    if ($('bingo')) $('bingo').onclick = () => HubFbGames.game('bingo', day, list);
    if ($('xo')) $('xo').onclick = () => HubFbGames.game('xo', day, list);
    if ($('dice')) $('dice').onclick = () => HubFbGames.game('dice', day, list);
    if ($('cards')) $('cards').onclick = () => HubFbGames.game('cards', day, list);
    document.querySelectorAll('.act .chip[data-act]').forEach(b => b.onclick = async () => { if (b.dataset.act === dealFor(date)) return; await keepAct(date, b.dataset.act, true); draw(); });
  }
  function history2(){ try { history.replaceState(null, '', '?date=' + encodeURIComponent(date) + '&group=' + encodeURIComponent(group) + (Q.get('k') ? '&k=' + encodeURIComponent(Q.get('k')) : '')); } catch (e) {} }
  /* edit a box in place: one point per line; saved for tutors only, the written feedback untouched */
  function editBox(b){
    if (b.classList.contains('editing')) return;
    b.classList.add('editing'); const title = b.querySelector('b.h').firstChild.textContent, own = !!b.dataset.own;
    b.innerHTML = `<b class="h">${esc(title)}</b><textarea aria-label="${esc(title)}, one point per line">${esc(b.dataset.text)}</textarea>
      <div class="row"><button type="button" data-do="save">Save</button><button type="button" class="quiet" data-do="cancel">Cancel</button>${own ? '<button type="button" class="quiet" data-do="reset">Use the written feedback again</button>' : ''}<span class="hint">One point per line. Tutors only.</span></div>`;
    const ta = b.querySelector('textarea'); ta.focus(); ta.onclick = e => e.stopPropagation();
    b.querySelectorAll('[data-do]').forEach(x => x.onclick = e => { e.stopPropagation(); const d = x.dataset.do; if (d === 'cancel') return draw(); saySave(b.closest('.tr').dataset.token, b.dataset.tp, b.dataset.box, d === 'reset' ? null : ta.value); });
  }
  async function saySave(token, tp, k, text){
    const t = roster.find(x => x.token === token); if (!t) return;
    const links = ((t.records || {}).staffLinks || []);
    const cur = Object.assign({ fbsay: true, tps: {} }, links.find(x => x && x.fbsay) || {});
    cur.tps = Object.assign({}, cur.tps); const one = Object.assign({}, cur.tps[tp] || {});
    if (text == null) delete one[k]; else one[k] = String(text).split('\n').map(x => x.trim()).filter(Boolean).join('\n');
    if (Object.keys(one).length) cur.tps[tp] = one; else delete cur.tps[tp];
    const next = links.filter(x => x && !x.fbsay).concat(Object.keys(cur.tps).length ? [cur] : []);
    t.records = t.records || {}; t.records.staffLinks = next; draw();
    try { const r = await S.put('staffLinks', next, token); if (r && r.demo && window.hubDemoSay) hubDemoSay('This is a demo course. Your wording stays on this device.'); }
    catch (e) { if (window.hubDemoSay) hubDemoSay('Not saved: ' + e.message); }
  }
  draw();
})();
</script>
