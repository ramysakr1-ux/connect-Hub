<!DOCTYPE html>
<!--
  Connect Lite — a volunteer student's certificate of attendance
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 30 Sep 2026: "that certificate needs to look more like a certificate…
  with the number of hours and the level mentioned on it. It could be sent as
  a PDF, emailed, or printed. So work on the design." And: not a copy of
  Connect's, which is a different thing for a different product.

  WHAT MAKES IT READ AS A CERTIFICATE AND NOT A RECEIPT
  - Landscape. Every certificate anyone has ever been handed is landscape, and
    a portrait page of facts reads as an invoice however it is set.
  - One thing is large: the name. Everything else is support for it.
  - A ruled border with corner marks, in gold, drawn in CSS so it prints
    crisply at any size and needs no image.
  - Centred, symmetrical, generous margins. Certificates are formal objects
    and formality here is literally symmetry.
  - Small caps and letter-spacing for the labels, a serif for the words that
    matter. The hours and the level sit in the middle as two plain facts,
    because they are what the document is FOR.
  - Nothing that looks like software: no cards, no rounded boxes, no pills.

  WHAT IT CLAIMS. Only what the register supports: hours ATTENDED, counted by
  hub-attendance.js, the same file the register and the student's own page
  read, so the three can never disagree. The level is the one recorded against
  that student on the register.

  PDF AND EMAIL. Print gives a PDF on every device -- that is the button.
  Lite sends no email and never has; the honest answer is that you save the
  PDF and send it yourself, and the page says so rather than offering a
  button that does nothing. `mailto:` opens the centre's own mail with the
  student named and the file to be attached by hand.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<title>Certificate of attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;0,700;1,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202610100020">
<style>
  body{background:var(--sand); color:var(--ink); font-family:'Karla',sans-serif; margin:0;}
  .board{max-width:1120px; margin:0 auto; padding:22px 20px 60px;}
  .bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 18px;}
  .note{font-size:0.82rem; color:var(--grey); line-height:1.55; max-width:52ch;}

  /* THE CERTIFICATE ITSELF. Landscape, ruled, centred. A4 landscape is
     297x210mm; the sheet keeps that ratio on screen so what you see is what
     prints. */
  .sheet{position:relative; background:var(--paper); aspect-ratio:297/210; width:100%;
    box-shadow:0 1px 3px oklch(0% 0 0 / .07), 0 12px 32px oklch(0% 0 0 / .06);
    display:flex; align-items:center; justify-content:center; overflow:hidden;}
  /* Two rules, a hairline inside a heavier one: the oldest trick in
     certificate setting and the cheapest way to say "this is a document". */
  .rule-out{position:absolute; inset:3.2%; border:2px solid var(--gold); opacity:.55;}
  .rule-in{position:absolute; inset:4.4%; border:1px solid var(--gold); opacity:.4;}
  /* Corner marks. Four small right-angles that sit over the rules. */
  .corner{position:absolute; width:26px; height:26px; border:0; opacity:.75;}
  .corner i{position:absolute; background:var(--gold);}
  .corner i.h{height:2px; width:26px; top:0;} .corner i.v{width:2px; height:26px; left:0;}
  .c-tl{top:3.2%; left:3.2%;} .c-tr{top:3.2%; right:3.2%; transform:scaleX(-1);}
  .c-bl{bottom:3.2%; left:3.2%; transform:scaleY(-1);} .c-br{bottom:3.2%; right:3.2%; transform:scale(-1);}

  .inner{position:relative; text-align:center; padding:5.5% 9% 5%; width:100%; box-sizing:border-box;}
  /* The centre's certificate, so the centre leads it (Ramy, 8 Oct 2026: "the centre should have their name and logo"). */
  .logo{height:64px; width:auto; max-width:220px; object-fit:contain; display:block; margin:0 auto 12px;}
  .centre{font-family:'Newsreader',Georgia,serif; font-size:1.25rem; font-weight:700; letter-spacing:.02em; color:var(--ink); margin:0 0 16px;}
  .kind{font-family:'Newsreader',Georgia,serif; font-size:1.05rem; font-style:italic; color:var(--gold-deep); margin:0 0 4px;}
  .kind-rule{width:54px; height:1px; background:var(--gold); margin:10px auto 22px; opacity:.6;}
  .awarded{font-size:0.82rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:0 0 10px;}
  .who{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:clamp(1.9rem, 4.6vw, 3.1rem); line-height:1.08; margin:0 0 6px;}
  .who-rule{width:min(58%, 420px); height:1px; background:var(--sand-line); margin:14px auto 20px;}
  .body{font-family:'Newsreader',Georgia,serif; font-size:clamp(0.92rem, 1.35vw, 1.06rem); line-height:1.75; color:var(--ink); max-width:62ch; margin:0 auto;}
  /* The two facts the document exists for. */
  .facts{display:flex; justify-content:center; gap:clamp(30px, 6vw, 68px); margin:22px 0 0;}
  .fact .n{font-family:'Newsreader',Georgia,serif; font-size:clamp(1.5rem, 3vw, 2.1rem); font-weight:700; display:block; line-height:1.05;}
  .fact .l{font-size:0.66rem; letter-spacing:.16em; text-transform:uppercase; color:var(--grey); font-weight:700; display:block; margin-top:4px;}
  .sign{display:flex; justify-content:center; gap:clamp(40px, 9vw, 110px); margin:clamp(52px, 8vh, 76px) 0 0;}   /* room for a written signature above its line */
  .sign .slot{min-width:190px; display:block;}
  /* spans by default, so the line needs display:block or it has no height to draw. */
  .sign .line{display:block; height:1px; background:var(--ink); opacity:.4; margin:0 0 7px;}
  .sign .l{font-size:0.64rem; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); font-weight:700;}
  .sign .for{display:block; margin-top:3px; font-family:'Newsreader',Georgia,serif; font-style:italic; font-size:0.82rem; color:var(--ink-warm);}
  /* A signature drawn on screen (hub-ink), so a centre can hand over a signed
     PDF without a printer between them and the student. The rule stays: the
     ink sits ON it, as a pen would. */
  .sign .slot{position:relative;}
  .sign .inkwrap{position:absolute; left:0; right:0; bottom:8px; display:flex; justify-content:center; pointer-events:none;}
  .sign .inkwrap svg.ink{height:46px; max-width:100%; color:var(--ink);}
  /* A written signature (hub-hand) sits ON its line, not through the name under it. */
  .sign .inkwrap:has(.hand){bottom:26px;}
  /* the two lines level, whatever sits under each */
  .sign{align-items:flex-start;}
  .sign .slot.has-for .inkwrap:has(.hand){bottom:46px;}
  .sign .inkwrap .hand{display:block; line-height:1; white-space:nowrap; font-size:2.9rem !important;}
  .sign .typed{position:absolute; left:0; right:0; bottom:10px; text-align:center; font-family:'Newsreader',Georgia,serif; font-size:1.15rem;}
  .sign .dated{position:absolute; left:0; right:0; bottom:25px; text-align:center; font-size:0.9rem; font-family:'Newsreader',Georgia,serif;}
  .foot{position:absolute; left:0; right:0; bottom:3.6%; margin:0; text-align:center; font-size:0.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--faint);}

  .empty{background:var(--paper); border:1px dashed var(--sand-line); border-radius:11px; padding:26px 24px; color:var(--grey); font-size:0.9rem; line-height:1.65;}
  .empty b{color:var(--ink);}
  @media (max-width:640px){ .inner{padding:5% 6%;} .sign{flex-direction:column; align-items:center; gap:22px;} .sign .slot{min-width:min(240px,70vw);} }
  @media print{
    .bar, #hubSync{display:none !important;}
    body{background:#fff;} .board{max-width:none; padding:0;}
    .sheet{box-shadow:none; aspect-ratio:auto; height:100vh; width:100%;}
    @page{ size:A4 landscape; margin:0; }
  }

  /* ---- v4 (7 Oct 2026): the seal and the sheen -------------------------------
     A gold medallion with the mark, low on the right inside the rules: the
     certificate's own seal. It prints. On screen only, one sheen crosses the
     sheet the first time it opens. Design: Magic Touches, 4b. */
  .v4-seal{position:absolute; right:8.5%; bottom:11%; width:clamp(64px,9vw,96px); aspect-ratio:1; border-radius:50%; z-index:1;
    background:radial-gradient(circle at 35% 30%, oklch(82% 0.11 80), var(--gold) 55%, var(--gold-deep));
    box-shadow:0 2px 6px oklch(40% 0.06 70 / .35), inset 0 0 0 2px oklch(88% 0.08 82 / .7);
    display:flex; align-items:center; justify-content:center;}
  .v4-seal .ring{position:absolute; inset:7%; border-radius:50%; border:1.5px dashed oklch(97% 0.03 85 / .75);}
  .v4-seal .v4-mark{position:relative; width:52%; height:auto;}
  @media screen{
    .sheet::after{content:''; position:absolute; top:0; bottom:0; width:30%; left:-40%; pointer-events:none; z-index:2;
      background:linear-gradient(100deg, transparent, oklch(100% 0 0 / .5), transparent); animation:v4-sheen 1.8s ease-out .5s 1 both;}
    .v4-seal{animation:v4-seal .8s cubic-bezier(.2,.7,.2,1) .9s both;}
  }
  @keyframes v4-sheen{from{left:-40%;}to{left:130%;}}
  @keyframes v4-seal{0%{opacity:0; transform:scale(1.8) rotate(-30deg);}70%{opacity:1; transform:scale(.94) rotate(-6deg);}100%{transform:scale(1) rotate(-8deg);}}
  .v4-seal{transform:rotate(-8deg);}
  @media(prefers-reduced-motion:reduce){ .sheet::after{display:none;} .v4-seal{animation:none !important;} }
  @media (max-width:640px){ .v4-seal{right:6%; bottom:6%;} }
  @media print{ .sheet::after{display:none;} .v4-seal{animation:none !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;} }
</style>
<link rel="stylesheet" href="hub-house.css?v=202610100020">
</head>
<body class="hub-grid hub-paper hub-course">
<div class="board" id="app"></div>
<script src="hub-shared.js?v=202610100020"></script>
<script src="hub-attendance.js?v=202610100020"></script>
<script src="hub-hand.js?v=202610100020"></script>
<script src="hub-ink.js?v=202610100020"></script>
<script src="hub-store.js?v=202610100020"></script>
<script src="hub-say.js?v=202610100020"></script>
<script src="hub-sync.js?v=202610100020"></script>
<script type="text/x-hub-app">
const MODE = window.HubMode;
/* A student's own, or a tutor printing one from the register. */
if (window.hubVolunteerRoomOnly && hubVolunteerRoomOnly({ tutor: true }))
  throw new Error('Connect Lite: stopping this page on purpose — the certificate belongs to a volunteer student.');
const IS_TUTOR = MODE === 'tutor';
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const tutorName = () => (localStorage.getItem('chub:tutorName') || '').trim();

const A = window.hubAttendance;
const SETTINGS = rec('connect_course_settings') || {};
const TT = rec('connect_timetable_v1') || {};
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const parse = s => { const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const longDate = iso => { const d = parse(iso); return d ? d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear() : ''; };
const fmtH = h => (Math.round(h * 100) / 100).toString().replace(/\.00$/, '');

/* The same arithmetic as the register and the student's own page: one engine,
   so the three cannot disagree about what somebody attended. */
const tpSlots = (TT.slots || []).filter(s => s.kind === 'tp');
const mins = sl => { const a = String(sl.from||'').match(/^(\d{1,2}):(\d{2})/), b = String(sl.to||'').match(/^(\d{1,2}):(\d{2})/); if (!a||!b) return 0; const d = (+b[1]*60 + +b[2]) - (+a[1]*60 + +a[2]); return d > 0 ? d : 0; };
const LESSON_MIN = tpSlots.length ? Math.round(tpSlots.reduce((n, sl) => n + mins(sl), 0) / tpSlots.length) : 0;
const days = (TT.days || []).filter(d => d.tp).map(d => d.date).sort();

/* Whose certificate. A student opens their own on their own link; a tutor
   opens any by passing ?who=<their token> from the register. */
function subject(){
  if (IS_TUTOR) {
    const want = new URLSearchParams(location.search).get('who') || '';
    const reg = rec('connect_volunteers_v1') || {};
    const st = (reg.students || []).find(s => s && s.token === want);
    return st || null;
  }
  const me = rec('hub:volunteer');
  return (me && me.name) ? me : null;
}

function render(){
  const who = subject();
  const app = $('app');
  if (!who) {
    app.innerHTML = `<div class="empty">This page needs a student. ${IS_TUTOR ? 'Open it from the volunteer register, using the certificate button on their row.' : 'Open your own link from the centre.'}</div>`;
    return;
  }
  /* A record written before the three tiers held a list of dates, all of them
     "in the room". */
  const marks = who.marks || (who.here || []).reduce((m, d) => { m[d] = 'present'; return m; }, {});
  const r = A.record(marks, days, tpSlots.length, LESSON_MIN);
  /* 160 hours AT A LEVEL (Ramy, 8 Oct 2026: "completed a hundred and sixty
     hours of level whatever"): carried in at the level, plus this course's
     days since the student moved up to it. */
  const level = String(who.level || '').trim();
  const marksL = A.atLevel(marks, who.levelFrom);
  const rL = who.levelFrom ? A.record(marksL, days, tpSlots.length, LESSON_MIN) : r;
  const cert = A.certificate(rL.hours, SETTINGS.volunteerCertificateHours || 160, tpSlots.length, LESSON_MIN, who.carried);
  const doneOn = A.completedOn(marksL, days, tpSlots.length, LESSON_MIN, who.carried, cert.target);

  if (!cert.earned && !IS_TUTOR) {
    app.innerHTML = `<div class="empty"><b>Not quite yet.</b><br>Your certificate comes when you complete ${fmtH(cert.target)} hours${level ? ' at ' + esc(level) : ''}. You have ${fmtH(cert.total)} so far, so that is <b>${cert.classesLeft} more ${cert.classesLeft === 1 ? 'class' : 'classes'}</b>. It will appear here on its own.</div>`;
    return;
  }

  const centre = SETTINGS.centreName || '';
  const course = SETTINGS.courseName || '';
  const attendedDays = r.days.filter(x => x.tier === 'present').map(x => x.date);
  const first = attendedDays[0] || '', last = attendedDays[attendedDays.length - 1] || '';
  const span = (first && last) ? (first === last ? 'on ' + longDate(first) : 'between ' + longDate(first) + ' and ' + longDate(last)) : '';

  /* SIGNED BY THE CENTRE, not a tutor (Ramy, 8 Oct 2026: "the signature
     also comes from the centre, not from the tutor, because they probably
     have different tutors"). One name and signature, set on Course admin,
     on every certificate; dated the day the hours reached the target. */
  const sg = SETTINGS.certSigner && SETTINGS.certSigner.name ? SETTINGS.certSigner : null;
  const inkHTML = sg && sg.ink && window.hubInk ? `<span class="inkwrap">${window.hubInk.svg(sg.ink, '', sg.name)}</span>`
    : sg ? `<span class="typed">${esc(sg.name)}</span>` : '';
  const dateHTML = doneOn ? `<span class="dated">${esc(longDate(doneOn))}</span>` : '';

  const mail = 'mailto:?subject=' + encodeURIComponent('Certificate of attendance — ' + who.name)
    + '&body=' + encodeURIComponent('Dear ' + String(who.name).split(/\s+/)[0] + ',\n\nThank you for coming in to be taught on ' + (course || 'our course') + '. Your certificate of attendance is attached.\n\n' + (centre ? centre + '\n' : ''));

  app.innerHTML = `
    <div class="bar">
      <button class="btn" id="print">Print, or save as PDF</button>
      <a class="btn quiet" href="${esc(mail)}">Email it</a>
      ${IS_TUTOR ? '<a class="btn quiet" href="25_volunteer_register.html">Back to the register</a>' : ''}
      <span class="note">${sg ? 'Signed for the centre by ' + esc(sg.name) + '. ' : (IS_TUTOR ? 'No signature yet: the centre sets it once on Course admin, under Who signs the volunteers’ certificates. ' : '')}${cert.earned ? 'Prints landscape on one page, without these buttons. Save it as a PDF and attach it — Lite does not send email itself.' : fmtH(cert.total) + ' of the ' + fmtH(cert.target) + ' hours' + (level ? ' at ' + esc(level) : '') + ' so far. Printing it anyway is your call.'}</span>
    </div>
    <div class="sheet">
      <div class="rule-out"></div><div class="rule-in"></div>
      <span class="v4-seal" aria-hidden="true"><span class="ring"></span><svg class="v4-mark" viewBox="8 30 104 60" fill="none" aria-hidden="true"><path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="var(--ink-warm)" stroke-width="11" stroke-linecap="round"></path><path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="var(--paper)" stroke-width="11" stroke-linecap="round"></path></svg></span>
      <span class="corner c-tl"><i class="h"></i><i class="v"></i></span>
      <span class="corner c-tr"><i class="h"></i><i class="v"></i></span>
      <span class="corner c-bl"><i class="h"></i><i class="v"></i></span>
      <span class="corner c-br"><i class="h"></i><i class="v"></i></span>
      <div class="inner">
        ${SETTINGS.logo ? `<img class="logo" src="${esc(SETTINGS.logo)}" alt="">` : ''}
        <p class="centre">${esc(centre)}</p>
        <p class="kind">Certificate of Attendance</p>
        <div class="kind-rule"></div>
        <p class="awarded">This is to certify that</p>
        <h1 class="who">${esc(who.name)}</h1>
        <div class="who-rule"></div>
        <!-- NO HOURS ON THE CERTIFICATE (Ramy, 8 Oct 2026): the 160 is the
             centre's rule for when it is earned, not a thing the student is
             handed. It certifies the level, and says who taught them. -->
        <p class="body">has completed ${level ? 'level <b>' + esc(level) + '</b> in English' : 'a level of English'} as a volunteer student${centre ? ' at ' + esc(centre) : ''},
          in lessons taught by teachers in training, whose learning depended on people
          willing to come and be taught. The last of these lessons were on ${esc(course || 'the course')}${span ? ', ' + esc(span) : ''}.</p>
        ${level ? `<div class="facts"><span class="fact"><span class="n">${esc(level)}</span><span class="l">Level completed</span></span></div>` : ''}
        <div class="sign">
          <span class="slot${centre ? ' has-for' : ''}">${inkHTML}<span class="line"></span><span class="l">${sg ? esc(sg.name) + (sg.role ? ', ' + esc(sg.role) : '') : 'Signed for the centre'}</span>${centre ? `<span class="for">for ${esc(centre)}</span>` : ''}</span>
          <span class="slot">${dateHTML}<span class="line"></span><span class="l">Date</span></span>
        </div>
      </div>
      <p class="foot">${esc(centre)}${SETTINGS.centreNumber ? ' · Cambridge centre ' + esc(SETTINGS.centreNumber) : ''} · attendance recorded on the course register</p>
    </div>`;
  if ($('print')) $('print').addEventListener('click', () => window.print());
}
render();
</script>
</body>
</html>
