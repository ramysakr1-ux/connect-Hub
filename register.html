<!DOCTYPE html>
<!--
  Connect Lite — the volunteer register, for the center.
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 14 Nov 2026: "Can I share the register with someone from the center outside of Connect Lite? ... There is no
  trainees attendance register, only volunteer students. So that's the one. Just want to share it with the center."
  The page opens from a link of the form register.html?r=<key>, copied from the tutors' register. No sign-in. It shows
  the volunteer students' register as it stands, read-only: names, levels, the days each came, the hours. No addresses,
  no personal links, nothing else of the course. The store's registerView answers it, and stops when the course ends.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Volunteer register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202611192107">
<style>
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--sand); color:var(--ink); font-family:'Karla',sans-serif;}
  .wrap{max-width:860px; margin:0 auto; padding:28px 18px 60px;}
  .eye{font-size:11px; letter-spacing:.22em; text-transform:uppercase; font-weight:700; color:var(--brick); margin:0 0 6px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:2rem; line-height:1.08; margin:0 0 8px;}
  .lede{color:var(--grey); line-height:1.5; margin:0 0 6px; max-width:68ch;}
  .asof{color:var(--grey); font-size:.86rem; margin:0 0 18px;}
  .bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 16px;}
  .btn{border:1px solid var(--sand-line); background:var(--paper); color:var(--ink); border-radius:999px; padding:9px 16px; font:700 .9rem/1 'Karla',sans-serif; cursor:pointer;}
  /* Lite's one hover (hub-house.css, 12 Nov 2026): a button rises, takes a shadow, and its edge turns forest; the fill never changes. This page stands alone, so the rule is repeated here. */
  .btn{transition:transform .16s ease, box-shadow .16s ease;}
  body .btn:hover{transform:translateY(-2px) !important; box-shadow:0 0 0 1.5px var(--a-forest), 0 2px 4px rgba(35,34,32,.07), 0 14px 28px -14px rgba(35,34,32,.3) !important;}
  @media (prefers-reduced-motion: reduce){ .btn:hover{transform:none;} }
  .reg{background:var(--paper); border:1px solid var(--sand-line); border-left:5px solid var(--teal); border-radius:10px; padding:0 0 6px; overflow:hidden;}
  .who{display:grid; grid-template-columns:1.1fr auto; gap:12px; align-items:center; padding:11px 16px; border-top:1px solid var(--sand-line); break-inside:avoid;}
  .who:first-child, .grp + .who{border-top:0;}
  .nm{font-weight:700; font-size:.94rem;}
  .nm small{display:block; font-weight:500; font-size:.76rem; color:var(--grey); margin-top:2px;}
  .lvltag{display:inline-block; margin-left:8px; font-size:.72rem; font-weight:700; letter-spacing:.06em; color:var(--gold-deep); background:var(--box); padding:1px 7px; border-radius:999px;}
  /* EACH DAY IS A SQUARE WITH ITS DATE IN IT, AND THE KEY IS ABOVE THE LIST (Ramy, 17 Nov 2026: "colour isn't very
     clear, what's what?"). The squares were four pale tints with the key at the foot. Now each says its day, a new
     week starts after a gap, and the four states differ in shape as well as colour: filled forest for in the room,
     mustard for part of it, a red outline with the date struck through for a day that passed with no mark, plain grey for still to come. */
  .segs{display:flex; flex-wrap:wrap; gap:4px; margin-top:8px;}
  .seg{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:6px; font:700 .72rem/1 'Karla',sans-serif;
       background:color-mix(in oklch, var(--ink) 6%, var(--paper)); color:var(--grey);}
  .seg.wk{margin-left:8px;}
  .seg.here{background:var(--a-forest); color:var(--paper);}
  .seg.part{background:var(--a-mustard); color:var(--ink);}
  .seg.miss{background:var(--paper); color:var(--brick); box-shadow:inset 0 0 0 1.5px var(--brick); text-decoration:line-through;}
  .seg.soon{background:color-mix(in oklch, var(--ink) 6%, var(--paper)); color:var(--grey);}
  .seg.before{background:transparent; color:color-mix(in oklch, var(--grey) 60%, var(--paper)); box-shadow:inset 0 0 0 1.5px var(--sand-line);}
  .lvl{margin:26px 0 10px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; break-after:avoid;}
  .lvl h2{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.35rem; margin:0;}
  .lvl span{color:var(--grey); font-size:.86rem;}
  .grp{padding:9px 16px 7px; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:var(--grey); background:color-mix(in oklch, var(--ink) 3%, var(--paper)); border-top:1px solid var(--sand-line);}
  .grp:first-child{border-top:0; border-radius:6px 10px 0 0;}
  /* THE CENTER'S TWO CHANGES (17 Nov 2026): add a student, move a level. Quiet controls; never on paper. */
  .lvsel{margin-left:8px; font:600 .78rem/1 'Karla',sans-serif; color:var(--ink); background:var(--box); border:1px solid var(--sand-line); border-radius:999px; padding:4px 8px; max-width:11.5rem;}
  .ask{margin:8px 0 2px; padding:10px 12px; background:var(--box); border-radius:8px; font-size:.86rem; line-height:1.5;}
  .ask .btn{margin:8px 8px 0 0; padding:8px 14px; font-size:.84rem;}
  .btn.go{background:var(--a-forest); color:var(--paper); border-color:var(--a-forest);}
  .addbox{background:var(--paper); border:1px solid var(--sand-line); border-radius:10px; padding:14px 16px; margin:0 0 14px; display:grid; grid-template-columns:1.4fr .9fr 1.3fr auto; gap:10px; align-items:end;}
  .addbox label{display:block; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--grey); margin:0 0 5px;}
  .addbox input, .addbox select{width:100%; font:500 .92rem/1.2 'Karla',sans-serif; color:var(--ink); background:var(--box); border:1px solid var(--sand-line); border-radius:8px; padding:9px 10px;}
  .addbox p{grid-column:1 / -1; margin:0; font-size:.82rem; color:var(--grey);}
  .said{margin:0 0 12px; font-size:.88rem; font-weight:700; color:var(--a-forest);}
  .said.bad{color:var(--brick);}
  @media (max-width:560px){ .addbox{grid-template-columns:1fr;} }
  @media print{ .lvsel, .ask, .addbox, .said{display:none !important;} }
  .key{background:var(--paper); border:1px solid var(--sand-line); border-radius:10px; padding:10px 14px; margin:0 0 4px; display:flex; gap:8px 18px; flex-wrap:wrap; align-items:center; font-size:.84rem;}
  .key b{font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--grey);}
  .key span{display:inline-flex; align-items:center; gap:7px;}
  .hrs{text-align:right; white-space:nowrap;}
  .hrs b{font-family:'Newsreader',Georgia,serif; font-size:1.2rem;}
  .hrs small{display:block; font-size:.74rem; color:var(--grey);}
  .legend{font-size:.76rem; color:var(--grey); margin:14px 0 0; line-height:1.7; display:flex; gap:0 16px; flex-wrap:wrap; align-items:center;}
  .empty{background:var(--paper); border:1px dashed var(--sand-line); border-radius:10px; padding:26px 22px; color:var(--grey); font-size:.9rem; line-height:1.6;}
  @media (max-width:560px){ .who{grid-template-columns:1fr; gap:6px;} .hrs{text-align:left;} }
  @media print{ body{background:#fff;} .bar{display:none !important;} .wrap{max-width:none; padding:0;} .seg{-webkit-print-color-adjust:exact; print-color-adjust:exact;} .lvl{margin-top:16px;} }
</style>
</head>
<body>
<div class="wrap">
  <p class="eye" id="eye">Connect Lite</p>
  <h1>Volunteer register</h1>
  <div id="app"><p class="lede">Opening the register.</p></div>
  <!-- the credit is hub-shared.js's own line (the logo, then the words, Ramy in gold; never on paper). This page had a second, plain one of its own until 17 Nov 2026. -->
</div>
<script src="hub-shared.js?v=202611192107"></script>
<script src="hub-attendance.js?v=202611192107"></script>
<script src="hub-store.js?v=202611192107"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var R = new URLSearchParams(location.search).get('r') || '';
  var A = window.hubAttendance;
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var parse = function(s){ var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  var dm = function(iso){ var d = parse(iso); return d ? d.getDate() + ' ' + MON[d.getMonth()] : iso; };
  var ymd = function(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  var fmtH = function(h){ return (Math.round(h * 100) / 100).toString().replace(/\.00$/, ''); };
  var LV = function(l){ return window.hubLevelName ? hubLevelName(l) : l; };
  function closed(line){ $('app').innerHTML = '<div class="empty"><b>This register is not open.</b><br>' + esc(line) + '</div>'; }
  if (!R) { closed('Use the link the course tutor sent you.'); return; }

  var LAST = null, SAID = '', BAD = false, ADD_OPEN = false, ASK = null, BUSY = false;
  var LEVELS = (window.HUB_LEVELS || [['A1', 'Beginner'], ['A2', 'Elementary'], ['A2+', 'Pre-intermediate'], ['B1', 'Intermediate'], ['B2', 'Upper-intermediate'], ['C1', 'Advanced']]);
  var lvOpts = function(cur, blank){ var have = LEVELS.some(function(x){ return x[0] === cur; });
    return (blank ? '<option value="">' + blank + '</option>' : '') + LEVELS.concat(cur && !have ? [[cur, cur]] : []).map(function(x){ return '<option value="' + esc(x[0]) + '"' + (x[0] === cur ? ' selected' : '') + '>' + esc(x[1] === x[0] ? x[0] : x[1] + ' (' + x[0] + ')') + '</option>'; }).join(''); };
  /* STRAIGHT TO THE STORE (17 Nov 2026, the day it went live: "center can't edit the register"). Lite's shared call
     answers a save in the browser, without sending it, when this browser has also opened a demo or the trainee view,
     and refuses one when another Lite link was opened since; both are right for a course page and wrong here, where
     the link's own key is the only thing that matters. The page then drew that empty answer as the register. This
     page's save goes to the store by itself and reads the store's own yes or no. */
  function direct(body){
    var go = function(n){
      return fetch(HubStore.url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) })
        .then(function(r){ return r.text(); })
        .then(function(t){ var j = null; try { j = JSON.parse(t); } catch (e) {}
          if (j && j.ok && j.result && Array.isArray(j.result.students)) return j.result;
          if (j && j.error) throw new Error(j.error);
          throw new Error('The store did not answer. Nothing was changed; try again in a moment.'); },
          function(){ throw new Error('Could not reach the store. Nothing was changed; check the connection and try again.'); });
    };
    return go(0);
  }
  /* one change at a time, sent to the store by the link's own key; the answer is the register again */
  function send(body, done){
    if (BUSY) return; BUSY = true; SAID = 'Saving\u2026'; BAD = false; draw(LAST);
    direct(Object.assign({ op: 'registerEdit', r: R }, body)).then(function(d){ BUSY = false; ASK = null; SAID = done; BAD = false; if (body.act === 'add') ADD_OPEN = false; draw(d); },
      function(e){ BUSY = false; SAID = (e && e.message) || 'That did not save. Try again in a moment.'; BAD = true; draw(LAST); });
  }
  function draw(d){
    LAST = d; var EDIT = !!d.canEdit;
    var TODAY = (d.course && d.course.today) || ymd(new Date());
    var tt = d.timetable || {}, cd = A.classDays(tt, d.rules), days = cd.days, perDay = cd.perDay, lessons = cd.lessons, lessonMinutes = cd.lessonMinutes;
    var hm = function(t){ var m = String(t || '').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
    var hoursPerDay = (tt.slots || []).reduce(function(n, sl){ var a = hm(sl.from), b = hm(sl.to); return a != null && b != null && b > a ? n + b - a : n; }, 0) / 60;
    var list = (d.students || []).map(function(st){ if (!st.marks) { st.marks = {}; (st.here || []).forEach(function(x){ st.marks[x] = 'present'; }); } return st; });
    if (d.course && d.course.centre) $('eye').textContent = d.course.centre;
    document.title = 'Volunteer register' + (d.course && d.course.name ? ' · ' + d.course.name : '');
    var long = new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
    var head = '<p class="lede">' + (d.course && d.course.name ? '<b>' + esc(d.course.name) + '.</b> ' : '') + 'The students who came in to be taught, and which teaching days each of them attended.</p>'
      + '<p class="asof">As the tutors have marked it, opened ' + esc(long) + '. ' + (EDIT ? 'You can add a student and move a student to another level here. Attendance is marked by the tutors.' : 'This page only shows the register; nothing can be changed from it.') + '</p>';
    var addBar = function(){ return (EDIT ? '<div class="bar"><button type="button" class="btn" id="addOpen">' + (ADD_OPEN ? 'Close' : 'Add a student') + '</button></div>' : '')
      + (SAID ? '<p class="said' + (BAD ? ' bad' : '') + '" role="status">' + esc(SAID) + '</p>' : '') + (EDIT && ADD_OPEN ? addForm() : ''); };
    var addForm = function(){ return '<form class="addbox" id="addForm"><div><label for="aName">Name</label><input id="aName" autocomplete="off" maxlength="80" required></div>'
          + '<div><label for="aLevel">Level</label><select id="aLevel">' + lvOpts('', 'Choose') + '</select></div>'
          + '<div><label for="aEmail">Email, if you have it</label><input id="aEmail" type="email" autocomplete="off" maxlength="120"></div>'
          + '<div><button type="submit" class="btn go">Add</button></div>'
          + '<p>They go on the register from today, with a page of their own. The tutors send them its link.</p></form>'; };
    if (!days.length) { $('app').innerHTML = head + addBar() + '<div class="empty">The course has not set its teaching days yet, so there is nothing to count attendance against.' + (list.length ? ' ' + list.length + (list.length === 1 ? ' student is' : ' students are') + ' on the register.' : '') + '</div>'; wire(); return; }
    if (!list.length) { $('app').innerHTML = head + addBar() + '<div class="empty">Nobody on the register yet.</div>'; wire(); return; }
    var joined = function(st){
      if (st.added) return String(st.added).slice(0, 10);
      var inv = st.invited ? String(st.invited).slice(0, 10) : '';
      if (inv && !Object.keys(st.marks || {}).some(function(x){ return x < inv; })) return inv;
      return '';
    };
    var anyBefore = false;
    var monday = function(iso){ var x = parse(iso); if (!x) return ''; x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return ymd(x); };
    var rowOf = function(st){
      /* their class's days count; a demonstration for another class keeps its square, greyed (18 Nov 2026) */
      var own = A.daysFor ? A.daysFor(cd, st.level, st.marks || {}) : days;
      var r0 = A.record(st.marks || {}, own, lessons, lessonMinutes, perDay), j = joined(st);
      var r = { hours: r0.hours, present: r0.present, partial: r0.partial, absent: r0.absent,
                days: days.map(function(x){ return r0.days.filter(function(y){ return y.date === x; })[0] || { date: x, tier: 'notours', creditedMinutes: 0 }; }) };
      if (j && j > days[0]) anyBefore = true;
      var n = own.filter(function(x){ return (!j || x >= j) && (x < TODAY || (st.marks || {})[x]); }).length;
      var ask = ASK && ASK.id === st.id ? '<div class="ask">' + (st.level
            ? 'Move <b>' + esc(st.name) + '</b> from ' + esc(LV(st.level)) + ' to <b>' + esc(LV(ASK.level)) + '</b>? Their hours at ' + esc(LV(ASK.level)) + ' start today; the hours at ' + esc(LV(st.level)) + ' stay on their record.'
            : 'Put <b>' + esc(st.name) + '</b> in ' + esc(LV(ASK.level)) + '?')
          + '<br><button type="button" class="btn go" data-yes="1">' + (st.level ? 'Move to ' : 'Put in ') + esc(LV(ASK.level)) + '</button><button type="button" class="btn" data-no="1">Cancel</button></div>' : '';
      return '<div class="who"><div><div class="nm">' + esc(st.name)
        + (EDIT && st.id ? '<select class="lvsel" data-lv="' + esc(st.id) + '" aria-label="Level for ' + esc(st.name) + '">' + lvOpts(ASK && ASK.id === st.id ? ASK.level : st.level, st.level ? '' : 'Level') + '</select>' : '')
        + (st.carried ? '<small>' + esc(st.carried) + ' h at this level before this course' + (st.carriedFrom ? ', at ' + esc(st.carriedFrom) : '') + '</small>' : '') + '</div>'
        + '<div class="segs">' + r.days.map(function(x, i){
            var past = x.date < TODAY, before = x.tier === 'absent' && x.date < j;
            var cls = x.tier === 'present' ? 'here' : x.tier === 'partial' ? 'part' : x.tier === 'notours' || before ? 'before' : past ? 'miss' : 'soon';
            var what = x.tier === 'notours' ? 'Not a class for their level' : before ? 'Before they joined' : x.tier === 'absent' && !past ? 'Still to come' : x.tier === 'absent' ? 'Not marked in the room' : A.describe(x.tier, (perDay[x.date] || {}).lessons || lessons, (perDay[x.date] || {}).lessonMinutes || lessonMinutes);
            var wk = i > 0 && monday(x.date) !== monday(r.days[i - 1].date);
            var pd = parse(x.date);
            return '<span class="seg ' + cls + (wk ? ' wk' : '') + '" title="' + esc(dm(x.date)) + ': ' + esc(what) + '" aria-label="' + esc(dm(x.date)) + ': ' + esc(what) + '">' + (pd ? pd.getDate() : '') + '</span>'; }).join('') + '</div>' + ask + '</div>'
        + '<div class="hrs"><b>' + fmtH(r.hours) + ' h</b><small>' + r.present + ' of ' + n + (n === 1 ? ' day' : ' days') + (j && j > own[0] ? ' since joining' : n < own.length ? ' so far' : '') + (r.partial ? ' · ' + r.partial + ' in part, half credit each' : '') + '</small></div></div>';
    };
    /* BY LEVEL, AND THE ONES WHO HAVE COME ON TOP (Ramy, 17 Nov 2026: "organize the sharable register link as well based
       on level"). The tutors' own register has had a tab a level since 16 Nov; the center's page is one printed sheet, so
       each level is a section, lowest first: who has come at least once, by name, then who has not come yet. */
    var cefr = function(l){ var m = String(l || '').toUpperCase().match(/\b([ABC][12])(\+?)/); return m ? m[1] + m[2] : ''; };
    var rank = function(l){ var c = cefr(l); return c ? ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'].indexOf(c.slice(0, 2)) * 2 + (c.length > 2 ? 1 : 0) : 99; };
    var came = function(st){ return Object.keys(st.marks || {}).some(function(x){ return st.marks[x] === 'present' || st.marks[x] === 'partial'; }); };
    var byName = function(a, b){ return String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' }); };
    var levels = []; list.forEach(function(st){ var k = String(st.level || '').trim(); if (levels.indexOf(k) < 0) levels.push(k); });
    levels.sort(function(a, b){ return rank(a) - rank(b) || a.localeCompare(b); });
    var sections = levels.map(function(k){
      var mine = list.filter(function(st){ return String(st.level || '').trim() === k; });
      var inn = mine.filter(came).sort(byName), out = mine.filter(function(st){ return !came(st); }).sort(byName);
      var name = k ? LV(k) + (LV(k) !== k ? ' (' + k + ')' : '') : 'No level yet';
      return '<div class="lvl"><h2>' + esc(name) + '</h2><span>' + mine.length + ' student' + (mine.length === 1 ? '' : 's') + ' · ' + inn.length + ' ' + (inn.length === 1 ? 'has' : 'have') + ' come</span></div>'
        + '<div class="reg">' + (inn.length ? '<div class="grp">Have come · ' + inn.length + '</div>' + inn.map(rowOf).join('') : '')
        + (out.length ? '<div class="grp">Not come yet · ' + out.length + '</div>' + out.map(rowOf).join('') : '') + '</div>';
    }).join('');
    var d1 = parse(days[0]), sample = function(cls, word){ return '<span><span class="seg ' + cls + '">' + (d1 ? d1.getDate() : '') + '</span>' + word + '</span>'; };
    $('app').innerHTML = head
      + '<div class="bar">' + (EDIT ? '<button type="button" class="btn" id="addOpen">' + (ADD_OPEN ? 'Close' : 'Add a student') + '</button>' : '') + '<button type="button" class="btn" id="print">Print or save as PDF</button></div>'
      + (SAID ? '<p class="said' + (BAD ? ' bad' : '') + '" role="status">' + esc(SAID) + '</p>' : '')
      + (EDIT && ADD_OPEN ? addForm() : '')
      + '<div class="key"><b>Each square is a teaching day, with its date</b>' + sample('here', 'In the room') + sample('part', 'Came for part of it') + sample('miss', 'Not marked in') + sample('soon', 'Still to come')
      + (anyBefore ? sample('before', 'Before they joined') : '') + '</div>'
      + sections
      + '<p class="legend">' + lessons + ' lesson' + (lessons === 1 ? '' : 's') + ' of ' + lessonMinutes + ' minutes a day · coming to ' + A.lessonsNeededForPresent(lessons) + ' of them counts as being in the room and credits the whole ' + fmtH(hoursPerDay) + ' hours · coming for part of a day credits half of it, ' + fmtH(hoursPerDay / 2) + ' hours · ' + (function(){ var lv = levels.filter(Boolean), dw = function(n){ return n === 1 ? ' day' : ' days'; }, full = function(k){ return A.fullHours ? A.fullHours(cd, k) : A.daysFor(cd, k, null).length * hoursPerDay; };
        if (lv.length < 2) { var one = levels.length === 1 ? (lv[0] || null) : null, n = A.daysFor(cd, one, null).length; return n + ' teaching' + dw(n) + ', ' + fmtH(full(one)) + ' h if somebody comes to all of them.'; }
        return 'if somebody comes to every teaching day: ' + lv.map(function(k){ var n = A.daysFor(cd, k, null).length; return esc(LV(k)) + ' ' + n + dw(n) + ', ' + fmtH(full(k)) + ' h'; }).join(', ') + (levels.indexOf('') > -1 ? ', no level yet ' + days.length + dw(days.length) + ', ' + fmtH(full(null)) + ' h' : '') + '.'; })() + '</p>';
    $('print').onclick = function(){ window.print(); };
    wire();
  }
  function wire(){
    if ($('addOpen')) $('addOpen').onclick = function(){ ADD_OPEN = !ADD_OPEN; SAID = ''; draw(LAST); if (ADD_OPEN && $('aName')) $('aName').focus(); };
    if ($('addForm')) $('addForm').onsubmit = function(e){ e.preventDefault();
      var name = $('aName').value.replace(/\s+/g, ' ').trim(), level = $('aLevel').value, email = $('aEmail').value.trim();
      if (name.length < 2) { $('aName').focus(); return; }
      if (!level) { SAID = 'Choose a level for ' + name + '.'; BAD = true; var keep = { n: name, e: email }; draw(LAST); $('aName').value = keep.n; $('aEmail').value = keep.e; $('aLevel').focus(); return; }
      send({ act: 'add', name: name, level: level, email: email }, name + ' is on the register, in ' + LV(level) + '.'); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-lv]'), function(el){ el.onchange = function(){
      var st = (LAST.students || []).filter(function(x){ return x.id === el.getAttribute('data-lv'); })[0]; if (!st) return;
      if (!el.value || el.value === st.level) { ASK = null; } else { ASK = { id: st.id, level: el.value }; }
      SAID = ''; draw(LAST); }; });
    var yes = document.querySelector('[data-yes]'), no = document.querySelector('[data-no]');
    if (no) no.onclick = function(){ ASK = null; draw(LAST); };
    if (yes) yes.onclick = function(){ var st = (LAST.students || []).filter(function(x){ return x.id === ASK.id; })[0]; if (!st) return;
      send({ act: 'level', id: ASK.id, level: ASK.level }, st.name + (st.level ? ' moved to ' : ' is in ') + LV(ASK.level) + (st.level ? ', from today.' : '.')); };
  }
  HubStore.call({ op: 'registerView', r: R }).then(draw, function(e){ closed((e && e.message) || 'Try the link again in a moment.'); });
})();
</script>
