<style>
  :root{
    /* the control fill, for the shared confirm modal's Cancel button */
    --line:oklch(89.5% 0.012 82); --quiet:oklch(40% 0.02 70);
    --grn:oklch(35% 0.08 155); --grn-bg:oklch(93% 0.04 155); --blu:oklch(38% 0.07 232); --blu-bg:oklch(94% 0.03 232);
    --amb:oklch(42% 0.1 78); --amb-bg:oklch(95% 0.05 85); --red:oklch(40% 0.14 25); --red-bg:oklch(95% 0.04 25);
    --purp:oklch(40% 0.1 300); --purp-bg:oklch(95% 0.03 300);
  }
  *{box-sizing:border-box;}
  /* A DOCUMENT, not a dashboard. Ramy, 1 Oct 2026: "the assessor page is not
     very well organised... make it look like a document." Twelve identical
     beige panels with twelve identical gold bars read as one long scroll and
     told you nothing about which part you were in. So: a single sheet of
     paper on the sand, generous margins, sections separated by a rule rather
     than by a box, and gold spent only where it carries meaning -- the visit,
     and a Handbook line that falls short. It is also the one screen an
     assessor takes away from a centre. */
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    padding:40px 20px 60px; display:flex; flex-direction:column; align-items:center;}
  .board{max-width:1080px; width:100%; background:var(--paper); border:1px solid var(--sand-line);
    border-radius:4px; box-shadow:0 1px 3px rgba(40,30,15,0.05), 0 12px 40px -28px rgba(40,30,15,0.5);
    padding:0 clamp(22px, 5vw, 64px) 54px;}
  /* The masthead is part of the sheet: no card inside a card. */
  .header{background:none; border-radius:0; border-top:none; border-bottom:2px solid var(--ink-warm);
    padding:40px 0 26px; text-align:center; margin:0 0 6px; box-shadow:none;}
  .header .eyebrow{margin:14px 0 0; font-family:'Instrument Sans',Karla,sans-serif; font-weight:600; font-size:10px; letter-spacing:0.22em; color:var(--grey); text-transform:uppercase;}
  .course-name{margin:6px 0 0; font-size:1.5rem; font-family:'Newsreader',Georgia,serif; font-weight:700; color:var(--ink);}
  .header p.tag{margin:8px 0 0; font-size:0.95rem; color:var(--grey);}
  .header p.access{margin:16px 0 0; font-size:0.82rem; font-weight:600; color:var(--teal);}
  /* Ramy, 20 Sep 2026: "Lite" sits on Connect's baseline, not centred against it. */
  /* The mark turns once every ninety seconds, holding still for the first ten
     of them -- the same rule the trainee home and the four documents carry.
     Ramy, 21 Sep 2026: "I still want the logo to slowly spin." It belongs on
     every screen that shows the mark: the mark is the one thing in Lite that is
     identical everywhere, and a logo that moves on one page and not the next is
     two logos. Honoured only where motion is welcome. */
  @keyframes wordmark-spin{0%,11.11%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
  .wordmark-spin{animation:wordmark-spin 90s linear infinite; transform-origin:50% 50%; transform-style:preserve-3d;}
  @media(prefers-reduced-motion:reduce){ .wordmark-spin{animation:none;} }

  .hub-pair{display:inline-flex;align-items:baseline;gap:4px;}
  .hub-word{font-family:'Instrument Sans','Karla',sans-serif;font-weight:500;font-size:10px;letter-spacing:0.24em;text-transform:uppercase;color:var(--ink);line-height:1;margin-left:2px;}
  /* Ramy, 21 Sep 2026: the credit sits at the foot, as on the trainee home.
     hub-shared hides .hub-credit under 768px because a header band has no room
     for it; the foot does, so this wins on specificity rather than !important. */
  /* The visit: the one gold object on the sheet, and the first thing read. */
  #onlineRooms .online-rooms{margin:18px 0 2px; padding:14px 16px; border:1px solid var(--gold);
    border-radius:6px; background:oklch(98.6% 0.014 84); display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  #onlineRooms .or-join.first{font-weight:700;}
  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--sand-line);
    display:flex; align-items:center; justify-content:center; gap:8px;}
  /* the mark beside the credit (Ramy, 21 Sep 2026), the header tile at 18px */
  .foot-mark{width:18px; height:18px; border-radius:4px; background:var(--ink-warm);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  /* hub-shared gives .hub-credit a 12px left margin for the header band; the
     foot spaces with gap instead, so it is zeroed here rather than with !important */
  .foot .hub-credit{display:inline; margin-left:0;}
  .howline{margin:30px 0 0; text-align:center; font-size:0.86rem; color:var(--grey);}
  @media print{ .howline{display:none;} }
  /* A section is a heading with a rule under it, the way a report is set. */
  h2.sect{font-family:'Newsreader',Georgia,serif; font-size:1.18rem; font-weight:700; color:var(--ink);
    margin:38px 0 0; padding:0 0 7px; border-bottom:1px solid var(--ink-warm);
    display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  h2.sect small, details.sec > summary small{font-family:'Instrument Sans','Karla',sans-serif; font-size:0.68rem; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; color:var(--grey); margin-left:0; text-align:right;}
  details.sec > summary{font-family:'Newsreader',Georgia,serif; font-size:1.18rem; font-weight:700; color:var(--ink);
    margin:38px 0 0; padding:0 0 7px 22px; border-bottom:1px solid var(--ink-warm); cursor:pointer; list-style:none;
    display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; position:relative;}
  details.sec > summary::-webkit-details-marker{display:none;}
  details.sec > summary::before{content:"\25B8"; position:absolute; left:2px; top:0.28em; font-size:0.8em;
    color:var(--gold-deep); transition:transform 160ms ease;}
  details.sec[open] > summary::before{transform:rotate(90deg);}
  details.sec > summary:hover{color:var(--teal);}
  @media print{ details.sec > summary::before{display:none;} details.sec > summary{padding-left:0;} }
  /* Gold edges the card, as on every other screen (Ramy, 24 Sep 2026). */
  /* No box: the sheet is the box. Rows are ruled, as on a form. */
  .panel{background:none; border:none; border-radius:0; padding:0; box-shadow:none;}
  /* The course against the Handbook. The VERB is coloured on every line --
     brick for a must, gold for a should -- so the grid reads as two kinds of
     line at a glance. Ramy, 1 Oct 2026: one card in red and the rest in white
     "doesn't make sense... maybe must will be one colour and should another".
     The card itself stays quiet until it falls short, and then it takes the
     verb's colour, which is how the one line that needs attention still
     stands out from the twenty that do not. Nothing here blocks: it is what
     an assessor asks. */
  table.mid th:not(:first-child), table.mid td:not(:first-child){text-align:center;}
  .chkgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:0 26px; padding:14px 0 4px;}
  /* On a sheet a check is a ruled entry, not a tile -- until it falls short,
     and then it is the only boxed thing on the page. */
  .chk{border:none; border-top:1px solid var(--sand-line); border-radius:0; padding:11px 0 12px; background:none;}
  .chk-h{display:flex; align-items:center; gap:7px; font-size:0.84rem; margin-bottom:4px;}
  .chk-d{font-size:0.78rem; color:var(--mut, oklch(45% 0.01 70)); line-height:1.45;}
  .chk-c{font-size:0.7rem; color:var(--mut, oklch(45% 0.01 70)); opacity:.75; margin-top:5px;}
  .verb{font-size:0.62rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:2px 6px; border-radius:999px;
        border:1px solid var(--line, oklch(85.5% 0.02 80)); color:var(--mut, oklch(45% 0.01 70));}
  .verb.must{color:var(--brick); border-color:color-mix(in oklab, var(--brick) 45%, transparent);}
  .verb.should{color:var(--gold-deep); border-color:color-mix(in oklab, var(--gold) 55%, transparent);}
  .chk.short{border:1px solid var(--gold); border-radius:6px; padding:11px 12px; margin:6px 0;}
  .chk.short:has(.verb.must){border-color:var(--brick); background:oklch(97% 0.02 30);}
  .chk.short:has(.verb.must) .verb.must{background:var(--brick); border-color:var(--brick); color:var(--paper);}
  /* ink on gold, like .btn-gold: white on gold measured 2.8:1 (1 Oct 2026) */
  .chk.short:has(.verb.should) .verb.should{background:var(--gold); border-color:var(--gold); color:var(--ink-warm);}
  .chk.unknown{border-style:dashed;}
  @media print{ .chkgrid{grid-template-columns:repeat(2,1fr);} }
  /* Orientation stated, not left to the print dialog -- see hub-record.css. */
  @page{ size:A4 portrait; margin:12mm; }
  @media print{
    body{padding:0; background:#fff;}
    .board{border:none; box-shadow:none; padding:0; max-width:none;}
    h2.sect{break-after:avoid; page-break-after:avoid;}
    .docrow, .chk, tr{break-inside:avoid; page-break-inside:avoid;}
    #onlineRooms .online-rooms{border-color:#999; background:none;}
  }
  table{width:100%; border-collapse:collapse;}
  th{text-align:left; font-size:0.68rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--grey); padding:12px 12px 8px 2px; border-bottom:1px solid var(--ink-warm);}
  td{padding:11px 12px 11px 2px; border-bottom:1px solid var(--sand-line); font-size:0.9rem; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .name{font-weight:700; color:var(--ink);}
  .sub{font-size:0.78rem; color:var(--grey);}
  .chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:var(--surface); font-size:11.5px; font-weight:500; color:var(--quiet); line-height:1.2; white-space:nowrap;}
  .chip b{font-weight:700; font-size:10px; letter-spacing:0.04em; color:var(--grey);}
  .chip.nd{background:transparent; border-color:transparent; color:var(--faint);}
  .chip.fine{background:oklch(95% 0.02 155); border-color:oklch(86% 0.04 155); color:var(--grn);}
  .chip.above{background:var(--grn-bg); border-color:oklch(80% 0.07 155); color:var(--grn); font-weight:600;}
  .chip.wait{background:var(--blu-bg); border-color:oklch(84% 0.05 232); color:var(--blu); font-weight:600;}
  .chip.work{background:var(--amb-bg); border-color:oklch(84% 0.08 78); color:var(--amb); font-weight:600;}
  .chip.wrong{background:var(--red-bg); border-color:oklch(82% 0.08 25); color:var(--red); font-weight:700;}
  .standing{display:inline-block; font-size:0.72rem; font-weight:700; letter-spacing:0.05em; padding:5px 10px; border-radius:20px; background:var(--sand); color:var(--grey);}
  .standing.tk-std{background:oklch(95% 0.02 155); color:var(--grn);}
  /* Above standard is gold, and solid. It was --grn-bg against tk-std's
     oklch(95% 0.02 155): the same hue, a chroma apart, so the one thing on
     this card an assessor is looking for could not be told from the ordinary
     case (Ramy, 27 Sep 2026: "it's all kind of different green... maybe we
     can go with above standard with the gold colour instead"). */
  /* Above standard carries no colour: gold already edges every card in
     Lite, and colour here marks what needs you (Ramy, 27 Sep 2026). */
  .standing.tk-above{background:var(--sand); color:var(--grey);}
  .standing.tk-notstd{background:var(--red-bg); color:var(--red);}

  /* The grades, and the report, unpacked. This cell used to stack the
     standing chip, two prose lines reading "Provisional: PASS" and "Final:
     PASS B · final report", the cap and the fail letter -- five things in one
     column, with the report link welded to the end of a grade. At full width
     that is what reads as crowded. Now: the grades are two small pills that
     scan as a pair, and the report is its own line under them. */
  .grades{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;}
  .gpill{display:inline-flex; align-items:baseline; gap:5px; font-size:0.7rem; font-weight:600;
    letter-spacing:0.04em; text-transform:uppercase; padding:3px 9px; border-radius:20px;
    background:var(--sand); border:1px solid var(--sand-line); color:var(--grey); white-space:nowrap;}
  .gpill b{font-size:0.78rem; font-weight:700; letter-spacing:0; text-transform:none; color:var(--ink);}
  /* The final is the one that counts, so it carries the edge. */
  .gpill.fin{border-color:color-mix(in oklab, var(--teal) 40%, transparent);
    background:color-mix(in oklab, var(--teal) 5%, var(--sand));}
  .gpill.fin b{color:var(--teal);}
  .reportlink{display:inline-block; margin-top:6px; font-size:0.76rem; font-weight:600;}
  .btn{display:inline-block; text-decoration:none; font-family:'Karla',sans-serif; font-size:0.83rem; font-weight:700; padding:8px 16px; border-radius:var(--r-control); border:1.5px solid var(--sand-line); background:var(--card); color:var(--ink); cursor:pointer;}
  .btn.ghost{border-color:var(--teal); color:var(--teal); background:none;}
  .btn.primary{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; margin:16px 0 0;}
  .tools-right{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .empty{text-align:center; padding:40px 20px; color:var(--grey);}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .back[hidden]{display:none;}
  .panel{overflow-x:auto;}
  /* candidate view */
  .cand-head{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:16px 18px;}
  .cand-head h1{font-family:'Newsreader',Georgia,serif; font-size:1.5rem; margin:0; color:var(--ink);}
  .facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 18px; padding:6px 18px 16px;}
  .fact .k{font-size:0.68rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--grey);}
  .fact .v{font-size:0.9rem; color:var(--ink); margin-top:2px;}
  .fact .v.red{color:var(--red); font-weight:600;} .fact .v.amb{color:var(--amb); font-weight:600;}
  .tp{border-bottom:1px solid var(--sand-line); padding:14px 18px;}
  .tp:last-child{border-bottom:none;}
  .tp-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .tp-row .n{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.05rem; color:var(--ink); min-width:44px;}
  .tp-row .meta{font-size:0.82rem; color:var(--grey); flex:1; min-width:200px;}
  .tp-row .meta b{color:var(--ink); font-weight:600;}
  .doc{background:var(--surface); border-radius:6px; padding:26px 28px; border:1px solid var(--sand-line); margin-top:12px;}
  .doc[hidden]{display:none;}
  .brief{padding:14px 18px; border-bottom:1px solid var(--sand-line);}
  .brief:last-child{border-bottom:none;}
  .brief h3{margin:0; font-size:1rem; color:var(--ink);}
  .brief .sub{margin:2px 0 8px;}
  .brief ul{margin:0; padding-left:18px; font-size:0.86rem; color:var(--quiet);}
  /* .panel is overflow-x:auto so a wide table can scroll on screen; in print an
     overflow box is not fragmented across pages, so everything past the first
     page was clipped away (Ramy, 21 Sep 2026: "only prints the first page"). */
  /* the candidates the assessor is steered to read in full, Handbook 14.2 */
  /* a steer from 14.2 / 15.1 ("should focus on borderline cases"): gold, not brick */
  .review{margin-top:4px; font-family:'Instrument Sans','Karla',sans-serif; font-size:9.5px; font-weight:700;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--gold);}
  /* the centre's own documents, as links */
  .docrow{display:flex; align-items:center; justify-content:space-between; gap:18px; padding:11px 2px; border-bottom:1px solid var(--sand-line);}
  .docrow:last-child{border-bottom:none;}
  .docrow span{font-size:0.9rem;}
  /* The Open links had no colour of their own, so the browser supplied pure
     blue and an underline -- the only thing on the pack not in the palette
     (Ramy, 24 Sep 2026). Teal, like every other link here, and 44px on a
     phone. */
  .docrow a{font-family:'Karla',sans-serif; font-size:0.85rem; font-weight:700;
    color:var(--teal); text-decoration:underline; text-decoration-color:var(--gold);
    text-underline-offset:4px; white-space:nowrap;}
  .docrow a:hover{color:var(--ink-warm);}
  @media(max-width:560px){ .docrow a{min-height:44px; display:inline-flex; align-items:center;} }
  .tpmark{margin:0 0 12px; font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:700;
    letter-spacing:0.12em; text-transform:uppercase; color:var(--grey);}
  @media print{ .back,.toolbar,#hubSync{display:none !important;} body{background:#fff; padding:0;} .doc[hidden]{display:block;}
    .panel{overflow:visible !important;} }
</style>

<script type="text/x-hub-app">
const T = window.HubTracker;
const $ = id => document.getElementById(id);
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function rec(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function when(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
/* The date at the front of the string, read as written rather than converted.
   The store stamps the assessor expiry at 23:59:59 of its own day and sends it
   as UTC, so reading it as an instant moved it to the next day for anyone east
   of the store -- the same link then said 13 November when the page worked the
   date out itself and 14 November when the store answered (found walking the
   assessor role, 21 Sep 2026). A date named to a person is a day, not a moment. */
function longDate(iso){
  const m = String(iso == null ? '' : iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  const d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
}

const MODE = window.HubMode;
const params = new URLSearchParams(location.search);
const WHO = params.get('trainee') || '';
const SETTINGS = rec('connect_course_settings') || {};
/* The rooms an online course teaches in: the assessor joins the teaching
   practice from here on the day (Ramy, 28 Sep 2026). Print drops it. */
/* What and when, beside the door. The assessment date is the centre's

   and "must" is not (Ramy, 29 Sep 2026). Nothing here blocks anything: it is

function courseChecks(){
  const out = [];
  const say = (verb, label, state, detail, cite) => out.push({ verb, label, state, detail, cite });
  /* Contact hours: the timetable can now work this out, because it knows the
     shape of a day and how many days there are. Before the timetable existed
     this was a number somebody typed, and on C/18 nobody had (29 Sep 2026).
     Breaks and lunch are not contact; everything else on the day is. The
     typed value still wins when it is set, because a centre may count
     differently and the number belongs to them -- but when the two disagree
     the check says so, rather than quietly preferring one. */
  const tt = rec('connect_timetable_v1') || null;
  const fromTimetable = (function(){
    if (!tt || !tt.days || !tt.days.length || !tt.slots || !tt.slots.length) return null;
    const mins = tt.slots.reduce((n, sl) => {
      if (sl.kind === 'break') return n;
      const a = String(sl.from||'').match(/^(\d{1,2}):(\d{2})/), b = String(sl.to||'').match(/^(\d{1,2}):(\d{2})/);
      if (!a || !b) return n;
      const d = (+b[1]*60 + +b[2]) - (+a[1]*60 + +a[2]);
      return d > 0 ? n + d : n;
    }, 0);
    if (!mins) return null;
    return { perDay: mins, days: tt.days.length, hours: Math.round(mins * tt.days.length / 60) };
  })();
  const hours = parseInt(SETTINGS.totalHours, 10) || 0;
  const shown = hours || (fromTimetable ? fromTimetable.hours : 0);
  const disagree = hours && fromTimetable && Math.abs(hours - fromTimetable.hours) > 2;
  say('must', 'Course hours', !shown ? 'unknown' : shown >= 120 ? 'met' : 'short',
      !shown ? 'not set, and no timetable to work it out from'
        : hours && fromTimetable
          ? (disagree ? hours + ' contact hours set; the timetable comes to ' + fromTimetable.hours
                      : hours + ' contact hours, and the timetable agrees')
        : hours ? hours + ' contact hours'
        : fromTimetable.hours + ' contact hours, from the timetable (' + fromTimetable.days + ' days)',

  /* Two things a timetable makes checkable that nothing else could: a
     candidate teaches once a day, and a class takes no more than three hours
     of teaching practice in a day (Handbook 9.1.1 and §26). Both are about
     the SHAPE of the day, so before the timetable there was nothing to read. */
  if (tt && tt.slots && tt.slots.length) {
    const tpSlots = tt.slots.filter(sl => sl.kind === 'tp');
    const tpMins = tpSlots.reduce((n, sl) => {
      const a = String(sl.from||'').match(/^(\d{1,2}):(\d{2})/), b = String(sl.to||'').match(/^(\d{1,2}):(\d{2})/);
      if (!a || !b) return n;
      const d = (+b[1]*60 + +b[2]) - (+a[1]*60 + +a[2]);
      return d > 0 ? n + d : n;

       change any of it, so this reads the teaching sets rather than trusting
       the shape. A set larger than the number of lessons means somebody has
       to teach twice, or somebody does not teach. */
    const R = window.hubRotation;
    if (R && tpSlots.length) {
      const sizes = {};
      const by = {};
      PEOPLE.forEach(t => { const g = String(t.group||''); (by[g] = by[g] || []).push({ token: t.id || t.token, name: t.name }); });
      let worst = 0, which = '';
      Object.keys(by).forEach(g => {
        R.setsFor(by[g]).forEach(set => { if (set.length > worst) { worst = set.length; which = 'Group ' + (g || '—'); } });
      });
      if (worst) say('must', 'Once a day each', worst <= tpSlots.length ? 'met' : 'short',
          worst <= tpSlots.length
            ? tpSlots.length + ' lessons a day, ' + worst + ' teaching — each candidate teaches once'
            : which + ' has ' + worst + ' teaching on a day with ' + tpSlots.length + ' lesson' + (tpSlots.length===1?'':'s'),
          '§26 — a candidate teaches on no more than one occasion a day');
    }
  }
  say('should', 'Teaching practices each', TP_TOTAL >= 8 ? 'met' : 'short',
      TP_TOTAL + ' per candidate', '9.1.2 — a minimum of eight occasions');

  /* Six hours, two levels one below intermediate, 40 minutes twice, never over
     an hour -- all read off the feedback sheets the tutors already filled in. */
  const BELOW = /^(a0|a1|a2|beginner|elementary|pre-int|pre int|pre-intermediate)/i;
  const perCand = PEOPLE.map(tr => {

      if (m > 0) { mins += m; if (m > 60) over60++; if (m >= 40) atLeast40++; }
      const lv = String(f.fLevel || '').trim();
      if (lv) { levels.add(lv.toLowerCase()); if (BELOW.test(lv)) below = true; }
    });
    return { name: tr.name, mins, over60, atLeast40, levels: levels.size, below, taught: Object.keys(hist).length };
  }).filter(c => c.taught);
  const shortOf = (pred) => perCand.filter(pred).map(c => c.name);
  if (perCand.length) {
    /* A candidate with no minutes on any sheet is not "at six hours"; they are
       unknown, and the line says so rather than affirming a must (second
       audit, 29 Sep 2026: the old guard skipped them and read "met"). */
    const noSix = shortOf(c => c.mins && c.mins < 360), noMins = shortOf(c => !c.mins);
    say('must', 'Six hours of assessed teaching practice', noSix.length ? 'short' : noMins.length ? 'unknown' : 'met',
        noSix.length ? noSix.length + ' under six hours: ' + noSix.slice(0, 3).join(', ') + (noSix.length > 3 ? '…' : '')
          : noMins.length ? noMins.length + ' with no lesson lengths recorded yet' : 'every candidate at six hours or more',

    const oneLevel = shortOf(c => c.levels < 2);
    say('should', 'Two significantly different levels', oneLevel.length ? 'short' : 'met',
        oneLevel.length ? oneLevel.length + ' taught at one level only' : 'every candidate at two levels or more',
        '9.1.2 — at least two hours at two significantly different levels, one below intermediate');
    const noBelow = shortOf(c => !c.below);

    if (short40.length) say('should', 'Forty minutes, at least twice', 'short',
        short40.length + ' with fewer than two lessons of 40 minutes or more', '9.1.2 — a minimum of 40 minutes at least twice');
    const long = shortOf(c => c.over60 > 0);
    if (long.length) say('should', 'Never longer than an hour', 'short',
        long.length + ' with a lesson over 60 minutes', '9.1.2 — never longer than for one hour');

      '7.1 — groups must consist of 4–6 candidates');

}

    <h2 class="sect">Double-marking record <small>Handbook 9.2.3: ${sample} of each assignment for ${n} candidate${n===1?'':'s'}</small></h2>
    <div class="panel">${dm.length ? `<table><tr><th>Candidate</th><th>Assignment</th><th>First marker</th><th>Second marker</th><th>Double-marked</th><th>Outcome</th></tr>${dm.join('')}</table>` : '<div class="empty">Nothing has been double-marked yet. The quota above says how many of each assignment need to be.</div>'}</div>
    ${volunteerStudents()}
    ${courseDocuments()}
    <!-- Last, because nobody opens a pack to read the briefs (Ramy, 1 Oct
         2026: "no one cares about the assignment briefs, put them at the
         bottom"). They stay because 14.1 asks what the candidates were set. -->
    <h2 class="sect">Assignment briefs <small>as the centre set them, in the centre’s order</small></h2>
    <div class="panel">${briefs()}</div>`;
  if (window.hubStackTables) hubStackTables($('app'));
  foldSections($('app'));
}

/* Handbook 14.1's list, for the parts Connect Lite does not hold itself: the
   timetable, the registers, the agreement, the applications, the previous
   report, the action plan. The centre pastes a link for each on Course admin
   and they appear here, so the assessor's one link reaches everything --
   which is what 14.1 asks for ("a maximum of two links which give Cambridge
   English and the assessor access to all course documentation").
   Nothing is invented: a box the centre left empty is simply not a row. */
const DOC_LABELS = [
  /* Ramy, 1 Oct 2026: "the assessment timetable is way at the bottom -- it
     should be the first one, and then the course timetable, and then the
     rest." It is the assessor's own day; it leads. */
  ['docAssessTimetable', 'Assessment timetable'],
  ['docTimetable',    'Course timetable'],
  ['docTpSchedule',   'Teaching practice schedule'],
  ['docRegisters',    'Attendance registers'],
  ['docAgreement',    'Candidate agreement'],
  /* The AI and plagiarism declaration the centre issues with the first
     assignment -- "Your own work" (Ramy, 24 Sep 2026). It is not on 14.1's
     list by that name, but it is what the candidates signed up to and the
     assignment screen's own declaration quotes it, so an assessor reading a
     submission should be able to open the sheet behind it.

     The BLANK sheet, not the signed copies. Ramy: "it doesn't have to be the
     signed one -- if you want to see the signed ones, you can go and check."
     Each candidate's own declaration is already in their submission, on the
     assignment record in this pack. */
  ['docOwnWork',      "Your own work \u2014 the AI and plagiarism declaration, as issued"],
  /* Handbook 14.1: "Candidate descriptions - individual descriptions of the
     candidates, with photos if possible. Candidates should be informed by the
     centre that this information will be shared." It is on 14.1's list and
     Lite had no box for it (found by reading 14.1 line by line, 27 Sep 2026).
     The consent is the centre's to obtain, which is why the label says so. */
  ['docDescriptions', 'Candidate descriptions \u2014 candidates told these are shared'],
  ['docApplications', 'Applications and interviews'],
  ['docPrevReport',   "Previous assessor's report"],
  ['docActionPlan',   'Action plan agreed with Cambridge'],
  /* Added 27 Sep 2026 -- 14.1 asks for all three and Lite had no box for any
     of them. The map is only for a face-to-face visit where the assessor is
     not local, so it is the one that is legitimately blank most of the time. */
  ['docSampleReport',    'Sample end-of-course report'],
  ['docMap',             'Map and accommodation'],
];
/* NO "LESSON PLANS FOR THE DAY" SECTION, on purpose.

   Handbook 14.1 asks the centre to make available "lesson plans for candidates
   teaching in teaching practice on the day of the assessment". A centre working
   from folders has to single those out, because the assessor cannot see the
   rest. Lite is not in that position: EVERY plan of EVERY candidate is already
   open to the assessor through their portfolio, on any day. Filtering to one
   day would show them less than they are entitled to, not more.

   It was built as a day-filtered list and cost two rounds of bugs — the data
   said twelve candidates taught on one day, then six after the plans were
   moved, then twelve again because a taught lesson keeps its date in a second
   place. Ramy, 27 Sep 2026: "it doesn't have to say who's teaching today ...
   they will click on them and they will see their TPs, whether they're
   teaching that day or not."

   So the pack is the candidates: the ones the centre chose at the top, and
   everybody else under them, each opening the whole of their work. */

/* THE VOLUNTEER STUDENTS. Handbook 14.1 puts the attendance registers in the
   pack, and this is the register Lite keeps itself, so it belongs here rather
   than behind a pasted link. It answers the question an assessor actually has
   about teaching practice -- were there real learners, at the levels the
   course claims, often enough to teach -- at a glance, without opening a
   spreadsheet. Names are shown because a register without them is not a
   register; the links that reach each student's page are NOT, because an
   assessor has no business opening somebody's own page. */
function volunteerStudents(){
  const reg = rec('connect_volunteers_v1') || {};
  const list = (reg.students || []).filter(s => s && s.name);
  if (!list.length) return '';
  const tt = rec('connect_timetable_v1') || {};
  const A = window.hubAttendance;
  const tpSlots = (tt.slots || []).filter(sl => sl.kind === 'tp');
  const mins = sl => { const a = String(sl.from||'').match(/^(\d{1,2}):(\d{2})/), b = String(sl.to||'').match(/^(\d{1,2}):(\d{2})/); if (!a||!b) return 0; const d = (+b[1]*60 + +b[2]) - (+a[1]*60 + +a[2]); return d > 0 ? d : 0; };
  const lessonMin = tpSlots.length ? Math.round(tpSlots.reduce((n, sl) => n + mins(sl), 0) / tpSlots.length) : 0;
  const days = (tt.days || []).filter(d => d.tp).map(d => d.date).sort();
  const fmtH = h => (Math.round(h * 100) / 100).toString().replace(/\.00$/, '');

  const rows = list.map(st => {
    const r = A ? A.record(st.marks || (st.here || []).reduce((m,d) => { m[d]='present'; return m; }, {}), days, tpSlots.length, lessonMin)
                : { hours: 0, present: 0, partial: 0 };
    return { st, r };
  }).sort((a, b) => b.r.hours - a.r.hours);

  /* The levels the volunteers are, which is the claim the timetable makes
     about what is being taught. A level nobody has been given reads as blank
     rather than as a guess. */
  const levels = {};
  list.forEach(st => { const l = String(st.level || '').trim(); if (l) levels[l] = (levels[l] || 0) + 1; });
  const levelLine = Object.keys(levels).sort().map(l => l + ' (' + levels[l] + ')').join(', ');
  const attended = rows.filter(x => x.r.present > 0).length;

  return `<h2 class="sect">Volunteer students <small>Handbook 14.1 &middot; the centre's own register, ${list.length} on it</small></h2>
    <div class="panel">
      <div class="docrow"><span>${list.length} student${list.length===1?'':'s'} on the register, ${attended} with attendance recorded${levelLine ? ' &middot; levels: ' + esc(levelLine) : ''}</span><span>${days.length} teaching day${days.length===1?'':'s'}</span></div>
      <!-- Ramy, 1 Oct 2026: "the numbers should sit in the middle of the
           headline" -- a figure parked at the left edge of a wide column has
           nothing to do with the word above it. Every column but the name is
           centred, heading and figure together. -->
      <table class="mid"><tr><th>Student</th><th>Level</th><th>Classes attended</th><th>Part of a class</th><th>Hours</th></tr>
      ${rows.map(({st, r}) => `<tr><td>${esc(st.name)}</td><td>${esc(st.level || '')}</td><td>${r.present} of ${days.length}</td><td>${r.partial || ''}</td><td>${fmtH(r.hours)}</td></tr>`).join('')}
      </table>
    </div>`;
}

/* Ramy, 1 Oct 2026: "most of this stuff should be collapsible." A pack is a
   dozen sections and an assessor needs three of them open. Each heading and
   the block under it become one <details>: the Handbook grid and the two
   candidate lists open, the reference sections closed until asked for. Done to
   the rendered page rather than to a dozen templates, so nothing about what is
   on the page changes -- only whether it is unfolded. */
/* Matched against the TITLE only -- the Handbook reference in the small print
   sits on half the sections, and matching the whole heading left everything
   open. */
const OPEN_SECTIONS = /^(The course against the Handbook|Candidates you are observing|Every other candidate|Candidate portfolios|The whole cohort)/i;
function foldSections(root){
  if (!root) return;
  const heads = [...root.querySelectorAll('h2.sect')];
  heads.forEach(h => {
    const body = [];
    let el = h.nextElementSibling;
    while (el && el.tagName !== 'H2') { body.push(el); el = el.nextElementSibling; }
    if (!body.length) return;
    const d = document.createElement('details');
    d.className = 'sec';
    const title = (h.childNodes[0] && h.childNodes[0].textContent || h.textContent).trim();
    if (OPEN_SECTIONS.test(title)) d.open = true;
    const sum = document.createElement('summary');
    sum.innerHTML = h.innerHTML;
    h.replaceWith(d);
    d.appendChild(sum);
    body.forEach(b => d.appendChild(b));
  });
}

function courseDocuments(){
  const docs = (SETTINGS && SETTINGS.docs) || {};
  /* The assessment timetable opens from the pill at the top of the page, so
     the list does not repeat it -- Ramy, 1 Oct 2026: "it's one or the other,
     and since we're going with the top one, lose this one". It comes back the
     moment the centre has NOT provided one, because 14.1 asks for it and a
     missing document has to be visible somewhere. */
  const hasVisitTimetable = !!String(docs.docAssessTimetable || '').trim();
  /* Every document 14.1 asks for, whether or not the centre has provided it.
     This used to render only what was filled in, and to disappear entirely
     when nothing was -- so a pack with no documents looked like a pack with
     no such requirement, and an assessor had no way to tell "the centre has
     not sent the registers" from "Lite does not do registers" (Ramy, 27 Sep
     2026: "where is the rest of the pack?"). Connect keeps its eight
     compiled-in defaults on screen for the same reason. A missing row says
     so plainly; it is the centre's to fill, not the assessor's to chase. */
  /* Only what the centre has actually provided. Showing every expected
     document with "not provided" beside it was tried on 27 Sep 2026 and
     rejected: an empty section hiding itself is right, because the pack is
     what the centre HAS sent, not a checklist of what it has not (Ramy: "if
     nothing is filled in, then it makes sense that it will hide itself").
     The count says how many, so a half-filled pack still reads as partial. */
  const provided = DOC_LABELS.filter(([k]) => docs[k]).length;
  const rows = DOC_LABELS.filter(([k]) => docs[k] && !(k === 'docAssessTimetable' && hasVisitTimetable)).map(([k,label]) =>
    `<div class="docrow"><span>${label}</span><a href="${esc(docs[k])}" target="_blank" rel="noopener noreferrer">Open</a></div>`);
  if (!rows.length) return '';
  return `<h2 class="sect">Course documents <small>Handbook 14.1 &middot; ${provided} of ${DOC_LABELS.length} provided by the centre</small></h2>
    <div class="panel">${rows.join('')}</div>`;
}

// ---- one candidate ---------------------------------------------------------------
function tpBlock(tr, n, c){
  const hist = T.tpHistory(tr); const fb = hist[n]; const f = fb && fb.state && fb.state.f;
  const cur = tr.tp && tr.tp.feedback; const isCur = cur && T.tpNumberOf(cur)===n && cur.status!=='returned';
  /* The live plan and which TP it belongs to, read once here because three
     things below want them: the in-progress line, the not-yet-taught line, and
     the plan document itself.
     Which TP it is used to demand the literal "TP" before the digit, so a
     candidate whose tutor typed "4" rather than "TP4" lost the "plan turned in"
     marker -- the sixth place tonight where a number typed freely was read by
     one spelling only. First number wins, as on the dashboard and the home. */
  const plan = tr.tp && tr.tp.plan;
  const pm = plan && String(plan.label || (plan.state && plan.state.meta && plan.state.meta.tp) || '').match(/\d+/);
  const planN = pm ? parseInt(pm[0], 10) : 0;
  let meta, right='';
  if (fb) {
    const g = G_STATE[c['tp'+n]];
    meta = `<span class="chip ${g?g.cls:'wait'}">${g?g.t:'returned'}</span> <b>${esc(c['tp'+n+'_aim'] || (f && f.fMain) || '')}</b>${f && f.fTutor ? ' · tutor ' + esc(f.fTutor) : ''}${f && f.fDate ? ' · taught ' + esc(niceDate(f.fDate)) : ''}${fb.returnedAt ? ' · returned ' + esc(when(fb.returnedAt)) : ''}`;
    right = fb.docHTML ? `<button class="btn ghost" type="button" data-doc="tp${n}">Show the document</button>` : '<span class="sub">no document stored</span>';
  } else if (isCur) {
    const se = tr.tp && tr.tp.selfeval;
    const bits = [plan && plan.status==='turned_in' ? 'plan turned in' : plan ? 'plan in draft' : 'no plan yet', se && se.status==='turned_in' ? 'self-evaluation in' : 'self-evaluation not yet in', 'feedback being written'];
    meta = `<span class="chip wait">in progress</span> ${esc(bits.join(' · '))}`;
  } else {
    if (plan && planN===n) meta = `<span class="chip wait">${plan.status==='turned_in' ? 'plan turned in' : 'plan in draft'}</span> not yet taught`;
    else meta = `<span class="chip nd">not yet taught</span>`;
  }
  /* Handbook 14.1 asks the centre for "lesson plans for candidates teaching in
     teaching practice on the day of the assessment". Once a TP has been taught
     its plan is already inside the returned feedback document; the one being
     taught on the day is not, and this page could only report that a plan
     existed. The turned-in plan now prints with the rest. */
  const planDoc = (!fb && plan && planN === n && plan.status === 'turned_in' && plan.docHTML)
    ? `<div class="doc" id="doc-plan${n}" hidden><p class="tpmark">Teaching practice ${n} — the plan, as turned in. Not taught yet.</p>${plan.docHTML}</div>` : '';
  return `<div class="tp" id="tp${n}"><div class="tp-row"><span class="n">TP${n}</span><span class="meta"><span class="sub">${STAGE_OF(n)}</span><br>${meta}</span>${right}</div>${fb && fb.docHTML ? `<div class="doc" id="doc-tp${n}" hidden>${fb.docHTML}</div>` : ''}${planDoc}</div>`;
}
function assignmentBlock(tr, k){
  const w = WORDING && WORDING[k]; const sub = (tr.assignments||{})[k] || {}; const st = T.assignmentState(sub); const a = A_STATE[st.code] || A_STATE[''];
  const m = sub.markers || {};
  const trail = [];
  if (sub.sub1At) trail.push('submitted ' + when(sub.sub1At));
  if (sub.marked1At) trail.push('marked ' + when(sub.marked1At) + (m.first ? ' by ' + m.first : ''));
  if (sub.sub2At) trail.push('resubmitted ' + when(sub.sub2At));
  if (sub.marked2At) trail.push('resubmission marked ' + when(sub.marked2At));
  const door = ['PASS','RES','FAIL','FAILRES'].includes(st.code) ? `<a class="btn ghost" href="11_assignment_record.html?trainee=${encodeURIComponent(tr.id)}&a=${k}">Open the marked record</a>` : '';
  return `<div class="tp"><div class="tp-row"><span class="n">${esc(k.toUpperCase())}</span><span class="meta"><span class="sub">${esc(w ? w.title : '')}</span><br><span class="chip ${a.cls}">${a.t}</span> ${st.round ? esc(st.round===2 ? 'second submission' : 'first submission') : 'nothing submitted'}${m.second ? ' · double-marked by ' + esc(m.second) : ''}${trail.length ? ' · ' + esc(trail.join(' · ')) : ''}</span>${door}</div></div>`;
}
/* Handbook 12.1.1: the observation write-ups are portfolio evidence. The
   filmed and live sheets are turned in and dated; the peer sheets are the
   candidate's own notes and are only counted. The sheets themselves open on
   their own page, read-only under this link. */
function observationBlock(tr){
  const T0 = window.CONNECT_HUB_OBSERVATION_DEFAULTS || { peer:[], filmed:[], live:[] };
  const ow = rec('connect_observation_wording_v1');
  const tasks = (ow && ow.peer) ? ow : T0;
  const w = tr.observations || {};
  const turned = list => list.filter(t => w[t.id] && w[t.id].turnedInAt).length;
  const peerStarted = tasks.peer.reduce((n,t) => n + ['a','b'].filter(sit => { const r = w[t.id + '#' + sit]; return r && Object.values(r.a||{}).some(v => String(v||'').trim()); }).length, 0);
  const filmed = turned(tasks.filmed), live = turned(tasks.live);
  const chip = (n, of) => `<span class="chip ${n >= of ? 'fine' : n ? 'wait' : 'nd'}">${n} of ${of}</span>`;
  const rows = [
    /* hours, not sheets: 11.2's six is six HOURS, and the 10.1 notes carry
       Cambridge's own verbs (second audit, 29 Sep 2026) */
    ['Observation hours', (function(){ try { const h = window.hubObservationHours(w); const t = Math.round((h.totalMinutes / 60) * 10) / 10;
        return chip(t, 6) + ' hours (' + Math.round(h.filmed.minutes / 60 * 10) / 10 + ' filmed, ' + Math.round(h.live.minutes / 60 * 10) / 10 + ' live)' + ((h.notes || []).length ? ' \u2014 ' + h.notes.join('; ') : ''); } catch (e) { return '\u2014'; } })()],
    ['Filmed lessons', chip(filmed, tasks.filmed.length) + ' turned in'],
    ['Live demonstration lessons', chip(live, tasks.live.length) + ' turned in'],
    ['Peer observation notes', chip(peerStarted, tasks.peer.length * 2) + ' written']
  ];
  return rows.map(([k,v]) => `<div class="tp"><div class="tp-row"><span class="n">${k}</span><span class="meta">${v}</span></div></div>`).join('') +
    `<div class="tp"><div class="tp-row"><span class="n"></span><span class="meta"></span><a class="btn ghost" href="18_observation_tasks.html?trainee=${encodeURIComponent(tr.id)}">Open the sheets</a></div></div>`;
}
/* The CELTA 5 Record Booklet: where each stage stands, and the door. */
function celta5Block(tr){
  const c = tr.celta5 || {}, t = tr.celta5t || {}; const conf = c.confirms || {};
  const sig = s => s && s.at ? '<span class="chip fine">signed</span>' : '<span class="chip nd">not signed</span>';
  const stage = (n, ret, signed, sub) => `<div class="tp"><div class="tp-row"><span class="n">Stage ${n}</span><span class="meta">${ret ? '<span class="chip fine">returned</span>' : sub ? '<span class="chip wait">with the tutor</span>' : '<span class="chip nd">open</span>'} ${sig(signed)}</span></div></div>`;
  return `<div class="tp"><div class="tp-row"><span class="n">Confirmations</span><span class="meta">portfolio ${sig(conf.portfolio)} · appeals ${sig(conf.appeals)}</span></div></div>`
    + stage(1, t.stage1 && t.stage1.returnedAt, c.stage1 && c.stage1.signed) + stage(2, t.stage2 && t.stage2.returnedAt, c.stage2 && c.stage2.signed, c.stage2 && c.stage2.submittedAt) + stage(3, t.stage3 && t.stage3.returnedAt, c.stage3 && c.stage3.signed)
    + `<div class="tp"><div class="tp-row"><span class="n">Final declaration</span><span class="meta">candidate ${sig(c.final && c.final.signed)} · tutor ${sig(t.final && t.final.signed)}</span></div></div>`
    + `<div class="tp"><div class="tp-row"><span class="n"></span><span class="meta"></span><a class="btn ghost" href="20_celta5.html?trainee=${encodeURIComponent(tr.id)}">Open the CELTA 5</a></div></div>`;
}
function renderOne(tr){
  const c = T.recordFor(tr), r = T.readCandidate(c), chip = T.STATE_CHIP[r.state], man = tr.tracker || {};
  $('backLink').hidden = false;
  $('toolbar').innerHTML = `<a class="btn ghost" href="7_candidate_tracker.html">Candidate tracker</a>${appianBtn('ghost')}<button class="btn-print" type="button" onclick="window.print()">Print / Save as PDF</button>`;
  const verdict = v => v==='NOTSTD' ? 'not to standard' : v==='STD' ? 'to standard' : v==='ABOVE' ? 'above standard' : 'not held';
  const facts = [
    ['Standing', chip.text.charAt(0)+chip.text.slice(1).toLowerCase() + (r.from ? ' — from ' + r.from : ''), r.state==='notstd' ? 'red' : ''],
    ['Provisional grade', (man.grades && man.grades.provisional) || 'not set', man.grades && man.grades.provisional==='FAIL' ? 'red' : ''],
    ['Final grade', (man.grades && man.grades.final) || 'not set', man.grades && man.grades.final==='FAIL' ? 'red' : ''],
    ['Grade cap', r.ceiling ? r.ceiling.replace('SRT','LSRT') : 'none', r.ceiling ? 'amb' : ''],
    ['Stage 1 record', man.stage1 ? 'done' : 'not yet', ''],
    ['Stage 2 tutorial', verdict(man.stage2), man.stage2==='NOTSTD' ? 'red' : ''],
    ['Stage 3 tutorial', verdict(man.stage3), man.stage3==='NOTSTD' ? 'red' : ''],
    ['Fail letter', man.failLetter ? 'issued ' + man.failLetter : 'not issued', man.failLetter ? 'red' : ''],
    ['Withdrawn', man.withdrawn ? 'yes' : 'no', man.withdrawn ? 'red' : '']
  ];
  $('app').innerHTML = `
    <div class="panel">
      <div class="cand-head"><div style="display:flex;align-items:center;gap:12px;"><span class="avi avi-cand" style="width:40px;height:40px;font-size:0.9rem;border-radius:9px;">${esc(hubInitials(tr.name))}</span><div><h1>${esc(tr.name)}</h1><div class="sub">${esc(tr.group ? 'Group ' + tr.group : '')}</div></div></div><span class="standing ${chip.cls}">${esc(chip.text)}</span></div>
      <div class="facts">${facts.map(f=>`<div class="fact"><div class="k">${f[0]}</div><div class="v ${f[2]}">${esc(f[1])}</div></div>`).join('')}</div>
    </div>
    <h2 class="sect">Teaching practice <small>the document the candidate received, as returned</small></h2>
    <div class="panel">${Array.from({length:TP_TOTAL},(_,i)=>i+1).map(n=>tpBlock(tr, n, c)).join('')}</div>
    <h2 class="sect">Assignments <small>in the centre’s order</small></h2>
    <div class="panel">${ORDER.filter(k => k!=='a5' || a5InPlay(tr.assignments||{})).map(k=>assignmentBlock(tr, k)).join('')}</div>
    <h2 class="sect">Observations <small>the sheets, as the candidate wrote them</small></h2>
    <div class="panel">${observationBlock(tr)}</div>
    <h2 class="sect">CELTA 5 <small>the record booklet</small></h2>
    <div class="panel">${celta5Block(tr)}</div>
    ${(tr.links || []).filter(l => l && l.url).length ? `<h2 class="sect">Private links <small>given to this candidate alone</small></h2>
    <div class="panel">${(tr.links || []).filter(l => l && l.url).map(l => `<div class="tp"><div class="tp-row"><span class="n">${esc(l.label || l.url)}</span><span class="meta"></span><a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">Open</a></div></div>`).join('')}</div>` : ''}
    ${(tr.staffLinks || []).filter(l => l && l.url).length ? `<h2 class="sect">Course files <small>application, interview notes, pre-course task \u2014 for the tutors and the assessor; the candidate does not see these</small></h2>
    <div class="panel">${(tr.staffLinks || []).filter(l => l && l.url).map(l => `<div class="tp"><div class="tp-row"><span class="n">${esc(l.label || l.url)}</span><span class="meta"></span><a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">Open</a></div></div>`).join('')}</div>` : ''}`;
  /* The candidate page carries the stored documents, whose plan tables stack
     the same way (24 Sep 2026). */
  if (window.hubStackTables) hubStackTables($('app'));
  $('app').addEventListener('click', e => {
    const b = e.target.closest('[data-doc]'); if (!b) return;
    const d = $('doc-' + b.dataset.doc); if (!d) return;
    d.hidden = !d.hidden; b.textContent = d.hidden ? 'Show the document' : 'Hide the document';
  });
  if (location.hash && /^#tp\d$/.test(location.hash)) { const b = document.querySelector(`[data-doc="${location.hash.slice(1)}"]`); if (b) b.click(); const el = $(location.hash.slice(1)); if (el) hubScrollIntoView(el, 'start'); }
}

if (MODE !== 'assessor' && MODE !== 'tutor') {
  $('app').innerHTML = '<div class="panel"><div class="empty">Nothing to show — this page needs the assessor link (or the tutor link) to read the course.</div></div>';
} else if (WHO) {
  const tr = roster.trainees[WHO];
  if (tr) renderOne(tr); else $('app').innerHTML = '<div class="panel"><div class="empty">No candidate with that link on the course.</div></div>';
} else renderList();
</script>
