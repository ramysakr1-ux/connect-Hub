  Connect Lite — assessor pack
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 20 Sep 2026: "build the assessor link". The third link, read-only:
  everything the Hub holds for the course, laid out the way an assessor reads
  it on the visit day -- candidates first, then the double-marking record and
  the briefs. Nothing on this page, or on the pages it opens, can be changed
  from the assessor's link (hub-sync.js drops every write in assessor mode).
-->

<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(98.8% 0.006 85); --sand-line:oklch(85.5% 0.02 80);
    --paper:oklch(99.5% 0.004 90); --surface:oklch(95.2% 0.018 84);
    /* the control fill, for the shared confirm modal's Cancel button */
    --box:oklch(91.2% 0.03 80); --card:oklch(95.2% 0.018 84); --ink:oklch(23.5% 0.017 65);
    --terracotta:oklch(37.5% 0.058 195); --teal:oklch(37.5% 0.058 195); --brick:oklch(45% 0.15 27);
    --grey:oklch(51% 0.017 70); --gold:oklch(63% 0.096 72); --gold-lifted:oklch(70% 0.12 72); --ink-warm:oklch(30% 0.042 58);
    --line:oklch(89.5% 0.012 82); --quiet:oklch(40% 0.02 70); --faint:oklch(75% 0.012 80);
    --grn:oklch(35% 0.08 155); --grn-bg:oklch(93% 0.04 155); --blu:oklch(38% 0.07 232); --blu-bg:oklch(94% 0.03 232);
    --amb:oklch(42% 0.1 78); --amb-bg:oklch(95% 0.05 85); --red:oklch(40% 0.14 25); --red-bg:oklch(95% 0.04 25);
    --purp:oklch(40% 0.1 300); --purp-bg:oklch(95% 0.03 300);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    padding:40px 20px 60px; display:flex; flex-direction:column; align-items:center;}
  .board{max-width:1080px; width:100%;}
  .header{background:var(--card); border-radius:10px; border-top:3px solid var(--terracotta);
    padding:36px 26px 30px; text-align:center; margin-bottom:22px; box-shadow:0 1px 2px rgba(0,0,0,0.03);}
  .header .eyebrow{margin:14px 0 0; font-family:'Instrument Sans',Karla,sans-serif; font-weight:600; font-size:10px; letter-spacing:0.22em; color:var(--grey); text-transform:uppercase;}
  .course-name{margin:6px 0 0; font-size:1.5rem; font-family:'Newsreader',Georgia,serif; font-weight:700; color:var(--ink);}
  .header p.tag{margin:8px 0 0; font-size:0.95rem; color:var(--grey);}
  .header p.access{margin:16px 0 0; font-size:0.82rem; font-weight:600; color:var(--teal);}
  /* Ramy, 20 Sep 2026: "Lite" sits on Connect's baseline, not centred against it. */
  /* The mark turns once every ninety seconds, holding still for the first ten
     of them -- the same rule the trainee home and the four documents carry.
     Ramy, 21 Sep 2026: "I still want the logo to slowly spin." It belongs on
     every screen that shows the mark: the mark is the one thing in Lite that is
     identical everywhere, and a logo that moves on one page and not the next is
     two logos. Honoured only where motion is welcome. */
  @keyframes wordmark-spin{0%,11.11%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
  .wordmark-spin{animation:wordmark-spin 90s linear infinite; transform-origin:50% 50%; transform-style:preserve-3d;}
  @media(prefers-reduced-motion:reduce){ .wordmark-spin{animation:none;} }

  .hub-pair{display:inline-flex;align-items:baseline;gap:4px;}
  .hub-word{font-family:'Instrument Sans','Karla',sans-serif;font-weight:500;font-size:10px;letter-spacing:0.24em;text-transform:uppercase;color:var(--ink);line-height:1;margin-left:2px;}
  /* Ramy, 21 Sep 2026: the credit sits at the foot, as on the trainee home.
     hub-shared hides .hub-credit under 768px because a header band has no room
     for it; the foot does, so this wins on specificity rather than !important. */
  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--sand-line);
    display:flex; align-items:center; justify-content:center; gap:8px;}
  /* the mark beside the credit (Ramy, 21 Sep 2026), the header tile at 18px */
  .foot-mark{width:18px; height:18px; border-radius:4px; background:var(--ink-warm);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  /* hub-shared gives .hub-credit a 12px left margin for the header band; the
     foot spaces with gap instead, so it is zeroed here rather than with !important */
  .foot .hub-credit{display:inline; margin-left:0;}
  .howline{margin:30px 0 0; text-align:center; font-size:0.86rem; color:var(--grey);}
  @media print{ .howline{display:none;} }
  h2.sect{font-family:'Newsreader',Georgia,serif; font-size:1.2rem; font-weight:700; color:var(--teal); margin:28px 4px 10px;}
  h2.sect small{font-family:'Karla',sans-serif; font-size:0.8rem; font-weight:500; color:var(--grey); margin-left:10px;}
  /* Gold edges the card, as on every other screen (Ramy, 24 Sep 2026). */
  .panel{background:var(--card); border-left:5px solid var(--gold, oklch(63% 0.096 72)); border-radius:10px; padding:6px; box-shadow:0 1px 2px rgba(0,0,0,0.03);}
  /* Orientation stated, not left to the print dialog -- see hub-record.css. */
  @page{ size:A4 portrait; margin:12mm; }
  @media print{ .panel{border-left:none;} } /* the printed pack keeps its plain page */
  table{width:100%; border-collapse:collapse;}
  th{text-align:left; font-size:0.7rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--grey); padding:14px 16px; border-bottom:1px solid var(--sand-line);}
  td{padding:13px 16px; border-bottom:1px solid var(--sand-line); font-size:0.9rem; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .name{font-weight:700; color:var(--ink);}
  .sub{font-size:0.78rem; color:var(--grey);}
  .chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:var(--surface); font-size:11.5px; font-weight:500; color:var(--quiet); line-height:1.2; white-space:nowrap;}
  .chip b{font-weight:700; font-size:10px; letter-spacing:0.04em; color:var(--grey);}
  .chip.nd{background:transparent; border-color:transparent; color:var(--faint);}
  .chip.fine{background:oklch(95% 0.02 155); border-color:oklch(86% 0.04 155); color:var(--grn);}
  .chip.above{background:var(--grn-bg); border-color:oklch(80% 0.07 155); color:var(--grn); font-weight:600;}
  .chip.wait{background:var(--blu-bg); border-color:oklch(84% 0.05 232); color:var(--blu); font-weight:600;}
  .chip.work{background:var(--amb-bg); border-color:oklch(84% 0.08 78); color:var(--amb); font-weight:600;}
  .chip.wrong{background:var(--red-bg); border-color:oklch(82% 0.08 25); color:var(--red); font-weight:700;}
  .standing{display:inline-block; font-size:0.72rem; font-weight:700; letter-spacing:0.05em; padding:5px 10px; border-radius:20px; background:var(--sand); color:var(--grey);}
  .standing.tk-std{background:oklch(95% 0.02 155); color:var(--grn);}
  /* Above standard is gold, and solid. It was --grn-bg against tk-std's
     oklch(95% 0.02 155): the same hue, a chroma apart, so the one thing on
     this card an assessor is looking for could not be told from the ordinary
     case (Ramy, 27 Sep 2026: "it's all kind of different green... maybe we
     can go with above standard with the gold colour instead"). */
  /* Above standard carries no colour: gold already edges every card in
     Lite, and colour here marks what needs you (Ramy, 27 Sep 2026). */
  .standing.tk-above{background:var(--sand); color:var(--grey);}
  .standing.tk-notstd{background:var(--red-bg); color:var(--red);}

  /* The grades, and the report, unpacked. This cell used to stack the
     standing chip, two prose lines reading "Provisional: PASS" and "Final:
     PASS B · final report", the cap and the fail letter -- five things in one
     column, with the report link welded to the end of a grade. At full width
     that is what reads as crowded. Now: the grades are two small pills that
     scan as a pair, and the report is its own line under them. */
  .grades{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;}
  .gpill{display:inline-flex; align-items:baseline; gap:5px; font-size:0.7rem; font-weight:600;
    letter-spacing:0.04em; text-transform:uppercase; padding:3px 9px; border-radius:20px;
    background:var(--sand); border:1px solid var(--sand-line); color:var(--grey); white-space:nowrap;}
  .gpill b{font-size:0.78rem; font-weight:700; letter-spacing:0; text-transform:none; color:var(--ink);}
  /* The final is the one that counts, so it carries the edge. */
  .gpill.fin{border-color:color-mix(in oklab, var(--teal) 40%, transparent);
    background:color-mix(in oklab, var(--teal) 5%, var(--sand));}
  .gpill.fin b{color:var(--teal);}
  .reportlink{display:inline-block; margin-top:6px; font-size:0.76rem; font-weight:600;}
  .btn{display:inline-block; text-decoration:none; font-family:'Karla',sans-serif; font-size:0.83rem; font-weight:700; padding:8px 16px; border-radius:20px; border:1.5px solid var(--sand-line); background:var(--card); color:var(--ink); cursor:pointer;}
  .btn.ghost{border-color:var(--teal); color:var(--teal); background:none;}
  .btn.primary{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:18px 0 0;}
  .empty{text-align:center; padding:40px 20px; color:var(--grey);}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .back[hidden]{display:none;}
  .panel{overflow-x:auto;}
  /* candidate view */
  .cand-head{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:16px 18px;}
  .cand-head h1{font-family:'Newsreader',Georgia,serif; font-size:1.5rem; margin:0; color:var(--ink);}
  .facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 18px; padding:6px 18px 16px;}
  .fact .k{font-size:0.68rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--grey);}
  .fact .v{font-size:0.9rem; color:var(--ink); margin-top:2px;}
  .fact .v.red{color:var(--red); font-weight:600;} .fact .v.amb{color:var(--amb); font-weight:600;}
  .tp{border-bottom:1px solid var(--sand-line); padding:14px 18px;}
  .tp:last-child{border-bottom:none;}
  .tp-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .tp-row .n{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.05rem; color:var(--ink); min-width:44px;}
  .tp-row .meta{font-size:0.82rem; color:var(--grey); flex:1; min-width:200px;}
  .tp-row .meta b{color:var(--ink); font-weight:600;}
  .doc{background:var(--surface); border-radius:6px; padding:26px 28px; border:1px solid var(--sand-line); margin-top:12px;}
  .doc[hidden]{display:none;}
  .brief{padding:14px 18px; border-bottom:1px solid var(--sand-line);}
  .brief:last-child{border-bottom:none;}
  .brief h3{margin:0; font-size:1rem; color:var(--ink);}
  .brief .sub{margin:2px 0 8px;}
  .brief ul{margin:0; padding-left:18px; font-size:0.86rem; color:var(--quiet);}
  /* .panel is overflow-x:auto so a wide table can scroll on screen; in print an
     overflow box is not fragmented across pages, so everything past the first
     page was clipped away (Ramy, 21 Sep 2026: "only prints the first page"). */
  /* the candidates the assessor is steered to read in full, Handbook 14.2 */
  .review{margin-top:4px; font-family:'Instrument Sans','Karla',sans-serif; font-size:9.5px; font-weight:700;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--brick);}
  /* the centre's own documents, as links */
  .docrow{display:flex; align-items:center; justify-content:space-between; gap:18px; padding:12px 16px; border-bottom:1px solid var(--sand-line);}
  .docrow:last-child{border-bottom:none;}
  .docrow span{font-size:0.9rem;}
  /* The Open links had no colour of their own, so the browser supplied pure
     blue and an underline -- the only thing on the pack not in the palette
     (Ramy, 24 Sep 2026). Teal, like every other link here, and 44px on a
     phone. */
  .docrow a{font-family:'Karla',sans-serif; font-size:0.85rem; font-weight:700;
    color:var(--teal); text-decoration:underline; text-decoration-color:var(--gold, oklch(63% 0.096 72));
    text-underline-offset:4px; white-space:nowrap;}
  .docrow a:hover{color:var(--ink-warm, oklch(30% 0.042 58));}
  @media(max-width:560px){ .docrow a{min-height:44px; display:inline-flex; align-items:center;} }
  .tpmark{margin:0 0 12px; font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:700;
    letter-spacing:0.12em; text-transform:uppercase; color:var(--grey);}
  @media print{ .back,.toolbar,#hubSync{display:none !important;} body{background:#fff; padding:0;} .doc[hidden]{display:block;}
    .panel{overflow:visible !important;} }
</style>

<script type="text/x-hub-app">
const T = window.HubTracker;
const $ = id => document.getElementById(id);
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function rec(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function when(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
/* The date at the front of the string, read as written rather than converted.
   The store stamps the assessor expiry at 23:59:59 of its own day and sends it
   as UTC, so reading it as an instant moved it to the next day for anyone east
   of the store -- the same link then said 13 November when the page worked the
   date out itself and 14 November when the store answered (found walking the
   assessor role, 21 Sep 2026). A date named to a person is a day, not a moment. */
function longDate(iso){
  const m = String(iso == null ? '' : iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  const d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
}

const MODE = window.HubMode;
const params = new URLSearchParams(location.search);
const WHO = params.get('trainee') || '';
const SETTINGS = rec('connect_course_settings') || {};
/* The rooms an online course teaches in: the assessor joins the teaching
   practice from here on the day (Ramy, 28 Sep 2026). Print drops it. */
if (window.hubOnlineRoomsHTML) document.getElementById('onlineRooms').innerHTML = hubOnlineRoomsHTML(SETTINGS, { all: true, assessor: true });
/* Where this centre files its grades. The assessor's own job at the end of a
   visit is to put the final grades into Appian, and until now the pack sent
   them looking for the address themselves. Set on Course admin -> Settings;
   http/https only, because the value is typed by a person and ends up in an
   href; nothing is shown at all when it is unset, since a dead link is worse
   than none. The grades stay open behind it -- copy here, paste there. */
const APPIAN = (function(){
  /* Cambridge's own address, from the CELTA Appian User Guidelines p1 -- the
     same for every centre, since what differs is the login and not the URL.
     The course setting overrides it for a centre with a bookmark or an SSO
     wrapper of its own. Built in rather than gated on that setting: Connect
     gated every Appian link on a per-centre field, the field was empty, and
     nobody ever saw the link. */
  const u = String(SETTINGS.appianUrl || '').trim();
  return /^https?:\/\//i.test(u) ? u : 'https://cambridget2.appiancloud.com/suite/';
})();
const appianBtn = (cls) =>
  `<a class="btn ${cls}" href="${APPIAN.replace(/"/g,'&quot;')}" target="_blank" rel="noopener">Open Appian</a>`;
/* Handbook 14.1: 2-3 days before, the centre must "give the assessor the
   course notification reference number". The Appian grade form gates on it,
   so a link to Appian without the reference is a door the assessor cannot
   open. Shown under the buttons, where they are about to need it. */
const refLine = () => {
  const r = String(SETTINGS.notificationRef || '').trim();
  return r ? `<p class="access" style="font-weight:500;">Course notification reference <b>${esc(r)}</b> — Appian asks for this</p>` : '';
};
/* How many teaching practices this course gives each candidate (Course admin
   > Settings). Eight when unset, which is every course made before the field
   existed -- and eight is the most the records model, so it is also the cap.
   Without it the pack said "6 of 8" and drew eight blocks for a course that
   only ever had six, showing two that were never going to be taught. */
const TP_TOTAL = (function(){ const n = parseInt(SETTINGS.tpCount, 10); return (n >= 1 && n <= HUB_MAX_TP) ? n : 8; })();
let WORDING = rec('connect_assignment_wording_v2'); if (!WORDING && window.CONNECT_HUB_DEFAULT_WORDING) WORDING = window.CONNECT_HUB_DEFAULT_WORDING;
const ORDER = hubAssignmentOrder(WORDING);
const roster = rec('connect_roster_v1') || { trainees: {} };
const PEOPLE = Object.values(roster.trainees||{}).sort((a,b)=>(a.name||'').localeCompare(b.name||''));

// The tracker's vocabulary, so the pack reads like the grid.
const A_STATE = {
  '':       { t:'not started', cls:'nd' },
  WAIT:     { t:'submitted, unmarked', cls:'wait' },
  UNMARKED: { t:'returned unmarked', cls:'work' },
  PASS:     { t:'pass', cls:'fine' },
  FAILRES:  { t:'resubmission required', cls:'work' },
  WAIT2:    { t:'resubmitted, unmarked', cls:'wait' },
  RES:      { t:'pass on resubmission', cls:'fine' },
  FAIL:     { t:'fail', cls:'wrong' }
};
const G_STATE = { ABOVE:{ t:'above standard', cls:'above' }, STD:{ t:'to standard', cls:'fine' }, NOTSTD:{ t:'not to standard', cls:'wrong' } };
/* Handbook 10.2: Stage 1 in the first third, Stage 2 at the halfway point,
   Stage 3 in the final third -- so which stage a teaching practice sits in
   follows the course's own length, not a fixed eight. See HubTracker.stageOf. */
const STAGE_OF = n => 'Stage ' + HubTracker.stageOf(n, TP_TOTAL);

// ---- header ---------------------------------------------------------------------
$('courseName').textContent = SETTINGS.courseName || 'Course name not set';
$('centreLine').textContent = [SETTINGS.centreName, SETTINGS.centreNumber ? 'Centre ' + SETTINGS.centreNumber : '', (SETTINGS.start && SETTINGS.end) ? niceDate(SETTINGS.start) + ' – ' + niceDate(SETTINGS.end) : ''].filter(Boolean).join(' · ');
if (MODE === 'assessor') {
  /* The expiry the store sent at boot, or, failing that, worked out here the
     same way the store works it out: the course end date plus fourteen days
     (Handbook 15). The fallback matters. This line used to announce "no course
     end date set" whenever HubAssessor was missing -- which is a claim about
     the COURSE, not about what this page happens to know -- and it printed it
     directly under a header stating the course's end date. Two lines of the
     same screen contradicting each other, found walking the assessor role on
     21 Sep 2026. It now only says that when the end date really is absent. */
  const fromEnd = () => {
    const end = SETTINGS && SETTINGS.end;
    if (!end || !/^\d{4}-\d{2}-\d{2}$/.test(String(end))) return null;
    const d = new Date(String(end) + 'T23:59:59');
    if (isNaN(d.getTime())) return null;
    d.setDate(d.getDate() + 14);
    return d.toISOString();
  };

function courseDocuments(){
  const docs = (SETTINGS && SETTINGS.docs) || {};

     This used to render only what was filled in, and to disappear entirely
     when nothing was -- so a pack with no documents looked like a pack with
     no such requirement, and an assessor had no way to tell "the centre has
     not sent the registers" from "Lite does not do registers" (Ramy, 27 Sep
     2026: "where is the rest of the pack?"). Connect keeps its eight
     compiled-in defaults on screen for the same reason. A missing row says
     so plainly; it is the centre's to fill, not the assessor's to chase. */
  /* Only what the centre has actually provided. Showing every expected
     document with "not provided" beside it was tried on 27 Sep 2026 and
     rejected: an empty section hiding itself is right, because the pack is
     what the centre HAS sent, not a checklist of what it has not (Ramy: "if
     nothing is filled in, then it makes sense that it will hide itself").

  const rows = DOC_LABELS.filter(([k]) => docs[k]).map(([k,label]) =>

function tpBlock(tr, n, c){
  const hist = T.tpHistory(tr); const fb = hist[n]; const f = fb && fb.state && fb.state.f;
  const cur = tr.tp && tr.tp.feedback; const isCur = cur && T.tpNumberOf(cur)===n && cur.status!=='returned';
  /* The live plan and which TP it belongs to, read once here because three
     things below want them: the in-progress line, the not-yet-taught line, and
     the plan document itself.
     Which TP it is used to demand the literal "TP" before the digit, so a
     candidate whose tutor typed "4" rather than "TP4" lost the "plan turned in"
     marker -- the sixth place tonight where a number typed freely was read by
     one spelling only. First number wins, as on the dashboard and the home. */
  const plan = tr.tp && tr.tp.plan;
  const pm = plan && String(plan.label || (plan.state && plan.state.meta && plan.state.meta.tp) || '').match(/\d+/);
  const planN = pm ? parseInt(pm[0], 10) : 0;
  let meta, right='';
  if (fb) {

    meta = `<span class="chip ${g?g.cls:'wait'}">${g?g.t:'returned'}</span> <b>${esc(c['tp'+n+'_aim'] || (f && f.fMain) || '')}</b>${f && f.fTutor ? ' · tutor ' + esc(f.fTutor) : ''}${f && f.fDate ? ' · taught ' + esc(niceDate(f.fDate)) : ''}${fb.returnedAt ? ' · returned ' + esc(when(fb.returnedAt)) : ''}`;
    right = fb.docHTML ? `<button class="btn ghost" type="button" data-doc="tp${n}">Show the document</button>` : '<span class="sub">no document stored</span>';
  } else if (isCur) {

  const planDoc = (!fb && plan && planN === n && plan.status === 'turned_in' && plan.docHTML)

}

    ['Grade cap', r.ceiling ? r.ceiling.replace('SRT','LSRT') : 'none', r.ceiling ? 'amb' : ''],
    ['Stage 1 record', man.stage1 ? 'done' : 'not yet', ''],
    ['Stage 2 tutorial', verdict(man.stage2), man.stage2==='NOTSTD' ? 'red' : ''],
    ['Stage 3 tutorial', verdict(man.stage3), man.stage3==='NOTSTD' ? 'red' : ''],
    ['Fail letter', man.failLetter ? 'issued ' + man.failLetter : 'not issued', man.failLetter ? 'red' : ''],
    ['Withdrawn', man.withdrawn ? 'yes' : 'no', man.withdrawn ? 'red' : '']
  ];
  $('app').innerHTML = `
    <div class="panel">
      <div class="cand-head"><div style="display:flex;align-items:center;gap:12px;"><span class="avi avi-cand" style="width:40px;height:40px;font-size:0.9rem;border-radius:9px;">${esc(hubInitials(tr.name))}</span><div><h1>${esc(tr.name)}</h1><div class="sub">${esc(tr.group ? 'Group ' + tr.group : '')}</div></div></div><span class="standing ${chip.cls}">${esc(chip.text)}</span></div>
      <div class="facts">${facts.map(f=>`<div class="fact"><div class="k">${f[0]}</div><div class="v ${f[2]}">${esc(f[1])}</div></div>`).join('')}</div>
    </div>
    <h2 class="sect">Teaching practice <small>the document the candidate received, as returned</small></h2>
    <div class="panel">${Array.from({length:TP_TOTAL},(_,i)=>i+1).map(n=>tpBlock(tr, n, c)).join('')}</div>
    <h2 class="sect">Assignments <small>in the centre’s order</small></h2>
    <div class="panel">${ORDER.filter(k => k!=='a5' || a5InPlay(tr.assignments||{})).map(k=>assignmentBlock(tr, k)).join('')}</div>
    <h2 class="sect">Observations <small>the sheets, as the candidate wrote them</small></h2>
    <div class="panel">${observationBlock(tr)}</div>
    <h2 class="sect">CELTA 5 <small>the record booklet</small></h2>
    <div class="panel">${celta5Block(tr)}</div>
    ${(tr.links || []).filter(l => l && l.url).length ? `<h2 class="sect">Private links <small>given to this candidate alone</small></h2>
    <div class="panel">${(tr.links || []).filter(l => l && l.url).map(l => `<div class="tp"><div class="tp-row"><span class="n">${esc(l.label || l.url)}</span><span class="meta"></span><a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">Open</a></div></div>`).join('')}</div>` : ''}
    ${(tr.staffLinks || []).filter(l => l && l.url).length ? `<h2 class="sect">Course files <small>application, interview notes, pre-course task \u2014 for the tutors and the assessor; the candidate does not see these</small></h2>
    <div class="panel">${(tr.staffLinks || []).filter(l => l && l.url).map(l => `<div class="tp"><div class="tp-row"><span class="n">${esc(l.label || l.url)}</span><span class="meta"></span><a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">Open</a></div></div>`).join('')}</div>` : ''}`;
  /* The candidate page carries the stored documents, whose plan tables stack
     the same way (24 Sep 2026). */
  if (window.hubStackTables) hubStackTables($('app'));
  $('app').addEventListener('click', e => {
    const b = e.target.closest('[data-doc]'); if (!b) return;
    const d = $('doc-' + b.dataset.doc); if (!d) return;
    d.hidden = !d.hidden; b.textContent = d.hidden ? 'Show the document' : 'Hide the document';
  });
  if (location.hash && /^#tp\d$/.test(location.hash)) { const b = document.querySelector(`[data-doc="${location.hash.slice(1)}"]`); if (b) b.click(); const el = $(location.hash.slice(1)); if (el) hubScrollIntoView(el, 'start'); }
}

if (MODE !== 'assessor' && MODE !== 'tutor') {
  $('app').innerHTML = '<div class="panel"><div class="empty">Nothing to show — this page needs the assessor link (or the tutor link) to read the course.</div></div>';
} else if (WHO) {
  const tr = roster.trainees[WHO];
  if (tr) renderOne(tr); else $('app').innerHTML = '<div class="panel"><div class="empty">No candidate with that link on the course.</div></div>';
} else renderList();
</script>
</body>
</html>
