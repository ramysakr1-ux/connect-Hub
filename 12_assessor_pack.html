<!DOCTYPE html>
<!--
  Connect Lite — assessor pack
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 20 Sep 2026: "build the assessor link". The third link, read-only:
  everything the Hub holds for the course, laid out the way an assessor reads
  it on the visit day -- trainees first, then the double-marking record and
  the briefs. Nothing on this page, or on the pages it opens, can be changed
  from the assessor's link (hub-sync.js drops every write in assessor mode).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon-assessor.png">
<link rel="manifest" href="manifest-assessor.webmanifest">
<meta name="theme-color" content="#1f4f4c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Connect Lite">
<title>Connect Lite — Assessor pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Karla:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202611211502">
<style>
  :root{
    /* the control fill, for the shared confirm modal's Cancel button */
    --line:oklch(89.5% 0.012 82); --quiet:oklch(40% 0.02 70);
    --grn:oklch(35% 0.08 155); --grn-bg:oklch(93% 0.04 155); --blu:oklch(38% 0.07 232); --blu-bg:oklch(94% 0.03 232);
    --amb:oklch(42% 0.1 78); --amb-bg:oklch(95% 0.05 85); --red:oklch(40% 0.14 25); --red-bg:oklch(95% 0.04 25);
    --purp:oklch(40% 0.1 300); --purp-bg:oklch(95% 0.03 300);
  }
  *{box-sizing:border-box;}
  /* A DOCUMENT, not a dashboard. Ramy, 1 Oct 2026: "the assessor page is not
     very well organized... make it look like a document." Twelve identical
     beige panels with twelve identical gold bars read as one long scroll and
     told you nothing about which part you were in. So: a single sheet of
     paper on the sand, generous margins, sections separated by a rule rather
     than by a box, and gold spent only where it carries meaning -- the visit,
     and a Handbook line that falls short. It is also the one screen an
     assessor takes away from a center. */
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    padding:40px 20px 60px; display:flex; flex-direction:column; align-items:center;}
  .board{max-width:1080px; width:100%; background:var(--paper); border:1px solid var(--sand-line);
    border-radius:4px; box-shadow:0 1px 3px rgba(40,30,15,0.05), 0 12px 40px -28px rgba(40,30,15,0.5);
    padding:0 clamp(22px, 5vw, 64px) 54px;}
  /* The masthead is part of the sheet: no card inside a card. */
  /* the course, the center and the dates are in the welcome card below; the masthead keeps the mark, the
     eyebrow and the Appian door (Ramy, 21 Oct 2026) */
  .header .course-name, .header .tag, .header #accessLine, .header .access{display:none !important;}
  .appian-ref{font-size:0.78rem; color:var(--grey); margin-left:8px;}
  .online-rooms{display:flex; flex-wrap:wrap; align-items:center; gap:10px;}
  .or-appian{margin-left:auto; display:inline-flex; align-items:center; flex-wrap:wrap; gap:4px 0;}
  @media (max-width:560px){ .or-appian{margin-left:0; flex-basis:100%;} }
  #toolbar:empty, #toolbar:has(> .tools-right:empty:only-child){display:none;}
  .header{background:none; border-radius:0; border-top:none; border-bottom:2px solid var(--ink-warm);
    padding:40px 0 26px; text-align:center; margin:0 0 6px; box-shadow:none;}
  .header .eyebrow{margin:14px 0 0; font-family:'Instrument Sans',Karla,sans-serif; font-weight:600; font-size:10px; letter-spacing:0.22em; color:var(--grey); text-transform:uppercase;}
  .course-name{margin:6px 0 0; font-size:1.5rem; font-family:'Newsreader',Georgia,serif; font-weight:700; color:var(--ink);}
  .header p.tag{margin:8px 0 0; font-size:0.95rem; color:var(--grey);}
  .header p.access{margin:16px 0 0; font-size:0.82rem; font-weight:600; color:var(--teal);}
  /* Ramy, 20 Sep 2026: "Lite" sits on Connect's baseline, not centred against it. */
  /* The mark turns once every ninety seconds, holding still for the first ten
     of them -- the same rule the trainee home and the four documents carry.
     Ramy, 21 Sep 2026: "I still want the logo to slowly spin." It belongs on
     every screen that shows the mark: the mark is the one thing in Lite that is
     identical everywhere, and a logo that moves on one page and not the next is
     two logos. Honoured only where motion is welcome. */
  @keyframes wordmark-spin{0%,11.11%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
  .wordmark-spin{animation:wordmark-spin 90s linear infinite; transform-origin:50% 50%; transform-style:preserve-3d;}
  @media(prefers-reduced-motion:reduce){ .wordmark-spin{animation:none;} }

  .hub-pair{display:inline-flex;align-items:baseline;gap:4px;}
  .hub-word{font-family:'Instrument Sans','Karla',sans-serif;font-weight:600;font-size:10.3px;letter-spacing:0.24em;text-transform:uppercase;color:var(--ink);line-height:1;margin-left:1px;} /* 8/21 of the 27px word, 0.19 of it after (gap 4 + 1): the logo is the films' (24 Oct 2026) */
  /* Ramy, 21 Sep 2026: the credit sits at the foot, as on the trainee home.
     hub-shared hides .hub-credit under 768px because a header band has no room
     for it; the foot does, so this wins on specificity rather than !important. */
  /* The visit: the one gold object on the sheet, and the first thing read. */
  #onlineRooms .online-rooms{margin:18px 0 2px; padding:14px 16px; border:1px solid var(--gold);
    border-radius:6px; background:oklch(98.6% 0.014 84); display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  #onlineRooms .or-join.first{font-weight:700;}
  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--sand-line);
    display:flex; align-items:center; justify-content:center; gap:8px;}
  /* the mark beside the credit (Ramy, 21 Sep 2026), the header tile at 18px */
  .foot-mark{width:18px; height:18px; border-radius:4px; background:var(--ink-warm);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  /* hub-shared gives .hub-credit a 12px left margin for the header band; the
     foot spaces with gap instead, so it is zeroed here rather than with !important */
  .foot .hub-credit{display:inline; margin-left:0;}
  .howline{margin:30px 0 0; text-align:center; font-size:0.86rem; color:var(--grey);}
  @media print{ .howline{display:none;} }
  /* A section is a heading with a rule under it, the way a report is set. */
  h2.sect{font-family:'Newsreader',Georgia,serif; font-size:1.18rem; font-weight:700; color:var(--ink);
    margin:38px 0 0; padding:0 0 7px; border-bottom:1px solid var(--ink-warm);
    display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  h2.sect small, details.sec > summary small{font-family:'Instrument Sans','Karla',sans-serif; font-size:0.68rem; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; color:var(--grey); margin-left:0; text-align:right;}
  details.sec > summary{font-family:'Newsreader',Georgia,serif; font-size:1.18rem; font-weight:700; color:var(--ink);
    margin:38px 0 0; padding:0 0 7px 22px; border-bottom:1px solid var(--ink-warm); cursor:pointer; list-style:none;
    display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; position:relative;}
  details.sec > summary::-webkit-details-marker{display:none;}
  details.sec > summary::before{content:"\25B8"; position:absolute; left:2px; top:0.28em; font-size:0.8em;
    color:var(--gold-deep); transition:transform 160ms ease;}
  details.sec[open] > summary::before{transform:rotate(90deg);}
  details.sec > summary:hover{color:var(--teal);}
  @media print{ details.sec > summary::before{display:none;} details.sec > summary{padding-left:0;} }
  /* Gold edges the card, as on every other screen (Ramy, 24 Sep 2026). */
  /* No box: the sheet is the box. Rows are ruled, as on a form. */
  .panel{background:none; border:none; border-radius:0; padding:0; box-shadow:none;}
  table.mid th:not(:first-child), table.mid td:not(:first-child){text-align:center;}
  .chkgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:0 26px; padding:14px 0 4px;}
  /* On a sheet a check is a ruled entry, not a tile -- until it falls short,
     and then it is the only boxed thing on the page. */
  .chk{border:none; border-top:1px solid var(--sand-line); border-radius:0; padding:11px 0 12px; background:none;}
  .chk-h{display:flex; align-items:center; gap:7px; font-size:0.84rem; margin-bottom:4px;}
  .chk-d{font-size:0.78rem; color:var(--mut, oklch(45% 0.01 70)); line-height:1.45;}
  .chk-c{font-size:0.7rem; color:var(--mut, oklch(45% 0.01 70)); opacity:.75; margin-top:5px;}
  .verb{font-size:0.62rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:2px 6px; border-radius:999px;
        border:1px solid var(--line, oklch(85.5% 0.02 80)); color:var(--mut, oklch(45% 0.01 70));}
  .verb.must{color:var(--brick); border-color:color-mix(in oklab, var(--brick) 45%, transparent);}
  .verb.should{color:var(--gold-deep); border-color:color-mix(in oklab, var(--gold) 55%, transparent);}
  .chk.short{border:1px solid var(--gold); border-radius:6px; padding:11px 12px; margin:6px 0;}
  .chk.short:has(.verb.must){border-color:var(--brick); background:oklch(97% 0.02 30);}
  .chk.short:has(.verb.must) .verb.must{background:var(--brick); border-color:var(--brick); color:var(--paper);}
  /* ink on gold, like .btn-gold: white on gold measured 2.8:1 (1 Oct 2026) */
  .chk.short:has(.verb.should) .verb.should{background:var(--gold); border-color:var(--gold); color:var(--ink-warm);}
  .chk.unknown{border-style:dashed;}
  @media print{ .chkgrid{grid-template-columns:repeat(2,1fr);} }
  /* ---- THE PORTFOLIO, ONE SHAPE FOR EVERY SECTION (18 Nov 2026) ----
     One trainee's page is wider (Ramy: "I don't think we utilize much of the screen"), its logo sits on the left with
     the buttons on the right, and every section is the same card: a title, one button, rows of name, detail and a
     status word. The status colours are the ones the chips already wore: forest done, mustard above standard, navy
     waiting, clay to resubmit, red a problem, an outline for not yet. */
  body.pf-one .board{max-width:1400px;}
  body.pf-one .header{display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap; text-align:left; padding:16px 0 16px;}
  body.pf-one .header > div:first-child{justify-content:flex-start !important;}
  body.pf-one .header .eyebrow{margin:0; padding-left:16px; border-left:1px solid var(--sand-line);}
  body.pf-one .header .toolbar{margin:0 0 0 auto;}
  body.pf-one .header #onlineRooms{flex-basis:100%;} body.pf-one .header #onlineRooms:empty{display:none;}
  body.pf-one .back{margin:18px 0 0;}
  .pf-jump{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin:0 0 24px;}
  .pf-jump.four{grid-template-columns:repeat(4,minmax(0,1fr));}
  .pf-jump a{display:flex; flex-direction:column; gap:3px; padding:14px 16px; border-radius:14px; background:var(--paper); border:1px solid var(--sand-line); box-shadow:var(--nb-shadow); text-decoration:none; color:var(--ink); transition:transform .15s ease, border-color .15s ease;}
  .pf-jump a:hover{transform:translateY(-2px); border-color:var(--a-forest, var(--teal));}
  .pf-jump .k{font-family:'Instrument Sans','Karla',sans-serif; font-size:.68rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--grey);}
  .pf-jump .v{font-family:'Newsreader',Georgia,serif; font-size:1.45rem; font-weight:600; line-height:1.15;}
  .pf-jump .w{font-size:.82rem; color:var(--grey);}
  .pf-sec{background:var(--paper); border:1px solid var(--sand-line); border-radius:14px; box-shadow:var(--nb-shadow); margin:0 0 22px; overflow:clip; scroll-margin-top:14px;}
  .pf-sec > header{display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap; padding:15px 20px 13px; border-bottom:1.5px solid var(--ink);}
  .pf-sec > header h2{font-family:'Newsreader',Georgia,serif; font-size:1.25rem; font-weight:700; margin:0; color:var(--ink);}
  details.pf-fold > summary{display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap; padding:15px 20px 13px; min-height:64px; cursor:pointer; list-style:none;}
  details.pf-fold > summary::-webkit-details-marker{display:none;}
  details.pf-fold > summary h2{font-family:'Newsreader',Georgia,serif; font-size:1.25rem; font-weight:700; margin:0; color:var(--ink);}
  details.pf-fold > summary .hint{font-size:.85rem; color:var(--grey); flex:1; min-width:120px;}
  details.pf-fold[open] > summary{border-bottom:1.5px solid var(--ink);}
  details.pf-fold .o, details.pf-fold[open] .c{display:none;} details.pf-fold[open] .o{display:inline;}
  .pf-sec > header .hint{font-size:.85rem; color:var(--grey); flex:1; min-width:120px;}
  .pf-btn{display:inline-block; font-family:'Karla',sans-serif; font-size:.83rem; font-weight:700; padding:8px 16px; border-radius:999px; border:1.5px solid var(--a-forest, var(--teal)); color:var(--a-forest, var(--teal)); background:none; text-decoration:none; white-space:nowrap; cursor:pointer; transition:transform .15s ease;}
  .pf-btn:hover{transform:translateY(-2px);}
  .pf-btn.quiet{border-color:var(--sand-line); color:var(--ink); padding:6px 14px;}
  /* THE CARDS IN PAIRS (Ramy, 19 Nov 2026: "a bit more aligned ... a bit more symmetrical"; the assessor reads this page).
     Two columns used to run independently, so only the first pair started level. Now the cards sit in rows of two:
     each pair starts on one line and ends on one line, every card's heading is the same height whether or not it
     carries a button, and a card left without a partner, or holding a single line, runs the width of the page. */
  .pf-two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:stretch; margin:0 0 22px;}
  .pf-two > .pf-sec{margin:0; display:flex; flex-direction:column;}
  .pf-two > .pf-sec > header{flex:0 0 auto;}
  .pf-two > .pf-sec > .pf-row{flex:1 1 auto;}                      /* the shorter card's lines share the spare room, so no card ends in a blank */
  .pf-two > .pf-sec.wide{grid-column:1 / -1;}
  .pf-two:has(.doc:not([hidden])) > .pf-sec{align-self:start;}     /* a document open inside a card: its neighbour keeps its own height */
  .pf-sec > header{min-height:64px;}
  .pf-row{display:grid; grid-template-columns:minmax(120px,190px) minmax(0,1fr) auto; gap:14px; align-items:center; padding:13px 20px; border-bottom:1px solid var(--row-line, var(--sand-line));}
  .pf-row:last-child{border-bottom:0;}
  @media (min-width:561px){ #pf-asg .pf-row{grid-template-columns:96px minmax(0,1fr) auto;} }   /* FOL, LRT: a short label needs a short column; the writing gets the room */
  a.pf-row{color:inherit; text-decoration:none;}
  a.pf-row.go .t{color:var(--a-forest, var(--teal)); font-weight:700; text-decoration:underline; text-underline-offset:3px;}
  a.pf-row.go:hover{background:var(--sand);} a.pf-row.go:focus-visible{outline:2px solid var(--a-forest, var(--teal)); outline-offset:-2px;}
  .pf-row.two{grid-template-columns:minmax(0,1fr) auto;} .pf-row.two .l{overflow-wrap:anywhere;}
  .pf-row .l{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.02rem; color:var(--ink);}
  .pf-row .d{font-size:.9rem; color:var(--ink);} .pf-row .d small{display:block; font-size:.8rem; color:var(--grey); margin-top:2px;}
  .pf-row .d a{color:var(--a-forest, var(--teal)); font-weight:700;}
  .pf-chips{display:flex; flex-wrap:wrap; gap:5px;}
  .pf-pill{display:inline-block; font-family:'Karla',sans-serif; font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:5px 11px; border-radius:7px; white-space:nowrap; text-align:center; border:1px solid transparent;}
  .pf-pill.fine{background:var(--a-forest, var(--teal)); color:var(--paper);}
  .pf-pill.above, .pf-pill.work{background:var(--a-mustard, var(--gold)); color:var(--ink);}
  .pf-pill.wrong{background:var(--a-red, var(--brick)); color:var(--paper);}
  .pf-pill.resub{background:color-mix(in oklch, var(--a-red, var(--brick)) 45%, var(--a-mustard, var(--gold))); color:var(--paper);}
  .pf-pill.wait{background:var(--a-navy, var(--blu)); color:var(--paper);}
  .pf-pill.nd{background:none; color:var(--grey); border-color:var(--sand-line);}
  .pf-tps{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; padding:18px 20px 20px;}
  .pf-tp{display:flex; flex-direction:column; gap:7px; align-items:flex-start; text-align:left; padding:14px 14px 13px; border-radius:12px; border:1px solid var(--sand-line); background:var(--sand); font:inherit; color:var(--ink); min-height:118px; margin:0;}
  button.pf-tp{cursor:pointer; transition:transform .15s ease, border-color .15s ease;}
  button.pf-tp:hover{transform:translateY(-2px); border-color:var(--a-forest, var(--teal));}
  .pf-tp .top{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; flex-wrap:wrap;}
  .pf-tp .n{font-family:'Newsreader',Georgia,serif; font-size:1.3rem; font-weight:700;}
  .pf-tp b{font-size:.92rem; line-height:1.3;}
  .pf-tp .s{font-size:.8rem; color:var(--grey); line-height:1.35;}
  .pf-tp .go{margin-top:auto; font-size:.82rem; font-weight:700; color:var(--a-forest, var(--teal)); text-decoration:underline; text-underline-offset:3px;}
  .pf-tp.on{background:var(--paper); border-color:var(--a-forest, var(--teal)); box-shadow:inset 0 0 0 1px var(--a-forest, var(--teal));}
  .pf-tp.off{background:none; border-style:dashed; color:var(--grey); min-height:0;} .pf-tp.off .n{color:var(--grey);}
  .pf-sheet{border-top:1.5px solid var(--ink); background:var(--sand);}
  .pf-sheet[hidden]{display:none;}
  .pf-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:11px 20px; background:var(--a-forest, var(--teal)); color:var(--paper); position:sticky; top:0; z-index:6;}
  .pf-bar .t{font-family:'Newsreader',Georgia,serif; font-size:1.08rem; font-weight:600; margin-right:auto;}
  .pf-bar button{font-family:'Karla',sans-serif; font-size:.82rem; font-weight:700; color:var(--paper); background:none; padding:6px 12px; border-radius:999px; border:1.5px solid color-mix(in oklch, var(--paper) 45%, transparent); white-space:nowrap; cursor:pointer;}
  .pf-bar button:hover{border-color:var(--paper);}
  .pf-sheet .doc{margin:18px 20px 20px; background:var(--paper);}
  .pf-sheet .doc h1, .pf-sheet .doc h2, .pf-sheet .doc h3{scroll-margin-top:68px;}   /* a jump lands below the bar, not under it */
  .pf-sec .otl{padding:8px 20px;}
  @media (prefers-reduced-motion:reduce){ .pf-jump a, .pf-btn, button.pf-tp{transition:none;} .pf-jump a:hover, .pf-btn:hover, button.pf-tp:hover{transform:none;} }
  @media (max-width:900px){ .pf-jump, .pf-jump.four{grid-template-columns:repeat(2,minmax(0,1fr));} .pf-tps{grid-template-columns:repeat(2,minmax(0,1fr));} .pf-two{grid-template-columns:minmax(0,1fr);} }
  @media (max-width:560px){
    .pf-jump a:nth-child(5){grid-column:1 / -1;}
    .pf-tps{grid-template-columns:minmax(0,1fr); padding:14px; gap:10px;} .pf-tp{min-height:0;}
    .pf-row{grid-template-columns:minmax(0,1fr) auto; padding:12px 14px;} .pf-row .d{grid-column:1 / -1; grid-row:2;} .pf-row .d:empty{display:none;}
    .pf-sec > header{padding:14px;} .pf-sec > header h2, .pf-sec > header .hint{flex-basis:100%;}
    .pf-bar{position:static; padding:10px 14px;} .pf-bar .t{flex-basis:100%;}
    .pf-sheet .doc{margin:12px; padding:18px 14px; overflow-x:auto;}
    body.pf-one .header .toolbar{margin:0; flex-basis:100%; justify-content:flex-start;}
  }
  @media print{
    body.pf-one .board{max-width:none;}
    .pf-btn, .pf-bar, .pf-tp .go{display:none !important;}
    .pf-sec{box-shadow:none; overflow:visible;} .pf-two .pf-sec, .pf-jump{break-inside:avoid; page-break-inside:avoid;}
    .pf-sec > header{min-height:0;}   /* on paper the even heading height pushed the TP tiles onto a page of their own (19 Nov 2026) */
    .pf-sheet{background:none; border:0;} .pf-sheet .doc{margin:0;}
    body.pf-printone .back, body.pf-printone .header, body.pf-printone .howline, body.pf-printone .foot, body.pf-printone .say-pill,
    body.pf-printone #app > :not(#pf-tp), body.pf-printone #pf-tp > :not(.pf-sheet){display:none !important;}
    body.pf-printone .pf-sec{border:0; margin:0;}
  }
  /* Orientation stated, not left to the print dialog -- see hub-record.css. */
  @page{ size:A4 portrait; margin:12mm; }
  /* The teaching practice documents are wide tables, so inside the portrait pack they print on
     landscape pages of their own, as they do on the feedback form (Ramy, 18 Nov 2026: "landscape would work best"). */
  @page tpdoc{ size:A4 landscape; margin:8mm; }
  @media print{
    .doc[id^="doc-tp"], .doc[id^="doc-plan"]{ page:tpdoc; padding:0; border:none; border-radius:0; background:#fff; margin:0; }
    body{padding:0; background:#fff;}
    .board{border:none; box-shadow:none; padding:0; max-width:none;}
    h2.sect{break-after:avoid; page-break-after:avoid;}
    .docrow, tr{break-inside:avoid; page-break-inside:avoid;}
    #onlineRooms .online-rooms{border-color:#999; background:none;}
  }
  table{width:100%; border-collapse:collapse;}

<script type="text/x-hub-app">
const T = window.HubTracker;
const $ = id => document.getElementById(id);
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function rec(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function when(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+window.hubTimeOf(d); }
/* The date at the front of the string, read as written rather than converted.
   The store stamps the assessor expiry at 23:59:59 of its own day and sends it
   as UTC, so reading it as an instant moved it to the next day for anyone east
   of the store -- the same link then said 13 November when the page worked the
   date out itself and 14 November when the store answered (found walking the
   assessor role, 21 Sep 2026). A date named to a person is a day, not a moment. */
function longDate(iso){
  const m = String(iso == null ? '' : iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  const d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
}

const MODE = window.HubMode;
/* the same page is the trainee's portfolio for everyone else (Ramy, 28 Oct 2026: "every time I go to the portfolio I end up where the assessor is supposed to be") */
if (MODE !== 'assessor') { const eb = document.getElementById('eyebrow'); if (eb) eb.textContent = 'Portfolio'; document.title = 'Connect Lite \u2014 Portfolio'; }
const params = new URLSearchParams(location.search);

/* The rooms an online course teaches in: the assessor joins the teaching

/* What and when, beside the door. The assessment date is the center's
   (Course admin), and the times are the teaching practice slots of that day
   from the course's own timetable, in the course's clock -- so the assessor
   does not have to find the day in the timetable to know when to click.
   Ramy, 1 Oct 2026: "next to the link should be some information about what
   and when." */
function visitWhen(){
  const d = VISIT && VISIT.date;
  if (!d) return '';
  const day = (function(){ try { return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { return d; } })();
  let times = '';
  try {
    const tt = rec('connect_timetable_v1') || {};
    const slots = (window.hubSlotsFor ? hubSlotsFor(tt, d) : (tt.slots || [])).filter(sl => sl && sl.kind === 'tp' && sl.from);
    if (slots.length) {
      const from = slots[0].from, to = slots[slots.length - 1].to || '';
      times = ' \u00b7 ' + (to ? hubClockRange(from, to) : hubClock(from));
    }
  } catch (e) {}
  const zone = SETTINGS.timeZone && window.hubZoneName ? ' (' + window.hubZoneName(SETTINGS.timeZone) + ')' : '';
  return day + times + (times ? zone : '');
}
/* Where this center files its grades. The assessor's own job at the end of a
   visit is to put the final grades into Appian, and until now the pack sent
   them looking for the address themselves. Set on Course admin -> Settings;

   href; nothing is shown at all when it is unset, since a dead link is worse
   than none. The grades stay open behind it -- copy here, paste there. */
const APPIAN = (function(){
  /* Cambridge's own address, from the CELTA Appian User Guidelines p1 -- the
     same for every center, since what differs is the login and not the URL.
     The course setting overrides it for a center with a bookmark or an SSO
     wrapper of its own. Built in rather than gated on that setting: Connect
     gated every Appian link on a per-centre field, the field was empty, and
     nobody ever saw the link. */
  const u = String(SETTINGS.appianUrl || '').trim();
  return /^https?:\/\//i.test(u) ? u : 'https://cambridget2.appiancloud.com/suite/';
})();
const appianBtn = (cls) =>
  `<a class="btn ${cls}" href="${APPIAN.replace(/"/g,'&quot;')}" target="_blank" rel="noopener">Open Appian</a>`;

   course notification reference number". The Appian grade form gates on it,

/* The visit's timetable, room and Appian are the assessor's (Ramy, 28 Oct 2026: "Open Appian is supposed to be only for the

function doubleMarkingRows(){
  const rows = [];
  PEOPLE.forEach(tr => {
    ORDER.forEach(k => {
      if (k === 'a5') return; // a center sanction, never in the sample
      const sub = (tr.assignments||{})[k]; if (!sub || !sub.sub1) return;
      const m = sub.markers || {};
      /* ONLY what was actually double-marked. This listed every submitted
         assignment on the course -- twelve trainees by four assignments,
         forty-eight rows, most of them reading "second marker: -- ,
         double-marked: no" (Ramy, 27 Sep 2026: "this is not a double marking
         record, they're not all double marked"). Handbook 9.2.3 asks for a
         SAMPLE to be double-marked; the record is the sample, not the
         cohort. What is missing from the sample is the quota line above,
         which counts it. */
      if (!(m.doubleMarked || m.second)) return;
      const st = T.assignmentState(sub); const a = A_STATE[st.code] || A_STATE[''];
      rows.push(`<tr><td class="name">${esc(tr.name)}</td><td>${esc(k.toUpperCase())}</td><td>${esc(m.first||'—')}</td><td>${esc(m.second||'—')}</td><td><span class="chip ${m.doubleMarked?'fine':'nd'}">${m.doubleMarked?'yes':'no'}</span></td><td><span class="chip ${a.cls}">${a.t}</span></td></tr>`);
    });
  });
  return rows;
}
function briefs(){
  return ORDER.filter(k => k!=='a5' || PEOPLE.some(tr=>a5InPlay(tr.assignments||{}))).map(k => {
    const w = WORDING && WORDING[k]; if (!w) return '';
    const crit = (w.criteria||[]).map(c => `<li>${esc(typeof c==='string' ? c : c.text)}</li>`).join('');
    /* The declaration at the foot of the brief -- "Your own work" -- is what
       every submission is signed against, and the Course documents row above
       sends the assessor here to read it (7 Oct 2026). Found by its type, so
       it does not matter which part of the wording holds it. */
    const decl = [].concat(...Object.values(w).filter(Array.isArray)).find(b => b && b.type === 'declaration');
    const declItems = decl && Array.isArray(decl.items) ? decl.items.map(t => `<li>${esc(t)}</li>`).join('') : '';
    /* The tutors' marking guidance for this assignment, if the course has
       any (17 Oct 2026). The store sends it to the tutors and the assessor
       only. */
    const g = window.hubGuidance ? hubGuidance(k) : null;
    const gCrit = g ? (w.criteria||[]).map((c, i) => (g.crit||[])[i] ? `<div class="gcrit"><b>${i + 1}. ${esc(typeof c==='string' ? c : c.text)}</b>${hubGuidanceHTML(g.crit[i])}</div>` : '').join('') : '';
    const guideBox = g ? `<details class="guide-box"><summary>Marking guidance</summary><div class="gb">${g ? hubGuidanceHTML(g.general) : ''}${gCrit ? '<h4>Criterion by criterion</h4>' + gCrit : ''}${g && g.sections ? '<h4>Section by section</h4>' + hubGuidanceHTML(g.sections) : ''}</div></details>` : '';
    return `<div class="brief"><h3>${esc(k.toUpperCase())} — ${esc(w.title||'')}</h3><div class="sub">${w.wordMin ? esc(w.wordMin + '–' + w.wordMax + ' words') : ''}${w.format ? ' · ' + esc(w.format) : ''}</div>${crit ? `<ul>${crit}</ul>` : ''}${declItems ? `<div class="sub" style="margin-top:6px;"><b>${esc(decl.label || 'Declaration')}</b> — signed on every submission</div><ul>${declItems}</ul>` : ''}${guideBox}</div>`;
  }).join('');
}

/* THE VOLUNTEER STUDENTS. Handbook 14.1 puts the attendance registers in the
   pack, and this is the register Lite keeps itself, so it belongs here rather
   than behind a pasted link. It answers the question an assessor actually has
   about teaching practice -- were there real learners, at the levels the
   course claims, often enough to teach -- at a glance, without opening a
   spreadsheet. Names are shown because a register without them is not a
   register; the links that reach each student's page are NOT, because an
   assessor has no business opening somebody's own page. */
function volunteerStudents(){
  const reg = rec('connect_volunteers_v1') || {};
  const list = (reg.students || []).filter(s => s && s.name);
  if (!list.length) return '';
  const tt = rec('connect_timetable_v1') || {};
  const A = window.hubAttendance;
  const tpSlots = (tt.slots || []).filter(sl => sl.kind === 'tp');
  const mins = sl => { const a = String(sl.from||'').match(/^(\d{1,2}):(\d{2})/), b = String(sl.to||'').match(/^(\d{1,2}):(\d{2})/); if (!a||!b) return 0; const d = (+b[1]*60 + +b[2]) - (+a[1]*60 + +a[2]); return d > 0 ? d : 0; };
  const lessonMin = tpSlots.length ? Math.round(tpSlots.reduce((n, sl) => n + mins(sl), 0) / tpSlots.length) : 0;
  const days = (tt.days || []).filter(d => d.tp).map(d => d.date).sort();
  const fmtH = h => (Math.round(h * 100) / 100).toString().replace(/\.00$/, '');

  const rows = list.map(st => {
    const r = A ? A.record(st.marks || (st.here || []).reduce((m,d) => { m[d]='present'; return m; }, {}), days, tpSlots.length, lessonMin)
                : { hours: 0, present: 0, partial: 0 };
    return { st, r };
  }).sort((a, b) => b.r.hours - a.r.hours);

  /* The levels the volunteers are, which is the claim the timetable makes
     about what is being taught. A level nobody has been given reads as blank
     rather than as a guess. */
  const levels = {};
  list.forEach(st => { const l = (window.hubLevelName ? hubLevelName(String(st.level || '').trim()) : String(st.level || '').trim()); if (l) levels[l] = (levels[l] || 0) + 1; });
  const levelLine = Object.keys(levels).sort().map(l => l + ' (' + levels[l] + ')').join(', ');
  const attended = rows.filter(x => x.r.present > 0).length;
  /* Attended out of the days so far, as the register counts them (Ramy, 24 Oct 2026). */
  const TODAY = window.hubToday ? hubToday() : new Date().toISOString().slice(0, 10);
  const marksOf = st => st.marks || (st.here || []).reduce((m, d) => { m[d] = 'present'; return m; }, {});
  const soFar = st => { const m = marksOf(st); return days.filter(d => d < TODAY || m[d]).length; };
  const pastDays = days.filter(d => d < TODAY).length;

  return `<h2 class="sect">Attendance registers <small>Handbook 14.1 &middot; the volunteer students, the center's own register, ${list.length} on it</small></h2>
    <div class="panel">
      <div class="docrow"><span>${list.length} student${list.length===1?'':'s'} on the register, ${attended} with attendance recorded${levelLine ? ' &middot; levels: ' + esc(levelLine) : ''}</span><span>${days.length} teaching day${days.length===1?'':'s'}${pastDays < days.length ? ', ' + pastDays + ' so far' : ''}</span></div>
      <!-- Ramy, 1 Oct 2026: "the numbers should sit in the middle of the
           headline" -- a figure parked at the left edge of a wide column has
           nothing to do with the word above it. Every column but the name is
           centred, heading and figure together. -->
      <table class="mid"><tr><th>Student</th><th>Level</th><th>Classes attended</th><th>Part of a class</th><th>Hours</th></tr>
      ${rows.map(({st, r}) => `<tr><td>${esc(st.name)}</td><td>${esc((window.hubLevelName ? hubLevelName(st.level || '') : st.level || ''))}</td><td>${r.present} of ${soFar(st)}</td><td>${r.partial || ''}</td><td>${fmtH(r.hours)}</td></tr>`).join('')}
      </table>
    </div>`;
}

/* Ramy, 1 Oct 2026: "most of this stuff should be collapsible." A pack is a
   dozen sections and an assessor needs three of them open. Each heading and
   the block under it become one <details>: the Handbook grid and the two
   trainee lists open, the reference sections closed until asked for. Done to
   the rendered page rather than to a dozen templates, so nothing about what is
   on the page changes -- only whether it is unfolded. */
/* Matched against the TITLE only -- the Handbook reference in the small print
   sits on half the sections, and matching the whole heading left everything
   open. */
const OPEN_SECTIONS = /^(Trainees you are observing|Every other trainee|Candidate portfolios|Grades)/i;
function foldSections(root){
  if (!root) return;
  const heads = [...root.querySelectorAll('h2.sect')];
  heads.forEach(h => {
    const body = [];
    let el = h.nextElementSibling;
    while (el && el.tagName !== 'H2') { body.push(el); el = el.nextElementSibling; }
    if (!body.length) return;
    const d = document.createElement('details');
    d.className = 'sec';
    const title = (h.childNodes[0] && h.childNodes[0].textContent || h.textContent).trim();
    if (OPEN_SECTIONS.test(title)) d.open = true;
    const sum = document.createElement('summary');
    sum.innerHTML = h.innerHTML;
    if (h.id) d.id = h.id;     // the section pills point at these ids; folding used to drop them
    h.replaceWith(d);
    d.appendChild(sum);
    body.forEach(b => d.appendChild(b));
  });
}

const pfSec = (id, title, hint, action, body, cls) => `<section class="pf-sec${cls ? ' ' + cls : ''}" id="${id}"><header><h2>${title}</h2><span class="hint">${hint || ''}</span>${action || ''}</header>${body}</section>`;

function tpTile(tr, n, c){

/* `under` puts a line straight after one assignment's own: the student interview sits under FOL, which it is evidence

    const m = sub.markers || {};

    const dayOf = x => { const d = new Date(x); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
    if (sub.sub1At) trail.push('submitted ' + dayOf(sub.sub1At));

    if (nf) trail.push(nf + ' passage' + (nf === 1 ? '' : 's') + ' found elsewhere, on the record');
    /* ONE DOOR PER ASSIGNMENT (Ramy, 19 Nov 2026: "if you click on it, you should be able to see it anyway. You don't need

  if (window.hubStackTables) hubStackTables($('app'));
  /* One document open at a time, under the tiles, with a bar that names it, jumps to its parts, prints it alone and closes it. */
  const PARTS = [[/tutor.s feedback/i, 'Feedback'], [/^lesson plan/i, 'Lesson plan'], [/procedure/i, 'Procedure'], [/language analysis/i, 'Language analysis'], [/self.?evaluation/i, 'Self-evaluation']];
  let pfHeads = [];
  const pfClose = () => { const sheet = $('pfSheet'); if (!sheet) return;
    sheet.querySelectorAll('.doc').forEach(x => { x.hidden = true; }); sheet.hidden = true;
    document.querySelectorAll('.pf-tp.on').forEach(x => { x.classList.remove('on'); x.setAttribute('aria-expanded', 'false'); const g = x.querySelector('.go'); if (g) g.textContent = g.dataset.t; }); };
  const pfOpen = (tile, d) => { const sheet = $('pfSheet'); pfClose();
    d.hidden = false; sheet.hidden = false; tile.classList.add('on'); tile.setAttribute('aria-expanded', 'true');
    const g = tile.querySelector('.go'); if (g) g.textContent = 'Close the document';
    pfHeads = []; const seen = {};
    [...d.querySelectorAll('h1,h2,h3')].forEach(h => { const p = PARTS.find(x => x[0].test(h.textContent.trim())); if (p && !seen[p[1]]) { seen[p[1]] = 1; pfHeads.push([p[1], h]); } });
    $('pfBar').innerHTML = `<span class="t">${esc(d.dataset.title || 'The document')}</span>` + (pfHeads.length > 1 ? pfHeads.map((p, i) => `<button type="button" data-pfpart="${i}">${p[0]}</button>`).join('') : '')
      + '<button type="button" data-pfprint="1">Print this document</button><button type="button" data-pfclose="1">Close</button>'; };
  $('app').addEventListener('click', e => {
    const part = e.target.closest('[data-pfpart]');
    if (part) { const h = pfHeads[+part.dataset.pfpart]; if (h) hubScrollIntoView(h[1], 'start'); return; }
    if (e.target.closest('[data-pfclose]')) { const on = document.querySelector('.pf-tp.on'); pfClose(); if (on) on.focus(); return; }
    if (e.target.closest('[data-pfprint]')) {
      /* this document alone, on its landscape pages: everything else on the page stays out of the print */
      document.body.classList.add('pf-printone');
      const done = () => document.body.classList.remove('pf-printone');
      window.addEventListener('afterprint', done, { once: true });
      window.print(); return; }
    const b = e.target.closest('[data-doc]'); if (!b) return;
    const d = $('doc-' + b.dataset.doc); if (!d) return;
    if (b.dataset.doc === 'gtky') {
      d.hidden = !d.hidden; b.textContent = (d.hidden ? 'Show ' : 'Hide ') + 'the interview';
      if (!d.hidden && window.CONNECT_HUB_FOL && !d.dataset.wired) { d.dataset.wired = '1'; try { CONNECT_HUB_FOL.wirePlay(d); } catch (e) {} }
      return; }
    if (!d.hidden) { pfClose(); return; }
    pfOpen(b, d); hubScrollIntoView($('pfSheet'), 'start');
  });
  if (location.hash && /^#tp\d$/.test(location.hash)) { const b = document.querySelector(`[data-doc="${location.hash.slice(1)}"]`); if (b) b.click(); else { const el = $(location.hash.slice(1)); if (el) hubScrollIntoView(el, 'start'); } }
}

if (MODE !== 'assessor' && MODE !== 'tutor') {
  $('app').innerHTML = '<div class="panel"><div class="empty">Nothing to show — this page needs the assessor link (or the tutor link) to read the course.</div></div>';
} else if (WHO) {
  const tr = roster.trainees[WHO];
  if (tr) renderOne(tr); else $('app').innerHTML = '<div class="panel"><div class="empty">No trainee with that link on the course.</div></div>';
} else renderList();
</script>
</body>
</html>
