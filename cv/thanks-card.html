<!DOCTYPE html>
<html lang="en">
<head>
<!--
  The link card for the CV present (Ramy, 26 Oct 2026: "I meant the link itself ... how will they take it
  with them"). The picture a phone or an email shows for lite.celtaconnect.com/cv/ (share-card.jpg), drawn at 1200 x 630 like
  brand/share-card.html. The address is the same for everyone, so the picture names no one.
-->
<meta charset="UTF-8">
<title>CV present — link card</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Karla:wght@500;700&family=Instrument+Sans:wght@600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  html,body{margin:0; width:1200px; height:630px; overflow:hidden;}
  .card{position:relative; width:1200px; height:630px; box-sizing:border-box; padding:70px 84px; color:#2b2218; overflow:hidden;
    background:
      radial-gradient(900px 420px at 16% -60px, rgba(255,250,232,.9), rgba(255,250,232,0) 70%),
      radial-gradient(700px 520px at 108% 112%, rgba(140,98,38,.4), rgba(140,98,38,0) 70%),
      linear-gradient(135deg, #E9CF8C 0%, #D9B064 38%, #C9974A 70%, #B98543 100%);}
  .arcs{position:absolute; right:-70px; bottom:-80px; width:560px; opacity:.16;}
  .lockup{display:inline-flex; align-items:center; gap:14px; background:#FBF8F1; border-radius:20px; padding:11px 24px 11px 11px; box-shadow:0 2px 4px rgba(90,60,20,.18);}
  .tile{width:50px; height:50px; border-radius:12px; background:#f8f6f1; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .pair{display:inline-flex; align-items:baseline;}
  .word{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:38px; line-height:1; color:oklch(63% 0.096 72);}
  .lite{font-family:'Instrument Sans',sans-serif; font-weight:600; font-size:14.5px; line-height:1; letter-spacing:.24em; text-transform:uppercase; color:#2b2218; margin-left:7.2px;}
  .tag{position:absolute; right:84px; top:84px; font:700 17px 'Instrument Sans',sans-serif; letter-spacing:.2em; text-transform:uppercase; color:#4a3612; background:rgba(255,250,232,.6); border-radius:999px; padding:11px 20px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:84px; line-height:1.02; letter-spacing:-.015em; margin:58px 0 22px;}
  h1 i{font-style:italic;}
  p{font-family:'Karla',sans-serif; font-weight:500; font-size:30px; line-height:1.4; margin:0; color:#3d3020; max-width:820px;}
</style>
</head>
<body>
<div class="card">
  <svg class="arcs" viewBox="8 28 104 64" fill="none" aria-hidden="true"><path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="#fff" stroke-width="13" stroke-linecap="round"/><path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="#fff" stroke-width="13" stroke-linecap="round"/></svg>
  <span class="lockup"><span class="tile"><svg viewBox="8 28 104 64" width="33" height="20" fill="none" aria-hidden="true"><path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="#a8803f" stroke-width="13" stroke-linecap="round"/><path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="#2b2218" stroke-width="13" stroke-linecap="round"/></svg></span><span class="pair"><span class="word">Connect</span><span class="lite">Lite</span></span></span>
  <span class="tag">A thank-you</span>
  <h1>Thank you.<br><i>This one’s for you.</i></h1>
  <p>Connect CV: your teaching CV and cover letter, tailored to any job you choose.</p>
</div>
</body>
</html>
