<!DOCTYPE html>
<!--
  The handover — one big card per trainee for the tutor who takes the group next.
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 25 Oct 2026: "when trainers hand over, like they swap sort of halfway
  through, we usually kind of tell each other a little bit about the group that
  everyone is getting."

  REBUILT 22 Nov 2026, his words on the page of the day before (group tabs, chips,
  six headings, Draft it again / Change / Write it myself): "It's just extremely
  lame ... I don't think both trainers should actually see it. I think you only
  see yours ... There should not be a tab for it." "It needs to be just clear and
  simple ... an informal handover of things not necessarily criteria related, but
  more like personality related ... flags." "Make it a card ... 6 big cards, the
  name and ... a couple of paragraphs on the card. Anything flagged would be
  just like in red. That's it." "Color coded cards, depending on how well
  they're doing. The entire card." And: "Lite can get most of the information
  from the CELTA 5. Absences, stage 1 warnings, stage 2 warnings, fail letters,
  failed assignments, all of that is there."

  So: no tabs and no buttons. The page opens on the group coming to the tutor who
  is reading (by the classes on Course admin and the name on this device). Each
  card is a name, how the trainee is doing in a word with the whole card in its
  color, two short paragraphs (the teaching; the person), and the flags in red.
  The color and the flags are read from the record. The paragraphs are written
  by Lite from the returned feedback and the tutors' half of the CELTA 5 the
  first time the tutor handing over opens the page, and again when a new lesson's
  feedback is returned; that tutor clicks anywhere in a card to change or add to
  it (a text a tutor has changed is never written over), then presses Share. Only
  then does the next tutor see it ("click share to share with the other trainer.
  And then it will appear on the other trainer's card ... as soon as you finish
  stage 2 tutorials": the tutor's home shows the line then).

  WHERE IT IS KEPT. In the trainee's staffLinks record, as an entry
  { handover: true, summary: { text, person, by, at, n } }: the one kind the
  store never hands to a trainee's token (v30), so a trainee never sees it.

  Tutors only. The assessor has the pack; a trainee has their own record.
-->

<body>
<div class="wrap">
  <a class="back" href="5_tutor_dashboard.html">Back</a>
  <div id="app"><p class="lede">Loading the course…</p></div>
</div>
<script src="hub-shared.js?v=202611271332"></script>
<script src="hub-store.js?v=202611271332"></script>
<script src="hub-say.js?v=202611271332"></script>
<script src="hub-rotation.js?v=202611271332"></script>

<script>
/* Whose room this is: the tutors'. hub-sync.js sets HubMode, which the gate reads;
   without it the room opened for a trainee (the pre-push check caught it, 25 Oct 2026). */
if (window.hubTutorRoomOnly && hubTutorRoomOnly()) { /* refused; hubTutorRoomOnly drew the room */ }
else (async function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const bare = s => String(s == null ? '' : s).replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
  const S = window.HubStore;
  let course, roster;
  try {
    const [c, r] = await Promise.all([S.call({ op: 'course' }), S.call({ op: 'roster' })]);
    course = c || {}; roster = Object.values((r && r.trainees) || {}).filter(Boolean);
  } catch (e) { $('app').innerHTML = '<p class="lede">The course could not be read: ' + esc(e.message) + '</p>'; return; }
  const cs = course.settings || {};
  const tz = cs.timeZone || undefined;
  const tpCount = parseInt(cs.tpCount, 10) || 8, half = Math.floor(tpCount / 2) + 1;
  const tutors = (() => { let n = []; try { n = window.hubTutorNames ? hubTutorNames(cs) : []; } catch (e) {} return Array.isArray(n) ? n : []; })();
  const groups = [...new Set(roster.filter(t => !((t.records || {}).tracker || {}).withdrawn).map(t => String(t.group || '')).filter(Boolean))].sort();
  const fmtDay = s => { try { s = String(s || ''); return /T/.test(s) ? new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: tz }).format(new Date(s)) : new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).format(hubDateOf(s)); } catch (e) { return s; } };
  const first = n => String(n || '').trim().split(/\s+/)[0] || '';
  const AS = { fol: 'Focus on the Learner', lrt: 'Language Related Tasks', lsrt: 'Language Skills Related Tasks', lfc: 'Lessons from the Classroom' };
  const STAGE = { above: 'Above standard', to: 'To standard', below: 'Not to standard', not: 'Not to standard' };

  /* WHO IS READING, AND WHICH GROUP IS THEIRS. The classes on Course admin say who has each group before and after the
     change; the name on this device says who is reading. The page opens on the group coming to them. */
  let me = ''; try { me = (localStorage.getItem('chub:tutorName') || '').trim().toLowerCase(); } catch (e) {}
  const isMe = n => { n = String(n || '').trim().toLowerCase(); return !!(me && n && (n === me || first(n) === first(me))); };
  const changes = [];   /* { group, from, to, tp, day } */
  groups.forEach(g => { const b = window.hubClassBlocks ? hubClassBlocks(cs, g) : null; if (!b || b.length < 2) return;
    const starts = window.hubClassStarts ? hubClassStarts(cs, g, course.timetable) : [];
    for (let i = 1; i < b.length; i++) if (String(b[i].k.tutor || '') !== String(b[i - 1].k.tutor || '')) changes.push({ group: g, from: b[i - 1].k.tutor || '', to: b[i].k.tutor || '', tp: b[i].from, day: starts[i] || '' }); });
  const today = (window.hubToday && hubToday()) || new Date().toISOString().slice(0, 10);
  const soonest = list => list.slice().sort((a, b) => String(a.day).localeCompare(String(b.day))).find(c => !c.day || c.day >= today) || list[list.length - 1];
  const urlG = new URLSearchParams(location.search).get('group');
  /* SHARED IS A STAMP ON EVERY CARD (Ramy, 22 Nov 2026: "click share to share with the other trainer. And then it will
     appear on the other trainer's card"). Until the tutor handing over shares it, the next tutor does not see it. */
  const groupList = g => roster.filter(t => String(t.group || '') === g && !((t.records || {}).tracker || {}).withdrawn);
  function sharedOf(c){ if (!c) return null; const st = groupList(c.group).map(t => ((((t.records || {}).staffLinks || []).find(x => x && x.handover)) || {}).handed).filter(Boolean).sort((a, b) => String(b.at).localeCompare(String(a.at))); return st[0] || null; }
  const mineIn = changes.filter(c => isMe(c.to)), mineOut = changes.filter(c => isMe(c.from));
  let change = (urlG && (changes.filter(c => c.group === urlG).length ? soonest(changes.filter(c => c.group === urlG)) : null))
    || (!urlG && ((sharedOf(soonest(mineIn)) && soonest(mineIn)) || soonest(mineOut) || soonest(mineIn) || soonest(changes))) || null;
  const group = (urlG && groups.includes(urlG)) ? urlG : (change ? change.group : (groups[0] || ''));

  /* ---- the record, read ---- */
  const codesOf = h => { const c = []; String(h || '').replace(/data-c="([^"]+)"/g, (m, x) => { c.push(String(x).toLowerCase()); return m; }); return c; };
  const wordsOf = h => String(h || '').replace(/<span[^>]*class="tag"[^>]*>[\s\S]*?<\/span>/g, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&[a-z]+;/g, ' ').replace(/^[\s•\-]+/, '').replace(/\s+/g, ' ').trim();
  /* Only RETURNED feedback is read: a feedback still being written is not a lesson yet. */
  function lessonsOf(t){
    const R = t.records || {}, H = Object.assign({}, R.tpHistory || {});
    if (R.feedback && R.feedback.status === 'returned' && R.feedback.state) { const n = String((R.feedback.state.f || {}).fTP || '').replace(/\D/g, ''); if (n && !H[n]) H[n] = R.feedback; }
    return Object.keys(H).filter(k => /^\d+$/.test(k) && H[k] && H[k].state && H[k].state.f).sort((a, b) => a - b).map(k => { const st = H[k].state, L = st.lists || {};
      const pts = ids => ids.reduce((a, id) => a.concat((L[id] || []).map(x => wordsOf(x && (x.html || x.t || x.text || ''))).filter(Boolean)), []);
      const codes = [...new Set(['lAP', 'lAT'].reduce((a, id) => a.concat((L[id] || []).reduce((b, x) => b.concat(codesOf(x && x.html)), [])), []))];
      return { n: +k, grade: String(st.f.fGrade || '').trim(), codes, S: pts(['lSP', 'lST']), A: pts(['lAP', 'lAT']), overall: String(st.f.tOverall || '').trim() }; });
  }
  const tpList = a => a.length === 1 ? 'TP' + a[0] : a.slice(0, -1).map(n => 'TP' + n).join(', ') + ' and TP' + a[a.length - 1];
  const rowSay = r => [r.date, r.session].map(x => String(x || '').trim()).filter(Boolean).join(', ');
  /* THE FLAGS AND THE COLOR, FROM THE RECORD (the lessons' grades, the tutors' half of the CELTA 5, the letters, the
     assignments). Nothing here is written by Lite: each line is something a tutor recorded. */
  function standing(t){
    const R = t.records || {}, lessons = lessonsOf(t), A = R.assignments || {}, c5t = R.celta5t || {}, tr = R.tracker || {}, s2 = c5t.stage2 || {}, att = c5t.attendance || {};
    const flags = [];   /* [text, plain?] */
    const notTo = lessons.filter(l => /^(Not to|Below) standard$/.test(l.grade)).map(l => l.n), above = lessons.filter(l => l.grade === 'Above standard').length;
    if (notTo.length) flags.push([tpList(notTo) + ' not to standard']);
    const s2bad = !!(s2.returnedAt && (s2.overall === 'below' || s2.overall === 'not'));
    if (s2bad) flags.push(['Stage 2: not to standard']);
    if (tr.failLetter) flags.push(['Fail warning letter issued ' + tr.failLetter + ((R.celta5 || {}).failLetterSigned ? ', signed' : ', not yet signed')]);
    if (tr.malpracticeLetter) flags.push(['Malpractice warning issued ' + tr.malpracticeLetter + ((R.celta5 || {}).malpracticeLetterSigned ? ', signed' : ', not yet signed')]);
    let failed = 0, resub = 0;
    Object.keys(AS).concat(A.a5 ? ['a5'] : []).forEach(k => { const a = A[k], name = AS[k] || 'Assignment 5'; if (!a) return; const out = (a.feedback && a.feedback.outcome) || '';
      if (a.stage === 'closed' && /^Fail/.test(out)) { failed++; flags.push([name + ': ' + out.charAt(0).toLowerCase() + out.slice(1)]); }
      else if (a.stage === 'resubmission_needed') { resub++; flags.push([name + ': resubmission out']); } });
    const abs = (att.rows || []).filter(r => r && rowSay(r)), oth = (att.other || []).filter(r => r && rowSay(r));
    if (abs.length) flags.push([abs.length <= 2 ? 'Absent: ' + abs.map(rowSay).join('; ') : 'Absent ' + abs.length + ' times']);
    if (oth.length) flags.push([oth.length <= 2 ? 'Late or absent without notice: ' + oth.map(rowSay).join('; ') : 'Late or absent without notice ' + oth.length + ' times']);
    const sp = ((R.agreement || {}).special) || {};
    if (sp.needs) flags.push(['Special needs on the agreement: ' + bare(sp.text), true]);
    /* WHICH COLOR (Ramy, 22 Nov 2026): red is not to standard at Stage 2, two lessons not to standard, or a warning letter;
       green is above standard at Stage 2 (before Stage 2, two lessons above standard); white is to standard. "The yellow
       one is the tricky one ... from the feedback, just being constantly weak ... maybe same action points": one lesson not
       to standard, an assignment failed or out for resubmission ("a bit of a warning"), late or absent without notice three
       times, or two criteria that each come back in the action points of three lessons or more. */
    const seen = {}; lessons.forEach(l => l.codes.forEach(c => { seen[c] = (seen[c] || 0) + 1; }));
    /* two things that will not go away, not one: on a real course one criterion comes back for most trainees */
    const stuck = Object.keys(seen).filter(c => seen[c] >= 3).length >= 2;
    const level = !lessons.length ? 'none'
      : (tr.failLetter || tr.malpracticeLetter || notTo.length >= 2 || s2bad) ? 'risk'
      : (notTo.length || failed || resub || oth.length >= 3 || stuck) ? 'support'
      : ((s2.returnedAt ? s2.overall === 'above' : above >= 2)) ? 'strong' : 'ok';
    return { lessons, flags, level };
  }
  const HOW = { strong: 'Doing very well', ok: 'On track', support: 'Needs support', risk: 'At risk', none: 'No lesson returned yet' };

  const handOf = t => (((t.records || {}).staffLinks || []).find(x => x && x.handover)) || null;
  async function saveHand(t, patch){
    const links = ((t.records || {}).staffLinks || []), cur = links.find(x => x && x.handover) || { handover: true, text: '' };
    const next0 = Object.assign({}, cur, patch);
    const keep = !!(String(next0.text || '').trim() || (next0.summary && String((next0.summary.text || '') + (next0.summary.person || '')).trim()) || next0.handed);
    const next = links.filter(x => x && !x.handover).concat(keep ? [next0] : []);
    await S.put('staffLinks', next, t.token);
    t.records = t.records || {}; t.records.staffLinks = next;
  }
  /* The trainee's own pronouns from About you; where they left that empty, their answer to the question beside it
     (woman: she, man: he); anything else, the name is repeated. Only the word she, he or they is sent. */
  const pronounOf = t => { const ab = (t.records || {}).about || {}, p = String(ab.pronouns || '').trim().toLowerCase();
    if (/^she\b/.test(p)) return 'she'; if (/^he\b/.test(p)) return 'he'; if (/^they\b/.test(p)) return 'they';
    const g = String(ab.gender || '').toLowerCase(); return g === 'woman' ? 'she' : g === 'man' ? 'he' : ''; };
  function factsFor(t){
    const R = t.records || {}, st = standing(t), c5t = R.celta5t || {}, s1 = c5t.stage1 || {}, s2 = c5t.stage2 || {}, att = c5t.attendance || {};
    const cut = (x, n) => bare(x).slice(0, n);
    return { lessons: st.lessons.map(l => ({ tp: l.n, grade: l.grade, strengths: l.S.map(p => p.slice(0, 300)).slice(0, 8), actions: l.A.map(p => p.slice(0, 300)).slice(0, 8), overall: l.overall.slice(0, 900) })),
      assignments: [], stage2: (s2.returnedAt && STAGE[s2.overall]) || '',
      stage1: s1.returnedAt ? { strengths: cut(s1.strengths, 900), actionPlan: cut(s1.actionPlan, 900) } : null,
      stage2Notes: s2.returnedAt ? cut([s2.summary, s2.notesOther, s2.notesWA].filter(Boolean).join(' '), 1200) : '',
      record: st.flags.map(f => f[0].slice(0, 200)),
      absences: (att.rows || []).concat(att.other || []).map(r => cut([r.date, r.session, r.reason, r.tutor].filter(Boolean).join(', '), 200)).filter(Boolean).slice(0, 10) };
  }
  async function draftOne(t){
    const f = factsFor(t); if (!f.lessons.length) return false;
    const r = await S.call(Object.assign({ op: 'handoverWords', pronoun: pronounOf(t) }, f));
    const nm = first(t.name) || 'The trainee', tidy = x => String(x || '').replace(/\bNAME\b/g, nm).replace(/\s+/g, ' ').trim();
    const text = tidy(r && r.text), person = tidy(r && r.person);
    if (!text) return false;
    await saveHand(t, { summary: { text, person, at: new Date().toISOString(), by: 'Lite', n: f.lessons.length } });
    return true;
  }
  /* Lite writes a card when it has none, and again when a lesson has been returned since. A tutor's own words are left. */
  const wants = t => { const n = lessonsOf(t).length, sm = (handOf(t) || {}).summary; if (!n) return false;
    return !(sm && String(sm.text || '').trim()) || (sm.by === 'Lite' && (sm.n || 0) < n); };

  const list = groupList(group);
  const cNow = change && change.group === group ? change : null;
  const coming = !!(cNow && isMe(cNow.to) && !isMe(cNow.from));   /* reading what was shared: nothing to change */
  const failedDraft = {};
  function card(t){
    const st = standing(t), hand = handOf(t), sm = (hand && hand.summary) || {};
    const has = String(sm.text || '').trim();
    const words = has ? '<p>' + esc(sm.text) + '</p>' + (String(sm.person || '').trim() ? '<p>' + esc(sm.person) + '</p>' : '')
      : !st.lessons.length ? '<p class="wait">Nothing to say yet: no lesson has been returned.</p>'
      : failedDraft[t.token] ? '<p class="wait">Lite could not write this just now. Click here to write it yourself.</p>'
      : '<p class="wait">Lite is reading the feedback…</p>';
    const own = hand && String(hand.text || '').trim() ? '<p class="own">' + esc(hand.text) + (hand.by ? ' (' + esc(first(hand.by)) + ')' : '') + '</p>' : '';
    return `<article class="tr ${st.level}" data-token="${esc(t.token)}">
      <header><h2>${esc(t.name)}</h2><span class="how">${HOW[st.level]}</span></header>
      <div class="words${coming ? ' ro' : ''}" ${st.lessons.length && !coming ? 'data-edit="' + esc(t.token) + '" title="Click to change"' : ''}>${words}${own}</div>
      ${st.flags.length ? '<div class="flags">' + st.flags.map(f => `<p${f[1] ? ' class="plain"' : ''}>${esc(f[0])}</p>`).join('') + '</div>' : ''}
    </article>`;
  }
  function draw(){
    const c = cNow, shared = sharedOf(c);
    const title = !group ? 'Handover' : coming && c.from ? 'Group ' + esc(group) + ', from ' + esc(first(c.from)) : c && c.to ? 'Group ' + esc(group) + ', for ' + esc(first(c.to)) : 'Group ' + esc(group);
    const when = c ? (coming ? 'Yours' : 'With ' + esc(first(c.to) || 'the next tutor')) + ' from TP' + c.tp + (c.day ? ', ' + esc(fmtDay(c.day)) : '') + '.' : '';
    const n = list.length, count = n + ' trainee' + (n === 1 ? '' : 's') + '.';
    const toName = esc(first(c && c.to) || 'the next tutor');
    /* the other group is one quiet line, never a tab */
    const others = groups.filter(g => g !== group).map(g => { const oc = soonest(changes.filter(x => x.group === g)) || null;
      const say = oc && isMe(oc.from) ? 'You hand Group ' + esc(g) + ' over to ' + esc(first(oc.to) || 'the next tutor') + '.' : oc && isMe(oc.to) ? 'Group ' + esc(g) + ' comes to you' + (sharedOf(oc) ? '.' : ', once ' + esc(first(oc.from) || 'its tutor') + ' shares it.') : 'Group ' + esc(g) + '.';
      return say + ((oc && isMe(oc.to) && !isMe(oc.from) && !sharedOf(oc)) ? '' : ' <a href="?group=' + encodeURIComponent(g) + '">Read its cards</a>'); });
    const foot = others.length ? '<p class="other">' + others.join('<br>') + '</p>' : '';
    if (coming && !shared) {
      $('app').innerHTML = `<p class="k">Handover</p><h1>${title}</h1>
        <p class="lede">${count} ${when} ${esc(first(c.from) || 'Their tutor')} has not shared the handover yet. It comes after the Stage 2 tutorials.</p>${foot}`;
      return;
    }
    $('app').innerHTML = `
      <p class="k">Handover</p>
      <h1>${title}</h1>
      <p class="lede">${count} ${when}${coming ? ' Shared by ' + esc(first(shared.by) || first(c.from)) + ', ' + esc(fmtDay(shared.at)) + '.' : ' Click anywhere inside a card to change it or add to it.'}</p>
      ${coming || !n ? '' : `<div class="share">${shared ? '<span class="done">Shared with ' + esc(first(shared.to) || toName) + ', ' + esc(fmtDay(shared.at)) + '. What you change now shows on their side too.</span>'
        : '<button type="button" id="share">Share with ' + toName + '</button><span class="saved" id="shareMsg">' + toName + ' sees nothing until you share it.</span>'}</div>`}
      <div class="grid">${n ? list.map(card).join('') : '<p class="empty-group">Nobody is on this group yet.</p>'}</div>
      ${foot}`;
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(b.dataset.edit));
    const sb = $('share');
    if (sb) sb.onclick = async () => {
      let by = ''; try { by = (localStorage.getItem('chub:tutorName') || '').trim(); } catch (e) {}
      const at = new Date().toISOString(), msg = $('shareMsg'); sb.disabled = true; msg.textContent = 'Sharing…';
      try { for (const t of list) await saveHand(t, { handed: { by: by || (c && c.from) || 'Tutor', to: (c && c.to) || '', at } }); draw(); }
      catch (e) { msg.textContent = 'Not shared: ' + e.message; sb.disabled = false; }
    };
  }
  /* one box, the two paragraphs with an empty line between them; what a tutor saves is theirs and Lite leaves it */
  function edit(token){
    const t = roster.find(x => x.token === token); if (!t) return;
    const box = document.querySelector('.tr[data-token="' + token + '"] .words'); if (!box || box.querySelector('textarea')) return;
    const sm = (handOf(t) || {}).summary || {};
    box.onclick = null; box.removeAttribute('title'); box.style.cursor = 'auto';
    box.innerHTML = `<textarea placeholder="How the teaching is going. Then an empty line, and what the next tutor should know about the person.">${esc([sm.text, sm.person].map(x => String(x || '').trim()).filter(Boolean).join('\n\n'))}</textarea>
      <div class="row"><button type="button" data-save="1">Save</button><button type="button" class="quiet" data-cancel="1">Cancel</button><span class="saved"></span></div>`;
    const ta = box.querySelector('textarea'); ta.focus();
    box.querySelector('[data-cancel]').onclick = e => { e.stopPropagation(); draw(); };
    box.querySelector('[data-save]').onclick = async e => { e.stopPropagation();
      const parts = ta.value.split(/\n\s*\n/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean), msg = box.querySelector('.saved'); msg.textContent = 'Saving…';
      let by = ''; try { by = (localStorage.getItem('chub:tutorName') || '').trim(); } catch (e2) {}
      try { await saveHand(t, { summary: parts.length ? { text: parts[0], person: parts.slice(1).join(' '), at: new Date().toISOString(), by: by || tutors[0] || 'Tutor', n: lessonsOf(t).length } : null }); draw(); }
      catch (err) { msg.textContent = 'Not saved: ' + err.message; } };
  }
  draw();
  for (const t of (coming ? [] : list.filter(wants))) {
    let ok = false; try { ok = await draftOne(t); } catch (e) {}
    if (!ok) failedDraft[t.token] = 1;
    if (!document.querySelector('.words textarea')) draw();
    else { const w = document.querySelector('.tr[data-token="' + t.token + '"] .words'); if (w && !w.querySelector('textarea')) { const d = document.createElement('div'); d.innerHTML = card(t); w.closest('.tr').replaceWith(d.firstElementChild); document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => edit(b.dataset.edit)); } }
  }
})();
</script>
</body>
</html>
