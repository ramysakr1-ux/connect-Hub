<!DOCTYPE html>
<!--
  Connect Lite — materials shared with the students
  © 2026 Ramy Sakr. All rights reserved.
  What the tutors and the trainees have shared with the volunteer students: the
  tutors' demonstration lesson and activities, and each trainee's handouts for
  their own teaching practice. Ramy, 25 Oct 2026: it is not the trainee's own
  work, so it is not a list on their home but a card of its own, in its own
  colour; inside, two cards, the tutors' and the classmates', and the
  classmates' are sorted by TP and by who shared them, as the volunteer
  students' own page groups them. Trainees, tutors and the assessor read it;
  a volunteer student has their own page. A trainee can stop sharing their own.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Materials shared with the students</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202610262313">
<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:36px 20px 90px; display:flex; justify-content:center;}
  .board{max-width:var(--doc-width, 1120px); width:100%;}
  a{color:var(--teal);}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .title{border-top:4px solid var(--a-slate, var(--teal)); padding-top:22px;}
  .title h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.9rem; line-height:1.15;}
  .title p{margin:7px 0 0; font-size:0.92rem; color:var(--grey); line-height:1.55; max-width:720px;}
  /* Two cards, in the slate that marks other people's material (the home's card wears it too). */
  .mcard{margin-top:22px; background:var(--paper); border-radius:var(--r-card, 14px); box-shadow:var(--nb-shadow), inset 0 4px 0 var(--a-slate, var(--teal)); overflow:hidden;}
  .mcard > summary{list-style:none; cursor:pointer; padding:20px 24px; display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .mcard > summary::-webkit-details-marker{display:none;}
  .mcard > summary h2{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.3rem; color:var(--a-slate, var(--ink));}
  .mcard > summary .sub{font-size:0.85rem; color:var(--grey);}
  .mcard > summary .open{font-size:0.82rem; font-weight:700; color:var(--teal);}
  .mcard[open] > summary .open::before{content:'Close';} .mcard:not([open]) > summary .open::before{content:'Open';}
  .mcard .inner{padding:0 24px 20px;}
  .tp{margin-top:12px;} .tp > h3{margin:0 0 6px; font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--a-slate, var(--grey)); font-weight:700;}
  .who{background:var(--sand); border-radius:10px; padding:10px 14px; margin:8px 0;}
  .who > b{display:block; font-size:0.9rem; margin-bottom:4px;}
  .row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding:6px 0; border-top:1px solid var(--row-line);}
  .row:first-of-type{border-top:0;}
  .row a{font-weight:600; text-decoration:none;} .row a:hover{text-decoration:underline;}
  .row .meta{font-size:0.8rem; color:var(--grey);}
  .row .rm{margin-left:auto; font:inherit; font-size:0.78rem; font-weight:600; color:var(--grey); background:none; border:1px solid var(--sand-line); border-radius:999px; padding:3px 10px; cursor:pointer;}
  .empty{color:var(--grey); font-size:0.92rem; padding:4px 0 6px;}
  .note{font-size:0.82rem; color:var(--grey); margin:16px 0 0;}
</style>
<link rel="stylesheet" href="hub-house.css?v=202610262313">
</head>
<body>
<div class="board">
  <a class="back" id="back" href="index.html">Back</a>
  <div id="app"></div>
</div>
<script src="hub-shared.js?v=202610262313"></script>
<script src="hub-store.js?v=202610262313"></script>
<script src="hub-say.js?v=202610262313"></script>
<script src="hub-sync.js?v=202610262313"></script>
<script src="hub-notebook.js?v=202610262313"></script>
<script type="text/x-hub-app">
/* A volunteer student has their own page with these materials on it. */
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose — this is one of the course’s own pages.');
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const rec = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const IS_TRAINEE = !!(window.HubStore && HubStore.isTrainee && HubStore.isTrainee());
if (!IS_TRAINEE) $('back').href = (window.HubStore && HubStore.isAssessor && HubStore.isAssessor()) ? '12_assessor_pack.html' : '5_tutor_dashboard.html';
const TUTOR_KINDS = { demo: 1, gtky: 1, course: 1 };
const myName = () => (localStorage.getItem('hub:name') || '').trim();
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
const tpOf = x => { const m = String(x.tp || '').match(/\d+/) || String(x.name || '').match(/\bTP\s*(\d+)/i); return m ? +(m[1] || m[0]) : 0; };
let OPEN = { tutors: false, peers: true }, BUSY = false, NOTE = '';

function row(x, mine){
  return `<div class="row"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.name)}</a>
    <span class="meta">${x.at ? esc(when(x.at)) : ''}${host(x.url) ? ' · ' + esc(host(x.url)) : ''}</span>
    ${mine ? `<button class="rm" type="button" data-rm="${esc(x.id)}">Stop sharing</button>` : ''}</div>`;
}
function render(){
  const all = (rec('connect_shared_v1') || []).filter(x => x && x.url && x.name);
  const tutors = all.filter(x => TUTOR_KINDS[x.kind || 'course']).slice().sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
  const peers = all.filter(x => x.kind === 'materials');
  const me = myName();
  /* by TP, newest first; inside a TP, by who shared it */
  const byTp = {};
  peers.forEach(x => { const n = tpOf(x); (byTp[n] = byTp[n] || {}); const who = x.by || 'Someone'; (byTp[n][who] = byTp[n][who] || []).push(x); });
  const tps = Object.keys(byTp).map(Number).sort((a, b) => b - a);
  const peerWord = IS_TRAINEE ? 'your classmates' : 'the trainees';
  const peersHTML = tps.length ? tps.map(n => `<div class="tp"><h3>${n ? 'TP ' + n : 'Other'}</h3>${
      Object.keys(byTp[n]).sort((a, b) => a.localeCompare(b)).map(who => `<div class="who"><b>${esc(who)}${IS_TRAINEE && who === me ? ' (you)' : ''}</b>${
        byTp[n][who].map(x => row(x, IS_TRAINEE && who === me)).join('')}</div>`).join('')}</div>`).join('')
    : `<p class="empty">Nothing shared by ${peerWord} yet. A trainee shares a handout from their own lesson plan.</p>`;
  const tutorsHTML = tutors.length ? tutors.map(x => row(x, false)).join('') : '<p class="empty">Nothing shared by the tutors yet.</p>';
  $('app').innerHTML = `<div class="title"><h1>Materials shared with the students</h1>
      <p>Handouts and links the tutors and ${peerWord} have shared with the volunteer students. The volunteer students see them on their own page too. This is other people’s material, to look at; your own work is on your home.</p></div>
    <details class="mcard" data-k="tutors"${OPEN.tutors ? ' open' : ''}><summary><h2>Shared by the tutors</h2><span class="sub">${tutors.length} item${tutors.length === 1 ? '' : 's'}</span><span class="open"></span></summary>
      <div class="inner">${tutorsHTML}</div></details>
    <details class="mcard" data-k="peers"${OPEN.peers ? ' open' : ''}><summary><h2>Shared by ${peerWord}</h2><span class="sub">${peers.length} item${peers.length === 1 ? '' : 's'}${tps.length ? ' · by TP and by who shared them' : ''}</span><span class="open"></span></summary>
      <div class="inner">${peersHTML}</div></details>
    ${NOTE ? `<p class="note" aria-live="polite">${esc(NOTE)}</p>` : ''}`;
  $('app').querySelectorAll('details.mcard').forEach(d => d.addEventListener('toggle', () => { OPEN[d.dataset.k] = d.open; }));
  $('app').querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => stop(b.dataset.rm)));
}
async function stop(id){
  if (BUSY) return;
  const ok = window.confirmModal ? await confirmModal('Stop sharing this? The other trainees and the volunteer students will no longer see it.', 'Stop sharing') : confirm('Stop sharing this?');
  if (!ok) return;
  BUSY = true; NOTE = 'Stopping…'; render();
  try {
    const body = { op: 'unshareMaterial', id: id };
    const tok = window.HubStore && HubStore.token && HubStore.token(); if (tok) body.token = tok;
    const r = await window.HubStore.call(body);
    if (r && r.shared) localStorage.setItem('connect_shared_v1', JSON.stringify(r.shared));
    NOTE = 'No longer shared.';
  } catch (e) { NOTE = 'Still shared — ' + (e && e.message || e); }
  BUSY = false; render(); setTimeout(() => { NOTE = ''; render(); }, 2600);
}
render();
document.addEventListener('hub:ready', render);
</script>
</body>
</html>
