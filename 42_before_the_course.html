<!DOCTYPE html>
<!--
  Before the course — what the center's interviewer saw, one card per trainee.
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 14 Nov 2026, on the Course menu's Candidate folders link, which only opened Drive: "How can we utilize this? It
  needs to have those substantial added value, otherwise we don't need it."

  Everything on a card is read from the candidate's own folder at the center (application form, pre-interview task,
  the interviewer's assessment) by the store's folderRead, when a tutor presses Read the folders on Course admin, and
  kept in the tutors-only record `intake` ({ card, files, description }). Nothing here is written by Lite on its own:
  strengths and things to watch are the interviewer's. The files stay in the center's Drive; each opens from the card.

  Below the cards, a short description of each trainee for the assessor, drafted from the same files. A tutor changes
  any of it; it is saved when the box is left, and Copy them all puts them on the clipboard for the center's own
  Candidate descriptions document.

  The same card is a closed line on the TP feedback cards (hub-shared.js hubBeforeFold).
  Tutors only: the store never sends `intake` to a trainee or to the assessor.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Before the course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Karla:wght@400;500;600;700&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202611142115">
<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);}
  .wrap{max-width:980px; margin:0 auto; padding:32px 20px 90px;}
  .back{display:inline-block; margin-bottom:14px; font-weight:600; font-size:.9rem; color:var(--teal); text-decoration:none;}
  .back:hover{text-decoration:underline;}
  .k{font-family:'Instrument Sans','Karla',sans-serif; font-weight:600; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--brick); margin:0 0 6px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:32px; line-height:1.08; margin:0 0 8px;}
  h2.sec{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:24px; margin:38px 0 6px;}
  .lede{color:var(--grey); font-size:15px; line-height:1.5; margin:0 0 20px; max-width:680px;}
  .none{background:var(--paper); border:1px dashed var(--sand-line); border-radius:var(--r-card); padding:22px; color:var(--grey); font-size:15px; line-height:1.55; max-width:680px;}
  .none a, .lede a{color:var(--teal); font-weight:700;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; align-items:start;}
  .tr{background:var(--paper); border-radius:var(--r-card); box-shadow:var(--nb-shadow); padding:18px 20px 16px; border-top:3px solid var(--teal); break-inside:avoid; min-width:0;}
  .tr.amber{border-top-color:var(--a-mustard);}
  .tr header{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .tr h2{font-family:'Newsreader',Georgia,serif; font-size:21px; font-weight:700; margin:0;}
  .letter{font-family:'Instrument Sans','Karla',sans-serif; font-weight:600; font-size:12px; color:var(--grey); background:var(--sand); border-radius:6px; padding:3px 8px; white-space:nowrap;}
  .tr .k{margin:14px 0 4px; font-size:10.5px; letter-spacing:.2em; color:var(--grey);}
  .tr p.txt{margin:10px 0 0; font-size:14px; line-height:1.5;}
  .saw, .watch{margin:12px 0 0; padding:10px 12px; border-radius:10px; font-size:14px; line-height:1.45;}
  .saw{background:oklch(95% 0.035 145); border-left:3px solid oklch(62% 0.1 145);}
  .watch{background:oklch(95% 0.035 85); border-left:3px solid var(--a-mustard);}
  .saw .k, .watch .k{margin:0 0 4px;} .saw .k{color:oklch(40% 0.08 145);} .watch .k{color:var(--ink);}
  ul{margin:0; padding-left:16px;}
  .files{list-style:none; padding:0; margin:0; font-size:13.5px; line-height:1.7;}
  .files a{color:var(--teal); font-weight:600; text-decoration:none; overflow-wrap:anywhere;} .files a:hover{text-decoration:underline;}
  .wait{margin:12px 0 0; color:var(--grey); font-size:13.5px; font-style:italic;}
  .desc{background:var(--paper); border-radius:var(--r-card); box-shadow:var(--nb-shadow); padding:16px 20px; margin:0 0 12px; border-top:3px solid var(--teal);}
  .desc b{font-family:'Newsreader',Georgia,serif; font-size:18px;}
  .desc textarea{display:block; width:100%; min-height:86px; margin-top:8px; font:inherit; font-size:14.5px; line-height:1.5; color:var(--ink); background:var(--field); border:1px solid var(--sand-line); border-radius:10px; padding:10px 12px; resize:vertical;}
  .desc textarea:focus{outline:2px solid var(--teal); outline-offset:1px;}
  .desc .saved{display:block; min-height:1.2em; margin-top:4px; font-size:12.5px; color:var(--grey);}
  .bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:0 0 14px;}
  .bar button{font:inherit; font-weight:700; font-size:13.5px; padding:9px 16px; border-radius:999px; border:1px solid var(--sand-line); background:var(--paper); color:var(--teal); cursor:pointer;}
  .bar span{font-size:13px; color:var(--grey);}
  @media (max-width:480px){ .wrap{padding:22px 16px 70px;} h1{font-size:27px;} .desc textarea{min-height:150px;} }
  @media print{ body{background:var(--paper);} .wrap{max-width:none; padding:0;} .back, .bar{display:none !important;} .tr, .desc{box-shadow:none; border:1px solid var(--sand-line); border-top:3px solid var(--teal);} }
</style>
<link rel="stylesheet" href="hub-house.css?v=202611142115">
</head>
<body>
<div class="wrap">
  <a class="back" href="5_tutor_dashboard.html">Back</a>
  <div id="app"><p class="lede">Loading the course…</p></div>
</div>
<script src="hub-shared.js?v=202611142115"></script>
<script src="hub-store.js?v=202611142115"></script>
<script src="hub-say.js?v=202611142115"></script>
<script src="hub-sync.js?v=202611142115"></script>
<script>
if (window.hubTutorRoomOnly && hubTutorRoomOnly()) { /* refused; hubTutorRoomOnly drew the room */ }
else (async function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const S = window.HubStore;
  let course, roster;
  try {
    const [c, r] = await Promise.all([S.call({ op: 'course' }), S.call({ op: 'roster' })]);
    course = c || {}; roster = Object.values((r && r.trainees) || {}).filter(t => t && t.token && !t.withdrawn);
  } catch (e) { $('app').innerHTML = '<p class="lede">The course could not be read: ' + esc(e.message) + '</p>'; return; }
  roster.sort((a, b) => String(a.group || '').localeCompare(String(b.group || '')) || String(a.name || '').localeCompare(String(b.name || '')));
  const cs = course.settings || {};
  const top = String(((cs.docs || {}).docApplications) || '').trim();
  const EXP = { none: 'No language teaching yet', some: 'Under a year of language teaching', year: 'A year or more of language teaching' };
  const aboutOf = t => Object.assign({}, (t.records || {}).about || {});
  const folderOf = t => (((t.records || {}).staffLinks || []).find(l => l && l.url && (l.from === 'folder' || l.label === 'Application folder')) || {}).url || '';
  const before = t => window.hubBeforeOf(t);
  const read = roster.filter(t => { const b = before(t); return b && b.has; });

  function card(t){
    const b = before(t), a = aboutOf(t), f = folderOf(t), c = (b && b.card) || {};
    const facts = [EXP[a.experience], a.firstLanguage ? 'First language ' + a.firstLanguage : ''].filter(Boolean).join(' · ');
    const files = (b && b.files) || [];
    return `<article class="tr${(c.concerns || []).length ? ' amber' : ''}">
      <header><h2>${esc(t.name)}</h2>${t.group ? `<span class="letter">Group ${esc(t.group)}</span>` : ''}</header>
      ${b && b.has ? `
        ${facts ? `<p class="txt"><b>${esc(facts)}</b></p>` : ''}
        ${c.background ? `<p class="txt">${esc(c.background)}</p>` : ''}
        ${(c.strengths || []).length ? `<div class="saw"><p class="k">The interviewer saw</p><ul>${c.strengths.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
        ${(c.concerns || []).length ? `<div class="watch"><p class="k">To watch</p><ul>${c.concerns.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
        ${c.tasks ? `<p class="k">The tasks</p><p class="txt" style="margin-top:0">${esc(c.tasks)}</p>` : ''}
        ${c.offer ? `<p class="k">With the offer</p><p class="txt" style="margin-top:0">${esc(c.offer)}</p>` : ''}
        ${b.teach ? `<p class="k">Teaching group</p><p class="txt" style="margin-top:0">The interviewer placed them in the ${esc(b.teach)} teaching group.${b.why ? ' “' + esc(b.why) + '”' : ''}</p>` : ''}
        ${!(c.strengths || []).length && !(c.concerns || []).length && !c.tasks ? `<p class="wait">There are no interviewer’s notes in this folder.</p>` : ''}`
      : `<p class="wait">Nothing has been read from this trainee’s folder yet.</p>`}
      ${files.length ? `<p class="k">Their files</p><ul class="files">${files.map(x => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a></li>`).join('')}</ul>`
        : f ? `<p class="k">Their files</p><ul class="files"><li><a href="${esc(f)}" target="_blank" rel="noopener">Open their folder</a></li></ul>` : ''}
    </article>`;
  }

  function descs(){
    const withD = roster.filter(t => before(t));
    return `<h2 class="sec">Candidate descriptions</h2>
      <p class="lede">A short description of each trainee for the assessor, drafted from the same files. Change any of it: it is saved when you leave the box. Copy them into the center’s own Candidate descriptions document, and tell the trainees it is shared with the assessor.</p>
      <div class="bar"><button type="button" id="copyAll">Copy them all</button><span id="copySaid"></span></div>
      ${withD.map(t => `<div class="desc"><b>${esc(t.name)}</b><textarea data-token="${esc(t.token)}" aria-label="Description of ${esc(t.name)}">${esc(before(t).description || '')}</textarea><span class="saved"></span></div>`).join('')}`;
  }

  function draw(){
    const head = `<p class="k">Course</p><h1>Before the course</h1>
      <p class="lede">What the center’s interviewer saw in each trainee, read from their application folder. For the tutors only: trainees and the assessor never see this page.${top ? ` <a href="${esc(top)}" target="_blank" rel="noopener">Open the folders in Drive</a>` : ''}</p>`;
    if (!roster.length) { $('app').innerHTML = head + '<div class="none">Nobody is on the course yet.</div>'; return; }
    const noneYet = !read.length ? `<div class="none" style="margin-bottom:18px"><b>Lite has not read the folders yet.</b><br>On <a href="6_centre_admin_dashboard.html">Course admin</a>, under the assessor’s documents, press Read the folders, then Use what Lite read. It takes about half a minute, and the cards fill in here.</div>` : '';
    $('app').innerHTML = head + noneYet + `<div class="grid">${roster.map(card).join('')}</div>` + (read.length ? descs() : '');
    wire();
  }

  function wire(){
    /* a box is as tall as its words, so nothing of a description is hidden */
    const fit = el => { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 4) + 'px'; };
    document.querySelectorAll('.desc textarea').forEach(el => { fit(el); el.addEventListener('input', () => fit(el)); });
    document.querySelectorAll('.desc textarea').forEach(el => el.addEventListener('change', async () => {
      const t = roster.find(x => x.token === el.dataset.token); if (!t) return;
      const said = el.parentNode.querySelector('.saved'); said.textContent = 'Saving…';
      const it = Object.assign({}, (t.records || {}).intake || {}, { description: el.value.trim() });
      try { const r = await S.call({ op: 'put', token: t.token, kind: 'intake', data: it });
        t.records = t.records || {}; t.records.intake = it;
        said.textContent = r && r.demo ? 'This is a demo course. The change stays on this page.' : 'Saved'; }
      catch (e) { said.textContent = 'Not saved: ' + ((e && e.message) || e); }
    }));
    const cp = $('copyAll');
    if (cp) cp.addEventListener('click', async () => {
      const text = [...document.querySelectorAll('.desc')].map(d => d.querySelector('b').textContent + '\n' + d.querySelector('textarea').value.trim()).join('\n\n');
      try { await navigator.clipboard.writeText(text); $('copySaid').textContent = 'Copied. Paste them into the Candidate descriptions document.'; }
      catch (e) { $('copySaid').textContent = 'Could not copy. Select the text in each box instead.'; }
    });
  }
  draw();
})();
</script>
</body>
</html>
