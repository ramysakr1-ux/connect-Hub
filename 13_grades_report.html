<!DOCTYPE html>
<!--
  Connect Lite — grades report (9_grades_report.html)
  © 2026 Ramy Sakr. All rights reserved.

  The provisional and final grades report, as a screen. Structure follows the
  centre's own C/17 page (c17-provisional-grades/) -- Ramy, 25 Sep 2026: "I
  want the provisionals to have the same structure as what we have on
  Classroom, it's much clearer": the whole cohort in two grade tables at the
  top, then every candidate down one page, a copy button on every section so
  it pastes straight into Appian's separate fields, and a bank of points
  already written for other candidates. The one-candidate-at-a-time rail this
  replaced hid the cohort, which is what the grade meeting actually looks at.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Connect Lite — Grades report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(98.8% 0.006 85); --sand-line:oklch(85.5% 0.02 80);
    --row-line:oklch(90% 0.016 82);
    --paper:oklch(99.5% 0.004 90); --surface:oklch(95.2% 0.018 84);
    /* --box: what a control is filled with -- every button, every field.
       It was --paper, stark white (Ramy, 21 Sep 2026: "I'm not a big fan of
       white... all those white boxes could turn into that sort of different
       beige colour"), and is now the tone Course links and the double-marking
       cards already used. Named for its job, not its look, so a control and a
       panel can part company later. --paper stays white for its own two jobs:
       text on a teal fill, and the arcs of the mark. */
    --box:oklch(91.2% 0.03 80); --card:oklch(95.2% 0.018 84); --ink:oklch(23.5% 0.017 65);
    --teal:oklch(37.5% 0.058 195); --grey:oklch(51% 0.017 70);
    --gold:oklch(63% 0.096 72); --gold-lifted:oklch(70% 0.12 72); --gold-ink:oklch(55% 0.11 70);
    --ink-warm:oklch(30% 0.042 58); --brick:oklch(52% 0.19 32);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:0 20px 90px;}
  .board{max-width:1180px; margin:0 auto;}

  /* On paper: the working screen goes, the read-only report comes. */
  #printAll{display:none;}
  /* Orientation stated, not left to the print dialog -- see hub-record.css. */
  @page{ size:A4 portrait; margin:12mm; }
  @media print{
    .chrome, .titleacts, .jump, .cohort, #cands, .back, #hubSync{display:none !important;}
    body{background:#fff; padding:0;}
    .shell{display:block;}
    #printAll{display:block;}
    .pcand{break-inside:avoid; page-break-inside:avoid; padding:0 0 26px; margin:0 0 26px; border-bottom:1px solid var(--sand-line);}
    .pcand:last-child{border-bottom:none;}
  }
  .pcand h2{margin:0 0 4px; font-family:'Newsreader',Georgia,serif; font-size:1.25rem; font-weight:700;}
  .pcand .pgrades{font-size:0.9rem; margin:0 0 14px;}
  .pcand .pgrades b{font-weight:700;}
  .pcand h3{margin:14px 0 5px; font-family:'Instrument Sans','Karla',sans-serif; font-size:10px;
    font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--grey);}
  .pcand ul{margin:0; padding-left:18px; font-size:0.88rem; line-height:1.55;}
  .pcand p{margin:0; font-size:0.88rem; line-height:1.6; white-space:pre-wrap;}
  .pcand .none{font-size:0.86rem; color:var(--grey);}
  a{color:var(--teal);} a:hover{color:var(--ink-warm);}
  input,textarea,select{font-family:'Karla',sans-serif; color:var(--ink);}
  input:focus,textarea:focus,select:focus{outline:none; border-color:var(--teal);}
  textarea{resize:vertical;}

  .chrome{display:flex; align-items:center; justify-content:space-between; gap:24px; height:64px;}
  .lockup{display:flex; align-items:center; gap:9px;}
  .lockup .tile{width:30px; height:30px; border-radius:7px; background:var(--ink-warm);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .lockup .word{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:21px;
    line-height:0.85; letter-spacing:-0.012em; color:var(--gold);}
  /* Ramy, 20 Sep 2026: "Lite" sits on Connect's baseline, not centred against it. */
  .hub-pair{display:inline-flex;align-items:baseline;gap:4px;}
  .hub-word{font-family:'Instrument Sans','Karla',sans-serif; font-weight:500; font-size:9px;
    letter-spacing:0.24em; text-transform:uppercase; color:var(--ink); line-height:1; margin-left:1px;}
  .role{font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:600;
    letter-spacing:0.22em; text-transform:uppercase; color:var(--grey);}

  .title{border-top:2px solid var(--teal); padding-top:26px; display:flex; align-items:flex-end;
    justify-content:space-between; gap:28px; flex-wrap:wrap;}
  .title h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:2.1rem; line-height:1.15;}
  .title p{margin:7px 0 0; font-size:0.9rem; color:var(--grey);}
  .titleacts{display:flex; align-items:center; gap:10px;}
  #saveState{font-size:0.82rem; color:var(--grey);}

  .btn{font-family:'Karla',sans-serif; font-size:0.85rem; font-weight:600; padding:9px 18px;
    border-radius:6px; border:1.5px solid var(--sand-line); background:var(--box); color:var(--ink);
    cursor:pointer; transition:border-color .15s,color .15s;}

  /* ---- the sticky letter bar: one tap to any candidate ---- */
  .jump{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:10px 0; margin:18px 0 0; background:color-mix(in oklab, var(--sand) 92%, transparent); backdrop-filter:blur(6px);}
  .jump a{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%;
    font-family:'Instrument Sans',sans-serif; font-size:11px; font-weight:600; letter-spacing:.04em;
    color:var(--ink); background:var(--card); border:1px solid var(--sand-line); text-decoration:none;}
  .jump a:hover{border-color:var(--teal); color:var(--teal);}
  .jump a.done{border-color:var(--teal); color:var(--teal);}
  .jump .count{margin-left:6px; font-size:0.78rem; color:var(--grey);}

  /* ---- the cohort: two grade tables, side by side ---- */
  .cohort{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:18px;}
  @media(max-width:860px){ .cohort{grid-template-columns:1fr;} }
  /* Paper, as the rest of Lite. The beige fills this shape arrived with read
     as washed-out beside the other screens (Ramy, 25 Sep 2026); the colour
     is the left edge, gold for the provisional table, teal for the final. */
  .gt{background:var(--surface); border-radius:10px; border-left:5px solid var(--gold); overflow:hidden;}
  .gt.fin{border-left-color:var(--teal);}
  /* the course-level four: same card, and its sections sit inside it rather
     than on a candidate, so they get the card's padding */
  .gt.course-gt{border-left-color:var(--teal-deep, var(--teal)); padding-bottom:6px;}
  .gt.course-gt .sec{padding:0 20px 14px;}
  .gt.course-gt .sec:last-child{padding-bottom:18px;}
  .gt h2{margin:0; padding:15px 20px 3px; font-family:'Newsreader',Georgia,serif; font-size:1.1rem; font-weight:700;}
  .gt p.sc{margin:0; padding:0 20px 12px; font-size:0.76rem; color:var(--grey); line-height:1.5;}
  .gt table{width:100%; border-collapse:collapse; font-size:0.86rem;}
  .gt td{padding:7px 20px; border-top:1px solid var(--row-line); vertical-align:middle;}
  .gt td.l{width:1%; white-space:nowrap; font-family:'Instrument Sans',sans-serif; font-size:11px; font-weight:600; color:var(--grey);}
  .gt td.n{font-weight:600;}
  .gt td.n .wd{font-weight:400; color:var(--grey); font-style:italic; font-size:0.78rem; margin-left:6px;}
  .gt td.s{width:46%;}
  select.grade{width:100%; font-family:'Karla',sans-serif; font-size:0.84rem; font-weight:700; color:var(--ink);
    padding:7px 10px; border:1.5px solid var(--sand-line); border-radius:6px; background:var(--box); cursor:pointer;}
  select.grade.set{color:var(--teal); border-color:color-mix(in oklab, var(--teal) 45%, transparent);}
  select.grade.fail{color:var(--brick); border-color:color-mix(in oklab, var(--brick) 45%, transparent);}
  select.grade.top{color:var(--gold-ink); border-color:color-mix(in oklab, var(--gold-ink) 50%, transparent);}
  select.grade.out{color:var(--grey); font-style:italic; border-color:var(--sand-line);}
  select.grade:disabled{opacity:1; cursor:default;}

  /* ---- every candidate, down the page ---- */
  .cand{background:var(--surface); border-radius:10px; border-left:5px solid var(--gold); margin-top:22px; scroll-margin-top:64px;}
  .chead{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:18px 24px 14px; border-bottom:1px solid var(--sand-line);}
  .chead h2{margin:0; font-family:'Newsreader',Georgia,serif; font-size:1.35rem; font-weight:600;}
  .chead .ltr{font-family:'Instrument Sans',sans-serif; font-size:12px; font-weight:600; letter-spacing:.16em; color:var(--grey); margin-right:10px;}
  .chead .cap{font-size:0.8rem; color:var(--brick); line-height:1.5;}
  .grow{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 24px;
    border-bottom:1px solid var(--sand-line);}
  .grow label{font-family:'Instrument Sans',sans-serif; font-size:9px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); white-space:nowrap;}
  .grow select.grade{width:auto; min-width:220px;}
  .grow.final{border-top:2px solid var(--teal); margin-top:6px;}
  .cols{display:grid; grid-template-columns:1fr 1fr; gap:0 26px; padding:4px 24px 8px;}
  @media(max-width:1000px){ .cols{grid-template-columns:1fr;} }
  .prosewrap{padding:6px 24px 8px;}
  /* which TP a suggested point came from */
  .fromtp{display:inline-block; margin-right:7px; font-family:'Instrument Sans',sans-serif; font-size:10px;
    font-weight:700; letter-spacing:.04em; color:var(--grey); vertical-align:1px;}
  /* the final grade's box: one box, two sides */
  .fsides{display:grid; grid-template-columns:1fr 1fr; gap:0 26px;}
  .fside{min-width:0;}
  .fside + .fside{border-left:1px solid var(--sand-line); padding-left:26px;}
  .fside .sec{padding-left:0; padding-right:0;}
  @media (max-width:900px){ .fsides{grid-template-columns:1fr; gap:14px;}
    .fside + .fside{border-left:0; padding-left:0; border-top:1px solid var(--sand-line); padding-top:14px;} }
  /* the borderline evidence box, directly under the provisional it belongs to */
  .evwrap{padding-top:0; padding-bottom:2px;}
  .evwrap .sec{padding-top:10px;}
  .sec{padding:14px 0 6px;}
  .sec .head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding-bottom:7px;
    border-bottom:1px solid var(--sand-line);}
  .sec .head h3{margin:0; font-family:'Instrument Sans',sans-serif; font-size:10px; font-weight:600;
    letter-spacing:0.13em; text-transform:uppercase; color:var(--grey);}
  .sec .head .src{font-size:0.74rem; color:var(--grey); margin-left:auto;}
  .sec.action .head h3{color:var(--brick);}
  .sec.action .head{border-bottom-color:color-mix(in oklab, var(--brick) 28%, transparent);}
  .seccopy{flex:0 0 auto; font-family:'Instrument Sans',sans-serif; font-size:10px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; padding:3px 9px; border-radius:12px; border:1px solid var(--sand-line); background:none;
    color:var(--grey); cursor:pointer; opacity:.55; transition:opacity .15s, border-color .15s, color .15s;}
  .sec:hover .seccopy, .seccopy:focus{opacity:1;}
  .seccopy:hover{border-color:var(--teal); color:var(--teal);}
  .seccopy.ok{opacity:1; background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .pt{display:flex; align-items:flex-start; gap:9px; padding:8px 0; border-bottom:1px solid var(--row-line);}
  .pt .dot{width:5px; height:5px; border-radius:50%; background:var(--teal); flex-shrink:0; margin-top:9px;}
  .sec.action .pt .dot{background:var(--brick);}
  .pt textarea{flex:1 1 200px; min-width:0; font-size:0.92rem; line-height:1.5; border:none; background:none; padding:2px 0; overflow:hidden;}
  .pt select{flex:0 1 auto; min-width:0; max-width:190px; font-size:0.76rem; font-weight:600; color:var(--grey);
    border:1px solid var(--sand-line); border-radius:5px; background:var(--box); padding:4px 5px; cursor:pointer;}
  .pt .rm{flex-shrink:0; margin-left:auto; border:none; background:none; color:var(--grey); font-size:1rem; line-height:1; padding:4px 3px; cursor:pointer;}
  .pt .rm:hover{color:var(--brick);}
  .sec .none{padding:12px 0 2px; font-size:0.86rem; color:var(--grey);}
  .sec .add{margin-top:9px; font-family:'Karla',sans-serif; font-size:0.8rem; font-weight:600; background:none; border:none; color:var(--teal); cursor:pointer; padding:0;}
  .sec textarea.prose{width:100%; margin-top:9px; font-size:0.88rem; line-height:1.6; padding:11px 12px;
    border:1px solid var(--sand-line); border-radius:7px; background:var(--card);}
  .sec .hint{font-size:0.74rem; color:var(--grey); margin-top:5px;}
  /* the point bank: what has already been written for another candidate */
  .reuse{margin:8px 0 0;}
  .reuse summary{list-style:none; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    font-size:0.74rem; font-weight:600; color:var(--grey); padding:3px 0;}
  .reuse summary::-webkit-details-marker{display:none;}
  .reuse summary:hover{color:var(--teal);}
  .reuse .lines{display:flex; flex-direction:column; gap:4px; margin-top:6px;}
  .reuse .lines button{text-align:left; font-family:'Karla',sans-serif; font-size:0.84rem; line-height:1.45;
    padding:7px 10px; border:1px solid var(--sand-line); border-radius:6px; background:var(--card); color:var(--ink); cursor:pointer;}
  .reuse .lines button:hover{border-color:var(--teal);}
  .reuse .none{font-size:0.8rem; color:var(--grey); margin:6px 0 0;}
  .cfoot{display:flex; justify-content:flex-end; padding:8px 24px 16px;}
  .frrow{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:10px;}
  .frrow label{display:inline-flex; align-items:center; gap:8px; font-size:0.84rem; font-weight:600;}
  .frrow input{width:96px; font-size:0.88rem; padding:7px 10px; border:1.5px solid var(--sand-line); border-radius:6px; background:var(--box);}
  .frrow a.btn{text-decoration:none;}
  .ro .add, .ro .rm, .ro .reuse{display:none;}
  @media(max-width:560px){
    .titleacts .btn{min-height:44px;}
    .sec .add{min-height:40px;}
    .grow select.grade{width:100%;}
  }
  /* The mark turns once every ninety seconds, holding still for the first ten
     of them -- the same rule the trainee home and the four documents carry.
     Ramy, 21 Sep 2026: "I still want the logo to slowly spin." It belongs on
     every screen that shows the mark: the mark is the one thing in Lite that is
     identical everywhere, and a logo that moves on one page and not the next is
     two logos. Honoured only where motion is welcome. */
  @keyframes wordmark-spin{0%,11.11%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
  .wordmark-spin{animation:wordmark-spin 90s linear infinite; transform-origin:50% 50%; transform-style:preserve-3d;}
  @media(prefers-reduced-motion:reduce){ .wordmark-spin{animation:none;} }

</style>

<div class="board">
  <a class="back" href="5_tutor_dashboard.html">&larr; Tutor dashboard</a>

  <div class="chrome">
    <div class="lockup">
      <span class="tile">
        <svg viewBox="8 30 104 60" width="20" height="12" fill="none" class="wordmark-spin">
          <path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="var(--gold-lifted)" stroke-width="13" stroke-linecap="round"></path>
          <path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="var(--paper)" stroke-width="13" stroke-linecap="round"></path>

      </span>

<script src="hub-tracker.js?v=202609262344"></script>

<script type="text/x-hub-app">
/* Whose room this is -- see hubTutorRoomOnly in hub-shared.js. Only tutor
   screens link here, but a candidate's link opened it and read the course and
   centre off the header (walk, 22 Sep 2026). */
if (window.hubTutorRoomOnly && hubTutorRoomOnly())
  throw new Error('Connect Lite: stopping this page on purpose \u2014 the tutors\u2019 room is not open to this link.');

/* ---------------------------------------------------------------------------
   Grades report. One record per candidate, five sections, matching the
   centre's Word form. Everything is stored under connect_grades_v1; the roster
   comes from the store in tutor mode and from connect_roster_v1 otherwise.
--------------------------------------------------------------------------- */
/* Grades live on each candidate's tracker record (roster.trainees[id].tracker.grades),
   the tutor-only kind hub-sync already pushes to the store -- so every tutor on the
   course and the assessor pack read the same record. Nothing autosaves: Save writes. */
const T = window.HubTracker;
const RO = window.HubMode === 'assessor' || window.HubMode === 'trainee';

/* The 41 Cambridge criteria, codes and short labels as Connect's celta-criteria.ts
   has them (the handoff listed 34; the missing seven are real criteria). */
const SHORT={
  '1a':'needs awareness','1b':'cultural awareness','1c':'background awareness','1d':'rapport/learner involvement',
  '2a':'TTT/language grading','2b':'error-correction','2c':'context','2d':'language models',
  '2e':'clarifying language','2f':'register','2g':'language practice',
  '3a':'reading/listening','3b':'speaking/writing',
  '4a':'stating aims','4b':'staging','4c':'materials','4d':'materials prep','4e':'procedure',
  '4f':'interaction','4g':'variety and balance','4h':'timing','4i':'language analysis','4j':'anticipated problems',
  '4k':'anticipated solutions','4l':'terminology','4m':'teamwork','4n':'reflection on plans',
  '5a':'classroom arrangement','5b':'grouping','5c':'teaching techniques','5d':'achieving aims',
  '5e':'material use','5f':'instructions','5g':'eliciting/concept-checking','5h':'feedback',
  '5i':'pace','5j':'monitoring','5k':'timing','5l':'portfolio','5m':'self-reflection','5n':'participation'
};
/* The seven grades, then the three outcomes that are not grades at all. Both
   sets are on the live Cambridge CELTA Centre Grade Form's provisional
   dropdown (read 25 Sep 2026); the form's own order runs Pass A downwards,
   ours runs upwards, and the outcomes sit after the grades either way. */
const GRADES=['FAIL','FAIL / PASS','PASS','PASS / PASS B','PASS B','PASS B / PASS A','PASS A'];
const OUTCOMES=['WITHDRAWN','EXTENSION','DEFERRAL'];
const PROV=GRADES.concat(OUTCOMES);
const FINAL=['FAIL','PASS','PASS B','PASS A'].concat(OUTCOMES);
/* Cambridge's own field names, in Cambridge's own order, copied off the live
   Centre Grade Form in Appian (read against TR073-C17/2026, 25 Sep 2026) so a
   section pastes straight across. This screen IS the grade form, which is why
   it takes the form's words; "action points" stays Lite's vocabulary
   everywhere feedback is written, which is a different document. */
const SECTIONS=[
  {key:'planS', heading:'Planning: Strengths',               src:'topic 4',            add:'Add a strength',     action:false},
  {key:'planA', heading:'Planning: Areas for development',   src:'topic 4',            add:'Add an action point',action:true},
  {key:'teachS',heading:'Teaching: Strengths',               src:'topics 1, 2, 3, 5',  add:'Add a strength',     action:false},
  {key:'teachA',heading:'Teaching: Areas for development',   src:'topics 1, 2, 3, 5',  add:'Add an action point',action:true}
];
/* The final grade's two fields, in Appian's own words, read off Ramy's screen
   on 25 Sep 2026 -- NOT the Handbook's, which calls the first "update on
   strengths and areas for development". Appian says "action points", and the
   form a centre fills in wins.

   Note the two evidence headings differ on purpose: "evidence NEEDED for a
   Pass / Higher Grade" under the PROVISIONAL, "what evidence WAS PROVIDED for
   a Higher Grade" here. Needed before, provided after. */
const FIELDS=[
  {key:'update',   heading:'Update on strengths and action points', h:150,
   ph:'What changed across the final TPs. On a straight pass, the line saying they held their ground.',
   hint:'Cambridge asks for one on every candidate, not only the borderline ones.'},
  {key:'provided', heading:'What evidence was provided for a Higher Grade (if applicable)', h:150,
   ph:'Where the final grade moved, what earned it.',
   hint:'Leave empty where the grade did not move.'},
];

/* Cambridge has ONE evidence field, not two, and it belongs to the
   PROVISIONAL grade (25 Sep 2026). The heading below is copied off the live
   Cambridge CELTA Centre Grade Form in Appian, read against TR073-C17/2026:
   it is the last field on every candidate's card, under the four prose boxes,
   and it carries no asterisk -- optional, unlike the four above it. The
   Administration Handbook June 2025 (printed p43) describes the same field in
   its own words and says it "should be completed for any candidates that were
   borderline (e.g., Pass/Fail->Pass, Pass->Pass B) so there is a justification
   recorded for the final recommended grade"; where the two differ, the form a
   centre actually fills in wins.

   The three slash grades on that form -- Pass/Fail, Pass B/Pass, Pass A/Pass B
   -- are our FAIL / PASS, PASS / PASS B, PASS B / PASS A, so the box shows
   itself exactly when Cambridge asks for it and stays out of the way
   otherwise. It used to sit under the FINAL grade, always, beside a second box
   Cambridge does not have at all. */
const EVIDENCE = { key:'evidence',
  heading:'Evidence needed for a Pass / Higher Grade (if applicable)',
  h:150,
  ph:'What the centre is putting forward for the higher of the two grades.',
  hint:'Optional on the Cambridge form, but expected on a borderline candidate, so the higher grade has a justification on record.' };
const isBorderline = g => /\//.test(g || '');

/* The course-level half of the Cambridge Centre Grade Form, read off the live
   form in Appian against TR073-C17/2026 on 25 Sep 2026. It opens with these
   four before it reaches a single candidate, all four required, 2000
   characters each. They describe the COURSE, not a person, so they are kept
   with the course settings rather than on anybody's record -- which also
   means they sync to every tutor on the course like the rest of the
   settings. */
const COURSE_FIELDS = [
  {key:'tp',       heading:'Teaching Practice',
   ph:'How teaching practice was organised: the groups, the levels, the hours, who taught when.',
   hint:'Required on the Cambridge form.'},
  {key:'tpSup',    heading:'Teaching Practice Supervision and Feedback',
   ph:'How TP was supervised and how feedback was given — who observed, how feedback ran, what candidates were asked to do with it.',
   hint:'Required on the Cambridge form.'},
  {key:'tutorials',heading:'Tutorials',
   ph:'When tutorials were held, who held them, and what they covered.',
   hint:'Required on the Cambridge form.'},
  {key:'extra',    heading:'Additional Comments',
   ph:'Anything else the assessor should know about how the course ran.',
   hint:'Required on the Cambridge form.'}
];
const CS_KEY = 'connect_course_settings';
function loadCourseSettings(){ try{ return JSON.parse(localStorage.getItem(CS_KEY)) || {}; }catch(e){ return {}; } }
let COURSE = (loadCourseSettings().gradeForm) || {};

/* Written back into the course settings, which hub-sync carries to the store
   for every tutor on the course. Read the settings again at save time rather
   than holding the whole object: another screen may have changed something
   else in it while this page was open. */
function persistCourse(){
  if (RO) return;
  const cs = loadCourseSettings();
  cs.gradeForm = COURSE;
  localStorage.setItem(CS_KEY, JSON.stringify(cs));
}

function paintCourse(){
  const box = document.getElementById('course'); if (!box) return;
  box.innerHTML = `<div class="gt course-gt">
    <h2>Teaching Practice and Tutorials</h2>
    <p class="sc">The course-level half of the centre grade form, above the candidates on Cambridge's own form. Four fields, all required.</p>
    ${COURSE_FIELDS.map(f => `<div class="sec" data-course="${f.key}">
      <div class="head"><h3>${f.heading}</h3><button type="button" class="seccopy" data-coursecopy="${f.key}">copy</button></div>
      <textarea class="prose"${ro()} data-coursefield="${f.key}" placeholder="${esc(f.ph)}" style="min-height:120px">${esc(COURSE[f.key] || '')}</textarea>
      <div class="hint">${f.hint}</div>
    </div>`).join('')}
  </div>`;
  box.querySelectorAll('textarea').forEach(fit);
}
/* The door to the final course report. There is no report to write on a
   course that ended in an outcome rather than a grade -- the document
   confirms attendance and states a grade, and neither sentence would hold. */
function reportLabel(g){
  return OUTCOMES.includes(g) ? 'Final report (not issued on a ' + g.toLowerCase() + ')'
       : g ? 'Open the final report' : 'Final report (needs a final grade)';
}

function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function blankRecord(name){ return {name, provisional:'', final:'', planS:[], planA:[], teachS:[], teachA:[], update:'', evidence:'', hoursAttended:'', overall:''}; }
/* Anything written in the two old boxes moves into the one field, so no
   centre loses what it recorded before today. */
/* The one-time fold of the two old evidence boxes ran on 25 Sep 2026. `needed`
   still folds in; `provided` does NOT, because it is now the final grade's own
   field -- the same field it always was, so anything still under that key
   reads correctly under the new heading. Deleting it here would eat what is
   typed there. */
function foldEvidence(r){
  if (!r.evidence && r.needed) r.evidence = String(r.needed).trim();
  delete r.needed;
  return r;
}
function gradeClass(g){ return OUTCOMES.includes(g) ? 'out' : g==='FAIL' ? 'fail' : g==='PASS A' ? 'top' : g ? 'set' : ''; }

let DATA={}, ORDER=[], dirty=false;

function loadRoster(){ try{ return JSON.parse(localStorage.getItem('connect_roster_v1')) || {trainees:{}}; }catch(e){ return {trainees:{}}; } }
function persist(){
  if (RO) return;
  const roster = loadRoster();
  ORDER.forEach(p=>{
    const tr = roster.trainees[p.id]; if (!tr) return;
    tr.tracker = tr.tracker || {};
    const rec = Object.assign({}, DATA[p.id]); delete rec.name;
    tr.tracker.grades = rec;
  });
  localStorage.setItem('connect_roster_v1', JSON.stringify(roster));
  persistCourse();
  dirty=false; paintState();
}
function touch(){ if (RO) return; dirty=true; paintState(); }
function paintState(){ document.getElementById('saveState').textContent = RO ? 'Read-only' : (dirty ? 'Unsaved changes' : 'Saved'); }

/* Handbook 11.6, read off the candidate's assignment record by the tracker's own
   rule engine: one failed written assignment rules out Pass A; more than one rules
   out a Pass. Reported, never enforced. */
function capFor(tr){
  try{
    const r = T.readCandidate(T.recordFor(tr));
    if (!r.fails.length) return null;
    const capped = r.fails.length > 1 ? GRADES.concat(FINAL).filter(g=>g!=='FAIL') : ['PASS A','PASS B / PASS A'];
    return { line: r.ceiling.replace('SRT','LSRT'), capped };
  }catch(e){ return null; }
}

/* The roster decides who appears, and in what order. Letters are positional,
   as the Word form has them: A, B, C… in roster order. */
function roster(){
  const r = loadRoster().trainees || {};
  return Object.values(r).filter(t=>t && t.name).sort((a,b)=>(a.name||'').localeCompare(b.name||''))
    .map(t=>({ id:t.id||t.name, name:t.name, withdrawn: !!(t.tracker && t.tracker.withdrawn), saved:(t.tracker && t.tracker.grades) || null, cap: capFor(t) }));
}

function letterFor(i){ return String.fromCharCode(65+i); }

function fit(el){ if(!el) return; el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

const CODES = Object.keys(SHORT);
const off = () => RO ? ' disabled' : '';
const ro  = () => RO ? ' readonly' : '';

/* A grade select. The options a failed written assignment rules out
   (Handbook 11.6) are marked, not removed -- the tutor may still choose one,
   everything is subject to manual override, and the cap line under the name
   says why it is marked. */
function gradeSelect(kind, opts, cur, p){
  const capped = (p.cap && p.cap.capped) || [];
  const cls = gradeClass(cur);
  return `<select class="grade ${cls}" data-id="${esc(p.id)}" data-grade="${kind}"${off()}>
    <option value="">— choose —</option>
    ${opts.map(o => `<option value="${esc(o)}"${o === cur ? ' selected' : ''}>${esc(o)}${capped.includes(o) ? ' · ruled out by assignments' : ''}</option>`).join('')}
  </select>`;
}

function paintJump(){
  const done = ORDER.filter(p => DATA[p.id].final).length;
  document.getElementById('jump').innerHTML = ORDER.map((p, i) =>
    `<a href="#c${i}" title="${esc(p.name)}" class="${DATA[p.id].final ? 'done' : ''}">${letterFor(i)}</a>`).join('') +
    `<span class="count">${done} of ${ORDER.length} final grades</span>`;
}

/* The whole cohort, twice: what goes on the centre grade form before the
   visit, and what is agreed with the assessor at the end. */
function paintCohort(){
  const table = (kind, opts) => `<table><tbody>${ORDER.map((p, i) => `<tr>
    <td class="l">${letterFor(i)}</td>
    <td class="n">${esc(p.name)}${p.withdrawn ? '<span class="wd">withdrawn</span>' : ''}</td>
    <td class="s">${gradeSelect(kind, opts, DATA[p.id][kind], p)}</td></tr>`).join('')}</tbody></table>`;
  document.getElementById('cohort').innerHTML = `
    <div class="gt">
      <h2>Provisional grades</h2>
      <p class="sc">On the centre grade form in Appian, two or more days before the assessment. Seven points.</p>
      ${table('provisional', PROV)}
    </div>
    <div class="gt fin">
      <h2>Final recommended grades</h2>
      <p class="sc">Agreed with the assessor at the end of the course. Four points. Where these differ from the provisional, the reason belongs in the evidence sections below.</p>
      ${table('final', FINAL)}
    </div>`;
}

function listSection(p, s){
  const d = DATA[p.id], items = d[s.key] || [];
  return `<div class="sec ${s.action ? 'action' : ''}" data-id="${esc(p.id)}" data-sec="${s.key}">
    <div class="head"><h3>${s.heading}</h3><span class="src">${s.src}</span><button type="button" class="seccopy" data-seccopy="${s.key}">copy</button></div>
    ${items.map((it, n) => `<div class="pt">
      <div class="dot"></div>
      <textarea rows="1"${ro()} data-text="${n}" placeholder="Write the point">${esc(it.text)}</textarea>
      <select${off()} data-code="${n}"><option value="">no code</option>
        ${CODES.map(c => `<option value="${c}"${c === it.code ? ' selected' : ''}>${c} · ${SHORT[c]}</option>`).join('')}
      </select>
      <button type="button"${off()} class="rm" data-remove="${n}" title="Remove">&times;</button>
    </div>`).join('')}
    ${items.length ? '' : '<div class="none">Nothing recorded yet.</div>'}
    <button type="button"${off()} class="add" data-add="${s.key}">${s.add}</button>
    ${FB_SECTION[s.key] ? `<details class="reuse tprec" data-tp="${s.key}"><summary>Add from the TP records</summary><div class="lines"></div></details>` : ''}
    <details class="reuse" data-sec="${s.key}"><summary>Reuse a point from another candidate</summary><div class="lines"></div></details>
  </div>`;
}

function proseSection(p, f){
  const d = DATA[p.id];
  return `<div class="sec" data-id="${esc(p.id)}" data-sec="${f.key}">
    <div class="head"><h3>${f.heading}</h3><button type="button" class="seccopy" data-seccopy="${f.key}">copy</button></div>
    <textarea class="prose"${ro()} data-field="${f.key}" placeholder="${esc(f.ph)}" style="min-height:${f.h}px">${esc(d[f.key] || '')}</textarea>
    <div class="hint">${f.hint}</div>
    <details class="reuse" data-sec="${f.key}"><summary>Reuse a point from another candidate</summary><div class="lines"></div></details>
  </div>`;
}

function paintCands(){
  document.getElementById('cands').innerHTML = ORDER.map((p, i) => {
    const d = DATA[p.id];
    return `<section class="cand" id="c${i}" data-id="${esc(p.id)}">
      <div class="chead">
        <h2><span class="ltr">${letterFor(i)}</span>${esc(d.name)}${p.withdrawn ? ' <span class="src">(withdrawn)</span>' : ''}</h2>
        ${p.cap ? `<div class="cap">${esc(p.cap.line)}</div>` : ''}
      </div>
      <div class="grow"><label>Provisional grade</label>${gradeSelect('provisional', PROV, d.provisional, p)}</div>
      <div class="prosewrap evwrap" data-ev="${esc(p.id)}"${isBorderline(d.provisional) ? '' : ' hidden'}>${proseSection(p, EVIDENCE)}</div>
      <div class="cols">${SECTIONS.map(s => listSection(p, s)).join('')}</div>
      <div class="grow final"><label>Final grade</label>${gradeSelect('final', FINAL, d.final, p)}</div>
      <!-- One box, two sides, as Appian has it: the update on the left, the
           evidence that earned a higher grade on the right. It comes with the
           final grade and goes with it, unless either side already has text. -->
      <div class="prosewrap finwrap" data-fin="${esc(p.id)}"${(d.final || FIELDS.some(f => (d[f.key] || '').trim())) ? '' : ' hidden'}>
        <div class="fsides">${FIELDS.map(f => `<div class="fside">${proseSection(p, f)}</div>`).join('')}</div>
      </div>
      <div class="prosewrap">
        <!-- What the final course report needs that the grade form does not:
             the hours this candidate attended and the overall comment that
             closes the report (Connect's final report, mirrored 25 Sep 2026). -->
        <div class="sec" data-id="${esc(p.id)}" data-sec="overall">
          <div class="head"><h3>Final course report</h3><span class="src">hours attended, and the overall comment</span></div>
          <div class="frrow">
            <label>Hours attended <input type="number" min="0" max="999" step="0.5"${ro()} data-field="hoursAttended" value="${esc(d.hoursAttended)}" placeholder="e.g. 118"></label>
            <a class="btn frbtn" data-fr="${esc(p.id)}" href="16_final_report.html?id=${encodeURIComponent(p.id)}">${reportLabel(d.final)}</a>
          </div>
          <textarea class="prose"${ro()} data-field="overall" placeholder="The overall comment on the final report, addressed to the candidate. Optional." style="min-height:110px">${esc(d.overall || '')}</textarea>
        </div>
      </div>
      <div class="cfoot"><button type="button" class="btn" data-copyprofile="${esc(p.id)}">Copy this profile</button></div>
    </section>`;
  }).join('');
  document.querySelectorAll('.pt textarea').forEach(fit);
}

function paint(){ paintJump(); paintCourse(); paintCohort(); paintCands(); }

/* ---- copying: the unit Appian wants is one section ---- */
function sectionText(id, key){
  const d = DATA[id]; if (!d) return '';
  if (Array.isArray(d[key])) return d[key].map(it => (it.text || '').trim()).filter(Boolean)
    .map((t, n) => t + ((d[key][n].code) ? ' (' + d[key][n].code + ')' : '')).join('\n');
  return (d[key] || '').trim();
}
function profileText(id, i){
  const d = DATA[id];
  const lines = [letterFor(i) + ' — ' + d.name, 'Provisional grade: ' + (d.provisional || 'not set'), ''];
  SECTIONS.forEach(s => { lines.push(s.heading.toUpperCase() + ':'); lines.push(sectionText(id, s.key) || '(nothing recorded)'); lines.push(''); });
  lines.push('Final grade: ' + (d.final || 'not set'), '');
  FIELDS.forEach(f => { lines.push(f.heading.toUpperCase() + ':'); lines.push(sectionText(id, f.key) || '(nothing recorded)'); lines.push(''); });
  return lines.join('\n').trim();
}
function toClipboard(text, btn, okLabel){
  const done = () => { if (!btn) return; const was = btn.textContent; btn.classList.add('ok'); btn.textContent = okLabel || 'copied'; setTimeout(() => { btn.classList.remove('ok'); btn.textContent = was; }, 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); done();
}

/* ---- what this tutor already wrote about THIS candidate ------------------
   The four sections of the grade form are the same four the TP feedback form
   has, so a point written in feedback belongs in exactly one box here and
   never needs sorting. Every returned feedback lives on the roster as
   `tr.tp.history[n]` -- on the roster, not in one browser, so the MCT drafting
   a candidate they taught for half the course still sees the other tutor's
   points.

   Newest TP first, and no ranking: Ramy, 25 Sep 2026, on keeping Lite simple
   -- "it remembers what you wrote". Choosing which four matter is the tutor's
   judgement, and a bad guess at it would be worse than an empty box. */
/* The stored record keeps its points under `state.lists.<listId>`, as the raw
   editor HTML plus a star -- NOT under `state.f`, which holds only the plain
   fields (TP number, date, grade, the overall comment). collect()'s tidy
   sp/ap/st/at shape is built for the DOCUMENT and never stored. Read the
   wrong one and every drawer comes up empty with nothing to show for it. */
const FB_SECTION = { planS:'lSP', planA:'lAP', teachS:'lST', teachA:'lAT' };

/* A point as the editor left it: the text with its criterion tags inside, and
   the on-screen bullet. The tags carry the code in data-c, so the code comes
   out clean and the text comes out without it. */
function pointFromHTML(html){
  const box = document.createElement('div');
  box.innerHTML = String(html || '');
  const codes = [...box.querySelectorAll('.tag')].map(t => t.dataset.c).filter(Boolean);
  box.querySelectorAll('.tag').forEach(t => t.remove());
  const text = (box.textContent || '').replace(/\u2022/g, ' ').replace(/\s+/g, ' ').trim();
  return { text, code: codes[0] || '' };
}

function tpPointsFor(id, key){
  const src = FB_SECTION[key]; if (!src) return [];
  /* Matched the way roster() builds its ids -- `t.id || t.name` -- not by the
     roster's own map key, which is something else entirely. Indexing by the
     key found nobody and the drawer came up empty for everyone. */
  const tr = Object.values(loadRoster().trainees || {}).find(t => t && (t.id || t.name) === id);
  if (!tr) return [];
  /* T.tpHistory is THE source, not `tr.tp.history` directly: it keeps only the
     returned ones and folds in the feedback that has just been returned and
     not yet moved into the history. Reading the raw field instead meant the
     drawer was empty for exactly the candidate whose feedback had gone back
     that afternoon -- which is when a tutor would use it. */
  const history = T.tpHistory(tr) || {};
  const out = [], seen = new Set();
  Object.keys(history)
    .map(Number).filter(n => n >= 1).sort((a, b) => b - a)      // newest TP first
    .forEach(n => {
      const st = history[n] && history[n].state;
      const list = (st && st.lists && st.lists[src]) || [];
      list.forEach(pt => {
        const { text, code } = pointFromHTML(pt && pt.html);
        if (!text) return;
        const k = text.toLowerCase();
        if (seen.has(k)) return;                                 // said twice, offered once
        seen.add(k);
        out.push({ text, code, tp: n });
      });
    });
  return out;
}

/* ---- the point bank: only what has already been written on this course ---- */
function bankFor(key, exceptId){
  const seen = new Set(), out = [];
  ORDER.forEach(p => {
    if (p.id === exceptId) return;
    const v = DATA[p.id][key];
    const items = Array.isArray(v) ? v.map(it => ({ text: (it.text || '').trim(), code: it.code || '' }))
                                   : String(v || '').split('\n').map(t => ({ text: t.trim(), code: '' }));
    items.forEach(it => { if (!it.text) return; const k = it.text.toLowerCase(); if (seen.has(k)) return; seen.add(k); out.push(it); });
  });
  return out;
}

const cands = document.getElementById('cands');
/* Both drawers fill when they open, not before: a course of twelve with eight
   TPs each is a lot of reading to do for panes nobody has asked for. */
cands.addEventListener('toggle', e => {
  const det = e.target; if (!det.classList || !det.classList.contains('reuse') || !det.open) return;
  const sec = det.closest('[data-sec]'); const id = sec.dataset.id;
  const lines = det.querySelector('.lines');

  if (det.classList.contains('tprec')) {
    const pts = tpPointsFor(id, det.dataset.tp);
    lines.innerHTML = pts.length
      ? pts.map(it => `<button type="button" data-bank-text="${esc(it.text)}" data-bank-code="${esc(it.code)}"><span class="fromtp">TP${it.tp}</span>${esc(it.text)}${it.code ? ' <b>(' + esc(it.code) + ')</b>' : ''}</button>`).join('')
      : '<p class="none">Nothing written in this section of their teaching practice feedback yet.</p>';
    return;
  }

  const bank = bankFor(sec.dataset.sec, id);
  lines.innerHTML = bank.length
    ? bank.map(it => `<button type="button" data-bank-text="${esc(it.text)}" data-bank-code="${esc(it.code)}">${esc(it.text)}${it.code ? ' <b>(' + esc(it.code) + ')</b>' : ''}</button>`).join('')
    : '<p class="none">Nothing written in this section for another candidate yet. Once there is, it appears here to reuse.</p>';
}, true);

cands.addEventListener('click', e => {
  const sc = e.target.closest('[data-seccopy]');
  if (sc){ const sec = sc.closest('[data-sec]'); const v = sectionText(sec.dataset.id, sec.dataset.sec);
    if (v) toClipboard(v, sc, 'copied'); else { sc.textContent = 'empty'; setTimeout(() => sc.textContent = 'copy', 1200); } return; }
  const cp = e.target.closest('[data-copyprofile]');
  if (cp){ const i = ORDER.findIndex(p => p.id === cp.dataset.copyprofile); toClipboard(profileText(cp.dataset.copyprofile, i), cp, 'Copied'); return; }
  if (RO) return;
  const bank = e.target.closest('.reuse .lines button');
  if (bank){ const sec = bank.closest('[data-sec]'); const d = DATA[sec.dataset.id], key = sec.dataset.sec;
    /* Either drawer adds the same way, and both close behind the click: the
       point is now in the box, and a drawer left open hides it. */
    const det = bank.closest('details'); if (det) det.open = false;
    if (Array.isArray(d[key])) d[key].push({ text: bank.dataset.bankText, code: bank.dataset.bankCode });
    else d[key] = (d[key] && d[key].trim() ? d[key].replace(/\s*$/, '') + '\n' : '') + bank.dataset.bankText;
    touch(); paintCands(); return; }
  const a = e.target.closest('[data-add]');
  if (a){ const sec = a.closest('[data-sec]'); DATA[sec.dataset.id][a.dataset.add].push({ text: '', code: '' }); touch(); paintCands();
    const rows = document.querySelectorAll(`[data-id="${sec.dataset.id}"][data-sec="${a.dataset.add}"] .pt textarea`);
    if (rows.length) rows[rows.length - 1].focus(); return; }
  const r = e.target.closest('[data-remove]');
  if (r){ const sec = r.closest('[data-sec]'); DATA[sec.dataset.id][sec.dataset.sec].splice(+r.dataset.remove, 1); touch(); paintCands(); }
});

cands.addEventListener('input', e => {
  if (RO) return;
  const sec = e.target.closest('[data-sec]'); if (!sec) return;
  const d = DATA[sec.dataset.id];
  if (e.target.matches('[data-text]')){ d[sec.dataset.sec][+e.target.dataset.text].text = e.target.value; fit(e.target); touch(); return; }
  if (e.target.matches('[data-field]')){ d[e.target.dataset.field] = e.target.value; touch(); }
});

/* A grade changed anywhere -- the cohort table or the candidate's own row --
   lands in the same record, and both views repaint from it. */
function onGrade(e){
  if (RO || !e.target.matches('select.grade')) return;
  DATA[e.target.dataset.id][e.target.dataset.grade] = e.target.value; touch();
  if (e.target.dataset.grade === 'provisional') {
    const box = document.querySelector(`.evwrap[data-ev="${CSS.escape(e.target.dataset.id)}"]`);
    if (box) box.hidden = !isBorderline(e.target.value);
  }
  if (e.target.dataset.grade === 'final') {
    const btn = document.querySelector(`.frbtn[data-fr="${CSS.escape(e.target.dataset.id)}"]`);
    if (btn) btn.textContent = reportLabel(e.target.value);
    const box = document.querySelector(`.finwrap[data-fin="${CSS.escape(e.target.dataset.id)}"]`);
    if (box) box.hidden = !(e.target.value || [...box.querySelectorAll('textarea')].some(t => t.value.trim()));
  }
  paintJump(); paintCohort();
  document.querySelectorAll(`select.grade[data-id="${CSS.escape(e.target.dataset.id)}"][data-grade="${e.target.dataset.grade}"]`).forEach(sel => {
    if (sel !== e.target) sel.value = e.target.value;
    sel.className = 'grade ' + gradeClass(e.target.value);
  });
}
document.getElementById('cohort').addEventListener('change', onGrade);
cands.addEventListener('change', e => {
  if (e.target.matches('select.grade')) return onGrade(e);
  if (RO || !e.target.matches('[data-code]')) return;
  const sec = e.target.closest('[data-sec]');
  DATA[sec.dataset.id][sec.dataset.sec][+e.target.dataset.code].code = e.target.value; touch();
});

/* The same record as the screen shows, with nothing to type into: this is what
   the centre keeps and what goes to Cambridge. Built on demand rather than kept
   in step, so it can never drift out of date -- there is no moment between
   pressing Print and the dialog opening in which the data can change. */
function printableRecord(p, i){
  const d = DATA[p.id] || {};
  const list = key => {
    const items = (d[key] || []).filter(it => (it.text || '').trim());
    if (!items.length) return '<div class="none">Nothing recorded.</div>';
    return '<ul>' + items.map(it => `<li>${esc(it.text)}${it.code ? ' <b>(' + esc(it.code) + ')</b>' : ''}</li>`).join('') + '</ul>';
  };
  const prose = f => {
    const v = (d[f.key] || '').trim();
    return `<h3>${f.heading}</h3>` + (v ? `<p>${esc(v)}</p>` : '<div class="none">Nothing recorded.</div>');
  };
  return `<div class="pcand">
    <h2>${letterFor(i)} · ${esc(d.name || '')}</h2>
    <div class="pgrades">Provisional grade: <b>${esc(d.provisional || 'not set')}</b> · Final grade: <b>${esc(d.final || 'not set')}</b>${p.cap ? ' · ' + esc(p.cap.line) : ''}</div>
    ${SECTIONS.map(s => `<h3>${s.heading}</h3>${list(s.key)}`).join('')}
    ${isBorderline(d.provisional) ? prose(EVIDENCE) : ''}
    ${(d.final || FIELDS.some(f => (d[f.key] || '').trim())) ? FIELDS.map(prose).join('') : ''}
  </div>`;
}
function buildPrintable(){
  let cs = null; try { cs = JSON.parse(localStorage.getItem('connect_course_settings')); } catch (e) {}
  const head = cs ? `<h1 style="font-family:'Newsreader',Georgia,serif;margin:0 0 4px;">${esc(cs.courseName || 'Grades report')}</h1>
    <p style="margin:0 0 22px;font-size:0.88rem;color:var(--grey);">${esc([cs.centreName, cs.centreNumber ? 'Centre ' + cs.centreNumber : ''].filter(Boolean).join(' · '))} — provisional and final grades for every candidate</p>` : '';
  /* The course-level four print before the candidates, as they come first on
     Cambridge's form. Anything left empty still prints its heading and says
     so: on a required field, a silent gap reads as an answer. */
  const written = COURSE_FIELDS.some(f => (COURSE[f.key] || '').trim());
  const course = written ? `<div class="pcand"><h2>Teaching Practice and Tutorials</h2>` +
    COURSE_FIELDS.map(f => `<h3>${f.heading}</h3>` +
      ((COURSE[f.key] || '').trim() ? `<p>${esc(COURSE[f.key].trim())}</p>` : '<div class="none">Nothing recorded.</div>')
    ).join('') + '</div>' : '';
  document.getElementById('printAll').innerHTML = head + course + ORDER.map((p, i) => printableRecord(p, i)).join('');
}

/* The course fields sit outside #cands, so they get their own two handlers --
   one to keep what is typed, one for the copy button beside each heading. */
document.getElementById('course').addEventListener('input', e => {
  const t = e.target.closest('[data-coursefield]'); if (!t || RO) return;
  COURSE[t.dataset.coursefield] = t.value; fit(t); touch();
});
document.getElementById('course').addEventListener('click', e => {
  const b = e.target.closest('[data-coursecopy]'); if (!b) return;
  const v = (COURSE[b.dataset.coursecopy] || '').trim();
  if (v) toClipboard(v, b, 'copied'); else { b.textContent = 'empty'; setTimeout(() => b.textContent = 'copy', 1200); }
});

document.getElementById('copyAll').addEventListener('click', e => {
  const course = COURSE_FIELDS.filter(f => (COURSE[f.key] || '').trim())
    .map(f => f.heading.toUpperCase() + ':\n' + COURSE[f.key].trim()).join('\n\n');
  toClipboard([course, ...ORDER.map((p, i) => profileText(p.id, i))].filter(Boolean).join('\n\n———\n\n'), e.currentTarget, 'Copied');
});

document.getElementById('saveBtn').addEventListener('click', persist);
/* Built at the moment of pressing, so what prints is what is on screen. Also
   catches the browser's own print (Cmd-P), which would otherwise paper over
   nothing at all now that the working panes are hidden on print. */
document.getElementById('printBtn').addEventListener('click', () => { buildPrintable(); window.print(); });
window.addEventListener('beforeprint', buildPrintable);

(function init(){
  if (RO){
    document.body.classList.add('ro');
    document.getElementById('saveBtn').style.display = 'none';
    if (window.HubMode === 'assessor') document.getElementById('roleLabel').textContent = 'Assessor';
  }
  const people=roster();
  ORDER=people;
  DATA={};
  people.forEach(p=>{ DATA[p.id] = foldEvidence(p.saved ? {...blankRecord(p.name), ...p.saved, name:p.name} : blankRecord(p.name)); });

  let cs=null; try{ cs=JSON.parse(localStorage.getItem('connect_course_settings')); }catch(e){}
  const bits=[cs&&cs.courseName, cs&&cs.centreName, cs&&cs.centreNumber].filter(Boolean);
  if (people.length) bits.push(people.length+' candidate'+(people.length===1?'':'s'));
  if (bits.length) document.getElementById('courseMeta').textContent = bits.join(' · ');

  if (!people.length){
    document.getElementById('cands').innerHTML =
      '<p style="font-size:0.9rem;color:var(--grey);line-height:1.6;max-width:560px;margin-top:24px;">No candidates on the course yet. Add them on the <a href="6_centre_admin_dashboard.html">Course admin</a> page, then come back — every candidate gets a record here.</p>';
    return;
  }
  paint(); paintState();
})();
</script>
</body>
