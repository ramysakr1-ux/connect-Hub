<style>
  *{box-sizing:border-box;}

  .as-head{border-top:4px solid var(--as, var(--teal)) !important; background:color-mix(in oklab, var(--as, var(--teal)) 7%, var(--surface)) !important;}

  body[class*="as-"] .card > h2{color:var(--as);}
  body[class*="as-"] .picker button.active, body[class*="as-"] .tabs button.active{background:var(--as); border-color:var(--as);}
  .ps-wrap{position:fixed; inset:0; z-index:80; background:oklch(20% 0.02 60 / .38); display:flex; align-items:center; justify-content:center; padding:16px;}
  .ps{width:min(500px,100%); background:var(--paper); border-radius:12px; border-top:3px solid var(--gold); padding:20px 22px; box-shadow:0 24px 70px oklch(20% 0.02 60 / .35);}
  .ps h2{font-family:'Newsreader',Georgia,serif; margin:0 0 6px; font-size:1.3rem;} .ps p{margin:0 0 10px; font-size:0.9rem; line-height:1.5;}
  .ps ul{margin:0 0 14px; padding:0; list-style:none;} .ps li{padding:8px 0; border-top:1px solid var(--row-line); font-size:0.88rem; line-height:1.45;} .ps li span{display:block; color:var(--grey); margin-top:2px;}
  .ps-acts{display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;}
  .fb-ev{margin-top:5px; padding:5px 9px; border-radius:8px; background:var(--gold-wash); font-size:0.8rem; line-height:1.45;} .fb-ev div{padding:1px 0;} .fb-ev svg.hub-tick{width:1em; height:1em; vertical-align:-0.18em; margin:0 2px 0 0; filter:none;}
  .header{background:var(--surface); border-radius:6px; margin-bottom:20px; border-top:2px solid var(--teal); padding:22px 26px;}
  .header h1{font-family:'Newsreader',Georgia,serif; font-size:1.7rem; margin:0; color:var(--ink);}
  .header .meta{font-size:0.82rem; color:var(--grey); margin-top:8px; display:flex; gap:16px; flex-wrap:wrap;}
  .duepill{display:inline-flex; align-items:center; border:1.5px solid; border-radius:20px;
    padding:3px 12px; font-size:0.78rem; font-weight:700; letter-spacing:0.01em;}
  .locked-banner{background:var(--sand-deep); border-radius:6px; padding:10px 16px; font-size:0.85rem; font-weight:600; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .fb-card{background:oklch(97.8% 0.02 72); border-left:5px solid var(--gold); border-radius:8px; padding:18px 22px; margin-bottom:18px;}
  .fb-card h2{font-family:'Newsreader',Georgia,serif; font-size:1.1rem; margin:0 0 8px; color:var(--ink);}
  /* the tutor's general comment had no size of its own and came out at the browser's 16px, a size nothing else on the screen uses (sweep, 28 Sep 2026) */

  .outcome{display:inline-block; font-weight:700; padding:3px 12px; border-radius:12px; margin-left:8px; font-size:0.82rem;}
  .outcome.pass{background:var(--mark-met-bg); color:var(--mark-met-text);}
  .outcome.resub{background:oklch(93% 0.06 60); color:oklch(40% 0.1 60);}
  .outcome.fail{background:var(--mark-not-bg); color:var(--mark-not-text);}
  /* Gold edges the assignment card (Ramy, 24 Sep 2026: "a rule that runs through all the assignments... so it's not all washed"). Ochre stays the tutor's voice, sand the quoted first round. */
  .card{background:var(--surface); border-radius:6px; padding:18px 22px; margin-bottom:16px; border-left:5px solid var(--gold);}
  .card h2{font-family:'Newsreader',Georgia,serif; font-size:1.1rem; margin:0 0 6px; color:var(--ink);}
  .card .guide{font-size:0.85rem; color:var(--grey); line-height:1.55; margin:0 0 10px;}
  /* Lessons from the Classroom: the trainee's own course, to read before writing (25 Oct 2026) */

  .lb .lb-k{font-size:0.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--grey); font-weight:700; margin:8px 0 0 !important;}
  .lb .lb-more, .lb .lb-sheet{border-top:1px solid var(--sand-line); padding:8px 0;}
  .lb .lb-more > summary, .lb .lb-sheet > summary{font-size:0.9rem; font-weight:600; cursor:pointer;}
  .lb .lb-sheet > summary small{display:inline; margin:0; font-weight:400;}

  .card .crit{font-size:0.8rem; color:var(--teal); margin:0 0 14px; line-height:1.6;}

  .cathint{font-size:0.76rem; color:var(--grey); margin:0 0 8px;}
  /* Reference material -- a letter, a text, a class profile -- is read, so it
     is set to be read: body size, paragraph spacing, its own measure. The
     .guide grey used for a one-line instruction is unreadable at this length. */
  .card .refbody{font-size:0.92rem; line-height:1.65; color:var(--ink); max-width:66ch; margin:0 0 10px;}
  /* Colour, on the edges only. The first try filled the blocks -- a teal wash
     on reference material, gold on the picker, a tint on each header -- and
     it read as one washed-out page (Ramy, 25 Sep 2026: "it's a bit too washed
     now altogether... I was happy with the color before"). So every card is
     paper again, as the rest of Lite is, and the colour says what a block is
     from its left edge: teal for something to read, gold for something to
     choose or fill in, sand for the declaration. */
  .critfold{margin-top:12px; font-size:0.82rem;}
  .critfold summary{cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:6px; font-weight:600; color:var(--teal);}
  .critfold summary::-webkit-details-marker{display:none;}
  .critfold summary::before{content:''; width:6px; height:6px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(-45deg); transition:transform .15s;}
  .critfold[open] summary::before{transform:rotate(45deg);}
  .critfold ol{margin:8px 0 0; padding-left:20px; color:var(--grey); line-height:1.55;}
  details.card.ref{background:var(--surface); border-left-color:var(--teal);}
  details.card.ref summary{cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  details.card.ref summary::-webkit-details-marker{display:none;}
  details.card.ref summary h2{margin:0;}
  details.card.ref .fold{width:8px; height:8px; border-right:1.5px solid var(--grey); border-bottom:1.5px solid var(--grey); transform:rotate(-45deg); transition:transform .15s; flex-shrink:0; margin-right:4px;}
  details.card.ref[open] .fold{transform:rotate(45deg);}
  details.card.ref[open] summary{margin-bottom:8px;}
  details.card.ref .refbody{max-width:70ch;}
  /* The picker and the analysis tables share the gold edge; the gold fill on
     each item's name tag is what tells the four analyses apart from the
     choice above them (Ramy, 25 Sep 2026: "the two colors are washed
     together"). */
  .card.pick, .card.fill{background:var(--surface); border-left-color:var(--gold);}
  /* the item's name tag is the one gold fill left: it is what the four tables
     are about, and it is small */
  .card.fill .itemblock .tag{background:var(--gold-wash); color:var(--gold-deep); border-left:3px solid var(--gold); border-radius:4px;}
  .card.fill .itemblock{border-top:1px solid var(--sand-line); padding-top:16px; margin-top:16px;}
  .card.fill .itemblock:first-of-type{border-top:none; padding-top:0; margin-top:0;}
  /* declCARD, not decl: `.decl` is the class on each checkbox LABEL, and it
     sets display:flex. A card carrying the same name matched that rule too, so
     the whole declaration -- the materials link, the three checkboxes, the AI
     radios and the note -- laid itself out sideways in six narrow columns
     (25 Sep 2026, and the same class-name trap as the Lite house style note). */
  .card.declcard{background:var(--surface); border-left-color:var(--sand-line);}
  .card .refbody strong{font-weight:700;}
  .card.guide-card{padding:12px;}
  .guide-box.guide-solo{margin:0; font-size:0.9rem;}
  .guide-box.guide-solo > summary{font-size:0.95rem; padding:11px 16px;}
  .guide-box.guide-solo .gb{padding:6px 18px 14px; max-width:70ch;}
  .chip{border:2px solid var(--sand-line); background:var(--field); color:var(--ink); font-family:'Karla',sans-serif;
    font-size:0.85rem; padding:7px 14px; border-radius:18px; cursor:pointer; margin:0 6px 6px 0;}
  .chip.picked{background:var(--teal); border-color:var(--teal); color:var(--paper); font-weight:600;}
  .chip.disabled{opacity:0.4; cursor:not-allowed;}
  .itemblock{border-top:1px solid var(--sand-line); padding-top:14px; margin-top:14px;}
  .itemblock:first-child{border-top:none; padding-top:0; margin-top:0;}
  .itemblock .tag{display:inline-block; font-weight:700; font-size:0.85rem; background:var(--sand-deep); padding:4px 10px; border-radius:6px; margin-bottom:10px;}
  .row{margin-bottom:12px;}

  .row .hint{font-size:0.78rem; color:var(--grey); font-style:italic; margin:0 0 6px;}
  /* A label, not a div: the words are half the target, and on a phone the box alone is 21px of it. */
  .decl{display:flex; align-items:flex-start; gap:8px; margin-bottom:8px; font-size:0.87rem; line-height:1.5; cursor:pointer;}
  .decl input{width:auto; accent-color:var(--teal); margin-top:3px; flex:none;}

  .ai-toggle label{display:flex; align-items:center; gap:6px; font-size:0.87rem; font-weight:600; cursor:pointer;}
  .ai-toggle input{width:auto; accent-color:var(--teal);}
  .ai-fields{display:none;}
  .ai-fields.open{display:block;}
  .lockedbox{background:oklch(93% 0.05 145); border-radius:6px; padding:10px 14px; margin-bottom:10px;}
  .lockedtag{font-size:0.78rem; font-weight:700; color:oklch(35% 0.08 145);}
  .readonly{white-space:pre-wrap; font-size:0.88rem; line-height:1.55; color:var(--ink); margin-top:6px;}
  .tutorcomment{background:oklch(97.8% 0.02 72); border-left:4px solid var(--gold); border-radius:6px; padding:10px 14px; margin-bottom:8px; font-size:0.87rem; line-height:1.5;}
  .tutorlabel{display:block; font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--gold); margin-bottom:4px;}
  .navbar{display:flex; justify-content:flex-end; align-items:center; gap:12px; margin-top:20px;}
  .btn{font-family:'Karla',sans-serif; font-size:0.88rem; font-weight:700; padding:10px 22px; border-radius:var(--r-control); border:none; cursor:pointer;}
  .btn-submit{background:var(--teal); color:var(--paper);}
  .btn-submit:disabled{opacity:0.4; cursor:not-allowed;}
  /* A phone. This is the trainee's own screen and the declaration is
     compulsory before Submit lights, so four browser-default 13px boxes stood
     between her and handing in an assignment (Ramy, 24 Sep 2026). The boxes
     are scaled up and each one gets a full-width row to tap, the AI choice
     stacks rather than sharing a line, and Submit runs the width. */
  @media(max-width:560px){
    .decl{align-items:center; gap:12px; padding:6px 0; min-height:44px;}
    .decl input{transform:scale(1.6); transform-origin:left center; margin:0 4px 0 2px;}
    .ai-toggle{flex-direction:column; align-items:stretch; gap:4px;}
    .ai-toggle label{min-height:44px; gap:12px;}
    .ai-toggle input{transform:scale(1.6); transform-origin:left center; margin:0 4px 0 2px;}
    .navbar{flex-wrap:wrap; gap:10px;}
    .navbar .btn-submit{width:100%; min-height:48px; order:3;}
    .navbar .status{flex:1 1 100%;}
  }
  .status{font-size:0.8rem; color:var(--grey);}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .firstround{ background:var(--sand-deep); border-left:4px solid var(--sand-line); border-radius:6px; padding:10px 12px; margin:8px 0 10px; }
  .fr-tag{ display:block; font-size:0.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--grey); margin-bottom:6px; }
  .fr-inline{ background:var(--sand-deep); border-left:3px solid var(--sand-line); border-radius:4px; padding:6px 10px; margin:4px 0 6px; font-size:0.85rem; }
  .copyfirst{ font-family:'Karla',sans-serif; font-size:0.78rem; font-weight:600; margin-top:8px; padding:5px 11px; border-radius:6px; border:1px solid var(--sand-line); background:var(--box); color:var(--teal); cursor:pointer; }
  textarea.resub{ background:oklch(96% 0.04 70); border-color:oklch(82% 0.09 75); }
  textarea.resub:focus{ border-color:oklch(60% 0.12 70); }

  /* ---- v3 (7 Oct 2026): word meter + submit pulse ---- */
  .wm{display:inline-flex; align-items:center; gap:10px; font-family:'Karla',sans-serif; font-size:0.82rem; color:var(--grey);}
  .wm-track{position:relative; width:180px; height:8px; border-radius:999px; background:var(--box); overflow:visible;}
  .wm-band{position:absolute; top:-3px; bottom:-3px; border-radius:4px; background:color-mix(in oklab, var(--teal) 14%, transparent); box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--teal) 35%, transparent);}
  .wm-fill{position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--gold-lifted); transition:width .35s cubic-bezier(.2,.7,.2,1), background-color .3s;}
  .wm-mark{position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--paper); border:2.5px solid var(--gold-deep);
    box-shadow:0 2px 4px oklch(30% 0.04 60 / .25); transition:left .35s cubic-bezier(.2,.7,.2,1), border-color .3s;}
  .wm-txt b{font-family:'Newsreader',Georgia,serif; font-size:1rem; color:var(--ink);}
  .wm.under .wm-txt{color:var(--gold-deep);}
  .wm.in .wm-fill{background:var(--teal);} .wm.in .wm-mark{border-color:var(--teal);} .wm.in .wm-txt{color:var(--teal-deep);}
  .wm.over .wm-fill{background:var(--brick);} .wm.over .wm-mark{border-color:var(--brick);} .wm.over .wm-txt, .wm.over .wm-txt b{color:var(--brick);}

  @media(prefers-reduced-motion:reduce){ .wm-fill, .wm-mark{transition:none;} #submitBtn.av3-ready{animation:none;} }
  @media(max-width:560px){ .wm{flex-wrap:wrap; gap:6px;} .wm-track{width:100%;} }

<script type="text/x-hub-app">
/* Whose room this is -- see hubTraineeRoomOnly in hub-shared.js. A tutor or an
   assessor who reached this page got the trainee's submission form with a
   live Submit button (walk, 22 Sep 2026). */
if (window.hubTraineeRoomOnly && hubTraineeRoomOnly())
  throw new Error('Connect Lite: stopping this page on purpose \u2014 the trainee\u2019s room is not open to this link.');

const WORDING_KEY = 'connect_assignment_wording_v2';
const SUB_KEY = 'connect_assignment_submissions_v1';
let ORDER = ['fol','lrt','lsrt','lfc','a5']; // replaced by the centre's order once the wording is read
const NAMES = { lrt:'LRT', lsrt:'LSRT', fol:'FOL', lfc:'LFC', a5:'Assignment 5' };
const $ = id => document.getElementById(id);
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

let WORDING = null;
try { WORDING = JSON.parse(localStorage.getItem(WORDING_KEY)); } catch(e) {}
// Nothing saved in this browser: the centre's standard wording (assignment-defaults.js).
if (!WORDING && window.CONNECT_HUB_DEFAULT_WORDING) WORDING = JSON.parse(JSON.stringify(window.CONNECT_HUB_DEFAULT_WORDING));
if (WORDING && window.hubWordingFilled) hubWordingFilled(WORDING);   // an assignment holding only a deadline
if (WORDING) { Object.keys(WORDING).forEach(k => {
  const a = WORDING[k]; if (!a || !a.criteria) return;
  a.criteria = a.criteria.map(c => typeof c === 'string' ? {text:c, sectionIndex:null} : c);
}); }
ORDER = hubAssignmentOrder(WORDING);
let SUBS = null;
try { SUBS = JSON.parse(localStorage.getItem(SUB_KEY)); } catch(e) {}
if (!SUBS) SUBS = {};

const params = new URLSearchParams(location.search);
/* No assignment named: open the first one in the CENTRE's order, not a
   hard-coded one. This read defaulted to 'lrt', so the trainee home's
   "Written assignments" door landed on the second assignment however the
   centre had ordered them (trainee walk, 21 Sep 2026). */
let CURRENT = params.get('a') || '';
/* A link to an assignment the centre has since held back would otherwise open
   it anyway; fall back to the first one this trainee can actually see. */
if (WORDING && CURRENT !== 'a5' && (!CURRENT || (!hubReleased(WORDING, CURRENT) && !SUBS[CURRENT]))) {
  CURRENT = ORDER.filter(k => WORDING[k] && k !== 'a5' && (hubReleased(WORDING, k) || SUBS[k]))[0] || CURRENT;
}
if (!CURRENT) CURRENT = ORDER.filter(k => k !== 'a5')[0] || 'fol';

let PICKED = {};   // { sectionIdx: { A:[], B:[] } }
let TEXT = {};      // { sectionIdx: string }
let DECL = {};      // { sectionIdx: { checks:[bool], aiUsed, aiLink, aiPurpose } }
let dirty = false;

function saveSubs(){ localStorage.setItem(SUB_KEY, JSON.stringify(SUBS)); }
function subFor(key){
  if (!SUBS[key]) SUBS[key] = { stage:'draft', usedResubmission:false, sub1:null, sub2:null, feedback:null, criteriaMarks:{sub1:[],sub2:[]}, criteriaComments:{sub1:[],sub2:[]}, round2Seeded:false };
  if (!SUBS[key].criteriaMarks) SUBS[key].criteriaMarks = {sub1:[],sub2:[]};
  if (!SUBS[key].criteriaComments) SUBS[key].criteriaComments = {sub1:[],sub2:[]};
  return SUBS[key];
}
function critsForSection(a, i){ return (a.criteria||[]).map((c,ci)=>({...c,ci})).filter(c=>c.sectionIndex===i); }
function sectionLocked(a, sub, i){
  const crit = critsForSection(a, i);
  if (!crit.length) return false;
  const marks = sub.criteriaMarks.sub1 || [];
  return crit.every(c => marks[c.ci] === true);
}

function renderPicker(){
  /* Held-back assignments are not listed -- but one a trainee has already
     started or submitted always is, so held back can never take their work away. */
  $('picker').innerHTML = ORDER.filter(k => WORDING && WORDING[k] && (k === 'a5' ? a5InPlay(SUBS) : (hubReleased(WORDING, k) || !!SUBS[k]))).map(k =>
    `<button class="${k===CURRENT?'active':''}${/^Fail/.test(((SUBS[k]||{}).feedback||{}).outcome||'') ? ' fail' : /resubmission_needed|returned_unmarked/.test((SUBS[k]||{}).stage||'') ? ' attn' : ''}" data-a="${k}">${NAMES[k]}</button>`).join('');
}
$('picker').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  location.search = '?a=' + b.dataset.a;
});

function collect(){
  const a = WORDING[CURRENT];
  a.sections.forEach((s,i) => {
    if (s.type==='picker') {
      // already tracked live in PICKED via click handlers
    } else if (s.type==='fields') {
      // handled inline via input listeners (FIELDS object below)
    }
  });
}

let FIELDS = {}; // s{idx}_i{itemIdx}_f{fieldIdx} or s{idx} for plain text response
let MATERIALSLINK = '';

function itemsForFieldsSection(a, secIdx){
  // find nearest preceding picker section
  for (let j=secIdx-1; j>=0; j--){
    if (a.sections[j].type==='picker'){
      return hubPickedItems(a.sections[j], PICKED[j]);
    }
  }
  return [];
}

/* PASSAGES FOUND ELSEWHERE (25 Oct 2026): what the tutor attached from the own-work check comes
   back with the assignment. Listed here, and marked in the text on the record. */
function flagsHTML(round){
  const sub = subFor(CURRENT); const l = ((sub.flags || {})[round] || []).filter(Boolean);
  if (!l.length) return '';
  const where = f => { const code = String(f.code || '').toUpperCase();
    if (f.kind === 'web') return `Found on the web: <a href="${esc(f.link || '')}" target="_blank" rel="noopener">${esc(f.title || f.link || '')}</a>`;
    if (f.kind === 'paraphrase') return `Says the same, in other words, as a passage in ${esc(f.course || 'another course')}${f.centre ? ' (' + esc(f.centre) + ')' : ''}${code ? ', ' + esc(code) : ''}`;
    return `Also in ${code ? esc(code) + ' ' : ''}on ${esc(f.course || 'another course')}${f.centre ? ' (' + esc(f.centre) + ')' : ''}`; };
  return `<div class="fb-flags"><h2 style="margin-top:14px;">Passages found elsewhere \u00b7 ${l.length}</h2>
    <p class="guide" style="margin:0 0 8px;">Your tutors attached these from the own-work check. They are marked in your text on the record. The plagiarism section of your candidate agreement says what happens next.</p>
    ${l.map(f => `<div class="fb-flag"><em>\u201C${esc(f.quote)}\u201D</em><div class="fb-flag-where">${where(f)}</div></div>`).join('')}
    <a class="btn btn-quiet sm" href="11_assignment_record.html?a=${encodeURIComponent(CURRENT)}&me=1" style="margin-top:8px;">Open the marked record</a></div>`;
}
function render(){
  const a = WORDING && WORDING[CURRENT];
  if (!a){ $('app').innerHTML = '<div class="card"><p class="guide">This assignment isn\u2019t set up yet \u2014 check with your center.</p></div>'; return; }
  if (CURRENT === 'a5' && !a5InPlay(SUBS)){ $('app').innerHTML = '<div class="card"><p class="guide">Assignment 5 is a center sanction, set by your tutor only after a plagiarism finding. It is not one of your four assignments and there is nothing to do here.</p></div>'; return; }
  const sub = subFor(CURRENT);
  const onRound2 = sub.stage === 'resubmission_needed';
  // Returned unmarked: still round one. The tutor sent it back without
  // marking, so nothing is locked and submitting again is not the resubmission.
  const onRedo = sub.stage === 'returned_unmarked';

  if (onRound2 && !sub.round2Seeded) {
    const seeded = { picked:{}, text:{}, fields:{}, decl:{} };
    const s1 = sub.sub1 || { picked:{}, text:{}, fields:{}, decl:{} };
    a.sections.forEach((s,i) => {
      if (s.type==='declaration') return; // always fresh
      if (sectionLocked(a, sub, i)) return; // locked sections render from sub1 directly, no working state needed
      // Connect's shape (Ramy, 20 Sep 2026): the first attempt stays as it
      // was, read-only; the resubmission is written in its own box, empty
      // until the trainee starts it or copies the first attempt down.
      if (s.type==='text') seeded.text[i] = '';
      if (s.type==='picker') seeded.picked[i] = s1.picked ? s1.picked[i] : undefined;
      if (s.type==='fields') { /* fields start empty too; the copy-down button fills them */ }
    });
    sub.draft = seeded;
    sub.round2Seeded = true;
    saveSubs();
  }

  PICKED = sub.draft && sub.draft.picked ? sub.draft.picked : PICKED;
  TEXT = sub.draft && sub.draft.text ? sub.draft.text : TEXT;
  FIELDS = sub.draft && sub.draft.fields ? sub.draft.fields : FIELDS;
  DECL = sub.draft && sub.draft.decl ? sub.draft.decl : DECL;
  MATERIALSLINK = sub.draft && sub.draft.materialsLink ? sub.draft.materialsLink : MATERIALSLINK;

  const locked = sub.stage==='submitted' || sub.stage==='resubmitted' || sub.stage==='closed';
  /* The header carries what changes -- the deadline and the word count -- and
     nothing that does not. It used to print the format and then every marking
     criterion on one line, joined by dots: six criteria of Cambridge prose
     under the title before a word of the assignment (Ramy, 25 Sep 2026: "that
     top part... is just too crowded"). The criteria fold away under their
     count; the format is in the brief. */
  /* Each assignment's own color (17 Oct 2026), the same as the tutor's marking page. */
  document.body.className = document.body.className.replace(/\bas-\w+/g, '').trim() + ' as-' + CURRENT;
  let html = `<div class="header hue-${esc(CURRENT)} as-head"><p class="eyebrow">Written assignment · ${esc(CURRENT === 'a5' ? 'Assignment 5' : CURRENT.toUpperCase())}</p><h1>${esc(a.title)}</h1>
    <div class="meta">${duePillHTML(dueFor(a, sub), locked)}${a.wordMin?`<span id="wcCounter"></span>`:''}</div>
    ${(a.criteria&&a.criteria.length)?`<details class="critfold"><summary>Marking criteria · ${a.criteria.length}</summary><ol>${a.criteria.map(c=>`<li>${esc(c.text)}</li>`).join('')}</ol></details>`:''}
  </div>`;

  if (locked) html += `<div class="locked-banner"><span>${sub.stage==='closed'?'This assignment is closed.':sub.stage==='resubmitted'?'Resubmitted \u2014 waiting on your tutor.':'Submitted \u2014 waiting on your tutor.'}</span>${sub.stage==='resubmission_needed'?'':''}</div>`;

  if (sub.feedback) {
    const f = sub.feedback;
    const cls = f.outcome==='Pass'||f.outcome==='Pass (on resubmission)' ? 'pass' : f.outcome==='Fail (on resubmission)'||f.outcome==='Fail' ? 'fail' : 'resub';
    html += `<div class="fb-card"><h2>Tutor's feedback <span class="outcome ${cls}">${esc(f.outcome)}</span></h2>
      <p class="guide" style="margin:0;">Comments on specific parts are shown inline next to the relevant section below.</p>
      ${f.generalComment1?`<p>${nl2br(f.generalComment1)}</p>`:''}
      ${f.generalComment2?`<h2 style="margin-top:14px;">On the resubmission</h2><p>${nl2br(f.generalComment2)}</p>`:''}
      ${(function(){
        // Every criterion with its mark and the tutor's comment, for the last
        // round marked. A criterion tied to a section also shows inline there;
        // one that is not tied (FOL's are) showed nowhere before (trainee
        // walk, 20 Sep 2026).
        const round = (sub.criteriaMarks.sub2||[]).some(m=>m===true||m===false) ? 'sub2' : 'sub1';
        const marks = sub.criteriaMarks[round]||[], cms = (sub.criteriaComments&&sub.criteriaComments[round])||[];
        /* What the tutor tied to each criterion in her text (18 Oct 2026): the
           front page and her page agree. */
        const mg = (sub.margin && sub.margin[round]) || [];
        const tiedTo = i => mg.filter(x => x.crit != null && String(x.crit) === String(i) && (x.text || x.tick));
        const rows = (a.criteria||[]).map((c,i)=>({ text:c.text, m:marks[i], cm:cms[i]||'', ev:tiedTo(i) })).filter(r=>r.m===true||r.m===false||r.cm||r.ev.length);
        if (!rows.length) return '';
        return (rows.length ? `<div style="margin-top:12px;">${rows.map(r=>`<div style="display:flex; gap:10px; align-items:flex-start; padding:6px 0; border-top:1px solid var(--sand-line);"><span style="flex:none; font-size:0.72rem; font-weight:700; padding:3px 8px; border-radius:10px; ${r.m===true?'background:var(--mark-met-bg);color:var(--mark-met-text);border:1px solid var(--mark-met-line);':r.m===false?'background:var(--mark-not-bg);color:var(--mark-not-text);border:1px solid var(--mark-not-line);':'background:var(--sand);color:var(--grey);'}">${r.m===true?'Met':r.m===false?'Not met':'\u2014'}</span><div style="font-size:0.85rem; line-height:1.5;"><div>${esc(r.text)}</div>${r.cm?`<div style="color:var(--grey); margin-top:2px;">${nl2br(r.cm)}</div>`:''}${r.ev.length?`<div class="fb-ev">${r.ev.map(x=>`<div>${x.tick?(window.hubTickSVG?hubTickSVG():'\u2713')+' ':''}\u201C${esc(x.quote.length>70?x.quote.slice(0,68)+'\u2026':x.quote)}\u201D${x.tick?((x.n||1)>1?' \u00d7'+x.n:''):': '+esc(x.text)}</div>`).join('')}</div>`:''}</div></div>`).join('')}</div>` : '') + flagsHTML(round);
      })()}
    </div>`;
  }

  if (sub.stage==='resubmission_needed') {
    html += `<div class="locked-banner" style="background:oklch(93% 0.06 60);">Resubmission needed \u2014 you have one attempt. Your first submission stays as it was, read-only; write the resubmission in the amber boxes below it.</div>`;
  }
  if (onRedo) {
    html += `<div class="locked-banner" style="background:oklch(93% 0.06 60);">Returned unmarked \u2014 your tutor sent this back without marking it. Fix what they asked for and submit it again. This does not use your one resubmission.</div>`;
  }

  /* The hidden word (17 Oct 2026): in every section of the brief, invisible -- see hubTrapSpan. */
  const TW = window.hubTrapSpan ? hubTrapSpan(a.trap) : '';
  a.sections.forEach((s,i) => {
    if (s.type==='text') {
      // Reference material: read it, don't write in it. Was the label
      // "Before you start" and nothing else, so an assignment could carry
      // exactly one read-only block and only under that name. C/17's Language
      // Related Tasks needs the letter its items come from, and its skills
      // assignment needs a class profile and three texts (25 Sep 2026).
      const isIntro = hubIsReference(s);
      const crit = critsForSection(a,i);
      const isLockedNow = onRound2 && sectionLocked(a,sub,i);
      if (isIntro) {
        /* Reference material folds. "Before you start" and the texts open,
           because the assignment cannot be done without them; a reading list
           or a list of resubmission pitfalls starts closed, because it is
           there when wanted and in the way when not (Ramy, 25 Sep 2026: "you
           should be able to hide that if you want to"). */
        const startsClosed = /recommended|reading|reference materials|resources|reasons for resubmission/i.test(s.label) && !/^text |the text/i.test(s.label);
        // **bold** in a reference text is the target language ("The target
        // language is in bold"), and it showed as bare asterisks (25 Sep 2026).
        const refHtml = nl2br(s.body).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        /* Advice, not material: "Before you start" and the reasons work comes
           back sit in the house's guidance box (Ramy, 17 Oct 2026: "I like
           that yellow box... use that inside Connect Lite. More often"). */
        if (/^before you start$|reasons for resubmission/i.test(String(s.label).trim()) && window.hubGuidanceHTML) {
          html += `<div class="card guide-card"><details class="guide-box guide-solo"${startsClosed?'':' open'}><summary>${esc(s.label)}</summary><div class="gb">${hubGuidanceHTML(s.body)}${TW}</div></details></div>`;
          return;
        }
        html += `<details class="card ref ${startsClosed?'':'open'}"${startsClosed?'':' open'}><summary><h2>${esc(s.label)}</h2><span class="fold" aria-hidden="true"></span></summary><div class="refbody">${refHtml}${TW}</div></details>`;
        return;
      }
      html += `<div class="card"><h2>${esc(s.label)}</h2><p class="guide">${nl2br(s.body)}${TW}</p>`;
      {
        if (isLockedNow) {
          html += `<div class="lockedbox"><span class="lockedtag">\u2713 Already met \u2014 carried forward, no changes needed</span><div class="readonly">${nl2br((sub.sub1&&sub.sub1.text&&sub.sub1.text[i])||'')}</div></div>`;
        } else {
          if (onRound2) crit.forEach(c => {
            const marks = sub.criteriaMarks.sub1||[]; if (marks[c.ci]===false) {
              const cm = (sub.criteriaComments.sub1||[])[c.ci];
              html += `<div class="tutorcomment"><span class="tutorlabel">Your tutor, on \u201C${esc(c.text)}\u201D</span>${nl2br(cm||'(not met \u2014 no comment left)')}</div>`;
            }
          });
          if (onRound2 && sub.sub1 && sub.sub1.text && sub.sub1.text[i]) html += `<div class="firstround"><span class="fr-tag">Your first submission \u2014 as marked, read-only</span><div class="tmloc" data-loc="t${i}" data-round="sub1"><div class="readonly">${hubHeadHTML(sub.sub1.text[i], s.heads)}</div><div class="tmgut"></div></div><button type="button" class="copyfirst" data-role="copyfirst" data-i="${i}" ${locked?'disabled':''}>Start the resubmission from this</button></div>`;
          const fin = sub.stage === 'closed' ? (sub.sub2 || sub.sub1) : null;
          if (fin && fin.text && fin.text[i]) html += `<div class="tmloc" data-loc="t${i}" data-round="${sub.sub2 ? 'sub2' : 'sub1'}"><div class="readonly">${hubHeadHTML(fin.text[i], s.heads)}</div><div class="tmgut"></div></div>`;
          else if (s.heads && s.heads.length) {
            /* a headline over each part of the answer, a box under each (18 Oct 2026) */
            const hv = hubSplitHeads(TEXT[i], s.heads);
            html += s.heads.map((h, k) => `<label class="hdl" for="h${i}_${k}">${esc(h)}</label><textarea id="h${i}_${k}" data-role="texth" data-i="${i}" data-h="${k}" rows="3" class="${onRound2?'resub':''}" ${locked?'disabled':''} ${onRound2?'placeholder="Your resubmission"':''}>${esc(hv[k]||'')}</textarea>`).join('');
          }
          else html += `<textarea data-role="text" data-i="${i}" rows="4" class="${onRound2?'resub':''}" ${locked?'disabled':''} ${onRound2?'placeholder="Your resubmission"':''}>${esc(TEXT[i]||'')}</textarea>`;
        }
      }
      html += `</div>`;
    } else if (s.type==='picker') {
      const picked = PICKED[i] || {};
      html += `<div class="card pick"><h2>${esc(s.label)}</h2>${TW}${s.intro?`<p class="guide">${nl2br(s.intro)}</p>`:''}<div class="catwrap">
        ${hubPickerCats(s).map(c => {
          const chosen = c.fixed ? c.options : (picked[c.key] || []);
          // A fixed group is not a choice. Everyone analyses it, so its chips
          // show as taken and do nothing -- clearer than hiding it, because
          // the trainee still has to know it is one of their four items.
          return `<div class="catbox"><h3>${esc(c.label)}</h3>
          <p class="cathint">${c.fixed ? 'Everyone analyses this one.' : ('Pick ' + c.pick + (c.pick === 1 ? '.' : '.'))}</p>
          ${c.options.map(opt => `<button type="button" class="chip ${chosen.includes(opt)?'picked':''} ${!c.fixed && !chosen.includes(opt) && chosen.length>=c.pick?'disabled':''}" data-role="chip" data-i="${i}" data-cat="${esc(c.key)}" data-val="${esc(opt)}" ${locked||c.fixed?'disabled':''}>${esc(opt)}</button>`).join('')}
        </div>`; }).join('')}
      </div></div>`;
    } else if (s.type==='fields') {
      const items = itemsForFieldsSection(a, i);
      const crit = critsForSection(a,i);
      const isLockedNow = onRound2 && sectionLocked(a,sub,i);
      html += `<div class="card fill"><h2>${esc(s.label)}</h2>${TW}${s.intro?`<p class="guide">${esc(s.intro)}</p>`:''}`;
      if (!items.length) {
        html += `<p class="guide">Pick your items above first.</p>`;
      } else if (isLockedNow) {
        html += `<div class="lockedbox"><span class="lockedtag">\u2713 Already met \u2014 carried forward, no changes needed</span></div>`;
        items.forEach((item, ii) => {
          html += `<div class="itemblock"><span class="tag">${esc(item)}</span>`;
          s.fields.forEach((f, fi) => {
            const v = (sub.sub1&&sub.sub1.fields&&sub.sub1.fields[`s${i}_i${ii}_f${fi}`])||'';
            html += `<div class="row"><label>${esc(f.label)}</label><div class="readonly">${nl2br(v)}</div></div>`;
          });
          html += `</div>`;
        });
      } else {
        if (onRound2) crit.forEach(c => {
          const marks = sub.criteriaMarks.sub1||[]; if (marks[c.ci]===false) {
            const cm = (sub.criteriaComments.sub1||[])[c.ci];
            html += `<div class="tutorcomment"><span class="tutorlabel">Your tutor, on \u201C${esc(c.text)}\u201D</span>${nl2br(cm||'(not met \u2014 no comment left)')}</div>`;
          }
        });
        if (onRound2 && sub.sub1 && sub.sub1.fields && Object.keys(sub.sub1.fields).some(k=>k.startsWith('s'+i+'_'))) html += `<div class="firstround"><span class="fr-tag">Your first submission \u2014 as marked, read-only, shown under each field</span><button type="button" class="copyfirst" data-role="copyfirst" data-i="${i}" ${locked?'disabled':''}>Start the resubmission from it</button></div>`;
        items.forEach((item, ii) => {
          html += `<div class="itemblock"><span class="tag">${esc(item)}</span>`;
          s.fields.forEach((f, fi) => {
            const first = onRound2 && sub.sub1 && sub.sub1.fields ? (sub.sub1.fields[`s${i}_i${ii}_f${fi}`]||'') : '';
            html += `<div class="row"><label>${esc(f.label)}</label>${f.hint?`<p class="hint">${esc(f.hint)}</p>`:''}${first?`<div class="tmloc" data-loc="f:s${i}_i${ii}_f${fi}" data-round="sub1"><div class="readonly fr-inline">${nl2br(first)}</div><div class="tmgut"></div></div>`:''}
              ${(sub.stage === 'closed' && ((sub.sub2 || sub.sub1 || {}).fields || {})[`s${i}_i${ii}_f${fi}`]) ? `<div class="tmloc" data-loc="f:s${i}_i${ii}_f${fi}" data-round="${sub.sub2 ? 'sub2' : 'sub1'}"><div class="readonly">${nl2br((sub.sub2 || sub.sub1).fields[`s${i}_i${ii}_f${fi}`])}</div><div class="tmgut"></div></div>` : `<textarea data-role="field" data-i="${i}" data-ii="${ii}" data-fi="${fi}" rows="2" class="${onRound2?'resub':''}" ${locked?'disabled':''} ${onRound2?'placeholder="Your resubmission"':''}>${esc((FIELDS[`s${i}_i${ii}_f${fi}`])||'')}</textarea>`}</div>`;
          });
          html += `</div>`;
        });
      }
      html += `</div>`;
    } else if (s.type==='declaration') {
      const d = DECL[i] || { checks:s.items.map(()=>false), aiUsed:'', aiLink:'', aiPurpose:'' };
      html += `<div class="card declcard"><h2>${esc(s.label)}</h2>${TW}
        <div class="row"><label>Materials link (if this assignment uses outside material)</label>
          <p class="hint">If you're linking a Drive file or worksheet here, use different material from any assessed TP lesson \u2014 Handbook 9.2.1.</p>
          <input type="url" data-role="materialslink" value="${esc(MATERIALSLINK)}" placeholder="https://drive.google.com/..." ${locked?'disabled':''}></div>
        ${s.items.map((it,ci)=>`<label class="decl"><input type="checkbox" data-role="decl-check" data-i="${i}" data-ci="${ci}" ${d.checks[ci]?'checked':''} ${locked?'disabled':''}><span>${esc(it)}</span></label>`).join('')}
        ${s.aiToggle?`<div class="ai-toggle">
          <label><input type="radio" name="ai${i}" data-role="ai" data-i="${i}" value="yes" ${d.aiUsed==='yes'?'checked':''} ${locked?'disabled':''}> Used AI</label>
          <label><input type="radio" name="ai${i}" data-role="ai" data-i="${i}" value="no" ${d.aiUsed==='no'?'checked':''} ${locked?'disabled':''}> Did not use AI</label>
        </div>
        <div class="ai-fields ${d.aiUsed==='yes'?'open':''}" data-aibox="${i}">
          <div class="row"><label>Link to the AI conversation</label><input type="url" data-role="ailink" data-i="${i}" value="${esc(d.aiLink)}" ${locked?'disabled':''} placeholder="https://… the shared link to the conversation"></div>
          <div class="row"><label>Purpose</label>
            <select data-role="aipurpose" data-i="${i}" ${locked?'disabled':''}>
              <option value="">\u2014 choose \u2014</option>
              <option value="ideas" ${d.aiPurpose==='ideas'?'selected':''}>Ideas</option>
              <option value="research" ${d.aiPurpose==='research'?'selected':''}>Research</option>
              <option value="proofreading" ${d.aiPurpose==='proofreading'?'selected':''}>Proofreading</option>
            </select></div>
        </div>`:''}
        <p class="hint" style="margin:8px 0 0;">Own work doesn\u2019t exclude joint preparation and discussion \u2014 but submitting an assignment substantially similar to another trainee\u2019s does count as a breach. Unacknowledged AI use is treated as a fail on first submission.</p>
      </div>`;
    }
  });

  // Ramy, 20 Sep 2026: "nothing written means no submit" -- the declaration
  // alone used to be enough, and an empty body went through.
  const openStage = sub.stage==='draft' || sub.stage==='resubmission_needed' || sub.stage==='returned_unmarked';
  const due = dueFor(a, sub);
  const canSubmit = declOk(a) && hasWriting() && openStage && !due.past;
  html += `<div class="navbar"><span class="status" id="status"></span><span class="status" id="emptyHint">${whyNotSubmit(a, sub)}</span>
    <button class="btn btn-submit" id="submitBtn" ${canSubmit?'':'disabled'}>${sub.stage==='resubmission_needed'?'Resubmit':sub.stage==='returned_unmarked'?'Submit again':'Submit'}</button>
  </div>`;

  $('app').innerHTML = html;
  if (window.hubPaintMargin) hubPaintMargin($('app'), sub.margin || {});
  if (window.hubTexts) hubTexts.link($('app'), '.tmloc .readonly, .lockedbox .readonly', a, CURRENT, hubTexts.chosen(sub.sub2 || sub.sub1), 'Read the text you chose');
  const wc = $('wcCounter');
  if (wc) wcMeter(wc, a);
  bindInputs();
}

/* ---- v3 (7 Oct 2026): the word meter ------------------------------------
   The counter as a track: the centre's band (wordMin to wordMax) drawn on
   it, the count as a fill and a marker. Same numbers, same words, same rule
   (wordCountOk); the colour says which side of the band you are on. */
let SUBMIT_WAS_OFF = true;
function wcMeter(el, a){
  const n = countWords(), lo = +a.wordMin || 0, hi = +a.wordMax || 0;
  const top = Math.max(hi * 1.15, n, 1), pc = v => Math.min(100, (v / top) * 100).toFixed(2) + '%';
  const state = n > hi && hi ? 'over' : n >= lo ? 'in' : 'under';
  el.className = 'wm ' + state;
  el.style.color = '';
  el.setAttribute('role', 'meter'); el.setAttribute('aria-valuemin', '0'); el.setAttribute('aria-valuemax', String(hi || lo)); el.setAttribute('aria-valuenow', String(n));
  el.setAttribute('aria-label', n + ' of ' + lo + '\u2013' + hi + ' words');
  el.innerHTML = '<span class="wm-track" aria-hidden="true"><span class="wm-band" style="left:' + pc(lo) + ';width:calc(' + pc(hi) + ' - ' + pc(lo) + ')"></span>'
    + '<span class="wm-fill" style="width:' + pc(n) + '"></span><span class="wm-mark" style="left:' + pc(n) + '"></span></span>'
    + '<span class="wm-txt"><b>' + n + '</b> of ' + lo + '\u2013' + hi + ' words'
    + (state === 'under' ? ' \u00b7 ' + (lo - n) + ' to go' : state === 'over' ? ' \u00b7 ' + (n - hi) + ' over' : ' \u00b7 in range') + '</span>';
}

function countWords(){
  const secs = (WORDING && WORDING[CURRENT] && WORDING[CURRENT].sections) || [];
  let text = Object.keys(TEXT||{}).map(i => hubBareText(TEXT[i], (secs[i] || {}).heads)).join(' ') + ' ' + Object.values(FIELDS||{}).join(' ');
  return (text.match(/\S+/g) || []).length;
}
function wordCountOk(a){
  if (!a.wordMin) return true;
  const n = countWords();
  return n >= a.wordMin && n <= a.wordMax;
}

function refreshGate(){
  const a = WORDING[CURRENT];
  if (!a) return;
  const wc = $('wcCounter');
  if (wc) wcMeter(wc, a);
  const sub = subFor(CURRENT);
  const btn = $('submitBtn');
  const openStage = sub.stage==='draft' || sub.stage==='resubmission_needed' || sub.stage==='returned_unmarked';
  if (btn) btn.disabled = !(declOk(a) && hasWriting() && openStage && !dueFor(a, sub).past);
  /* v3: one gold pulse the moment Submit becomes pressable (7 Oct 2026) */
  if (btn) { if (!btn.disabled && SUBMIT_WAS_OFF) { btn.classList.remove('av3-ready'); void btn.offsetWidth; btn.classList.add('av3-ready'); } SUBMIT_WAS_OFF = btn.disabled; }
  // Its own element: the autosave's 'Saved' flash clears #status a moment later.
  /* This runs on every keystroke, through autosave. It used to carry its own
     copy of the reason and knew only one of the two -- so the declaration
     message that render() put here was WIPED the moment the trainee typed a
     character, and they were back to a dead Submit button that said nothing.
     The reason is computed in one place now (walk, 21 Sep 2026). */
  const eh = $('emptyHint');
  if (eh) eh.textContent = whyNotSubmit(a, sub);
}

/* The reminder. Ramy, 24 Sep 2026: "a reminder, not a warning."
 *
 * So it is quiet while there is time -- the date, plainly -- turns amber
 * inside the last day, and only goes red once it has closed. It says nothing
 * at all once the work is in: a countdown on something already submitted is

function duePillHTML(due, locked){
  if (!due.has || locked) return '';
  const tone = due.past
    ? 'background:oklch(94% 0.05 27);color:oklch(45% 0.15 27);border-color:oklch(45% 0.15 27);'
    : due.soon
      ? 'background:oklch(95% 0.05 75);color:oklch(45% 0.11 62);border-color:oklch(63% 0.096 72);'
      : 'background:var(--box);color:var(--ink-warm);border-color:var(--sand-line);';
  const label = due.past ? (due.resub ? 'Resubmission closed' : 'Closed') : 'Due';
  return `<span class="duepill" style="${tone}">${label} ${esc(due.due)}${due.past ? '' : ' \u00b7 ' + esc(due.text)}${due.extended ? ' \u00b7 your extension' : ''}</span>`;
}

/* The deadline for this assignment, for this person.
 *
 * First submission closes at the assignment's own due date; a resubmission
 * closes `resubDays` after the tutor returned it, because that day differs for
 * every trainee. An extension the tutor has given lives in this trainee's
 * tracker record -- TUTOR_ONLY, so it is read here and never written back --
 * and can only ever give time (hub-due.js). */
function extensions(){
  try { return (JSON.parse(localStorage.getItem('chub:tracker')) || {}).extensions || {}; }
  catch (e) { return {}; }
}
function dueFor(a, sub){
  const resub = sub && sub.stage === 'resubmission_needed';
  const me = window.HubMe || {};
  const base = resub
    ? HubDue.resubFor(a, sub)
    : window.hubDueFor ? hubDueFor(a, me.token, me.group) : (a && a.dueAt) || '';   // their own teaching set's deadline
  const mine = HubDue.forPerson(base, extensions()['a:' + CURRENT + (resub ? ':resub' : '')]);
  return { ...HubDue.state(mine.iso), extended: mine.extended, resub };
}

/* Why Submit is refusing, in the trainee's words -- read by render() and by
   refreshGate() on every keystroke, so the two can never disagree. Empty when
   there is nothing to refuse, or when the stage is closed and the button is
   gone for a reason the banner above already gives. */
function whyNotSubmit(a, sub){
  const openStage = sub.stage==='draft' || sub.stage==='resubmission_needed' || sub.stage==='returned_unmarked';
  if (!openStage) return '';
  const due = dueFor(a, sub);
  /* Said first, because nothing else the trainee fixes will help. And said
     as a fact with a way forward, not a telling-off: the tutor can open it. */
  if (due.past) return (due.resub ? 'The resubmission window closed ' : 'Submission closed ')
    + due.due + '. Ask your tutor if you need it opened.';
  if (!hasWriting()) return 'Nothing written yet \u2014 an empty assignment can\u2019t be submitted.';
  if (!declOk(a)) return 'The declaration at the end is not complete yet \u2014 tick each line, and answer the question about AI.';
  return '';
}

function declOk(a){
  let ok = true;
  a.sections.forEach((s,i) => {
    if (s.type==='declaration') {
      const d = DECL[i];
      // EVERY item, not merely every one recorded. checks is written by index
      // as each box is ticked, so ticking only the first leaves it [true] --
      // length one, nothing false in it, and `some(c=>!c)` was perfectly happy.
      // A trainee could declare the work their own, leave "All sources are
      // referenced" untouched, and submit: the one gate DESIGN-HANDOFF-README
      // calls hard, open (trainee walk, 22 Sep 2026).
      if (!d || !d.checks || !s.items.every((_, ci) => d.checks[ci] === true)) ok = false;
      if (s.aiToggle) {
        if (!d || !d.aiUsed) ok = false;
        else if (d.aiUsed==='yes' && (!d.aiLink || !d.aiPurpose)) ok = false;
      }
    }
  });
  return ok;
}

   the word count, sources in the text and the bibliography, LRT's page
   numbers and phonemic script, the materials link. Anything to look at is
   listed, with Go back and Submit anyway: it never stops a submission. */
function preSubmit(){
  const a = WORDING[CURRENT];
  const items = window.hubWorkChecks ? hubWorkChecks(a, snapshot(), CURRENT, 'trainee').filter(x => x.state === 'look') : [];
  if (!items.length) { doSubmit(); return; }
  let ov = document.getElementById('preSubmit');
  if (!ov) { ov = document.createElement('div'); ov.id = 'preSubmit'; ov.className = 'ps-wrap'; document.body.appendChild(ov); }
  ov.innerHTML = `<div class="ps" role="dialog" aria-label="Before you submit"><h2>Before you submit</h2><p>Lite read your work and found ${items.length === 1 ? 'one thing' : items.length + ' things'} worth a look. You can still submit as it is.</p>
    <ul>${items.map(x => `<li><b>${esc(x.label)}</b>${x.detail ? `<span>${esc(x.detail)}</span>` : ''}</li>`).join('')}</ul>
    <div class="ps-acts"><button type="button" class="btn" id="psBack">Go back and look</button><button type="button" class="btn btn-submit" id="psGo">Submit anyway</button></div></div>`;
  ov.hidden = false;
  document.getElementById('psBack').onclick = () => { ov.hidden = true; };
  document.getElementById('psGo').onclick = () => { ov.hidden = true; doSubmit(); };
}
function doSubmit(){
  const sub = subFor(CURRENT);
  const snap = snapshot();
  if (sub.stage === 'resubmission_needed') {
    /* Carry the locked sections into the resubmission. A section whose every
       criterion was met renders as the green "Already met — carried forward"
       box, which has no field in it, and snapshot() collects fields -- so the
       resubmission went to the tutor holding ONLY the sections that had been
       reopened. Four sections a tutor had already passed simply vanished from
       sub2, and with them from the assessor's record of the resubmission
       (trainee walk, 22 Sep 2026). "Carried forward" was true of the screen
       and not of the data. */
    const wa = WORDING && WORDING[CURRENT];
    (wa && wa.sections || []).forEach((sec, i) => {
      if (!sectionLocked(wa, sub, i)) return;
      const first = sub.sub1 || {};
      if (sec.type === 'text') {
        if (snap.text[i] == null && first.text) snap.text[i] = first.text[i];
      } else if (sec.type === 'picker') {
        if (snap.picked[i] == null && first.picked) snap.picked[i] = first.picked[i];
      } else if (sec.type === 'fields' && first.fields) {
        Object.keys(first.fields).forEach(k => {
          if (k.indexOf('s' + i + '_') === 0 && snap.fields[k] == null) snap.fields[k] = first.fields[k];
        });
      }
    });
    sub.sub2 = snap;
    sub.sub2At = new Date().toISOString();
    sub.stage = 'resubmitted';
    sub.usedResubmission = true;
  } else {
    sub.sub1 = snap;
    sub.sub1At = new Date().toISOString();
    sub.stage = 'submitted';
  }
  saveSubs();
  render();
}

/* ---- LOOK BACK OVER YOUR COURSE (25 Oct 2026) ------------------------------
   Lessons from the Classroom is a reflection, and its brief says where each part comes from:
     A  Your strengths      from the tutor feedback on your three most recent TPs, each backed by a tutor comment
                            and the TP it is from, "(TP6)"; a peer comment too if you can.
     B  Your action points  from the same feedback, the same way.
     C  What you learned    for each action point, one example of another teacher avoiding it: from the peer
        from watching       observation tasks, the tutors' live lessons or the video observations; who, what they

     D  After the course    the trainee's own thinking; nothing in the record gives it, so the notebook is nearest.
   So the card is a folded desk above the brief, always there (not on a timeline), laid out in the brief's own
   order: the tutors' words for the last three lessons in full (the rest folded), what classmates connected with
   them, the observation sheets they wrote (peer, live, filmed) with their actual notes, and their own notebook
   with the notes tutors and classmates connected with them. Nothing is copied into the answer. This page is the
   trainee's room alone, so no mode check. */
function lfcMount(){

    const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
    const ME = rd('hub:me') || {};

    /* ---- A and B: what the tutors wrote, TP by TP ---- */
    const H = rd('chub:tpHistory') || {};
    const nums = Object.keys(H).map(Number).filter(n => n > 0 && H[n] && (H[n].docHTML || H[n].state)).sort((a, b) => b - a);   // newest first
    const items = (fb, ids) => { const L = (fb && fb.state && fb.state.lists) || {}; return ids.reduce((a, k) => a.concat((L[k] || []).map(it => it && txt(it.html)).filter(Boolean)), []); };

    /* ---- C: what the trainee wrote while watching others ---- */

    const W = rd('connect_observation_wording_v1');
    const TASKS = (W && W.peer) ? W : (window.CONNECT_HUB_OBSERVATION_DEFAULTS || { peer: [], filmed: [], live: [] });
    const val = (A, f) => String((A || {})[f] || '').trim();
    const who = (task, sit, c) => {
      const tch = (task.tp && window.hubPeerTeachers) ? hubPeerTeachers(String(ME.group || ''), task.tp, sit) : null, pp = tch && tch[c];

    const written = (task, sit, A) => {
      const out = [];
      if (task.shape === 'grid') (task.rows || []).forEach((q, i) => { const ls = [0, 1, 2].map(c => ({ w: who(task, sit, c), t: val(A, 'r' + i + 'c' + c) })).filter(x => x.t); if (ls.length) out.push({ q, ls }); });

        + (parts ? '<p class="guide" style="margin:6px 0 0">This sheet is in lettered parts; read it on its own page.</p>' : '')
        + '<div class="lb-links"><a href="' + link + '">Open the sheet</a></div></details>';

    const peerBoxes = [];
    (TASKS.peer || []).forEach(t => ['a', 'b'].forEach(sit => { const k = t.id + '#' + sit; const h = sheetBox('TP' + t.tp + sit, t.title, t, k, sit, '18_observation_tasks.html?task=' + encodeURIComponent(t.id) + '&sit=' + sit); if (h) peerBoxes.push({ n: t.tp, h }); }));
    const liveBoxes = (TASKS.live || []).map((t, i) => sheetBox('Live observation ' + (i + 1), t.title, t, t.id, '', '18_observation_tasks.html?task=' + encodeURIComponent(t.id))).filter(Boolean);
    const filmBoxes = (TASKS.filmed || []).map((t, i) => sheetBox('Video ' + (i + 1), t.title, t, t.id, '', '18_observation_tasks.html?task=' + encodeURIComponent(t.id))).filter(Boolean);
    const sectionC = '<h3>C · What you watched</h3>'
      + '<p class="guide">The brief asks for who, what they did, and why it worked: a classmate or tutor by first name, or the video number. These are your own notes from each sheet.</p>'
      + ((peerBoxes.length || liveBoxes.length || filmBoxes.length)
        ? (liveBoxes.length ? '<p class="lb-k">Tutors’ live lessons</p>' + liveBoxes.join('') : '')
          + (filmBoxes.length ? '<p class="lb-k">Video observations</p>' + filmBoxes.join('') : '')
          + (peerBoxes.length ? '<p class="lb-k">Peer observations</p>' + peerBoxes.map(x => x.h).join('') : '')
        : '<p class="guide" style="margin:0">Nothing written on an observation sheet yet.</p>')
      + '<div class="lb-links"><a href="18_observation_tasks.html">All your observation sheets</a></div>';

    /* ---- D, and all of it: the notebook, and what was connected with the trainee ---- */
    const notes = (window.HubNotebook && HubNotebook.load ? (HubNotebook.load().notes || []) : []).filter(n => n && (n.text || n.audio)).slice().sort((a, b) => String(a.at).localeCompare(String(b.at)));
    const CN = (rd('connect_notes_v1') || []).filter(n => n && n.text);
    const dayOf = n => (window.HubNotebook && HubNotebook.dayLabel ? HubNotebook.dayLabel(n.day, true) : String(n.day || '')) + (n.thread && n.thread.k !== 'day' && n.thread.t ? ' · ' + n.thread.t : '');
    const noteP = n => '<div class="lb-note"><p class="lb-k">' + esc(dayOf(n)) + '</p><p>' + esc(n.text || 'A voice note') + '</p></div>';
    const connP = n => '<div class="lb-note"><p class="lb-k">' + esc(dayOf(n)) + ' · connected with you by ' + esc(n.by || 'a classmate') + (n.fromTutor ? ' (tutor)' : '') + '</p><p>' + esc(n.text) + '</p></div>';
    const sectionD = '<h3>Your own words · and D, After the course</h3>'
      + '<p class="guide">The brief leaves what comes next to you. Your notes and the ones people connected with you are the nearest thing the course holds.</p>'
      + (notes.length ? '<details class="lb-more"><summary>Your notebook · ' + plural(notes.length, 'note', 'notes') + '</summary>' + notes.map(noteP).join('') + '<div class="lb-links"><a href="37_notebook.html">Open your notebook</a></div></details>' : '<p class="guide" style="margin:0">No notes yet. The arc in the corner of any page opens your notebook.</p>')
      + (CN.length ? '<details class="lb-more"><summary>Connected with you · ' + plural(CN.length, 'note', 'notes') + '</summary>' + CN.map(connP).join('') + '</details>' : '');

    const watched = peerBoxes.length + liveBoxes.length + filmBoxes.length;
    const brief = [nums.length ? plural(nums.length, 'returned lesson', 'returned lessons') : '', watched ? plural(watched, 'observation sheet', 'observation sheets') : '', (SH.filter(x => !x.locked).length) ? plural(SH.filter(x => !x.locked).length, 'classmate sheet', 'classmate sheets') : '', notes.length ? plural(notes.length, 'note', 'notes') : ''].filter(Boolean).join(', ');
    const box = document.createElement('details'); box.id = 'lfcBack'; box.className = 'card lb'; box.style.marginTop = '14px';
    box.innerHTML = '<summary>Look back over your course' + (brief ? '<small>' + esc(brief) + '</small>' : '') + '</summary><div class="lb-in">'
      + '<p class="guide" style="margin:0 0 4px">This assignment starts from your own course. It follows the order of the brief below. Read what you have, then write in your own words. Nothing here is copied into your answer.</p>'
      + sectionA + shBlock + sectionC + sectionD + '</div>';
    const app = document.getElementById('app'); if (!app) return;
    const hdr = app.querySelector('.header');
    if (hdr && hdr.parentNode === app) hdr.after(box); else app.insertBefore(box, app.firstChild);
  } catch (e) {}
}
(function(){ if (typeof render !== 'function') return; const r1 = render; render = function(){ r1.apply(this, arguments); lfcMount(); }; lfcMount(); })();
