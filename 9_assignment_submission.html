<!DOCTYPE html>
<!--

  © 2026 Ramy Sakr. All rights reserved.
  Renders whatever structure the centre built in 8_assignment_wording.html.
  Same first-submission / one-resubmission mechanism as the rest of Connect.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Connect Lite — Assignment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Sans:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(92.5% 0.012 85); --sand-line:oklch(89.5% 0.012 82); --sand-deep:oklch(94.8% 0.01 85);
    --paper:oklch(96.4% 0.014 85);
    /* --box: what a control is filled with -- every button, every field.
       It was --paper, stark white (Ramy, 21 Sep 2026: "I'm not a big fan of
       white... all those white boxes could turn into that sort of different
       beige colour"), and is now the tone Course links and the double-marking
       cards already used. Named for its job, not its look, so a control and a
       panel can part company later. --paper stays white for its own two jobs:
       text on a teal fill, and the arcs of the mark. */
    --box:oklch(96.2% 0.02 80); --card:oklch(96.2% 0.02 80); --ink:oklch(23.5% 0.017 65);
    --teal:oklch(37.5% 0.058 195); --grey:oklch(51% 0.017 70); --brick:oklch(45% 0.15 27);
    --ochre:oklch(63% 0.096 72); --olive:oklch(37.5% 0.058 195);
  }
  *{box-sizing:border-box;}
  a{color:var(--teal);} a:hover{color:oklch(30% 0.06 195);}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:32px 16px 100px; display:flex; justify-content:center;}
  .board{max-width:820px; width:100%;}
  .picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .picker button{font-family:'Karla',sans-serif; font-size:0.82rem; font-weight:600; padding:7px 14px; border-radius:16px;
    border:1.5px solid var(--sand-line); background:var(--card); color:var(--ink); cursor:pointer;}
  .picker button.active{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .header{background:var(--paper); border-radius:6px; margin-bottom:20px; border-top:2px solid var(--teal); padding:22px 26px;}
  .header h1{font-family:'Newsreader',Georgia,serif; font-size:1.7rem; margin:0; color:var(--ink);}
  .header .meta{font-size:0.82rem; color:var(--grey); margin-top:8px; display:flex; gap:16px; flex-wrap:wrap;}
  .locked-banner{background:var(--sand-deep); border-radius:6px; padding:10px 16px; font-size:0.85rem; font-weight:600; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .fb-card{background:oklch(97.8% 0.02 72); border-left:5px solid var(--ochre); border-radius:8px; padding:18px 22px; margin-bottom:18px;}
  .fb-card h2{font-family:'Newsreader',Georgia,serif; font-size:1.1rem; margin:0 0 8px; color:var(--ink);}
  .outcome{display:inline-block; font-weight:700; padding:3px 12px; border-radius:12px; margin-left:8px; font-size:0.82rem;}
  .outcome.pass{background:oklch(93% 0.05 145); color:oklch(35% 0.08 145);}
  .outcome.resub{background:oklch(93% 0.06 60); color:oklch(40% 0.1 60);}
  .outcome.fail{background:oklch(92% 0.08 27); color:var(--brick);}
  .card{background:var(--paper); border-radius:6px; padding:18px 22px; margin-bottom:16px; border-left:5px solid var(--sand-line);}
  .card h2{font-family:'Newsreader',Georgia,serif; font-size:1.1rem; margin:0 0 6px; color:var(--ink);}
  .card .guide{font-size:0.85rem; color:var(--grey); line-height:1.55; margin:0 0 10px;}
  .card .crit{font-size:0.8rem; color:var(--teal); margin:0 0 14px; line-height:1.6;}
  textarea, input[type=text], input[type=url]{width:100%; font-family:'Karla',sans-serif; font-size:0.9rem; padding:9px 12px;
    border:1.5px solid var(--sand-line); border-radius:6px; background:#FFFDF8; color:var(--ink); line-height:1.55; resize:vertical;}
  .catwrap{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:600px){ .catwrap{grid-template-columns:1fr;} }
  .catbox h3{font-family:'Newsreader',Georgia,serif; font-size:0.95rem; margin:0 0 6px;}
  .chip{border:2px solid var(--sand-line); background:#FFFDF8; color:var(--ink); font-family:'Karla',sans-serif;
    font-size:0.85rem; padding:7px 14px; border-radius:18px; cursor:pointer; margin:0 6px 6px 0;}
  .chip.picked{background:var(--teal); border-color:var(--teal); color:var(--paper); font-weight:600;}
  .chip.disabled{opacity:0.4; cursor:not-allowed;}
  .itemblock{border-top:1px solid var(--sand-line); padding-top:14px; margin-top:14px;}
  .itemblock:first-child{border-top:none; padding-top:0; margin-top:0;}
  .itemblock .tag{display:inline-block; font-weight:700; font-size:0.85rem; background:var(--sand-deep); padding:4px 10px; border-radius:6px; margin-bottom:10px;}
  .row{margin-bottom:12px;}
  .row label{display:block; font-size:0.75rem; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;}
  .row .hint{font-size:0.78rem; color:var(--grey); font-style:italic; margin:0 0 6px;}
  .decl{display:flex; align-items:flex-start; gap:8px; margin-bottom:8px; font-size:0.87rem; line-height:1.5;}
  .decl input{width:auto; accent-color:var(--teal); margin-top:3px; flex:none;}
  .ai-toggle{display:flex; gap:16px; align-items:center; margin:10px 0;}
  .ai-toggle label{display:flex; align-items:center; gap:6px; font-size:0.87rem; font-weight:600; cursor:pointer;}
  .ai-toggle input{width:auto; accent-color:var(--teal);}
  .ai-fields{display:none;}
  .ai-fields.open{display:block;}
  .lockedbox{background:oklch(93% 0.05 145); border-radius:6px; padding:10px 14px; margin-bottom:10px;}
  .lockedtag{font-size:0.78rem; font-weight:700; color:oklch(35% 0.08 145);}
  .readonly{white-space:pre-wrap; font-size:0.88rem; line-height:1.55; color:var(--ink); margin-top:6px;}
  .tutorcomment{background:oklch(97.8% 0.02 72); border-left:4px solid var(--ochre); border-radius:6px; padding:10px 14px; margin-bottom:8px; font-size:0.87rem; line-height:1.5;}
  .tutorlabel{display:block; font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ochre); margin-bottom:4px;}
  .navbar{display:flex; justify-content:flex-end; align-items:center; gap:12px; margin-top:20px;}
  .btn{font-family:'Karla',sans-serif; font-size:0.88rem; font-weight:700; padding:10px 22px; border-radius:20px; border:none; cursor:pointer;}
  .btn-submit{background:var(--teal); color:var(--paper);}
  .btn-submit:disabled{opacity:0.4; cursor:not-allowed;}
  .status{font-size:0.8rem; color:var(--grey);}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .firstround{ background:var(--sand-deep); border-left:4px solid var(--sand-line); border-radius:6px; padding:10px 12px; margin:8px 0 10px; }
  .fr-tag{ display:block; font-size:0.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--grey); margin-bottom:6px; }
  .fr-inline{ background:var(--sand-deep); border-left:3px solid var(--sand-line); border-radius:4px; padding:6px 10px; margin:4px 0 6px; font-size:0.85rem; }
  .copyfirst{ font-family:'Karla',sans-serif; font-size:0.78rem; font-weight:600; margin-top:8px; padding:5px 11px; border-radius:6px; border:1px solid var(--sand-line); background:var(--box); color:var(--teal); cursor:pointer; }
  textarea.resub{ background:oklch(96% 0.04 70); border-color:oklch(82% 0.09 75); }
  textarea.resub:focus{ border-color:oklch(60% 0.12 70); }
</style>

<body class="hub-assign">
<div class="board">
  <a class="back" href="index.html">&larr; Back</a>
<div class="picker" id="picker"></div>
  <div id="app"></div>
</div>
<script src="assignment-defaults.js?v=202609211521"></script>
<script src="hub-shared.js?v=202609211521"></script>
<script src="hub-store.js?v=202609211521"></script>
<script src="hub-sync.js?v=202609211521"></script>
<script type="text/x-hub-app">
const WORDING_KEY = 'connect_assignment_wording_v2';
const SUB_KEY = 'connect_assignment_submissions_v1';
let ORDER = ['fol','lrt','lsrt','lfc','a5']; // replaced by the centre's order once the wording is read
const NAMES = { lrt:'LRT', lsrt:'LSRT', fol:'FOL', lfc:'LFC', a5:'Assignment 5' };
const $ = id => document.getElementById(id);
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

let WORDING = null;
try { WORDING = JSON.parse(localStorage.getItem(WORDING_KEY)); } catch(e) {}
// Nothing saved in this browser: the centre's standard wording (assignment-defaults.js).
if (!WORDING && window.CONNECT_HUB_DEFAULT_WORDING) WORDING = JSON.parse(JSON.stringify(window.CONNECT_HUB_DEFAULT_WORDING));
if (WORDING) { Object.keys(WORDING).forEach(k => {
  const a = WORDING[k]; if (!a || !a.criteria) return;
  a.criteria = a.criteria.map(c => typeof c === 'string' ? {text:c, sectionIndex:null} : c);
}); }
ORDER = hubAssignmentOrder(WORDING);
let SUBS = null;
try { SUBS = JSON.parse(localStorage.getItem(SUB_KEY)); } catch(e) {}
if (!SUBS) SUBS = {};

const params = new URLSearchParams(location.search);
let CURRENT = params.get('a') || 'lrt';
/* A link to an assignment the centre has since held back would otherwise open
   it anyway; fall back to the first one this trainee can actually see. */
if (WORDING && CURRENT !== 'a5' && !hubReleased(WORDING, CURRENT) && !SUBS[CURRENT]) {
  CURRENT = ORDER.filter(k => WORDING[k] && k !== 'a5' && (hubReleased(WORDING, k) || SUBS[k]))[0] || CURRENT;
}

let PICKED = {};   // { sectionIdx: { A:[], B:[] } }
let TEXT = {};      // { sectionIdx: string }
let DECL = {};      // { sectionIdx: { checks:[bool], aiUsed, aiLink, aiPurpose } }
let dirty = false;

function saveSubs(){ localStorage.setItem(SUB_KEY, JSON.stringify(SUBS)); }
function subFor(key){
  if (!SUBS[key]) SUBS[key] = { stage:'draft', usedResubmission:false, sub1:null, sub2:null, feedback:null, criteriaMarks:{sub1:[],sub2:[]}, criteriaComments:{sub1:[],sub2:[]}, round2Seeded:false };
  if (!SUBS[key].criteriaMarks) SUBS[key].criteriaMarks = {sub1:[],sub2:[]};
  if (!SUBS[key].criteriaComments) SUBS[key].criteriaComments = {sub1:[],sub2:[]};
  return SUBS[key];
}
function critsForSection(a, i){ return (a.criteria||[]).map((c,ci)=>({...c,ci})).filter(c=>c.sectionIndex===i); }
function sectionLocked(a, sub, i){
  const crit = critsForSection(a, i);
  if (!crit.length) return false;
  const marks = sub.criteriaMarks.sub1 || [];
  return crit.every(c => marks[c.ci] === true);
}

function renderPicker(){
  /* Held-back assignments are not listed -- but one a trainee has already
     started or submitted always is, so held back can never take their work away. */
  $('picker').innerHTML = ORDER.filter(k => WORDING && WORDING[k] && (k === 'a5' ? a5InPlay(SUBS) : (hubReleased(WORDING, k) || !!SUBS[k]))).map(k =>
    `<button class="${k===CURRENT?'active':''}" data-a="${k}">${NAMES[k]}</button>`).join('');
}
$('picker').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  location.search = '?a=' + b.dataset.a;
});

function collect(){
  const a = WORDING[CURRENT];
  a.sections.forEach((s,i) => {
    if (s.type==='picker') {
      // already tracked live in PICKED via click handlers
    } else if (s.type==='fields') {
      // handled inline via input listeners (FIELDS object below)
    }
  });
}

let FIELDS = {}; // s{idx}_i{itemIdx}_f{fieldIdx} or s{idx} for plain text response
let MATERIALSLINK = '';

function itemsForFieldsSection(a, secIdx){
  // find nearest preceding picker section
  for (let j=secIdx-1; j>=0; j--){
    if (a.sections[j].type==='picker'){
      const p = PICKED[j] || {A:[],B:[]};
      return p.A.concat(p.B);
    }
  }
  return [];
}

function render(){
  const a = WORDING && WORDING[CURRENT];
  if (!a){ $('app').innerHTML = '<div class="card"><p class="guide">This assignment isn\u2019t set up yet \u2014 check with your centre.</p></div>'; return; }
  if (CURRENT === 'a5' && !a5InPlay(SUBS)){ $('app').innerHTML = '<div class="card"><p class="guide">Assignment 5 is a centre sanction, set by your tutor only after a plagiarism finding. It is not one of your four assignments and there is nothing to do here.</p></div>'; return; }
  const sub = subFor(CURRENT);
  const onRound2 = sub.stage === 'resubmission_needed';
  // Returned unmarked: still round one. The tutor sent it back without
  // marking, so nothing is locked and submitting again is not the resubmission.
  const onRedo = sub.stage === 'returned_unmarked';

  if (onRound2 && !sub.round2Seeded) {
    const seeded = { picked:{}, text:{}, fields:{}, decl:{} };
    const s1 = sub.sub1 || { picked:{}, text:{}, fields:{}, decl:{} };
    a.sections.forEach((s,i) => {
      if (s.type==='declaration') return; // always fresh
      if (sectionLocked(a, sub, i)) return; // locked sections render from sub1 directly, no working state needed
      // Connect's shape (Ramy, 20 Sep 2026): the first attempt stays as it
      // was, read-only; the resubmission is written in its own box, empty
      // until the trainee starts it or copies the first attempt down.
      if (s.type==='text') seeded.text[i] = '';
      if (s.type==='picker') seeded.picked[i] = s1.picked ? s1.picked[i] : undefined;
      if (s.type==='fields') { /* fields start empty too; the copy-down button fills them */ }
    });
    sub.draft = seeded;
    sub.round2Seeded = true;
    saveSubs();
  }

  PICKED = sub.draft && sub.draft.picked ? sub.draft.picked : PICKED;
  TEXT = sub.draft && sub.draft.text ? sub.draft.text : TEXT;
  FIELDS = sub.draft && sub.draft.fields ? sub.draft.fields : FIELDS;
  DECL = sub.draft && sub.draft.decl ? sub.draft.decl : DECL;
  MATERIALSLINK = sub.draft && sub.draft.materialsLink ? sub.draft.materialsLink : MATERIALSLINK;

  let html = `<div class="header"><p class="eyebrow">Written assignments</p><h1>${esc(a.title)}</h1>
    <div class="meta">${a.wordMin?`<span id="wcCounter"></span>`:''}${a.format?`<span>${a.format==='prose'?'Continuous prose':'Structured'}</span>`:''}</div>
    ${(a.criteria&&a.criteria.length)?`<p class="crit"><strong>Marking criteria:</strong> ${a.criteria.map(c=>esc(c.text)).join(' \u00b7 ')}</p>`:''}
  </div>`;

  const locked = sub.stage==='submitted' || sub.stage==='resubmitted' || sub.stage==='closed';
  if (locked) html += `<div class="locked-banner"><span>${sub.stage==='closed'?'This assignment is closed.':sub.stage==='resubmitted'?'Resubmitted \u2014 waiting on your tutor.':'Submitted \u2014 waiting on your tutor.'}</span>${sub.stage==='resubmission_needed'?'':''}</div>`;

  if (sub.feedback) {
    const f = sub.feedback;
    const cls = f.outcome==='Pass'||f.outcome==='Pass (on resubmission)' ? 'pass' : f.outcome==='Fail (on resubmission)'||f.outcome==='Fail' ? 'fail' : 'resub';
    html += `<div class="fb-card"><h2>Tutor's feedback <span class="outcome ${cls}">${esc(f.outcome)}</span></h2>
      <p class="guide" style="margin:0;">Comments on specific parts are shown inline next to the relevant section below.</p>
      ${f.generalComment1?`<p>${nl2br(f.generalComment1)}</p>`:''}
      ${f.generalComment2?`<h2 style="margin-top:14px;">On the resubmission</h2><p>${nl2br(f.generalComment2)}</p>`:''}
      ${(function(){
        // Every criterion with its mark and the tutor's comment, for the last
        // round marked. A criterion tied to a section also shows inline there;
        // one that is not tied (FOL's are) showed nowhere before (trainee
        // walk, 20 Sep 2026).
        const round = (sub.criteriaMarks.sub2||[]).some(m=>m===true||m===false) ? 'sub2' : 'sub1';
        const marks = sub.criteriaMarks[round]||[], cms = (sub.criteriaComments&&sub.criteriaComments[round])||[];
        const rows = (a.criteria||[]).map((c,i)=>({ text:c.text, m:marks[i], cm:cms[i]||'' })).filter(r=>r.m===true||r.m===false||r.cm);
        if (!rows.length) return '';
        return `<div style="margin-top:12px;">${rows.map(r=>`<div style="display:flex; gap:10px; align-items:flex-start; padding:6px 0; border-top:1px solid var(--sand-line);"><span style="flex:none; font-size:0.72rem; font-weight:700; padding:3px 8px; border-radius:10px; ${r.m===true?'background:#EAF3E9;color:#1E6B63;':r.m===false?'background:#FBEAE6;color:#A33227;':'background:var(--sand);color:var(--grey);'}">${r.m===true?'Met':r.m===false?'Not met':'\u2014'}</span><div style="font-size:0.85rem; line-height:1.5;"><div>${esc(r.text)}</div>${r.cm?`<div style="color:var(--grey); margin-top:2px;">${nl2br(r.cm)}</div>`:''}</div></div>`).join('')}</div>`;
      })()}
    </div>`;
  }

  if (sub.stage==='resubmission_needed') {
    html += `<div class="locked-banner" style="background:oklch(93% 0.06 60);">Resubmission needed \u2014 you have one attempt. Your first submission stays as it was, read-only; write the resubmission in the amber boxes below it.</div>`;
  }
  if (onRedo) {
    html += `<div class="locked-banner" style="background:oklch(93% 0.06 60);">Returned unmarked \u2014 your tutor sent this back without marking it. Fix what they asked for and submit it again. This does not use your one resubmission.</div>`;
  }

  a.sections.forEach((s,i) => {
    if (s.type==='text') {
      const isIntro = /before you start/i.test(s.label);
      const crit = critsForSection(a,i);
      const isLockedNow = onRound2 && sectionLocked(a,sub,i);
      html += `<div class="card"><h2>${esc(s.label)}</h2><p class="guide">${nl2br(s.body)}</p>`;
      if (!isIntro) {
        if (isLockedNow) {
          html += `<div class="lockedbox"><span class="lockedtag">\u2713 Already met \u2014 carried forward, no changes needed</span><div class="readonly">${nl2br((sub.sub1&&sub.sub1.text&&sub.sub1.text[i])||'')}</div></div>`;
        } else {
          if (onRound2) crit.forEach(c => {
            const marks = sub.criteriaMarks.sub1||[]; if (marks[c.ci]===false) {
              const cm = (sub.criteriaComments.sub1||[])[c.ci];
              html += `<div class="tutorcomment"><span class="tutorlabel">Your tutor, on \u201C${esc(c.text)}\u201D</span>${nl2br(cm||'(not met \u2014 no comment left)')}</div>`;
            }
          });
          if (onRound2 && sub.sub1 && sub.sub1.text && sub.sub1.text[i]) html += `<div class="firstround"><span class="fr-tag">Your first submission \u2014 as marked, read-only</span><div class="readonly">${nl2br(sub.sub1.text[i])}</div><button type="button" class="copyfirst" data-role="copyfirst" data-i="${i}" ${locked?'disabled':''}>Start the resubmission from this</button></div>`;
          html += `<textarea data-role="text" data-i="${i}" rows="4" class="${onRound2?'resub':''}" ${locked?'disabled':''} ${onRound2?'placeholder="Your resubmission"':''}>${esc(TEXT[i]||'')}</textarea>`;
        }
      }
      html += `</div>`;
    } else if (s.type==='picker') {
      const picked = PICKED[i] || {A:[],B:[]};
      html += `<div class="card"><h2>${esc(s.label)}</h2><div class="catwrap">
        ${['A','B'].map(cat => `<div class="catbox"><h3>${esc(s['cat'+cat].label)}</h3>
          ${s['cat'+cat].options.map(opt => `<button type="button" class="chip ${picked[cat].includes(opt)?'picked':''} ${!picked[cat].includes(opt)&&picked[cat].length>=s.pickCount?'disabled':''}" data-role="chip" data-i="${i}" data-cat="${cat}" data-val="${esc(opt)}" ${locked?'disabled':''}>${esc(opt)}</button>`).join('')}
        </div>`).join('')}
      </div></div>`;
    } else if (s.type==='fields') {
      const items = itemsForFieldsSection(a, i);
      const crit = critsForSection(a,i);
      const isLockedNow = onRound2 && sectionLocked(a,sub,i);
      html += `<div class="card"><h2>${esc(s.label)}</h2>${s.intro?`<p class="guide">${esc(s.intro)}</p>`:''}`;
      if (!items.length) {
        html += `<p class="guide">Pick your items above first.</p>`;
      } else if (isLockedNow) {
        html += `<div class="lockedbox"><span class="lockedtag">\u2713 Already met \u2014 carried forward, no changes needed</span></div>`;
        items.forEach((item, ii) => {
          html += `<div class="itemblock"><span class="tag">${esc(item)}</span>`;
          s.fields.forEach((f, fi) => {
            const v = (sub.sub1&&sub.sub1.fields&&sub.sub1.fields[`s${i}_i${ii}_f${fi}`])||'';
            html += `<div class="row"><label>${esc(f.label)}</label><div class="readonly">${nl2br(v)}</div></div>`;
          });
          html += `</div>`;
        });
      } else {
        if (onRound2) crit.forEach(c => {
          const marks = sub.criteriaMarks.sub1||[]; if (marks[c.ci]===false) {
            const cm = (sub.criteriaComments.sub1||[])[c.ci];
            html += `<div class="tutorcomment"><span class="tutorlabel">Your tutor, on \u201C${esc(c.text)}\u201D</span>${nl2br(cm||'(not met \u2014 no comment left)')}</div>`;
          }
        });
        if (onRound2 && sub.sub1 && sub.sub1.fields && Object.keys(sub.sub1.fields).some(k=>k.startsWith('s'+i+'_'))) html += `<div class="firstround"><span class="fr-tag">Your first submission \u2014 as marked, read-only, shown under each field</span><button type="button" class="copyfirst" data-role="copyfirst" data-i="${i}" ${locked?'disabled':''}>Start the resubmission from it</button></div>`;
        items.forEach((item, ii) => {
          html += `<div class="itemblock"><span class="tag">${esc(item)}</span>`;
          s.fields.forEach((f, fi) => {
            const first = onRound2 && sub.sub1 && sub.sub1.fields ? (sub.sub1.fields[`s${i}_i${ii}_f${fi}`]||'') : '';
            html += `<div class="row"><label>${esc(f.label)}</label>${f.hint?`<p class="hint">${esc(f.hint)}</p>`:''}${first?`<div class="readonly fr-inline">${nl2br(first)}</div>`:''}
              <textarea data-role="field" data-i="${i}" data-ii="${ii}" data-fi="${fi}" rows="2" class="${onRound2?'resub':''}" ${locked?'disabled':''} ${onRound2?'placeholder="Your resubmission"':''}>${esc((FIELDS[`s${i}_i${ii}_f${fi}`])||'')}</textarea></div>`;
          });
          html += `</div>`;
        });
      }
      html += `</div>`;
    } else if (s.type==='declaration') {
      const d = DECL[i] || { checks:s.items.map(()=>false), aiUsed:'', aiLink:'', aiPurpose:'' };
      html += `<div class="card"><h2>${esc(s.label)}</h2>
        <div class="row"><label>Materials link (if this assignment uses outside material)</label>
          <p class="hint">If you're linking a Drive file or worksheet here, use different material from any assessed TP lesson \u2014 Handbook 8.2.1.</p>
          <input type="url" data-role="materialslink" value="${esc(MATERIALSLINK)}" placeholder="https://drive.google.com/..." ${locked?'disabled':''}></div>
        ${s.items.map((it,ci)=>`<div class="decl"><input type="checkbox" data-role="decl-check" data-i="${i}" data-ci="${ci}" ${d.checks[ci]?'checked':''} ${locked?'disabled':''}><span>${esc(it)}</span></div>`).join('')}
        ${s.aiToggle?`<div class="ai-toggle">
          <label><input type="radio" name="ai${i}" data-role="ai" data-i="${i}" value="yes" ${d.aiUsed==='yes'?'checked':''} ${locked?'disabled':''}> Used AI</label>
          <label><input type="radio" name="ai${i}" data-role="ai" data-i="${i}" value="no" ${d.aiUsed==='no'?'checked':''} ${locked?'disabled':''}> Did not use AI</label>
        </div>
        <div class="ai-fields ${d.aiUsed==='yes'?'open':''}" data-aibox="${i}">
          <div class="row"><label>Link to the AI conversation</label><input type="url" data-role="ailink" data-i="${i}" value="${esc(d.aiLink)}" ${locked?'disabled':''}></div>
          <div class="row"><label>Purpose</label>
            <select data-role="aipurpose" data-i="${i}" ${locked?'disabled':''}>
              <option value="">\u2014 choose \u2014</option>
              <option value="ideas" ${d.aiPurpose==='ideas'?'selected':''}>Ideas</option>
              <option value="research" ${d.aiPurpose==='research'?'selected':''}>Research</option>
              <option value="proofreading" ${d.aiPurpose==='proofreading'?'selected':''}>Proofreading</option>
            </select></div>
        </div>`:''}
        <p class="hint" style="margin:8px 0 0;">Own work doesn\u2019t exclude joint preparation and discussion \u2014 but submitting an assignment substantially similar to another candidate\u2019s does count as a breach. Unacknowledged AI use is treated as a fail on first submission.</p>
      </div>`;
    }
  });

  // Ramy, 20 Sep 2026: "nothing written means no submit" -- the declaration
  // alone used to be enough, and an empty body went through.
  const openStage = sub.stage==='draft' || sub.stage==='resubmission_needed' || sub.stage==='returned_unmarked';
  const canSubmit = declOk(a) && hasWriting() && openStage;
  html += `<div class="navbar"><span class="status" id="status"></span><span class="status" id="emptyHint">${whyNotSubmit(a, sub)}</span>
    <button class="btn btn-submit" id="submitBtn" ${canSubmit?'':'disabled'}>${sub.stage==='resubmission_needed'?'Resubmit':sub.stage==='returned_unmarked'?'Submit again':'Submit'}</button>
  </div>`;

  $('app').innerHTML = html;
  const wc = $('wcCounter');
  if (wc) { const n = countWords(); wc.textContent = `${n} of ${a.wordMin}\u2013${a.wordMax} words`; wc.style.color = wordCountOk(a) ? '' : 'var(--brick)'; }
  bindInputs();
}

function countWords(){
  let text = Object.values(TEXT||{}).join(' ') + ' ' + Object.values(FIELDS||{}).join(' ');
  return (text.match(/\S+/g) || []).length;
}
function wordCountOk(a){
  if (!a.wordMin) return true;
  const n = countWords();
  return n >= a.wordMin && n <= a.wordMax;
}

function refreshGate(){
  const a = WORDING[CURRENT];
  if (!a) return;
  const wc = $('wcCounter');
  if (wc) { const n = countWords(); wc.textContent = `${n} of ${a.wordMin}–${a.wordMax} words`; wc.style.color = wordCountOk(a) ? '' : 'var(--brick)'; }
  const sub = subFor(CURRENT);
  const btn = $('submitBtn');
  const openStage = sub.stage==='draft' || sub.stage==='resubmission_needed' || sub.stage==='returned_unmarked';
  if (btn) btn.disabled = !(declOk(a) && hasWriting() && openStage);
  // Its own element: the autosave's 'Saved' flash clears #status a moment later.
  /* This runs on every keystroke, through autosave. It used to carry its own
     copy of the reason and knew only one of the two -- so the declaration
     message that render() put here was WIPED the moment the candidate typed a
     character, and they were back to a dead Submit button that said nothing.
     The reason is computed in one place now (walk, 21 Sep 2026). */
  const eh = $('emptyHint');
  if (eh) eh.textContent = whyNotSubmit(a, sub);
}
// At least one word in any answer. Picked items alone are not writing.
function hasWriting(){ return countWords() > 0; }

/* Why Submit is refusing, in the candidate's words -- read by render() and by
   refreshGate() on every keystroke, so the two can never disagree. Empty when
   there is nothing to refuse, or when the stage is closed and the button is
   gone for a reason the banner above already gives. */
function whyNotSubmit(a, sub){
  const openStage = sub.stage==='draft' || sub.stage==='resubmission_needed' || sub.stage==='returned_unmarked';
  if (!openStage) return '';
  if (!hasWriting()) return 'Nothing written yet \u2014 an empty assignment can\u2019t be submitted.';
  if (!declOk(a)) return 'The declaration at the end is not complete yet \u2014 tick each line, and answer the question about AI.';
  return '';
}

function declOk(a){
  let ok = true;
  a.sections.forEach((s,i) => {
    if (s.type==='declaration') {
      const d = DECL[i];
      if (!d || !d.checks || d.checks.some(c=>!c)) ok = false;
      if (s.aiToggle) {
        if (!d || !d.aiUsed) ok = false;
        else if (d.aiUsed==='yes' && (!d.aiLink || !d.aiPurpose)) ok = false;
      }
    }
  });
  return ok;
}

function bindInputs(){
  // Connect bullets the structured assignments' answers (assignment-form.tsx); prose stays prose.
  if (WORDING && WORDING[CURRENT] && WORDING[CURRENT].format === 'structured' && window.hubBullets) $('app').querySelectorAll('textarea[data-role="text"], textarea[data-role="field"]').forEach(hubBullets);
  $('app').querySelectorAll('[data-role="copyfirst"]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i, sub = subFor(CURRENT), s1 = sub.sub1 || {};
    if (s1.text && s1.text[i] != null) TEXT[i] = s1.text[i];
    Object.keys(s1.fields||{}).forEach(k => { if (k.startsWith('s'+i+'_')) FIELDS[k] = s1.fields[k]; });
    autosave(); render();
  }));
  document.querySelectorAll('[data-role="text"]').forEach(el => el.addEventListener('input', () => {
    TEXT[el.dataset.i] = el.value; dirty = true; autosave();
  }));
  document.querySelectorAll('[data-role="chip"]').forEach(el => el.addEventListener('click', () => {
    const i = el.dataset.i, cat = el.dataset.cat, val = el.dataset.val;
    const a = WORDING[CURRENT]; const s = a.sections[i];
    if (!PICKED[i]) PICKED[i] = {A:[],B:[]};
    const arr = PICKED[i][cat];
    const idx = arr.indexOf(val);
    if (idx!==-1) arr.splice(idx,1);
    else { if (arr.length >= s.pickCount) return; arr.push(val); }
    dirty = true; autosave(); render();
  }));
  document.querySelectorAll('[data-role="field"]').forEach(el => el.addEventListener('input', () => {
    FIELDS[`s${el.dataset.i}_i${el.dataset.ii}_f${el.dataset.fi}`] = el.value; dirty = true; autosave();
  }));
  document.querySelectorAll('[data-role="decl-check"]').forEach(el => el.addEventListener('change', () => {
    const i = el.dataset.i, ci = +el.dataset.ci;
    if (!DECL[i]) DECL[i] = { checks:[], aiUsed:'', aiLink:'', aiPurpose:'' };
    DECL[i].checks[ci] = el.checked; dirty = true; autosave(); render();
  }));
  document.querySelectorAll('[data-role="ai"]').forEach(el => el.addEventListener('change', () => {
    const i = el.dataset.i;
    if (!DECL[i]) DECL[i] = { checks:[], aiUsed:'', aiLink:'', aiPurpose:'' };
    DECL[i].aiUsed = el.value; dirty = true; autosave(); render();
  }));
  document.querySelectorAll('[data-role="ailink"]').forEach(el => el.addEventListener('input', () => {
    const i = el.dataset.i; if (!DECL[i]) DECL[i]={checks:[],aiUsed:'',aiLink:'',aiPurpose:''}; DECL[i].aiLink = el.value; dirty=true; autosave();
  }));
  document.querySelectorAll('[data-role="aipurpose"]').forEach(el => el.addEventListener('change', () => {
    const i = el.dataset.i; if (!DECL[i]) DECL[i]={checks:[],aiUsed:'',aiLink:'',aiPurpose:''}; DECL[i].aiPurpose = el.value; dirty=true; autosave();
  }));
  document.querySelectorAll('[data-role="materialslink"]').forEach(el => el.addEventListener('input', () => {
    MATERIALSLINK = el.value; dirty = true; autosave();
  }));
  const btn = $('submitBtn');
  if (btn) btn.addEventListener('click', doSubmit);
}

function snapshot(){ return { picked:PICKED, text:TEXT, fields:FIELDS, decl:DECL, materialsLink:MATERIALSLINK }; }

function autosave(){
  const sub = subFor(CURRENT);
  sub.draft = snapshot();
  saveSubs();
  refreshGate();
  const s = $('status'); if (s) { s.textContent = 'Saved'; setTimeout(()=>{ if($('status')) $('status').textContent=''; }, 1200); }
}

function doSubmit(){
  const sub = subFor(CURRENT);
  const snap = snapshot();
  if (sub.stage === 'resubmission_needed') {
    sub.sub2 = snap;
    sub.sub2At = new Date().toISOString();
    sub.stage = 'resubmitted';
    sub.usedResubmission = true;
  } else {
    sub.sub1 = snap;
    sub.sub1At = new Date().toISOString();
    sub.stage = 'submitted';
  }
  saveSubs();
  render();
}

renderPicker();
render();
</script>
</body>
</html>
