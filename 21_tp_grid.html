<!DOCTYPE html>
<!--
  Connect Lite — the TP7 & TP8 planning grid
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 28 Sep 2026, with the center's Word sheet: "Trainees choose their
  own aims and the lessons they're going to teach... they fill it out...
  they don't have to turn it in, but everyone should be able to see it."
  Then: "it shouldn't live there until the MCT releases it", and "it's for
  TP7 and TP8, the last two TPs" -- so the two are read off the course's
  TP count, not set anywhere.

  One grid per TP group, one row per trainee, and for each of the two
  teaching practices a main aim, a sub aim and the material. A trainee
  edits their own row and reads the group's; a tutor edits any row and
  releases per group; the assessor reads. Two things the paper sheet could
  not do: a clash -- two trainees in a group picking the same main aim
  for the same TP -- is marked amber, and each trainee's main aims from
  the earlier teaching practices sit beside their name, read from the
  returned feedback, so they choose what they have not taught yet.
-->

<style>
  body{background:var(--sand); color:var(--ink); font-family:'Karla',sans-serif; margin:0;}
  .board{max-width:1080px; margin:0 auto; padding:26px 20px 80px;}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.7rem; margin:0 0 4px;}
  .lede{color:var(--grey); font-size:0.88rem; line-height:1.6; margin:0 0 18px; max-width:70ch;}
  section.group{background:var(--surface); border:1px solid var(--sand-line); border-left:5px solid var(--teal); border-radius:10px; padding:16px 20px 18px; margin:0 0 18px;}
  section.group h2{font-family:'Newsreader',Georgia,serif; font-size:1.2rem; margin:0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  section.group h2 small{font-family:'Karla',sans-serif; font-size:0.8rem; font-weight:500; color:var(--grey);}
  .relbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0 0;}
  .relnote{font-size:0.8rem; color:var(--grey);}
  .openbox .opt{display:flex; gap:10px; align-items:flex-start; margin:10px 0 0; padding:10px 12px; border:1px solid var(--sand-line); border-radius:10px; background:var(--paper); cursor:pointer;}
  .openbox .opt.on{border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal);}
  .openbox .opt input[type=radio]{accent-color:var(--teal); margin-top:3px;}
  .openbox .opt b{display:block; font-size:0.95rem;} .openbox .opt small{display:block; font-size:0.84rem; color:var(--grey); line-height:1.45;}
  .openbox .opt input[type=datetime-local]{margin-top:8px; font:inherit; font-size:0.9rem; padding:7px 10px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:inherit;}
  .openbox .opt:not(.on) input[type=datetime-local]{display:none;}
  .chip.wait{background:var(--gold-wash); color:var(--ink); border:1px solid var(--amber-edge);}
  .check{margin:10px 0 0; padding:14px 16px; border-radius:var(--r-strip); background:var(--gold-wash); border:1px solid var(--amber-edge); border-left:4px solid var(--gold);}
  .check .ttl{font-family:'Newsreader',Georgia,serif; font-size:1.05rem; font-weight:600; margin:0 0 4px;}
  .check .msg{font-size:0.9rem; line-height:1.5;}
  .check .acts{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:10px;}
  .check .opts{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-top:12px;}
  .check .opts label.f{display:block; font-size:0.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--grey); margin-bottom:4px;}
  .check .opts input[type=datetime-local], .check .opts input[type=text]{width:100%; box-sizing:border-box; font:inherit; font-size:0.9rem; padding:8px 10px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:inherit;}
  .check .opts .tick{display:flex; align-items:center; gap:9px; font-size:0.88rem; align-self:end; padding-bottom:6px;}
  .check .opts .tick input{accent-color:var(--teal);}
  .dueline{font-size:0.82rem; margin:8px 0 0; color:var(--grey);}
  .dueline b{color:var(--ink); font-weight:600;}
  .dueline.soon b, .dueline.past b{color:var(--gold-deep);}
  @media (max-width:560px){ .check .opts{grid-template-columns:1fr;} }
  .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:14px 0 0;}
  table.grid{width:100%; border-collapse:collapse; font-size:0.86rem; background:var(--paper); border:1px solid var(--sand-line); border-radius:8px;}
  table.grid th{font-size:0.66rem; letter-spacing:.06em; text-transform:uppercase; color:var(--grey); text-align:left; padding:8px 8px; border-bottom:1px solid var(--sand-line); font-weight:700; white-space:nowrap;}
  table.grid th.tp{text-align:center; font-family:'Newsreader',Georgia,serif; font-size:0.95rem; letter-spacing:0; text-transform:none; color:var(--ink); border-left:1px solid var(--sand-line);}
  table.grid td{padding:8px 8px; border-bottom:1px solid var(--sand-line); vertical-align:top;}
  table.grid td.first{border-left:1px solid var(--sand-line);}
  table.grid tr:last-child td{border-bottom:0;}
  table.grid tr.mine td{background:color-mix(in oklab, var(--teal) 6%, var(--paper));}
  .nm{font-weight:600; white-space:nowrap; display:flex; align-items:center;}
  .nm .you{font-size:0.66rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--teal); margin-left:8px;}
  .sofar{font-size:0.74rem; color:var(--grey); margin-top:4px; white-space:normal; max-width:220px; line-height:1.4;}
  .sofar b{font-weight:600; color:var(--ink);}
  .cell{min-width:150px;}
  .cell .house-sel select, .cell input{width:100%; box-sizing:border-box; font:inherit; font-size:0.86rem;}
  /* One height for every cell -- the select, the material box and the
     read-only cell (Ramy, 28 Sep 2026: "make the materials box the same
     size as the rest"). The select's own height is 46px with the house's
     4px gold edge; the other two are built to match it. */
  .cell input{height:46px; padding:0 14px; border:1px solid var(--sand-line); border-left:4px solid var(--gold); border-radius:8px; background:var(--sand-deep); color:inherit;}
  .cell input:focus{outline:none; border-color:var(--gold);}
  table.grid .ro{height:46px; box-sizing:border-box; display:flex; align-items:center; padding:0 14px; border-radius:8px; background:var(--sand-deep); color:var(--ink); font-size:0.86rem;}
  table.grid .ro.empty{color:var(--faint); font-style:italic;}
  .cell.clash .ro, .cell.clash .house-sel select{box-shadow:inset 0 0 0 1.5px var(--gold);}
  .clashnote{font-size:0.78rem; color:var(--gold-deep); font-weight:600; margin:8px 0 0;}
  .aims{font-size:0.8rem; color:var(--grey); margin:12px 0 0; line-height:1.55;}
  .status{font-size:0.8rem; color:var(--grey); margin-left:auto;}
  .empty{padding:20px; color:var(--grey); font-size:0.9rem;}
  @media (max-width:560px){ .board{padding:18px 12px 60px;} section.group{padding:12px 12px 14px;} .sofar{max-width:160px;} }

  /* EACH TP A CARD (Ramy, 26 Nov 2026: "each TP a full card ... the pills inside it ... funky ... blue, like we did with
     the tracker"). One row a trainee; beside the name, a deep blue card for each teaching practice: its number, the main
     aim and the sub aim as pills to tap (tap the chosen one again to clear it), the material under them. Both cards wear the tracker's
     dark card colour (Ramy: one colour is enough). A hidden select under each set of pills keeps the saving and the aims map exactly as they were. */
  table.grid{table-layout:fixed; border:0; background:none; border-collapse:separate; border-spacing:0;} table.grid col.c-who{width:22%;}
  .tablewrap{overflow:visible;}
  table.grid thead{display:none;}
  table.grid td{border:0; padding:0; vertical-align:top;}
  table.grid tbody tr td:first-child{padding:18px 14px 12px 0;}
  table.grid tbody tr + tr td{border-top:1px solid var(--sand-line);}
  .tpcol{padding:12px 0 12px 12px !important;}
  .tpbox{--c:oklch(24% 0.012 280); --c2:oklch(29% 0.012 280); --cl:oklch(38% 0.012 280); --ci:oklch(97% 0.005 85); --cd:oklch(78% 0.01 85);
    display:flex; flex-direction:column; gap:12px; height:100%; box-sizing:border-box; padding:16px 18px 18px; border-radius:14px;
    background:var(--c); color:var(--ci); border-top:3px solid var(--teal); box-shadow:0 10px 24px -16px oklch(20% 0.02 280 / .7);}
  .aimwarn{margin:0; padding:8px 10px; border-radius:8px; background:oklch(84% 0.12 78 / .14); border-left:3px solid oklch(84% 0.12 78); font-size:0.8rem; line-height:1.45; color:var(--ci);}
  .aimwarn b{color:oklch(86% 0.12 78);} .aimwarn[hidden]{display:none;}
  .tph{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.45rem; line-height:1; color:var(--ci);}
  .tpbox .cell{min-width:0;}
  .tpbox .lab, .sofar .lab{display:block; font-size:0.64rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin:0 0 6px;}
  .tpbox .lab{color:var(--cd);} .sofar .lab{color:var(--grey);}
  .pills{display:flex; flex-wrap:wrap; gap:6px;}
  .pill{font:inherit; font-size:0.8rem; font-weight:600; line-height:1; padding:7px 12px; border-radius:999px; cursor:pointer;
    background:transparent; color:var(--cd); border:1px solid var(--cl); transition:transform .15s ease, background .15s ease;}
  .pill:hover{transform:translateY(-1px); color:var(--ci); border-color:var(--cd);}
  .pill.on{background:var(--ci); color:var(--c); border-color:var(--ci); font-weight:700;}
  table.grid .tpbox .ro{display:block; height:auto; padding:0; background:none; color:var(--ci); font-size:0.86rem;}
  .tpbox .ro .pill{cursor:default;} table.grid .tpbox .ro.empty{color:var(--cd); font-style:italic;}
  .tpbox .cell input{height:42px; background:var(--c2); color:var(--ci); border:1px solid var(--cl); border-radius:8px;}
  .tpbox .cell input::placeholder{color:var(--cd);} .tpbox .cell input:focus{border-color:var(--ci);}
  .tpbox .cell.clash .pill.on{box-shadow:0 0 0 2px oklch(84% 0.12 78);}
  table.grid .tpbox .cell.clash .ro{box-shadow:none;} .tpbox .cell:focus-within{outline:none;}
  .sofar{max-width:none; margin-top:10px;}
  .sofar b{display:inline-block; margin:0 6px 4px 0; padding:2px 8px; border-radius:999px; background:var(--sand-deep); font-size:0.72rem; font-weight:600; color:var(--ink);}
  table.grid tr.mine .tpbox{box-shadow:0 0 0 3px oklch(84% 0.12 78 / .8), 0 10px 24px -16px oklch(25% 0.08 255 / .7);}
  table.grid tr.mine td{background:none;}
  @media (max-width:760px){
    table.grid, table.grid tbody, table.grid tr, table.grid td{display:block; width:100%;} table.grid colgroup{display:none;}
    table.grid tbody tr td:first-child{padding:16px 0 4px;}
    table.grid tbody tr + tr td{border-top:0;} table.grid tbody tr + tr td:first-child{border-top:1px solid var(--sand-line);}
    .tpcol{padding:8px 0 !important;}
  }

  /* 26 Nov 2026, the page around the cards (Ramy: "fix the rest of the page"): a header with the fill-in date, the rules
     in one card (must / can / can't), the teaching order in its own card, a white panel per trainee. */
  .hdr{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin:0 0 14px;}
  .hdr h1{margin:2px 0 0;}
  .rowdue{font-size:0.88rem; font-weight:600; padding:8px 14px; border-radius:999px; background:var(--paper); border:1px solid var(--sand-line);} .rowdue b{color:var(--gold-deep);}
  .rulecard{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); background:var(--paper); border:1px solid var(--sand-line); border-top:3px solid var(--teal); border-radius:14px; overflow:hidden; margin:0 0 18px;}
  .rulecard > div{padding:14px 18px;} .rulecard > div + div{border-left:1px solid var(--sand-line);}
  .rulecard .w{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.2rem; margin:0 0 8px; display:flex; align-items:center; gap:8px;}
  .rulecard .w i{width:10px; height:10px; border-radius:50%; display:inline-block;} .rulecard .d1{background:var(--teal);} .rulecard .d2{background:oklch(55% 0.09 150);} .rulecard .d3{background:var(--brick);} .rulecard .d4{background:var(--gold);}
  .rulecard p{margin:0 0 6px; font-size:0.88rem; line-height:1.45;}
  .order{background:var(--sand); border:1px solid var(--sand-line); border-radius:12px; padding:12px 16px; margin:12px 0 6px;}
  .order h3{font-family:'Newsreader',Georgia,serif; font-size:1.15rem; margin:0 0 6px;}
  .orow{display:grid; grid-template-columns:56px minmax(0,1fr); gap:12px; align-items:center; padding:8px 0; border-top:1px solid var(--sand-line);}
  .orow:first-of-type{border-top:0;} .orow .tp{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.2rem;} .orow .none{margin:0; font-size:0.85rem; color:var(--grey);}
  .dcols{display:flex; flex-wrap:wrap; gap:10px 28px;}
  .dayx .d, .picker .d{font-size:0.78rem; color:var(--grey); font-weight:600; margin:0 0 5px;}
  .seats{display:flex; gap:6px; flex-wrap:wrap;}
  .seat{display:flex; align-items:center; gap:7px; padding:4px 11px 4px 4px; border-radius:999px; background:oklch(24% 0.012 280); color:oklch(97% 0.005 85); font-size:0.82rem; font-weight:600;}
  .seat > span{width:22px; height:22px; border-radius:50%; background:oklch(32% 0.012 280); display:inline-flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700;}
  .seat.me{background:oklch(84% 0.12 78); color:var(--ink);} .seat.me > span{background:oklch(92% 0.07 85);}
  .seat.open{background:transparent; color:var(--grey); border:1.5px dashed var(--sand-line); font-style:italic; font-weight:500;} .seat.open > span{background:var(--sand-deep); color:var(--grey); font-style:normal;}
  .dwarn{font-size:0.84rem; padding:7px 10px; border-radius:8px; background:var(--gold-wash); border-left:3px solid var(--amber-edge); margin:6px 0 0;}
  table.grid tbody tr td:first-child{padding:16px 14px 12px 0;}
  .who2{display:flex; align-items:center; gap:10px; margin:0 0 10px;}
  .who2 .av{width:32px; height:32px; border-radius:9px; background:oklch(24% 0.012 280); color:oklch(97% 0.005 85); display:flex; align-items:center; justify-content:center; font-weight:700; flex:none;}
  .who2 b{font-size:0.98rem;} .who2 small{display:block; font-size:0.66rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-deep);}
  .done .lab3{display:block; font-size:0.64rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--grey); margin:0 0 4px;}
  .chips{display:flex; flex-wrap:wrap; gap:4px; margin:0 0 8px;}
  .chips em{font-style:normal; font-size:0.74rem; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--sand-deep);}
  .chips em.n{background:var(--gold-wash); border:1px solid var(--amber-edge);}
  .done .kind{display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin:0 0 6px;} .done .kind > span{font-size:0.72rem; font-weight:600; color:var(--grey); min-width:62px;}
  .done .kind em{font-style:normal; font-size:0.74rem; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--sand-deep);}
  .theirs{display:inline-block; font-size:0.8rem; font-weight:700; color:var(--teal);}
  .tpbox .chosen{background:var(--c2); border:1px solid var(--cl); border-radius:10px; padding:10px 12px; font-size:0.84rem; line-height:1.45;}
  .tpbox .chosen b{display:block; font-size:0.86rem;} .tpbox .chosen span{color:var(--cd);} .tpbox .chosen.empty{color:var(--cd); font-style:italic;}
  .tpbox .chosen .ch{float:right; font-size:0.76rem; font-weight:700; color:var(--cd); margin-left:8px;}
  .tpbox .pickmat{background:var(--c2); border:1px dashed var(--cl); border-radius:10px; padding:10px 12px; font-size:0.86rem;}
  .tpbox .pickmat a{display:block; color:var(--ci); font-weight:700;}
  .tpbox .lnk{font:inherit; background:none; border:0; padding:0; color:var(--cd); font-size:0.78rem; font-weight:600; text-decoration:underline; cursor:pointer; display:block; margin-top:2px;}
  .tpbox .when{display:flex; align-items:center; gap:10px; font-size:0.88rem; font-weight:600;}
  .tpbox .when .n{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.2rem; background:oklch(84% 0.12 78); color:var(--ink); border-radius:8px; padding:3px 10px;}
  .tpbox .when .n.none{background:var(--c2); color:var(--cd);}
  .tpbox .picker{display:flex; flex-wrap:wrap; gap:10px 20px; background:var(--c2); border-radius:10px; padding:10px 12px;}
  .tpbox .picker .d{color:var(--cd);}
  .tpbox .pk{font:inherit; font-size:0.8rem; font-weight:600; padding:6px 10px; margin:0 5px 5px 0; border-radius:999px; border:1px solid var(--cl); background:transparent; color:var(--ci); cursor:pointer;}
  .tpbox .pk.on{background:var(--ci); color:var(--c);} .tpbox .pk:disabled{opacity:.45; cursor:default;}
  .tpbox .aimblock{margin:0; padding:8px 10px; border-radius:8px; background:oklch(60% 0.15 27 / .22); border-left:3px solid oklch(70% 0.15 27); font-size:0.8rem; line-height:1.45; color:var(--ci);}
  .tpbox .aimblock b{color:oklch(82% 0.11 27);}
  .ag-map{display:none !important;}
  .matbtn{font-size:0.9rem; font-weight:700; padding:9px 16px; border-radius:999px; background:var(--paper); border:1px solid var(--teal); color:var(--teal); text-decoration:none;}
  .tpbox .cell input:focus{background:var(--c2) !important; color:var(--ci) !important; border-color:var(--ci) !important;}
  table.grid .tpbox .ro .pill{display:inline-block; margin-top:2px;}
  .rowdue{text-transform:none !important; letter-spacing:0 !important;}
  @media (max-width:980px) and (min-width:761px){ .rulecard{grid-template-columns:1fr 1fr;} .rulecard > div:nth-child(3){border-left:0;} .rulecard > div:nth-child(n+3){border-top:1px solid var(--sand-line);} }
  @media (max-width:760px){ .rulecard{grid-template-columns:1fr;} .rulecard > div + div{border-left:0; border-top:1px solid var(--sand-line);} .orow{grid-template-columns:1fr;} }
  @media print{ .back, .relbar, .check, #hubSync{display:none !important;} body{background:#fff;} }

  /* ---- v2 (7 Oct 2026): the group's aims at a glance ------------------------
     Above each group's table, one line per TP: the main aims the group has
     chosen, as chips, two of the same in gold (the clash the note below
     already names), and how many have not chosen. Each row that has all six
     cells filled gets a quiet tick by the name. Display only; the cells, the
     saving and the release are untouched. Design: Magic Touches, 11a. */
  .ag-map{display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px 14px; align-items:center; margin:14px 0 0; padding:12px 14px; background:var(--paper); border:1px solid var(--sand-line); border-radius:8px;}
  .ag-map .tp{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:0.95rem;}
  .ag-chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .ag-chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:0.78rem; font-weight:600;
    background:var(--sand-deep); border:1px solid var(--sand-line); color:var(--ink); transition:transform .15s ease, box-shadow .15s ease; cursor:default;}
  .ag-chip b{font-family:'Newsreader',Georgia,serif; font-weight:700; color:var(--gold-deep);}
  .ag-chip.clash{background:var(--gold-wash); border-color:var(--gold); color:var(--ink-warm);}
  .ag-chip:hover{transform:translateY(-1px); box-shadow:0 6px 12px -8px oklch(30% 0.04 60 / .5);}
  .ag-none{font-size:0.76rem; color:var(--grey);}
  .ag-none.all{color:var(--teal);}
  .cell.ag-lit .house-sel select, .cell.ag-lit .ro{box-shadow:inset 0 0 0 2px var(--teal);}
  .nm .ag-ok{display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; margin-left:8px; border-radius:50%;
    background:var(--teal); color:var(--paper); font-size:10px; font-weight:700; animation:ag-in .35s cubic-bezier(.3,1.5,.5,1) both;}
  .ag-count{font-size:0.78rem; color:var(--grey); margin-left:8px; font-family:'Karla',sans-serif; font-weight:500;}
  .ag-count b{color:var(--ink);}
  @keyframes ag-in{from{transform:scale(.4); opacity:0;}to{transform:none; opacity:1;}}
  @media(prefers-reduced-motion:reduce){ .ag-chip{transition:none;} .nm .ag-ok{animation:none;} }
  @media(max-width:560px){ .ag-map{grid-template-columns:1fr; gap:4px;} .ag-map .tp{margin-top:6px;} }
  @media print{ .ag-map, .ag-count{display:none;} }
</style>

<body class="hub-grid hub-paper hub-course">
<div class="board">
  <a class="back" id="back" href="index.html">Back</a>
  <div id="app"></div>
</div>
<script src="hub-due.js?v=202611271544"></script>
<script src="hub-tracker.js?v=202611271544"></script>
<script src="hub-rotation.js?v=202611271544"></script>
<script src="hub-shared.js?v=202611271544"></script>
<script src="hub-store.js?v=202611271544"></script>
<script src="hub-say.js?v=202611271544"></script>
<script src="hub-sync.js?v=202611271544"></script>
<script src="hub-notebook.js?v=202611271544"></script>
<script type="text/x-hub-app">
const MODE = window.HubMode;
const IS_TRAINEE = MODE === 'trainee', IS_TUTOR = MODE === 'tutor', IS_STAFF = MODE === 'tutor' || MODE === 'assessor';
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const T = window.HubTracker;
const SETTINGS = rec('connect_course_settings') || {};
const KEY = 'connect_tp_grid_v1';
$('back').href = IS_TRAINEE ? 'index.html' : IS_TUTOR ? '5_tutor_dashboard.html' : '12_assessor_pack.html';

/* The last two teaching practices, off the course's TP count. */
const TOTAL = (function(){ const n = parseInt(SETTINGS.tpCount, 10); return (n >= 2 && n <= 12) ? n : 8; })();
const TPS = [TOTAL - 1, TOTAL];
const AIMS = ['Grammar', 'Vocabulary', 'Functional language', 'Reading', 'Listening', 'Speaking', 'Writing'];

/* What a trainee has taught so far: the tracker's own reading of each
   returned lesson's main aim (tp<n>_aim), so the grid and the tracker agree. */
function soFar(tr){
  try {
    const flat = T.recordFor(tr); const counts = {};
    for (let n = 1; n <= TOTAL; n++) { if (TPS.includes(n)) continue; const a = flat['tp' + n + '_aim']; if (a) counts[a] = (counts[a] || 0) + 1; }
    const parts = Object.keys(counts).map(k => k + (counts[k] > 1 ? ' ×' + counts[k] : ''));
    return parts.length ? parts.join(', ') : '';
  } catch(e) { return ''; }
}
const AIM_WORD = { GRAMMAR:'Grammar', VOCAB:'Vocabulary', VOCABULARY:'Vocabulary', FUNCTIONAL:'Functional language', READING:'Reading', LISTENING:'Listening', SPEAKING:'Speaking', WRITING:'Writing' };
const aimWord = a => AIM_WORD[String(a || '').toUpperCase()] || a || '';

let grid = rec(KEY) || null;
let busy = false, note = '', pendingRelease = null;   // pendingRelease: { group, on }
const groupsOf = () => {
  if (IS_TRAINEE) return grid && grid.released ? [{ group: grid.group, rows: grid.rows.map(r => ({ name: r.name, letter: r.letter || '', mine: r.mine, plan: r.plan || {}, tr: r.mine ? meTr() : null })).sort((a, b) => (a.letter || 'Z').localeCompare(b.letter || 'Z') || (a.name || '').localeCompare(b.name || '')) }] : [];
  const roster = rec('connect_roster_v1') || {}; const people = Object.values(roster.trainees || {});
  const by = {}; people.forEach(t => { const g = String(t.group || ''); (by[g] = by[g] || []).push(t); });
  return Object.keys(by).sort().map(g => ({ group: g, rows: by[g].map(t => Object.assign({ L: window.hubLetterOf ? hubLetterOf(t.id, t.name) : '' }, t)).sort((a, b) => (a.L || 'Z').localeCompare(b.L || 'Z') || (a.name || '').localeCompare(b.name || '')).map(t => ({ name: t.name, token: t.id, letter: t.L, plan: ((grid && grid.rows) || {})[t.id] || {}, tr: t })) }));
};
function meTr(){ const me = rec('hub:me') || {}; return { id: me.token, name: me.name, tp: { plan: rec('chub:plan'), selfeval: rec('chub:selfeval'), feedback: rec('chub:feedback'), history: rec('chub:tpHistory') || {} }, assignments: rec('connect_assignment_submissions_v1') || {}, tracker: rec('chub:tracker') || {} }; }
const released = g => IS_TRAINEE ? !!(grid && grid.released) : !!(grid && ((grid.released && grid.released[g]) || (grid.openAt && grid.openAt[g] && Date.parse(grid.openAt[g]) <= Date.now())));

/* Main and sub aim (Ramy, 26 Nov 2026: "two skills or two language, or the same skill or the same language ... should be
   a warning"). A reminder under the aims, never a block: the page's own rule is a skill sub aim for a language lesson and
   a language sub aim for a skills lesson. */
const LANG = ['Grammar', 'Vocabulary', 'Functional language'];
function aimWarn(main, sub){
  const m = aimWord(main), s = aimWord(sub); if (!m || !s) return '';
  if (m === s) return '<b>Check:</b> the main aim and the sub aim are the same. Choose a different sub aim.';
  const ml = LANG.includes(m), sl = LANG.includes(s);
  if (ml && sl) return '<b>Check:</b> both aims are language. A language lesson usually has a skill as its sub aim.';
  if (!ml && !sl) return '<b>Check:</b> both aims are skills. A skills lesson usually has language as its sub aim.';
  return '';
}
function sel(cls, value, opts, editable){
  const v = aimWord(value);
  if (!editable) return `<div class="ro${value ? '' : ' empty'}">${v ? `<span class="pill on">${esc(v)}</span>` : 'not chosen'}</div>`;
  return `<div class="pills" role="radiogroup">${AIMS.map(a => `<button type="button" class="pill${v === a ? ' on' : ''}" role="radio" aria-checked="${v === a}" data-v="${esc(a)}">${esc(a)}</button>`).join('')}</div>`
    + `<select class="${cls}" hidden aria-hidden="true" tabindex="-1"><option value=""></option>${AIMS.map(a => `<option value="${esc(a)}"${v === a ? ' selected' : ''}>${a}</option>`).join('')}</select>`;
}
function selOld(cls, value, opts, editable){
  return `<div class="house-sel"><select class="${cls}"><option value="">Choose…</option>${AIMS.map(a => `<option value="${esc(a)}"${aimWord(value) === a ? ' selected' : ''}>${a}</option>`).join('')}</select></div>`;
}
/* OPENING ON THE TIMETABLE (Ramy, 26 Nov 2026: "there is release it now, but also it could be set on a timer and linked
   to a timetable"). The suggested time is the start of the first session still to come whose title names syllabus
   planning or TP7; the tutor can change it. The store holds the grid back until then (openAt). */
function ttSuggest(){
  const tt = rec('connect_timetable_v1') || {}, days = Array.isArray(tt.days) ? tt.days : [];
  const re = new RegExp('syllabus|\\bTP\\s*' + TPS[0] + '\\b|planning grid', 'i'), today = new Date().toISOString().slice(0, 10);
  for (const d of days.slice().sort((x, y) => String(x.date).localeCompare(String(y.date)))) {
    if (!d || !d.date || d.date < today) continue;
    const ss = (d.sessions || []).filter(x => x && re.test(String(x.t || '')) && /^\d{1,2}:\d{2}$/.test(String(x.s || ''))).sort((x, y) => String(x.s).localeCompare(String(y.s)));
    if (ss.length) return { local: d.date + 'T' + String(ss[0].s).padStart(5, '0'), title: String(ss[0].t) };
  }
  return null;
}
function whenLabel(iso){
  const loc = window.HubDue ? HubDue.toLocalInput(iso) : String(iso).slice(0, 16); if (!loc) return '';
  const d = new Date(loc.slice(0, 10) + 'T12:00:00Z'), hm = loc.slice(11, 16);
  return d.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) + ', ' + (window.hubClock ? hubClock(hm) : hm);
}
let openMode = 'tt';
function openBox(g, n){
  const grp = esc(g.group) || '—';
  if (!pendingRelease.on) return `<div class="check" role="alert"><div class="ttl">Take it back?</div><div class="msg">The grid disappears from <b>Group ${grp}</b>’s home, and any time set to open it is cleared. Nothing typed is lost.</div><div class="acts"><button class="btn quiet" type="button" data-rel-cancel="1">Cancel</button><button class="btn primary" type="button" data-rel-go="${esc(g.group)}"${busy ? ' disabled' : ''}>Take it back</button></div></div>`;
  const sug = ttSuggest(), was = (((grid && grid.openAt) || {})[g.group]) || '';
  const at = was && window.HubDue ? HubDue.toLocalInput(was) : (sug ? sug.local : '');
  const tt = openMode === 'tt';
  return `<div class="check openbox" role="alert"><div class="ttl">Open the grid for Group ${grp}</div>
    <label class="opt${tt ? '' : ' on'}"><input type="radio" name="openMode" value="now"${tt ? '' : ' checked'}><span><b>Open it now</b><small>${n} trainee${n === 1 ? '' : 's'} see it on their home straight away.</small></span></label>
    <label class="opt${tt ? ' on' : ''}"><input type="radio" name="openMode" value="tt"${tt ? ' checked' : ''}><span><b>Open it on the timetable</b><small>${sug ? `Lite suggests the start of <i>${esc(sug.title)}</i>. Change the time if you like.` : 'No syllabus planning session on the timetable yet. Choose the time.'}</small>
      <input type="datetime-local" id="relAt" value="${esc(at)}"></span></label>
    <div class="opts"><div><label class="f">Fill in by <span style="font-weight:500;text-transform:none;letter-spacing:0">(optional)</span></label><input type="datetime-local" id="relDue" value="${esc(window.HubDue ? HubDue.toLocalInput(((grid && grid.due) || {})[g.group] || '') : '')}"></div><label class="tick"><input type="checkbox" id="relPost" checked> Post it to the course noticeboard when it opens</label>${tutorName() ? '' : `<div style="grid-column:1/-1"><label class="f">Your name, to sign the post</label><input type="text" id="relName" placeholder="Type your name"></div>`}</div>
    <div class="acts"><button class="btn quiet" type="button" data-rel-cancel="1">Cancel</button><button class="btn primary" type="button" data-rel-go="${esc(g.group)}"${busy ? ' disabled' : ''}>${tt ? 'Set it to open' : 'Open it now'}</button></div></div>`;
}
/* ---- 26 Nov 2026, the TP7 & TP8 material (Ramy): the lesson a trainee chose from their own material page
   (43_tp78_material.html) sits on their card; they choose the aims and their place in the teaching order here.
   Rules for the trainees at the top; warnings where a day or a trainee leans all one way; a block where two would
   teach the same lesson. ---- */
const LANG_AIMS = ['Grammar', 'Vocabulary', 'Functional language'];
const isLang = a => LANG_AIMS.includes(aimWord(a));
const normTaught = a => a === 'Lexis' ? 'Vocabulary' : a;
function taughtOf(tr){
  try { const flat = T.recordFor(tr), out = []; for (let n = 1; n <= TOTAL; n++) { if (TPS.includes(n)) continue; const a = flat['tp' + n + '_aim']; if (a && a !== 'Pronunciation') out.push(normTaught(a)); } return out; } catch(e) { return []; }
}
function tpDays(tp){
  const tt = rec('connect_timetable_v1') || {};
  return (Array.isArray(tt.days) ? tt.days : []).filter(d => d && d.date && !d.closed && +d.tp === +tp).map(d => d.date).sort();
}
const dayLabel = iso => { const d = new Date(iso + 'T12:00:00Z'); return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }); };
const ORD = n => n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th');
const firstName = n => String(n || '').split(/\s+/)[0];
/* pages and exercises out of a material line: "English File, p. 74, ex 2-5" */
function pagesIn(t){ const out = new Set(); String(t || '').replace(/\bpp?\.?\s*(\d{1,3})(?:\s*[–-]\s*(\d{1,3}))?/gi, (m, a, b) => { a = +a; b = b ? +b : a; for (let i = a; i <= Math.min(b, a + 6); i++) out.add(i); return m; }); return out; }
function exIn(t){ const m = /\bex(?:ercises?)?\.?\s*([\w\s,–-]+)/i.exec(String(t || '')); return m ? m[1].replace(/\s+/g, '').toLowerCase() : ''; }
function samePage(mine, theirs){
  const a = pagesIn(mine), b = pagesIn(theirs); if (!a.size || !b.size) return false;
  if (![...a].some(x => b.has(x))) return false;
  const ea = exIn(mine), eb = exIn(theirs);
  return !ea || !eb || ea === eb;
}
let openPlace = '';   // 'token|tp' whose place picker is open
let matOwn = {};      // 'token|tp' -> showing the own-material box
function render(){
  const app = $('app');
  const groups = groupsOf();
  const dueIso0 = IS_TRAINEE ? (grid && grid.due) || '' : '';
  const ds0 = dueIso0 && window.HubDue ? HubDue.state(dueIso0) : { has: false };
  const head = `<div class="hdr"><div><p class="eyebrow">Teaching practice</p><h1>TP${TPS[0]} &amp; TP${TPS[1]} planning grid</h1></div>${IS_STAFF ? `<a class="matbtn" href="43_tp78_material.html">TP${TPS[0]} &amp; TP${TPS[1]} material</a>` : ''}${ds0.has ? `<span class="rowdue${ds0.past ? ' past' : ''}">${ds0.past ? 'Was due' : 'Fill in your row by'} <b>${esc(ds0.due)}</b></span>` : ''}</div>
    <div class="rulecard">
      <div><p class="w"><i class="d1"></i>You must</p><p>Teach one lesson with a language main aim and one with a skills main aim. The sub aim can be anything.</p><p>Choose your place in the teaching order.</p></div>
      <div><p class="w"><i class="d2"></i>You can</p><p>Use a lesson from your TP${TPS[0]} &amp; TP${TPS[1]} material, or find your own material and add it to the grid.</p></div>
      <div><p class="w"><i class="d3"></i>You can\u2019t</p><p>Teach the same lesson as someone else.</p><p>Teach a lesson the students have already had, from you or from anyone else.</p></div>
      <div><p class="w"><i class="d4"></i>Tips</p><p>Balance each day: try not to have three skills main aims, or three language main aims, on the same day.</p><p>Finding your own material? Choose from the second half of the class\u2019s coursebook, and an aim you have not taught yet.</p><p>Talk to the others teaching on your day, so your lessons follow on from each other in a logical order.</p></div>
    </div>`;
  if (IS_TRAINEE && !released()) { app.innerHTML = head + `<div class="empty">Your tutor has not opened the planning grid yet.</div>`; return; }
  if (!groups.length) { app.innerHTML = head + `<div class="empty">No trainees on the roster yet.</div>`; return; }
  app.innerHTML = head + groups.map(g => {
    const n = g.rows.length; const on = released(g.group);
    const waitAt = on ? '' : (((grid && grid.openAt) || {})[g.group]) || '';
    const relbar = IS_TUTOR ? (pendingRelease && pendingRelease.group === g.group ? openBox(g, n) : `<div class="relbar">${on
        ? `<span class="chip fine">Open</span><span class="relnote">The trainees can fill in their rows.</span><button class="btn quiet" type="button" data-rel="${esc(g.group)}" data-on="0">Take it back</button>`
        : waitAt
        ? `<span class="chip wait">Opens ${esc(whenLabel(waitAt))}</span><button class="btn quiet" type="button" data-rel="${esc(g.group)}" data-on="1">Change</button><button class="btn quiet" type="button" data-rel-now="${esc(g.group)}">Open it now</button><button class="btn quiet" type="button" data-rel="${esc(g.group)}" data-on="0">Take it back</button>`
        : `<span class="chip nd">Not open</span><button class="btn primary" type="button" data-rel="${esc(g.group)}" data-on="1">Open for Group ${esc(g.group) || '—'}</button><span class="relnote">Only tutors can see it until it opens.</span>`
      }<span class="status">${esc(note)}</span></div>`) : (IS_TRAINEE ? `<div class="relbar"><span class="status">${esc(note)}</span></div>` : '');
    /* the teaching order: each TP's days, places 1..k on each */
    const seatsFor = tp => { const days = tpDays(tp), k = days.length ? Math.max(1, Math.ceil(n / days.length)) : 0; return { days, k }; };
    const whoAt = (tp, key) => g.rows.find(r => ((r.plan['tp' + tp] || {}).place) === key);
    const warns = [];
    const orderRows = TPS.map(tp => { const { days, k } = seatsFor(tp);
      if (!days.length) return `<div class="orow"><span class="tp">TP${tp}</span><p class="none">The timetable has no TP${tp} days yet.</p></div>`;
      const cols = days.map(d => { const on = [];
        const seats = Array.from({ length: k }, (x, i) => { const r = whoAt(tp, d + '|' + (i + 1)); if (r) on.push(aimWord((r.plan['tp' + tp] || {}).main));
          return r ? `<span class="seat${r.mine ? ' me' : ''}"><span>${i + 1}</span>${esc(firstName(r.name))}</span>` : `<span class="seat open"><span>${i + 1}</span>free</span>`; }).join('');
        const sk = on.filter(a => a && !isLang(a)).length, lg = on.filter(a => a && isLang(a)).length;
        if (sk >= 3) warns.push(`<div class="dwarn"><b>Check:</b> ${dayLabel(d)} has ${sk} lessons with a skills main aim. Not a problem if the group means it. Worth a word if not.</div>`);
        if (lg >= 3) warns.push(`<div class="dwarn"><b>Check:</b> ${dayLabel(d)} has ${lg} lessons with a language main aim. Not a problem if the group means it. Worth a word if not.</div>`);
        return `<div class="dayx"><p class="d">${dayLabel(d)}</p><div class="seats">${seats}</div></div>`; }).join('');
      return `<div class="orow"><span class="tp">TP${tp}</span><div class="dcols">${cols}</div></div>`; }).join('');
    const order = `<div class="order"><h3>Teaching order</h3>${orderRows}${warns.join('')}</div>`;
    const rows = g.rows.map(r => {
      const editable = IS_TUTOR || (IS_TRAINEE && r.mine);
      const tk = r.token || '';
      let who = `<div class="who2"><span class="av">${esc(r.letter || firstName(r.name).slice(0, 1))}</span><div><b>${esc(r.name)}</b>${r.mine ? '<small>You</small>' : ''}</div></div>`;
      if (r.tr) { const t = taughtOf(r.tr), cnt = {}; t.forEach(a => cnt[a] = (cnt[a] || 0) + 1);
        const chip = a => `<em class="${isLang(a) ? 'l' : 's'}">${esc(a)}${cnt[a] > 1 ? ' ×' + cnt[a] : ''}</em>`;
        const lang = LANG_AIMS.filter(a => cnt[a]), sk = AIMS.filter(a => !LANG_AIMS.includes(a) && cnt[a]), notYet = AIMS.filter(a => !cnt[a]);
        /* Ramy, 26 Nov 2026: no colours for the aims taught; the kind is a word */
        if (t.length) who += `<div class="done"><span class="lab3">Taught so far</span>${lang.length ? `<p class="kind"><span>Language</span>${lang.map(chip).join('')}</p>` : ''}${sk.length ? `<p class="kind"><span>Skills</span>${sk.map(chip).join('')}</p>` : ''}${notYet.length ? `<span class="lab3">Not yet</span><div class="chips">${notYet.map(a => `<em class="n">${esc(a)}</em>`).join('')}</div>` : ''}</div>`; }
      if (IS_STAFF && tk) who += `<a class="theirs" href="43_tp78_material.html?t=${encodeURIComponent(tk)}">Their material</a>`;
      const mains = TPS.map(tp => aimWord((r.plan['tp' + tp] || {}).main));
      const bothSame = mains[0] && mains[1] && isLang(mains[0]) === isLang(mains[1]);
      return `<tr class="${r.mine ? 'mine' : ''}" data-token="${esc(tk)}"><td>${who}</td>`
        + TPS.map((tp, ti) => { const p = r.plan['tp' + tp] || {}; const key = tk + '|' + tp;
          const pl = p.place && /^(\d{4}-\d{2}-\d{2})\|(\d)$/.exec(p.place);
          const when = `<div class="when">${pl ? `<span class="n">${ORD(+pl[2])}</span><span>on ${dayLabel(pl[1])}` : `<span class="n none">?</span><span>No place yet`}${editable ? `<button type="button" class="lnk" data-place="${esc(key)}">${pl ? 'Change place' : 'Choose your place'}</button>` : ''}</span></div>`;
          let picker = '';
          if (editable && openPlace === key) { const { days, k } = seatsFor(tp);
            picker = `<div class="picker">${days.map(d => `<div><p class="d">${dayLabel(d)}</p>${Array.from({ length: k }, (x, i) => { const kk = d + '|' + (i + 1), o = whoAt(tp, kk), mine = o === r;
              return `<button type="button" class="pk${mine ? ' on' : ''}" data-seat="${esc(kk)}" data-key="${esc(key)}"${o && !mine && !IS_TUTOR ? ' disabled' : ''}>${ORD(i + 1)}${o && !mine ? ' · ' + esc(firstName(o.name)) : ''}</button>`; }).join('')}</div>`).join('') || '<p class="d">No days on the timetable yet.</p>'}</div>`; }
          const mates = g.rows.filter(x => x !== r).flatMap(x => TPS.map(t2 => ({ who: x.name, m: (x.plan['tp' + t2] || {}).material || '' })));
          const clashWith = !p.lesson && p.material ? mates.find(x => x.m && samePage(p.material, x.m)) : null;
          let lesson;
          if (p.lesson) lesson = `<div class="chosen">${editable ? `<a class="ch" href="43_tp78_material.html${IS_STAFF ? '?t=' + encodeURIComponent(tk) : ''}">Change</a>` : ''}<b>${esc(String(p.material || '').split(' · ').slice(0, 2).join(' · '))}</b><span>${esc(String(p.material || '').split(' · ').slice(2).join(' · '))}</span></div>`;
          else if (editable && !p.material && !matOwn[key]) lesson = `<div class="pickmat">${r.mine ? `<a href="43_tp78_material.html">Choose from your TP${TPS[0]} &amp; TP${TPS[1]} material</a>` : IS_STAFF && tk ? `<a href="43_tp78_material.html?t=${encodeURIComponent(tk)}">Their TP${TPS[0]} &amp; TP${TPS[1]} material</a>` : ''}<button type="button" class="lnk" data-own="${esc(key)}">or find your own</button></div>`;
          else if (editable) lesson = `<div class="cell mat" data-tp="${tp}" data-f="material"><span class="lab">Own material: book, page and exercises</span><input type="text" class="material" value="${esc(p.material || '')}" placeholder="English File, p. 74, ex 2–5"></div>`;
          else lesson = p.material ? `<div class="chosen"><b>${esc(p.material)}</b></div>` : `<div class="chosen empty">Not chosen yet</div>`;
          const block = clashWith ? `<p class="aimblock"><b>Same page as ${esc(firstName(clashWith.who))}.</b> Write the exercises you will use, different from theirs.</p>` : '';
          const w = (ti === 1 && bothSame) ? `<p class="aimwarn"><b>Check:</b> TP${TPS[0]} and TP${TPS[1]} both have a ${isLang(mains[0]) ? 'language' : 'skills'} main aim. One of them should have a ${isLang(mains[0]) ? 'skills' : 'language'} main aim.</p>` : '';
          return `<td class="tpcol"><div class="tpbox"><div class="tph">TP${tp}</div><div><span class="lab">${r.mine ? 'Your lesson' : 'Lesson'}</span>${lesson}</div>${block}${when}${picker}<div class="cell" data-tp="${tp}" data-f="main"><span class="lab">Main aim</span>${sel('main', p.main, AIMS, editable)}</div><div class="cell" data-tp="${tp}" data-f="sub"><span class="lab">Sub aim</span>${sel('sub', p.sub, AIMS, editable)}</div>${(x => `<p class="aimwarn" role="status"${x ? '' : ' hidden'}>${x}</p>`)(aimWarn(p.main, p.sub))}${w}</div></td>`; }).join('')
        + `</tr>`;
    }).join('');
    const dueIso = IS_TRAINEE ? '' : ((grid && grid.due) || {})[g.group] || '';
    const ds = dueIso && window.HubDue ? HubDue.state(dueIso) : { has: false };
    const dueLine = (on && ds.has) ? `<p class="dueline${ds.past ? ' past' : ds.soon ? ' soon' : ''}">${ds.past ? `Was due <b>${esc(ds.due)}</b>` : `Fill in by <b>${esc(ds.due)}</b> — ${esc(ds.text)}`}</p>` : '';
    const over = n > 6 ? `<p class="clashnote">A teaching practice group is at most six trainees. This one has ${n} — split it on Course admin.</p>` : '';
    return `<section class="group" data-group="${esc(g.group)}"><h2>Group ${esc(g.group) || '—'} <small>${n} trainee${n === 1 ? '' : 's'}</small></h2>${over}${relbar}${dueLine}${order}
      <div class="tablewrap"><table class="grid"><colgroup><col class="c-who">${TPS.map(() => '<col>').join('')}</colgroup><tbody>${rows}</tbody></table></div></section>`;
  }).join('');
  wire();
  if (IS_TUTOR) ensureOffers();
}
/* The lessons each trainee is offered are made the first time a tutor opens the grid after the trainee's TP history is
   in (hubTp78Pick), from the Pool's own copies of the sets (they carry the scans and tracks), and kept by the store. */
function ensureOffers(){ if (window.hubTp78Ensure) hubTp78Ensure(); }
function wire(){
  const app = $('app');
  app.querySelectorAll('tr[data-token], tr.mine').forEach(tr => {
    const token = tr.dataset.token || (rec('hub:me') || {}).token || '';
    tr.querySelectorAll('.cell').forEach(td => {
      const el = td.querySelector('select, input'); if (!el) return;
      const fire = async () => {
        const tp = td.dataset.tp; const cells = [...tr.querySelectorAll(`.cell[data-tp="${tp}"]`)];
        const cur = planOf(tr, tp);
        const val = f => { const c = cells.find(x => x.dataset.f === f); const e = c && c.querySelector('select, input'); return e ? e.value : (cur[f] || ''); };
        /* the same page as someone else in the group, with no exercises or the same ones: not saved (Ramy, 26 Nov 2026) */
        if (td.dataset.f === 'material') {
          const box = td.closest('.tpbox'), mates = matesOf(tr), clash = val('material') && mates.find(x => x.m && samePage(val('material'), x.m));
          let bl = box.querySelector('.aimblock');
          if (clash) { if (!bl) { td.insertAdjacentHTML('afterend', '<p class="aimblock"></p>'); bl = box.querySelector('.aimblock'); } bl.innerHTML = '<b>Same page as ' + esc(firstName(clash.who)) + '.</b> Write the exercises you will use, different from theirs. Not saved yet.'; return; }
          if (bl) bl.remove();
        }
        note = 'Saving…'; setStatus();
        try {
          const r = await window.HubStore.call(Object.assign({ op: 'gridSet', tp, main: val('main'), sub: val('sub'), material: val('material') }, IS_TUTOR ? { token } : { token: window.HubStore.token() }));
          grid = r.grid; localStorage.setItem(KEY, JSON.stringify(grid)); note = 'Saved'; render(); setTimeout(() => { note = ''; setStatus(); }, 2500);
        } catch(err) { note = 'Could not save — ' + (err.message || err); setStatus(); }
      };
      if (el.tagName === 'SELECT') el.addEventListener('change', fire);
      else { let t = null; el.addEventListener('input', () => { clearTimeout(t); t = setTimeout(fire, 900); }); el.addEventListener('blur', () => { clearTimeout(t); fire(); }); }
    });
  });
  app.querySelectorAll('[data-place]').forEach(b => b.addEventListener('click', () => { openPlace = openPlace === b.dataset.place ? '' : b.dataset.place; render(); }));
  app.querySelectorAll('[data-own]').forEach(b => b.addEventListener('click', () => { matOwn[b.dataset.own] = true; render(); const i = app.querySelector('tr[data-token] .cell.mat input, tr.mine .cell.mat input'); if (i) i.focus(); }));
  app.querySelectorAll('[data-seat]').forEach(b => b.addEventListener('click', async () => {
    const [tk, tp] = b.dataset.key.split('|'), tr = b.closest('tr'), cur = planOf(tr, tp);
    const place = b.classList.contains('on') ? '' : b.dataset.seat;
    note = 'Saving…'; setStatus();
    try {
      const r = await window.HubStore.call(Object.assign({ op: 'gridSet', tp, main: cur.main || '', sub: cur.sub || '', material: cur.material || '', place }, IS_TUTOR ? { token: tk } : { token: window.HubStore.token() }));
      grid = r.grid; localStorage.setItem(KEY, JSON.stringify(grid)); note = place ? 'Saved your place.' : 'Place cleared.'; openPlace = '';
    } catch(err) { note = 'Could not save: ' + (err.message || err); }
    render();
  }));
  app.querySelectorAll('.pills .pill').forEach(b => b.addEventListener('click', () => {
    const cell = b.closest('.cell'), s = cell && cell.querySelector('select'); if (!s) return;
    const v = b.classList.contains('on') ? '' : b.dataset.v;
    cell.querySelectorAll('.pill').forEach(x => { const on = x === b && !!v; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
    s.value = v;
    const box = b.closest('.tpbox'), w = box && box.querySelector('.aimwarn');
    if (w) { const pick = f => { const x = box.querySelector('.cell[data-f="' + f + '"] select'); return x ? x.value : ''; }; const t = aimWarn(pick('main'), pick('sub')); w.innerHTML = t; w.hidden = !t; }
    s.dispatchEvent(new Event('change'));
  }));
  app.querySelectorAll('[data-rel]').forEach(b => b.addEventListener('click', () => { pendingRelease = { group: b.dataset.rel, on: b.dataset.on === '1' }; openMode = 'tt'; render(); }));
  app.querySelectorAll('input[name="openMode"]').forEach(r => r.addEventListener('change', () => { const keep = $('relAt') ? $('relAt').value : ''; openMode = r.value; render(); if (keep && $('relAt')) $('relAt').value = keep; }));
  app.querySelectorAll('[data-rel-now]').forEach(b => b.addEventListener('click', () => { pendingRelease = { group: b.dataset.relNow, on: true }; openMode = 'now'; render(); }));
  app.querySelectorAll('[data-rel-cancel]').forEach(b => b.addEventListener('click', () => { pendingRelease = null; render(); }));
  app.querySelectorAll('[data-rel-go]').forEach(b => b.addEventListener('click', async () => {
    const { group, on } = pendingRelease;
    const dueEl = $('relDue'), postEl = $('relPost'), nameEl = $('relName');
    const due = on && dueEl && dueEl.value && window.HubDue ? HubDue.fromLocalInput(dueEl.value) : (on ? '' : undefined);
    const wantPost = on && postEl && postEl.checked;
    const atEl = $('relAt'), timed = on && openMode === 'tt';
    const openAt = timed && atEl && atEl.value && window.HubDue ? HubDue.fromLocalInput(atEl.value) : '';
    if (timed && !openAt) { if (atEl) atEl.focus(); return; }
    if (timed && new Date(openAt).getTime() <= Date.now()) { note = 'That time has passed. Choose a later one, or open it now.'; setStatus(); if (atEl) atEl.focus(); return; }
    const by = tutorName() || (nameEl ? nameEl.value.trim() : '');
    if (wantPost && !by) { if (nameEl) nameEl.focus(); return; }
    if (by && !tutorName()) { if (window.hubKeepTutorName) hubKeepTutorName(by); else localStorage.setItem('chub:tutorName', by); }
    busy = true; render();
    /* A grid set to open on a time has its notice held back for the same time. Changing that time, opening it now or
       taking it back first lifts the held notice, so it cannot go up on its own. */
    if ((((grid && grid.openAt) || {})[group])) {
      const held = (rec('connect_course_stream_v1') || []).filter(p => p && String(p.to || '') === String(group) && p.publishAt && Date.parse(p.publishAt) > Date.now() && /planning grid is open/i.test(String(p.text || '')));
      for (const p of held) { try { const u = await window.HubStore.call({ op: 'unpost', id: p.id }); if (u && u.stream) localStorage.setItem('connect_course_stream_v1', JSON.stringify(u.stream)); } catch(e) {} }
    }
    try {
      const r = await window.HubStore.call(Object.assign({ op: 'gridRelease', group, released: on }, due === undefined ? {} : { due }, openAt ? { openAt } : {}));
      grid = r.grid; localStorage.setItem(KEY, JSON.stringify(grid)); note = !on ? 'Taken back.' : openAt ? 'Set to open ' + whenLabel(openAt) + '.' : 'Open.';
      /* The release IS the announcement: one post to that group's stream,
         under the tutor's name, with the date when there is one. */
      if (wantPost) {
        const ds = window.HubDue && due ? HubDue.state(due) : { has: false };
        const text = `The TP${TPS[0]} & TP${TPS[1]} planning grid is open — choose your main aim, sub aim and material for each. ${ds.has ? 'Fill in your row by ' + ds.due + '.' : 'Fill in your row when you can.'}`;
        try { const p = await window.HubStore.call(Object.assign({ op: 'post', by, to: group, text }, openAt ? { publishAt: openAt } : {})); localStorage.setItem('connect_course_stream_v1', JSON.stringify(p.stream || [])); note = openAt ? 'Set to open ' + whenLabel(openAt) + '. The notice goes up then.' : 'Open, and posted to Group ' + (group || '—') + '.'; }
        catch(err) { note = (openAt ? 'Set to open, ' : 'Open, ') + 'but the notice did not go: ' + (err.message || err); }
      }
    }
    catch(err) { note = 'Could not — ' + (err.message || err); }
    busy = false; pendingRelease = null; render(); setTimeout(() => { note = ''; setStatus(); }, 3000);
  }));
}
function planOf(tr, tp){
  if (IS_TRAINEE) { const r = ((grid && grid.rows) || []).find(x => x.mine); return ((r && r.plan) || {})['tp' + tp] || {}; }
  return (((grid && grid.rows) || {})[tr.dataset.token] || {})['tp' + tp] || {};
}
function matesOf(tr){
  const g = groupsOf().find(x => x.rows.some(r => IS_TRAINEE ? r.mine && tr.classList.contains('mine') : r.token === tr.dataset.token));
  if (!g) return [];
  return g.rows.filter(r => IS_TRAINEE ? !r.mine : r.token !== tr.dataset.token).flatMap(r => TPS.map(t => ({ who: r.name, m: (r.plan['tp' + t] || {}).material || '' })));
}
function tutorName(){ return (localStorage.getItem('chub:tutorName') || '').trim(); }
function setStatus(){ document.querySelectorAll('.status').forEach(s => s.textContent = note); }
render();

/* ---- v2 (7 Oct 2026): the group's aims at a glance --------------------------
   Layered on render(): a MutationObserver on #app re-applies after every
   render, reading the cells as drawn. Hovering a chip lights the cells that
   chose it. Stores nothing. */
(function(){
  const app = document.getElementById('app'); if (!app) return;
  const cellVal = td => { const el = td && td.querySelector('select, input'); if (el) return (el.value || '').trim();
    const ro = td && td.querySelector('.ro'); return ro && !ro.classList.contains('empty') ? ro.textContent.trim() : ''; };
  function apply(){
    app.querySelectorAll('section.group').forEach(sec => {
      const rows = [...sec.querySelectorAll('table.grid tbody tr')]; if (!rows.length) return;
      const tps = [...new Set([...sec.querySelectorAll('.cell[data-tp]')].map(td => td.dataset.tp))];
      const lines = tps.map(tp => {
        const c = {}; let none = 0;
        rows.forEach(tr => { const v = cellVal(tr.querySelector('.cell[data-tp="' + tp + '"][data-f="main"]')); if (v) c[v] = (c[v] || 0) + 1; else none++; });
        const chips = Object.keys(c).sort((a, b) => c[b] - c[a] || a.localeCompare(b)).map(a =>
          '<span class="ag-chip' + (c[a] > 1 ? ' clash' : '') + '" data-ag-tp="' + esc(tp) + '" data-ag-aim="' + esc(a) + '" title="' + c[a] + ' chose ' + esc(a) + '">' + esc(a) + (c[a] > 1 ? ' <b>\u00d7' + c[a] + '</b>' : '') + '</span>').join('');
        return '<span class="tp">TP' + esc(tp) + '</span><div class="ag-chips">' + chips
          + '<span class="ag-none' + (none ? '' : ' all') + '">' + (none ? none + ' not chosen yet' : 'every main aim chosen') + '</span></div>';
      }).join('');
      const html = '<div class="ag-map" aria-label="Main aims chosen in this group">' + lines + '</div>';
      const old = sec.querySelector('.ag-map');
      if (old) { if (old.outerHTML !== html) old.outerHTML = html; }
      else { const tw = sec.querySelector('.tablewrap'); if (tw) tw.insertAdjacentHTML('beforebegin', html); }
      let full = 0;
      rows.forEach(tr => {
        const cells = [...tr.querySelectorAll('.cell')], ok = cells.length && cells.every(td => cellVal(td));
        if (ok) full++;
        const nm = tr.querySelector('.nm'); if (!nm) return;
        const tick = nm.querySelector('.ag-ok');
        if (ok && !tick) nm.insertAdjacentHTML('beforeend', '<span class="ag-ok" title="Every cell filled" aria-label="Every cell filled">\u2713</span>');
        if (!ok && tick) tick.remove();
      });
      const h2 = sec.querySelector('h2'); if (!h2) return;
      let cnt = h2.querySelector('.ag-count');
      if (!cnt) { cnt = document.createElement('span'); cnt.className = 'ag-count'; h2.appendChild(cnt); }
      cnt.innerHTML = '\u00b7 <b>' + full + ' of ' + rows.length + '</b> rows complete';
    });
  }
  app.addEventListener('mouseover', e => {
    const chip = e.target.closest('.ag-chip'); app.querySelectorAll('.ag-lit').forEach(x => x.classList.remove('ag-lit'));
    if (!chip) return;
    const sec = chip.closest('section.group');
    sec.querySelectorAll('.cell[data-tp="' + chip.dataset.agTp + '"][data-f="main"]').forEach(td => { if (cellVal(td) === chip.dataset.agAim) td.classList.add('ag-lit'); });
  });
  let t = null; const soon = () => { clearTimeout(t); t = setTimeout(apply, 120); };
  new MutationObserver(m => { if (m.some(r => [...r.addedNodes].some(n => n.nodeType === 1 && !String(n.className || '').startsWith('ag-')))) soon(); }).observe(app, { childList: true });
  app.addEventListener('change', soon, true); app.addEventListener('input', soon, true);
  apply();
})();
</script>
