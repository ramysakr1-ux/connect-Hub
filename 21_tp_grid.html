<!DOCTYPE html>
<!--
  Connect Lite — the TP7 & TP8 planning grid
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 28 Sep 2026, with the centre's Word sheet: "Candidates choose their
  own aims and the lessons they're going to teach... they fill it out...
  they don't have to turn it in, but everyone should be able to see it."
  Then: "it shouldn't live there until the MCT releases it", and "it's for
  TP7 and TP8, the last two TPs" -- so the two are read off the course's
  TP count, not set anywhere.

  One grid per TP group, one row per candidate, and for each of the two
  teaching practices a main aim, a sub aim and the material. A candidate
  edits their own row and reads the group's; a tutor edits any row and
  releases per group; the assessor reads. Two things the paper sheet could
  not do: a clash -- two candidates in a group picking the same main aim
  for the same TP -- is marked amber, and each candidate's main aims from
  the earlier teaching practices sit beside their name, read from the
  returned feedback, so they choose what they have not taught yet.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Connect Lite — TP planning grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(98.8% 0.006 85); --sand-line:oklch(85.5% 0.02 80); --sand-deep:oklch(94.8% 0.01 85);
    --paper:oklch(99.5% 0.004 90); --surface:oklch(95.2% 0.018 84);
    --box:oklch(91.2% 0.03 80); --card:oklch(95.2% 0.018 84); --ink:oklch(23.5% 0.017 65);
    --teal:oklch(37.5% 0.058 195); --grey:oklch(51% 0.017 70); --brick:oklch(45% 0.15 27);
    --gold:oklch(63% 0.096 72); --gold-deep:oklch(52% 0.098 70); --faint:oklch(60% 0.012 80);
  }
  body{background:var(--sand); color:var(--ink); font-family:'Karla',sans-serif; margin:0;}
  .board{max-width:1080px; margin:0 auto; padding:26px 20px 80px;}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .eyebrow{font-size:0.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); font-weight:700; margin:0 0 4px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.7rem; margin:0 0 4px;}
  .lede{color:var(--grey); font-size:0.88rem; line-height:1.6; margin:0 0 18px; max-width:70ch;}
  section.group{background:var(--surface); border:1px solid var(--sand-line); border-left:5px solid var(--teal); border-radius:10px; padding:16px 20px 18px; margin:0 0 18px;}
  section.group h2{font-family:'Newsreader',Georgia,serif; font-size:1.2rem; margin:0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  section.group h2 small{font-family:'Karla',sans-serif; font-size:0.8rem; font-weight:500; color:var(--grey);}
  .relbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0 0;}
  .btn{font-family:'Karla',sans-serif; font-size:0.84rem; font-weight:700; padding:9px 18px; border-radius:8px; border:0; background:var(--teal); color:#fff; cursor:pointer;}
  .btn.primary:not(:disabled):hover{background:var(--teal-lifted, oklch(44% 0.062 195));}
  .btn.quiet{background:none; color:var(--grey); border:1.5px solid var(--sand-line);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .relnote{font-size:0.8rem; color:var(--grey);}
  .check{margin:10px 0 0; padding:14px 16px; border-radius:8px; background:var(--gold-wash, oklch(94.5% 0.035 78)); border:1px solid var(--amber-edge, oklch(84% 0.08 78)); border-left:4px solid var(--gold);}
  .check .ttl{font-family:'Newsreader',Georgia,serif; font-size:1.05rem; font-weight:600; margin:0 0 4px;}
  .check .msg{font-size:0.9rem; line-height:1.5;}
  .check .acts{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:10px;}
  .check .opts{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-top:12px;}
  .check .opts label.f{display:block; font-size:0.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--grey); margin-bottom:4px;}
  .check .opts input[type=datetime-local], .check .opts input[type=text]{width:100%; box-sizing:border-box; font:inherit; font-size:0.9rem; padding:8px 10px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:inherit;}
  .check .opts .tick{display:flex; align-items:center; gap:9px; font-size:0.88rem; align-self:end; padding-bottom:6px;}
  .check .opts .tick input{accent-color:var(--teal);}
  .dueline{font-size:0.82rem; margin:8px 0 0; color:var(--grey);}
  .dueline b{color:var(--ink); font-weight:600;}
  .dueline.soon b, .dueline.past b{color:var(--gold-deep);}
  @media (max-width:560px){ .check .opts{grid-template-columns:1fr;} }
  .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:14px 0 0;}
  table.grid{width:100%; border-collapse:collapse; font-size:0.86rem; background:var(--paper); border:1px solid var(--sand-line); border-radius:8px;}
  table.grid th{font-size:0.66rem; letter-spacing:.06em; text-transform:uppercase; color:var(--grey); text-align:left; padding:8px 8px; border-bottom:1px solid var(--sand-line); font-weight:700; white-space:nowrap;}
  table.grid th.tp{text-align:center; font-family:'Newsreader',Georgia,serif; font-size:0.95rem; letter-spacing:0; text-transform:none; color:var(--ink); border-left:1px solid var(--sand-line);}
  table.grid td{padding:8px 8px; border-bottom:1px solid var(--sand-line); vertical-align:top;}
  table.grid td.first{border-left:1px solid var(--sand-line);}
  table.grid tr:last-child td{border-bottom:0;}
  table.grid tr.mine td{background:color-mix(in oklab, var(--teal) 6%, var(--paper));}
  .nm{font-weight:600; white-space:nowrap; display:flex; align-items:center;}
  .nm .you{font-size:0.66rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--teal); margin-left:8px;}
  .sofar{font-size:0.74rem; color:var(--grey); margin-top:4px; white-space:normal; max-width:220px; line-height:1.4;}
  .sofar b{font-weight:600; color:var(--ink);}
  .cell{min-width:150px;}
  .cell .house-sel select, .cell input{width:100%; box-sizing:border-box; font:inherit; font-size:0.86rem;}
  /* One height for every cell -- the select, the material box and the
     read-only cell (Ramy, 28 Sep 2026: "make the materials box the same
     size as the rest"). The select's own height is 46px with the house's
     4px gold edge; the other two are built to match it. */
  .cell input{height:46px; padding:0 14px; border:1px solid var(--sand-line); border-left:4px solid var(--gold); border-radius:8px; background:var(--sand-deep); color:inherit;}
  .cell input:focus{outline:none; border-color:var(--gold);}
  table.grid .ro{height:46px; box-sizing:border-box; display:flex; align-items:center; padding:0 14px; border-radius:8px; background:var(--sand-deep); color:var(--ink); font-size:0.86rem;}
  table.grid .ro.empty{color:var(--faint); font-style:italic;}
  td.clash .ro, td.clash .house-sel select{box-shadow:inset 0 0 0 1.5px var(--gold);}
  .clashnote{font-size:0.78rem; color:var(--gold-deep); font-weight:600; margin:8px 0 0;}
  .aims{font-size:0.8rem; color:var(--grey); margin:12px 0 0; line-height:1.55;}
  .status{font-size:0.8rem; color:var(--grey); margin-left:auto;}
  .empty{padding:20px; color:var(--grey); font-size:0.9rem;}
  @media (max-width:560px){ .board{padding:18px 12px 60px;} section.group{padding:12px 12px 14px;} .sofar{max-width:160px;} }
  @media print{ .back, .relbar, .check, #hubSync{display:none !important;} body{background:#fff;} }
</style>
<link rel="stylesheet" href="hub-house.css?v=202609300008">
<link rel="stylesheet" href="hub-theme.css?v=202609300008">
</head>
<body class="hub-grid">
<div class="board">
  <a class="back" id="back" href="index.html">&larr; Back</a>
  <div id="app"></div>
</div>
<script src="hub-due.js?v=202609300008"></script>
<script src="hub-tracker.js?v=202609300008"></script>
<script src="hub-shared.js?v=202609300008"></script>
<script src="hub-store.js?v=202609300008"></script>
<script src="hub-sync.js?v=202609300008"></script>
<script type="text/x-hub-app">
const MODE = window.HubMode;
const IS_TRAINEE = MODE === 'trainee', IS_TUTOR = MODE === 'tutor';
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const T = window.HubTracker;
const SETTINGS = rec('connect_course_settings') || {};
const KEY = 'connect_tp_grid_v1';
$('back').href = IS_TRAINEE ? 'index.html' : IS_TUTOR ? '5_tutor_dashboard.html' : '12_assessor_pack.html';

/* The last two teaching practices, off the course's TP count. */
const TOTAL = (function(){ const n = parseInt(SETTINGS.tpCount, 10); return (n >= 2 && n <= 12) ? n : 8; })();
const TPS = [TOTAL - 1, TOTAL];
const AIMS = ['Grammar', 'Vocabulary', 'Functional language', 'Reading', 'Listening', 'Speaking', 'Writing'];

/* What a candidate has taught so far: the tracker's own reading of each
   returned lesson's main aim (tp<n>_aim), so the grid and the tracker agree. */
function soFar(tr){
  try {
    const flat = T.recordFor(tr); const counts = {};
    for (let n = 1; n <= TOTAL; n++) { if (TPS.includes(n)) continue; const a = flat['tp' + n + '_aim']; if (a) counts[a] = (counts[a] || 0) + 1; }
    const parts = Object.keys(counts).map(k => k + (counts[k] > 1 ? ' ×' + counts[k] : ''));
    return parts.length ? parts.join(', ') : '';
  } catch(e) { return ''; }
}
const AIM_WORD = { GRAMMAR:'Grammar', VOCAB:'Vocabulary', VOCABULARY:'Vocabulary', FUNCTIONAL:'Functional language', READING:'Reading', LISTENING:'Listening', SPEAKING:'Speaking', WRITING:'Writing' };
const aimWord = a => AIM_WORD[String(a || '').toUpperCase()] || a || '';

let grid = rec(KEY) || null;
let busy = false, note = '', pendingRelease = null;   // pendingRelease: { group, on }
const groupsOf = () => {
  if (IS_TRAINEE) return grid && grid.released ? [{ group: grid.group, rows: grid.rows.map(r => ({ name: r.name, mine: r.mine, plan: r.plan || {}, tr: r.mine ? meTr() : null })) }] : [];
  const roster = rec('connect_roster_v1') || {}; const people = Object.values(roster.trainees || {});
  const by = {}; people.forEach(t => { const g = String(t.group || ''); (by[g] = by[g] || []).push(t); });
  return Object.keys(by).sort().map(g => ({ group: g, rows: by[g].sort((a, b) => (a.name || '').localeCompare(b.name || '')).map(t => ({ name: t.name, token: t.id, plan: ((grid && grid.rows) || {})[t.id] || {}, tr: t })) }));
};
function meTr(){ const me = rec('hub:me') || {}; return { id: me.token, name: me.name, tp: { plan: rec('chub:plan'), selfeval: rec('chub:selfeval'), feedback: rec('chub:feedback'), history: rec('chub:tpHistory') || {} }, assignments: rec('connect_assignment_submissions_v1') || {}, tracker: rec('chub:tracker') || {} }; }
const released = g => IS_TRAINEE ? !!(grid && grid.released) : !!(grid && grid.released && grid.released[g]);

function sel(cls, value, opts, editable){
  if (!editable) return `<div class="ro${value ? '' : ' empty'}">${esc(aimWord(value) || 'not chosen')}</div>`;
  return `<div class="house-sel"><select class="${cls}"><option value="">Choose…</option>${AIMS.map(a => `<option value="${esc(a)}"${aimWord(value) === a ? ' selected' : ''}>${a}</option>`).join('')}</select></div>`;
}
function render(){
  const app = $('app');
  const groups = groupsOf();
  const head = `<p class="eyebrow">Teaching practice</p><h1>TP${TPS[0]} &amp; TP${TPS[1]} planning grid</h1>
    <p class="lede">${IS_TRAINEE ? `The last two teaching practices are yours to plan. Choose a main aim and a sub aim for each, and say what material you will use, so your group and your tutors can see who is teaching what. Your row is yours; the others are your group’s to read.` : `The candidates’ own aims for the last two teaching practices, one grid per group. Release a group’s grid when you want them to start filling it in; you can edit any row.`}</p>`;
  if (IS_TRAINEE && !released()) { app.innerHTML = head + `<div class="empty">Your tutor has not released the planning grid yet.</div>`; return; }
  if (!groups.length) { app.innerHTML = head + `<div class="empty">No candidates on the roster yet.</div>`; return; }
  app.innerHTML = head + groups.map(g => {
    const n = g.rows.length; const on = released(g.group);
    const clash = {}; TPS.forEach(tp => { const c = {}; g.rows.forEach(r => { const m = aimWord((r.plan['tp' + tp] || {}).main); if (m) c[m] = (c[m] || 0) + 1; }); clash[tp] = c; });
    const anyClash = TPS.some(tp => Object.values(clash[tp]).some(v => v > 1));
    const relbar = IS_TUTOR ? (pendingRelease && pendingRelease.group === g.group
      ? `<div class="check" role="alert"><div class="ttl">Are you sure?</div><div class="msg">${pendingRelease.on ? `<b>Group ${esc(g.group) || '—'}</b> — ${n} candidate${n === 1 ? '' : 's'} — will see the grid on their home the moment you release it. Releasing is the main course tutor’s call.` : `The grid disappears from <b>Group ${esc(g.group) || '—'}</b>’s home. Nothing typed is lost; release it again to show it.`}</div>${pendingRelease.on ? `<div class="opts"><div><label class="f">Fill in by <span style="font-weight:500;text-transform:none;letter-spacing:0">(optional)</span></label><input type="datetime-local" id="relDue" value="${esc(window.HubDue ? HubDue.toLocalInput(((grid && grid.due) || {})[g.group] || '') : '')}"></div><label class="tick"><input type="checkbox" id="relPost" checked> Post it to the course stream</label>${tutorName() ? '' : `<div style="grid-column:1/-1"><label class="f">Your name, to sign the post</label><input type="text" id="relName" placeholder="Type your name"></div>`}</div>` : ''}<div class="acts"><button class="btn quiet" type="button" data-rel-cancel="1">Cancel</button><button class="btn primary" type="button" data-rel-go="${esc(g.group)}"${busy ? ' disabled' : ''}>${pendingRelease.on ? 'Release anyway' : 'Take it back'}</button></div></div>`
      : `<div class="relbar">${on ? `<span class="chip fine">Released</span><button class="btn quiet" type="button" data-rel="${esc(g.group)}" data-on="0">Unrelease</button>` : `<span class="chip nd">Not released</span><button class="btn primary" type="button" data-rel="${esc(g.group)}" data-on="1">Release to Group ${esc(g.group) || '—'}</button>`}<span class="relnote">${on ? 'The candidates can see and fill their rows.' : 'Only tutors can see it until it is released.'}</span><span class="status">${esc(note)}</span></div>`) : (IS_TRAINEE ? `<div class="relbar"><span class="status">${esc(note)}</span></div>` : '');
    const rows = g.rows.map(r => {
      const editable = IS_TUTOR || (IS_TRAINEE && r.mine);
      const sf = r.tr ? soFar(r.tr) : '';
      return `<tr class="${r.mine ? 'mine' : ''}" data-token="${esc(r.token || '')}"><td><div class="nm">${window.hubAvatar ? hubAvatar(r.name) : ''}${esc(r.name)}${r.mine ? '<span class="you">you</span>' : ''}</div>${sf ? `<div class="sofar">So far: <b>${esc(sf)}</b></div>` : ''}</td>`
        + TPS.map(tp => { const p = r.plan['tp' + tp] || {}; const isClash = aimWord(p.main) && clash[tp][aimWord(p.main)] > 1;
          return `<td class="cell first${isClash ? ' clash' : ''}" data-tp="${tp}" data-f="main">${sel('main', p.main, AIMS, editable)}</td><td class="cell" data-tp="${tp}" data-f="sub">${sel('sub', p.sub, AIMS, editable)}</td><td class="cell" data-tp="${tp}" data-f="material">${editable ? `<input type="text" class="material" value="${esc(p.material || '')}" placeholder="Coursebook, pages…">` : `<div class="ro${p.material ? '' : ' empty'}">${esc(p.material || 'not yet')}</div>`}</td>`; }).join('')
        + `</tr>`;
    }).join('');
    /* Ramy, 28 Sep 2026: "you can't have more than six per TP group." A
       reminder, not a block -- the roster is the centre's to fix. */
    /* The "fill in by" date: a reminder in the house's tone, plain until the
       day, gold on it; after it, "was due", and nothing locks. */
    const dueIso = IS_TRAINEE ? (grid && grid.due) || '' : ((grid && grid.due) || {})[g.group] || '';
    const ds = window.HubDue ? HubDue.state(dueIso) : { has: false };
    const dueLine = (on && ds.has) ? `<p class="dueline${ds.past ? ' past' : ds.soon ? ' soon' : ''}">${ds.past ? `Was due <b>${esc(ds.due)}</b>` : `Fill in your row by <b>${esc(ds.due)}</b> — ${esc(ds.text)}`}</p>` : '';
    const over = n > 6 ? `<p class="clashnote">A teaching practice group is at most six candidates. This one has ${n} \u2014 split it on Course admin.</p>` : '';
    return `<section class="group" data-group="${esc(g.group)}"><h2>Group ${esc(g.group) || '—'} <small>${n} candidate${n === 1 ? '' : 's'}</small></h2>${over}${relbar}${dueLine}
      <div class="tablewrap"><table class="grid"><thead><tr><th rowspan="2">Candidate</th>${TPS.map(tp => `<th class="tp" colspan="3">TP${tp}</th>`).join('')}</tr><tr>${TPS.map(() => `<th style="border-left:1px solid var(--sand-line)">Main aim</th><th>Sub aim</th><th>Material</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      ${anyClash ? `<p class="clashnote">Two of you have the same main aim for the same teaching practice. Not a problem if the group means it — worth a word if not.</p>` : ''}
      <p class="aims">Main aim: ${AIMS.join(' · ')}. Sub aim: usually a skill for a language lesson, or language for a skills lesson.</p></section>`;
  }).join('');
  wire();
}
function wire(){
  const app = $('app');
  app.querySelectorAll('tr[data-token], tr.mine').forEach(tr => {
    const token = tr.dataset.token || (rec('hub:me') || {}).token || '';
    tr.querySelectorAll('td.cell').forEach(td => {
      const el = td.querySelector('select, input'); if (!el) return;
      const fire = async () => {
        const tp = td.dataset.tp; const cells = [...tr.querySelectorAll(`td.cell[data-tp="${tp}"]`)];
        const val = f => { const c = cells.find(x => x.dataset.f === f); const e = c && c.querySelector('select, input'); return e ? e.value : ''; };
        note = 'Saving…'; setStatus();
        try {
          const r = await window.HubStore.call(Object.assign({ op: 'gridSet', tp, main: val('main'), sub: val('sub'), material: val('material') }, IS_TUTOR ? { token } : { token: window.HubStore.token() }));
          grid = r.grid; localStorage.setItem(KEY, JSON.stringify(grid)); note = 'Saved'; render(); setTimeout(() => { note = ''; setStatus(); }, 2500);
        } catch(err) { note = 'Could not save — ' + (err.message || err); setStatus(); }
      };
      if (el.tagName === 'SELECT') el.addEventListener('change', fire);
      else { let t = null; el.addEventListener('input', () => { clearTimeout(t); t = setTimeout(fire, 900); }); el.addEventListener('blur', () => { clearTimeout(t); fire(); }); }
    });
  });
  app.querySelectorAll('[data-rel]').forEach(b => b.addEventListener('click', () => { pendingRelease = { group: b.dataset.rel, on: b.dataset.on === '1' }; render(); }));
  app.querySelectorAll('[data-rel-cancel]').forEach(b => b.addEventListener('click', () => { pendingRelease = null; render(); }));
  app.querySelectorAll('[data-rel-go]').forEach(b => b.addEventListener('click', async () => {
    const { group, on } = pendingRelease;
    const dueEl = $('relDue'), postEl = $('relPost'), nameEl = $('relName');
    const due = on && dueEl && dueEl.value && window.HubDue ? HubDue.fromLocalInput(dueEl.value) : (on ? '' : undefined);
    const wantPost = on && postEl && postEl.checked;
    const by = tutorName() || (nameEl ? nameEl.value.trim() : '');
    if (wantPost && !by) { if (nameEl) nameEl.focus(); return; }
    if (by && !tutorName()) localStorage.setItem('chub:tutorName', by);
    busy = true; render();
    try {
      const r = await window.HubStore.call(Object.assign({ op: 'gridRelease', group, released: on }, due === undefined ? {} : { due }));
      grid = r.grid; localStorage.setItem(KEY, JSON.stringify(grid)); note = on ? 'Released.' : 'Taken back.';
      /* The release IS the announcement: one post to that group's stream,
         under the tutor's name, with the date when there is one. */
      if (wantPost) {
        const ds = window.HubDue && due ? HubDue.state(due) : { has: false };
        const text = `The TP${TPS[0]} & TP${TPS[1]} planning grid is open — choose your main aim, sub aim and material for each. ${ds.has ? 'Fill in your row by ' + ds.due + '.' : 'Fill in your row when you can.'}`;
        try { const p = await window.HubStore.call({ op: 'post', by, to: group, text }); localStorage.setItem('connect_course_stream_v1', JSON.stringify(p.stream || [])); note = 'Released, and posted to Group ' + (group || '—') + '.'; }
        catch(err) { note = 'Released, but the post did not go — ' + (err.message || err); }
      }
    }
    catch(err) { note = 'Could not — ' + (err.message || err); }
    busy = false; pendingRelease = null; render(); setTimeout(() => { note = ''; setStatus(); }, 3000);
  }));
}
function tutorName(){ return (localStorage.getItem('chub:tutorName') || '').trim(); }
function setStatus(){ document.querySelectorAll('.status').forEach(s => s.textContent = note); }
render();
</script>
</body>
</html>
