<!DOCTYPE html>
<!--
  Connect Lite — the malpractice warning letter
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 25 Oct 2026: "do we have anything for students who work out plagiarizing?
  ... a deterrent against plagiarism again and the consequences of it? It should be
  up to the centre, but do we have a policy in place?"

  The policy is the centre's and lives in the candidate agreement (Course admin,
  "Plagiarism and the use of AI"). Administration Handbook 6.3 asks that agreement
  to "specify the consequences of failing to meet these expectations, including the
  use of written warnings before sanctions are applied"; 9.2.4 asks centres to have
  "an internal institutional plagiarism policy which makes clear to candidates what
  the penalties are", to deal with a case "according to their malpractice policy",
  and to "make it clear to candidates that severe penalties are applied by Awarding
  Bodies ... ranging from loss of marks to disqualification from the award and a ban
  on re-entry for a period of up to three years"; 11.1: candidates "may be ineligible
  for the award in cases where dishonesty or plagiarism is brought to the attention
  of Cambridge".

  This is that written warning. It writes itself from the record: the assignment
  recorded as a Fail and the tutors' decision, the agreement's own words, and
  Cambridge's penalties. The tutor edits every line before issuing. Once issued it
  is the trainee's to read and sign, and it goes in the portfolio. It is not the
  Fail warning letter (22): that one is about the course outcome; this one is about
  conduct.
-->

<style>

    --cream:oklch(97.5% 0.012 85);

  .rhead{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; border-bottom:2px solid var(--teal); padding-bottom:12px; margin-bottom:22px;}

  .section{margin-bottom:26px;}

  .intro{font-size:0.84rem; color:var(--grey); line-height:1.55; margin:0 0 12px;}

  .desc-intro{font-size:0.92rem; line-height:1.6; margin:0 0 10px;}

  .closing{font-size:0.9rem; line-height:1.6; margin:12px 0 0; font-style:italic; color:var(--ink-warm);}

  .missing{background:var(--surface); border-radius:6px; border-left:5px solid var(--brick); padding:22px 26px;}

  /* Orientation stated, not left to the print dialog -- see hub-record.css. */
  @page{ size:A4 portrait; margin:12mm; }
  @media print{
    body{background:#fff; padding:0;}
    .bar, #hubSync{display:none !important;}
    .sheet{border-left:none; border-radius:0; margin:0; min-height:0; padding:18mm 16mm; break-after:page; page-break-after:always;}
    .sheet:last-child{break-after:auto; page-break-after:auto;}
    .sheet.cover{background:#fff;}
  }
  @media(max-width:600px){
    .sheet{padding:24px 18px; min-height:0;} .frame{padding:22px 14px;} .name{font-size:1.5rem;}
  }

  .lede{font-size:0.92rem; line-height:1.6; color:var(--ink-soft); margin:0 0 18px; max-width:62ch;}
  .cite{font-size:0.8rem; line-height:1.6; color:var(--ink-soft); background:var(--surface); border-left:3px solid var(--sand-line);
        padding:10px 14px; border-radius:0 8px 8px 0; margin:0 0 18px;}
  .cite b{color:var(--ink);}
  .sheet{background:var(--paper); border:1px solid var(--sand-line); border-radius:12px; padding:30px 34px;}
  .sheet h2{font-family:'Newsreader',serif; font-size:1.25rem; margin:0 0 4px;}
  .meta{font-size:0.8rem; color:var(--ink-soft); margin:0 0 22px;}
  .para{font-size:0.9rem; line-height:1.65; margin:0 0 14px; white-space:pre-wrap;}
  .f{display:block; font-size:0.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; margin:16px 0 6px;}
  textarea{width:100%; min-height:110px; font-family:'Karla',sans-serif; font-size:0.88rem; line-height:1.6; color:var(--ink);
           background:var(--cream); border:1px solid var(--sand-line); border-radius:8px; padding:10px 12px; resize:vertical;}
  textarea:focus{outline:2px solid var(--teal); outline-offset:1px;}
  .acts{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:20px;}

  .pill.on{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .pill.amb{background:oklch(93% 0.06 75); border-color:oklch(80% 0.09 72); color:oklch(38% 0.09 60);}
  .empty{font-size:0.86rem; color:var(--ink-soft); background:var(--surface); border:1px dashed var(--sand-line);
         border-radius:10px; padding:18px; text-align:center;}
  .receipt{margin-top:18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:0.88rem;}
  .receipt svg{width:150px; height:50px;}
  .receipt .who b{display:block;}
  .sign{margin-top:26px; padding-top:18px; border-top:1px solid var(--sand-line); font-size:0.88rem;}
  @media print{ textarea{border:none; background:transparent; padding:0; resize:none;} .f{margin-top:14px;} .cite, .lede{display:none;} }
</style>

<script type="text/x-hub-app">
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const T = window.HubTracker;
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const IS_TRAINEE = window.HubMode === 'trainee', IS_TUTOR = window.HubMode === 'tutor';
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const SETTINGS = rec('connect_course_settings') || {};
const when = iso => iso ? new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }) : '';
const tutorName = () => (localStorage.getItem('chub:tutorName') || '').trim();

/* Who this letter is about. A tutor names a trainee in the link; a trainee
   opens their own. */
let who = null, TOKEN = '';
if (IS_TRAINEE) {
  const me = rec('chub:me') || {};
  who = { name: me.name || '', tr: { tracker: rec('chub:tracker') || {}, celta5: rec('chub:celta5') || {}, celta5t: rec('chub:celta5t') || {},
          tp: { history: rec('chub:tpHistory') || {}, feedback: rec('chub:feedback') }, assignments: rec('connect_assignment_submissions_v1') || {} } };
} else {
  TOKEN = P.get('trainee') || '';
  const r = rec('connect_roster_v1') || {};
  const tr = TOKEN && r.trainees ? r.trainees[TOKEN] : null;
  if (tr) who = { name: tr.name, tr };
}

const saveTracker = patch => {
  if (!IS_TUTOR) return;
  const r = rec('connect_roster_v1');
  if (!r || !r.trainees || !r.trainees[TOKEN]) { alert('The roster has not loaded yet \u2014 give it a moment.'); return; }
  const t = r.trainees[TOKEN].tracker = r.trainees[TOKEN].tracker || {};
  Object.assign(t, patch);
  localStorage.setItem('connect_roster_v1', JSON.stringify(r));
  const s = $('status'); if (s) { s.textContent = 'Saved'; setTimeout(() => { if ($('status')) $('status').textContent = ''; }, 1400); }
};

/* The action points the tutors have already written, in the CELTA 5. 10.2 asks
   the letter to draw attention to exactly these, so the letter offers them
   rather than asking a tutor to retype them. */
const AS_NAME = { lsrt: 'Language Skills Related Tasks', lrt: 'Language Related Tasks', fol: 'Focus on the Learner', lfc: 'Lessons from the Classroom', a5: 'Assignment 5' };
/* The case, from the marking record: every assignment recorded as a Fail whose
   decision speaks of plagiarism, collusion or malpractice; failing that, any Fail. */
function cases(){
  const A = (who.tr && who.tr.assignments) || {};
  const all = Object.entries(A).filter(([k, a]) => a && a.feedback && /fail/i.test(a.feedback.outcome || '') && !/on resubmission/i.test(a.feedback.outcome || ''));
  const mal = all.filter(([k, a]) => /plagiar|malpractice|not (your|their) own work|copied|collu/i.test(a.feedback.generalComment1 || a.feedback.generalComment2 || ''));
  return (mal.length ? mal : all).map(([k, a]) => ({ key: k, name: AS_NAME[k] || k.toUpperCase(), at: a.marked2At || a.marked1At || '', decision: String(a.feedback.generalComment1 || '').trim() }));
}
function draft(r){
  const centre = SETTINGS.centreName || 'the centre';
  const agr = (SETTINGS.agreement || {});
  const policy = String(agr.agrPlagiarism || '').trim();
  const signed = (who.tr && who.tr.agreement && who.tr.agreement.at) ? when(who.tr.agreement.at) : '';
  const cs = cases();
  const lines = [];
  lines.push('Dear ' + (who.name.split(/\s+/)[0] || who.name) + ',');
  lines.push('');
  lines.push('This is a written warning under the candidate agreement' + (signed ? ' you signed on ' + signed : '') + '. I am writing it so that what has happened, and what follows from it, is clear and on the record.');
  lines.push('');
  if (cs.length) {
    cs.forEach(c => {
      const first = c.decision.split(/(?<=\.)\s+/).slice(0, 2).join(' ');
      lines.push('Your ' + c.name + ' assignment' + (c.at ? ' was recorded as a Fail on ' + when(c.at) : ' is recorded as a Fail') + '. ' + (first || 'The work submitted was not your own.'));
    });
  } else {
    lines.push('An assignment of yours has been found not to be your own work.');
  }
  lines.push('');
  if (policy) {
    lines.push('Our agreement says this about plagiarism, and it applies from here on:');
    lines.push('');
    policy.split(/\n\n+/).forEach(p => lines.push('  ' + p.trim()));
  } else {
    lines.push('Written assignments must be your own work. If we suspect plagiarism again we open a malpractice case, you are shown the evidence and given the chance to respond in writing, and an upheld case fails the assignment.');
  }
  lines.push('');
  lines.push('What a second instance would mean: under Cambridge\u2019s rules a candidate who fails more than one assignment is not eligible for a Pass, so a second assignment failed for this reason would end the course as a Fail, whatever the teaching practice. Cambridge also applies its own penalties where plagiarised work reaches it, ranging from loss of marks to disqualification from the award and a ban on re-entry for up to three years, and may withhold the certificate where dishonesty or plagiarism is brought to its attention.');
  lines.push('');
  lines.push('Every assignment you submit from now on carries your declaration that it is your own work. Quoting a source, discussing ideas with others and drawing on reference books are all fine and expected; passing someone else\u2019s words or an AI\u2019s off as yours is not. If you are unsure whether something counts, ask your tutor before you submit.');
  lines.push('');
  lines.push('This letter is not a grade. It goes in your portfolio, and it is the only warning of its kind you will receive.');
  return lines.join('\n');
}

/* THE TRAINEE SIGNS FOR IT (Ramy, 24 Oct 2026: "he was issued a warning
   letter but hasn't signed it yet"). The signature is the trainee's, so it
   lives in their own CELTA 5 record, which they can write and their tutors
   read; it names the issue it was for, so a letter withdrawn and issued
   again asks to be signed again. Signing says the letter was received and
   read, nothing more. */
function letterSig(issuedAt){
  const c = IS_TRAINEE ? (rec('chub:celta5') || {}) : ((who.tr && who.tr.celta5) || {});
  const s = c.malpracticeLetterSigned || null;
  return s && s.at && s.letter === issuedAt ? s : null;
}
function receipt(issuedAt){
  const s = letterSig(issuedAt);
  if (s) return `<div class="receipt">${s.ink && window.hubInk ? window.hubInk.svg(s.ink, 'sm', s.name) : ''}<div class="who"><b>${esc(s.name)}</b>Received and read, signed ${esc(when(s.at))}</div></div>`;
  if (IS_TRAINEE) return `<div class="receipt"><button class="btn primary" type="button" id="signLetter">Sign to say you have read it</button></div>`;
  return `<div class="receipt"><span class="pill amb">Not signed yet</span><span class="status">It is signed from the trainee\u2019s own link.</span></div>`;
}
function render(){
  if (!who) { $('doc').innerHTML = '<div class="empty">Name a trainee in the link to open their warning.</div>'; return; }
  const r = T.readCandidate(T.recordFor(who.tr));
  const man = who.tr.tracker || {};
  const issuedAt = man.malpracticeLetterIssuedAt || '', issuedBy = man.malpracticeLetterBy || '';
  const body = man.malpracticeLetterDoc != null ? man.malpracticeLetterDoc : draft(r);

  /* A trainee sees the letter only once it has been issued. Before that it
     is the tutors' draft, and a half-written warning is worse than none. */
  if (IS_TRAINEE && !issuedAt) {
    $('doc').innerHTML = '<div class="empty">There is no warning for you to read.</div>';
    return;
  }
  const readOnly = !IS_TUTOR;
  const dates = (SETTINGS.start && SETTINGS.end) ? when(SETTINGS.start) + ' \u2013 ' + when(SETTINGS.end) : '';

  $('doc').innerHTML = `
    ${readOnly ? '' : `<p class="lede">The written warning after an upheld malpractice case. It writes itself from the marking record and the centre’s own agreement. Edit it as you like, then issue it. Once issued, ${esc(who.name.split(/\s+/)[0] || 'the trainee')} can read and sign it here and it becomes part of the portfolio.</p>
    <p class="cite"><b>Administration Handbook 6.3</b> — the candidate agreement must specify the consequences of failing to meet the centre’s expectations, <b>including the use of written warnings before sanctions are applied</b>. <b>9.2.4</b> — centres should have an internal plagiarism policy which makes clear what the penalties are, deal with a case according to their malpractice policy, and make it clear that Awarding Bodies apply severe penalties, from loss of marks to disqualification and a ban on re-entry for up to three years. The policy is the centre’s; this letter is its written warning.</p>`}
    <div class="sheet">
      <h2>${esc(SETTINGS.centreName || '')}</h2>
      <p class="meta">${esc(SETTINGS.courseName || '')}${dates ? ' \u00b7 ' + esc(dates) : ''}<br>
        ${esc(who.name)}${issuedAt ? ' \u00b7 issued ' + esc(when(issuedAt)) + (issuedBy ? ' by ' + esc(issuedBy) : '') : ''}</p>
      ${readOnly
        ? `<div class="para">${esc(body)}</div>`
        : `<label class="f" for="body">The letter</label><textarea id="body" style="min-height:420px" placeholder="The letter as the trainee will read it.">${esc(body)}</textarea>`}
      <div class="sign">${issuedAt ? esc(issuedBy || '') + '<br>' + esc(SETTINGS.centreName || '') : ''}</div>
    </div>
    ${issuedAt ? receipt(issuedAt) : ''}
    ${readOnly ? '' : `<div class="acts">
      ${issuedAt
        ? `<span class="pill on">Issued ${esc(when(issuedAt))}</span><button class="btn" type="button" id="unissue">Withdraw the letter</button>`
        : `<button class="btn primary" type="button" id="issue">Issue this letter</button>${`<span class="status">Issue it once the case is upheld and the trainee has been told.</span>`}`}
      <button class="btn" type="button" id="reset">Start again from the record</button>
      <span class="status" id="status"></span>
    </div>`}`;

  const sg = $('signLetter');
  if (sg) sg.addEventListener('click', async () => {
    const ink = await window.hubInk.confirm({ name: who.name, title: 'Sign the warning' });
    if (ink === null) return;
    const c = rec('chub:celta5') || {};
    c.malpracticeLetterSigned = ink ? { name: who.name, at: new Date().toISOString(), ink, letter: issuedAt } : { name: who.name, at: new Date().toISOString(), letter: issuedAt };
    localStorage.setItem('chub:celta5', JSON.stringify(c));
    render();
  });
  const b = $('body');
  if (b) b.addEventListener('input', () => saveTracker({ malpracticeLetterDoc: b.value }));
  const iss = $('issue');
  if (iss) iss.addEventListener('click', () => {
    let name = tutorName();
    name = (prompt('Your name, to issue this letter:', name) || '').trim();
    if (!name) return;
    localStorage.setItem('chub:tutorName', name);
    const today = new Date().toISOString();
    /* failLetter is the date the tracker has always shown; the document and
       the signer sit beside it so the old field keeps working. */
    saveTracker({ malpracticeLetterDoc: ($('body') || {}).value || body, malpracticeLetterIssuedAt: today, malpracticeLetterBy: name,
                  malpracticeLetter: new Date().toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) });
    render();
  });
  const un = $('unissue');
  if (un) un.addEventListener('click', () => {
    if (!confirm('Withdraw the warning? It stops being the trainee\u2019s to read. The text stays here.')) return;
    saveTracker({ malpracticeLetterIssuedAt: '', malpracticeLetterBy: '', malpracticeLetter: '' }); render();
  });
  const rs = $('reset');
  if (rs) rs.addEventListener('click', () => {
    if (!confirm('Replace the text with a fresh draft from the marking record and the agreement?')) return;
    saveTracker({ malpracticeLetterDoc: draft(r) }); render();
  });
}
if (IS_TRAINEE) { const bl = $('backLink'); if (bl) { bl.href = 'index.html'; bl.textContent = 'Home'; } }
render();
