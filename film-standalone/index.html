<!DOCTYPE html>
<!--
  Connect Lite — the film. One file, and nothing else.
  © 2026 Ramy Sakr. All rights reserved.

  WHY THIS EXISTS. The first film drove the real screens in an iframe, which
  meant it depended on three live courses, a store, a network and a browser
  that had not throttled its own timers. The second was an artifact export:
  eighteen scenes compiled into 1.4MB of React that could be watched and never
  edited. Ramy, 27 Sep 2026: "rebuild it as one plain HTML file."

  So: no framework, no bundler, no build step, no live screens. Every screen in
  it is DRAWN here in HTML and CSS, in Lite's own colours and type. Open the
  file and it plays. Change a number below and it changes.

  HOW IT IS PUT TOGETHER
    SCENES      the whole film, in order: id, seconds, and what it draws.
    screen()    each scene returns HTML. They share the pieces in SCREEN —
                a header, a card, a row — so they look like one product.
    cue()       schedules a class change inside a scene: that is the motion.
    The caption and chapter layers sit above the stage and are never part of
    a screen, so a screen can be reused without its words coming with it.

  TO CHANGE IT
    A caption      edit its cue(…, 'say', …) line.
    A scene length edit the `s:` seconds on the scene.
    The order      move the scene in SCENES. Nothing else needs touching.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Lite — the film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;0,700;1,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Lite's own palette. Nothing here is invented for the film. */
  :root{
    --sand:#FBFAF7; --sand-2:#F2EEE4; --paper:#FDFCFA; --box:#EDE6D8;
    --line:#DCD3C2; --ink:#2C2418; --grey:#6B6157;
    --teal:#1E6B63; --teal-l:#E8F0EE; --gold:#C9B189; --gold-d:#A88A57;
    --garnet:#A33227; --ok:#2F7D4F;
    --stage-w:1120px; --stage-h:630px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:#161310; color:#E8E2D6; font-family:Karla,system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:18px; padding:26px 16px 40px; min-height:100vh}

  /* ---- the stage ------------------------------------------------------- */
  .wrap{width:var(--stage-w); max-width:100%}
  .stage{position:relative; width:var(--stage-w); height:var(--stage-h); max-width:100%;
    background:var(--sand); border-radius:14px; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.5); transform-origin:top left}
  .screen{position:absolute; inset:0; opacity:0; transition:opacity .45s ease}
  .screen.on{opacity:1}

  /* ---- the words ------------------------------------------------------- */
  /* A caption floats over the screen and drifts the whole time it is up. It
     is never a subtitle bar: translucent white with a dark aura, because every
     screen under it is cream. */
  .cap{position:absolute; left:50%; bottom:18%; width:max-content; max-width:52ch;
    padding:0 24px; text-align:center; pointer-events:none; z-index:7;
    font-family:Newsreader,Georgia,serif; font-weight:600; font-size:1.65rem; line-height:1.3;
    color:#fff; opacity:0;
    text-shadow:0 0 5px rgba(28,22,14,.95),0 0 12px rgba(28,22,14,.92),
      0 0 26px rgba(28,22,14,.8),0 2px 3px rgba(28,22,14,.9);
    transform:translate(-50%,0); transition:opacity .7s ease}
  .cap.on{opacity:.84; animation:drift 12s linear forwards}
  .cap.out{opacity:0; transition:opacity 1.4s ease}
  @keyframes drift{from{transform:translate(-50%,8px)} to{transform:translate(calc(-50% + 26px),-40px)}}

  /* A chapter card covers the stage completely, so the cut either side is clean. */
  .chap{position:absolute; inset:0; z-index:9; background:var(--sand);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    opacity:0; pointer-events:none; transition:opacity .55s ease}
  .chap.on{opacity:1}
  .chap .n{font-size:.78rem; letter-spacing:.22em; text-transform:uppercase; color:var(--grey)}
  .chap h2{font-family:Newsreader,Georgia,serif; font-weight:700; font-size:3.4rem; color:var(--teal); line-height:1.05}
  .chap .rule{width:84px; height:3px; border-radius:2px; background:var(--gold)}
  .chap p{max-width:44ch; text-align:center; color:var(--ink); font-size:1.02rem; line-height:1.6}

  /* The cursor. One element, moved by cue(). */
  .cur{position:absolute; width:22px; height:22px; z-index:8; left:0; top:0; opacity:0;
    transition:transform 1s cubic-bezier(.3,.7,.2,1), opacity .3s}
  .cur.on{opacity:1}
  .ring{position:absolute; width:34px; height:34px; margin:-6px 0 0 -6px; border-radius:50%;
    border:2px solid var(--teal); opacity:0; z-index:8; left:0; top:0}
  .ring.pop{animation:pop .5s ease-out}
  @keyframes pop{from{opacity:.75; transform:scale(.4)} to{opacity:0; transform:scale(1.5)}}

  /* ---- the pieces every screen is built from --------------------------- */
  .pg{position:absolute; inset:0; padding:26px 30px; display:flex; flex-direction:column; gap:14px}
  .hd{display:flex; align-items:center; gap:12px; padding-bottom:12px; border-bottom:1px solid var(--line)}
  .mark{font-family:Newsreader,Georgia,serif; font-style:italic; font-size:19px; color:var(--teal)}
  .mark b{font-style:normal; font-weight:700; font-size:11px; letter-spacing:.14em; color:var(--gold-d); margin-left:5px}
  .eyebrow{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); font-weight:700}
  .hd .who{margin-left:auto; font-size:12px; color:var(--grey)}
  h1{font-family:Newsreader,Georgia,serif; font-weight:700; font-size:27px; color:var(--ink); line-height:1.15}
  h3{font-family:Newsreader,Georgia,serif; font-weight:600; font-size:18px; color:var(--ink)}
  .card{background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--gold);
    border-radius:9px; padding:16px 18px}
  .card.teal{border-left-color:var(--teal)}
  .card.flat{border-left:1px solid var(--line)}
  .row{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px}
  .row:last-child{border-bottom:0}
  .row .nm{font-weight:600; color:var(--ink); min-width:150px}
  .row .mt{color:var(--grey); font-size:12.5px}
  .pill{display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px;
    font-size:11px; font-weight:700; letter-spacing:.02em}
  .pill.teal{background:var(--teal-l); color:var(--teal)}
  .pill.gold{background:#F6EEDC; color:var(--gold-d)}
  .pill.ok{background:#E7F1E9; color:var(--ok)}
  .pill.no{background:#F7E7E5; color:var(--garnet)}
  .fld{background:#fff; border:1px solid var(--line); border-radius:7px; padding:9px 11px;
    font-size:13.5px; color:var(--ink); min-height:38px}
  .fld.lg{min-height:74px; line-height:1.5}
  .btn{display:inline-flex; align-items:center; justify-content:center; height:34px; padding:0 16px;
    border-radius:8px; font-size:13px; font-weight:700; background:var(--teal); color:#fff}
  .btn.gold{background:var(--gold); color:var(--ink)}
  .btn.quiet{background:transparent; border:1px solid var(--line); color:var(--ink)}
  .grid{display:grid; gap:12px}
  .muted{color:var(--grey); font-size:12.5px; line-height:1.55}

  /* things that appear on cue */
  .later{opacity:0; transform:translateY(7px); transition:opacity .5s ease, transform .5s ease}
  .go .later{opacity:1; transform:none}
  .go .later.d1{transition-delay:.18s} .go .later.d2{transition-delay:.36s}
  .go .later.d3{transition-delay:.54s} .go .later.d4{transition-delay:.72s}
  .typed{border-right:2px solid var(--teal)}

  /* the invitation card, used three times with different words */
  .invite{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--sand-2)}
  .invite .c{width:470px; background:var(--paper); border-left:5px solid var(--gold);
    border-radius:10px; padding:26px 28px; box-shadow:0 10px 30px rgba(44,36,24,.1)}
  .invite h1{font-size:24px; margin:6px 0 10px}
  .invite p{font-size:13.5px; color:var(--grey); line-height:1.6; margin-bottom:12px}
  .invite .keep{background:var(--box); border-radius:7px; padding:11px 13px; font-size:12.5px;
    color:var(--ink); line-height:1.55; margin-bottom:16px}

  /* ---- the transport, which is not part of the film -------------------- */
  .bar{display:flex; align-items:center; gap:14px; width:var(--stage-w); max-width:100%;
    color:#9A9184; font-size:13px}
  .bar button{font:700 13px Karla,sans-serif; color:#EFE9DD; background:#2A241D;
    border:1px solid #3D362C; border-radius:999px; padding:8px 16px; cursor:pointer}
  .bar button:hover{background:#352E25}
  .track{flex:1; height:5px; background:#2A241D; border-radius:3px; overflow:hidden}
  .track i{display:block; height:100%; width:0; background:var(--gold)}
  .list{display:flex; flex-wrap:wrap; gap:6px; width:var(--stage-w); max-width:100%}
  .list b{font:600 11.5px Karla,sans-serif; padding:5px 10px; border-radius:999px;
    background:#241F19; color:#8C8377; cursor:pointer}
  .list b.now{background:var(--teal); color:#fff}
  .foot{width:var(--stage-w); max-width:100%; color:#6E665B; font-size:12px; text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="screen on" id="scr"></div>
    <div class="cap" id="cap"></div>
    <div class="chap" id="chap"><div class="n" id="chapN"></div><h2 id="chapH"></h2><div class="rule"></div><p id="chapP"></p></div>
    <div class="ring" id="ring"></div>
    <svg class="cur" id="cur" viewBox="0 0 22 22" aria-hidden="true">
      <path d="M2 1 L2 17 L6.2 13.2 L9 19.6 L12 18.2 L9.2 12 L15 12 Z" fill="#fdfcfa" stroke="#2b2118" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<div class="bar">
  <button id="play">Pause</button>
  <button id="again">Replay scene</button>
  <div class="track"><i id="prog"></i></div>
  <span id="clock">0:00</span>
</div>
<div class="list" id="list"></div>
<div class="foot">Connect <b style="font-style:normal">LITE</b> — designed and built by Ramy Sakr</div>

<script>

   THE PIECES EVERY SCREEN IS BUILT FROM
   One header, one card, one row, so eighteen scenes look like one product
   rather than eighteen drawings.
   ====================================================================== */

  head: (eyebrow, who) => `
    <div class="hd">
      <span class="mark">Connect<b>LITE</b></span>
      <span class="eyebrow">${eyebrow}</span>
      <span class="who">${who || 'Elmswood English Centre · TR999'}</span>
    </div>`,
  page: (eyebrow, who, body) => `<div class="pg">${S.head(eyebrow, who)}${body}</div>`,
  /* The invitation card. The same design three times over; only the words
     change, which is the point it is making. */
  invite: (eyebrow, title, what, keep, go) => `
    <div class="invite"><div class="c">
      <div class="eyebrow">${eyebrow}</div>
      <h1>${title}</h1>
      <p>${what}</p>
      <div class="keep">${keep}</div>
      <div class="btn" id="go">${go}</div>
    </div></div>`,
  row: (name, meta, pill) => `
    <div class="row"><span class="nm">${name}</span><span class="mt">${meta}</span>
    ${pill ? `<span style="margin-left:auto">${pill}</span>` : ''}</div>`,
};

   id · s: seconds · html() · cues: [seconds in, what happens]
   A cue is one of:
     ['say', text]           a floating caption
     ['go']                  reveal the .later things on this screen
     ['type', sel, text]     type into an element
     ['at', sel]             move the cursor there
     ['click', sel]          move there and click
     ['add', sel, class]     add a class — this is how anything else moves
   ====================================================================== */
const SCENES = [

/* ---------------------------------------------------- the opening ---- */
{ id:'Open', s:30, title:'A course is one link',
  html:()=> S.page('Owner console','Ramy Sakr', `

    <h1>TP1 — lesson plan</h1>
    <div><div class="eyebrow" style="margin-bottom:5px">Main aim</div><div class="fld lg" id="aim"></div></div>

    <h1>Your record</h1>

/* ======================================================================
   THE PLAYER. Small on purpose: a clock, a class, and a cursor.
   ====================================================================== */
const stage=document.getElementById('stage'), scr=document.getElementById('scr'),
  cap=document.getElementById('cap'), chap=document.getElementById('chap'),
  cur=document.getElementById('cur'), ring=document.getElementById('ring'),
  prog=document.getElementById('prog'), clock=document.getElementById('clock'),
  listEl=document.getElementById('list');

const TOTAL = SCENES.reduce((n,s)=>n+s.s,0);
let i=0, t0=0, timers=[], playing=true;

/* Fit the stage to the window without touching the layout inside it. */
/* Scale the stage to the window WITHOUT touching anything inside it, so every
   scene is laid out once at 1120x630 and never reflows. Measured off the
   viewport, not off .wrap: in a column flex box the wrapper collapses to its
   content before the first paint, and the film opened at a third of its size. */
function fit(){
  const w=Math.min(document.documentElement.clientWidth-32, 1120);
  const k=Math.max(.3, w/1120);
  stage.style.transform=`scale(${k})`;
  stage.parentElement.style.height=(630*k)+'px';
  document.querySelectorAll('.bar,.list,.foot').forEach(el=>el.style.width=(1120*k)+'px');
}
addEventListener('resize',fit);
addEventListener('load',fit);

SCENES.forEach((s,n)=>{
  const b=document.createElement('b'); b.textContent=(n+1)+' '+(s.title||s.chapter?.[1]||s.id);
  b.onclick=()=>play(n); listEl.appendChild(b);
});
const chips=[...listEl.children];

function clear(){ timers.forEach(clearTimeout); timers=[]; }
function at(ms,fn){ timers.push(setTimeout(fn,ms*1000)); }

function say(text){
  cap.classList.remove('on','out'); void cap.offsetWidth;
  cap.textContent=text; cap.classList.add('on');
  at(Math.max(3.4, text.length/9) , ()=>cap.classList.add('out'));
}
function point(sel, click){
  const el=scr.querySelector(sel); if(!el) return;
  const r=el.getBoundingClientRect(), s=stage.getBoundingClientRect(), k=r.width?(r.width/el.offsetWidth):1;
  const x=(r.left-s.left)/k + el.offsetWidth/2, y=(r.top-s.top)/k + el.offsetHeight/2;
  cur.classList.add('on'); cur.style.transform=`translate(${x}px,${y}px)`;
  if(click) at(.65,()=>{ ring.style.transform=`translate(${x}px,${y}px)`;
    ring.classList.remove('pop'); void ring.offsetWidth; ring.classList.add('pop'); });
}
function type(sel, text, secs){
  const el=scr.querySelector(sel); if(!el) return;
  el.classList.add('typed'); let n=0; const step=(secs*1000)/text.length;
  (function tick(){ if(n>text.length){ el.classList.remove('typed'); return; }
    el.textContent=text.slice(0,n++); timers.push(setTimeout(tick, step)); })();
}

function play(n){
  clear(); i=n; t0=performance.now();
  chips.forEach((c,k)=>c.classList.toggle('now',k===n));
  const sc=SCENES[n];
  cap.classList.remove('on','out');
  cur.classList.remove('on');

  if(sc.chapter){
    scr.classList.remove('on');
    chap.querySelector('#chapN').textContent=sc.chapter[0];
    chap.querySelector('#chapH').textContent=sc.chapter[1];
    chap.querySelector('#chapP').textContent=sc.chapter[2];
    chap.classList.add('on');
    at(sc.s-.6,()=>chap.classList.remove('on'));
  } else {
    chap.classList.remove('on');
    scr.innerHTML=sc.html(); scr.classList.add('on');
    (sc.cues||[]).forEach(([s,kind,a,b])=>at(s,()=>{
      if(kind==='say') say(a);
      else if(kind==='go') scr.querySelector('.pg,.invite')?.classList.add('go');
      else if(kind==='at') point(a,false);
      else if(kind==='click') point(a,true);
      else if(kind==='type') type(a,b,Math.min(4.5,b.length/26));
      else if(kind==='add') scr.querySelector(a)?.classList.add(b);
    }));
  }
  at(sc.s, ()=>{ if(i<SCENES.length-1) play(i+1); else { playing=false; document.getElementById('play').textContent='Replay'; } });
}

/* the clock */
setInterval(()=>{
  if(!playing) return;
  const before=SCENES.slice(0,i).reduce((n,s)=>n+s.s,0);
  const now=Math.min(TOTAL, before+(performance.now()-t0)/1000);
  prog.style.width=(now/TOTAL*100)+'%';
  clock.textContent=Math.floor(now/60)+':'+String(Math.floor(now%60)).padStart(2,'0')+
    ' / '+Math.floor(TOTAL/60)+':'+String(TOTAL%60).padStart(2,'0');
},200);

document.getElementById('play').onclick=function(){
  if(!playing && i>=SCENES.length-1){ playing=true; this.textContent='Pause'; play(0); return; }
  playing=!playing; this.textContent=playing?'Pause':'Play';
  if(!playing) clear(); else play(i);
};
document.getElementById('again').onclick=()=>{ playing=true; document.getElementById('play').textContent='Pause'; play(i); };

fit(); play(0);
</script>
</body>
