<!DOCTYPE html>
<!--
  Connect Lite — the film. One page, and 26 photographs of the real thing.
  © 2026 Ramy Sakr. All rights reserved.

  WHY IT IS BUILT THIS WAY. Three attempts got here.

  The first drove the live screens in an iframe. Honest, and fragile: it needed
  three live courses, a store, a network and a browser that had not throttled
  its own timers — and a take could WRITE, which it did, marking six criteria
  onto a real candidate's assignment.

  The second was an artifact export: eighteen scenes compiled into 1.4MB of
  React that could be watched and never edited.

  The third drew mock screens in HTML. Ramy, 27 Sep 2026: "I want a video that
  actually shows what Connect Lite looks like, not a made up one that looks
  nothing like what we built." Quite right — a drawing that merely resembles
  the product is no good for selling it.

  So: every frame is a PHOTOGRAPH of the live site, taken once by capture.mjs
  at 1280x800 and at twice that in pixels. The film needs no store, no network
  and no live course, and it cannot write to anything, because there is
  nothing live in it. When a screen changes, run capture.mjs again — the file
  names do not change, so nothing here needs touching.

  HOW IT IS PUT TOGETHER
    SCENES   the film in order. A scene is its seconds, one or more `shots`,
             and its cues.
    cue      [seconds in, what happens]:
               ['say', text]   a caption floats in and drifts away
               ['shot', n]     cut to the n-th shot of this scene
               ['on']          start the slow push on the picture
    A chapter scene is { s, chapter:[number, who, line] } and draws no shot.

  TO CHANGE IT
    A caption      edit its ['say', …] line.
    A scene length edit `s`.
    A screen       re-run capture.mjs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Lite — the film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700;1,400&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --sand:#FBFAF7; --ink:#2C2418; --grey:#6B6157; --teal:#1E6B63; --gold:#C9B189; }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:#161310; color:#E8E2D6; font-family:Karla,system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:16px; padding:24px 16px 36px; min-height:100vh}

  /* ---- the stage: 1280x800, the size the screens were photographed at --- */
  .wrap{position:relative}
  .stage{position:relative; width:1280px; height:800px; background:var(--sand);
    border-radius:12px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.55);
    transform-origin:top left}

  /* Two layers, so one picture dissolves into the next instead of blinking. */
  .shot{position:absolute; inset:0; opacity:0; transition:opacity .5s ease}
  .shot.on{opacity:1}
  .shot img{width:100%; height:100%; object-fit:cover; object-position:top center; display:block;
    transform:scale(1); transition:transform 9s linear}
  /* A slow push, so a still photograph is not a dead one. Never more than 3%:
     these are screens, and a screen that drifts reads as a mistake. */
  .shot.push img{transform:scale(1.03)}

  /* ---- the words. Never a subtitle bar: every screen under them is cream -- */
  .cap{position:absolute; left:50%; bottom:15%; width:max-content; max-width:52ch;
    padding:0 24px; text-align:center; pointer-events:none; z-index:7;
    font-family:Newsreader,Georgia,serif; font-weight:600; font-size:1.9rem; line-height:1.3;
    color:#fff; opacity:0; transform:translate(-50%,0); transition:opacity .7s ease;
    text-shadow:0 0 5px rgba(24,18,12,.96),0 0 13px rgba(24,18,12,.94),
      0 0 30px rgba(24,18,12,.85),0 2px 4px rgba(24,18,12,.9)}
  .cap.on{opacity:.86; animation:drift 12s linear forwards}
  .cap.out{opacity:0; transition:opacity 1.4s ease}
  @keyframes drift{from{transform:translate(-50%,10px)} to{transform:translate(calc(-50% + 28px),-42px)}}

  .chap{position:absolute; inset:0; z-index:9; background:var(--sand);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    opacity:0; pointer-events:none; transition:opacity .55s ease}
  .chap.on{opacity:1}
  .chap .n{font-size:.82rem; letter-spacing:.22em; text-transform:uppercase; color:var(--grey)}
  .chap h2{font-family:Newsreader,Georgia,serif; font-weight:700; font-size:4rem; color:var(--teal); line-height:1.05}
  .chap .rule{width:92px; height:3px; border-radius:2px; background:var(--gold)}
  .chap p{max-width:44ch; text-align:center; color:var(--ink); font-size:1.12rem; line-height:1.6}

  /* ---- the transport, which is not part of the film -------------------- */
  .bar{display:flex; align-items:center; gap:14px; color:#9A9184; font-size:13px}
  .bar button{font:700 13px Karla,sans-serif; color:#EFE9DD; background:#2A241D;
    border:1px solid #3D362C; border-radius:999px; padding:8px 16px; cursor:pointer}
  .bar button:hover{background:#352E25}
  .track{flex:1; height:5px; background:#2A241D; border-radius:3px; overflow:hidden}
  .track i{display:block; height:100%; width:0; background:var(--gold)}
  .list{display:flex; flex-wrap:wrap; gap:6px; justify-content:center}
  .list b{font:600 11.5px Karla,sans-serif; padding:5px 10px; border-radius:999px;
    background:#241F19; color:#8C8377; cursor:pointer}
  .list b.now{background:var(--teal); color:#fff}
  .foot{color:#6E665B; font-size:12px; text-align:center}
</style>
</head>
<body>

<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <div class="shot" id="a"><img alt=""></div>
    <div class="shot" id="b"><img alt=""></div>
    <div class="cap" id="cap"></div>
    <div class="chap" id="chap"><div class="n" id="chapN"></div><h2 id="chapH"></h2><div class="rule"></div><p id="chapP"></p></div>
  </div>
</div>

<div class="bar" id="bar">
  <button id="play">Pause</button>
  <button id="again">Replay scene</button>
  <div class="track"><i id="prog"></i></div>
  <span id="clock">0:00</span>
</div>
<div class="list" id="list"></div>
<div class="foot">Connect <b style="font-style:normal">LITE</b> — designed and built by Ramy Sakr</div>

<script>
/* ======================================================================
   THE FILM. Every `shot` is a file in shots/, photographed from the live
   site by capture.mjs. Nothing here is drawn.
   ====================================================================== */
const SCENES = [

/* ------------------------------------------------- the opening ------- */
{ t:'A course is one link', s:26, shots:['01-owner','02-invite-tutor'], cues:[
  [0.5,'on'],
  [1.0,'say','No download. No upload. No paper.'],
  [8.0,'say','The link is the account.'],
  [13,'shot',1],[13.3,'on'],
  [15,'say','It lives where your course already lives.'],
  [21,'say','And it opens when the internet doesn’t.'],
]},

/* ------------------------------------ chapter one · the trainer ------ */
{ t:'The trainer', s:4.5, chapter:['Chapter one','The trainer','Sets the course up in one screen, and hands out the links.'] },

{ t:'Setting the course up', s:16, shots:['03-admin','04-roster'], cues:[
  [0.4,'on'],
  [1.2,'say','No accounts. No passwords.'],
  [8,'shot',1],[8.3,'on'],
]},

{ t:'The centre’s own assignments', s:15, shots:['06-wording','07-wording-open'], cues:[
  [0.4,'on'],
  [1.0,'say','The four assignments come with it.'],
  [7,'shot',1],[7.3,'on'],
  [9,'say','Ready as they are — or yours to rewrite.'],
]},

{ t:'Three links', s:10, shots:['05-links'], cues:[
  [0.4,'on'],
  [1.2,'say','Everyone gets their own link.'],
]},

/* ------------------------------------ chapter two · the trainee ------ */
{ t:'The trainee', s:4.5, chapter:['Chapter two','The trainee','One link. Everything they write, and everything they are given, behind it.'] },

{ t:'Their card, then home', s:15, shots:['08-invite-trainee','09-home'], cues:[
  [0.4,'on'],
  [1.0,'say','The same card, in their words.'],
  [8,'shot',1],[8.3,'on'],
]},

{ t:'The plan', s:19, shots:['10-plan','11-plan-stages'], cues:[
  [0.4,'on'],
  [1.2,'say','Written by talking, if you like.'],
  [9,'shot',1],[9.3,'on'],
  [11,'say','A shape names the stages. The aims are yours.'],
]},

{ t:'The language analysis', s:10, shots:['12-analysis'], cues:[
  [0.4,'on'],
  [1.2,'say','The analysis is the same document.'],
]},

{ t:'The self-evaluation', s:10, shots:['13-selfeval'], cues:[
  [0.4,'on'],
  [1.2,'say','Written before they read their tutor.'],
]},

{ t:'The trainer’s desk', s:9, shots:['14-desk'], cues:[
  [0.4,'on'],[1.2,'say','Nothing to hunt for.'],
]},

{ t:'Feedback', s:20, shots:['15-feedback','16-feedback-2'], cues:[
  [0.4,'on'],
  [1.2,'say','It offers the criteria the point meets.'],
  [10,'shot',1],[10.3,'on'],
  [12,'say','Or talk it through elsewhere, and paste it back.'],
]},

{ t:'The trainee reads it', s:9, shots:['17-returned'], cues:[
  [0.4,'on'],[1.2,'say','Read-only. Not a word can be touched.'],
]},

{ t:'The written assignments', s:24, shots:['18-assign','19-assign-resub','20-marking'], cues:[
  [0.4,'on'],
  [1.0,'say','Four assignments, with the centre’s criteria.'],
  [8,'shot',1],[8.3,'on'],
  [10,'say','The resubmission opens where it failed.'],
  [16,'shot',2],[16.3,'on'],
  [18,'say','The outcome comes from the marks.'],
]},

/* ---------------------------------- chapter three · the assessor ----- */
{ t:'The assessor', s:4.5, chapter:['Chapter three','The assessor','One read-only link, and the pack is already assembled.'] },

{ t:'Their link', s:9, shots:['21-invite-assessor'], cues:[
  [0.4,'on'],[1.2,'say','Read-only, and it expires.'],
]},

{ t:'The assessor pack', s:18, shots:['22-pack','23-pack-2'], cues:[
  [0.4,'on'],
  [1.2,'say','Assembled, not collected.'],
  [9,'shot',1],[9.3,'on'],
]},

{ t:'Grades', s:11, shots:['24-grades'], cues:[
  [0.4,'on'],[1.2,'say','Into Appian by paste, not retyping.'],
]},

{ t:'The final report', s:11, shots:['25-final'], cues:[
  [0.4,'on'],[1.2,'say','Assembled from the record.'],
]},

{ t:'The card, and the end', s:13, shots:['26-offer'], cues:[
  [0.4,'on'],[1.4,'say','A course is three links.'],
]},
];

/* ======================================================================
   THE PLAYER
   ====================================================================== */
const stage=document.getElementById('stage'), wrap=document.getElementById('wrap'),
  A=document.getElementById('a'), B=document.getElementById('b'),
  cap=document.getElementById('cap'), chap=document.getElementById('chap'),
  prog=document.getElementById('prog'), clock=document.getElementById('clock'),
  listEl=document.getElementById('list');

const TOTAL=SCENES.reduce((n,s)=>n+s.s,0);
let i=0, t0=0, timers=[], playing=true, front=A, back=B;

/* Scale the stage to the window without touching what is inside it: the
   photographs are 1280x800 and are never re-laid-out. */
function fit(){
  const k=Math.max(.25, Math.min((document.documentElement.clientWidth-32)/1280, 1));
  stage.style.transform=`scale(${k})`;
  wrap.style.width=(1280*k)+'px'; wrap.style.height=(800*k)+'px';
  document.getElementById('bar').style.width=(1280*k)+'px';
  listEl.style.width=(1280*k)+'px';
}
addEventListener('resize',fit); addEventListener('load',fit);

SCENES.forEach((s,n)=>{
  const b=document.createElement('b'); b.textContent=(n+1)+' '+s.t;
  b.onclick=()=>{ playing=true; document.getElementById('play').textContent='Pause'; play(n); };
  listEl.appendChild(b);
});
const chips=[...listEl.children];

/* Every picture in memory before the film starts, so a cut never waits. */
const seen=new Set();
SCENES.forEach(s=>(s.shots||[]).forEach(n=>{ if(seen.has(n))return; seen.add(n);
  const im=new Image(); im.src='shots/'+n+'.png'; }));

function clear(){ timers.forEach(clearTimeout); timers=[]; }
function at(sec,fn){ timers.push(setTimeout(fn,sec*1000)); }

function say(text){
  cap.classList.remove('on','out'); void cap.offsetWidth;
  cap.textContent=text; cap.classList.add('on');
  at(Math.max(3.6, text.length/9), ()=>cap.classList.add('out'));
}
/* Cross-fade to the next photograph on whichever layer is not showing. */
function show(name){
  const img=back.querySelector('img');
  back.classList.remove('push');
  img.src='shots/'+name+'.png';
  back.classList.add('on'); front.classList.remove('on');
  const was=front; front=back; back=was;
}
function push(){ front.classList.add('push'); }

function play(n){
  clear(); i=n; t0=performance.now();
  chips.forEach((c,k)=>c.classList.toggle('now',k===n));
  cap.classList.remove('on','out');
  const sc=SCENES[n];

  if(sc.chapter){
    chap.querySelector('#chapN').textContent=sc.chapter[0];
    chap.querySelector('#chapH').textContent=sc.chapter[1];
    chap.querySelector('#chapP').textContent=sc.chapter[2];
    chap.classList.add('on');
    at(sc.s-.7,()=>chap.classList.remove('on'));
  } else {
    chap.classList.remove('on');
    show(sc.shots[0]);
    (sc.cues||[]).forEach(([sec,kind,arg])=>at(sec,()=>{
      if(kind==='say') say(arg);
      else if(kind==='shot') show(sc.shots[arg]);
      else if(kind==='on') push();
    }));
  }
  at(sc.s,()=>{ if(!playing) return;
    if(i<SCENES.length-1) play(i+1);
    else { playing=false; document.getElementById('play').textContent='Replay'; } });
}

setInterval(()=>{
  if(!playing) return;
  const before=SCENES.slice(0,i).reduce((n,s)=>n+s.s,0);
  const now=Math.min(TOTAL, before+(performance.now()-t0)/1000);
  prog.style.width=(now/TOTAL*100)+'%';
  const mm=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
  clock.textContent=mm(now)+' / '+mm(TOTAL);
},200);

document.getElementById('play').onclick=function(){
  if(!playing && i>=SCENES.length-1){ playing=true; this.textContent='Pause'; play(0); return; }
  playing=!playing; this.textContent=playing?'Pause':'Play';
  if(!playing) clear(); else play(i);
};
document.getElementById('again').onclick=()=>{ playing=true; document.getElementById('play').textContent='Pause'; play(i); };

fit(); play(0);
</script>
</body>
</html>
