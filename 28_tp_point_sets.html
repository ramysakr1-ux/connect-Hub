<!DOCTYPE html>
<!--
  Connect Lite — teaching practice point sets
  © 2026 Ramy Sakr. All rights reserved.

  A SET is what a coursebook gives a course: twelve sessions — TP 1 to 6, each
  taught twice because a group of six splits into two teaching sets on
  alternate days — and three slots in each, because three trainees teach a
  45-minute slot each within a session.

  Ramy, 4 Oct 2026, on what a trainee needs: "enough information about their
  aims, the page numbers, the procedure, what they're doing and how to do it,
  and obviously timing as well, especially the first two TPs." So a slot here
  carries the aim as an outcome, the pages as fields, the tracks, and the
  procedure as STAGES — each stage with its minutes, its interaction, what to
  do and what to watch out for. The minutes add up on screen against the
  slot's length, because a first-TP plan that runs to fifty minutes in a
  forty-five minute slot is the commonest way a first lesson goes wrong.

  Scaffolding steps down by session, set by whoever writes the set rather than
  inferred from the practice number: a level change mid-course wants a scripted
  session after a sparse one, and only the person writing it knows that.

  The set does not teach anybody. It is applied to the rotation on the TP
  points screen, which deals the trainees into the slots; the set decides
  WHAT each slot is, the rotation decides WHO takes it.
-->

<script type="text/x-hub-app">
const MODE = window.HubMode;
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose — this is one of the course’s own pages.');
const IS_TUTOR = MODE === 'tutor';
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const KEY = 'connect_tp_points_v1';
const SETTINGS = rec('connect_course_settings') || {};
const TOTAL = parseInt(SETTINGS.tpCount, 10) || 8;
const TPS = Math.max(1, TOTAL - 2);        // the last two are the trainees' own

/* The seven types the rotation deals in, and the only ones the CELTA 5 can
   record. A slot names one of them so the grid, the tracker and the record
   all keep speaking the same language; the aim underneath is the sentence. */
const TYPES = (window.hubRotation && window.hubRotation.AIMS) ||
  ['Grammar','Vocabulary','Functional language','Reading','Listening','Speaking','Writing'];

/* The shapes the trainee's own plan offers. Naming them here means a slot
   can say "receptive skills" and the plan can fill those stages in one press
   rather than the trainee guessing which shape the tutor had in mind. */
/* These are the six the plan offers, word for word. A shape the set can name
   but the plan cannot fill would hand the trainee a lesson shape and then
   refuse to give them its stages, so the two lists are the same list. */
const SHAPES = ['Present – Practice – Produce (PPP)','Test – Teach – Test',
  'Text-Based Presentation of Language','Language Practice (follows a previous lesson)',
  'Receptive Skills (reading or listening)','Productive Skills (speaking or writing)'];

/* The trainee's own plan writes interaction as these codes, so the set uses
   them too — one vocabulary across the two screens means a stage can carry its
   pattern straight into the plan. */
const INTERACTIONS = ['','T–S','S–T','S–S','PW','GW','Ind.','OC','Ming.'];
const INT_LABEL = { 'T–S':'Teacher to students', 'S–T':'Students to teacher', 'S–S':'Student to student',
  'PW':'Pair work', 'GW':'Group work', 'Ind.':'Individual', 'OC':'Open class', 'Ming.':'Mingle' };

/* How much a session hands over. Ramy, 4 Oct 2026: scripted for the first
   practices, then stages and timings only, then the aim and the materials and
   they build it. Set per session, not per practice number. */
const SCAFFOLD = {
  full:   { name: 'Fully written — every stage, what to do, timings',
            blurb: 'For a trainee who has never taught: the stages are written out and timed.' },
  guided: { name: 'Stages and timings — they write the instructions',
            blurb: 'The shape and the clock are given; what happens in each stage is theirs.' },
  bare:   { name: 'Aims and materials only — they build the lesson',
            blurb: 'No stages. They choose the shape and plan it themselves.' },
};

/* A COURSE HOLDS SEVERAL SETS. Ramy, 4 Oct 2026: "we will definitely need at
   least four sets in case it's a course of 24." A set belongs to a tutor and
   their book — the trainees move between levels, the set stays put — so a
   course of twenty-four running four groups writes four of them and says which
   group teaches from which. */
let UPLOADING = '';    // "sessionId|slot" while a scan is going up
let LIB = {};          // id -> set
/* putMaterial needs a token to resolve the course; the tutor key rides along
   automatically (hub-store adds it), which is what buys the larger upload cap
   since store v71. Any trainee's token will do -- the file lands in the
   COURSE's materials folder, not theirs. */
function anyToken(){
  const roster = rec('connect_roster_v1') || {};
  const who = Object.values(roster.trainees || {}).filter(Boolean)[0];
  return who ? (who.id || who.token) : '';
}
let FOR = {};          // group -> set id
let CUR = '';          // the set being edited
let S = null;          // shorthand for LIB[CUR]
let OPEN = null;       // which session is open, e.g. "1A"
let note = '';

function groupNames(){
  const roster = rec('connect_roster_v1') || {};
  const out = [];
  Object.values(roster.trainees || {}).filter(Boolean).forEach(t => {
    const g = String(t.group || '');
    if (g && out.indexOf(g) < 0) out.push(g);
  });
  return out.sort();
}
const newId = () => { let n = 1; while (LIB['s' + n]) n++; return 's' + n; };
/* Has anything been written into it? An empty set can be removed; one with
   lessons in it cannot, because nothing here should be able to throw work
   away by accident. */
const written = s => !!(s && Object.keys(s.sessions || {}).some(id =>
  (s.sessions[id].slots || []).some(sl => sl && (sl.type || sl.aim || (sl.stages || []).length))));

/* The twelve (or 2 x TPS) sessions, in the order they are taught: TP 1 on the
   first set's day, TP 1 on the second set's day, then TP 2, and so on. The
   letters are the teaching sets' own, read off the roster, so a course of
   five reads "ABC" and "DE" rather than a hopeful "DEF". */
function setNames(){
  const roster = rec('connect_roster_v1') || {};
  const people = Object.values(roster.trainees || {}).filter(Boolean);
  const by = {};
  people.forEach(t => { const g = String(t.group || ''); (by[g] = by[g] || []).push({ token: t.id || t.token, name: t.name }); });
  const first = Object.keys(by).sort()[0];
  if (!first || !window.hubRotation) return ['A', 'B'];
  return window.hubRotation.rotate(by[first], { tps: TPS }).setNames;
}
function sessionIds(){
  const out = [];
  for (let tp = 1; tp <= TPS; tp++) { out.push(tp + 'A'); out.push(tp + 'B'); }
  return out;
}
const blankStage = () => ({ name: '', minutes: '', interaction: '', todo: '', avoid: '' });
const blankSlot = () => ({ type: '', aim: '', sub: '', shape: '', pages: '', page: '', tracks: '', stages: [] });
function blankSet(){
  const sessions = {};
  sessionIds().forEach(id => { sessions[id] = { scaffold: parseInt(id, 10) <= 2 ? 'full' : parseInt(id, 10) <= 4 ? 'guided' : 'bare', slots: [blankSlot(), blankSlot(), blankSlot()] }; });
  return { book: '', level: '', minutes: 45, sessions: sessions };
}
/* ---------------- the library ----------------
   catalogue.json is the facts only, about a kilobyte, so opening the chooser
   costs nothing. The set itself is lifted out of the master file at the moment
   someone takes one, because that file is 400 KB and climbing and no tutor
   should download it to browse.

   A taken set is a COPY. It lands under a fresh local id and the course owns it
   from then on: editing it here does not touch the library, and the library
   being updated does not reach a course that already took it. That is on
   purpose -- a centre's set is theirs to change. */
const LIB_CATALOGUE = 'library/catalogue.json';
const LIB_MASTER = 'library/tp-point-sets.json';
let CAT = null, SHOWLIB = false, LVL = '', LIBNOTE = '', TAKING = '';
let SHOWOFFER = false, OFFERBY = '', SENDING = false;

/* OFFERING A SET TO THE TP POINTS LIBRARY. Ramy, 5 Oct 2026: it is open to everyone,
   contributed to or not, and contributing buys a credit line -- "Contributed
   by ...", the centre's name or the trainer's own, whichever they choose.

   There is no upload and no account. The centre downloads its own set as a
   file and sends it; Connect reads it, runs the checks and puts it in. That
   keeps the one gate that matters -- the one on the way IN -- and needs
   nothing built on either side.

   WHAT TRAVELS IS THE WRITING. The same strip the published library goes
   through: the aims, shapes, stages, timings, watch notes, page numbers and
   track numbers, and not one link. Their scans and recordings stay on their
   course, where a tutor copying from a book they own is the ordinary thing.
   The set's own name goes too -- it is usually a group and a tutor, which is
   their course's business and means nothing to anyone else. */
function offerFile(){
  const out = { book: S.book || '', level: S.level || '', minutes: S.minutes || 45,
                sources: S.sources || '', by: OFFERBY.trim(), sessions: {} };
  let pages = 0, tracks = 0, days = 0;
  Object.keys(S.sessions || {}).forEach(k => {
    const ses = S.sessions[k];
    if (ses.dayPdf) days++;
    out.sessions[k] = {
      context: ses.context || '', scaffold: ses.scaffold || 'bare',
      slots: (ses.slots || []).map(sl => {
        const files = (sl.files || []).filter(f => f && f.page);
        pages += files.length;
        const lines = String(sl.tracks || '').split('\n').map(l => l.split('|')[0].trim()).filter(Boolean);
        tracks += lines.length;
        return { type: sl.type || '', aim: sl.aim || '', sub: sl.sub || '',
                 shape: sl.shape || '', pages: sl.pages || '', page: sl.page || '',
                 tracks: lines.join('\n'),
                 files: files.map(f => ({ name: f.name || '', src: f.src || '', page: f.page })),
                 stages: (sl.stages || []).map(st => ({ name: st.name || '', minutes: st.minutes || 0,
                   interaction: st.interaction || '', todo: st.todo || '', avoid: st.avoid || '' })) };
      })
    };
  });
  out.covers = { pages: pages, tracks: tracks, days: days };
  return out;
}

/* ONE CLICK, NOT TWO. Ramy, 5 Oct 2026: "people are lazy. Can we just click
   contribute, and it goes somewhere in the library where no one else can see
   it, and then I'll get a notification." So it posts (store v72): the set
   lands in a folder only Connect can open and Ramy is told it is there.
   The file is still written, but only when the post fails -- then there is
   something in their hands and an address to send it to, rather than a lost
   afternoon. */
async function contributeSet(){
  const out = offerFile();
  SENDING = true; render();
  try {
    await HubStore.call({ op: 'contribute', set: out, by: out.by,
      centre: (SETTINGS.centreName || '') + (SETTINGS.centreNumber ? ' (' + SETTINGS.centreNumber + ')' : '') });
    SENDING = false; SHOWOFFER = false;
    note = 'Sent to Connect, credited to ' + out.by + '. We read every one and write back.';
  } catch (e) {
    SENDING = false;
    saveFile(out);
    note = 'That did not send — ' + ((e && e.message) || e) + '. The set is in your downloads instead; email it to lite@celtaconnect.com.';
  }
  render();
}

function saveFile(out){
  const slug = (out.book || 'tp-points').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' }));
  a.download = (slug || 'tp-points') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function openLibrary(){
  SHOWLIB = true; LIBNOTE = ''; render();
  if (CAT) return;
  try {
    const r = await fetch(LIB_CATALOGUE + '?v=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    CAT = await r.json();
  } catch (e) {
    CAT = [];
    LIBNOTE = 'The library did not load — ' + ((e && e.message) || e) + '. Try again, or start a set by hand.';
  }
  render();
}

async function takeFromLibrary(libId){
  const row = (CAT || []).find(x => x.id === libId);
  if (!row || TAKING) return;
  TAKING = libId; LIBNOTE = 'Fetching ' + row.book.split(',')[0] + '…'; render();
  try {
    const r = await fetch(LIB_MASTER + '?v=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const master = await r.json();
    const got = master[libId];
    if (!got) throw new Error('that set is not in the library file');
    const id = newId();
    /* `from` is the only trace kept: which library set this began as, and when.
       It is what tells a later version of this screen that an update exists. */
    LIB[id] = Object.assign(JSON.parse(JSON.stringify(got)),
      { from: libId, taken: new Date().toISOString().slice(0, 10) });
    CUR = id; S = LIB[id]; OPEN = null; SHOWLIB = false; TAKING = ''; LIBNOTE = '';
    persist(row.book.split(',')[0] + ' is on the course');
  } catch (e) {
    TAKING = ''; LIBNOTE = 'Could not take that set — ' + ((e && e.message) || e); render();
  }
}

function load(){
  const P = rec(KEY) || {};
  const holder = P.set || {};
  LIB = (holder.library && Object.keys(holder.library).length) ? holder.library
      : (holder.sessions ? { s1: holder } : {});
  FOR = holder.setFor || {};
  CUR = LIB[CUR] ? CUR : Object.keys(LIB)[0] || '';
  S = LIB[CUR] || null;
  Object.keys(LIB).forEach(id => {
    const s = LIB[id];
    sessionIds().forEach(x => {            // a course whose TP count grew
      if (!s.sessions[x]) s.sessions[x] = { scaffold: 'bare', slots: [blankSlot(), blankSlot(), blankSlot()] };
      while (s.sessions[x].slots.length < 3) s.sessions[x].slots.push(blankSlot());
    });
  });
}
function persist(word){
  const P = rec(KEY) || {};
  if (S) S.updated = new Date().toISOString().slice(0, 10);
  /* Everything lives under `set`: the store rebuilds this record from named
     keys when it reads it, so a sibling field would never come back. */
  P.set = { library: LIB, setFor: FOR };
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {}
  note = word || 'Saved';
  render();
  setTimeout(() => { if (note === word) { note = ''; const el = $('status'); if (el) el.textContent = ''; } }, 2600);
}

const slotMinutes = sl => (sl.stages || []).reduce((n, st) => n + (parseInt(st.minutes, 10) || 0), 0);

  const written = (ses.slots || []).filter(sl => sl.type || sl.aim || (sl.stages || []).length).length;
  if (!written) return { word: 'not written', done: false };
  if (written < 3) return { word: written + ' of 3 slots', done: false };
  return { word: 'written', done: true };
}

/* ---------------- the course's own book ----------------
   PG holds one run: which book, the opened PDF, the folios being confirmed,
   and how far the attaching has got. It is deliberately not persisted -- a
   half-finished run should die with the page rather than come back confusing.

   `step` is which question is on screen. 'low' and 'high' are the folios at
   either end of what the set needs: one offset is not enough, because a
   publisher's file can leave pages out of the middle and then everything after
   them moves. 'break' is where that deeper run starts, and it is only reached
   when the two folios disagree. */
let PG = null;

function pagesPanel(){
  if (!S || !window.HubPages) return '';
  const need = window.HubPages.needs(S);
  const srcs = Object.keys(need).filter(k => need[k].want.length || need[k].have.length);
  if (!srcs.length) return '';
  const rows = srcs.map(src => {
    const n = need[src], name = window.HubPages.BOOKS[src] || src;
    const busy = PG && PG.src === src;
    const state = !n.want.length
      ? `all ${n.have.length} pages attached`
      : `<b>${n.want.length}</b> of ${n.want.length + n.have.length} pages still to attach`;
    return `<div class="pgbook">
      <span class="nm">${esc(name)}</span>
      <span class="st">${state}</span>
      ${n.want.length ? `<label class="btn quiet sm filebtn" for="pdf-${src}">${busy ? 'Choose a different PDF' : 'Point at your PDF'}</label>
        <input type="file" id="pdf-${src}" data-pdf="${src}" accept="application/pdf,.pdf" hidden>` : ''}
    </div>${busy ? calibrator() : ''}`;
  }).join('');
  return `<div class="pgwrap">
    <h2>The pages this set teaches from</h2>
    <p class="lede" style="margin:0 0 10px">Each lesson names the pages it teaches from, and the card carries them so a trainee can teach without the book in front of them. Point at your own copy and Lite cuts out the pages this set needs. The file stays on this computer; only the pages come out of it.</p>
    ${rows}</div>`;
}

/* An offset read as a sentence. A file missing pages runs DEEPER from there; a
   file with an insert bound in runs earlier. A signed number would hand the
   tutor the arithmetic this panel exists to do for them. */
function deeperBy(d){
  const n = Math.abs(d);
  return `${n} page${n === 1 ? '' : 's'} ${d > 0 ? 'deeper' : 'earlier'}`;
}

/* The PDF page the canvas is showing. A different sum in the break step: there
   the offsets are settled and it is the page the deeper run starts at that moves. */
function probePdf(){
  if (!PG) return 0;
  return PG.step === 'break' ? PG.from + PG.high.offset : PG.probe + PG.offset;
}

/* The lowest page the deeper run could start at. You cannot lose four pages
   between p. 145 and p. 147, so if this comes out above the high folio the two
   cannot both be right and one of them was read off the wrong page. */
function firstBreak(){
  return PG.low.page + Math.max(1, PG.low.offset - PG.high.offset + 1);
}

function calibrator(){
  if (!PG) return '';
  if (PG.error) return `<div class="pgcal"><p class="pgnote" style="margin:0">${esc(PG.error)}</p></div>`;
  if (PG.running) {
    const pct = Math.round((PG.at / PG.total) * 100);
    return `<div class="pgcal"><p class="q">Cutting out page ${PG.page} &mdash; ${PG.at} of ${PG.total}</p>
      <div class="pgbar"><i style="width:${pct}%"></i></div>
      <p class="hint" style="margin:7px 0 0">Leave this page open until it finishes.</p></div>`;
  }
  if (!PG.doc) return `<div class="pgcal"><p class="q">Opening the file&hellip;</p></div>`;
  if (PG.step === 'break') return breakPanel();
  const top = PG.pages[PG.pages.length - 1];
  const more = PG.step === 'low' && top !== PG.probe;             /* a highest folio still to come */
  const deep = PG.step === 'high' && PG.offset !== PG.low.offset; /* their answer, as it stands */
  return `<div class="pgcal">
    <p class="q">${PG.step === 'high' ? 'And is this page' : 'Is this page'} ${PG.probe} of the book?</p>
    <canvas id="pgcanvas"></canvas>
    <div class="pgnudge">
      <button type="button" id="pgback">&minus;</button>
      <span>PDF page <b>${probePdf()}</b> of ${PG.doc.numPages}</span>
      <button type="button" id="pgfwd">+</button>
      <button type="button" class="btn sm" id="pggo" style="margin-left:6px">${
        more ? `Yes &mdash; now check p. ${top}`
             : deep ? `Yes &mdash; p. ${PG.probe} sits ${deeperBy(PG.low.offset - PG.offset)}`
                    : `Yes &mdash; cut out all ${PG.pages.length} pages`}</button>
      <button type="button" class="btn quiet sm" id="pgstop">Cancel</button>
    </div>
    <p class="hint" style="margin:8px 0 0">${PG.step === 'high'
      ? `Nudge until this is the page the book calls ${PG.probe}. The highest page the set needs is checked as well as the lowest, because a publisher&rsquo;s file can leave pages out of the middle &mdash; and one offset taken on an early page would then cut the wrong page for the whole of the rest of the book.`
      : `Nudge until the page on screen is the one the book calls ${PG.probe}.`}</p>
  </div>`;
}

/* THE TWO FOLIOS DISAGREE, which means the file is missing pages between them
   and nothing on screen says where: a scanned book has no text layer to read a
   folio off, and the pages that go missing -- the Additional material at the
   back -- are the ones with no page number printed on them anyway.

   So name both pages and both offsets, and then the two honest ways on. Give
   the page the deeper run starts at and every page can be cut bar the ones the
   file simply has not got, which are named and left; or cut only the pages a
   folio proves and leave the span between them alone. Cutting that span on one
   offset is the thing this panel exists to prevent -- what comes out is a real
   page, with real text, from the wrong part of the book. */
function breakPanel(){
  const lo = PG.low, hi = PG.high, d = lo.offset - hi.offset;
  const said = `<p class="pgwarn">Those two pages do not agree. The book&rsquo;s p. ${lo.page} is PDF page ${lo.page + lo.offset}, but its p. ${hi.page} is PDF page ${hi.page + hi.offset} &mdash; <b>${deeperBy(d)}</b>. A publisher&rsquo;s file can leave pages out of the middle, and everything after them moves. Until we know where, a page between those two would come out a real page from the wrong part of the book.</p>`;
  if (firstBreak() > hi.page) return `<div class="pgcal">${said}
    <p class="hint" style="margin:0 0 11px">Those two cannot both be right, though &mdash; there is no room for ${deeperBy(d)} between p. ${lo.page} and p. ${hi.page}. One of the folios was read off the wrong page; the Additional material at the back of a book often carries no page number at all.</p>
    <div class="pgnudge">
      <button type="button" class="btn sm" id="pgagain">Start the folios again</button>
      <button type="button" class="btn quiet sm" id="pgstop">Cancel</button>
    </div></div>`;
  const m = window.HubPages.map(lo.offset, PG.from, hi.offset);
  const lost = PG.pages.filter(p => m.skips(p));
  const held = PG.pages.filter(p => p > lo.page && p < hi.page);
  return `<div class="pgcal">${said}
    <p class="q">From which page does your file run ${deeperBy(d)}?</p>
    <canvas id="pgcanvas"></canvas>
    <div class="pgnudge">
      <button type="button" id="pgback">&minus;</button>
      <input id="pgfrom" type="number" min="${firstBreak()}" max="${hi.page}" value="${PG.from}">
      <button type="button" id="pgfwd">+</button>
      <span>&mdash; is PDF page <b>${probePdf()}</b> the one the book calls ${PG.from}?</span>
    </div>
    <p class="hint" style="margin:8px 0 0">Nudge down until the page on screen stops being the one named, then back up one: the lowest page that still matches is where the gap ends.${
      m.absent.length ? ` Your file would then be missing pp. ${m.absent[0]}&ndash;${m.absent[m.absent.length - 1]}.` : ''}</p>
    <div class="pgnudge" style="margin:11px 0 0">
      <button type="button" class="btn sm" id="pggo">Cut the ${PG.pages.length - lost.length} pages it has</button>
      ${held.length ? `<button type="button" class="btn quiet sm" id="pgsafe">Only the ${PG.pages.length - held.length} pages a folio proves</button>` : ''}
      <button type="button" class="btn quiet sm" id="pgstop">Cancel</button>
    </div>
    ${lost.length ? `<p class="pgnote" style="margin:11px 0 0">This set wants p${lost.length > 1 ? 'p' : ''}. ${lost.join(', ')}, which your file has not got at all, so ${lost.length > 1 ? 'they are' : 'it is'} left for you to attach by hand from a paper copy.</p>` : ''}
    ${held.length ? `<p class="hint" style="margin:7px 0 0">The quiet button leaves the ${held.length} page${held.length === 1 ? '' : 's'} between p. ${lo.page} and p. ${hi.page} alone rather than guess which side of the gap ${held.length === 1 ? 'it falls' : 'they fall'}.</p>` : ''}
  </div>`;
}

async function drawProbe(){
  if (!PG || !PG.doc || PG.running) return;
  const cv = $('pgcanvas'); if (!cv) return;
  const n = probePdf();
  if (n < 1 || n > PG.doc.numPages) { const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); return; }
  try {
    const out = await window.HubPages.renderPage(PG.doc, n, 54);
    cv.width = out.width; cv.height = out.height;
    cv.getContext('2d').drawImage(out, 0, 0);
  } catch (e) { /* a page that will not draw is not worth an alarm; the nudge still works */ }
}

async function startPdf(src, file){
  PG = { src: src, file: file, doc: null, step: 'low', probe: 0, offset: 0,
    low: null, high: null, from: 0, pages: [], running: false, at: 0, total: 0, error: '' };
  render();
  try {
    const doc = await window.HubPages.open(file);
    const need = window.HubPages.needs(S)[src];
    PG.doc = doc;
    PG.pages = need.want;
    /* Calibrate on the lowest page the set actually wants, so what they are
       looking at is a page this course teaches rather than a cover. The highest
       page the set needs is the next question. */
    PG.probe = need.want[0];
    PG.offset = 0;
    render(); drawProbe();
  } catch (e) {
    PG.error = (e && e.message) || 'that file could not be opened';
    render();
  }
}

/* One "Yes" per folio. A whole file costs one extra press and no thought: the
   offset carries over to the high page, so the page on screen is already the
   right one and they only say so. */
function confirmProbe(){
  if (!PG || !PG.doc) return;
  if (PG.step === 'low') {
    PG.low = { page: PG.probe, offset: PG.offset };
    const top = PG.pages[PG.pages.length - 1];
    if (top === PG.probe) return runPdf(window.HubPages.map(PG.offset));
    PG.step = 'high'; PG.probe = top;
    render(); drawProbe(); return;
  }
  if (PG.step === 'high') {
    PG.high = { page: PG.probe, offset: PG.offset };
    if (PG.high.offset === PG.low.offset) return runPdf(window.HubPages.map(PG.low.offset));
    PG.step = 'break'; PG.from = PG.high.page;   /* the one page we know is deep */
    render(); drawProbe(); return;
  }
  runPdf(window.HubPages.map(PG.low.offset, PG.from, PG.high.offset));
}

async function runPdf(m, pages){
  if (!PG || !PG.doc) return;
  const list = pages || PG.pages;
  const tok = anyToken();
  if (!tok) { PG.error = 'No trainee on the roster yet, so there is nowhere to put the pages. Add the cohort first.'; render(); return; }
  PG.running = true; PG.at = 0; PG.total = list.length; render();
  try {
    const out = await window.HubPages.attach({
      doc: PG.doc, src: PG.src, pages: list, map: m, token: tok,
      label: (S.book || S.name || 'Coursebook').split(',')[0].trim(),
      onStep: st => { PG.at = st.i + (st.done ? 0 : 1); PG.page = st.page; render(); },
    });
    const n = window.HubPages.fill(S, PG.src, out.made);
    /* Say what was left as well as what landed. A page the file has not got is
       still the tutor's to attach, and a bare count would hide it. */
    const left = out.skipped.length
      ? ` — p${out.skipped.length > 1 ? 'p' : ''}. ${out.skipped.join(', ')} ${out.skipped.length > 1 ? 'are' : 'is'} not in that file`
      : (list.length < PG.pages.length ? ` — ${PG.pages.length - list.length} left until the gap is known` : '');
    PG = null;
    persist(n + ' pages attached' + left);
  } catch (e) {
    PG.running = false;
    PG.error = (e && e.message) || 'the pages could not be attached';
    render();
  }
}

function wirePages(){
  document.querySelectorAll('[data-pdf]').forEach(el => el.onchange = e => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (file) startPdf(el.getAttribute('data-pdf'), file);
  });
  const b = $('pgback'), f = $('pgfwd'), g = $('pggo'), x = $('pgstop'),
    sf = $('pgsafe'), fr = $('pgfrom'), ag = $('pgagain');
  /* In the folio steps the nudge moves the offset; on the break it moves the
     page the deeper run starts at. The same two buttons either way, because it
     is the same act: move it until the page on screen is the one named. */
  const nudge = d => {
    if (PG.step === 'break') PG.from = Math.max(firstBreak(), Math.min(PG.high.page, PG.from + d));
    else PG.offset += d;
    render(); drawProbe();
  };
  if (b) b.onclick = () => nudge(-1);
  if (f) f.onclick = () => nudge(1);
  if (fr) fr.onchange = () => {
    PG.from = Math.max(firstBreak(), Math.min(PG.high.page, parseInt(fr.value, 10) || PG.from));
    render(); drawProbe();
  };
  if (g) g.onclick = confirmProbe;
  /* Refuse the span rather than guess it: only the pages a folio proves. */
  if (sf) sf.onclick = () => runPdf(
    window.HubPages.map(PG.low.offset, PG.high.page, PG.high.offset),
    PG.pages.filter(p => p <= PG.low.page || p >= PG.high.page));
  if (ag) ag.onclick = () => {
    PG.step = 'low'; PG.probe = PG.pages[0]; PG.offset = 0; PG.low = null; PG.high = null;
    render(); drawProbe();
  };
  if (x) x.onclick = () => { PG = null; render(); };
  if ($('pgcanvas')) drawProbe();
}

function wireLibrary(){
  const open = $('addlib');   if (open)  open.onclick  = openLibrary;
  const shut = $('libclose'); if (shut)  shut.onclick  = () => { SHOWLIB = false; LIBNOTE = ''; render(); };

function wire(){
  if (!document.getElementById('shapes')) {
    const dl = document.createElement('datalist'); dl.id = 'shapes';
    dl.innerHTML = SHAPES.map(s => `<option value="${esc(s)}">`).join('');
    document.body.appendChild(dl);
  }
  document.querySelectorAll('[data-set]').forEach(el => el.onclick = () => {
    CUR = el.dataset.set; S = LIB[CUR]; OPEN = null; render();
  });
  const add = $('addset');
  if (add) add.onclick = () => { const id = newId(); LIB[id] = blankSet(); CUR = id; S = LIB[id]; OPEN = null; persist('Another set started'); };
  wireLibrary();
  wirePages();
  const off = $('offer');
  if (off) off.onclick = () => {
    SHOWOFFER = true; SHOWLIB = false;
    /* their centre's name is the likeliest credit, and it is already on the
       course -- but it is a field, not a decision made for them */
    if (!OFFERBY) OFFERBY = SETTINGS.centreName || '';
    render();
    const f = $('offerby'); if (f) f.focus();
  };
  const offBy = $('offerby');
  if (offBy) offBy.oninput = () => {
    OFFERBY = offBy.value;
    const go = $('offerdl'); if (go) go.disabled = !OFFERBY.trim();
  };
  const offGo = $('offerdl');
  if (offGo) offGo.onclick = () => contributeSet();
  const offX = $('offerclose');
  if (offX) offX.onclick = () => { SHOWOFFER = false; render(); };
  const drop = $('dropset');
  if (drop) drop.onclick = () => {
    if (!confirm('Remove this set? It has nothing written in it.')) return;
    delete LIB[CUR];
    Object.keys(FOR).forEach(g => { if (FOR[g] === CUR) delete FOR[g]; });
    CUR = Object.keys(LIB)[0] || ''; S = LIB[CUR] || null; OPEN = null;
    persist('Set removed');
  };
  const nm = $('setname');
  if (nm) nm.onchange = () => { S.name = nm.value.trim(); persist('Saved'); };
  document.querySelectorAll('[data-group]').forEach(el => el.onchange = () => {
    const g = el.dataset.group;
    if (el.checked) FOR[g] = CUR; else if (FOR[g] === CUR) delete FOR[g];
    persist(el.checked ? `Group ${g} teaches from this set` : `Group ${g} no longer uses this set`);
  });
  const b = $('book'), l = $('level'), m = $('mins'), u = $('url');
  if (b) b.onchange = () => { S.book = b.value.trim(); persist('Saved'); };
  if (l) l.onchange = () => { S.level = l.value.trim(); persist('Saved'); };
  if (u) u.onchange = () => { S.url = u.value.trim(); persist('Saved'); };
  const au = $('audiourl');
  if (au) au.onchange = () => { S.audioUrl = au.value.trim(); persist('Saved'); };
  const src = $('sources');
  if (src) src.onchange = () => { S.sources = src.value.trim(); persist('Saved'); };
  if (m) m.onchange = () => { S.minutes = parseInt(m.value, 10) || 45; persist('Saved'); };

  document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => {
    OPEN = OPEN === el.dataset.open ? null : el.dataset.open; render();
  });
  document.querySelectorAll('[data-ctx]').forEach(el => el.onchange = () => {
    S.sessions[el.dataset.ctx].context = el.value.trim(); persist('Saved');
  });
  document.querySelectorAll('[data-scaf]').forEach(el => el.onchange = () => {
    S.sessions[el.dataset.scaf].scaffold = el.value; persist('Scaffolding changed');
  });
  /* Typing saves on change, not on every key: the record syncs to the store
     and a keystroke-per-write would push a 40 KB record on every letter. */
  document.querySelectorAll('[data-sl]').forEach(el => el.onchange = () => {
    const [id, i, field] = el.dataset.sl.split('|');
    S.sessions[id].slots[+i][field] = el.value.trim();
    persist('Saved');
  });
  document.querySelectorAll('[data-st]').forEach(el => el.onchange = () => {
    const [id, i, j, field] = el.dataset.st.split('|');
    S.sessions[id].slots[+i].stages[+j][field] = el.value.trim();
    persist('Saved');
  });
  document.querySelectorAll('[data-stadd]').forEach(el => el.onclick = () => {
    const [id, i] = el.dataset.stadd.split('|');
    const sl = S.sessions[id].slots[+i];
    sl.stages = sl.stages || []; sl.stages.push(blankStage());
    persist('Stage added');
  });
  document.querySelectorAll('[data-strm]').forEach(el => el.onclick = () => {
    const [id, i, j] = el.dataset.strm.split('|');
    S.sessions[id].slots[+i].stages.splice(+j, 1);
    persist('Stage removed');
  });
  document.querySelectorAll('[data-imp]').forEach(el => el.onchange = () => {
    const f = el.files && el.files[0];
    if (f) importInto(el.dataset.imp, f);
    el.value = '';
  });
  /* ---- scans on a slot ----
     The page itself, attached once to the SET so every trainee who is dealt
     this slot gets it, rather than a tutor attaching the same page three times
     to three cells. `stamp()` on the TP points screen copies these onto each
     trainee's cell marked fromSet, keeping anything attached by hand
     alongside. putMaterial needs a token to resolve the course; hub-store adds
     the tutor key by itself, which is what allows more than 2MB since v71. */
  document.querySelectorAll('[data-fup]').forEach(el => el.onchange = async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const [id, i] = el.dataset.fup.split('|');
    const tok = anyToken();
    if (!tok) { alert('No trainee on the roster yet, so there is nowhere to put the file. Add the cohort first.'); return; }
    if (file.size > 9 * 1024 * 1024) { alert('That file is over 9MB. Put it on your own Drive and paste the link into Pages instead.'); return; }
    UPLOADING = id + '|' + i; render();
    try {
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(',')[1] || '');
        r.onerror = () => rej(new Error('That file could not be read.'));
        r.readAsDataURL(file);
      });
      const out = await window.HubStore.putMaterial(tok, file.name, file.type || 'application/octet-stream', b64);
      const sl = S.sessions[id].slots[+i];
      sl.files = (sl.files || []).concat([{ name: (file.name || '').replace(/\.[a-z0-9]+$/i, ''), url: out.url }]);
      UPLOADING = '';
      persist('Page attached');
    } catch (err) {
      UPLOADING = '';
      alert(err && err.message ? err.message : 'That file could not be attached.');
      render();
    }
  });
  document.querySelectorAll('[data-fnm]').forEach(el => el.onchange = () => {
    const [id, i, k] = el.dataset.fnm.split('|');
    S.sessions[id].slots[+i].files[+k].name = el.value.trim();
    persist('Renamed');
  });
  document.querySelectorAll('[data-frm]').forEach(el => el.onclick = () => {
    const [id, i, k] = el.dataset.frm.split('|');
    /* the reference goes; the file stays in Drive, because another slot or a
       trainee's own cell may already be pointing at it */
    S.sessions[id].slots[+i].files.splice(+k, 1);
    persist('Page removed from this slot');
  });
  document.querySelectorAll('[data-pasted]').forEach(el => el.onclick = () => {
    const ref = el.dataset.pasted;
    const box = document.querySelector('[data-paste="' + ref + '"]');
    if (!box || !box.value.trim()) return;
    const [id, i] = ref.split('|');
    const stages = parseDoc(box.value);
    if (!stages.length) { note = 'Nothing in that looked like a stage.'; $('status').textContent = note; return; }
    S.sessions[id].slots[+i].stages = stages;
    persist(stages.length + ' stages read from the paste');
  });
}

/* ---------------- importing a document ----------------
   A centre's teaching practice points already exist, as Word documents, one
   per session with three slots in it (Ramy's own set for Language Hub reads
   exactly that way). Typing them in again would be the whole reason nobody
   would use this screen, so a document is read HERE, in the browser: a .docx
   is a zip, its text lives in word/document.xml, and the browser can inflate
   it without a library and without the file leaving the laptop. */
async function fileText(file){
  const name = (file.name || '').toLowerCase();
  if (!/\.docx$/.test(name)) return await file.text();        // .txt, .md, anything plain
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= 0 && i > buf.length - 66000; i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('That does not look like a Word document.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), cmtLen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const entry = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nameLen));
    if (entry === 'word/document.xml') {
      const ln = dv.getUint16(lho + 26, true), le = dv.getUint16(lho + 28, true);
      const data = buf.subarray(lho + 30 + ln + le, lho + 30 + ln + le + csize);
      let xml;
      if (method === 0) xml = new TextDecoder().decode(data);
      else {
        if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot open a .docx. Save it as plain text and import that.');
        xml = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
      }
      return xml.replace(/<w:tab[^>]*\/>/g, ' ').replace(/<\/w:p>/g, '\n').replace(/<[^>]+>/g, '')
                .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'").replace(/&amp;/g, '&');
    }
    p += 46 + nameLen + extraLen + cmtLen;
  }
  throw new Error('No text found inside that document.');
}

/* The type is what the CELTA 5 records, so it is guessed from the main aim and
   then sits in a dropdown the tutor can correct. Language focus is tested
   before the skills on purpose: "Vocabulary (+listening)" is a vocabulary
   lesson, and reading the skills first would call it a listening. */
function guessType(text){
  const t = ' ' + String(text || '').toLowerCase() + ' ';
  if (/functional language|phrases for|language for /.test(t)) return 'Functional language';
  if (/vocab|lexis|lexical|collocation/.test(t)) return 'Vocabulary';
  if (/grammar|tense|present simple|past simple|possessive|adjective|adverb|article|question form|apostrophe|ha[sve](?:\/has)? got|form, meaning/.test(t)) return 'Grammar';
  if (/listen/.test(t)) return 'Listening';
  if (/read/.test(t)) return 'Reading';
  if (/writ/.test(t)) return 'Writing';
  if (/speak|fluency|discussion/.test(t)) return 'Speaking';
  return '';
}

const SKIP = /^(teacher|level|book|time|topic)\s*:/i;
const NOISE = /^(points to remember|look at the teacher|think about|sources for coursebook|maggs|pathare)/i;
function parseSlotText(body){
  const slot = blankSlot(), stages = [];
  String(body).split(/\n+/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean).forEach(line => {
    let m;
    if ((m = line.match(/^main aims?\s*:\s*(.+)$/i))) { slot.aim = m[1]; slot.type = guessType(m[1]); return; }
    if ((m = line.match(/^sub aims?\s*:\s*(.+)$/i))) { slot.sub = m[1]; return; }
    if ((m = line.match(/^lesson shape\s*:\s*(.+)$/i))) { slot.shape = m[1].replace(/^[A-Z]\.\s*/, ''); return; }
    if ((m = line.match(/^materials\s*:\s*(.+)$/i))) {
      slot.pages = m[1];
      /* "p. 12", "p.14", "pages 14 & 146-2.2" all name the same first page. */
      const p = m[1].match(/\bpp?(?:ages?)?\.?\s*(\d{1,3})/i); if (p) slot.page = p[1];
      return;
    }
    if (SKIP.test(line) || NOISE.test(line) || /^[✓✔*•]/.test(line)) return;
    /* A modelled exchange inside a stage reads exactly like a stage: "Student
       B: No, I don't think it's his pencil." Those lines belong to the stage
       above them, not beside it. */
    if ((m = line.match(/^([A-Z][^:]{2,60}):\s*(.+)$/)) && !/^(students?|teacher|learners?|ss?|t|e\.?g|note|example|answer)\b/i.test(m[1])) {
      /* "Lead-in (to set the context)" — the parenthetical is the stage's aim.
         It goes into the guidance, never into the name, because the name is
         the one thing that travels into the trainee's own plan. */
      const par = m[1].match(/^(.+?)\s*\(([^)]{6,})\)\s*$/);
      stages.push({ name: (par ? par[1] : m[1]).trim(), minutes: '', interaction: '',
                    todo: (par ? par[2].trim().replace(/^./, c => c.toUpperCase()) + '. ' : '') + m[2].trim(), avoid: '' });
      return;
    }
    if (stages.length) stages[stages.length - 1].todo += ' ' + line;
  });
  slot.stages = stages;
  return slot;
}
/* One document, three slots. A document with no "Slot:" line at all is one
   lesson, and goes into the first slot rather than being refused. */
function parseSessionText(text){
  const parts = String(text).split(/\n\s*slot\s*:?\s*\d*\s*\n/i);
  if (parts.length < 2) return [parseSlotText(text)];
  return parts.slice(1, 4).map(parseSlotText);
}
async function importInto(id, file){
  const status = $('status');
  status.textContent = 'Reading ' + file.name + '…';
  let text;
  try { text = await fileText(file); }
  catch (e) { status.textContent = e.message || 'Could not read that file.'; return; }
  const slots = parseSessionText(text).filter(sl => sl && (sl.aim || sl.type || sl.stages.length));
  if (!slots.length) { status.textContent = 'Nothing in that document looked like a lesson.'; return; }
  const ses = S.sessions[id];
  slots.forEach((sl, i) => { if (i < 3) ses.slots[i] = sl; });
  /* A document that writes its stages out in full is a scripted session; one
     that only names them is not. The tutor can still say otherwise. */
  const words = slots.reduce((n, sl) => n + sl.stages.reduce((w, st) => w + st.todo.split(' ').length, 0), 0);
  ses.scaffold = words > 600 ? 'full' : words > 150 ? 'guided' : 'bare';
  persist(slots.length + (slots.length === 1 ? ' slot' : ' slots') + ' read from ' + file.name);
}

/* A written-up lesson is lines of "Stage name: what happens". Anything that is
   not shaped that way joins the stage above it, which is how a paragraph that
   wrapped mid-sentence survives the paste. Headers the document carries
   anyway -- Level, Materials, Slot -- are not stages and are dropped. */
const DROP = /^(level|book|time|topic|slot|teacher|main aim|sub aim|lesson shape|materials|think about|sources for coursebook)\s*:/i;
function parseDoc(text){
  const out = [];
  String(text).split(/\n+/).forEach(raw => {
    const line = raw.replace(/\s+/g, ' ').trim();
    if (!line || DROP.test(line) || /^[✓✔*•]/.test(line)) return;
    const m = line.match(/^([A-Z][^:]{2,60}):\s*(.+)$/);
    if (m) out.push({ name: m[1].trim(), minutes: '', interaction: '', todo: m[2].trim(), avoid: '' });
    else if (out.length) out[out.length - 1].todo += ' ' + line;
  });
  return out;
}

load();
render();
</script>
