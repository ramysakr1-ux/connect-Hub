<!DOCTYPE html>
<!--
  Connect Lite — teaching practice point sets
  © 2026 Ramy Sakr. All rights reserved.

  A SET is what a coursebook gives a course: twelve sessions — TP 1 to 6, each
  taught twice because a group of six splits into two teaching sets on
  alternate days — and three slots in each, because three candidates teach a
  45-minute slot each within a session.

  Ramy, 4 Oct 2026, on what a candidate needs: "enough information about their
  aims, the page numbers, the procedure, what they're doing and how to do it,
  and obviously timing as well, especially the first two TPs." So a slot here
  carries the aim as an outcome, the pages as fields, the tracks, and the
  procedure as STAGES — each stage with its minutes, its interaction, what to
  do and what to watch out for. The minutes add up on screen against the
  slot's length, because a first-TP plan that runs to fifty minutes in a
  forty-five minute slot is the commonest way a first lesson goes wrong.

  Scaffolding steps down by session, set by whoever writes the set rather than
  inferred from the practice number: a level change mid-course wants a scripted
  session after a sparse one, and only the person writing it knows that.

  The set does not teach anybody. It is applied to the rotation on the TP
  points screen, which deals the candidates into the slots; the set decides
  WHAT each slot is, the rotation decides WHO takes it.
-->

<body class="hub-grid hub-paper hub-course">
<div class="board">
  <a class="back" id="back" href="5_tutor_dashboard.html">&larr; Back</a>
  <div id="app"></div>

<script src="hub-shared.js?v=202610041122"></script>
<script src="hub-rotation.js?v=202610041122"></script>
<script src="hub-store.js?v=202610041122"></script>
<script src="hub-sync.js?v=202610041122"></script>
<script type="text/x-hub-app">
const MODE = window.HubMode;
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose — this is one of the course’s own pages.');
const IS_TUTOR = MODE === 'tutor';
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const KEY = 'connect_tp_points_v1';
const SETTINGS = rec('connect_course_settings') || {};
const TOTAL = parseInt(SETTINGS.tpCount, 10) || 8;
const TPS = Math.max(1, TOTAL - 2);        // the last two are the candidates' own

/* The seven types the rotation deals in, and the only ones the CELTA 5 can
   record. A slot names one of them so the grid, the tracker and the record
   all keep speaking the same language; the aim underneath is the sentence. */
const TYPES = (window.hubRotation && window.hubRotation.AIMS) ||
  ['Grammar','Vocabulary','Functional language','Reading','Listening','Speaking','Writing'];

/* The shapes the candidate's own plan offers. Naming them here means a slot
   can say "receptive skills" and the plan can fill those stages in one press
   rather than the candidate guessing which shape the tutor had in mind. */
/* These are the six the plan offers, word for word. A shape the set can name
   but the plan cannot fill would hand the candidate a lesson shape and then
   refuse to give them its stages, so the two lists are the same list. */
const SHAPES = ['Present – Practice – Produce (PPP)','Test – Teach – Test',
  'Text-Based Presentation of Language','Language Practice (follows a previous lesson)',
  'Receptive Skills (reading or listening)','Productive Skills (speaking or writing)'];

/* The candidate's own plan writes interaction as these codes, so the set uses
   them too — one vocabulary across the two screens means a stage can carry its
   pattern straight into the plan. */
const INTERACTIONS = ['','T–S','S–T','S–S','PW','GW','Ind.','OC','Ming.'];
const INT_LABEL = { 'T–S':'Teacher to students', 'S–T':'Students to teacher', 'S–S':'Student to student',
  'PW':'Pair work', 'GW':'Group work', 'Ind.':'Individual', 'OC':'Open class', 'Ming.':'Mingle' };

/* How much a session hands over. Ramy, 4 Oct 2026: scripted for the first
   practices, then stages and timings only, then the aim and the materials and
   they build it. Set per session, not per practice number. */
const SCAFFOLD = {
  full:   { name: 'Fully written — every stage, what to do, timings',
            blurb: 'For a candidate who has never taught: the stages are written out and timed.' },
  guided: { name: 'Stages and timings — they write the instructions',
            blurb: 'The shape and the clock are given; what happens in each stage is theirs.' },
  bare:   { name: 'Aims and materials only — they build the lesson',
            blurb: 'No stages. They choose the shape and plan it themselves.' },
};

/* A COURSE HOLDS SEVERAL SETS. Ramy, 4 Oct 2026: "we will definitely need at
   least four sets in case it's a course of 24." A set belongs to a tutor and
   their book — the candidates move between levels, the set stays put — so a
   course of twenty-four running four groups writes four of them and says which
   group teaches from which. */
let LIB = {};          // id -> set
let FOR = {};          // group -> set id
let CUR = '';          // the set being edited
let S = null;          // shorthand for LIB[CUR]
let OPEN = null;       // which session is open, e.g. "1A"
let note = '';

function groupNames(){
  const roster = rec('connect_roster_v1') || {};
  const out = [];
  Object.values(roster.trainees || {}).filter(Boolean).forEach(t => {
    const g = String(t.group || '');
    if (g && out.indexOf(g) < 0) out.push(g);
  });
  return out.sort();
}
const newId = () => { let n = 1; while (LIB['s' + n]) n++; return 's' + n; };

/* The twelve (or 2 x TPS) sessions, in the order they are taught: TP 1 on the
   first set's day, TP 1 on the second set's day, then TP 2, and so on. The
   letters are the teaching sets' own, read off the roster, so a course of
   five reads "ABC" and "DE" rather than a hopeful "DEF". */
function setNames(){
  const roster = rec('connect_roster_v1') || {};
  const people = Object.values(roster.trainees || {}).filter(Boolean);
  const by = {};
  people.forEach(t => { const g = String(t.group || ''); (by[g] = by[g] || []).push({ token: t.id || t.token, name: t.name }); });
  const first = Object.keys(by).sort()[0];
  if (!first || !window.hubRotation) return ['A', 'B'];
  return window.hubRotation.rotate(by[first], { tps: TPS }).setNames;
}
function sessionIds(){
  const out = [];
  for (let tp = 1; tp <= TPS; tp++) { out.push(tp + 'A'); out.push(tp + 'B'); }
  return out;
}
const blankStage = () => ({ name: '', minutes: '', interaction: '', todo: '', avoid: '' });
const blankSlot = () => ({ type: '', aim: '', sub: '', shape: '', pages: '', page: '', tracks: '', stages: [] });
function blankSet(){
  const sessions = {};
  sessionIds().forEach(id => { sessions[id] = { scaffold: parseInt(id, 10) <= 2 ? 'full' : parseInt(id, 10) <= 4 ? 'guided' : 'bare', slots: [blankSlot(), blankSlot(), blankSlot()] }; });
  return { book: '', level: '', minutes: 45, sessions: sessions };
}
function load(){
  const P = rec(KEY) || {};
  LIB = (P.library && Object.keys(P.library).length) ? P.library : (P.set ? { s1: P.set } : {});
  FOR = P.setFor || {};
  CUR = LIB[CUR] ? CUR : Object.keys(LIB)[0] || '';
  S = LIB[CUR] || null;
  Object.keys(LIB).forEach(id => {
    const s = LIB[id];
    sessionIds().forEach(x => {            // a course whose practice count grew
      if (!s.sessions[x]) s.sessions[x] = { scaffold: 'bare', slots: [blankSlot(), blankSlot(), blankSlot()] };
      while (s.sessions[x].slots.length < 3) s.sessions[x].slots.push(blankSlot());
    });
  });
}
function persist(word){
  const P = rec(KEY) || {};
  if (S) S.updated = new Date().toISOString().slice(0, 10);
  P.library = LIB;
  P.setFor = FOR;
  delete P.set;            // migrated: the library is the one place sets live
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {}
  note = word || 'Saved';
  render();
  setTimeout(() => { if (note === word) { note = ''; const el = $('status'); if (el) el.textContent = ''; } }, 2600);
}

const slotMinutes = sl => (sl.stages || []).reduce((n, st) => n + (parseInt(st.minutes, 10) || 0), 0);
function sessionState(ses){
  const written = (ses.slots || []).filter(sl => sl.type || sl.aim || (sl.stages || []).length).length;
  if (!written) return { word: 'not written', done: false };
  if (written < 3) return { word: written + ' of 3 slots', done: false };
  return { word: 'written', done: true };
}

/* ---------------- render ---------------- */
function render(){
  if (!IS_TUTOR) {
    $('app').innerHTML = '<h1>TP point sets</h1><div class="empty">This is a tutor’s page. Your own teaching practice points are on your course home.</div>';
    return;
  }
  if (!S || !Object.keys(LIB).length) {
    $('app').innerHTML = `<h1>TP point sets</h1>
      <p class="lede">A set is the course’s teaching practice points, written once against a coursebook: ${TPS} practices, each taught twice because the group teaches on alternate days, and three slots in each. The rotation then deals the candidates into the slots.</p>
      <div class="empty"><p style="margin:0 0 12px">This course has no set yet.</p>
      <button class="btn" id="make">Start a set</button></div>`;
    $('make').onclick = () => { const id = newId(); LIB[id] = blankSet(); CUR = id; S = LIB[id]; persist('Set started'); };
    return;
  }
  const names = setNames();
  const sessions = sessionIds().map(id => {
    const ses = S.sessions[id], tp = parseInt(id, 10), letter = id.slice(-1);
    const who = names[letter === 'A' ? 0 : 1] || letter;
    const st = sessionState(ses);
    const open = OPEN === id;
    return `<div class="sess${open ? ' open' : ''}">
      <button class="shead" data-open="${id}" aria-expanded="${open}">
        <b>TP ${tp} · ${esc(who)}</b>
        <span class="who">${esc(SCAFFOLD[ses.scaffold] ? SCAFFOLD[ses.scaffold].name.split(' — ')[0] : ses.scaffold)}</span>
        <span class="state${st.done ? ' done' : ''}">${st.word}</span>
      </button>
      ${open ? '<div class="sbody">' + sessionBody(id, ses) + '</div>' : ''}
    </div>`;
  }).join('');

  const ids = Object.keys(LIB);
  const gnames = groupNames();
  const tabs = `<div class="settabs">${ids.map(id => `<button type="button" class="settab${id === CUR ? ' on' : ''}" data-set="${id}">${esc(LIB[id].name || LIB[id].book || 'Untitled set')}${
      LIB[id].level ? `<i>${esc(LIB[id].level)}</i>` : ''}</button>`).join('')}
    <button type="button" class="settab add" id="addset">+ another set</button></div>`;
  const usedBy = !gnames.length ? '' : `<div class="row"><label class="lab">Taught by</label><div class="groupsel">${
    gnames.map(g => { const on = (FOR[g] || ids[0]) === CUR;
      return `<label class="gchip${on ? ' on' : ''}"><input type="checkbox" data-group="${esc(g)}"${on ? ' checked' : ''}> Group ${esc(g)}</label>`; }).join('')}
    <p class="hint" style="margin:5px 0 0">Which groups teach from this set. A course of twenty-four running four groups has four sets, one per tutor and book.</p></div></div>`;

  $('app').innerHTML = `<h1>TP point sets</h1>
    <p class="lede">The lessons this course teaches, written once against the book. A set belongs to a tutor and their book; the rotation on the TP points screen deals its slots to whoever is teaching. Give a slot its stages and the candidate’s own plan can start from them.</p>
    ${tabs}
    <div class="head">
      <div class="row"><label class="lab" for="setname">This set is</label><input id="setname" value="${esc(S.name || '')}" placeholder="Jordan’s group · Language Hub Elementary"></div>
      ${usedBy}
      <div class="row"><label class="lab" for="book">Coursebook</label><input id="book" value="${esc(S.book || '')}" placeholder="Language Hub Elementary"></div>
      <div class="row"><label class="lab" for="level">Level</label><input id="level" value="${esc(S.level || '')}" placeholder="A2 (elementary)"></div>
      <div class="row"><label class="lab" for="url">Link to the book</label><div><input id="url" type="url" value="${esc(S.url || '')}" placeholder="https://… wherever the book lives"><p class="hint">Every slot&rsquo;s card links here, so the link is written once. The page number in a slot opens a direct PDF address at that page.</p></div></div>
      <div class="row"><label class="lab" for="sources">How to source it</label><div><textarea id="sources" rows="3" placeholder="Maggs, P. &amp; Smith, C. (2019) Language Hub Elementary Student&rsquo;s Book. Macmillan.&#10;Pathare, G. (2019) Language Hub Elementary Teacher&rsquo;s Book. Macmillan.&#10;One reference per line">${esc(S.sources || '')}</textarea><p class="hint">The references for this book, written correctly. They appear on the card for the first two practices only, taken apart so the candidate can see which part is which &mdash; after that they write their own.</p></div></div>
      <div class="row"><label class="lab" for="mins">A slot is</label><div class="pair" style="display:grid;grid-template-columns:110px 1fr;gap:9px;align-items:center"><input id="mins" type="number" min="15" max="120" value="${esc(S.minutes || 45)}"><span class="hint" style="margin:0">minutes. The stage clock in each slot counts against this.</span></div></div>
    </div>
    ${sessions}
    <div class="acts">
      <a class="btn quiet" href="24_tp_points.html">Apply it on the TP points screen</a>
    </div>
    <p class="status" id="status">${esc(note)}</p>`;
  wire();
}

function sessionBody(id, ses){
  const imp = `<div class="imp">
    <label class="btn quiet sm" for="file-${id}">Import a document</label>
    <input type="file" id="file-${id}" data-imp="${id}" accept=".docx,.txt,.md,text/plain" hidden>
    <span class="hint" style="margin:0">A Word document written as <b>Slot: 1</b>, <b>Slot: 2</b>, <b>Slot: 3</b> fills all three at once &mdash; aims, pages and stages. Nothing is uploaded; the file is read here.</span></div>`;
  /* One context across the day. Ramy, 4 Oct 2026: "at least two or three of
     them teaching the same day could have a similar context." Three lessons
     on consecutive pages of a unit usually share one anyway; naming it means
     the candidates can see what the day is about and build on each other. */
  const ctx = `<div class="scaf"><label class="lab" for="ctx-${id}">Context</label>
    <input id="ctx-${id}" data-ctx="${id}" value="${esc(ses.context || '')}" placeholder="Families · daily routines · jobs" style="max-width:320px">
    <span class="hint" style="margin:0">What the three lessons of this day are about.</span></div>`;
  const scaf = imp + ctx + `<div class="scaf"><label class="lab" for="scaf-${id}">Scaffolding</label>
    <select id="scaf-${id}" data-scaf="${id}">${Object.keys(SCAFFOLD).map(k =>
      `<option value="${k}"${ses.scaffold === k ? ' selected' : ''}>${esc(SCAFFOLD[k].name)}</option>`).join('')}</select>
    <span class="hint" style="margin:0">${esc(SCAFFOLD[ses.scaffold] ? SCAFFOLD[ses.scaffold].blurb : '')}</span></div>`;
  return scaf + (ses.slots || []).map((sl, i) => slotBody(id, i, sl, ses.scaffold)).join('');
}

function slotBody(id, i, sl, scaffold){
  const total = slotMinutes(sl), cap = parseInt(S.minutes, 10) || 45;
  const over = total > cap;
  const stages = scaffold === 'bare' ? '' : `
    <div class="frow"><label class="lab">Procedure</label><div>
      <table class="st"><thead><tr><th></th><th style="width:30%">Stage</th><th style="width:62px">Mins</th><th style="width:108px">Interaction</th><th>What to do${scaffold === 'guided' ? '' : ' · what to watch out for'}</th><th></th></tr></thead>
      <tbody>${(sl.stages || []).map((st, j) => `<tr>
        <td class="n">${j + 1}</td>
        <td><input data-st="${id}|${i}|${j}|name" value="${esc(st.name)}" placeholder="Lead-in"></td>
        <td><input type="number" min="0" max="90" data-st="${id}|${i}|${j}|minutes" value="${esc(st.minutes)}"></td>
        <td><select data-st="${id}|${i}|${j}|interaction" title="Interaction pattern">${INTERACTIONS.map(x =>
          `<option value="${esc(x)}"${st.interaction === x ? ' selected' : ''}>${esc(x ? x + ' · ' + INT_LABEL[x] : '—')}</option>`).join('')}</select></td>
        <td><textarea rows="2" data-st="${id}|${i}|${j}|todo" placeholder="${scaffold === 'guided' ? 'One line of guidance' : 'What the candidate does in this stage'}">${esc(st.todo)}</textarea>
          ${scaffold === 'full' ? `<textarea rows="1" data-st="${id}|${i}|${j}|avoid" placeholder="Watch out for… (optional)">${esc(st.avoid)}</textarea>` : ''}</td>
        <td><button type="button" class="xbtn" data-strm="${id}|${i}|${j}">Remove</button></td></tr>`).join('')}
      </tbody></table>
      <div class="clock${over ? ' over' : ''}"><button type="button" class="btn quiet sm" data-stadd="${id}|${i}">Add a stage</button>
        <span>${(sl.stages || []).length ? `<b>${total}</b> of ${cap} minutes${over ? ' — over the slot' : total && total < cap - 5 ? ' · ' + (cap - total) + ' spare' : ''}` : 'No stages yet.'}</span></div>
      <details class="paste"><summary>Paste a written-up lesson instead</summary>
        <textarea rows="4" data-paste="${id}|${i}" placeholder="Paste a document whose lines read &quot;Lead-in: ask a couple of simple questions…&quot; — each line becomes a stage."></textarea>
        <button type="button" class="btn quiet sm" style="margin-top:7px" data-pasted="${id}|${i}">Turn it into stages</button>
        <p class="hint">Every line shaped <b>Name: text</b> becomes a stage, in order. Timings and interaction stay yours to add.</p>
      </details>
    </div></div>`;

  return `<div class="slot">
    <h3>Slot ${i + 1} <small>the ${['first','second','third'][i] || (i + 1) + 'th'} candidate to teach</small></h3>
    <div class="frow"><label class="lab">Lesson type</label><div>
      <select data-sl="${id}|${i}|type"><option value="">— choose —</option>${TYPES.map(t =>
        `<option value="${esc(t)}"${sl.type === t ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>
      <p class="hint">What the CELTA 5 records, and what the rotation checks for a range. The aim below is the sentence.</p></div></div>
    <div class="frow"><label class="lab">Main aim</label><textarea rows="2" data-sl="${id}|${i}|aim" placeholder="By the end of the lesson, learners will be better able to…">${esc(sl.aim)}</textarea></div>
    <div class="frow"><label class="lab">Sub aim</label><input data-sl="${id}|${i}|sub" value="${esc(sl.sub)}" placeholder="Oral fluency in the same context"></div>
    <div class="frow"><label class="lab">Lesson shape</label><div>
      <input list="shapes" data-sl="${id}|${i}|shape" value="${esc(sl.shape)}" placeholder="Receptive Skills (reading or listening)">
      <p class="hint">Named as the candidate’s own plan names it, so their stages can be filled in one press.</p></div></div>
    <div class="frow"><label class="lab">Pages</label><div class="pair">
      <textarea rows="2" data-sl="${id}|${i}|pages" placeholder="SB p. 12, ex. A–D&#10;WB p. 9, ex. 1a—one line each">${esc(sl.pages)}</textarea>
      <input type="number" min="1" data-sl="${id}|${i}|page" value="${esc(sl.page)}" placeholder="Open at p."></div></div>
    <div class="frow"><label class="lab">Audio</label><div>
      <textarea rows="2" data-sl="${id}|${i}|tracks" placeholder="Track 2.3 | https://drive.google.com/file/d/…&#10;One link per line; a name before a | labels it">${esc(sl.tracks)}</textarea>
      <p class="hint">These become players on the card of the candidate teaching this slot.</p></div></div>
    ${stages}
  </div>`;
}

/* ---------------- wiring ---------------- */
function wire(){
  if (!document.getElementById('shapes')) {
    const dl = document.createElement('datalist'); dl.id = 'shapes';
    dl.innerHTML = SHAPES.map(s => `<option value="${esc(s)}">`).join('');
    document.body.appendChild(dl);
  }
  document.querySelectorAll('[data-set]').forEach(el => el.onclick = () => {
    CUR = el.dataset.set; S = LIB[CUR]; OPEN = null; render();
  });
  const add = $('addset');
  if (add) add.onclick = () => { const id = newId(); LIB[id] = blankSet(); CUR = id; S = LIB[id]; OPEN = null; persist('Another set started'); };
  const nm = $('setname');
  if (nm) nm.onchange = () => { S.name = nm.value.trim(); persist('Saved'); };
  document.querySelectorAll('[data-group]').forEach(el => el.onchange = () => {
    const g = el.dataset.group;
    if (el.checked) FOR[g] = CUR; else if (FOR[g] === CUR) delete FOR[g];
    persist(el.checked ? `Group ${g} teaches from this set` : `Group ${g} no longer uses this set`);
  });
  const b = $('book'), l = $('level'), m = $('mins'), u = $('url');
  if (b) b.onchange = () => { S.book = b.value.trim(); persist('Saved'); };
  if (l) l.onchange = () => { S.level = l.value.trim(); persist('Saved'); };
  if (u) u.onchange = () => { S.url = u.value.trim(); persist('Saved'); };
  const src = $('sources');
  if (src) src.onchange = () => { S.sources = src.value.trim(); persist('Saved'); };
  if (m) m.onchange = () => { S.minutes = parseInt(m.value, 10) || 45; persist('Saved'); };

  document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => {
    OPEN = OPEN === el.dataset.open ? null : el.dataset.open; render();
  });
  document.querySelectorAll('[data-ctx]').forEach(el => el.onchange = () => {
    S.sessions[el.dataset.ctx].context = el.value.trim(); persist('Saved');
  });
  document.querySelectorAll('[data-scaf]').forEach(el => el.onchange = () => {
    S.sessions[el.dataset.scaf].scaffold = el.value; persist('Scaffolding changed');
  });
  /* Typing saves on change, not on every key: the record syncs to the store
     and a keystroke-per-write would push a 40 KB record on every letter. */
  document.querySelectorAll('[data-sl]').forEach(el => el.onchange = () => {
    const [id, i, field] = el.dataset.sl.split('|');
    S.sessions[id].slots[+i][field] = el.value.trim();
    persist('Saved');
  });
  document.querySelectorAll('[data-st]').forEach(el => el.onchange = () => {
    const [id, i, j, field] = el.dataset.st.split('|');
    S.sessions[id].slots[+i].stages[+j][field] = el.value.trim();
    persist('Saved');
  });
  document.querySelectorAll('[data-stadd]').forEach(el => el.onclick = () => {
    const [id, i] = el.dataset.stadd.split('|');
    const sl = S.sessions[id].slots[+i];
    sl.stages = sl.stages || []; sl.stages.push(blankStage());
    persist('Stage added');
  });
  document.querySelectorAll('[data-strm]').forEach(el => el.onclick = () => {
    const [id, i, j] = el.dataset.strm.split('|');
    S.sessions[id].slots[+i].stages.splice(+j, 1);
    persist('Stage removed');
  });
  document.querySelectorAll('[data-imp]').forEach(el => el.onchange = () => {
    const f = el.files && el.files[0];
    if (f) importInto(el.dataset.imp, f);
    el.value = '';
  });
  document.querySelectorAll('[data-pasted]').forEach(el => el.onclick = () => {
    const ref = el.dataset.pasted;
    const box = document.querySelector('[data-paste="' + ref + '"]');
    if (!box || !box.value.trim()) return;
    const [id, i] = ref.split('|');
    const stages = parseDoc(box.value);
    if (!stages.length) { note = 'Nothing in that looked like a stage.'; $('status').textContent = note; return; }
    S.sessions[id].slots[+i].stages = stages;
    persist(stages.length + ' stages read from the paste');
  });
}

/* ---------------- importing a document ----------------
   A centre's teaching practice points already exist, as Word documents, one
   per session with three slots in it (Ramy's own set for Language Hub reads
   exactly that way). Typing them in again would be the whole reason nobody
   would use this screen, so a document is read HERE, in the browser: a .docx
   is a zip, its text lives in word/document.xml, and the browser can inflate
   it without a library and without the file leaving the laptop. */
async function fileText(file){
  const name = (file.name || '').toLowerCase();
  if (!/\.docx$/.test(name)) return await file.text();        // .txt, .md, anything plain
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= 0 && i > buf.length - 66000; i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('That does not look like a Word document.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), cmtLen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const entry = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nameLen));
    if (entry === 'word/document.xml') {
      const ln = dv.getUint16(lho + 26, true), le = dv.getUint16(lho + 28, true);
      const data = buf.subarray(lho + 30 + ln + le, lho + 30 + ln + le + csize);
      let xml;
      if (method === 0) xml = new TextDecoder().decode(data);
      else {
        if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot open a .docx. Save it as plain text and import that.');
        xml = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
      }
      return xml.replace(/<w:tab[^>]*\/>/g, ' ').replace(/<\/w:p>/g, '\n').replace(/<[^>]+>/g, '')
                .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'").replace(/&amp;/g, '&');
    }
    p += 46 + nameLen + extraLen + cmtLen;
  }
  throw new Error('No text found inside that document.');
}

/* The type is what the CELTA 5 records, so it is guessed from the main aim and
   then sits in a dropdown the tutor can correct. Language focus is tested
   before the skills on purpose: "Vocabulary (+listening)" is a vocabulary
   lesson, and reading the skills first would call it a listening. */
function guessType(text){
  const t = ' ' + String(text || '').toLowerCase() + ' ';
  if (/functional language|phrases for|language for /.test(t)) return 'Functional language';
  if (/vocab|lexis|lexical|collocation/.test(t)) return 'Vocabulary';
  if (/grammar|tense|present simple|past simple|possessive|adjective|adverb|article|question form|apostrophe|ha[sve](?:\/has)? got|form, meaning/.test(t)) return 'Grammar';
  if (/listen/.test(t)) return 'Listening';
  if (/read/.test(t)) return 'Reading';
  if (/writ/.test(t)) return 'Writing';
  if (/speak|fluency|discussion/.test(t)) return 'Speaking';
  return '';
}

const SKIP = /^(teacher|level|book|time|topic)\s*:/i;
const NOISE = /^(points to remember|look at the teacher|think about|sources for coursebook|maggs|pathare)/i;
function parseSlotText(body){
  const slot = blankSlot(), stages = [];
  String(body).split(/\n+/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean).forEach(line => {
    let m;
    if ((m = line.match(/^main aims?\s*:\s*(.+)$/i))) { slot.aim = m[1]; slot.type = guessType(m[1]); return; }
    if ((m = line.match(/^sub aims?\s*:\s*(.+)$/i))) { slot.sub = m[1]; return; }
    if ((m = line.match(/^lesson shape\s*:\s*(.+)$/i))) { slot.shape = m[1].replace(/^[A-Z]\.\s*/, ''); return; }
    if ((m = line.match(/^materials\s*:\s*(.+)$/i))) {
      slot.pages = m[1];
      /* "p. 12", "p.14", "pages 14 & 146-2.2" all name the same first page. */
      const p = m[1].match(/\bpp?(?:ages?)?\.?\s*(\d{1,3})/i); if (p) slot.page = p[1];
      return;
    }
    if (SKIP.test(line) || NOISE.test(line) || /^[✓✔*•]/.test(line)) return;
    /* A modelled exchange inside a stage reads exactly like a stage: "Student
       B: No, I don't think it's his pencil." Those lines belong to the stage
       above them, not beside it. */
    if ((m = line.match(/^([A-Z][^:]{2,60}):\s*(.+)$/)) && !/^(students?|teacher|learners?|ss?|t|e\.?g|note|example|answer)\b/i.test(m[1])) {
      /* "Lead-in (to set the context)" — the parenthetical is the stage's aim.
         It goes into the guidance, never into the name, because the name is
         the one thing that travels into the candidate's own plan. */
      const par = m[1].match(/^(.+?)\s*\(([^)]{6,})\)\s*$/);
      stages.push({ name: (par ? par[1] : m[1]).trim(), minutes: '', interaction: '',
                    todo: (par ? par[2].trim().replace(/^./, c => c.toUpperCase()) + '. ' : '') + m[2].trim(), avoid: '' });
      return;
    }
    if (stages.length) stages[stages.length - 1].todo += ' ' + line;
  });
  slot.stages = stages;
  return slot;
}
/* One document, three slots. A document with no "Slot:" line at all is one
   lesson, and goes into the first slot rather than being refused. */
function parseSessionText(text){
  const parts = String(text).split(/\n\s*slot\s*:?\s*\d*\s*\n/i);
  if (parts.length < 2) return [parseSlotText(text)];
  return parts.slice(1, 4).map(parseSlotText);
}
async function importInto(id, file){
  const status = $('status');
  status.textContent = 'Reading ' + file.name + '…';
  let text;
  try { text = await fileText(file); }
  catch (e) { status.textContent = e.message || 'Could not read that file.'; return; }
  const slots = parseSessionText(text).filter(sl => sl && (sl.aim || sl.type || sl.stages.length));
  if (!slots.length) { status.textContent = 'Nothing in that document looked like a lesson.'; return; }
  const ses = S.sessions[id];
  slots.forEach((sl, i) => { if (i < 3) ses.slots[i] = sl; });
  /* A document that writes its stages out in full is a scripted session; one
     that only names them is not. The tutor can still say otherwise. */
  const words = slots.reduce((n, sl) => n + sl.stages.reduce((w, st) => w + st.todo.split(' ').length, 0), 0);
  ses.scaffold = words > 600 ? 'full' : words > 150 ? 'guided' : 'bare';
  persist(slots.length + (slots.length === 1 ? ' slot' : ' slots') + ' read from ' + file.name);
}

/* A written-up lesson is lines of "Stage name: what happens". Anything that is
   not shaped that way joins the stage above it, which is how a paragraph that
   wrapped mid-sentence survives the paste. Headers the document carries
   anyway -- Level, Materials, Slot -- are not stages and are dropped. */
const DROP = /^(level|book|time|topic|slot|teacher|main aim|sub aim|lesson shape|materials|think about|sources for coursebook)\s*:/i;
function parseDoc(text){
  const out = [];
  String(text).split(/\n+/).forEach(raw => {
    const line = raw.replace(/\s+/g, ' ').trim();
    if (!line || DROP.test(line) || /^[✓✔*•]/.test(line)) return;
    const m = line.match(/^([A-Z][^:]{2,60}):\s*(.+)$/);
    if (m) out.push({ name: m[1].trim(), minutes: '', interaction: '', todo: m[2].trim(), avoid: '' });
    else if (out.length) out[out.length - 1].todo += ' ' + line;
  });
  return out;
}

load();
render();
</script>
</body>
