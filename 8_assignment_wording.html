<style>
  /* ---- The assignment editor, v2 (11 Oct 2026) -------------------------------
     From the designer's handoff "Assignment editor v2". The page behind Edit
     wording on Course admin; Course admin itself is unchanged. What it stores
     is unchanged too (plus `savedAt`); this is how the page is laid out and read.
     The rule that matters most: a section's edge is coloured by its TYPE, and
     gold is kept for one thing only, wording that is no longer Connect's.
     The desk is a step darker than the house's and the cards are paper, as
     the design draws them, so the cards stand off it. Local to this page. */
  *{box-sizing:border-box;}
  a{color:var(--teal);} a:hover{color:var(--ink-warm);}
  body{margin:0; font-family:'Karla',sans-serif; font-size:15px; line-height:1.6; color:var(--ink); background:var(--sand-deep); -webkit-font-smoothing:antialiased;}
  .board{max-width:1180px; margin:0 auto; padding:28px 20px 120px;}
  button{font-family:inherit; color:inherit;}
  .lnk{background:none; border:none; padding:2px 4px; margin:0 -4px; border-radius:6px; font-size:0.82rem; font-weight:600; color:var(--teal); cursor:pointer;}
  .xbtn{background:none; border:none; width:28px; height:28px; border-radius:6px; color:var(--grey); font-size:0.95rem; cursor:pointer; flex:none;}
  .xbtn:hover{color:var(--brick);}

  /* the top line: back, and one pill per assignment */
  .topline{display:flex; align-items:center; justify-content:space-between; gap:16px; margin:0 0 18px; flex-wrap:wrap;}
  .back{font-size:0.85rem; font-weight:600; text-decoration:none;}
  .back:hover{text-decoration:underline;}
  .switcher{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .apill{height:32px; padding:0 13px; border-radius:999px; font-size:0.8rem; font-weight:700; letter-spacing:.03em; display:inline-flex; align-items:center; gap:7px;
    cursor:pointer; background:var(--paper); color:var(--ink); border:1px solid var(--sand-line);}
  .apill.active{background:var(--teal); color:var(--paper); border-color:var(--teal);}
  .apill.missing{color:var(--grey); font-weight:600;}
  .apill.sanction{margin-left:6px;}
  .apill .edot{width:6px; height:6px; border-radius:50%; background:var(--gold-deep);}
  .apill.active .edot{background:var(--gold-lifted);}

  /* the header: what this is, whose wording it is, and the mode */
  .ehead{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:22px; flex-wrap:wrap;}
  .ehead .who{min-width:0; flex:1 1 420px;}
  .aw-eyebrow{margin:0 0 6px; font-size:0.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--grey);}
  .ehead input.h1{display:block; width:100%; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:2rem; line-height:1.1; letter-spacing:-0.01em; color:var(--ink);
    margin:0 0 0 -9px; padding:2px 8px; border:1.5px solid transparent; border-radius:8px; background:transparent;}
  .ehead input.h1:hover{border-color:var(--sand-line);}
  .ehead input.h1:focus{background:var(--field);}
  .stateline{margin:8px 0 0; font-size:0.88rem; color:var(--grey); display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .stateline .sep{color:oklch(80% 0.012 80);}
  .stateline .whose{display:inline-flex; align-items:center; gap:6px; font-weight:600;}
  .stateline .whose::before{content:''; width:7px; height:7px; border-radius:50%; background:currentColor;}
  .stateline .mine{color:var(--gold-deep);} .stateline .connect{color:var(--teal);}
  .stateline .short{color:var(--brick); font-weight:600;}
  .modes{display:inline-flex; padding:3px; border-radius:9px; background:oklch(90.5% 0.014 84); flex:none;}
  .modes button{height:34px; padding:0 16px; border-radius:7px; border:none; font-size:0.84rem; font-weight:600; background:none; color:var(--grey); cursor:pointer;}
  .modes button.on{background:var(--paper); color:var(--ink); box-shadow:0 1px 2px oklch(0% 0 0 / .08);}

  /* the two columns */
  .ewrap{display:grid; grid-template-columns:250px minmax(0,1fr); gap:22px; align-items:start;}
  .rail{position:sticky; top:20px; display:flex; flex-direction:column; gap:14px;}
  .rail.open{position:static;}
  .rcard{background:var(--paper); border:1px solid var(--sand-line); border-radius:12px; padding:12px 14px;}
  .rcard.brief{padding:12px 8px 10px;}
  .rlabel{margin:0 0 6px; font-size:0.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--grey);}
  .rcard.brief .rlabel{margin:0 6px 8px;}
  .orow{display:flex; align-items:center; gap:9px; padding:7px 8px 7px 6px; border-radius:8px; text-decoration:none; color:var(--ink); cursor:pointer;}
  .orow:hover{background:var(--sand-deep); color:var(--ink);}
  .orow.on{background:var(--sand-deep); font-weight:700;}
  .orow .bar{width:3px; height:20px; border-radius:2px; flex:none;}
  .orow .n{width:18px; font-size:0.74rem; font-weight:700; color:var(--grey); font-variant-numeric:tabular-nums; flex:none;}
  .orow .l{flex:1; min-width:0; font-size:0.83rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .orow .cdot{width:7px; height:7px; border-radius:50%; background:var(--gold-deep); flex:none;}
  .brieftoggle{display:none;}
  .railadd{display:block; margin:8px 6px 0; padding-top:8px; border-top:1px dashed var(--sand-line); font-size:0.82rem; font-weight:600; text-decoration:none;}
  a.rcard.crit{display:block; text-decoration:none; color:var(--ink);}
  a.rcard.crit:hover{border-color:var(--teal); color:var(--ink);}
  .rcount{font-size:0.86rem; font-weight:700;}
  .rsyl{font-size:0.78rem; margin-top:2px; display:flex; align-items:center; gap:6px; color:var(--teal);}
  .rsyl::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none;}
  .rsyl.short{color:var(--gold-deep);} .rsyl.own{color:var(--grey);}
  .kv{display:flex; justify-content:space-between; gap:10px; font-size:0.82rem; margin-top:7px;}
  .kv span:first-child{color:var(--grey);} .kv span:last-child{font-weight:600; text-align:right;}
  .kv .yes{color:var(--teal);} .kv .no{color:var(--gold-deep);}
  .rcard .lnk.more{margin-top:10px;}

  /* "Change dates": the course's settings for this assignment, inside the rail */
  .meta{margin-top:12px; padding-top:12px; border-top:1px dashed var(--sand-line); display:flex; flex-direction:column; gap:14px;}
  .mf{display:flex; flex-direction:column; gap:5px;}
  .mf > label, .mf > .ml{font-size:0.76rem; font-weight:700; color:var(--ink);}
  .mf .mh{font-size:0.72rem; color:var(--grey); line-height:1.45; margin:0;}
  .mf .mh.bad{color:var(--brick); font-weight:600;}
  .mf .line{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:0.8rem;}
  .meta input[type=text], .meta input[type=number], .meta input[type=datetime-local], .meta select{font-family:'Karla',sans-serif; font-size:0.82rem; padding:6px 8px; min-height:36px;
    border:1.5px solid var(--sand-line); border-radius:6px; color:var(--ink); max-width:100%;}
  .meta input[type=datetime-local]{width:100%;}
  .meta select{width:100%;}
  .meta input.num{width:58px; text-align:center;}
  .dsrow{display:flex; flex-direction:column; gap:3px; padding:6px 0; border-top:1px solid var(--row-line);}
  .dsrow:first-child{border-top:none; padding-top:0;}
  .dsname{font-size:0.78rem;} .dsname small{color:var(--grey);}
  .meta .clear{font-size:0.74rem; align-self:flex-start;}

  /* the document column */
  .doc{display:flex; flex-direction:column; gap:14px; min-width:0;}
  .sec{background:var(--paper); border:1px solid var(--sand-line); border-left:4px solid var(--edge, oklch(80% 0.012 80)); border-radius:12px; padding:16px 20px 18px; scroll-margin-top:24px;
    transition:border-color .15s ease, box-shadow .15s ease;}
  .sec.t-text{--edge:oklch(80% 0.012 80); --chip-bg:oklch(94.8% 0.01 85); --chip-ink:oklch(51% 0.017 70);}
  .sec.t-picker, .sec.t-fields{--edge:var(--teal); --chip-bg:oklch(92% 0.02 195); --chip-ink:var(--teal);}
  .sec.t-declaration{--edge:var(--ink-warm); --chip-bg:oklch(93% 0.01 65); --chip-ink:var(--ink-warm);}
  .sec.aw-changed{--edge:var(--gold-deep);}
  .sec.focus{border-color:var(--teal); border-left-color:var(--edge); box-shadow:0 0 0 3px color-mix(in oklab, var(--teal) 14%, transparent);}
  .shead{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .shead .n{width:22px; font-size:0.74rem; font-weight:700; color:var(--grey); font-variant-numeric:tabular-nums; flex:none;}
  .sec input.slabel{flex:1; min-width:0; font-family:'Newsreader',Georgia,serif; font-size:1.15rem; font-weight:600; color:var(--ink);
    border:1.5px solid transparent; border-radius:6px; padding:3px 8px; background:transparent;}
  .sec input.slabel:hover{border-color:var(--sand-line);}
  .sec input.slabel:focus{background:var(--field);}
  .tchip, .aw-chg{font-size:0.66rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:999px; white-space:nowrap; flex:none;}
  .tchip{background:var(--chip-bg); color:var(--chip-ink);}
  .aw-chg{background:var(--gold-wash); border:1px solid var(--amber-edge); color:var(--gold-deep);}
  .dots{width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border-radius:7px; border:none; background:none;
    color:var(--grey); font-size:1rem; font-weight:700; letter-spacing:.06em; cursor:pointer; flex:none; line-height:1;}
  .dots:hover{background:var(--sand-deep);}

  :where(.sec) textarea, :where(.sec) input[type=text]{font-family:'Karla',sans-serif; color:var(--ink); border:1.5px solid var(--row-line); min-width:0;}
  .sec textarea.body{display:block; width:100%; resize:vertical; font-size:0.9rem; line-height:1.6; padding:11px 13px; border-radius:8px;}
  .sec .intro{display:block; width:100%; font-size:0.86rem; color:var(--grey); padding:7px 10px; border-radius:6px; margin:0 0 12px; border-color:transparent; background:transparent;}
  .sec .intro:hover{border-color:var(--row-line);}
  .sfoot{margin-top:8px; font-size:0.8rem; display:flex; gap:14px; align-items:center; flex-wrap:wrap; color:var(--grey);}
  .sfoot .sp{flex:1;}
  .orig{margin-top:10px; padding:10px 13px; border-radius:8px; background:var(--sand-deep); font-size:0.86rem; line-height:1.6; white-space:pre-wrap; color:var(--ink-warm);}
  .orig .ol{display:block; font-size:0.66rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--grey); margin-bottom:4px; white-space:normal;}

  .cats{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px;}
  .cat{background:oklch(96.8% 0.014 82); border-radius:10px; padding:12px 13px;}
  .cathead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .cat input.catlabel{flex:1; font-size:0.86rem; font-weight:700; padding:3px 6px; margin-left:-6px; border-color:transparent; background:transparent; border-radius:6px;}
  .cat input.catlabel:hover{border-color:var(--row-line);}
  .cat select.rule{font-family:'Karla',sans-serif; font-size:0.7rem; font-weight:700; color:var(--grey); border:1px solid transparent; background:transparent; border-radius:6px; padding:2px 2px; cursor:pointer; flex:none;}
  .cat select.rule:hover{border-color:var(--row-line);}
  .opt{display:flex; align-items:center; gap:6px; margin-bottom:6px;}
  .opt input{flex:1; font-size:0.86rem; padding:7px 10px; border-radius:6px;}
  .cat .catfoot{display:flex; justify-content:space-between; gap:8px; margin-top:4px;}
  .cat .catfoot .lnk.quiet{color:var(--grey); font-weight:500;}
  .frows{display:flex; flex-direction:column; gap:6px;}
  .frow{display:grid; grid-template-columns:220px minmax(0,1fr) 28px; gap:8px; align-items:center;}
  .frow input{font-size:0.86rem; padding:8px 10px; border-radius:6px;}
  .frow input.flabel{font-weight:600;}
  .frow input.fhint{font-size:0.84rem; color:var(--grey);}
  .drows{display:flex; flex-direction:column; gap:6px;}
  .drow{display:flex; align-items:center; gap:10px;}
  .drow .box{width:18px; height:18px; border:1.5px solid oklch(80% 0.012 80); border-radius:4px; flex:none;}
  .drow input{flex:1; font-size:0.88rem; padding:8px 10px; border-radius:6px;}
  .switch{display:inline-flex; align-items:center; gap:8px; color:var(--grey); cursor:pointer; background:none; border:none; padding:2px 4px; border-radius:6px; font-size:0.82rem;}
  .switch .track{width:28px; height:16px; border-radius:999px; background:oklch(80% 0.012 80); position:relative; display:inline-block; transition:background .15s ease;}
  .switch .track::after{content:''; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:var(--paper); transition:left .15s ease;}
  .switch.on .track{background:var(--teal);} .switch.on .track::after{left:14px;}

  .addcard{border:1.5px dashed var(--sand-line); border-radius:12px; padding:14px 18px 16px;}
  .addcard .al{margin:0 0 10px; font-size:0.8rem; font-weight:600; color:var(--grey);}
  .kinds{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px;}
  .kind{padding:10px 12px; border-radius:9px; background:var(--paper); border:1px solid var(--row-line); cursor:pointer; display:flex; gap:10px; align-items:flex-start; text-align:left;}
  .kind:hover{border-color:var(--teal);}
  .kind .bar{width:3px; height:30px; border-radius:2px; flex:none; margin-top:2px;}
  .kind b{display:block; font-size:0.84rem;} .kind small{display:block; font-size:0.76rem; color:var(--grey); line-height:1.4; font-weight:400;}
  .importnote{background:var(--paper); border:1px solid var(--sand-line); border-left:4px solid var(--teal); border-radius:12px; padding:12px 16px; font-size:0.86rem; line-height:1.55;}
  .importnote .lnk{margin-left:8px;}
  .importline{margin:12px 0 0; font-size:0.78rem; color:var(--grey); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  .critcard{background:var(--paper); border:1px solid var(--sand-line); border-radius:12px; padding:18px 20px 20px; margin-top:10px; scroll-margin-top:24px;}
  .critcard .ch{display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:4px; flex-wrap:wrap;}
  .critcard h2{font-family:'Newsreader',Georgia,serif; font-size:1.2rem; font-weight:600; margin:0;}
  .critcard .ch span{font-size:0.8rem; color:var(--grey);}
  .headsrow{margin:8px 0 2px;} .headsrow label{display:block; font-size:0.78rem; font-weight:700; margin:0 0 4px;} .headsrow label span{font-weight:400; color:var(--grey);}
  .headsrow textarea{width:100%; box-sizing:border-box; font:inherit; font-size:0.86rem; line-height:1.5; padding:8px 10px; border:1.5px solid var(--row-line); border-radius:6px; resize:vertical;}
  /* The marking guidance (17 Oct 2026): tutors and the assessor only. */
  .gcard .gfield{display:flex; flex-direction:column; gap:5px; margin-top:12px;}
  .gcard .gfield label{font-size:0.8rem; font-weight:700;}
  .gcard .gfield label span{font-weight:400; color:var(--grey);}
  .gcard textarea{font:inherit; font-size:0.86rem; line-height:1.5; padding:9px 11px; border:1.5px solid var(--row-line); border-radius:6px; min-width:0; width:100%; box-sizing:border-box; resize:vertical;}
  .gcard .gnote{font-size:0.8rem; color:var(--grey); margin:6px 0 0;}
  .gcard .gsaved{font-size:0.78rem; color:var(--grey);}
  .gcard .gtrap{display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:0.9rem;}
  .gcard .gtrap b{letter-spacing:.06em;}
  .crows{display:flex; flex-direction:column; gap:6px; margin-top:12px;}
  .crow{display:grid; grid-template-columns:30px minmax(0,1fr) 90px 30px; gap:10px; align-items:center;}
  .crow .n{font-size:0.78rem; font-weight:700; color:var(--grey); font-variant-numeric:tabular-nums;}
  .crow input{font-size:0.88rem; padding:9px 11px; border:1.5px solid var(--row-line); border-radius:6px; min-width:0;}
  .crow .tie{grid-column:2 / 3; margin:-2px 0 4px 2px; font-size:0.74rem; color:var(--grey);}
  .stag{font-size:0.78rem; color:var(--grey); display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
  .stag::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--teal); flex:none;}
  .stag.own::before{background:none; border:1.5px solid oklch(80% 0.012 80); width:4px; height:4px;}
  .cfoot{display:flex; align-items:center; gap:16px; margin-top:12px; font-size:0.82rem; flex-wrap:wrap; color:var(--grey);}
  .cfoot .short{color:var(--gold-deep); font-weight:600;}
  .sylbox{margin:12px 0 0; border:1px solid var(--row-line); border-radius:8px; background:var(--sand-deep); padding:0 12px;}
  .sylbox summary{cursor:pointer; font-size:0.78rem; font-weight:600; padding:8px 0;}
  .sylbody{padding:0 0 10px; font-size:0.78rem; color:var(--grey);}
  .sylbody p{margin:0 0 8px;}
  .syllist{margin:0 0 8px; padding-left:20px; line-height:1.55; color:var(--ink);}
  .syllist li.only{font-weight:600;}
  .syllist li.only::after{content:' \2014 not on this course'; font-weight:400; opacity:.7;}

  .emptycard{background:var(--paper); border:1px solid var(--sand-line); border-radius:12px; padding:40px 24px; text-align:center; color:var(--grey);}
  .emptycard .acts{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px;}

  /* the menu behind every ··· */
  .menu{position:absolute; z-index:60; min-width:190px; max-width:280px; background:var(--paper); border:1px solid var(--sand-line); border-radius:10px; padding:5px;
    box-shadow:0 10px 28px oklch(30% 0.04 58 / .14);}
  .menu[hidden]{display:none;}
  .menu button{display:block; width:100%; text-align:left; background:none; border:none; border-radius:7px; padding:8px 10px; font-size:0.84rem; cursor:pointer; color:var(--ink);}
  .menu button:disabled{color:oklch(75% 0.012 80); cursor:default;}
  .menu button.danger{color:var(--brick);}
  .menu hr{border:none; border-top:1px solid var(--row-line); margin:4px 2px;}
  .menu .mlabel{font-size:0.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--grey); padding:6px 10px 4px;}
  .menu select{width:calc(100% - 12px); margin:0 6px 6px; font-family:'Karla',sans-serif; font-size:0.82rem; padding:6px 8px; border:1.5px solid var(--sand-line); border-radius:6px;}

  /* As the candidate sees it */
  .wholebar{max-width:760px; margin:0 auto 12px; display:flex; justify-content:flex-end;}
  @media print{ .wholebar, .rail, header, .switcher, .modebar, nav{display:none !important;} .preview{border:none; padding:0;} }
  .preview{max-width:760px; margin:0 auto; background:var(--paper); border:1px solid var(--sand-line); border-radius:14px; padding:36px 44px 40px;}
  .preview .pe{margin:0 0 8px; font-size:0.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--grey);}
  .preview h2{font-family:'Newsreader',Georgia,serif; font-size:1.9rem; font-weight:600; margin:0 0 4px; line-height:1.1;}
  .preview .pm{margin:0 0 26px; font-size:0.88rem; color:var(--grey);}
  .psec{padding:18px 0; border-top:1px solid var(--row-line);}
  .psec h3{font-family:'Newsreader',Georgia,serif; font-size:1.15rem; font-weight:600; margin:0 0 8px;}
  .psec .pb{font-size:0.92rem; line-height:1.65; white-space:pre-wrap;}
  .psec .pb.grey{color:var(--grey);}
  .pwrite{margin-top:10px; height:92px; border:1.5px dashed var(--sand-line); border-radius:8px; background:var(--sand); display:flex; align-items:center; justify-content:center;
    font-size:0.82rem; color:var(--grey); font-style:italic;}
  .pcats{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:6px;}
  .pcat b{display:block; font-size:0.88rem;} .pcat small{color:var(--grey); font-size:0.76rem;}
  .pcat ul{margin:6px 0 0; padding-left:18px; font-size:0.88rem; line-height:1.6;}
  .pfield{margin-top:12px;} .pfield b{font-size:0.9rem;} .pfield .ph{font-size:0.82rem; color:var(--grey);}
  .pfield .pwrite{height:56px; margin-top:6px;}
  .pdecl{font-size:0.9rem; line-height:1.7;}
  .pcrit{margin:0; padding-left:20px; font-size:0.9rem; line-height:1.65;}

<script type="text/x-hub-app">
/* Whose room this is. Course admin and the wording editor are the centre's;
   an assessor or a trainee who reaches either used to get the full editable

if (window.hubCentreRoomOnly && hubCentreRoomOnly())
  // Deliberate: this halts the rest of the block. The message is written for
  // whoever finds it in a console, so it does not read as a crash.
  throw new Error('Connect Lite: stopping this page on purpose — the centre’s room is not open to this link.');

const STORE_KEY = 'connect_assignment_wording_v2';

const DEFAULT_DATA = window.CONNECT_HUB_DEFAULT_WORDING;

function normaliseAll(w){
  if (window.hubWordingFilled) hubWordingFilled(w);   // an assignment holding only a deadline
  Object.keys(w).forEach(k => {
    const a = w[k]; if (!a || !a.criteria) return;
    a.criteria = a.criteria.map(c => typeof c === 'string' ? {text:c, sectionIndex:null} : c);
  });

}
let DATA = null;
try { DATA = JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e) {}
if (!DATA) DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
normaliseAll(DATA);

let ORDER = ['fol','lrt','lsrt','lfc','a5'];
const NAMES = { lrt:'LRT — Language Related Tasks', lsrt:'LSRT — Language Skills Related Tasks', fol:'FOL — Focus on the Learner', lfc:'LFC — Lessons from the Classroom', a5:'Assignment 5' };
const CODES = { lrt:'LRT', lsrt:'LSRT', fol:'FOL', lfc:'LFC', a5:'A5' };

// Course admin's rows open the editor on that assignment (?a=key); the pills still switch.
let CURRENT = (function(){ const q = new URLSearchParams(location.search).get('a'); return /^(fol|lrt|lsrt|lfc|a5)$/.test(q||'') ? q : 'lrt'; })();
/* Came from the marking page (18 Oct 2026, Ramy: "it should take me back to the assignment marking"):
   the way back goes there, to the same trainee and assignment, not to Course admin. */
(function(){
  const q = new URLSearchParams(location.search), l = document.getElementById('backLink');
  if (l && q.get('from') === 'marking' && q.get('trainee')) { l.href = '10_tutor_assignment_marking.html?a=' + encodeURIComponent(q.get('a') || '') + '&trainee=' + encodeURIComponent(q.get('trainee')); l.textContent = 'Back to marking'; }

let MODE = new URLSearchParams(location.search).get('view') === 'whole' ? 'preview' : 'edit';          // 'edit' | 'preview'; ?view=whole opens the whole assignment (17 Oct 2026)
let FOCUS = null;           // the section being worked on
let SHOW_META = new URLSearchParams(location.search).get('dates') === '1';      // "Change dates" open in the rail; Course admin's "Change" opens it
let IMPORT_NOTE = null;    // what the last import did, said once at the top of the document

const OPEN_ORIG = new Set(); // sections showing Connect's original under them
const $ = id => document.getElementById(id);

/* ---- what is saved, what is Connect's, what is yours ------------------------
   The 7 Oct comparison, reused: DATA (edited in memory as you type) against
   DEFAULT_DATA (Connect's shipped wording) and against the record saved for
   this course. Dates, release and who sets it are the course's settings, not
   wording, so they never make an assignment "yours". */
const SETTINGS_KEYS = ['dueAt', 'due', 'dueSets', 'resubDueAt', 'outAt', 'setBy', 'released', 'savedAt'];
const clone = x => JSON.parse(JSON.stringify(x));
const normC = a => { if (!a) return 'null'; const c = clone(a); (c.criteria || []).forEach((x, i) => { if (typeof x === 'string') c.criteria[i] = { text: x, sectionIndex: null }; }); return JSON.stringify(c); };

function isEdited(k){ return !!(DATA[k] && DEFAULT_DATA && DEFAULT_DATA[k] && wording(DATA[k]) !== wording(DEFAULT_DATA[k])) || !!(DATA[k] && DEFAULT_DATA && !DEFAULT_DATA[k]); }
function sectionChanged(k, i){
  const a = DATA[k], d = DEFAULT_DATA && DEFAULT_DATA[k];
  if (!a || !a.sections[i]) return false;
  if (!d) return true;

  return shipped.indexOf(JSON.stringify(a.sections[i])) < 0;
}
/* Connect's own version of a section: the shipped one of the same kind with
   the same heading, or failing that the one in the same place. */
function originalOf(i){
  const a = DATA[CURRENT], d = DEFAULT_DATA && DEFAULT_DATA[CURRENT];
  if (!a || !d) return null;
  const s = a.sections[i]; if (!s) return null;
  const norm = t => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
  const byLabel = (d.sections || []).find(x => x.type === s.type && norm(x.label) === norm(s.label));
  if (byLabel) return byLabel;
  /* Same place, same kind -- but only if the words are recognisably the same
     section reworded, not a centre's own brief that happens to sit there. */
  const p = (d.sections || [])[i];
  if (!p || p.type !== s.type) return null;
  const words = x => new Set(String(JSON.stringify(x.body || x.items || x.fields || x.cats || '')).toLowerCase().match(/[a-z]{3,}/g) || []);
  const A = words(s), B = words(p); if (!A.size || !B.size) return null;
  let both = 0; A.forEach(w => { if (B.has(w)) both++; });
  return both / Math.max(A.size, B.size) >= 0.5 ? p : null;
}
/* What has not been saved, named the way the save bar says it. */
function changeUnits(k){
  const a = DATA[k], b = base()[k];
  if (!a) return [];
  if (!b) return ['the whole assignment'];
  if (normC(a) === normC(b)) return [];
  const u = [];
  if ((a.title || '') !== (b.title || '')) u.push('the title');
  const as = a.sections || [], bs = b.sections || [];
  for (let i = 0; i < Math.max(as.length, bs.length); i++) {
    if (JSON.stringify(as[i]) === JSON.stringify(bs[i])) continue;
    u.push(i < as.length ? 'section ' + (i + 1) : 'a removed section');
  }
  if (JSON.stringify(a.criteria || []) !== JSON.stringify(b.criteria || [])) u.push('the criteria');
  if ((a.wordMin || 0) !== (b.wordMin || 0) || (a.wordMax || 0) !== (b.wordMax || 0)) u.push('the word range');
  if ((a.format || '') !== (b.format || '')) u.push('the format');
  if ((a.resubDays || 0) !== (b.resubDays || 0)) u.push('the resubmission days');

}
function allUnsaved(){
  const out = {};
  Object.keys(DATA).forEach(k => { if (k === '_order' || !DATA[k] || typeof DATA[k] !== 'object' || Array.isArray(DATA[k])) return; const u = changeUnits(k); if (u.length) out[k] = u; });
  return out;
}
const andList = xs => xs.length <= 1 ? (xs[0] || '') : xs.slice(0, -1).join(', ') + ' and ' + xs[xs.length - 1];

/* SAVE writes the whole wording for the course, as it always has; hub-sync
   carries it to the store. Each assignment that changed takes the time. */
function persist(){
  const unsaved = allUnsaved(), now = new Date().toISOString();
  Object.keys(unsaved).forEach(k => { DATA[k].savedAt = now; });

}
/* The switches that take effect at once -- release, the dates, who sets it,
   the order -- write only themselves. (They used to write the whole record,
   so moving a due date quietly saved every half-finished edit with it.) */
function persistSettings(){
  const rec = savedRecord();
  if (!rec) {
    // nothing saved on this course yet: Connect's wording with this one's settings
    const b = normaliseAll(clone(DEFAULT_DATA || {}));
    if (DATA._order) b._order = DATA._order.slice();
    if (DATA[CURRENT] && !b[CURRENT]) b[CURRENT] = clone(DATA[CURRENT]);
    else if (DATA[CURRENT]) SETTINGS_KEYS.forEach(k => { if (k !== 'savedAt' && DATA[CURRENT][k] !== undefined) b[CURRENT][k] = clone(DATA[CURRENT][k]); });
    localStorage.setItem(STORE_KEY, JSON.stringify(b));
  } else {
    if (DATA._order) rec._order = DATA._order.slice(); else delete rec._order;
    const a = DATA[CURRENT];
    if (a && !rec[CURRENT]) rec[CURRENT] = clone(a);
    else if (a) SETTINGS_KEYS.forEach(k => { if (k === 'savedAt') return; if (a[k] === undefined) delete rec[CURRENT][k]; else rec[CURRENT][k] = clone(a[k]); });

  }
}
async function discardChanges(){
  const unsaved = allUnsaved(), n = Object.values(unsaved).reduce((t, u) => t + u.length, 0);
  if (!n) return;

  if (!ok) return;

/* Warn on leaving only once someone has edited here. On a first visit the
   course arrives after the page has drawn and hub-sync reloads it; the
   record then differs from what this page had in memory, and without the
   flag that reload asked "Leave site?" (11 Oct 2026). */
let TOUCHED = false;
['input', 'change'].forEach(t => document.addEventListener(t, e => { if (e.target.closest && e.target.closest('#body, #ehead')) TOUCHED = true; }, true));

/* ---- the assignment pills ---------------------------------------------------- */
function renderSwitcher(){
  ORDER = hubAssignmentOrder(DATA);
  $('switcher').innerHTML = ORDER.map(key => {
    const has = !!DATA[key];
    const held = has && key !== 'a5' && !hubReleased(DATA, key);

  }).join('');
}
$('switcher').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.dataset.a === CURRENT) return;

  try { const q = new URLSearchParams(location.search); q.set('a', CURRENT); history.replaceState(null, '', '?' + q.toString()); } catch (err) {}   // keeps the course key
  render(); window.scrollTo(0, 0);
});
// The centre's order: move one of the four earlier or later; Assignment 5 stays last.
function moveAssignment(key, dir){
  const core = hubAssignmentOrder(DATA).filter(k => k !== 'a5');
  const i = core.indexOf(key), j = i + dir;
  if (i < 0 || j < 0 || j >= core.length) return;
  core.splice(i, 1); core.splice(j, 0, key);
  DATA._order = core;
  persistSettings(); render();
}

/* ---- the header -------------------------------------------------------------- */
function proseCount(){ return ['fol','lrt','lsrt','lfc'].filter(k => DATA[k] && DATA[k].format === 'prose').length; }
function savedLine(){
  const b = base()[CURRENT];
  const at = b && b.savedAt ? new Date(b.savedAt) : null;
  if (!at || !isFinite(at.getTime())) {
    const rec = savedRecord();
    return rec && rec[CURRENT] && DEFAULT_DATA && DEFAULT_DATA[CURRENT] && wording(rec[CURRENT]) !== wording(DEFAULT_DATA[CURRENT]) ? 'Saved on this course' : 'Never edited on this course';
  }

  const day = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const diff = Math.round((day(new Date()) - day(at)) / 86400000);
  if (diff === 0) return 'Last saved today, ' + hm;
  if (diff === 1) return 'Last saved yesterday, ' + hm;

}
function stateHTML(){
  const a = DATA[CURRENT]; if (!a) return '<span>Not set up on this course yet</span>';
  const m = a.sections.length, mine = a.sections.filter((s, i) => sectionChanged(CURRENT, i)).length;
  const edited = isEdited(CURRENT);

    edited ? '<span class="whose mine">Your wording</span>' : '<span class="whose connect">Connect’s wording</span>',
    `<span>${mine ? mine + ' of ' + m + ' sections are yours' : edited ? 'Every section as shipped' : m + ' section' + (m === 1 ? '' : 's') + ', as shipped'}</span>`,
    `<span>${esc(savedLine())}</span>`

/* ---- the rail ---------------------------------------------------------------- */
const EDGE = { text:'oklch(80% 0.012 80)', picker:'var(--teal)', fields:'var(--teal)', declaration:'var(--ink-warm)' };
function railHTML(a){

  const resub = a.resubDueAt ? 'By ' + HubDue.fmt(a.resubDueAt) : a.resubDays ? a.resubDays + ' day' + (a.resubDays === 1 ? '' : 's') : 'Open';

  return `<aside class="rail${SHOW_META ? ' open' : ''}" id="rail">

/* WHAT THE SYLLABUS ITSELF SAYS, beside what this centre uses. Designing the
   assignments is the centre's job (9.2.1) and these criteria are the centre's
   to set -- but they had been described in the code as "the syllabus's own
   words", which they are not (audit, 29 Sep 2026). So the syllabus's set is
   shown, never imposed. Adopting it is one click and it is REFUSED once any
   marking exists, because criteriaMarks are positional. */
function syllabusCriteria(){ return (window.CONNECT_HUB_SYLLABUS_CRITERIA || {})[CURRENT] || null; }
const SYL_REF = { fol:'2.1', lrt:'2.2', lsrt:'2.3', lfc:'2.4' };
/* Compare on letters and digits only, so "sub-skills" and "subskills" are
   the same criterion and only a real difference in wording shows. */
const normT = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g, '');
function sylState(){
  const syl = syllabusCriteria(); if (!syl || !DATA[CURRENT]) return null;
  const mine = (DATA[CURRENT].criteria || []).map(c => (typeof c === 'string' ? c : c.text) || '');
  const here = syl.filter(t => mine.some(m => normT(m) === normT(t))).length;
  const same = mine.length === syl.length && syl.every((t, i) => normT(t) === normT(mine[i]));
  return { syl, mine, ref: SYL_REF[CURRENT], n: syl.length, here, all: here === syl.length, same };
}
const WORDS = ['none','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const word = n => WORDS[n] || String(n);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function sylFootHTML(){
  const st = sylState(); if (!st) return '<span>The centre’s own criteria. The syllabus sets none for this one.</span>';
  if (st.all) return `<span>Syllabus ${esc(st.ref)} names ${word(st.n)}. ${st.n === 1 ? 'It is here.' : (st.n === 2 ? 'Both' : 'All ' + word(st.n)) + ' are here.'}</span>`;
  return `<span class="short">Syllabus ${esc(st.ref)} names ${word(st.n)}. ${cap(word(st.here))} ${st.here === 1 ? 'is' : 'are'} here.</span>`;
}
function syllabusPanel(){
  const st = sylState(); if (!st || st.same) return '';
  const missing = st.syl.filter(t => !st.mine.some(m => normT(m) === normT(t)));
  const extra = st.mine.filter(m => !st.syl.some(t => normT(t) === normT(m)));
  return `<details class="sylbox"><summary>The syllabus has ${st.n} for assignment ${esc(st.ref)}; this course uses ${st.mine.length}</summary>
    <div class="sylbody">
      <p>Designing the four assignments is the centre's job (Handbook 9.2.1), so these may differ on purpose. What matters is not calling them Cambridge's when they are not.</p>
      <ol class="syllist">${st.syl.map(t => `<li${missing.indexOf(t) > -1 ? ' class="only"' : ''}>${esc(t)}</li>`).join('')}</ol>
      ${extra.length ? `<p><b>Only on this course:</b> ${extra.map(esc).join(' · ')}</p>` : ''}
      <button type="button" class="lnk" onclick="adoptSyllabus()">Use the syllabus's ${st.n} instead</button>
    </div></details>`;
}
function critTag(text){
  const syl = syllabusCriteria(), ref = SYL_REF[CURRENT];
  const k = syl ? syl.findIndex(t => normT(t) === normT(text)) : -1;
  return k > -1 ? `<span class="stag" title="The syllabus's own words">${esc(ref)} ${'abcdefghijklmnopqrstuvwxyz'.charAt(k)}</span>` : `<span class="stag own" title="Not in the syllabus's words">this course</span>`;
}
function critCardHTML(a){
  const tieable = a.sections.map((s, si) => ({ s, si })).filter(x => x.s.type !== 'declaration' && x.s.type !== 'picker');
  return `<div class="critcard" id="critcard">

    <div class="crows">${(a.criteria || []).map((c, ci) => {

        <span data-tag="${ci}">${critTag(c.text)}</span>
        <button type="button" class="dots" title="Tie to a section, or remove" aria-label="More for criterion ${ci + 1}" onclick="openCritMenu(this, ${ci})">···</button>
        ${tied ? `<span class="tie">Tied to section ${c.sectionIndex + 1}, ${esc(a.sections[c.sectionIndex].label)}</span>` : ''}
      </div>`; }).join('')}</div>
    <div class="cfoot"><button type="button" class="lnk" onclick="addCriterion()">+ Add a criterion</button><span id="sylfoot">${sylFootHTML()}</span></div>
    ${syllabusPanel()}
    <p class="cfoot" style="font-size:0.76rem;">Shown to trainees alongside the instructions (Handbook 9.2.1: the criteria should be made explicit). Tying a criterion to a section lets that section lock on resubmission once it is met, instead of reopening the whole assignment.</p>
  </div>`;
}

/* ---- The marking guidance (17 Oct 2026) ---------------------------------------

function guideRecord(){ try { return JSON.parse(localStorage.getItem(GUIDE_KEY) || 'null'); } catch (e) { return null; } }

    <div class="gfield"><label for="g_general">How to mark this assignment <span>(before you mark, resubmission, fairness)</span></label>${ta('g_general', x.general, 8, 'How to mark this assignment')}</div>
    ${crit.map((c, ci) => `<div class="gfield"><label for="g_c${ci}">Criterion ${ci + 1} <span>${esc(c.text)}</span></label>${ta('g_c' + ci, (x.crit || [])[ci], 4, 'Guidance for criterion ' + (ci + 1))}</div>`).join('')}
    <div class="gfield"><label for="g_sections">Section by section <span>(what a Met answer looks like, common shortfalls)</span></label>${ta('g_sections', x.sections, 10, 'Section by section')}</div>

let GUIDE_T = null;
function guideInput(){
  const el = $('gsaved'); if (el) el.textContent = 'Saving…';
  clearTimeout(GUIDE_T);
  GUIDE_T = setTimeout(() => {
    const g = guideRecord() || {}, items = Object.assign({}, g.items || {});

  }
}

   section when every criterion tied to it was marked met. Reordering or
   deleting a section must carry the ties with it (walk, 21 Sep 2026). Import
   and Add only ever append, so they cannot disturb an existing index. */
function retieCriteria(remap){
  const crit = DATA[CURRENT].criteria || [];
  crit.forEach(c => { if (c.sectionIndex != null) c.sectionIndex = remap(c.sectionIndex); });
}
function moveSection(i, dir){
  const arr = DATA[CURRENT].sections;
  const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  // the two that swapped places swap their criteria with them
  retieCriteria(n => n === i ? j : n === j ? i : n);
  const oi = OPEN_ORIG.has(i), oj = OPEN_ORIG.has(j);
  OPEN_ORIG.delete(i); OPEN_ORIG.delete(j); if (oi) OPEN_ORIG.add(j); if (oj) OPEN_ORIG.add(i);
  FOCUS = j;
  render();
  const el = $('sec-' + j); if (el) el.scrollIntoView({ block:'nearest' });
}
function removeSection(i){
  const secs = DATA[CURRENT].sections || [];
  if ((secs[i] || {}).type === 'declaration' && secs.filter(x => x && x.type === 'declaration').length <= 1) {
    alert('The declaration stays.\n\nWithout this section the submission form has nothing to gate on, and would let work through with no confirmation at all. (Handbook 9.2.3 says trainees should confirm in writing that the work is their own.)\n\nYou can reword every line of it.');
    return;
  }
  secs.splice(i,1);
  /* A criterion tied to the section that just went becomes general rather than
     pointing at whatever slid into its place. */
  retieCriteria(n => n === i ? null : n > i ? n - 1 : n);
  OPEN_ORIG.clear(); FOCUS = null;
  render();
}
function toggleOrig(i){ if (OPEN_ORIG.has(i)) OPEN_ORIG.delete(i); else OPEN_ORIG.add(i); render(); }
/* Restore puts Connect's shipped section back in place; criteria ties stay,
   because the section keeps its position. Not saved until Save. */
function restoreSection(i){
  const o = originalOf(i); if (!o) return;
  DATA[CURRENT].sections[i] = clone(o);
  OPEN_ORIG.delete(i);
  render();
}
function updateDeclItem(i, di, v){ DATA[CURRENT].sections[i].items[di] = v; }
function addDeclItem(i){ DATA[CURRENT].sections[i].items.push(''); render(); const rows = document.querySelectorAll(`#sec-${i} .drow input`); if (rows.length) rows[rows.length - 1].focus(); }
function removeDeclItem(i, di){
  const items = DATA[CURRENT].sections[i].items || [];
  if (items.length <= 1) { alert('The declaration keeps at least one line — otherwise there is nothing for the trainee to confirm, and the submission gate passes on an empty list.'); return; }
  items.splice(di,1); render();
}
function toggleAi(i, checked){ DATA[CURRENT].sections[i].aiToggle = checked; render(); }
/* Word files too (27 Sep 2026): hub-docx.js turns a .docx into the same
   plain text -- one paragraph per line, Word headings as "# " lines with a
   blank line before them -- so the section rule below sees them as sections. */
/* FROM A FILE'S TEXT TO SECTIONS (12 Oct 2026). Every blank line used to
   start a section, so IH's own LRT brief, which has no Word heading styles
   and an empty line between most paragraphs, arrived as 53 sections, most
   of them one line long. Now only a heading starts one:
     - a file with headings ("# ", which is what a Word heading style becomes)
       is split at its headings and nowhere else;
     - a file without them is split at lines that read as titles: one short
       line on its own, with no full stop at the end, or ending in a colon.
       Everything else joins the section above it, paragraphs kept.
   Text before the first heading is "Before you start", as on Lite's own
   briefs. A heading with nothing under it joins the next section. */
function sectionsFromText(text){
  const src = String(text || '').replace(/\r\n?/g, '\n');
  const out = [];
  const add = label => { const sec = { type:'text', label, body:'' }; out.push(sec); return sec; };
  const append = (sec, chunk) => { sec.body = sec.body ? sec.body + '\n\n' + chunk : chunk; };
  if (/^#{1,3}\s+\S/m.test(src)) {
    let cur = null, buf = [];
    const close = () => { const b = buf.join('\n').replace(/\n{3,}/g, '\n\n').trim(); if (b) { if (!cur) cur = add('Before you start'); append(cur, b); } buf = []; };
    src.split('\n').forEach(line => {
      const m = line.match(/^#{1,3}\s+(.*\S)\s*$/);
      if (m) { close(); cur = add(m[1].slice(0, 120)); } else buf.push(line);
    });
    close();
  } else {
    const blocks = src.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
    const titleLike = b => b.indexOf('\n') < 0 && b.indexOf('\t') < 0 && b.length <= 70
      && !/^([•●▪\-*–]|\d+[.)]\s)/.test(b) && (/:$/.test(b) || !/[.!?;,]$/.test(b));
    let cur = null;
    blocks.forEach((b, i) => {
      if (titleLike(b) && i < blocks.length - 1) cur = add(b.replace(/:$/, '').trim());
      else { if (!cur) cur = add('Before you start'); append(cur, b); }
    });
  }
  // a heading with nothing under it joins the section after it (or before, at the end)
  for (let i = out.length - 1; i >= 0; i--) {
    if (out[i].body) continue;
    if (out[i + 1]) out[i + 1].body = out[i].label + (out[i + 1].body ? '\n\n' + out[i + 1].body : '');
    else if (out[i - 1]) append(out[i - 1], out[i].label);
    else continue;
    out.splice(i, 1);
  }
  return out.filter(x => x.body || x.label);
}
/* A brief usually opens with its own title ("Focus on the Learner"), which
   the page already shows above it, so the candidate read it twice (12 Oct
   2026). A heading among the first two that repeats the assignment's title
   (or its long name) goes; the text under it stays, as "Before you start",
   joined to any text that came before it. */
function dropTitleHeading(secs, title){
  const k = t => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, '').replace(/s$/, '');
  const names = [title, (NAMES[CURRENT] || '').split('—').pop()].map(k).filter(Boolean);
  const i = secs.slice(0, 2).findIndex(x => names.indexOf(k(x.label)) > -1);
  if (i < 0) return secs;
  const hit = secs[i], prev = i > 0 ? secs[i - 1] : null;
  if (prev && prev.label === 'Before you start') { if (hit.body) prev.body = prev.body ? prev.body + '\n\n' + hit.body : hit.body; secs.splice(i, 1); }
  else if (hit.body) hit.label = 'Before you start';
  else secs.splice(i, 1);
  return secs;
}
async function handleImport(file){
  if(!file) return;
  let text = '';
  try { text = await window.hubFileText(file); } catch (err) { alert(err && err.message ? err.message : 'That file could not be read.'); return; }
  const sections = dropTitleHeading(sectionsFromText(text), DATA[CURRENT] ? DATA[CURRENT].title : '');
  if (!sections.length) { alert('Could not find any text to import from that file.'); return; }
  const n = sections.length, what = `${n} section${n===1?'':'s'}`;
  const a = DATA[CURRENT];

  /* Nothing here yet: the file becomes the assignment, with the floors a
     blank one starts with (a word range, a criterion, the declaration). */
  if (!a) {
    const ok = await confirmModal(`Found ${what} in this file. They become ${NAMES[CURRENT]} on this course, with one answer box at the end and the own-work declaration. Continue?`, 'Use this file');
    if (!ok) return;
    DATA[CURRENT] = {
      title: file.name.replace(/\.[^.]+$/,''), wordMin: 750, wordMax: 1000,
      criteria: [{ text: 'Using written language that is clear, accurate and appropriate to the task', sectionIndex: null }],
      sections: replacedSections(sections, null)
    };
    IMPORT_NOTE = { file: file.name, n, replaced: true };
    render(); window.scrollTo(0, 0); return;
  }

  /* REPLACE OR ADD (12 Oct 2026). Ramy: "if a center doesn't want to use
     Connect's assignments ... they can just upload theirs." Replace swaps the
     wording for the file's; Add puts the file's sections after what is here.
     Replace is refused once a candidate has started this assignment: answers
     are stored by the section's POSITION, so swapping the sections under a
     draft would put every answer beside the wrong heading. */
  const started = countStarted();
  const choice = await chooseModal(
    `Found ${what} in this file.\n\nReplace: the file's sections take the place of this assignment's wording. They are for reading, with one answer box at the end. The declaration stays and the criteria stay; check the criteria before you save.\n\nAdd: the file's sections go after the ones already here, each with an answer box.`
      + (started ? `\n\nReplace is not available: ${started} candidate${started === 1 ? ' has' : 's have'} already started this assignment, and their answers are kept by section.` : ''),
    [ started ? null : { key: 'replace', label: 'Replace the wording', primary: true },
      { key: 'add', label: 'Add to the end', primary: !!started } ].filter(Boolean));
  if (!choice) return;
  if (choice === 'add') {
    a.sections = a.sections.concat(sections);
    IMPORT_NOTE = { file: file.name, n, replaced: false };
  } else {
    a.sections = replacedSections(sections, a.sections);
    // the old ties pointed at sections that have gone: every criterion becomes general
    (a.criteria || []).forEach(c => { if (c && typeof c === 'object') c.sectionIndex = null; });
    IMPORT_NOTE = { file: file.name, n, replaced: true };
  }
  OPEN_ORIG.clear(); FOCUS = null;
  render(); window.scrollTo(0, 0);
}
/* The file's sections for reading, one answer box after them, then the
   declaration this assignment already has (or Lite's own). */
function replacedSections(imported, old){
  const decl = (old || []).filter(x => x && x.type === 'declaration').map(clone);
  return imported.map(x => Object.assign({}, x, { readonly: true }))
    .concat([{ type:'text', label:'Your assignment', body:'Write your assignment here, following the brief above.' }])
    .concat(decl.length ? decl : [{ type:'declaration', label:'Declaration', items:['This assignment is my own work.'], aiToggle:true }]);
}
/* Candidates who have written anything on this assignment, draft or sent. */
function countStarted(){
  const wrote = x => {
    if (!x || typeof x !== 'object') return false;
    return ['draft', 'sub1', 'sub2', null].some(k => {
      const r = k ? x[k] : x; if (!r || typeof r !== 'object') return false;
      const t = Object.values(r.text || {}).some(v => String(v || '').trim());
      const f = Object.values(r.fields || {}).some(v => String(v || '').trim());
      return t || f || (r.stage && r.stage !== 'draft');
    }) || (x.stage && x.stage !== 'draft');
  };
  try {
    const subs = JSON.parse(localStorage.getItem('connect_assignment_submissions_v1') || 'null');
    const roster = JSON.parse(localStorage.getItem('connect_roster_v1') || 'null');
    const all = [];
    if (subs && subs[CURRENT]) all.push(subs[CURRENT]);
    if (roster && roster.trainees) Object.values(roster.trainees).forEach(t => { const x = ((t || {}).assignments || {})[CURRENT]; if (x) all.push(x); });
    return all.filter(wrote).length;
  } catch (e) { return 0; }
}
/* A choice of two or more, in the house's confirm dialog. Resolves with the
   chosen key, or null for Cancel / Escape / a click outside. */
function chooseModal(message, choices){
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'confirm-overlay';
    ov.innerHTML = '<div class="confirm-modal" role="alertdialog" aria-modal="true" style="border-top-color:var(--teal); max-width:460px;"><p class="confirm-message" style="white-space:pre-line;"></p><div class="confirm-actions" style="flex-wrap:wrap;"><button type="button" class="confirm-cancel">Cancel</button></div></div>';
    ov.querySelector('.confirm-message').textContent = message;
    const acts = ov.querySelector('.confirm-actions');
    choices.slice().sort((x, y) => (x.primary ? 1 : 0) - (y.primary ? 1 : 0)).forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.textContent = c.label;
      b.className = c.primary ? 'confirm-action' : 'confirm-cancel';
      if (c.primary) b.style.cssText = 'background:var(--teal); border-color:var(--teal); color:var(--paper);';
      b.addEventListener('click', () => done(c.key)); acts.appendChild(b); });
    function done(k){ document.removeEventListener('keydown', esc); ov.remove(); resolve(k); }
    function esc(e){ if (e.key === 'Escape') done(null); }
    ov.querySelector('.confirm-cancel').addEventListener('click', () => done(null));
    ov.addEventListener('click', e => { if (e.target === ov) done(null); });
    document.addEventListener('keydown', esc);
    document.body.appendChild(ov);
    const first = acts.querySelector('button:last-child'); if (first) first.focus();
  });
}
/* The five kinds of section. "A text to work from" is an instructions section
   the candidate only reads: `readonly: true`, no answer box. */
function addSection(kind){
  const arr = DATA[CURRENT].sections;
  if (kind==='text') arr.push({ type:'text', label:'New section', body:'' });
  else if (kind==='read') arr.push({ type:'text', label:'The text', body:'', readonly:true });
  else if (kind==='fields') arr.push({ type:'fields', label:'New fields block', intro:'', fields:[{label:'New field', hint:''}] });
  else if (kind==='picker') arr.push({ type:'picker', label:'Pick your items', cats:[{key:'A', label:'Group A', options:['Item 1','Item 2'], pick:1, fixed:false}, {key:'B', label:'Group B', options:['Item 1','Item 2'], pick:1, fixed:false}] });
  else if (kind==='declaration') arr.push({ type:'declaration', label:'Declaration', items:['This is my own work.', 'All sources are referenced, in the format (Author, Year, p. ##).'], aiToggle:true });
  else return;
  const i = arr.length - 1;
  FOCUS = i; render();
  const el = $('sec-' + i);
  if (el) { el.scrollIntoView({ block:'center' }); const lab = el.querySelector('input.slabel'); if (lab) { lab.focus({ preventScroll:true }); lab.select(); } }
}
function startBlank(){
  const marked = countMarked();
  if (marked) { alert('Not while marking exists.\n\n' + marked + ' submission' + (marked === 1 ? ' has' : 's have') + ' criterion marks on this assignment; a blank assignment would leave those marks pointing at criteria that no longer exist.'); return; }
  const parts = NAMES[CURRENT].split('—');
  /* A blank assignment still arrives with the three things Cambridge asks
     every assignment to carry: a word range inside 750-1,000 (9.2.1), at
     least one criterion made explicit to trainees, and the own-work
     declaration. All of them are editable; none of them starts missing. */
  DATA[CURRENT] = {
    title: (parts[1] ? parts[1].trim() : 'New assignment'),
    wordMin: 750, wordMax: 1000,
    criteria: [{ text: 'Using written language that is clear, accurate and appropriate to the task', sectionIndex: null }],
    sections: [
      { type:'text', label:'Before you start', body:'' },
      { type:'declaration', label:'Before you submit', items:['This assignment is my own work.'], aiToggle:true }
    ]
  };
  render();
}

render();
/* The sync pill and the dictation controls ride above the save bar, not on it. */
if (window.hubReserveForBar) hubReserveForBar('#savebar');
</script>
