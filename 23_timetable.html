    if (el.checked) next.push(n);
    next.sort();
    if (!next.length) { render(); return; }
    if (!(await ask('Lay the course days out again on ' + next.map(x => DOW[x]).join(', ') + '? Sessions and notes on a day that is still a course day are kept; the teaching practices are dealt again.', 'Rebuild'))) { render(); return; }
    TT.meets = next;
    build(true);
  }));
}

/* ---- the board, edited in place (tutors) ---------------------------------
   A tile's bottom edge changes its length and everything after it on that day
   moves with it; dragging a tile moves it and pushes down whatever it lands
   on; a click opens the tile. On a phone a tap opens it -- dragging there
   would fight the finger scrolling between days. Undo is one step back. */
const UNDO = [];
const dayOfDate = date => (TT.days || []).find(d => d.date === date);
function remember(){ UNDO.push(JSON.stringify(TT.days)); if (UNDO.length > 40) UNDO.shift(); }
function undo(){ if (!UNDO.length) return; TT.days = JSON.parse(UNDO.pop()); closePop(); save('Undone'); render(); }

/* Overlaps are solved by pushing down: whatever a tile lands on moves later,
   and so on to the end of the day. */
function settle(day, keep){
  /* the tile just placed keeps its spot over one that starts at the same time */
  day.sessions.sort((a, b) => byStart(a, b) || (a === keep ? -1 : b === keep ? 1 : 0));
  for (let i = 1; i < day.sessions.length; i++) {
    const prev = day.sessions[i - 1], t = day.sessions[i];
    if (toMin(t.s) < toMin(prev.e)) {
      if (t === keep && toMin(prev.s) >= toMin(t.s)) continue;
      const shift = toMin(prev.e) - toMin(t.s);
      t.s = toHM(toMin(t.s) + shift); t.e = toHM(toMin(t.e) + shift);
    }
  }
}

let DRAG = null;
function placeTiles(day){
  const B = bounds();
  day.sessions.forEach(x => {
    const el = document.querySelector(`.tile[data-date="${day.date}"][data-id="${x.id}"]`); if (!el) return;
    const s = toMin(x.s), e = toMin(x.e);
    el.style.top = ((s - B.from) * PXM) + 'px'; el.style.height = Math.max(12, (e - s) * PXM - 2) + 'px';
    const tm = el.querySelector('.tm'); if (tm) tm.textContent = hubClockRange(x.s, x.e);
  });
}
function wireBoard(){
  if (wireBoard.done) return; wireBoard.done = true;
  document.addEventListener('pointerdown', e => {
    if (!EDIT || e.button !== 0) return;
    const tile = e.target.closest('.tile'); if (!tile) return;
    const day = dayOfDate(tile.dataset.date); if (!day) return;
    const x = day.sessions.find(s => s.id === tile.dataset.id); if (!x) return;
    const resize = !!e.target.dataset.rs;
    DRAG = { day, x, y: e.clientY, resize, touch: e.pointerType === 'touch' && !resize, moved: false, before: JSON.stringify(TT.days),
             s: toMin(x.s), e: toMin(x.e), orig: JSON.parse(JSON.stringify(day.sessions)), el: tile };
    if (!DRAG.touch) e.preventDefault();
  });
  document.addEventListener('pointermove', e => {
    if (!DRAG || DRAG.touch) return;
    const dy = e.clientY - DRAG.y;
    if (!DRAG.moved && Math.abs(dy) < 4) return;
    DRAG.moved = true; DRAG.el.classList.add('dragging');
    const delta = Math.round(dy / PXM / 5) * 5;
    const day = DRAG.day;
    day.sessions = JSON.parse(JSON.stringify(DRAG.orig));
    const x = day.sessions.find(s => s.id === DRAG.x.id);
    if (DRAG.resize) {
      const end = Math.max(DRAG.s + 5, DRAG.e + delta), shift = end - DRAG.e;
      x.e = toHM(end);
      day.sessions.forEach(o => { if (o !== x && toMin(o.s) >= DRAG.e) { o.s = toHM(toMin(o.s) + shift); o.e = toHM(toMin(o.e) + shift); } });
    } else {
      const len = DRAG.e - DRAG.s, s = Math.max(6 * 60, Math.min(23 * 60 - len, DRAG.s + delta));
      x.s = toHM(s); x.e = toHM(s + len);
      settle(day, x);
    }
    placeTiles(day);
  });
  document.addEventListener('pointerup', e => {
    if (!DRAG) return;
    const was = DRAG; DRAG = null;
    if (was.moved) { UNDO.push(was.before); was.day.sessions.sort(byStart); save('Moved'); render(); return; }
    if (!was.resize) openTile(was.day.date, was.x.id);
  });
  document.addEventListener('click', e => {
    if (!EDIT) return;
    const m = e.target.closest('[data-menu]'); if (m) { e.stopPropagation(); openMenu(m.dataset.menu, m); return; }
    const a = e.target.closest('[data-add]');
    if (a) {
      const day = dayOfDate(a.dataset.add); if (!day) return;
      remember();
      day.sessions = day.sessions || [];
      const end = day.sessions.length ? Math.max(...day.sessions.map(x => toMin(x.e) || 0)) : 11 * 60;
      const x = { id: newId(), s: toHM(end), e: toHM(Math.min(23 * 60, end + 30)), k: 'event', t: '' };
      day.sessions.push(x); save('Added'); render(); openTile(day.date, x.id); return;
    }
    if (e.target.id === 'ttUndo') { undo(); return; }
    if (!e.target.closest('.ttpop, .ttmenu, .tile')) closePop();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePop();
    if (EDIT && (e.metaKey || e.ctrlKey) && e.key === 'z' && !e.target.closest('input, textarea, select')) { e.preventDefault(); undo(); }
  });
}

function pop(cls){
  let el = document.querySelector('.' + cls);
  if (!el) { el = document.createElement('div'); el.className = cls; el.hidden = true; document.body.appendChild(el); }
  return el;
}
function closePop(){ document.querySelectorAll('.ttpop, .ttmenu').forEach(el => { el.hidden = true; }); }
function placeNear(el, anchor){
  const r = (anchor || document.body).getBoundingClientRect(), w = el.offsetWidth || 300;
  const left = r.right + 8 + w > window.innerWidth ? Math.max(8, r.left - w - 8) : r.right + 8;
  el.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, left)) + 'px';
  el.style.top = Math.max(8, Math.min(window.innerHeight - el.offsetHeight - 8, r.top)) + 'px';
}

/* One tile, opened: what it is, its name, whose input it is, its times. A TP
   tile names the practice and which set teaches -- that is the day's, so it
   changes every lesson of the day at once. */
function openTile(date, id){
  closePop();
  const day = dayOfDate(date); if (!day) return;
  const x = (day.sessions || []).find(s => s.id === id); if (!x) return;
  remember();
  const el = pop('ttpop');
  const sets = (GROUPS[0] && GROUPS[0].sets) || [];
  el.innerHTML = `<label>What it is<select id="tK">${KIND_ORDER.map(k => `<option value="${k}"${x.k === k ? ' selected' : ''}>${esc(KIND_LABEL[k])}</option>`).join('')}</select></label>
    ${x.k === 'tp'
      ? `<div class="two"><label>Practice<input id="tTp" type="number" min="1" max="20" value="${esc(day.tp || '')}" placeholder="—"></label>
         <label>Who teaches<select id="tSet">${sets.length ? sets.map((st, i) => `<option value="${i}"${+day.setIndex === i ? ' selected' : ''}>${esc(R.setName(st) || (i ? 'Second set' : 'First set'))}</option>`).join('') : `<option value="0">First set</option><option value="1"${+day.setIndex === 1 ? ' selected' : ''}>Second set</option>`}</select></label></div>`
      : `<label>Name<input id="tT" value="${esc(x.t || '')}" placeholder="${esc(KIND_LABEL[x.k] || '')}"></label>`}
    ${x.k === 'input' && TUTORS.length ? `<label>Who teaches it<select id="tBy"><option value="">—</option>${TUTORS.map((n, i) => `<option value="${i}"${String(x.by) === String(i) ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></label>` : ''}
    <div class="two"><label>From<input id="tS" type="time" value="${esc(x.s)}"></label><label>To<input id="tE" type="time" value="${esc(x.e)}"></label></div>
    <div class="acts"><button type="button" class="btn quiet del" id="tDel">Remove</button><button type="button" class="btn" id="tOk">Done</button></div>`;
  el.hidden = false;
  placeNear(el, document.querySelector(`.tile[data-date="${date}"][data-id="${id}"]`));
  const apply = (rerender) => {
    const k = $('tK').value;
    if (k !== x.k) {
      x.k = k;
      if (k === 'tp') { x.t = ''; if (!day.tp) { const prev = TT.days.slice(0, TT.days.indexOf(day)).reverse().find(d => d.tp); day.tp = prev ? prev.tp : 1; day.setIndex = 0; } }
      if (k !== 'input') delete x.by;
      if (k === 'tp' || k === 'input') x.room = k === 'tp' ? 'Teaching practice' : 'Input';
      if (!day.sessions.some(s => s.k === 'tp')) { delete day.tp; delete day.setIndex; }
      save('Saved'); render(); openTile(date, id); UNDO.pop(); return;
    }
    if ($('tT')) x.t = $('tT').value;
    if ($('tBy')) { if ($('tBy').value === '') delete x.by; else x.by = +$('tBy').value; }
    if ($('tTp')) { const n = parseInt($('tTp').value, 10); if (n > 0) day.tp = n; }
    if ($('tSet')) day.setIndex = +$('tSet').value;
    const s = toMin($('tS').value), e = toMin($('tE').value);
    if (s != null && e != null) { x.s = toHM(s); x.e = toHM(Math.max(s + 5, e)); settle(day, x); }
    save('Saved');
    if (rerender) render();
  };
  ['tK', 'tTp', 'tSet', 'tBy', 'tS', 'tE'].forEach(i => { if ($(i)) $(i).addEventListener('change', () => apply(true)); });
  if ($('tT')) { let t = null; $('tT').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => apply(true), 500); }); $('tT').addEventListener('keydown', e => { if (e.key === 'Enter') { apply(true); closePop(); } }); }
  $('tOk').addEventListener('click', () => { apply(true); closePop(); });
  $('tDel').addEventListener('click', () => {
    day.sessions = day.sessions.filter(s => s !== x);
    if (!day.sessions.some(s => s.k === 'tp')) { delete day.tp; delete day.setIndex; }
    closePop(); save('Removed'); render();
  });
  const f = $('tT') || $('tTp'); if (f) f.focus();
}

/* The day menu: use this day's shape for other days, and pin a day so that
   copying leaves it alone. */
function openMenu(date, anchor){
  closePop();
  const day = dayOfDate(date); if (!day) return;
  const d = parse(date), wd = DOWL[d.getDay()];
  const el = pop('ttmenu');
  el.innerHTML = `<h4>Use this day’s shape for</h4>
    <button type="button" data-copy="all">Every day<small>The whole course, except pinned days</small></button>
    <button type="button" data-copy="from">Every day from here<small>${esc(dm(d))} to the end, except pinned days</small></button>
    <button type="button" data-copy="dow">Every ${esc(wd)}<small>The same weekday all course, except pinned days</small></button>
    <hr><button type="button" data-pin="1">${day.pinned ? 'Unpin this day' : 'Pin this day'}<small>${day.pinned ? 'Copying a shape will change it again' : 'Copying a shape leaves it as it is — for an odd day like a demo lesson'}</small></button>`;
  el.hidden = false;
  const r = anchor.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(window.innerWidth - el.offsetWidth - 8, r.right - el.offsetWidth)) + 'px';
  el.style.top = Math.min(window.innerHeight - el.offsetHeight - 8, r.bottom + 6) + 'px';
  el.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copyShape(date, b.dataset.copy)));
  el.querySelector('[data-pin]').addEventListener('click', () => { remember(); day.pinned = !day.pinned; if (!day.pinned) delete day.pinned; closePop(); save(day.pinned ? 'Pinned' : 'Unpinned'); render(); });
}

/* The shape is the times and the kinds. What a day SAYS stays its own: each
   tile takes the next name of its kind from the day it lands on (Monday's
   "Phonology 2" stays Monday's), and a TP tile only lands on a day that has a
   practice -- a day without one keeps having none. */
function copyShape(date, how){
  const src = dayOfDate(date); if (!src) return;
  const di = TT.days.indexOf(src), wd = parse(date).getDay();
  const targets = TT.days.filter((d, i) => i !== di && (how === 'all' || (how === 'from' && i > di) || (how === 'dow' && parse(d.date).getDay() === wd)));
  const changed = targets.filter(d => !d.pinned), kept = targets.length - changed.length;
  remember();
  changed.forEach(d => {
    const pools = {};
    (d.sessions || []).slice().sort(byStart).forEach(x => { (pools[x.k] = pools[x.k] || []).push(x); });
    const out = [];
    (src.sessions || []).slice().sort(byStart).forEach(x => {
      if (x.k === 'tp' && !d.tp) return;
      const n = { id: newId(), s: x.s, e: x.e, k: x.k, t: x.k === 'tp' ? '' : (x.k === 'input' ? '' : x.t) };
      if (x.room) n.room = x.room;
      const own = x.k === 'tp' ? null : (pools[x.k] || []).shift();
      if (own) { n.t = own.t; if (own.by !== undefined) n.by = own.by; if (own.room) n.room = own.room; }
      out.push(n);
    });
    if (d.tp && !out.some(x => x.k === 'tp')) { d.sessions = out; ensureTp(d); }
    else d.sessions = out;
  });
  closePop(); save('Shape used on ' + changed.length + ' day' + (changed.length === 1 ? '' : 's') + (kept ? ' · ' + kept + ' pinned day' + (kept === 1 ? '' : 's') + ' left alone' : '')); render();
}

/* Import. Ramy, 29 Sep 2026: "is it possible to just import a timetable the
   same way we do with the TP points, the same way we do with the observation
   tasks?" The rules live in hub-timetable-parse.js so they can be tested away
   from the page. What arrives is shown before anything is replaced, the same
   as the observation importer: a file it has never seen is a first draft. */
let IMPORT_OPEN = false, REVIEW = null;
/* The link import (8 Oct 2026): Ramy, "then I will be able to import the
   timetable that we have on Google Classroom". The sheet must be shared
   "anyone with the link": Google refuses a page a private sheet, and the
   page cannot tell a private sheet from a wrong address, so it says both. */
let LINK_VALUE = '', LINK_ERR = '';
const LINK_SHARE = 'Lite could not open that sheet. In Google Sheets, click Share, set General access to "Anyone with the link" (Viewer), and try again.';

function importHTML(){
  if (REVIEW) {
    const r = REVIEW;
    return `<div class="review"><h3>What the sheet holds</h3>
      <p class="n">${esc(r.from)} — ${r.found.length} day${r.found.length===1?'':'s'} read${r.header ? ', by the column names it gives' : ', by position'}${r.byDate ? ', ' + r.byDate + ' matched on their own date' : ''}${r.byPosition ? ', ' + r.byPosition + ' matched in order' : ''}. The input sessions and notes are replaced on those days; the teaching practices Lite works out for itself are left alone unless the sheet names one.</p>
      ${r.found.slice(0,8).map(f => `<div class="found"><b>${esc(f.date)}</b> — ${esc([f.a, f.b].filter(Boolean).join(' · ') || 'nothing in the session columns')}${f.tp ? ' · TP ' + f.tp : ''}${f.notes ? ' · ' + esc(f.notes) : ''}</div>`).join('')}
      ${r.found.length > 8 ? `<div class="found">… and ${r.found.length - 8} more</div>` : ''}
      ${r.unmatched.length ? `<p class="skipped">Not used, nothing to place them on: ${r.unmatched.slice(0,4).map(esc).join('; ')}${r.unmatched.length>4 ? ' and ' + (r.unmatched.length-4) + ' more' : ''}</p>` : ''}
      ${!r.found.length ? `<p class="skipped">Nothing usable was found. A sheet needs one row per day, with the sessions in their own columns.</p>` : ''}
      <div class="acts"><button class="btn quiet" id="impCancel">Keep what I have</button>${r.found.length ? '<button class="btn" id="impApply">Put it in</button>' : ''}</div></div>`;
  }
  if (!IMPORT_OPEN) return '';
  return `<div class="imp"><h3>Import from a sheet</h3>
    <p>Give a Google Sheets link, paste from Excel or Google Sheets, or choose an Excel, Word, CSV or text file. One row per day, with columns for the date, the input sessions and any notes, or a week grid with the dates across the top of each week and rows for input, TP and assignments. A header row naming the columns helps but is not needed. Rows without a readable date are taken in order from the first course day.</p>
    <div class="link"><input type="url" id="impLink" placeholder="Google Sheets link" value="${esc(LINK_VALUE)}" autocomplete="off">
      <button class="btn" id="impLinkRead">Read the link</button></div>
    ${LINK_ERR ? `<p class="linkerr">${esc(LINK_ERR)}</p>` : ''}
    <textarea id="impPaste" placeholder="Paste the rows here"></textarea>
    <div class="row"><button class="btn" id="impRead">Read the paste</button>
      <input type="file" id="impFile" accept=".xlsx,.docx,.csv,.tsv,.txt" style="font-size:0.78rem">
      <button class="btn quiet" id="impClose">Close</button></div></div>`;
}

function wireImport(){
  if (!IS_TUTOR) return;
  const open = $('importOpen');
  if (open) open.addEventListener('click', () => { IMPORT_OPEN = !IMPORT_OPEN; REVIEW = null; render(); });
  if ($('impClose')) $('impClose').addEventListener('click', () => { IMPORT_OPEN = false; LINK_ERR = ''; render(); });
  if ($('impLinkRead')) $('impLinkRead').addEventListener('click', async () => {
    LINK_VALUE = $('impLink').value.trim(); LINK_ERR = '';
    const url = window.hubTimetableParse.sheetCsvUrl(LINK_VALUE);
    if (!url) { LINK_ERR = 'That is not a Google Sheets link. Copy it from the address bar of the open sheet.'; render(); return; }
    const btn = $('impLinkRead'); btn.disabled = true; btn.textContent = 'Reading…';
    try {
      const res = await fetch(url, { credentials: 'omit' });
      const type = res.headers.get('content-type') || '';
      if (!res.ok || /html/i.test(type)) throw new Error('not shared');
      const rows = window.hubTimetableParse.csvRows(await res.text());
      LINK_ERR = ''; review(rows, 'The sheet at that link');
    } catch (err) { LINK_ERR = LINK_SHARE; render(); }
  });
  if ($('impRead')) $('impRead').addEventListener('click', () => {
    const text = $('impPaste').value;
    if (!text.trim()) { note = 'Nothing pasted yet.'; render(); return; }
    review(window.hubTimetableParse.rowsFromText(text), 'What you pasted');
  });
  if ($('impFile')) $('impFile').addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    try {
      const rows = window.hubIsXlsx && window.hubIsXlsx(file) ? await window.hubXlsxRows(file)
        : /\.docx$/i.test(file.name) && window.hubDocxBlocks
        ? window.hubTimetableParse.rowsFromBlocks(await window.hubDocxBlocks(file))
        : window.hubTimetableParse.rowsFromText(await file.text());
      review(rows, file.name);
    } catch (err) { alert(err && err.message ? err.message : 'That file could not be read.'); }
  });
  if ($('impCancel')) $('impCancel').addEventListener('click', () => { REVIEW = null; render(); });
  if ($('impApply')) $('impApply').addEventListener('click', () => {
    const by = {}; TT.days.forEach(d => { by[d.date] = d; });
    /* The two inputs go into the day's first two input sessions (since stage 1,
       9 Oct 2026, a day keeps sessions); a day with one input session gets
       both, joined, and a day with none gets one at the usual day's time.
       Before that the importer wrote fields nothing read: "Put it in did not
       put it in" (Ramy, 9 Oct 2026). */
    REVIEW.found.forEach(f => {
      const day = by[f.date]; if (!day) return;
      day.sessions = day.sessions || [];
      const ins = day.sessions.filter(x => x.k === 'input').sort(byStart);
      [f.a, f.b].forEach((v, i) => {
        if (!v) return;
        if (ins[i]) { ins[i].t = v; return; }
        if (ins.length) { ins[ins.length - 1].t = (ins[ins.length - 1].t ? ins[ins.length - 1].t + ' · ' : '') + v; return; }
        const sl = template().filter(x => x.kind === 'input')[0] || { from: '11:00', to: '12:15', room: 'Input' };
        const x = { id: newId(), s: sl.from, e: sl.to, k: 'input', t: v, room: sl.room || 'Input' };
        day.sessions.push(x); ins.push(x);
      });
      if (f.notes) day.notes = f.notes;
      if (!REVIEW.tpColumn && f.tp) { day.tp = f.tp; ensureTp(day); }
      settle(day);
    });
    /* A sheet with a TP column decides the practice days (Ramy, 9 Oct 2026,
       "the sheet decides"): a blank TP cell is a day without practice, and a
       practice's first day is the first set's, its second the second set's --
       ABC then DEF on his sheet. The day's TP tiles follow: a teaching day
       gets its lessons, a day without practice loses them. */
    if (REVIEW.tpColumn) {
      const times = {};
      REVIEW.found.slice().sort((x, y) => (x.date < y.date ? -1 : 1)).forEach(f => {
        const day = by[f.date]; if (!day) return;
        if (f.tp) { const n = times[f.tp] || 0; day.tp = f.tp; day.setIndex = n % 2; times[f.tp] = n + 1; ensureTp(day); }
        else { delete day.tp; delete day.setIndex; dropTp(day); }
      });
    }
    REVIEW = null; IMPORT_OPEN = false;
    save('Imported');
    render();
  });
}

function review(rows, from){
  const r = window.hubTimetableParse.parse(rows, TT.days, { year: +String((TT.days[0]||{}).date || '').slice(0,4) });
  r.from = from;
  REVIEW = r;
  render();
}

function build(keep){
  const sk = skeleton();
  if (!sk) { note = 'The course needs a start and an end date first.'; render(); return; }
  if (keep && TT && TT.days) {
    const old = {}; TT.days.forEach(d => { old[d.date] = d; });
    /* Keep what each day already says: its cells (the day shape, 30 Sep
       2026) and its notes. This still copied the old a/b fields, so a rebuild
       that was meant to keep the sessions dropped every one of them. */
    sk.days.forEach(d => {
      const o = old[d.date]; if (!o) return;
      d.notes = o.notes || '';
      if (o.pinned) d.pinned = true;
      if (Array.isArray(o.sessions)) d.sessions = JSON.parse(JSON.stringify(o.sessions));
    });
    TT = sk;
    TT.days.forEach(d => { if (d.tp) ensureTp(d); else dropTp(d); });
  } else TT = sk;
  save('Built');
}

function wireEdits(){
  if (!EDIT) return;
  document.querySelectorAll('input[data-date]').forEach(el => {
    let t = null;
    const fire = () => {
      const day = TT.days.find(d => d.date === el.dataset.date);
      if (!day) return;
      if (el.dataset.slot) { day.cells = day.cells || {}; day.cells[el.dataset.slot] = el.value; }
      else day[el.dataset.f] = el.value;
      save('Saved');
    };
    el.addEventListener('input', () => { clearTimeout(t); t = setTimeout(fire, 800); });
    el.addEventListener('blur', () => { clearTimeout(t); fire(); });
  });
}

/* Written whole, through the ordinary course-record queue in hub-sync: the
   same path settings and wording take, so it is ledgered and retried. */
function save(word){
  /* The usual day follows the board: the slots of the first teaching day, so a
     new day is laid out like the course as it is now, and a page that only
     wants "the" TP times (a volunteer's hours) still has them. */
  if (TT && TT.days && window.hubSessionSlots) {
    const d = TT.days.find(x => x.tp && (x.sessions || []).some(s => s.k === 'tp')) || TT.days.find(x => (x.sessions || []).length);
    if (d) TT.slots = hubSessionSlots(d.sessions);
  }
  try { localStorage.setItem(KEY, JSON.stringify(TT)); } catch(e) {}
  note = word || 'Saved';
  const st = document.querySelector('.status'); if (st) st.textContent = note;
  setTimeout(() => { note = ''; const s2 = document.querySelector('.status'); if (s2 && !busy) s2.textContent = ''; }, 2500);
  if (word === 'Built') render();
}

/* The reader taking over. NOT on `scroll`: my own scrollTo fires that event,
   so a scroll listener marked the page as touched the instant the page put
   itself on today, and every later render then left it wherever it landed.
   A wheel, a finger, a key or a click is a person; a scroll event is not
   (30 Sep 2026). */
['wheel','touchstart','pointerdown','keydown'].forEach(function(ev){
  document.addEventListener(ev, function(){ SCROLLED = true; }, { once: true, passive: true });
});

/* ---- v2 (7 Oct 2026): ribbon, now line, due pills -----------------------
   Layered on whatever render() last drew, so render stays the one source.
   A MutationObserver on the page re-applies after every render; the guards
   below mean its own additions never trigger another pass. */
(function(){
  const host = document.getElementById('app'); if (!host) return;
  const p2 = n => String(n).padStart(2, '0');
  const mins = s => { const m = /^(\d{1,2}):(\d{2})/.exec(String(s || '')); return m ? +m[1] * 60 + +m[2] : null; };
  const nowD = () => { const n = window.hubNow ? hubNow() : new Date(); return n instanceof Date ? n : new Date(n); };
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00') - Date.parse(a + 'T12:00:00')) / 864e5);
  const jump = date => {
    const el = document.getElementById('d-' + date); if (!el) return;
    /* on a phone the week is a row of days: bring the day across as well as down */
    if (el.parentElement && el.parentElement.scrollWidth > el.parentElement.clientWidth) el.parentElement.scrollTo({ left: el.offsetLeft - el.parentElement.offsetLeft, behavior: 'smooth' });
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 64, behavior: 'smooth' });
  };

  function ribbon(){
    const days = (TT && TT.days) || []; if (!days.length || host.querySelector('.tv2-rib')) return;
    const firstWk = host.querySelector('.tkey') || host.querySelector('.wk'); if (!firstWk) return;
    const idx = days.findIndex(d => d.date === TODAY);
    const before = days[0] && TODAY < days[0].date, after = days[days.length - 1] && TODAY > days[days.length - 1].date;
    const head = idx >= 0 ? 'Day <em>' + (idx + 1) + '</em> of ' + days.length
      : before ? 'Starts in <em>' + daysBetween(TODAY, days[0].date) + '</em> day' + (daysBetween(TODAY, days[0].date) === 1 ? '' : 's')
      : after ? 'The course is finished' : days.length + ' days';
    const tps = days.filter(d => d.tp).length;
    const sub = days.length + ' days \u00b7 ' + tps + ' with teaching practice';
    const segs = days.map((d, i) => {
      const dt = new Date(d.date + 'T12:00:00'), mon = dt.getDay() === 1 && i > 0;
      const cls = ['tv2-seg', d.date < TODAY ? 'past' : '', d.date === TODAY ? 'today' : '', mon ? 'mon' : ''].filter(Boolean).join(' ');
      const due = (typeof DUES !== 'undefined' && DUES[d.date] && DUES[d.date].length) ? DUES[d.date].map(x => x.title).join(', ') : '';
      const tip = 'Day ' + (i + 1) + ' \u00b7 ' + dt.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + (d.tp ? ' \u00b7 TP ' + d.tp : '') + (due ? ' \u00b7 ' + due + ' due' : '');
      return '<button type="button" class="' + cls + '" data-go="' + esc(d.date) + '" title="' + esc(tip) + '" aria-label="' + esc(tip) + '">' + (i + 1)
        + (d.tp ? '<span class="tp"></span>' : '') + (due ? '<span class="du"></span>' : '') + '</button>';
    }).join('');
    firstWk.insertAdjacentHTML('beforebegin', '<div class="tv2-rib"><div class="top"><b>' + head + '</b><span>' + sub + '</span></div>'
      + '<div class="tv2-segs">' + segs + '</div>'
      + '<div class="tv2-key"><span><i class="k-tp"></i>teaching practice</span><span><i class="k-du"></i>a deadline</span></div></div>');
    host.querySelector('.tv2-segs').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) jump(b.dataset.go); });
  }

  function nowLine(){
    const card = host.querySelector('.day.today'); if (!card) return;
    const n = nowD(), m = n.getHours() * 60 + n.getMinutes();
    const dh = card.querySelector('.dh');
    let clock = dh && dh.querySelector('.tv2-clock');
    if (dh && !clock) { clock = document.createElement('span'); clock.className = 'tv2-clock'; dh.appendChild(clock); }
    if (clock) clock.textContent = hubClock(p2(n.getHours()) + ':' + p2(n.getMinutes()));
    card.querySelectorAll('.sl, .tile[data-from]').forEach(row => {
      const t = row.dataset.from ? row : row.querySelector('.t[data-from]');
      const a = t ? mins(t.dataset.from) : null, b = t ? mins(t.dataset.to) : null;
      row.classList.toggle('tv2-now', a != null && b != null && m >= a && m < b);
      row.classList.toggle('tv2-past', b != null && m >= b);
    });
    /* the line across today's column at the time it is now */
    const bar = card.querySelector('.nowbar'), body = bar && bar.parentElement;
    if (bar && body) { const y = (m - (+body.dataset.start || 0)) * PXM; bar.hidden = y < 0 || y > body.offsetHeight; bar.style.top = y + 'px'; }
  }

  function duePills(){
    host.querySelectorAll('.day .due').forEach(el => {
      if (el.querySelector('.tv2-in')) return;
      const day = el.closest('.day'); const date = day && day.id.replace(/^d-/, ''); if (!date || date < TODAY) return;
      const n = daysBetween(TODAY, date);
      el.insertAdjacentHTML('beforeend', '<span class="tv2-in' + (n <= 2 ? ' soon' : '') + '">' + (n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days') + '</span>');
    });
  }

  let q = null;
  const apply = () => { q = null; try { ribbon(); nowLine(); duePills(); } catch (e) {} };
  new MutationObserver(() => { if (!q) q = requestAnimationFrame(apply); }).observe(host, { childList: true });
  apply();
  setInterval(nowLine, 30000);
})();

render();
</script>
</body>
