        : /\.docx$/i.test(file.name) && window.hubDocxBlocks
        ? window.hubTimetableParse.rowsFromBlocks(await window.hubDocxBlocks(file))
        : window.hubTimetableParse.rowsFromText(await file.text());
      review(rows, file.name);
    } catch (err) { alert(err && err.message ? err.message : 'That file could not be read.'); }
  });
  if ($('impCancel')) $('impCancel').addEventListener('click', () => { REVIEW = null; render(); });
  wireReview();
  if ($('builtClose')) $('builtClose').addEventListener('click', () => { BUILT = null; render(); });
}

/* ---- THE REVIEW (stage 3 of the timetable system, 9 Oct 2026) -------------
   specs/timetable-system/ §5.3: two columns, the sheet as written beside what
   Lite understood, and a question under anything it is not sure of -- an
   unknown term, a deadline in a note, a session "to be confirmed", a row
   outside the course's dates, two rows for one day. Nothing is written until
   every question is answered; "Remember" keeps a term's answer for the
   center's next import. The reading itself is hub-timetable-parse.js
   (interpret), so it is tested away from the page. */
const KIND_CHIP = { input: 'Input', plan: 'Planning', demo: 'Demo & observation', assessor: 'Assessor', event: 'Whole group', task: 'Assignments', tp: 'TP', note: 'Note', skip: 'Left out' };
const DEFAULT_TITLES = { fol: 'Focus on the Learner', lrt: 'Language Related Tasks', lsrt: 'Language Skills Related Tasks', lfc: 'Lessons from the Classroom' };

function review(rows, from){
  const P = window.hubTimetableParse;
  const open = TT.days.filter(d => !d.closed);
  const r = P.parse(rows, open, { year: +String((TT.days[0] || {}).date || '').slice(0, 4) });
  const w = rec('connect_assignment_wording_v2') || {};
  const order = (window.hubAssignmentOrder ? hubAssignmentOrder(w) : ['fol', 'lrt', 'lsrt', 'lfc']).filter(k => k !== 'a5');
  const titles = {}; order.forEach(k => { titles[k] = (w[k] && w[k].title) || DEFAULT_TITLES[k] || k.toUpperCase(); });
  const I = P.interpret(r, { days: open, order, titles, vocab: SETTINGS.importTerms || {} });
  Object.assign(r, { from, lines: I.lines, questions: I.questions, answers: {}, remember: {}, filter: 'all', titles });
  REVIEW = r; BUILT = null;
  render();
}

/* What a line comes to once its questions are answered. */
function lineKind(r, l){
  if (l.tbc && r.answers[l.tbc] === 'skip') return 'skip';
  if (l.q) return r.answers[l.q] || '';
  return l.kind;
}
function reviewHTML(){
  const r = REVIEW;
  if (!r.found.length) return `<div class="review"><h3>Nothing to put in</h3><p class="n">${esc(r.from)}: nothing usable was found. A sheet needs one row per day with the sessions in their own columns, or a week grid with the dates across the top.</p><div class="acts"><button class="btn quiet" id="impCancel">Back</button></div></div>`;
  const open = r.questions.filter(q => !(q.id in r.answers));
  const understood = r.lines.filter(l => !l.q && !l.tbc).length;
  const rows = r.found.map((f, i) => 'r' + i).filter(row => r.filter === 'all' || open.some(q => q.row === row));
  const body = rows.map(row => {
    const f = r.found[+row.slice(1)], lines = r.lines.filter(l => l.row === row), qs = r.questions.filter(q => q.row === row);
    const pending = qs.filter(q => !(q.id in r.answers));
    const left = lines.map(l => `<div class="raw">${esc(l.raw)}</div>`).join('') || '<div class="raw dim">(empty row)</div>';
    const right = lines.map(l => {
      const k = lineKind(r, l), asked = !!(l.q || l.tbc || (l.dues && l.dues.length));
      const done = !((l.q && !(l.q in r.answers)) || (l.tbc && !(l.tbc in r.answers)) || (l.dues || []).some(id => !(id in r.answers)));
      let text = '';
      if (l.col === 'tp') text = l.title;
      else if (l.col === 'notes') {
        const set = (l.dues || []).map(id => r.questions.find(q => q.id === id)).filter(q => q && (r.answers[q.id] === 'yes' || String(r.answers[q.id] || '').indexOf('key:') === 0));
        text = esc(l.title) + set.map(q => `<span class="duechip">deadline: ${esc(r.titles[q.key || r.answers[q.id].slice(4)] || '')}${q.time ? ' · ' + esc(hubClock(q.time)) : ''}</span>`).join('');
        return `<div class="und"><span class="kchip k-note">${KIND_CHIP.note}</span><span class="ut">${text}</span>${done ? (asked ? '<span class="mark">Answered</span>' : '<span class="mark ok">✓</span>') : '<span class="mark q">?</span>'}</div>`;
      } else text = esc(l.title) + (l.times ? ` <span class="tm">${esc(l.times.e ? hubClockRange(l.times.s, l.times.e) : hubClock(l.times.s))}, from the sheet</span>` : '') + (l.tbc && r.answers[l.tbc] === 'keep' && !/tbc|to be confirmed/i.test(l.title) ? ' (to be confirmed)' : '');
      const chip = k ? `<span class="kchip k-${k}">${KIND_CHIP[k] || k}</span>` : '<span class="kchip k-q">?</span>';
      return `<div class="und">${chip}<span class="ut">${l.col === 'tp' ? esc(text) : text}</span>${done ? (asked ? '<span class="mark">Answered</span>' : '<span class="mark ok">✓</span>') : '<span class="mark q">?</span>'}</div>`;
    }).join('') + (f.outside ? `<div class="und"><span class="kchip k-q">Date</span><span class="ut">Dated ${esc(f.outside)}, not a course day</span></div>` : '');
    const ask = qs.map(q => {
      const a = r.answers[q.id];
      if (a !== undefined) return `<div class="ask done"><span>${esc(q.text)}</span> <b>${esc((q.answers.find(x => x.value === a) || {}).label || a)}</b> <button type="button" class="linkbtn" data-unans="${esc(q.id)}">Change</button></div>`;
      return `<div class="ask"><p>${esc(q.text)}</p><div class="answers">${q.answers.map(x => `<button type="button" class="btn quiet sm" data-ans="${esc(q.id)}" data-val="${esc(x.value)}">${esc(x.label)}</button>`).join('')}</div>
        ${q.remember ? `<label class="rem"><input type="checkbox" data-rem="${esc(q.term)}"${r.remember[q.term] ? ' checked' : ''}> Remember “${esc(q.term)}” for future imports</label>` : ''}</div>`;
    }).join('');
    return `<div class="rrow${pending.length ? ' flag' : ''}"><div class="rl"><div class="rdate">${esc(dayName(f.date))}</div>${left}</div><div class="rr">${right}</div>${ask ? `<div class="rq">${ask}</div>` : ''}</div>`;
  }).join('');
  return `<div class="review rv3"><h3>Import a timetable</h3>
    <p class="n">${esc(r.from)} · ${r.found.length} day${r.found.length === 1 ? '' : 's'} read · <span class="good">${understood} understood</span> · <span class="${open.length ? 'need' : 'good'}">${open.length} need${open.length === 1 ? 's' : ''} you</span>${r.unmatched.length ? ' · ' + r.unmatched.length + ' line' + (r.unmatched.length === 1 ? '' : 's') + ' not used' : ''}</p>
    ${(r.shapes || []).length ? `<p class="n shapes">${r.shapes.map(x => `<b>${x.from ? 'From ' + esc(dayName(x.from)) : 'The day'}:</b> ` + x.slots.map(sl => esc(sl.label) + ' ' + esc(hubClock(sl.from))).join(' · ')).join('<br>')}</p>` : ''}
    ${r.questions.length ? `<div class="rfilter"><button type="button" class="shtab${r.filter === 'all' ? ' on' : ''}" data-rfilter="all">All rows</button><button type="button" class="shtab${r.filter === 'needs' ? ' on' : ''}" data-rfilter="needs">Needs you${open.length ? ' · ' + open.length : ''}</button></div>` : ''}
    <div class="rtable"><div class="rhead"><span>In your sheet</span><span>Lite understood</span></div>${body || '<p class="hint">Nothing needs you.</p>'}</div>
    <div class="acts"><button class="btn quiet" id="impCancel">Keep what I have</button><span class="rhint">${open.length ? 'Answer ' + open.length + ' more to continue' : 'Everything is understood'}</span><button class="btn" id="impApply"${open.length ? ' disabled' : ''}>Put it in</button></div></div>`;
}

function wireReview(){
  if (!REVIEW) return;
  document.querySelectorAll('[data-ans]').forEach(b => b.addEventListener('click', () => { REVIEW.answers[b.dataset.ans] = b.dataset.val; render(); }));
  document.querySelectorAll('[data-unans]').forEach(b => b.addEventListener('click', () => { delete REVIEW.answers[b.dataset.unans]; render(); }));
  document.querySelectorAll('[data-rem]').forEach(b => b.addEventListener('change', () => { REVIEW.remember[b.dataset.rem] = b.checked; }));
  document.querySelectorAll('[data-rfilter]').forEach(b => b.addEventListener('click', () => { REVIEW.filter = b.dataset.rfilter; render(); }));
  if ($('impApply')) $('impApply').addEventListener('click', applyReview);
}

/* Put it in: the answered review onto the board. Inputs go into the day's
   input tiles in order (a day with fewer gets new ones after them), taking
   the kind the review settled and the times the sheet wrote; the TP column
   decides the practice days ("the sheet decides", 9 Oct 2026); a deadline the
   tutor confirmed is written on its assignment, where every deadline lives;
   a remembered term goes on the course settings for the next import. */
let BUILT = null;
function applyReview(){
  const r = REVIEW;
  if (r.questions.some(q => !(q.id in r.answers))) return;
  remember();
  const by = {}; TT.days.forEach(d => { by[d.date] = d; });
  const skipRow = {};
  r.found.forEach((f, i) => {
    const row = 'r' + i;
    if (r.answers[row + ':outside'] === 'skip') skipRow[row] = true;
    const dup = r.answers[row + ':dup'];
    if (dup === 'first') skipRow[row] = true;
    if (dup === 'second') { const j = r.found.findIndex(g => g.date === f.date); skipRow['r' + j] = true; }
  });
  const rows = r.found.map((f, i) => ({ f, row: 'r' + i })).filter(x => !skipRow[x.row] && by[x.f.date]);
  let sessions = 0, timed = 0;
  /* Times the sheet wrote stay where the sheet put them: a break they cover
     goes, anything else they overlap moves after them. */
  const fitAround = (day, fixed) => {
    if (!fixed.size) { settle(day); return; }
    const inside = x => [...fixed].some(f => toMin(f.s) <= toMin(x.s) && toMin(f.e) >= toMin(x.e));
    const sameStart = x => [...fixed].some(f => toMin(f.s) === toMin(x.s));
    /* a break it covers goes; so does a slot it starts in or covers whole
       (not a lesson: those are the TP column's) */
    day.sessions = day.sessions.filter(x => fixed.has(x) || x.locked || !((x.k === 'break' || x.k === 'lunch') ? inside(x) : x.k !== 'tp' && (sameStart(x) || inside(x))));
    const placed = day.sessions.filter(x => fixed.has(x));
    day.sessions.filter(x => !fixed.has(x)).sort(byStart).forEach(t => {
      let st = toMin(t.s); const len = toMin(t.e) - st;
      for (let again = true; again;) { again = false; placed.forEach(o => { if (st < toMin(o.e) && st + len > toMin(o.s)) { st = toMin(o.e); again = true; } }); }
      t.s = toHM(st); t.e = toHM(st + len); placed.push(t);
    });
    day.sessions = placed.sort(byStart);
  };
  /* THE SHEET DECIDES THE DAY (9 Oct 2026). Ramy's C/18 import put every
     input on Lite's own 10:00, kept Lite's own TP times and an empty second
     input at 11:15, and let a 12:30 session push the afternoon to 18:30. Now:
     a day the sheet writes out takes the sheet's shape (shapesIn: the day as a
     sentence, and the day it changes from); the label times move the input
     and the lessons ("Input 11:00", "TP 15:00 · 15:50 · 16:45"); a session
     with its own time takes the place of whatever starts then ("Analyzing
     language and context (12:30)" on the day nothing has been taught yet takes
     the 12:30 feedback slot) and lasts as long as that slot; and an input slot
     the sheet left empty is not kept. */
  const shapeFor = date => (r.shapes || []).filter(x => !x.from || x.from <= date).sort((a, b) => (a.from || '') < (b.from || '') ? -1 : 1).pop() || null;
  /* what this import has already written on each day, so a second row for
     the same day ("Both") adds to the first rather than starting it again */
  const written = {};
  rows.forEach(({ f, row }) => {
    const day = by[f.date];
    const fixed = new Set();
    day.sessions = day.sessions || [];
    const firstTouch = !written[f.date];
    const done = written[f.date] = written[f.date] || new Set();
    const shape = shapeFor(f.date);
    if (shape && firstTouch) {
      const locked = day.sessions.filter(x => x.locked);
      const tp = r.tpColumn ? f.tp : day.tp;
      day.sessions = sessionsFromSlots({ tp }, shape.slots.map(sl => Object.assign({}, sl, { room: sl.kind === 'tp' ? 'Teaching practice' : sl.kind === 'input' ? 'Input' : '' })), {}, false).concat(locked);
    }
    /* the lesson times on the label: the TP block, or the day's own lessons */
    const tpAt = (f.tpAt || []).map(toMin).filter(n => n != null);
    if (tpAt.length && firstTouch) {
      const tiles = day.sessions.filter(x => x.k === 'tp').sort(byStart);
      if (tiles.length === 1 && tpAt.length > 1) {
        const block = tiles[0], end = toMin(block.e);
        day.sessions = day.sessions.filter(x => x !== block);
        tpAt.forEach((st, i) => { const next = i + 1 < tpAt.length ? tpAt[i + 1] : end; const e = Math.min(st + 45, next, Math.max(end, st + 45)); day.sessions.push({ id: newId(), s: toHM(st), e: toHM(e), k: 'tp', t: '', room: block.room || 'Teaching practice' }); });
        day.sessions.sort(byStart);
      } else tiles.forEach((x, i) => { if (tpAt[i] == null) return; const len = toMin(x.e) - toMin(x.s); x.s = toHM(tpAt[i]); x.e = toHM(tpAt[i] + len); });
      /* the lessons are where the sheet says: the rest of the day moves round them */
      day.sessions.filter(x => x.k === 'tp').forEach(x => fixed.add(x));
    }
    /* where a timed session starts in a slot, it lasts that slot (the shape's
       TP block counts on a day with no lessons in it) */
    const slotEnd = st => {
      const own = day.sessions.find(x => toMin(x.s) === st && x.k !== 'break' && x.k !== 'lunch');
      if (own) return toMin(own.e);
      const sl = shape && shape.slots.find(x => toMin(x.from) === st);
      return sl ? toMin(sl.to) : st + 45;
    };
    const lines = r.lines.filter(l => l.row === row && (l.col === 'a' || l.col === 'b'));
    const ins = day.sessions.filter(x => x.k === 'input' && !done.has(x)).sort(byStart);
    if (!shape && firstTouch && f.inputAt && ins[0]) { const len = toMin(ins[0].e) - toMin(ins[0].s); ins[0].s = f.inputAt; ins[0].e = toHM(toMin(f.inputAt) + len); fixed.add(ins[0]); }
    let n = 0;
    lines.forEach(l => {
      const k = lineKind(r, l); if (!k || k === 'skip') return;
      const t = l.title + (l.tbc && r.answers[l.tbc] === 'keep' && !/tbc|to be confirmed/i.test(l.title) ? ' (to be confirmed)' : '');
      let x;
      if (l.times) {
        const st = toMin(l.times.s);
        x = { id: newId(), s: l.times.s, e: l.times.e || toHM(slotEnd(st)), k, t };
        day.sessions.push(x); fixed.add(x); done.add(x); timed++;
      } else {
        x = ins[n++];
        if (!x) {
          const after = day.sessions.length ? Math.max(...day.sessions.filter(s => s.k !== 'break' && s.k !== 'lunch').map(s => toMin(s.e) || 0)) : 11 * 60;
          x = { id: newId(), s: toHM(after), e: toHM(after + 45), k: 'input' }; day.sessions.push(x);
        }
        x.k = k; x.t = t; done.add(x);
      }
      if (k !== 'input') delete x.by;
      sessions++;
    });
    /* an input slot the sheet left empty goes, when the sheet wrote the day */
    if (f.a || f.b) day.sessions = day.sessions.filter(x => !(x.k === 'input' && !x.t && !x.locked));
    /* the sheet's own demonstration lesson replaces the one Lite lays on day one */
    if ([...done].some(x => /\bdemo(nstration)?\b/i.test(x.t || ''))) day.sessions = day.sessions.filter(x => done.has(x) || x.locked || x.id !== 'demo');
    if (f.notes) day.notes = r.answers[row + ':dup'] === 'both' && day.notes && !firstTouch ? day.notes + ' · ' + f.notes : f.notes;
    if (!r.tpColumn && f.tp) { day.tp = f.tp; ensureTp(day); }
    fitAround(day, fixed);
  });
  if (r.tpColumn) {
    const times = {};
    rows.slice().sort((a, b) => (a.f.date < b.f.date ? -1 : 1)).forEach(({ f }) => {
      const day = by[f.date]; if (!day) return;
      if (f.tp) { const n = times[f.tp] || 0; day.tp = f.tp; day.setIndex = n % 2; times[f.tp] = n + 1; ensureTp(day); }
      else { delete day.tp; delete day.setIndex; dropTp(day); }
    });
  }
  /* the deadlines the tutor confirmed, on their assignments */
  const dues = [];
  r.questions.filter(q => q.kind === 'due' && !skipRow[q.row]).forEach(q => {
    const a = r.answers[q.id]; const key = a === 'yes' ? q.key : String(a || '').indexOf('key:') === 0 ? a.slice(4) : '';
    if (!key) return;
    /* A course with no wording yet starts from the standard wording, not
       from a bare deadline: {title, due} alone broke the wording editor and
       the trainee's submission page (10 Oct 2026). */
    const D = window.CONNECT_HUB_DEFAULT_WORDING;
    const w = rec('connect_assignment_wording_v2') || (D ? JSON.parse(JSON.stringify(D)) : {});
    w[key] = w[key] || (D && D[key] ? JSON.parse(JSON.stringify(D[key])) : { title: r.titles[key] });
    const time = q.time || '23:59';
    w[key].due = window.HubDue ? HubDue.fromLocalInput(q.date + 'T' + time) : q.date;
    w[key].dueAt = w[key].due;   // the assignment screens read `dueAt` (hubWordingFilled)
    try { localStorage.setItem('connect_assignment_wording_v2', JSON.stringify(w)); } catch (e) {}
    /* one date per assignment (Lite has no per-group deadlines): a sheet that
       gives one for each set ends up with the later one, and the summary says so */
    const i = dues.findIndex(d => d.key === key);
    const line = { key, text: r.titles[key] + ' due ' + dayName(q.date) + ', ' + hubClock(time) };
    if (i !== -1) { line.text += ' (the sheet gave two dates; the later one is kept for everyone)'; dues[i] = line; } else dues.push(line);
  });
  dues.forEach((d, i) => { dues[i] = d.text; });
  /* the terms to remember, on the course */
  const kept = [];
  r.questions.filter(q => q.kind === 'term' && r.remember[q.term]).forEach(q => { const s = rec('connect_course_settings') || {}; s.importTerms = Object.assign({}, s.importTerms, { [q.term]: r.answers[q.id] }); try { localStorage.setItem('connect_course_settings', JSON.stringify(s)); } catch (e) {} SETTINGS.importTerms = s.importTerms; kept.push(q.term); });
  patternFromDays();   /* the sheet's usual day becomes the pattern, so an imported timetable behaves like one built on the shelf */
  BUILT = { days: rows.length, sessions, timed, dues, kept, from: r.from, shapes: (r.shapes || []).map(x => x.from) };
  REVIEW = null; IMPORT_OPEN = false;
  save('Imported', { text: 'Imported from a sheet: ' + rows.length + ' day' + (rows.length === 1 ? '' : 's') + ' updated', effects: [timed ? timed + ' session' + (timed === 1 ? '' : 's') + ' at the times the sheet wrote' : ''].concat(dues.map(d => 'Deadline set: ' + d)).filter(Boolean) });
  render();
}

/* The built summary (§5.5): what came in, and that from now on the timetable
   is edited here. */
function builtHTML(){
  if (!BUILT || !IS_TUTOR) return '';
  const b = BUILT;
  return `<div class="built"><div><h3>Timetable built from the sheet</h3><p>From now on, edit the timetable here. Changes to the sheet won’t reach it; you can import again at any time.</p></div>
    <div class="facts">
      <div><b>${b.days} day${b.days === 1 ? '' : 's'}</b><span>${b.sessions} session${b.sessions === 1 ? '' : 's'} put in</span></div>
      <div><b>Times</b><span>${b.shapes && b.shapes.length ? 'The day as the sheet writes it' + (b.shapes.filter(Boolean).length ? ', changing on ' + b.shapes.filter(Boolean).map(d => esc(dayName(d))).join(', ') : '') + (b.timed ? '; ' + b.timed + ' at their own times' : '') : b.timed ? b.timed + ' at the times the sheet wrote; the rest keep the day’s own' : 'Each day keeps its own times'}</span></div>
      <div><b>Deadlines</b><span>${b.dues.length ? b.dues.map(esc).join('<br>') : 'None set from the sheet'}</span></div>
      <div><b>Remembered</b><span>${b.kept.length ? b.kept.length + ' new term' + (b.kept.length === 1 ? '' : 's') + ', used next time' : 'Nothing new'}</span></div>
    </div><button class="btn quiet" id="builtClose">Close</button></div>`;
}

function build(keep, change){
  const sk = skeleton();
  if (!sk) { note = 'The course needs a start and an end date first.'; render(); return; }
  if (keep && TT && TT.days) {
    const old = {}; TT.days.forEach(d => { old[d.date] = d; });
    /* Keep what each day already says: its cells (the day shape, 30 Sep
       2026) and its notes. This still copied the old a/b fields, so a rebuild
       that was meant to keep the sessions dropped every one of them. */
    sk.days.forEach(d => {
      const o = old[d.date]; if (!o) return;
      d.notes = o.notes || '';
      if (Array.isArray(o.sessions)) d.sessions = JSON.parse(JSON.stringify(o.sessions));
      if (o.closed) { d.closed = true; d.sessions = []; d.notes = ''; }
    });
    const keepPins = TT.pins, tray = Array.isArray(TT.unplaced) ? TT.unplaced.slice() : [];
    sk.days.forEach(d => { if (!old[d.date] && tray.length) { const c = tray.shift(); d.sessions = c.sessions || []; d.notes = c.notes || ''; } });
    TT = Object.assign(sk, keepPins ? { pins: keepPins } : {}, tray.length ? { unplaced: tray } : {}, TT.updates ? { updates: TT.updates } : {});
    TT.days.forEach(d => { if (d.closed) { delete d.tp; delete d.setIndex; } else if (d.tp) ensureTp(d); else dropTp(d); });
  } else TT = Object.assign(sk, TT && TT.updates ? { updates: TT.updates } : {});
  save('Built', change);
}

/* The last course's days onto this course's dates, in order. A course longer
   than the last one keeps the usual day on the days past its end, without a
   practice; a shorter one leaves the last course's final days behind, and the
   note says how many. */
function startFromCarried(){
  const c = TT && TT.carried; if (!c) return;
  const sk = skeleton();
  if (!sk) { note = 'The course needs a start and an end date first.'; render(); return; }
  const from = c.days, slots = (TT.slots && TT.slots.length) ? TT.slots : DEFAULT_SLOTS;
  /* a day past the last course's end looks like its last day, with the
     names left for the tutor and no practice */
  const lastO = from[from.length - 1] || {};
  const tail = Array.isArray(lastO.sessions) ? lastO.sessions.filter(x => x.k !== 'tp').map(x => Object.assign({}, x, ['input', 'task', 'event'].indexOf(x.k) !== -1 ? { k: 'input', t: '' } : {})) : null;
  sk.days.forEach((d, i) => {
    const o = from[i];
    if (!o) { delete d.tp; delete d.setIndex; if (tail) d.sessions = tail.map(x => Object.assign({}, x, { id: newId() })); else dropTp(d); return; }
    d.notes = o.notes || '';
    d.sessions = Array.isArray(o.sessions) ? JSON.parse(JSON.stringify(o.sessions)) : sessionsFromSlots(o, slots, o.cells || {}, i === 0);
    if (o.tp) { d.tp = o.tp; d.setIndex = o.setIndex || 0; } else { delete d.tp; delete d.setIndex; }
    delete d.first;
  });
  const extra = Math.max(0, sk.days.length - from.length), left = Math.max(0, from.length - sk.days.length);
  TT = sk;
  save('Built', { text: 'Started from ' + c.from + '’s timetable' });
  note = 'Started from ' + c.from + ': ' + Math.min(from.length, TT.days.length) + ' days laid onto this course’s dates'
    + (extra ? '; ' + extra + ' day' + (extra === 1 ? '' : 's') + ' past its end look like its last day, without a practice' : '')
    + (left ? '; ' + c.from + '’s last ' + left + ' day' + (left === 1 ? '' : 's') + ' did not fit' : '') + '.';
  render();
}

function wireEdits(){
  if (!EDIT) return;
  document.querySelectorAll('input[data-date]').forEach(el => {
    let t = null;
    const fire = () => {
      const day = TT.days.find(d => d.date === el.dataset.date);
      if (!day) return;
      if (el.dataset.slot) { day.cells = day.cells || {}; day.cells[el.dataset.slot] = el.value; }
      else day[el.dataset.f] = el.value;
      save('Saved', { key: 'notes:' + day.date, text: 'Notes on ' + dayName(day.date) + (el.value ? ': \u201c' + el.value + '\u201d' : ' cleared') });
    };
    el.addEventListener('input', () => { clearTimeout(t); t = setTimeout(fire, 800); });
    el.addEventListener('blur', () => { clearTimeout(t); fire(); });
  });
}

/* Written whole, through the ordinary course-record queue in hub-sync: the
   same path settings and wording take, so it is ledgered and retried. */
function save(word, change){
  if (change && IS_TUTOR) {
    const c = Object.assign({ at: new Date().toISOString() }, change);
    const last = CHANGES[CHANGES.length - 1];
    if (c.key && last && last.key === c.key) CHANGES[CHANGES.length - 1] = c; else CHANGES.push(c);
  }
  compact(TT && TT.days);
  /* The usual day follows the board: the slots of the first teaching day, so a
     new day is laid out like the course as it is now, and a page that only
     wants "the" TP times (a volunteer's hours) still has them. */
  if (TT && TT.days && window.hubSessionSlots) {
    const d = TT.days.find(x => x.tp && (x.sessions || []).some(s => s.k === 'tp')) || TT.days.find(x => (x.sessions || []).length);
    if (d) TT.slots = hubSessionSlots(d.sessions);
  }
  let out = TT;
  if (IS_TUTOR && TT && TT.published && LIVE && LIVE.days) {
    out = Object.assign({}, TT, JSON.parse(JSON.stringify(LIVE)));
    LIVE_KEYS.forEach(k => { if (LIVE[k] === undefined) delete out[k]; });
    const same = LIVE.days.length === TT.days.length && LIVE.days.every((d, i) => d.date === TT.days[i].date);
    const dr = { changes: CHANGES };
    let differs = false;
    if (same) { dr.days = {}; TT.days.forEach((d, i) => { if (JSON.stringify(d) !== JSON.stringify(LIVE.days[i])) { dr.days[d.date] = d; differs = true; } }); }
    else { dr.all = TT.days; differs = true; }
    ['meets', 'unplaced'].forEach(k => { if (JSON.stringify(TT[k]) !== JSON.stringify(LIVE[k])) { dr[k] = TT[k] === undefined ? null : TT[k]; differs = true; } });
    if (differs || CHANGES.length) out.draft = dr; else { delete out.draft; CHANGES = []; }
    /* the usual day the other pages read is the published one */
    const pd = (out.days || []).find(x => x.tp && (x.sessions || []).some(s => s.k === 'tp')) || (out.days || []).find(x => (x.sessions || []).length);
    if (pd && window.hubSessionSlots) out.slots = hubSessionSlots(pd.sessions);
  }
  try { localStorage.setItem(KEY, JSON.stringify(out)); } catch(e) {}
  note = word || 'Saved';
  const st = document.querySelector('.status'); if (st) st.textContent = note;
  setTimeout(() => { note = ''; const s2 = document.querySelector('.status'); if (s2 && !busy) s2.textContent = ''; }, 2500);
  if (word === 'Built') render();
}

/* The reader taking over. NOT on `scroll`: my own scrollTo fires that event,
   so a scroll listener marked the page as touched the instant the page put
   itself on today, and every later render then left it wherever it landed.
   A wheel, a finger, a key or a click is a person; a scroll event is not
   (30 Sep 2026). */
['wheel','touchstart','pointerdown','keydown'].forEach(function(ev){
  document.addEventListener(ev, function(){ SCROLLED = true; }, { once: true, passive: true });
});

/* ---- v2 (7 Oct 2026): ribbon, now line, due pills -----------------------
   Layered on whatever render() last drew, so render stays the one source.
   A MutationObserver on the page re-applies after every render; the guards
   below mean its own additions never trigger another pass. */
(function(){
  const host = document.getElementById('app'); if (!host) return;
  const p2 = n => String(n).padStart(2, '0');
  const mins = s => { const m = /^(\d{1,2}):(\d{2})/.exec(String(s || '')); return m ? +m[1] * 60 + +m[2] : null; };
  const nowD = () => { const n = window.hubNow ? hubNow() : new Date(); return n instanceof Date ? n : new Date(n); };
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00') - Date.parse(a + 'T12:00:00')) / 864e5);
  const jump = date => {
    const el = document.getElementById('d-' + date); if (!el) return;
    /* on a phone the week is a row of days: bring the day across as well as down */
    if (el.parentElement && el.parentElement.scrollWidth > el.parentElement.clientWidth) el.parentElement.scrollTo({ left: el.offsetLeft - el.parentElement.offsetLeft, behavior: 'smooth' });
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 64, behavior: 'smooth' });
  };

  function ribbon(){
    const days = (TT && TT.days) || []; if (!days.length || host.querySelector('.tv2-rib')) return;
    const firstWk = host.querySelector('.tkey') || host.querySelector('.wk'); if (!firstWk) return;
    const idx = days.findIndex(d => d.date === TODAY);
    const before = days[0] && TODAY < days[0].date, after = days[days.length - 1] && TODAY > days[days.length - 1].date;
    const head = idx >= 0 ? 'Day <em>' + (idx + 1) + '</em> of ' + days.length
      : before ? 'Starts in <em>' + daysBetween(TODAY, days[0].date) + '</em> day' + (daysBetween(TODAY, days[0].date) === 1 ? '' : 's')
      : after ? 'The course is finished' : days.length + ' days';
    const tps = days.filter(d => d.tp).length;
    const sub = days.length + ' days \u00b7 ' + tps + ' with teaching practice';
    const segs = days.map((d, i) => {
      const dt = new Date(d.date + 'T12:00:00'), mon = dt.getDay() === 1 && i > 0;
      const cls = ['tv2-seg', d.closed ? 'closed' : '', d.date < TODAY ? 'past' : '', d.date === TODAY ? 'today' : '', mon ? 'mon' : ''].filter(Boolean).join(' ');
      const due = (typeof DUES !== 'undefined' && DUES[d.date] && DUES[d.date].length) ? DUES[d.date].map(x => x.title).join(', ') : '';
      const tip = 'Day ' + (i + 1) + ' \u00b7 ' + dt.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + (d.tp ? ' \u00b7 TP ' + d.tp : '') + (due ? ' \u00b7 ' + due + ' due' : '');
      return '<button type="button" class="' + cls + '" data-go="' + esc(d.date) + '" title="' + esc(tip) + '" aria-label="' + esc(tip) + '">' + (i + 1)
        + (d.tp ? '<span class="tp"></span>' : '') + (due ? '<span class="du"></span>' : '') + '</button>';
    }).join('');
    firstWk.insertAdjacentHTML('beforebegin', '<div class="tv2-rib"><div class="top"><b>' + head + '</b><span>' + sub + '</span></div>'
      + '<div class="tv2-segs">' + segs + '</div>'
      + '<div class="tv2-key"><span><i class="k-tp"></i>teaching practice</span><span><i class="k-du"></i>a deadline</span></div></div>');
    host.querySelector('.tv2-segs').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) jump(b.dataset.go); });
  }

  function nowLine(){
    const card = host.querySelector('.day.today'); if (!card) return;
    const n = nowD(), m = n.getHours() * 60 + n.getMinutes();
    const dh = card.querySelector('.dh');
    let clock = dh && dh.querySelector('.tv2-clock');
    if (dh && !clock) { clock = document.createElement('span'); clock.className = 'tv2-clock'; dh.appendChild(clock); }
    if (clock) clock.textContent = hubClock(p2(n.getHours()) + ':' + p2(n.getMinutes()));
    card.querySelectorAll('.sl, .tile[data-from]').forEach(row => {
      const t = row.dataset.from ? row : row.querySelector('.t[data-from]');
      const a = t ? mins(t.dataset.from) : null, b = t ? mins(t.dataset.to) : null;
      row.classList.toggle('tv2-now', a != null && b != null && m >= a && m < b);
      row.classList.toggle('tv2-past', b != null && m >= b);
      if (row.classList.contains('tile')) row.classList.toggle('joinable', a != null && b != null && m >= a - 15 && m < b);
    });
    /* the line across today's column at the time it is now */
    const bar = card.querySelector('.nowbar'), body = bar && bar.parentElement;
    if (bar && body) { const y = (m - (+body.dataset.start || 0)) * PXM; bar.hidden = y < 0 || y > body.offsetHeight; bar.style.top = y + 'px'; }
  }

  function duePills(){
    host.querySelectorAll('.day .due:not(.out)').forEach(el => {
      if (el.querySelector('.tv2-in')) return;
      const day = el.closest('.day'); const date = day && day.id.replace(/^d-/, ''); if (!date || date < TODAY) return;
      const n = daysBetween(TODAY, date);
      el.insertAdjacentHTML('beforeend', '<span class="tv2-in' + (n <= 2 ? ' soon' : '') + '">' + (n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days') + '</span>');
    });
  }

  let q = null;
  const apply = () => { q = null; try { ribbon(); nowLine(); duePills(); } catch (e) {} };
  new MutationObserver(() => { if (!q) q = requestAnimationFrame(apply); }).observe(host, { childList: true });
  apply();
  setInterval(nowLine, 30000);
})();

render();
</script>
</body>
</html>
