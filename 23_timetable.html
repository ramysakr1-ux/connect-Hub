  const mk = makeupNote(day.date);
  const notes = EDIT
    ? `<div class="notes"><input type="text" data-date="${esc(day.date)}" data-f="notes" value="${esc(day.notes || '')}" placeholder="Notes">${mk}</div>`
    : ((day.notes || mk) ? `<div class="notes">${esc(day.notes || '')}${mk}</div>` : '');
  if (day.closed) return `<div class="day closed" id="d-${esc(day.date)}">
    <div class="dh"><div class="dt"${EDIT ? ` data-close="${esc(day.date)}" title="Reopen this day"` : ''}><span class="dow">${DOW[d.getDay()]}</span> <span class="dm">${dm(d)}</span><small>No course</small></div></div>
    <div class="body" style="height:${H}px"><div class="closedmsg">${EDIT ? 'Closed<br><span>click the date to reopen</span>' : 'No course today'}</div></div></div>`;
  return `<div class="day${isToday ? ' today' : ''}" id="d-${esc(day.date)}">
    <div class="dh"><div class="dt"${EDIT ? ` data-close="${esc(day.date)}" title="Close this day (a holiday, a snow day)"` : ''}><span class="dow">${DOW[d.getDay()]}</span> <span class="dm">${dm(d)}${isToday ? ' · today' : ''}</span><small>Day ${idx + 1}</small>${dayMark(day)}</div>
      ${EDIT && pinned(day.date) ? '<span class="pin" title="Copying a day’s shape leaves this one alone">Pinned</span>' : ''}
      ${EDIT ? `<button type="button" class="more" data-menu="${esc(day.date)}" aria-label="Options for this day">⋯</button>` : ''}</div>
    <div class="body" style="height:${H}px" data-start="${B.from}">${hours}${ses.map(x => tileHTML(day, x, B, tpTiles.indexOf(x), teachers)).join('')}${dues}${isToday ? '<div class="nowbar" hidden></div>' : ''}</div>
    ${EDIT ? `<button type="button" class="addtile" data-add="${esc(day.date)}">+ Add a tile</button>` : ''}
    ${notes}
  </div>`;
}

/* ---- THE TIMETABLE ACROSS (10 Oct 2026) ----------------------------------
   Ramy: the board down the page was "confusing. Especially with the time being
   different inside the cards and on the left of the cards". Across, a day is
   a row and the day's slots are columns: the time is written once, above the
   week, every tile is a slot wide, and a tile grows with its words rather
   than its minutes. A course picks across or down on Course admin
   (settings.ttLayout 'h'), once, before it starts.

   THE COLUMNS are worked out per week, because a course's afternoon can move
   (C/18 teaches at 3:00 for two weeks, then at 2:00): the shape most of the
   week's days share, plus a column for anything no column takes, so nothing
   is ever left off the board. A session sits in the columns it mostly fills;
   one that runs differently from its column says its own time. */
const ACROSS = () => SETTINGS.ttLayout === 'h';
/* breaks are on the board too, as narrow tiles (Ramy, 29 Oct 2026: "make the 15-minute break tiles smaller") */
const spansOf = d => (d.sessions || []).filter(x => toMin(x.s) != null && toMin(x.e) != null).sort(byStart);
function placeDay(day, cols){
  const used = new Set(), at = [], miss = [];
  spansOf(day).forEach(x => {
    const s = toMin(x.s), e = toMin(x.e);
    const hit = cols.map((c, i) => i).filter(i => {
      if (used.has(i)) return false;
      const a = toMin(cols[i].s), b = toMin(cols[i].e), ov = Math.min(e, b) - Math.max(s, a);
      return ov > 0 && (ov >= (b - a) / 2 || ov >= (e - s) / 2);
    });
    if (!hit.length) { miss.push(x); return; }
    /* EVERY TILE ONE SLOT (Ramy, 29 Oct 2026: "equal sized tiles ... basically an Excel sheet"): a session that runs
       longer than its slot still takes one, and says its own times */
    const a = hit[0], b = a;
    used.add(a);
    at.push({ x, a, b, exact: toMin(cols[a].s) === s && toMin(cols[b].e) === e });
  });
  return { at, miss };
}
function weekCols(w){
  const open = w.filter(d => !d.closed);
  const count = {};
  open.forEach(d => { const sig = spansOf(d).map(x => x.s + '-' + x.e).join(','); if (sig) count[sig] = (count[sig] || 0) + 1; });
  const best = Object.keys(count).sort((a, b) => count[b] - count[a] || b.split(',').length - a.split(',').length)[0];
  let cols = best ? best.split(',').map(p => { const [s, e] = p.split('-'); return { s, e }; })
    : template().filter(sl => sl.from && sl.to && (sl.kind !== 'break' || /lunch/i.test(sl.label || ''))).map(sl => ({ s: sl.from, e: sl.to }));
  for (let guard = 0; guard < 60; guard++) {
    let miss = null;
    open.some(d => { const m = placeDay(d, cols).miss[0]; if (m) miss = m; return !!m; });
    if (!miss) break;
    cols = cols.concat([{ s: miss.s, e: miss.e }]).sort((a, b) => toMin(a.s) - toMin(b.s) || toMin(a.e) - toMin(b.e));
  }
  return cols;
}
/* The column a moment falls in: the one it is inside, else the last to have
   started, else the first. For a deadline's flag. */
function colAt(m, cols){
  let i = cols.findIndex(c => m >= toMin(c.s) && m < toMin(c.e));
  if (i === -1) { cols.forEach((c, k) => { if (toMin(c.s) <= m) i = k; }); }
  return Math.max(0, i);
}
/* THE BOARD, ACROSS OR DOWN (Ramy, 29 Oct 2026: "the same view ... across or down, it's just a question of are we going
   sideways or are we going vertical"). One grid of equal tiles, each carrying its own time; across, a day is a row and
   its slots are columns; down, a day is a column and its slots are rows. A 15-minute slot is a narrow tile. Deadlines
   and the assignments going out sit with the day's name. Every place on the grid, filled or not, carries its date and
   its slot (data-date, data-i), which is how a drop finds where it lands. */
let WEEKCOLS = {};
/* ONE GROUP AT A TIME (Ramy, 29 Oct 2026, on two letters in one tile: "are they co-teaching?"): where two groups teach
   side by side, staff look at one group's letters at a time; a trainee only ever has their own. Remembered per browser. */
let GVIEW = (function(){ try { return localStorage.getItem('tt:group') || ''; } catch (e) { return ''; } })();
function groupSwitchHTML(){
  if (IS_TRAINEE || GROUPS.length < 2) return '';
  if (!GVIEW || !GROUPS.some(g => String(g.group) === GVIEW)) GVIEW = String(GROUPS[0].group);
  return `<div class="gswitch" role="tablist" aria-label="Which group's teaching practice">${GROUPS.map(g => `<button type="button" role="tab" data-gview="${esc(g.group)}" class="${String(g.group) === GVIEW ? 'on' : ''}" aria-selected="${String(g.group) === GVIEW}">Group ${esc(g.group || '—')}</button>`).join('')}<span>Teaching practice shows one group at a time.</span></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-gview]'); if (!b) return;
  GVIEW = b.dataset.gview; try { localStorage.setItem('tt:group', GVIEW); } catch (x) {}
  render();
});
function weekBoard(w, n){
  const across = ACROSS(), cols = weekCols(w);
  w.forEach(d => { WEEKCOLS[d.date] = cols; });
  const places = new Map(w.map(d => [d, d.closed ? { at: [], miss: [] } : placeDay(d, cols)]));
  const narrow = cols.map(c => toMin(c.e) - toMin(c.s) <= 15);
  const flagsOf = day => {
    const out = [];
    (OUTS[day.date] || []).forEach(o => out.push(outFlag(o)));
    (DUES[day.date] || []).forEach(x => {
      const local = window.HubDue && x.due ? HubDue.toLocalInput(x.due).slice(11, 16) : '';
      const late = x.past && x.missing;
      const body = `${esc(x.title)} in${local ? ' · ' + esc(hubClock(local)) : ''}${late ? ' · ' + (IS_TRAINEE ? 'yours is not in' : x.missing + ' of ' + x.total + ' not in') : ''}`;
      out.push((EDIT && !x.fixed) ? `<button type="button" class="due asbtn${late ? ' late' : ''}" data-move="${esc(x.key)}" title="Move this deadline">${body}</button>` : `<div class="due${late ? ' late' : ''}">${body}</div>`);
    });
    return out;
  };
  const maxFlags = Math.max(0, ...w.map(d => flagsOf(d).length));
  const hasEnd = EDIT || w.some(d => !d.closed && (d.notes || makeupNote(d.date) || flagsOf(d).length));
  const cells = (day, idx) => {
    const d = parse(day.date), isToday = day.date === TODAY;
    const mk = makeupNote(day.date), fl = flagsOf(day);
    /* no notes box on the day (Ramy, 29 Oct 2026: "those notes on top ... I don't like them"): a note shows as text, and is written from the day's ⋯ menu */
    /* a day's note sits at the END of the day (Ramy, 29 Oct 2026: "notes on the right if we're going across, at the bottom if we're going down") */
    const notes = '';
    const dh = `<div class="dh"><div class="dt"${EDIT ? ` data-close="${esc(day.date)}" title="${day.closed ? 'Reopen this day' : 'Close this day (a holiday, a snow day)'}"` : ''}><span class="dow">${DOW[d.getDay()]}</span> <span class="dm">${dm(d)}${isToday ? ' · today' : ''}</span><small>${day.closed ? 'No course' : 'Day ' + (idx + 1)}</small>${day.closed ? '' : dayMark(day)}</div>`
      + '</div>';
    /* THE END OF THE DAY (Ramy, 29 Oct 2026: "the notes ... add a tile, LSRT and all this stuff, I want this on the right,
       and if we're going down, at the bottom"): the deadlines, the note and the day's buttons follow its last tile */
    const acts = EDIT && !day.closed ? `<div class="dacts">${pinned(day.date) ? '<span class="pin" title="Copying a day’s shape leaves this one alone">Pinned</span>' : ''}<button type="button" class="more" data-menu="${esc(day.date)}" aria-label="Options for this day">⋯</button><button type="button" class="addtile" data-add="${esc(day.date)}" title="A new tile at the end of the day">+ Add a tile</button></div>` : '';
    const noteEnd = hasEnd ? `<div class="dnoteend">${fl.length ? `<div class="flags">${fl.join('')}</div>` : ''}${day.notes ? '<div class="nt"><b>Note</b> ' + esc(day.notes) + '</div>' : ''}${mk ? '<div class="nt">' + mk + '</div>' : ''}${acts}</div>` : '';
    if (day.closed) return dh + `<div class="closedmsg">${EDIT ? 'Closed · click the date to reopen' : 'No course today'}</div>`;
    /* (the note's place is kept on a closed day too, so the rows still line up) */
    const teachers = teachersOf(day);
    const tps = (day.sessions || []).filter(x => x.k === 'tp').sort(byStart);
    const byCol = new Map(places.get(day).at.map(t => [t.a, t]));
    return dh + cols.map((c, i) => {
      const t = byCol.get(i);
      if (t) return tileHTML(day, t.x, null, tps.indexOf(t.x), teachers, { i, exact: t.exact, narrow: narrow[i], across });
      return `<div class="slot${narrow[i] ? ' narrow' : ''}" data-date="${esc(day.date)}" data-i="${i}"></div>`;
    }).join('') + noteEnd;
  };
  const track = cols.map((c, i) => narrow[i] ? 'var(--slim)' : 'var(--cell)').join(' ') + (hasEnd ? ' var(--note)' : '');
  const style = `--ncols:${cols.length};--track:${track};--hh:calc(var(--hh0) + ${maxFlags} * 22px)`;
  return `<div class="tscroll"><div class="tgrid tboard ${across ? 'across' : 'down'}" style="${style}">`
    + w.map(d => `<div class="day${d.date === TODAY ? ' today' : ''}${d.closed ? ' closed' : ''}" id="d-${esc(d.date)}">${cells(d, TT.days.indexOf(d))}</div>`).join('')
    + `</div></div>`;
}

/* LIVE COLOR. Ramy, 29 Sep 2026: "this timetable is alive, so color should
   maybe mean something on the timetable."
 *
 * A printed timetable can only say what is planned. This one knows what
 * happened, because Lite holds the plans, the feedback and the grades. Three
 * states, one meaning each, and nothing else gets a hue:
 *
 *   done   the lesson was taught and returned to standard or above. A quiet
 *          tick. It is the ordinary outcome and should not shout.
 *   watch  the lesson is today or tomorrow and the plan is not in. Amber.
 *          A reminder, not a warning -- the same tone as the deadlines.
 *   alarm  the lesson was not to standard. Garnet. Something followed from
 *          it: another lesson in the same family, possibly a stage record.
 *
 * WHO SEES WHAT. A tutor sees every trainee's state, because that is their
 * job. A trainee sees only their own -- whether somebody else failed a
 * lesson is not theirs to read off a timetable, and the store only sends them
 * their own record anyway.
 */
function stateMap(){
  const T = window.HubTracker;
  const out = {};
  if (!T) return out;
  const roster = rec('connect_roster_v1') || {};
  const me = rec('hub:me') || {};
  Object.values(roster.trainees || {}).filter(Boolean).forEach(tr => {
    const token = tr.id || tr.token;
    if (!token) return;
    if (IS_TRAINEE && token !== me.token) return;       // only their own
    let c = null; try { c = T.recordFor(tr); } catch (e) { return; }
    if (!c) return;
    const mine = {};
    for (let n = 1; n <= 20; n++) {
      const g = c['tp' + n];
      if (g) mine[n] = { grade: g };
    }
    /* The plan in hand, and which practice it is for. A plan names its own
       TP ("TP3"), so a plan for a later lesson does not count as this one's. */
    const plan = (tr.records && tr.records.plan) || (IS_TRAINEE ? rec('chub:plan') : null);
    const planFor = plan && plan.meta && plan.meta.tp ? String(plan.meta.tp).replace(/[^0-9]/g, '') : '';
    out[token] = { tps: mine, planFor: planFor ? +planFor : 0 };
  });
  return out;
}

/* Is this day today or tomorrow? A plan that is not in three weeks out is not
   news; one that is not in for tomorrow is. */
function soon(dateISO){
  const d = parse(dateISO); if (!d) return false;
  const now = parse(TODAY); if (!now) return false;
  const diff = Math.round((d - now) / 86400000);
  return diff >= 0 && diff <= 1;
}

/* The mark for one trainee on one practice. Nothing when there is nothing
   to say, which is most of the time -- the grid stays readable and the eye
   goes to the day that needs somebody. */
function markFor(token, tp, dateISO){
  const st = STATE[token];
  if (!st) return '';
  const g = (st.tps[tp] || {}).grade;
  if (g === 'NOTSTD') return `<span class="mk alarm" title="Not to standard">\u25cf</span>`;
  if (g) return `<span class="mk done" title="${g === 'ABOVE' ? 'Above standard' : 'To standard'}">\u2713</span>`;
  if (soon(dateISO) && st.planFor !== tp) return `<span class="mk watch" title="The plan is not in yet">\u25cf</span>`;
  return '';
}

/* A color that means something has to say what it means, and only while it
   is on the page: a key to marks nobody can see is furniture. */
/* THE ROOMS, ONCE, ABOVE THE WEEKS. Ramy, 1 Oct 2026: the join links inside
   the cells were "too close to each other -- you could end up clicking the
   wrong link", so the cells carry none, and the rooms stand in one strip
   above the timetable, named by the LEVEL of the class they hold ("Teaching
   practice · B1") rather than by group. Each shows the time of its slot
   today, and the one whose slot is running is lit -- from ten minutes before
   it starts until it ends, on the course's own clock -- "like Connect". The
   landing page keeps its own strip too: two doors. */
function roomsStrip(){
  const rooms = (Array.isArray(SETTINGS.onlineRooms) ? SETTINGS.onlineRooms : []).filter(r => r && r.url && /^https?:\/\//i.test(r.url));
  if (!rooms.length) return '';
  const slots = slotsOf({ date: TODAY });
  const n0 = window.hubNow ? hubNow() : new Date();
  const now = n0 instanceof Date ? n0 : new Date(n0);
  const todayIsCourseDay = (TT.days || []).some(d => d.date === TODAY);
  const hm = (h, m) => h * 60 + m;
  const mins = str => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(str || '')); return m ? hm(+m[1], +m[2]) : null; };
  const nowMin = hm(now.getHours(), now.getMinutes());
  const forRoom = r => slots.filter(sl => sl.room && String(sl.room).toLowerCase() === String(r.label || '').toLowerCase());
  return `<div class="rooms"><span class="rl">Join</span>${rooms.map(r => {
    const mine = forRoom(r);
    const first = mine[0];
    const live = todayIsCourseDay && mine.some(sl => { const a = mins(sl.from), b = mins(sl.to); return a != null && b != null && nowMin >= a - 10 && nowMin <= b; });
    const where = r.level ? esc(r.level) : (r.group ? 'Group ' + esc(r.group) : '');
    const when = first ? esc(mine.length > 1 ? hubClockRange(first.from, mine[mine.length - 1].to) : hubClock(first.from)) : '';
    /* A small camera in each (Ramy, 25 Oct 2026): it says at a glance the button opens an online room. */
    return `<a class="rm${live ? ' live' : ''}" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><b><svg class="cam" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2.5"/><path d="M16 10.5l6-3.5v10l-6-3.5z"/></svg>${esc(r.label || 'Room')}${where ? ' \u00b7 ' + where : ''}</b><small>${live ? 'Live now' : when}</small></a>`;
  }).join('')}</div>`;
}
function keyLine(){
  const seen = { done:0, watch:0, alarm:0 };
  Object.keys(STATE).forEach(t => {
    const st = STATE[t];
    Object.keys(st.tps).forEach(n => { const g = st.tps[n].grade; if (g === 'NOTSTD') seen.alarm++; else if (g) seen.done++; });
  });
  (TT.days || []).forEach(d => { if (d.tp && soon(d.date)) seen.watch++; });
  const bits = [];
  if (seen.done) bits.push('<span class="mk done">\u2713</span> taught and returned');
  if (seen.watch) bits.push('<span class="mk watch">\u25cf</span> the plan is not in yet');
  if (seen.alarm) bits.push('<span class="mk alarm">\u25cf</span> not to standard');
  if (!bits.length) return '';
  return `<p class="legend keyline">${bits.join('<span class="sp">\u00b7</span>')}</p>`;
}

/* MOVING A DEADLINE FROM THE TIMETABLE (30 Sep 2026, the last of phase two).
 *
 * A deadline has always lived on the assignment's own wording, and the
 * timetable could only show it. But the timetable is where you can SEE that a
 * deadline lands the day before three lessons, or on the day a group teaches,
 * and seeing it somewhere you cannot act is its own small cruelty.
 *
 * So a tutor can move one from here. It writes back to the same field the
 * wording screen writes, so there is still one deadline, not two. The time of
 * day is kept -- moving a date should not quietly turn 23:00 into midnight.
 *
 * And it warns rather than refuses. A deadline on a day the group is teaching
 * is against the center's own scheduling rule, but a warning is right where a
 * veto is not: a tutor moving a deadline usually knows something the software
 * does not. */
let MOVING = null;   // the assignment key whose deadline is being moved

/* Does this group teach on that day? Their set decides which of a practice's
   two days is theirs, so "teaching that day" is a per-group question. */
function teachesOn(dateISO){
  const day = (TT.days || []).find(d => d.date === dateISO);
  if (!day || !day.tp) return [];
  return GROUPS.filter(g => (g.sets[day.setIndex] || []).length).map(g => g.group);
}

/* THE ASSIGNMENT DATES LIVE ON THE TIMETABLE (Ramy, 29 Oct 2026: "the assignment due date and time should be on the
   timetable itself, as we set up the timetable, not course admin ... course admin is just the wording"; "also need one
   for resubmission"). Each assignment: when it opens (it opens by itself then; Course admin can still open it early),
   when it is due, and when a resubmission is due. Written where every reader already looks, on the assignment record. */
let ASG_OPEN = /^#asgDates$/.test(location.hash);
const ASG_KEYS = () => { const w = rec('connect_assignment_wording_v2') || window.CONNECT_HUB_DEFAULT_WORDING || {}; const o = window.hubAssignmentOrder ? hubAssignmentOrder(w) : ['fol', 'lrt', 'lsrt', 'lfc']; return o.filter(k => k !== 'a5' && w[k]); };
function asgDatesHTML(){
  if (!ASG_OPEN || !IS_TUTOR) return '';
  const w = rec('connect_assignment_wording_v2') || window.CONNECT_HUB_DEFAULT_WORDING || {};
  const v = iso => iso && window.HubDue ? esc(HubDue.toLocalInput(iso)) : '';
  const rows = ASG_KEYS().map(k => { const a = w[k] || {};
    return `<div class="adrow" data-k="${esc(k)}"><b>${esc(a.title || k.toUpperCase())}</b>
      <label><span>Opens</span><input type="datetime-local" data-f="open" value="${v(a.releaseFrom || a.outAt)}"></label>
      <label><span>Due</span><input type="datetime-local" data-f="due" value="${v(a.dueAt || a.due)}"></label>
      <label><span>Resubmission by</span><input type="datetime-local" data-f="resub" value="${v(a.resubDueAt)}"></label></div>`; }).join('');
  /* THE RULES (Ramy, 29 Oct 2026: "we can't have fixed rules ... an option to say when they're due ... FoL due nine days
     after ... LRT seven days after it's out"): per assignment, due N course days after the day its session is on, at a
     time; the resubmission M course days after that. "Lay the dates" reads where each session tile is now. */
  const R0 = TT.asgRules || {}, def = { fol: [5, '17:00', 5, '17:00'], lrt: [5, '17:00', 2, '17:00'], lsrt: [2, '17:00', 1, '17:00'], lfc: [4, '17:00', 1, '17:00'] };
  const rule = k => { const r = R0[k] || {}, d = def[k] || [4, '17:00', 3, '17:00']; return { due: r.due != null ? r.due : d[0], dt: r.dt || d[1], re: r.re != null ? r.re : d[2], rt: r.rt || d[3] }; };
  const rules = ASG_KEYS().map(k => { const r = rule(k), sess = asgSession(k);
    return `<div class="arule" data-k="${esc(k)}"><b>${esc(asgShort(k, (w[k] || {}).title))}</b>
      <span>due <input type="number" min="0" max="20" data-r="due" value="${r.due}"> course days after its session, at <input type="time" data-r="dt" value="${esc(r.dt)}"></span>
      <span>resubmission <input type="number" min="0" max="20" data-r="re" value="${r.re}"> days after that, at <input type="time" data-r="rt" value="${esc(r.rt)}"></span>
      <small>${sess ? 'Its session: ' + esc(dayName(sess.date)) + ', ' + esc(hubClock(sess.s)) : 'No session tile for it on the timetable yet'}</small></div>`; }).join('');
  return `<div class="imp" id="asgDates"><h3>Assignment dates</h3>
    <div class="arules"><h4>The rules</h4><p>Counted in course days from the day its session is on, so a weekend or a day off never takes a deadline.</p>${rules}
      <div class="row"><button class="btn" id="asgLay">Lay the dates from the rules</button><span class="status" id="asgLaid"></span></div></div>
    <h4>The dates</h4><p>When each assignment opens to the trainees, when it is due, and when a resubmission is due. Change any one by hand here; it shows on the day it falls. The wording is in Course admin.</p>
    ${rows || '<p class="status">No assignments on this course yet.</p>'}
    <div class="row"><button class="btn quiet" id="asgClose">Done</button></div></div>`;
}
/* the session tile an assignment goes out on: its short name or its title, at the start of a tile's name */
function asgSession(k){
  const w = rec('connect_assignment_wording_v2') || window.CONNECT_HUB_DEFAULT_WORDING || {}, a = w[k] || {};
  const names = [asgShort(k, a.title), a.title || '', (window.CONNECT_HUB_DEFAULT_WORDING && (CONNECT_HUB_DEFAULT_WORDING[k] || {}).title) || ''].filter(Boolean).map(x => String(x).toLowerCase());
  for (const d of (TT.days || [])) { if (d.closed) continue; const x = (d.sessions || []).find(t => { const n = String(t.t || '').toLowerCase(); return n && names.some(m => n.indexOf(m) === 0); }); if (x) return { date: d.date, s: x.s }; }
  return null;
}
function layAsgDates(){
  const open = (TT.days || []).filter(d => !d.closed).map(d => d.date), laid = [];
  ASG_KEYS().forEach(k => {
    const sess = asgSession(k); if (!sess) return;
    const r = (TT.asgRules || {})[k] || {}, i = open.indexOf(sess.date); if (i < 0) return;
    const due = open[Math.min(open.length - 1, i + (+r.due || 0))], re = open[Math.min(open.length - 1, open.indexOf(due) + (+r.re || 0))];
    setAsgDate(k, 'open', sess.date + 'T' + sess.s); setAsgDate(k, 'due', due + 'T' + (r.dt || '17:00')); setAsgDate(k, 'resub', re + 'T' + (r.rt || '17:00'));
    laid.push(asgShort(k));
  });
  return laid;
}
function setAsgDate(k, f, local){
  const w = rec('connect_assignment_wording_v2') || JSON.parse(JSON.stringify(window.CONNECT_HUB_DEFAULT_WORDING || {}));
  const a = w[k] = w[k] || {}, iso = local && window.HubDue ? HubDue.fromLocalInput(local) : '';
  if (f === 'open') { if (iso) { a.releaseFrom = iso; a.outAt = iso; if (iso > new Date().toISOString()) a.released = false; } else { delete a.releaseFrom; delete a.outAt; } }
  if (f === 'due') { a.dueAt = iso; a.due = iso; }
  if (f === 'resub') { if (iso) a.resubDueAt = iso; else delete a.resubDueAt; }
  try { localStorage.setItem('connect_assignment_wording_v2', JSON.stringify(w)); } catch (e) {}
}
function moveHTML(){
  if (!MOVING || !IS_TUTOR) return '';
  const w = rec('connect_assignment_wording_v2') || {};
  const a = w[MOVING] || {};
  const cur = dayOf(a.due);
  const days = (TT.days || []).map(d => d.date);
  return `<div class="imp"><h3>Move ${esc(a.title || MOVING.toUpperCase())}</h3>
    <p>It is due on ${esc(cur || 'no day yet')}. Pick another course day; the time of day is kept.</p>
    <div class="row">
      <select id="moveTo">${days.map(d => {
        const t = teachesOn(d);
        return `<option value="${esc(d)}"${d === cur ? ' selected' : ''}>${esc(d)}${t.length ? ' \u2014 ' + (t.length > 1 ? 'groups' : 'group') + ' ' + t.join(', ') + ' teach' : ''}</option>`;
      }).join('')}</select>
      <button class="btn" id="moveGo">Move it</button>
      <button class="btn quiet" id="moveCancel">Leave it</button>
    </div>
    <p class="hint" id="moveWarn"></p></div>`;
}

function wireMove(){
  if (!IS_TUTOR) return;
  if ($('asgOpen')) $('asgOpen').addEventListener('click', () => { ASG_OPEN = !ASG_OPEN; render(); if (ASG_OPEN) { const b = $('asgDates'); if (b) b.scrollIntoView({ block: 'start', behavior: 'smooth' }); } });
  if ($('asgClose')) $('asgClose').addEventListener('click', () => { ASG_OPEN = false; render(); });
  document.querySelectorAll('.arule input').forEach(inp => inp.addEventListener('change', () => {
    const k = inp.closest('.arule').dataset.k, R1 = TT.asgRules = TT.asgRules || {}, r = R1[k] = R1[k] || {};
    document.querySelectorAll('.arule[data-k="' + k + '"] input').forEach(x => { r[x.dataset.r] = x.type === 'number' ? (+x.value || 0) : x.value; });
    save('Saved', { key: 'rule:' + k, text: asgShort(k) + ': due ' + r.due + ' days after its session at ' + r.dt + ', resubmission ' + r.re + ' days after' });
  }));
  if ($('asgLay')) $('asgLay').addEventListener('click', () => {
    document.querySelectorAll('.arule').forEach(el => { const k = el.dataset.k, R1 = TT.asgRules = TT.asgRules || {}, r = R1[k] = R1[k] || {}; el.querySelectorAll('input').forEach(x => { r[x.dataset.r] = x.type === 'number' ? (+x.value || 0) : x.value; }); });
    const laid = layAsgDates(); save('Dates laid', { text: 'Assignment dates laid from the rules: ' + (laid.join(', ') || 'none') });
    note = laid.length ? 'Laid from the rules: ' + laid.join(', ') + '.' : 'No assignment has a session tile yet.'; render();
  });
  document.querySelectorAll('#asgDates input[data-f]').forEach(i => i.addEventListener('change', () => { setAsgDate(i.closest('.adrow').dataset.k, i.dataset.f, i.value); note = 'Assignment dates saved'; render(); }));
  document.querySelectorAll('[data-move]').forEach(el => el.addEventListener('click', () => {
    MOVING = (MOVING === el.dataset.move) ? null : el.dataset.move; render();
  }));
  const sel = $('moveTo');
  const warn = () => {
    const el = $('moveWarn'); if (!el || !sel) return;
    const t = teachesOn(sel.value);
    el.textContent = t.length
      ? 'Group ' + t.join(' and ') + ' teach that day. A deadline usually falls on a day a group is not teaching \u2014 this is a note, not a block.'
      : '';
  };
  if (sel) { sel.addEventListener('change', warn); warn(); }
  if ($('moveCancel')) $('moveCancel').addEventListener('click', () => { MOVING = null; render(); });
  if ($('moveGo')) $('moveGo').addEventListener('click', () => {
    const w = rec('connect_assignment_wording_v2') || {};
    const a = w[MOVING]; if (!a || !sel) return;
    /* Keep the hour: the deadline is an instant, and only its DAY is moving. */
    const local = window.HubDue ? HubDue.toLocalInput(a.due) : '';
    const time = local ? local.slice(11, 16) : '23:59';
    a.due = window.HubDue ? HubDue.fromLocalInput(sel.value + 'T' + time) : sel.value;
    a.dueAt = a.due;   // the assignment screens read `dueAt` (hubWordingFilled)
    try { localStorage.setItem('connect_assignment_wording_v2', JSON.stringify(w)); } catch (e) {}
    MOVING = null; note = 'Deadline moved'; render();
  });
}

/* Whose clock the times are in. Said once, under the grid, and only when it
   could matter -- a reader in the course's own zone is told nothing, because
   for them there is nothing to know. */
function zoneLine(){
  if (!ZONE || !window.hubReaderZone) return '';
  const reader = window.hubReaderZone();
  if (!reader || reader === ZONE) return '';
  /* It said "the smaller time", and the two are almost the same size -- what
     tells them apart is the color (Ramy, 30 Sep 2026). So the sentence names
     the color, and the word "green" is itself green, which is the only way a
     sentence about a color is worth reading. */
  return `<p class="zone">The time in <span class="ltkey">brass</span> on each tile is yours, in <b>${esc(window.hubZoneName(reader))}</b>. The faint one is the course\u2019s own clock, in <b>${esc(window.hubZoneName(ZONE))}</b>.</p>`;
}

/* "45 min" from a slot's own two times, so changing a time changes the label
   with it rather than leaving a number behind that used to be true. */
function mins(slot){
  const a = String(slot.from || '').match(/^(\d{1,2}):(\d{2})/), b = String(slot.to || '').match(/^(\d{1,2}):(\d{2})/);
  if (!a || !b) return '';
  const n = (+b[1]*60 + +b[2]) - (+a[1]*60 + +a[2]);
  return n > 0 ? n + ' min' : '';
}

let GROUPS = [], DUES = {}, OUTS = {}, ROOMS = {}, ZONE = '', STATE = {}, EDIT = false;
/* A tutor can look at the timetable the way the course sees it. Without this
   they only ever see input boxes and can never check what they have
   published (Ramy, 29 Sep 2026: "there's the course admin view, and then
   there's the view-only timetable for the course once it's set"). */
let PREVIEW = false, SCROLLED = false, SLOTS_OPEN = false;

function render(){
  TPP = null;
  migrate();
  if (!OPENED) openDraft();
  /* "See what they see" is the published timetable, not the draft */
  if (PREVIEW && IS_TUTOR && LIVE && !WORK) { WORK = TT; TT = Object.assign({}, TT, JSON.parse(JSON.stringify(LIVE))); LIVE_KEYS.forEach(k => { if (LIVE[k] === undefined) delete TT[k]; }); }
  else if (!PREVIEW && WORK) { TT = WORK; WORK = null; }
  ZONE = SETTINGS.timeZone || '';
  STATE = stateMap();
  GROUPS = groups(); DUES = dues(); OUTS = outs(); ROOMS = roomsByLabel(); EDIT = IS_TUTOR && !PREVIEW;
  document.body.classList.toggle('editing', EDIT);
  document.addEventListener('click', (e) => { if (e.target && e.target.id === 'ttPrint') window.print(); });
  const app = $('app');
  /* Ramy, 30 Sep 2026: "we should be able to print the timetable" -- and a
     four-week course does not fit one sheet, so it prints as weeks: each week
     starts a page, and no day is ever split across the fold. */
  const head = `<p class="eyebrow">Course</p><h1>Timetable <button type="button" class="btn quiet printbtn" id="ttPrint">Print / Save as PDF</button></h1>
    <p class="lede">${IS_TUTOR
      ? 'The course’s own timetable. The teaching practices and the assignment deadlines come from the course itself; the input sessions and notes are yours to type. Letters are people — a day is named by its date and by who teaches on it.'
      : IS_TRAINEE ? 'Every day of the course. The teaching practice cell says who is teaching that day; your assignment deadlines are marked on the day they fall.'
      : 'Every day of the course. The teaching practice cell says who is teaching that day, and each assignment deadline is marked on the day it falls.'}</p>`;
  /* Set, then seen. A skeleton is twenty empty days, and until 29 Sep 2026 the
     course saw it the moment it was built. The timetable is the tutors' until
     they publish it; after that everyone on the course reads the same one. */
  if (!IS_TUTOR && TT && TT.days && TT.days.length && !TT.published) {
    app.innerHTML = head + `<div class="empty">The timetable is not ready yet. It will appear here once the course admin has set it.</div>`;
    return;
  }
  if (!TT || !TT.days || !TT.days.length) {
    const noDates = !SETTINGS.start || !SETTINGS.end;
    const carried = TT && TT.carried && Array.isArray(TT.carried.days) && TT.carried.days.length ? TT.carried : null;
    /* A course started from the last one brings that course's days with it,
       without their dates (store v80, 9 Oct 2026: Ramy, "duplicate the
       previous course"). Either start from them or build a fresh one. */
    app.innerHTML = head + (IS_TUTOR
      ? (carried
        ? `<div class="carried"><h3>Start from ${esc(carried.from)}’s timetable</h3>
            <p>${carried.days.length} days came across with this course: their sessions, their times, the teaching practices and the notes. They go onto this course’s dates in order, day 1 on day 1. Everything stays editable.</p>
            <div class="bar"><button class="btn" id="fromCarried"${noDates ? ' disabled' : ''}>Start from ${esc(carried.from)}</button><button class="btn quiet" id="build"${noDates ? ' disabled' : ''}>Build a fresh one</button><span class="status">${noDates ? 'Set the course start and end dates on Course admin first.' : ''}</span></div></div>`
        : startCardsHTML(noDates) + (note ? `<p class="status" style="margin:10px 0 0">${esc(note)}</p>` : ''))
      : `<div class="empty">The timetable has not been set up yet.</div>`) + (IS_TUTOR ? buildPanelHTML() + importHTML() : '');
    wireBuild(); wireImport();
    document.querySelectorAll('input[name=cxShape]').forEach(r => r.addEventListener('change', () => { CX_SHAPE = r.value; }));
    if ($('cxUse')) $('cxUse').addEventListener('click', cxApply);
    if ($('fromCarried')) $('fromCarried').addEventListener('click', startFromCarried);
    return;
  }
  /* Weeks are Monday to Friday runs, so a four-week course reads as four
     rows rather than one long ribbon. */
  const weeks = [];
  TT.days.forEach(day => {
    const d = parse(day.date); if (!d) return;
    if (!weeks.length || d.getDay() <= (parse(weeks[weeks.length-1][weeks[weeks.length-1].length-1].date) || d).getDay()) {
      if (!weeks.length || d.getDay() === 1) weeks.push([]);
    }
    if (!weeks.length) weeks.push([]);
    weeks[weeks.length-1].push(day);
  });
  const pub = !!(TT && TT.published);
  const bar = IS_TUTOR ? `<div class="bar">
      ${pub ? `<button class="btn quiet" id="unpublish">Take it back</button>`
            : `<span class="chip">Not set yet</span><button class="btn" id="publish">Set it for the course</button>`}
      <button class="btn quiet" id="preview">${PREVIEW ? 'Back to editing' : 'See what they see'}</button>
      ${EDIT ? `<button class="btn quiet" id="ttUndo"${UNDO.length ? '' : ' disabled'}>Undo</button>` : ''}
      <button class="btn quiet" id="buildOpen">Build it again</button>
      <button class="btn quiet" id="setOpen">Timetable settings</button>
      <button class="btn quiet" id="daysOpen">The course’s days</button>
      <button class="btn quiet" id="asgOpen">Assignment dates</button>
      <button class="btn quiet" id="importOpen">Import from a sheet</button>
      <span class="status">${esc(note)}</span></div>
      ${pub ? statusHTML() : '<p class="legend" style="margin:0 0 14px">Only tutors can see it until you set it.</p>'}${checksHTML()}`
      + (EDIT ? `<p class="legend" style="margin:-8px 0 14px">Drag a tile onto another to swap them, or into an empty place to move it. Click a tile to change it: its name, who teaches it, its times. ⋯ on a day copies its shape to other days.</p>` : '')
      + (PREVIEW ? '' : asgDatesHTML() + moveHTML() + buildPanelHTML() + settingsPanelHTML() + daysPanelHTML() + builtHTML() + importHTML()) : '';
  /* Where teaching practice starts at a different time from the teaching day
     before it, the week says so above its days, in words: "From Monday 26
     October teaching practice starts at 2:00 PM" (Ramy, 9 Oct 2026: "the
     second half of the course is changing the time"). Worked out from the
     sessions, so nobody declares it. */
  const tpStart = d => { const t = (d.sessions || []).filter(x => x.k === 'tp').sort(byStart)[0]; return d.tp && t ? t.s : ''; };
  const changeNote = (w) => w.map(d => {
    const i = TT.days.indexOf(d), here = tpStart(d);
    if (i <= 0 || !here) return '';
    const prev = TT.days.slice(0, i).reverse().find(x => tpStart(x));
    if (!prev || tpStart(prev) === here) return '';
    /* only a change that lasts: the next teaching day keeps the new time (one
       odd day is that day's business, not news for the week) */
    const next = TT.days.slice(i + 1).find(x => tpStart(x));
    if (!next || tpStart(next) !== here) return '';
    const when = parse(d.date);
    return `<p class="shchange">From <b>${DOWL[when.getDay()]} ${when.getDate()} ${MONL[when.getMonth()]}</b> teaching practice starts at <b>${esc(hubClock(here))}</b>.</p>`;
  }).join('');
  const B = bounds(), H = (B.to - B.from) * PXM;
  let ruler = '';
  for (let m = Math.ceil(B.from / 60) * 60; m <= B.to; m += 60) ruler += `<span style="top:${(m - B.from) * PXM}px">${esc(hubClock(toHM(m)).replace(':00', ''))}</span>`;
  const used = new Set(); (TT.days || []).forEach(d => (d.sessions || []).forEach(x => { if (x.k === 'input' && x.by !== undefined && x.by !== '' && TUTORS[+x.by]) used.add(+x.by); }));
  Object.values(OUTS || {}).forEach(list => list.forEach(o => { const i = TUTORS.indexOf(o.by); if (i !== -1) used.add(i); }));
  const key = `<div class="tkey"><span><i class="tile k-input"></i>Input sessions, in each tutor’s shade, with their initials</span><span><i class="tile k-tp"></i>Teaching practice</span><span><i class="tile k-feedback"></i>TP feedback</span><span><i class="tile k-plan"></i>Planning</span><span><i class="tile k-demo"></i>Demo lessons &amp; observations</span><span><i class="tile k-task"></i>Assignments &amp; tutorials</span><span><i class="tile k-assessor"></i>Assessor</span><span><i class="tile k-lunch"></i>Lunch</span><span><i class="tile k-break"></i>Breaks</span><span><i class="tile k-event"></i>Everything else</span><span><i class="due"></i>A deadline</span></div>`;
  const gsw = groupSwitchHTML();
  app.innerHTML = head + updatedHTML() + zoneLine() + bar + roomsStrip() + key + gsw + weeks.map((w, i) => {
    const a = parse(w[0].date), b = parse(w[w.length-1].date);
    return `<section class="wk"><h2>Week ${i+1} <small>${dm(a)} – ${dm(b)}</small></h2>${changeNote(w)}${weekBoard(w, i)}</section>`;
  }).join('') + keyLine() + `<p class="legend">Teaching practice runs the same number on two days, one teaching set each: the letters name the trainees teaching that day. ${GROUPS.map(g => 'Group ' + esc(g.group || '—') + ': ' + g.sets.map(R.setName).filter(Boolean).join(' and ')).join('. ')}.</p>`;
  if ($('preview')) $('preview').addEventListener('click', () => { PREVIEW = !PREVIEW; render(); });
  if ($('publish')) $('publish').addEventListener('click', () => { TT.published = true; CHANGES = []; LIVE = pickLive(TT); save('Set \u2014 the course can see it'); render(); });
  /* One press hid the timetable from every candidate (9 Oct 2026): it asks. */
  if ($('unpublish')) $('unpublish').addEventListener('click', async () => {
    if (!(await ask('Take the timetable back from the course? Candidates and tutors stop seeing it until you set it for the course again.', 'Take it back'))) return;
    TT.published = false; CHANGES = []; save('Taken back'); render();
  });
  wireStatus(); wireUpdated();
  wireEdits();
  wireImport();
  wireDays();
  wireSettings();
  wireMove();
  wireBoard();
  loadBookings();
  /* Twenty full days stacked on a phone is a long way to scroll to reach this
     afternoon, so a narrow screen opens on today.
     It has to survive a RE-RENDER. Replacing the grid's innerHTML puts the
     page back at the top, and the first render is followed by others -- the
     migration saves, the boot arrives, a preview toggles -- so doing this
     once meant it was always undone and the phone opened on day one
     (30 Sep 2026). It re-applies after every render until the reader scrolls
     for themselves, and then never again: scrolling back to read week one
     must not be yanked away by the next save. */
  if (!SCROLLED && window.innerWidth <= 980) {
    const t = document.getElementById('d-' + TODAY);
    /* `center` centers a card that is taller than the phone, which put
       today's own header 364px above the fold -- you landed in the middle of
       the afternoon with no idea which day you were looking at. Start at the
       top of the card, less the sticky week heading that would otherwise sit
       over it. */
    /* Twice, and by offsetTop. The first pass runs before the day cards have
       their final height -- the marks, the room links and the second clock
       all arrive and change it -- so a single measurement landed 488px past
       the day it was aiming at. offsetTop is the document position rather
       than a viewport one, so the second pass corrects rather than compounds. */
    if (t) {
      /* A phone shows a week as a row of days to swipe through: land on
         today's column as well as its week. */
      const sc = t.closest('.tscroll'); if (sc && !ACROSS()) sc.scrollLeft = Math.max(0, t.offsetLeft - 8);
      const land = () => {
        const head = document.querySelector('.wk h2');
        const off = head ? head.offsetHeight + 8 : 0;
        window.scrollTo({ top: Math.max(0, t.offsetTop - off) });
      };
      requestAnimationFrame(land);
      setTimeout(() => { if (!SCROLLED) land(); }, 300);
    }
  }
}

/* THE COURSE'S DAYS. Which weekdays it meets: full-time is Monday to Friday,
   a part-time course ticks its own. Changing them lays the days out again,
   keeping every session and note on a day that is still a course day. */

const clone = o => JSON.parse(JSON.stringify(o));

/* WHO TEACHES THE INPUTS, BY DATES (10 Oct 2026). Ramy: "more than one input
   ... for the same trainer at the same time ... instead of choosing one at a
   time". C/18 is Ramy for the first half and Narges for the second, so the
   course says who from which day (TT.inputBy, by name: [{from, by}]), and one
   press gives every input tile in each run that tutor -- their color. A tile
   can still be changed by itself afterwards. */
function inputByHTML(){
  if (!TUTORS.length) return '';
  const open = (TT.days || []).filter(d => !d.closed);
  const rows = Array.isArray(TT.inputBy) && TT.inputBy.length ? TT.inputBy : [{ from: (open[0] || {}).date || '', by: TUTORS[0] }];
  const dayOpts = cur => open.map(d => `<option value="${esc(d.date)}"${d.date === cur ? ' selected' : ''}>${esc(dayName(d.date))}</option>`).join('');
  const tutOpts = cur => TUTORS.map(n => `<option value="${esc(n)}"${n === cur ? ' selected' : ''}>${esc(n)}</option>`).join('');
  return `<div class="tset"><span class="ml">Who teaches the inputs</span><div class="opts">
      ${rows.map((r, i) => `<div class="ibrow">From <select data-ib-from="${i}">${dayOpts(r.from)}</select> <select data-ib-by="${i}">${tutOpts(r.by)}</select>${i ? ` <button type="button" class="linkbtn" data-ib-del="${i}">Remove</button>` : ''}</div>`).join('')}
      <button type="button" class="linkbtn" id="ibAdd">+ Another tutor from a later day</button>

/* ---- DRAFT AND PUBLISH (stage 2, 9 Oct 2026) ------------------------------

/* ---- CHECKS, and what doesn't fit ------------------------------------------
   Said all the time, not only while dragging: how many sessions are on how
   many days, anything that overlaps, a deadline on a teaching-practice day
   (a note, not a block -- the 30 Sep rule: a tutor usually knows something
   the software does not), and the days pushed off the end by a closed day. */
function checksHTML(){
  if (!EDIT) return '';
  const open = TT.days.filter(d => !d.closed);
  const n = open.reduce((a, d) => a + (d.sessions || []).filter(x => x.k !== 'break' && x.k !== 'lunch').length, 0);
  const lines = [];
  open.forEach(d => {
    const s = (d.sessions || []).filter(x => x.k !== 'break' && x.k !== 'lunch').slice().sort(byStart);
    for (let i = 1; i < s.length; i++) if (toMin(s[i].s) < toMin(s[i - 1].e)) lines.push(['bad', `${dayName(d.date)}: “${tileName(s[i - 1], d)}” and “${tileName(s[i], d)}” overlap`]);
  });
  Object.keys(DUES).forEach(date => {
    const d = TT.days.find(x => x.date === date);
    if (d && d.closed) DUES[date].forEach(x => lines.push(['bad', `${x.title} is due on ${dayName(date)}, a closed day`]));
    /* only when somebody it is due for teaches that day: with a deadline per
       teaching set, the set handing in is the one NOT teaching (C/18's LRT) */
    else if (d && d.tp) DUES[date].forEach(x => {
      const teaching = (x.who || []).some(t => window.hubSetIndexOf && hubSetIndexOf(t.token, t.group) === Number(d.setIndex || 0));
      if (teaching || !(x.who || []).length) lines.push(['note', `${x.title} is due on ${dayName(date)}, a day they teach`]);
    });
  });
  /* WHAT CAMBRIDGE ASKS, SAID BEFORE IT IS SET (Ramy, 29 Oct 2026, the mock-up he chose): contact hours, observation
     hours, the assessor's visit, Stage 2 after TP4 (Handbook 10, pp. 30-31), Stage 3 with two lessons left, and his own
     rule of no resubmission on the last two days. Notes, never a block. */
  (function(){
    const mins = x => Math.max(0, (toMin(x.e) || 0) - (toMin(x.s) || 0));
    const all = open.flatMap(d => (d.sessions || []).map(x => ({ x, d })));
    const contact = all.filter(o => o.x.k !== 'lunch').reduce((a, o) => a + mins(o.x), 0) / 60;
    const obs = all.filter(o => o.x.k === 'demo').reduce((a, o) => a + mins(o.x), 0) / 60;
    if (contact < 120) lines.push(['note', `Contact hours: ${Math.round(contact * 4) / 4} of Cambridge’s 120`]);
    if (obs < 6) lines.push(['note', `Observation: ${Math.round(obs * 4) / 4} hours of the 6 (demonstration lessons and observations)`]);
    if (!all.some(o => o.x.k === 'assessor' || /assessor/i.test(o.x.t || ''))) lines.push(['note', 'No assessor visit on the timetable yet']);
    const lastOf = n => { let at = -1; open.forEach((d, i) => { if (Number(d.tp) === n) at = i; }); return at; };
    const firstOf = n => open.findIndex(d => Number(d.tp) === n);
    const dayIdx = re => open.findIndex(d => (d.sessions || []).some(x => re.test(x.t || '')));
    const s2 = dayIdx(/stage\s*2\s*tutorial/i), s3 = dayIdx(/stage\s*3\s*tutorial/i);
    if (s2 < 0) lines.push(['note', 'No Stage 2 tutorials on the timetable yet (after TP4, as the groups change)']);
    else if ((lastOf(4) >= 0 && s2 <= lastOf(4)) || (firstOf(5) >= 0 && s2 > firstOf(5))) lines.push(['note', 'Stage 2 tutorials should fall after TP4 and before TP5']);
    if (s3 >= 0 && firstOf(7) >= 0 && s3 >= firstOf(7)) lines.push(['note', 'Stage 3 tutorials come with two lessons left, before TP7']);
    const lastTwo = open.slice(-2).map(d => d.date);
    Object.keys(DUES).forEach(date => { if (lastTwo.indexOf(date) !== -1) DUES[date].forEach(x => { if (/resub/i.test(x.title || '')) lines.push(['note', `${x.title} falls on ${dayName(date)}, one of the last two days`]); }); });
  })();
  const un = Array.isArray(TT.unplaced) ? TT.unplaced : [];
  return `<div class="tchecks"><div class="cl"><span class="dot ${lines.some(l => l[0] === 'bad') || un.length ? 'bad' : 'ok'}"></span>${n} sessions on ${open.length} day${open.length === 1 ? '' : 's'}${un.length ? ` · <b>${un.length === 1 ? '1 day’s' : un.length + ' days’'} sessions don’t fit</b>` : ''}${lines.length ? '' : ' · no clashes'}</div>
    ${lines.map(l => `<div class="cl"><span class="dot ${l[0]}"></span>${esc(l[1])}</div>`).join('')}
    ${un.length ? `<div class="tray"><b>Doesn’t fit</b> <span class="hint">Pushed past the last day by a closed day. Reopen a day, or move the course’s end date on Course admin and lay the days out again, and they come back at the end.</span>
      ${un.map(u => `<div class="trayday">${esc(u.from ? dayName(u.from) + '’s day' : 'A day')}: ${esc([u.tp ? 'TP ' + u.tp : '', ...(u.sessions || []).filter(x => x.k !== 'tp' && x.k !== 'break' && x.k !== 'lunch' && x.t).map(x => x.t)].filter(Boolean).join(' · ') || 'nothing on it')}</div>`).join('')}</div>` : ''}
  </div>`;
}

/* ---- CLOSING A DAY ---------------------------------------------------------
   Click a date to close it. Everything from that day on moves along one course
   day, keeping its times; whatever the last day held goes to "Doesn't fit".
   Reopening moves it all back. Deadlines live on the assignments and do not
   move with it -- the checks say if one now falls on a closed day. */
/* A day's content moves exactly as it was, so closing and reopening a day
   gives back the same timetable. */
const contentOf = d => ({ sessions: d.sessions || [], notes: d.notes, tp: d.tp, setIndex: d.setIndex });
function putContent(d, c){
  d.sessions = c ? c.sessions : [];
  if (c && c.notes !== undefined) d.notes = c.notes; else delete d.notes;
  if (c && c.tp) { d.tp = c.tp; d.setIndex = c.setIndex; } else { delete d.tp; delete d.setIndex; }
}
async function toggleClosed(date){
  const i = TT.days.findIndex(d => d.date === date); if (i < 0) return;
  const day = TT.days[i];
  const after = TT.days.slice(i).filter(d => !d.closed || d === day);
  if (!day.closed) {
    if (!(await ask('Close ' + dayName(date) + '? Everything from that day on moves along one course day, keeping its times; what the last day held waits in “Doesn’t fit”.', 'Close'))) return;
    remember();
    const contents = after.map(contentOf);
    putContent(day, null); day.closed = true;
    after.slice(1).forEach((d, k) => putContent(d, contents[k]));
    const last = contents[contents.length - 1];
    TT.unplaced = (Array.isArray(TT.unplaced) ? TT.unplaced : []).concat([Object.assign({ from: after[after.length - 1].date }, last)]);
    save('Closed', { key: 'close:' + date, text: dayName(date) + ' closed', effects: ['Everything from ' + dayName(date) + ' on moves along one day', dayName(after[after.length - 1].date) + '’s day doesn’t fit any more'] });
  } else {
    remember();
    delete day.closed;
    const open = TT.days.slice(i).filter(d => !d.closed);
    const contents = open.slice(1).map(contentOf);
    open.forEach((d, k) => putContent(d, contents[k] || null));
    const tray = Array.isArray(TT.unplaced) ? TT.unplaced : [];
    if (tray.length) putContent(open[open.length - 1], tray.pop());
    if (!tray.length) delete TT.unplaced;
    if (!(open[open.length - 1].sessions || []).length) open[open.length - 1].sessions = sessionsFromSlots({}, template(), {}, false);
    const was = CHANGES.findIndex(c => c.key === 'close:' + date);
    if (was !== -1) { CHANGES.splice(was, 1); save('Reopened'); }
    else save('Reopened', { key: 'open:' + date, text: dayName(date) + ' reopened', effects: ['Everything after it moves back one day'] });
  }
  render();
}

/* ---- the board, edited in place (tutors) ---------------------------------
   Drag a tile and every day says what a drop there would do, in the handoff's
   three colors: clean (it just moves), gold (something else moves too --
   named), red (refused -- the reason). The bottom edge changes a tile's
   length and the rest of its day moves with it. A click opens the tile. On a
   phone a tap opens it; dragging there would fight the finger scrolling
   between days. Undo is one step back. */
const UNDO = [];
const dayOfDate = date => (TT.days || []).find(d => d.date === date);
const snap = () => JSON.stringify({ days: TT.days, meets: TT.meets, unplaced: TT.unplaced, pins: TT.pins, changes: CHANGES });
function remember(){ UNDO.push(snap()); if (UNDO.length > 40) UNDO.shift(); }
function undo(){
  if (!UNDO.length) return;
  const s = JSON.parse(UNDO.pop());
  TT.days = s.days; ['meets', 'unplaced', 'pins'].forEach(k => { if (s[k] === undefined) delete TT[k]; else TT[k] = s[k]; });
  CHANGES = s.changes || [];
  closePop(); save('Undone'); render();
}
const pinned = date => (TT.pins || []).indexOf(date) !== -1;

/* Overlaps are solved by pushing down: whatever a tile lands on moves later,
   and so on to the end of the day. */
function settle(day, keep){
  /* the tile just placed keeps its spot over one that starts at the same time */
  day.sessions.sort((a, b) => byStart(a, b) || (a === keep ? -1 : b === keep ? 1 : 0));
  for (let i = 1; i < day.sessions.length; i++) {
    const prev = day.sessions[i - 1], t = day.sessions[i];
    if (toMin(t.s) < toMin(prev.e)) {
      if (t === keep && toMin(prev.s) >= toMin(t.s)) continue;
      const shift = toMin(prev.e) - toMin(t.s);
      t.s = toHM(toMin(t.s) + shift); t.e = toHM(toMin(t.e) + shift);
    }
  }
}

/* What dropping `x` (from `fromDay`) on `day` at `start` would do. */
/* DROP A TILE ON ANOTHER TILE AND THE TWO SWAP PLACES (Ramy, 27 Oct 2026: "I can move them sideways, but I can't seem
   to move them up and down"). On a full timetable every slot is taken, so a drop onto one used to shove the rest of the
   day later (same day) or be refused as a clash (another day). Now the two tiles exchange their times -- and, across
   days, their days -- and nothing else moves, so every tile stays on the week's grid. A drop into an empty slot moves
   as before. A TP lesson still stays with its practice's day. */
function tileUnder(clientX, clientY, notId){
  const els = document.elementsFromPoint(clientX, clientY);
  return els.find(el => el.classList && el.classList.contains('tile') && !el.classList.contains('ghost') && el.dataset.id && el.dataset.id !== notId) || null;
}
function swapCheck(x, fromDay, date, id){
  const day = dayOfDate(date); if (!day || day.closed) return null;
  const o = (day.sessions || []).find(s => s.id === id); if (!o || o === x) return null;
  if (day !== fromDay && (x.k === 'tp' || o.k === 'tp')) return { kind: 'block', why: 'A TP lesson stays with its practice’s day — change the practice from the tile' };
  if (o.locked) return { kind: 'block', why: '“' + tileName(o, day) + '” is fixed' };
  return { kind: 'swap', effects: ['“' + tileName(x, fromDay) + '” and “' + tileName(o, day) + '” swap places' + (day !== fromDay ? ' (' + dayName(fromDay.date) + ' and ' + dayName(day.date) + ')' : '')] };
}
function evaluate(x, fromDay, day, start, endAt){
  if (day.closed) return { kind: 'block', why: 'This day is closed' };
  const len = toMin(x.e) - toMin(x.s), end = endAt != null ? endAt : start + len;
  if (day === fromDay) {
    const copy = clone(day.sessions), me = copy.find(s => s.id === x.id);
    me.s = toHM(start); me.e = toHM(end);
    const d2 = { sessions: copy }; settle(d2, me);
    const moved = copy.filter(s => s !== me && s.s !== (day.sessions.find(o => o.id === s.id) || {}).s);
    return moved.length ? { kind: 'shift', effects: moved.map(s => '“' + tileName(s, day) + '” moves to ' + hubClockRange(s.s, s.e)) } : { kind: 'clean' };
  }
  if (x.k === 'tp') return { kind: 'block', why: 'A TP lesson stays with its practice’s day — change the practice from the tile' };
  const hit = (day.sessions || []).filter(s => toMin(s.s) < end && toMin(s.e) > start).sort(byStart)[0];
  if (hit) return { kind: 'block', why: 'Clashes with “' + tileName(hit, day) + '” ' + hubClockRange(hit.s, hit.e) };
  return { kind: 'clean' };
}
function evaluateDue(key, date){
  const day = dayOfDate(date);
  if (!day || day.closed) return { kind: 'block', why: 'This day is closed' };
  const t = teachesOn(date);
  return t.length ? { kind: 'shift', effects: ['Teaching practice that day (' + t.join(', ') + ') — a note, not a block'] } : { kind: 'clean' };
}

let DRAG = null;
function placeTiles(day){

    const el = document.querySelector(`.tile[data-date="${day.date}"][data-id="${x.id}"]`); if (!el) return;
    const s = toMin(x.s), e = toMin(x.e);
    el.style.top = ((s - B.from) * PXM) + 'px'; el.style.height = Math.max(12, (e - s) * PXM - 2) + 'px';
    const tm = el.querySelector('.tm'); if (tm) tm.textContent = hubClockRange(x.s, x.e);

}

  if (i === -1) i = clientX < (heads[0] ? heads[0].getBoundingClientRect().left : 0) ? 0 : heads.length - 1;

/* ---- TUTORIALS AND CONSULTATIONS, BOOKED HERE (Ramy, 29 Oct 2026; Connect's rules, store v182) -----------------

   assignment's first submission, any tutor's consultation; after it, their own tutor's only; tutorials with their own
   tutor. The store holds the sheets and judges the rule; this page shows them. */
let BOOK = null, BOOK_AT = 0;
const isSheet = x => x && /consultation|tutorial/i.test(x.t || '') && toMin(x.e) - toMin(x.s) >= 15;
const placesOf = x => Math.max(1, Math.floor((toMin(x.e) - toMin(x.s)) / 15));

  BOOK_AT = Date.now();
  HubStore.call({ op: 'bookings' }).then(r => { BOOK = (r && r.bookings) || {}; render(); }).catch(() => {});
}
function sheetOf(day, x){

  if (raw.places) { const taken = Object.keys(raw.places).filter(n => raw.places[n] && raw.places[n].token).map(Number); return { taken, mine: [], names: raw.places }; }
  return { taken: raw.taken || [], mine: raw.mine || [], names: null };
}
function bookLine(day, x){

  if (sh.mine.length) return `<div class="bk mine">Your place · ${esc(hubClock(placeAt(x, sh.mine[0].n)))}</div>`;
  return `<div class="bk${sh.taken.length >= N ? ' full' : ''}">${sh.taken.length >= N ? 'Full' : (N - sh.taken.length) + ' of ' + N + ' open'}</div>`;

function swapOffer(x, o, before){

/* A deadline dragged to another day: same time of day, written where every

function moveDue(key, date){
  const w = rec('connect_assignment_wording_v2') || {};
  const a = w[key]; if (!a) return;
  const local = window.HubDue ? HubDue.toLocalInput(a.due) : '';
  const time = local ? local.slice(11, 16) : '23:59';
  a.due = window.HubDue ? HubDue.fromLocalInput(date + 'T' + time) : date;
  a.dueAt = a.due;   // the assignment screens read `dueAt` (hubWordingFilled)
  try { localStorage.setItem('connect_assignment_wording_v2', JSON.stringify(w)); } catch (e) {}
  note = (a.title || key.toUpperCase()) + ' is now due ' + dayName(date) + ' — deadlines are on the assignment, so the course sees this at once';
  render();
}

function pop(cls){
  let el = document.querySelector('.' + cls);
  if (!el) { el = document.createElement('div'); el.className = cls; el.hidden = true; document.body.appendChild(el); }
  return el;
}
let OPEN_TILE = null;   // the tile the editor is open on, and what it was, for the change it records

    const now = x ? JSON.stringify({ x, tp: day.tp, set: day.setIndex }) : '';
    if (x && now !== o.before) {
      const was = JSON.parse(o.before), what = [];
      if (was.x.k !== x.k) what.push('now ' + (KIND_LABEL[x.k] || x.k));
      if ((was.x.t || '') !== (x.t || '')) what.push(x.t ? 'now called “' + x.t + '”' : 'name cleared');
      if (was.x.s !== x.s || was.x.e !== x.e) what.push('now ' + hubClockRange(x.s, x.e));
      if (String(was.x.by) !== String(x.by)) what.push(TUTORS[+x.by] ? 'taught by ' + TUTORS[+x.by] : 'no tutor named');
      if (was.tp !== day.tp || was.set !== day.setIndex) what.push('TP ' + (day.tp || '—'));
      if (x.url === 'https://') delete x.url;
      if ((was.x.room || '') !== (x.room || '') || (was.x.url || '') !== (x.url || '')) what.push(x.url ? 'joins its own link' : x.room ? 'in the ' + x.room + ' room' : 'in the usual room');
      /* locking is the tutors' own tool, like pinning: not news for the course */
      if (!what.length) { save('Saved'); render(); document.querySelectorAll('.ttpop, .ttmenu').forEach(el => { el.hidden = true; }); return; }
      CHANGES.push({ at: new Date().toISOString(), key: 'tile:' + o.id, text: '“' + tileName(was.x, day) + '” on ' + dayName(o.date) + ': ' + what.join(', ') });
      save('Saved'); render();
    }
    /* Opening a tile records a step before anything changes; closed as it
       was, that step is nothing, and Undo lit up for a tile only looked at
       (found walking the timetable, 9 Oct 2026). */
    else if (x && UNDO.length && UNDO[UNDO.length - 1] === snap()) { UNDO.pop(); if ($('ttUndo')) $('ttUndo').disabled = !UNDO.length; }
  }
  document.querySelectorAll('.ttpop, .ttmenu').forEach(el => { el.hidden = true; });
}
function placeNear(el, anchor){
  const r = (anchor || document.body).getBoundingClientRect(), w = el.offsetWidth || 300;
  const left = r.right + 8 + w > window.innerWidth ? Math.max(8, r.left - w - 8) : r.right + 8;
  el.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, left)) + 'px';
  el.style.top = Math.max(8, Math.min(window.innerHeight - el.offsetHeight - 8, r.top)) + 'px';
}

/* One tile, opened: what it is, its name, whose input it is, its times, and a
   lock for a tile that must not be dragged (an orientation, a course close).
   A TP tile names the practice and which set teaches -- that is the day's, so
   it changes every lesson of the day at once. */
function openTile(date, id){
  closePop();
  const day = dayOfDate(date); if (!day) return;
  const x = (day.sessions || []).find(s => s.id === id); if (!x) return;
  remember();
  OPEN_TILE = { date, id, before: JSON.stringify({ x, tp: day.tp, set: day.setIndex }) };
  const el = pop('ttpop');
  const sets = (GROUPS[0] && GROUPS[0].sets) || [];
  el.innerHTML = `<label>What it is<select id="tK">${KIND_ORDER.map(k => `<option value="${k}"${x.k === k ? ' selected' : ''}>${esc(KIND_LABEL[k])}</option>`).join('')}</select></label>
    ${x.k === 'tp'
      ? `<div class="two"><label>Practice<input id="tTp" type="number" min="1" max="20" value="${esc(day.tp || '')}" placeholder="—"></label>
         <label>Who teaches<select id="tSet">${sets.length ? sets.map((st, i) => `<option value="${i}"${+day.setIndex === i ? ' selected' : ''}>${esc(R.setName(st) || (i ? 'Second set' : 'First set'))}</option>`).join('') : `<option value="0">First set</option><option value="1"${+day.setIndex === 1 ? ' selected' : ''}>Second set</option>`}</select></label></div>`
      : `<label>Name<input id="tT" value="${esc(x.t || '')}" placeholder="${esc(KIND_LABEL[x.k] || '')}"></label>`}
    ${x.k === 'input' && TUTORS.length ? `<label>Who teaches it<select id="tBy"><option value="">—</option>${TUTORS.map((n, i) => `<option value="${i}"${String(x.by) === String(i) ? ' selected' : ''}>${esc(n)}</option>`).join('')}</select></label>` : ''}
    <div class="two"><label>From<input id="tS" type="time" value="${esc(x.s)}"></label><label>To<input id="tE" type="time" value="${esc(x.e)}"></label></div>
    ${(() => { const rooms = (Array.isArray(SETTINGS.onlineRooms) ? SETTINGS.onlineRooms : []).filter(r => r && r.url); const labels = [...new Set(rooms.map(r => String(r.label || '').trim()).filter(Boolean))]; const cur = x.url ? '__url' : (x.room || ''); const dflt = roomLabelOf(Object.assign({}, x, { room: '' }));
      return (labels.length || x.url) ? `<label>Online room<select id="tRoom"><option value=""${cur === '' ? ' selected' : ''}>${esc(dflt ? 'The ' + dflt + ' room' : 'None')}</option>${labels.map(l => `<option value="${esc(l)}"${cur === l ? ' selected' : ''}>${esc(l)}</option>`).join('')}<option value="__url"${cur === '__url' ? ' selected' : ''}>A link of its own</option></select></label>${cur === '__url' ? `<label>Link<input id="tUrl" type="url" value="${esc(x.url || '')}" placeholder="https://…"></label>` : ''}` : ''; })()}
    ${isSheet(x) && BOOK ? `<div class="sheetin">${sheetHTML(day, x)}</div>` : ''}
    <label class="lock"><input type="checkbox" id="tLock"${x.locked ? ' checked' : ''}> Locked — can’t be dragged</label>
    <div class="acts"><button type="button" class="btn quiet del" id="tDel">Remove</button><button type="button" class="btn" id="tOk">Done</button></div>`;
  el.hidden = false;
  placeNear(el, document.querySelector(`.tile[data-date="${date}"][data-id="${id}"]`));
  const apply = () => {
    const k = $('tK').value;
    if (k !== x.k) {
      x.k = k;
      if (k === 'tp') { x.t = ''; if (!day.tp) { const prev = TT.days.slice(0, TT.days.indexOf(day)).reverse().find(d => d.tp); day.tp = prev ? prev.tp : 1; day.setIndex = 0; } }
      if (k !== 'input') delete x.by;
      if (k === 'tp' || k === 'input') x.room = k === 'tp' ? 'Teaching practice' : 'Input';
      if (!day.sessions.some(s => s.k === 'tp')) { delete day.tp; delete day.setIndex; }
      const keep = OPEN_TILE; OPEN_TILE = null; save('Saved'); render(); openTile(date, id); UNDO.pop(); if (keep) OPEN_TILE.before = keep.before; return;
    }
    if ($('tT')) x.t = $('tT').value;
    if ($('tBy')) { if ($('tBy').value === '') delete x.by; else x.by = +$('tBy').value; }
    if ($('tTp')) { const n = parseInt($('tTp').value, 10); if (n > 0) day.tp = n; }
    if ($('tSet')) day.setIndex = +$('tSet').value;
    if ($('tLock').checked) x.locked = true; else delete x.locked;
    if ($('tRoom')) {
      const v = $('tRoom').value;
      if (v === '__url') { delete x.room; if (!x.url) x.url = 'https://'; }
      else { delete x.url; if (v) x.room = v; else delete x.room; }
      if ($('tUrl')) x.url = $('tUrl').value.trim() || 'https://';
      if ((v === '__url') !== !!$('tUrl')) { const keep = OPEN_TILE; OPEN_TILE = null; save('Saved'); render(); openTile(date, id); UNDO.pop(); if (keep) OPEN_TILE.before = keep.before; return; }
    }
    const s = toMin($('tS').value), e = toMin($('tE').value);
    if (s != null && e != null) { x.s = toHM(s); x.e = toHM(Math.max(s + 5, e)); settle(day, x); }
  };
  ['tK', 'tTp', 'tSet', 'tBy', 'tS', 'tE', 'tLock', 'tRoom', 'tUrl'].forEach(i => { if ($(i)) $(i).addEventListener('change', apply); });
  if ($('tT')) { $('tT').addEventListener('input', apply); $('tT').addEventListener('keydown', e => { if (e.key === 'Enter') { apply(); closePop(); } }); }
  $('tOk').addEventListener('click', () => { apply(); closePop(); });
  el.querySelectorAll('[data-free]').forEach(b => b.addEventListener('click', () => { HubStore.call({ op: 'releaseSlot', date, id, n: +b.dataset.free }).then(() => { BOOK = null; loadBookings(true); closePop(); }).catch(() => {}); }));
  $('tDel').addEventListener('click', () => {
    const name = tileName(x, day);
    OPEN_TILE = null;
    day.sessions = day.sessions.filter(s => s !== x);
    if (!day.sessions.some(s => s.k === 'tp')) { delete day.tp; delete day.setIndex; }
    closePop(); save('Removed', { text: '“' + name + '” removed from ' + dayName(date) }); render();
  });
  const f = $('tT') || $('tTp'); if (f) f.focus();
}

  const bp = el.querySelector('[data-backpat]'); if (bp) bp.addEventListener('click', () => { closePop(); remember(); relayDay(day, { pattern: TT.pattern }); save('Back on the pattern', { text: dayName(date) + ' is back on the pattern' }); render(); });
  el.querySelector('[data-pin]').addEventListener('click', () => {

/* The shape is the times and the kinds. What a day SAYS stays its own: each
   tile takes the next name of its kind from the day it lands on (Monday's
   "Phonology 2" stays Monday's), and a TP tile only lands on a day that has a
   practice -- a day without one keeps having none. */
function copyShape(date, how){
  const src = dayOfDate(date); if (!src) return;
  const di = TT.days.indexOf(src), wd = parse(date).getDay();
  const targets = TT.days.filter((d, i) => i !== di && !d.closed && (how === 'all' || (how === 'from' && i > di) || (how === 'dow' && parse(d.date).getDay() === wd)));
  const changed = targets.filter(d => !pinned(d.date)), kept = targets.length - changed.length;
  remember();
  changed.forEach(d => {
    const pools = {};
    (d.sessions || []).slice().sort(byStart).forEach(x => { (pools[x.k] = pools[x.k] || []).push(x); });
    const out = [];
    (src.sessions || []).slice().sort(byStart).forEach(x => {
      if (x.k === 'tp' && !d.tp) return;
      const n = { id: newId(), s: x.s, e: x.e, k: x.k, t: x.k === 'tp' ? '' : (x.k === 'input' ? '' : x.t) };
      if (x.room) n.room = x.room;
      if (x.locked) n.locked = true;
      const own = x.k === 'tp' ? null : (pools[x.k] || []).shift();
      if (own) { n.t = own.t; if (own.by !== undefined) n.by = own.by; if (own.room) n.room = own.room; }
      out.push(n);
    });
    if (d.tp && !out.some(x => x.k === 'tp')) { d.sessions = out; ensureTp(d); }
    else d.sessions = out;
  });
  closePop();
  save('Shape used on ' + changed.length + ' day' + (changed.length === 1 ? '' : 's') + (kept ? ' · ' + kept + ' pinned day' + (kept === 1 ? '' : 's') + ' left alone' : ''),
       { text: dayName(date) + '’s shape used on ' + changed.length + ' day' + (changed.length === 1 ? '' : 's'), effects: changed.length ? [changed.map(d => dayName(d.date)).join(', ')] : [] });
  render();
}

/* Import. Ramy, 29 Sep 2026: "is it possible to just import a timetable the
   same way we do with the TP points, the same way we do with the observation
   tasks?" The rules live in hub-timetable-parse.js so they can be tested away
   from the page. What arrives is shown before anything is replaced, the same
   as the observation importer: a file it has never seen is a first draft. */
let IMPORT_OPEN = false, REVIEW = null;
/* The link import (8 Oct 2026): Ramy, "then I will be able to import the
   timetable that we have on Google Classroom". The sheet must be shared
   "anyone with the link": Google refuses a page a private sheet, and the
   page cannot tell a private sheet from a wrong address, so it says both. */
let LINK_VALUE = '', LINK_ERR = '';
const LINK_SHARE = 'Lite could not open that sheet. In Google Sheets, click Share, set General access to "Anyone with the link" (Viewer), and try again.';

function importHTML(){
  if (REVIEW) return reviewHTML();
  if (!IMPORT_OPEN) return '';
  return `<div class="imp"><h3>Import from a sheet</h3>
    <p>Give a Google Sheets link, paste from Excel or Google Sheets, or choose an Excel, Word, CSV or text file. One row per day, with columns for the date, the input sessions and any notes, or a week grid with the dates across the top of each week and rows for input, TP and assignments. A header row naming the columns helps but is not needed. Rows without a readable date are taken in order from the first course day.</p>
    <div class="link"><input type="url" id="impLink" placeholder="Google Sheets link" value="${esc(LINK_VALUE)}" autocomplete="off">
      <button class="btn" id="impLinkRead">Read the link</button></div>
    ${LINK_ERR ? `<p class="linkerr">${esc(LINK_ERR)}</p>` : ''}
    <textarea id="impPaste" placeholder="Paste the rows here"></textarea>
    <div class="row"><button class="btn" id="impRead">Read the paste</button>
      <input type="file" id="impFile" accept=".xlsx,.docx,.csv,.tsv,.txt" style="font-size:0.78rem">
      <button class="btn quiet" id="impClose">Close</button></div></div>`;
}

function wireImport(){
  if (!IS_TUTOR) return;
  const open = $('importOpen');
  if (open) open.addEventListener('click', () => { IMPORT_OPEN = !IMPORT_OPEN; REVIEW = null; render(); });
  if ($('impClose')) $('impClose').addEventListener('click', () => { IMPORT_OPEN = false; LINK_ERR = ''; render(); });
  if ($('impLinkRead')) $('impLinkRead').addEventListener('click', async () => {
    LINK_VALUE = $('impLink').value.trim(); LINK_ERR = '';
    const url = window.hubTimetableParse.sheetCsvUrl(LINK_VALUE);
    if (!url) { LINK_ERR = 'That is not a Google Sheets link. Copy it from the address bar of the open sheet.'; render(); return; }
    const btn = $('impLinkRead'); btn.disabled = true; btn.textContent = 'Reading…';
    try {
      const res = await fetch(url, { credentials: 'omit' });
      const type = res.headers.get('content-type') || '';
      if (!res.ok || /html/i.test(type)) throw new Error('not shared');
      const rows = window.hubTimetableParse.csvRows(await res.text());
      LINK_ERR = ''; review(rows, 'The sheet at that link');
    } catch (err) { LINK_ERR = LINK_SHARE; render(); }
  });
  if ($('impRead')) $('impRead').addEventListener('click', () => {
    const text = $('impPaste').value;
    if (!text.trim()) { note = 'Nothing pasted yet.'; render(); return; }

  });
  if ($('impFile')) $('impFile').addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
