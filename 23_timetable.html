<!DOCTYPE html>
<!--
  Connect Lite — the course timetable
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 29 Sep 2026: "can we make the timetable native?" Until now it was a
  link the centre pasted — Lite carried the address to a document it could not
  read. Native, it knows things a linked document never can: which teaching
  practice falls on which day and who teaches it, when each assignment is due,
  and what each trainee is teaching, because Lite already holds all three.

  THE SHAPE OF A DAY (Ramy's own C/17 timetable, and his description on
  29 Sep): two input sessions, then teaching practice, then feedback. A
  teaching practice group of 4-6 splits into two TEACHING SETS which take
  alternate days — ABC one day, DEF the next — so each trainee teaches every
  other day and the whole group attends both. The same practice number runs on
  both days: "TP 1 · ABC" then "TP 1 · DEF", then TP 2 the same way.

  THE NAMING: letters are people, never days. A day is named by its date and
  by who teaches on it. "Day A" is not used anywhere — Ramy, 29 Sep 2026, on
  the earlier rename: the A day and trainee A were two different things
  wearing one letter, and nobody could hold both.

  WHO WRITES IT: the course admin, through the ordinary putCourse, the way
  settings and wording are written. Everyone on the course reads the same
  grid — there is nothing per-reader about a timetable.

  The skeleton builds itself from what the course already holds (the dates,
  the number of practices, the roster's groups) and is then the centre's to
  edit. Nothing it works out is locked: every cell is editable, which is the
  standing rule that anything the system decides can be overridden.
-->

<style>
  body{background:var(--sand); color:var(--ink); font-family:'Karla',sans-serif; margin:0;}
  .board{max-width:1180px; margin:0 auto; padding:26px 20px 80px;}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.7rem; margin:0 0 4px;}
  .lede{color:var(--grey); font-size:0.88rem; line-height:1.6; margin:0 0 18px; max-width:72ch;}
  .wk{margin:0 0 20px;}
  /* The week heading follows you down a four-week page, so you always know
     which week you are reading (29 Sep 2026). */
  .wk h2{font-family:'Newsreader',Georgia,serif; font-size:1.12rem; margin:0 0 8px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
    position:sticky; top:0; z-index:2; background:var(--sand); padding:6px 0 5px;}
  .wk h2 small{font-family:'Karla',sans-serif; font-size:0.78rem; font-weight:500; color:var(--grey);}
  .days{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  .day{background:var(--surface); border:1px solid var(--sand-line); border-radius:10px; padding:0 0 8px; overflow:hidden; min-width:0;}
  .day.today{border-color:var(--gold); border-width:2px;}
  .day .dh{display:flex; justify-content:space-between; align-items:baseline; gap:6px; border-bottom:1px solid var(--sand-line); padding:9px 11px 7px;}
  /* One row per slot: the time in its own narrow column so the clock reads
     straight down the day, whatever the content beside it does. */
  .sl{display:grid; grid-template-columns:44px 1fr; gap:7px; padding:3px 10px; align-items:start; font-size:0.76rem; line-height:1.32; min-width:0;}
  /* The rooms strip (1 Oct 2026). */
  .rooms{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 16px; padding:11px 14px; border:1px solid var(--sand-line); border-radius:12px; background:var(--paper);}
  .rooms .rl{font-size:0.64rem; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--grey); margin-right:4px;}
  .rooms .rm{display:inline-flex; flex-direction:column; gap:2px; text-decoration:none; padding:8px 14px; border-radius:9px; border:1.5px solid var(--sand-line); color:var(--teal); line-height:1.1;}
  .rooms .rm b{font-size:0.88rem; font-weight:700;}
  .rooms .rm small{font-size:0.64rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--grey);}
  .rooms .rm:hover{border-color:var(--teal);}
  .rooms .rm.live{background:var(--teal); border-color:var(--gold); color:var(--paper);}
  .rooms .rm.live small{color:var(--paper); opacity:.85;}
  .sl.tp .tpline{display:flex; flex-wrap:wrap; align-items:baseline; gap:0 8px;}
  .sl.tp .tpline .lab{display:inline; margin-right:2px;}
  .sl.tp.first .tpline .lab{color:var(--ink-warm); letter-spacing:.06em;}
  .sl.tp .line.me .who{color:var(--teal); text-decoration:underline; text-underline-offset:2px;}
  .sl.demo{color:var(--ink);}
  @media print{ .rooms{display:none;} }
  .sl .t{color:var(--faint); font-size:0.66rem; font-weight:700; padding-top:2px; font-variant-numeric:tabular-nums;}
  .sl .t .lt{display:block; color:var(--teal); font-weight:600; font-size:0.62rem; margin-top:1px;}
  .zone .ingreen{color:var(--teal);}
  /* The day lifts under the cursor. Ramy's motion rule: a card answers by
     moving, never by changing colour. */
  .day{transition:transform 160ms ease, box-shadow 160ms ease;}
  .day:hover{transform:translateY(-3px); box-shadow:0 10px 22px -14px oklch(30% 0.04 60 / .55);}
  @media (prefers-reduced-motion: reduce){ .day{transition:none;} .day:hover{transform:none;} }
  .sl .lab{font-size:0.62rem; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); font-weight:700; display:block; line-height:1.4;}
  .sl.brk{color:var(--faint); font-style:italic; font-size:0.71rem; padding-top:2px; padding-bottom:2px;}
  .sl.fix{color:var(--grey);}
  .sl .dash{color:var(--faint);}
  .sl.tp{background:var(--box);}
  .sl.tp .who{color:var(--gold-deep); font-weight:700;}
  /* One teaching line is a row of small parts that should break as a unit
     rather than mid-phrase: the letter, the group, the length, the door. */
  .sl.tp .line{display:inline-flex; align-items:baseline; gap:0 3px; line-height:1.4;}
  .sl.tp .mn{color:var(--grey); font-size:0.72rem; white-space:nowrap;}
  /* One meaning per colour, and a mark rather than a painted cell: the grid
     has to stay readable when nothing is wrong. */
  .mk{font-size:0.7rem; line-height:1; flex:none;}
  .mk.done{color:var(--teal); opacity:.55;}
  .mk.watch{color:var(--gold);}
  .mk.alarm{color:var(--brick);}
  .keyline{display:flex; gap:0 14px; flex-wrap:wrap; align-items:center;}
  .keyline .sp{color:var(--sand-line);}
  .sl.tp .gl{color:var(--grey); font-weight:500;}
  .sl.note{color:var(--grey); font-size:0.73rem;}
  .sl input{font-family:inherit; font-size:0.76rem; width:100%; padding:3px 6px; border:1px solid var(--sand-line); border-radius:5px; background:var(--paper); color:var(--ink); min-width:0;}
  .sl input:focus{outline:2px solid var(--teal); outline-offset:-1px;}
  .room{color:var(--teal); text-decoration:none; font-weight:600; font-size:0.71rem;}
  .room:hover{text-decoration:underline;}
  .slots{width:100%; border-collapse:collapse; font-size:0.78rem;}
  /* More than one day shape (9 Oct 2026): a tab per shape, when and where
     each applies, and the days the course meets. */
  .meets, .shwhen{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; font-size:0.8rem; margin:0 0 12px;}
  .meets label, .shwhen label{display:inline-flex; gap:5px; align-items:center; cursor:pointer;}
  .meets .ml, .shwhen .ml{font-size:0.64rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--grey); margin-right:2px;}
  .shwhen input[type=text], .shwhen input[type=date]{font-family:inherit; font-size:0.8rem; padding:5px 8px; border:1px solid var(--sand-line); border-radius:var(--r-control); background:var(--field); color:var(--ink);}
  .shtabs{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; padding-bottom:10px; border-bottom:1px solid var(--sand-line);}
  .shtab{font-family:inherit; font-size:0.78rem; font-weight:700; padding:6px 12px; border-radius:999px; border:1.5px solid var(--sand-line); background:var(--paper); color:var(--ink); cursor:pointer;}
  .shtab.on{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .shtab:not(.on):hover{border-color:var(--teal);}
  .imp .hint{font-size:0.78rem; color:var(--grey); margin:0 0 10px; line-height:1.5;}
  .shchange{font-size:0.82rem; color:var(--ink); background:var(--gold-wash); border:1px solid var(--amber-edge); border-left:4px solid var(--gold); border-radius:var(--r-strip); padding:9px 13px; margin:0 0 12px; line-height:1.55;}
  .slots th{text-align:left; font-size:0.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--grey); padding:4px 6px; border-bottom:1px solid var(--sand-line);}
  .slots td{padding:3px 6px; border-bottom:1px solid var(--sand-line);}
  .slots input, .slots select{font-family:inherit; font-size:0.76rem; width:100%; padding:3px 5px; border:1px solid var(--sand-line); border-radius:5px; background:var(--paper); color:var(--ink);}
  .day .dow{font-weight:700; font-size:0.84rem;}
  .day .dm{font-size:0.74rem; color:var(--grey);}
  .due{color:var(--gold-deep); font-weight:600; font-size:0.72rem; padding:4px 11px;}
  .due.late{color:var(--brick);}

  /* ---- v2 (7 Oct 2026): the course ribbon, the now line, due pills -------
     Ramy: "anything regarding the meaty bits". Three things the page already
     knows and did not show: where in the course today is, what is happening
     in the room right now, and how far off each deadline is. Display only --
     nothing here writes to the store. Design: Magic Touches.dc.html, 2a. */
  .tv2-rib{margin:0 0 18px; padding:16px 18px 14px; background:var(--paper); border:1px solid var(--sand-line); border-radius:12px;}
  .tv2-rib .top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 12px;}
  .tv2-rib .top b{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.35rem; color:var(--teal-deep);}
  .tv2-rib .top b em{font-style:normal; color:var(--gold-deep);}
  .tv2-rib .top span{font-size:0.78rem; color:var(--grey);}
  .tv2-segs{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:4px;}
  .tv2-seg{position:relative; height:30px; padding:0; border:0; border-radius:5px; background:var(--box); cursor:pointer;
    font:700 10px 'Karla',sans-serif; color:var(--grey); transition:transform .15s ease, background-color .2s;}
  .tv2-seg.wk1{margin-left:0;} .tv2-seg.mon{box-shadow:inset 2px 0 0 var(--sand-line);}
  .tv2-seg.past{background:var(--teal); color:var(--paper);}
  .tv2-seg.today{background:var(--gold-lifted); color:var(--ink-warm); animation:tv2-pulse 2.2s ease-out infinite;}
  .tv2-seg:hover{transform:translateY(-2px); background:var(--teal-lifted); color:var(--paper);}
  .tv2-seg.today:hover{background:var(--gold); color:var(--ink-warm);}
  .tv2-seg:focus-visible{outline:2px solid var(--gold-lifted); outline-offset:2px;}
  /* a TP day has a tick under it, a deadline a gold dot */
  .tv2-seg .tp, .tv2-seg .du{position:absolute; left:50%; transform:translateX(-50%); bottom:-8px; height:3px; border-radius:2px;}
  .tv2-seg .tp{width:60%; background:var(--teal-lifted);}
  .tv2-seg .du{width:5px; height:5px; border-radius:50%; bottom:-10px; background:var(--gold-deep);}
  .tv2-seg .tp + .du{bottom:-15px;}
  .tv2-key{display:flex; gap:16px; flex-wrap:wrap; margin:18px 0 0; font-size:0.72rem; color:var(--grey);}
  .tv2-key i{display:inline-block; vertical-align:middle; margin-right:5px;}
  .tv2-key .k-tp{width:12px; height:3px; border-radius:2px; background:var(--teal-lifted);}
  .tv2-key .k-du{width:6px; height:6px; border-radius:50%; background:var(--gold-deep);}
  /* the now line, on today's card only */
  .day.today .dh .tv2-clock{font-family:'Karla',sans-serif; font-size:0.7rem; font-weight:700; color:var(--gold-deep); font-variant-numeric:tabular-nums;}
  .day.today .sl.tv2-past{opacity:.45;}
  .day.today .sl.tv2-now{position:relative; background:var(--gold-wash); box-shadow:inset 3px 0 0 var(--gold);}
  .day.today .sl.tv2-now .t{color:var(--gold-deep);}
  .day.today .sl.tv2-now .t:after{content:'Now'; display:block; margin-top:2px; font-size:0.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-deep);}
  .day.today .sl{transition:opacity .4s ease, background-color .4s ease;}
  /* how far off a deadline is */
  .due .tv2-in{display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; font-size:0.64rem; font-weight:700;
    background:var(--gold-wash); color:var(--gold-deep); border:1px solid var(--amber-edge); vertical-align:1px;}
  .due .tv2-in.soon{background:var(--gold-lifted); border-color:var(--gold-lifted); color:var(--ink-warm);}
  .due.late .tv2-in{display:none;}
  @keyframes tv2-pulse{0%{box-shadow:0 0 0 0 oklch(70% 0.12 72 / .55);}70%{box-shadow:0 0 0 8px oklch(70% 0.12 72 / 0);}100%{box-shadow:0 0 0 0 oklch(70% 0.12 72 / 0);}}
  @media(prefers-reduced-motion:reduce){ .tv2-seg, .day.today .sl{animation:none !important; transition:none !important;} }
  @media(max-width:640px){ .tv2-seg{height:24px; font-size:0;} .tv2-rib{padding:14px 12px 12px;} }
  @media print{ .tv2-rib{display:none;} .day.today .sl.tv2-past{opacity:1;} .day.today .sl.tv2-now{background:none; box-shadow:none;} .day.today .sl.tv2-now .t:after{content:none;} .due .tv2-in{display:none;} }
  .due.asbtn{display:block; width:100%; text-align:left; font-family:inherit; background:none; border:0;
    border-top:1px dashed var(--sand-line); cursor:pointer;}
  .due.asbtn:hover{background:var(--sand-deep);}
  /* ---- THE BOARD (stage 1 of the timetable system, 9 Oct 2026) -----------
     Every day a column of tiles on one shared clock: a tile's height is its
     length. The handoff's board (specs/timetable-system/) in Lite's palette. */
  .tgrid{--gutter:54px; display:grid; gap:8px; align-items:start;}
  .tgrid .ruler{position:relative; margin-top:52px;}
  .tgrid .ruler span{position:absolute; right:6px; transform:translateY(-50%); font-size:0.62rem; font-weight:700; color:var(--faint); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .tgrid .day{padding:0; border-radius:var(--r-card); transition:none;}
  .tgrid .day:hover{transform:none; box-shadow:none;}
  .tgrid .day.today{border-color:var(--gold); border-width:2px;}
  .tgrid .dh{height:52px; box-sizing:border-box; align-items:center; padding:0 6px 0 10px; gap:6px;}
  .tgrid .dh .dt{flex:1; min-width:0; line-height:1.15;}
  .tgrid .dh small{display:block; font-size:0.6rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--faint); margin-top:1px;}
  .tgrid .dh .tv2-clock{margin-left:auto;}
  .tgrid .body{position:relative; margin:0 5px;}
  .tgrid .hr{position:absolute; left:-5px; right:-5px; border-top:1px dashed oklch(85.5% 0.02 80 / .7);}
  .pin{font-size:0.6rem; font-weight:700; color:var(--gold-deep); background:var(--gold-wash); border:1px solid var(--amber-edge); border-radius:999px; padding:2px 6px; white-space:nowrap;}
  .more{font:inherit; font-size:1rem; line-height:1; width:28px; height:28px; border-radius:var(--r-control); border:1px solid transparent; background:none; color:var(--grey); cursor:pointer; flex:none;}
  .more:hover{border-color:var(--sand-line); background:var(--paper); color:var(--ink);}
  .tile{position:absolute; left:0; right:0; box-sizing:border-box; border-radius:7px; border:1px solid var(--sand-line); padding:4px 7px 5px; overflow:hidden; user-select:none;
        transition:box-shadow .15s ease, opacity .4s ease; font-size:0.74rem;}
  body.editing .tile{cursor:grab; touch-action:manipulation;}
  .tile:hover{z-index:2; box-shadow:0 8px 18px -12px oklch(30% 0.04 60 / .55);}
  .tile.dragging{cursor:grabbing; z-index:5; box-shadow:0 14px 26px -12px oklch(30% 0.04 60 / .6);}
  .tile .tt{font-weight:700; line-height:1.25; overflow-wrap:anywhere;}
  .tile .tm{font-size:0.62rem; font-weight:600; color:var(--grey); font-variant-numeric:tabular-nums; margin-top:1px;}
  .tile.sm{padding:1px 7px; display:flex; align-items:center; gap:6px;}
  .tile.sm .tt{font-size:0.66rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tile.sm .tm{margin:0; white-space:nowrap;}
  .tile .rs{position:absolute; left:0; right:0; bottom:0; height:8px; cursor:ns-resize; touch-action:none;}
  .tile .rs:after{content:''; position:absolute; left:50%; bottom:2px; width:22px; height:3px; margin-left:-11px; border-radius:2px; background:currentColor; opacity:0; transition:opacity .15s;}
  .tile:hover .rs:after, .tile.dragging .rs:after{opacity:.35;}
  .tile.empty .tt{font-weight:600; opacity:.55; font-style:italic;}
  .k-input{background:oklch(94.5% 0.03 195); border-color:oklch(80% 0.05 195); color:var(--teal-deep);}
  .k-input.by-0{background:oklch(95% 0.04 62); border-color:oklch(83% 0.08 60); color:oklch(42% 0.11 52);}
  .k-input.by-1{background:oklch(94.5% 0.03 245); border-color:oklch(82% 0.06 245); color:oklch(40% 0.1 250);}
  .k-input.by-2{background:oklch(94.5% 0.04 150); border-color:oklch(80% 0.06 150); color:oklch(38% 0.08 150);}
  .k-input.by-3{background:oklch(94.5% 0.03 320); border-color:oklch(82% 0.05 320); color:oklch(40% 0.09 320);}
  .k-tp{background:var(--gold-wash); border-color:var(--amber-edge); color:var(--ink-warm);}
  .k-tp .who{display:inline-flex; align-items:center; gap:2px; min-width:16px; margin-left:4px; padding:0 4px; border-radius:4px; background:var(--gold-lifted); color:var(--ink-warm);}
  .k-tp .who.me{background:var(--teal); color:var(--paper);}
  .k-tp.mine{background:var(--ink-warm); border-color:var(--ink-warm); color:var(--paper);}
  .k-tp.mine .tm{color:oklch(90% 0.02 80);}
  .k-plan{background:var(--box); color:var(--ink-warm);}
  .k-feedback, .k-reflect{background:var(--paper); color:var(--ink);}
  .k-reflect .tt{font-weight:600;}
  .k-event{background:var(--paper); border:1.5px dashed var(--teal-lifted); color:var(--teal-deep);}
  .k-task{background:var(--sand-deep); color:var(--ink-warm);}
  .k-break, .k-lunch{background:repeating-linear-gradient(135deg, transparent 0 5px, oklch(85.5% 0.02 80 / .45) 5px 6px); border-style:dashed; color:var(--faint);}
  .k-break .tt, .k-lunch .tt{font-weight:600; font-style:italic;}
  .tgrid .due{position:absolute; left:0; right:0; z-index:3; height:17px; box-sizing:border-box; padding:0 7px; border-radius:4px; background:var(--brick); color:var(--paper);
              font-size:0.6rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; line-height:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border:0;}
  .tgrid .due.late{background:oklch(35% 0.12 27);}
  .tgrid .due.asbtn{display:block; width:auto; text-align:left; cursor:pointer; border-top:0;}
  .tgrid .due .tv2-in{background:var(--paper); border:0; color:var(--brick); margin-left:5px; text-transform:none; letter-spacing:0;}
  .tgrid .nowbar{position:absolute; left:-5px; right:-5px; height:2px; background:var(--gold); z-index:4; pointer-events:none;}
  .tgrid .nowbar:before{content:''; position:absolute; left:-1px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--gold);}
  .tile.tv2-past{opacity:.45;}
  .tile.tv2-now{box-shadow:0 0 0 2px var(--gold); z-index:2;}
  .tgrid .notes{padding:7px 9px 8px; border-top:1px solid var(--sand-line); font-size:0.7rem; line-height:1.45; color:var(--grey);}
  .tgrid .notes input{width:100%; box-sizing:border-box; font:inherit; font-size:0.72rem; padding:4px 6px; border:1px solid var(--sand-line); border-radius:var(--r-control); background:var(--field); color:var(--ink);}
  .addtile{display:block; width:calc(100% - 10px); margin:5px; font:inherit; font-size:0.7rem; font-weight:700; padding:5px; border-radius:var(--r-control); border:1px dashed var(--sand-line); background:none; color:var(--grey); cursor:pointer;}
  .addtile:hover{border-color:var(--teal); color:var(--teal);}
  .tkey{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:0.72rem; color:var(--grey); margin:0 0 16px;}
  .tkey i{position:static; display:inline-block; width:12px; height:12px; padding:0; border-radius:3px; vertical-align:-2px; margin-right:5px;}
  .tkey i.due{background:var(--brick); border-radius:2px; height:6px; vertical-align:2px;}
  /* the tile editor and the day menu */

<script type="text/x-hub-app">
const MODE = window.HubMode;
/* A volunteer student is not on the course: their own page carries the
   part of the timetable they need (sweep, 30 Sep 2026). */
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose \u2014 this is one of the course\u2019s own pages.');
const IS_TRAINEE = MODE === 'trainee', IS_TUTOR = MODE === 'tutor';
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const SETTINGS = rec('connect_course_settings') || {};
const KEY = 'connect_timetable_v1';
const R = window.hubRotation;
$('back').href = IS_TRAINEE ? 'index.html' : IS_TUTOR ? '5_tutor_dashboard.html' : '12_assessor_pack.html';

/* THE DAY'S SHAPE. Set once for the course; every day is laid out from it.
   The default is Ramy's own C/17 day, read off his timetable on 29 Sep 2026:
   "input 10:00-11:00, break, input 11:15-12:15, lunch 12:15-13:15, TP
   preparation 13:15-13:30. Teaching practice 13:30-14:15 and 14:15-15:00,
   break, 15:15-16:00. Break, lesson planning 16:15-17:00, break, TP feedback
   17:15-18:00." A centre that runs mornings changes it; nothing here is
   fixed. `kind` is what the slot IS, and it is what the page renders from:
     input     something a tutor types, and a room to join
     tp        one 45-minute lesson; the teaching order decides whose
     break     the day's rhythm, shown quietly and never typed in
     prep / plan / feedback   fixed appointments, named, not typed in
   `room` names which of the course's online rooms belongs to the slot, by
   label, so a room is still typed once on Course admin and never here. */
const DEFAULT_SLOTS = [
  { key:'i1',   from:'10:00', to:'11:00', kind:'input',    label:'Input',          room:'Input' },
  { key:'br1',  from:'11:00', to:'11:15', kind:'break',    label:'Break' },
  { key:'i2',   from:'11:15', to:'12:15', kind:'input',    label:'Input',          room:'Input' },
  { key:'lun',  from:'12:15', to:'13:15', kind:'break',    label:'Lunch' },
  { key:'prep', from:'13:15', to:'13:30', kind:'prep',     label:'TP preparation' },
  { key:'tp1',  from:'13:30', to:'14:15', kind:'tp',       label:'Teaching practice', room:'Teaching practice' },
  { key:'tp2',  from:'14:15', to:'15:00', kind:'tp',       label:'Teaching practice', room:'Teaching practice' },
  { key:'tp3',  from:'15:15', to:'16:00', kind:'tp',       label:'Teaching practice', room:'Teaching practice' },
  { key:'plan', from:'16:15', to:'17:00', kind:'plan',     label:'Lesson planning' },
  { key:'fb',   from:'17:15', to:'18:00', kind:'feedback', label:'TP feedback' }
];

let TT = rec(KEY) || null;
let note = '', busy = false;

/* A bare date, read as written. A timetable day is a day, never a moment --
   the same rule the assessor expiry learned on 21 Sep 2026. */
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parse = s => { const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dm = d => d.getDate() + ' ' + MON[d.getMonth()];
const TODAY = window.hubToday ? hubToday() : ymd(new Date());   // the demo clock, when the course is pinned

/* A timetable built before the day shape existed carried two input strings on
   the day itself (`a`, `b`); one from before stage 1 (9 Oct 2026) carried a
   shape and cells. Both become sessions, written back once by a tutor --
   a trainee's browser converts for itself and writes nothing (the 30 Sep
   lesson: a migration that is only held, not written, leaves the store
   behind and every other page reading the old shape). */
function migrate(){
  if (!TT || !TT.days) return;
  let changed = false;
  if (!TT.slots || !TT.slots.length) { TT.slots = DEFAULT_SLOTS.map(x => Object.assign({}, x)); changed = true; }
  const ins = TT.slots.filter(x => x.kind === 'input');
  TT.days.forEach(d => {
    if (d.cells || Array.isArray(d.sessions)) return;
    d.cells = {};
    [d.a, d.b].forEach((v, i) => { if (v && ins[i]) d.cells[ins[i].key] = v; });
    delete d.a; delete d.b;
    changed = true;
  });
  if (TT.days.some(d => !Array.isArray(d.sessions))) {
    const first = (TT.days[0] || {}).date;
    TT.days.forEach(d => {
      if (Array.isArray(d.sessions)) return;
      const sh = window.hubShapeFor ? hubShapeFor(TT, d.date) : null;
      d.sessions = sessionsFromSlots(d, sh ? sh.slots : TT.slots, d.cells, d.first || d.date === first);
      delete d.cells;
    });
    delete TT.shapes;
    TT.v = 3;
    changed = true;
  }
  if (changed && IS_TUTOR) { try { localStorage.setItem(KEY, JSON.stringify(TT)); } catch (e) {} }
}

/* The course's online rooms, typed once on Course admin. A slot names one by
   label; a room tagged for a group is preferred for that group. Nothing is
   typed twice, so the two can never drift apart. */
function roomsByLabel(){
  const list = Array.isArray(SETTINGS.onlineRooms) ? SETTINGS.onlineRooms : [];
  const by = {};
  list.forEach(r => {
    if (!r || !r.url) return;
    const k = String(r.label || '').trim().toLowerCase();
    (by[k] = by[k] || []).push(r);
  });
  return by;
}
function roomFor(slot, group){
  if (!slot.room) return null;
  const list = ROOMS[String(slot.room).trim().toLowerCase()] || [];
  if (!list.length) return null;
  return list.find(r => String(r.group || '') === String(group || '')) || list.find(r => !r.group) || list[0];
}

/* The groups, and each one's two teaching sets, from the roster. */
function groups(){
  const roster = rec('connect_roster_v1') || {};
  const people = Object.values(roster.trainees || {}).filter(Boolean);
  const by = {};
  /* The roster in this browser keys a trainee by `id`, not `token` -- the
     store's own roster op says token, hub-sync writes id, and the planning
     grid has always read id. Reading t.token gave every trainee the key
     `undefined`, so one shared row stood in for the whole group and the
     rotation came out identical for everybody (found on the scratch course,
     29 Sep 2026). */
  people.forEach(t => { const g = String(t.group || ''); (by[g] = by[g] || []).push({ token: t.id || t.token, name: t.name, group: g }); });
  if (Object.keys(by).length) return Object.keys(by).sort().map(g => ({ group: g, people: by[g], sets: R.setsFor(by[g]) }));
  /* A CANDIDATE has no roster, so this came back empty and every teaching
     slot on their timetable was a dash (found making the mock, 1 Oct 2026).
     What they do get is their own group's two sets from the TP points
     record (store v55 hands them before the points are released): tokens in
     letter order, first set then second. That is all the letters need. */
  const P = rec('connect_tp_points_v1') || {};
  const me = rec('hub:me') || {};
  if (Array.isArray(P.sets) && P.sets.length) {
    let i = 0;
    const sets = P.sets.map(st => (st || []).map(tok => ({ token: tok, name: '', group: String(P.group || me.group || ''), letter: R.LETTERS[i] || String(i + 1), idx: i++ })));
    return [{ group: String(P.group || me.group || ''), people: sets.flat(), sets }];
  }
  return [];
}

/* Assignment deadlines, so a due date is a cell rather than something the
   trainee has to remember from another screen. */
/* The deadlines, and how they are going. A date on its own is a fact about
   the course; a date that has passed with work still not in is a fact about
   the people on it, and that is the half a printed timetable can never show
   (Ramy: "this timetable is alive"). A tutor sees the count outstanding; a
   trainee sees only whether THEIRS is in, because whether somebody else has
   submitted is not theirs to read. */
/* The local calendar day of an instant, as YYYY-MM-DD. */
function dayOf(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) {
    const m = String(iso).match(/^(\d{4}-\d{2}-\d{2})/);
    return m ? m[1] : '';
  }
  return ymd(d);
}

function dues(){
  const w = rec('connect_assignment_wording_v2') || {};
  const roster = rec('connect_roster_v1') || {};
  const me = rec('hub:me') || {};
  const people = Object.values(roster.trainees || {}).filter(Boolean);
  const out = {};
  Object.keys(w).forEach(k => {
    const a = w[k] || {};
    /* WHICH DAY A DEADLINE FALLS ON. A deadline is an INSTANT, so the first
       ten characters of its stamp are its UTC date, not its day. Taking them
       put a deadline set for 01:59 on the 13th in Istanbul onto the 12th --
       the reader watched it move to the day before the one they picked
       (30 Sep 2026). It is the same fault the assessor expiry had in
       September: a date named to a person is a day, and a day is worked out
       in the clock they are reading it in. */
    const iso = dayOf(a.due);
    if (!iso) return;
    let missing = 0, mineIn = null;
    people.forEach(tr => {
      const token = tr.id || tr.token;
      const subs = (tr.records && tr.records.assignments) || (IS_TRAINEE ? rec('connect_assignment_submissions_v1') : null) || {};
      const sub = subs[k];
      const inHand = !!(sub && (sub.submittedAt || sub.submitted || sub.turnedIn));
      if (IS_TRAINEE) { if (token === me.token) mineIn = inHand; return; }
      if (!inHand) missing++;
    });
    (out[iso] = out[iso] || []).push({
      key: k,
      due: a.due,
      title: a.title || k.toUpperCase(),
      past: iso < TODAY,
      missing: IS_TRAINEE ? (mineIn === false ? 1 : 0) : missing,
      total: IS_TRAINEE ? 1 : people.length
    });
  });
  return out;
}

/* The skeleton: every weekday from the start to the end, with the teaching
   practices laid along the teaching days two at a time — the same practice
   number for each set on consecutive days. Nothing here is a guess the centre
   cannot change; it is a first draft of the shape, and every cell is editable
   afterwards. */
function skeleton(){
  const s = parse(SETTINGS.start), e = parse(SETTINGS.end);
  if (!s || !e) return null;
  const tpCount = parseInt(SETTINGS.tpCount, 10) || 8;
  const MEETS = window.hubMeets ? hubMeets(TT) : [1, 2, 3, 4, 5];
  const days = [];
  for (let d = new Date(s); d <= e; d.setDate(d.getDate()+1)) {
    const dow = d.getDay();
    /* The days the course meets: Monday to Friday unless the course says
       otherwise -- a part-time course ticks its own (9 Oct 2026). */
    if (MEETS.indexOf(dow) === -1) continue;
    days.push({ date: ymd(d), cells:{}, notes:'' });
  }
  /* Day one is orientation and the demonstration class — no assessed practice
     (Ramy's unassessed slots). Teaching starts the next course day. */
  if (days.length) days[0].first = true;
  const teaching = days.slice(1);
  const nSets = 2;
  for (let i = 0; i < teaching.length; i++) {
    const tp = Math.floor(i / nSets) + 1;
    if (tp > tpCount) break;
    teaching[i].tp = tp;
    teaching[i].setIndex = i % nSets;
  }
  const slots = (TT && TT.slots && TT.slots.length ? TT.slots : DEFAULT_SLOTS).map(x => Object.assign({}, x));
  days.forEach(d => { d.sessions = sessionsFromSlots(d, slots, {}, !!d.first); delete d.cells; });
  const out = { v: 3, days, slots, published: !!(TT && TT.published), built: new Date().toISOString() };
  if (TT && Array.isArray(TT.meets) && TT.meets.length) out.meets = TT.meets;
  return out;
}

/* THE TIMETABLE AS SESSIONS (stage 1 of the timetable system, 9 Oct 2026).
   Ramy: "a flexible sort of tiles that would just adapt to whatever shape
   thrown at it". The design is the Connect handoff (specs/timetable-system/)
   with Lite's look and its live layer: every day holds its own SESSIONS, each
   with a kind and its own times, so a course whose afternoon moves, a part-
   time Saturday and an odd day like a demo lesson are all just sessions at
   different times. There is no shape to set up any more.

   A session: { id, s:'HH:MM', e:'HH:MM', k, t, by?, room? }
     k  input · tp · plan · feedback · reflect · event · task · break · lunch
     t  what it is called ("Phonology 2"); a TP lesson's is worked out
     by the input tutor, as an index into the course's tutor names (colour)
   The day keeps `tp` and `setIndex` (which practice, whose turn), as before:
   the TP tiles are that practice's lessons in time order, and the rotation
   deals the letters onto them. Every other page reads the day's times through
   hubSlotsFor (hub-shared.js), which turns sessions into slots, so nothing
   outside this screen had to learn the new shape. */
const PXM = 1.3;   // pixels per minute on the board
const KIND_LABEL = { input:'Input', tp:'Teaching practice', plan:'Lesson planning', feedback:'TP feedback', reflect:'Reflection', event:'Whole group', task:'Assignments & admin', break:'Break', lunch:'Lunch' };
const KIND_ORDER = ['input','tp','plan','feedback','reflect','event','task','break','lunch'];
const toMin = hm => { const m = /^(\d{1,2}):(\d{2})/.exec(String(hm || '')); return m ? +m[1] * 60 + +m[2] : null; };
const toHM = n => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
const byStart = (a, b) => (toMin(a.s) || 0) - (toMin(b.s) || 0);
const newId = () => 's' + Math.random().toString(36).slice(2, 8);
const TUTORS = String(SETTINGS.tutorNames || '').split(/[,\n;]+/).map(x => x.trim()).filter(Boolean);

/* The slots a day is laid out from, for the code that still thinks in slots
   (the rooms strip). */
function slotsOf(day){
  const s = window.hubSlotsFor ? hubSlotsFor(TT, day && day.date) : (TT && TT.slots);
  return (s && s.length) ? s : DEFAULT_SLOTS;
}

/* A day's sessions from a slot list -- how a timetable from before stage 1
   is converted, and how a new course's days are first laid out. What a day
   had typed into a slot (`cells`) becomes that session's name; a day with no
   practice gets no TP tiles; day one gets its demonstration lesson (ninety
   minutes across the first two TP slots) and the unassessed teaching. */
function sessionsFromSlots(day, slots, cells, isFirst){
  cells = cells || {};
  const out = [], tps = (slots || []).filter(sl => sl.kind === 'tp' && sl.from && sl.to);
  if (isFirst && tps.length) {
    out.push({ id:'demo', s: tps[0].from, e: (tps[1] || tps[0]).to, k:'event', t:'Demonstration lesson', room: tps[0].room || '' });
    if (tps[2]) out.push({ id:'unassessed', s: tps[2].from, e: tps[2].to, k:'event', t:'Unassessed teaching', room: tps[2].room || '' });
  }
  (slots || []).forEach(sl => {
    if (!sl.from || !sl.to) return;
    const base = { id: sl.key || newId(), s: sl.from, e: sl.to };
    if (sl.room) base.room = sl.room;
    if (sl.kind === 'tp') { if (!isFirst && day.tp) out.push(Object.assign(base, { k:'tp', t:'' })); return; }
    if (sl.kind === 'break') { out.push(Object.assign(base, { k: /lunch/i.test(sl.label || '') ? 'lunch' : 'break', t: sl.label || 'Break' })); return; }
    if (sl.kind === 'input') { out.push(Object.assign(base, { k:'input', t: cells[sl.key] || '' })); return; }
    const k = (sl.kind === 'plan' || sl.kind === 'prep') ? 'plan' : sl.kind === 'feedback' ? (/reflect/i.test(sl.label || '') ? 'reflect' : 'feedback') : sl.kind === 'event' || sl.kind === 'task' ? sl.kind : 'event';
    out.push(Object.assign(base, { k, t: cells[sl.key] || sl.label || KIND_LABEL[k] }));
  });
  return out.sort(byStart);
}

/* The usual day: the slots a new day is laid out from. Kept current on every
   save from a teaching day (save()), so it is whatever the course looks like
   now, and pages that only want "the" TP times still have them. */
function template(){ return (TT && TT.slots && TT.slots.length) ? TT.slots : DEFAULT_SLOTS; }

/* A practice needs its lessons on the board. A day given a practice with no TP
   tiles takes them from the nearest teaching day before it, else the usual
   day; a day without one loses its TP tiles. */
function ensureTp(day){
  day.sessions = day.sessions || [];
  if (day.sessions.some(x => x.k === 'tp')) return;
  const i = TT.days.indexOf(day);
  const near = TT.days.slice(0, Math.max(0, i)).reverse().concat(TT.days.slice(i + 1)).find(d => d.tp && (d.sessions || []).some(x => x.k === 'tp'));
  const from = near ? near.sessions.filter(x => x.k === 'tp').map(x => ({ s:x.s, e:x.e, room:x.room })) : template().filter(sl => sl.kind === 'tp').map(sl => ({ s:sl.from, e:sl.to, room:sl.room }));
  from.forEach(x => day.sessions.push({ id:newId(), s:x.s, e:x.e, k:'tp', t:'', room: x.room || 'Teaching practice' }));
  day.sessions.sort(byStart);
}
function dropTp(day){ day.sessions = (day.sessions || []).filter(x => x.k !== 'tp'); }

/* The span every day is drawn on: the course's earliest start to its latest
   end, to the half hour, so the weeks line up with each other. */
function bounds(){
  let a = 24 * 60, b = 0;
  (TT.days || []).forEach(d => (d.sessions || []).forEach(x => { const s = toMin(x.s), e = toMin(x.e); if (s != null && e != null) { a = Math.min(a, s); b = Math.max(b, e); } }));
  if (b <= a) { a = 9 * 60; b = 17 * 60; }
  return { from: Math.floor(a / 30) * 30, to: Math.ceil(b / 30) * 30 };
}

/* Who teaches which of the day's lessons: the set whose day it is, in the
   rotation's order for this practice. */
function teachersOf(day){
  const out = [];
  if (!day.tp) return out;
  GROUPS.forEach(gr => { const set = gr.sets[day.setIndex] || []; if (set.length) out.push({ group: gr.group, order: R.orderFor(set, day.tp) }); });
  return out;
}

function tileHTML(day, x, B, tpIdx, teachers){
  const s = toMin(x.s), e = toMin(x.e); if (s == null || e == null) return '';
  const top = (s - B.from) * PXM, h = Math.max(12, (e - s) * PXM - 2);
  const cls = ['tile', 'k-' + x.k];
  if (h < 30) cls.push('sm');
  if (x.k === 'input' && x.by !== undefined && x.by !== '' && x.by !== null) cls.push('by-' + (+x.by % 4));
  let title = '';
  if (x.k === 'tp') {
    const meTok = (rec('hub:me') || {}).token || '';
    const byLetter = new Map();
    teachers.forEach(g => { const p = g.order[tpIdx]; if (!p) return; const k = String(p.letter); if (!byLetter.has(k)) byLetter.set(k, []); byLetter.get(k).push(p.token); });
    const worst = tokens => { const ms = tokens.map(tok => markFor(tok, day.tp, day.date)); const pick = c => ms.find(m => m.indexOf('mk ' + c) !== -1) || ''; return pick('alarm') || pick('watch') || (ms.length && ms.every(m => m.indexOf('mk done') !== -1) ? ms[0] : ''); };
    const mine = !!meTok && [...byLetter.values()].some(t => t.indexOf(meTok) !== -1);
    if (mine) cls.push('mine');
    const setName = (tpIdx === 0 && teachers[0]) ? teachers[0].order.slice().sort((a, b) => String(a.letter).localeCompare(String(b.letter))).map(p => esc(p.letter)).join('') : '';
    const who = [...byLetter.entries()].map(([letter, tokens]) => `<span class="who${meTok && tokens.indexOf(meTok) !== -1 ? ' me' : ''}">${worst(tokens)}${esc(letter)}</span>`).join('');
    title = day.tp ? (mine ? 'You teach · ' : '') + `TP ${day.tp}${setName ? ' · ' + setName : ''}${who}` : 'Teaching practice';
  } else {
    title = esc(x.t || '');
    /* An unnamed input is a slot nobody has filled: a tutor sees where it is,
       the course sees nothing there. */
    if (!x.t && x.k === 'input' && !EDIT) return '';
    if (!x.t) { cls.push('empty'); title = esc(KIND_LABEL[x.k] || ''); }
  }
  const tip = (x.k === 'tp' ? 'TP ' + (day.tp || '') : (x.t || KIND_LABEL[x.k] || '')) + ' · ' + hubClockRange(x.s, x.e) + (x.k === 'input' && TUTORS[+x.by] ? ' · ' + TUTORS[+x.by] : '');
  return `<div class="${cls.join(' ')}" data-id="${esc(x.id)}" data-date="${esc(day.date)}" data-from="${esc(x.s)}" data-to="${esc(x.e)}" style="top:${top}px;height:${h}px" title="${esc(tip)}">`
    + `<div class="tt">${title}</div><div class="tm">${esc(hubClockRange(x.s, x.e))}</div>${EDIT ? '<span class="rs" data-rs="1"></span>' : ''}</div>`;
}

/* One day: its header, its tiles on the shared clock, its deadlines as red
   bars at the time they fall, its notes underneath. */
function dayHTML(day, B, idx){
  const d = parse(day.date), isToday = day.date === TODAY;
  const ses = (day.sessions || []).slice().sort(byStart);
  const teachers = teachersOf(day);
  const tpTiles = ses.filter(x => x.k === 'tp');
  const H = (B.to - B.from) * PXM;
  let hours = '';
  for (let m = Math.ceil(B.from / 60) * 60; m <= B.to; m += 60) hours += `<div class="hr" style="top:${(m - B.from) * PXM}px"></div>`;
  const dueHere = (DUES[day.date] || []);
  const dues = dueHere.map((x, i) => {
    const local = window.HubDue && x.due ? HubDue.toLocalInput(x.due).slice(11, 16) : '';
    const at = toMin(local);
    const top = Math.min(H - 18, Math.max(0, at == null ? 0 : (at - B.from) * PXM)) + i * 19;
    const late = x.past && x.missing;
    const body = `${esc(x.title)} due${local ? ' · ' + esc(hubClock(local)) : ''}${late ? ' · ' + (IS_TRAINEE ? 'yours is not in' : x.missing + ' of ' + x.total + ' not in') : ''}`;
    return EDIT ? `<button type="button" class="due asbtn${late ? ' late' : ''}" data-move="${esc(x.key)}" style="top:${top}px" title="Move this deadline">${body}</button>`
                : `<div class="due${late ? ' late' : ''}" style="top:${top}px">${body}</div>`;
  }).join('');
  const notes = EDIT
    ? `<div class="notes"><input type="text" data-date="${esc(day.date)}" data-f="notes" value="${esc(day.notes || '')}" placeholder="Notes"></div>`
    : (day.notes ? `<div class="notes">${esc(day.notes)}</div>` : '');
  return `<div class="day${isToday ? ' today' : ''}" id="d-${esc(day.date)}">
    <div class="dh"><div class="dt"><span class="dow">${DOW[d.getDay()]}</span> <span class="dm">${dm(d)}${isToday ? ' · today' : ''}</span><small>Day ${idx + 1}</small></div>
      ${EDIT && day.pinned ? '<span class="pin" title="Copying a day’s shape leaves this one alone">Pinned</span>' : ''}
      ${EDIT ? `<button type="button" class="more" data-menu="${esc(day.date)}" aria-label="Options for this day">⋯</button>` : ''}</div>
    <div class="body" style="height:${H}px" data-start="${B.from}">${hours}${ses.map(x => tileHTML(day, x, B, tpTiles.indexOf(x), teachers)).join('')}${dues}${isToday ? '<div class="nowbar" hidden></div>' : ''}</div>
    ${EDIT ? `<button type="button" class="addtile" data-add="${esc(day.date)}">+ Add a tile</button>` : ''}
    ${notes}
  </div>`;
}

/* LIVE COLOUR. Ramy, 29 Sep 2026: "this timetable is alive, so colour should
   maybe mean something on the timetable."
 *
 * A printed timetable can only say what is planned. This one knows what
 * happened, because Lite holds the plans, the feedback and the grades. Three
 * states, one meaning each, and nothing else gets a hue:
 *
 *   done   the lesson was taught and returned to standard or above. A quiet
 *          tick. It is the ordinary outcome and should not shout.
 *   watch  the lesson is today or tomorrow and the plan is not in. Amber.
 *          A reminder, not a warning -- the same tone as the deadlines.
 *   alarm  the lesson was not to standard. Garnet. Something followed from
 *          it: another lesson in the same family, possibly a stage record.
 *
 * WHO SEES WHAT. A tutor sees every trainee's state, because that is their
 * job. A trainee sees only their own -- whether somebody else failed a
 * lesson is not theirs to read off a timetable, and the store only sends them
 * their own record anyway.
 */
function stateMap(){
  const T = window.HubTracker;
  const out = {};
  if (!T) return out;
  const roster = rec('connect_roster_v1') || {};
  const me = rec('hub:me') || {};
  Object.values(roster.trainees || {}).filter(Boolean).forEach(tr => {
    const token = tr.id || tr.token;
    if (!token) return;
    if (IS_TRAINEE && token !== me.token) return;       // only their own
    let c = null; try { c = T.recordFor(tr); } catch (e) { return; }
    if (!c) return;
    const mine = {};
    for (let n = 1; n <= 20; n++) {
      const g = c['tp' + n];
      if (g) mine[n] = { grade: g };
    }
    /* The plan in hand, and which practice it is for. A plan names its own
       TP ("TP3"), so a plan for a later lesson does not count as this one's. */
    const plan = (tr.records && tr.records.plan) || (IS_TRAINEE ? rec('chub:plan') : null);
    const planFor = plan && plan.meta && plan.meta.tp ? String(plan.meta.tp).replace(/[^0-9]/g, '') : '';
    out[token] = { tps: mine, planFor: planFor ? +planFor : 0 };
  });
  return out;
}

/* Is this day today or tomorrow? A plan that is not in three weeks out is not
   news; one that is not in for tomorrow is. */
function soon(dateISO){
  const d = parse(dateISO); if (!d) return false;
  const now = parse(TODAY); if (!now) return false;
  const diff = Math.round((d - now) / 86400000);
  return diff >= 0 && diff <= 1;
}

/* The mark for one trainee on one practice. Nothing when there is nothing
   to say, which is most of the time -- the grid stays readable and the eye
   goes to the day that needs somebody. */
function markFor(token, tp, dateISO){
  const st = STATE[token];
  if (!st) return '';
  const g = (st.tps[tp] || {}).grade;
  if (g === 'NOTSTD') return `<span class="mk alarm" title="Not to standard">\u25cf</span>`;
  if (g) return `<span class="mk done" title="${g === 'ABOVE' ? 'Above standard' : 'To standard'}">\u2713</span>`;
  if (soon(dateISO) && st.planFor !== tp) return `<span class="mk watch" title="The plan is not in yet">\u25cf</span>`;
  return '';
}

/* A colour that means something has to say what it means, and only while it
   is on the page: a key to marks nobody can see is furniture. */
/* THE ROOMS, ONCE, ABOVE THE WEEKS. Ramy, 1 Oct 2026: the join links inside
   the cells were "too close to each other -- you could end up clicking the
   wrong link", so the cells carry none, and the rooms stand in one strip
   above the timetable, named by the LEVEL of the class they hold ("Teaching
   practice · B1") rather than by group. Each shows the time of its slot
   today, and the one whose slot is running is lit -- from ten minutes before
   it starts until it ends, on the course's own clock -- "like Connect". The
   landing page keeps its own strip too: two doors. */
function roomsStrip(){
  const rooms = (Array.isArray(SETTINGS.onlineRooms) ? SETTINGS.onlineRooms : []).filter(r => r && r.url && /^https?:\/\//i.test(r.url));
  if (!rooms.length) return '';
  const slots = slotsOf({ date: TODAY });
  const n0 = window.hubNow ? hubNow() : new Date();
  const now = n0 instanceof Date ? n0 : new Date(n0);
  const todayIsCourseDay = (TT.days || []).some(d => d.date === TODAY);
  const hm = (h, m) => h * 60 + m;
  const mins = str => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(str || '')); return m ? hm(+m[1], +m[2]) : null; };
  const nowMin = hm(now.getHours(), now.getMinutes());
  const forRoom = r => slots.filter(sl => sl.room && String(sl.room).toLowerCase() === String(r.label || '').toLowerCase());
  return `<div class="rooms"><span class="rl">Join</span>${rooms.map(r => {
    const mine = forRoom(r);
    const first = mine[0];
    const live = todayIsCourseDay && mine.some(sl => { const a = mins(sl.from), b = mins(sl.to); return a != null && b != null && nowMin >= a - 10 && nowMin <= b; });
    const where = r.level ? esc(r.level) : (r.group ? 'Group ' + esc(r.group) : '');
    const when = first ? esc(mine.length > 1 ? hubClockRange(first.from, mine[mine.length - 1].to) : hubClock(first.from)) : '';
    return `<a class="rm${live ? ' live' : ''}" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><b>${esc(r.label || 'Room')}${where ? ' \u00b7 ' + where : ''}</b><small>${live ? 'Live now' : when}</small></a>`;
  }).join('')}</div>`;
}
function keyLine(){
  const seen = { done:0, watch:0, alarm:0 };
  Object.keys(STATE).forEach(t => {
    const st = STATE[t];
    Object.keys(st.tps).forEach(n => { const g = st.tps[n].grade; if (g === 'NOTSTD') seen.alarm++; else if (g) seen.done++; });
  });
  (TT.days || []).forEach(d => { if (d.tp && soon(d.date)) seen.watch++; });
  const bits = [];
  if (seen.done) bits.push('<span class="mk done">\u2713</span> taught and returned');
  if (seen.watch) bits.push('<span class="mk watch">\u25cf</span> the plan is not in yet');
  if (seen.alarm) bits.push('<span class="mk alarm">\u25cf</span> not to standard');
  if (!bits.length) return '';
  return `<p class="legend keyline">${bits.join('<span class="sp">\u00b7</span>')}</p>`;
}

/* MOVING A DEADLINE FROM THE TIMETABLE (30 Sep 2026, the last of phase two).
 *
 * A deadline has always lived on the assignment's own wording, and the
 * timetable could only show it. But the timetable is where you can SEE that a
 * deadline lands the day before three lessons, or on the day a group teaches,
 * and seeing it somewhere you cannot act is its own small cruelty.
 *
 * So a tutor can move one from here. It writes back to the same field the
 * wording screen writes, so there is still one deadline, not two. The time of
 * day is kept -- moving a date should not quietly turn 23:00 into midnight.
 *
 * And it warns rather than refuses. A deadline on a day the group is teaching
 * is against the centre's own scheduling rule, but a warning is right where a
 * veto is not: a tutor moving a deadline usually knows something the software
 * does not. */
let MOVING = null;   // the assignment key whose deadline is being moved

/* Does this group teach on that day? Their set decides which of a practice's
   two days is theirs, so "teaching that day" is a per-group question. */
function teachesOn(dateISO){
  const day = (TT.days || []).find(d => d.date === dateISO);
  if (!day || !day.tp) return [];
  return GROUPS.filter(g => (g.sets[day.setIndex] || []).length).map(g => g.group);
}

function moveHTML(){
  if (!MOVING || !IS_TUTOR) return '';
  const w = rec('connect_assignment_wording_v2') || {};
  const a = w[MOVING] || {};
  const cur = dayOf(a.due);
  const days = (TT.days || []).map(d => d.date);
  return `<div class="imp"><h3>Move ${esc(a.title || MOVING.toUpperCase())}</h3>
    <p>It is due on ${esc(cur || 'no day yet')}. Pick another course day; the time of day is kept.</p>
    <div class="row">
      <select id="moveTo">${days.map(d => {
        const t = teachesOn(d);
        return `<option value="${esc(d)}"${d === cur ? ' selected' : ''}>${esc(d)}${t.length ? ' \u2014 ' + (t.length > 1 ? 'groups' : 'group') + ' ' + t.join(', ') + ' teach' : ''}</option>`;
      }).join('')}</select>
      <button class="btn" id="moveGo">Move it</button>
      <button class="btn quiet" id="moveCancel">Leave it</button>
    </div>
    <p class="hint" id="moveWarn"></p></div>`;
}

function wireMove(){
  if (!IS_TUTOR) return;
  document.querySelectorAll('[data-move]').forEach(el => el.addEventListener('click', () => {
    MOVING = (MOVING === el.dataset.move) ? null : el.dataset.move; render();
  }));
  const sel = $('moveTo');
  const warn = () => {
    const el = $('moveWarn'); if (!el || !sel) return;
    const t = teachesOn(sel.value);
    el.textContent = t.length
      ? 'Group ' + t.join(' and ') + ' teach that day. A deadline usually falls on a day a group is not teaching \u2014 this is a note, not a block.'
      : '';
  };
  if (sel) { sel.addEventListener('change', warn); warn(); }
  if ($('moveCancel')) $('moveCancel').addEventListener('click', () => { MOVING = null; render(); });
  if ($('moveGo')) $('moveGo').addEventListener('click', () => {
    const w = rec('connect_assignment_wording_v2') || {};
    const a = w[MOVING]; if (!a || !sel) return;
    /* Keep the hour: the deadline is an instant, and only its DAY is moving. */
    const local = window.HubDue ? HubDue.toLocalInput(a.due) : '';
    const time = local ? local.slice(11, 16) : '23:59';
    a.due = window.HubDue ? HubDue.fromLocalInput(sel.value + 'T' + time) : sel.value;
    try { localStorage.setItem('connect_assignment_wording_v2', JSON.stringify(w)); } catch (e) {}
    MOVING = null; note = 'Deadline moved'; render();
  });
}

/* Whose clock the times are in. Said once, under the grid, and only when it
   could matter -- a reader in the course's own zone is told nothing, because
   for them there is nothing to know. */
function zoneLine(){
  if (!ZONE || !window.hubReaderZone) return '';
  const reader = window.hubReaderZone();
  if (!reader || reader === ZONE) return '';
  /* It said "the smaller time", and the two are almost the same size -- what
     tells them apart is the colour (Ramy, 30 Sep 2026). So the sentence names
     the colour, and the word "green" is itself green, which is the only way a
     sentence about a colour is worth reading. */
  return `<p class="zone">Times are the course\u2019s own clock in <b>${esc(window.hubZoneName(ZONE))}</b>. The <b class="ingreen">green</b> time under each is yours in <b>${esc(window.hubZoneName(reader))}</b>.</p>`;
}

/* "45 min" from a slot's own two times, so changing a time changes the label
   with it rather than leaving a number behind that used to be true. */
function mins(slot){
  const a = String(slot.from || '').match(/^(\d{1,2}):(\d{2})/), b = String(slot.to || '').match(/^(\d{1,2}):(\d{2})/);
  if (!a || !b) return '';
  const n = (+b[1]*60 + +b[2]) - (+a[1]*60 + +a[2]);
  return n > 0 ? n + ' min' : '';
}

let GROUPS = [], DUES = {}, ROOMS = {}, ZONE = '', STATE = {}, EDIT = false;
/* A tutor can look at the timetable the way the course sees it. Without this
   they only ever see input boxes and can never check what they have
   published (Ramy, 29 Sep 2026: "there's the course admin view, and then
   there's the view-only timetable for the course once it's set"). */
let PREVIEW = false, SCROLLED = false, SLOTS_OPEN = false;

function render(){
  migrate();
  ZONE = SETTINGS.timeZone || '';
  STATE = stateMap();
  GROUPS = groups(); DUES = dues(); ROOMS = roomsByLabel(); EDIT = IS_TUTOR && !PREVIEW;
  document.body.classList.toggle('editing', EDIT);
  document.addEventListener('click', (e) => { if (e.target && e.target.id === 'ttPrint') window.print(); });
  const app = $('app');
  /* Ramy, 30 Sep 2026: "we should be able to print the timetable" -- and a
     four-week course does not fit one sheet, so it prints as weeks: each week
     starts a page, and no day is ever split across the fold. */
  const head = `<p class="eyebrow">Course</p><h1>Timetable <button type="button" class="btn quiet printbtn" id="ttPrint">Print / Save as PDF</button></h1>
    <p class="lede">${IS_TUTOR
      ? 'The course’s own timetable. The teaching practices and the assignment deadlines come from the course itself; the input sessions and notes are yours to type. Letters are people — a day is named by its date and by who teaches on it.'
      : 'Every day of the course. The teaching practice cell says who is teaching that day; your assignment deadlines are marked on the day they fall.'}</p>`;
  /* Set, then seen. A skeleton is twenty empty days, and until 29 Sep 2026 the
     course saw it the moment it was built. The timetable is the tutors' until
     they publish it; after that everyone on the course reads the same one. */
  if (!IS_TUTOR && TT && TT.days && TT.days.length && !TT.published) {
    app.innerHTML = head + `<div class="empty">The timetable is not ready yet. It will appear here once the course admin has set it.</div>`;
    return;
  }
  if (!TT || !TT.days || !TT.days.length) {
    app.innerHTML = head + (IS_TUTOR
      ? `<div class="bar"><button class="btn" id="build"${(!SETTINGS.start || !SETTINGS.end) ? ' disabled' : ''}>Build the timetable</button><span class="status">${(!SETTINGS.start || !SETTINGS.end) ? 'Set the course start and end dates on Course admin first.' : 'Lays out every weekday from the start to the end, with the teaching practices along it. Everything stays editable.'}</span></div>`
      : `<div class="empty">The timetable has not been set up yet.</div>`);
    if ($('build')) $('build').addEventListener('click', build);
    return;
  }
  /* Weeks are Monday to Friday runs, so a four-week course reads as four
     rows rather than one long ribbon. */
  const weeks = [];
  TT.days.forEach(day => {
    const d = parse(day.date); if (!d) return;
    if (!weeks.length || d.getDay() <= (parse(weeks[weeks.length-1][weeks[weeks.length-1].length-1].date) || d).getDay()) {
      if (!weeks.length || d.getDay() === 1) weeks.push([]);
    }
    if (!weeks.length) weeks.push([]);
    weeks[weeks.length-1].push(day);
  });
  const pub = !!(TT && TT.published);
  const bar = IS_TUTOR ? `<div class="bar">
      ${pub ? `<span class="chip on">The course can see it</span><button class="btn quiet" id="unpublish">Take it back</button>`
            : `<span class="chip">Not set yet</span><button class="btn" id="publish">Set it for the course</button>`}
      <button class="btn quiet" id="preview">${PREVIEW ? 'Back to editing' : 'See what they see'}</button>
      ${EDIT ? `<button class="btn quiet" id="ttUndo"${UNDO.length ? '' : ' disabled'}>Undo</button>` : ''}
      <button class="btn quiet" id="daysOpen">The course’s days</button>
      <button class="btn quiet" id="importOpen">Import from a sheet</button>
      <span class="status">${esc(note)}</span></div>
      <p class="legend" style="margin:0 0 14px">${pub ? 'Everyone on the course reads this timetable. Edits show at once.' : 'Only tutors can see it until you set it.'}</p>`
      + (EDIT ? `<p class="legend" style="margin:-8px 0 14px">Drag a tile to move it, or its bottom edge to change its length. Click a tile to change it. ⋯ on a day copies its shape to other days.</p>` : '')
      + (PREVIEW ? '' : moveHTML() + daysPanelHTML() + importHTML()) : '';
  /* Where teaching practice starts at a different time from the teaching day
     before it, the week says so above its days, in words: "From Monday 26
     October teaching practice starts at 2:00 PM" (Ramy, 9 Oct 2026: "the
     second half of the course is changing the time"). Worked out from the
     sessions, so nobody declares it. */
  const tpStart = d => { const t = (d.sessions || []).filter(x => x.k === 'tp').sort(byStart)[0]; return d.tp && t ? t.s : ''; };
  const changeNote = (w) => w.map(d => {
    const i = TT.days.indexOf(d), here = tpStart(d);
    if (i <= 0 || !here) return '';
    const prev = TT.days.slice(0, i).reverse().find(x => tpStart(x));
    if (!prev || tpStart(prev) === here) return '';
    const when = parse(d.date);
    return `<p class="shchange">From <b>${DOWL[when.getDay()]} ${when.getDate()} ${MONL[when.getMonth()]}</b> teaching practice starts at <b>${esc(hubClock(here))}</b>.</p>`;
  }).join('');
  const B = bounds(), H = (B.to - B.from) * PXM;
  let ruler = '';
  for (let m = Math.ceil(B.from / 60) * 60; m <= B.to; m += 60) ruler += `<span style="top:${(m - B.from) * PXM}px">${esc(hubClock(toHM(m)).replace(':00', ''))}</span>`;
  const used = new Set(); (TT.days || []).forEach(d => (d.sessions || []).forEach(x => { if (x.k === 'input' && x.by !== undefined && x.by !== '' && TUTORS[+x.by]) used.add(+x.by); }));
  const key = `<div class="tkey">${[...used].sort().map(i => `<span><i class="tile k-input by-${i % 4}"></i>Input · ${esc(TUTORS[i])}</span>`).join('')}${used.size ? '' : '<span><i class="tile k-input"></i>Input</span>'}<span><i class="tile k-tp"></i>Teaching practice</span><span><i class="tile k-plan"></i>Lesson planning</span><span><i class="tile k-feedback"></i>Feedback &amp; reflection</span><span><i class="tile k-event"></i>Whole group</span><span><i class="tile k-task"></i>Assignments &amp; admin</span><span><i class="due"></i>A deadline</span></div>`;
  app.innerHTML = head + zoneLine() + bar + roomsStrip() + key + weeks.map((w, i) => {
    const a = parse(w[0].date), b = parse(w[w.length-1].date);
    return `<section class="wk"><h2>Week ${i+1} <small>${dm(a)} – ${dm(b)}</small></h2>${changeNote(w)}
      <div class="tgrid" style="grid-template-columns:var(--gutter) repeat(${w.length}, minmax(0,1fr))"><div class="ruler" style="height:${H}px">${ruler}</div>${w.map(d => dayHTML(d, B, TT.days.indexOf(d))).join('')}</div></section>`;
  }).join('') + keyLine() + `<p class="legend">Teaching practice runs the same number on two days, one teaching set each: the letters name the trainees teaching that day. ${GROUPS.map(g => 'Group ' + esc(g.group || '—') + ': ' + g.sets.map(R.setName).filter(Boolean).join(' and ')).join('. ')}.</p>`;
  if ($('preview')) $('preview').addEventListener('click', () => { PREVIEW = !PREVIEW; render(); });
  if ($('publish')) $('publish').addEventListener('click', () => { TT.published = true; save('Set \u2014 the course can see it'); render(); });
  if ($('unpublish')) $('unpublish').addEventListener('click', () => { TT.published = false; save('Taken back'); render(); });
  wireEdits();
  wireImport();
  wireDays();
  wireMove();
  wireBoard();
  /* Twenty full days stacked on a phone is a long way to scroll to reach this
     afternoon, so a narrow screen opens on today.
     It has to survive a RE-RENDER. Replacing the grid's innerHTML puts the
     page back at the top, and the first render is followed by others -- the
     migration saves, the boot arrives, a preview toggles -- so doing this
     once meant it was always undone and the phone opened on day one
     (30 Sep 2026). It re-applies after every render until the reader scrolls
     for themselves, and then never again: scrolling back to read week one
     must not be yanked away by the next save. */
  if (!SCROLLED && window.innerWidth <= 980) {
    const t = document.getElementById('d-' + TODAY);
    /* `center` centres a card that is taller than the phone, which put
       today's own header 364px above the fold -- you landed in the middle of
       the afternoon with no idea which day you were looking at. Start at the
       top of the card, less the sticky week heading that would otherwise sit
       over it. */
    /* Twice, and by offsetTop. The first pass runs before the day cards have
       their final height -- the marks, the room links and the second clock
       all arrive and change it -- so a single measurement landed 488px past
       the day it was aiming at. offsetTop is the document position rather
       than a viewport one, so the second pass corrects rather than compounds. */
    if (t) {
      /* A phone shows a week as a row of days to swipe through: land on
         today's column as well as its week. */
      if (t.parentElement) t.parentElement.scrollLeft = t.offsetLeft - t.parentElement.offsetLeft;
      const land = () => {
        const head = document.querySelector('.wk h2');
        const off = head ? head.offsetHeight + 8 : 0;
        window.scrollTo({ top: Math.max(0, t.offsetTop - off) });
      };
      requestAnimationFrame(land);
      setTimeout(() => { if (!SCROLLED) land(); }, 300);
    }
  }
}

/* THE COURSE'S DAYS. Which weekdays it meets: full-time is Monday to Friday,
   a part-time course ticks its own. Changing them lays the days out again,
   keeping every session and note on a day that is still a course day. */
let DAYS_OPEN = false;
const ask = (text, verb) => window.confirmModal ? confirmModal(text, verb) : Promise.resolve(confirm(text));

function daysPanelHTML(){
  if (!DAYS_OPEN) return '';

    <p>The weekdays the course meets. A part-time course ticks only its own; the teaching practices are dealt again over the days that are left, and everything already on a day that is still a course day stays where it is.</p>
    <div class="meets"><span class="ml">The course meets on</span>${[1,2,3,4,5,6,0].map(n => `<label><input type="checkbox" data-meet="${n}"${meets.indexOf(n) !== -1 ? ' checked' : ''}> ${DOW[n]}</label>`).join('')}</div>
    <p class="hint">To change a day’s times, drag its tiles, or set one day as you want it and use ⋯ on that day → “Use this day’s shape for…”.</p>
    <div class="row"><button class="btn quiet" id="relay">Lay the days out again</button><button class="btn quiet" id="daysClose">Close</button></div></div>`;
}

function wireDays(){
  if (!IS_TUTOR) return;
  if ($('daysOpen')) $('daysOpen').addEventListener('click', () => { DAYS_OPEN = !DAYS_OPEN; render(); });
  if ($('daysClose')) $('daysClose').addEventListener('click', () => { DAYS_OPEN = false; render(); });
  if ($('relay')) $('relay').addEventListener('click', async () => {
    if (await ask('Lay the course days out again from the course dates? Sessions and notes on a day that is still a course day are kept; the teaching practices are dealt again.', 'Rebuild')) build(true);
  });
  document.querySelectorAll('[data-meet]').forEach(el => el.addEventListener('change', async () => {
