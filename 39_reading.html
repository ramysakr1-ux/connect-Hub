<!DOCTYPE html>
<!--
  Connect Lite — something to read: how to succeed on the CELTA, the CELTA glossary, and on an online course, the online
  room (readings.js). ?doc=succeed | glossary | online. Before day one they sit on the trainee's welcome card; from day
  one, in Course resources (Ramy, 29 Oct 2026). A course page: it opens from a course link, never to a volunteer student.
  © 2026 Ramy Sakr. All rights reserved.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Karla:wght@400;500;600;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202610301730">
<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:36px 20px 90px; display:flex; justify-content:center;}
  .board{max-width:780px; width:100%;}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .eyebrow{margin:0 0 6px; font:700 .72rem/1 'Instrument Sans','Karla',sans-serif; letter-spacing:.2em; text-transform:uppercase; color:var(--a-red, var(--brick));}
  h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:2.1rem; line-height:1.12;}
  .lede{margin:10px 0 0; font-size:1rem; line-height:1.6; color:var(--grey); max-width:62ch;}
  .others{display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 0;}
  .others a{font-size:.84rem; font-weight:700; color:var(--a-forest, var(--teal)); text-decoration:none; padding:7px 13px; border-radius:999px; background:var(--paper); box-shadow:var(--nb-shadow);}
  .others a:hover{text-decoration:underline; text-underline-offset:3px;}
  .card{background:var(--paper); border-radius:var(--r-card, 14px); box-shadow:var(--nb-shadow); padding:22px 26px; margin:18px 0 0;}
  .card h2{margin:0 0 8px; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.3rem;}
  .card p{margin:0 0 10px; font-size:.97rem; line-height:1.65;}
  .card p:last-child{margin-bottom:0;}
  ol.steps{list-style:none; counter-reset:st; margin:6px 0 0; padding:0;}
  ol.steps li{counter-increment:st; display:grid; grid-template-columns:34px 1fr; gap:4px 12px; padding:12px 0; border-top:1px solid var(--row-line);}
  ol.steps li:first-child{border-top:0;}
  ol.steps li::before{content:counter(st); grid-row:1 / span 2; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.5rem; line-height:1; color:var(--a-mustard, var(--gold));}
  ol.steps li b{font-size:.97rem;}
  ol.steps li span{font-size:.94rem; line-height:1.6; color:var(--ink-2, var(--ink));}
  .find{display:block; width:100%; margin:18px 0 0; font:inherit; font-size:1rem; padding:12px 14px; border:1.5px solid var(--sand-line); border-radius:12px; background:var(--paper);}
  .find:focus{outline:none; border-color:var(--a-forest, var(--teal));}
  dl.terms{margin:0;}
  dl.terms div{display:grid; grid-template-columns:minmax(150px, 30%) 1fr; gap:4px 18px; padding:11px 0; border-top:1px solid var(--row-line);}
  dl.terms div:first-child{border-top:0;}
  dl.terms dt{font-weight:700; font-size:.95rem;}
  dl.terms dd{margin:0; font-size:.94rem; line-height:1.6;}
  .none{color:var(--grey); font-size:.94rem; margin:0;}
  /* the glossary's families: a forest band on each card, a count, and a row of chips to jump between them */
  .famnav{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 0;}
  .famnav a{font-size:.82rem; font-weight:700; color:var(--a-forest, var(--teal)); text-decoration:none; padding:6px 12px; border-radius:999px; background:color-mix(in oklch, var(--a-forest, var(--teal)) 9%, var(--paper));}
  .famnav a:hover{background:color-mix(in oklch, var(--a-forest, var(--teal)) 16%, var(--paper));}
  .card.fam{padding:0; overflow:hidden; scroll-margin-top:16px;}
  .famhead{position:relative; background:var(--a-forest, var(--teal)); color:var(--paper); padding:16px 60px 14px 26px;}
  .famhead h2{margin:0; color:var(--paper); font-size:1.25rem;}
  .famhead p{margin:3px 0 0; font-size:.88rem; color:color-mix(in oklch, var(--paper) 78%, transparent);}
  .famn{position:absolute; top:16px; right:22px; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.4rem; color:var(--a-lemon, var(--gold-lifted));}
  .card.fam dl.terms{padding:6px 26px 12px;}
  .card.fam dl.terms div:nth-child(even){background:color-mix(in oklch, var(--a-forest, var(--teal)) 3%, var(--paper)); margin:0 -26px; padding-left:26px; padding-right:26px;}
  .card.fam dt{color:var(--a-forest, var(--teal));}
  @media (max-width:560px){ .famhead{padding:14px 52px 12px 18px;} .card.fam dl.terms{padding:4px 18px 10px;} .card.fam dl.terms div:nth-child(even){margin:0 -18px; padding-left:18px; padding-right:18px;} }
  @media (max-width:560px){ dl.terms div{grid-template-columns:1fr;} .card{padding:18px 18px;} h1{font-size:1.75rem;} }
  @media print{ body{background:#fff; padding:0;} .back,.others,.find{display:none;} .card{box-shadow:none; border:1px solid #ddd;} }
</style>
<link rel="stylesheet" href="hub-house.css?v=202610301730">
</head>
<body>
<div class="board">
  <a class="back" id="back" href="index.html">Back</a>
  <div id="app"></div>
</div>
<script src="hub-shared.js?v=202610301730"></script>
<script src="hub-store.js?v=202610301730"></script>
<script src="hub-say.js?v=202610301730"></script>
<script src="hub-sync.js?v=202610301730"></script>
<script src="readings.js?v=202610301730"></script>
<script type="text/x-hub-app">
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose — this is one of the course’s own pages.');
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const IS_TRAINEE = !!(window.HubStore && HubStore.isTrainee && HubStore.isTrainee());
if (!IS_TRAINEE) $('back').href = (window.HubStore && HubStore.isAssessor && HubStore.isAssessor()) ? '12_assessor_pack.html' : '5_tutor_dashboard.html';
const R = window.CONNECT_HUB_READINGS || {};
let CS = {}; try { CS = JSON.parse(localStorage.getItem('connect_course_settings') || '{}') || {}; } catch (e) {}
const ONLINE = String(CS.deliveryMode || '') === 'online';
/* the online room is for an online course; anyone may still open it by its address */
const DOCS = ['succeed', 'glossary'].concat(ONLINE ? ['online'] : []);
const want = new URLSearchParams(location.search).get('doc');
const key = R[want] ? want : 'succeed';
const D = R[key];
document.title = D.title;
const keep = location.search.replace(/([?&])doc=[^&]*&?/, '$1').replace(/[?&]$/, '');
const href = k => '39_reading.html' + (keep ? keep + '&' : '?') + 'doc=' + k;
const others = DOCS.filter(k => k !== key).map(k => '<a href="' + esc(href(k)) + '">' + esc(R[k].title) + '</a>').join('');
let body = '';
if (D.terms) {
  /* the terms in their families, each family a card with a forest band; a term in no family goes in the last one */
  const byName = {}; D.terms.forEach(t => { byName[t[0]] = t; });
  const used = {}; const fams = (D.families || []).map(f => ({ h: f[0], sub: f[1], terms: f[2].map(n => { used[n] = 1; return byName[n]; }).filter(Boolean) }));
  const rest = D.terms.filter(t => !used[t[0]]); if (rest.length) fams.push({ h: 'And more', sub: '', terms: rest });
  const row = t => '<div data-k="' + esc((t[0] + ' ' + t[1]).toLowerCase()) + '"><dt>' + esc(t[0]) + '</dt><dd>' + esc(t[1]) + '</dd></div>';
  body = '<input class="find" id="find" type="search" placeholder="Find a word" aria-label="Find a word in the glossary">'
    + '<nav class="famnav" aria-label="Families">' + fams.map((f, i) => '<a href="#fam' + i + '">' + esc(f.h) + '</a>').join('') + '</nav>'
    + fams.map((f, i) => '<section class="card fam" id="fam' + i + '"><header class="famhead"><h2>' + esc(f.h) + '</h2>' + (f.sub ? '<p>' + esc(f.sub) + '</p>' : '') + '<span class="famn">' + f.terms.length + '</span></header><dl class="terms">' + f.terms.map(row).join('') + '</dl></section>').join('')
    + '<p class="none card" id="none" hidden>No word matches that. Try the start of it.</p>';
} else {
  body = (D.sections || []).map(s => '<section class="card"><h2>' + esc(s.h) + '</h2>'
    + (s.p || []).map(x => '<p>' + esc(x) + '</p>').join('')
    + (s.steps ? '<ol class="steps">' + s.steps.map(st => '<li><b>' + esc(st[0]) + '</b><span>' + esc(st[1]) + '</span></li>').join('') + '</ol>' : '')
    + '</section>').join('');
}
$('app').innerHTML = '<p class="eyebrow">Something to read</p><h1>' + esc(D.title) + '</h1><p class="lede">' + esc(D.lede) + '</p>'
  + (others ? '<nav class="others" aria-label="More to read">' + others + '</nav>' : '') + body;
const f = $('find');
if (f) f.addEventListener('input', () => { const q = f.value.trim().toLowerCase(); let n = 0;
  document.querySelectorAll('.fam').forEach(sec => { let m = 0; sec.querySelectorAll('dl.terms > div').forEach(d => { const hit = !q || d.dataset.k.indexOf(q) !== -1; d.hidden = !hit; if (hit) m++; }); sec.hidden = m === 0; n += m; });
  document.querySelector('.famnav').hidden = !!q;
  $('none').hidden = n > 0; });
</script>
</body>
</html>
