<!DOCTYPE html>
<!--
  Connect Lite — the pre-course task, and its answer key (since 26 Oct 2026 the task itself: each task's reading and a
  place to write, kept in this browser only)
  © 2026 Ramy Sakr. All rights reserved.
  The centre sends a candidate Cambridge's pre-course task as a document when
  they sign up. Since 26 Oct 2026 the task is here too: each task's reading, a
  place to write (or work on paper), and its answer. What a trainee writes stays
  in their own browser; Lite never receives it (Ramy, 8 Oct 2026: "they don't
  have to be saved in Lite... they're only checking the answers"; 26 Oct: "we
  don't read the task... the pre-course task is not assessed"). A course page,
  not a public one: it opens from a course link, never to a volunteer student,
  and a trainee sees the answers from the last working day before the course
  starts, so the task gets done before the key arrives. Tutors and the assessor
  read it at any time.
-->

<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    padding:36px 20px 90px; display:flex; justify-content:center;}
  .board{max-width:820px; width:100%;}
  a{color:var(--teal);} a:hover{color:var(--ink-warm);}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .title{border-top:2px solid var(--teal); padding-top:22px;}
  .title h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.9rem; line-height:1.15;}
  .title p{margin:7px 0 0; font-size:0.9rem; color:var(--grey); line-height:1.55;}
  .tools{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .btn{font:inherit; font-size:0.82rem; font-weight:600; padding:8px 14px; border-radius:8px; border:1.5px solid var(--sand-line); background:var(--field); color:var(--ink); cursor:pointer;}
  .sec{margin-top:26px;}
  .sec h2{margin:0 0 4px; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.25rem;}
  .sec .count{font-size:0.78rem; color:var(--grey); letter-spacing:0.08em; text-transform:uppercase; margin:0 0 10px;}
  .task{background:var(--surface); border:1px solid var(--sand-line); border-radius:10px; padding:16px 20px; margin-top:12px; page-break-inside:avoid;}
  .task h3{margin:0 0 6px; font-family:'Instrument Sans','Karla',sans-serif; font-size:0.78rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--teal);}
  .task .q{margin:0; font-size:0.92rem; line-height:1.6; white-space:pre-wrap; color:var(--ink-warm);}
  .task .a{margin:10px 0 0; padding:10px 14px; border-left:3px solid var(--gold); background:var(--field); font-size:0.92rem; line-height:1.65; white-space:pre-wrap;}
  .task .a.none{color:var(--grey); font-style:italic; border-left-color:var(--sand-line);}
  .empty{background:var(--surface); border:1px dashed var(--sand-line); border-radius:10px; padding:26px 22px; margin-top:16px; color:var(--grey); font-size:0.95rem; line-height:1.6;}
  @media print{ body{background:#fff; padding:0;} .back,.tools{display:none;} .task{border-color:#ccc;} }
  /* THE TASK ITSELF (26 Oct 2026): the reading, a place to write, then the answer */
  .sec .intro{font-size:.9rem; line-height:1.6; color:var(--grey); white-space:pre-line; margin:0 0 6px;}
  .pt-read{margin:0 0 10px; padding:10px 14px; border-radius:8px; background:var(--field); font-size:.88rem; line-height:1.6; color:var(--ink);}
  .pt-read p{margin:0 0 8px; white-space:pre-line;} .pt-read p:last-child{margin-bottom:0;}
  .pt-read .pt-rt{margin:2px 0 10px; background:var(--paper);} .pt-read .pt-rt tr:first-child td{font-weight:600;}
  .pt-read summary{cursor:pointer; font-weight:700; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--teal);}
  .pt-read[open] summary{margin-bottom:6px;}
  .pt-in{display:block; width:100%; margin:8px 0 0; font:inherit; font-size:.9rem; padding:8px 10px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:var(--ink); resize:vertical;}
  .pt-l{display:block; margin:10px 0 0; font-size:.88rem; font-weight:600;}
  .pt-pick{margin:8px 0 4px; font-size:.84rem; color:var(--grey);}
  .pt-ck{display:flex; gap:8px; align-items:flex-start; font-size:.9rem; padding:3px 0;}
  .pt-rows{margin-top:8px;} .pt-row{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; padding:7px 0; border-bottom:1px solid var(--row-line, var(--sand-line)); font-size:.9rem;}
  .pt-row .pt-in{grid-column:1 / -1; margin:2px 0 0;} .pt-row .pt-in[hidden]{display:none;}
  .pt-opts{display:flex; gap:12px; flex-wrap:wrap;} .pt-opts label{display:inline-flex; gap:5px; align-items:center;}
  .pt-row:has(select){grid-template-columns:minmax(0,1fr) minmax(0,45%);} .pt-row select{width:100%; max-width:100%; min-width:0; font:inherit; font-size:.88rem; padding:6px 8px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:var(--ink);}
  .pt-table{width:100%; border-collapse:collapse; margin-top:8px; font-size:.88rem;}
  .pt-table th, .pt-table td{border:1px solid var(--sand-line); padding:6px 8px; text-align:left; vertical-align:top;}
  .pt-table th{font-size:.76rem; letter-spacing:.06em; text-transform:uppercase; color:var(--grey);}
  .pt-table input{width:100%; font:inherit; font-size:.88rem; border:0; background:transparent; padding:2px;}
  /* one section at a time, and the four parts of a task named (26 Oct 2026) */
  .secnav{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; margin:18px 0 6px;}
  .secbtn{display:flex; flex-direction:column; align-items:flex-start; gap:3px; text-align:left; font:inherit; padding:10px 12px; border-radius:10px; border:1.5px solid var(--sand-line); background:var(--paper); color:var(--ink); cursor:pointer;}
  .secbtn .sn{font-family:'Newsreader',Georgia,serif; font-size:1.1rem; font-weight:700; color:var(--grey);}
  .secbtn .st{font-size:0.78rem; font-weight:600; line-height:1.3;}
  .secbtn .sw{font-size:0.7rem; color:var(--grey);}
  .secbtn.on{border-color:var(--a-forest, var(--teal)); background:color-mix(in oklch, var(--a-forest, var(--teal)) 6%, var(--paper));}
  .secbtn.on .sn{color:var(--a-forest, var(--teal));}
  .sec-eye{margin:0; font-size:0.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--grey);}
  .task h3 .tn{display:none;}
  .pt-lab{display:block; margin:0 0 2px; font-size:0.7rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--a-forest, var(--teal));}
  .pt-lab.key{color:var(--a-red, var(--brick));}   /* the key in the checking pen, oxblood: Lite's gold is forest, like Your answer */
  .pt-key .a{border-left-color:var(--a-red, var(--brick));}
  .pt-yours{margin:14px 0 0; padding:2px 0 2px 12px; border-left:3px solid var(--a-forest, var(--teal));}
  .pt-key{margin:16px 0 0;}
  .pt-key .a, .pt-key .a-wait{margin-top:4px;}
  .secfoot{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:22px 0 0;}
  .secfoot .done-note{font-size:0.86rem; color:var(--grey); align-self:center;}
  /* on a phone the strip is five numbers in a row; the open section's name is the heading under it */
  @media (max-width:700px){ .secbtn{align-items:center; padding:8px 4px;} .secbtn .st, .secbtn .sw{display:none;} .secbtn .sn{font-size:1.2rem;} }
  @media print{ .secnav, .secfoot{display:none !important;} .sec[hidden]{display:block !important;} .sec-eye{display:none;} }
  /* the self-test at the end */
  .st-box{border-top:3px solid var(--gold);}
  .st-q{margin:12px 0 0; padding:10px 12px; border-radius:8px; background:var(--field);}
  .st-q.right{background:color-mix(in oklch, var(--a-forest, var(--teal)) 8%, var(--field));} .st-q.wrong{background:color-mix(in oklch, var(--a-red, var(--brick)) 8%, var(--field));}
  .st-t{margin:0 0 6px; font-weight:600; font-size:.92rem;}
  .st-opts{display:flex; flex-direction:column; gap:4px; font-size:.9rem;} .st-opts label{display:flex; gap:7px; align-items:baseline; cursor:pointer;}
  .st-k{margin:6px 0 0; font-size:.84rem; color:var(--grey);} .st-k b{color:var(--ink);}
  @media print{ .st-box{display:none;} }
  .a-wait{margin:10px 0 0; padding:10px 14px; border-left:3px solid var(--sand-line); background:var(--field); font-size:.88rem; color:var(--grey);}
  @media (max-width:560px){ .pt-row, .pt-row:has(select){grid-template-columns:minmax(0,1fr);} .pt-table{display:block; overflow-x:auto;} }
  @media print{ .pt-read{background:none;} .pt-in, .pt-table input, .pt-row select{border:1px solid #999; background:none;} .a-wait{display:none;} }

  /* ---- v2 (7 Oct 2026): try it first -------------------------------------------
     For the trainee, each answer starts covered, with "Show the answer" to
     lift it, so the key can be used the way it is meant: try, then check. A
     count says how many have been checked, and "Show all" lifts the lot. Tutors
     and assessors see every answer as before. A trainee's print leaves out the
     answers still covered, so the task prints as a task. Nothing is stored. Design: Magic Touches, 14b. */
  .pk .task .a{transition:filter .25s ease, opacity .25s ease;}
  .pk .task.pk-cov .a{filter:blur(6px); opacity:.55; user-select:none; pointer-events:none;}
  .pk .task.pk-cov .a.none{filter:none; opacity:1; pointer-events:auto;}
  .pk-show{font:inherit; font-size:0.8rem; font-weight:600; color:var(--teal); background:var(--paper); border:1.5px solid var(--sand-line); border-radius:999px; padding:5px 12px; cursor:pointer; margin-top:10px;
    transition:border-color .15s, transform .15s;}
  .pk-show:hover{border-color:var(--teal); transform:translateY(-1px);}
  .pk-show:focus-visible, .pk-all:focus-visible{outline:2px solid var(--gold-lifted); outline-offset:2px;}
  .pk .task.pk-seen h3::after{content:'\2713'; margin-left:8px; color:var(--teal);}
  .pk-count{font-size:0.82rem; color:var(--grey);}
  .pk-count b{color:var(--ink); font-variant-numeric:tabular-nums;}
  .pk-bar{display:inline-block; width:90px; height:5px; margin-left:8px; vertical-align:2px; border-radius:3px; background:oklch(91% 0.012 82); overflow:hidden;}
  .pk-bar i{display:block; height:100%; background:var(--teal); border-radius:3px; transition:width .35s cubic-bezier(.2,.7,.2,1);}
  @media(prefers-reduced-motion:reduce){ .pk .task .a, .pk-show, .pk-bar i{transition:none;} }
  @media print{ .pk .task.pk-cov .a{display:none;} .pk-show, .pk-count{display:none;} .pk .task.pk-seen h3::after{content:none;} }
</style>

<script type="text/x-hub-app">
/* A volunteer student is not on the course and has no pre-course task. */
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose — this is one of the course’s own pages.');
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const IS_TRAINEE = !!(window.HubStore && HubStore.isTrainee && HubStore.isTrainee());
function settings(){ try { return JSON.parse(localStorage.getItem('connect_course_settings') || 'null') || {}; } catch(e){ return {}; } }
/* Two days before the start, date-only, the way every reading of a course
   date is done here (hubToday honours a demo's pinned day). */
function opensOn(start){ if (window.hubPreOpens) return hubPreOpens(start); const m = String(start || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return ''; const d = new Date(Date.UTC(+m[1], +m[2]-1, +m[3])); d.setUTCDate(d.getUTCDate() - 2); return d.toISOString().slice(0, 10); }
function longDate(iso){ const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return iso; return new Date(Date.UTC(+m[1], +m[2]-1, +m[3])).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', timeZone:'UTC' }); }
if (!IS_TRAINEE) $('back').href = (window.HubStore && HubStore.isAssessor && HubStore.isAssessor()) ? '12_assessor_pack.html' : '5_tutor_dashboard.html';

/* THE PRE-COURSE TASK ITSELF (Ramy, 26 Oct 2026: "build the pre-course task"). Each task's reading, a place to write,
   and the answer under it. What a trainee writes is kept in this browser only, under their own link, and is never
   sent: Lite holds no pre-course answers (8 Oct 2026). The answers open on the last working day before the course
   (hubPreOpens: Friday for a Monday start), so the task is tried first; tutors and the assessor see them any time. */
const TASK = window.CONNECT_HUB_PRECOURSE_TASK || { sections: [], items: {} };
const ANS_KEY = 'lite:pre:' + ((window.HubStore && HubStore.token && HubStore.token()) || 'staff');
let ANS = {}; try { ANS = JSON.parse(localStorage.getItem(ANS_KEY) || '{}') || {}; } catch (e) {}
const saveAns = () => { try { localStorage.setItem(ANS_KEY, JSON.stringify(ANS)); } catch (e) {} };
function inputs(n, shape){
  const k = (shape && shape.kind) || 'open', val = id => esc(ANS[id] || '');
  if (k === 'parts') return (shape.parts || []).map((q, i) => `<label class="pt-l">${esc(q)}</label><textarea class="pt-in" data-a="${n}.${i}" rows="2">${val(n + '.' + i)}</textarea>`).join('');
  if (k === 'checklist') return `<p class="pt-pick">Choose ${esc(shape.pick || '')}.</p>` + (shape.options || []).map((o, i) => `<label class="pt-ck"><input type="checkbox" data-a="${n}.${i}"${ANS[n + '.' + i] ? ' checked' : ''}> <span>${esc(o)}</span></label>`).join('');
  if (k === 'rows_choice' || k === 'rows_choice_text') return '<div class="pt-rows">' + (shape.rows || []).map((r, i) => `<div class="pt-row"><span>${esc(r)}</span><span class="pt-opts">${(shape.options || []).map(o => `<label><input type="radio" name="r${n}-${i}" data-a="${n}.${i}" value="${esc(o)}"${ANS[n + '.' + i] === o ? ' checked' : ''}> ${esc(o)}</label>`).join('')}</span>${k === 'rows_choice_text' ? `<input type="text" class="pt-in" data-a="${n}.${i}.t" data-when="${esc(shape.text_when || '')}"${shape.text_when && ANS[n + '.' + i] !== shape.text_when && !ANS[n + '.' + i + '.t'] ? ' hidden' : ''} value="${val(n + '.' + i + '.t')}" placeholder="${esc(shape.text_label || 'Write the correct version…')}">` : ''}</div>`).join('') + '</div>';
  if (k === 'rows_select') return '<div class="pt-rows">' + (shape.rows || []).map((r, i) => `<div class="pt-row"><span>${esc(r)}</span><select data-a="${n}.${i}"><option value="">Choose…</option>${(shape.options || []).map(o => `<option${ANS[n + '.' + i] === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`).join('') + '</div>';
  if (k === 'rows_text') return `<table class="pt-table"><tr><th></th>${(shape.cols || []).map(c => `<th>${esc(c)}</th>`).join('')}</tr>` + (shape.rows || []).map((r, i) => `<tr><td>${esc(r)}</td>${(shape.cols || []).map((c, j) => `<td><input type="text" data-a="${n}.${i}.${j}" value="${val(n + '.' + i + '.' + j)}" aria-label="${esc(r + ': ' + c)}"></td>`).join('')}</tr>`).join('') + '</table>';
  return `<textarea class="pt-in" data-a="${n}" rows="3">${val(String(n))}</textarea>`;
}
/* The question as Cambridge words it often lists the very sentences, words or choices the rows below already show,
   hard-wrapped from the PDF. Say it once: lines the rows, choices or parts already carry are dropped, the broken lines
   rejoined, and a column heading left alone on its line goes. A shape's own "ask" stands instead where that is not enough. */
const normQ = x => String(x || '').toLowerCase().replace(/[’']/g, '').replace(/^\s*(\d+|[a-z])[.)]\s*/, '').replace(/[^a-z0-9]+/g, ' ').trim();
function ask(prompt, shape){
  if (shape && shape.ask != null) return shape.ask;
  const k = (shape && shape.kind) || 'open';
  const shown = [].concat((shape && shape.rows) || [], (shape && shape.options) || [], (shape && shape.parts) || []).map(normQ).filter(Boolean);
  const same = n => shown.some(r => { if (r === n) return true; if (n.length <= 8) return false;
    const w = n.split(' '), rw = new Set(r.split(' ')), hit = w.filter(x => rw.has(x)).length;
    return w.length >= 3 && hit / w.length >= 0.75 && r.split(' ').length >= 0.6 * w.length; });
  const drop = P => P.split('\n').filter(l => { const n = normQ(l); if (!n) return true; if (same(n)) return false;
    return !(/^rows_/.test(k) && n.split(' ').length <= 4 && !/[.?!:]\s*$/.test(l)); }).join('\n');
  let P = String(prompt || '');
  if (k !== 'open' && k !== 'checklist') P = drop(P);
  P = P.replace(/•\s*\n/g, '• ').replace(/^(\s*(?:\d+|[a-z])\.)\s*\n/gm, '$1 ').replace(/([^.?!:\n])\n\n?(?=[a-z(])/g, '$1 ');
  if (k !== 'open' && k !== 'checklist') P = drop(P);
  return P.replace(/\n{3,}/g, '\n\n').trim();
}
/* a reading: paragraphs as they are; lines starting with | are a small table (tasks 14 and 15) */
function reading(t){
  return String(t || '').replace(/ {2,}/g, ' ').split(/\n{2,}/).map(b => {
    const L = b.split('\n');
    if (L.every(l => /^\|/.test(l.trim()))) return '<table class="pt-table pt-rt">' + L.map(l => '<tr>' + l.trim().replace(/^\|/, '').split('|').map(c => '<td>' + esc(c.trim()) + '</td>').join('') + '</tr>').join('') + '</table>';
    return '<p>' + esc(b) + '</p>'; }).join('');
}
function render(){
  const cs = settings();
  const KEY = window.CONNECT_HUB_PRECOURSE_KEY || [];
  const n = KEY.reduce((a, s) => a + s.items.length, 0);
  const opens = opensOn(cs.start), today = (window.hubToday && hubToday()) || new Date().toISOString().slice(0, 10);
  const waiting = IS_TRAINEE && opens && today < opens;
  const head = `<div class="title"><h1>Pre-course task</h1>
    <p>${esc(cs.centreName || 'Your centre')}${cs.courseName ? ' &middot; ' + esc(cs.courseName) : ''} &mdash; Cambridge’s pre-course task: ${n} tasks in ${KEY.length} sections, about four hours. Write your answers here or on paper. What you write stays in this browser and is never sent anywhere.</p>
    ${waiting ? `<p><b>The answers open on ${esc(longDate(opens))}</b>, the last working day before the course starts${cs.start ? ' on ' + esc(longDate(cs.start)) : ''}. Try the tasks first; the answers are more use once you have.</p>` : ''}</div>`;
  /* ONE SECTION AT A TIME (Ramy, 26 Oct 2026: "it's just like a one very long sheet"). A strip names the five sections
     and how far they have got in each; Back and Next walk them. Inside a task, four parts in one order, each labeled:
     Read first, the question, Your answer (a forest rule), The answer (Cambridge's, a gold rule). Print still has it all. */
  if (SEC >= KEY.length) SEC = 0;
  const strip = `<nav class="secnav" aria-label="Sections">${KEY.map((s, si) => { const w = s.items.filter(t => started(t.n)).length;
      return `<button type="button" class="secbtn${si === SEC ? ' on' : ''}" data-sec="${si}"${si === SEC ? ' aria-current="true"' : ''}><span class="sn">${si + 1}</span><span class="st">${esc(s.title)}</span><span class="sw" data-sw="${si}">${w ? w + ' of ' + s.items.length + ' started' : s.items.length + ' tasks'}</span></button>`; }).join('')}</nav>`;
  const body = KEY.map((s, si) => { const meta = (TASK.sections || [])[si] || {};
    return `<div class="sec" data-secbox="${si}"${si === SEC ? '' : ' hidden'}><p class="sec-eye">Section ${si + 1} of ${KEY.length}</p><h2>${esc(s.title)}</h2><p class="count">${s.items.length} task${s.items.length === 1 ? '' : 's'}</p>${meta.intro ? `<details class="pt-read"><summary>About this section</summary>${reading(meta.intro)}</details>` : ''}
    ${s.items.map(t => { const it = (TASK.items || {})[t.n] || {};
      const ans = waiting ? `<div class="a-wait">The answer opens on ${esc(longDate(opens))}.</div>`
        : t.answer ? `<div class="a">${esc(t.answer)}</div>` : '<div class="a none">Your own answer. The booklet gives no key for this one.</div>';
      return `<div class="task" id="task-${t.n}"><h3><span class="tn">${t.n}</span>Task ${t.n}</h3>${it.lead ? `<details class="pt-read" open><summary>Read first</summary>${reading(it.lead)}</details>` : ''}${(q => q ? `<p class="q">${esc(q)}</p>` : '')(ask(t.prompt, it.shape))}
        <div class="pt-yours"><span class="pt-lab">Your answer</span>${inputs(t.n, it.shape)}</div>
        <div class="pt-key"><span class="pt-lab key">The answer</span>${ans}</div></div>`; }).join('')}
    ${si === KEY.length - 1 ? selfTest() : ''}
    <div class="secfoot">${si > 0 ? `<button type="button" class="btn" data-sec="${si - 1}">Back: ${esc(KEY[si - 1].title)}</button>` : '<span></span>'}${si < KEY.length - 1 ? `<button type="button" class="btn next" data-sec="${si + 1}">Next: ${esc(KEY[si + 1].title)}</button>` : '<span class="done-note">That is the whole task.</span>'}</div></div>`; }).join('');
  $('app').innerHTML = head + `<div class="tools"><button class="btn" type="button" onclick="window.print()">Print / Save as PDF</button></div>` + strip + body;
}
/* A SELF-TEST TO FINISH (Ramy, 26 Oct 2026: "an opportunity to see who actually did it"; then its own thing, before day
   one, not a round of the intro session). Six questions drawn from the task, answered alone; the score is shown once and
   kept nowhere. Each answer is the booklet's own. */
const SELF = [
  { q: 'Which tense is “I have been feeling unwell for a while”?', o: ['Present perfect', 'Present perfect progressive', 'Past progressive'], r: 1, k: 'Task 16' },
  { q: 'Which tense is “It happened as I was driving home”?', o: ['Simple past, then past progressive', 'Past perfect, then simple past', 'Present simple, then past progressive'], r: 0, k: 'Task 16' },
  { q: 'What does the modal mean in “This letter must be from Frank – he’s the only one who hasn’t written so far”?', o: ['Advice', 'Permission', 'Logical deduction'], r: 2, k: 'Task 12' },
  { q: 'Which of these is correct?', o: ['I’ve been to the movies last night.', 'People with 12 items or fewer can queue here.', 'He often come late.'], r: 1, k: 'Task 7' },
  { q: 'Which word means “an individual sound”?', o: ['Phoneme', 'Stress', 'Intonation'], r: 0, k: 'Task 24' },
  { q: 'You comment on the weather to a stranger at a bus stop. That conversation is…', o: ['Transactional', 'Interactional'], r: 1, k: 'Task 38' }
];
function selfTest(){
  return `<div class="task st-box" id="selftest"><h3>Before day one: a quick self-test</h3><p class="q">Six questions from the task, answered without looking back. The score is yours alone: it is shown once and saved nowhere.</p>
    ${SELF.map((x, i) => `<div class="st-q" data-r="${x.r}"><p class="st-t">${i + 1}. ${esc(x.q)}</p><div class="st-opts">${x.o.map((o, j) => `<label><input type="radio" name="st${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div><p class="st-k" hidden>${esc(x.k)}: the answer is <b>${esc(x.o[x.r])}</b>.</p></div>`).join('')}
    <div class="tools" style="margin-top:12px"><button type="button" class="btn" id="stCheck">Check my answers</button><span class="pk-count" id="stScore" aria-live="polite"></span></div></div>`;
}
document.addEventListener('click', e => { if (!e.target.closest || !e.target.closest('#stCheck')) return;
  let n = 0, done = 0; document.querySelectorAll('.st-q').forEach(q => { const pick = q.querySelector('input:checked'); const k = q.querySelector('.st-k'); k.hidden = false; q.classList.remove('right', 'wrong'); if (!pick) return; done++; const ok = +pick.value === +q.dataset.r; if (ok) n++; q.classList.add(ok ? 'right' : 'wrong'); });
  const s = document.getElementById('stScore'); if (s) s.innerHTML = done < SELF.length ? '<b>' + n + '</b> right so far; ' + (SELF.length - done) + ' not answered.' : '<b>' + n + '</b> of ' + SELF.length + ' right' + (n === SELF.length ? '. You did the task.' : n >= 4 ? '. Nearly there: look again at the ones marked.' : '. Worth another look at the task before day one.'); });
/* which section is open: the address keeps it, so Back from a reading returns to the same place */
let SEC = (function(){ const m = String(location.hash || '').match(/^#s(\d+)$/); return m ? +m[1] - 1 : 0; })();
function started(n){ return Object.keys(ANS).some(k => (k === String(n) || k.indexOf(n + '.') === 0) && ANS[k] !== '' && ANS[k] !== false && ANS[k] != null); }
function showSec(i){
  SEC = i;
  document.querySelectorAll('[data-secbox]').forEach(b => { b.hidden = +b.dataset.secbox !== i; });
  document.querySelectorAll('.secbtn').forEach(b => { const on = +b.dataset.sec === i; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
  try { history.replaceState(null, '', '#s' + (i + 1)); } catch (e) {}
  const nav = document.querySelector('.secnav'); if (nav) window.scrollTo({ top: nav.getBoundingClientRect().top + window.scrollY - 12, behavior: 'smooth' });
}
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-sec]'); if (!b) return; showSec(+b.dataset.sec); });
/* the strip's counts follow what is written */
function paintCounts(){ const KEY = window.CONNECT_HUB_PRECOURSE_KEY || [];
  document.querySelectorAll('[data-sw]').forEach(el => { const s = KEY[+el.dataset.sw]; if (!s) return; const w = s.items.filter(t => started(t.n)).length; el.textContent = w ? w + ' of ' + s.items.length + ' started' : s.items.length + ' tasks'; }); }
document.addEventListener('input', () => { clearTimeout(paintCounts._t); paintCounts._t = setTimeout(paintCounts, 400); });
/* what is written is kept as it is written, in this browser only */
document.addEventListener('input', e => { const el = e.target.closest && e.target.closest('[data-a]'); if (!el) return; ANS[el.dataset.a] = el.type === 'checkbox' ? el.checked : el.value; saveAns(); });
document.addEventListener('change', e => { const el = e.target.closest && e.target.closest('[data-a]'); if (!el) return; ANS[el.dataset.a] = el.type === 'checkbox' ? el.checked : el.value; saveAns();
  /* "Write the correct version" opens only for a sentence marked Not (task 7) */
  const t = el.type === 'radio' && el.closest('.pt-row') && el.closest('.pt-row').querySelector('[data-when]');
  if (t && t.dataset.when) { t.hidden = el.value !== t.dataset.when && !t.value; if (!t.hidden && el.value === t.dataset.when) t.focus(); } });
render();
document.addEventListener('hub:ready', render);

/* ---- v2 (7 Oct 2026): try it first ----------------------------------------------
   Trainee view only. Layered on render() through a MutationObserver on #app;
   which answers are lifted lives in memory for this visit. Stores nothing. */
(function(){
  const app = $('app'); if (!app || !IS_TRAINEE) return;
  app.classList.add('pk');
  const seen = new Set(); let all = false;
  function apply(){
    const tasks = [...app.querySelectorAll('.task')]; if (!tasks.length) return;
    /* a task whose answer is not open yet (.a-wait) or has no key (.a.none) has nothing to cover */
    const hasKey = t => !!t.querySelector('.a:not(.none)');
    const keyed = tasks.filter(hasKey);
    tasks.forEach(t => {
      const none = !hasKey(t), open = all || none || seen.has(t.id);
      t.classList.toggle('pk-cov', !open); t.classList.toggle('pk-seen', !none && seen.has(t.id));
      let b = t.querySelector('.pk-show');
      if (!open && !b) { t.insertAdjacentHTML('beforeend', '<button type="button" class="pk-show" data-pk="' + t.id + '">Show the answer</button>'); }
      if (open && b) b.remove();
    });
    const tools = app.querySelector('.tools');
    if (tools && !keyed.length) tools.querySelectorAll('.pk-all, .pk-count').forEach(x => x.remove());
    if (tools && keyed.length) {
      let c = tools.querySelector('.pk-count'), btn = tools.querySelector('.pk-all');
      if (!btn) { tools.insertAdjacentHTML('afterbegin', '<button type="button" class="btn pk-all"></button>'); btn = tools.querySelector('.pk-all'); }
      btn.textContent = all ? 'Cover them again' : 'Show all the answers';
      if (!c) { tools.insertAdjacentHTML('beforeend', '<span class="pk-count" aria-live="polite"></span>'); c = tools.querySelector('.pk-count'); }
      const n = keyed.filter(t => seen.has(t.id)).length;
      c.innerHTML = '<b>' + n + '</b> of ' + keyed.length + ' checked<span class="pk-bar"><i style="width:' + (keyed.length ? Math.round(100 * n / keyed.length) : 0) + '%"></i></span>';
    }
  }
  app.addEventListener('click', e => {
    const s = e.target.closest('.pk-show'); if (s) { seen.add(s.dataset.pk); apply(); return; }
    if (e.target.closest('.pk-all')) { all = !all; if (all) app.querySelectorAll('.task').forEach(t => { if (t.querySelector('.a:not(.none)')) seen.add(t.id); }); else seen.clear(); apply(); }
  });
  new MutationObserver(m => { if (m.some(r => [...r.addedNodes].some(n => n.nodeType === 1 && !/^pk-/.test(String(n.className || ''))))) apply(); }).observe(app, { childList: true });
  apply();
})();
</script>
