<!DOCTYPE html>
<!--
  Connect Lite — the pre-course task's answer key
  © 2026 Ramy Sakr. All rights reserved.
  The centre sends a candidate Cambridge's pre-course task as a document when
  they sign up, and the candidate works through it on paper. This page is the
  key: each task's question with its answer, to check their own work against.
  Nothing of theirs is saved (Ramy, 8 Oct 2026: "they don't have to be saved
  in Lite... they're only checking the answers"). A course page, not a public
  one: it opens from a course link, never to a volunteer student, and a
  trainee sees the answers from two days before the course starts -- Connect's
  rule, so the task gets done before the key arrives. Tutors and the assessor
  read it at any time.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Pre-course task: the answer key</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202610100033">
<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    padding:36px 20px 90px; display:flex; justify-content:center;}
  .board{max-width:820px; width:100%;}
  a{color:var(--teal);} a:hover{color:var(--ink-warm);}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .title{border-top:2px solid var(--teal); padding-top:22px;}
  .title h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.9rem; line-height:1.15;}
  .title p{margin:7px 0 0; font-size:0.9rem; color:var(--grey); line-height:1.55;}
  .tools{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .btn{font:inherit; font-size:0.82rem; font-weight:600; padding:8px 14px; border-radius:8px; border:1.5px solid var(--sand-line); background:var(--field); color:var(--ink); cursor:pointer;}
  .sec{margin-top:26px;}
  .sec h2{margin:0 0 4px; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.25rem;}
  .sec .count{font-size:0.78rem; color:var(--grey); letter-spacing:0.08em; text-transform:uppercase; margin:0 0 10px;}
  .task{background:var(--surface); border:1px solid var(--sand-line); border-radius:10px; padding:16px 20px; margin-top:12px; page-break-inside:avoid;}
  .task h3{margin:0 0 6px; font-family:'Instrument Sans','Karla',sans-serif; font-size:0.78rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--teal);}
  .task .q{margin:0; font-size:0.92rem; line-height:1.6; white-space:pre-wrap; color:var(--ink-warm);}
  .task .a{margin:10px 0 0; padding:10px 14px; border-left:3px solid var(--gold); background:var(--field); font-size:0.92rem; line-height:1.65; white-space:pre-wrap;}
  .task .a.none{color:var(--grey); font-style:italic; border-left-color:var(--sand-line);}
  .empty{background:var(--surface); border:1px dashed var(--sand-line); border-radius:10px; padding:26px 22px; margin-top:16px; color:var(--grey); font-size:0.95rem; line-height:1.6;}
  @media print{ body{background:#fff; padding:0;} .back,.tools{display:none;} .task{border-color:#ccc;} }

  /* ---- v2 (7 Oct 2026): try it first -------------------------------------------
     For the trainee, each answer starts covered, with "Show the answer" to
     lift it, so the key can be used the way it is meant: try, then check. A
     count says how many have been checked, and "Show all" lifts the lot. Tutors
     and assessors see every answer as before; print always shows every
     answer. Nothing is stored. Design: Magic Touches, 14b. */
  .pk .task .a{transition:filter .25s ease, opacity .25s ease;}
  .pk .task.pk-cov .a{filter:blur(6px); opacity:.55; user-select:none; pointer-events:none;}
  .pk .task.pk-cov .a.none{filter:none; opacity:1; pointer-events:auto;}
  .pk-show{font:inherit; font-size:0.8rem; font-weight:600; color:var(--teal); background:var(--paper); border:1.5px solid var(--sand-line); border-radius:999px; padding:5px 12px; cursor:pointer; margin-top:10px;
    transition:border-color .15s, transform .15s;}
  .pk-show:hover{border-color:var(--teal); transform:translateY(-1px);}
  .pk-show:focus-visible, .pk-all:focus-visible{outline:2px solid var(--gold-lifted); outline-offset:2px;}
  .pk .task.pk-seen h3::after{content:'\2713'; margin-left:8px; color:var(--teal);}
  .pk-count{font-size:0.82rem; color:var(--grey);}
  .pk-count b{color:var(--ink); font-variant-numeric:tabular-nums;}
  .pk-bar{display:inline-block; width:90px; height:5px; margin-left:8px; vertical-align:2px; border-radius:3px; background:oklch(91% 0.012 82); overflow:hidden;}
  .pk-bar i{display:block; height:100%; background:var(--teal); border-radius:3px; transition:width .35s cubic-bezier(.2,.7,.2,1);}
  @media(prefers-reduced-motion:reduce){ .pk .task .a, .pk-show, .pk-bar i{transition:none;} }
  @media print{ .pk .task.pk-cov .a{filter:none; opacity:1;} .pk-show, .pk-count{display:none;} .pk .task.pk-seen h3::after{content:none;} }
</style>
</head>
<body>
<div class="board">
  <a class="back" id="back" href="index.html">&#8592; Back</a>
  <div id="app"></div>
</div>
<script src="hub-shared.js?v=202610100033"></script>
<script src="hub-store.js?v=202610100033"></script>
<script src="hub-say.js?v=202610100033"></script>
<script src="hub-sync.js?v=202610100033"></script>
<script src="precourse-key.js?v=202610100033"></script>
<script type="text/x-hub-app">
/* A volunteer student is not on the course and has no pre-course task. */
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose — this is one of the course’s own pages.');
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const IS_TRAINEE = !!(window.HubStore && HubStore.isTrainee && HubStore.isTrainee());
function settings(){ try { return JSON.parse(localStorage.getItem('connect_course_settings') || 'null') || {}; } catch(e){ return {}; } }
/* Two days before the start, date-only, the way every reading of a course
   date is done here (hubToday honours a demo's pinned day). */
function opensOn(start){ const m = String(start || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return ''; const d = new Date(Date.UTC(+m[1], +m[2]-1, +m[3])); d.setUTCDate(d.getUTCDate() - 2); return d.toISOString().slice(0, 10); }
function longDate(iso){ const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return iso; return new Date(Date.UTC(+m[1], +m[2]-1, +m[3])).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric', timeZone:'UTC' }); }
if (!IS_TRAINEE) $('back').href = (window.HubStore && HubStore.isAssessor && HubStore.isAssessor()) ? '12_assessor_pack.html' : '5_tutor_dashboard.html';

function render(){
  const cs = settings();
  const KEY = window.CONNECT_HUB_PRECOURSE_KEY || [];
  const n = KEY.reduce((a, s) => a + s.items.length, 0);
  const head = `<div class="title"><h1>Pre-course task: the answer key</h1>
    <p>${esc(cs.centreName || 'Your centre')}${cs.courseName ? ' &middot; ' + esc(cs.courseName) : ''} &mdash; ${n} tasks in ${KEY.length} sections. Check your own answers against it; nothing you write is kept here. The task itself is the document your centre sent you.</p></div>`;
  const opens = opensOn(cs.start), today = (window.hubToday && hubToday()) || new Date().toISOString().slice(0, 10);
  if (IS_TRAINEE && opens && today < opens) {
    $('app').innerHTML = head + `<div class="empty"><b>The key opens on ${esc(longDate(opens))}</b>, two days before the course starts${cs.start ? ' on ' + esc(longDate(cs.start)) : ''}. Finish the task before then; the answers are more use once you have tried.</div>`;
    return;
  }
  const body = KEY.map(s => `<div class="sec"><h2>${esc(s.title)}</h2><p class="count">${s.items.length} task${s.items.length === 1 ? '' : 's'}</p>
    ${s.items.map(t => `<div class="task" id="task-${t.n}"><h3>Task ${t.n}</h3><p class="q">${esc(t.prompt)}</p>
      ${t.answer ? `<div class="a">${esc(t.answer)}</div>` : '<div class="a none">Your own answer. The booklet gives no key for this one.</div>'}</div>`).join('')}</div>`).join('');
  $('app').innerHTML = head + `<div class="tools"><button class="btn" type="button" onclick="window.print()">Print / Save as PDF</button></div>` + body;
}
render();
document.addEventListener('hub:ready', render);

/* ---- v2 (7 Oct 2026): try it first ----------------------------------------------
   Trainee view only. Layered on render() through a MutationObserver on #app;
   which answers are lifted lives in memory for this visit. Stores nothing. */
(function(){
  const app = $('app'); if (!app || !IS_TRAINEE) return;
  app.classList.add('pk');
  const seen = new Set(); let all = false;
  function apply(){
    const tasks = [...app.querySelectorAll('.task')]; if (!tasks.length) return;
    const keyed = tasks.filter(t => !t.querySelector('.a.none'));
    tasks.forEach(t => {
      const none = !!t.querySelector('.a.none'), open = all || none || seen.has(t.id);
      t.classList.toggle('pk-cov', !open); t.classList.toggle('pk-seen', !none && seen.has(t.id));
      let b = t.querySelector('.pk-show');
      if (!open && !b) { t.insertAdjacentHTML('beforeend', '<button type="button" class="pk-show" data-pk="' + t.id + '">Show the answer</button>'); }
      if (open && b) b.remove();
    });
    const tools = app.querySelector('.tools');
    if (tools) {
      let c = tools.querySelector('.pk-count'), btn = tools.querySelector('.pk-all');
      if (!btn) { tools.insertAdjacentHTML('afterbegin', '<button type="button" class="btn pk-all"></button>'); btn = tools.querySelector('.pk-all'); }
      btn.textContent = all ? 'Cover them again' : 'Show all the answers';
      if (!c) { tools.insertAdjacentHTML('beforeend', '<span class="pk-count" aria-live="polite"></span>'); c = tools.querySelector('.pk-count'); }
      const n = keyed.filter(t => seen.has(t.id)).length;
      c.innerHTML = '<b>' + n + '</b> of ' + keyed.length + ' checked<span class="pk-bar"><i style="width:' + (keyed.length ? Math.round(100 * n / keyed.length) : 0) + '%"></i></span>';
    }
  }
  app.addEventListener('click', e => {
    const s = e.target.closest('.pk-show'); if (s) { seen.add(s.dataset.pk); apply(); return; }
    if (e.target.closest('.pk-all')) { all = !all; if (all) app.querySelectorAll('.task').forEach(t => { if (!t.querySelector('.a.none')) seen.add(t.id); }); else seen.clear(); apply(); }
  });
  new MutationObserver(m => { if (m.some(r => [...r.addedNodes].some(n => n.nodeType === 1 && !/^pk-/.test(String(n.className || ''))))) apply(); }).observe(app, { childList: true });
  apply();
})();
</script>
</body>
</html>
