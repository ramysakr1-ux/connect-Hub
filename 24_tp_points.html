<!DOCTYPE html>
<!--
  Connect Lite — teaching practice points
  © 2026 Ramy Sakr. All rights reserved.

  Handbook 9.1.2, a MUST twice over: "Centres must ensure that all candidates
  have practice in a range of lessons covering all aspects of language
  teaching and must include language-focus lessons. The type of lesson must be
  recorded in the CELTA 5."

  A centre satisfies that by rotating the lesson types round the group instead
  of letting them fall where they may. Ramy, 29 Sep 2026: "TP points that
  rotate automatically, depending on aims and different order for the
  teachers." The rotation lives in hub-rotation.js and is explained there; in
  short, each trainee starts at their own place in the seven types and steps
  one along each practice, so nobody in a teaching set teaches the same type on
  the same day, each trainee's six practices are six different types, and
  every one of them includes language focus by construction rather than by
  luck.

  It is a PROPOSAL. Every cell is the tutor's to change, which is the standing
  rule that anything the system decides can be overridden — and because an
  override can break what the rotation guaranteed, the language-focus check
  runs against what is actually on the page, not against what was generated.

  Released per group, the same way the planning grid is: the trainees see
  their own group's points and nothing before release.
-->

<style>
  body{background:var(--sand); color:var(--ink); font-family:'Karla',sans-serif; margin:0;}

  details.letters label{display:flex; align-items:center; gap:6px;}
  details.letters select{font-family:inherit; font-size:0.8rem; padding:2px 4px; border:1px solid var(--sand-line); border-radius:5px; background:var(--paper); color:var(--ink);}

  .status{font-size:0.8rem; color:var(--grey);}
  .tbl{width:100%; border-collapse:collapse; font-size:0.8rem; background:var(--paper); border:1px solid var(--sand-line); border-radius:8px; overflow:hidden;}

  .tbl th{background:var(--box); font-size:0.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--grey);}

  .tbl select{font-family:inherit; font-size:0.76rem; width:100%; padding:3px 4px; border:1px solid var(--sand-line); border-radius:5px; background:var(--paper); color:var(--ink);}

  .dayline b{color:var(--ink); letter-spacing:.04em;}

  .mats .mkrow .chk{display:flex; gap:8px; align-items:center; text-transform:none; letter-spacing:0; font-size:0.82rem; font-weight:600; color:var(--ink); padding-top:4px;}

  .aimrow{display:grid; grid-template-columns:96px 1fr; gap:10px; align-items:baseline; margin:0 0 4px;}

  /* Download and Copy link beside every track and the day's PDF (Ramy, 11 Oct

     submission. The copy button reads "Copied" for a moment. */

  /* Ramy, 11 Oct 2026, seeing the first cut on a phone: "I think they should be the

  .audlinks{display:inline-flex; flex-wrap:wrap; gap:6px 6px; align-items:center; margin:6px 0 0;}

  .pdflinks{margin-left:10px;}
  .aud .audalt:hover{color:var(--teal); text-decoration:underline;}
  .aud audio{width:100%; max-width:430px; display:block;}
  /* The one filled pill in the audio block: the page's own teal, the same as

     track is fetched it drops to the outlined style, so filled teal means
     "ready to play" and nothing else (Ramy, 11 Oct 2026: "teal, do it"). */
  .audplay{font:inherit; font-size:0.8rem; font-weight:700; padding:8px 14px; border-radius:999px; border:1px solid var(--teal); background:var(--teal); color:#fff; cursor:pointer;}

  .audwrap .auderr{display:block; margin-top:4px; font-size:0.8rem; color:var(--brick);}

  .setbar.on{border-left:4px solid var(--gold);}
  .setbar b{font-family:'Newsreader',Georgia,serif; font-size:1.02rem;}
  .setchip{display:inline-flex; flex-direction:column; gap:1px; padding:5px 11px; margin:0 8px 0 0;

  .setbar .status{flex:1 1 220px;}
  .setbar .btn.sm, .setbar .btn{font-size:0.74rem; padding:5px 11px;}
  /* The procedure on a trainee's own row: a numbered spine, the stage and
     its clock on one line, what to do under it. */
  .proc{margin:9px 0 2px; padding:10px 12px; background:var(--sand-deep); border:1px solid var(--sand-line);
    border-left:3px solid var(--teal); border-radius:8px;}
  .proc .plab{font-size:0.66rem; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:0 0 6px;}

  .proc li{margin:0 0 7px;}
  .proc li:last-child{margin-bottom:0;}
  .proc .pst{display:flex; gap:9px; align-items:baseline; flex-wrap:wrap;}
  .proc .pst b{font-size:0.82rem;}
  .proc .pmin{font-variant-numeric:tabular-nums; font-weight:700; color:var(--teal); font-size:0.72rem;}

  .proc .pdo li::marker{color:var(--teal);}
  .proc .pav{color:var(--brick); margin:4px 0 0; font-size:0.74rem;}
  .proc .pavl{margin-top:1px;}
  .proc .pavl li::marker{color:var(--brick);}
  .proc .pclock{margin:7px 0 0; font-size:0.72rem; color:var(--grey); font-variant-numeric:tabular-nums;}
  .proc li.flexi{color:var(--grey);}
  .proc .pflex{font-size:0.66rem; letter-spacing:.06em; text-transform:uppercase; font-weight:700; color:var(--gold-deep);
    background:var(--gold-wash); border-radius:999px; padding:1px 7px;}
  details.proc.ref{border-left-color:var(--sand-line); background:var(--paper);}
  details.proc.ref summary{font-size:0.74rem; font-weight:600; color:var(--teal); cursor:pointer;}
  /* The reference, named part by part. The parts sit in a row that wraps, each
     with its label above it, so the shape of a reference is something you look
     at rather than something you are told. */
  .src{margin:9px 0 2px; padding:10px 12px; background:var(--paper); border:1px solid var(--sand-line);
    border-left:3px solid var(--gold); border-radius:8px;}
  .src .plab{font-size:0.66rem; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); font-weight:700; margin:0 0 7px;}
  .srcpat{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 8px;}
  .srcpat span{display:flex; flex-direction:column; gap:2px; padding:5px 9px; background:var(--box);
    border:1px solid var(--sand-line); border-radius:7px; font-size:0.62rem; letter-spacing:.07em;
    text-transform:uppercase; color:var(--grey); font-weight:700;}
  .srcpat i{font-style:normal; font-size:0.78rem; letter-spacing:0; text-transform:none; color:var(--ink); font-weight:500;}
  .srcwhy{margin:0 0 6px; font-size:0.76rem; color:var(--grey); line-height:1.55;}

     card and each practice a full-width row that says which practice it is.
     More scrolling, nothing hidden, nothing guessed at. */
  @media (max-width:700px){

     practices already taught and the chrome come off the page. On screen the
     pages are Drive's viewer; on paper the viewer is hidden and the page's
     image prints in its place. */
  .tpcredit{display:none;}

    .board{padding-bottom:0 !important;}

    .mine-block{border:0; background:#fff; padding:0;}

       split across two. A Drive preview frame cannot print at all, so it is
       hidden rather than left as a grey rectangle. */
    .pg{break-inside:avoid; page-break-inside:avoid; max-width:none; flex:1 1 100%;}

    .pg img, .pg img.forprint{display:block; width:100%; max-height:90vh; object-fit:contain; border:0;}

    body.printpages .lessonline,

  /* ---- v2 (7 Oct 2026): the families, visible ------------------------------

     productive skills) and the notes below the table talk in them, but the

<script type="text/x-hub-app">
const MODE = window.HubMode;
/* "Print the pages" puts the card into a mode where only the scans print, one
   to a sheet. It has to come back out of that mode afterwards, or the screen
   stays stripped for whoever looks next -- afterprint fires on cancel too. */
/* A PAGE THAT DID NOT COME IS ASKED FOR AGAIN (11 Oct 2026). Drive's image
   address refuses some requests when a page asks for many at once, and the
   image used to remove itself -- so "Print my pages" printed two of Hiba's four
   pages and said nothing. Now it is asked for once more, then fetched through
   the store; only if that fails too does its figure say so, in a note that
   prints in its place. */
function pgRetry(img){
  const n = +(img.dataset.tries || 0);
  const fail = () => { const f = img.closest('figure'); if (f) f.classList.add('pgfail'); img.dataset.failed = '1'; };
  if (img.dataset.via === 'store') return fail();
  if (n < 1) {
    img.dataset.tries = n + 1;
    const base = img.src.replace(/&r=\d+$/, '');
    setTimeout(() => { img.src = base + '&r=' + (n + 1); }, 800);
    return;
  }
  /* Twice refused: the store reads the file from Drive itself (the op that
     plays the tracks serves any file this trainee's points name), which
     Google does not throttle the way it throttles the image address --
     on 11 Oct one of Hiba's pages was refused five times running. */
  const id = img.dataset.id;
  if (!id || !window.HubStore || !HubStore.audio) return fail();
  img.dataset.via = 'store';
  HubStore.audio(id).then(r => { if (r && r.b64) img.src = 'data:' + (r.mime || 'image/jpeg') + ';base64,' + r.b64; else fail(); }, fail);
}
window.pgRetry = pgRetry;
/* Printing waits for the pages: up to twenty seconds for every page image of
   your own lesson to arrive (or to have given up), the button saying so. */
function whenPagesReady(btn, then){
  const imgs = [...document.querySelectorAll('.mine-block img.forprint')];
  const ready = () => imgs.every(i => i.dataset.failed || (i.complete && i.naturalWidth > 0));
  if (ready()) return then();
  const label = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'Getting your pages…'; btn.disabled = true; }
  const t0 = Date.now();
  const tick = () => {
    if (ready() || Date.now() - t0 > 20000) { if (btn) { btn.textContent = label; btn.disabled = false; } then(); }
    else setTimeout(tick, 300);
  };
  tick();
}
function printTP(btn){ whenPagesReady(btn, () => window.print()); }
window.printTP = printTP;
function printPages(btn){
  whenPagesReady(btn, () => {
    document.body.classList.add('printpages');
    const off = () => { document.body.classList.remove('printpages'); window.removeEventListener('afterprint', off); };
    window.addEventListener('afterprint', off);
    setTimeout(() => { window.print(); setTimeout(off, 1500); }, 60);
  });
}
window.printPages = printPages;
/* Copy link: the clipboard where the page may use it, a selected box where it may not. */
document.addEventListener('click', function(e){
  const b = e.target.closest && e.target.closest('.copylink'); if (!b) return;
  const text = b.dataset.copy || '';
  const done = () => { const was = b.textContent; b.textContent = 'Copied'; b.classList.add('done'); setTimeout(() => { b.textContent = was; b.classList.remove('done'); }, 1800); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => window.prompt('Copy this link:', text));
  else window.prompt('Copy this link:', text);
});
/* A volunteer student is not on the course: their own page carries the
   part of the teaching practice points they need (sweep, 30 Sep 2026). */
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose \u2014 this is one of the course\u2019s own pages.');
const IS_TRAINEE = MODE === 'trainee', IS_TUTOR = MODE === 'tutor';
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* A stage's instructions are written as running sentences. They are shown as
   bullet points, one step to a point (Ramy, 14 Oct 2026: "TP points use
   bullet points all the way through"). Text already written as lines or with
   its own bullets is kept as the author set it. A short answer stays with the
   question it answers, and a question inside a dash of example language stays
   in its sentence. */
const BUL_ABBR = /(?:\b(?:p|pp|ex|Ex|no|No|vs|Fig|fig|e\.g|i\.e|etc|approx|St|Mr|Mrs|Ms|Dr)\.)$/;
const BUL_IMP = /^(Board|Play|Ask|Pairs|Then|Drill|Check|Elicit|Give|Put|Write|Read|Tell|Let|Go|Do|Set|Swap|Monitor|Model|Alone|Finish|Show|Replay|Stop|Hand|Collect|Praise|Move|Keep|Listen|Choose|Point|Mime|Clarify|Silence|Answer|Answers|Now|Next|Before|After|Once)\b/;
function bulletSplit(text) {
  const t = String(text == null ? '' : text).replace(/\r/g, '').trim();
  if (!t) return [];
  if (/\n/.test(t) || /^\s*[•\-–*]\s/.test(t)) {
    return t.split(/\n+/).map(l => l.replace(/^\s*[•\-–*]\s*/, '').trim()).filter(Boolean);
  }
  const out = []; let start = 0; const re = /[.?!]["”’)\]]*\s+(?=["“‘(]?[A-Z])/g; let m;
  while ((m = re.exec(t))) {
    const chunk = t.slice(start, m.index + 1);
    if (m[0][0] === '.' && BUL_ABBR.test(chunk)) continue;
    if (m[0][0] !== '.' && / [–—] ["“‘]?[A-Z]/.test(chunk) && !BUL_IMP.test(t.slice(m.index + m[0].length))) continue;
    out.push(t.slice(start, m.index + m[0].trimEnd().length).trim());
    start = m.index + m[0].length;
  }
  if (start < t.length) out.push(t.slice(start).trim());
  const res = [];
  out.filter(Boolean).forEach(x => {
    const prev = res[res.length - 1], w = x.split(/\s+/).length;
    if (prev && /\?["”’)]*$/.test(prev) &&
        (w <= 3 || /^No\b/.test(x) || (/^(Yes|Not|Maybe|Only|It|They|We)\b[^?]{0,40}[.!]?$/.test(x) && w <= 6))) res[res.length - 1] = prev + ' ' + x;
    else res.push(x);
  });
  return res;
}
const bulletsHTML = (text, cls) => {
  const b = bulletSplit(text);
  return b.length ? `<ul class="${cls}">${b.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
};
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const SETTINGS = rec('connect_course_settings') || {};
const KEY = 'connect_tp_points_v1';
/* THE TRACKS, THROUGH THE STORE (10 Oct 2026). One fetch per track per visit:
   the bytes become a blob the page keeps, so a second play is instant. */
const AUDIO_URLS = new Map();
document.addEventListener('click', async e => {
  const b = e.target.closest && e.target.closest('.audplay'); if (!b) return;
  const wrap = b.closest('.audwrap'), id = wrap && wrap.dataset.drive; if (!id) return;
  const show = url => { wrap.innerHTML = `<audio controls autoplay src="${url}"></audio>`; };
  if (AUDIO_URLS.has(id)) { show(AUDIO_URLS.get(id)); return; }
  b.disabled = true; b.textContent = 'Getting the track…';
  try {
    const r = await window.HubStore.audio(id);
    const bin = atob(r.b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: r.mime || 'audio/mpeg' }));
    AUDIO_URLS.set(id, url); show(url);
  } catch (err) {
    b.disabled = false; b.textContent = '\u25B6 Play the track';
    const fb = b.closest('figure.aud') && b.closest('figure.aud').querySelector('.audfallback');
    if (fb) fb.hidden = false;
    else if (!wrap.querySelector('.auderr')) wrap.insertAdjacentHTML('beforeend', '<span class="auderr">It would not load just now. Try again, or open it in Drive.</span>');
  }
});
const R = window.hubRotation;
/* The last two practices are the trainees' own, on the planning grid, so
   the rotation covers everything before them. */
const TOTAL = parseInt(SETTINGS.tpCount, 10) || 8;
const TPS = Math.max(1, TOTAL - 2);
$('back').href = IS_TRAINEE ? 'index.html' : IS_TUTOR ? '5_tutor_dashboard.html' : '12_assessor_pack.html';

let P = rec(KEY) || null;
let note = '';
/* Which cell's materials are open, as "group|token|tp". Ramy, 29 Sep 2026:
   a trainee should get "their TP points and scanned copies of the pages
   they are teaching and the embedded audio link". A grid of dropdowns cannot
   hold that, so a cell opens a panel of its own. */
let OPEN = null, UPLOADING = false;

function groups(){
  const roster = rec('connect_roster_v1') || {};
  const people = Object.values(roster.trainees || {}).filter(Boolean);
  const by = {};
  /* The roster in this browser keys a trainee by `id`, not `token` -- the
     store's own roster op says token, hub-sync writes id, and the planning
     grid has always read id. Reading t.token gave every trainee the key
     `undefined`, so one shared row stood in for the whole group and the
     rotation came out identical for everybody (found on the scratch course,
     29 Sep 2026). */
  people.forEach(t => { const g = String(t.group || ''); (by[g] = by[g] || []).push({ token: t.id || t.token, name: t.name, group: g, tr: t }); });
  return Object.keys(by).sort().map(g => ({ group: g, people: by[g] }));
}

/* What each trainee has already taught and how it went, read from the
   returned feedback the tracker already reads. { token: { 3: {grade,aim} } }.
   This is what the failed-lesson rule works on. */
function taughtSoFar(people){
  const T = window.HubTracker;
  const out = {};
  (people || []).forEach(p => {
    if (!T || !p.tr) return;
    let c = null; try { c = T.recordFor(p.tr); } catch(e) { return; }
    if (!c) return;
    const mine = {};
    for (let n = 1; n <= TOTAL; n++) {
      const g = c['tp' + n], a = c['tp' + n + '_aim'];
      if (g || a) mine[n] = { grade: g || '', aim: a || '' };
    }
    if (Object.keys(mine).length) out[p.token] = mine;
  });
  return out;
}

/* Build or rebuild the rotation. The second group starts three places along,
   so two groups running in parallel never teach the same type on the same
   day. Anything a tutor has already changed is kept. */
/* THE SET WINS (Ramy, 4 Oct 2026: "the set wins, rotator just deals the
   slots"). A set — written on 28_tp_point_sets.html — says what each of a
   session's three slots is: TP 3, second teaching set, slot 2. The rotation
   still decides WHO takes which slot, because the teaching order already
   rotates (ABC, then BCA, then CAB), and a trainee's place in that order IS
   the slot number. Where there is no set, or no slot written for that place,
   the rotation goes on generating the type exactly as it did before.

   The slot is COPIED into the cell rather than referred to. Trainees are
   handed their own cells by the store and never the whole record, so a cell
   that only pointed at a set would reach them empty; copying also means an
   edit to the set cannot silently rewrite a lesson somebody has already
   planned. Re-applying the set is a deliberate press. */
function slotFor(set, tp, setIndex, pos){
  const id = tp + (setIndex === 0 ? 'A' : 'B');
  const ses = (set.sessions || {})[id];
  const sl = ses && (ses.slots || [])[pos];
  if (!sl || !(sl.type || sl.aim)) return null;
  return { slot: sl, scaffold: ses.scaffold || '', context: ses.context || '', id: id, pos: pos, tp: tp, set: set };
}
function stamp(cell, found){
  const sl = found.slot;
  const out = Object.assign({}, cell);
  if (sl.type) out.aim = sl.type;
  if (sl.aim) out.point = sl.aim;
  if (sl.sub) out.sub = sl.sub;
  if (sl.shape) out.framework = sl.shape;
  const book = Object.assign({}, out.book || {});
  if (sl.pages) book.ref = sl.pages;
  if (sl.page) book.page = sl.page;
  if (!book.url && found.set && found.set.url) book.url = found.set.url;
  if (book.url || book.ref || book.page) out.book = book;
  if (sl.tracks) out.audio = Object.assign({}, out.audio || {}, { url: sl.tracks });
  /* WHERE A TRACK NUMBER LEADS WHEN NOBODY HAS ATTACHED THE FILE. A set written
     by another centre, or shared through Connect, carries the track NUMBER and
     not our copy of the recording -- we tell you which track, you bring your
     own audio. The set's "Link to the audio" is that centre's folder, and it
     fills the cell the same way the set's book link fills book.url. */
  if (found.set && found.set.audioUrl) {
    out.audio = Object.assign({}, out.audio || {});
    if (!out.audio.folder) out.audio.folder = found.set.audioUrl;
  }
  /* Scanned pages belong to the SLOT, not to whoever draws it this year: the
     page a lesson is taught from does not change when the rotation deals
     somebody else into it. Files attached to a cell by hand are kept alongside
     them. */
  /* the whole day's pages as one PDF, for a face-to-face course. It belongs to
     the SESSION, not the slot -- every trainee teaching that day gets the
     same file -- so it is carried across from the set when the cell is built. */
  const ses = found.set && found.set.sessions && found.set.sessions[found.id];
  if (ses && ses.dayPdf && ses.dayPdf.url) out.dayPdf = ses.dayPdf;
  if ((sl.files || []).length) {
    const own = (out.pages || []).filter(f => f && !f.fromSet);
    out.pages = sl.files.map(f => ({ name: f.name, url: f.url, fromSet: 1 })).concat(own);
  }
  out.stages = (sl.stages || []).filter(s => s && (s.name || s.todo))
    .map(s => ({ name: s.name || '', minutes: s.minutes || '', interaction: s.interaction || '', todo: s.todo || '', avoid: s.avoid || '' }));
  out.scaffold = found.scaffold;
  if (found.context) out.context = found.context;
  /* Sourcing is taught once, by being shown. The references ride on the first
     two practices only; by TP 3 the trainee writes their own, which is the
     same hand-over the aims and the procedure make (Ramy, 4 Oct 2026). */
  if (found.tp <= 2 && found.set && found.set.sources) out.sources = found.set.sources;
  out.from = found.id + '·' + (found.pos + 1);
  return out;
}

function sessionIds(){
  const out = [];
  for (let tp = 1; tp <= TPS; tp++) { out.push(tp + 'A'); out.push(tp + 'B'); }
  return out;
}
/* A COURSE HOLDS SEVERAL SETS. Ramy, 4 Oct 2026: "we will definitely need at
   least four sets in case it's a course of 24." A set belongs to a tutor and
   their book, not to a cohort's journey, so a course of twenty-four running
   four groups has four of them, and each group teaches from its own. The old
   single `set` is read as the library's first entry, so a course written
   before this keeps working and is migrated the first time the editor saves. */
/* The sets live INSIDE the record's `set` field, because the store rebuilds a
   TP points record from named keys on read and would drop a `library` of its
   own (found the hard way, 4 Oct 2026). A `set` that still has `sessions` is
   the single set written before this, and reads as the library's first entry. */
function library(){
  const s = P && P.set;
  if (!s) return {};
  if (s.library && Object.keys(s.library).length) return s.library;
  if (s.sessions) return { s1: s };
  return {};
}
const assigned = () => ((P && P.set && P.set.setFor) || {});
function setIdFor(group){
  const lib = library(), ids = Object.keys(lib);
  if (!ids.length) return '';
  const chosen = assigned()[group] || '';
  return lib[chosen] ? chosen : ids[0];          // one set serves every group until told otherwise
}
const setFor = group => library()[setIdFor(group)] || null;
const setName = s => (s && (s.name || s.book)) || 'The set';

function setBar(){
  const lib = library(), ids = Object.keys(lib);
  if (!ids.length) return `<div class="setbar"><span class="status">No TP point set on this course — the rotation is generating the lesson types itself.</span>
    <a class="btn quiet sm" href="28_tp_point_sets.html">Write a set</a></div>`;
  const sess = sessionIds();
  const gs = groups();
  /* A set with no name, no book and nothing written is not shown: an empty
     "The set" beside the real one read as a second set (Ramy, 21 Oct 2026).
     It is still there in Write the sets, with a Remove at the top. */
  const worth = id => { const x = lib[id]; return !!(x.name || x.book) || sess.some(k => { const ses = (x.sessions || {})[k]; return ses && (ses.slots || []).some(sl => sl && (sl.type || sl.aim)); }); };
  let shown = ids.filter(worth); if (!shown.length) shown = ids;
  const line = shown.map(id => {
    const s = lib[id];
    const written = sess.filter(x => { const ses = (s.sessions || {})[x]; return ses && (ses.slots || []).some(sl => sl && (sl.type || sl.aim)); }).length;
    const using = gs.filter(g => setIdFor(g.group) === id).map(g => g.group);
    return `<span class="setchip"><b>${esc(setName(s))}</b>${s.level ? ' · ' + esc(s.level) : ''}
      <i>${written} of ${sess.length} sessions${using.length ? ' · group ' + using.map(esc).join(', ') : ' · no group yet'}</i></span>`;
  }).join('');
  /* THE BUTTON HAS TO ANSWER. Ramy, 4 Oct 2026: "when you click apply it
     should apply and then it should read Applied, so people just don't keep
     applying, not knowing what happened." He pressed it twice. The note was
     being written next to Rebuild, three inches away from the thing he had
     just pressed. */

  return `<div class="setbar on">${line}
    <a class="btn quiet sm" href="28_tp_point_sets.html">${shown.length > 1 ? 'Write the sets' : 'Write the set'}</a>

      applied ? 'Applied' : 'Apply ' + (shown.length > 1 ? 'them' : 'it')}</button>${
      applied ? `<span class="status">${esc(note)}</span>` : ''}</div>`;
}
function wireSetBar(){
  /* NO CONFIRM. It guarded nothing -- applying is idempotent, and build(true)
     keeps every cell a tutor changed by hand -- and it was the thing actually
     stopping the work: a dialog that some browsers answer for you silently, so
     the click landed, build() never ran, and the page still said Applied.
     Ramy pressed it five times on 4 Oct 2026 against a rebuild that had never
     happened. The button reports what it did; that is the safeguard. */
  const b = $('applyset');
  if (b) b.addEventListener('click', () => build(true));
}

function build(keepEdits){
  const gs = groups();
  const lib = library();
  /* Carry forward everything this version does not know about. A build used to
     list the fields it kept, so an OLD page running against a NEWER record
     silently dropped the fields it had never heard of -- on 4 Oct 2026 a
     cached copy of this screen rebuilt a course and took the whole TP point
     library with it. Whatever is on the record stays on the record. */
  const out = Object.assign({}, P || {}, { groups: {}, sets: {},
                released: (P && P.released) || {},
                set: { library: lib, setFor: assigned() } });
  let usedAny = false;
  gs.forEach((g, i) => {
    const set = setFor(g.group);
    if (set) usedAny = true;
    const r = R.rotate(g.people, { tps: TPS, groupOffset: i * 3 });
    const rows = {};
    Object.keys(r.rows).forEach(token => { rows[token] = {}; });
    for (let tp = 1; tp <= TPS; tp++) {
      r.sets.forEach((st, si) => {
        R.orderFor(st, tp).forEach((p, pos) => {
          const token = p.token;
          const was = keepEdits && P && P.groups && P.groups[g.group] && P.groups[g.group][token] && P.groups[g.group][token]['tp'+tp];
          if (was && was.edited) { rows[token]['tp'+tp] = was; return; }
          const found = set && slotFor(set, tp, si, pos);
          const cell = { aim: r.rows[token]['tp'+tp] };
          rows[token]['tp'+tp] = Object.assign(found ? stamp(cell, found) : cell, keptMakeup(was));
        });
      });
    }
    out.groups[g.group] = rows;
    /* By place, gaps kept: [A, null, C] when B has left, so the others keep
       their letters and days when the points are dealt again (hub-rotation). */
    out.sets[g.group] = r.sets.map((s, si) => {
      const a = [null, null, null];
      s.forEach(p => { const k = p.idx - si * 3; if (k >= 0 && k < 3) a[k] = p.token; else a.push(p.token); });
      while (a.length && a[a.length - 1] === null) a.pop();
      return a;
    });
  });
  P = out;
  persist(usedAny ? (Object.keys(lib).length > 1 ? 'Built from the sets' : 'Built from the set') : 'Rotation built');
}

function persist(word){
  /* A SILENT CATCH LIES TO THE TUTOR. This swallowed every failure, so a save
     that never happened still lit the button up as Applied and said "Built
     from the sets" -- Ramy pressed Apply five times on 4 Oct 2026 against a
     rebuild that was reporting success. If the write cannot be made, say so
     and stop: hub-sync only hears about a change through setItem, so a throw
     here means nothing is queued and nothing reaches the course either. */
  try { localStorage.setItem(KEY, JSON.stringify(P)); }
  catch (e) { note = 'Not saved — ' + ((e && e.message) || e); render(); return; }
  note = word || 'Saved';
  render();
  /* SIX SECONDS, AND A PROPER RESET. Ramy, 4 Oct 2026: "a window kind of pops
     up next to it, but it's too quick, it disappears ... it needs to last more
     than a second, so I can see it." It also used to blank the FIRST .status
     on the page by hand and leave everything else as it was, so the Apply
     button stayed reading "Applied" with no message beside it. Clearing the
     note and re-rendering puts the whole bar back together. */
  setTimeout(() => { if (note === word) { note = ''; render(); } }, 6000);
}

const MKEY = (g, t, tp) => g + '|' + t + '|' + tp;
/* A missed practice survives the points being dealt again or the type being
   changed by hand: it is about the trainee, not about the lesson. */
const shortDate = d => { try { return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); } catch (e) { return d; } };
const keptMakeup = was => (was && was.missed) ? (was.makeup ? { missed: true, makeup: was.makeup } : { missed: true }) : {};
function cellOf(g, t, tp){
  P.groups = P.groups || {}; P.groups[g] = P.groups[g] || {}; P.groups[g][t] = P.groups[g][t] || {};
  return (P.groups[g][t]['tp' + tp] = P.groups[g][t]['tp' + tp] || {});
}

/* The materials for one lesson. Three kinds, because a centre has three:
     pages   scanned pages, uploaded into the course's own Drive folder --
             the same path a trainee's own materials already take;
     book    a link to a coursebook that lives somewhere else, with the page
             and exercise reference as words. Lite cannot cut pages out of a
             PDF it does not host, and should not pretend to: the reference
             plus the link is what a tutor actually needs on screen. Where the
             link is a direct PDF address, a page number opens it at that page;
     audio   a link to wherever the audio lives, which need not be Lite. */
function matsPanel(g, t, tp, letter, name){

      <p class="hint">This lesson stays open on ${name ? esc(name.split(' ')[0]) + '\u2019s' : 'their'} card, with the make-up day on it, and the timetable shows it on that day. Leave the day empty until you know it. They still teach in order: this one comes before TP ${+tp + 1}.</p>` : ''}
    </div></div>
    <div class="mrow"><label>Sub aim</label><input type="text" data-m="sub" value="${esc(c.sub || '')}" placeholder="Lexis, speaking \u2014 the second focus"></div>

    <div class="mrow"><label>Main aim</label><textarea data-m="point" rows="2" placeholder="The lesson in a line. The full aims and the stage-by-stage suggestions go in the document you attach below.">${esc(c.point || '')}</textarea></div>
    <div class="mrow"><label>Coursebook</label><input type="url" data-m="bookUrl" value="${esc((c.book||{}).url || '')}" placeholder="https://\u2026 a link to the book"></div>
    <div class="mrow"><label>Materials</label><textarea data-m="bookRef" rows="3" placeholder="SpeakOut A1, SB p. 14, ex. 2a, 2b, 3a&#10;WB p. 9, ex. 1a, 1b&#10;One line each">${esc((c.book||{}).ref || '')}</textarea></div>
    <div class="mrow"><label>Page to open at</label><input type="number" min="1" data-m="bookPage" value="${esc((c.book||{}).page || '')}" placeholder="42"><small>Only works where the link is a direct PDF address; a Drive preview ignores it.</small></div>
    <div class="mrow"><label>Audio</label><div><textarea data-m="audioUrl" rows="3" placeholder="Track 1.14 | https://drive.google.com/file/d/\u2026&#10;Track 1.15 | https://\u2026&#10;One link per line; a name before a | labels it">${esc((c.audio||{}).url || '')}</textarea>
      <p class="hint">Each line becomes a player on the trainee\u2019s card \u2014 a Drive link plays in place, a direct .mp3 gets its own controls. The file must be shared so anyone with the link can open it.</p></div></div>
    <div class="mrow"><label>Scanned pages</label><div>
      ${pages.length ? '<ul class="files">' + pages.map((f, i) => `<li><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a> <button type="button" class="btn quiet sm" data-mrm="${i}">Remove</button></li>`).join('') + '</ul>' : '<p class="hint">Nothing attached yet.</p>'}
      <input type="file" id="matsFile" accept="application/pdf,image/*"${UPLOADING ? ' disabled' : ''}>
      <p class="hint">${UPLOADING ? 'Uploading\u2026' : 'The TP points document itself goes here, and any scanned pages \u2014 the full aims, the framework and the stage-by-stage suggestions live in it, not retyped into this form. Up to 2MB each, into the course\u2019s own folder. Anyone with the link can open it, because a tutor or an assessor is usually not signed in to your Workspace, so for a whole coursebook link to your own Drive above instead.'}</p>

function wireMats(){
  if (!OPEN) return;
  const [g, t, tp] = OPEN.split('|');
  const c = cellOf(g, t, tp);
  document.querySelectorAll('[data-m]').forEach(el => {
    let timer = null;
    const fire = () => {
      const k = el.dataset.m, v = el.value;
      if (k === 'point') c.point = v;
      else if (k === 'sub') c.sub = v;
      else if (k === 'framework') c.framework = v;
      else if (k === 'bookUrl') { c.book = c.book || {}; c.book.url = v; }
      else if (k === 'bookRef') { c.book = c.book || {}; c.book.ref = v; }
      else if (k === 'bookPage') { c.book = c.book || {}; c.book.page = v; }
      else if (k === 'audioUrl') { c.audio = c.audio || {}; c.audio.url = v; }
      c.edited = true;
      try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {}
      const st = document.querySelector('.status'); if (st) st.textContent = 'Saved';
    };
    el.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(fire, 700); });
    el.addEventListener('blur', () => { clearTimeout(timer); fire(); });
  });
  /* The make-up is not an edit to the lesson, so it does not set `edited`:
     dealing the points again still refreshes the lesson, and build() carries
     the make-up across on its own. */
  document.querySelectorAll('[data-mk]').forEach(el => el.addEventListener('change', () => {
    const k = el.dataset.mk;
    if (k === 'missed') {
      if (el.checked) c.missed = true; else { delete c.missed; delete c.makeup; }
      persist(el.checked ? 'Marked as missed' : 'No longer missed');
      return;
    }
    c.makeup = Object.assign({}, c.makeup || {}, { [k]: el.value });
    if (!c.makeup.date && !c.makeup.from) delete c.makeup;
    persist('Make-up saved');
  }));
  document.querySelectorAll('[data-mrm]').forEach(el => el.addEventListener('click', () => {
    (c.pages || []).splice(+el.dataset.mrm, 1); c.edited = true; persist('Removed');
  }));
  const f = $('matsFile');
  if (f) f.addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    if (file.size > 2 * 1024 * 1024) { alert('That file is over 2MB. Put it on your own Drive and paste the coursebook link instead.'); return; }
    UPLOADING = true; render();
    try {
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(',')[1] || '');
        r.onerror = () => rej(new Error('That file could not be read.'));
        r.readAsDataURL(file);
      });
      const out = await window.HubStore.putMaterial(t, file.name, file.type || 'application/octet-stream', b64);
      c.pages = (c.pages || []).concat([{ name: out.name || file.name, url: out.url }]);
      c.edited = true;
      UPLOADING = false; persist('Attached');
    } catch (err) { UPLOADING = false; alert(err && err.message ? err.message : 'That file could not be attached.'); render(); }
  });
  if ($('matsClose')) $('matsClose').addEventListener('click', () => { OPEN = null; render(); });
}

/* What a trainee reads under their lesson. The book link carries the page
   anchor when there is one, so a direct PDF opens where the lesson is. */
/* The shorthand a TP point is written in, spelled out at the foot of the card.
   Ramy, 4 Oct 2026: "they can also understand what it stands for at the bottom
   of the page — at least for the first three TPs, and then we can take it off."
   The list is Connect's own (ABBREVIATIONS_GLOSSARY in tp-density.ts) plus the
   interaction codes this card and the trainee's plan actually print. */
const GLOSSARY = [
  ['SB', 'student’s book'], ['WB', 'workbook'], ['p.', 'page'], ['HO', 'handout'],
  ['AK', 'answer key'], ['TL', 'target language'], ['MFP', 'meaning, form and pronunciation'],
  ['CCQ', 'concept checking question'], ['ICQ', 'instruction checking question'],
  ['ECDW', 'elicit, CCQ, drill, write'],
  ['PW', 'pair work'], ['GW', 'group work'], ['PC', 'peer check'], ['Ind.', 'individually'],
  ['OC', 'open class'], ['WC', 'whole class'], ['Ming.', 'mingle'],
  ['T–S', 'teacher to students'], ['S–S', 'student to student'],
  ['FB', 'feedback'], ['WCFB', 'whole class feedback'],
  ['TTT', 'teacher talking time'], ['STT', 'student talking time'],
];
const GLOSSARY_UNTIL = 3;          // after the third TP they know it
function glossary(tp){

  return `<div class="gloss"><div class="plab">What the shorthand means</div>
    <dl>${GLOSSARY.map(g => `<dt>${esc(g[0])}</dt><dd>${esc(g[1])}</dd>`).join('')}</dl>

/* "5", "5-7", "" — what a stage's time means as a span. */
function minSpan(v){
  const m = String(v == null ? '' : v).match(/(\d+)\s*[-–—]\s*(\d+)/);
  if (m) return [+m[1], +m[2]];
  const n = parseInt(v, 10);
  return n > 0 ? [n, n] : [0, 0];
}
const isFlexi = s => !!(s && (s.flexi || (/if.?time|flexi|spare|extra activity/i.test(s.name || '') && !minSpan(s.minutes)[1])));

/* The pages themselves, in the card. Ramy, 4 Oct 2026: "I want them to see
   the page, the PDF for the page that they are doing, all in one document."
   A file in the course's Drive folder previews in an iframe; anything that is
   not a Drive link is left as the link matsRead already prints. A classmate's
   page carries the watermark, so a shared page cannot be mistaken for yours. */
function pageFigures(c, mine){
  const files = (c.pages || []).filter(f => f && f.url);
  if (!files.length) return '';
  const body = files.map(f => {
    const m = String(f.url).match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?[^"' ]*?id=)([\w-]{20,})/);
    /* A PAGE THAT IS A PLAIN IMAGE (25 Oct 2026): the demo's own pages, or a scan a centre keeps on the web
       rather than in Drive. It shows, prints and opens full size as itself. */
    if (!m && /\.(png|jpe?g|webp|gif)([?#]|$)/i.test(f.url)) return `<figure class="pg${mine ? '' : ' ref'}"><figcaption>${esc(f.name || 'Page')}${mine ? '' : ' — not yours'}</figcaption>
      <img class="pgimg" src="${esc(f.url)}" alt="${esc(f.name || 'Page')}" loading="lazy">
      <a class="pgopen" href="${esc(f.url)}" target="_blank" rel="noopener">Open full size</a></figure>`;
    if (!m) return '';
    /* AN IMAGE, NOT AN IFRAME. Ramy, 4 Oct 2026: the print button "doesn't
       print as a PDF" -- a cross-origin Drive /preview iframe never prints, so
       the pages came out blank on paper, which is exactly what a face-to-face
       course needs. The scans are JPEGs, so they are served straight from
       usercontent as an <img>: it renders, it prints, and it needs no plugin.
       Anything that is not an image falls back to the old preview frame. */
    const id = esc(m[1]);
    /* TESTED against the live site, 4 Oct 2026, because the obvious URL fails:
       drive.usercontent.google.com/download?export=view serves the AUDIO fine
       but is refused for an <img>. The thumbnail endpoint is the one Drive
       will hotlink, and sz=w1600 is capped at the file's own width, so a page
       scanned at 150 dpi comes back at its full 1240x1755. */
    const src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1600';
    /* THE FRAME ON SCREEN, THE PICTURE ON PAPER (11 Oct 2026). Ramy: "the scan
       copies ... were sitting inside some kind of a frame ... you can move it
       around with the cursor. It was very clear." The 4 Oct switch to a flat
       <img> fixed printing and took the viewer away with it. Both now: Drive's
       own viewer for reading on screen, where the page scrolls and zooms in
       place, and the image for the printer, which never prints a frame. The
       image is not lazy: a hidden lazy image is never fetched, and would print
       blank. `hl=en`: signed out, Google labels its viewer in the language of
       where you are, so in Istanbul its pop-out button spoke Turkish. */
    return `<figure class="pg${mine ? '' : ' ref'}"><figcaption>${esc(f.name || 'Page')}${mine ? '' : ' — not yours'}</figcaption>
      <iframe src="https://drive.google.com/file/d/${id}/preview?hl=en" loading="lazy" title="${esc(f.name || 'Page')}"></iframe>
      <img class="forprint" src="${src}" data-id="${id}" alt="${esc(f.name || 'Page')}" onerror="pgRetry(this)">
      <p class="pgnote">${esc(f.name || 'This page')} did not load. Print it from Drive: ${esc('drive.google.com/file/d/' + m[1] + '/view')}</p>
      <a class="pgopen" href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener">Open in Drive</a></figure>`;
  }).filter(Boolean).join('');
  return body ? `<div class="pgs">${body}</div>` : '';
}

/* ---- THE LESSON SHEET (Ramy, 24 Oct 2026: design A of three, "go with A ...
   show me what happens when they click on material ... build it") ---------
   A trainee's own lesson as one sheet: what it is and when, the aims and the
   procedure on the left; on the right the materials as cards, one per page,
   the audio, and the afternoon it sits in. A material card opens a side sheet:
   the page itself where the centre gave a file, which of its exercises are
   this trainee's, and the stage each one belongs to. */
const LS_INTER = { 'PW': 'pairs', 'GW': 'groups', 'IND.': 'alone', 'IND': 'alone', 'OC': 'open class', 'WC': 'whole class',
  'MING.': 'mingle', 'MING': 'mingle', 'PC': 'peer check', 'T–S': 'teacher to students', 'S–S': 'student to student' };
function lsInter(v){ return String(v || '').split('+').map(x => x.trim()).filter(Boolean).map(x => LS_INTER[x.toUpperCase()] || x).join(', '); }
const LS_KIND = { SB: 'Student’s Book', WB: 'Workbook', TB: 'Teacher’s Book' };
/* The book reference, read as page-anchored lines: "SB p. 58 Listening ex 3a-3c /
   Grammar ex 4a" is page 58 twice. A line that names no page belongs to the page
   before it. */
function lsRefParts(c){
  const out = []; let last = null;
  String((c.book || {}).ref || '').split(/\n+|\s+\/\s+/).map(x => x.trim()).filter(Boolean).forEach(seg => {
    const m = seg.match(/\b(SB|WB|Workbook|Student[’']s Book|Teacher[’']s Book|TB)?\s*pp?\.\s*(\d{1,3})(?:\s*[–-]\s*(\d{1,3}))?/i);
    let src = last ? last.src : '', page = last ? last.page : '';
    let what = seg;
    if (m) {
      const k = String(m[1] || '').toLowerCase();
      src = /wb|workbook/.test(k) ? 'WB' : /tb|teacher/.test(k) ? 'TB' : (k ? 'SB' : (last ? last.src : 'SB'));
      page = m[2];
      what = seg.slice(m.index + m[0].length);
      const before = seg.slice(0, m.index).replace(/^.*?\)\s*/, '').trim();
      if (/grammar focus|grammar bank|vocabulary bank|communication/i.test(before)) what = before + ' ' + what;
    }
    what = what.replace(/\s*[–-]\s*audio tracks?\s*\d+\.\d+(?:\s*(?:,|and)\s*\d+\.\d+)*(?:\s*\([^)]*\))?/gi, '').replace(/^[\s,–-]+|[\s,–-]+$/g, '').trim();
    if (!page && !src) { out.push({ src: '', page: '', what: seg }); return; }
    last = { src: src || 'SB', page: page };
    out.push({ src: last.src, page: page, what: what });
  });
  return out;
}
/* Which stages use a page: a stage that names the page, or one of its exercises. */
function lsStagesFor(stages, page, whats){
  const toks = [];
  whats.forEach(w => String(w).replace(/\b(\d{1,2})([a-h])\s*[–-]\s*\d{0,2}([a-h])\b/gi, (_, n, a, b) => {
      for (let ch = a.toLowerCase().charCodeAt(0); ch <= b.toLowerCase().charCodeAt(0); ch++) toks.push(n + String.fromCharCode(ch)); return _; })
    .replace(/\b(\d{1,2}[a-h])\b/gi, (_, t) => { toks.push(t.toLowerCase()); return _; }));
  const hits = [];
  stages.forEach((s, i) => {
    /* "(5A)" in a stage is the unit, not exercise 5a; and a page every line
       shares only decides the stages when the line names no exercise */
    const t = String(s.todo || '').toLowerCase().replace(/\([^)]*\)/g, ' ');
    const named = !toks.length && page && new RegExp('\\bpp?\\.?\\s*' + page + '\\b').test(t);
    if (named || toks.some(k => new RegExp('\\b' + k + '\\b').test(t))) hits.push(i + 1);
  });
  if (!hits.length) return '';
  const runs = []; hits.forEach(n => { const r = runs[runs.length - 1]; if (r && n === r[1] + 1) r[1] = n; else runs.push([n, n]); });
  const txt = runs.map(r => r[0] === r[1] ? String(r[0]) : r[0] + '–' + r[1]).join(', ');
  return (hits.length === 1 ? 'Stage ' : 'Stages ') + txt;
}
/* The cards for a lesson's materials, and what the side sheet shows for each. */
function lsMaterials(c, key){
  const parts = lsRefParts(c), groups = [], byKey = {};
  parts.forEach(p => {
    const k = p.page ? p.src + p.page : 'x' + groups.length;
    if (!byKey[k]) { byKey[k] = { src: p.src, page: p.page, whats: [] }; groups.push(byKey[k]); }
    if (p.what) byKey[k].whats.push(p.what);
  });
  const files = (c.pages || []).filter(f => f && f.name);
  const used = new Set();
  groups.forEach(g => {
    if (!g.page) return;
    const f = files.find(x => !used.has(x) && new RegExp('\\bp(?:age|\\.)?\\s*' + g.page + '\\b', 'i').test(x.name)
      && (g.src !== 'WB' ? !/workbook/i.test(x.name) : /workbook/i.test(x.name)));
    if (f) { used.add(f); g.file = f; }
  });
  files.filter(f => !used.has(f)).forEach(f => { const m = f.name.match(/\b(\d{1,3})\b/); groups.push({ src: /workbook/i.test(f.name) ? 'WB' : 'SB', page: m ? m[1] : '', whats: [], file: f, name: f.name }); });
  const stages = (c.stages || []).filter(s => s && (s.name || s.todo));
  const list = groups.filter(g => g.page || g.whats.length || g.file).map(g => ({
    kind: g.page ? (LS_KIND[g.src] || 'Coursebook') : 'Also',
    title: g.page ? 'Page ' + g.page : (g.name || g.whats[0] || 'Material'),
    lines: g.page ? g.whats : g.whats.slice(1),
    file: g.file ? g.file.url || '' : '',
    uses: g.whats.map(w => ({ what: w, stages: lsStagesFor(stages, g.page, [w]) })),
    num: g.page || '',
  }));
  window.__LS = window.__LS || {};
  window.__LS[key] = list;
  return list;
}
function lsDriveId(u){ const m = String(u || '').match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?[^"' ]*?id=)([\w-]{20,})/); return m ? m[1] : ''; }
/* The side sheet. One element for the page, filled when a card is pressed. */
function lsOpen(key, i, from){
  const list = (window.__LS || {})[key] || []; const m = list[i]; if (!m) return;
  let ov = document.getElementById('lsSheet');
  if (!ov) { ov = document.createElement('div'); ov.id = 'lsSheet'; ov.className = 'ls-ov'; document.body.appendChild(ov); }
  const id = lsDriveId(m.file);

    ? `<div class="ls-page"><iframe src="https://drive.google.com/file/d/${esc(id)}/preview?hl=en" title="${esc(m.kind + ', ' + m.title)}"></iframe></div>
       <a class="ls-btn" href="https://drive.google.com/file/d/${esc(id)}/view" target="_blank" rel="noopener">Open full size</a>`
    : /\.(png|jpe?g|webp|gif)([?#]|$)/i.test(m.file || '')
      ? `<div class="ls-page ls-img"><img src="${esc(m.file)}" alt="${esc(m.kind + ', ' + m.title)}"></div>
         <a class="ls-btn" href="${esc(m.file)}" target="_blank" rel="noopener">Open full size</a>`
    : m.file
      ? `<a class="ls-btn" href="${esc(m.file)}" target="_blank" rel="noopener">Open the page</a>`
      : `<div class="ls-page ls-nopage"><p><b>${esc(m.kind)}, ${esc(m.title.toLowerCase())}</b></p><p>No scan of this page has been added yet. Use it from the coursebook.</p></div>`;
  const uses = m.uses.filter(u => u.what);
  ov.innerHTML = `<button type="button" class="ls-dim" aria-label="Close the page" data-ls-close></button>
    <div class="ls-panel" role="dialog" aria-modal="true" aria-label="${esc(m.kind + ', ' + m.title)}">
      <div class="ls-phead">
        <div class="ls-ptitle"><span class="ls-eye">Your materials · ${i + 1} of ${list.length}</span><b>${esc(m.kind)}, ${esc(m.title.toLowerCase())}</b></div>
        <button type="button" class="ls-ico" aria-label="Previous material" data-ls-go="${i - 1}"${i ? '' : ' disabled'}><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="ls-ico" aria-label="Next material" data-ls-go="${i + 1}"${i < list.length - 1 ? '' : ' disabled'}><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" class="ls-close" data-ls-close>Close</button>
      </div>
      <div class="ls-pbody">
        ${pageView}
        ${uses.length ? `<div class="ls-uses"><span class="ls-eye">What you use on this page</span>${uses.map(u => `<div class="ls-use"><span>${esc(u.what)}</span>${u.stages ? `<b>${esc(u.stages)}</b>` : ''}</div>`).join('')}</div>` : ''}
      </div>
    </div>`;
  ov.dataset.key = key; ov.hidden = false; document.body.classList.add('ls-open');
  ov.__from = from || ov.__from || null;
  const cl = ov.querySelector('.ls-close'); if (cl) cl.focus();
}
function lsClose(){
  const ov = document.getElementById('lsSheet'); if (!ov || ov.hidden) return;
  ov.hidden = true; ov.innerHTML = ''; document.body.classList.remove('ls-open');
  if (ov.__from && ov.__from.focus) ov.__from.focus(); ov.__from = null;
}
document.addEventListener('click', function(e){
  const t = e.target.closest ? e.target : null; if (!t) return;
  const card = t.closest('.ls-mat'); if (card) { lsOpen(card.dataset.key, +card.dataset.i, card); return; }
  if (t.closest('[data-ls-close]')) { lsClose(); return; }
  const go = t.closest('[data-ls-go]'); if (go && !go.disabled) { const ov = document.getElementById('lsSheet'); lsOpen(ov.dataset.key, +go.dataset.lsGo); }
});
