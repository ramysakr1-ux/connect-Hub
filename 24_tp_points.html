<!DOCTYPE html>
<!--
  Connect Lite — teaching practice points
  © 2026 Ramy Sakr. All rights reserved.

  Handbook 9.1.2, a MUST twice over: "Centres must ensure that all candidates
  have practice in a range of lessons covering all aspects of language
  teaching and must include language-focus lessons. The type of lesson must be
  recorded in the CELTA 5."

  A centre satisfies that by rotating the lesson types round the group instead
  of letting them fall where they may. Ramy, 29 Sep 2026: "TP points that
  rotate automatically, depending on aims and different order for the
  teachers." The rotation lives in hub-rotation.js and is explained there; in
  short, each trainee starts at their own place in the seven types and steps
  one along each practice, so nobody in a teaching set teaches the same type on
  the same day, each trainee's six practices are six different types, and
  every one of them includes language focus by construction rather than by
  luck.

  It is a PROPOSAL. Every cell is the tutor's to change, which is the standing
  rule that anything the system decides can be overridden — and because an
  override can break what the rotation guaranteed, the language-focus check
  runs against what is actually on the page, not against what was generated.

  Released per group, the same way the planning grid is: the trainees see
  their own group's points and nothing before release.
-->

  @media (max-width:620px){ .pg iframe{height:430px;} .pg.ref iframe{height:300px;} }
  /* The shorthand, spelled out: a definition list in columns, quiet enough to
     ignore once you no longer need it. */
  .gloss{margin:12px 0 0; padding:11px 13px; background:var(--paper); border:1px solid var(--sand-line);

  .gloss dl{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:2px 16px; margin:0;}
  .gloss dt{grid-column:auto; font-weight:700; font-size:0.74rem; color:var(--ink); display:inline;}
  .gloss dd{margin:0 0 3px; font-size:0.74rem; color:var(--grey); display:inline;}
  .gloss dt::after{content:' \2014 ';}
  .gloss dd::after{content:''; display:block;}
  .gloss .glossnote{margin:7px 0 0; font-size:0.7rem; color:var(--faint);}
  .req{margin:7px 0 0; font-size:0.76rem; color:var(--grey); line-height:1.55;}
  .req.first{color:var(--teal); font-weight:600;}
  .wrap{overflow-x:auto;}
  .ord{white-space:nowrap; letter-spacing:.12em;}
  /* On a phone six practices across cannot be a table: four columns simply
     ran off the right edge and the dropdowns were too narrow to read a word
     in ("Grammar" showed as "Gram"). Below 700px each trainee becomes a
     card and each practice a full-width row that says which practice it is.
     More scrolling, nothing hidden, nothing guessed at. */
  @media (max-width:700px){
    .tbl.stack{border:0; background:none;}
    .tbl.stack tr:first-child{display:none;}
    .tbl.stack tr{display:block; background:var(--paper); border:1px solid var(--sand-line);
      border-radius:9px; margin:0 0 12px; overflow:hidden;}
    .tbl.stack td{display:grid; grid-template-columns:74px 1fr; gap:10px; align-items:center;
      border:0; border-top:1px solid var(--sand-line); padding:7px 10px;}
    .tbl.stack td:first-child{border-top:0; background:var(--box); display:block;}
    .tbl.stack td[data-lab]::before{content:attr(data-lab); font-size:0.68rem; letter-spacing:.07em;
      text-transform:uppercase; color:var(--grey); font-weight:700;}
    .tbl.stack td.who{white-space:normal;}
    .tbl.stack select{font-size:0.86rem; padding:7px 8px;}
    .tbl.stack .mbtn{width:auto; margin:5px 0 0; padding:5px 10px; font-size:0.72rem;}
    .tbl.ord.stack td{grid-template-columns:74px 1fr;}
  }
  @media (max-width:560px){ .board{padding:18px 12px 60px;} section.group{padding:12px 12px 14px;} }
  .printme{float:right; font-family:inherit; font-size:0.66rem; font-weight:700; letter-spacing:.06em;

  .printme:hover{border-color:var(--teal);}
  /* Printing gives them their own lesson and nothing else: the other two, the
     practices already taught and the chrome come off the page. The pages are
     Drive previews and will not print from here -- the page link opens in
     Drive, which has its own print. */
  @media print{
    .back,.relbar,#hubSync,.printme,.others,.day.past,.req,.lede,.ok,.pgopen{display:none !important;}
    body{background:#fff;}
    .mine-block{border:0; background:#fff; padding:0;}
    .proc{background:#fff;}
    details.proc{display:block;} details.proc > summary{display:none;}
    /* a page is a page: one per sheet, as large as the sheet allows, and never
       split across two. A Drive preview frame cannot print at all, so it is
       hidden rather than left as a grey rectangle. */
    .pg{break-inside:avoid; page-break-inside:avoid; max-width:none; flex:1 1 100%;}
    .pg img{width:100%; max-height:96vh; object-fit:contain; border:0;}
    .pg iframe{display:none !important;}
    .pgs{display:block;}
    /* "Print the pages": the scans alone, one to a sheet, nothing else */
    body.printpages .lessonline,
    body.printpages .mats-read,
    body.printpages .aimrows,
    body.printpages .dayline,
    body.printpages .whoami,
    body.printpages .proc,
    body.printpages .glossary,
    body.printpages h1,
    body.printpages .eyebrow{display:none !important;}
    body.printpages .pg{break-after:page; page-break-after:always;}
    body.printpages .pg figcaption{font-size:0.8rem; margin:0 0 4px;}
  }
</style>

const MODE = window.HubMode;
/* "Print the pages" puts the card into a mode where only the scans print, one
   to a sheet. It has to come back out of that mode afterwards, or the screen
   stays stripped for whoever looks next -- afterprint fires on cancel too. */
function printPages(){
  document.body.classList.add('printpages');
  const off = () => { document.body.classList.remove('printpages'); window.removeEventListener('afterprint', off); };
  window.addEventListener('afterprint', off);
  setTimeout(() => { window.print(); setTimeout(off, 1500); }, 60);
}
window.printPages = printPages;
/* A volunteer student is not on the course: their own page carries the
   part of the teaching practice points they need (sweep, 30 Sep 2026). */
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose \u2014 this is one of the course\u2019s own pages.');
const IS_TRAINEE = MODE === 'trainee', IS_TUTOR = MODE === 'tutor';
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const SETTINGS = rec('connect_course_settings') || {};
const KEY = 'connect_tp_points_v1';
const R = window.hubRotation;
/* The last two practices are the trainees' own, on the planning grid, so
   the rotation covers everything before them. */
const TOTAL = parseInt(SETTINGS.tpCount, 10) || 8;
const TPS = Math.max(1, TOTAL - 2);
$('back').href = IS_TRAINEE ? 'index.html' : IS_TUTOR ? '5_tutor_dashboard.html' : '12_assessor_pack.html';

let P = rec(KEY) || null;
let note = '';
/* Which cell's materials are open, as "group|token|tp". Ramy, 29 Sep 2026:
   a trainee should get "their TP points and scanned copies of the pages
   they are teaching and the embedded audio link". A grid of dropdowns cannot
   hold that, so a cell opens a panel of its own. */
let OPEN = null, UPLOADING = false;

function groups(){
  const roster = rec('connect_roster_v1') || {};
  const people = Object.values(roster.trainees || {}).filter(Boolean);
  const by = {};
  /* The roster in this browser keys a trainee by `id`, not `token` -- the
     store's own roster op says token, hub-sync writes id, and the planning
     grid has always read id. Reading t.token gave every trainee the key
     `undefined`, so one shared row stood in for the whole group and the
     rotation came out identical for everybody (found on the scratch course,
     29 Sep 2026). */
  people.forEach(t => { const g = String(t.group || ''); (by[g] = by[g] || []).push({ token: t.id || t.token, name: t.name, group: g, tr: t }); });
  return Object.keys(by).sort().map(g => ({ group: g, people: by[g] }));
}

/* What each trainee has already taught and how it went, read from the
   returned feedback the tracker already reads. { token: { 3: {grade,aim} } }.
   This is what the failed-lesson rule works on. */
function taughtSoFar(people){
  const T = window.HubTracker;
  const out = {};
  (people || []).forEach(p => {
    if (!T || !p.tr) return;
    let c = null; try { c = T.recordFor(p.tr); } catch(e) { return; }
    if (!c) return;
    const mine = {};
    for (let n = 1; n <= TOTAL; n++) {
      const g = c['tp' + n], a = c['tp' + n + '_aim'];
      if (g || a) mine[n] = { grade: g || '', aim: a || '' };
    }
    if (Object.keys(mine).length) out[p.token] = mine;
  });
  return out;
}

/* Build or rebuild the rotation. The second group starts three places along,
   so two groups running in parallel never teach the same type on the same
   day. Anything a tutor has already changed is kept. */
/* THE SET WINS (Ramy, 4 Oct 2026: "the set wins, rotator just deals the
   slots"). A set — written on 28_tp_point_sets.html — says what each of a
   session's three slots is: TP 3, second teaching set, slot 2. The rotation
   still decides WHO takes which slot, because the teaching order already
   rotates (ABC, then BCA, then CAB), and a trainee's place in that order IS
   the slot number. Where there is no set, or no slot written for that place,
   the rotation goes on generating the type exactly as it did before.

   The slot is COPIED into the cell rather than referred to. Trainees are
   handed their own cells by the store and never the whole record, so a cell
   that only pointed at a set would reach them empty; copying also means an
   edit to the set cannot silently rewrite a lesson somebody has already
   planned. Re-applying the set is a deliberate press. */
function slotFor(set, tp, setIndex, pos){
  const id = tp + (setIndex === 0 ? 'A' : 'B');
  const ses = (set.sessions || {})[id];
  const sl = ses && (ses.slots || [])[pos];
  if (!sl || !(sl.type || sl.aim)) return null;
  return { slot: sl, scaffold: ses.scaffold || '', context: ses.context || '', id: id, pos: pos, tp: tp, set: set };
}
function stamp(cell, found){
  const sl = found.slot;
  const out = Object.assign({}, cell);
  if (sl.type) out.aim = sl.type;
  if (sl.aim) out.point = sl.aim;
  if (sl.sub) out.sub = sl.sub;
  if (sl.shape) out.framework = sl.shape;
  const book = Object.assign({}, out.book || {});
  if (sl.pages) book.ref = sl.pages;
  if (sl.page) book.page = sl.page;
  if (!book.url && found.set && found.set.url) book.url = found.set.url;
  if (book.url || book.ref || book.page) out.book = book;
  if (sl.tracks) out.audio = Object.assign({}, out.audio || {}, { url: sl.tracks });
  /* WHERE A TRACK NUMBER LEADS WHEN NOBODY HAS ATTACHED THE FILE. A set written
     by another centre, or shared through Connect, carries the track NUMBER and
     not our copy of the recording -- we tell you which track, you bring your
     own audio. The set's "Link to the audio" is that centre's folder, and it
     fills the cell the same way the set's book link fills book.url. */
  if (found.set && found.set.audioUrl) {
    out.audio = Object.assign({}, out.audio || {});
    if (!out.audio.folder) out.audio.folder = found.set.audioUrl;
  }
  /* Scanned pages belong to the SLOT, not to whoever draws it this year: the
     page a lesson is taught from does not change when the rotation deals
     somebody else into it. Files attached to a cell by hand are kept alongside
     them. */
  /* the whole day's pages as one PDF, for a face-to-face course. It belongs to
     the SESSION, not the slot -- every trainee teaching that day gets the
     same file -- so it is carried across from the set when the cell is built. */
  const ses = found.set && found.set.sessions && found.set.sessions[found.id];
  if (ses && ses.dayPdf && ses.dayPdf.url) out.dayPdf = ses.dayPdf;
  if ((sl.files || []).length) {
    const own = (out.pages || []).filter(f => f && !f.fromSet);
    out.pages = sl.files.map(f => ({ name: f.name, url: f.url, fromSet: 1 })).concat(own);
  }
  out.stages = (sl.stages || []).filter(s => s && (s.name || s.todo))
    .map(s => ({ name: s.name || '', minutes: s.minutes || '', interaction: s.interaction || '', todo: s.todo || '', avoid: s.avoid || '' }));
  out.scaffold = found.scaffold;
  if (found.context) out.context = found.context;
  /* Sourcing is taught once, by being shown. The references ride on the first
     two practices only; by TP 3 the trainee writes their own, which is the
     same hand-over the aims and the procedure make (Ramy, 4 Oct 2026). */
  if (found.tp <= 2 && found.set && found.set.sources) out.sources = found.set.sources;
  out.from = found.id + '·' + (found.pos + 1);
  return out;
}

function sessionIds(){
  const out = [];
  for (let tp = 1; tp <= TPS; tp++) { out.push(tp + 'A'); out.push(tp + 'B'); }
  return out;
}
/* A COURSE HOLDS SEVERAL SETS. Ramy, 4 Oct 2026: "we will definitely need at
   least four sets in case it's a course of 24." A set belongs to a tutor and
   their book, not to a cohort's journey, so a course of twenty-four running
   four groups has four of them, and each group teaches from its own. The old
   single `set` is read as the library's first entry, so a course written
   before this keeps working and is migrated the first time the editor saves. */
/* The sets live INSIDE the record's `set` field, because the store rebuilds a
   TP points record from named keys on read and would drop a `library` of its
   own (found the hard way, 4 Oct 2026). A `set` that still has `sessions` is
   the single set written before this, and reads as the library's first entry. */
function library(){
  const s = P && P.set;
  if (!s) return {};
  if (s.library && Object.keys(s.library).length) return s.library;
  if (s.sessions) return { s1: s };
  return {};
}
const assigned = () => ((P && P.set && P.set.setFor) || {});
function setIdFor(group){
  const lib = library(), ids = Object.keys(lib);
  if (!ids.length) return '';
  const chosen = assigned()[group] || '';
  return lib[chosen] ? chosen : ids[0];          // one set serves every group until told otherwise
}
const setFor = group => library()[setIdFor(group)] || null;
const setName = s => (s && (s.name || s.book)) || 'The set';

function setBar(){
  const lib = library(), ids = Object.keys(lib);
  if (!ids.length) return `<div class="setbar"><span class="status">No TP point set on this course — the rotation is generating the lesson types itself.</span>
    <a class="btn quiet sm" href="28_tp_point_sets.html">Write a set</a></div>`;
  const sess = sessionIds();
  const gs = groups();
  const line = ids.map(id => {
    const s = lib[id];
    const written = sess.filter(x => { const ses = (s.sessions || {})[x]; return ses && (ses.slots || []).some(sl => sl && (sl.type || sl.aim)); }).length;
    const using = gs.filter(g => setIdFor(g.group) === id).map(g => g.group);
    return `<span class="setchip"><b>${esc(setName(s))}</b>${s.level ? ' · ' + esc(s.level) : ''}
      <i>${written} of ${sess.length} sessions${using.length ? ' · group ' + using.map(esc).join(', ') : ' · no group yet'}</i></span>`;
  }).join('');
  /* THE BUTTON HAS TO ANSWER. Ramy, 4 Oct 2026: "when you click apply it
     should apply and then it should read Applied, so people just don't keep
     applying, not knowing what happened." He pressed it twice. The note was
     being written next to Rebuild, three inches away from the thing he had
     just pressed. */
  const applied = /^(Built from|Rotation built)/.test(note || '');
  return `<div class="setbar on">${line}
    <a class="btn quiet sm" href="28_tp_point_sets.html">${ids.length > 1 ? 'Write the sets' : 'Write the set'}</a>
    <button type="button" class="btn sm" id="applyset"${applied ? ' disabled' : ''}>${
      applied ? 'Applied' : 'Apply ' + (ids.length > 1 ? 'them' : 'it')}</button>${
      applied ? `<span class="status">${esc(note)}</span>` : ''}</div>`;
}
function wireSetBar(){
  /* NO CONFIRM. It guarded nothing -- applying is idempotent, and build(true)
     keeps every cell a tutor changed by hand -- and it was the thing actually
     stopping the work: a dialog that some browsers answer for you silently, so
     the click landed, build() never ran, and the page still said Applied.
     Ramy pressed it five times on 4 Oct 2026 against a rebuild that had never
     happened. The button reports what it did; that is the safeguard. */
  const b = $('applyset');
  if (b) b.addEventListener('click', () => build(true));
}

function build(keepEdits){
  const gs = groups();
  const lib = library();
  /* Carry forward everything this version does not know about. A build used to
     list the fields it kept, so an OLD page running against a NEWER record
     silently dropped the fields it had never heard of -- on 4 Oct 2026 a
     cached copy of this screen rebuilt a course and took the whole TP point
     library with it. Whatever is on the record stays on the record. */
  const out = Object.assign({}, P || {}, { groups: {}, sets: {},
                released: (P && P.released) || {},
                set: { library: lib, setFor: assigned() } });
  let usedAny = false;
  gs.forEach((g, i) => {
    const set = setFor(g.group);
    if (set) usedAny = true;
    const r = R.rotate(g.people, { tps: TPS, groupOffset: i * 3 });
    const rows = {};
    Object.keys(r.rows).forEach(token => { rows[token] = {}; });
    for (let tp = 1; tp <= TPS; tp++) {
      r.sets.forEach((st, si) => {
        R.orderFor(st, tp).forEach((p, pos) => {
          const token = p.token;
          const was = keepEdits && P && P.groups && P.groups[g.group] && P.groups[g.group][token] && P.groups[g.group][token]['tp'+tp];
          if (was && was.edited) { rows[token]['tp'+tp] = was; return; }
          const found = set && slotFor(set, tp, si, pos);
          const cell = { aim: r.rows[token]['tp'+tp] };
          rows[token]['tp'+tp] = found ? stamp(cell, found) : cell;
        });
      });
    }
    out.groups[g.group] = rows;
    out.sets[g.group] = r.sets.map(s => s.map(p => p.token));
  });
  P = out;
  persist(usedAny ? (Object.keys(lib).length > 1 ? 'Built from the sets' : 'Built from the set') : 'Rotation built');
}

function persist(word){
  /* A SILENT CATCH LIES TO THE TUTOR. This swallowed every failure, so a save
     that never happened still lit the button up as Applied and said "Built
     from the sets" -- Ramy pressed Apply five times on 4 Oct 2026 against a
     rebuild that was reporting success. If the write cannot be made, say so
     and stop: hub-sync only hears about a change through setItem, so a throw
     here means nothing is queued and nothing reaches the course either. */
  try { localStorage.setItem(KEY, JSON.stringify(P)); }
  catch (e) { note = 'Not saved — ' + ((e && e.message) || e); render(); return; }
  note = word || 'Saved';
  render();
  /* SIX SECONDS, AND A PROPER RESET. Ramy, 4 Oct 2026: "a window kind of pops
     up next to it, but it's too quick, it disappears ... it needs to last more
     than a second, so I can see it." It also used to blank the FIRST .status
     on the page by hand and leave everything else as it was, so the Apply
     button stayed reading "Applied" with no message beside it. Clearing the
     note and re-rendering puts the whole bar back together. */
  setTimeout(() => { if (note === word) { note = ''; render(); } }, 6000);
}

const MKEY = (g, t, tp) => g + '|' + t + '|' + tp;
function cellOf(g, t, tp){
  P.groups = P.groups || {}; P.groups[g] = P.groups[g] || {}; P.groups[g][t] = P.groups[g][t] || {};
  return (P.groups[g][t]['tp' + tp] = P.groups[g][t]['tp' + tp] || {});
}

/* The materials for one lesson. Three kinds, because a centre has three:
     pages   scanned pages, uploaded into the course's own Drive folder --
             the same path a trainee's own materials already take;
     book    a link to a coursebook that lives somewhere else, with the page
             and exercise reference as words. Lite cannot cut pages out of a
             PDF it does not host, and should not pretend to: the reference
             plus the link is what a tutor actually needs on screen. Where the
             link is a direct PDF address, a page number opens it at that page;
     audio   a link to wherever the audio lives, which need not be Lite. */
function matsPanel(g, t, tp, letter, name){
  const c = cellOf(g, t, tp);
  const pages = c.pages || [];
  return `<div class="mats"><h4>TP ${tp} \u00b7 ${esc(letter)}${name ? ' \u00b7 ' + esc(name) : ''} \u2014 what they are teaching</h4>
    <div class="mrow"><label>Sub aim</label><input type="text" data-m="sub" value="${esc(c.sub || '')}" placeholder="Lexis, speaking \u2014 the second focus"></div>
    <div class="mrow"><label>Lesson shape</label><input type="text" data-m="framework" value="${esc(c.framework || '')}" placeholder="Receptive skills, PPP, Test-Teach-Test\u2026"></div>
    <div class="mrow"><label>Main aim</label><textarea data-m="point" rows="2" placeholder="The lesson in a line. The full aims and the stage-by-stage suggestions go in the document you attach below.">${esc(c.point || '')}</textarea></div>
    <div class="mrow"><label>Coursebook</label><input type="url" data-m="bookUrl" value="${esc((c.book||{}).url || '')}" placeholder="https://\u2026 a link to the book"></div>
    <div class="mrow"><label>Materials</label><textarea data-m="bookRef" rows="3" placeholder="SpeakOut A1, SB p. 14, ex. 2a, 2b, 3a&#10;WB p. 9, ex. 1a, 1b&#10;One line each">${esc((c.book||{}).ref || '')}</textarea></div>
    <div class="mrow"><label>Page to open at</label><input type="number" min="1" data-m="bookPage" value="${esc((c.book||{}).page || '')}" placeholder="42"><small>Only works where the link is a direct PDF address; a Drive preview ignores it.</small></div>
    <div class="mrow"><label>Audio</label><div><textarea data-m="audioUrl" rows="3" placeholder="Track 1.14 | https://drive.google.com/file/d/\u2026&#10;Track 1.15 | https://\u2026&#10;One link per line; a name before a | labels it">${esc((c.audio||{}).url || '')}</textarea>
      <p class="hint">Each line becomes a player on the trainee\u2019s card \u2014 a Drive link plays in place, a direct .mp3 gets its own controls. The file must be shared so anyone with the link can open it.</p></div></div>
    <div class="mrow"><label>Scanned pages</label><div>
      ${pages.length ? '<ul class="files">' + pages.map((f, i) => `<li><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a> <button type="button" class="btn quiet sm" data-mrm="${i}">Remove</button></li>`).join('') + '</ul>' : '<p class="hint">Nothing attached yet.</p>'}
      <input type="file" id="matsFile" accept="application/pdf,image/*"${UPLOADING ? ' disabled' : ''}>
      <p class="hint">${UPLOADING ? 'Uploading\u2026' : 'The TP points document itself goes here, and any scanned pages \u2014 the full aims, the framework and the stage-by-stage suggestions live in it, not retyped into this form. Up to 2MB each, into the course\u2019s own folder. Anyone with the link can open it, because a tutor or an assessor is usually not signed in to your Workspace, so for a whole coursebook link to your own Drive above instead.'}</p>
    </div></div>
    <div class="macts"><button type="button" class="btn quiet" id="matsClose">Close</button></div></div>`;
}

function wireMats(){
  if (!OPEN) return;
  const [g, t, tp] = OPEN.split('|');
  const c = cellOf(g, t, tp);
  document.querySelectorAll('[data-m]').forEach(el => {
    let timer = null;
    const fire = () => {
      const k = el.dataset.m, v = el.value;
      if (k === 'point') c.point = v;
      else if (k === 'sub') c.sub = v;
      else if (k === 'framework') c.framework = v;
      else if (k === 'bookUrl') { c.book = c.book || {}; c.book.url = v; }
      else if (k === 'bookRef') { c.book = c.book || {}; c.book.ref = v; }
      else if (k === 'bookPage') { c.book = c.book || {}; c.book.page = v; }
      else if (k === 'audioUrl') { c.audio = c.audio || {}; c.audio.url = v; }
      c.edited = true;
      try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {}
      const st = document.querySelector('.status'); if (st) st.textContent = 'Saved';
    };
    el.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(fire, 700); });
    el.addEventListener('blur', () => { clearTimeout(timer); fire(); });
  });
  document.querySelectorAll('[data-mrm]').forEach(el => el.addEventListener('click', () => {
    (c.pages || []).splice(+el.dataset.mrm, 1); c.edited = true; persist('Removed');
  }));
  const f = $('matsFile');
  if (f) f.addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    if (file.size > 2 * 1024 * 1024) { alert('That file is over 2MB. Put it on your own Drive and paste the coursebook link instead.'); return; }
    UPLOADING = true; render();
    try {
      const b64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(String(r.result).split(',')[1] || '');
        r.onerror = () => rej(new Error('That file could not be read.'));
        r.readAsDataURL(file);
      });
      const out = await window.HubStore.putMaterial(t, file.name, file.type || 'application/octet-stream', b64);
      c.pages = (c.pages || []).concat([{ name: out.name || file.name, url: out.url }]);
      c.edited = true;
      UPLOADING = false; persist('Attached');
    } catch (err) { UPLOADING = false; alert(err && err.message ? err.message : 'That file could not be attached.'); render(); }
  });
  if ($('matsClose')) $('matsClose').addEventListener('click', () => { OPEN = null; render(); });
}

/* What a trainee reads under their lesson. The book link carries the page
   anchor when there is one, so a direct PDF opens where the lesson is. */
/* The shorthand a TP point is written in, spelled out at the foot of the card.
   Ramy, 4 Oct 2026: "they can also understand what it stands for at the bottom
   of the page — at least for the first three TPs, and then we can take it off."
   The list is Connect's own (ABBREVIATIONS_GLOSSARY in tp-density.ts) plus the
   interaction codes this card and the trainee's plan actually print. */
const GLOSSARY = [
  ['SB', 'student’s book'], ['WB', 'workbook'], ['p.', 'page'], ['HO', 'handout'],
  ['AK', 'answer key'], ['TL', 'target language'], ['MFP', 'meaning, form and pronunciation'],
  ['CCQ', 'concept checking question'], ['ICQ', 'instruction checking question'],
  ['ECDW', 'elicit, CCQ, drill, write'],
  ['PW', 'pair work'], ['GW', 'group work'], ['PC', 'peer check'], ['Ind.', 'individually'],
  ['OC', 'open class'], ['WC', 'whole class'], ['Ming.', 'mingle'],
  ['T–S', 'teacher to students'], ['S–S', 'student to student'],
  ['FB', 'feedback'], ['WCFB', 'whole class feedback'],
  ['TTT', 'teacher talking time'], ['STT', 'student talking time'],
];
const GLOSSARY_UNTIL = 3;          // after the third TP they know it
function glossary(tp){
  if (tp > GLOSSARY_UNTIL) return '';
  return `<div class="gloss"><div class="plab">What the shorthand means</div>
    <dl>${GLOSSARY.map(g => `<dt>${esc(g[0])}</dt><dd>${esc(g[1])}</dd>`).join('')}</dl>
    <p class="glossnote">This sits on your first ${GLOSSARY_UNTIL} TPs only.</p></div>`;
}

/* "5", "5-7", "" — what a stage's time means as a span. */
function minSpan(v){
  const m = String(v == null ? '' : v).match(/(\d+)\s*[-–—]\s*(\d+)/);
  if (m) return [+m[1], +m[2]];
  const n = parseInt(v, 10);
  return n > 0 ? [n, n] : [0, 0];
}
const isFlexi = s => !!(s && (s.flexi || (/if.?time|flexi|spare|extra activity/i.test(s.name || '') && !minSpan(s.minutes)[1])));

/* The pages themselves, in the card. Ramy, 4 Oct 2026: "I want them to see
   the page, the PDF for the page that they are doing, all in one document."
   A file in the course's Drive folder previews in an iframe; anything that is
   not a Drive link is left as the link matsRead already prints. A classmate's
   page carries the watermark, so a shared page cannot be mistaken for yours. */
function pageFigures(c, mine){
  const files = (c.pages || []).filter(f => f && f.url);
  if (!files.length) return '';
  const body = files.map(f => {
    const m = String(f.url).match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?[^"' ]*?id=)([\w-]{20,})/);
    if (!m) return '';
    /* AN IMAGE, NOT AN IFRAME. Ramy, 4 Oct 2026: the print button "doesn't
       print as a PDF" -- a cross-origin Drive /preview iframe never prints, so
       the pages came out blank on paper, which is exactly what a face-to-face
       course needs. The scans are JPEGs, so they are served straight from
       usercontent as an <img>: it renders, it prints, and it needs no plugin.
       Anything that is not an image falls back to the old preview frame. */
    const id = esc(m[1]);
    /* TESTED against the live site, 4 Oct 2026, because the obvious URL fails:
       drive.usercontent.google.com/download?export=view serves the AUDIO fine
       but is refused for an <img>. The thumbnail endpoint is the one Drive
       will hotlink, and sz=w1600 is capped at the file's own width, so a page
       scanned at 150 dpi comes back at its full 1240x1755. */
    const src = 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1600';
    return `<figure class="pg${mine ? '' : ' ref'}"><figcaption>${esc(f.name || 'Page')}${mine ? '' : ' — not yours'}</figcaption>
      <img src="${src}" alt="${esc(f.name || 'Page')}" loading="lazy"
           onerror="this.onerror=null;this.insertAdjacentHTML('afterend','&lt;iframe src=&quot;https://drive.google.com/file/d/${id}/preview&quot; loading=&quot;lazy&quot;&gt;&lt;/iframe&gt;');this.remove();">
      <a class="pgopen" href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener">Open in Drive</a></figure>`;
  }).filter(Boolean).join('');
  return body ? `<div class="pgs">${body}</div>` : '';
}

function matsRead(c, mine){
  if (!c) return '';
  /* NAMED ROWS, not a run-on sentence. Ramy, 4 Oct 2026: "main aim, and then
     write down the aim. Sub aim, and then the sub aim. Clear headings —
     especially at the beginning, they're all very flustered." The aim, the
     sub aim and the shape used to run together behind middots, which read as
     one sentence and left a trainee unsure which part was the aim they were
     being shown how to write.

     The main-aim row appears only where the aim is a written one: from TP 3
     the field carries the lesson type, which is already the heading above. */
  const rows = [];
  if (mine) {
    if (c.point && c.point !== c.aim) rows.push(['Main aim', esc(c.point)]);
    if (c.sub) rows.push(['Sub aim', /^you decide$/i.test(c.sub.trim()) ? '<i>yours to choose</i>' : esc(c.sub)]);
    if (c.framework) rows.push(['Lesson shape', esc(c.framework)]);
  }
  const says = mine ? [] : [
    c.sub ? `<span class="msub">${/^you decide$/i.test(String(c.sub).trim()) ? 'sub aim theirs to choose' : 'with ' + esc(c.sub)}</span>` : ''
  ].filter(Boolean);

  const b = c.book || {};
  const href = b.url ? (b.page && /\.pdf($|\?)/i.test(b.url) ? b.url + '#page=' + encodeURIComponent(b.page) : b.url) : '';
  let lines = String(b.ref || '').split(/\n+/).map(x => x.trim()).filter(Boolean);
  /* "Class audio: track 2.6" written out beside a player that is already
     labelled Track 2.6 says the same thing twice. The line stays for anybody
     who gets a link instead of a player. */
  const hasPlayer = mine && String((c.audio || {}).url || '').trim();
  if (hasPlayer) lines = lines.filter(l => !/^class audio/i.test(l));
  const got = [];
  if (!lines.length && href) got.push(`<a class="mlink" href="${esc(href)}" target="_blank" rel="noopener">The coursebook</a>`);
  lines.forEach((ln, i) => got.push(i === 0 && href
    ? `<a class="mlink" href="${esc(href)}" target="_blank" rel="noopener">${esc(ln)}</a>`
    : `<span class="mref">${esc(ln)}</span>`));
  (c.pages || []).forEach(f => got.push(`<a class="mlink" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`));
  const rowsHTML = rows.map(r => `<div class="aimrow"><span class="alab">${r[0]}</span><span class="aval">${r[1]}</span></div>`).join('');

  /* Audio: one line per track in the cell, each a player IN the card for the
     trainee whose lesson it is (Ramy, 29 Sep and again 4 Oct 2026: "the
     embedded audio link" / "audio files, embedded in the page"). On a
     classmate's row the same tracks stay links: those lessons are to sit in
     on, and six players a day would drown the page. */
  const audioLines = String((c.audio || {}).url || '').split(/\n+/).map(x => x.trim()).filter(Boolean)
    .map(line => { const bar = line.indexOf('|');
      if (bar > -1) return { label: line.slice(0, bar).trim(), url: line.slice(bar + 1).trim() };
      /* A line with no pipe used to be taken as a URL whatever it said, which
         was safe while every line WAS one. A set that names "Track 2.1" and
         carries no file now writes exactly that, so a line that is plainly not
         an address is a label with no link, not a link called Track 2.1. */
      return /^(https?:)?\/\//i.test(line) || /^[\w.-]+\.[a-z]{2,}\//i.test(line)
        ? { label: '', url: line } : { label: line, url: '' }; })
    /* A line with no link used to be thrown away here, so a slot that named
       "Track 2.1" and had no file showed the trainee nothing at all -- no
       player, no number, no clue which recording to find. Keep it: the number
       IS the instruction. It plays if there is a file, points at the course's
       audio folder if there is one, and otherwise simply says which track. */
    .filter(a => a.url || a.label);
  const folder = String((c.audio || {}).folder || '').trim();
  let players = '';
  if (audioLines.length && mine) {
    /* One block, its own label inside it. It used to be an empty labelled span
       followed by a separate div, which left the word "Audio" stranded on a
       line of its own above the player (Ramy, 4 Oct 2026: "it works but it's
       not positioned right"). */
    players = `<div class="auds"><div class="alab">Audio</div>` + audioLines.map((a, i) => {
      const name = esc(a.label || 'Track ' + (i + 1));
      const m = a.url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?[^"' ]*?id=)([\w-]{20,})/) || a.url.match(/[?&]id=([\w-]{25,})/);
      /* Drive's own /preview is a whole page -- 367px of black with the file
         name and a giant waveform -- and squeezing it into a bar cropped it
         through the middle (Ramy, 4 Oct 2026: "is it supposed to look like
         this, or did something get shifted?"). The download address serves the
         bytes with the right content type, so the card plays the track in its
         own controls instead, with the Drive link kept underneath for anyone
         whose network blocks it. It must be export=VIEW: export=download sends
         `content-disposition: attachment` and the browser saves the file
         instead of playing it (Ramy, 4 Oct 2026: "I downloaded the audio file,
         by the way"). */
      if (m) return `<figure class="aud"><figcaption>${name}</figcaption>
        <audio controls preload="metadata" src="https://drive.usercontent.google.com/download?id=${esc(m[1])}&amp;export=view"></audio>
        <a class="audalt" href="${esc(a.url)}" target="_blank" rel="noopener">open it in Drive</a></figure>`;
      if (/\.(mp3|m4a|ogg|wav|aac)([?#]|$)/i.test(a.url)) return `<figure class="aud"><figcaption>${name}</figcaption><audio controls preload="none" src="${esc(a.url)}"></audio></figure>`;
      if (a.url) return `<figure class="aud"><figcaption><a class="mlink" href="${esc(a.url)}" target="_blank" rel="noopener">${name}</a></figcaption></figure>`;
      /* no file of its own: the number, and the way to the folder if there is one */
      if (folder) return `<figure class="aud"><figcaption>${name} &middot; <a class="mlink" href="${esc(folder)}" target="_blank" rel="noopener">in the course audio</a></figcaption></figure>`;
      return `<figure class="aud"><figcaption>${name} <span class="audalt">play it from your own copy of the audio</span></figcaption></figure>`;
    }).join('') + `</div>`;
  } else if (audioLines.length) {
    audioLines.forEach((a, i) => { const nm = esc(a.label || 'Audio' + (audioLines.length > 1 ? ' ' + (i + 1) : ''));
      const href = a.url || folder;
      got.push(href ? `<a class="mlink audio" href="${esc(href)}" target="_blank" rel="noopener">${nm}</a>`
                    : `<span class="mlink audio">${nm}</span>`); });
  }

  /* The procedure. Ramy, 4 Oct 2026: they need "the procedure, what they're
     doing and how to do it, and obviously timing as well". The other two
     trainees' procedures are there as well -- he hands all three out on
     paper so everybody can see how the day joins up -- but folded, and only
     where they are shown at the foot of the page.

     A timing may be a RANGE ("5-7"), because a stage is not planned to the
     second; the clock adds the low ends and the high ends and says 42-50
     rather than inventing a single number. A FLEXI stage has no time of its
     own: it runs on whatever the others leave. */
  let proc = '';
  const stages = (c.stages || []).filter(s => s && (s.name || s.todo));
  if (stages.length) {
    const span = stages.reduce((a, s) => { const r = minSpan(s.minutes); return [a[0] + r[0], a[1] + r[1]]; }, [0, 0]);
    const total = span[0] === span[1] ? String(span[0]) : span[0] + '–' + span[1];
    const flexi = stages.filter(isFlexi).length;
    const body = `<ol>${stages.map(s => `<li${isFlexi(s) ? ' class="flexi"' : ''}><div class="pst"><b>${esc(s.name || 'Stage')}</b>${
        isFlexi(s) ? '<span class="pflex">if time allows</span>'
                   : (minSpan(s.minutes)[1] > 0 ? `<span class="pmin">${esc(String(s.minutes).replace(/\s*-\s*/, '–'))} min</span>` : '')}${
        s.interaction ? `<span class="pint">${esc(s.interaction)}</span>` : ''}</div>${
        s.todo ? `<div class="pdo">${esc(s.todo)}</div>` : ''}${
        s.avoid ? `<div class="pav">Watch out for: ${esc(s.avoid)}</div>` : ''}</li>`).join('')}</ol>
      ${span[1] ? `<p class="pclock">${total} minutes of stages${flexi ? ', and ' + (flexi === 1 ? 'one flexi stage' : flexi + ' flexi stages') + ' if the time is there' : ''}.</p>` : ''}`;
    proc = mine
      ? `<div class="proc"><div class="plab">The procedure${c.scaffold === 'guided' ? ' — the stages and the clock; the instructions are yours to write' : ''}</div>${body}</div>`
      : `<details class="proc ref"><summary>Their procedure</summary>${body}</details>`;
  }

  /* Sourcing, taught by being taken apart. Ramy, 4 Oct 2026, asking for a
     better way than pasting a reference at the bottom of the document: the
     first two practices show the book's own reference with each part named
     above it, so the pattern is visible rather than copied, and then the three
     cases a trainee actually meets — the book, a page adapted from it, and
     something found online. From TP 3 nothing appears and they write it. */
  let sources = '';
  const srcLines = mine ? String(c.sources || '').split(/\n+/).map(x => x.trim()).filter(Boolean) : [];
  if (srcLines.length) {
    sources = `<div class="src"><div class="plab">Sourcing your materials</div>
      <div class="srcpat"><span>Author<i>Maggs, P. &amp; Smith, C.</i></span><span>Year<i>(2019)</i></span><span>Title<i>Language Hub Elementary Student’s Book</i></span><span>Publisher<i>Macmillan</i></span></div>
      <p class="srcwhy">Every page you hand out says where it came from. That is the pattern — the book you are teaching from reads:</p>
      <ul class="srcrefs">${srcLines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>
      <p class="srcwhy">A page you changed: the same reference, after the words <b>Adapted from</b>. Something you found online: the title, the site, the full address and the date you took it. Something you wrote: <b>own material</b>.</p></div>`;
  }

  /* A classmate's block is a glance, not a document. Ramy, 4 Oct 2026: "they
     don't have to see it in detail — listening, speaking, the page, the
     exercises, that's enough." */
  if (!mine) { proc = ''; sources = ''; }
  if (!rowsHTML && !says.length && !got.length && !players && !proc && !sources) return '';
  const cls = 'mats-read' + (mine ? '' : ' ref');
  return rowsHTML
       + (says.length ? `<span class="${cls}">${says.join('<span class="sep">\u00b7</span>')}</span>` : '')
       + (got.length ? `<span class="${cls} gets"><span class="glab">Materials</span>${got.join('<span class="sep">\u00b7</span>')}</span>` : '')
       + players + proc + sources;
}

function render(){
  const app = $('app');
  /* A trainee opens this to find out what they are teaching, not to read
     about rotation (Ramy, 4 Oct 2026). The explanation stays for staff. */
  const head = `<p class="eyebrow">Teaching practice</p><h1>TP points</h1>${IS_TRAINEE ? '' :
    `<p class="lede">The lesson type for each trainee, TP 1 to ${TPS}. It rotates so nobody in a teaching set teaches the same type on the same day and each trainee covers six different types. Change any cell; the check below reads what is on the page, not what was generated. The last two TPs are the trainees\u2019 own on the planning grid.</p>`}`;

  if (IS_TRAINEE) {
    if (!P || !P.released) { app.innerHTML = head + `<div class="empty">Your tutor has not released the teaching practice points yet.</div>`; return; }
    const me = rec('hub:me') || {};
    const rows = P.points || {};
    /* THE SHAPE IS RAMY'S OWN DOCUMENT (his TP1ABC.docx, read block by block on
       30 Sep 2026 and rebuilt here on 1 Oct): a table per teaching day, ONE ROW
       PER TRAINEE -- slot, who, the lesson and what to get -- under a line
       naming the course, the practice, the set and the day.

       It used to be one row per practice, with "your lesson" in one column and
       everybody else's stacked into the next, which is what made a single box
       look like five lessons: "TP 1, and then you have reading, speaking,
       functional language, vocab and listening. Five lessons in one box. Why?"
       A trainee sits in on the other two lessons of their own day, so those
       belong on the same table as rows -- marked plainly as not theirs. */
    const sets = (P.sets || []).filter(x => Array.isArray(x) && x.length);
    const flat = sets.reduce((a, b) => a.concat(b), []);
    const LETTERS = 'ABCDEFGHIJKL';
    const letterOf = t => LETTERS[flat.indexOf(t)] || '';
    const mySet = sets.find(st => st.indexOf(me.token) !== -1) || (me.token ? [me.token] : []);
    const mySetIndex = sets.indexOf(mySet);
    const order = (st, tp) => { const n = st.length; if (!n) return st; const k = ((tp - 1) % n + n) % n; return st.slice(k).concat(st.slice(0, k)); };

    /* The day and the hours come from the course's own timetable, so the table
       says when as well as what. */
    const tt = rec('connect_timetable_v1') || {};
    const tpSlots = (tt.slots || []).filter(sl => sl && sl.kind === 'tp');
    const dayFor = tp => ((tt.days || []).find(d => d && Number(d.tp) === tp && (mySetIndex < 0 || Number(d.setIndex || 0) === mySetIndex)) || {}).date || '';
    const niceDay = d => { if (!d) return ''; try { return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { return d; } };
    const mins = (sl) => { const a = String(sl.from || '').match(/^(\d{1,2}):(\d{2})/), b = String(sl.to || '').match(/^(\d{1,2}):(\d{2})/); if (!a || !b) return 45; const d = (+b[1] * 60 + +b[2]) - (+a[1] * 60 + +a[2]); return d > 0 ? d : 45; };

    /* What a practice asks for in writing, which is the centre's call and not
       a fixed rule. The first practice is normally taught from the points
       alone; after that some centres want the lesson plan first and the
       language analysis a practice later, some the other way round (Ramy,
       4 Oct 2026). Unset, it behaves as every course did before: plan from 2,
       analysis from 3. */
    const PLAN_FROM = parseInt(SETTINGS.planFrom, 10) || 2;
    const ANALYSIS_FROM = parseInt(SETTINGS.analysisFrom, 10) || 3;
    function dueLine(tp){
      const plan = tp >= PLAN_FROM, ana = tp >= ANALYSIS_FROM;
      if (plan && ana) return `<p class="req">A lesson plan and a language analysis sheet for this one.</p>`;
      if (plan) return `<p class="req">A lesson plan for this one — the language analysis starts at TP ${ANALYSIS_FROM}.</p>`;
      if (ana) return `<p class="req">A language analysis sheet for this one — the lesson plan starts at TP ${PLAN_FROM}.</p>`;
      return `<p class="req first">Teach this one from the points above. Nothing to write: the lesson plan starts at TP ${PLAN_FROM} and the language analysis at TP ${ANALYSIS_FROM}.</p>`;
    }

    const lesson = c => {
      if (!c || !c.aim) return '<span class="dash">\u2014</span>';
      const lang = R.LANGUAGE_FOCUS.indexOf(c.aim) >= 0;
      return `<b class="aim${lang ? ' lang' : ''}">${esc(c.aim)}</b>`;
    };

    /* ONE PRACTICE AT A TIME. Ramy, 4 Oct 2026: "why is the trainee getting
       all six TPs in one view? They're supposed to only see what they're
       teaching for that TP." The one coming up is open; the ones already
       taught fold away but stay reachable, because a trainee rereads what
       they did before writing the next plan; the ones after the next are not
       there at all. The timetable decides which is which, so nobody has to
       release anything by hand. A course with no dates yet shows them all,
       rather than showing nothing. */
    const todayISO = (SETTINGS.demoToday || new Date().toISOString().slice(0, 10));
    const dated = Array.from({ length: TPS }, (_, i) => i + 1).map(tp => ({ tp: tp, date: dayFor(tp) }));
    const anyDates = dated.some(d => d.date);
    const upcoming = dated.filter(d => d.date && d.date >= todayISO).map(d => d.tp);
    const NEXT = upcoming.length ? upcoming[0] : (anyDates ? TPS : 0);
    const state = tp => {
      if (!anyDates) return 'open';
      if (tp === NEXT) return 'open';
      return tp < NEXT ? 'past' : 'later';
    };
    let hidden = 0;

    /* THE SHAPE OF A DAY. Ramy, 4 Oct 2026: "they will have their PDF first
       and then maybe at the very bottom of the page they will see what the
       other two are doing, so they don't get confused, but they can also just
       scroll down and see them." So the page opens with their own lesson and
       the pages they are teaching from, and the other two sit at the foot of
       it, watermarked, with their procedures folded.

       Where two of them are on the same page, each says so and names the
       exercises that are theirs, because the page is shared and the exercises
       are not. */
    const pageNums = c => { const out = []; String((c.book || {}).ref || '').replace(/\bpp?\.?\s*(\d{1,3})/gi, (_, n) => { out.push(n); return _; }); return out; };

    const tables = Array.from({ length: TPS }, (_, i) => i + 1).map(tp => {
      const teaching = order(mySet, tp);
      const date = dayFor(tp);
      if (!teaching.some(t => ((rows[t] || {})['tp' + tp] || {}).aim)) return '';
      if (state(tp) === 'later') { hidden++; return ''; }

      const cellOfT = t => (rows[t] || {})['tp' + tp] || {};
      const myIdx = teaching.indexOf(me.token);
      const mineCell = myIdx >= 0 ? cellOfT(teaching[myIdx]) : null;
      const myPages = mineCell ? pageNums(mineCell) : [];

      const slotTime = i => { const sl = tpSlots[i] || {}; return sl.from ? esc(sl.from) + (sl.to ? '–' + esc(sl.to) : '') : ''; };

      /* exercise lines a trainee is doing, pulled out so a shared page can
         show both sides of it. */
      const exOf = c => String((c.book || {}).ref || '').split(/\n+/)
        .map(x => x.trim()).filter(x => /^(Reading|Listening|Grammar|Vocabulary|Speaking|Pronunciation|Functional language):/.test(x));

      const mineBlock = !mineCell ? '' : `<div class="mine-block">
        <p class="whoami"><b>Your lesson</b>${slotTime(myIdx) ? ' · ' + slotTime(myIdx) : ''} · slot ${myIdx + 1} of ${teaching.length}<button type="button" class="printme" onclick="window.print()">Print this</button><button type="button" class="printme" onclick="printPages()">Print the pages</button>${
          mineCell && mineCell.dayPdf && mineCell.dayPdf.url ? `<a class="printme pdf" href="${esc(mineCell.dayPdf.url)}" target="_blank" rel="noopener">The day’s pages as a PDF</a>` : ''}</p>
        <div class="lessonline">${lesson(mineCell)}</div>
        ${matsRead(mineCell, true)}
        ${pageFigures(mineCell, true)}
        ${glossary(tp)}
      </div>`;

      const others = teaching.map((t, i) => ({ t: t, i: i })).filter(x => x.t !== me.token).map(x => {
        const c = cellOfT(x.t);
        const shared = pageNums(c).filter(n => myPages.indexOf(n) >= 0);
        return `<div class="other-block">
          <p class="whoami"><b>Trainee ${esc(letterOf(x.t))}</b>${slotTime(x.i) ? ' · ' + slotTime(x.i) : ''} · slot ${x.i + 1}<span class="nots">not yours</span></p>
          ${shared.length ? `<p class="shared">You are both on page ${esc(shared.join(' and '))}. They are doing ${exOf(c).map(e => esc(e)).join('; ') || 'their own exercises'} — you are doing ${exOf(mineCell || {}).map(e => esc(e)).join('; ') || 'yours'}.</p>` : ''}
          <div class="lessonline">${lesson(c)}</div>
          ${matsRead(c, false)}
          ${pageFigures(c, false)}
        </div>`;
      }).join('');

      const past = state(tp) === 'past';
      return `<section class="day${past ? ' past' : ''}">
        ${past ? '<details><summary>' : ''}
        <p class="dayline">${esc(SETTINGS.courseName || 'CELTA')} · <b>TP ${tp} · ${esc(teaching.map(letterOf).join(''))}</b>${date ? ' · ' + esc(niceDay(date)) : ''} · ${teaching.length} × ${mins(tpSlots[0] || {})} mins${
          (function(){ const c = teaching.map(t => cellOfT(t).context).find(Boolean); return c ? ' · <b>' + esc(c) + '</b>' : ''; })()}</p>
        ${past ? '</summary>' : ''}
        ${mineBlock}
        ${dueLine(tp)}
        ${others ? `<section class="others"><h3>What the other two are teaching</h3>
          <p class="othersnote">The same day, the same class. You sit in on these — they are not yours to plan.</p>${others}</section>` : ''}
        ${past ? '</details>' : ''}
      </section>`;
    }).filter(Boolean).join('');

    app.innerHTML = head + `<section class="group"><h2>Group ${esc(P.group || '\u2014')}</h2>
      <p class="ok">Your lesson first, with the pages you are teaching from. What the other two are teaching is at the foot of the day.</p>
      ${tables || '<div class="empty">No points released for your set yet.</div>'}
      </section>`;
    return;
  }

  const gs = groups();
  if (!gs.length) { app.innerHTML = head + `<div class="empty">No trainees on the roster yet.</div>`; return; }
  /* "Has it been built?" is a question about CONTENT, not about whether a key
     exists. The store answers a course with no points as { groups:{} }, and an
     empty object is truthy -- so testing `P.groups` showed the grid instead of
     the build button, rendered every cell blank, and then printed the
     all-clear underneath because the checks had nothing to fail on (found
     testing on the scratch course, 29 Sep 2026). A rotation counts as built
     only when every trainee on the roster has a row. */
  /* Where the variety has to be, and where it does not. Ramy, 4 Oct 2026,
     correcting a check that cried wolf: "the first TPs they get different
     aims ... a balance of language and skills. Once they start the second half
     of the course, it's fine to repeat — maybe they did grammar in TP1 or TP2,
     they can do grammar again." A failed lesson is MEANT to come back in the
     same family, and anything a trainee has not met by TP 6 is theirs to
     choose on TP 7 or 8. So the early repeat is a warning, and a family never
     met is a note that says where to put it, not an alarm. The language-focus
     MUST is checked separately and is unchanged. */
  const HALF = Math.max(2, Math.ceil(TPS / 2));
  function earlyRepeats(flat){
    const out = [];
    Object.keys(flat || {}).forEach(t => {
      const seen = {}, again = [];
      for (let tp = 1; tp <= HALF; tp++) {
        const a = flat[t]['tp' + tp];
        if (!a) continue;
        if (seen[a]) again.push({ aim: a, first: seen[a], then: tp }); else seen[a] = tp;
      }
      if (again.length) out.push({ token: t, again: again });
    });
    return out;
  }
  function familiesNotMet(flat){
    const out = [];
    Object.keys(flat || {}).forEach(t => {
      const fams = {};
      for (let tp = 1; tp <= TPS; tp++) { const f = R.familyOf(flat[t]['tp' + tp]); if (f) fams[f] = 1; }
      const missing = ['language', 'receptive', 'productive'].filter(f => !fams[f]);
      if (missing.length) out.push({ token: t, missing: missing });
    });
    return out;
  }

  const built = P && P.groups && gs.every(g => {
    const rows = P.groups[g.group] || {};
    return g.people.length && g.people.every(t => rows[t.token] && Object.keys(rows[t.token]).length);
  });
  if (!built) {
    app.innerHTML = head + setBar() + `<div class="relbar"><button class="btn" id="build">Build the rotation</button><span class="status">${Object.keys(library()).length ? 'Deals the trainees into their set’s slots, and generates a type wherever the set is silent.' : 'Works out the lesson type for every trainee across TP 1 to ' + TPS + '.'}</span></div>`;
    $('build').addEventListener('click', () => build(false));
    wireSetBar();
    return;
  }

  app.innerHTML = head + setBar() + `<div class="relbar"><button class="btn quiet" id="rebuild">Rebuild</button><span class="status">${esc(note)}</span></div>` + gs.map(g => {
    const rows = (P.groups || {})[g.group] || {};
    const lettered = R.lettersFor(g.people);
    const sets = R.setsFor(g.people);
    const on = !!((P.released || {})[g.group]);
    /* The check reads the page, so a tutor's override that removes somebody's
       only language lesson is caught. */
    const flat = {}; Object.keys(rows).forEach(t => { flat[t] = {}; for (let tp=1;tp<=TPS;tp++) flat[t]['tp'+tp] = (rows[t]['tp'+tp]||{}).aim; });
    const noLang = R.languageFocusCheck(flat, TPS).map(t => (lettered.find(p => p.token === t) || {}).letter).filter(Boolean);
    const clash = R.clashes(flat, sets, TPS);
    /* The centre's own recommendation, not Cambridge's: after a practice
       graded Not to standard, the next should be in the same family. It is a
       note, never red and never a gate -- a "should" is a recommendation and
       the call stays the centre's. */
    const after = R.afterFail(taughtSoFar(g.people), flat, TPS);
    const letterOf = t => (lettered.find(p => p.token === t) || {}).letter || '?';
    return `<section class="group"><h2>Group ${esc(g.group || '—')} <small>${g.people.length} trainee${g.people.length===1?'':'s'}</small></h2>
      <p class="sets">Teaching sets: ${sets.map(s => '<b>' + esc(R.setName(s)) + '</b>').filter(Boolean).join(' and ')} — they take alternate days, so each trainee teaches every other day.</p>
      <div class="wrap"><table class="tbl ord stack"><tr><th>Teaching order</th>${Array.from({length:TPS},(_,i)=>`<th>TP ${i+1}</th>`).join('')}</tr>
        ${sets.filter(st => st.length).map(st => `<tr><td class="who">${esc(R.setName(st))}</td>${
          Array.from({length:TPS},(_,i)=>i+1).map(tp => `<td data-lab="TP ${tp}"><span class="ord">${esc(R.orderFor(st, tp).map(x => x.letter).join(' '))}</span></td>`).join('')}</tr>`).join('')}</table></div>
      <div class="relbar">${on
        ? `<span class="chip on">Released</span><button class="btn quiet" data-rel="${esc(g.group)}" data-on="0">Take it back</button><span class="status">The trainees can see their own points.</span>`
        : `<span class="chip">Not released</span><button class="btn" data-rel="${esc(g.group)}" data-on="1">Release to Group ${esc(g.group) || '—'}</button><span class="status">Only tutors can see it until it is released.</span>`}</div>
      <div class="wrap"><table class="tbl stack"><tr><th>Trainee</th>${Array.from({length:TPS},(_,i)=>`<th>TP ${i+1}</th>`).join('')}</tr>
      ${lettered.map(p => `<tr><td class="who">${esc(p.letter)}<small>${esc(p.name||'')}</small></td>${
        Array.from({length:TPS},(_,i)=>i+1).map(tp => {
          const c = (rows[p.token] || {})['tp'+tp] || {};
          const has = !!(c.point || c.sub || c.framework || (c.pages||[]).length || (c.book||{}).url || (c.book||{}).ref || (c.audio||{}).url);
          return `<td data-lab="TP ${tp}"><select data-g="${esc(g.group)}" data-t="${esc(p.token)}" data-tp="${tp}">${
            R.AIMS.map(a => `<option value="${esc(a)}"${c.aim===a?' selected':''}>${esc(a)}</option>`).join('')}</select>
            <button type="button" class="mbtn${has?' has':''}" data-mats="${esc(MKEY(g.group, p.token, tp))}" title="Pages, coursebook and audio">${has ? 'Materials \u2713' : 'Materials'}</button></td>`;
        }).join('')}</tr>`).join('')}</table></div>
      ${noLang.length ? `<div class="warn"><b>Handbook 9.1.2:</b> a centre must include language-focus lessons for every trainee. ${noLang.length===1?'Trainee':'Trainees'} ${esc(noLang.join(', '))} ${noLang.length===1?'has':'have'} none in TP 1 to ${TPS}. Grammar, vocabulary and functional language are the language-focus types.</div>` : ''}
      ${clash.length ? `<div class="warn"><b>Same type, same day:</b> ${clash.map(c => 'TP ' + c.tp + ' — ' + esc(c.set) + ' — ' + esc(c.aim)).join('; ')}. They teach on the same day, so two of them would be teaching the same thing.</div>` : ''}
      ${(function(){ const r = earlyRepeats(flat); if (!r.length) return '';
        return `<div class="warn"><b>The same aim twice in the first ${HALF}:</b> ${r.map(x =>
          esc(letterOf(x.token)) + ' teaches ' + x.again.map(a => esc(a.aim) + ' at TP ' + a.first + ' and TP ' + a.then).join(', ')).join('; ')}.
          Early TPs are where the spread matters — a repeat later in the course is fine, and a lesson that was not to standard is meant to come back.</div>`; })()}
      ${OPEN && OPEN.split('|')[0] === g.group ? (function(){
        const [, t, tp] = OPEN.split('|');
        const who = lettered.find(x => x.token === t) || {};
        return matsPanel(g.group, t, tp, who.letter || '?', who.name || '');
      })() : ''}
      ${after.length ? `<div class="sugg"><b>After a lesson that was not to standard</b> — the centre’s own recommendation, not a Cambridge rule.<ul>${
        after.map(a => `<li>${esc(letterOf(a.token))} was not to standard on TP ${a.failed} (${esc(a.failedAim)}). TP ${a.next} is ${esc(a.nextAim || 'not set')}; another ${esc(a.familyWord)} lesson would give them a second go at it — ${esc(a.suggest.join(', '))}.</li>`).join('')}</ul></div>` : ''}
      ${(function(){ const n = familiesNotMet(flat); if (!n.length) return '';
        const word = { language: 'a language-focus lesson', receptive: 'a receptive-skills lesson', productive: 'a productive-skills lesson' };
        return `<div class="sugg"><b>Not met by TP ${TPS}</b> — a note, not a problem: TP 7 and TP 8 are the trainees’ own, and this is what they are for.<ul>${
          n.map(x => `<li>${esc(letterOf(x.token))} has not taught ${x.missing.map(f => esc(word[f] || f)).join(' or ')}.</li>`).join('')}</ul></div>`; })()}
      ${(!noLang.length && !clash.length && !earlyRepeats(flat).length && Object.keys(flat).length) ? `<p class="ok">Every trainee has a language-focus lesson, nobody repeats an aim in the first ${HALF} TPs, and nobody in a teaching set teaches the same type on the same day.</p>` : ''}
    </section>`;
  }).join('');

  if ($('rebuild')) $('rebuild').addEventListener('click', () => build(true));   // same: no confirm, see wireSetBar
  wireSetBar();
  document.querySelectorAll('select[data-tp]').forEach(el => el.addEventListener('change', () => {
    const { g, t, tp } = el.dataset;
    P.groups[g] = P.groups[g] || {}; P.groups[g][t] = P.groups[g][t] || {};
    P.groups[g][t]['tp'+tp] = { aim: el.value, edited: true };
    persist('Saved');
  }));
  document.querySelectorAll('button[data-mats]').forEach(el => el.addEventListener('click', () => {
    OPEN = (OPEN === el.dataset.mats) ? null : el.dataset.mats; render();
  }));
  wireMats();
  document.querySelectorAll('button[data-rel]').forEach(el => el.addEventListener('click', () => {
    P.released = P.released || {};
    P.released[el.dataset.rel] = el.dataset.on === '1';
    persist(el.dataset.on === '1' ? 'Released' : 'Taken back');
  }));
}

render();
</script>
</body>
</html>
