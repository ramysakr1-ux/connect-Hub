<!DOCTYPE html>
<!--
  Connect Lite — teaching practice points
  © 2026 Ramy Sakr. All rights reserved.

  Handbook 9.1.2, a MUST twice over: "Centres must ensure that all candidates
  have practice in a range of lessons covering all aspects of language
  teaching and must include language-focus lessons. The type of lesson must be
  recorded in the CELTA 5."

  A centre satisfies that by rotating the lesson types round the group instead
  of letting them fall where they may. Ramy, 29 Sep 2026: "TP points that
  rotate automatically, depending on aims and different order for the
  teachers." The rotation lives in hub-rotation.js and is explained there; in
  short, each candidate starts at their own place in the seven types and steps
  one along each practice, so nobody in a teaching set teaches the same type on
  the same day, each candidate's six practices are six different types, and
  every one of them includes language focus by construction rather than by
  luck.

  It is a PROPOSAL. Every cell is the tutor's to change, which is the standing
  rule that anything the system decides can be overridden — and because an
  override can break what the rotation guaranteed, the language-focus check
  runs against what is actually on the page, not against what was generated.

  Released per group, the same way the planning grid is: the candidates see
  their own group's points and nothing before release.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">

<title>Connect Lite — TP points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(98.8% 0.006 85); --sand-line:oklch(85.5% 0.02 80); --sand-deep:oklch(94.8% 0.01 85);
    --paper:oklch(99.5% 0.004 90); --surface:oklch(95.2% 0.018 84);
    --box:oklch(91.2% 0.03 80); --card:oklch(95.2% 0.018 84); --ink:oklch(23.5% 0.017 65);
    --teal:oklch(37.5% 0.058 195); --grey:oklch(51% 0.017 70); --brick:oklch(45% 0.15 27);
    --gold:oklch(63% 0.096 72); --gold-deep:oklch(52% 0.098 70); --faint:oklch(60% 0.012 80);
  }
  body{background:var(--sand); color:var(--ink); font-family:'Karla',sans-serif; margin:0;}
  .board{max-width:1120px; margin:0 auto; padding:26px 20px 80px;}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .eyebrow{font-size:0.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--grey); font-weight:700; margin:0 0 4px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.7rem; margin:0 0 4px;}
  .lede{color:var(--grey); font-size:0.88rem; line-height:1.6; margin:0 0 18px; max-width:72ch;}
  section.group{background:var(--surface); border:1px solid var(--sand-line); border-left:5px solid var(--teal); border-radius:10px; padding:16px 18px 18px; margin:0 0 18px;}
  section.group h2{font-family:'Newsreader',Georgia,serif; font-size:1.2rem; margin:0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  section.group h2 small{font-family:'Karla',sans-serif; font-size:0.8rem; font-weight:500; color:var(--grey);}
  .sets{font-size:0.8rem; color:var(--grey); margin:4px 0 0;}
  .relbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0 14px;}
  .btn{font-family:'Karla',sans-serif; font-size:0.84rem; font-weight:700; padding:9px 18px; border-radius:8px; border:0; background:var(--teal); color:#fff; cursor:pointer;}
  .btn.quiet{background:none; color:var(--grey); border:1.5px solid var(--sand-line);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .chip{font-size:0.72rem; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--box); color:var(--grey);}
  .chip.on{background:var(--teal); color:#fff;}
  .status{font-size:0.8rem; color:var(--grey);}
  .tbl{width:100%; border-collapse:collapse; font-size:0.8rem; background:var(--paper); border:1px solid var(--sand-line); border-radius:8px; overflow:hidden;}
  .tbl th,.tbl td{border:1px solid var(--sand-line); padding:6px 8px; text-align:left; vertical-align:top;}
  .tbl th{background:var(--box); font-size:0.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--grey);}
  .tbl td.who{white-space:nowrap; font-weight:700;}
  .tbl td.who small{display:block; font-weight:500; color:var(--grey); font-size:0.72rem;}
  .tbl select{font-family:inherit; font-size:0.76rem; width:100%; padding:3px 4px; border:1px solid var(--sand-line); border-radius:5px; background:var(--paper); color:var(--ink);}
  .tbl .lang{color:var(--gold-deep); font-weight:700;}
  .tbl .ref{color:var(--grey); font-style:italic;}
  .tbl tr.mine{background:var(--sand-deep);}
  .warn{margin:10px 0 0; padding:10px 12px; border-radius:7px; background:oklch(94.5% 0.035 78); border:1px solid oklch(84% 0.08 78); border-left:4px solid var(--gold); font-size:0.82rem; line-height:1.5;}
  .ok{margin:10px 0 0; font-size:0.78rem; color:var(--grey);}
  .empty{background:var(--surface); border:1px dashed var(--sand-line); border-radius:10px; padding:26px 22px; color:var(--grey); font-size:0.9rem; line-height:1.6;}
  .sugg{margin:10px 0 0; padding:10px 12px; border-radius:7px; background:var(--sand-deep); border:1px solid var(--sand-line); border-left:4px solid var(--teal); font-size:0.82rem; line-height:1.55;}
  .sugg ul{margin:6px 0 0; padding-left:20px;}
  .sugg li{margin:3px 0;}
  .tbl.ord{margin:0 0 12px;}
  .tbl.ord td{font-weight:700; letter-spacing:.08em;}
  .wrap{overflow-x:auto;}
  @media (max-width:560px){ .board{padding:18px 12px 60px;} section.group{padding:12px 12px 14px;} }
  @media print{ .back,.relbar,#hubSync{display:none !important;} body{background:#fff;} }
</style>
<link rel="stylesheet" href="hub-house.css?v=202609292358">
<link rel="stylesheet" href="hub-theme.css?v=202609292358">
</head>
<body class="hub-grid">
<div class="board">
  <a class="back" id="back" href="index.html">&larr; Back</a>
  <div id="app"></div>
</div>
<script src="hub-due.js?v=202609292358"></script>
<script src="hub-tracker.js?v=202609292358"></script>
<script src="hub-rotation.js?v=202609292358"></script>
<script src="hub-shared.js?v=202609292358"></script>
<script src="hub-store.js?v=202609292358"></script>
<script src="hub-sync.js?v=202609292358"></script>
<script type="text/x-hub-app">
const MODE = window.HubMode;
const IS_TRAINEE = MODE === 'trainee', IS_TUTOR = MODE === 'tutor';
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const SETTINGS = rec('connect_course_settings') || {};
const KEY = 'connect_tp_points_v1';
const R = window.hubRotation;
/* The last two practices are the candidates' own, on the planning grid, so
   the rotation covers everything before them. */
const TOTAL = parseInt(SETTINGS.tpCount, 10) || 8;
const TPS = Math.max(1, TOTAL - 2);
$('back').href = IS_TRAINEE ? 'index.html' : IS_TUTOR ? '5_tutor_dashboard.html' : '12_assessor_pack.html';

let P = rec(KEY) || null;
let note = '';

function groups(){
  const roster = rec('connect_roster_v1') || {};
  const people = Object.values(roster.trainees || {}).filter(Boolean);
  const by = {};
  /* The roster in this browser keys a candidate by `id`, not `token` -- the
     store's own roster op says token, hub-sync writes id, and the planning
     grid has always read id. Reading t.token gave every candidate the key
     `undefined`, so one shared row stood in for the whole group and the
     rotation came out identical for everybody (found on the scratch course,
     29 Sep 2026). */
  people.forEach(t => { const g = String(t.group || ''); (by[g] = by[g] || []).push({ token: t.id || t.token, name: t.name, group: g, tr: t }); });
  return Object.keys(by).sort().map(g => ({ group: g, people: by[g] }));
}

/* What each candidate has already taught and how it went, read from the
   returned feedback the tracker already reads. { token: { 3: {grade,aim} } }.
   This is what the failed-lesson rule works on. */
function taughtSoFar(people){
  const T = window.HubTracker;
  const out = {};
  (people || []).forEach(p => {
    if (!T || !p.tr) return;
    let c = null; try { c = T.recordFor(p.tr); } catch(e) { return; }
    if (!c) return;
    const mine = {};
    for (let n = 1; n <= TOTAL; n++) {
      const g = c['tp' + n], a = c['tp' + n + '_aim'];
      if (g || a) mine[n] = { grade: g || '', aim: a || '' };
    }
    if (Object.keys(mine).length) out[p.token] = mine;
  });
  return out;
}

/* Build or rebuild the rotation. The second group starts three places along,
   so two groups running in parallel never teach the same type on the same
   day. Anything a tutor has already changed is kept. */
function build(keepEdits){
  const gs = groups();
  const out = { groups: {}, released: (P && P.released) || {}, sets: {} };
  gs.forEach((g, i) => {
    const r = R.rotate(g.people, { tps: TPS, groupOffset: i * 3 });
    const rows = {};
    Object.keys(r.rows).forEach(token => {
      rows[token] = {};
      for (let tp = 1; tp <= TPS; tp++) {
        const was = keepEdits && P && P.groups && P.groups[g.group] && P.groups[g.group][token] && P.groups[g.group][token]['tp'+tp];
        rows[token]['tp'+tp] = (was && was.edited) ? was : { aim: r.rows[token]['tp'+tp] };
      }
    });
    out.groups[g.group] = rows;
    out.sets[g.group] = r.sets.map(s => s.map(p => p.token));
  });
  P = out;
  persist('Rotation built');
}

function persist(word){
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {}
  note = word || 'Saved';
  render();
  setTimeout(() => { if (note === word) { note = ''; const s = document.querySelector('.status'); if (s) s.textContent = ''; } }, 2500);
}

function render(){
  const app = $('app');
  const head = `<p class="eyebrow">Teaching practice</p><h1>TP points</h1>
    <p class="lede">${IS_TRAINEE
      ? 'What you are teaching, practice by practice. The type rotates round your group so everybody covers the full range, and every candidate teaches at least one language-focus lesson — Cambridge asks for both.'
      : 'The lesson type for each candidate, practices 1 to ' + TPS + '. It rotates so nobody in a teaching set teaches the same type on the same day and each candidate covers six different types. Change any cell; the check below reads what is on the page, not what was generated. The last two practices are the candidates’ own on the planning grid.'}</p>`;

  if (IS_TRAINEE) {
    if (!P || !P.released) { app.innerHTML = head + `<div class="empty">Your tutor has not released the teaching practice points yet.</div>`; return; }
    const me = rec('hub:me') || {};
    const rows = P.points || {};
    const mine = rows[me.token] || {};
    /* The rest of the group, marked as what it is. Ramy, 29 Sep 2026: a
       candidate should see the other two's lessons "but it will state that
       this is not your lesson, just for reference" -- they sit in on those
       lessons, so knowing what is coming is part of the day. Names are not
       carried to a candidate (the store sends the group's rows without them),
       so the others are shown by their letter. */
    const others = Object.keys(rows).filter(t => t !== me.token);
    app.innerHTML = head + `<section class="group"><h2>Group ${esc(P.group || '\u2014')}</h2>
      <div class="wrap"><table class="tbl"><tr><th>Practice</th><th>Your lesson</th>${others.length ? '<th>Also teaching that day \u2014 not your lesson</th>' : ''}</tr>
      ${Array.from({length:TPS},(_,i)=>i+1).map(tp => {
        const c = mine['tp'+tp] || {};
        const lang = R.LANGUAGE_FOCUS.indexOf(c.aim) >= 0;
        const ref = others.map(t => (rows[t] || {})['tp'+tp] || {}).map(x => x.aim).filter(Boolean);
        return `<tr><td class="who">TP ${tp}</td><td${lang ? ' class="lang"' : ''}>${esc(c.aim || '\u2014')}${c.point ? '<br><small>' + esc(c.point) + '</small>' : ''}</td>${
          others.length ? `<td class="ref">${ref.length ? esc(ref.join(' \u00b7 ')) : '\u2014'}</td>` : ''}</tr>`;
      }).join('')}</table></div>
      ${others.length ? '<p class="ok">The last column is what the rest of your group is teaching. You are watching those lessons, not planning them.</p>' : ''}</section>`;
    return;
  }

  const gs = groups();
  if (!gs.length) { app.innerHTML = head + `<div class="empty">No candidates on the roster yet.</div>`; return; }
  /* "Has it been built?" is a question about CONTENT, not about whether a key
     exists. The store answers a course with no points as { groups:{} }, and an
     empty object is truthy -- so testing `P.groups` showed the grid instead of
     the build button, rendered every cell blank, and then printed the
     all-clear underneath because the checks had nothing to fail on (found
     testing on the scratch course, 29 Sep 2026). A rotation counts as built
     only when every candidate on the roster has a row. */
  const built = P && P.groups && gs.every(g => {
    const rows = P.groups[g.group] || {};
    return g.people.length && g.people.every(t => rows[t.token] && Object.keys(rows[t.token]).length);
  });
  if (!built) {
    app.innerHTML = head + `<div class="relbar"><button class="btn" id="build">Build the rotation</button><span class="status">Works out the lesson type for every candidate across practices 1 to ${TPS}.</span></div>`;
    $('build').addEventListener('click', () => build(false));
    return;
  }

  app.innerHTML = head + `<div class="relbar"><button class="btn quiet" id="rebuild">Rebuild</button><span class="status">${esc(note)}</span></div>` + gs.map(g => {
    const rows = (P.groups || {})[g.group] || {};
    const lettered = R.lettersFor(g.people);
    const sets = R.setsFor(g.people);
    const on = !!((P.released || {})[g.group]);
    /* The check reads the page, so a tutor's override that removes somebody's
       only language lesson is caught. */
    const flat = {}; Object.keys(rows).forEach(t => { flat[t] = {}; for (let tp=1;tp<=TPS;tp++) flat[t]['tp'+tp] = (rows[t]['tp'+tp]||{}).aim; });
    const noLang = R.languageFocusCheck(flat, TPS).map(t => (lettered.find(p => p.token === t) || {}).letter).filter(Boolean);
    const clash = R.clashes(flat, sets, TPS);
    /* The centre's own recommendation, not Cambridge's: after a practice
       graded Not to standard, the next should be in the same family. It is a
       note, never red and never a gate -- a "should" is a recommendation and
       the call stays the centre's. */
    const after = R.afterFail(taughtSoFar(g.people), flat, TPS);
    const letterOf = t => (lettered.find(p => p.token === t) || {}).letter || '?';
    return `<section class="group"><h2>Group ${esc(g.group || '—')} <small>${g.people.length} candidate${g.people.length===1?'':'s'}</small></h2>
      <p class="sets">Teaching sets: ${sets.map(s => '<b>' + esc(R.setName(s)) + '</b>').filter(Boolean).join(' and ')} — they take alternate days, so each candidate teaches every other day.</p>
      <div class="wrap"><table class="tbl ord"><tr><th>Teaching order</th>${Array.from({length:TPS},(_,i)=>`<th>TP ${i+1}</th>`).join('')}</tr>
        ${sets.filter(st => st.length).map(st => `<tr><td class="who">${esc(R.setName(st))}</td>${
          Array.from({length:TPS},(_,i)=>i+1).map(tp => `<td>${esc(R.orderFor(st, tp).map(x => x.letter).join(' '))}</td>`).join('')}</tr>`).join('')}</table></div>
      <div class="relbar">${on
        ? `<span class="chip on">Released</span><button class="btn quiet" data-rel="${esc(g.group)}" data-on="0">Take it back</button><span class="status">The candidates can see their own points.</span>`
        : `<span class="chip">Not released</span><button class="btn" data-rel="${esc(g.group)}" data-on="1">Release to Group ${esc(g.group) || '—'}</button><span class="status">Only tutors can see it until it is released.</span>`}</div>
      <div class="wrap"><table class="tbl"><tr><th>Candidate</th>${Array.from({length:TPS},(_,i)=>`<th>TP ${i+1}</th>`).join('')}</tr>
      ${lettered.map(p => `<tr><td class="who">${esc(p.letter)}<small>${esc(p.name||'')}</small></td>${
        Array.from({length:TPS},(_,i)=>i+1).map(tp => {
          const c = (rows[p.token] || {})['tp'+tp] || {};
          return `<td><select data-g="${esc(g.group)}" data-t="${esc(p.token)}" data-tp="${tp}">${
            R.AIMS.map(a => `<option value="${esc(a)}"${c.aim===a?' selected':''}>${esc(a)}</option>`).join('')}</select></td>`;
        }).join('')}</tr>`).join('')}</table></div>
      ${noLang.length ? `<div class="warn"><b>Handbook 9.1.2:</b> a centre must include language-focus lessons for every candidate. ${noLang.length===1?'Candidate':'Candidates'} ${esc(noLang.join(', '))} ${noLang.length===1?'has':'have'} none in practices 1 to ${TPS}. Grammar, vocabulary and functional language are the language-focus types.</div>` : ''}
      ${clash.length ? `<div class="warn"><b>Same type, same day:</b> ${clash.map(c => 'TP ' + c.tp + ' — ' + esc(c.set) + ' — ' + esc(c.aim)).join('; ')}. They teach on the same day, so two of them would be teaching the same thing.</div>` : ''}
      ${after.length ? `<div class="sugg"><b>After a lesson that was not to standard</b> — the centre’s own recommendation, not a Cambridge rule.<ul>${
        after.map(a => `<li>${esc(letterOf(a.token))} was not to standard on TP ${a.failed} (${esc(a.failedAim)}). TP ${a.next} is ${esc(a.nextAim || 'not set')}; another ${esc(a.familyWord)} lesson would give them a second go at it — ${esc(a.suggest.join(', '))}.</li>`).join('')}</ul></div>` : ''}
      ${(!noLang.length && !clash.length && Object.keys(flat).length) ? `<p class="ok">Every candidate has at least one language-focus lesson, and nobody in a teaching set repeats a type on the same day.</p>` : ''}
    </section>`;
  }).join('');

  if ($('rebuild')) $('rebuild').addEventListener('click', () => { if (confirm('Rebuild the rotation? Cells you changed by hand are kept.')) build(true); });
  document.querySelectorAll('select[data-tp]').forEach(el => el.addEventListener('change', () => {
    const { g, t, tp } = el.dataset;
    P.groups[g] = P.groups[g] || {}; P.groups[g][t] = P.groups[g][t] || {};
    P.groups[g][t]['tp'+tp] = { aim: el.value, edited: true };
    persist('Saved');
  }));
  document.querySelectorAll('button[data-rel]').forEach(el => el.addEventListener('click', () => {
    P.released = P.released || {};
    P.released[el.dataset.rel] = el.dataset.on === '1';
    persist(el.dataset.on === '1' ? 'Released' : 'Taken back');
  }));
}

render();
</script>
</body>
</html>
