<!DOCTYPE html>
<!--
  The last page — what a trainee finds at the end of the course.
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 23 Oct 2026: "design something for the end of course ... someone who
  finished, what would Lite do to this person?" Then, on the design ("The last
  page", artifact CU5mMPTqqii3uXqjk4mHuj):
    - NO GRADE and nothing about passing: "congratulations on finishing TP8 ...
      or finishing the course". The grade is Cambridge's and the center's.
    - the class photo, put up once by a tutor (a Zoom screenshot is fine),
      framed, and on a card the trainee can download or print.
    - "How far you came": TP1's first point to work on beside what worked in
      the last TP.
    - "What people said about you": ONE short warm phrase per person, half a
      sentence is fine, from anything written on the course, signed by
      whoever wrote it. Nothing positive found: the section is left out. No
      generic line from Lite.

  ONE FILE, TWO SIDES. A trainee's link draws their own page from their own
  records. A tutor's link with no trainee draws the tutor's side: the class
  photo and, for each trainee, the phrases to choose from. A tutor's link with
  ?trainee=<id> shows that trainee's page as they will see it.

  WHERE IT IS KEPT. The course settings, which every page already reads:
  settings.classPhoto = { src: <jpeg data URI>, at } and
  settings.lastWords = { <token>: [ { text, by, role, from } ] }. The store
  splits a large settings record over several cells, so the photo fits.
-->

<style>

  .present .tag{font:700 10.5px 'Instrument Sans',sans-serif; letter-spacing:.2em; text-transform:uppercase; color:oklch(33% 0.05 70); background:oklch(98% 0.02 90 / .55); border-radius:999px; padding:6px 11px;}
  .present h2{position:relative; font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:2.3rem; line-height:1.08; letter-spacing:-.01em; margin:0 0 12px; color:oklch(26% 0.025 65);}

  .present .soft.done{background:var(--a-forest); color:var(--paper);}

  @media (max-width:560px){ .present{padding:26px 22px 24px;} .present h2{font-size:1.85rem;} .present .arcs{width:190px;} .present input.pmail{min-width:0; width:100%;} }
  @media print{ .present{display:none;} }

<script type="text/x-hub-app">
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose — this is one of the course’s own pages.');

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const P = new URLSearchParams(location.search);
const IS_TRAINEE = !!(window.HubStore && HubStore.isTrainee && HubStore.isTrainee());
const IS_TUTOR = !!(window.HubStore && HubStore.isTutor && HubStore.isTutor());
const VIEW_ID = !IS_TRAINEE ? (P.get('trainee') || '') : '';
const KEYQ = ['t','k','ak'].filter(n => P.get(n)).map(n => n + '=' + encodeURIComponent(P.get(n))).join('&');
const S = () => rec('connect_course_settings') || {};
const ROSTER = () => (rec('connect_roster_v1') || {}).trainees || {};
const T = window.HubTracker;

const MARK = (w, sw, a, b) => '<svg viewBox="8 28 104 64" width="' + w + '" fill="none" aria-hidden="true"><path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="' + a + '" stroke-width="' + sw + '" stroke-linecap="round"></path><path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="' + b + '" stroke-width="' + sw + '" stroke-linecap="round"></path></svg>';
const dateOf = s => { try { return window.hubDateOf ? hubDateOf(s) : new Date(s); } catch (e) { return null; } };
const day = (s, o) => { const d = dateOf(s); return d && !isNaN(d) ? d.toLocaleDateString('en-GB', o) : ''; };
function span(cs){
  const a = dateOf(cs.start), b = dateOf(cs.end);
  if (!a || !b || isNaN(a) || isNaN(b)) return '';
  const sameM = a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear();
  return sameM ? a.getDate() + ' – ' + day(cs.end, { day:'numeric', month:'long', year:'numeric' })
               : day(cs.start, { day:'numeric', month:'long' }) + ' – ' + day(cs.end, { day:'numeric', month:'long', year:'numeric' });
}
const textOf = html => { const d = document.createElement('div'); d.innerHTML = html || ''; d.querySelectorAll('[data-c]').forEach(x => x.remove()); return d.textContent.replace(/ /g, ' ').replace(/\s+/g, ' ').trim(); };

/* ---- one trainee's records, wherever they are read from ---------------- */
function recordsOf(id){
  if (IS_TRAINEE) {
    const me = rec('hub:me') || {};
    return { name: me.name || '', token: me.token || '', tp: rec('chub:tpHistory') || {}, subs: rec('connect_assignment_submissions_v1') || {} };
  }
  const tr = ROSTER()[id];
  if (!tr) return null;
  return { name: tr.name || '', token: id, tp: (T && T.tpHistory) ? T.tpHistory(tr) : {}, subs: tr.assignments || {} };
}
const tpNums = H => Object.keys(H).map(Number).filter(n => H[n] && (H[n].docHTML || H[n].state)).sort((a, b) => a - b);
const listItems = (fb, ids, keep) => { const L = (fb && fb.state && fb.state.lists) || {}; return ids.reduce((a, k) => a.concat((L[k] || []).filter(it => it && (!keep || keep(it)))), []); };

/* ---- the warm phrases --------------------------------------------------- */
/* ONE short phrase per person, from anything written on the course. Half a
   sentence is fine. Never an action point, never a grade or a pass, never a
   criterion code. Warm words count most; short beats long. */
/* The people words (a smile, a joke, warmth) are what a trainee remembers; the
   teaching words (engaged, clear) count, but less. */
const HEART = /\b(smile|smiles|smiling|laugh|laughed|laughing|joke|jokes|fun|energy|energetic|rapport|lovely|love|loved|warm|warmth|enjoy|enjoyed|enjoying|kind|kindness|patient|patience|friendly|lively|brilliant|wonderful|beautiful|delight|charming)\b/i;
const WARM = /\b(confident|confidence|relaxed|natural|engaging|engaged|positive|excellent|great|calm|clear|creative|encouraging|encouraged|praise|well done|good job|nicely|really well|impressive)\b/i;
const LOOSE = /\b(a|an|the|to|of|and|or|with|for|has|have|it|is|was|that|this|in|on|at|by|as|be)$/i;
const NOT = /\b(pass|passed|fail|grade|standard|next time|try to|try|remember|avoid|make sure|don'?t|need to|needs|should|could|instead|rather than|watch out|careful|keep your|reduce|less|more time|missing|but)\b/i;
function phrasesFrom(text){
  return String(text || '')
    .replace(/\(\s*\d[a-n](\s*,\s*\d[a-n])*\s*\)/g, '').replace(/\[\s*\d[a-n]\s*\]/g, '').replace(/\b\d[a-n]\b/g, '')
    .split(/[.;:!?—–]|\s-\s|,\s+|\band\b(?=\s+(?:you|the|your|everyone|they)\b)/i)
    .map(s => s.replace(/^\s*(and|so|also|then)\s+/i, '').replace(/^[A-Z][a-z]+,\s+/, '').replace(/\s+/g, ' ').trim())
    .filter(s => { const n = s.split(' ').length; return n >= 2 && n <= 10 && !NOT.test(s) && !LOOSE.test(s) && !/\d/.test(s); });
}
function scoreOf(p){ const n = p.split(' ').length; return (HEART.test(p) ? 16 : WARM.test(p) ? 8 : 0) + (/\b(you|your|everyone|the learners|the students|ss)\b/i.test(p) ? 2 : 0) - Math.abs(n - 6) * .4; }
/* QUICKER (29 Oct 2026; the walk timed the tutors' side at 12 seconds). The peer sheets asked hubPeerTeachers who
   taught for every classmate and sheet, about 2,400 times for a course of twelve, and each answer works out the whole
   rotation again; and each trainee's phrases were found twice, once for the list and once for the picks. Both are now
   worked out once per page. */
const PEERS_MEMO = {};
function peersOf(group, tp, sit){ const k = group + '|' + tp + '|' + sit; if (!(k in PEERS_MEMO)) PEERS_MEMO[k] = (window.hubPeerTeachers && hubPeerTeachers(group, tp, sit)) || []; return PEERS_MEMO[k]; }
const SUG_MEMO = {};
function suggestionsFor(R){ const k = R && R.token; if (k && SUG_MEMO[k]) return SUG_MEMO[k]; const out = suggestionsWork(R); if (k) SUG_MEMO[k] = out; return out; }
/* Every candidate phrase about one trainee, best first, grouped by who wrote it. */
function suggestionsWork(R){
  const out = [];
  const H = R.tp || {};
  tpNums(H).forEach(n => {
    const fb = H[n], f = (fb.state && fb.state.f) || {};
    const by = String(f.fTutor || '').trim() || 'Your tutor';
    const texts = listItems(fb, ['lSP', 'lST']).map(it => textOf(it.html)).concat([f.tOverall || '']);
    texts.forEach(t => phrasesFrom(t).forEach(p => out.push({ text: p, by, role: 'Tutor', from: 'From TP ' + n, score: scoreOf(p) })));
  });
  /* The marked assignments: the general comment of each round and every
     criterion's comment (10_tutor_assignment_marking.html). Lessons from the
     Classroom, the last one, usually has the warmest. */
  const ASG = { fol: 'Focus on the Learner', lrt: 'Language Related Tasks', lsrt: 'Language Skills Related Tasks', lfc: 'Lessons from the Classroom' };
  Object.keys(R.subs || {}).forEach(k => {
    const s = R.subs[k] || {}, fbk = s.feedback || {}, cc = s.criteriaComments || {};
    const by = String((s.markers && s.markers.first) || '').trim() || 'Your tutor';
    const texts = [fbk.generalComment1, fbk.generalComment2];
    Object.keys(cc).forEach(r => { const o = cc[r] || {}; Object.keys(o).forEach(c => texts.push(o[c])); });
    texts.forEach(t => phrasesFrom(t).forEach(p => out.push({ text: p, by, role: 'Tutor', from: 'From your ' + (ASG[k] || k.toUpperCase()) + ' assignment', score: scoreOf(p) - 1 })));
  });
  /* What the other trainees wrote while watching them (peer observation
     sheets). Teacher 1, 2 and 3 on a sheet are known from the TP's order
     (hub-peers.js), so a note in a column is about that column's trainee and
     is signed by the trainee who wrote it. A tutor's browser has everyone's
     sheets; a trainee's has only their own, so these reach a trainee's page
     when a tutor saves the last pages. */
  if (!IS_TRAINEE && window.hubPeerTeachers) {
    let W = null; try { W = JSON.parse(localStorage.getItem('connect_observation_wording_v1')); } catch (e) {}
    const TASKS = ((W && W.peer) ? W : (window.CONNECT_HUB_OBSERVATION_DEFAULTS || {})).peer || [];
    const roster = ROSTER();
    Object.keys(roster).forEach(oid => {
      if (oid === R.token) return;
      const o = roster[oid] || {}, obs = o.observations || {};
      Object.keys(obs).forEach(key => {
        const m = /^(.+)#([ab])$/.exec(key); if (!m) return;
        const task = TASKS.find(t => t.id === m[1]); if (!task || !task.tp) return;
        const order = peersOf(String(o.group || ''), task.tp, m[2]);
        const c = order.findIndex(p => p && String(p.token) === String(R.token)); if (c < 0) return;
        const a = (obs[key] || {}).a || {};
        Object.keys(a).filter(f => new RegExp('^(r\\d+c' + c + '|f' + c + ')$').test(f)).forEach(f =>
          phrasesFrom(a[f]).forEach(p => out.push({ text: p, by: o.name || 'A fellow trainee', role: 'Trainee', from: 'Watching your TP ' + task.tp, score: scoreOf(p) + 1 })));
      });
    });
  }
  const seen = {};
  return out.filter(o => o.score > 0 && !seen[o.text.toLowerCase()] && (seen[o.text.toLowerCase()] = 1)).sort((a, b) => b.score - a.score);
}
const MAX_SAID = 3;
/* The page's choice: the tutors' saved picks, else the best phrase per person. */
function chosenFor(R){
  const saved = (S().lastWords || {})[R.token];
  if (Array.isArray(saved)) return saved.filter(x => x && x.text).slice(0, MAX_SAID);
  const best = {};
  suggestionsFor(R).forEach(o => { if (!best[o.by]) best[o.by] = o; });
  return Object.keys(best).map(k => best[k]).slice(0, MAX_SAID);
}

    g.strokeStyle = b; g.beginPath(); g.arc(80, 60, 24, -Math.PI * .26, Math.PI * .26, true); g.stroke(); g.restore(); };
  g.globalAlpha = .12; arcs(560, 760, 8.5, '#E6B66A', '#F3EEE4', 9); g.globalAlpha = 1;

  c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = (R.name || 'CELTA').replace(/[^\w ]+/g, '').trim() + ' - CELTA.png'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }, 'image/png');

function staff(){
  const cs = S(), roster = ROSTER();
  const ids = Object.keys(roster).filter(id => !(roster[id] && roster[id].withdrawn)).sort((a, b) => String(roster[a].name).localeCompare(String(roster[b].name)));
  const saved = cs.lastWords || {};
  PICKS = {};
  const rows = ids.map(id => {
    const R = recordsOf(id); if (!R) return '';
    const sug = suggestionsFor(R).slice(0, 6);
    const cur = Array.isArray(saved[id]) ? saved[id] : chosenFor(R);
    PICKS[id] = cur.slice();
    const isOn = t => cur.some(x => x.text === t);
    return '<div class="who" data-id="' + esc(id) + '"><h3><span>' + esc(R.name) + '</span><a href="32_last_page.html?' + esc(KEYQ) + '&amp;trainee=' + encodeURIComponent(id) + '">See their page</a></h3>'
      + (sug.length ? sug.map((o, i) => '<label class="opt"><input type="checkbox" data-i="' + i + '"' + (isOn(o.text) ? ' checked' : '') + '><span><q>' + esc(o.text) + '</q><small>' + esc(o.by + ' · ' + o.from) + '</small></span></label>').join('')
        : '<p class="none">Nothing warm found in their records yet. Add a line below, or leave it: the section is then left out of their page.</p>')
      + cur.filter(x => !sug.some(o => o.text === x.text)).map(x => '<label class="opt"><input type="checkbox" checked data-own="' + esc(x.text) + '"><span><q>' + esc(x.text) + '</q><small>' + esc(x.by + ' · ' + (x.from || '')) + '</small></span></label>').join('')
      + '<div class="own"><input type="text" placeholder="Add a line from anyone: a peer, a tutor, a volunteer" data-add="text"><input type="text" placeholder="Who said it" data-add="by"><input type="text" placeholder="Where (e.g. watching TP 5)" data-add="from"></div>'
      + '</div>';
  });
  /* The tutors' side wears the same forest, mark and confetti as the trainee's page, with the way home on top
     (Ramy, 28 Oct 2026: "it doesn't look very celebratory"; "the last page is like a dead end"). */
  const home = '5_tutor_dashboard.html' + (KEYQ ? '?' + KEYQ : '');
  $('app').innerHTML = '<section class="hero staffhero">' + heroMark() + '</div><div class="wrap" style="position:relative">'
      + '<div class="top"><a href="' + esc(home) + '">Tutors’ home</a></div>'
      + '<p class="k">The last day · ' + esc([cs.courseName, cs.centreName].filter(Boolean).join(' · ')) + '</p>'
      + '<h1>The last page</h1>'
      + '<p class="lede">What each trainee finds at the end of the course: the class photo, framed, how far they came, and a few warm words from the people who watched them teach. No grade, nothing about passing.</p>'
    + '</div></section>'
    + '<div class="wrap staff">'
    + '<div class="card"><h2>The class photo</h2><p class="hint">One photo of everyone. A Zoom screenshot on the last afternoon works, or a photo from the room. It goes on every trainee’s last page, framed, and on the card they keep.</p>'
      + '<label class="drop" id="drop">' + (cs.classPhoto && cs.classPhoto.src ? '<img src="' + esc(cs.classPhoto.src) + '" alt="The class photo"><span>Choose another to replace it</span>' : '<b>Choose the photo</b><span>JPG or PNG · a screenshot is fine</span>')
      + '<input type="file" id="file" accept="image/*" hidden></label></div>'
    + '<div class="card"><h2>What people said about each trainee</h2><p class="hint">Short, warm phrases from anything written on the course, each under the name of whoever wrote it. Tick up to three for their page, or add your own. Never an action point or a grade.</p>' + rows.join('') + '</div>'
    + '<div class="savebar"><button type="button" class="gold" id="save">Save the last pages</button><span class="status" id="status"></span></div>'
    + '</div>';
  $('file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) takePhoto(f); });
  $('save').addEventListener('click', saveAll);
  /* three at most per trainee (Ramy, 23 Oct 2026: "cap this at like 3") */
  document.querySelectorAll('.who').forEach(w => w.addEventListener('change', e => {
    if (!e.target.matches('input[type=checkbox]') || !e.target.checked) return;
    if (w.querySelectorAll('input[type=checkbox]:checked').length > MAX_SAID) { e.target.checked = false; $('status').textContent = 'Three at most for each trainee. Untick one first.'; }
  }));
}
function takePhoto(f){
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const W = Math.min(1600, im.naturalWidth), H = Math.round(W * im.naturalHeight / im.naturalWidth);
    const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').drawImage(im, 0, 0, W, H);
    const src = c.toDataURL('image/jpeg', .78);
    const cs = S(); cs.classPhoto = { src, at: new Date().toISOString() };
    localStorage.setItem('connect_course_settings', JSON.stringify(cs));
    $('drop').querySelector('b, img') && ($('drop').innerHTML = '<img src="' + src + '" alt="The class photo"><span>Not saved yet: press Save the last pages</span><input type="file" id="file" accept="image/*" hidden>');
    $('file').addEventListener('change', e => { const f2 = e.target.files && e.target.files[0]; if (f2) takePhoto(f2); });
    $('status').textContent = 'Photo ready. Save to put it on every trainee’s page.';
  }; im.src = r.result; };
  r.readAsDataURL(f);
}
async function saveAll(){
  const cs = S(), words = {};
  document.querySelectorAll('.who').forEach(w => {
    const id = w.dataset.id, R = recordsOf(id), sug = suggestionsFor(R).slice(0, 6), list = [];
    w.querySelectorAll('input[type=checkbox]').forEach(cb => { if (!cb.checked) return;
      if (cb.dataset.i != null) { const o = sug[+cb.dataset.i]; if (o) list.push({ text: o.text, by: o.by, role: o.role, from: o.from }); }
      else { const old = (PICKS[id] || []).find(x => x.text === cb.dataset.own); if (old) list.push(old); } });
    const t = w.querySelector('[data-add=text]').value.trim();
    if (t) list.push({ text: t.replace(/[.\s]+$/, ''), by: w.querySelector('[data-add=by]').value.trim() || 'Your tutor', role: '', from: w.querySelector('[data-add=from]').value.trim() });
    words[id] = list.slice(0, MAX_SAID);
  });
  cs.lastWords = words;
  $('save').disabled = true; $('status').textContent = 'Saving…';
  try {
    await HubStore.putCourse('settings', cs);
    localStorage.setItem('connect_course_settings', JSON.stringify(cs));
    $('status').textContent = 'Saved. Every trainee’s last page has it now.';
  } catch (e) { $('status').textContent = 'Not saved: ' + (e && e.message || e); }
  $('save').disabled = false;
}

/* NOT BEFORE THE LAST DAY (Ramy, 29 Oct 2026). The home offers this page from the last day; a trainee who finds the
   address earlier sees only when it opens, not a half-made page with no photo and lines from a course still running. */
function notYet(){
  const cs = S(), end = String(cs.end || '').slice(0, 10), today = (window.hubToday && hubToday()) || new Date().toISOString().slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(end) || today >= end) return false;
  const when = new Date(end + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long' });
  $('app').innerHTML = '<div class="wrap staff"><p class="lbl">The last page</p><h1>Not yet.</h1><p class="sub">Your last page opens on your last day, <b>' + esc(when) + '</b>. Come back then.</p><p><a href="index.html">Back to your course</a></p></div>';
  return true;
}
function render(){
  if (IS_TRAINEE) { if (notYet()) return; const R = recordsOf(); if (R) trainee(R); return; }
  if (VIEW_ID) { const R = recordsOf(VIEW_ID); if (R) { trainee(R); return; } }
  if (IS_TUTOR) { staff(); return; }
  $('app').innerHTML = '<div class="wrap staff"><h1>The last page</h1><p class="sub">Open this from your own course link.</p></div>';
}
render();
document.addEventListener('hub:ready', render);
</script>
