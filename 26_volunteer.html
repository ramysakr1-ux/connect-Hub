<!DOCTYPE html>
<!--
  Connect Lite — a volunteer student's own page
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 30 Sep 2026: "a nice landing page for them, and a nice certificate
  of attendance at the end. You have no idea how big a problem finding
  volunteer students is for a course. This could really sweeten the deal."

  WHO THIS IS FOR. A member of the public who has agreed to be taught by
  trainee teachers. Not a user of the course, not staff, often not a
  confident reader of English. So the page opens with the one thing they
  came for -- when the next class is and the button to join it -- and
  everything else sits underneath. Nothing on it is homework: the materials
  say "have a look if you like", because a volunteer is doing the centre a
  favour and an assignment is not part of the deal.

  WHERE IT ALL COMES FROM. Every line is data Lite already holds. The next
  class and its times are the timetable's; the room is the one typed once on
  Course admin; the attendance bar is the register the tutor marks; the hours
  are that day's teaching slots added up. The store answers this link with
  exactly that and nothing else (version 42): their own row, a subset of the
  settings, the timetable. Never the roster, never another volunteer.

  THE LINK. "?v=<courseId>-<random>", minted on the register. It reads and
  never writes: hub-sync treats this mode like the assessor's, so nothing
  this browser does can reach the course. It stops working when the row is
  removed from the register.
-->

<style>

  .board{max-width:720px; margin:0 auto; padding:22px 20px 60px;}

  .next{background:var(--teal); color:var(--paper); border-radius:12px; padding:20px 22px; margin:0 0 16px;}

  .card h3{font-family:'Newsreader',Georgia,serif; font-size:1.1rem; margin:0 0 3px;}

     2026: "give them a nice frame, like a green frame... it reads what's
     inside, click on it and then it opens the PDF"). The whole card is the

  a.mat{display:flex; gap:12px; align-items:center; background:var(--paper); border:1.5px solid var(--teal);
        border-left-width:5px; border-radius:10px; padding:13px 15px; margin:0 0 10px;

  a.mat:hover, a.mat:focus-visible{background:var(--sand-deep); border-color:var(--teal-lifted); outline:none;}

  .next.v4 .room:focus-visible{outline:2px solid var(--paper); outline-offset:3px;}
  .next.v4 .tiny{color:oklch(84% 0.02 190); opacity:1;}
  .next.v4 .ask{border-top-color:oklch(99.5% 0.004 90 / .2);}
  .next.v4 .ask .yn{min-height:44px; transition:background-color .15s, color .15s, border-color .15s;}
  .next.v4 .ask .yn:hover{border-color:var(--paper);}
  .next.v4 .ask .yn:focus-visible{outline:2px solid var(--gold-lifted); outline-offset:3px;}

  /* a Yes: the thanks becomes a ticket stub */
  .next.v4.going .ask small{flex-basis:auto; display:inline-flex; align-items:center; gap:6px; margin-left:4px; padding:7px 14px; border-radius:8px;
    background:var(--gold-lifted); color:var(--ink-warm); font-weight:700; opacity:1; animation:v4-ticket .6s cubic-bezier(.2,.7,.2,1) both;
    -webkit-mask:radial-gradient(circle 5px at 0 50%, transparent 98%, #000) , radial-gradient(circle 5px at 100% 50%, transparent 98%, #000);
    -webkit-mask-composite:source-in; mask-composite:intersect;}
  .track{height:9px;} .track i{background:linear-gradient(90deg, var(--teal), var(--gold-lifted)); border-radius:99px; transition:width .8s cubic-bezier(.2,.7,.2,1);}
  .trk-l{margin:0 0 10px; font-size:0.82rem; color:var(--grey);} .trk-l b{font-family:'Newsreader',Georgia,serif; font-size:1rem; color:var(--ink);}

  .cert.earned .certlink:hover{background:var(--teal-lifted); text-decoration:none;}
  .cert.earned .certlink:focus-visible{outline:2px solid var(--gold-lifted); outline-offset:3px;}
  .cert.earned::after{content:''; position:absolute; top:0; bottom:0; width:40%; left:-50%; background:linear-gradient(100deg, transparent, oklch(100% 0 0 / .55), transparent); animation:v4-sheen 1.6s ease-out .4s 1 both;}
  @keyframes v4-drift{0%,100%{transform:rotate(-8deg) scale(1);}50%{transform:rotate(-4deg) scale(1.04);}}
  @keyframes v4-ticket{from{opacity:0; transform:translateY(8px) rotate(-3deg);}to{opacity:1; transform:none;}}

  @media(prefers-reduced-motion:reduce){ .next.v4 *, .cert.earned::after, .track i{animation:none !important; transition:none !important;} .cert.earned::after{display:none;} }

<body class="hub-grid hub-paper">
<div class="board" id="app"></div>
<div id="consent"></div>

<script src="hub-attendance.js?v=202610080829"></script>
<script src="hub-volunteer-i18n.js?v=202610080829"></script>

<script type="text/x-hub-app">
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };

/* This page is one student's own. Anyone else -- a trainee, a tutor, the
   assessor -- got a nameless "Hello" and a course-shaped page built from
   nothing (sweep, 30 Sep 2026). */
if (window.hubVolunteerRoomOnly && hubVolunteerRoomOnly())
  throw new Error('Connect Lite: stopping this page on purpose \u2014 this page belongs to a volunteer student.');

const ME = rec('hub:volunteer') || {};
const SETTINGS = rec('connect_course_settings') || {};
const TT = rec('connect_timetable_v1') || {};
/* What the trainees have shared for the lesson. The store appends, so the
   newest is last; newest first here, because the thing shared for tomorrow is
   what they came to look at. */
/* The trainees' lesson handouts (kind 'materials', shared from a plan), and
   what the tutors put on the course shelf -- the demonstration lesson, the
   first-day activities, anything for the class (kinds 'demo', 'gtky',
   'course'). The shelf used to stay on the course; Ramy, 6 Oct 2026: "share
   with the volunteer students... doesn't matter what's in there." */
const SHELF_KINDS = { demo: 'demonstration lesson', gtky: 'activity', course: 'from your teachers' };
const SHARED = (rec('connect_shared_v1') || []).filter(x => x && x.url && x.name && (!x.kind || x.kind === 'materials' || SHELF_KINDS[x.kind])).slice().reverse();
/* The teachers a volunteer can write to, from the course's own tutor
   contacts. A volunteer has no group, so they see all of them. */
/* 1 Oct 2026. The block here used to list the course TUTORS with mail links.
   Ramy: "we most definitely don't want to give the course tutors' emails to
   the volunteer students. Absolutely not." Then: "if you already built that
   email thingy, then leave it -- but it will be the centre, whoever is in
   charge of the volunteer students: whatever email is entered in Course
   admin, that's the one they will see." So: ONE address, the centre's, from
   settings.volunteerContact, and never a tutor's. The store sends a
   volunteer that one contact and nothing else (v54). */
function mailBlock(){
  const host = document.getElementById('mailTutor'); if (!host) return;
  const c = SETTINGS.volunteerContact;
  if (!c || !c.email) return;
  const subject = encodeURIComponent([SETTINGS.courseName || 'CELTA', 'volunteer student'].join(' \u2014 ') + (ME && ME.name ? ' \u2014 ' + ME.name : ''));
  const body = encodeURIComponent('Hello,\n\nI am a volunteer student on the course.\n\n');
  /* Ramy, 1 Oct 2026: coming or not is a tap on the Yes/No above, never a
     mail -- this line is for anything else, and stays generic: "email the
     centre", whatever the reason. */
  host.innerHTML = `<span class="ml-lbl">Email the centre</span>`
    + `<a class="ml-who" href="mailto:${esc(c.email)}?subject=${subject}&body=${body}">${esc(c.name || c.email)}<small>looks after the volunteer students</small></a>`
    + `<span class="ml-time">For anything about your classes. Whether you are coming is the Yes or No above.</span>`;
  host.hidden = false;
}

/* Ramy, 1 Oct 2026: a shared material names its teaching practice as well as
   its teacher -- "TP3 · Aiko Tanaka · handout" -- so the student knows which
   lesson it belongs to. The letter (A/B) rides along when the share has it. */
/* What the card says is inside. A student is being handed a link and deserves
   to know whether it is a PDF, a video or a form before they press it; the
   store keeps no file type, so it is read off the address. */
const fileKind = u => {
  const s = String(u || '').toLowerCase();
  if (/docs\.google\.com\/document/.test(s)) return 'Google Doc';
  if (/docs\.google\.com\/presentation/.test(s)) return 'Slides';
  if (/docs\.google\.com\/spreadsheets/.test(s)) return 'Sheet';
  if (/docs\.google\.com\/forms|forms\.gle/.test(s)) return 'Form';
  if (/\.pdf([?#]|$)/.test(s)) return 'PDF';
  if (/\.(docx?|odt|pages)([?#]|$)/.test(s)) return 'Document';
  if (/\.(pptx?|odp|key)([?#]|$)/.test(s)) return 'Slides';
  if (/\.(jpe?g|png|gif|webp|heic|avif)([?#]|$)/.test(s)) return 'Picture';
  if (/\.(mp4|mov|webm|m4v)([?#]|$)/.test(s)) return 'Video';
  if (/\.(mp3|m4a|wav|ogg|aac)([?#]|$)/.test(s)) return 'Audio';
  if (/youtube\.com|youtu\.be|vimeo\.com/.test(s)) return 'Video';
  if (/drive\.google\.com/.test(s)) return 'Drive file';
  return 'Link';
};
const mat = x => {
  /* "TP6" is the course's own word, and this page is read by language
     learners in five languages who have never heard it. What the lesson is
     about is both more use to them and shorter: "Grammar", "Reading". The
     practice number stays only as the fallback for a material shared before
     the aim travelled with it. */
  const tp = x.aim ? String(x.aim) : (x.tp ? 'TP' + String(x.tp) + (x.set ? String(x.set).toUpperCase() : '') : '');
  /* 'materials' is the store's own word for which shelf this is on, not
     anything a student needs told. */
  const kind = x.kind && x.kind !== 'materials' ? (SHELF_KINDS[x.kind] || x.kind) : '';
  const line = [tp, x.by, kind, fileKind(x.url)].filter(Boolean).join(' \u00b7 ');
  return `<a class="mat" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><div><b>${esc(x.name)}</b>${line ? '<small>' + esc(line) + '</small>' : ''}</div><span class="go">Open \u2192</span></a>`;
};
const ZONE = SETTINGS.timeZone || '';

const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const parse = s => { const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const TODAY = window.hubToday ? hubToday() : ymd(new Date());   // the demo clock, when the course is pinned
const longDay = iso => { const d = parse(iso); return d ? DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] : iso; };
const shortDay = iso => { const d = parse(iso); return d ? DOW[d.getDay()].slice(0,3) + ' ' + d.getDate() + ' ' + MON[d.getMonth()].slice(0,3) : iso; };

/* THE TEACHING DAYS ARE THE TIMETABLE'S. A class is a day the timetable gives
   a practice to; its start is the first teaching slot, its end the last, and
   its length is those slots added up. Nothing here has a schedule of its own. */
const tpSlots = (TT.slots || []).filter(s => s.kind === 'tp');
const mins = sl => { const a = String(sl.from||'').match(/^(\d{1,2}):(\d{2})/), b = String(sl.to||'').match(/^(\d{1,2}):(\d{2})/); if (!a||!b) return 0; const d = (+b[1]*60 + +b[2]) - (+a[1]*60 + +a[2]); return d > 0 ? d : 0; };
const hoursPerDay = tpSlots.reduce((n, sl) => n + mins(sl), 0) / 60;
const days = (TT.days || []).filter(d => d.tp).map(d => d.date).sort();
/* The same engine the register and the certificate use, so the three cannot
   drift: a day counted present credits the WHOLE day, and a part-day is
   recorded but credits nothing (Connect's rule, ported 30 Sep 2026). A
   record written before the tiers held a list of dates, all 'in the room'. */
const A = window.hubAttendance;
const LESSON_MIN0 = tpSlots.length ? Math.round(tpSlots.reduce((n, sl) => n + mins(sl), 0) / tpSlots.length) : 0;
const MARKS = ME.marks || (ME.here || []).reduce(function(m, d){ m[d] = 'present'; return m; }, {});
const REC = A.record(MARKS, days, tpSlots.length, LESSON_MIN0);
const attended = REC.present;
const hours = REC.hours;
const upcoming = days.filter(d => d >= TODAY);
const next = upcoming[0] || '';
const fmtH = h => (Math.round(h * 100) / 100).toString().replace(/\.00$/, '');

/* A time as this reader sees it: the course's own clock, and theirs beside
   it when they are somewhere that makes it a different time. */
function timeFor(iso, hhmm){
  const tf = (window.hubTimeFor && ZONE) ? hubTimeFor(iso, hhmm, ZONE) : null;
  const c = window.hubClock ? hubClock : (x => x);
  return (tf && tf.differs) ? c(hhmm) + ' (' + c(tf.local) + ' your time)' : c(hhmm);
}

/* The room to join: the course's teaching practice room, typed once on
   Course admin. An untagged room serves everyone; a group-tagged one is a
   trainee-group thing, and a volunteer is in the room with whoever is
   teaching, so any teaching practice room will do. */
function room(){
  const list = Array.isArray(SETTINGS.onlineRooms) ? SETTINGS.onlineRooms : [];
  const tp = list.filter(r => r && r.url && /teaching practice/i.test(r.label || ''));
  return tp.find(r => !r.group) || tp[0] || list.find(r => r && r.url && !/input/i.test(r.label || '')) || null;
}

/* CERTIFICATE. Twenty hours until the centre sets its own -- Connect keeps a
   threshold per centre, and this is the same idea with a sensible default.
   Stated as a distance in CLASSES, because "two more classes" is a thing a
   person can act on and "seventy-nine percent" is not. */
const CERT = A.certificate(hours, SETTINGS.volunteerCertificateHours || 160, tpSlots.length, LESSON_MIN0, ME.carried);
const TARGET = CERT.target, classesLeft = CERT.classesLeft, earned = CERT.earned;

function render(){
  const app = $('app');
  const first = String(ME.name || '').trim().split(/\s+/)[0] || '';
  const tutors = String(SETTINGS.tutorNames || '').split(/[,\n;]+/).map(x => x.trim()).filter(Boolean);
  const r = room();
  const startT = tpSlots.length ? tpSlots[0].from : '', endT = tpSlots.length ? tpSlots[tpSlots.length-1].to : '';
  /* v56: are you coming? The answer for the next class, yes or no, kept on
       their own row; the register and the trainees' card read it. */
    const reply = next ? ((ME.replies || {})[next] || null) : null;
    const askBlock = next ? `<div class="ask" id="ask"><span class="k">Are you coming?</span><button type="button" class="yn${reply && reply.coming === 'yes' ? ' on' : ''}" data-coming="yes">Yes</button><button type="button" class="yn${reply && reply.coming === 'no' ? ' on' : ''}" data-coming="no">No</button>${reply ? `<small>${reply.coming === 'yes' ? 'Thank you, see you then.' : 'Thank you for telling us.'}</small>` : ''}</div>` : '';
  const isToday = next === TODAY;
  const nextBlock = !days.length
    ? `<div class="next done"><div class="k">Your classes</div><h2>Nothing is scheduled yet</h2><div class="tiny">The centre has not set the timetable. This page fills in when it does.</div></div>`
    : next
    ? `<div class="next v4${reply && reply.coming === 'yes' ? ' going' : ''}"><svg class="v4-mark" viewBox="8 30 104 60" fill="none" aria-hidden="true"><path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="var(--gold-lifted)" stroke-width="9" stroke-linecap="round"></path><path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="var(--paper)" stroke-width="9" stroke-linecap="round"></path></svg><div class="k">Your next class</div>
        <h2>${isToday ? 'Today, ' : (upcoming[0] && daysBetween(TODAY, next) === 1) ? 'Tomorrow, ' : ''}${esc(longDay(next))}</h2>
        <div class="when">${esc(timeFor(next, startT))} – ${esc(timeFor(next, endT))}${tpSlots.length > 1 ? ' · ' + tpSlots.length + ' short lessons' : ''}${ZONE && window.hubReaderZone && hubReaderZone() !== ZONE ? '<small>Course time is ' + esc(hubZoneName(ZONE)) + '.</small>' : ''}</div>
        ${r ? `<a class="room" href="${esc(r.url)}" target="_blank" rel="noopener">Join on ${/zoom/i.test(r.url) ? 'Zoom' : /meet\.google/i.test(r.url) ? 'Meet' : /teams/i.test(r.url) ? 'Teams' : 'the link'}</a>` : ''}
        <div class="tiny">${tutors.length ? 'Your teachers are trainees, with ' + esc(tutors.join(' and ')) + ' watching. ' : ''}You do not need to prepare anything.</div>${askBlock}</div>`
    : `<div class="next done"><div class="k">Your classes</div><h2>The course has finished</h2><div class="tiny">Thank you for coming. Your attendance and hours are below.</div></div>`;

  app.innerHTML = `
    <p class="eyebrow">${esc([SETTINGS.centreName, SETTINGS.courseName].filter(Boolean).join(' · '))}</p>
    <h1>Hello${first ? ' ' + esc(first) : ''}</h1>
    <p class="sub">Thank you for coming in to be taught. Here is everything for your classes.</p>
    ${nextBlock}
    <!-- The next class, and then everything else folded away. It used to be
         one flat list of every material ever shared, growing all month
         (Ramy, 1 Oct 2026: "is it going to be just a list of all the material,
         or the material of the day, and the previous stuff lives in the
         background?"). The newest share is what they came for; the rest is
         still here, behind a line. -->
    <div class="card"><h3>For your next class</h3>
      <p class="note">Anything your teachers share for the lesson appears here. Have a look if you like — you do not have to.</p>
      ${SHARED.length ? SHARED.slice(0, 3).map(mat).join('') : '<p class="empty">Nothing shared yet.</p>'}
      ${SHARED.length > 3 ? `<details class="earlier"><summary>Everything else your teachers have shared — ${SHARED.length - 3} more</summary>${SHARED.slice(3).map(mat).join('')}</details>` : ''}</div>
    <div class="card"><h3>Your attendance</h3>
      <div class="segs">${REC.days.map(x => `<span class="seg ${x.tier === 'present' ? 'here' : x.tier === 'partial' ? 'part' : x.date < TODAY ? 'miss' : ''}" title="${esc(shortDay(x.date))}"></span>`).join('')}</div>
      <div class="hrs"><b>${fmtH(hours)} h</b><span>${attended} ${attended === 1 ? 'class' : 'classes'}${REC.partial ? ' · ' + REC.partial + ' part of a class' : ''}${upcoming.length ? ' · ' + upcoming.length + ' still to come' : ''}</span></div>
      ${TARGET > 0 ? `<div class="track"><i style="width:${Math.min(100, Math.round(hours / TARGET * 100))}%"></i></div><p class="trk-l"><b>${fmtH(Math.min(hours, TARGET))}</b> of ${fmtH(TARGET)} hours towards your certificate</p>
      <div class="cert${earned ? ' earned' : ''}">${earned
        ? `Your <b>certificate of attendance</b> is ready. <a class="certlink" href="27_volunteer_certificate.html">Open it</a> \u2014 print it or save it as a PDF.`
        : `Your <b>certificate of attendance</b> is ready at ${fmtH(TARGET)} hours. That is <b>${classesLeft} more ${classesLeft === 1 ? 'class' : 'classes'}</b>. It is signed by the centre and yours to keep.`}</div>` : ''}
    </div>
    ${upcoming.length > 1 ? `<div class="card"><h3>The rest of the course</h3>
      <p class="days">${upcoming.slice(1, 9).map(d => `<span><b>${esc(shortDay(d))}</b> · ${esc(window.hubClock ? hubClock(startT) : startT)}</span>`).join('')}${upcoming.length > 9 ? '<span>and ' + (upcoming.length - 9) + ' more to ' + esc(shortDay(upcoming[upcoming.length-1])) + '</span>' : ''}</p></div>` : ''}
    <div class="install-hint" id="installHint" hidden></div>
    <!-- Telling the centre you cannot come. Lite sends no mail of its own and
         holds no address for a volunteer, so this is the same door the
         trainees have on their own home: the tutors' addresses, a subject
         already written, and the student's own mail app
         (Ramy, 1 Oct 2026: "let's add an email section to the volunteer
         students... there is an email your tutor tab for the trainees"). -->
    <div class="mailtutor" id="mailTutor" hidden></div>
    <p class="mailpref" id="mailpref">${ME.email ? (ME.notify === false ? 'You asked us not to email you about classes. <button type="button" data-notify="on">Start again</button>' : 'We email you the day before a class, and an hour before if you said yes. <button type="button" data-notify="off">Stop these emails</button>') : ''}</p>
    <p class="foot">This link is yours. It stops working when the course ends.</p>
    <p class="foot"><a href="17_how_it_works.html?for=volunteer&amp;lang=${esc(LANG())}" lang="${esc(LANG())}">${esc(T().howLink)}</a></p>
    ${agreedAt() ? `<p class="agreed" lang="${esc(LANG())}" dir="${I18N.isRtl(LANG()) ? 'rtl' : 'ltr'}">${esc(T().agreedOn.replace('{date}', longDay(agreedAt().slice(0, 10))))} <button type="button" id="readAgain">${esc(T().readAgain)}</button></p>` : ''}`;
  if (window.hubInstallHint) hubInstallHint($('installHint'), 'volunteer');
  if ($('readAgain')) $('readAgain').addEventListener('click', () => consent(true));
  mailBlock();
  document.querySelectorAll('[data-coming]').forEach(b => b.addEventListener('click', () => answer(b.dataset.coming)));
  document.querySelectorAll('[data-notify]').forEach(b => b.addEventListener('click', () => notify(b.dataset.notify === 'on')));
}
/* The answer, from a button on the page or from the link in the email
   (?day=&coming=): one write to their own row, then the page repaints with
   the thanks. */
async function answer(coming, day){
  const d = day || next; if (!d) return;
  try { const r = await HubStore.call({ op: 'volunteerReply', day: d, coming }); ME.replies = r.replies || ME.replies || {}; try { localStorage.setItem('hub:volunteer', JSON.stringify(ME)); } catch (e) {} render(); }
  catch (e) { alert(e.message || e); }
}
async function notify(on){
  try { await HubStore.call({ op: 'volunteerNotify', on }); ME.notify = on; try { localStorage.setItem('hub:volunteer', JSON.stringify(ME)); } catch (e) {} render(); }
  catch (e) { alert(e.message || e); }
}
(function fromTheLink(){
  const q = new URLSearchParams(location.search);
  const coming = q.get('coming'), day = q.get('day'), nt = q.get('notify');
  if (!coming && !nt) return;
  history.replaceState(null, '', location.pathname + '?v=' + encodeURIComponent(q.get('v') || ''));
  const go = () => { if (coming === 'yes' || coming === 'no') answer(coming, day || undefined); if (nt === 'off') notify(false); };
  if (window.HubStore && ME && ME.name) go(); else document.addEventListener('hub:ready', go);
})();

/* THE JOINING NOTE. Ramy, 30 Sep 2026: "we can always get them to sign
   something when they join... Disclaimer, it can also come from Connect."
   It does: the lines below are Connect's volunteer sign-up consent, word for
   word, so both products make the same promise to the same people.

   Where the agreement goes. A volunteer's link cannot write to the course, so
   the click is kept on this device (and shown as a line at the foot of the
   page) and ALSO sent to the store as the one write a volunteer may make --
   'volunteerAgree', which stamps their own register row once and can stamp
   nothing else. The register then shows the tutor who has agreed. If the
   store is not reachable at that moment, the device copy still stands and
   the stamp is retried on the next open. */
/* Six languages for the two things they read in their own: Connect's six.
   The page's own labels stay English -- it is an English class. */
const I18N = window.hubVolunteerI18n || { languages: [], t: {}, pick: () => 'en', remember: () => {}, isRtl: () => false };
const LANG = () => I18N.pick();
const T = () => I18N.t[LANG()] || I18N.t.en || {};
const CONSENT_KEY = 'chub:volunteerConsent:' + ((window.HubStore && HubStore.volunteerToken) ? HubStore.volunteerToken() : '');
/* The store's word counts too (30 Sep 2026): a student who agreed on their
   phone and then opens the link on a laptop is not asked twice. The register
   row carries `agreed`, the boot sends it, and it becomes this device's copy. */
function agreedAt(){
  const r = rec(CONSENT_KEY); if (r && r.at) return r.at;
  if (ME.agreed) { try { localStorage.setItem(CONSENT_KEY, JSON.stringify({ at: ME.agreed, name: ME.name || '', stamped: true })); } catch (e) {} return ME.agreed; }
  return '';
}
function stamp(){
  if (!window.HubStore || !HubStore.call) return;
  const r = rec(CONSENT_KEY); if (!r || !r.at || r.stamped) return;
  /* call() resolves on success and throws on a refusal or a dead network;
     either way the device copy stands and this runs again next open. */
  HubStore.call({ op: 'volunteerAgree', at: r.at, lang: LANG() }).then(() => {
    r.stamped = true; try { localStorage.setItem(CONSENT_KEY, JSON.stringify(r)); } catch (e) {}
  }).catch(() => {});
}
function consent(readOnly){
  const host = $('consent'); if (!host) return;
  const L = LANG(), W = T();
  host.innerHTML = `<div class="consent" role="dialog" aria-modal="true" aria-labelledby="cTitle"><div class="box" lang="${esc(L)}" dir="${I18N.isRtl(L) ? 'rtl' : 'ltr'}">
    <div class="langs" role="group" aria-label="Language">${I18N.languages.map(l => `<button type="button" lang="${l.code}" data-lang="${l.code}" aria-pressed="${l.code === L}">${esc(l.native)}</button>`).join('')}</div>
    <h2 id="cTitle">${esc(W.consentHeading)}</h2>
    <p class="intro">${esc(W.consentIntro)}</p>
    <ul>${(W.consentLines || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <p class="rec">${esc(W.recordingConsentLine)}</p>
    ${readOnly
      ? `<button type="button" class="close" id="cClose">${esc(W.close)}</button>`
      : `<button type="button" class="agree" id="cAgree">${esc(W.agreeLabel)}</button>
         <p class="kept">${esc(W.keptNote)}</p>`}
  </div></div>`;
  document.body.style.overflow = 'hidden';
  /* The note leaves on a short fade rather than vanishing (the one hard cut
     left in the v10 frame scan, 1 Oct 2026). */
  const done = () => { const c = host.querySelector('.consent'); if (c && window.hubFadeAway) hubFadeAway(c, () => { host.innerHTML = ''; }); else host.innerHTML = ''; document.body.style.overflow = ''; };
  host.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { I18N.remember(b.dataset.lang); consent(readOnly); render(); }));
  if ($('cClose')) $('cClose').addEventListener('click', done);
  if ($('cAgree')) { $('cAgree').focus(); $('cAgree').addEventListener('click', () => {
    try { localStorage.setItem(CONSENT_KEY, JSON.stringify({ at: new Date().toISOString(), name: ME.name || '' })); } catch (e) {}
    done(); stamp(); render();
  }); }
}
function daysBetween(a, b){ const x = parse(a), y = parse(b); return (x && y) ? Math.round((y - x) / 86400000) : 99; }

render();
if (!agreedAt()) consent(false); else stamp();
</script>
</body>
</html>
