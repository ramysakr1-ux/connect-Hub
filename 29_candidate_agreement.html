<!DOCTYPE html>
<!--
  The candidate agreement — read once, signed once.
  © 2026 Ramy Sakr. All rights reserved.

  Cambridge's CELTA 5 booklet lists the agreement among the centre's own
  responsibilities and says what belongs in it: "to provide a candidate
  agreement detailing, for example: the attendance policy, plagiarism
  information, the complaints policy, any policies on resubmissions of written
  work etc." (celta5-text.js). The centre writes those four on Course admin, or
  pastes a link to its own; this is where a trainee reads them and signs.

  THERE IS NO SECOND "OWN WORK" DOCUMENT. The Handbook for Tutors asks that
  candidates "confirm in writing that the written assignments are their own
  work", and Lite already takes that on every submission, on the declaration
  step of 9_assignment_submission. Cambridge files plagiarism information inside
  this agreement, so it is a section here rather than a sheet of its own.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Candidate agreement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202610071727">
<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    padding:36px 20px 90px; display:flex; justify-content:center;}
  .board{max-width:820px; width:100%;}
  a{color:var(--teal);} a:hover{color:var(--ink-warm);}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .title{border-top:2px solid var(--teal); padding-top:22px;}
  .title h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.9rem; line-height:1.15;}
  .title p{margin:7px 0 0; font-size:0.9rem; color:var(--grey); line-height:1.55;}
  .sec{background:var(--surface); border:1px solid var(--sand-line); border-radius:10px; padding:20px 22px; margin-top:16px;}
  .sec.c0{border-left:4px solid var(--teal);} .sec.c1{border-left:4px solid var(--gold);} .sec.c2{border-left:4px solid var(--brick);}
  .sec h2{margin:0 0 8px; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.1rem;}
  .sec p.body{margin:0; font-size:0.9rem; line-height:1.65; white-space:pre-wrap;}
  .empty{background:var(--surface); border:1px dashed var(--sand-line); border-radius:10px;
    padding:26px 22px; margin-top:16px; color:var(--grey); font-size:0.9rem; line-height:1.6;}
  .ownfile{margin-top:16px; background:var(--paper); border:1px solid var(--sand-line); border-left:4px solid var(--gold);
    border-radius:8px; padding:16px 18px; font-size:0.9rem; line-height:1.6;}
  .signbox{margin-top:20px; background:var(--paper); border:1px solid var(--sand-line); border-bottom-width:3px;
    border-radius:10px; padding:20px 22px;}
  .signbox h2{margin:0 0 6px; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.1rem;}
  .signbox .lead{margin:0 0 14px; font-size:0.88rem; color:var(--grey); line-height:1.6;}
  label.f{display:block; font-size:0.72rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--grey); margin:0 0 5px;}
  input[type=text]{font-family:'Karla',sans-serif; font-size:0.92rem; padding:10px 12px; border:1.5px solid var(--sand-line);
    border-radius:6px; background:var(--box); color:var(--ink); width:100%; max-width:340px;}
  .btn{font-family:'Karla',sans-serif; font-size:0.86rem; font-weight:700; padding:10px 18px; border-radius:7px;
    border:1.5px solid var(--teal); background:var(--teal); color:var(--paper); cursor:pointer;}
  .btn:hover{background:var(--ink-warm); border-color:var(--ink-warm);}
  .btn[disabled]{opacity:.5; cursor:default;}
  .row{display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-top:12px;}
  .signed{display:flex; gap:14px; align-items:center; flex-wrap:wrap; background:var(--box);
    border:1px solid var(--sand-line); border-radius:8px; padding:14px 16px; font-size:0.9rem;}
  .signed svg{display:block;}
  .ro{font-size:0.88rem; color:var(--grey);}
  .status{font-size:0.8rem; color:var(--grey);}
  .decl{margin:14px 0 4px; padding:14px 16px; background:var(--paper); border:1px solid var(--sand-line); border-left:4px solid var(--gold); border-radius:8px;}
  .decl h3{margin:0 0 6px; font-family:'Newsreader',Georgia,serif; font-size:1.02rem; font-weight:600;}
  .decl p{margin:0 0 10px; font-size:0.88rem; line-height:1.55; color:var(--ink-warm);}
  .decl label{display:block; font-size:0.9rem; margin:4px 0; cursor:pointer;}
  .decl input[type=radio]{margin-right:8px;}
  .decl textarea{width:100%; margin-top:6px; font:inherit; font-size:0.9rem; padding:8px 10px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--field);}
  .decl textarea:disabled{opacity:0.55;}
  @media print{ body{background:#fff; padding:0;} .back,.signbox .row,.btn{display:none;} }
</style>
</head>
<body>
<div class="board">
  <a class="back" id="back" href="index.html">&#8592; Back</a>
  <div id="app"></div>
</div>
<script src="hub-shared.js?v=202610071727"></script>
<script src="hub-store.js?v=202610071727"></script>
<script src="hub-hand.js?v=202610071727"></script>
<script src="hub-ink.js?v=202610071727"></script>
<script src="hub-say.js?v=202610071727"></script>
<script src="hub-sync.js?v=202610071727"></script>
<script type="text/x-hub-app">
/* A volunteer student is not on the course. They come in off the street to be
   taught, and what the centre asks of its TRAINEES -- attendance, plagiarism,
   resubmissions -- is none of their business. Caught by the screen check on
   5 Oct 2026, which opened this page on a volunteer's link and found no door:
   the room matrix said refuse and the page did not. */
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose \u2014 this is one of the course\u2019s own pages.');

/* Everyone else on the course may READ it -- a tutor fields questions about it
   and the assessor is entitled to see what the trainees signed. Only the
   trainee whose link this is can sign, which is what IS_TRAINEE gates. */
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const now = () => new Date().toISOString();
const when = iso => { try { return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); } catch(e){ return iso; } };

const IS_TRAINEE = !!(window.HubStore && HubStore.isTrainee && HubStore.isTrainee());
/* The name on a signature is the one the centre put on the roster, never one
   typed into this page (Ramy, 6 Oct 2026: "there's no option to change it
   there shouldn't be one"). A candidate's own boot leaves it in hub:me. */
const ME = (function(){ try { return JSON.parse(localStorage.getItem('hub:me') || '{}') || {}; } catch(e){ return {}; } })();
const MY_NAME = String(ME.name || '').trim();
const KEY = 'chub:agreement';
/* Staff open this with ?trainee=<id> from that trainee's own row in the pack,
   the same way the observation sheets and the marked assignments do (Ramy,
   6 Oct 2026: he signed as a trainee, saw it, and the assessor still could
   not -- the link they clicked named no one, so the page had nothing to show
   but its own empty browser). Without an id, a tutor or assessor still reads
   the AGREEMENT ITSELF -- it is the whole course's words to read -- but there
   is no one signature to show. */
const P = new URLSearchParams(location.search);
const TRAINEE_ID = P.get('trainee') || '';
let WHO = '';
if (!IS_TRAINEE && TRAINEE_ID) {
  try {
    const roster = JSON.parse(localStorage.getItem('connect_roster_v1') || '{}') || {};
    WHO = ((roster.trainees || {})[TRAINEE_ID] || {}).name || '';
  } catch (e) {}
}
if (!IS_TRAINEE && TRAINEE_ID) $('back').href = '12_assessor_pack.html';

function settings(){ try { return JSON.parse(localStorage.getItem('connect_course_settings') || 'null') || {}; } catch(e){ return {}; } }
/* The trainee's own browser is the record while they hold the link -- the
   only copy, and theirs to add a signature to. Staff read the same signature
   off the roster, which is where their write reaches the store from. Staff
   with no trainee named have nobody's signature to show; that is not the
   same as nobody having signed. */
function record(){
  if (IS_TRAINEE) { try { return JSON.parse(localStorage.getItem(KEY) || 'null') || {}; } catch(e){ return {}; } }
  if (!TRAINEE_ID) return {};
  try {
    const roster = JSON.parse(localStorage.getItem('connect_roster_v1') || '{}') || {};
    return ((roster.trainees || {})[TRAINEE_ID] || {}).agreement || {};
  } catch (e) { return {}; }
}
function saveRecord(r){ if (!IS_TRAINEE) return; try { localStorage.setItem(KEY, JSON.stringify(r)); } catch(e){} }

/* Handbook 6.3's sections, in its order (7 Oct 2026); the CELTA 5's four are among them. A section the centre left empty is not shown. */
const SECTIONS = [
  ['agrExpectations', 'What we expect of you'],
  ['agrSpecialRequirements', 'Declaring special requirements'],
  ['agrPreCourse', 'Before the course starts'],
  ['agrAttendance', 'Attendance and illness'],
  ['agrPlagiarism', 'Plagiarism and the use of AI'],
  ['agrResubmissions', 'Resubmissions of written work'],
  ['agrDeferrals', 'Deferrals, extensions and withdrawal'],
  ['agrFees', 'Fees and refunds'],
  ['agrSpecialConsideration', 'Special consideration'],
  ['agrFromUs', 'What you can expect from us'],
  ['agrComplaints', 'If you have a concern or a complaint'],
  ['agrMode', 'Your course mode'],
  ['agrData', 'Your personal information'],
];

/* A signature is against the words that were on the screen when it was given.
   If the centre rewrites the agreement afterwards, the old signature should not
   silently stand for the new text -- so the text is fingerprinted at signing
   and the screen says so when the two no longer match. Not a security measure;
   a bookkeeping one. */
function fingerprint(s){
  let h = 5381; const str = String(s || '');
  for (let i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

/* THE CANDIDATE DECLARATION. Handbook 6.3: the agreement "should include a
   Candidate Declaration where candidates are asked to confirm if they require
   special consideration (e.g., extended time allowance/special arrangements
   etc.)". One question, answered at signing, kept on the signing record as
   `special` so the tutors and the assessor read it where they read the
   signature (Ramy, 8 Oct 2026: "everything in one agreement, one signature"). */
function declForm(rec){
  const sp = (rec && rec.special) || {};
  const yes = sp.needs === true, no = sp.needs === false;
  return `<div class="decl"><h3>Candidate declaration: special requirements</h3>
    <p>Do you have a special requirement &mdash; a disability, a specific learning difficulty or a medical condition &mdash; for which you need an arrangement on this course, such as additional time? You will have told the centre at application; this confirms it, so that the arrangement is in place before you start. Cambridge does not grant arrangements once a course has begun.</p>
    <label><input type="radio" name="decl" value="no"${no ? ' checked' : ''}> No</label>
    <label><input type="radio" name="decl" value="yes"${yes ? ' checked' : ''}> Yes &mdash; this:</label>
    <textarea id="declText" rows="2" placeholder="The requirement, and the arrangement you need" ${yes ? '' : 'disabled'}>${esc(sp.text || '')}</textarea></div>`;
}
function readDecl(){
  const r = document.querySelector('input[name="decl"]:checked'); if (!r) return null;
  const t = (document.getElementById('declText') || {}).value || '';
  return r.value === 'yes' ? { needs: true, text: String(t).trim() } : { needs: false, text: '' };
}
function declLine(rec){
  const sp = rec && rec.special; if (!sp || typeof sp.needs !== 'boolean') return '';
  return '<br><span class="ro">' + (sp.needs ? 'Declared a special requirement: ' + esc(sp.text || '(no detail given)') : 'Declared no special requirement.') + '</span>';
}
document.addEventListener('change', e => { if (e.target && e.target.name === 'decl') { const t = document.getElementById('declText'); if (t) { t.disabled = e.target.value !== 'yes'; if (!t.disabled) t.focus(); } } });
function render(){
  const cs = settings();
  const agr = cs.agreement || {};
  const own = String(((cs.docs || {}).docAgreement) || '').trim();
  const written = SECTIONS.filter(([k]) => String(agr[k] || '').trim());
  const rec = record();
  const body = written.map(([k, label], i) =>
    `<div class="sec c${i % 3}"><h2>${esc(label)}</h2><p class="body">${esc(agr[k])}</p></div>`).join('');
  const print = written.map(([k]) => agr[k]).join('\n') + '|' + own;
  const fp = fingerprint(print);

  const lede = IS_TRAINEE
    ? 'what the centre asks of you and what you may ask of it. Read it, then sign at the bottom.'
    : WHO ? esc(WHO) + '\u2019s copy \u2014 read, and signed below if they have.'
    : 'what the centre asks every trainee to read and sign on joining.';
  let head = `<div class="title"><h1>Candidate agreement</h1>
    <p>${esc(cs.centreName || 'Your centre')}${cs.courseName ? ' &middot; ' + esc(cs.courseName) : ''} &mdash; ${lede}</p></div>`;

  if (!written.length && !own) {
    const msg = IS_TRAINEE
      ? 'Your centre has not put its candidate agreement here yet. There is nothing for you to sign, and nothing is being asked of you. If you were expecting one, your course tutor will know.'
      : 'The centre has not written a candidate agreement on this course, and has not linked one of its own.';
    $('app').innerHTML = head + `<div class="empty">${msg}</div>`;
    return;
  }

  let ownBlock = own
    ? `<div class="ownfile"><b>Your centre keeps its agreement as its own document.</b> <a href="${esc(own)}" target="_blank" rel="noopener noreferrer">Open it</a>, read it, and sign below to record that you have.</div>`
    : '';

  /* The signature. It is written from the roster's name and the candidate's
     own token, so it is the same every time and there is nothing on this page
     that could change it. A centre that rewrites the agreement asks for it
     again (the fingerprint below) -- the same signature, a new date. */
  let sign;
  if (rec.at) {
    const stale = rec.print && rec.print !== fp;
    sign = `<div class="signbox"><h2>Signed</h2>
      <div class="signed">${rec.ink && window.hubInk ? window.hubInk.svg(rec.ink, '', rec.name) : ''}
        <div><b>${esc(rec.name)}</b> &mdash; signed ${esc(when(rec.at))}${declLine(rec)}</div></div>
      ${stale ? `<p class="lead" style="margin:12px 0 0">Your centre has changed the agreement since you signed it. Read it again and sign the new wording; your signature is the same one.</p>
        ${IS_TRAINEE ? declForm(rec) : ''}
        <div class="row"><button class="btn" type="button" id="signBtn">Sign the new wording</button></div>
        <p class="status" id="status"></p>` : ''}</div>`;
  } else if (IS_TRAINEE) {
    sign = MY_NAME ? `<div class="signbox"><h2>Sign it</h2>
      <p class="lead">Signing records that you have read the agreement above and accept it, including how your information is kept and shared with Cambridge. Your name and the date are kept with your course record; your tutor and the assessor can see that you signed and when.</p>
      ${declForm(rec)}
      <div class="row"><button class="btn" type="button" id="signBtn">Read and sign</button></div>
      <p class="status" id="status"></p></div>`
      : `<div class="signbox"><h2>Sign it</h2><p class="ro">Your course has not finished loading your name yet. Give it a moment and open this page again — your signature is written from the name your centre has for you, not one typed here.</p></div>`;
  } else if (TRAINEE_ID) {
    sign = `<div class="signbox"><h2>Not signed yet</h2><p class="ro">${WHO ? esc(WHO) : 'This trainee'} has not signed the agreement.</p></div>`;
  } else {
    sign = `<div class="signbox"><h2>Whose signature?</h2><p class="ro">Open this from a trainee's own row in the assessor's pack to see whether they have signed, and when.</p></div>`;
  }

  $('app').innerHTML = head + ownBlock + body + sign;

  const btn = $('signBtn');
  if (btn) btn.addEventListener('click', async () => {
    const name = (record().name || MY_NAME || '').trim();
    if (!name) { const st = $('status'); if (st) st.textContent = 'Your name has not loaded from the course yet.'; return; }
    /* The declaration comes first: Handbook 6.3 asks that the agreement carry
       a Candidate Declaration on special consideration, signed, so the
       centre can make reasonable adjustments before the course starts. */
    if (IS_TRAINEE && !readDecl()) { const st = $('status'); if (st) st.textContent = 'Answer the declaration first: do you have a special requirement?'; const f = document.querySelector('.decl'); if (f) f.scrollIntoView({ block: 'center' }); return; }
    let ink = '';
    try { ink = await window.hubInk.confirm({ name, title: 'Sign the candidate agreement' }); } catch(e) { ink = null; }
    if (ink === null) return;               // cancelled
    const r = { name, at: now(), print: fp };
    if (ink) r.ink = ink;
    const d = readDecl(); if (d) r.special = d;
    saveRecord(r);
    render();
  });
}
render();
</script>
</body>
</html>
