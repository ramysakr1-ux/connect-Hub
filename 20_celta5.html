<!DOCTYPE html>
<!--
  Connect Lite — the CELTA 5 Record Booklet
  © 2026 Ramy Sakr. All rights reserved.

  Cambridge's CELTA 5 is the candidate's record for the whole course: the
  reading they confirm at the start, the three stage records with the
  candidate's half and the tutor's half, the tables of what was taught,
  watched and written, attendance, and the final declaration. Ramy, 28 Sep
  2026: "we should have the CELTA 5 template built in... the same mechanism
  as the assignments or the lesson plans: trainees write, submit; tutors
  write, return."

  TWO RECORDS, NOT ONE, so the two people never overwrite each other:
    celta5   the candidate's half -- confirmations, their stage-2 self-
             assessment, their signatures, the final checklist. The candidate
             writes it; the store hands it to the tutors and the assessor.
    celta5t  the tutors' half -- stage 1, the tutor's stage-2 and stage-3
             marks and notes, attendance, the tutor's signatures. Tutors
             write it; the candidate reads it.
  Each stage moves the same way an assignment does: the candidate SUBMITS
  their half, the tutor RETURNS theirs, the candidate SIGNS. A signature is
  a typed name and the moment it was typed, as on Connect.

  THE TABLES FILL THEMSELVES from records Lite already keeps: assessed TPs
  from the teaching-practice history, observations from the observation
  sheets, written assignments from the assignment records, the course hours
  from Settings. Nothing is typed twice.

  Two outputs: this page prints Lite's own booklet with Cambridge's text and
  every field, and the "Cambridge's booklet (PDF)" button draws the same
  record onto the real July 2023 master (celta5-pdf.js), page for page.
-->

<style>
  body{background:var(--sand); color:var(--ink); font-family:'Karla',sans-serif; margin:0;}

  .jump a:hover{border-color:var(--grey);}
  section.part{background:var(--surface); border:1px solid var(--sand-line); border-left:5px solid var(--gold); border-radius:10px; padding:18px 22px; margin:0 0 18px;}

  .half{background:var(--paper); border:1px solid var(--sand-line); border-radius:8px; padding:14px 16px;}

    color:var(--ink); background:var(--box); border:1px solid var(--sand-line); border-radius:6px; padding:7px 9px; box-sizing:border-box;}
  textarea{resize:vertical; min-height:70px;}

  textarea[readonly], input[readonly]{background:var(--sand-deep); color:var(--grey);}

  /* Six columns do not fit a phone; the table scrolls in its own box and

  /* Cambridge's appendices: a reference, set quieter than the record itself. */

  /* Cambridge's four marks are a list in the booklet, so they are a list here. */

  .cam-mark::before{content:"\2022"; position:absolute; left:-12px;}
  .appx summary{cursor:pointer; font-weight:700; color:var(--teal); padding:6px 0;}

  .apptopic{font-size:0.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--grey); font-weight:700; margin:14px 0 4px;}

  .appeg{margin:0 0 2px 18px; color:var(--grey); font-size:0.88rem; position:relative;}
  .appeg::before{content:"\25E6"; position:absolute; left:-14px;}
  .gradetbl{overflow-x:auto; margin-top:10px;}

  /* The record's tables are the booklet's own, so they are set like a record
     and not like a spreadsheet: ruled, not boxed; the head in small caps over
     a firm rule; rows breathing; figures lining up. Ramy, 1 Oct 2026: "the
     assessed teaching practice looks like a Word document. You can do better."
     Nothing about what they hold changed -- only how they are set. */
  table.grid{width:100%; border-collapse:collapse; margin:0; font-size:0.86rem;
    font-variant-numeric:tabular-nums;}

  .st.attn{background:var(--pill-attn-bg); border-color:var(--pill-attn-line); color:var(--pill-attn-text);}

    details.read{border:0; padding:0;} details.read summary{display:none;} details.read .body{display:block;}

</style>

<!-- Cambridge's booklet, drawn in the browser: pdf-lib and its font kit as
     UMD scripts, then the port of Connect's replica engine. Loaded on every
     open of this page (1.3 MB, cached by the browser); the master PDF and the
     fonts come from the store only when the button is pressed. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="celta5-pdf.js?v=202610012346"></script>
<script src="hub-ink.js?v=202610012346"></script>
<script src="assignment-defaults.js?v=202610012346"></script>
<script src="celta5-text.js?v=202610012346"></script>
<script src="celta5-appendix.js?v=202609302308"></script>
<script src="celta5-criteria.js?v=202610012346"></script>
<script src="hub-tracker.js?v=202610012346"></script>
<script src="observation-defaults.js?v=202610012346"></script>
<script src="hub-shared.js?v=202610012346"></script>
<script src="hub-store.js?v=202610012346"></script>
<script src="hub-sync.js?v=202610012346"></script>
<script type="text/x-hub-app">
const MODE = window.HubMode;            // trainee | tutor | assessor
const IS_TRAINEE = MODE === 'trainee', IS_TUTOR = MODE === 'tutor';
const P = new URLSearchParams(location.search);
const TOKEN = IS_TRAINEE ? null : (P.get('trainee') || '');
const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const KEYQ = ['t','k','ak','trainee'].filter(n => P.get(n)).map(n => n + '=' + encodeURIComponent(P.get(n))).join('&');
const T = window.HubTracker;
const TEXT = window.CONNECT_HUB_CELTA5_TEXT || [];
const CRIT = window.CONNECT_HUB_CRITERIA || [];
const SETTINGS = rec('connect_course_settings') || {};

/* ---- who, and the two halves ------------------------------------------- */
let who = null;              // { name, token, tr }  tr = the roster trainee (tutor/assessor) or a trainee-shaped object (candidate)
let C = {}, TT = {};         // C: the candidate's half (celta5); TT: the tutors' half (celta5t)
if (IS_TRAINEE) {
  const me = rec('hub:me') || {};
  who = { name: me.name || '', token: me.token || '' };
  C = rec('chub:celta5') || {}; TT = rec('chub:celta5t') || {};
  /* The tables read the same shapes the tracker reads, from the candidate's own keys. */
  who.tr = { id: me.token, name: me.name, tp: { plan: rec('chub:plan'), selfeval: rec('chub:selfeval'), feedback: rec('chub:feedback'), history: rec('chub:tpHistory') || {} },
             assignments: rec('connect_assignment_submissions_v1') || {}, tracker: rec('chub:tracker') || {}, observations: rec('connect_observations_v1') || {} };
} else {
  const roster = rec('connect_roster_v1') || {};
  const tr = TOKEN && roster.trainees ? roster.trainees[TOKEN] : null;
  if (tr) { who = { name: tr.name, token: TOKEN, tr }; C = tr.celta5 || {}; TT = tr.celta5t || {}; }
}
const saveC = () => { if (!IS_TRAINEE) return; localStorage.setItem('chub:celta5', JSON.stringify(C)); flash(); };
const saveT = () => {
  if (!IS_TUTOR) return;
  const r = rec('connect_roster_v1'); if (!r || !r.trainees || !r.trainees[TOKEN]) { alert('The roster has not loaded yet — give it a moment.'); return; }
  r.trainees[TOKEN].celta5t = TT; localStorage.setItem('connect_roster_v1', JSON.stringify(r)); flash();
};
let ft; const flash = () => { const s = $('savedNote'); if (!s) return; s.textContent = 'Saved'; clearTimeout(ft); ft = setTimeout(() => { if ($('savedNote')) $('savedNote').textContent = ''; }, 1400); };
const now = () => new Date().toISOString();
const when = iso => iso ? new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }) : '';
const tutorName = () => (localStorage.getItem('chub:tutorName') || localStorage.getItem('hub:tutorName') || '').trim(); // chub:tutorName is what the dashboard's "Your name" keeps

/* ---- pieces ------------------------------------------------------------- */
const pill = (t, cls) => `<span class="st ${cls||''}">${t}</span>`;
/* The hours taught at each stage, as a starting figure. Cambridge asks for six
   hours of assessed teaching across the course, so with eight teaching
   practices each is forty-five minutes: Stage 1 comes after TP2 (1.5), Stage 2
   at the half-way point (3), Stage 3 at the end (6). Ramy, 30 Sep 2026: "that's
   the standard" -- and standard means a figure already in the box, not a rule.
   The tutor can type anything over it, and a centre whose course is built
   differently gets its own arithmetic from the number of teaching practices it
   actually runs. Nothing is written by looking: the figure goes into the record
   in memory and is saved with whatever the tutor does next. */
const ASSESSED_HOURS = 6;
function standardHours(which) {
  const tps = Math.max(2, parseInt(SETTINGS.tpCount, 10) || 8);
  const done = which === 's1' ? 2 : which === 's3' ? tps : Math.round(tps / 2);
  const h = ASSESSED_HOURS * done / tps;
  return String(Math.round(h * 100) / 100);
}

const field = (obj, key, label, opts) => {
  /* A stage's hours arrive filled in, unless somebody has already changed them
     or the stage has been returned and locked. */
  if (key === 'hoursTaught' && opts.mine && !opts.locked && !obj[key]) {
    obj[key] = standardHours(opts.o === 's2t' ? 's2' : opts.o);
  }
  const v = obj[key] || '';
  const mine = opts.mine;
  if (!mine) return `<label class="f">${label}</label><div class="ro ${v ? '' : 'empty'}">${v ? esc(v) : 'Nothing written yet'}</div>`;
  return `<label class="f">${label}</label>` + (opts.input
    ? `<input type="${opts.input}" data-o="${opts.o}" data-k="${key}" value="${esc(v)}"${opts.locked ? ' readonly' : ''}>`
    : `<textarea data-o="${opts.o}" data-k="${key}"${opts.locked ? ' readonly' : ''}>${esc(v)}</textarea>`);
};
const RATINGS = [['above','Above standard'],['to','To standard'],['not','Not to standard']];
const MARKS_TUTOR = ['S+','S','N'], MARKS_CAND = ['S+','S','N','X'];
const rating = (obj, key, opts) => {
  const v = obj[key] || '';
  if (!opts.mine || opts.locked) return `<div class="rating">${RATINGS.map(([k,l]) => `<label class="dis" style="${v===k ? 'background:var(--teal);border-color:var(--teal);color:var(--paper)' : 'opacity:.55'}">${l}</label>`).join('')}</div>`;
  return `<div class="rating">${RATINGS.map(([k,l]) => `<label><input type="radio" name="${opts.o}-${key}" data-o="${opts.o}" data-k="${key}" value="${k}"${v===k?' checked':''}><span>${l}</span></label>`).join('')}</div>`;
};
/* Cambridge's agree / do not agree is a CHOICE on the form, printed beside
   the signature line, and a signature is the act, not the answer. Stored as
   true/false so "not answered" stays distinct from "does not agree". */
const election = (obj, key, opts) => {
  const v = obj[key];
  const opt = (val, label) => (!opts.mine || opts.locked)
    ? `<label class="dis" style="${v===val ? 'background:var(--teal);border-color:var(--teal);color:var(--paper)' : 'opacity:.55'}">${label}</label>`
    : `<label><input type="radio" name="${opts.o}-${key}" data-elect="${opts.o}:${key}" value="${val?'y':'n'}"${v===val?' checked':''}><span>${label}</span></label>`;
  return `<div class="elect"><p class="lead">${opts.lead}</p><div class="rating">${opt(true, opts.yes)}${opt(false, opts.no)}</div></div>`;
};
/* one signature: a typed name and the moment */
const signature = (obj, key, opts) => {
  const s = obj[key];
  if (s && s.at) return `<div class="signed${s.ink ? ' inked' : ''}">${s.ink ? window.hubInk.svg(s.ink) : ''}<div><b>${esc(s.name)}</b> — signed ${when(s.at)}</div></div>`;
  if (!opts.mine) return `<div class="ro empty" style="margin-top:12px">${opts.waiting || 'Not signed yet'}</div>`;
  if (opts.locked) return `<div class="ro empty" style="margin-top:12px">${opts.locked}</div>`;
  return `<div class="sig"><div class="who"><label class="f">${opts.label || 'Your name, to sign'}</label><input type="text" data-sig="${opts.o}:${key}" value="${esc(opts.prefill || '')}" placeholder="Type your name"></div><button class="btn primary" type="button" data-sign="${opts.o}:${key}">${opts.button || 'Sign'}</button></div>`;
};
const marksGrid = (candMarks, tutorMarks, opts) => {
  const topics = opts.topics; let last = '';
  /* Cambridge's scale, not a reduction of it. The form defines S+ "Above the
     Standard", S "Meets the Standard", N "Not to standard", and for the
     candidate's own column X "Not Applicable at this stage in the course
     because you have not yet focused on teaching or planning skills
     associated with that criterion". Lite offered S and N only, so nobody
     could record above standard -- evidence a Pass A rests on -- and a
     criterion the course had not reached looked identical to one failed
     (audit, 29 Sep 2026). X is the candidate's alone, as on the form. */
  const cell = (marks, mine, name) => code => {
    const v = (marks || {})[code] || '';

    if (!mine) return `<span class="mk"><span class="shown${v ? '' : ' none'}">${scale.includes(v) ? esc(v) : '–'}</span></span>`;
    return `<span class="mk">${scale.map(m => `<label class="m${m.length > 1 ? ' wide' : ''}"><input type="radio" name="${name}-${code}" data-marks="${name}" data-code="${code}" value="${m}"${v===m?' checked':''}>${m}</label>`).join('')}</span>`;
  };
  const cCell = cell(candMarks, opts.candMine, 'cand'), tCell = cell(tutorMarks, opts.tutorMine, 'tutor');
  const names = { '1':'Learners and teachers, and the teaching and learning context', '2':'Language analysis and awareness', '3':'Language skills', '4':'Planning and resources for different teaching contexts', '5':'Developing teaching skills and professionalism' };
  let rows = '';
  CRIT.filter(c => topics.includes(c[1])).forEach(c => {
    if (c[1] !== last) { rows += `<tr class="topic"><td colspan="${opts.showCand ? 4 : 3}">${c[1]} · ${esc(names[c[1]] || '')}</td></tr>`; last = c[1]; }
    rows += `<tr><td class="code">${c[0]}</td><td>${esc(c[2])}</td>${opts.showCand ? `<td class="mark">${cCell(c[0])}</td>` : ''}<td class="mark">${tCell(c[0])}</td></tr>`;

};

const obsLength = (k, a) => { if (a && a.hLength) return a.hLength; try { const set = (rec('connect_observation_wording_v1') && rec('connect_observation_wording_v1').filmed) ? rec('connect_observation_wording_v1') : (window.CONNECT_HUB_OBSERVATION_DEFAULTS || {}); const t = [].concat(set.filmed || [], set.live || []).find(x => x && x.id === k); return t && t.minutes ? String(t.minutes) : ''; } catch (e) { return ''; } };

/* Cambridge's own Record of Assessment of Written Assignments (July 2023,
   page 12): four rows by title, and four columns -- Pass at the first
   submission, Pass at the second, Fail, and the candidate's signature under
   "I confirm that this is my own work".

   This page used to print Outcome / Round / Marking, which is Lite's internal
   language and is not on the form: "what is round two, round one unmarking?
   ... you're supposed to sign this. Can you make it like the one in the CELTA
   5?" (Ramy, 1 Oct 2026). The marks below are read from the same assignment
   records as before; only the shape is Cambridge's. A state with no outcome
   yet -- submitted and being marked, returned unmarked, not submitted -- ticks
   nothing, exactly as a paper form would carry nothing. */
function waTable(){
  const subs = who.tr.assignments || {};
  const W = (rec('connect_assignment_wording_v2') || window.CONNECT_HUB_DEFAULT_WORDING || {});
  const A = { fol:'Focus on the Learner', lrt:'Language Related Tasks', lsrt:'Language Skills Related Tasks', lfc:'Lessons from the Classroom' };
  Object.keys(A).forEach(k => { const t = (W[k] || {}).title; if (t && String(t).trim()) A[k] = String(t).trim(); });
  const wa = C.wa || {};
  const tick = '<span class="watick">\u2713</span>';
  const rows = ['fol','lrt','lsrt','lfc'].map(k => {
    const st = T.assignmentState(subs[k]);
    const first = st.code === 'PASS' && (!st.round || st.round === 1);
    const second = st.code === 'RES' || (st.code === 'PASS' && st.round > 1);
    const failed = st.code === 'FAIL';
    const sig = signature(wa, k, { o: 'wa', mine: IS_TRAINEE, prefill: who.name, label: 'Your name, to sign', button: 'Sign', waiting: 'Not signed yet' });
    return `<tr><td>${esc(A[k] || k.toUpperCase())}</td><td class="wac">${first ? tick : ''}</td><td class="wac">${second ? tick : ''}</td><td class="wac">${failed ? tick : ''}</td><td class="wasig">${sig}</td></tr>`;
  }).join('');
  return `<div class="watbl"><table class="grid"><thead><tr><th>Title</th><th class="wac">Pass<small>1st submission</small></th><th class="wac">Pass<small>2nd submission</small></th><th class="wac">Fail</th><th>Candidate signature<small>I confirm that this is my own work</small></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function assignRows(){
  const subs = who.tr.assignments || {};
  /* Cambridge's page lists the four by TITLE. This read T.ASSIGN_LABEL, which
     is a marking-STATE map (PASS, FAIL, WAIT...), so A[k] was always undefined
     and the fallback printed FOL / LRT / LSRT / LFC on the record (audit,
     29 Sep 2026). The real titles are the centre's own wording, with the
     shipped defaults behind them. */
  const W = (rec('connect_assignment_wording_v2') || window.CONNECT_HUB_DEFAULT_WORDING || {});
  const A = { fol:'Focus on the Learner', lrt:'Language Related Tasks', lsrt:'Language Skills Related Tasks', lfc:'Lessons from the Classroom' };
  Object.keys(A).forEach(k => { const t = (W[k] || {}).title; if (t && String(t).trim()) A[k] = String(t).trim(); });
  return ['fol','lrt','lsrt','lfc'].map(k => { const st = T.assignmentState(subs[k]); const word = { PASS:'Pass', RES:'Pass (on resubmission)', FAIL:'Fail', FAILRES:'Resubmission required', WAIT:'Submitted, being marked', WAIT2:'Resubmitted, being marked', UNMARKED:'Returned unmarked', '':'Not submitted' }[st.code] || st.code;
    return [A[k] || k.toUpperCase(), word, st.round ? 'round ' + st.round : '', st.dm ? 'double-marked' : '']; });
}

function appendices(){

  const body = A.map(r =>
      r.kind === 'app'   ? `<h3 class="apph">${esc(r.text)}</h3>`
    : r.kind === 'lead'  ? `<p class="applead">${esc(r.text)}</p>`

/* ---- Cambridge's booklet: Lite's records in the shape Connect's replica takes ------ */
/* Cambridge's own five, word for word (CELTA 5 July 2023, final day page).

   "at two levels" for "at AT LEAST two levels", "submitted" for "completed",
   "the work in my portfolio" for "the written assignments", and "complete and

   candidate signs on Cambridge's form, so it is quoted, not improved. */
const FINAL_LINES = [

  ['wa','I have completed four written assignments.'],
  ['own','The written assignments are my own work.'],
  ['records','I have completed all records.']
];
const RATE = { above: 'above_standard', to: 'to_standard', not: 'not_to_standard' };
const sigName = s => (s && s.at) ? s.name : null, sigAt = s => (s && s.at) ? s.at : null, sigInk = s => (s && s.at && s.ink) ? s.ink : null;
const shortDate = iso => iso ? new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
function bookletInput(){
  const s1 = TT.stage1 || {}, s2c = C.stage2 || {}, s2t = TT.stage2 || {}, s3 = TT.stage3 || {}, att = TT.attendance || {}, fin = C.final || {}, fint = TT.final || {}, conf = C.confirms || {};
  const hist = T.tpHistory(who.tr), flat = T.recordFor(who.tr);
  const assessedTp = Object.keys(hist).sort((a, b) => a - b).map(n => { const f = (hist[n].state && hist[n].state.f) || {};
    /* 9.1.2: "The type of lesson must be recorded in the CELTA 5." The tutor's
       own main aim is that record; the tracker's regex category (aimFor) was
       printed first and turned "Speaking -- describing past holidays" into
       "Grammar" on Cambridge's form (second audit, 29 Sep 2026). */
    /* Ramy, 1 Oct 2026: the lesson focus is the main aim AND the sub aim
       together -- "Grammar and Speaking" -- read off the tutor's feedback
       form; nobody types it on the booklet. */
    const mainAim = f.fMain || f.fAim || flat['tp' + n + '_aim'] || '';
    const subAim = f.fSub || '';
    const focus = (mainAim && subAim) ? mainAim + ' and ' + subAim.charAt(0).toLowerCase() + subAim.slice(1) : (mainAim || subAim || null);
    /* Ramy, 1 Oct 2026: never S+ / S / N on Cambridge's form -- the words.
       The feedback form's own grade already reads "Above standard" / "To
       standard" / "Not to standard"; a bare code typed by hand is widened. */
    const g = String(f.fGrade || ''); const code = /above|^S\+$/i.test(g) ? 'Above standard' : /not|^N$/i.test(g) ? 'Not to standard' : /standard|^S$/i.test(g) ? 'To standard' : g;
    const initials = String(f.fTutor || '').split(/\s+/).filter(Boolean).map(w => w[0].toUpperCase()).join('');
    return { date: f.fDate ? shortDate(f.fDate) : '', lengthMinutes: f.fTime ? Number(f.fTime) || null : null, level: f.fLevel || null, learnerCount: f.fStudents ? Number(String(f.fStudents).replace(/\D/g, '')) || null : null, lessonFocus: focus, tutorAssessment: code || null, tutorInitials: initials || null }; });
  const w = who.tr.observations || {};
  const observations = window.hubObservationSet().all.filter(k => w[k] && w[k].turnedInAt).map(k => { const a = w[k].a || {};
    return { date: a.hDate || '', lengthMinutes: obsLength(k, a) ? Number(String(obsLength(k, a)).replace(/\D/g, '')) || null : null, level: a.hLevel || null,

  const subs = who.tr.assignments || {};
  const WA = { fol: 'Focus on Learner', lrt: 'LRT', lsrt: 'Skills', lfc: 'LfC' };
  /* Cambridge's own-work column on the written-assignments page is a
     SIGNATURE. It used to be filled from `grade ? who.name : null`, so the
     software typed the candidate's name onto Cambridge's form the moment a
     grade existed, whether or not they had confirmed anything (compliance
     audit, 29 Sep 2026). The candidate does make that confirmation, on the
     submission form, where every line of the declaration is a hard gate --
     so the name goes on the line only where that declaration is on the
     record, and the act, not the grade, is what puts it there. */
  /* The declaration is stored per SECTION, as { checks:[true,...], aiUsed,... }
     under the section's index -- the same shape declOk on the submission form

  const WORDING_ALL = rec('connect_assignment_wording_v2') || window.CONNECT_HUB_DEFAULT_WORDING || {};
  const ownWorkConfirmed = (sub, k) => {
    const d = (sub && sub.sub1 && sub.sub1.decl) || null; if (!d) return false;
    const secs = ((WORDING_ALL[k] || {}).sections) || [];
    const declIdx = secs.map((s, i) => s && s.type === 'declaration' ? i : -1).filter(i => i >= 0);
    if (!declIdx.length) return Object.values(d).some(x => x && Array.isArray(x.checks) && x.checks.length && x.checks.every(c => c === true));
    return declIdx.every(i => { const x = d[i]; const items = (secs[i].items || []); return !!x && Array.isArray(x.checks) && items.every((_, ci) => x.checks[ci] === true); });
  };
  const assignments = Object.keys(WA).map(k => { const st = T.assignmentState(subs[k]);
    const grade = st.code === 'PASS' || st.code === 'RES' ? 'Pass' : st.code === 'FAIL' ? 'Fail' : null;
    return { assignmentType: WA[k], finalGrade: grade, passedOnResubmission: st.code === 'RES', candidateSignatureName: ownWorkConfirmed(subs[k], k) ? who.name : null }; });
  const absRow = r => ({ date: r.date || '', sessionMissed: r.session || null, reason: r.reason || null, workMadeUp: r.madeUp || null, candidateComment: r.cand || null, tutorComment: r.tutor || null });
  const abs = (att.rows || []).map(absRow), other = (att.other || []).map(absRow);
  const marks = m => { const out = {}; Object.keys(m || {}).forEach(k => { out[k] = m[k] || null; }); return out; };
  return {
    cover: { traineeName: who.name, centerName: SETTINGS.centreName || '', centerNumber: (SETTINGS.centreNumber || '').slice(0, 5), courseCode: SETTINGS.notificationRef || null,
             courseNumber: SETTINGS.courseNumber || null, uln: (TT.cover || {}).uln || null,
             courseDates: (SETTINGS.start && SETTINGS.end) ? shortDate(SETTINGS.start) + ' - ' + shortDate(SETTINGS.end) : '', tutorNames: String(SETTINGS.tutorNames || '').split(/,|\band\b/).map(x => x.trim()).filter(Boolean) },
    attendance: { totalCourseHours: SETTINGS.totalHours ? Number(SETTINGS.totalHours) : null, totalHoursAttended: att.attended ? Number(att.attended) : null, unavoidableAbsences: abs, otherAbsences: other },
    stage1: { tutorialGiven: s1.tutorialGiven === 'yes' || s1.tutorialGiven === true ? true : s1.tutorialGiven === 'no' ? false : null, hoursTaught: s1.hoursTaught ? Number(s1.hoursTaught) : null, strengths: s1.strengths || null, actionPlan: s1.actionPlan || null,
              candidateAgrees: typeof (C.stage1 || {}).agrees === 'boolean' ? C.stage1.agrees : null,
              candidateSignatureName: sigName((C.stage1 || {}).signed), candidateSignedAt: sigAt((C.stage1 || {}).signed), candidateSignatureInk: sigInk((C.stage1 || {}).signed), tutorSignatureName: sigName(s1.signedBy), tutorSignedAt: sigAt(s1.signedBy), tutorSignatureInk: sigInk(s1.signedBy) },
    observations, assessedTp,
    candidateStage2Marks: marks(s2c.marks), tutorStage2Marks: marks(s2t.marks), tutorStage3Marks: marks(s3.marks),
    writtenAssignments: { assignments },
    stage2Notes: { candidateWrittenAssignmentsNotes: s2c.notesWA || null, tutorWrittenAssignmentsNotes: s2t.notesWA || null, candidateOtherNotes: s2c.notesOther || null, tutorOtherNotes: s2t.notesOther || null },
    stage2Overall: { candidateOverall: RATE[s2c.overall] || null, candidateNotes: s2c.areas || null, tutorOverall: RATE[s2t.overall] || null, tutorNotes: s2t.summary || null,
                     hoursTaught: s2t.hoursTaught || null,
                     candidateAccurate: typeof s2c.accurate === 'boolean' ? s2c.accurate : null, candidateAgrees: typeof s2c.agrees === 'boolean' ? s2c.agrees : null,
                     tutorSignatureName: sigName(s2t.signedBy), tutorSignedAt: sigAt(s2t.signedBy), tutorSignatureInk: sigInk(s2t.signedBy), candidateSignatureName: sigName(s2c.signed), candidateSignedAt: sigAt(s2c.signed), candidateSignatureInk: sigInk(s2c.signed) },
    stage3Header: { tutorialGiven: s3.tutorialGiven === 'yes' ? true : s3.tutorialGiven === 'no' ? false : null, hoursTaught: s3.hoursTaught || null },
    stage3Notes: { tutorWrittenAssignmentsNotes: s3.notesWA || null, tutorOtherNotes: s3.notesOther || null },
    stage3Overall: { tutorOverall: RATE[s3.overall] || null, tutorNotes: s3.summary || null, tutorSignatureName: sigName(s3.signedBy), tutorSignedAt: sigAt(s3.signedBy), tutorSignatureInk: sigInk(s3.signedBy),
                     candidateAgrees: typeof (C.stage3 || {}).agrees === 'boolean' ? C.stage3.agrees : null,
                     candidateSignatureName: sigName((C.stage3 || {}).signed), candidateSignedAt: sigAt((C.stage3 || {}).signed), candidateSignatureInk: sigInk((C.stage3 || {}).signed) },
    finalDeclaration: { checklistTp: !!(fin.checks || {}).tp, checklistObservations: !!(fin.checks || {}).obs, checklistAssignments: !!(fin.checks || {}).wa, checklistOwnWork: !!(fin.checks || {}).own, checklistAllRecords: !!(fin.checks || {}).records,
                        gradeReviewComments: fint.gradeReview || null,
                        candidateSignatureName: sigName(fin.signed), candidateSignedAt: sigAt(fin.signed), candidateSignatureInk: sigInk(fin.signed), tutorSignatureName: sigName(fint.signed), tutorSignedAt: sigAt(fint.signed), tutorSignatureInk: sigInk(fint.signed) },
    confirmations: { candidateName: who.name, portfolioConfirmedAt: sigAt(conf.portfolio), portfolioSignatureName: sigName(conf.portfolio), portfolioSignatureInk: sigInk(conf.portfolio), appealsConfirmedAt: sigAt(conf.appeals), appealsSignatureName: sigName(conf.appeals), appealsSignatureInk: sigInk(conf.appeals) }
  };
}
let ASSETS = null;
/* for a headless check of the drawing, nothing else reads this */
window.hubCelta5Debug = { input: bookletInput, withC: (c, t) => { Object.assign(C, c); Object.assign(TT, t); } };
async function cambridgeBooklet(){
  const st = $('pdfStatus'), btn = $('cambridgePdf'); btn.disabled = true;
  try {
    if (!ASSETS) { st.textContent = 'Fetching Cambridge\u2019s form from the store\u2026'; const a = await window.HubStore.call({ op: 'celta5Assets' });
      const b = window.hubCelta5Pdf.fromBase64; ASSETS = { master: b(a['celta5-master-july-2023.pdf']), regular: b(a['Arimo-Regular.ttf']), bold: b(a['Arimo-Bold.ttf']) }; }
    st.textContent = 'Drawing the booklet\u2026';
    const bytes = await window.hubCelta5Pdf.render(bookletInput(), ASSETS);
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = 'CELTA 5 \u2014 ' + who.name + '.pdf'; document.body.appendChild(a); a.click(); a.remove();
    st.textContent = 'Downloaded \u2014 CELTA 5 \u2014 ' + who.name + '.pdf';

}
/* Cambridge has TWO absence tables: unavoidable absence (four columns plus
   the tutor's signature) and other absences/late arrivals (the same plus a
   candidate comment). Lite drew half the page -- the second table was
   hard-coded empty and the first table's signature column read a key nothing
   ever set (audit, 29 Sep 2026). */
const ABS_CELLS = { abs: ['date','session','reason','madeUp','tutor'], oth: ['date','session','reason','madeUp','cand','tutor'] };
const ABS_PLACE = { date:'Date / times', session:'Session missed', reason:'Reason', madeUp:'Work made up', cand:'Candidate comment', tutor:'Tutor comment / signature' };
function absenceRow(r, i, mine, which){
  const cells = ABS_CELLS[which || 'abs'];
  const style = ` style="grid-template-columns:repeat(${cells.length},1fr)"`;
  if (!mine) return `<div class="absence"${style}>${cells.map(k => `<div class="ro ${r[k]?'':'empty'}">${esc(r[k] || '–')}</div>`).join('')}</div>`;
  return `<div class="absence"${style}>${cells.map(k => `<input type="text" data-abs="${i}" data-which="${which || 'abs'}" data-k="${k}" value="${esc(r[k] || '')}" placeholder="${ABS_PLACE[k]}">`).join('')}</div>`;
}

/* ---- writing --------------------------------------------------------------- */
const OBJ = { wa: () => (C.wa = C.wa || {}), conf: () => (C.confirms = C.confirms || {}), c1: () => (C.stage1 = C.stage1 || {}), s2c: () => (C.stage2 = C.stage2 || {}), c2: () => (C.stage2 = C.stage2 || {}), c3: () => (C.stage3 = C.stage3 || {}), fin: () => (C.final = C.final || {}),
              cover: () => (TT.cover = TT.cover || {}), s1: () => (TT.stage1 = TT.stage1 || {}), s2t: () => (TT.stage2 = TT.stage2 || {}), s3: () => (TT.stage3 = TT.stage3 || {}), att: () => (TT.attendance = TT.attendance || {}), fint: () => (TT.final = TT.final || {}) };
const isMineObj = o => /^(wa|conf|c1|s2c|c2|c3|fin)$/.test(o) ? IS_TRAINEE : IS_TUTOR;
const save = o => (isMineObj(o) && /^(wa|conf|c1|s2c|c2|c3|fin)$/.test(o)) ? saveC() : saveT();
function bind(){
  const app = $('app');
  app.querySelectorAll('[data-o][data-k]').forEach(el => el.addEventListener('input', () => {
    const o = el.dataset.o; if (!isMineObj(o)) return;
    const obj = OBJ[o](); obj[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.type === 'radio' ? el.value : el.value; save(o);
  }));
  app.querySelectorAll('[data-o][data-k][type=checkbox], [data-o][data-k][type=radio]').forEach(el => el.addEventListener('change', () => { const o = el.dataset.o; if (!isMineObj(o)) return; const obj = OBJ[o](); obj[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; save(o); }));
  app.querySelectorAll('[data-marks]').forEach(el => el.addEventListener('change', () => {
    const which = el.dataset.marks; const stage = el.closest('section').id === 's3' ? 'stage3' : 'stage2';
    if (which === 'cand') { if (!IS_TRAINEE) return; C[stage] = C[stage] || {}; C[stage].marks = C[stage].marks || {}; C[stage].marks[el.dataset.code] = el.value; saveC(); }
    else { if (!IS_TUTOR) return; TT[stage] = TT[stage] || {}; TT[stage].marks = TT[stage].marks || {}; TT[stage].marks[el.dataset.code] = el.value; saveT(); }
  }));
  app.querySelectorAll('[data-final]').forEach(el => el.addEventListener('change', () => { if (!IS_TRAINEE) return; C.final = C.final || {}; C.final.checks = C.final.checks || {}; C.final.checks[el.dataset.final] = el.checked; saveC(); }));
  const absList = which => { TT.attendance = TT.attendance || {}; const k = which === 'oth' ? 'other' : 'rows'; return (TT.attendance[k] = TT.attendance[k] || []); };
  app.querySelectorAll('[data-abs]').forEach(el => el.addEventListener('input', () => { if (!IS_TUTOR) return; const list = absList(el.dataset.which); const r = list[+el.dataset.abs] = list[+el.dataset.abs] || {}; r[el.dataset.k] = el.value; saveT(); }));
  app.querySelectorAll('[data-add-absence]').forEach(b => b.addEventListener('click', () => { if (!IS_TUTOR) return; absList(b.dataset.addAbsence).push({}); saveT(); render(); }));
  /* An election is a three-state answer: agreed, did not agree, not answered. */
  app.querySelectorAll('[data-elect]').forEach(el => el.addEventListener('change', () => {
    const [o, key] = el.dataset.elect.split(':'); if (!isMineObj(o)) return;
    OBJ[o]()[key] = el.value === 'y'; save(o);
  }));
  /* A signature is the typed name and the moment; the drawn ink, when the
     signer draws one, rides along as a small path (hub-ink.js). */
  app.querySelectorAll('[data-sign]').forEach(b => b.addEventListener('click', async () => {
    const [o, key] = b.dataset.sign.split(':'); if (!isMineObj(o)) return;
    const input = app.querySelector(`[data-sig="${o}:${key}"]`); const name = (input && input.value.trim()) || '';
    if (!name) { alert('Type your name to sign.'); return; }
    const ink = await window.hubInk.pad({ name, title: b.textContent.trim() }); if (ink === null) return;
    const obj = OBJ[o](); obj[key] = ink ? { name, at: now(), ink } : { name, at: now() }; if (o === 'fint' && IS_TUTOR) localStorage.setItem('chub:tutorName', name);
    save(o); render();
  }));
  app.querySelectorAll('[data-submit]').forEach(b => b.addEventListener('click', () => { if (!IS_TRAINEE) return; C.stage2 = C.stage2 || {}; C.stage2.submittedAt = now(); saveC(); render(); }));
  app.querySelectorAll('[data-return]').forEach(b => b.addEventListener('click', async () => {
    if (!IS_TUTOR) return; const stage = b.dataset.return;
    const got = await window.hubInk.pad({ askName: true, name: tutorName(), title: 'Sign and return ' + stage.replace('stage', 'Stage ') }); if (!got || !got.name) return;
    const name = got.name, ink = got.ink;
    localStorage.setItem('chub:tutorName', name); TT[stage] = TT[stage] || {}; TT[stage].returnedAt = now(); TT[stage].signedBy = ink ? { name, at: now(), ink } : { name, at: now() }; saveT(); render();
  }));
  app.querySelectorAll('[data-reopen]').forEach(b => b.addEventListener('click', () => {
    if (!IS_TUTOR) return; const stage = b.dataset.reopen; if (!confirm('Reopen ' + stage.replace('stage','Stage ') + ' for editing? The candidate’s signature on it, if any, stays on the record until they sign again.')) return;
    TT[stage] = TT[stage] || {}; delete TT[stage].returnedAt; delete TT[stage].signedBy; saveT(); render();
  }));
}
render();
