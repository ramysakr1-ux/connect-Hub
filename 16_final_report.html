<!DOCTYPE html>
<!--
  Connect Lite — the final course report, one candidate
  © 2026 Ramy Sakr. All rights reserved.

  Ramy, 25 Sep 2026: "we should add a final report similar to the one we have in
  Connect. Should be an easy build since we already have all the information
  here." It is Connect's document, page for page: a cover that certifies the
  attendance, the hours, the delivery mode and the provisional grade, over the
  tutors' signatures; then the report proper -- the two assessment areas, the
  performance descriptor for the grade in the syllabus's own words (Appendix
  2), and the overall comment.

  What was NOT already here, and now lives where it belongs: course hours,
  delivery mode and the tutors' names on Course admin's settings; hours
  attended and the overall comment on the grades report, under each candidate.
  The two grades for the assessment areas are not typed anywhere: teaching is
  the final grade the grades report holds, and the written assignments are
  Pass or Fail read off the candidate's own assignment record.

  Who opens it: the tutors, and the assessor from the pack. Not the candidate.
  Connect releases a candidate's own copy as a separate, later act, once
  Cambridge has confirmed; Lite has no such release yet, so the candidate's
  link is refused at the door rather than shown a grade nobody has confirmed.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Connect Lite — Final course report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700;1,600&family=Karla:wght@400;500;600;700&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(92.5% 0.012 85); --sand-line:oklch(89.5% 0.012 82); --paper:oklch(99.5% 0.004 90);
    --cream:oklch(97.5% 0.012 85);
    --box:oklch(96.2% 0.02 80); --card:oklch(96.2% 0.02 80); --ink:oklch(23.5% 0.017 65);
    --teal:oklch(37.5% 0.058 195); --grey:oklch(51% 0.017 70);
    --gold:oklch(63% 0.096 72); --gold-ink:oklch(55% 0.11 70); --ink-warm:oklch(30% 0.042 58); --brick:oklch(52% 0.19 32);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:24px 20px 90px;}
  .board{max-width:820px; margin:0 auto;}
  a{color:var(--teal);} a:hover{color:var(--ink-warm);}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .back{font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .btn{font-family:'Karla',sans-serif; font-size:0.85rem; font-weight:600; padding:9px 18px; border-radius:6px;
    border:1.5px solid var(--sand-line); background:var(--box); color:var(--ink); cursor:pointer;}
  .note{font-size:0.86rem; color:var(--grey); line-height:1.6; max-width:560px;}

  /* ---- the two sheets ---- */
  .sheet{background:var(--paper); border-radius:6px; padding:44px 52px; margin-bottom:22px; position:relative;
    border-left:5px solid var(--gold); min-height:1000px;}
  .sheet.cover{background:var(--cream); text-align:center;}
  .frame{border:1px solid var(--sand-line); padding:40px 36px; position:relative;}
  .corner{position:absolute; width:22px; height:22px; border-color:var(--gold); border-style:solid;}
  .corner.tl{top:-1px; left:-1px; border-width:2px 0 0 2px;} .corner.tr{top:-1px; right:-1px; border-width:2px 2px 0 0;}
  .corner.bl{bottom:-1px; left:-1px; border-width:0 0 2px 2px;} .corner.br{bottom:-1px; right:-1px; border-width:0 2px 2px 0;}
  .logo{width:72px; height:72px; object-fit:contain; margin:0 auto 10px; display:block;}
  .centre{font-family:'Newsreader',Georgia,serif; font-size:1.25rem; font-weight:700; color:var(--teal); margin:0 0 18px;}
  .eyebrow{font-family:'Instrument Sans',sans-serif; font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--grey); margin:0 0 8px;}
  .courseline{font-family:'Newsreader',Georgia,serif; font-size:1.1rem; font-weight:600; margin:0 0 18px;}
  .divider{display:flex; align-items:center; gap:12px; margin:8px auto 22px; max-width:320px;}
  .divider .rule{flex:1; height:1px; background:var(--sand-line);}
  .divider .mark{color:var(--gold); font-size:0.9rem;}
  .body{font-size:0.95rem; line-height:1.6; margin:0 0 10px;}
  .name{font-family:'Newsreader',Georgia,serif; font-size:2rem; font-weight:700; margin:6px 0 12px;}
  .gradelabel{font-family:'Instrument Sans',sans-serif; font-size:10px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--grey); margin:26px 0 8px;}
  .badge{display:inline-block; border:2px solid var(--teal); border-radius:8px; padding:10px 28px; font-family:'Newsreader',Georgia,serif; font-size:1.6rem; font-weight:700; letter-spacing:0.04em; color:var(--teal);}
  .badge.fail{border-color:var(--brick); color:var(--brick);}
  .badge.top{border-color:var(--gold-ink); color:var(--gold-ink);}
  .disclaimer{font-size:0.78rem; color:var(--grey); margin:12px auto 22px; max-width:440px; line-height:1.5;}
  .para{font-size:0.88rem; line-height:1.6; margin:0 auto 10px; max-width:560px; text-align:left;}
  .signrow{display:flex; justify-content:center; gap:40px; flex-wrap:wrap; margin-top:36px;}
  .signblock{min-width:180px; text-align:center;}
  .signature{font-family:'Newsreader',Georgia,serif; font-style:italic; font-size:1.2rem; color:var(--ink-warm); padding-bottom:6px; border-bottom:1px solid var(--ink); margin-bottom:6px;}
  .signname{font-size:0.86rem; font-weight:600;}
  .signrole{font-size:0.74rem; color:var(--grey);}

  .rhead{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; border-bottom:2px solid var(--teal); padding-bottom:12px; margin-bottom:22px;}
  .rhead h1{margin:0; font-family:'Newsreader',Georgia,serif; font-size:1.6rem; font-weight:700;}
  .rhead .meta{font-size:0.82rem; color:var(--grey);}
  .rhead img{width:48px; height:48px; object-fit:contain;}
  .section{margin-bottom:26px;}
  .section h2{margin:0 0 6px; font-family:'Instrument Sans',sans-serif; font-size:10px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--grey);}
  .intro{font-size:0.84rem; color:var(--grey); line-height:1.55; margin:0 0 12px;}
  .grow{display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:9px 0; border-bottom:1px solid var(--sand-line); font-size:0.92rem;}
  .grow.last{border-bottom:none; border-top:2px solid var(--sand-line); margin-top:2px; padding-top:12px;}
  .grow.last .lab{font-family:'Newsreader',Georgia,serif; font-size:1.05rem; font-weight:600;}
  .grow .val{font-weight:700; white-space:nowrap;}
  .grow .val.fail{color:var(--brick);} .grow .val.top{color:var(--gold-ink);} .grow .val.set{color:var(--teal);}
  .desc-intro{font-size:0.92rem; line-height:1.6; margin:0 0 10px;}
  .bullet{display:flex; gap:10px; font-size:0.9rem; line-height:1.55; margin:0 0 7px;}
  .bullet .tick{color:var(--teal); font-weight:700; flex-shrink:0;}
  .closing{font-size:0.9rem; line-height:1.6; margin:12px 0 0; font-style:italic; color:var(--ink-warm);}
  .comment{font-size:0.92rem; line-height:1.65; white-space:pre-wrap;}
  .missing{background:var(--paper); border-radius:6px; border-left:5px solid var(--brick); padding:22px 26px;}
  .missing h2{margin:0 0 8px; font-family:'Newsreader',Georgia,serif; font-size:1.2rem;}

  /* Orientation stated, not left to the print dialog -- see hub-record.css. */
  @page{ size:A4 portrait; margin:12mm; }
  @media print{
    body{background:#fff; padding:0;}
    .bar, #hubSync{display:none !important;}
    .sheet{border-left:none; border-radius:0; margin:0; min-height:0; padding:18mm 16mm; break-after:page; page-break-after:always;}
    .sheet:last-child{break-after:auto; page-break-after:auto;}
    .sheet.cover{background:#fff;}
  }
  @media(max-width:600px){
    .sheet{padding:24px 18px; min-height:0;} .frame{padding:22px 14px;} .name{font-size:1.5rem;}
  }
</style>
<link rel="stylesheet" href="hub-house.css">
</head>
<body class="hub-assign">
<div class="board">
  <div class="bar">
    <a class="back" id="backLink" href="13_grades_report.html">&larr; Grades report</a>
    <button class="btn" type="button" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div id="doc"></div>
</div>

<script src="hub-tracker.js?v=202609252232"></script>
<script src="hub-store.js?v=202609252232"></script>
<script src="hub-shared.js?v=202609252232"></script>
<script src="hub-sync.js?v=202609252232"></script>
<script type="text/x-hub-app">
/* Tutors and the assessor. A candidate's link is refused: Connect releases the
   candidate's own copy as a separate, later act once Cambridge has confirmed,
   and Lite has no such release yet. */
if (window.HubMode === 'trainee') {
  hubRoomRefusal('This room belongs to your centre', 'The final course report reaches you from the centre after the course, once the grade is confirmed. Your feedback and your records are on your own pages.', 'trainee');
  throw new Error('Connect Lite: stopping this page on purpose \u2014 the final report is released to a candidate by the centre, after the course.');
}

const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const T = window.HubTracker;

/* The performance descriptors as IH Istanbul's own end-of-course reports
   print them -- read off the centre's Pass A and Pass B templates and a real
   Pass report on 25 Sep 2026, not off the syllabus. They differ from Appendix
   2 in small, deliberate ways: the overall line drops "at CELTA level", a Pass
   delivers "satisfactory" lessons, Pass A selects "highly appropriate"
   resources, and Pass A's closing line is its own sentence, not a third step
   of "guidance". Fail has no centre template; the syllabus's Fail text stands. */
const DESCRIPTORS = [
  { name: 'Planning',
    'Pass':   'Candidates can plan effectively with guidance. They can analyse target language adequately and generally select appropriate resources and tasks for successful language and language skills development.',
    'Pass B': 'Candidates can plan effectively with some guidance. They can analyse target language well and select appropriate resources and tasks for successful language and language skills development.',
    'Pass A': 'Candidates can plan effectively with minimal guidance. They can analyse target language thoroughly and select highly appropriate resources and tasks for successful language and language skills development.' },
  { name: 'Teaching',
    'Pass':   'Candidates can deliver satisfactory language and skills lessons, using a variety of classroom teaching techniques with a degree of success.',
    'Pass B': 'Candidates can deliver effective language and skills lessons, using a variety of classroom teaching techniques successfully.',
    'Pass A': 'Candidates can deliver effective language and skills lessons, using a variety of classroom teaching techniques successfully.' },
  { name: 'Awareness of learners',
    'Pass':   'Candidates show some awareness of learners and some ability to respond so that learners benefit from the lessons.',
    'Pass B': 'Candidates show good awareness of learners and can respond so that learners benefit from the lessons.',
    'Pass A': 'Candidates show very good awareness of learners and can respond so that learners benefit from the lessons.' },
  { name: 'Reflection',
    'Pass':   'Candidates can reflect on some key strengths and weaknesses and generally use these reflections to develop their teaching skills.',
    'Pass B': 'Candidates can reflect on key strengths and weaknesses and can generally use these reflections to develop their teaching skills.',
    'Pass A': 'Candidates can reflect on key strengths and weaknesses and can consistently use these reflections to develop their teaching skills.' }
];
const OVERALL = {
  'Pass':   'Candidates’ planning and teaching show satisfactory understanding of English language learning and teaching processes.',
  'Pass B': 'Candidates’ planning and teaching show good understanding of English language learning and teaching processes.',
  'Pass A': 'Candidates’ planning and teaching show excellent understanding of English language learning and teaching processes.'
};
const FAIL_TEXT = 'Candidates’ performance does not match all of the Pass descriptors. Some CELTA assessment criteria are not achieved and/or requirements for written work are not met.';
const CLOSING = {
  'Pass':   'They will continue to need guidance to help them develop and broaden their range of skills as teachers in post.',
  'Pass B': 'They will continue to need some guidance to help them develop and broaden their range of skills as teachers in post.',
  'Pass A': 'They will benefit from further guidance in post but will be able to work independently.'
};

/* The grades report stores FAIL / PASS / PASS B / PASS A; the syllabus writes
   them as Fail / Pass / Pass B / Pass A. */
function gradeWord(g){ return ({ 'FAIL':'Fail', 'PASS':'Pass', 'PASS B':'Pass B', 'PASS A':'Pass A' })[g] || ''; }
function gradeCls(g){ return g === 'FAIL' ? 'fail' : g === 'PASS A' ? 'top' : g ? 'set' : ''; }
/* The three values on the Cambridge form that are outcomes, not grades. A
   course that ends in one of them ends without a grade, so there is no report
   to write: this document confirms attendance and states a grade, and both
   sentences would be untrue. */
const OUTCOMES = ['WITHDRAWN','EXTENSION','DEFERRAL'];
const OUTCOME_LINE = {
  'WITHDRAWN': ['withdrew from the course', 'A final course report states the grade agreed with the assessor. A candidate who withdrew has no grade to state.'],
  'EXTENSION': ['has been granted an extension', 'The report is written once the extension is complete and a grade has been agreed with the assessor.'],
  'DEFERRAL':  ['has deferred', 'The report is written on the course the candidate completes, once a grade has been agreed with the assessor.']
};
/* A date-only string, read as the calendar date it names -- never through a
   time zone that could turn the 5th into the 4th. */
function longDate(s){
  if (!s) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (!m) return s;
  return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
}

const params = new URLSearchParams(location.search);
const id = params.get('id') || '';
let cs = {}; try { cs = JSON.parse(localStorage.getItem('connect_course_settings') || '{}') || {}; } catch (e) {}
let roster = { trainees: {} }; try { roster = JSON.parse(localStorage.getItem('connect_roster_v1')) || roster; } catch (e) {}
const who = Object.values(roster.trainees || {}).find(t => t && (t.id === id || t.name === id));
if (window.HubMode === 'assessor') { const b = document.getElementById('backLink'); b.href = '12_assessor_pack.html'; b.innerHTML = '&larr; Assessor pack'; }

const doc = document.getElementById('doc');
if (!who) {
  doc.innerHTML = `<div class="missing"><h2>No candidate to report on</h2><p class="note">Open this from a candidate on the <a href="13_grades_report.html">grades report</a>.</p></div>`;
} else {
  const g = (who.tracker && who.tracker.grades) || {};
  const finalGrade = g.final || '';
  const word = gradeWord(finalGrade);
  if (OUTCOMES.includes(finalGrade)) {
    const [what, why] = OUTCOME_LINE[finalGrade];
    doc.innerHTML = `<div class="missing"><h2>${esc(who.name)} ${what}</h2><p class="note">${why} Back to the <a href="13_grades_report.html">grades report</a>.</p></div>`;
  } else if (!finalGrade) {
    doc.innerHTML = `<div class="missing"><h2>${esc(who.name)} has no final grade yet</h2><p class="note">The final course report states the grade agreed with the assessor. Record it on the <a href="13_grades_report.html">grades report</a> and this page fills itself in.</p></div>`;
  } else {
    /* The written assignments, Pass or Fail, read off the candidate's own
       assignment record rather than typed a second time. */
    let assignments = '—';
    /* Every one of the four has to have been PASSED -- first time or on the
       resubmission -- for this to read Pass. It used to ask readCandidate for
       fails and "pending", and pending means only "failed, resubmission due",
       so a candidate who had submitted NOTHING had neither and their final
       report said the written assignments passed (25 Sep 2026, walking a
       cohort where three had submitted nothing). Anything unfinished reads as
       a dash, which is what an incomplete record should say on a document that
       goes to Cambridge. */
    try {
      const rec = T.recordFor(who);
      const states = T.ASSIGNMENTS.map(code => rec[code.toLowerCase() + '_r'] || '');
      if (states.some(v => v === 'FAIL')) assignments = 'Fail';
      else if (states.every(v => v === 'PASS' || v === 'RES')) assignments = 'Pass';
    } catch (e) {}
    const totalHours = cs.totalHours || 120;
    /* The centre's sentence: "attended x hours of a y-hour initial [online]
       teacher training course". The mode is an adjective in it, and the
       teaching-practice paragraph names the mode again. */
    const attended = g.hoursAttended !== '' && g.hoursAttended != null ? `attended ${esc(g.hoursAttended)} hours of a ${esc(totalHours)}-hour` : `attended a ${esc(totalHours)}-hour`;
    const courseKind = cs.deliveryMode === 'online' ? 'initial online teacher training course' : 'initial teacher training course';
    const tpMode = cs.deliveryMode === 'online' ? 'online' : cs.deliveryMode === 'mixed' ? 'classroom-based and online' : 'classroom-based';
    const tutors = String(cs.tutorNames || '').split(/[,\n]/).map(s => s.trim()).filter(Boolean);
    const banded = word === 'Pass' || word === 'Pass B' || word === 'Pass A';

    doc.innerHTML = `
    <div class="sheet cover">
      <div class="frame">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        ${cs.logo ? `<img class="logo" src="${esc(cs.logo)}" alt="">` : ''}
        <div class="centre">${esc(cs.centreName || '')}</div>
        <p class="eyebrow">Final Course Report</p>
        <p class="courseline">${esc(cs.courseName || '')}</p>
        <div class="divider"><span class="rule"></span><span class="mark">❖</span><span class="rule"></span></div>
        <p class="body">This is to confirm that</p>
        <p class="name">${esc(who.name)}</p>
        <p class="body">${attended} ${courseKind} leading to the Certificate in Teaching English to Speakers of Other Languages (CELTA)</p>
        ${cs.centreName ? `<p class="body">at ${esc(cs.centreName)}</p>` : ''}
        ${cs.start && cs.end ? `<p class="body">from ${esc(longDate(cs.start))} to ${esc(longDate(cs.end))}</p>` : ''}
        <p class="gradelabel">The following provisional grade was awarded</p>
        <div class="badge ${gradeCls(finalGrade)}">${esc(finalGrade)}</div>
        <p class="disclaimer">Please note that this is an internal course report and that the final grade has not yet been confirmed by Cambridge English.</p>
        <p class="para">Participants on this course completed 6 hours of ${tpMode} teaching practice. This included collaborative planning, peer observation and shared evaluation and feedback. Within this framework each participant completed 6 hours of individual teaching which was observed and assessed by an experienced trainer.</p>
        <p class="para">A full report can be found on the reverse of this document.</p>
        ${tutors.length ? `<div class="signrow">${tutors.map(t => `<div class="signblock"><div class="signature">${esc(t)}</div><div class="signname">${esc(t)}</div><div class="signrole">CELTA course Tutor</div></div>`).join('')}</div>` : ''}
      </div>
    </div>

    <div class="sheet">
      <div class="rhead">
        <div><h1>${esc(who.name)}</h1><div class="meta">${esc(cs.courseName || '')} · Final Report</div></div>
        ${cs.logo ? `<img src="${esc(cs.logo)}" alt="">` : ''}
      </div>
      <div class="section">
        <h2>Achievements in Individual Assessment Areas</h2>
        <p class="intro">The grades in this section refer to the two assessment areas in the Cambridge CELTA Syllabus and Assessment Guidelines. Please note that written assignments are graded Pass or Fail. Classroom teaching skills are graded as Pass A, Pass B, Pass or Fail. A full description of topics covered in each area can be found on the Cambridge website (www.cambridgeesol.org).</p>
        <div class="grow"><span class="lab">Preparing, planning and practising teaching</span><span class="val ${gradeCls(finalGrade)}">Grade: ${esc(word)}</span></div>
        <div class="grow"><span class="lab">Written assignments</span><span class="val ${assignments === 'Fail' ? 'fail' : assignments === 'Pass' ? 'set' : ''}">Grade: ${esc(assignments)}</span></div>
        <div class="grow last"><span class="lab">Overall recommended grade</span><span class="val ${gradeCls(finalGrade)}">${esc(finalGrade)}</span></div>
      </div>
      <div class="section">
        <h2>Performance Descriptor for a ${esc(word)} Grade</h2>
        ${banded
          ? `<p class="desc-intro">${esc(OVERALL[word])}</p>` +
            DESCRIPTORS.map(d => `<div class="bullet"><span class="tick">✓</span><span>${esc(d[word])}</span></div>`).join('') +
            `<p class="closing">${esc(CLOSING[word])}</p>`
          : `<p class="desc-intro">${esc(FAIL_TEXT)}</p>`}
      </div>
      ${(g.overall || '').trim() ? `<div class="section"><h2>Overall Comment</h2><div class="comment">${esc(g.overall.trim())}</div></div>` : ''}
    </div>`;
  }
}
</script>
</body>
</html>
