<!DOCTYPE html>
<!--
  Connect Lite — the share card (19 Oct 2026). The picture a post shows when
  lite.celtaconnect.com is shared. Rendered once to brand/share-card.jpg at
  1200 x 630; the front page's og:image points at the jpg, not at this file.
  Re-render after any change to the wording here.
-->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&family=Karla:wght@400;500;600&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f3f3f7; font-family: Karla, sans-serif; color: #232220; }
  .card { position: absolute; inset: 40px; background: #ffffff; box-shadow: 0 2px 4px rgba(30,59,47,.06), 0 12px 36px rgba(30,59,47,.10); border-radius: 18px;
          padding: 54px 70px 46px 66px; display: flex; flex-direction: column; }
  /* The current wordmark (hub-house.css, THE BOX, 19 Oct 2026): LITE tight under
     Connect, at the house tracking since 23 Oct 2026, scaled from the header's 21px. */
  .mark { display: grid; grid-template-columns: auto auto; column-gap: 18px; align-items: center; justify-content: start; --w: 44px; }
  .mark img { grid-row: 1; width: 64px; height: 64px; border-radius: 15px; box-shadow: inset 0 0 0 1px #d9d2c4, 0 0 0 1px #d9d2c4; }
  .word { display: contents; }
  .word .c { grid-column: 2; grid-row: 1; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: var(--w); line-height: 1; color: #ad7f43; }
  .word .l { grid-column: 2; grid-row: 2; align-self: start; justify-self: start;
             font-family: 'Instrument Sans', Karla, sans-serif; font-weight: 600; font-size: calc(var(--w) * 8 / 21); line-height: 1; text-transform: uppercase; color: #232220;
             letter-spacing: .24em; margin: calc(var(--w) * -0.24) -.24em 0 0; padding-left: calc(var(--w) * 0.055); }
  .eyebrow { margin: 36px 0 10px; font-family: 'Instrument Sans', Karla, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .22em; text-transform: uppercase; color: #5b5f6b; }
  h1 { font-family: Newsreader, Georgia, serif; font-weight: 700; font-size: 54px; line-height: 1.08; color: #1e3b2f; margin: 0; max-width: 930px; }
  .sub { font-size: 24px; line-height: 1.45; color: #3a3d46; margin: 20px 0 0; max-width: 900px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; padding-top: 18px; border-top: 1.5px solid #d9d9e0; }
  .addr { font-size: 24px; font-weight: 600; color: #1e3b2f; }
  .credit { font-size: 18px; color: #5b5f6b; }
  .credit b { color: #ad7f43; }
  .qr { position: absolute; top: 54px; right: 70px; width: 196px; text-align: center; }
  .qr svg { width: 196px; height: 196px; display: block; border-radius: 12px; box-shadow: 0 0 0 1.5px #d9d9e0; }
  .qr span { display: block; margin-top: 10px; font-size: 16px; font-weight: 600; color: #5b5f6b; }
  h1 { max-width: 760px; } .sub { max-width: 760px; }
</style></head>
<body>
  <div class="card">
    <div class="mark"><img src="icon-512.png" alt=""><div class="word"><span class="c">Connect</span><span class="l">Lite</span></div></div>
    <p class="eyebrow">For a CELTA centre</p>
    <h1>Teach the course. Lite does the rest.</h1>
    <p class="sub">Every trainee gets a course of their own. Every tutor gets their evenings back. Built on Cambridge’s handbook, made by a CELTA tutor.</p>
    <div class="qr" id="qr"><span>Scan to open</span></div>
    <div class="foot"><span class="addr">lite.celtaconnect.com</span><span class="credit">designed and built by <b>Ramy</b></span></div>
  </div>
<script src="../vendor/qrcode.js"></script>
<script src="../hub-qr.js"></script>
<script>
  document.getElementById('qr').prepend(window.hubQr('https://lite.celtaconnect.com/', { ink: '#232220', bg: '#ffffff', gold: '#a8803f' }));
</script>
</body></html>
