<!DOCTYPE html>
<!--
  Connect Lite — course invitation
  © 2026 Ramy Sakr. All rights reserved.

  The card a centre hands out instead of a bare URL. It exists because the
  links are posted in Google Classroom, where a naked https://…?t=9f2c… tells
  nobody what it opens, who it belongs to, or that passing it on hands someone
  else your account (Ramy, 23 Sep 2026).

  It is a front door, not a gate: the direct links still work, and the card's
  button goes straight to one. Opening the card also boots the session, so the
  room behind it is already warm by the time the button is clicked.

  The card renders from the URL alone — role, wording and destination all come
  from which parameter is present — so it is right before the store has said
  anything. The course, centre and name are filled in when the boot answers,
  and their absence never leaves a gap on the page.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Connect Lite — your course link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202610090407">
<style>
  /* THE WELCOME FAMILY (1a, the link cards, Ramy's pick 7 Oct 2026): a teal
     panel with the big mark drifting behind it, then a paper sheet. The same
     family as the tutor's setup welcome, so the first thing anyone opens and
     the first thing the course shows them look like one place. */
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:6vh 18px 40px;}
  .card{position:relative; background:var(--paper); border-radius:18px; overflow:hidden; max-width:460px; width:100%;
    box-shadow:0 24px 48px -28px oklch(25% 0.04 195 / .45);
    transition:transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s cubic-bezier(.2,.7,.2,1);
    animation:lc-in .6s cubic-bezier(.2,.7,.2,1) both;}
  .card:hover{transform:translateY(-4px); box-shadow:0 32px 56px -26px oklch(25% 0.04 195 / .55);}
  @keyframes lc-in{from{opacity:0; transform:translateY(18px);}to{opacity:1; transform:none;}}
  @keyframes lc-drift{0%,100%{transform:rotate(-8deg) scale(1);}50%{transform:rotate(-4deg) scale(1.04);}}

  .panel{position:relative; overflow:hidden; background:var(--teal-deep); color:var(--paper); padding:26px 30px 30px;}
  .panel .big{position:absolute; right:-150px; top:-70px; width:460px; height:auto; opacity:.13; pointer-events:none;
    animation:lc-drift 18s ease-in-out infinite;}
  .panel .glow{position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 90% at 0% 100%, oklch(70% 0.12 72 / .16), transparent 55%);}
  .panel > *:not(.big):not(.glow){position:relative;}

  /* The mark is the same on every screen and does not change (Ramy, 1 Sep 2026). */
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:26px;}
  .word{display:inline-flex; align-items:baseline; gap:5px;}
  /* The tile always stands with the wordmark (Ramy, 8 Oct 2026: "this is a
     branding, so it's always going to be there"). */
  .lockup{display:inline-flex; align-items:center; gap:9px;}
  .lockup .tile{width:30px; height:30px; border-radius:7px; background:var(--ink-warm); display:inline-flex; align-items:center; justify-content:center; flex:none;
    box-shadow:0 0 0 1px oklch(100% 0 0 / .08);}
  .credit{display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .credit .hub-lockup{color:var(--ink);}
  .word .c{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:21px; line-height:0.85; color:var(--gold-lifted);}
  .word .l{font-family:'Instrument Sans','Karla',sans-serif; font-weight:500; font-size:9px; letter-spacing:0.24em;
    text-transform:uppercase; color:var(--paper);}
  .chip{font-family:'Instrument Sans','Karla',sans-serif; font-weight:700; font-size:10px; letter-spacing:.16em;
    text-transform:uppercase; padding:5px 11px; border-radius:999px; border:1px solid oklch(80% 0.1 75 / .6); color:oklch(80% 0.1 75);}

  .eyebrow{font-family:'Instrument Sans','Karla',sans-serif; font-weight:600; font-size:11px; letter-spacing:.24em;
    text-transform:uppercase; color:oklch(80% 0.1 75); margin:0 0 6px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:32px; line-height:1.08; margin:0;
    color:var(--paper); text-wrap:balance;}
  .meta{font-size:13.5px; line-height:1.5; color:oklch(91% 0.018 190); margin:8px 0 0;}
  .meta:empty{display:none;}
  .forwho{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:26px; line-height:1.1;
    color:oklch(80% 0.11 75); margin:20px 0 0;}
  .forwho[hidden]{display:none;}

  .sheet{padding:22px 30px 24px;}
  .what{font-size:14.5px; line-height:1.65; color:var(--ink); margin:0; text-wrap:pretty;}
  /* Not a warning box in brick: this is the ordinary condition of the link,
     not an error, and a red panel on an invitation reads as something having
     gone wrong. A rule, plain words. */
  .keep{margin:16px 0 0; padding:12px 0 0; border-top:1px solid var(--sand-line);
    font-size:13px; line-height:1.6; color:var(--grey);}
  .keep b{color:var(--ink-warm);}
  .langs{font-size:12.5px; color:var(--grey); margin:10px 0 0; line-height:1.9;}
  .langs[hidden]{display:none;}
  .langs button{font:inherit; color:var(--teal); background:none; border:none; padding:0 2px; cursor:pointer;
    border-bottom:1px solid transparent;}
  .langs button:hover{border-bottom-color:var(--teal);}
  .langs button[aria-pressed="true"]{color:var(--ink-warm); font-weight:700;}
  .langs button:focus-visible{outline:2px solid var(--gold-lifted); outline-offset:3px; border-radius:3px;}

  .go{display:flex; align-items:center; justify-content:center; gap:10px; height:50px; margin:20px 0 0;
    border-radius:999px; background:var(--teal); color:var(--paper); font-family:'Karla',sans-serif;
    font-size:15.5px; font-weight:700; text-decoration:none;
    box-shadow:0 10px 24px -12px oklch(37.5% 0.058 195 / .8); transition:background .2s;}
  .go:hover{background:var(--teal-lifted); color:var(--paper);}
  .go:focus-visible{outline:2px solid var(--gold-lifted); outline-offset:3px;}

  .foot{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:16px 0 0;}
  .credit{font-family:'Karla',sans-serif; font-size:11px; color:oklch(50% 0.09 62);}
  .credit b{font-weight:700;}
  .foot .btn-print{font-family:'Karla',sans-serif; font-size:11px; font-weight:500; color:var(--grey); background:none;
    border:none; padding:0; cursor:pointer;}
  .foot .btn-print:hover{color:var(--teal);}

  @media(max-width:420px){
    .panel{padding:24px 20px 26px;} .sheet{padding:20px 20px 22px;}
    h1{font-size:26px;} .forwho{font-size:22px;}
  }
  @media(prefers-reduced-motion:reduce){ .card, .panel .big{animation:none !important;} .card, .go{transition:none !important;} }
  @media print{
    body{background:#fff; padding:0; display:block;}
    .card{border-radius:0; max-width:none; box-shadow:none !important; animation:none; transform:none !important;}
    .panel{background:none; color:var(--teal); padding:0.4in 0.4in 0;}
    .panel .big, .panel .glow{display:none;}
    .word .l, h1{color:var(--teal);}
    .chip, .eyebrow, .forwho{color:var(--gold-deep); border-color:var(--gold-deep);}
    .meta{color:var(--grey);}
    .sheet{padding:18px 0.4in 0.4in;}
    .go{background:none !important; color:var(--teal) !important; border:2px solid var(--teal); box-shadow:none;}
    .btn-print, .langs{display:none !important;}
  }

  /* ---- 1b, THE TICKET (Ramy, 8 Oct 2026: build it too; both stay) ----------
     The course's own setting (Course admin, "How the links look") picks the
     frame, and &card=ticket / &card=welcome on the link wins for a preview.
     One wording table fills both, so the two can never say different things. */
  body:not([data-card]) .card, body:not([data-card]) .ticket{visibility:hidden;}
  body[data-card="ticket"] .card, body[data-card="welcome"] .ticket{display:none;}
  body[data-role="trainee"]{--tone:var(--gold); --admit:var(--gold-deep);}
  body[data-role="tutor"]{--tone:var(--teal); --admit:var(--teal);}
  body[data-role="assessor"]{--tone:var(--ink-warm); --admit:var(--ink-warm);}
  body[data-role="volunteer"]{--tone:var(--teal-lifted); --admit:var(--teal);}
  .ticket{max-width:460px; width:100%; filter:drop-shadow(0 18px 26px oklch(30% 0.04 60 / .18));
    transition:transform .3s cubic-bezier(.2,.7,.2,1); animation:lc-in .6s cubic-bezier(.2,.7,.2,1) both;}
  .ticket:hover{transform:translateY(-4px) rotate(-.4deg);}
  .t-face{background:var(--paper); border-radius:16px 16px 0 0; padding:24px 28px 22px; border-top:6px solid var(--tone);}
  .t-top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px;}
  .t-top .word .l{color:var(--ink);}
  .t-top .word .c{color:var(--gold);}
  .t-eyebrow{font-family:'Instrument Sans','Karla',sans-serif; font-weight:700; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--grey);}
  .t-admit{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:30px; line-height:1.05; color:var(--admit); margin:0;}
  .t-admit[hidden]{display:none;}
  .t-course{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:24px; line-height:1.15; color:var(--teal-deep); margin:10px 0 0; text-wrap:balance;}
  .t-meta{font-size:13px; color:var(--grey); margin:4px 0 0;}
  .t-meta:empty{display:none;}
  .t-what{font-size:14.5px; line-height:1.65; color:var(--ink); margin:16px 0 0; text-wrap:pretty;}
  .t-perf{height:22px; position:relative;
    background:radial-gradient(circle at 0 50%, transparent 10.5px, var(--surface) 11px) left / 51% 100% no-repeat,
               radial-gradient(circle at 100% 50%, transparent 10.5px, var(--surface) 11px) right / 51% 100% no-repeat;}
  .t-perf::after{content:""; position:absolute; left:18px; right:18px; top:10px; border-top:2px dashed var(--sand-line);}
  .t-stub{position:relative; background:var(--surface); border-radius:0 0 16px 16px; padding:16px 28px 22px;}
  .t-seal{position:absolute; right:26px; top:-34px; width:76px; height:76px; border-radius:50%; background:var(--gold-wash);
    border:2px solid var(--gold-deep); transform:rotate(-8deg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    animation:lc-seal .7s cubic-bezier(.3,1.4,.5,1) .3s both;}
  .t-seal b{font-family:'Instrument Sans','Karla',sans-serif; font-weight:700; font-size:7.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep);}
  @keyframes lc-seal{0%{opacity:0; transform:scale(1.8) rotate(-20deg);}60%{opacity:1; transform:scale(.94) rotate(-6deg);}100%{transform:rotate(-8deg);}}
  .t-keep{max-width:300px; font-size:12.5px; line-height:1.6; color:var(--grey); margin:0;}
  .t-keep b{color:var(--ink-warm);}
  .t-stub .langs{font-size:12px; margin:8px 0 0;}
  .t-go{display:flex; align-items:center; justify-content:space-between; gap:12px; height:50px; padding:0 22px; margin:16px 0 0;
    border-radius:12px; background:var(--teal-deep); text-decoration:none; transition:background .2s;}
  .t-go:hover{background:var(--teal);}
  .t-go:focus-visible{outline:2px solid var(--gold-lifted); outline-offset:3px;}
  .t-go .g{font-family:'Karla',sans-serif; font-weight:700; font-size:15px; color:var(--paper);}
  .t-go .a{font-family:'Instrument Sans','Karla',sans-serif; font-weight:600; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:oklch(80% 0.1 75); white-space:nowrap;}
  .t-stub .foot{margin-top:12px;}
  @media(max-width:420px){ .t-face{padding:22px 20px 20px;} .t-stub{padding:16px 20px 20px;} .t-admit{font-size:24px;} .t-keep{max-width:calc(100% - 84px);} }
  @media(prefers-reduced-motion:reduce){ .ticket, .t-seal{animation:none !important; transition:none !important;} }
  @media print{
    .ticket{filter:none; max-width:none; animation:none; transform:none !important;}
    .t-face{border-radius:0; padding:0.4in 0.4in 18px;}
    .t-perf{background:none;}
    .t-stub{background:none; border-radius:0; padding:12px 0.4in 0.4in;}
    .t-seal{background:none; animation:none;}
    .t-go{background:none !important; border:2px solid var(--teal);} .t-go .g, .t-go .a{color:var(--teal) !important;}
  }
</style>

</head>
<!-- No "Say something" here: hub-say puts its pill inside the tallest block,
     which on this page is the card itself, and an invitation is a door rather
     than a room. The pill is on every screen behind it, one click on. -->
<body data-say-pill="off">
<div class="card">
  <div class="panel">
    <svg class="big" viewBox="8 30 104 60" fill="none" aria-hidden="true">
      <path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="var(--gold-lifted)" stroke-width="9" stroke-linecap="round"></path>

    <div class="top">
      <span class="lockup"><span class="tile" aria-hidden="true"><svg viewBox="8 30 104 60" width="20" height="12" fill="none"><path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="var(--gold-lifted)" stroke-width="13" stroke-linecap="round"></path><path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="var(--paper)" stroke-width="13" stroke-linecap="round"></path></svg></span><span class="word"><span class="c">Connect</span><span class="l">Lite</span></span></span>

<!-- 1b, the ticket. Hidden unless the course (or &card=) asks for it. -->
<div class="ticket">
  <div class="t-face">
    <div class="t-top">
      <span class="lockup"><span class="tile" aria-hidden="true"><svg viewBox="8 30 104 60" width="20" height="12" fill="none" aria-hidden="true"><path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="var(--gold-lifted)" stroke-width="13" stroke-linecap="round"></path><path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="var(--paper)" stroke-width="13" stroke-linecap="round"></path></svg></span><span class="word"><span class="c">Connect</span><span class="l">Lite</span></span></span>
      <span class="t-eyebrow" id="t_eyebrow">Course invitation</span>
    </div>
    <p class="t-admit" id="t_admit" hidden></p>
    <p class="t-course" id="t_courseName">Your CELTA course</p>
    <p class="t-meta" id="t_courseMeta"></p>
    <p class="t-what" id="t_what"></p>
  </div>
  <div class="t-perf" aria-hidden="true"></div>
  <div class="t-stub">
    <span class="t-seal" aria-hidden="true"><svg viewBox="8 30 104 60" width="34" height="20" fill="none" aria-hidden="true"><path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="var(--gold-deep)" stroke-width="11" stroke-linecap="round"></path><path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="var(--teal-deep)" stroke-width="11" stroke-linecap="round"></path></svg><b id="t_seal"></b></span>
    <p class="t-keep" id="t_keep"></p>
    <p class="langs" id="t_langs" hidden></p>
    <a class="t-go" id="t_go" href="#"><span class="g" id="t_goText">Open</span><span class="a">Admit one &rarr;</span></a>
    <div class="foot">
      <span class="credit"><span class="hub-lockup"><span class="hub-lockup-tile" style="width:16px;height:16px;border-radius:4px"><svg viewBox="8 30 104 60" width="11" height="6" fill="none" aria-hidden="true"><path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="oklch(70% 0.12 72)" stroke-width="13" stroke-linecap="round"></path><path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="oklch(99.5% 0.004 90)" stroke-width="13" stroke-linecap="round"></path></svg></span><span class="hub-lockup-c">Connect</span><span class="hub-lockup-l">Lite</span></span> <span class="by">designed and built by <b>Ramy</b></span></span>
      <button class="btn-print" type="button" id="t_printBtn">Print / Save as PDF</button>

</div>

<script src="hub-store.js?v=202610090407"></script>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var p = new URLSearchParams(location.search);

  /* Role from the URL, not from the store. The card has to be right on a phone
     on a bad connection before Apps Script has answered anything -- and the
     destination has to work even if it never does. */
  var ROLE = p.get('k') ? 'tutor' : p.get('ak') ? 'assessor' : p.get('t') ? 'trainee' : p.get('v') ? 'volunteer' : '';
  if (!ROLE) { document.body.dataset.card = 'welcome'; return; }   // hub-sync's own gate explains a link-less visit; the card stays drawn

  /* THE WORDING, tightened (the link cards, 7 Oct 2026). One sentence on what
     the link opens, one on how to hold it. The assessor's line names the rule,
     not a feeling about it: the link runs to the end of the last day of the
     course (Ramy, 29 Sep 2026; Cambridge sets no expiry of its own), so an
     assessor reading the card can tell whether theirs is still good. */
  var COPY = {
    trainee: {
      chip: 'Trainee', eyebrow: 'Course invitation', seal: 'Yours alone',
      what: 'Your own space on the course: your lesson plans and language analysis, your self-evaluations, the feedback your tutors return, and your written assignments.',
      keepB: 'This link is yours alone.', keep: 'Whoever opens it is you, and can read your feedback and submit work in your name. Keep it to yourself and your own devices.',
      go: 'Open my workspace'
    },
    tutor: {
      chip: 'Tutors', eyebrow: 'Tutor access', forWho: 'For the teaching team', admit: 'The teaching team', seal: 'Tutors only',
      what: 'The course as the tutors see it: every trainee’s plans and self-evaluations, the feedback sheets, the assignment marking and the tracker.',
      keepB: 'Every tutor opens this same link.', keep: 'Keep it to the teaching team. If it gets out, course admin can change it, and every old copy stops working.',
      go: 'Open the course'
    },
    assessor: {
      chip: 'Assessor', eyebrow: 'Assessor access', forWho: 'For the Cambridge assessor', admit: 'The Cambridge assessor', seal: 'Read only',
      what: 'The assessment pack: each trainee’s teaching practice record, their grades and their written assignments, in one place.',
      keepB: 'Read-only, and yours for this assessment.', keep: 'Nothing you do here changes the record. The link works to the end of the last day of the course.',
      go: 'Open the assessment pack'
    },
    /* The fourth card (7 Oct 2026). Until now a volunteer student's link
       opened their page bare. Their what / keep / go come in their own
       language when they pick one (hub-volunteer-i18n.js, invite* strings). */
    volunteer: {
      chip: 'Volunteer', eyebrow: 'Free English classes', seal: 'Free classes',
      what: 'Your page for the classes: the next one to come to, which days you came, and your certificate at the end.',
      keepB: 'This link is just for you.', keep: 'Open it on your phone before each class.',
      go: 'Open my page'
    }
  }[ROLE];

  var DEST = ROLE === 'tutor' ? '5_tutor_dashboard.html?k=' + encodeURIComponent(p.get('k'))
           : ROLE === 'assessor' ? '12_assessor_pack.html?ak=' + encodeURIComponent(p.get('ak'))
           : ROLE === 'volunteer' ? '26_volunteer.html?v=' + encodeURIComponent(p.get('v'))
           : 'index.html?t=' + encodeURIComponent(p.get('t'));

  /* Both frames, one fill: each id has a twin on the ticket, t_<id>. */
  var both = function(id, f){ [$(id), $('t_' + id)].forEach(function(el){ if (el) f(el); }); };
  document.body.dataset.role = ROLE;
  $('chip').textContent = COPY.chip;
  both('eyebrow', function(el){ el.textContent = COPY.eyebrow; });
  $('t_seal').textContent = COPY.seal;
  both('go', function(el){ el.setAttribute('href', DEST); });
  both('printBtn', function(el){ el.addEventListener('click', function(){ window.print(); }); });

  /* WHICH FRAME. &card= on the link wins (a preview, never stored); then the
     course's own setting; welcome when it has none. On a first visit the
     browser holds no settings yet, so the card waits for the boot -- up to
     2.5 s -- rather than showing one frame and jumping to the other. */
  var CARD = /^(ticket|welcome)$/.test(p.get('card') || '') ? p.get('card') : '';
  function frame(cs, settled){
    var style = CARD || (cs && cs.cardStyle === 'ticket' ? 'ticket' : (cs || settled) ? 'welcome' : '');
    if (style) document.body.dataset.card = style;
  }
  frame(CARD ? null : read0('connect_course_settings'), false);
  setTimeout(function(){ if (!document.body.dataset.card) frame(null, true); }, 2500);
  function read0(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }

  function words(w, rtl){
    both('what', function(el){ el.textContent = w.what; });
    both('keep', function(el){
      el.innerHTML = '';
      var b = document.createElement('b'); b.textContent = w.keepB;
      el.appendChild(b); el.appendChild(document.createTextNode(' ' + w.keep));
    });
    $('go').textContent = w.go + (rtl ? ' \u2190' : ' \u2192');   // the arrow points the way the line reads
    $('t_goText').textContent = w.go;
  }
  words(COPY);

  /* The volunteer's languages: Connect's six. English is the card's own
     language; the others re-word the three lines a student has to understand,
     and the choice is remembered so their page opens in it too. */
  var I18N = ROLE === 'volunteer' && window.hubVolunteerI18n;
  if (I18N) {
    var lang = I18N.pick(p.get('lang'));
    var paintLangs = function(){
      var t = I18N.t[lang] || {};
      var rtl = I18N.isRtl(lang);
      words({
        what: t.inviteWhat || COPY.what, keepB: t.inviteKeepB || COPY.keepB,
        keep: t.inviteKeep || COPY.keep, go: t.inviteGo || COPY.go
      }, rtl);
      ['what', 'keep'].forEach(function(id){ both(id, function(el){ el.dir = rtl ? 'rtl' : 'ltr'; }); });
      $('go').dir = rtl ? 'rtl' : 'ltr'; $('t_goText').dir = rtl ? 'rtl' : 'ltr';
      var others = I18N.languages.filter(function(l){ return l.code !== lang && I18N.has(l.code) && (I18N.t[l.code] || {}).inviteWhat; });
      both('langs', function(host){
        host.innerHTML = '';
        host.appendChild(document.createTextNode(lang === 'en' ? 'Also in ' : ''));
        others.forEach(function(l, i){
          if (i) host.appendChild(document.createTextNode(' · '));
          var btn = document.createElement('button');
          btn.type = 'button'; btn.textContent = l.native; btn.lang = l.code;
          btn.setAttribute('aria-pressed', 'false');
          btn.addEventListener('click', function(){ lang = l.code; I18N.remember(lang); paintLangs(); });
          host.appendChild(btn);
        });
        host.hidden = !others.length;
      });
    };
    paintLangs();
  }

  /* Course, centre and name, whenever this browser learns them -- from what it
     already holds on a second visit, and again when the boot answers. Never a
     blank line: a row with nothing to say is hidden rather than empty. */
  function read(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  var DOW = ['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
  /* "Mondays to Fridays, 6–8:15 PM": the class days and times, from the
     timetable the volunteer's boot carries. No timetable, no line. */
  function classTimes(){
    var tt = read('connect_timetable_v1') || {};
    var slots = (tt.slots || []).filter(function(s){ return s && s.kind === 'tp'; });
    var seen = {};
    (tt.days || []).forEach(function(d){ if (d && d.tp && d.date) seen[new Date(d.date + 'T12:00:00').getDay()] = true; });
    var wd = Object.keys(seen).map(Number).sort();
    if (!wd.length) return '';
    var run = wd.length > 2 && wd[wd.length - 1] - wd[0] === wd.length - 1;
    var days = run ? DOW[wd[0]] + ' to ' + DOW[wd[wd.length - 1]] : wd.map(function(n){ return DOW[n]; }).join(', ');
    if (!slots.length) return days;
    var rangeOf = function(sl){
      var tp = (sl || []).filter(function(s){ return s && s.kind === 'tp'; });
      if (!tp.length) return '';
      var from = tp[0].from, to = tp[tp.length - 1].to;
      return window.hubClockRange ? hubClockRange(from, to) : from + '\u2013' + to;
    };
    /* The class time can change partway through a course (C/18 moves from
       3 PM to 2 PM on 26 Oct), so the times are read day by day and a
       change is said: "3:00–5:30 PM until 23 Oct, then 2:00–4:30 PM". */
    var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var runs = [];
    (tt.days || []).filter(function(d){ return d && d.tp && d.date; }).forEach(function(d){
      var r = rangeOf(window.hubSlotsFor ? hubSlotsFor(tt, d.date) : tt.slots);
      if (!runs.length || runs[runs.length - 1].r !== r) runs.push({ r: r, last: d.date });
      else runs[runs.length - 1].last = d.date;
    });
    runs = runs.filter(function(x){ return x.r; });
    if (runs.length <= 1) { var when = runs.length ? runs[0].r : rangeOf(slots); return days + (when ? ', ' + when : ''); }
    var short = function(iso){ var p = iso.split('-'); return (+p[2]) + ' ' + MON[+p[1] - 1]; };
    return days + ', ' + runs.map(function(x, i){ return x.r + (i < runs.length - 1 ? ' until ' + short(x.last) : ''); }).join(', then ');
  }
  function paint(){
    var raw = read('connect_course_settings');
    if (!CARD && raw) frame(raw, true);
    var cs = raw || {};
    var bits;
    if (ROLE === 'volunteer') {
      both('courseName', function(el){ el.textContent = 'English with the CELTA trainees'; });
      document.title = 'English with the CELTA trainees — Connect Lite';
      bits = [cs.centreName, classTimes()].filter(Boolean);
    } else {
      if (cs.courseName) { both('courseName', function(el){ el.textContent = cs.courseName; }); document.title = cs.courseName + ' — Connect Lite'; }
      bits = [cs.centreName, cs.centreNumber].filter(Boolean);
      var when = (window.hubCourseDates ? hubCourseDates(cs) : '') ||
        (cs.start && cs.end ? fmt(cs.start) + ' – ' + fmt(cs.end) : '');
      if (when) bits.push(when);
    }
    both('courseMeta', function(el){ el.textContent = bits.join(' · '); });

    var name = '';
    if (ROLE === 'trainee') { try { name = localStorage.getItem('hub:name') || ''; } catch (e) {} }
    if (ROLE === 'volunteer') { name = ((read('hub:volunteer') || {}).name || ''); }
    var who = COPY.forWho || (name ? 'For ' + name : '');
    $('forWho').textContent = who;
    $('forWho').hidden = !who;
    var admit = COPY.admit || name;
    $('t_admit').textContent = admit;
    $('t_admit').hidden = !admit;
  }
  function fmt(iso){
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  paint();
  document.addEventListener('hub:ready', paint);
  /* The boot writes the settings whenever it answers, which may be after
     hub:ready on a first visit. Cheap to look again a few times than to wire
     into the sync's internals. */
  var tries = 0, t = setInterval(function(){ paint(); if (++tries > 20) clearInterval(t); }, 700);
})();
</script>
</body>
</html>
