<!DOCTYPE html>
<!--
  Connect Lite — course invitation
  © 2026 Ramy Sakr. All rights reserved.

  The card a centre hands out instead of a bare URL. It exists because the
  links are posted in Google Classroom, where a naked https://…?t=9f2c… tells
  nobody what it opens, who it belongs to, or that passing it on hands someone
  else your account (Ramy, 23 Sep 2026).

  It is a front door, not a gate: the direct links still work, and the card's
  button goes straight to one. Opening the card also boots the session, so the
  room behind it is already warm by the time the button is clicked.

  The card renders from the URL alone — role, wording and destination all come
  from which parameter is present — so it is right before the store has said
  anything. The course, centre and name are filled in when the boot answers,
  and their absence never leaves a gap on the page.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Connect Lite — your course link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(92.5% 0.012 85); --sand-deep:oklch(94.8% 0.01 85); --sand-line:oklch(89.5% 0.012 82);
    --paper:oklch(99.5% 0.004 90); --box:oklch(96.2% 0.02 80); --ink:oklch(23.5% 0.017 65);
    --teal:oklch(37.5% 0.058 195); --terracotta:oklch(37.5% 0.058 195);
    --gold:oklch(63% 0.096 72); --gold-lifted:oklch(70% 0.12 72);
    --grey:oklch(51% 0.017 70); --brick:oklch(45% 0.15 27); --ink-warm:oklch(30% 0.042 58);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:6vh 18px 40px;}
  /* Gold edges the card, as on every screen (Ramy, 24 Sep 2026); the printed card keeps its plain page below. */
  .card{background:var(--paper); border-left:5px solid var(--gold, oklch(63% 0.096 72)); border-radius:8px; max-width:540px; width:100%;
    padding:30px 34px 28px;} /* the top line went when the left edge came (24 Sep 2026): two edges made a corner */

  /* The mark is the same on every screen and does not change (Ramy, 1 Sep 2026). */
  .mark{display:flex; align-items:center; gap:9px; margin-bottom:26px;}
  .mark .tile{width:30px; height:30px; border-radius:7px; background:var(--ink-warm);
    display:inline-flex; align-items:center; justify-content:center; flex:none;}
  .mark .word{display:inline-flex; align-items:baseline; gap:4px;}
  .mark .word .c{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:21px;
    line-height:0.85; color:var(--gold);}
  .mark .word .l{font-family:'Instrument Sans','Karla',sans-serif; font-weight:500; font-size:9px;
    letter-spacing:0.24em; text-transform:uppercase;}

  .eyebrow{font-family:'Instrument Sans','Karla',sans-serif; font-weight:600; font-size:10px;
    letter-spacing:0.22em; text-transform:uppercase; color:var(--grey); margin:0 0 5px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.75rem; line-height:1.2;
    margin:0 0 4px; color:var(--teal);}
  .meta{font-size:0.84rem; color:var(--grey); line-height:1.6; margin:0;}
  .meta:empty{display:none;}

  .forwhom{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
    margin:20px 0 0; padding:12px 16px; background:var(--box); border-radius:6px;}
  .forwhom .lab{font-size:0.68rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase;
    color:var(--gold); flex:none;}
  .forwhom .who{font-family:'Newsreader',Georgia,serif; font-size:1.05rem; font-weight:700;
    color:var(--ink-warm);}
  .forwhom.anon .who{font-family:'Karla',sans-serif; font-size:0.9rem; font-weight:600;}

  .what{font-size:0.92rem; line-height:1.7; color:var(--ink); margin:18px 0 0;}

  /* Not a warning box in brick: this is the ordinary condition of the link,
     not an error, and a red panel on an invitation reads as something having
     gone wrong. Gold rule, plain words. */
  .keep{margin:18px 0 0; padding:14px 0 0; border-top:1px solid var(--sand-line);
    font-size:0.84rem; line-height:1.65; color:var(--grey);}
  .keep b{color:var(--ink-warm);}

  .go{display:block; width:100%; text-align:center; margin:24px 0 0;
    background:var(--teal); color:var(--paper); font-family:'Karla',sans-serif;
    font-size:1rem; font-weight:700; padding:15px 24px; border-radius:26px;
    border:none; cursor:pointer; text-decoration:none;}
  .go:hover{background:oklch(44% 0.062 195);}

  .foot{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin:18px 0 0;}
  .credit{font-family:'Karla',sans-serif; font-size:11px; color:oklch(50% 0.09 62); opacity:.8;}
  .credit b{font-weight:700;}

  @media print{
    body{background:#fff; padding:0; display:block;}
    .card{border-radius:0; border-left:none; max-width:none; padding:0.4in;}
    .go{background:none !important; color:var(--teal) !important; border:2px solid var(--teal);
      border-radius:6px; font-size:0.9rem;}
    .btn-print{display:none !important;}
  }
  @media(max-width:420px){ .card{padding:24px 20px 22px;} h1{font-size:1.45rem;} }
</style>
<link rel="stylesheet" href="hub-house.css?v=202609240203">
</head>
<body>
<div class="card">
  <div class="mark">
    <span class="tile"><svg viewBox="8 30 104 60" width="20" height="12" fill="none" aria-hidden="true">
      <path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="oklch(70% 0.12 72)" stroke-width="13" stroke-linecap="round"></path>
      <path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="oklch(99.5% 0.004 90)" stroke-width="13" stroke-linecap="round"></path>
    </svg></span>
    <span class="word"><span class="c">Connect</span><span class="l">Lite</span></span>
  </div>

  <p class="eyebrow" id="eyebrow">Course invitation</p>
  <h1 id="courseName">Your CELTA course</h1>
  <p class="meta" id="courseMeta"></p>

  <div class="forwhom anon" id="forWhom" hidden>
    <span class="lab" id="forLab">For</span>
    <span class="who" id="forWho"></span>
  </div>

  <p class="what" id="what"></p>
  <p class="keep" id="keep"></p>

  <a class="go" id="go" href="#">Open</a>

  <div class="foot">
    <span class="credit">designed and built by <b>Ramy</b></span>
    <button class="btn-print" type="button" id="printBtn">Print / Save as PDF</button>
  </div>
</div>

<script src="hub-shared.js?v=202609252032"></script>
<script src="hub-store.js?v=202609252032"></script>
<script src="hub-sync.js?v=202609252032"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var p = new URLSearchParams(location.search);

  /* Role from the URL, not from the store. The card has to be right on a phone
     on a bad connection before Apps Script has answered anything -- and the
     destination has to work even if it never does. */
  var ROLE = p.get('k') ? 'tutor' : p.get('ak') ? 'assessor' : p.get('t') ? 'trainee' : '';
  if (!ROLE) return;   // hub-sync's own gate explains a link-less visit

  var COPY = {
    trainee: {
      eyebrow: 'Course invitation',
      lab: 'For',
      what: 'This link opens your own space on the course. Your lesson plans and language analysis, your self-evaluations, the feedback your tutors return to you, and your written assignments all live behind it.',
      keep: '<b>This link is yours alone.</b> Anyone who opens it is you — they can read your feedback and submit work in your name. Keep it to yourself, and open it on your own devices only.',
      go: 'Open my workspace'
    },
    tutor: {
      eyebrow: 'Tutor access',
      lab: 'For',
      what: 'This link opens the course as the tutors see it: every candidate’s plans and self-evaluations, the feedback sheets, the assignment marking, and the candidate tracker.',
      keep: '<b>Every tutor on the course opens this same link.</b> Keep it to the teaching team — anyone who has it can read and change every candidate’s record. If it gets out, your course admin can rotate it, and every copy in circulation stops working.',
      go: 'Open the course'
    },
    assessor: {
      eyebrow: 'Assessor access',
      lab: 'For',
      what: 'This link opens the assessment pack for the course: each candidate’s teaching practice record, their grades, and their written assignments, gathered in one place.',
      keep: '<b>Read-only, and yours for this assessment.</b> Nothing you do here changes the course record. The link stops working after the course ends, and should not be passed on.',
      go: 'Open the assessment pack'
    }
  }[ROLE];

  var DEST = ROLE === 'tutor' ? '5_tutor_dashboard.html?k=' + encodeURIComponent(p.get('k'))
           : ROLE === 'assessor' ? '12_assessor_pack.html?ak=' + encodeURIComponent(p.get('ak'))
           : 'index.html?t=' + encodeURIComponent(p.get('t'));

  $('eyebrow').textContent = COPY.eyebrow;
  $('forLab').textContent = COPY.lab;
  $('what').textContent = COPY.what;
  $('keep').innerHTML = COPY.keep;
  $('go').textContent = COPY.go;
  $('go').setAttribute('href', DEST);
  $('printBtn').addEventListener('click', function(){ window.print(); });

  /* Course, centre and name, whenever this browser learns them -- from what it
     already holds on a second visit, and again when the boot answers. Never a
     blank line: a row with nothing to say is hidden rather than empty. */
  function read(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function paint(){
    var cs = read('connect_course_settings') || {};
    if (cs.courseName) { $('courseName').textContent = cs.courseName; document.title = cs.courseName + ' — Connect Lite'; }
    var bits = [cs.centreName, cs.centreNumber].filter(Boolean);
    var when = (window.hubCourseDates ? hubCourseDates(cs) : '') ||
      (cs.start && cs.end ? fmt(cs.start) + ' – ' + fmt(cs.end) : '');
    if (when) bits.push(when);
    $('courseMeta').textContent = bits.join(' · ');

    var name = '';
    if (ROLE === 'trainee') { try { name = localStorage.getItem('hub:name') || ''; } catch (e) {} }
    var who = ROLE === 'trainee' ? name
            : ROLE === 'tutor' ? 'The teaching team'
            : 'The Cambridge assessor';
    if (who) {
      $('forWho').textContent = who;
      $('forWhom').classList.toggle('anon', ROLE !== 'trainee' || !name);
      $('forWhom').hidden = false;
    }
  }
  function fmt(iso){
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  paint();
  document.addEventListener('hub:ready', paint);
  /* The boot writes the settings whenever it answers, which may be after
     hub:ready on a first visit. Cheap to look again a few times than to wire
     into the sync's internals. */
  var tries = 0, t = setInterval(function(){ paint(); if (++tries > 20) clearInterval(t); }, 700);
})();
</script>
</body>
</html>
