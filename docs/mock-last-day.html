<style>
  :root{
    /* The pane. A card on this page is a sheet of glass lying on the paper,
       not a rectangle drawn on it (Ramy, 25 Sep 2026: "more color, more pop,
       or maybe they need a frame"). Three values make that read: a face that
       is lighter at the top than the bottom, a bright hairline along the top
       edge where the light catches, and two shadows -- one tight contact
       shadow and one wide diffuse one. No hue in any of them; the pop is
       depth, because hue on this page is spoken for. Exactly one card wears
       color and it is the one that is your next step. */
    --card-top:oklch(97.6% 0.012 86); --card-edge:oklch(99.4% 0.005 90);
    --shade-near:oklch(58% 0.03 70 / 0.11); --shade-far:oklch(58% 0.03 70 / 0.09);
    --sand-line-deep:oklch(78% 0.018 80);
    /* the frame's dashes, and its label */
    --gold-hair:oklch(80% 0.05 76);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    padding:0 20px 90px;}
    /* Wider than the other screens, and only here. The rooms are the whole
     point of this page and they were five tiles in a 880px column; three of
     them now stand side by side inside the teaching-practice frame, which
     needs the width to keep each one readable. Every other screen keeps 880. */
  .board{max-width:1020px; margin:0 auto;}
  a{color:var(--teal);} a:hover{color:var(--ink-warm);}

  /* ---- chrome bar ------------------------------------------------------- */
  .chrome{display:flex; align-items:center; justify-content:space-between; gap:24px; height:64px;}
  .lockup{display:flex; align-items:center; gap:9px;}
  .lockup .tile{width:30px; height:30px; border-radius:7px; background:var(--ink-warm);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .lockup .word{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:21px;
    line-height:0.85; letter-spacing:-0.012em; color:var(--gold);}
  /* Ramy, 20 Sep 2026: "Lite" sits on Connect's baseline, close to it. */
  .hub-pair{display:inline-flex; align-items:baseline; gap:4px;}
  .hub-word{font-family:'Instrument Sans','Karla',sans-serif; font-weight:500; font-size:9px;
    letter-spacing:0.24em; text-transform:uppercase; color:var(--ink); line-height:1; margin-left:1px;}
  .role{font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:600;
    letter-spacing:0.22em; text-transform:uppercase; color:var(--grey);}
  /* the mark turns on this screen only */
  .wordmark-mark-stage{perspective:400px;}
  @keyframes wordmark-spin{0%,11.11%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
  .wordmark-spin{animation:wordmark-spin 90s linear infinite; transform-origin:50% 50%; transform-style:preserve-3d;}
  @media(prefers-reduced-motion:reduce){ .wordmark-spin{animation:none;} }

  /* ---- title ------------------------------------------------------------ */
  .title{border-top:2px solid var(--teal); padding-top:26px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:18px 26px; flex-wrap:wrap;}
  .titletext{flex:1 1 320px; min-width:0;}
  .titledoors{display:flex; gap:9px; flex-wrap:wrap; flex:none;}
  .tdoor{display:inline-flex; align-items:center; height:34px; padding:0 15px; font-family:'Karla',sans-serif;
    font-size:0.82rem; font-weight:600; border-radius:var(--r-control); border:1.5px solid var(--sand-line);
    background:var(--box); color:var(--ink); text-decoration:none; white-space:nowrap;}
  .tdoor:hover{border-color:var(--teal); color:var(--teal);}
  .tdoor[hidden]{display:none;}

  /* ---- the hero: what today is for ------------------------------------- */
  .hero{background:var(--teal); color:var(--paper); border-radius:var(--r-card); padding:22px 24px 20px; margin:22px 0 0;}
  .hero[hidden]{display:none;}
  .hero .k{font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:600;
    letter-spacing:0.2em; text-transform:uppercase; opacity:.78; margin:0;}
  .hero h2{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.5rem; line-height:1.22;
    margin:6px 0 0; color:inherit; text-wrap:pretty;}
  .hero .when{font-size:0.95rem; line-height:1.6; opacity:.93; margin:7px 0 0; text-wrap:pretty;}
  .hero .when:empty{display:none;}
  .hero .hero-name{display:flex; flex-wrap:wrap; gap:10px; margin:16px 0 0;}
  .hero .hero-name input{flex:1 1 220px; max-width:360px; font:inherit; font-size:1rem; padding:11px 14px; border-radius:10px; border:0; background:var(--paper); color:var(--ink);}
  .hero .hero-name .go{display:inline-flex; margin:0; cursor:pointer; border:0;}
  .hero .hero-sig{flex-basis:100%; color:var(--paper); min-height:0;} .hero .hero-sig small{display:block; font-size:.78rem; opacity:.8; margin:4px 0 2px;} .hero .hero-sig svg.ink, .hero .hero-sig .hand{height:52px; color:var(--paper);}
  .hero .todo{list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .hero .todo:empty{display:none;}
  .hero .todo li{position:relative; padding-left:18px; font-size:0.9rem; line-height:1.5; opacity:.95;}
  .hero .todo li:before{content:""; position:absolute; left:1px; top:7px; width:6px; height:6px;
    border-radius:50%; background:var(--gold-lifted);}
  .hero .todo a{color:inherit; font-weight:700; text-decoration:underline; text-underline-offset:3px;}
  /* color on the cover (Ramy, 25 Oct 2026): red for a warning or a Fail, amber for a letter already signed; readable on the forest */
  /* R06: the main step stands out; the fold is quiet */
  .hero .todo li.todo-more{padding-left:0;} .hero .todo li.todo-more:before{display:none;}
  .hero .todo li.todo-more summary{cursor:pointer; list-style:none; font-size:.84rem; font-weight:700; opacity:.8; text-decoration:underline; text-underline-offset:3px;} .hero .todo li.todo-more summary::-webkit-details-marker{display:none;}
  .hero .todo li.todo-more ul{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:6px;}
  .hero .todo li.red:before{background:var(--a-red-ink);} .hero .todo li.red a{color:var(--a-red-ink);}
  .hero .todo li.amber:before{background:var(--a-gold-ink);} .hero .todo li.amber a{color:var(--a-gold-ink);}
  .hero.quiet .todo li.red a{color:var(--a-red);} .hero.quiet .todo li.amber a{color:var(--a-mustard);}
  .hero .go{display:inline-block; margin:17px 0 0; background:var(--paper); color:var(--teal);
    font-family:'Karla',sans-serif; font-weight:700; font-size:0.9rem; padding:11px 22px;
    border-radius:999px; text-decoration:none;}
  .hero .go[hidden]{display:none;}
  .hero .go:hover{background:var(--sand);}
  .hero .tiny{font-size:0.8rem; line-height:1.55; opacity:.78; margin:14px 0 0; text-wrap:pretty;}
  .hero .tiny:empty{display:none;}
  /* finished, or nothing waiting: the same card, no longer shouting */
  .hero.quiet{background:var(--box); color:var(--ink);}
  .hero.quiet .k{color:var(--grey); opacity:1;}
  .hero.quiet h2{color:var(--ink-warm);}
  .hero.quiet .when, .hero.quiet .tiny{color:var(--grey); opacity:1;}
  .hero.quiet .todo li:before{background:var(--gold);}
  .hero.quiet .todo a{color:var(--teal);}
  .hero.quiet .go{background:var(--teal); color:var(--paper);}
  .hero.quiet .go:hover{background:var(--teal-lifted);}

  /* ---- the hero, v2 moments (7 Oct 2026) --------------------------------
     Ramy: "add some of your magic touches." Two states of the same card get
     an event: BEFORE THE COURSE (.hv2.pre: a countdown to day one, the things
     to do as numbered cards, the tutors by name) and THE END (.hv2.fin: the
     course in numbers, where you started, one burst of confetti the first
     time). Every other state of the hero is untouched. Design: Magic
     Touches.dc.html, 1a and 1c. */
  .hero.hv2{position:relative; overflow:hidden; border-radius:16px; padding:44px 44px 38px;}
  .hero.hv2 > *{position:relative;}
  .hero.hv2 .hv2-mark{position:absolute; right:-160px; top:-90px; width:620px; height:auto; opacity:.13; pointer-events:none;
    animation:hv2-drift 18s ease-in-out infinite; transform-origin:50% 50%;}
  .hero.hv2.pre{background:var(--teal-deep);}
  .hero.hv2 .k{font-size:11px; letter-spacing:0.26em; opacity:1; color:oklch(80% 0.1 75); margin:0 0 14px;}
  .hero.hv2 h2{font-size:clamp(40px,6vw,64px); line-height:1; letter-spacing:-0.02em; margin:0; color:var(--paper); text-wrap:balance;}
  .hv2-kicker{margin:16px 0 0; font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:clamp(22px,2.4vw,28px); line-height:1.2; color:oklch(80% 0.11 75);}
  .hv2-count{display:flex; gap:12px; flex-wrap:wrap; margin:14px 0 0;}
  .hv2-count div{min-width:96px; padding:14px 12px 10px; border-radius:12px; background:var(--teal); border:1px solid var(--teal-lifted); text-align:center;}
  .hv2-count b{display:block; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:40px; line-height:1; color:var(--paper); font-variant-numeric:tabular-nums;}
  .hv2-count span{display:block; margin-top:6px; font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:oklch(80% 0.1 75);}
  .hero.hv2 .when{margin:20px 0 0; font-size:16px; color:oklch(91% 0.018 190); opacity:1; max-width:620px;}
  .hero.hv2 .when b{color:var(--paper);}
  /* the things to do, as numbered cards on the teal */
  .hero.hv2.pre .todo{counter-reset:hv2; display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin:20px 0 0;}
  .hero.hv2.pre .todo li{counter-increment:hv2; padding:0; opacity:1;}
  .hero.hv2.pre .todo li:before{display:none;}
  .hero.hv2.pre .todo a{display:flex; flex-direction:column; gap:10px; height:100%; padding:18px 18px 16px; border-radius:12px;
    background:var(--paper); color:var(--ink); text-decoration:none; font-size:15px; font-weight:700; line-height:1.4;
    box-shadow:0 18px 30px -20px oklch(15% 0.04 195 / .8); transition:transform .3s cubic-bezier(.2,.7,.2,1), box-shadow .3s;}
  .hero.hv2.pre .todo a:before{content:counter(hv2); font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:36px; line-height:1; color:var(--gold-deep);}
  .hero.hv2.pre .todo a:after{content:'Open'; margin-top:auto; font-size:13px; color:var(--teal);}   /* no arrows on labels (Ramy) */
  .hero.hv2.pre .todo a:hover{transform:translateY(-3px); box-shadow:0 24px 36px -20px oklch(15% 0.04 195 / .9); color:var(--ink);}
  .hero.hv2.pre .todo a:hover:after{text-decoration:underline; text-underline-offset:3px;}
  .hero.hv2.pre .todo a:focus-visible{outline:2px solid var(--gold-lifted); outline-offset:3px;}
  /* before the agreement is signed (30 Oct 2026): it is step one, and the rest say they come after it */
  .hero .todo a.sign:after, .hero.hv2.pre .todo a.sign:after{content:'Sign';}
  .hero:not(.pre) .todo a.sign:after, .hero:not(.pre) .todo a.locked:after{display:inline-block; margin-left:10px; padding:1px 8px; border-radius:999px; font-size:.78em; font-weight:700; text-decoration:none; background:oklch(100% 0 0 / .14);}
  .hero .todo a.locked{opacity:.6;} .hero .todo a.locked:after, .hero.hv2.pre .todo a.locked:after{content:'After you sign';}
  html.needs-sign .titledoors{display:none !important;}
  .hero.hv2.pre .todo li:first-child a{background:var(--gold-wash); box-shadow:inset 0 0 0 2px var(--gold), 0 18px 30px -20px oklch(15% 0.04 195 / .8);}
  .hero.hv2 .go{margin:22px 0 0; height:48px; padding:0 26px; display:inline-flex; align-items:center; gap:10px; font-size:15px;
    background:var(--gold-lifted); color:var(--ink-warm);}
  .hero.hv2 .go:hover{background:var(--gold); color:var(--ink);}
  .hero.hv2 .go:focus-visible{outline:2px solid var(--paper); outline-offset:3px;}
  .hv2-tutors{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:22px 0 0; padding:14px 18px; border-radius:12px; background:oklch(37.5% 0.058 195 / .55);}
  .hv2-tutors i{font-family:'Instrument Serif',Georgia,serif; font-size:22px; color:oklch(80% 0.11 75);}
  .hv2-tutors .who{display:flex; gap:6px;}
  .hv2-tutors .who span{width:34px; height:34px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; background:var(--paper); color:var(--teal-deep);}
  .hv2-tutors .who span:nth-child(2n){background:var(--gold-lifted); color:var(--ink-warm);}
  .hv2-tutors em{font-style:normal; font-size:14px; color:oklch(91% 0.018 190);}
  .hero.hv2 .tiny{margin:18px 0 0; font-size:13px; color:oklch(84% 0.02 190); opacity:1;}
  /* the end */
  .hero.hv2.fin{background:var(--teal-deep); color:var(--paper);}
  .hero.hv2.fin .when{color:oklch(91% 0.018 190);}
  .hv2-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:24px 0 0;}
  .hv2-stats div{padding:18px 16px; border-radius:12px; background:var(--teal); border:1px solid var(--teal-lifted); animation:hv2-in .7s cubic-bezier(.2,.7,.2,1) both;}
  .hv2-stats div:nth-child(2){animation-delay:.15s;} .hv2-stats div:nth-child(3){animation-delay:.3s;} .hv2-stats div:nth-child(4){animation-delay:.45s;}
  .hv2-stats b{display:block; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:44px; line-height:1; color:var(--paper);}
  .hv2-stats span{display:block; margin-top:8px; font-size:13px; line-height:1.4; color:oklch(91% 0.018 190);}
  .hv2-start{margin:24px 0 0; padding:20px 24px; border-radius:12px; background:var(--paper); color:var(--ink); transform:rotate(-1deg);
    box-shadow:0 30px 50px -28px oklch(15% 0.04 195 / .8); max-width:640px;}
  .hv2-start small{display:block; font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--grey); margin-bottom:6px;}
  .hv2-start q{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:20px; line-height:1.4; color:var(--teal-deep);}
  .hero.hv2.fin .todo li{color:oklch(91% 0.018 190);}
  /* .hero.hv2 > * makes every child relative, which beat this rule and left the confetti in a box 0px tall (22 Oct 2026) */
  .hero.hv2 > .hv2-confetti{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .hv2-confetti i{position:absolute; top:-14px; border-radius:2px; opacity:0; animation:hv2-fall linear both;}
  @keyframes hv2-drift{0%,100%{transform:rotate(-8deg) scale(1);}50%{transform:rotate(-4deg) scale(1.04);}}
  @keyframes hv2-in{from{opacity:0; transform:translateY(24px);}to{opacity:1; transform:none;}}
  @keyframes hv2-fall{0%{opacity:0; transform:translateY(0) rotate(0);}8%{opacity:1;}100%{opacity:0; transform:translateY(560px) rotate(540deg);}}
  @media(prefers-reduced-motion:reduce){ .hero.hv2 *, .hero.hv2 *:before, .hero.hv2 *:after{animation:none !important; transition:none !important;} .hv2-confetti{display:none;} }
  @media(max-width:560px){
    .hero.hv2{padding:30px 20px 26px; border-radius:12px;} .hero.hv2 .hv2-mark{width:420px; right:-170px; top:-50px;}
    .hv2-count div{min-width:0; flex:1 1 60px; padding:12px 6px 8px;} .hv2-count b{font-size:30px;}
    .hv2-start{transform:none;}
  }

  /* ---- a card that is not its time yet ----------------------------------
     Ramy, 6 Oct 2026: "some of them might be there, but they will be still,
     and they will only be clickable when the time comes." Read, not clicked:
     the trainee sees the shape of their course without being invited into a
     room with nothing in it. */
  .room.still{opacity:.62; cursor:default; box-shadow:none;}
  .room.still:hover{box-shadow:none; border-color:var(--row-line); transform:none;}
  .room.still .st{color:var(--faint); font-weight:600;}
  .room.still{cursor:pointer;}
  .still-note{margin:9px 0 0; padding:7px 10px; border-left:3px solid var(--sand-line); background:var(--paper); font-size:.78rem; line-height:1.45; color:var(--ink); font-weight:500;}
  .title h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:2.1rem;
    line-height:1.15; color:var(--ink);}
  .title p{margin:7px 0 0; font-size:0.9rem; color:var(--grey); line-height:1.6; max-width:600px;}
  .title .hello{margin:16px 0 0; max-width:600px; padding:12px 16px; background:var(--gold-wash); border-left:4px solid var(--gold);
    border-radius:var(--r-strip); font-size:0.92rem; color:var(--ink); line-height:1.6; text-wrap:pretty;}
  .title .hello b{color:var(--ink-warm);}
  .title .hello a{color:var(--teal); font-weight:600;}

  /* ---- the teaching-practice frame --------------------------------------
     Three of these five cards are one thing: the teaching-practice cycle, in
     a strict order -- plan, teach, self-evaluate, read the feedback. The other
     two are not in that order at all. The written assignments run ALONGSIDE
     the cycle (the card has said so in words since 20 Sep), and Your progress
     is a view of the lot rather than a step in it. Laid out as five equal
     tiles in a two-column grid, the page said none of that: it put Written
     assignments beside Teaching practice feedback as though they were a pair.

     So the cycle gets a frame and the other two sit outside it, which is the
     same distinction the resource hub draws with the same dashed frame -- what
     belongs together inside, and the things deliberately left out. Ramy's rule
     for it (6 Sep 2026): frame a GROUP, never a page. Three cards in, two out.

     The frame's label is which teaching practice you are on. That line used to
     float under the title with nothing to attach to; it is the name of this
     group, so it sits on the group's own edge. */
  /* The hero card (Ramy, 26 Sep 2026, pointing at the owner console: "a card
     inside a card... I'd like to use this"). The teaching practice was a dashed
     frame around three cards of the same weight as the two below them, so the
     thing the whole page is about had no more presence than the footnotes. Now
     it is a card, and the three rooms are panels inside it.
     Depth moved outward: the OUTER card carries the gradient, the lit top edge
     and the two shadows that .room used to carry, and the rooms inside give
     them up -- a pane inside a pane is two objects arguing. */
  .tpgroup{position:relative; margin-top:34px; border-radius:16px; padding:18px 18px 18px;
    background:linear-gradient(180deg, var(--card-top) 0%, var(--card) 64%);
    border:1px solid var(--sand-line);
    box-shadow:inset 0 1px 0 var(--card-edge), 0 1px 2px var(--shade-near), 0 7px 16px -7px var(--shade-far);}
  /* The head: which teaching practice this is, and where it stands. The state
     is teal because gold on this page means one thing only -- what to do next
     -- and a second color saying "what now" would be a second answer. */
  .herohead{display:flex; align-items:baseline; justify-content:space-between; gap:14px;
    flex-wrap:wrap; margin:0 2px 14px;}
  .grouplabel{font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:600;
    letter-spacing:0.16em; text-transform:uppercase; color:var(--gold-deep);}
  .herostate{font-family:'Karla',sans-serif; font-size:0.78rem; font-weight:700;
    padding:3px 10px; border-radius:20px;
    color:var(--teal);
    background:color-mix(in oklab, var(--teal) 6%, var(--surface));
    border:1px solid color-mix(in oklab, var(--teal) 35%, transparent);}
  .herostate:empty{display:none;}

  /* ---- rooms ------------------------------------------------------------ */
  /* One card, everywhere (Ramy, 21 Sep 2026: "all of them the same shape pill.
     With little curve and the same size as well, because right now this is just
     a kitchen sink"). Still one object -- same face, same edge, same curve,
     same padding -- and the only thing that differs between them is how wide
     they are. What changed on 26 Sep is that the object became a PANE: a face
     that lightens toward the top, a bright hairline where the top edge catches
     the light, and two shadows under it. Depth, not hue: color on this page
     answers "what now", and a page of colored cards answers it five times. */
  /* grid-auto-rows WAS 1fr on both grids, and 1fr on an implicit row means every
     row takes the height of the tallest -- so one long card dragged the whole
     home up to its height. On a real course the Course files card holds a
     center's input sessions, a dozen of them, and a two-line "Written
     assignments" card was rendered 394px deep to match it. Ramy, 5 Oct 2026:
     "the cards kind of expand somehow."
     auto sizes each ROW to its own content; the cards sharing a row still
     stretch to each other, which is the tidiness 1fr was reaching for, without
     the tallest card on the page setting the height of all of them. */
  .rooms{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; grid-auto-rows:auto;}
  /* The two that sit outside the frame, side by side. Full width and stacked
     was the obvious reading of "outside the frame" and it was wrong: two lines
     of text in a 1020px card leaves half the card empty, which is the slab the
     old Your progress card already was. Two columns, and the page ends where
     the content ends. */
  .room.files ul{list-style:none; margin:6px 0 0; padding:0;}
  .room.files li{padding:5px 0; border-top:1px solid var(--row-line); font-size:0.88rem;}
  .room.files li:first-child{border-top:0;}
  .room.files a{color:var(--teal); text-decoration:none; font-weight:600;}
  .room.files a:hover{text-decoration:underline;}
  .room.files li.nolink{color:var(--grey);}
  .room.files li.nolink small{font-size:0.74rem; font-style:italic; color:var(--faint);}
  .solo{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; grid-auto-rows:auto;}
  /* The same grid and the same card as the trainee's own above (Ramy, 25 Oct 2026: "the same shape"): three
     across, and each card as tall as theirs (--solo-h, measured below). */
  .fromcourse{display:contents;} .fromcourse[hidden]{display:none;}
  /* The notebook card, held for what comes next, is the one green card in the row (Ramy, 25 Oct 2026); words on
     green are white and the small mark gold (COLOURS.md). */
  /* THE NOTEBOOK CARD looks like a notebook (Ramy, 25 Oct 2026: "make it look a bit more like a
     notebook"): a ruled page, the oxblood margin line, the arc at the corner, and the last note
     written on the lines in the trainee's own words. Same shape and hover as every other card. */
  body .fromcourse .room.notebook{position:relative; overflow:hidden; padding-left:34px;}
  body .fromcourse .room.notebook::before{content:""; position:absolute; top:0; bottom:0; left:22px; width:1.5px; background:var(--a-mustard); opacity:.8;}  /* the margin line is gold (Ramy, 25 Oct 2026: "gold instead of red") */
  body .fromcourse .room.notebook .nb-me{position:absolute; top:16px; right:18px; width:36px; height:36px; border-radius:50%; background:var(--a-forest); color:var(--paper);
    display:inline-flex; align-items:center; justify-content:center; font-family:'Karla',sans-serif; font-size:0.8rem; font-weight:700; letter-spacing:.04em;
    background-image:linear-gradient(180deg, rgba(255,255,255,.1), transparent 60%);}
  body .fromcourse .room.notebook .nb-me:empty{display:none;}
  body .fromcourse .room.notebook h2{font-family:'Newsreader',Georgia,serif; padding-right:40px;}
  /* the lines sit under the writing only; the title and the count stay off the ruling */
  body .fromcourse .room.notebook p.last{font-family:'Newsreader',Georgia,serif; font-style:italic; font-size:1rem; line-height:28px; color:var(--ink); margin:0 0 10px; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
    background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 24px, var(--row-line) 24px, var(--row-line) 25px, transparent 25px, transparent 28px); background-size:100% 28px;}
  body .fromcourse .room.notebook p.last small{display:block; font-family:'Karla',sans-serif; font-style:normal; font-size:0.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--grey); line-height:28px;}
  body .fromcourse .room.notebook:hover{background-color:color-mix(in oklch, var(--a-forest) 4%, var(--paper)) !important;}
  .room.files li small.when{margin-left:6px; font-size:0.76rem; color:var(--grey); font-weight:600;}
  .room.files li small.todo{margin-left:6px; font-size:0.76rem; color:var(--a-amber, var(--teal)); font-weight:700;}
  .fromcourse .fclabel{grid-column:1 / -1; margin:0; font-size:0.72rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--grey);}
  #returnedPanel{display:none !important;}

  .room{display:block; text-decoration:none; color:inherit; font-family:'Karla',sans-serif;
    background:linear-gradient(180deg, var(--card-top) 0%, var(--card) 64%);
    border:1px solid var(--sand-line); border-radius:14px; padding:19px 21px;
    box-shadow:inset 0 1px 0 var(--card-edge),
               0 1px 2px var(--shade-near),
               0 7px 16px -7px var(--shade-far);
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;}
  .room:hover{color:inherit;}
  /* Inside the hero the room is a panel, not a pane: the face flattens to the
     surface, the shadows go, and the hairline is the quieter row line. The two
     that sit outside the hero keep the pane, because out there they are
     objects on the ground rather than things inside a card. */
  .tpgroup .room{background:var(--surface); border-color:var(--row-line);
    border-radius:10px; box-shadow:none; padding:16px 18px;}
  .tpgroup .room:hover{box-shadow:0 1px 2px var(--shade-near), 0 8px 18px -10px var(--shade-far);
    border-color:var(--sand-line);}
  /* The whole card lifts, and it is meant to be felt (Ramy, 25 Sep 2026:
     "hovering effect on the whole card"). hub-shared.js gives every a.room a
     1px nudge and a flat ring; that rule is injected into the head at runtime
     so it loads after this file and would win on equal specificity -- hence
     .rooms/.solo in front, which beats it without !important. Hue-free, like
     the house rule it replaces: the card rises, the shadow spreads and the
     top hairline brightens, and nothing changes color. */
  .rooms a.room:hover, .solo a.room:hover{
    transform:translateY(-3px); border-color:var(--sand-line-deep);
    box-shadow:inset 0 1px 0 var(--paper),
               0 2px 4px var(--shade-near),
               0 16px 28px -12px var(--shade-far);}
  .rooms a.room:active, .solo a.room:active{transform:translateY(-1px);}
  /* A state is not a hover. The lift above sets every border to the neutral
     line, which took the gold edge off the next-step card and the garnet
     edge off a stuck one the moment the mouse arrived (design audit, 28 Sep
     2026). The state's color stays; only the shadow and the lift move. */
  .rooms a.room.act:hover, .solo a.room.act:hover{border-color:var(--amber-edge); border-left-color:var(--gold);}
  .rooms a.room.stuck:hover, .solo a.room.stuck:hover{border-color:color-mix(in oklab, var(--brick) 35%, var(--sand-line)); border-left-color:var(--brick);}
  .room h2{margin:0; font-family:'Newsreader',Georgia,serif; font-size:1.3rem; font-weight:600; line-height:1.22; color:var(--ink);}
  .room p{margin:7px 0 0; font-size:0.83rem; color:var(--grey); line-height:1.6; max-width:62ch;}
  .room .st{display:block; margin-top:12px; font-size:0.78rem; font-weight:600; color:var(--grey);}
  .room .st.act{color:var(--tone-act); font-weight:700;}
  .room .st.stuck{color:var(--tone-stuck);}
  /* Turned in: done, and out of the way. Ramy, 24 Sep 2026 -- weighed against
     red and gold and chose faint, because the tracker's own rule is that
     color only marks what needs you and everything fine stays quiet. The
     lightest tone that still clears 4.5:1 on the card (measured, 4.52), with
     the weight dropped a step; the recede is as much the weight as the tone.
     .room.done is deliberately unstyled -- the door's border does not change. */
  .room .st.done{color:var(--tone-done); font-weight:500;}
  /* Exactly one card is the next step, and it is the only one wearing color.
     Two golds would be two answers to "what now". It used to say so with a
     single pale border line, which on a page of five bordered cards is not
     saying it at all -- you had to look for it. Now the face carries the
     house's gold wash and the gold runs down the left edge, the same 4px edge
     that marks a control on every other screen. The padding gives back the
     3px the thicker edge takes, so the card does not shift in the row. */
  .room.act{border-color:var(--amber-edge); border-left:4px solid var(--gold); padding-left:18px;
    background:var(--paper);}
  .room.stuck{border-color:color-mix(in oklab, var(--brick) 35%, var(--sand-line));
    border-left:4px solid var(--brick); padding-left:18px;
    background:var(--paper);}
  .room .who{font-family:'Instrument Sans','Karla',sans-serif; font-size:9px; font-weight:600;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--grey); display:block; margin-bottom:6px;}

  /* ---- returned / next TP ------------------------------------------------ */
  #returnedPanel{display:none; align-items:center; gap:14px; flex-wrap:wrap; margin-top:16px;}
  #returnedPanel p{margin:0; font-size:0.82rem; color:var(--grey); line-height:1.55; flex:1 1 260px;}

  /* ---- buttons ----------------------------------------------------------- */
  .btn{font-family:'Karla',sans-serif; font-size:0.82rem; font-weight:600; height:34px; padding:0 15px;
    border-radius:6px; border:1.5px solid var(--sand-line); background:var(--box); color:var(--ink);
    cursor:pointer; transition:border-color .15s,color .15s,opacity .15s; display:inline-flex;
    align-items:center; text-decoration:none;}
  .btn.primary{background:var(--teal); border-color:var(--teal); color:var(--paper); font-weight:700;}

  /* Ramy, 20 Sep 2026: the credit reads as lopsided beside the lockup -- it sits
     at the foot of this page instead. hub-shared hides .hub-credit under 768px
     because the header band has no room for it; the foot does, so this wins on
     specificity. */
  .howline{margin:30px 0 0; text-align:center; font-size:0.86rem; color:var(--grey);}
  .foot{margin-top:18px; padding-top:16px; border-top:1px solid var(--row-line);
    display:flex; align-items:center; justify-content:center; gap:8px;}
  /* the mark beside the credit (Ramy, 21 Sep 2026), the header tile at 18px */
  .foot-mark{width:18px; height:18px; border-radius:4px; background:var(--ink-warm);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  /* hub-shared gives .hub-credit a 12px left margin for the header band; the
     foot spaces with gap instead, so it is zeroed here rather than with !important */
  .foot .hub-credit{display:inline; margin-left:0;}

  /* ---- THE NOTEBOOK (Ramy, 20 Oct 2026, night) ----------------------------
     The home as the mock-up he chose: a big serif title with an italic line,
     the doors as white buttons, the welcome as the forest cover, every room a
     white surface with a soft shadow, three to a row, more air. */
  .board{max-width:1120px;}
  .chrome{height:76px;}
  .title{border-top:0; padding-top:10px; align-items:flex-end;}
  .title h1{font-weight:400; font-size:3.2rem; line-height:1; letter-spacing:-.015em;}
  .title p{font:italic 400 1.2rem/1.45 'Newsreader',Georgia,serif; color:var(--grey); margin-top:12px;}
  .tdoor{height:44px; padding:0 20px; font-size:0.9rem; font-weight:700; border-radius:12px;}
  .hero{margin-top:26px; padding:38px 42px 34px; position:relative; overflow:hidden;}
  .hero h2{font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:2.5rem; line-height:1.05;}
  .hero .when{font-size:1rem; margin-top:12px;}
  .hero .todo{gap:10px; margin-top:18px;} .hero .todo li{font-size:1rem; padding-left:20px;}
  .hero .todo a{font-weight:500; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.35);}
  .hero .go{padding:13px 24px; font-size:0.95rem; margin-top:24px;}
  .tpgroup{margin-top:38px;}
  .herohead{margin:0 4px 16px;}
  .grouplabel{font-size:11px; letter-spacing:.18em; color:var(--a-red); font-weight:700;}
  .herostate{background:var(--a-forest); color:#F0EEE9; border:0; border-radius:7px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:5px 10px;}
  .rooms, .solo{gap:18px;}
  .solo{grid-template-columns:repeat(3,1fr); margin-top:18px; grid-auto-rows:1fr;}
  .room{padding:24px 24px 22px;}
  .room h2{font-size:1.35rem; font-weight:600;}
  .room p{font-size:0.88rem; margin-top:8px;}
  .room .st{margin-top:16px; font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--faint);}
  .room .st.act{color:var(--a-forest);} .room .st.stuck{color:var(--a-red);}
  .howline{margin-top:40px;}
  @media (max-width:860px){
    .solo{grid-template-columns:1fr;}
    .title h1{font-size:2.5rem;} .hero{padding:28px 24px;} .hero h2{font-size:2rem;}
    .tdoor{flex:1 1 auto; justify-content:center;}
  }

  @media (max-width:860px){
    /* One column, and each card takes the height of its own text. The equal
       rows are what keeps a ROW of cards level; stacked there is no row to be
       level with, and 1fr just pads the short ones out to the tallest. */
    .rooms, .solo{grid-template-columns:1fr; grid-auto-rows:auto;}
    .title{gap:14px;} .titledoors{width:100%;}
    .hero{padding:20px 18px 18px;} .hero h2{font-size:1.3rem;}
    .tpgroup{padding:26px 11px 11px;}
  }
  /* the name card alone (26 Oct 2026) */
  body.asking-name .board > :not(.chrome):not(#hero):not(.foot){display:none !important;}
  body.asking-name > :not(.board):not(script):not(style):not(link){display:none !important;}
  body.asking-name #hero > :not(.hero-name):not(h2):not(h1):not(.kind):not(#heroKind):not(#heroTitle):not(#heroWhen):not(.when){display:none !important;}
</style>
