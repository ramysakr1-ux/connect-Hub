<!DOCTYPE html>
<!--
  Connect Lite — getting-to-know-you activities, and the group's pick
  © 2026 Ramy Sakr. All rights reserved.
  The first afternoon of a course, after the demonstration lesson: each
  teaching practice group runs one short getting-to-know-you activity with
  its students, unassessed, no tutor in the room. This page is the bank the
  activities come from -- Connect's ninety, in two level bands, for a room or
  for online -- narrowed to what fits the trainee's group and the course's
  mode, and the pick is made here: one activity for the whole group, which
  lands on the course shelf ("Shared with the class") where the tutor and the
  group see it. The pick rides on the store's share list (shareMaterial, kind
  gtky), the same mechanism as the shelf, so there is no new record kind and
  a trainee can only take back their own. Tutors read the bank; the pick is
  the trainees' (Ramy, 8 Oct 2026: "the mechanism, obviously, to the getting
  to know you").
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Getting to know you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202610071139">
<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    padding:36px 20px 90px; display:flex; justify-content:center;}
  .board{max-width:820px; width:100%;}
  a{color:var(--teal);} a:hover{color:var(--ink-warm);}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .title{border-top:2px solid var(--teal); padding-top:22px;}
  .title h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.9rem; line-height:1.15;}
  .title p{margin:7px 0 0; font-size:0.9rem; color:var(--grey); line-height:1.55;}
  .pick{margin-top:16px; background:var(--paper); border:1px solid var(--sand-line); border-left:4px solid var(--gold); border-radius:10px; padding:14px 18px; font-size:0.92rem; line-height:1.55;}
  .pick b{font-family:'Newsreader',Georgia,serif; font-size:1.05rem;}
  .bands{margin-top:18px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:0.84rem; color:var(--grey);}
  .chip{font:inherit; font-size:0.8rem; font-weight:600; padding:6px 12px; border-radius:999px; border:1.5px solid var(--sand-line); background:var(--field); color:var(--ink); cursor:pointer;}
  .chip.on{background:var(--teal); border-color:var(--teal); color:#fff;}
  .act{background:var(--surface); border:1px solid var(--sand-line); border-radius:10px; padding:16px 20px; margin-top:12px;}
  .act.chosen{border-color:var(--gold); box-shadow:inset 4px 0 0 var(--gold);}
  .act h2{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.15rem;}
  .act .meta{margin:3px 0 10px; font-size:0.78rem; color:var(--grey); letter-spacing:0.04em;}
  .act ol{margin:0; padding-left:20px; font-size:0.9rem; line-height:1.6;}
  .act .online{margin:10px 0 0; font-size:0.84rem; color:var(--ink-warm); background:var(--field); border-left:3px solid var(--teal); padding:8px 12px;}
  .act .row{margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .btn{font:inherit; font-size:0.82rem; font-weight:600; padding:8px 14px; border-radius:8px; border:1.5px solid var(--teal); background:var(--teal); color:#fff; cursor:pointer;}
  .btn.ghost{background:var(--field); color:var(--ink); border-color:var(--sand-line);}
  .btn:disabled{opacity:0.55; cursor:default;}
  .note{font-size:0.82rem; color:var(--grey);}
  .empty{background:var(--surface); border:1px dashed var(--sand-line); border-radius:10px; padding:26px 22px; margin-top:16px; color:var(--grey); font-size:0.95rem; line-height:1.6;}
</style>
</head>
<body>
<div class="board">
  <a class="back" id="back" href="index.html">&#8592; Back</a>
  <div id="app"></div>
</div>
<script src="hub-shared.js?v=202610071139"></script>
<script src="hub-store.js?v=202610071139"></script>
<script src="hub-say.js?v=202610071139"></script>
<script src="hub-sync.js?v=202610071139"></script>
<script src="gtky-bank.js?v=202610071139"></script>
<script type="text/x-hub-app">
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose — this is one of the course’s own pages.');
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } };
const IS_TRAINEE = !!(window.HubStore && HubStore.isTrainee && HubStore.isTrainee());
const ME = rec('hub:me') || {};
const MY_NAME = String(ME.name || '').trim(), MY_GROUP = String(ME.group || '').trim();
if (!IS_TRAINEE) $('back').href = (window.HubStore && HubStore.isAssessor && HubStore.isAssessor()) ? '12_assessor_pack.html' : '5_tutor_dashboard.html';
const BANK = window.CONNECT_HUB_GTKY || [];
const HIGH = { pre:1, inter:1, upper:1 };
const BAND_NAME = { low: 'Beginner and elementary', high: 'Pre-intermediate and above' };
/* The group's level, from the TP point set the centre gave it, if any:
   A1/A2 are the low band, A2+ and up the high one (Connect's two-band rule). */
function bandFromLevel(level){ const m = String(level || '').toUpperCase().match(/\b([ABC][12])(\+?)/); if (!m) return ''; const code = m[1] + m[2]; return code === 'A1' || code === 'A2' ? 'low' : 'high'; }
function groupBand(g){ const P = rec('connect_tp_points_v1') || {}; const set = (P.set || {}); const id = (set.setFor || {})[g]; const S = id && (set.library || {})[id]; return S ? bandFromLevel(S.level || S.book) : ''; }
function settings(){ return rec('connect_course_settings') || {}; }
function mode(){ const m = String(settings().deliveryMode || 'f2f'); return m === 'online' ? 'online' : 'f2f'; }
function shared(){ return (rec('connect_shared_v1') || []).filter(x => (x.kind || '') === 'gtky'); }
function pickFor(g){ return shared().find(x => new RegExp('\\u2014 Group ' + g.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$').test(String(x.name || ''))) || null; }
let band = '', busy = false, note = '';
function render(){
  const g = MY_GROUP, m = mode();
  if (!band) band = groupBand(g) || (IS_TRAINEE ? '' : 'high');
  const pick = g ? pickFor(g) : null;
  const head = `<div class="title"><h1>Getting to know you</h1>
    <p>One short activity for your group's first afternoon with your students, after the demonstration lesson. Unassessed, and no tutor in the room. Read the ones that fit, agree with your group, and pick one here; your tutor sees the pick on the shelf.</p></div>`;
  const pickBox = g
    ? (pick ? `<div class="pick"><b>Group ${esc(g)} has picked: ${esc(String(pick.name).replace(/ \u2014 Group .*$/, ''))}</b><br><span class="note">by ${esc(pick.by || 'a trainee')}. To change it, the person who picked takes it back below and someone picks again.</span></div>`
            : `<div class="pick"><b>Group ${esc(g)} has not picked yet.</b><br><span class="note">Anyone in the group can pick for everyone; one pick is the group's.</span></div>`)
    : (IS_TRAINEE ? '<div class="pick"><b>You are not in a group yet.</b><br><span class="note">Your tutor puts you in one; until then, read.</span></div>' : '<div class="pick"><b>The bank, as the trainees see it.</b><br><span class="note">A group’s pick shows on the shelf on your dashboard.</span></div>');
  const bands = `<div class="bands"><span>Level of your students:</span>
    <button class="chip${band === 'low' ? ' on' : ''}" type="button" data-band="low">${BAND_NAME.low}</button>
    <button class="chip${band === 'high' ? ' on' : ''}" type="button" data-band="high">${BAND_NAME.high}</button>
    <span>&middot; ${m === 'online' ? 'online course' : 'in the room'}</span></div>`;
  if (!band) { $('app').innerHTML = head + pickBox + bands + '<div class="empty">Choose the level of your students above and the activities that fit appear.</div>'; wire(); return; }
  const fits = BANK.filter(a => (band === 'high') === !!HIGH[a.level] && (a.mode === 'both' || a.mode === m));
  const list = fits.map(a => { const mine = pick && String(pick.name || '').indexOf(a.name + ' \u2014 ') === 0;
    return `<div class="act${mine ? ' chosen' : ''}" id="${esc(a.slug)}"><h2>${esc(a.name)}</h2><p class="meta">${esc(a.meta)}</p>
      <ol>${a.steps.map(s => '<li>' + esc(s) + '</li>').join('')}</ol>
      ${m === 'online' && a.onlineNote ? `<p class="online">${esc(a.onlineNote)}</p>` : ''}
      ${IS_TRAINEE && g ? `<div class="row">${mine
          ? (pick.by === MY_NAME ? `<button class="btn ghost" type="button" data-unpick="${esc(pick.id)}"${busy ? ' disabled' : ''}>Take the pick back</button>` : '<span class="note">Your group’s pick.</span>')
          : (pick ? '<span class="note">The group has picked another; it can be taken back by whoever picked it.</span>' : `<button class="btn" type="button" data-pick="${esc(a.slug)}"${busy ? ' disabled' : ''}>Pick this for Group ${esc(g)}</button>`)}</div>` : ''}
    </div>`; }).join('');
  $('app').innerHTML = head + pickBox + bands + (note ? `<p class="note" style="margin:12px 0 0;">${esc(note)}</p>` : '') + list;
  wire();
}
function write(list){ try { localStorage.setItem('connect_shared_v1', JSON.stringify(list || [])); } catch(e){} }
async function pickIt(slug){
  const a = BANK.find(x => x.slug === slug); if (!a || busy) return;
  if (!MY_NAME) { note = 'Your name is missing — open your own link again.'; render(); return; }
  busy = true; note = 'Picking…'; render();
  try {
    const body = { op: 'shareMaterial', name: a.name + ' \u2014 Group ' + MY_GROUP, url: location.href.split('#')[0] + '#' + a.slug, by: MY_NAME, tp: '', kind: 'gtky' };
    if (HubStore.token && HubStore.token()) body.token = HubStore.token();
    const r = await HubStore.call(body); write(r.shared || []); note = 'Picked for Group ' + MY_GROUP + '. Your tutor and your group see it on the shelf.';
  } catch (err) { note = 'Not picked — ' + (err && err.message || err); }
  busy = false; render(); setTimeout(() => { note = ''; render(); }, 3000);
}
async function unpick(id){
  if (busy) return;
  const ok = window.confirmModal ? await confirmModal('Take the pick back, so the group can choose again?', 'Take back') : confirm('Take the pick back?');
  if (!ok) return;
  busy = true; note = 'Taking back…'; render();
  try {
    const body = { op: 'unshareMaterial', id: id };
    if (HubStore.token && HubStore.token()) body.token = HubStore.token();
    const r = await HubStore.call(body); write(r.shared || []); note = 'Taken back.';
  } catch (err) { note = 'Not taken back — ' + (err && err.message || err); }
  busy = false; render(); setTimeout(() => { note = ''; render(); }, 2600);
}
function wire(){
  $('app').querySelectorAll('[data-band]').forEach(b => b.addEventListener('click', () => { band = b.dataset.band; render(); }));
  $('app').querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => pickIt(b.dataset.pick)));
  $('app').querySelectorAll('[data-unpick]').forEach(b => b.addEventListener('click', () => unpick(b.dataset.unpick)));
}
render();
document.addEventListener('hub:ready', () => { band = band || groupBand(MY_GROUP); render(); });
</script>
</body>
</html>
