  Day one of a course, after the demonstration lesson (or the day and slot

  teaching practice group runs one short getting-to-know-you activity with
  its students, unassessed, no tutor in the room. This page is the bank the

  mode, and the pick is made here: one activity for the whole group, which

  group see it. The pick rides on the store's share list (shareMaterial, kind
  gtky), the same mechanism as the shelf, so there is no new record kind and

<script type="text/x-hub-app">
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose — this is one of the course’s own pages.');
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } };
const IS_TRAINEE = !!(window.HubStore && HubStore.isTrainee && HubStore.isTrainee());
const ME = rec('hub:me') || {};
const MY_NAME = String(ME.name || '').trim(), MY_GROUP = String(ME.group || '').trim(), MY_TOKEN = String(ME.token || (HubStore.token && HubStore.token()) || '');
if (!IS_TRAINEE) $('back').href = (window.HubStore && HubStore.isAssessor && HubStore.isAssessor()) ? '12_assessor_pack.html' : (new URLSearchParams(location.search).get('view') === 'bank' ? '24_tp_points.html' : '5_tutor_dashboard.html');
const BANK = window.CONNECT_HUB_GTKY || [];
const HIGH = { pre:1, inter:1, upper:1 };
const BAND_NAME = { low: 'Beginner and elementary', high: 'Pre-intermediate and above' };
/* The group's level, from the TP point set the center gave it: A1/A2 are the
   low band, A2+ and up the high one (Connect's two-band rule). */
function bandFromLevel(level){ const m = String(level || '').toUpperCase().match(/\b([ABC][12])(\+?)/); if (!m) return ''; const code = m[1] + m[2]; return code === 'A1' || code === 'A2' ? 'low' : 'high'; }
/* A trainee never receives the set itself, so the store sends their group's level beside their points (v153, 26 Oct
   2026); the room a group teaches in can name it too (Course admin, Online rooms). */
function groupBand(g){ /* the class the group is with today (Course admin > Classes, 7 Nov 2026): at the change of level the new class's band */
  const lvNow = window.hubLevelOn ? hubLevelOn(settings(), g) : ''; if (lvNow && bandFromLevel(lvNow)) return bandFromLevel(lvNow);
  const P = rec('connect_tp_points_v1') || {}; if (P.level) return bandFromLevel(P.level);
  const set = (P.set || {}); const id = (set.setFor || {})[g]; const S = id && (set.library || {})[id]; if (S) return bandFromLevel(S.level || S.book);
  const room = (settings().onlineRooms || []).find(r => r && String(r.group || '') === String(g || '') && r.level); return room ? bandFromLevel(room.level) : ''; }
let KNOWN = '';
function settings(){ return rec('connect_course_settings') || {}; }
function mode(){ const m = String(settings().deliveryMode || 'f2f'); return m === 'online' ? 'online' : 'f2f'; }
function roster(){ const r = rec('connect_roster_v1') || {}; return Object.values(r.trainees || {}); }
function shared(){ return (rec('connect_shared_v1') || []).filter(x => (x.kind || '') === 'gtky'); }
/* A pick is a shared row named "<activity> — <trainee>". */
const SEP = ' — ';
function pickOf(name){ return shared().find(x => String(x.name || '').endsWith(SEP + name)) || null; }
function activityOf(row){ const n = String((row && row.name) || ''); const i = n.lastIndexOf(SEP); return i > 0 ? n.slice(0, i) : n; }
/* THREE EACH. Every trainee is offered three from the pool for their band and
   the course's mode, their own three, stable for them: dealt from the pool by
   a hash of their token, stepping through it so two trainees in the same
   group rarely get the same three (Ramy, 8 Oct 2026: "they have three that
   were chosen depending on the level, and they will choose one of them"). */
function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
/* The step can share a factor with the pool's size (27 in 54 visits two
   activities and comes round again), so the walk is bounded and a short cycle
   is finished one at a time from where it stopped. */
function offered(pool, seed){ if (pool.length <= 3) return pool.slice(); const out = [], n = pool.length, start = hash(seed) % n, step = 1 + (hash(seed + '|') % (n - 1)); let i = start; for (let k = 0; k < n && out.length < 3; k++, i += step) { const a = pool[i % n]; if (out.indexOf(a) < 0) out.push(a); } for (let j = start; out.length < 3; j++) { const a = pool[j % n]; if (out.indexOf(a) < 0) out.push(a); } return out; }

      ivSave(d); recReset(); rs.msg = 'Saved. Listen to it below, and make a transcript if you want one.'; renderInterview();
    } catch (e) { $('recSave').disabled = false; recErr('Not saved \u2014 ' + ((e && e.message) || e) + '. The recording is still here: press Save to try again.'); }
  });
  app.querySelectorAll('[data-tryplay]').forEach(b => b.addEventListener('click', () => {
    const slot = b.closest('.iv-rec').querySelector('.fol-audio'), u = TRYOUT[b.dataset.tryplay]; if (!slot || !u) return;
    slot.innerHTML = ''; const a = document.createElement('audio'); a.controls = true; a.src = u; a.style.cssText = 'display:block;width:100%;margin-top:6px'; slot.appendChild(a); a.play().catch(() => {});
  }));
  /* THE TRANSCRIPT SAYS WHAT IT IS DOING, WHERE THE BUTTON IS (Ramy, 18 Nov 2026: "when I click on make a transcript ... it
     just doesn't show anything. I don't know if it worked or not"). The words used to appear in a grey line above the
     list of recordings, off the screen from the button pressed. Now the button itself reads Making the transcript, and
     a line under that recording says it is working, that it is ready, or why it failed. */
  app.querySelectorAll('[data-tx]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.tx, who = ivSel;
    if (TRYOUT[id]) { rs.rowMsg = { id, kind: 'info', text: 'No transcript here: this is a try-out, and the course itself makes transcripts. On a real course, pressing this makes one in a minute or two and it appears under the recording.' }; renderInterview(); return; }
    if (rs.txBusy) return;
    rs.txBusy = id; rs.rowMsg = { id, kind: 'busy', text: 'Making the transcript. A short chat takes about a minute, a long one a few minutes. Keep this page open; it appears here when it is ready.' }; renderInterview();
    try {
      const r = await ivCall({ op: 'transcribeInterview', id }, 330000);
      const d = ivData(); const s = d.students[who]; const a = s && (s.audio || []).find(x => x.id === id); if (a) a.transcript = r.text || '';
      ivSave(d); rs.rowMsg = { id, kind: 'ok', text: (r.text || '').trim() ? 'The transcript is ready, below. Listen, and correct it so it says exactly what they said.' : 'The transcript came back empty: nothing could be heard in this recording.' };
    } catch (e) { rs.rowMsg = { id, kind: 'bad', text: 'No transcript: ' + ((e && e.message) || e) + '. Press the button to try again.' }; }
    rs.txBusy = ''; if (curView() === 'interview') renderInterview();
  }));
  app.querySelectorAll('[data-swap]').forEach(b => b.addEventListener('click', () => {
    const d = ivData(); const s = d.students[ivSel]; const a = s && (s.audio || []).find(x => x.id === b.dataset.swap); if (!a) return;
    a.transcript = String(a.transcript || '').replace(/^(Student|Trainee): /gm, (m, w) => (w === 'Student' ? 'Trainee: ' : 'Student: '));
    ivSave(d); renderInterview();
  }));
  app.querySelectorAll('textarea[data-txt]').forEach(t => t.addEventListener('input', () => {
    clearTimeout(ivTimer); ivTimer = setTimeout(() => { const d = ivData(); const s = d.students[ivSel]; const a = s && (s.audio || []).find(x => x.id === t.dataset.txt); if (a) { a.transcript = t.value; ivSave(d); } }, 700);
  }));
  app.querySelectorAll('[data-delrec]').forEach(b => b.addEventListener('click', async () => {
    if (!(await confirmModal('Delete this recording? It is removed from the course for good, with its transcript.', 'Delete'))) return;
    if (TRYOUT[b.dataset.delrec]) { const d1 = ivData(), s1 = d1.students[ivSel]; if (s1) s1.audio = (s1.audio || []).filter(x => x.id !== b.dataset.delrec); try { URL.revokeObjectURL(TRYOUT[b.dataset.delrec]); } catch (e) {} delete TRYOUT[b.dataset.delrec]; ivSave(d1); rs.msg = 'Deleted.'; renderInterview(); return; }
    b.disabled = true;
    try {
      await ivCall({ op: 'deleteInterviewAudio', id: b.dataset.delrec }, 60000);
      const d = ivData(); const s = d.students[ivSel]; if (s) s.audio = (s.audio || []).filter(x => x.id !== b.dataset.delrec);
      ivSave(d); rs.msg = 'Deleted.'; renderInterview();
    } catch (e) { b.disabled = false; recErr('Not deleted \u2014 ' + ((e && e.message) || e)); }
  }));
}
function wireInterview(){
  const app = $('app');
  app.querySelectorAll('[data-stu]').forEach(b => b.addEventListener('click', () => {
    const n = b.dataset.stu, c = claimState(n); claimMsg = '';
    if (n !== ivSel && ((rs.mr && rs.mr.state === 'recording') || rs.busy || rs.blob)) { recErr('Save or discard this recording with ' + ivSel + ' first.'); const rb = $('recBox'); if (rb) rb.scrollIntoView({ block: 'center' }); return; }
    if (!IS_TRAINEE || !CLAIMS || c.mine || !regNames().some(x => keyOf(x) === keyOf(n))) { ivSel = n; renderInterview(); return; }
    if (IS_MAYA) { MAYA = MAYA.filter(k => ivStarted(k)); MAYA.push(keyOf(n)); mayaPut(); ivSel = n; renderInterview(); return; }
    b.disabled = true;
    HubStore.call({ op: 'claimStudent', token: HubStore.token(), student: n, on: true, keep: myPicks().filter(ivStarted) }).then(r => { CLAIMS.mine = (r && r.mine) || keyOf(n); CLAIMS.mineAll = (r && Array.isArray(r.mineAll)) ? r.mineAll : [CLAIMS.mine]; ivSel = n; renderInterview(); claimsLoad(); },
      e => { claimMsg = (e && e.message) || 'That did not go. Try again.'; renderInterview(); claimsLoad(); });
  }));
  if ($('ivLetGo')) $('ivLetGo').addEventListener('click', () => {
    const k = $('ivLetGo').dataset.k || (CLAIMS && CLAIMS.mine); if (!k) return; claimMsg = '';
    if (IS_MAYA) { MAYA = MAYA.filter(x => x !== k); mayaPut(); if (keyOf(ivSel) === k) ivSel = ''; renderInterview(); return; }
    HubStore.call({ op: 'claimStudent', token: HubStore.token(), student: k, on: false }).then(r => { CLAIMS.mine = (r && r.mine) || ''; CLAIMS.mineAll = (r && Array.isArray(r.mineAll)) ? r.mineAll : []; if (CLAIMS.taken && CLAIMS.taken[k]) CLAIMS.taken[k] = CLAIMS.taken[k].filter(t => t !== MY_TOKEN); if (keyOf(ivSel) === k) ivSel = ''; renderInterview(); claimsLoad(); },
      e => { claimMsg = (e && e.message) || 'That did not go. Try again.'; renderInterview(); });
  });
  app.querySelectorAll('textarea[data-q]').forEach(t => t.addEventListener('input', () => {
    clearTimeout(ivTimer); const sv = $('ivSaved'); if (sv) sv.textContent = '';
    ivTimer = setTimeout(() => { const d = ivData(); const s = ivEnsure(d, ivSel); app.querySelectorAll('textarea[data-q]').forEach(x => { s.answers[x.dataset.q] = x.value; }); ivSave(d); const sv2 = $('ivSaved'); if (sv2) sv2.textContent = ' \u00b7 Saved'; }, 700);
  }));
  /* WHAT YOU HEARD, TWO BULLET BOXES (Ramy, 20 Nov 2026: "keep it as simple as possible ... they seem to be struggling with ...
     basic instructions"; "bullet point so it's clear for them that each bullet point is a new mistake"). Grammar and
     Pronunciation, one mistake per bullet, Enter for the next, saved as they type and sent to the group's pool. The record
     keeps the same list as before (heard: type and note), so nothing already written changes; a note keeps its id while its
     words stay the same. */
  app.querySelectorAll('textarea.hv').forEach(t => {
    t.addEventListener('focus', () => { if (t.value === '') t.value = '• '; });
    t.addEventListener('keydown', e => { if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return; e.preventDefault();
      const a0 = t.selectionStart, z0 = t.selectionEnd; t.setRangeText('\n• ', a0, z0, 'end'); t.dispatchEvent(new Event('input', { bubbles: true })); });
    t.addEventListener('input', () => { clearTimeout(window.__hvT); window.__hvT = setTimeout(() => {
      if (!ivSel) return; const d = ivData(); const st = ivEnsure(d, ivSel), was = (st.heard || []).slice(), used = {};
      const notesOf = type => String(($(type === 'grammar' ? 'hvG' : 'hvP') || {}).value || '').split('\n').map(x => x.replace(/^\s*[•*\-]\s*/, '').trim()).filter(Boolean);
      st.heard = ['grammar', 'pronunciation'].flatMap(type => notesOf(type).map(note => {
        const old = was.find(h => !used[h.id] && h.type === type && h.note === note); if (old) { used[old.id] = 1; return old; }
        return { id: 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), type, note }; }));
      ivSave(d); const sv2 = $('ivSaved'); if (sv2) sv2.textContent = ' · Saved'; }, 700); });
  });
}

render();
document.addEventListener('hub:ready', () => { band = band || groupBand(MY_GROUP); render(); if (curView() === 'interview' && (FOL.itemsFrom(ivData()).length || FOL.profilesFrom(ivData()).length)) pushPool(); });

/* ---- v2 (7 Oct 2026): three cards, dealt ------------------------------------
   Trainee view only. Layered on render() through a MutationObserver on #app;
   deals once per page load, stamps when a pick first appears. Stores nothing. */
(function(){
  const app = $('app'); if (!app || !IS_TRAINEE) return;
  app.classList.add('gk');
  let dealt = false, lastPick = null;
  const open = new Set();
  function apply(){
    const acts = [...app.querySelectorAll('.act')];
    if (!acts.length) return;
    const chosen = app.querySelector('.act.chosen');
    app.classList.toggle('gk-picked', !!chosen);
    acts.forEach((a, i) => {
      a.style.setProperty('--gk-i', dealt ? 0 : i);
      if (dealt) a.style.animation = 'none';
      const h = a.querySelector('h2');
      if (h && !h.querySelector('.gk-n')) h.insertAdjacentHTML('afterbegin', '<span class="gk-n">' + (i + 1) + ' of ' + acts.length + '</span>');
      a.classList.toggle('gk-open', open.has(a.id));
      let peek = a.querySelector('.gk-peek');
      if (chosen && a !== chosen) {
        if (!peek) { const row = a.querySelector('.row'); (row || a).insertAdjacentHTML('afterbegin', '<button type="button" class="gk-peek" data-gk="' + a.id + '"></button>'); peek = a.querySelector('.gk-peek'); }
        peek.textContent = open.has(a.id) ? 'Fold it away' : 'Read the steps';
        peek.setAttribute('aria-expanded', String(open.has(a.id)));
      } else if (peek) peek.remove();
    });
    const id = chosen ? chosen.id : null;
    if (chosen && id !== lastPick && lastPick !== undefined && dealt) chosen.classList.add('gk-new');
    lastPick = id;
    if (!dealt) setTimeout(() => { dealt = true; }, 400 + acts.length * 110);
  }
  app.addEventListener('click', e => { const b = e.target.closest('.gk-peek'); if (!b) return; const id = b.dataset.gk; open.has(id) ? open.delete(id) : open.add(id); apply(); });
  new MutationObserver(apply).observe(app, { childList: true });
  apply();
})();
