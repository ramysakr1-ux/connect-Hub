<!DOCTYPE html>
<!--
  Connect Lite — getting-to-know-you activities, and the group's pick
  © 2026 Ramy Sakr. All rights reserved.
  Day one of a course, after the demonstration lesson (or the day and slot
  the center names; hubGtkyPlan in hub-shared.js): each
  teaching practice group runs one short getting-to-know-you activity with
  its students, unassessed, no tutor in the room. This page is the bank the
  activities come from -- Connect's ninety, in two level bands, for a room or
  for online -- narrowed to what fits the trainee's group and the course's
  mode, and the pick is made here: one activity for the whole group, which
  lands on the course shelf ("Shared with the class") where the tutor and the
  group see it. The pick rides on the store's share list (shareMaterial, kind
  gtky), the same mechanism as the shelf, so there is no new record kind and
  a trainee can only take back their own. Tutors read the bank; the pick is
  the trainees' (Ramy, 8 Oct 2026: "the mechanism, obviously, to the getting
  to know you").
-->

<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    padding:36px 20px 90px; display:flex; justify-content:center;}
  .board{max-width:820px; width:100%;}
  a{color:var(--teal);} a:hover{color:var(--ink-warm);}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .title{border-top:2px solid var(--teal); padding-top:22px;}
  .title h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.9rem; line-height:1.15;}
  .title p{margin:7px 0 0; font-size:0.9rem; color:var(--grey); line-height:1.55;}
  .pick{margin-top:16px; background:var(--paper); border:1px solid var(--sand-line); border-left:4px solid var(--gold); border-radius:10px; padding:14px 18px; font-size:0.92rem; line-height:1.55;}
  .pick b{font-family:'Newsreader',Georgia,serif; font-size:1.05rem;}
  .bands{margin-top:18px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:0.84rem; color:var(--grey);}
  .chip{font:inherit; font-size:0.8rem; font-weight:600; padding:6px 12px; border-radius:999px; border:1.5px solid var(--sand-line); background:var(--field); color:var(--ink); cursor:pointer;}
  .chip.on{background:var(--teal); border-color:var(--teal); color:#fff;}
  .act{background:var(--surface); border:1px solid var(--sand-line); border-radius:10px; padding:16px 20px; margin-top:12px;}
  .act.chosen{border-color:var(--gold); box-shadow:inset 4px 0 0 var(--gold);}
  .act h2{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.15rem;}
  .act .meta{margin:3px 0 10px; font-size:0.78rem; color:var(--grey); letter-spacing:0.04em;}
  .act ol{margin:0; padding-left:20px; font-size:0.9rem; line-height:1.6;}
  .act .online{margin:10px 0 0; font-size:0.84rem; color:var(--ink-warm); background:var(--field); border-left:3px solid var(--teal); padding:8px 12px;}
  .act .row{margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .btn{font:inherit; font-size:0.82rem; font-weight:600; padding:8px 14px; border-radius:8px; border:1.5px solid var(--teal); background:var(--teal); color:#fff; cursor:pointer;}
  .btn.ghost{background:var(--field); color:var(--ink); border-color:var(--sand-line);}
  .btn:disabled{opacity:0.55; cursor:default;}
  .note{font-size:0.82rem; color:var(--grey);}
  .empty{background:var(--surface); border:1px dashed var(--sand-line); border-radius:10px; padding:26px 22px; margin-top:16px; color:var(--grey); font-size:0.95rem; line-height:1.6;}

  /* ---- v2 (7 Oct 2026): three cards, dealt ----------------------------------
     For the trainee: the three activities arrive as three numbered cards,
     dealt one after another. Picking one stamps it "Your pick" and folds the
     other two to their titles (a tap opens them again), so the page says what
     it is for: one choice, made. The tutor's view of the whole pool is left
     as it is. Display only. Design: Magic Touches, 12a. */
  .gk .act{position:relative; animation:gk-deal .55s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--gk-i, 0) * 110ms);}
  .gk .act h2{display:flex; align-items:baseline; gap:10px;}
  .gk .act h2 .gk-n{font-family:'Instrument Sans',sans-serif; font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-deep);}
  .gk .act:hover{border-color:var(--sand-line-deep, oklch(78% 0.02 80)); box-shadow:0 14px 26px -20px oklch(30% 0.04 60 / .55);}
  .gk .act{transition:box-shadow .2s ease, border-color .2s ease, opacity .3s ease;}
  .gk .act .btn:not(.ghost){transition:transform .15s ease, box-shadow .15s ease;}
  .gk .act .btn:not(.ghost):hover{transform:translateY(-1px); box-shadow:0 8px 16px -10px oklch(37.5% 0.058 195 / .8);}
  .gk .act.chosen{background:var(--paper);}
  /* Take it back is the quiet one beside a pick: a light button that lifts and washes like every other (the motion
     rule). The house rule for the home's action rows (.act .btn, forest) caught it here, so it sat dark and flipped
     pale on hover (Ramy, 26 Oct 2026). */
  .act .btn.ghost{background:var(--paper) !important; color:var(--ink) !important; box-shadow:var(--nb-shadow) !important;}
  .gk .act.chosen::after{content:'Your pick'; position:absolute; top:14px; right:16px; padding:5px 12px 4px; border:2px solid var(--gold-deep); border-radius:6px;
    font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:0.95rem; color:var(--gold-deep); transform:rotate(-6deg); background:var(--paper);}
  .gk .act.chosen.gk-new::after{animation:gk-stamp .5s cubic-bezier(.3,1.5,.5,1) both;}
  .gk.gk-picked .act:not(.chosen){opacity:.82;}
  .gk.gk-picked .act:not(.chosen):not(.gk-open) ol, .gk.gk-picked .act:not(.chosen):not(.gk-open) .online{display:none;}
  .gk.gk-picked .act:not(.chosen):not(.gk-open) .meta{margin-bottom:0;}
  .gk-peek{font:inherit; font-size:0.78rem; font-weight:600; color:var(--teal); background:none; border:0; padding:0; cursor:pointer;}
  .gk-peek:hover{text-decoration:underline; text-underline-offset:3px;}
  .gk .act .btn:focus-visible, .gk-peek:focus-visible, .chip:focus-visible{outline:2px solid var(--gold-lifted); outline-offset:2px;}
  @keyframes gk-deal{from{opacity:0; transform:translateY(18px) rotate(-1.2deg);}to{opacity:1; transform:none;}}
  @keyframes gk-stamp{0%{opacity:0; transform:scale(2) rotate(-14deg);}60%{opacity:1; transform:scale(.94) rotate(-5deg);}100%{transform:rotate(-6deg);}}
  @media(prefers-reduced-motion:reduce){ .gk .act, .gk .act.chosen.gk-new::after{animation:none;} .gk .act, .gk .act .btn{transition:none;} }
  @media(max-width:560px){ .gk .act.chosen::after{position:static; display:inline-block; margin:0 0 8px;} .gk .act.chosen{display:flex; flex-direction:column;} .gk .act.chosen::after{order:-1; align-self:flex-start;} }
  /* ---- the Focus on the Learner interview (15 Oct 2026) ------------------- */
  .fmt{margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;}
  .iv-box{background:var(--surface); border:1px solid var(--sand-line); border-radius:10px; padding:16px 20px; margin-top:12px;}
  .iv-box h2{margin:0 0 6px; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.15rem;}
  .iv-box ul.adv{margin:6px 0 0; padding-left:20px; font-size:.9rem; line-height:1.6;}
  .iv-who{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center;}
  .iv-who input{font:inherit; font-size:.9rem; padding:7px 10px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--field); color:var(--ink); min-width:0; flex:1 1 11em; max-width:18em;}
  .iv-q{margin-top:14px;}
  .iv-q .t{font-size:.7rem; letter-spacing:.1em; font-weight:700; text-transform:uppercase; color:var(--gold-deep);}
  .iv-q .a{font-weight:700; font-size:.95rem; margin:2px 0;}
  .iv-q .l{font-size:.8rem; color:var(--grey); margin-bottom:5px; line-height:1.45;}
  .iv-q textarea, .iv-heard textarea{width:100%; font:inherit; font-size:.9rem; padding:8px 10px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--field); color:var(--ink); min-height:3.2em; resize:vertical;}
  .iv-q textarea:focus, .iv-heard textarea:focus, .iv-who input:focus{outline:none; border-color:var(--gold);}
  .iv-saved{font-size:.8rem; color:var(--grey); margin-left:6px;}
  .iv-heard .item{display:flex; gap:10px; align-items:flex-start; justify-content:space-between; padding:8px 0; border-top:1px solid var(--row-line, #e6e0d4); font-size:.9rem; line-height:1.5;}
  .iv-heard .item:first-of-type{border-top:0;}
  .iv-heard .item b{display:block; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-deep);}
  .iv-types{display:flex; gap:8px; margin:10px 0 6px; flex-wrap:wrap;}
  .iv-tutor td, .iv-tutor th{text-align:left; padding:6px 10px 6px 0; font-size:.88rem; vertical-align:top;}
  @media print{ .gk .act{animation:none;} .gk.gk-picked .act:not(.chosen) ol{display:block;} .gk-peek{display:none;} }
</style>

<body>

<script type="text/x-hub-app">
if (window.hubNotVolunteerRoom && hubNotVolunteerRoom())
  throw new Error('Connect Lite: stopping this page on purpose — this is one of the course’s own pages.');
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e){ return null; } };
const IS_TRAINEE = !!(window.HubStore && HubStore.isTrainee && HubStore.isTrainee());
const ME = rec('hub:me') || {};
const MY_NAME = String(ME.name || '').trim(), MY_GROUP = String(ME.group || '').trim(), MY_TOKEN = String(ME.token || (HubStore.token && HubStore.token()) || '');
if (!IS_TRAINEE) $('back').href = (window.HubStore && HubStore.isAssessor && HubStore.isAssessor()) ? '12_assessor_pack.html' : (new URLSearchParams(location.search).get('view') === 'bank' ? '24_tp_points.html' : '5_tutor_dashboard.html');
const BANK = window.CONNECT_HUB_GTKY || [];
const HIGH = { pre:1, inter:1, upper:1 };
const BAND_NAME = { low: 'Beginner and elementary', high: 'Pre-intermediate and above' };
/* The group's level, from the TP point set the center gave it: A1/A2 are the
   low band, A2+ and up the high one (Connect's two-band rule). */
function bandFromLevel(level){ const m = String(level || '').toUpperCase().match(/\b([ABC][12])(\+?)/); if (!m) return ''; const code = m[1] + m[2]; return code === 'A1' || code === 'A2' ? 'low' : 'high'; }
/* A trainee never receives the set itself, so the store sends their group's level beside their points (v153, 26 Oct
   2026); the room a group teaches in can name it too (Course admin, Online rooms). */
function groupBand(g){ const P = rec('connect_tp_points_v1') || {}; if (P.level) return bandFromLevel(P.level);
  const set = (P.set || {}); const id = (set.setFor || {})[g]; const S = id && (set.library || {})[id]; if (S) return bandFromLevel(S.level || S.book);
  const room = (settings().onlineRooms || []).find(r => r && String(r.group || '') === String(g || '') && r.level); return room ? bandFromLevel(room.level) : ''; }
let KNOWN = '';
function settings(){ return rec('connect_course_settings') || {}; }
function mode(){ const m = String(settings().deliveryMode || 'f2f'); return m === 'online' ? 'online' : 'f2f'; }
function roster(){ const r = rec('connect_roster_v1') || {}; return Object.values(r.trainees || {}); }
function shared(){ return (rec('connect_shared_v1') || []).filter(x => (x.kind || '') === 'gtky'); }
/* A pick is a shared row named "<activity> — <trainee>". */
const SEP = ' — ';
function pickOf(name){ return shared().find(x => String(x.name || '').endsWith(SEP + name)) || null; }
function activityOf(row){ const n = String((row && row.name) || ''); const i = n.lastIndexOf(SEP); return i > 0 ? n.slice(0, i) : n; }
/* THREE EACH. Every trainee is offered three from the pool for their band and
   the course's mode, their own three, stable for them: dealt from the pool by
   a hash of their token, stepping through it so two trainees in the same
   group rarely get the same three (Ramy, 8 Oct 2026: "they have three that
   were chosen depending on the level, and they will choose one of them"). */
function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
/* The step can share a factor with the pool's size (27 in 54 visits two
   activities and comes round again), so the walk is bounded and a short cycle
   is finished one at a time from where it stopped. */
function offered(pool, seed){ if (pool.length <= 3) return pool.slice(); const out = [], n = pool.length, start = hash(seed) % n, step = 1 + (hash(seed + '|') % (n - 1)); let i = start; for (let k = 0; k < n && out.length < 3; k++, i += step) { const a = pool[i % n]; if (out.indexOf(a) < 0) out.push(a); } for (let j = start; out.length < 3; j++) { const a = pool[j % n]; if (out.indexOf(a) < 0) out.push(a); } return out; }
let band = '', busy = false, note = '';
function plan(){ return window.hubGtkyPlan ? hubGtkyPlan(settings(), rec('connect_timetable_v1')) : { when: 'on the first day', minutes: 0, slotMinutes: 45 }; }
function minutesLine(){ const p = plan(); return p.minutes ? 'About ' + p.minutes + ' minutes each, ' + p.when + (p.slot ? ', in ' + p.slot : '') + '.' : 'The ' + p.slotMinutes + ' minutes of unassessed teaching ' + p.when + ' are shared between the group, so each ' + (window.HubMode === 'tutor' || window.HubMode === 'assessor' ? 'trainee' : 'of you') + ' has a few.'; }
/* THE SESSION'S FORMAT (15 Oct 2026). Course admin, Getting to know you:
   the three activities (as it always was), a Focus on the Learner interview,
   or both. With both, the page opens on the interview and the trainee can
   switch. The interview itself is in iv*() below. */
function fmt(){ const f = String(settings().gtkyFormat || ''); return f === 'interview' || f === 'both' ? f : 'activities'; }
let ivView = '';
/* THE TUTORS' TWO DOORS (Ramy, 28 Oct 2026: "the tab from Teaching practice should only show the collective pool ... none of the
   other stuff"; the activities "should live with the TP points"). ?view=pool is the pool alone; ?view=bank is the bank of
   activities alone. Who picked what and who interviewed whom are in each trainee's portfolio. */
const TUTOR_VIEW = new URLSearchParams(location.search).get('view') === 'bank' ? 'bank' : 'pool';
function curView(){ const f = fmt(); if (f === 'both') return ivView || 'interview'; return f === 'interview' ? 'interview' : 'activities'; }
function switcher(){ return fmt() === 'both' ? `<div class="fmt"><button class="chip${curView() === 'interview' ? ' on' : ''}" type="button" data-view="interview">Student interview</button><button class="chip${curView() === 'activities' ? ' on' : ''}" type="button" data-view="activities">Activities</button></div>` : ''; }
function poolBox(){
  const all = poolList(); const gOf = {}; roster().forEach(t => { gOf[t.name] = String(t.group || ''); });
  const groups = [...new Set(all.map(h => gOf[h.by] || ''))].sort((x, y) => x.localeCompare(y, undefined, { numeric: true }));
  const body = groups.length > 1 ? groups.map(g => { const list = all.filter(h => (gOf[h.by] || '') === g); return `<h3 style="margin:14px 0 4px;font:700 .78rem/1.2 'Karla',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)">${g ? 'Group ' + esc(g) : 'No group yet'} &middot; ${list.length}</h3>` + FOL.poolHtml(list); }).join('') : FOL.poolHtml(all);
  return `<div class="iv-box"><h2>The pool &mdash; ${all.length} heard so far</h2><p class="note">Everything the trainees heard in their student interviews, by TP group, with who heard it. Each group sees only its own; you see them all. Each trainee’s own interview is in their portfolio.</p>${body}</div>`;
}
function renderPool(){
  $('app').innerHTML = `<div class="title"><h1>The interview pool</h1><p>What the trainees heard in their student interviews, pooled for Focus on the Learner.</p></div>` + poolBox();
  if (window.CONNECT_HUB_FOL && FOL.wirePlay) FOL.wirePlay($('app'));
}
function render(){
  if (!IS_TRAINEE && TUTOR_VIEW === 'pool') { renderPool(); return; }
  if (curView() === 'interview' && IS_TRAINEE) { renderInterview(); return; }
  const g = MY_GROUP, m = mode();
  if (!band) { KNOWN = IS_TRAINEE ? groupBand(g) : ''; band = KNOWN || groupBand(g) || (IS_TRAINEE ? '' : 'high'); }
  const mine = IS_TRAINEE ? pickOf(MY_NAME) : null;
  /* who picked what, for the tutors (Ramy, 28 Oct 2026: "which getting to know you everyone is doing") */
  const picksBox = '';   /* who picked what is in each trainee's portfolio (28 Oct 2026) */
  const head = `<div class="title"><h1>Getting to know you</h1>
    <p>${IS_TRAINEE ? 'One short activity to run with your students, after the demonstration lesson. Unassessed, no tutor in the room. Here are three for the level you teach: read them, pick one, and that is all you need to do before day one. ' + esc(minutesLine()) : 'Connect’s bank for the first afternoon: a trainee is offered three for the level they teach and picks one; the pick lands on their portfolio and on the shelf. ' + esc(minutesLine())}</p></div>`;
  const pickBox = IS_TRAINEE
    ? (mine ? `<div class="pick"><b>Your pick: ${esc(activityOf(mine))}</b><br><span class="note">Your tutor and your group see it on the shelf. Changed your mind? Take it back below and pick again.</span></div>`
            : `<div class="pick"><b>You have not picked yet.</b><br><span class="note">Pick one of the three. You can change it until day one.</span></div>`)
    : '';   /* the tutors' table above says who picked what */
  /* Ramy, 26 Oct 2026: "Since we already know who the trainee is, we know what level they're teaching, why don't they
     just get their own". Known: the level is said, not offered. Not known yet: they choose. */
  const bands = KNOWN ? `<div class="bands"><span>Your students: <b>${esc(BAND_NAME[KNOWN].toLowerCase().replace(/^./, c => c.toUpperCase()))}</b> &middot; ${m === 'online' ? 'online course' : 'in the room'}</span></div>` : `<div class="bands"><span>${IS_TRAINEE ? 'Level of your students:' : 'Level:'}</span>
    <button class="chip${band === 'low' ? ' on' : ''}" type="button" data-band="low">${BAND_NAME.low}</button>
    <button class="chip${band === 'high' ? ' on' : ''}" type="button" data-band="high">${BAND_NAME.high}</button>
    <span>&middot; ${m === 'online' ? 'online course' : 'in the room'}</span></div>`;
  if (!band) { $('app').innerHTML = head + switcher() + picksBox + pickBox + bands + '<div class="empty">Choose the level of your students above and your three appear.</div>'; wire(); return; }
  const pool = BANK.filter(a => (band === 'high') === !!HIGH[a.level] && (a.mode === 'both' || a.mode === m));
  const show = IS_TRAINEE ? offered(pool, MY_TOKEN || MY_NAME || 'x') : pool;
  /* A pick made from an earlier three (the level changed) stays visible. */
  if (mine && !show.some(a => a.name === activityOf(mine))) { const a = BANK.find(x => x.name === activityOf(mine)); if (a) show.unshift(a); }
  const list = show.map(a => { const isMine = mine && activityOf(mine) === a.name;
    return `<div class="act${isMine ? ' chosen' : ''}" id="${esc(a.slug)}"><h2>${esc(a.name)}</h2><p class="meta">${esc(a.meta)}</p>
      <ol>${a.steps.map(s => '<li>' + esc(s) + '</li>').join('')}</ol>
      ${m === 'online' && a.onlineNote ? `<p class="online">${esc(a.onlineNote)}</p>` : ''}
      ${IS_TRAINEE ? `<div class="row">${isMine
          ? `<button class="btn ghost" type="button" data-unpick="${esc(mine.id)}"${busy ? ' disabled' : ''}>Take it back</button><span class="note">Your pick.</span>`
          : (mine ? '<span class="note">Take your pick back to choose this instead.</span>' : `<button class="btn" type="button" data-pick="${esc(a.slug)}"${busy ? ' disabled' : ''}>Pick this one</button>`)}</div>` : ''}
    </div>`; }).join('');
  $('app').innerHTML = head + switcher() + picksBox + pickBox + bands + (note ? `<p class="note" style="margin:12px 0 0;">${esc(note)}</p>` : '') + list;
  wire();
}
function write(list){ try { localStorage.setItem('connect_shared_v1', JSON.stringify(list || [])); } catch(e){} }
async function pickIt(slug){
  const a = BANK.find(x => x.slug === slug); if (!a || busy) return;
  if (!MY_NAME) { note = 'Your name is missing — open your own link again.'; render(); return; }
  busy = true; note = 'Picking…'; render();
  try {
    const body = { op: 'shareMaterial', name: a.name + SEP + MY_NAME, url: location.href.split('#')[0] + '#' + a.slug, by: MY_NAME, tp: '', kind: 'gtky' };
    if (HubStore.token && HubStore.token()) body.token = HubStore.token();
    const r = await HubStore.call(body);
    /* A demo saves nothing at the store and answers { demo: true } with no list, so the pick is kept on this device
       instead -- it used to clear the list and say "Picked" over "You have not picked yet" (Ramy, 26 Oct 2026). */
    if (r && r.demo) write(shared().filter(x => !String(x.name || '').endsWith(SEP + MY_NAME)).concat([{ id: 'demo-' + Date.now(), name: body.name, url: body.url, by: MY_NAME, tp: '', kind: 'gtky', at: new Date().toISOString() }]).concat((rec('connect_shared_v1') || []).filter(x => (x.kind || '') !== 'gtky')));
    else write(r.shared || []);

    acts.forEach((a, i) => {
      a.style.setProperty('--gk-i', dealt ? 0 : i);
      if (dealt) a.style.animation = 'none';
      const h = a.querySelector('h2');
      if (h && !h.querySelector('.gk-n')) h.insertAdjacentHTML('afterbegin', '<span class="gk-n">' + (i + 1) + ' of ' + acts.length + '</span>');
      a.classList.toggle('gk-open', open.has(a.id));
      let peek = a.querySelector('.gk-peek');
      if (chosen && a !== chosen) {
        if (!peek) { const row = a.querySelector('.row'); (row || a).insertAdjacentHTML('afterbegin', '<button type="button" class="gk-peek" data-gk="' + a.id + '"></button>'); peek = a.querySelector('.gk-peek'); }
        peek.textContent = open.has(a.id) ? 'Fold it away' : 'Read the steps';
        peek.setAttribute('aria-expanded', String(open.has(a.id)));
      } else if (peek) peek.remove();
    });
    const id = chosen ? chosen.id : null;
    if (chosen && id !== lastPick && lastPick !== undefined && dealt) chosen.classList.add('gk-new');
    lastPick = id;
    if (!dealt) setTimeout(() => { dealt = true; }, 400 + acts.length * 110);
  }
  app.addEventListener('click', e => { const b = e.target.closest('.gk-peek'); if (!b) return; const id = b.dataset.gk; open.has(id) ? open.delete(id) : open.add(id); apply(); });
  new MutationObserver(apply).observe(app, { childList: true });
  apply();
})();

</script>
</body>
</html>
