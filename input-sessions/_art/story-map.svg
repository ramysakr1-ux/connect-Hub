<svg class="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-label="A map of the story: their house in the forest on the near bank, the stone bridge and the ferryman's boat crossing the river, and on the far bank the hospital, his office and the friend's house" font-family="Karla, system-ui, sans-serif">
<!-- The map of the story, redrawn 13 Oct 2026 (Ramy: "can we do better
     with those pictures?"). Still a map, because the story turns on
     geography: two ways across one river, and what each costs. But drawn
     as a place rather than a diagram: a stone bridge with arches, a wooden
     ferry, a lit window in the office, smoke from the house in the forest,
     a city skyline behind the far bank. Three bands, as before, so nothing
     drifts into the water: the city above y=215, the river to 325, the
     forest below. House colours: teal ink, gold, brick for the hospital
     cross and the lit window. -->
<defs>
  <style>
    .ln{fill:none;stroke:#2B5C5C;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .fl{fill:#FDFCF9;stroke:#2B5C5C;stroke-width:1.7;stroke-linejoin:round}
    .wall{fill:#F3EEE3;stroke:#2B5C5C;stroke-width:1.7;stroke-linejoin:round}
    .roof{fill:#2B5C5C;stroke:#2B5C5C;stroke-width:1.7;stroke-linejoin:round}
    .stone{fill:#E9E2D3;stroke:#2B5C5C;stroke-width:1.7;stroke-linejoin:round}
    .pine{fill:#CFDDD9;stroke:#2B5C5C;stroke-width:1.4;stroke-linejoin:round}
    .leaf{fill:#DCE7E3;stroke:#2B5C5C;stroke-width:1.4}
    .trunk{stroke:#4A3A2C;stroke-width:2;stroke-linecap:round}
    .sky{fill:#ECE6D9;stroke:#B8AE9C;stroke-width:1.2;stroke-linejoin:round}
    .glass{fill:#FDFCF9;stroke:#2B5C5C;stroke-width:1.1}
    .lit{fill:#E7B35A;stroke:#2B5C5C;stroke-width:1.1}
    .num{font-size:12.5px;font-weight:700;fill:#FDFCF9}
    .cap{font-size:14px;font-weight:700;fill:#2B5C5C}
    .sub{font-size:11.5px;font-weight:600;fill:#7A7268}
    .bank{font-size:12px;font-weight:700;fill:#9A9284;letter-spacing:.06em}
  </style>
</defs>
<rect width="1100" height="560" fill="#FDFCF9"/>

<!-- ================= THE CITY SKYLINE, far back ================= -->
<g class="sky">
  <path d="M0 150 h40 v-30 h22 v30 h26 v-46 h18 v46 h30 v-22 h20 v22 h60 v-36 h24 v36 h40 v-18 h30 v18 h52 v-54 h20 v54 h34 v-30 h18 v30 h80 v-40 h26 v40 h40 v-20 h22 v20 h70 v-44 h20 v44 h44 v-26 h18 v26 h60 v-34 h22 v34 h36 v-18 h24 v18 h40 v-28 h20 v28 h60 v-40 h22 v40 h40 v-22 h30 v22 h42 v-36 h20 v36 h30 v12 H0 z"/>
</g>
<!-- the road along the far bank -->
<path d="M0 200 H1100" stroke="#D9D1C2" stroke-width="10"/>
<path d="M0 200 H1100" stroke="#FDFCF9" stroke-width="1.2" stroke-dasharray="14 10"/>

<!-- ================= THE RIVER ================= -->
<path d="M0 214 C 220 202, 420 222, 620 234 C 800 245, 950 232, 1100 216 L1100 322 C 950 338, 800 351, 620 340 C 420 328, 220 308, 0 320 Z" fill="#DCE8EA"/>
<path d="M0 230 C 220 218, 420 238, 620 250 C 800 261, 950 248, 1100 232 L1100 306 C 950 322, 800 335, 620 324 C 420 312, 220 292, 0 304 Z" fill="#D2E1E4"/>
<path d="M0 214 C 220 202, 420 222, 620 234 C 800 245, 950 232, 1100 216" class="ln" stroke="#9FB9BC"/>
<path d="M0 320 C 220 308, 420 328, 620 340 C 800 351, 950 338, 1100 322" class="ln" stroke="#9FB9BC"/>
<g stroke="#A9C3C6" stroke-width="1.3" fill="none" stroke-linecap="round">
  <path d="M120 262 q 18 -6 36 0 M170 280 q 18 -6 36 0 M250 258 q 18 -6 36 0 M330 290 q 18 -6 36 0 M690 284 q 18 -6 36 0 M760 262 q 18 -6 36 0 M860 296 q 18 -6 36 0 M960 270 q 18 -6 36 0 M1020 300 q 18 -6 36 0"/>
</g>
<!-- reeds at the water's edge -->
<g class="ln" stroke="#6E8F86" stroke-width="1.3">
  <path d="M60 318 v-16 M66 320 v-20 M72 318 v-14 M400 332 v-16 M406 334 v-20 M412 332 v-13 M980 326 v-16 M986 328 v-20 M992 326 v-14"/>
</g>

<!-- ================= FAR BANK: the city ================= -->
<!-- 6 · the hospital, close to the bridge -->
<g>
  <path class="wall" d="M272 118 h120 v76 h-120 z"/>
  <path class="wall" d="M300 104 h64 v14 h-64 z"/>
  <g class="glass"><rect x="284" y="130" width="14" height="14"/><rect x="306" y="130" width="14" height="14"/><rect x="344" y="130" width="14" height="14"/><rect x="366" y="130" width="14" height="14"/><rect x="284" y="156" width="14" height="14"/><rect x="306" y="156" width="14" height="14"/><rect x="344" y="156" width="14" height="14"/><rect x="366" y="156" width="14" height="14"/></g>
  <path class="fl" d="M322 170 h20 v24 h-20 z"/>
  <g stroke="#A43A2E" stroke-width="3.4" stroke-linecap="round" fill="none"><path d="M332 108 v10 M327 113 h10"/></g>
  <circle cx="272" cy="118" r="13" fill="#2B5C5C"/><text x="272" y="123" text-anchor="middle" class="num">6</text>
</g>
<text x="332" y="86" text-anchor="middle" class="cap">The hospital</text>
<text x="332" y="70" text-anchor="middle" class="sub">close to the bridge</text>

<!-- 4 · his office: a tower, one window lit late -->
<g>
  <path class="wall" d="M646 62 h84 v132 h-84 z"/>
  <path class="ln" d="M646 76 h84"/>
  <g class="glass">
    <rect x="656" y="86" width="14" height="16"/><rect x="681" y="86" width="14" height="16"/><rect x="706" y="86" width="14" height="16"/>
    <rect x="656" y="112" width="14" height="16"/><rect x="681" y="112" width="14" height="16"/><rect x="706" y="112" width="14" height="16"/>
    <rect x="656" y="138" width="14" height="16"/><rect x="706" y="138" width="14" height="16"/>
    <rect x="656" y="164" width="14" height="16"/><rect x="681" y="164" width="14" height="16"/><rect x="706" y="164" width="14" height="16"/>
  </g>
  <rect x="681" y="138" width="14" height="16" class="lit"/>
  <path class="fl" d="M679 182 h18 v12 h-18 z"/>
  <circle cx="646" cy="62" r="13" fill="#2B5C5C"/><text x="646" y="67" text-anchor="middle" class="num">4</text>
</g>
<text x="688" y="40" text-anchor="middle" class="cap">His office</text>
<text x="688" y="24" text-anchor="middle" class="sub">where he works late</text>

<!-- 5 · the friend's house: a town house with a warm window -->
<g>
  <path class="wall" d="M900 134 h96 v60 h-96 z"/>
  <path class="roof" d="M892 134 l56 -38 l56 38 z"/>
  <path class="ln" d="M968 108 v-16 h10 v24"/>
  <rect x="912" y="146" width="16" height="16" class="lit"/>
  <rect x="968" y="146" width="16" height="16" class="glass"/>
  <path class="fl" d="M938 194 v-30 h20 v30"/>
  <path class="ln" d="M896 194 h104"/>
  <circle cx="892" cy="130" r="13" fill="#2B5C5C"/><text x="892" y="135" text-anchor="middle" class="num">5</text>
</g>
<text x="948" y="84" text-anchor="middle" class="cap">The friend’s house</text>
<text x="948" y="68" text-anchor="middle" class="sub">in town for a few days</text>

<!-- a lamp post on the far bank -->
<g class="ln"><path d="M560 200 v-34"/><circle cx="560" cy="162" r="5" fill="#E7B35A"/></g>
<g class="ln"><path d="M120 200 v-34"/><circle cx="120" cy="162" r="5" fill="#E7B35A"/></g>

<!-- ================= ACROSS ================= -->
<!-- 2 · the stone bridge: three arches, spans both banks -->
<g>
  <path class="stone" d="M444 196 h72 v146 h-72 z"/>
  <g class="ln">
    <path d="M444 210 h72 M444 328 h72"/>
    <path d="M452 232 a10 10 0 0 1 20 0 v26 h-20 z M464 266 a10 10 0 0 1 20 0 v26 h-20 z M476 300 a10 10 0 0 1 20 0 v22 h-20 z" fill="#C9D9DA"/>
    <path d="M458 196 v-16 M502 196 v-16 M458 180 h44"/>
  </g>
  <!-- parapet lamps -->
  <g class="ln"><path d="M449 196 v-22 M511 196 v-22"/><circle cx="449" cy="172" r="4" fill="#E7B35A"/><circle cx="511" cy="172" r="4" fill="#E7B35A"/></g>
  <circle cx="480" cy="156" r="13" fill="#2B5C5C"/><text x="480" y="161" text-anchor="middle" class="num">2</text>
</g>
<text x="480" y="134" text-anchor="middle" class="cap">The bridge</text>
<text x="480" y="118" text-anchor="middle" class="sub">you can walk it</text>

<!-- ================= NEAR BANK: the forest ================= -->
<!-- the path from the house to the bridge, and to the ferry -->
<path d="M250 420 C 300 400, 380 370, 444 342" stroke="#D9D1C2" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M250 420 C 300 400, 380 370, 444 342" stroke="#FDFCF9" stroke-width="1" fill="none" stroke-dasharray="8 8"/>
<path d="M262 424 C 380 440, 520 418, 640 392" stroke="#D9D1C2" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M262 424 C 380 440, 520 418, 640 392" stroke="#FDFCF9" stroke-width="1" fill="none" stroke-dasharray="8 8"/>

<!-- the forest -->
<g>
  <g class="pine"><path d="M50 412 l20 34 h-40 z M50 388 l16 28 h-32 z M50 366 l12 22 h-24 z"/></g><path class="trunk" d="M50 446 v12"/>
  <g class="pine"><path d="M112 440 l22 36 h-44 z M112 414 l18 30 h-36 z M112 392 l13 24 h-26 z"/></g><path class="trunk" d="M112 476 v12"/>
  <g class="pine"><path d="M24 470 l18 30 h-36 z M24 448 l14 24 h-28 z"/></g><path class="trunk" d="M24 500 v10"/>
  <g class="pine"><path d="M330 396 l20 34 h-40 z M330 372 l16 28 h-32 z M330 350 l12 22 h-24 z"/></g><path class="trunk" d="M330 430 v12"/>
  <g class="pine"><path d="M380 450 l18 30 h-36 z M380 428 l14 24 h-28 z"/></g><path class="trunk" d="M380 480 v10"/>
  <g class="pine"><path d="M70 512 l18 30 h-36 z M70 490 l14 24 h-28 z"/></g><path class="trunk" d="M70 542 v8"/>
  <g class="pine"><path d="M372 512 l16 26 h-32 z M372 492 l12 22 h-24 z"/></g><path class="trunk" d="M372 538 v8"/>
  <circle cx="86" cy="390" r="16" class="leaf"/><path class="trunk" d="M86 406 v16"/>
  <circle cx="280" cy="372" r="14" class="leaf"/><path class="trunk" d="M280 386 v14"/>
  <circle cx="128" cy="536" r="12" class="leaf"/><path class="trunk" d="M128 548 v8"/>
  <circle cx="860" cy="470" r="16" class="leaf"/><path class="trunk" d="M860 486 v14"/>
  <g class="pine"><path d="M920 440 l20 34 h-40 z M920 416 l16 28 h-32 z"/></g><path class="trunk" d="M920 474 v12"/>
  <g class="pine"><path d="M1000 490 l18 30 h-36 z M1000 468 l14 24 h-28 z"/></g><path class="trunk" d="M1000 520 v8"/>
  <g class="pine"><path d="M1060 430 l18 30 h-36 z M1060 408 l14 24 h-28 z"/></g><path class="trunk" d="M1060 460 v10"/>
</g>

<!-- 1 · their house, in the forest: a cottage, smoke from the chimney -->
<g>
  <path class="wall" d="M166 388 h96 v58 h-96 z"/>
  <path class="roof" d="M154 388 l60 -38 l60 38 z"/>
  <path class="ln" d="M236 358 v-20 h12 v28"/>
  <path d="M244 334 c -8 -10, 6 -16, -2 -26 c -6 -8, 6 -12, 0 -20" class="ln" stroke="#9A9284" stroke-width="1.6"/>
  <rect x="178" y="402" width="16" height="15" class="glass"/>
  <rect x="236" y="402" width="16" height="15" class="glass"/>
  <path class="fl" d="M204 446 v-30 h20 v30"/>
  <path class="ln" d="M160 446 h108"/>
  <circle cx="154" cy="372" r="13" fill="#2B5C5C"/><text x="154" y="377" text-anchor="middle" class="num">1</text>
</g>
<text x="214" y="472" text-anchor="middle" class="cap">Their house</text>
<text x="214" y="488" text-anchor="middle" class="sub">in the forest, outside the city</text>

<!-- 3 · the ferryman: his hut on the bank, his boat in the water, his sign -->
<g>
  <path class="wall" d="M632 372 h60 v42 h-60 z"/>
  <path class="roof" d="M622 372 l40 -26 l40 26 z"/>
  <path class="fl" d="M654 414 v-20 h16 v20"/>
  <path class="ln" d="M626 414 h72"/>
  <!-- the jetty -->
  <path class="ln" d="M660 346 v-18 M684 346 v-18 M652 346 h40"/>
  <!-- the boat -->
  <path class="fl" d="M612 300 c 10 18, 54 18, 64 0 z" fill="#E9E2D3"/>
  <path class="ln" d="M612 300 h64"/>
  <!-- the ferryman and his pole -->
  <circle cx="650" cy="282" r="5" class="fl"/>
  <path class="ln" d="M650 287 v10 M650 291 l-7 7 M650 291 l8 -3 M658 270 v34"/>
  <!-- the sign -->
  <path class="ln" d="M712 414 v-30"/>
  <path class="fl" d="M700 384 h28 v14 h-28 z"/>
  <circle cx="714" cy="391" r="3.2" fill="#E7B35A" stroke="#2B5C5C" stroke-width="1.2"/>
  <circle cx="622" cy="356" r="13" fill="#2B5C5C"/><text x="622" y="361" text-anchor="middle" class="num">3</text>
</g>
<text x="662" y="442" text-anchor="middle" class="cap">The ferryman</text>
<text x="662" y="458" text-anchor="middle" class="sub">payment first, always</text>

<!-- Which side you are on IS the story, so both sides are named. -->
<text x="40" y="36" class="bank">THE CITY SIDE · work, and the friend</text>
<text x="40" y="546" class="bank">THE FOREST SIDE · home</text>
</svg>
