<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" role="img" aria-label="A child's crayon drawing of a monster: round and green, three eyes, two horns, a toothy grin, striped legs and a spiky tail" font-family="Karla, system-ui, sans-serif">
<!-- Drawn 13 Oct 2026 (Ramy: "play with those pictures, keep them
     childish, you don't have to copy the exact same pictures"). A crayon
     monster: wobbly lines, flat colours that miss the edges, one eye too
     many. Nothing in it is traced from the old picture. -->
<defs>
  <style>
    .c{fill:none;stroke:#3B2E22;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .thin{fill:none;stroke:#3B2E22;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="260" height="340" fill="#FDFCF9"/>
<!-- the ground, a scribble -->
<path d="M18 306 q30 -8 60 0 t60 0 t60 0 t44 2" class="thin" stroke="#8FA66A"/>
<path d="M26 316 q24 -6 48 0 t48 0 t48 0 t40 2" class="thin" stroke="#8FA66A"/>
<!-- the tail, spiky -->
<path d="M196 230 c 28 -4, 44 -22, 48 -48 c 2 -14, -6 -22, -14 -18 c -10 6, -6 24, -18 34 c -8 7, -16 10, -24 12" fill="#D27A3A" stroke="#D27A3A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M196 230 c 28 -4, 44 -22, 48 -48 c 2 -14, -6 -22, -14 -18 c -10 6, -6 24, -18 34" class="c"/>
<g fill="#E8C34A" stroke="#3B2E22" stroke-width="3" stroke-linejoin="round">
  <path d="M212 212 l8 -14 l6 12 z"/><path d="M228 194 l6 -14 l8 10 z"/><path d="M236 176 l2 -14 l10 8 z"/>
</g>
<!-- the body: a wobbly green blob that doesn't quite meet its line -->
<path d="M62 150 c -16 40, -6 96, 40 112 c 40 14, 94 6, 108 -40 c 12 -38, -2 -78, -40 -96 c -34 -16, -84 -12, -108 24 z" fill="#8CC06A" transform="translate(5 4)"/>
<path d="M62 150 c -16 40, -6 96, 40 112 c 40 14, 94 6, 108 -40 c 12 -38, -2 -78, -40 -96 c -34 -16, -84 -12, -108 24 z" class="c"/>
<!-- belly patch -->
<path d="M96 214 c 6 -22, 40 -26, 56 -10 c 10 10, 8 30, -8 40 c -18 10, -44 2, -48 -30 z" fill="#DCE9B6" stroke="#3B2E22" stroke-width="2.6" stroke-dasharray="6 5" stroke-linecap="round"/>
<!-- horns -->
<path d="M84 92 c -10 -22, -8 -38, 2 -50 c 2 14, 10 26, 20 36" fill="#E8C34A" stroke="#3B2E22" stroke-width="3.6" stroke-linejoin="round"/>
<path d="M170 86 c 10 -22, 8 -40, -2 -52 c -2 14, -10 28, -22 38" fill="#E8C34A" stroke="#3B2E22" stroke-width="3.6" stroke-linejoin="round"/>
<!-- three eyes, one of them smaller -->
<g>
  <circle cx="94" cy="138" r="17" fill="#FDFCF9" stroke="#3B2E22" stroke-width="3.6"/><circle cx="98" cy="140" r="7" fill="#3B2E22"/>
  <circle cx="148" cy="134" r="20" fill="#FDFCF9" stroke="#3B2E22" stroke-width="3.6"/><circle cx="152" cy="137" r="8" fill="#3B2E22"/>
  <circle cx="124" cy="110" r="11" fill="#FDFCF9" stroke="#3B2E22" stroke-width="3.2"/><circle cx="126" cy="112" r="5" fill="#3B2E22"/>
</g>
<!-- the grin, with teeth that don't match -->
<path d="M86 184 c 20 22, 60 24, 84 -2" class="c"/>
<path d="M86 184 c 20 22, 60 24, 84 -2 c -8 -2, -18 -4, -28 -6 c -16 6, -30 6, -42 0 z" fill="#B23A2E" stroke="#3B2E22" stroke-width="3" stroke-linejoin="round"/>
<g fill="#FDFCF9" stroke="#3B2E22" stroke-width="2.6" stroke-linejoin="round">
  <path d="M104 190 l6 12 l6 -12 z"/><path d="M128 194 l5 10 l5 -10 z"/><path d="M150 188 l7 10 l5 -12 z"/>
</g>
<!-- arms, stuck on at odd angles -->
<path d="M66 182 c -22 6, -36 20, -40 40" class="c" stroke="#8CC06A" stroke-width="16"/>
<path d="M66 182 c -22 6, -36 20, -40 40" class="c"/>
<path d="M26 222 l-10 10 M26 222 l-2 14 M26 222 l10 10" class="thin"/>
<path d="M208 190 c 24 -2, 36 10, 42 30" class="c" stroke="#8CC06A" stroke-width="16"/>
<path d="M208 190 c 24 -2, 36 10, 42 30" class="c"/>
<path d="M250 220 l10 8 M250 220 l4 14 M250 220 l-8 10" class="thin"/>
<!-- legs, striped -->
<g>
  <path d="M96 258 l-4 46" stroke="#6C7CC4" stroke-width="22" stroke-linecap="round"/>
  <path d="M96 258 l-4 46" class="c"/>
  <path d="M90 272 h14 M89 286 h13" class="thin" stroke="#FDFCF9"/>
  <path d="M156 258 l6 46" stroke="#6C7CC4" stroke-width="22" stroke-linecap="round"/>
  <path d="M156 258 l6 46" class="c"/>
  <path d="M152 272 h14 M154 286 h13" class="thin" stroke="#FDFCF9"/>
  <!-- big feet, three toes -->
  <path d="M74 306 c -2 -10, 30 -14, 40 -2 c 4 6, -2 10, -8 10 h-26 c -4 0, -6 -4, -6 -8 z" fill="#B23A2E" stroke="#3B2E22" stroke-width="3.6" stroke-linejoin="round"/>
  <path d="M148 306 c -2 -10, 30 -14, 40 -2 c 4 6, -2 10, -8 10 h-26 c -4 0, -6 -4, -6 -8 z" fill="#B23A2E" stroke="#3B2E22" stroke-width="3.6" stroke-linejoin="round"/>
  <path d="M82 300 l-4 -6 M94 298 l0 -7 M106 300 l4 -6 M156 300 l-4 -6 M168 298 l0 -7 M180 300 l4 -6" class="thin"/>
</g>
<!-- a name, in a child's hand -->
<text x="130" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2E22" letter-spacing=".08em">my monster</text>
</svg>
