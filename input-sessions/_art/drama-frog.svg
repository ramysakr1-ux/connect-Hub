<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" role="img" aria-label="A child's crayon drawing of Rod the frog, a sad green frog on a lily pad, with a butterfly, a parrot and a rainbow behind him" font-family="Karla, system-ui, sans-serif">
<!-- Drawn 13 Oct 2026 for the Drama session, in a child's hand: Rod the
     frog, sad because green is horrible, with the three things from the
     story around him (the butterfly, the parrot, the rainbow the witch
     lives at the end of). Not traced from the old picture. -->
<defs>
  <style>
    .c{fill:none;stroke:#3B2E22;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .thin{fill:none;stroke:#3B2E22;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="260" height="300" fill="#FDFCF9"/>
<!-- the rainbow, four crayon arcs that overlap a little -->
<g fill="none" stroke-width="11" stroke-linecap="round">
  <path d="M40 150 a 90 90 0 0 1 180 0" stroke="#D9534F"/>
  <path d="M52 150 a 78 78 0 0 1 156 0" stroke="#E8C34A"/>
  <path d="M64 150 a 66 66 0 0 1 132 0" stroke="#8CC06A"/>
  <path d="M76 150 a 54 54 0 0 1 108 0" stroke="#6C9BD2"/>
</g>
<!-- the pond -->
<path d="M14 246 c 40 -22, 190 -22, 232 0 c -20 20, -212 22, -232 0 z" fill="#BFDDE6" stroke="#3B2E22" stroke-width="3" stroke-linejoin="round"/>
<!-- the lily pad -->
<path d="M70 240 c 20 -16, 100 -16, 120 0 c -10 10, -40 14, -60 6 c -24 10, -50 6, -60 -6 z" fill="#8CC06A" stroke="#3B2E22" stroke-width="3.2" stroke-linejoin="round"/>
<path d="M130 236 l 20 -10" class="thin"/>
<!-- Rod: body -->
<path d="M84 212 c -10 -36, 16 -62, 46 -62 c 32 0, 56 26, 46 62 z" fill="#6DAE4E" transform="translate(3 3)"/>
<path d="M84 212 c -10 -36, 16 -62, 46 -62 c 32 0, 56 26, 46 62 z" class="c"/>
<!-- belly -->
<path d="M104 212 c 2 -18, 14 -28, 26 -28 c 12 0, 24 10, 26 28 z" fill="#DCE9B6" stroke="#3B2E22" stroke-width="2.4"/>
<!-- eyes on top -->
<circle cx="110" cy="150" r="15" fill="#6DAE4E" stroke="#3B2E22" stroke-width="3.6"/>
<circle cx="150" cy="150" r="15" fill="#6DAE4E" stroke="#3B2E22" stroke-width="3.6"/>
<circle cx="110" cy="151" r="9" fill="#FDFCF9" stroke="#3B2E22" stroke-width="2.4"/>
<circle cx="150" cy="151" r="9" fill="#FDFCF9" stroke="#3B2E22" stroke-width="2.4"/>
<circle cx="112" cy="154" r="4" fill="#3B2E22"/><circle cx="152" cy="154" r="4" fill="#3B2E22"/>
<!-- sad eyebrows and a sad mouth -->
<path d="M98 136 l 16 6 M162 136 l -16 6" class="thin"/>
<path d="M112 196 c 8 -10, 28 -10, 36 0" class="c"/>
<!-- a tear -->
<path d="M160 164 c 4 6, 6 10, 2 14 c -4 2, -8 -2, -6 -8 c 1 -3, 3 -5, 4 -6 z" fill="#6C9BD2" stroke="#3B2E22" stroke-width="1.8"/>
<!-- legs, splayed -->
<path d="M90 212 c -16 2, -26 10, -28 20 M68 232 l-8 6 M68 232 l0 8 M68 232 l8 4" class="c"/>
<path d="M170 212 c 16 2, 26 10, 28 20 M198 232 l8 6 M198 232 l0 8 M198 232 l-8 4" class="c"/>
<!-- the butterfly, top left -->
<g transform="translate(34 44)">
  <path d="M0 12 c -14 -16, -24 -4, -14 8 c -10 10, 2 22, 14 6 c 12 16, 24 4, 14 -6 c 10 -12, 0 -24, -14 -8 z" fill="#E88AB0" stroke="#3B2E22" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="-7" cy="8" r="3" fill="#E8C34A"/><circle cx="7" cy="8" r="3" fill="#E8C34A"/>
  <path d="M0 2 v 20 M0 2 l-5 -8 M0 2 l5 -8" class="thin"/>
</g>
<!-- the parrot, top right -->
<g transform="translate(206 60)">
  <path d="M0 0 c 14 -4, 24 10, 18 26 c -4 12, -16 18, -26 12 c -10 -8, -8 -32, 8 -38 z" fill="#D9534F" stroke="#3B2E22" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M4 10 c 6 -2, 10 2, 10 8 c 0 6, -6 10, -12 6 c -4 -4, -2 -12, 2 -14 z" fill="#6C9BD2" stroke="#3B2E22" stroke-width="2"/>
  <path d="M-4 8 l -10 4 l 10 4" fill="#E8C34A" stroke="#3B2E22" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="2" cy="6" r="2.2" fill="#3B2E22"/>
  <path d="M12 36 l -2 14 M18 34 l 4 12" class="thin"/>
  <path d="M8 30 c 10 10, 14 22, 10 34" fill="none" stroke="#8CC06A" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- the words, in a child's hand -->
<text x="130" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2E22" letter-spacing=".08em">Rod the frog</text>
</svg>
