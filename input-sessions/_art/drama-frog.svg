<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" role="img" aria-label="A child's crayon drawing of Nico the snail: a sad brown snail on a green hill, with a bird, a rabbit and a wizard's star behind him" font-family="Karla, system-ui, sans-serif">
<!-- Drawn 15 Oct 2026 for the Drama session, in a child's hand: Nico the
     snail, sad because slow is horrible, with the things from the story
     around him (the bird, the rabbit, the hill the wizard lives on top of).
     Made up for this session. -->
<defs>
  <style>
    .c{fill:none;stroke:#3B2E22;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .thin{fill:none;stroke:#3B2E22;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="260" height="300" fill="#FDFCF9"/>
<!-- the sun, a scribble -->
<circle cx="214" cy="46" r="18" fill="#E8C34A" stroke="#3B2E22" stroke-width="3"/>
<path d="M214 14 v8 M214 70 v8 M182 46 h8 M238 46 h8 M192 24 l6 6 M236 68 l-6 -6 M236 24 l-6 6 M192 68 l6 -6" class="thin"/>
<!-- the hill, with a wizard's star on top -->
<path d="M0 262 C 50 190, 130 150, 190 168 C 226 178, 248 204, 260 224 V300 H0 z" fill="#8CC06A" stroke="#3B2E22" stroke-width="3.2" stroke-linejoin="round"/>
<path d="M176 160 l5 -16 l5 16 l16 1 l-13 10 l5 16 l-13 -9 l-13 9 l5 -16 l-13 -10 z" fill="#E8C34A" stroke="#3B2E22" stroke-width="2.6" stroke-linejoin="round" transform="translate(-4 -34) scale(.9)"/>
<!-- the bird, top left -->
<g transform="translate(40 52)">
  <ellipse cx="0" cy="0" rx="20" ry="13" fill="#6C9BD2" stroke="#3B2E22" stroke-width="2.8"/>
  <path d="M-14 -4 c-14 -12 -24 -2 -22 8 c8 -2 14 -2 22 4 z" fill="#6C9BD2" stroke="#3B2E22" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="12" cy="-4" r="2.6" fill="#3B2E22"/>
  <path d="M20 -2 l12 3 l-12 4 z" fill="#E8C34A" stroke="#3B2E22" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M-4 12 l-2 10 M4 12 l2 10" class="thin"/>
</g>
<!-- the rabbit, top right of the hill -->
<g transform="translate(206 138)">
  <ellipse cx="0" cy="12" rx="18" ry="14" fill="#D9D3C7" stroke="#3B2E22" stroke-width="2.8"/>
  <circle cx="-2" cy="-8" r="11" fill="#D9D3C7" stroke="#3B2E22" stroke-width="2.8"/>
  <path d="M-8 -16 c-4 -16 0 -26 4 -26 c4 6 2 18 0 26 z" fill="#D9D3C7" stroke="#3B2E22" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M2 -17 c2 -16 8 -24 12 -22 c0 8 -2 18 -6 26 z" fill="#D9D3C7" stroke="#3B2E22" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="-5" cy="-8" r="2" fill="#3B2E22"/><circle cx="3" cy="-8" r="2" fill="#3B2E22"/>
  <path d="M-3 -3 l2 2 l2 -2" class="thin"/>
</g>
<!-- Nico: the shell, a brown spiral -->
<circle cx="112" cy="204" r="40" fill="#C99A5A" stroke="#3B2E22" stroke-width="3.6"/>
<path d="M112 204 m0 -4 a8 8 0 1 1 -9 6 a16 16 0 1 1 14 18 a26 26 0 1 1 -22 -34" class="c"/>
<!-- the body and the head -->
<path d="M70 242 c -18 -6 -34 -2 -42 4 c 4 10 24 10 44 8 c 40 4 94 4 112 -4 c 6 -8 -4 -16 -22 -16 z" fill="#E3C9A0" stroke="#3B2E22" stroke-width="3.4" stroke-linejoin="round"/>
<path d="M44 238 c -8 -12 -10 -24 -6 -34" class="c"/>
<!-- the feelers, droopy -->
<path d="M30 214 c -4 -10 -12 -14 -20 -12" class="c"/><circle cx="8" cy="202" r="4" fill="#E3C9A0" stroke="#3B2E22" stroke-width="2.4"/>
<path d="M42 210 c -2 -12 -8 -18 -16 -20" class="c"/><circle cx="24" cy="190" r="4" fill="#E3C9A0" stroke="#3B2E22" stroke-width="2.4"/>
<!-- a sad face and a tear -->
<circle cx="52" cy="232" r="3" fill="#3B2E22"/>
<path d="M44 244 c 6 -5 14 -5 20 0" class="thin"/>
<path d="M54 238 c 3 5 4 8 1 11 c -3 1 -6 -2 -5 -6 c 1 -2 2 -4 4 -5 z" fill="#6C9BD2" stroke="#3B2E22" stroke-width="1.6"/>
<!-- the words, in a child's hand -->
<text x="130" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#3B2E22" letter-spacing=".08em">Nico the snail</text>
</svg>
