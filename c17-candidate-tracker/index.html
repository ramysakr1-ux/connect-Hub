<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Tracker</title>
<meta name="description" content="C/17 2026 candidate tracker and marking record — International House Istanbul.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7fa; --paper:#ffffff; --ink:#1c2b3a; --sub:#5b6b7c; --line:#d9e2ec;
    --navy:#1F497D; --navy-deep:#163a63;
    --teal:#2a8c82; --teal-deep:#1f6f66;
    --shadow:0 10px 30px rgba(28,43,58,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;}
  .topbar{background:rgba(244,247,250,.96);border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:8px 14px;}
  .topbar .logo{height:36px;width:auto;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px 64px;}
  .card{background:var(--paper);border-radius:16px;padding:30px 30px 26px;box-shadow:var(--shadow);
    border:1px solid var(--line);border-left:6px solid var(--teal-deep);max-width:480px;width:100%;}
  .eyebrow{font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.68rem;
    color:var(--navy);margin:0 0 8px;}
  h1{font-weight:700;font-size:1.6rem;margin:0 0 .3em;color:var(--navy-deep);}
  p{margin:0 0 20px;color:var(--sub);font-size:.93rem;line-height:1.6;}
  a.go{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-weight:800;
    font-size:.92rem;background:var(--teal-deep);color:#fff;border-radius:999px;padding:11px 24px;
    box-shadow:0 6px 18px rgba(31,111,102,.28);transition:.15s;}
  a.go:hover{background:#18594f;box-shadow:0 8px 22px rgba(31,111,102,.34);transform:translateY(-1px);}
  a.go::before{content:'';width:9px;height:9px;border-radius:999px;background:#fff;opacity:.9;}
  .note{margin:18px 0 0;font-size:.8rem;}
</style>
</head>
<body>
<div class="topbar">
  <svg class="logo" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="International House Istanbul">
    <circle cx="30" cy="30" r="28" fill="#3B44B5"/>
    <text x="30" y="43" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-weight="800" font-size="34" fill="#fff">ih</text>
    <text x="68" y="22" font-family="Nunito,Arial,sans-serif" font-weight="800" font-size="17" fill="#111">International</text>
    <text x="68" y="40" font-family="Nunito,Arial,sans-serif" font-weight="800" font-size="17" fill="#111">House</text>
    <text x="68" y="56" font-family="Nunito,Arial,sans-serif" font-weight="600" font-size="14" fill="#333">Istanbul</text>
  </svg>
</div>
<main>
  <div class="card">
    <p class="eyebrow">CELTA C/17 2026</p>
    <h1>Candidate Tracker</h1>
    <p>Grades and main aims for every teaching practice, the four assignments, and Stages 2 and 3.</p>
    <a class="go" id="go" href="https://script.google.com/macros/s/AKfycbxJ2uJ0cx9NkUdQjo0jqO0VElJ-GR3r6vfICrsPrKTfZo4wlIxSW7WpQdoYmwgFAbdE/exec">Open the tracker</a>
    <p class="note">Opens in Google. You will be asked to sign in first.</p>
  </div>
</main>
<script>
  /* The tracker itself lives on script.google.com, which turns anyone not
     already signed in away to accounts.google.com -- so a link straight to it
     is titled "Sign in - Google Accounts" wherever it is pasted, and that is
     Google's page, not ours to rename. This page carries the name instead.
     The jump is in script on purpose: a crawler reads the title and stops,
     a person goes on through. */
  location.replace(document.getElementById('go').href);
</script>
</body>
</html>
