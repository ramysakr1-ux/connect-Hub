<!DOCTYPE html>
<!--
  Connect Lite — the owner console
  © 2026 Ramy Sakr. All rights reserved.

  Ramy's own screen, behind the owner key. Rewritten 25 Oct 2026 (Ramy, the night
  before: "I really don't like the new console. I just don't like the design ...
  we all need the important stuff in there"). What it is for, in order:

    1. The demo: the one course every card points at, and its four doors.
    2. Sending Lite to someone: the card, the film, or the price, as an email.
    3. The live courses: a real centre's, with its links and the message to send.
    4. Making a course.

  Everything else (earlier courses, old demos, the bin, the inbox, the film link,
  the rates, the transcription key) is still here, under the fold; the TP point
  library is one link, because it is not a course. What left: the
  statistics room, the film engine, the "three demos" machinery, the needs strip,
  the ticket book and the three other shapes a course card used to take.

  Not a course page: it does not load hub-sync; it talks to the store with the
  owner secret. The notebook look comes from hub-tokens.css and hub-house.css;
  the rules below are this page's own.
-->

<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:0 20px 70px;}
  .board{max-width:980px; margin:0 auto;}
  a{color:var(--a-forest, #1E3B2F);}

  .chrome{display:flex; align-items:center; justify-content:space-between; gap:24px; height:64px;}
  .lockup{display:flex; align-items:center; gap:9px;}
  .lockup .tile{width:30px; height:30px; border-radius:7px; background:var(--ink-warm);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .lockup .word{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:21px;
    line-height:0.85; letter-spacing:-0.012em; color:var(--gold);}
  .hub-pair{display:inline-flex; align-items:baseline; gap:4px;}
  .hub-word{font-family:'Instrument Sans','Karla',sans-serif; font-weight:600; font-size:8px;
    letter-spacing:0.24em; text-transform:uppercase; color:var(--ink); line-height:1; margin-left:1px;}
  .role{font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:600;
    letter-spacing:0.22em; text-transform:uppercase; color:var(--grey);}

  /* the page: a red eyebrow, a big serif, one line */
  .title{padding:22px 0 4px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .eyebrow{margin:0 0 4px; font-family:'Instrument Sans','Karla',sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.22em; text-transform:uppercase; color:var(--a-red, #7A2E2E);}
  .title h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:2.2rem; line-height:1.1;}
  .title p{margin:6px 0 0; font-size:0.92rem; color:var(--grey);}
  .title .acts{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}

  .btn{font-family:'Karla',sans-serif; font-size:0.84rem; font-weight:600; height:36px; padding:0 15px;
    border-radius:8px; border:0; background:var(--paper); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    box-shadow:var(--nb-shadow); text-decoration:none; white-space:nowrap;}
  .btn.primary{background:var(--a-forest, #1E3B2F); color:#F0EEE9; font-weight:700;}
  .btn.small{height:32px; font-size:0.8rem; padding:0 12px;}
  .btn.quiet{background:none; box-shadow:none; color:var(--grey); font-weight:600;}
  .btn.quiet:hover{color:var(--ink);}
  .btn.danger{color:var(--a-red, #7A2E2E);}
  .linkbtn{font-family:'Karla',sans-serif; font-size:0.84rem; font-weight:600; border:none; background:none;
    color:var(--a-forest, #1E3B2F); cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:3px;}

  /* a section: a small heading, then white cards */
  .sec{margin:30px 0 0;}
  .sec > h2{font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.25rem; margin:0 0 4px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .sec > h2 small{font-family:'Karla',sans-serif; font-weight:400; font-size:0.8rem; color:var(--grey);}
  .cards{display:flex; flex-direction:column; gap:12px; margin-top:12px;}
  .card{background:var(--paper); border-radius:14px; box-shadow:var(--nb-shadow); padding:18px 20px;}

  /* THE DEMO: a forest cover with the arcs ghosted in, its doors on the paper under it */

  .demo .cover{position:relative; overflow:hidden; background:var(--a-forest, #1E3B2F); color:#F0EEE9; padding:22px 24px 20px;

  .demo .cover svg.big{position:absolute; right:-90px; top:-60px; width:320px; height:auto; opacity:.12; pointer-events:none; transform:rotate(-8deg);}
  .demo .cover > *:not(.big){position:relative;}
  .demo .cover .eyebrow{color:rgba(240,238,233,.72); margin-bottom:6px;}
  .demo .cover h3{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.55rem; line-height:1.15; color:#fff;}

  .send details{margin-top:10px;}

  .send summary::-webkit-details-marker{display:none;}
  .send summary::before{content:'\25B8  '; color:var(--faint);}

  .send .note{font-size:0.78rem; color:var(--grey); margin:6px 0 0;}
  .send .acts{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:10px;}
  .send h3{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.1rem;}

  /* A LIVE COURSE: one row, the name and the centre, what you copy, then the facts */

  .facts .right{margin-left:auto; display:inline-flex; gap:10px; align-items:center;}

  .state.running{color:var(--a-forest, #1E3B2F);}
  .state.todo{color:var(--a-red, #7A2E2E);}

  .libline{margin:18px 4px 6px; font-size:0.92rem;}

  .more.up .menu{top:auto; bottom:100%; margin-bottom:6px;}

  .more .menu button{display:block; width:100%; text-align:left; font:600 .86rem/1.3 inherit; background:none; border:0; padding:10px 10px; border-radius:7px; cursor:pointer; color:var(--ink);}
  .more .menu button.danger{color:var(--a-red, #7A2E2E);}
  .more .menu button:hover{background:var(--a-stone, #EBEBF0);}

  /* make a course */
  .make{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px;}
  .make input{font:inherit; font-size:0.88rem; padding:8px 11px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:var(--ink); flex:1 1 220px;}

  .inrow.done{opacity:.5;}
  .inrow .body{flex:1 1 auto; min-width:0; font-size:0.9rem;}
  .inrow .meta{display:block; font-size:.76rem; color:var(--grey); margin-top:2px;}
  .inrow .iacts{display:flex; gap:6px; flex:0 0 auto;}
  .intag{font-size:.62rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:3px 8px; border-radius:7px; flex:0 0 auto; margin-top:3px; background:var(--a-stone, #EBEBF0); color:var(--grey);}
  .intag.wrong{background:var(--a-red, #7A2E2E); color:#fff;}
  .intag.set{background:var(--a-forest, #1E3B2F); color:#F0EEE9;}
  .setting{display:grid; grid-template-columns:180px 1fr; gap:8px 16px; align-items:center; padding:12px 0; border-top:1px solid var(--sand-line); font-size:0.88rem;}
  .setting:first-child{border-top:0;}
  .setting label{font-weight:700; font-size:0.82rem;}
  .setting .v{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .setting input{font:inherit; font-size:0.86rem; padding:7px 10px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:var(--ink);}
  .setting input.rate{width:110px;}
  .setting input.wide{flex:1 1 280px;}
  .setting .note{flex:1 1 100%; font-size:0.76rem; color:var(--grey);}
  .empty{padding:30px 4px; font-size:0.9rem; color:var(--grey); line-height:1.65;}
  .gate{max-width:560px; padding:14vh 0 0;}
  .gate h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.9rem; margin:0 0 10px;}
  .gate p{font-size:0.92rem; line-height:1.65; color:var(--grey); margin:0;}
  .gate input{font:inherit; font-size:0.9rem; padding:0 12px; height:36px; min-width:280px; flex:1; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:var(--ink);}
  #status{margin-top:14px; font-size:0.84rem; color:var(--grey); min-height:1.2em;}
  @keyframes wordmark-spin{0%,11.11%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
  .wordmark-spin{animation:wordmark-spin 90s linear infinite; transform-origin:50% 50%; transform-style:preserve-3d;}
  @media(prefers-reduced-motion:reduce){ .wordmark-spin{animation:none;} }

  /* reading a contributed set */
  .readback{position:fixed; inset:0; z-index:9500; background:rgba(28,26,22,.42); display:flex; align-items:flex-start; justify-content:center; padding:22px 16px; overflow:auto;}
  .readbox{background:var(--paper); border-radius:14px; width:min(880px,100%); padding:22px 24px 26px; box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .readbox h2{font-family:'Newsreader',Georgia,serif; font-size:1.45rem; margin:0 0 2px;}
  .readbox .by{color:var(--a-forest, #1E3B2F); font-weight:600; font-size:.88rem; margin:0 0 2px;}
  .readbox .ct{color:var(--grey); font-size:.8rem; margin:0 0 16px;}
  .rsess{border-top:1px solid var(--sand-line); padding:13px 0 2px;}
  .rsess .sh{font-size:.68rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--a-red, #7A2E2E); margin:0 0 6px;}
  .rslot{margin:0 0 15px;} .rslot .ty{font-size:.66rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; background:var(--a-stone, #EBEBF0); color:var(--grey); border-radius:7px; padding:3px 9px; margin-right:7px;}
  .rslot .aim{font-size:.92rem; margin:7px 0 2px;} .rslot .sub, .rslot .src{font-size:.8rem; color:var(--grey); margin:0;}
  .rstage{display:grid; grid-template-columns:34px 1fr; gap:9px; font-size:.84rem; padding:5px 0 5px 2px; border-top:1px dotted var(--sand-line);}
  .rstage .mn{color:var(--a-forest, #1E3B2F); font-weight:700; text-align:right;} .rstage .nm{font-weight:700;} .rstage .ia{color:var(--faint); font-weight:400; font-size:.76rem; margin-left:6px;}
  .rstage .av{color:var(--a-red, #7A2E2E); font-size:.8rem; display:block; margin-top:1px;} .readbox .bare{font-size:.82rem; color:var(--faint); margin:4px 0 0;}

  @media (max-width:760px){ .demo .doors{grid-template-columns:1fr 1fr;} .setting{grid-template-columns:1fr;} }
  @media (max-width:520px){ .demo .doors{grid-template-columns:1fr;} .title h1{font-size:1.8rem;} body{padding:0 14px 60px;} .card{padding:16px;} .row-course .acts .btn{flex:1 1 auto; justify-content:center;} }
</style>

<script>
/* The owner key rides in ?o= the first time and is kept in this browser after. */
const OWNER_STORE = 'hub:o';
let NEW_ID = '';
const params = new URLSearchParams(location.search);
try { if (params.get('o')) { localStorage.setItem(OWNER_STORE, params.get('o')); history.replaceState(null, '', location.pathname); } } catch (e) {}
function ownerKey(){ try { return localStorage.getItem(OWNER_STORE) || ''; } catch (e) { return ''; } }

const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const base = () => location.origin + location.pathname.replace(/[^/]*$/, '');
const call = body => HubStore.call(Object.assign({ owner: ownerKey() }, body));

/* A date, read as written: `created` is a timestamp, and reading it as an instant moves
   it a day east of the store. */
function niceDate(iso){
  const s = String(iso == null ? '' : iso), m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s);
  if (isNaN(d)) return '';
  try { return d.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }); } catch (e) { return ''; }
}
function shortDate(iso){ return niceDate(iso).replace(/ \d{4}$/, ''); }
function label(c){ if (c.courseName && c.centreName) return c.courseName + ' · ' + c.centreName; return c.courseName || c.centreName || c.name || c.id; }
function status(msg){ const s = $('status'); if (!s) return; s.textContent = msg || ''; if (/…$|\.\.\.$/.test(msg || '') && window.hubSpinner) s.insertAdjacentHTML('afterbegin', hubSpinner(16) + ' '); }

/* ---- what is kept in this browser: the film, the rates, the letters, the card's look ---- */
const FILM_KEY = 'chub:filmlink', RATES_KEY = 'chub:rates', CARD_CC_KEY = 'chub:cardCopyTo', CARD_KIND_KEY = 'chub:cardKind', CARD_STYLE_KEY = 'chub:cardStyle', NOTE_KEY = 'chub:demoNote', URLS_KEY = 'hub:o:urls';
const RATE_ROWS = [['one', 1, 'One course'], ['five', 5, 'Five courses'], ['ten', 10, 'Ten courses'], ['twenty', 20, 'Twenty courses']];
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
function ratesSaved(){ try { return JSON.parse(ls.get(RATES_KEY)) || {}; } catch (e) { return {}; } }
function rateNum(v){ const n = Number(String(v == null ? '' : v).replace(/[^0-9.]/g, '')); return n > 0 ? n : 0; }
/* all four, or none: a price email with a gap in its table is worse than the console saying so */
function ratesList(){ const r = ratesSaved(); const list = RATE_ROWS.map(([k, n, label]) => ({ label, n, total: rateNum(r[k]) })); return list.every(x => x.total > 0) ? list : null; }
function filmLink(){ let v = (ls.get(FILM_KEY) || '').trim(); if (/\/film\/(connect-lite-film\.(webm|mp4)|watch\.html)$/i.test(v)) { v = v.replace(/\/film\/(connect-lite-film\.(webm|mp4)|watch\.html)$/i, '/film/course-journey.html'); ls.set(FILM_KEY, v); } return v; }
function cardKind(){ const v = ls.get(CARD_KIND_KEY); return (v === 'film' || v === 'price') ? v : ''; }
function cardStyle(){ return ls.get(CARD_STYLE_KEY) === 'ticket' ? 'ticket' : 'welcome'; }
function cardCopyTo(){ return (ls.get(CARD_CC_KEY) || '').trim(); }
let SHOW_URLS = ls.get(URLS_KEY) === '1';

/* THE LETTERS, one per card (Ramy, 3 Oct 2026). His, typed over and kept in this browser. */
const DEFAULT_NOTES = {
  '': [
    'Hello,',
    '',
    'I’m a CELTA tutor, and I built Connect Lite to run a course from one place: the timetable, the TP points, plans and feedback, the assignments, the CELTA 5, the assessor’s pack and the volunteer students.',
    '',
    'Below is a real course, three weeks in. Open it as a tutor, as one of the trainees, as the assessor, or as a volunteer student, and type. Nothing you do there reaches anyone’s record. Five minutes in the tutor’s view will tell you more than I can here.',
    '',
    'If it looks like something your centre could use, just reply.',
  ].join('\n'),
  film: [
    'Hello,',

/* ---- what a row on this console IS ---- */
function courseKind(c){
  if (c.deleted) return 'bin';
  const n = String(c.name || ''), cn = String(c.courseName || '');
  if (/scratch/i.test(n)) return 'scratch';
  if (/tp point library/i.test(n) || /tp point library/i.test(cn)) return 'library';
  if (/grades/i.test(cn) || /grades/i.test(n)) return 'grades';
  if (c.demoToday || /^Demo —|^Finished course/.test(n)) return 'demo';
  return 'live';
}
/* THE demo: the one every card points at. The mid-course demo by name; failing that, the newest demo. */
function theDemo(){
  const demos = COURSES.filter(c => courseKind(c) === 'demo');
  return demos.find(c => /mid-course/i.test(String(c.name || ''))) || demos.slice().sort((a, b) => String(b.created || '').localeCompare(String(a.created || '')))[0] || null;
}
const TODAY = () => new Date().toISOString().slice(0, 10);
function courseState(c){
  if (c.id === NEW_ID) return ['new', 'New'];
  if (!c.trainees) return ['todo', 'No trainees yet'];
  if (!c.start || !c.end) return ['todo', 'No dates yet'];
  const t = TODAY();
  if (c.start <= t && t <= c.end) return ['running', 'Running'];
  if (t < c.start) return ['', 'Starts ' + shortDate(c.start)];
  return ['', 'Finished ' + shortDate(c.end)];
}

/* ---- the four doors into a course: the tutor's, a trainee's, the assessor's, a volunteer's ---- */
const DOORS = {};
async function doorsFor(c){
  if (DOORS[c.id]) return DOORS[c.id];
  const inv = (p, v) => base() + 'invite.html?' + p + '=' + encodeURIComponent(v);
  const out = { tutor: inv('k', c.tutorKey), assessor: c.assessorKey ? inv('ak', c.assessorKey) : '', trainee: '', volunteer: '', traineeName: '', volunteerName: '' };
  try {
    const r = await HubStore.call({ op: 'roster', key: c.tutorKey });
    const list = Object.values((r && r.trainees) || {}).sort((a, b) => String(a.name).localeCompare(String(b.name)));
    if (list.length) { out.trainee = inv('t', list[0].token); out.traineeName = list[0].name; }
  } catch (e) {}
  try {
    const cr = await HubStore.call({ op: 'course', key: c.tutorKey });
    const st = ((cr && cr.volunteers) || {}).students || [];
    const first = st.filter(s => s && s.token)[0];
    if (first) { out.volunteer = inv('v', first.token); out.volunteerName = first.name; }
  } catch (e) {}
  DOORS[c.id] = out;
  return out;
}

async function fillDoors(c){
  const k = await doorsFor(c);
  const t = document.querySelector(`[data-door="trainee"][data-id="${c.id}"]`), v = document.querySelector(`[data-door="volunteer"][data-id="${c.id}"]`);

async function fillMaterials(){
  for (const line of [...document.querySelectorAll('[data-mats]')]) {
    const id = line.dataset.mats;
    try {
      const info = await call({ op: 'materials', course: id });
      if (!info || !info.exists || !info.files) { line.textContent = ''; continue; }
      const mb = info.bytes >= 1048576 ? (info.bytes / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(info.bytes / 1024)) + ' KB';
      line.innerHTML = info.files + ' file' + (info.files === 1 ? '' : 's') + ' on Drive · ' + mb + (info.url ? ' <a class="linkbtn" href="' + esc(info.url) + '" target="_blank" rel="noopener">Open</a>' : '') + ' <button class="linkbtn" type="button" data-purge="' + esc(id) + '" data-files="' + info.files + '">Empty</button>';
    } catch (e) { line.textContent = ''; }
  }
}

async function inbox(){ try { INBOX = await call({ op: 'inbox' }); } catch (e) { INBOX = { contributions: [], reports: [] }; } drawInbox(); }
function drawInbox(){
  const box = $('inboxBox'), small = $('inboxSmall'); if (!box || !INBOX) return;
  const C = INBOX.contributions || [], R = INBOX.reports || [];
  const fresh = x => String(x.state || 'new') !== 'done';
  const nC = C.filter(fresh).length, nR = R.filter(fresh).length;
  if (small) small.innerHTML = (nC || nR) ? `<span class="count">${nC + nR}</span> ${[nC ? nC + ' set' + (nC === 1 ? '' : 's') + ' offered' : '', nR ? nR + ' thing' + (nR === 1 ? '' : 's') + ' said' : ''].filter(Boolean).join(', ')}` : 'nothing waiting';
  const CAP = 5, showC = INBOX_ALL ? C : C.slice(0, CAP), showR = INBOX_ALL ? R : R.slice(0, CAP), hidden = (C.length - showC.length) + (R.length - showR.length);
  const when = at => String(at || '').slice(0, 16).replace('T', ' ');
  const row = (sheet, at, tag, cls, head, meta, state) => `<div class="inrow${state === 'done' ? ' done' : ''}"><span class="intag ${cls}">${esc(tag)}</span><div class="body">${head}<small class="meta">${esc(meta)}</small></div><div class="iacts">
      ${sheet === 'contributions' ? `<button type="button" class="btn small" data-read="${esc(at)}">Read it</button>` : ''}${state === 'done' ? '' : `<button type="button" class="btn small" data-in="done|${esc(sheet)}|${esc(at)}">Done</button>`}<button type="button" class="btn small quiet" data-in="drop|${esc(sheet)}|${esc(at)}">Delete</button></div></div>`;
  box.innerHTML = (!showC.length && !showR.length) ? `<p class="empty" style="padding:6px 0">Nothing yet: no sets offered and nothing said.${INBOX.sheet ? ` <a href="${esc(INBOX.sheet)}" target="_blank" rel="noopener">The sheet behind the store</a> has every row.` : ''}</p>`
    : showC.map(c => row('contributions', c.at, 'set', 'set', `<b>${esc(c.book || 'Untitled')}</b> — contributed by <b>${esc(c.by || '')}</b>` + (c.file ? ` · <a href="${esc(c.file)}" target="_blank" rel="noopener">the file</a>` : ''), [c.level, (c.lessons || 0) + ' lessons', (c.stages || 0) + ' stages', c.centre, when(c.at)].filter(Boolean).join(' · '), c.state)).join('')
      + showR.map(x => row('reports', x.at, x.kind === 'wrong' ? 'wrong' : 'idea', x.kind === 'wrong' ? 'wrong' : 'idea', esc(x.text || ''), [x.page, x.where, x.role, x.course, when(x.at)].filter(Boolean).join(' · '), x.state)).join('')
      + (hidden ? `<p style="margin:10px 0 0"><button type="button" class="linkbtn" id="inmore">Show the other ${hidden}</button></p>` : (INBOX_ALL && (C.length + R.length) > CAP ? '<p style="margin:10px 0 0"><button type="button" class="linkbtn" id="inless">Show fewer</button></p>' : ''))
      + (INBOX.sheet ? `<p style="margin:10px 0 0; font-size:.76rem; color:var(--grey)"><a href="${esc(INBOX.sheet)}" target="_blank" rel="noopener">The sheet behind the store</a> has every row.</p>` : '');
  const more = $('inmore'); if (more) more.onclick = () => { INBOX_ALL = true; drawInbox(); };
  const less = $('inless'); if (less) less.onclick = () => { INBOX_ALL = false; drawInbox(); };
  box.querySelectorAll('[data-read]').forEach(b => b.onclick = async () => {
    const r = (INBOX.contributions || []).find(c => String(c.at) === b.dataset.read);
    if (!r || !r.file) { alert('That row has no file on it.'); return; }
    b.disabled = true; b.textContent = 'Opening…';
    try { showSet(await call({ op: 'readContribution', file: r.file }), r); } catch (e) { alert(e.message || e); }
    b.disabled = false; b.textContent = 'Read it';
  });
  box.querySelectorAll('[data-in]').forEach(b => b.onclick = async () => {
    const [what, sheet, at] = b.dataset.in.split('|');
    if (what === 'drop' && !confirm('Delete this row? It does not come back.')) return;
    b.disabled = true;
    try { await call({ op: 'inboxRow', sheet, at, drop: what === 'drop' ? true : undefined, state: what === 'done' ? 'done' : undefined }); await inbox(); }
    catch (e) { b.disabled = false; alert(e.message || e); }
  });
}
/* the set itself, not the file (5 Oct 2026) */
function showSet(got, row){
  const S = (got && got.set) || {}; const ids = Object.keys(S.sessions || {}).sort();
  let slots = 0, stages = 0; ids.forEach(k => (S.sessions[k].slots || []).forEach(sl => { if (sl.type || sl.aim) slots++; stages += (sl.stages || []).length; }));
  const stage = st => `<div class="rstage"><span class="mn">${st.minutes || ''}</span><span><span class="nm">${esc(st.name || '')}</span>${st.interaction ? `<span class="ia">${esc(st.interaction)}</span>` : ''}${st.todo ? '<br>' + esc(st.todo) : ''}${st.avoid ? `<span class="av">watch: ${esc(st.avoid)}</span>` : ''}</span></div>`;
  const slot = (sl, i) => `<div class="rslot"><span class="ty">${esc(sl.type || 'no type')}</span><b>Lesson ${i + 1}</b>${sl.shape ? ` <small style="color:var(--grey)">${esc(sl.shape)}</small>` : ''}<p class="aim">${esc(sl.aim || '')}</p>${sl.sub ? `<p class="sub">Sub aim: ${esc(sl.sub)}</p>` : ''}${sl.pages ? `<p class="src">${esc(sl.pages)}</p>` : ''}${(sl.stages || []).length ? (sl.stages || []).map(stage).join('') : '<p class="bare">No stages — the trainee writes them.</p>'}</div>`;
  const back = document.createElement('div'); back.className = 'readback';
  back.innerHTML = `<div class="readbox"><h2>${esc(S.book || 'Untitled set')}</h2><p class="by">Contributed by ${esc(S.by || (row && row.by) || '')}</p><p class="ct">${esc(S.level || '')} · ${slots} lessons · ${stages} stages · ${esc(String(S.minutes || 45))} minutes a slot${got.name ? ' · ' + esc(got.name) : ''}</p>
    ${ids.map(k => `<section class="rsess"><p class="sh">TP ${esc(k)}${S.sessions[k].context ? ' — ' + esc(S.sessions[k].context) : ''}</p>${(S.sessions[k].slots || []).map(slot).join('')}</section>`).join('')}
    <div style="margin-top:16px; display:flex; gap:10px"><button type="button" class="btn" id="readclose">Close</button>${row && row.file ? `<a class="btn quiet" href="${esc(row.file)}" target="_blank" rel="noopener">The file in Drive</a>` : ''}</div></div>`;
  document.body.appendChild(back);
  const shut = () => back.remove();
  back.onclick = e => { if (e.target === back) shut(); }; back.querySelector('#readclose').onclick = shut;
  document.addEventListener('keydown', function off(e){ if (e.key === 'Escape') { shut(); document.removeEventListener('keydown', off); } });
}
async function feedbackLine(){
  const el = $('fbline'); if (!el) return;
  try { const r = await call({ op: 'feedbackSummary' }); const w = (r && r.week) || { up: 0, down: 0, comments: 0 };
    el.innerHTML = `<span>This week: <b>${w.up}</b> 👍 · <b>${w.down}</b> 👎 · <b>${w.comments}</b> comment${w.comments === 1 ? '' : 's'}${r.total ? ' · ' + r.total + ' in all' : ''}.</span>` + ((r.latest || []).length ? '<span class="note">' + r.latest.slice(0, 3).map(x => (x.thumb === 'up' ? '👍 ' : '👎 ') + esc(x.text) + ' <i>' + esc([x.page, x.role].filter(Boolean).join(' · ')) + '</i>').join('<br>') + '</span>' : '');
  } catch (e) { el.textContent = ''; }
}
function txState(){
  const st = $('txState'); if (!st) return;
  call({ op: 'transcriptionOn' }).then(r => { st.textContent = r && r.on ? 'on' : 'off'; st.className = 'state ' + (r && r.on ? 'running' : ''); }, () => { st.textContent = 'could not check'; });
}

/* ---- the centre book: the number fills the name ---- */
var CENTRES = {};
function centreNumberTyped(){ const el = $('mkNumber'); if (!el) return ''; const v = el.value.trim().toUpperCase().replace(/\s+/g, ''); return /^([A-Z]{2})?\d{3,5}[A-Z]?$/.test(v) ? v : ''; }
function centreBookLoad(){ call({ op: 'centres' }).then(r => { CENTRES = (r && r.centres) || {}; centreBookFill(); }, () => {}); }
function centreBookFill(){
  const num = centreNumberTyped(), nameEl = $('mkName'), note = $('mkNote'), go = $('makeGo'); if (go) go.disabled = !num;
  if (!note) return;
  if (!num) { note.textContent = 'Only a course with a real centre number gets made, and the centre cannot edit it afterwards.'; return; }
  const known = CENTRES[num];
  if (known) { if (nameEl && (!nameEl.value.trim() || nameEl.dataset.filled === '1')) { nameEl.value = known; nameEl.dataset.filled = '1'; } note.textContent = num + ' is ' + known + '. Type over the name to correct it.'; }
  else { if (nameEl && nameEl.dataset.filled === '1') { nameEl.value = ''; delete nameEl.dataset.filled; } note.textContent = 'Connect has not sold to ' + num + ' before. Type the centre’s name; if you expected it to be known, check the number.'; }
}

/* ---- the gate ---- */
function gate(msg){
  $('app').innerHTML = `<div class="gate"><h1>This is the owner console</h1>
    <p>Paste your owner key below, and this browser will remember it. To find it: open the store in the Apps Script editor, choose <b>ownerKey</b> in the function list, press <b>Run</b>, and it prints a link; opening that link also works.</p>
    <div style="display:flex; gap:9px; margin-top:16px; flex-wrap:wrap;"><input id="ownerIn" type="text" placeholder="Your owner key" autocomplete="off" spellcheck="false"><button class="btn primary" id="ownerGo" type="button">Open the console</button></div>
    <p id="status"></p></div>`;
  if (msg) status(msg);
  const go = () => { const raw = $('ownerIn').value.trim(); const key = (raw.match(/[?&]o=([^&\s]+)/) || [])[1] || raw; if (!key) { status('Paste the key, or the whole link.'); return; } ls.set(OWNER_STORE, decodeURIComponent(key)); status('Opening…'); load(); };
  $('ownerGo').addEventListener('click', go); $('ownerIn').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

/* ---- the handlers, bound once ---- */
document.addEventListener('input', e => {
  const t = e.target; if (!t || !t.closest) return;
  if (t.id === 'mkNumber') centreBookFill();
  if (t.id === 'mkName') delete t.dataset.filled;
  if (t.id === 'filmLink') ls.set(FILM_KEY, t.value.trim());
  if (t.id === 'demoNote') ls.set(noteKey(), t.value);
  if (t.id === 'cardCopyTo') ls.set(CARD_CC_KEY, t.value.trim());
  if (t.id === 'cardStyleSel') ls.set(CARD_STYLE_KEY, t.value);
  if (t.id === 'cardKind') { ls.set(CARD_KIND_KEY, t.value); const n = $('demoNote'); if (n) n.value = demoNote(); }
  const rt = t.closest('[data-rate]'); if (rt) { const r = ratesSaved(); r[rt.dataset.rate] = rt.value.trim(); ls.set(RATES_KEY, JSON.stringify(r)); }
});
document.addEventListener('click', e => {
  const tog = e.target.closest && e.target.closest('.moretog');
  document.querySelectorAll('.more.on').forEach(m => { if (!tog || m !== tog.parentElement) m.classList.remove('on'); });
  document.querySelectorAll('.menu-open').forEach(x => x.classList.remove('menu-open'));
  if (tog) { const m = tog.parentElement; m.classList.toggle('on'); m.classList.remove('up');
    if (m.classList.contains('on')) { const c = m.closest('.card'); if (c) c.classList.add('menu-open'); const r = m.querySelector('.menu').getBoundingClientRect(); if (r.bottom > window.innerHeight - 8) m.classList.add('up'); }
    e.stopPropagation(); }
});
$('app').addEventListener('click', async e => {
  const T = sel => e.target.closest(sel);
  if (T('#toggleUrls')) { SHOW_URLS = !SHOW_URLS; ls.set(URLS_KEY, SHOW_URLS ? '1' : '0'); render(COURSES); return; }
  if (T('#retryBtn')) { load(); return; }
  if (T('#otherKeyBtn')) { ls.del(OWNER_STORE); gate(); return; }
  if (T('#makeBtn')) { const row = $('makeRow'); row.hidden = !row.hidden; if (!row.hidden) $('mkNumber').focus(); return; }
  if (T('#makeCancel')) { $('makeRow').hidden = true; return; }
  const make = T('#makeGo');
  if (make) {
    if (BUSY) return;
    const centreNumber = centreNumberTyped(); if (!centreNumber) { status('Type the Cambridge centre number first.'); return; }
    const centreName = $('mkName').value.trim();
    BUSY = true; make.disabled = true; status('Making the course…');
    try { const made = await call({ op: 'createCourse', centreNumber, centreName }); if (made && made.centres) CENTRES = made.centres; NEW_ID = made.id;
      render(made.courses, 'Made ' + made.id + ' for ' + centreNumber + '. Copy its tutor link, or send the message to the centre.'); const card = $('course-' + made.id); if (card) hubScrollIntoView(card, 'start');
    } catch (err) { status(err.message); make.disabled = false; }
    BUSY = false; return;
  }
  if (T('#txSave')) { const b = T('#txSave'), key = $('txKey'), note = $('txNote'); b.disabled = true; note.textContent = 'Saving…';
    try { const r = await call({ op: 'setOpenAiKey', key: key.value.trim() }); key.value = ''; note.textContent = r && r.on ? 'Saved. Transcripts are on.' : 'Transcripts are off.'; txState(); } catch (err) { note.textContent = err.message || String(err); }
    b.disabled = false; return; }
  if (T('#noteReset')) { ls.del(noteKey()); const n = $('demoNote'); if (n) n.value = demoNote(); status('The standard letter is back.'); return; }
  if ((T('#cardPreview') || T('#cardCopy') || T('#cardSend')) && cardKind() === 'price' && !ratesList()) { status('Type the four rates first, under Settings.'); const d = $('foldSettings'); if (d) d.open = true; const f = document.querySelector('[data-rate]'); if (f) f.focus(); return; }
  if (T('#cardPreview')) { const u = URL.createObjectURL(new Blob([await cardHtml()], { type: 'text/html' })); window.open(u, '_blank', 'noopener'); setTimeout(() => URL.revokeObjectURL(u), 60000); return; }
  if (T('#cardCopy')) { const b = T('#cardCopy'), was = b.textContent;
    try { await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([await cardHtml()], { type: 'text/html' }), 'text/plain': new Blob([demoNote()], { type: 'text/plain' }) })]); b.textContent = 'Copied — paste it into a new message'; }
    catch (err) { b.textContent = 'Could not copy — use Preview and copy from there'; }
    setTimeout(() => { b.textContent = was; }, 2600); return; }
  if (T('#cardSend')) { const b = T('#cardSend'), to = ($('cardTo').value || '').trim(), cc = ($('cardCopyTo') ? $('cardCopyTo').value : '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) { status('Type the address the card goes to.'); $('cardTo').focus(); return; }
    b.disabled = true; b.textContent = 'Sending…'; status('');
    try { const r = await HubStore.call({ op: 'sendCard', owner: ownerKey(), to, copy: cc, subject: cardSubject(), html: await cardHtml(), text: demoNote() }); status('Sent to ' + to + ' from ' + (r && r.from || 'the store') + (cc ? ', with a copy to ' + cc : '') + '.'); $('cardTo').value = ''; }
    catch (err) { status('Not sent: ' + (err && err.message || err)); }
    b.disabled = false; b.textContent = 'Send'; return; }
  const note = T('[data-note]');
  if (note) { const c = COURSES.find(x => x.id === note.dataset.note); if (c) await hubCopyButton(note, note.dataset.what === 'tutor' ? tutorNoteFor(c) : await noteFor(c)); return; }
  const card = T('[data-card]');
  if (card) { e.preventDefault(); const c = COURSES.find(x => x.id === card.dataset.card); if (c) window.open(cardLink(c), '_blank', 'noopener'); return; }
  const mail = T('[data-mail]');
  if (mail) { e.preventDefault(); const c = COURSES.find(x => x.id === mail.dataset.mail); if (!c) return; const tutor = mail.dataset.what === 'tutor';
    location.href = 'mailto:?subject=' + encodeURIComponent(tutor ? tutorSubject(c) : 'Connect Lite — ' + (c.courseName || c.name || c.id)) + '&body=' + encodeURIComponent(tutor ? tutorNoteFor(c) : await noteFor(c)); return; }
  const v = T('[data-vol]');
  if (v) { const was = v.textContent; v.textContent = 'Finding…'; v.disabled = true;
    try { const c = await HubStore.call({ op: 'course', key: v.dataset.key }); const first = (((c && c.volunteers) || {}).students || []).filter(x => x && x.token)[0];
      if (!first) { v.textContent = 'None yet: nothing copied'; v.disabled = false; return; }
      v.disabled = false; v.textContent = was; await hubCopyButton(v, base() + 'invite.html?v=' + encodeURIComponent(first.token)); }
    catch (err) { v.textContent = 'Could not reach the course'; v.disabled = false; setTimeout(() => { v.textContent = was; }, 2600); }
    return; }
  const b = T('[data-copy]');
  if (b) { await hubCopyButton(b, b.dataset.copy); return; }
  const pg = T('[data-purge]');
  if (pg) { if (BUSY) return; const files = Number(pg.dataset.files) || 0;
    const typed = await confirmModal(`Empty the materials for ${pg.dataset.purge}? ${files} file${files === 1 ? '' : 's'} go to Drive’s trash, where Drive keeps them for 30 days. The plans that name them will point at nothing.`, 'Empty the materials', { type: pg.dataset.purge, hint: `Type ${pg.dataset.purge} to empty its materials` });
    if (!typed) return; BUSY = true; status('Emptying materials for ' + pg.dataset.purge + '…');
    try { const r = await call({ op: 'purgeMaterials', course: pg.dataset.purge, confirm: typed }); const t = r.trashed || {}; render(r.courses, `Emptied ${r.emptied} — ${t.files || 0} file${t.files === 1 ? '' : 's'} to Drive’s trash.`); } catch (err) { status(err.message); }
    BUSY = false; return; }
  const cl = T('[data-clone]');
  if (cl) { if (BUSY) return;
    const ok = await confirmModal(`Start the next course from ${cl.dataset.label}? The centre’s settings, logo, tutors, standing instructions, shared links, assignment wording and observation sheets carry over. Dates, the assessment date, the roster and every record start fresh, and the new course gets its own tutor and assessor links.`, 'Start the next course');
    if (!ok) return; BUSY = true; status('Starting the next course from ' + cl.dataset.label + '…');
    try { const made = await call({ op: 'cloneCourse', from: cl.dataset.clone }); NEW_ID = made.id; render(made.courses, 'Made ' + made.id + ' from ' + cl.dataset.label + '. Open its Course admin, set the dates, then send the tutor link to the centre.'); const card = $('course-' + made.id); if (card) hubScrollIntoView(card, 'start'); } catch (err) { status(err.message); }
    BUSY = false; return; }
  const d = T('[data-delete]');
  if (d) { if (BUSY) return; const n = Number(d.dataset.trainees || 0);
    const carries = n ? `Its ${n} trainee${n === 1 ? '' : 's'} and every plan, self-evaluation, feedback and assignment on it go with it.` : 'It has no trainees; anything recorded on it goes with it.';
    const typed = await confirmModal(`Delete ${d.dataset.label}? ${carries} Its tutor and assessor links stop working now. It sits in the bin for 30 days, where you can put it back; after that it is gone for good.`, 'Delete the course', { type: d.dataset.delete, hint: `Type ${d.dataset.delete} to delete this course` });
    if (!typed) return; BUSY = true; status('Deleting ' + d.dataset.label + '…');
    try { const r = await call({ op: 'deleteCourse', course: d.dataset.delete, confirm: typed }); render(r.courses, `${r.deleted} is in the bin. Its links are off; it goes for good on ${niceDate(r.until)}. Put it back from The bin until then.`); } catch (err) { status(err.message); }
    BUSY = false; return; }
  const u = T('[data-undelete]');
  if (u) { if (BUSY) return; BUSY = true; status('Putting ' + u.dataset.label + ' back…');
    try { const r = await call({ op: 'undeleteCourse', course: u.dataset.undelete }); render(r.courses, `${r.restored} is back, with its links working again.`); } catch (err) { status(err.message); }
    BUSY = false; }
});

async function load(msg){
  if (!ownerKey()) { gate(); return; }
  try { const r = await call({ op: 'ownerCourses' }); render(r.courses || [], msg); inbox(); centreBookLoad(); }
  catch (err) {
    if (/not yours/i.test(err.message)) { ls.del(OWNER_STORE); gate('That key was not recognised — check you copied all of it.'); return; }
    $('app').innerHTML = `<div class="empty">${esc(err.message)} <button class="btn small" id="retryBtn" type="button" style="margin-left:8px;">Try again</button> <button class="btn small" id="otherKeyBtn" type="button" style="margin-left:8px;">Use a different key</button></div>`;
  }
}
load();
</script>
</body>
