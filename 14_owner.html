<!DOCTYPE html>
<!--
  Connect Lite — owner console
  © 2026 Ramy Sakr. All rights reserved.

  Ramy's own screen, behind the owner key: mint a course, and copy the two
  links that go to the centre. It is NOT a course page, so it does not load
  hub-sync (which would send it to the "open your course link" gate); it talks
  to the store directly with the owner secret.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Connect Lite — Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202610071747">
<style>
  :root{
    /* the pane -- the same four values the trainee landing's cards use */
    --card-top:oklch(97.6% 0.012 86); --card-edge:oklch(99.4% 0.005 90);
    --shade-near:oklch(58% 0.03 70 / 0.11); --shade-far:oklch(58% 0.03 70 / 0.09);
    --sand-line-deep:oklch(78% 0.018 80);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:0 20px 90px;}
  .board{max-width:1000px; margin:0 auto;}
  a{color:var(--teal);}

  .chrome{display:flex; align-items:center; justify-content:space-between; gap:24px; height:64px;}
  .lockup{display:flex; align-items:center; gap:9px;}
  .lockup .tile{width:30px; height:30px; border-radius:7px; background:var(--ink-warm);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .lockup .word{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:21px;
    line-height:0.85; letter-spacing:-0.012em; color:var(--gold);}
  .hub-pair{display:inline-flex; align-items:baseline; gap:4px;}
  .hub-word{font-family:'Instrument Sans','Karla',sans-serif; font-weight:500; font-size:9px;
    letter-spacing:0.24em; text-transform:uppercase; color:var(--ink); line-height:1; margin-left:1px;}
  .role{font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:600;
    letter-spacing:0.22em; text-transform:uppercase; color:var(--grey);}

  .title{border-top:2px solid var(--teal); padding-top:26px; display:flex; align-items:flex-end;
    justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .title h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:2.1rem; line-height:1.15;}
  .title p{margin:7px 0 0; font-size:0.9rem; color:var(--grey); line-height:1.6; max-width:620px;}

  .btn{font-family:'Karla',sans-serif; font-size:0.82rem; font-weight:600; height:34px; padding:0 15px;
    border-radius:6px; border:1.5px solid var(--sand-line); background:var(--box); color:var(--ink);
    cursor:pointer; display:inline-flex; align-items:center; transition:border-color .15s,color .15s,opacity .15s;}
  .btn.primary{background:var(--teal); border-color:var(--teal); color:var(--paper); font-weight:700;}
  .btn.small{height:28px; font-size:0.76rem; padding:0 11px;}
  .btn.quiet{border:none; background:none; color:var(--grey); font-weight:500;}
  .btn.quiet:hover{color:var(--brick);}

  /* ---- a course is a thing, not a row -------------------------------------
     Ramy, 26 Sep 2026: "it kind of looks pretty basic." It was three identical
     tinted panels with two link rows each. A course is now a pane -- the
     trainee landing's card, with the face that lightens toward the top, the
     hairline where the top edge catches, the two shadows, and the 3px lift
     under the mouse -- and it reads in one glance: the name, the centre, the
     numbers as chips, and the two links as two different doors. The tutor
     link is THE action on this screen (it is the one you send), so it wears
     teal; the assessor link is the quiet one. */
  .courses{display:flex; flex-direction:column; gap:14px; margin-top:24px;}
  .fbline{margin-top:34px; padding-top:18px; border-top:1px solid var(--sand-line);}
  .fbline h2{font-family:'Newsreader',Georgia,serif; font-size:1.3rem; margin:0 0 6px;}
  .fbline ul{margin:10px 0 0; padding-left:18px; font-size:0.9rem; line-height:1.5;}
  .fbline li small{color:var(--grey); margin-left:6px;}
  /* The two piles the people using Lite put there. A contribution is work
     somebody did for the library, so it leads; a report is a line, so it is a
     line. 5 Oct 2026. */
  .inbox{margin-top:34px; padding-top:18px; border-top:1px solid var(--sand-line);}
  .inbox h2{font-family:'Newsreader',Georgia,serif; font-size:1.3rem; margin:0 0 6px;}
  .inbox .lede{margin:0 0 13px;}
  .inrow{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--sand-line);}
  .inrow:first-of-type{border-top:0;}
  .inrow.done{opacity:.52;}
  .inrow .body{flex:1 1 auto; min-width:0;}
  .inrow b{font-weight:700;}
  .inrow .meta{display:block; font-size:.78rem; color:var(--grey); margin-top:2px;}
  .inrow .acts{display:flex; gap:6px; flex:0 0 auto;}
  .inrow .acts .btn{padding:4px 10px; font-size:.76rem;}
  .intag{font-size:.64rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    padding:3px 8px; border-radius:999px; flex:0 0 auto; margin-top:2px;}
  .intag.wrong{background:var(--garnet-pale,#f6e7e7); color:var(--garnet,#8a2f3a);}
  .intag.idea{background:var(--box); color:var(--grey);}
  .intag.set{background:var(--teal-pale,#e3efed); color:var(--teal);}
  .inempty{font-size:.9rem; color:var(--grey); margin:0;}
  /* WHAT NEEDS YOU, at the top. Ramy, 5 Oct 2026: "if we have like 20 courses
     running it'd be a lot of scrolling up and down to find out which course if
     there's something I need to do." So the console opens on the work, and the
     machinery for sending Lite to people folds away under it. */
  .needs{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px;
    margin:0 0 18px; padding:11px 15px; border-radius:10px;
    background:var(--box); border:1px solid var(--sand-line);}
  .needs b{font-size:.68rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--gold-deep); margin-right:3px;}
  .needs button{font:600 .86rem/1.35 inherit; background:none; border:0; padding:0; cursor:pointer;
    color:var(--teal); text-decoration:underline; text-underline-offset:3px;}
  .needs button:hover{color:var(--ink);}
  .needs .sep{color:var(--faint);}
  .needs.clear{background:none; border-color:transparent; padding-left:0; color:var(--grey); font-size:.86rem;}
  .needs.clear b{color:var(--grey);}
  /* FOLDED IT IS ONE LINE; OPEN IT IS A ROOM. Ramy, 5 Oct 2026: "it kind of
     opens this borderless frameless kind of drop down and it's just too washed
     out ... I also have to look at it." So open, the block tints, and the three
     jobs inside become cards with their own names on them. */
  .sending{margin:0 0 18px; border:1px solid var(--sand-line); border-radius:11px;
    background:var(--surface); overflow:hidden;}
  .sending > summary{cursor:pointer; padding:12px 16px; font-weight:700; font-size:.92rem; list-style:none;}
  .sending > summary::-webkit-details-marker{display:none;}
  .sending > summary::before{content:'\25B8'; color:var(--faint); margin-right:9px; display:inline-block;}
  .sending > summary small{font-weight:400; color:var(--grey); margin-left:8px;}
  .sending[open]{border-color:var(--gold); border-bottom-width:3px;}
  .sending[open] > summary{content:''; background:var(--gold-wash); color:var(--gold-deep);
    border-bottom:1px solid var(--sand-line);}
  .sending[open] > summary::before{content:'\25BE'; color:var(--gold-deep);}
  .sending[open] > summary small{color:var(--ink-warm);}
  .sendbody{display:grid; gap:13px; padding:14px; background:var(--sand);}
  .sending .filmrow{margin:0; padding:14px 16px; background:var(--surface); border-radius:10px;
    border:1px solid var(--sand-line); border-bottom-width:2px;}
  /* each row names itself, on its own line, whether the row is flex or grid */
  .sending .filmrow > b{flex-basis:100%; color:var(--ink-warm); font-family:'Newsreader',Georgia,serif;
    font-size:1.02rem; font-weight:600;}
  .sending .filmrow.demos > b{margin-bottom:-2px;}
  .flash{animation:flash 1.4s ease-out;}
  @keyframes flash{from{box-shadow:0 0 0 3px var(--gold-deep);}to{box-shadow:0 0 0 3px transparent;}}
  @media (prefers-reduced-motion:reduce){ .flash{animation:none; outline:2px solid var(--gold-deep);} }
  /* A section is a drawer now. Live is always open; the rest remember. */
  details.sec > summary{list-style:none; cursor:pointer;}
  details.sec > summary::-webkit-details-marker{display:none;}
  details.sec > summary .section{display:flex; align-items:baseline; gap:9px;}
  details.sec > summary .section::before{content:'\25B8'; color:var(--faint); font-size:.8rem;}
  details.sec[open] > summary .section::before{content:'\25BE';}
  details.sec.always > summary{cursor:default;}
  details.sec.always > summary .section::before{content:none;}
  .seccount{font-family:'Karla',sans-serif; font-size:.74rem; font-weight:700; color:var(--grey);
    background:var(--box); border-radius:999px; padding:2px 9px;}
  .findrow{display:flex; align-items:center; gap:9px; margin:0 0 12px;}
  .findrow input{font:inherit; font-size:.88rem; padding:6px 11px; border:1px solid var(--sand-line);
    border-radius:7px; background:var(--field,#fff); color:inherit; min-width:260px;}
  .findrow .note{font-size:.78rem; color:var(--grey);}
  /* A live course's Delete does not sit in the open beside Copy. */
  .moreacts{position:relative; display:inline-block;}
  .moreacts > button{font:700 .9rem/1 inherit; background:none; border:0; cursor:pointer;
    color:var(--grey); padding:3px 9px; border-radius:6px;}
  .moreacts > button:hover{background:var(--box); color:var(--ink);}
  .moreacts .menu{position:absolute; right:0; top:100%; z-index:40; background:var(--surface);
    border:1px solid var(--sand-line); border-radius:9px; padding:5px; min-width:190px;
    box-shadow:0 10px 26px rgba(0,0,0,.14); display:none;}
  .moreacts.on .menu{display:block;}
  .moreacts .menu button{display:block; width:100%; text-align:left; font:600 .82rem/1 inherit;
    background:none; border:0; padding:8px 10px; border-radius:6px; cursor:pointer; color:var(--garnet,#8a2f3a);}
  .moreacts .menu button:hover{background:var(--box);}
  /* THE STATS, AS A ROOM OF PANELS. Ramy, 5 Oct 2026: "it should be easy to
     read. Easy to navigate ... like a nice pill or colour coded panel."
     Each panel owns one question and carries its own colour on the top rule;
     the pills along the top jump to them. Four colours only, the ones the
     house already uses: teal for volume, gold for outcomes, brick for what
     went wrong, sand for everything structural. */
  .stats{margin:0 0 20px;}
  .stats > h2{font-family:'Newsreader',Georgia,serif; font-size:1.42rem; margin:0 0 4px;}
  .stats .lede{margin:0 0 14px; max-width:68ch;}
  .stats .lede.quiet{color:var(--grey); font-size:.88rem;}
  .statwrap{border:1px solid var(--sand-line); border-radius:12px; background:var(--surface); overflow:hidden;}
  .statwrap > summary{cursor:pointer; list-style:none; padding:12px 16px; display:flex;
    align-items:baseline; gap:10px; flex-wrap:wrap;}
  .statwrap > summary::-webkit-details-marker{display:none;}
  .statwrap > summary::before{content:'\25B8'; color:var(--faint); align-self:center;}
  .statwrap[open] > summary::before{content:'\25BE';}
  .statwrap > summary h2{font-family:'Newsreader',Georgia,serif; font-size:1.22rem; margin:0;}
  .statwrap > summary small{color:var(--grey); font-size:.8rem; font-variant-numeric:tabular-nums;}
  .statwrap[open] > summary{border-bottom:1px solid var(--sand-line); background:var(--box);}
  .statwrap > .lede, .statwrap > .jump, .statwrap > .panels{margin-left:16px; margin-right:16px;}
  .statwrap > .lede{margin-top:14px;}
  .statwrap > .panels{margin-bottom:16px;}
  .jump{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 18px;}
  .jump button{font:600 .78rem/1 inherit; cursor:pointer; padding:7px 13px; border-radius:999px;
    border:1px solid var(--sand-line); background:var(--surface); color:var(--grey);}
  .jump button:hover{border-color:var(--teal); color:var(--teal);}
  .panels{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:14px; align-items:start;}
  .panel{background:var(--surface); border:1px solid var(--sand-line); border-radius:12px;
    padding:0 16px 15px; border-top:3px solid var(--teal); overflow:hidden;}
  .panel.gold{border-top-color:var(--gold);}
  .panel.brick{border-top-color:var(--brick);}
  .panel.sand{border-top-color:var(--amber-edge);}
  .panel.wide{grid-column:1 / -1;}
  .panel > h3{font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.08rem;
    margin:14px 0 2px;}
  .panel > .say{font-size:.78rem; color:var(--grey); margin:0 0 12px;}
  .panel > .say.quiet{color:var(--faint);}
  .figs{display:flex; flex-wrap:wrap; gap:18px; margin:0 0 12px;}
  .fig b{display:block; font-size:1.65rem; font-weight:700; line-height:1; font-variant-numeric:tabular-nums;}
  .fig span{font-size:.74rem; color:var(--grey);}
  .rows{display:grid; gap:6px;}
  .row2{display:grid; grid-template-columns:118px 1fr auto; align-items:center; gap:10px; font-size:.82rem;}
  /* The wide panels carry longer names ("Assignment wording") and a chip after
     the number, so they get the room rather than an ellipsis. */
  .panel.wide .row2{grid-template-columns:172px 1fr auto;}
  .row2 b{white-space:nowrap;}
  .row2 i{font-style:normal; color:var(--grey); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row2 .t{height:10px; border-radius:999px; background:var(--teal); min-width:3px;}
  .row2.g .t{background:var(--gold);}
  .row2.b .t{background:var(--brick);}
  .row2 b{text-align:right; font-variant-numeric:tabular-nums;}
  .row2 .said{display:inline-block; margin-left:7px; padding:2px 7px; border-radius:999px;
    background:var(--gold-wash); color:var(--gold-deep); font-weight:700; font-size:.68rem;
    white-space:nowrap; vertical-align:1px;}
  .months{display:flex; align-items:flex-end; gap:6px; height:76px; margin:4px 0 2px;}
  .months .m{flex:1 1 0; display:flex; flex-direction:column; justify-content:flex-end; gap:4px; min-width:0;}
  .months .m .t{background:var(--teal); border-radius:3px 3px 0 0; min-height:2px;}
  .months .m i{font-style:normal; font-size:.62rem; color:var(--grey); text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .months .m b{font-size:.68rem; text-align:center; font-variant-numeric:tabular-nums; color:var(--grey);}
  .panel .flash{animation:flash 1.4s ease-out;}
  .inmore{font:600 .8rem/1 inherit; background:none; border:0; padding:9px 0 0; cursor:pointer;
    color:var(--teal); text-decoration:underline; text-underline-offset:3px;}
  /* Reading a contributed set. The file in Drive is JSON; this is the set. It
     follows the lesson plan's shape -- the aim, then the stages against the
     clock -- so a set from somewhere else reads the way ours do. */
  .readback{position:fixed; inset:0; z-index:9500; background:rgba(28,26,22,.42);
    display:flex; align-items:flex-start; justify-content:center; padding:22px 16px; overflow:auto;}
  .readbox{background:var(--surface); border-radius:13px; width:min(880px,100%); padding:22px 24px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .readbox h2{font-family:'Newsreader',Georgia,serif; font-size:1.45rem; margin:0 0 2px;}
  .readbox .by{color:var(--teal); font-weight:600; font-size:.88rem; margin:0 0 2px;}
  .readbox .ct{color:var(--grey); font-size:.8rem; margin:0 0 16px; font-variant-numeric:tabular-nums;}
  .rsess{border-top:1px solid var(--sand-line); padding:13px 0 2px;}
  .rsess .sh{font-size:.68rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--gold-deep); margin:0 0 6px;}
  .rslot{margin:0 0 15px;}
  .rslot .ty{font-size:.66rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    background:var(--box); color:var(--grey); border-radius:999px; padding:3px 9px; margin-right:7px;}
  .rslot .aim{font-size:.92rem; margin:7px 0 2px;}
  .rslot .sub, .rslot .src{font-size:.8rem; color:var(--grey); margin:0;}
  .rstage{display:grid; grid-template-columns:34px 1fr; gap:9px; font-size:.84rem;
    padding:5px 0 5px 2px; border-top:1px dotted var(--sand-line);}
  .rstage .mn{color:var(--teal); font-weight:700; font-variant-numeric:tabular-nums; text-align:right;}
  .rstage .nm{font-weight:700;}
  .rstage .ia{color:var(--faint); font-weight:400; font-size:.76rem; margin-left:6px;}
  .rstage .av{color:var(--garnet,#8a2f3a); font-size:.8rem; display:block; margin-top:1px;}
  .readbox .bare{font-size:.82rem; color:var(--faint); margin:4px 0 0;}
  /* A standing demo course, pinned to a day by the demo clock (30 Sep 2026):
     gold, like the sync pill on its own screens. */
  .filmrow.demos{display:grid; gap:10px;}
  .filmrow.demos b{font-family:'Newsreader',Georgia,serif; font-size:1rem;}
  .filmrow.demos textarea{width:100%; box-sizing:border-box; font:inherit; font-size:0.9rem; padding:9px 11px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:var(--ink); resize:vertical;}
  .filmrow.demos .acts{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  /* The card goes out as the email (2 Oct 2026): an address, Send, and the
     quieter ways round it -- preview, paste into Gmail, plain text. */
  .filmrow.demos .sendrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .filmrow.demos .sendrow input{flex:1 1 220px; min-width:180px;}
  /* It is a label, so the uppercase rule for .filmrow label was catching it and
     wrapping "the price goes on the full card" into two shouted lines. */
  /* `.filmrow label` is (0,1,1) and was out-ranking a plain `.priceon`, so the
     uppercase rule for field labels kept shouting "THE PRICE GOES ON THE FULL
     CARD" across two lines. Match the specificity rather than reach for
     !important. */
  .filmrow label.priceon{display:inline-flex; align-items:center; gap:7px; font-size:0.78rem;
    color:var(--grey); cursor:pointer; text-transform:none; letter-spacing:0; font-weight:400;
    white-space:nowrap; flex:0 0 auto;}
  .priceon{display:inline-flex; align-items:center; gap:7px; font-size:0.78rem; color:var(--grey); cursor:pointer;}
  .priceon input{accent-color:var(--teal); width:15px; height:15px; cursor:pointer;}
  .filmrow.demos .sendrow .kindsel{flex:0 0 152px;}
  .filmrow.demos .sendrow .kindsel select{font-size:0.86rem; padding:8px 26px 8px 10px;}
  .filmrow.demos .sendrow .cc{flex:0 1 220px; min-width:160px;}
  .centre.label{font-style:italic; color:var(--gold-deep);}
  .chip.demo{background:var(--gold-wash); color:var(--gold-deep); border-color:var(--amber-edge); font-weight:700;}
  .filmrow.film-self{align-items:center; gap:12px;} .filmrow.film-self b{font-family:'Newsreader',Georgia,serif; font-size:1rem;} .filmrow.film-self code{font-size:0.78rem;}
  .course{position:relative; background:linear-gradient(180deg, var(--card-top) 0%, var(--card) 64%);
    border:1px solid var(--sand-line); border-radius:14px; padding:20px 22px 18px;
    box-shadow:inset 0 1px 0 var(--card-edge), 0 1px 2px var(--shade-near), 0 7px 16px -7px var(--shade-far);
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;}
  .course:hover{transform:translateY(-3px); border-color:var(--sand-line-deep);
    box-shadow:inset 0 1px 0 var(--paper), 0 2px 4px var(--shade-near), 0 16px 28px -12px var(--shade-far);}
  @media(prefers-reduced-motion:reduce){ .course{transition:none;} .course:hover{transform:none;} }
  .chead{display:flex; align-items:flex-start; justify-content:space-between; gap:18px; flex-wrap:wrap;}
  .chead h2{margin:0; font-family:'Newsreader',Georgia,serif; font-size:1.45rem; font-weight:600; line-height:1.2;}
  .chead .centre{margin:3px 0 0; font-size:0.9rem; color:var(--grey);}
  .chead .meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:0.8rem; color:var(--grey);}
  .chip{display:inline-flex; align-items:center; gap:5px; border-radius:6px; padding:3px 9px;
    background:var(--box); font-size:0.76rem; font-weight:600; color:var(--ink-warm); white-space:nowrap;}
  .chip.faint{background:none; border:1px solid var(--row-line); color:var(--grey); font-weight:500;}
  .chip code{font-family:'Karla',sans-serif; font-size:0.72rem; color:var(--grey);}
  .chip .btn.quiet{height:auto; padding:0 0 0 4px; font-size:0.74rem;}
  /* the two doors */
  .links{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; padding-top:16px; border-top:1px solid var(--row-line);}
  .link{display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto; column-gap:14px; row-gap:4px;
    align-items:center; border-radius:10px; padding:12px 14px; background:var(--surface); border:1px solid var(--row-line);}
  .link.tutor{border-color:color-mix(in oklab, var(--teal) 35%, transparent); background:color-mix(in oklab, var(--teal) 6%, var(--surface));}
  .link b{grid-column:1; grid-row:1; font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:700;
    letter-spacing:0.12em; text-transform:uppercase; color:var(--grey);}
  .link.tutor b{color:var(--teal);}
  .link .note{grid-column:1; grid-row:2; font-size:0.8rem; color:var(--grey); line-height:1.45;}

<script>
/* The owner key rides in ?o= the first time and is kept in this browser after,
   so the Command Center's Connect Lite door can be a plain link with no secret
   in it. */
const OWNER_STORE = 'hub:o';
/* The course made in this sitting. It is drawn first and marked until the
   console is opened again. */
let NEW_ID = '';
const params = new URLSearchParams(location.search);
try {
  if (params.get('o')) {
    localStorage.setItem(OWNER_STORE, params.get('o'));
    history.replaceState(null, '', location.pathname);
  }
} catch (e) {}
function ownerKey(){ try { return localStorage.getItem(OWNER_STORE) || ''; } catch (e) { return ''; } }

const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const base = () => location.origin + location.pathname.replace(/[^/]*$/, '');
const call = body => HubStore.call(Object.assign({ owner: ownerKey() }, body));

/* The day at the front of the stamp, read as written. `created` is a full
   timestamp, and reading it as an instant moves it to the next day for a reader
   east of the store -- a course minted late in the evening would be listed as
   made tomorrow. Same rule as niceDate in hub-shared and longDate on the
   assessor pack. */
function niceDate(iso){
  const s = String(iso == null ? '' : iso);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  const d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date(s);
  if (isNaN(d)) return '';
  try { return d.toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'}); }
  catch (e) { return ''; }
}
/* What to call a course: the centre's own words once they have set them, and
   the handle it was minted with until then. */
function label(c){
  if (c.courseName && c.centreName) return c.courseName + ' · ' + c.centreName;
  return c.courseName || c.centreName || c.name || c.id;
}
function status(msg){ const s = $('status'); if (s) s.textContent = msg || ''; }
/* A Cambridge centre number: two letters and the digits, e.g. TR001. Typed by
   the owner, upper-cased, and the Make button stays off until it is one. */
/* WHAT A CAMBRIDGE CENTRE NUMBER LOOKS LIKE. Two shapes, not one: a UK
   centre is plain digits (10294 is International House London, 00009 Teaching
   House Stratford-upon-Avon), everywhere else carries the country prefix
   (TR073, IT060, AE001). The check here was two letters and digits only, so
   every British centre -- 141 of the 479 on Cambridge's list -- could not be
   typed: the Make button stayed dead and the store would have thrown
   (found 6 Oct 2026, reading the list in). A trailing letter is allowed
   because Cambridge issues them: MX026b, CN800a, GE007b. */
function centreNumberTyped(){ const el = $('mkNumber'); if (!el) return ''; const v = el.value.trim().toUpperCase().replace(/\s+/g, ''); return /^([A-Z]{2})?\d{3,5}[A-Z]?$/.test(v) ? v : ''; }
/* THE CENTRE BOOK. Ramy, 6 Oct 2026: "what if I misspell it or type it
   wrong? It has to be attached to the number. If I write TR073, it should
   automatically give me International House Istanbul."

   Cambridge publishes no register anyone can query, so there is nothing to
   validate against -- but there is no need to invent one. Connect already
   knows every centre it has ever sold to, because Ramy typed the number and
   the name when he minted the course. So the store keeps that pair, and this
   fills the name in from the number.

   It LEARNS rather than being maintained: the first course for a centre is
   typed in full, and every course after it fills itself. The value is the
   typo check -- TR073 fills "International House Istanbul", and TRO73 with a
   letter O fills nothing at all, which is the mistake showing itself. */
var CENTRES = {};
function centreBookLoad(){
  call({ op: 'centres' }).then(function(r){ CENTRES = (r && r.centres) || {}; centreBookFill(); }, function(){});
}
function centreBookFill(){
  const num = centreNumberTyped(), nameEl = $('mkName'), note = $('mkNote');
  const go = $('makeGo'); if (go) go.disabled = !num;
  if (!note) return;
  if (!num) { note.textContent = 'Only a course with a real centre number gets made, and the centre cannot edit it afterwards.'; return; }
  const known = CENTRES[num];
  if (known) {
    /* Only fill an empty box, or one this filled before: a name typed over the
       top is the owner correcting the book, and must not be overwritten. */
    if (nameEl && (!nameEl.value.trim() || nameEl.dataset.filled === '1')) { nameEl.value = known; nameEl.dataset.filled = '1'; }
    note.textContent = num + ' is ' + known + '. Type over the name to correct it \u2014 Connect will remember the correction.';
  } else {
    if (nameEl && nameEl.dataset.filled === '1') { nameEl.value = ''; delete nameEl.dataset.filled; }
    note.textContent = 'Connect has not sold to ' + num + ' before. Type the centre\u2019s name and it will fill itself next time \u2014 if you expected it to be known, check the number.';
  }
}
document.addEventListener('input', e => {
  if (!e.target) return;
  if (e.target.id === 'mkNumber') centreBookFill();
  if (e.target.id === 'mkName') delete e.target.dataset.filled;
});

/* Two ways in, because one of them should not require editing a web address:
   open the owner link, or paste the key here (Ramy, 21 Sep 2026). */
function gate(msg){
  $('app').innerHTML = `<div class="gate">
    <h1>This is the owner console</h1>
    <p>Paste your owner key below, and this browser will remember it. To find it: open the store in the Apps Script editor, choose <b>ownerKey</b> in the function list, press <b>Run</b>, and it prints a link — opening that link works too.</p>
    <div style="display:flex; gap:9px; margin-top:16px; flex-wrap:wrap;">
      <!-- --box, like every control in Lite. This one is written inline rather
           than as a rule, which is how it survived the sweep that warmed the
           rest on 21 Sep 2026: it was the last stark-white field left. -->
      <input id="ownerIn" type="text" placeholder="Your owner key" autocomplete="off" spellcheck="false"
        style="font-family:'Karla',sans-serif; font-size:0.9rem; padding:0 12px; height:34px; min-width:280px; flex:1;
               border:1.5px solid var(--sand-line); border-radius:6px; background:var(--box); color:var(--ink);">
      <button class="btn primary" id="ownerGo" type="button">Open the console</button>
    </div>
    <p id="status"></p>
  </div>`;
  if (msg) status(msg);
  const go = async () => {
    // A whole link pasted in works as well as the key alone.
    const raw = $('ownerIn').value.trim();
    const key = (raw.match(/[?&]o=([^&\s]+)/) || [])[1] || raw;
    if (!key) { status('Paste the key, or the whole link.'); return; }
    try { localStorage.setItem(OWNER_STORE, decodeURIComponent(key)); } catch (e) {}
    status('Opening…');
    load();
  };
  $('ownerGo').addEventListener('click', go);
  $('ownerIn').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

/* One message, so the same course is always described the same way. The film
   link rides along when there is one: it is the thing people ask for after
   they have clicked around for two minutes. */
const FILM_KEY = 'chub:filmlink';
const PRICE_KEY = 'chub:price';
/* The film used to be a bare .webm file and the box held its address. The
   file left the repository on 2 Oct 2026 when the film became an MP4 behind
   its own page, so every console still holding the old address sent cards
   whose Watch door answered 404 (Ramy, 3 Oct 2026, with the screenshot).
   A console that still points at the old file moves itself to the page. */
function filmLink(){
  try {
    var v = (localStorage.getItem(FILM_KEY) || '').trim();
    if (/\/film\/connect-lite-film\.(webm|mp4)$/i.test(v)) {
      v = v.replace(/\/film\/connect-lite-film\.(webm|mp4)$/i, '/film/watch.html');
      localStorage.setItem(FILM_KEY, v);
    }
    return v;
  } catch (e) { return ''; }
}
function priceText(){ try { return (localStorage.getItem(PRICE_KEY) || '').trim(); } catch (e) { return ''; } }
/* The owner's own listing does not carry the trainees -- it carries how many
   -- so the trainee link is fetched when the button is pressed rather than
   on every draw. A course with nobody on it says so instead of pretending. */
const FIRST = {};
async function firstTrainee(c){
  if (FIRST[c.id] !== undefined) return FIRST[c.id];
  try {
    const r = await HubStore.call({ op: 'roster', key: c.tutorKey });
    const list = Object.values((r && r.trainees) || {}).sort((a, b) => String(a.name).localeCompare(String(b.name)));
    FIRST[c.id] = list.length ? list[0] : null;
  } catch (e) { FIRST[c.id] = null; }
  return FIRST[c.id];
}
/* ONE link, and it opens the card. The message used to paste the three invite
   links raw, which is what a link looks like in an email and not what a card
   looks like (Ramy, 26 Sep 2026: "what happened to the card idea? It looks
   like it's just a link"). offer.html IS the card -- what Lite is, what it
   costs, a note in his own voice, and the three doors into this very course --
   and it takes the course from ?k= and the film from &f=, so the message
   carries neither and cannot fall out of step with either. */
function cardLink(c){
  const film = filmLink(), price = priceText();
  /* The switch below the note decides whether the card talks money at all.
     It used to reach only the emailed card; the web card the email opens
     still showed the published figure (Ramy, 6 Oct 2026: "why does the card
     show the price even though I did not tick the box?"). Off, the link
     carries &np=1 and offer.html leaves the whole price block out. */
  return base() + 'offer.html?k=' + encodeURIComponent(c.tutorKey)
    + (film ? '&f=' + encodeURIComponent(film) : '')
    + (!priceOn() ? '&np=1' : (price ? '&p=' + encodeURIComponent(price) : ''));
}
/* ONE EMAIL FOR THE TWO DEMOS AND THE FILM (Ramy, 30 Sep 2026: "I want to be
   able to send all three, two demos and the film, in one email, and I want the
   email to clarify that, along with a personal note from me"). The note is
   his, typed once and kept in this browser; the two cards are the standing
   demos' own; the film is the Link to the film box, and its line appears only
   once that box is filled -- the engine's address carries keys and never goes
   out. */
const DEMO_NOTE_KEY = 'chub:demoNote';
/* The standing letter (Ramy, 2 Oct 2026: "let's fix this so it goes
   automatically without copy pasting, and if I need to change it, I would do
   the edit"). It is the note until he types over it; what he types is kept in
   this browser; clearing the box sends the card alone, and "Put the standard
   note back" restores this. */
const DEFAULT_DEMO_NOTE = [
  'Hello,',
  '',
  'I run CELTA courses myself, and for years the paperwork lived in five places at once. Connect Lite is what I built to bring it all into one. It\u2019s also designed to ease a problem every centre knows well: finding enough volunteer students, and keeping them coming back.',
  '',
  'Below you\u2019ll find the card, which sets out what Connect Lite does, along with three real courses you can explore as a tutor, a trainee or the assessor. Five minutes in the tutor\u2019s view will tell you more than I could in a paragraph.',
  '',
  'There\u2019s also a short film that follows a whole course from start to finish. I\u2019m no filmmaker, as the first ten seconds will make clear, but it does show the platform at work.',
  '',
  'If it looks like something your centre could use, just reply and we can talk. If not, no harm done, and I\u2019d still be glad to hear why.',
].join('\n');
/* A letter per card (Ramy, 3 Oct 2026: "we need to adjust the language of the
   email depending on which card we're sending"). The full card's letter sends
   people to three demo courses; on the film card those courses are not there
   yet, and on the price card nobody asked about them. Each is edited on its
   own and kept under its own name, so changing one leaves the others alone. */
const DEFAULT_NOTES = {
  '': DEFAULT_DEMO_NOTE,
  film: [
    'Hello,',
    '',
    'I run CELTA courses myself, and for years the paperwork lived in five places at once. Connect Lite is what I built to bring it all into one. It\u2019s also designed to ease a problem every centre knows well: finding enough volunteer students, and keeping them coming back.',
    '',
    'Rather than describe it, I filmed it. Eight minutes, a whole course from the first lesson plan to the certificates. I\u2019m no filmmaker, as the first ten seconds will make clear, but it does show the thing working.',
    '',
    'If it looks useful, just reply and I\u2019ll send you demo links \u2014 real courses you can open and type in yourself.',
  ].join('\n'),
  price: [
    'Hello,',
    '',
    'Here is what Connect Lite costs. There is not much to it: one price per course, everything included, and less when you buy several.',
    '',
    'If your centre needs something the card does not cover \u2014 an invoice in another currency, a purchase order, or a single course to try before you commit \u2014 just say and we will sort it out.',
  ].join('\n'),
};
function noteKey(){ const k = cardKind(); return DEMO_NOTE_KEY + (k ? ':' + k : ''); }
function demoNote(){ const d = DEFAULT_NOTES[cardKind()] || DEFAULT_NOTES['']; try { const v = localStorage.getItem(noteKey()); return v === null ? d : v.trim(); } catch (e) { return d; } }
function standingDemos(){
  const byName = n => COURSES.find(c => c.name === n);
  const byShape = re => COURSES.find(c => c.demoToday && re.test(String(c.name || '')));
  /* The finished course goes with them (Ramy, 2 Oct 2026: "all the demo
     links"). It is the one that answers "and what do we have at the end?" --
     the reports written, both halves of CELTA 5 signed, the certificates. It
     has no demoToday, which is what tells it from the two pinned ones. */
  /* By shape, not by an exact label. These were matched on the full name
     until renaming them (3 Oct 2026) silently emptied this row and the card
     with it: a demo's label is his to change and must never be load-bearing. */
  const start = byShape(/first week|week one/i), visit = byShape(/visit/i);
  /* It is pinned too -- to its own last day, so that it never ages -- which
     is what tells it from the two mid-course demos: its clock has reached
     its end date. */
  const done = COURSES.find(c => c !== start && c !== visit && c.courseName === 'CELTA \u2014 C/1 2026' && c.end && c.demoToday && c.demoToday >= c.end);
  return { start, visit, done };
}
function demosNote(){
  const { start, visit, done } = standingDemos();
  const film = filmLink(), note = demoNote();
  return [
    'Hi,',
    '',
    note || null, note ? '' : null,
    'Here is Connect Lite \u2014 a CELTA course run from one link, with everything the trainees write and everything you write back in one place. ' + (done ? 'Three courses' : 'Two courses') + ' to look around, and a film:',
    '',
    '1. The first week of a course \u2014 ' + cardLink(start),
    '2. The last week, two days before the assessor\u2019s visit \u2014 ' + cardLink(visit),
    done ? '3. A course that has finished \u2014 the reports written, CELTA 5 signed, the certificates \u2014 ' + cardLink(done) : null,
    film ? (done ? '4' : '3') + '. The film, eight minutes \u2014 ' + film : null,
    '',
    'Each card opens on what Lite is and what it costs, and then four ways into that course you can type in: as a tutor, as one of the trainees, as the assessor, and as a volunteer student. ' + (done ? 'All three are' : 'Both are') + ' demonstration courses that stay on the day they are on, so nothing you do there touches anybody\u2019s record.',
    '',
    'Any questions, just reply.',
    '',
    'Ramy',
  ].filter(x => x !== null).join('\n');
}
/* THE CARD AS THE EMAIL (Ramy, 2 Oct 2026: "I want the email to be the card").
   hub-card-mail.js draws it; this gathers what goes on it. The doors are the
   same links demosNote() lists, each to that course's offer card. */
const CARD_CC_KEY = 'chub:cardCopyTo';
/* Which card goes out (Ramy, 3 Oct 2026): the full one, or the film alone. */
const CARD_KIND_KEY = 'chub:cardKind';
function cardKind(){ try { var v = localStorage.getItem(CARD_KIND_KEY); return (v === 'film' || v === 'price') ? v : ''; } catch (e) { return ''; } }
/* Whether the money rides along with the demos. A first message to a centre
   that has not asked is sometimes better without it (Ramy, 3 Oct 2026). */
const PRICE_ON_KEY = 'chub:priceOn';
function priceOn(){ try { return localStorage.getItem(PRICE_ON_KEY) !== 'off'; } catch (e) { return true; } }
function cardCopyTo(){ try { return (localStorage.getItem(CARD_CC_KEY) || '').trim(); } catch (e) { return ''; } }
/* What a row on this console IS (Ramy, 3 Oct 2026: "label them so I don't
   mix them up"). Six rows that all look alike: one real centre's course, the
   three standing demos, my scratch course for filming, and C/17's grades,
   which is a page kept as a course because that is how the store holds it.
   Read from the store's own label, which only this console sees. */
/* The console in three parts, so a real centre's course is never sitting in
   the same run of cards as a demo (Ramy, 3 Oct 2026: "the live courses should
   have their own section, so it's not all washed out together"). */
const SECTIONS = [
  { k: 'live',    t: 'Live courses',      w: 'real centres, real trainees' },
  { k: 'demo',    t: 'Demos',             w: 'what a centre is sent \u2014 pinned to one day, never ageing' },

   nothing. */
let COURSES = [], SHOW_URLS = false;
document.addEventListener('input', e => {
  if (!e.target.closest) return;
  if (e.target.closest('#filmLink')) { try { localStorage.setItem(FILM_KEY, e.target.value.trim()); } catch (err) {} return; }
  if (e.target.closest('#demoNote')) { try { localStorage.setItem(noteKey(), e.target.value); } catch (err) {} return; }
  if (e.target.closest('#priceText')) { try { localStorage.setItem(PRICE_KEY, e.target.value.trim()); } catch (err) {} return; }
  if (e.target.closest('#cardCopyTo')) { try { localStorage.setItem(CARD_CC_KEY, e.target.value.trim()); } catch (err) {} return; }
  if (e.target.closest('#cardKind')) {
    try { localStorage.setItem(CARD_KIND_KEY, e.target.value); } catch (err) {}
    /* The letter on screen belongs to the card now chosen. */
    const t = $('demoNote'); if (t) t.value = demoNote();
    status(e.target.value === 'film' ? 'The film alone goes out next, with its own letter.' : e.target.value === 'price' ? 'The price alone goes out next, with its own letter.' : 'The full card goes out next, with its own letter.');
    return;
  }
  if (e.target.closest('#priceOn')) { try { localStorage.setItem(PRICE_ON_KEY, e.target.checked ? 'on' : 'off'); } catch (err) {} status(e.target.checked ? 'The card carries the price.' : 'The card goes without the price \u2014 the web card and the email both.'); }
});
$('app').addEventListener('click', async e => {
    const urls = e.target.closest('#toggleUrls');
    if (urls) { SHOW_URLS = !SHOW_URLS; render(COURSES); return; }
    const retry = e.target.closest('#retryBtn');
    if (retry) { retry.disabled = true; retry.textContent = 'Trying…'; load(); return; }
    /* A key the store REFUSES clears itself and the paste box comes back. A key
       the store never answers for does not -- and if the key was the thing that
       was wrong, this screen was a dead end with only Try again on it (owner
       walk, 21 Sep 2026). */
    const other = e.target.closest('#otherKeyBtn');
    if (other) { try { localStorage.removeItem(OWNER_STORE); } catch (err) {} gate(); return; }
    if (e.target.closest('#makeBtn')) {
      const row = $('makeRow'); if (!row) return;
      row.hidden = !row.hidden;
      if (!row.hidden) $('mkNumber').focus();
      return;
    }
    if (e.target.closest('#makeCancel')) { const row = $('makeRow'); if (row) row.hidden = true; return; }
    const make = e.target.closest('#makeGo');
    if (make) {
      if (BUSY) return;
      const centreNumber = centreNumberTyped();
      if (!centreNumber) { status('Type the Cambridge centre number first.'); $('mkNumber').focus(); return; }
      const centreName = $('mkName').value.trim();
      BUSY = true; make.disabled = true; status('Making the course…');
      try {
        /* The store answers with the refreshed list, so the screen repaints from
           this one answer. Asking it again for the list would cost a second
           Apps Script round trip, and each of those is 1.5-13 s -- the wait Ramy
           called out on 21 Sep 2026 ("making the course takes a while"). */
        const made = await call({ op: 'createCourse', centreNumber: centreNumber, centreName: centreName });
        /* the book learns from every course made: the pair goes back with the
           answer, so the next course for this centre fills itself */
        if (made && made.centres) CENTRES = made.centres;
        /* The store appends, so the new course used to arrive at the BOTTOM,
           below the fold, while the status line asked you to copy a link it
           had not shown you (walk, 21 Sep 2026). It is drawn FIRST now, marked
           as new, and the screen goes to it. */
        NEW_ID = made.id;
        showList(made.courses, 'Made ' + made.id + ' for ' + centreNumber + '. Copy its tutor link and send it to the centre.');
        const card = document.querySelector('.course.minted');
        if (card) hubScrollIntoView(card, 'start');
      } catch (err) { status(err.message); make.disabled = false; }
      BUSY = false;
      return;
    }
    if (e.target.closest('#filmLink') || e.target.closest('#priceText') || e.target.closest('#demoNote') || e.target.closest('#cardTo') || e.target.closest('#cardCopyTo') || e.target.closest('#cardKind') || e.target.closest('#priceOn')) return;
    const note = e.target.closest('[data-note]');
    if (note) {
      const c = COURSES.filter(function(x){ return x.id === note.dataset.note; })[0];
      if (c) { note.textContent = 'Building\u2026'; await hubCopyButton(note, note.dataset.what === 'tutor' ? tutorNoteFor(c) : await noteFor(c)); }
      return;
    }
    const card = e.target.closest('[data-card]');
    if (card) {
      e.preventDefault();
      const c = COURSES.filter(function(x){ return x.id === card.dataset.card; })[0];
      if (c) window.open(cardLink(c), '_blank', 'noopener');
      return;
    }
    if (e.target.closest('#demosCopy')) { const b = e.target.closest('#demosCopy'); await hubCopyButton(b, demosNote()); return; }
    if (e.target.closest('#noteReset')) {
      try { localStorage.removeItem(noteKey()); } catch (err) {}
      const t = $('demoNote'); if (t) t.value = demoNote(); status('The standard note is back.'); return;
    }
    if (e.target.closest('#cardPreview')) {
      const u = URL.createObjectURL(new Blob([cardHtml()], { type: 'text/html' }));
      window.open(u, '_blank', 'noopener'); setTimeout(() => URL.revokeObjectURL(u), 60000); return;
    }
    if (e.target.closest('#cardCopy')) {
      /* Rich copy: pasted into a Gmail compose it keeps its tables, borders
         and colours, so the card can also go from the Workspace mailbox by
         hand. hubCopyButton is plain-text only, hence the clipboard call. */
      const b = e.target.closest('#cardCopy'), was = b.textContent;
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([cardHtml()], { type: 'text/html' }), 'text/plain': new Blob([demosNote()], { type: 'text/plain' }) })]);
        b.textContent = 'Copied \u2014 paste it into a new message';
      } catch (err) { b.textContent = 'Could not copy \u2014 use Preview and copy from there'; }
      setTimeout(() => { b.textContent = was; }, 2600); return;
    }
    if (e.target.closest('#cardSend')) {
      const b = e.target.closest('#cardSend'), to = ($('cardTo').value || '').trim(), cc = ($('cardCopyTo').value || '').trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) { status('Type the address the card goes to.'); $('cardTo').focus(); return; }
      if (!ownerKey()) { status('The owner key is missing \u2014 open the console from its own link.'); return; }
      b.disabled = true; b.textContent = 'Sending\u2026'; status('');
      try {
        const r = await HubStore.call({ op: 'sendCard', owner: ownerKey(), to, copy: cc, subject: cardSubject(), html: cardHtml(), text: demosNote() });
        status('Sent to ' + to + ' from ' + (r && r.from || 'the store') + (cc ? ', with a copy to ' + cc : '') + '.');
        $('cardTo').value = '';
      } catch (err) { status('Not sent: ' + (err && err.message || err)); }
      b.disabled = false; b.textContent = 'Send the card'; return;
    }
    const mail = e.target.closest('[data-mail]');
    if (mail) {
      e.preventDefault();
      const c = COURSES.filter(function(x){ return x.id === mail.dataset.mail; })[0];
      if (!c) return;
      const tutor = mail.dataset.what === 'tutor';
      const subject = tutor ? tutorSubject(c) : 'Connect Lite — ' + ((c.settings && c.settings.courseName) || c.name || c.id);
      location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(tutor ? tutorNoteFor(c) : await noteFor(c));
      return;
    }
    const v = e.target.closest('[data-vol]');
    if (v) {
      const was = v.textContent;
      v.textContent = 'Finding…'; v.disabled = true;
      try {
        const c = await HubStore.call({ op: 'course', key: v.dataset.key });
        const st = ((c && c.volunteers) || {}).students || [];
        const first = st.filter(x => x && x.token)[0];
        if (!first) { v.textContent = 'None yet — the register makes them'; v.disabled = false; setTimeout(() => { v.textContent = was; }, 2200); return; }
        /* Put the label back before the copy helper takes over, or it
           restores "Finding…" when it is done. */
        v.disabled = false; v.textContent = was;
        await hubCopyButton(v, base() + '26_volunteer.html?v=' + encodeURIComponent(first.token));
      } catch (err) { v.textContent = 'Could not reach the course'; v.disabled = false; setTimeout(() => { v.textContent = was; }, 2600); }
      return;
    }
    const b = e.target.closest('[data-copy]');
    if (b) {
      /* hubCopy falls back to execCommand and then to showing the link, so a
         blocked clipboard can no longer swallow the click in silence. */
      await hubCopyButton(b, b.dataset.copy);
      return;
    }
    /* The only destructive thing on the screen, so the question names exactly
       what goes rather than asking "are you sure". */
    const pg = e.target.closest('[data-purge]');
    if (pg) {
      if (BUSY) return;
      const files = Number(pg.dataset.files) || 0;
      /* Same shape as deleting a course: the question names exactly what goes,
         and the id is typed rather than filled in, because the danger is the
         wrong course rather than a careless owner. */
      const typed = await confirmModal(
        `Empty the materials for ${pg.dataset.purge}? ${files} file${files === 1 ? '' : 's'} go to Drive's trash, where Drive keeps them for 30 days. The plans that name them will point at nothing.`,
        'Empty the materials',
        { type: pg.dataset.purge, hint: `Type ${pg.dataset.purge} to empty its materials` });
      if (!typed) return;
      BUSY = true; status('Emptying materials for ' + pg.dataset.purge + '…');
      try {
        const r = await call({ op: 'purgeMaterials', course: pg.dataset.purge, confirm: typed });
        const t = r.trashed || {};
        showList(r.courses, `Emptied ${r.emptied} — ${t.files || 0} file${t.files === 1 ? '' : 's'} to Drive's trash.`);
      } catch (err) { status(err.message); }
      BUSY = false;
      return;
    }
    const cl = e.target.closest('[data-clone]');
    if (cl) {
      if (BUSY) return;
      const ok = await confirmModal(
        `Start the next course from ${cl.dataset.label}? The centre's settings, logo, tutors, standing instructions, shared links, assignment wording and observation sheets carry over, and the noticeboard's posts come across held back, for the tutors to post when the time comes. Dates, the assessment date, the notification reference, the assessor's document links, the roster and every record start fresh, and the new course gets its own tutor and assessor links.`,
        'Start the next course');
      if (!ok) return;
      BUSY = true; status('Starting the next course from ' + cl.dataset.label + '\u2026');
      try {
        const made = await call({ op: 'cloneCourse', from: cl.dataset.clone });
        NEW_ID = made.id;
        showList(made.courses, 'Made ' + made.id + ' from ' + cl.dataset.label + '. Open its Course admin, set the dates, then send the tutor link to the centre.');
        const card = document.querySelector('.course.minted');
        if (card) hubScrollIntoView(card, 'start');
      } catch (err) { status(err.message); }
      BUSY = false;
      return;
    }
    const d = e.target.closest('[data-delete]');
    if (d) {
      if (BUSY) return;
      const n = Number(d.dataset.trainees || 0);
      const carries = n
        ? `Its ${n} trainee${n === 1 ? '' : 's'} and every plan, self-evaluation, feedback and assignment on it go with it.`
        : 'It has no trainees; anything recorded on it goes with it.';
      /* The store has always demanded a confirmation naming the course -- and
         this page used to fill it in, which protects nobody. The person types
         it now, and what they typed is what goes to the store, so the guard at
         the far end is finally a real one. Typing the id also settles WHICH
         course is going, which a password could never do: the danger here is
         not a careless owner, it is the wrong course. */
      const typed = await confirmModal(
        `Delete ${d.dataset.label}? ${carries} Its tutor and assessor links stop working. This cannot be undone.`,
        'Delete the course',
        { type: d.dataset.delete, hint: `Type ${d.dataset.delete} to delete this course` });
      if (!typed) return;
      BUSY = true;
      status('Deleting ' + d.dataset.label + '…');
      try {
        const r = await call({ op: 'deleteCourse', course: d.dataset.delete, confirm: typed });
        const g = r.removed || {};
        const m = g.materials || {};
        showList(r.courses, `Deleted ${r.deleted} — ${g.trainees || 0} trainee${g.trainees === 1 ? '' : 's'} and ${g.records || 0} record${g.records === 1 ? '' : 's'} with it`
          + (m.folder ? `, and its ${m.files || 0} materials file${m.files === 1 ? '' : 's'} to Drive's trash.` : '.'));
      } catch (err) { status(err.message); }
      BUSY = false;
    }
});

/* The materials line on each card. Filled after the list paints, one course
   at a time -- each store call is 1.5-13 seconds and the page is useful
   without this. A store that has not been redeployed simply answers with an
   error, and the line says nothing rather than a lie. */
async function fillMaterials(){
  const lines = [...document.querySelectorAll('[data-mats]')];
  for (const line of lines) {
    const id = line.dataset.mats;
    try {
      const info = await call({ op: 'materials', course: id });
      if (!info || !info.exists || !info.files) { line.innerHTML = '<span class="note">No materials on Drive</span>'; continue; }
      const mb = info.bytes >= 1048576 ? (info.bytes / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(info.bytes / 1024)) + 'KB';
      line.innerHTML = '<span class="note">' + info.files + ' file' + (info.files === 1 ? '' : 's') + ' on Drive · ' + mb + '</span>'
        /* The chip could say how much was there and never let you see it --
           the folder is on the owner's own Drive and nothing here linked to
           it (Ramy, 26 Sep 2026). It knows its own URL; hand it over. */
        + (info.url ? ' <a class="linkbtn" href="' + esc(info.url) + '" target="_blank" rel="noopener">Open in Drive</a>' : '')
        + '<button class="btn quiet small" type="button" data-purge="' + id + '" data-files="' + info.files + '">Empty</button>';
    } catch (e) { line.innerHTML = ''; }
  }
}

/* Repaint from a list the store has already sent back, and only fall back to
   asking for one if an older deployment answered without it. */
function showList(courses, msg){
  if (courses) { render(courses, msg); return; }
  load(msg);
}

async function load(msg){
  if (!ownerKey()) { gate(); return; }
  try {
    const r = await call({ op: 'ownerCourses' });
    render(r.courses || [], msg);
    feedbackLine();
    inbox();
    stats();
    centreBookLoad();
  } catch (err) {
    if (/not yours/i.test(err.message)) { try { localStorage.removeItem(OWNER_STORE); } catch (e) {} gate('That key was not recognised — check you copied all of it.'); return; }
    /* Without this the screen is a dead end: the store's message and nothing to
       press, so the only way on is to reload by hand. #app keeps its listener
       across repaints, so the button below is already wired. */
    $('app').innerHTML = `<div class="empty">${esc(err.message)} <button class="btn small" id="retryBtn" type="button" style="margin-left:8px;">Try again</button> <button class="btn small" id="otherKeyBtn" type="button" style="margin-left:8px;">Use a different key</button></div>`;
  }
}
/* v59 (1 Oct 2026): this week's thumbs from the demos and the offer page,
   and the latest lines, under the courses. Read after the courses so a slow
   sheet never holds the console up. */
async function feedbackLine(){
  try {
    const r = await call({ op: 'feedbackSummary' });
    const host = $('app'); if (!host || !r) return;
    const w = r.week || { up: 0, down: 0, comments: 0 };
    const box = document.createElement('section'); box.className = 'fbline';
    box.innerHTML = `<h2>Feedback</h2><p class="lede">This week: <b>${w.up}</b> \uD83D\uDC4D \u00b7 <b>${w.down}</b> \uD83D\uDC4E \u00b7 <b>${w.comments}</b> comment${w.comments === 1 ? '' : 's'}${r.total ? ' \u00b7 ' + r.total + ' in all' : ''}. From the demos and the offer page; the sheet behind the store has every row.</p>`
      + ((r.latest || []).length ? '<ul>' + r.latest.map(x => `<li>${x.thumb === 'up' ? '\uD83D\uDC4D' : '\uD83D\uDC4E'} ${esc(x.text)} <small>${esc([x.page, x.course, x.role].filter(Boolean).join(' \u00b7 '))} \u00b7 ${esc(String(x.at).slice(0, 10))}</small></li>`).join('') + '</ul>' : '');
    host.appendChild(box);
  } catch (e) {}
}
/* THE MACHINERY FOR SENDING LITE TO SOMEBODY, folded away. Ramy, 5 Oct 2026:
   "the console is getting a bit crowded now, and we haven't even started yet."
   Three tall blocks sat above the courses -- the film engine, the card, the
   film link and the price -- and none of them is what you open the console
   for. Open or shut is remembered, because somebody sending cards all morning
   should not reopen it every time. */
const SEND_OPEN = 'hub:o:sending';
/* Which drawers this browser was left with open. Live is never in here: it is
   always open, because it is the reason the page exists. */
const SEC_OPEN = 'hub:o:sec:';
const STAT_OPEN = 'hub:o:stats';
function secOpen(k){ try { return localStorage.getItem(SEC_OPEN + k) === '1'; } catch (e) { return false; } }

function wireSections(){
  document.querySelectorAll('details.sec[data-sec]').forEach(d => {
    if (d.classList.contains('always')) {
      /* a summary that cannot close should not swallow the click either */
      d.querySelector('summary').addEventListener('click', e => e.preventDefault());
      return;
    }
    d.ontoggle = () => { try { localStorage.setItem(SEC_OPEN + d.dataset.sec, d.open ? '1' : '0'); } catch (e) {} };
  });

  /* THE FIND BOX hides cards where they stand rather than repainting, so what
     is typed keeps the cursor. */
  const f = $('findCourse');
  if (!f) return;
  const note = $('findNote');
  f.oninput = () => {
    const q = f.value.trim().toLowerCase();
    const cards = [...document.querySelectorAll('details.sec.live .course')];
    let shown = 0;
    cards.forEach(el => {
      const hit = !q || el.textContent.toLowerCase().includes(q);
      el.hidden = !hit;
      if (hit) shown++;
    });
    if (note) note.textContent = !q ? '' : shown ? `${shown} of ${cards.length}` : 'none of them';
  };
}

/* The one menu a live course keeps its Delete in. Opened one at a time, and a
   click anywhere else shuts it. */
document.addEventListener('click', e => {
  const tog = e.target.closest && e.target.closest('.moretog');
  document.querySelectorAll('.moreacts.on').forEach(m => { if (!tog || m !== tog.parentElement) m.classList.remove('on'); });
  if (tog) { tog.parentElement.classList.toggle('on'); e.stopPropagation(); }
});
function wireSending(){
  const d = $('sendblock');
  if (!d) return;
  try { d.open = localStorage.getItem(SEND_OPEN) === '1'; } catch (e) {}
  d.ontoggle = () => { try { localStorage.setItem(SEND_OPEN, d.open ? '1' : '0'); } catch (e) {} };
}

/* WHAT NEEDS YOU, at the top, before anything else. Ramy, 5 Oct 2026: "if we
   have like 20 courses running it'd be a lot of scrolling up and down to find
   out which course if there's something I need to do."

   Only things somebody has to DO go here. A demo that is behaving, a course
   running quietly, a contribution already marked done: none of them are news.
   When there is nothing, it says so in one quiet line -- an empty strip that
   still looks like an alarm teaches you to ignore it. */
function needsItems(){
  const out = [];
  if (INBOX) {
    const fresh = a => (a || []).filter(x => String(x.state || 'new') !== 'done').length;
    const c = fresh(INBOX.contributions), r = fresh(INBOX.reports);
    if (c) out.push({ t: `${c} set${c === 1 ? '' : 's'} to read`, go: 'inbox' });
    if (r) out.push({ t: `${r} thing${r === 1 ? '' : 's'} said`, go: 'inbox' });
  }
  (COURSES || []).forEach(x => {
    if (courseKind(x).k !== 'live') return;          // demos and scratch are nobody's homework
    const who = x.courseName || x.centreName || x.name;
    if (!x.trainees) out.push({ t: `${who} has no trainees yet`, go: 'course:' + x.id });
    else if (!x.start || !x.end) out.push({ t: `${who} has no dates yet`, go: 'course:' + x.id });
  });
  return out;
}

function drawNeeds(){
  const host = $('needs');
  if (!host) return;
  const items = needsItems();
  if (!items.length) {
    host.className = 'needs clear';
    /* INBOX is null until the piles have been read; saying "nothing waiting"
       before looking would be a lie that arrives first and sticks. */
    host.innerHTML = INBOX ? '<b>Needs you</b> nothing waiting.' : '<b>Needs you</b> looking\u2026';
    return;
  }
  host.className = 'needs';
  host.innerHTML = '<b>Needs you</b>' + items.map((x, i) =>
    (i ? '<span class="sep">\u00b7</span>' : '') +
    `<button type="button" data-go="${esc(x.go)}">${esc(x.t)}</button>`).join('');
  host.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const go = b.dataset.go;
    const el = go === 'inbox' ? document.querySelector('.inbox')
                              : document.getElementById(go.replace('course:', 'course-'));
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1400);
  });
}

/* WHAT THE PEOPLE USING LITE SENT (store v73, 5 Oct 2026). Ramy asked for the
   contributions and the reports on the console rather than only in the mail.
   Read after the courses, like the feedback line, so a slow sheet never holds
   the console up. Done marks the row; Delete removes it, which is how the test
   rows went. */
let INBOX = null, INBOX_ALL = false;

async function inbox(){
  try {
    const r = await call({ op: 'inbox' });
    INBOX = r;
    drawInbox();
  } catch (e) { /* an older store has no inbox op; the console is still a console */ }
}

function drawInbox(){
  const host = $('app'); if (!host || !INBOX) return;
  let box = document.querySelector('.inbox');
  if (!box) { box = document.createElement('section'); box.className = 'inbox'; host.appendChild(box); }
  const C = INBOX.contributions || [], R = INBOX.reports || [];
  /* FIVE AT A TIME. Ramy, 5 Oct 2026: "if they start stacking up it'll be like
     stacks of TP points, contributions." The sheet has every row and the
     console is for the next few. */
  const CAP = 5;
  const showC = INBOX_ALL ? C : C.slice(0, CAP), showR = INBOX_ALL ? R : R.slice(0, CAP);
  const hidden = (C.length - showC.length) + (R.length - showR.length);
  const fresh = x => String(x.state || 'new') !== 'done';
  const newC = C.filter(fresh).length, newR = R.filter(fresh).length;
  const when = at => String(at || '').slice(0, 16).replace('T', ' ');

  const row = (sheet, at, tag, cls, head, meta, state) => `<div class="inrow${state === 'done' ? ' done' : ''}">
      <span class="intag ${cls}">${esc(tag)}</span>
      <div class="body">${head}<small class="meta">${esc(meta)}</small></div>
      <div class="acts">
        ${sheet === 'contributions' ? `<button type="button" class="btn small" data-read="${esc(at)}">Read it</button>` : ''}
        ${state === 'done' ? '' : `<button type="button" class="btn small" data-in="done|${esc(sheet)}|${esc(at)}">Done</button>`}
        <button type="button" class="btn small" data-in="drop|${esc(sheet)}|${esc(at)}">Delete</button>
      </div></div>`;

  box.innerHTML = `<h2>From the people using it</h2>
    <p class="lede">${newC ? `<b>${newC}</b> set${newC === 1 ? '' : 's'} offered to the TP points library` : 'No sets waiting'} \u00b7 ${
      newR ? `<b>${newR}</b> thing${newR === 1 ? '' : 's'} said` : 'nothing said'
    }. ${INBOX.sheet ? `<a href="${esc(INBOX.sheet)}" target="_blank" rel="noopener">The sheet behind the store</a> has every row.` : ''}</p>
    ${showC.length ? showC.map(c => row('contributions', c.at, 'set', 'set',
        `<b>${esc(c.book || 'Untitled')}</b> \u2014 contributed by <b>${esc(c.by || '')}</b>` +
        (c.file ? ` \u00b7 <a href="${esc(c.file)}" target="_blank" rel="noopener">the file</a>` : ''),
        [c.level, (c.lessons || 0) + ' lessons', (c.stages || 0) + ' stages', c.centre, when(c.at)].filter(Boolean).join(' \u00b7 '),
        c.state)).join('') : '<p class="inempty">Nobody has offered a set yet.</p>'}
    ${showR.length ? '<div style="margin-top:16px"></div>' + showR.map(x => row('reports', x.at,
        x.kind === 'wrong' ? 'wrong' : 'idea', x.kind === 'wrong' ? 'wrong' : 'idea',
        esc(x.text || ''),
        [x.page, x.where, x.role, x.course, when(x.at)].filter(Boolean).join(' \u00b7 '),
        x.state)).join('') : ''}
    ${hidden ? `<button type="button" class="inmore" id="inmore">Show the other ${hidden}</button>`
             : (INBOX_ALL && (C.length + R.length) > CAP ? '<button type="button" class="inmore" id="inless">Show fewer</button>' : '')}`;

  drawNeeds();                       // the counts at the top come from this
  const more = $('inmore'); if (more) more.onclick = () => { INBOX_ALL = true; drawInbox(); };
  const less = $('inless'); if (less) less.onclick = () => { INBOX_ALL = false; drawInbox(); };
  box.querySelectorAll('[data-read]').forEach(b => b.onclick = async () => {
    const row = (INBOX.contributions || []).find(c => String(c.at) === b.dataset.read);
    if (!row || !row.file) { alert('That row has no file on it.'); return; }
    b.disabled = true; b.textContent = 'Opening\u2026';
    try { showSet(await call({ op: 'readContribution', file: row.file }), row); }
    catch (e) { alert(e.message || e); }
    b.disabled = false; b.textContent = 'Read it';
  });
  box.querySelectorAll('[data-in]').forEach(b => b.onclick = async () => {
    const [what, sheet, at] = b.dataset.in.split('|');
    if (what === 'drop' && !confirm('Delete this row? It does not come back.')) return;
    b.disabled = true; b.textContent = what === 'drop' ? 'Deleting\u2026' : 'Saving\u2026';
    try {
      await call({ op: 'inboxRow', sheet, at, drop: what === 'drop' ? true : undefined,
                   state: what === 'done' ? 'done' : undefined });
      await inbox();
    } catch (e) { b.disabled = false; b.textContent = what === 'drop' ? 'Delete' : 'Done'; alert(e.message || e); }
  });
}
/* NUMBERS ACROSS EVERY COURSE (store v75, 5 Oct 2026). Ramy: "it's not much of
   a stat if it's only my courses ... nothing that is like snooping in their
   business." The store does the counting and hands back counts; there is no op
   that returns a name, and this draws nothing it was not given. Demos, scratch
   courses and the records-kept-as-courses are not in it. */
async function stats(){
  try { drawStats((await call({ op: 'stats' }))); } catch (e) { /* an older store has none */ }
}

function drawStats(S){
  /* ABOVE THE COURSES since 5 Oct 2026. Ramy: "move the stats above the
     courses." It is the how-are-things-going view and the courses are the
     what-do-I-do-today one, so it reads first -- but it folds, and open or
     shut is remembered, so it never costs a scroll on a day he only wants a
     course's links. */
  const slot = $('statsslot'); if (!slot || !S) return;
  let box = slot.querySelector('.stats');
  if (!box) { box = document.createElement('section'); box.className = 'stats'; slot.appendChild(box); }
  const c = S.courses || {}, p = S.candidates || {};

  if (!c.total) {
    box.innerHTML = `<h2>Across every course</h2>
      <p class="lede quiet">Nothing yet: every course on the store today is a demo, a scratch course or a record. These fill as real centres run real courses.</p>`;
    return;
  }

  const fig = (n, w) => `<div class="fig"><b>${n}</b><span>${w}</span></div>`;
  const row = (label, n, of, cls, extra) => `<div class="row2${cls ? ' ' + cls : ''}">
      <i>${esc(label)}</i><span class="t" style="width:${of ? Math.round((n / of) * 100) : 0}%"></span>
      <b>${n}${extra || ''}</b></div>`;

  /* Every panel decides for itself whether it has anything to say; one that
     does not is left out rather than printed empty. */
  const panels = [];
  const add = (id, title, tone, say, body) => { if (body) panels.push({ id, title, tone, say, body }); };

  add('volume', 'The year so far', '', 'Demos and scratch courses are not counted.',
    `<div class="figs">${fig(c.total, 'courses')}${fig(S.centres || 0, S.centres === 1 ? 'centre' : 'centres')}
      ${fig(p.total || 0, 'candidates')}${fig(c.running || 0, 'running today')}
      ${fig(S.volunteers || 0, 'volunteer students')}</div>`);

  /* A grade chart of three people is those three people. */
  const g = (S.grades || {}).final || {};
  const gTot = Object.values(g).reduce((a, b) => a + b, 0);
  const ORDER = ['PASS A', 'PASS B', 'PASS', 'FAIL', 'WITHDRAWN', 'EXTENSION', 'DEFERRAL'];
  add('grades', 'Grades', 'gold',
    gTot >= 10 ? `${p.graded || 0} of ${p.total || 0} candidates have a final grade.`
               : 'Held back until ten final grades — a spread of three people is those three people.',
    gTot >= 10 ? `<div class="rows">${ORDER.filter(k => g[k]).map(k =>
      row(k.toLowerCase(), g[k], gTot, k === 'FAIL' ? 'b' : 'g')).join('')}</div>` : ' ');

  const a = S.assignments || {};
  const aTot = (a.passed || 0) + (a.passedOnResubmission || 0) + (a.failed || 0);
  add('written', 'Written work', 'gold',
    'A resubmission rate that climbs is first drafts going out too early.',
    aTot ? `<div class="rows">${row('passed', a.passed || 0, aTot, 'g')}
      ${row('on resubmission', a.passedOnResubmission || 0, aTot, 'g')}
      ${row('not passed', a.failed || 0, aTot, 'b')}</div>` : '');

  const at = S.attendance || {};
  add('missed', 'Days missed', 'brick',
    'Recorded by tutors on CELTA 5, one row a day.',
    at.absences ? `<div class="figs">${fig(at.absences, 'absences')}
      ${fig(at.candidatesWithAbsence, `candidates${p.total ? ` — ${Math.round((at.candidatesWithAbsence / p.total) * 100)}%` : ''}`)}
      ${fig(Math.round((at.madeUp / at.absences) * 100) + '%', 'made up')}</div>` : '');

  const m = S.mode || {}, l = S.length || {}, co = S.cohort || {};
  const modes = (m.f2f || 0) + (m.online || 0) + (m.mixed || 0);
  const lens = (l.intensive || 0) + (l.extended || 0);
  const wk = (l.weeks || []).slice().sort((x, y) => x - y);
  add('shape', 'The shape of a course', 'sand',
    'Full-time and part-time are not recorded anywhere, so intensive is read off the dates: six weeks or less.',
    (co.courses || modes) ? `<div class="figs">
      ${co.courses ? fig((co.candidates / co.courses).toFixed(1), `candidates a course${co.smallest != null ? ` — ${co.smallest} to ${co.largest}` : ''}`) : ''}
      ${wk.length ? fig(wk[Math.floor(wk.length / 2)], 'weeks, typically') : ''}</div>
      <div class="rows">${lens ? row('intensive', l.intensive, lens) + row('extended', l.extended, lens) : ''}
      ${modes ? row('face-to-face', m.f2f, modes) + row('online', m.online, modes) + row('mixed mode', m.mixed, modes) : ''}</div>` : '');

  /* WHAT IS BEING USED, and what anybody said about it. A part nobody uses and
     nobody mentions can go; a part nobody uses that everybody complains about
     is broken, not unwanted. The two numbers belong side by side. */
  const F = S.features || {};
  const fk = Object.keys(F).sort((x, y) => F[y].courses - F[x].courses || x.localeCompare(y));
  add('used', 'What is being used', '', `Out of ${c.total} course${c.total === 1 ? '' : 's'}. The gold figure is how many people said something about it.`,
    fk.length ? `<div class="rows">${fk.map(k => row(k, F[k].courses, c.total, '',
      F[k].said ? ` <span class="said">${F[k].said} said</span>` : '')).join('')}</div>` : '');

  const d = S.perCentre || {};
  const dk = Object.keys(d).map(Number).filter(n => n > 0).sort((x, y) => x - y);
  const dTop = dk.length ? Math.max(...dk.map(k => d[k])) : 0;
  add('centres', 'Courses per centre', 'sand', 'How many centres ran how many. No centre is named.',
    dk.length > 1 ? `<div class="rows">${dk.map(k =>
      row(`${k} course${k === 1 ? '' : 's'}`, d[k], dTop)).join('')}</div>` : '');

  const pool = S.pool || {};
  add('pool', 'The TP points library', 'gold', 'Sets offered to the library, and the names on them.',
    pool.sets ? `<div class="figs">${fig(pool.sets, pool.sets === 1 ? 'set offered' : 'sets offered')}
      ${fig(pool.contributors, pool.contributors === 1 ? 'contributor' : 'contributors')}</div>` : '');

  const by = S.byMonth || {}, mk = Object.keys(by).sort().slice(-12);
  const mTop = mk.length ? Math.max(...mk.map(k => by[k].courses)) : 0;
  const nice = k => { const [y, mm] = k.split('-');
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][(+mm) - 1] + ' ' + y.slice(2); };
  add('months', 'Courses started', '', 'By the month they began, so a quiet August shows up as one.',
    mk.length > 1 ? `<div class="months">${mk.map(k => `<div class="m" title="${esc(nice(k))}: ${by[k].courses} course${by[k].courses === 1 ? '' : 's'}, ${by[k].candidates} candidates">
      <b>${by[k].courses}</b><span class="t" style="height:${Math.max(2, Math.round((by[k].courses / mTop) * 54))}px"></span>
      <i>${esc(nice(k))}</i></div>`).join('')}</div>` : '');

  box.innerHTML = `<details class="statwrap" id="statblock"><summary><h2>Across every course</h2>
    <small>${c.total} course${c.total === 1 ? '' : 's'} \u00b7 ${S.centres || 0} centre${S.centres === 1 ? '' : 's'} \u00b7 ${p.total || 0} candidates</small></summary>
    <p class="lede">Counts only. Centres are counted, never named, and no outcome is attached to one.</p>
    <div class="jump">${panels.map(x => `<button type="button" data-jump="${x.id}">${esc(x.title)}</button>`).join('')}</div>
    <div class="panels">${panels.map(x => `<section class="panel ${x.tone}${x.id === 'used' || x.id === 'months' ? ' wide' : ''}" id="st-${x.id}">
      <h3>${esc(x.title)}</h3><p class="say${x.body === ' ' ? ' quiet' : ''}">${esc(x.say)}</p>${x.body}</section>`).join('')}</div></details>`;

  /* `d` is already the per-centre table a few lines up in this function. */
  const drawer = $('statblock');
  if (drawer) {
    try { drawer.open = localStorage.getItem(STAT_OPEN) !== '0'; } catch (e) { drawer.open = true; }
    drawer.ontoggle = () => { try { localStorage.setItem(STAT_OPEN, drawer.open ? '1' : '0'); } catch (e) {} };
  }

  box.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
    const el = document.getElementById('st-' + b.dataset.jump);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1400);
  });
}

/* THE SET ITSELF, not the file. Ramy, 5 Oct 2026, having clicked through to a
   Drive file and found JSON. A contributed set is read the way ours are read:
   the aim, then the stages against the clock, with the watch notes where they
   belong. */
function showSet(got, row){
  const S = (got && got.set) || {};
  const ids = Object.keys(S.sessions || {}).sort();
  let slots = 0, stages = 0;
  ids.forEach(k => (S.sessions[k].slots || []).forEach(sl => {
    if (sl.type || sl.aim) slots++; stages += (sl.stages || []).length;
  }));

  const stage = st => `<div class="rstage"><span class="mn">${st.minutes || ''}</span>
      <span><span class="nm">${esc(st.name || '')}</span>${
        st.interaction ? `<span class="ia">${esc(st.interaction)}</span>` : ''}
        ${st.todo ? '<br>' + esc(st.todo) : ''}
        ${st.avoid ? `<span class="av">watch: ${esc(st.avoid)}</span>` : ''}</span></div>`;

  const slot = (sl, i) => `<div class="rslot">
      <span class="ty">${esc(sl.type || 'no type')}</span><b>Lesson ${i + 1}</b>
      ${sl.shape ? ` <small style="color:var(--grey)">${esc(sl.shape)}</small>` : ''}
      <p class="aim">${esc(sl.aim || '')}</p>
      ${sl.sub ? `<p class="sub">Sub aim: ${esc(sl.sub)}</p>` : ''}
      ${sl.pages ? `<p class="src">${esc(sl.pages)}</p>` : ''}
      ${sl.tracks ? `<p class="src">${esc(String(sl.tracks).split('\n').join(' \u00b7 '))}</p>` : ''}
      ${(sl.stages || []).length ? (sl.stages || []).map(stage).join('')
        : '<p class="bare">No stages — the trainee writes them.</p>'}
    </div>`;

  const back = document.createElement('div');
  back.className = 'readback';
  back.innerHTML = `<div class="readbox">
    <h2>${esc(S.book || 'Untitled set')}</h2>
    <p class="by">Contributed by ${esc(S.by || (row && row.by) || '')}</p>
    <p class="ct">${esc(S.level || '')} \u00b7 ${slots} lessons \u00b7 ${stages} stages \u00b7 ${
      esc(String(S.minutes || 45))} minutes a slot${got.name ? ' \u00b7 ' + esc(got.name) : ''}</p>
    ${ids.map(k => `<section class="rsess"><p class="sh">TP ${esc(k)}${
        S.sessions[k].context ? ' \u2014 ' + esc(S.sessions[k].context) : ''}</p>
      ${(S.sessions[k].slots || []).map(slot).join('')}</section>`).join('')}
    <div class="say-acts" style="margin-top:16px"><button type="button" class="btn" id="readclose">Close</button>
      ${row && row.file ? `<a class="btn quiet" href="${esc(row.file)}" target="_blank" rel="noopener">The file in Drive</a>` : ''}</div>
  </div>`;
  document.body.appendChild(back);
  const shut = () => back.remove();
  back.onclick = e => { if (e.target === back) shut(); };
  back.querySelector('#readclose').onclick = shut;
  document.addEventListener('keydown', function off(e){ if (e.key === 'Escape') { shut(); document.removeEventListener('keydown', off); } });
}
load();
</script>
</body>
</html>
