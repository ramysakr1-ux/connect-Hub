<!DOCTYPE html>
<!--
  Connect Lite — the owner console
  © 2026 Ramy Sakr. All rights reserved.

  Ramy's own screen, behind the owner key. Rewritten 25 Oct 2026 (Ramy, the night
  before: "I really don't like the new console. I just don't like the design ...
  we all need the important stuff in there"). What it is for, in order:

    1. The demo: the one course every card points at, and its four doors.
    2. Sending Lite to someone: the card, the film, or the price, as an email.
    3. The live courses: a real centre's, with its links and the message to send.
    4. Making a course.

  Everything else (earlier courses, old demos, the bin, the inbox, the film link,
  the rates, the transcription key) is still here, under the fold; the TP point
  library is one link, because it is not a course. What left: the
  statistics room, the film engine, the "three demos" machinery, the needs strip,
  the ticket book and the three other shapes a course card used to take.

  Not a course page: it does not load hub-sync; it talks to the store with the
  owner secret. The notebook look comes from hub-tokens.css and hub-house.css;
  the rules below are this page's own.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon-console.png">
<link rel="manifest" href="manifest-console.webmanifest">
<meta name="theme-color" content="#1E3B2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lite Courses">
<title>Connect Lite — Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Karla:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub-tokens.css?v=202610281033">
<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:0 20px 70px;}
  .board{max-width:980px; margin:0 auto;}
  a{color:var(--a-forest, var(--teal));}

  .chrome{display:flex; align-items:center; justify-content:space-between; gap:24px; height:64px;}
  .lockup{display:flex; align-items:center; gap:9px;}
  .lockup .tile{width:30px; height:30px; border-radius:7px; background:var(--ink-warm);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .lockup .word{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:21px;
    line-height:0.85; letter-spacing:-0.012em; color:var(--gold);}
  .hub-pair{display:inline-flex; align-items:baseline; gap:4px;}
  .hub-word{font-family:'Instrument Sans','Karla',sans-serif; font-weight:600; font-size:8px;
    letter-spacing:0.24em; text-transform:uppercase; color:var(--ink); line-height:1; margin-left:1px;}
  .role{font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:600;
    letter-spacing:0.22em; text-transform:uppercase; color:var(--grey);}

  /* the page: a red eyebrow, a big serif, one line */
  .title{padding:22px 0 4px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .eyebrow{margin:0 0 4px; font-family:'Instrument Sans','Karla',sans-serif; font-size:11px; font-weight:600;
    letter-spacing:.22em; text-transform:uppercase; color:var(--a-red, var(--brick));}
  .title h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:2.2rem; line-height:1.1;}
  .title p{margin:6px 0 0; font-size:0.92rem; color:var(--grey);}
  .title .acts{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}

  .btn{font-family:'Karla',sans-serif; font-size:0.84rem; font-weight:600; height:36px; padding:0 15px;
    border-radius:8px; border:0; background:var(--paper); color:var(--ink); cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    box-shadow:var(--nb-shadow); text-decoration:none; white-space:nowrap;}
  .btn.primary{background:var(--a-forest, var(--teal)); color:#F0EEE9; font-weight:700;}
  .btn.small{height:32px; font-size:0.8rem; padding:0 12px;}
  .btn.quiet{background:none; box-shadow:none; color:var(--grey); font-weight:600;}
  .btn.quiet:hover{color:var(--ink);}
  .btn.danger{color:var(--a-red, var(--brick));}
  .linkbtn{font-family:'Karla',sans-serif; font-size:0.84rem; font-weight:600; border:none; background:none;
    color:var(--a-forest, var(--teal)); cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:3px;}

  /* a section: a small heading, then white cards */
  .sec{margin:30px 0 0;}
  .sec > h2{font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.25rem; margin:0 0 4px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .sec > h2 small{font-family:'Karla',sans-serif; font-weight:400; font-size:0.8rem; color:var(--grey);}
  .cards{display:flex; flex-direction:column; gap:12px; margin-top:12px;}
  .door .sendrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .passsel{font-size:0.8rem; color:var(--grey); display:inline-flex; align-items:center; gap:6px;}
  .passsel select{font:600 0.8rem 'Karla',sans-serif; padding:4px 8px; border-radius:8px; border:1.5px solid var(--sand-line); background:var(--field); color:var(--ink);}
  .door .sendrow .linkbtn{font-size:0.8rem;}
  .card{background:var(--paper); border-radius:14px; box-shadow:var(--nb-shadow); padding:18px 20px;}

  /* THE DEMO: a forest cover with the arcs ghosted in, its doors on the paper under it */
  .demo{overflow:hidden; padding:0;}
  .demo .cover{position:relative; overflow:hidden; background:var(--a-forest, var(--teal)); color:#F0EEE9; padding:22px 24px 20px;
    background-image:radial-gradient(900px 300px at 20% -80%, rgba(255,255,255,.14), transparent 60%);}
  .demo .cover svg.big{position:absolute; right:-90px; top:-60px; width:320px; height:auto; opacity:.12; pointer-events:none; transform:rotate(-8deg);}
  .demo .cover > *:not(.big){position:relative;}
  .demo .cover .eyebrow{color:rgba(240,238,233,.72); margin-bottom:6px;}
  .demo .cover h3{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.55rem; line-height:1.15; color:#fff;}
  .demo .cover p{margin:6px 0 0; font-size:0.9rem; color:rgba(240,238,233,.82);}
  .demo .doors{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; padding:16px 20px 6px;}
  .door{display:flex; flex-direction:column; gap:4px; padding:12px 14px; border-radius:10px; background:var(--a-stone, var(--sand-deep));}
  .door b{font-size:0.92rem;}
  .door span{font-size:0.78rem; color:var(--grey); line-height:1.45; flex:1;}
  .door button{margin-top:8px; align-self:flex-start;}
  .demo .foot{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:10px 20px 16px; font-size:0.8rem; color:var(--grey);}
  .demo .foot .right{margin-left:auto; display:inline-flex; gap:12px; align-items:center;}

  /* SENDING: one row that does the whole job */
  .send .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px;}
  .send input[type=email], .send select, .send textarea, .send input[type=url], .send input[type=text], .send input[type=password]{
    font:inherit; font-size:0.88rem; padding:8px 11px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:var(--ink);}
  .send input[type=email]{flex:1 1 220px; min-width:180px;}
  .send select{padding-right:28px;}
  .send textarea{width:100%; min-height:120px; line-height:1.55; margin-top:8px;}
  .send details{margin-top:10px;}
  .send summary{cursor:pointer; font-size:0.84rem; font-weight:600; color:var(--a-forest, var(--teal)); list-style:none;}
  .send summary::-webkit-details-marker{display:none;}
  .send summary::before{content:'\25B8  '; color:var(--faint);}
  .send details[open] summary::before{content:'\25BE  ';}
  .send .note{font-size:0.78rem; color:var(--grey); margin:6px 0 0;}
  .send .acts{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:10px;}
  .send h3{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.1rem;}

  /* A LIVE COURSE: one row, the name and the centre, what you copy, then the facts */
  .row-course{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;}
  .row-course .name{flex:1 1 260px; min-width:0;}
  .row-course .name b{display:block; font:600 1.1rem/1.25 'Newsreader',Georgia,serif;}
  .row-course .name small{display:block; margin-top:2px; font-size:0.8rem; color:var(--grey);}
  .row-course .acts{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .facts{flex:1 1 100%; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin:4px 0 0; font-size:0.78rem; color:var(--grey);}
  .facts .right{margin-left:auto; display:inline-flex; gap:10px; align-items:center;}
  .state{font-family:'Instrument Sans','Karla',sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--grey);}
  .state.running{color:var(--a-forest, var(--teal));}
  .state.todo{color:var(--a-red, var(--brick));}
  .state.new{color:var(--a-mustard, var(--a-mustard));}
  .card.new{box-shadow:var(--nb-shadow), inset 0 0 0 2px var(--a-mustard, var(--a-mustard));}
  .card.bin{opacity:.72;}
  /* THE LIBRARY'S DOOR. Ramy, 27 Oct 2026: "make the TP points library in the console distinct ... give it its own look";
     "settings and TP points library should be different ... a pill or something, different color". Not a course and
     not a fold: a pill of its own, in the butter the notebook keeps for what is ours, under the live courses. */
  .libdoor{display:flex; align-items:center; gap:14px; margin:26px 0 0; padding:10px 12px 10px 10px; max-width:620px;
    border-radius:999px; background:var(--a-lemon, var(--gold-wash)); color:var(--a-forest, var(--teal)); text-decoration:none;
    box-shadow:var(--nb-shadow, none); transition:transform .15s ease, box-shadow .15s ease;}
  .libdoor:hover{transform:translateY(-1px);}
  .libdoor .lib-ic{flex:none; width:42px; height:42px; border-radius:50%; background:var(--a-forest, var(--teal)); color:var(--a-gold-ink, var(--gold-wash));
    display:grid; place-items:center;}
  .libdoor .lib-tx{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .libdoor .lib-tx b{font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.12rem; line-height:1.2;}
  .libdoor .lib-tx small{font-size:0.8rem; color:var(--ink); opacity:.72;}
  .libdoor .lib-go{flex:none; margin-left:auto; background:var(--a-forest, var(--teal)); color:var(--paper); border-radius:999px; padding:8px 18px;
    font-size:0.84rem; font-weight:600;}
  @media (max-width:520px){ .libdoor{border-radius:22px;} .libdoor .lib-go{padding:7px 13px;} }
  /* THE CONNECT DEMO (27 Oct 2026): a fresh course for a presentation, or one to send for a day or two. */
  .pdcard{background:var(--surface); border-radius:var(--r-card, 14px); box-shadow:var(--nb-shadow, none); padding:0 20px 18px; overflow:hidden; border-top:5px solid var(--a-mustard, var(--gold));}
  .pdcard h2{font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.2rem; margin:16px 0 4px;}
  .pdcard p.lede{margin:0 0 14px; color:var(--grey); font-size:0.88rem; max-width:70ch;}
  .pdcard .pd-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:0 0 12px;}
  .pdcard .pd-row b{font-family:'Newsreader',Georgia,serif; font-size:1.02rem;}
  .pdcard .pd-row small{color:var(--grey);}
  .pdcard input[type=text], .pdcard select{font:inherit; font-size:0.88rem; padding:8px 11px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:var(--ink);}
  .pdcard .pd-list{border-top:1px solid var(--row-line, var(--sand-line)); margin-top:6px; padding-top:10px;}
  .pdcard .pd-v{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:6px 0; font-size:0.86rem;}
  .card.bin .name b{text-decoration:line-through; text-decoration-color:var(--grey); text-decoration-thickness:1px;}
  code{font-family:'Karla',sans-serif; font-size:0.78rem; color:var(--grey);}
  .addr{flex:1 1 100%; font-size:0.74rem; word-break:break-all; color:var(--grey);}

  /* the ⋯ menu: the only place Delete lives on a live course */
  .more{position:relative; display:inline-block;}
  .more > button{font:700 1rem/1 inherit; background:var(--a-stone, var(--sand-deep)); border:0; cursor:pointer; color:var(--ink); padding:7px 12px; border-radius:999px;}
  .more .menu{position:absolute; right:0; top:100%; z-index:40; background:var(--paper); border-radius:10px; padding:6px; min-width:240px; box-shadow:0 10px 30px rgba(0,0,0,.16); display:none;}
  .more.on .menu{display:block;}
  .more.up .menu{top:auto; bottom:100%; margin-bottom:6px;}
  .card.menu-open{position:relative; z-index:60;}
  .more .menu button{display:block; width:100%; text-align:left; font:600 .86rem/1.3 inherit; background:none; border:0; padding:10px 10px; border-radius:7px; cursor:pointer; color:var(--ink);}
  .more .menu button.danger{color:var(--a-red, var(--brick));}
  .more .menu button:hover{background:var(--a-stone, var(--sand-deep));}

  /* make a course */
  .make{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px;}
  .make input{font:inherit; font-size:0.88rem; padding:8px 11px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:var(--ink); flex:1 1 220px;}
  .make .note{flex:1 1 100%; font-size:0.78rem; color:var(--grey);}
  .make[hidden]{display:none;}

  /* under the fold: the inbox, the pages, the old demos, the settings */
  details.fold{margin:26px 0 0;}
  details.fold > summary{cursor:pointer; list-style:none; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.1rem; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  details.fold > summary::-webkit-details-marker{display:none;}
  /* Each fold wears a round icon, filled when it is open (Ramy, 27 Oct 2026: "that bottom part needs a bit of
     redesign, cleaning up"; "From the people using it ... give it a picture of someone"; the bin "just make it
     look like ... a trash can. That opens"). */
  .fic{flex:none; position:relative; width:36px; height:36px; border-radius:50%; display:grid; place-items:center;
    background:var(--a-stone, var(--sand-deep)); color:var(--a-forest, var(--teal)); transition:background .15s ease, color .15s ease;}
  details.fold[open] > summary .fic{background:var(--a-forest, var(--teal)); color:var(--paper);}
  .fic .dot{position:absolute; top:-4px; right:-5px; min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    background:var(--a-red, var(--brick)); color:var(--paper); font:700 .66rem/18px 'Karla',sans-serif; text-align:center;}
  .fic .dot[hidden]{display:none;}
  .vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
  /* the bin sits at the foot, on its own, as a bin */
  details.binfold{margin:40px 0 0;}
  details.binfold > summary{justify-content:flex-end;}
  details.binfold > summary .fic{width:42px; height:42px;}
  .binnote{margin:12px 0 0; font-size:0.84rem; color:var(--grey);}
  .binnote b{font-family:'Newsreader',Georgia,serif; font-size:1.05rem; color:var(--ink); margin-right:6px;}
  details.fold > summary small{font-family:'Karla',sans-serif; font-weight:400; font-size:0.8rem; color:var(--grey);}
  details.fold > summary .count{margin-left:4px; font-family:'Karla',sans-serif; font-size:.74rem; font-weight:700; color:#fff; background:var(--a-forest, var(--teal)); border-radius:999px; padding:2px 8px;}
  details.fold > .card, details.fold > .cards{margin-top:12px;}
  .inrow{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-top:1px solid var(--sand-line);}
  .inrow:first-child{border-top:0;}
  .inrow.done{opacity:.5;}
  .inrow .body{flex:1 1 auto; min-width:0; font-size:0.9rem;}
  .inrow .meta{display:block; font-size:.76rem; color:var(--grey); margin-top:2px;}
  .inrow .iacts{display:flex; gap:6px; flex:0 0 auto;}
  .intag{font-size:.62rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; padding:3px 8px; border-radius:7px; flex:0 0 auto; margin-top:3px; background:var(--a-stone, var(--sand-deep)); color:var(--grey);}
  .intag.wrong{background:var(--a-red, var(--brick)); color:#fff;}
  .intag.set{background:var(--a-forest, var(--teal)); color:#F0EEE9;}
  .setting{display:grid; grid-template-columns:180px 1fr; gap:8px 16px; align-items:center; padding:12px 0; border-top:1px solid var(--sand-line); font-size:0.88rem;}
  .setting:first-child{border-top:0;}
  .setting label{font-weight:700; font-size:0.82rem;}
  .setting .v{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .setting input{font:inherit; font-size:0.86rem; padding:7px 10px; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:var(--ink);}
  .setting input.rate{width:110px;}
  .setting input.wide{flex:1 1 280px;}
  .setting .note{flex:1 1 100%; font-size:0.76rem; color:var(--grey);}
  .empty{padding:30px 4px; font-size:0.9rem; color:var(--grey); line-height:1.65;}
  .gate{max-width:560px; padding:14vh 0 0;}
  .gate h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.9rem; margin:0 0 10px;}
  .gate p{font-size:0.92rem; line-height:1.65; color:var(--grey); margin:0;}
  .gate input{font:inherit; font-size:0.9rem; padding:0 12px; height:36px; min-width:280px; flex:1; border:1.5px solid var(--sand-line); border-radius:8px; background:var(--paper); color:var(--ink);}
  #status{margin-top:14px; font-size:0.84rem; color:var(--grey); min-height:1.2em;}
  @keyframes wordmark-spin{0%,11.11%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
  .wordmark-spin{animation:wordmark-spin 90s linear infinite; transform-origin:50% 50%; transform-style:preserve-3d;}
  @media(prefers-reduced-motion:reduce){ .wordmark-spin{animation:none;} }

  /* reading a contributed set */
  .readback{position:fixed; inset:0; z-index:9500; background:rgba(28,26,22,.42); display:flex; align-items:flex-start; justify-content:center; padding:22px 16px; overflow:auto;}
  .readbox{background:var(--paper); border-radius:14px; width:min(880px,100%); padding:22px 24px 26px; box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .readbox h2{font-family:'Newsreader',Georgia,serif; font-size:1.45rem; margin:0 0 2px;}
  .readbox .by{color:var(--a-forest, var(--teal)); font-weight:600; font-size:.88rem; margin:0 0 2px;}
  .readbox .ct{color:var(--grey); font-size:.8rem; margin:0 0 16px;}
  .rsess{border-top:1px solid var(--sand-line); padding:13px 0 2px;}
  .rsess .sh{font-size:.68rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--a-red, var(--brick)); margin:0 0 6px;}
  .rslot{margin:0 0 15px;} .rslot .ty{font-size:.66rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; background:var(--a-stone, var(--sand-deep)); color:var(--grey); border-radius:7px; padding:3px 9px; margin-right:7px;}
  .rslot .aim{font-size:.92rem; margin:7px 0 2px;} .rslot .sub, .rslot .src{font-size:.8rem; color:var(--grey); margin:0;}
  .rstage{display:grid; grid-template-columns:34px 1fr; gap:9px; font-size:.84rem; padding:5px 0 5px 2px; border-top:1px dotted var(--sand-line);}
  .rstage .mn{color:var(--a-forest, var(--teal)); font-weight:700; text-align:right;} .rstage .nm{font-weight:700;} .rstage .ia{color:var(--faint); font-weight:400; font-size:.76rem; margin-left:6px;}
  .rstage .av{color:var(--a-red, var(--brick)); font-size:.8rem; display:block; margin-top:1px;} .readbox .bare{font-size:.82rem; color:var(--faint); margin:4px 0 0;}

  @media (max-width:760px){ .demo .doors{grid-template-columns:1fr 1fr;} .setting{grid-template-columns:1fr;} }
  @media (max-width:520px){ .demo .doors{grid-template-columns:1fr;} .title h1{font-size:1.8rem;} body{padding:0 14px 60px;} .card{padding:16px;} .row-course .acts .btn{flex:1 1 auto; justify-content:center;} }
</style>

          <path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="var(--gold-lifted)" stroke-width="13" stroke-linecap="round"></path>

<script src="hub-card-mail.js?v=202610281033"></script>
<script>
/* The owner key rides in ?o= the first time and is kept in this browser after. */
const OWNER_STORE = 'hub:o';
let NEW_ID = '';
const params = new URLSearchParams(location.search);
try { if (params.get('o')) { localStorage.setItem(OWNER_STORE, params.get('o')); history.replaceState(null, '', location.pathname); } } catch (e) {}
function ownerKey(){ try { return localStorage.getItem(OWNER_STORE) || ''; } catch (e) { return ''; } }

const $ = id => document.getElementById(id);
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const base = () => location.origin + location.pathname.replace(/[^/]*$/, '');
const call = body => HubStore.call(Object.assign({ owner: ownerKey() }, body));

/* A date, read as written: `created` is a timestamp, and reading it as an instant moves
   it a day east of the store. */
function niceDate(iso){
  const s = String(iso == null ? '' : iso), m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s);
  if (isNaN(d)) return '';
  try { return d.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }); } catch (e) { return ''; }
}
function shortDate(iso){ return niceDate(iso).replace(/ \d{4}$/, ''); }
function label(c){ if (c.courseName && c.centreName) return c.courseName + ' · ' + c.centreName; return c.courseName || c.centreName || c.name || c.id; }
function status(msg){ const s = $('status'); if (!s) return; s.textContent = msg || ''; if (/…$|\.\.\.$/.test(msg || '') && window.hubSpinner) s.insertAdjacentHTML('afterbegin', hubSpinner(16) + ' '); }

/* ---- what is kept in this browser: the film, the rates, the letters, the card's look ---- */
const FILM_KEY = 'chub:filmlink', RATES_KEY = 'chub:rates', CARD_CC_KEY = 'chub:cardCopyTo', CARD_KIND_KEY = 'chub:cardKind', CARD_STYLE_KEY = 'chub:cardStyle', NOTE_KEY = 'chub:demoNote', URLS_KEY = 'hub:o:urls';
const RATE_ROWS = [['one', 1, 'One course'], ['five', 5, 'Five courses'], ['ten', 10, 'Ten courses'], ['twenty', 20, 'Twenty courses']];
const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
/* The agreed figures (Ramy, 24 Oct 2026) are the defaults, so a price card never goes out without them; a figure typed under Settings wins. */
const RATES_DEFAULT = { one: '240', five: '1000', ten: '1750', twenty: '3200' };
function ratesSaved(){ let r = {}; try { r = JSON.parse(ls.get(RATES_KEY)) || {}; } catch (e) {} return Object.assign({}, RATES_DEFAULT, r); }
function rateNum(v){ const n = Number(String(v == null ? '' : v).replace(/[^0-9.]/g, '')); return n > 0 ? n : 0; }
/* all four, or none: a price email with a gap in its table is worse than the console saying so */
function ratesList(){ const r = ratesSaved(); const list = RATE_ROWS.map(([k, n, label]) => ({ label, n, total: rateNum(r[k]) })); return list.every(x => x.total > 0) ? list : null; }
/* The film is on every card (Ramy, 25 Oct 2026): the course film unless another link is typed under Settings. */
function filmLink(){ let v = (ls.get(FILM_KEY) || '').trim(); if (/\/film\/(connect-lite-film\.(webm|mp4)|watch\.html)$/i.test(v)) { v = v.replace(/\/film\/(connect-lite-film\.(webm|mp4)|watch\.html)$/i, '/film/course-journey.html'); ls.set(FILM_KEY, v); } return v || base() + 'film/course-journey.html'; }
function cardKind(){ const v = ls.get(CARD_KIND_KEY); return (v === 'film' || v === 'price') ? v : ''; }
function cardStyle(){ return ls.get(CARD_STYLE_KEY) === 'ticket' ? 'ticket' : 'welcome'; }
function cardCopyTo(){ return (ls.get(CARD_CC_KEY) || '').trim(); }
let SHOW_URLS = ls.get(URLS_KEY) === '1';

/* THE LETTERS, one per card (Ramy, 3 Oct 2026). His, typed over and kept in this browser. */
const DEFAULT_NOTES = {
  /* The same words as the card's own letter (offer.html), kept neutral (Ramy, 24–25 Oct 2026). */
  '': [
    'Hello,',
    '',
    'I run CELTA courses, and I built Connect Lite because the work lived in five places at once.',
    '',
    'Below is a real course, two weeks in. Spend five minutes in it as a tutor, a trainee, an assessor or a volunteer student, and type. Nothing you do there touches anybody’s record. It will tell you more than I can.',
    '',
    'If it looks like something your center could use, just reply.',
  ].join('\n'),
  film: [
    'Hello,',
    '',
    'I run CELTA courses, and I built Connect Lite, the app a CELTA course runs on, from the first plan to the final grade.',
    '',
    'Rather than describe it, I filmed it. One course, start to finish, in three minutes.',
    '',
    'If it looks useful, reply and I’ll send you the demo: a real course you can open and type in yourself.',
  ].join('\n'),
  price: [
    'Hello,',
    '',
    'Here is what Connect Lite costs. It is simple: one price per course, everything included, and less when you take several.',
    '',
    'If your center needs something the card does not cover — an invoice in another currency, a purchase order, or a single course to try before you commit — just say and we will sort it out.',
  ].join('\n'),
};
function noteKey(){ const k = cardKind(); return NOTE_KEY + (k ? ':' + k : ''); }
function demoNote(){ const d = DEFAULT_NOTES[cardKind()]; const v = ls.get(noteKey()); return v === null ? d : v.trim(); }

/* ---- what a row on this console IS ---- */
function courseKind(c){
  if (c.deleted) return 'bin';
  const n = String(c.name || ''), cn = String(c.courseName || '');
  if (/scratch/i.test(n)) return 'scratch';
  if (/tp point library/i.test(n) || /tp point library/i.test(cn)) return 'library';
  if (/grades/i.test(cn) || /grades/i.test(n)) return 'grades';
  if (c.presentToday) return 'present';
  if (c.demoToday || /^Demo —|^Finished course/.test(n)) return 'demo';
  return 'live';
}
/* THE demo: the one every card points at. The mid-course demo by name; failing that, the newest demo. */
function theDemo(){
  const demos = COURSES.filter(c => courseKind(c) === 'demo');
  return demos.find(c => /mid-course/i.test(String(c.name || ''))) || demos.slice().sort((a, b) => String(b.created || '').localeCompare(String(a.created || '')))[0] || null;
}
const TODAY = () => new Date().toISOString().slice(0, 10);
function courseState(c){
  if (c.id === NEW_ID) return ['new', 'New'];
  if (!c.trainees) return ['todo', 'No trainees yet'];
  if (!c.start || !c.end) return ['todo', 'No dates yet'];
  const t = TODAY();
  if (c.start <= t && t <= c.end) return ['running', 'Running'];
  if (t < c.start) return ['', 'Starts ' + shortDate(c.start)];
  return ['', 'Finished ' + shortDate(c.end)];
}

/* ---- the four doors into a course: the tutor's, a trainee's, the assessor's, a volunteer's ---- */
/* THE DATED PASS (Ramy, 25 Oct 2026: "a dated pass per person... when you send the demo to someone you pick how
   long it lasts, one week by default"). The choice is the console's, kept here; a link copied, seen or sent from
   a card carries a pass minted for that many days, and the card it opens reads the date. "No date" is a link that
   never expires. */
const PASS_KEY = 'chub:passDays';
function passDays(){ const v = ls.get(PASS_KEY); return v == null || v === '' ? 7 : Math.max(0, Number(v) || 0); }
async function mintFor(courseId, label){ const d = passDays(); if (!d) return null; const r = await call({ op: 'mintPass', course: courseId, days: d, label: label || '' }); return r && r.id ? { id: r.id, exp: r.exp } : null; }
const dated = (link, m) => (m && m.id && /invite\.html\?/.test(String(link))) ? link + '&p=' + encodeURIComponent(m.id) : link;
function passSelect(){
  const d = passDays(), opt = (v, t) => `<option value="${v}"${d === v ? ' selected' : ''}>${t}</option>`;
  return `<label class="passsel">Links sent from here open for <select data-passdays aria-label="How long a link sent from here opens for">${opt(1, 'a day')}${opt(3, '3 days')}${opt(7, 'a week')}${opt(14, '2 weeks')}${opt(30, 'a month')}${opt(0, 'no date (never expires)')}</select></label>`;
}
const DOORS = {};
async function doorsFor(c){
  if (DOORS[c.id]) return DOORS[c.id];
  const inv = (p, v) => base() + 'invite.html?' + p + '=' + encodeURIComponent(v);
  const out = { tutor: inv('k', c.tutorKey), assessor: c.assessorKey ? inv('ak', c.assessorKey) : '', trainee: '', volunteer: '', traineeName: '', volunteerName: '', picks: [], count: 0 };
  try {
    const r = await HubStore.call({ op: 'roster', key: c.tutorKey });
    const list = Object.values((r && r.trainees) || {}).sort((a, b) => String(a.name).localeCompare(String(b.name)));
    if (list.length) { out.trainee = inv('t', list[0].token); out.traineeName = list[0].name; out.count = list.length; }
    /* THE THREE-WAY DOOR, as the card has it (offer.html, Ramy, 25 Oct 2026): one trainee whose feedback is
       back and open, one whose feedback is sealed until the self-evaluation is in, one with a letter from
       the tutors. The same rule, read from the same records, so the email and the card name the same three. */
    const state = t => { const rec = t.records || {}, fb = rec.feedback || {}, se = rec.selfeval || {}, tr = rec.tracker || {};
      if (tr.malpracticeLetterIssuedAt || tr.failLetterIssuedAt) return 'letter';
      if (fb.status === 'returned' && fb.docHTML) return se.status === 'turned_in' ? 'open' : 'held';
      return ''; };
    const LINE = { open: 'Feedback is back and open.', held: 'Feedback is sealed until the self-evaluation is in.', letter: 'A letter from the tutors is waiting to be read and signed.' };
    const picks = ['open', 'held', 'letter'].map(st => { const t = list.find(x => state(x) === st); return t ? { name: String(t.name).split(' ')[0], line: LINE[st], href: inv('t', t.token) } : null; }).filter(Boolean);
    if (picks.length >= 2) out.picks = picks;
  } catch (e) {}
  try {
    const cr = await HubStore.call({ op: 'course', key: c.tutorKey });
    const st = ((cr && cr.volunteers) || {}).students || [];
    const first = st.filter(s => s && s.token)[0];
    if (first) { out.volunteer = inv('v', first.token); out.volunteerName = first.name; }
  } catch (e) {}
  DOORS[c.id] = out;
  return out;
}
function cardLink(c){ const film = filmLink(); return base() + 'offer.html?k=' + encodeURIComponent(c.tutorKey) + (film ? '&f=' + encodeURIComponent(film) : ''); }

/* ---- the card as the email ---- */
function cardSubject(){
  if (cardKind() === 'film') return 'Connect Lite — a film of a whole CELTA course';
  if (cardKind() === 'price') return 'Connect Lite — what it costs';
  return 'Connect Lite — a real course to look around, and a film';
}
async function cardHtml(mint){
  if (cardKind() === 'film') return hubCardMail({ note: demoNote(), film: filmLink(), only: 'film', cardStyle: cardStyle() });
  if (cardKind() === 'price') return hubCardMail({ note: demoNote(), rates: ratesList(), only: 'price', cardStyle: cardStyle() });
  const d = theDemo(); const doors = [];
  if (d) {
    const k = await doorsFor(d);
    /* the same doors in the same order as the card (offer.html): the trainees, the assessor, the volunteer
       student, the film; the tutor's door comes last, under the price (Ramy, 25 Oct 2026) */
    const W = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve'];
    const n = k.count, word = W[n] || String(n);
    if (k.picks.length) doors.push({ label: 'As a trainee', note: word + ' trainee' + (n === 1 ? '' : 's') + ', each at a different point on the course. Pick one.', picks: k.picks });
    else if (k.trainee) doors.push({ label: 'As a trainee', note: (k.traineeName ? k.traineeName.split(' ')[0] + '’s' : 'One trainee’s') + ' own space: plans, self-evaluations, feedback and assignments.', href: k.trainee });
    if (k.assessor) doors.push({ label: 'As the assessor', note: 'Read-only: each trainee’s teaching practice record, their grades and their written assignments, in one place.', href: k.assessor });
    if (k.volunteer) doors.push({ label: 'As a volunteer student', note: (k.volunteerName ? String(k.volunteerName).split(' ')[0] + '’s' : 'One student’s') + ' page for the classes: the next one to come to, the days they came, and their certificate at the end.', href: k.volunteer });
  }
  const tutorDoor = d ? { note: 'The whole course: ' + (function(){ const n = (DOORS[d.id] || {}).count || 0; const w = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'][n] || String(n); return n ? w + ' trainee' + (n === 1 ? '' : 's') + ', their work, the grades and the reports.' : 'the trainees, their work, the grades and the reports.'; })(), href: base() + 'invite.html?k=' + encodeURIComponent(d.tutorKey) } : null;
  /* where the demo stands, as the card says it (offer.html): the day, the week, the days to the visit */
  const moment = (function(){
    if (!d || !d.demoToday || !d.start) return '';
    const days = []; const dt = new Date(d.start + 'T00:00:00Z'), end = new Date((d.end || d.demoToday) + 'T00:00:00Z');
    for (; dt <= end; dt.setUTCDate(dt.getUTCDate() + 1)) { const w = dt.getUTCDay(); if (w && w !== 6) days.push(dt.toISOString().slice(0, 10)); }
    const n = days.indexOf(d.demoToday) + 1, visit = d.visitDate ? days.indexOf(d.visitDate) + 1 : 0; if (n <= 0) return '';
    const where = n <= 6 ? 'the end of its first week' : n <= 10 ? 'its second week' : n <= 15 ? 'its third week' : 'its last week';
    const vis = visit > n ? ', ' + (visit - n === 1 ? 'the day before' : (visit - n) + ' days before') + ' the assessor’s visit' : '';
    return 'This course is fixed on day ' + n + ' of ' + days.length + ', ' + where + vis + '. It stays there, so what you see today is what you see next month.';
  })();
  let momentOut = moment;
  if (mint && d) {
    const m = await mintFor(d.id, 'card');
    if (m) {
      doors.forEach(x => { if (x.href) x.href = dated(x.href, m); if (x.picks) x.picks = x.picks.map(pk => Object.assign({}, pk, { href: dated(pk.href, m) })); });
      if (tutorDoor && tutorDoor.href) tutorDoor.href = dated(tutorDoor.href, m);
      momentOut = (moment ? moment + ' ' : '') + 'The links on this card open until ' + niceDate(m.exp) + '.';
    }
  }
  return hubCardMail({ note: demoNote(), film: filmLink(), doors, tutorDoor, moment: momentOut, cardStyle: cardStyle() });
}
/* plain-text versions, for a mail client */
async function noteFor(c){
  const film = filmLink();
  return ['Hi,', '', 'Here is Connect Lite: teach the course, and Lite does the rest.', '', cardLink(c), '',
    'That opens a page with what it does and ways into a real course you can type in, as a tutor, a trainee, an assessor or a volunteer student. Nothing you do there touches anyone’s record.',
    film ? '' : null, film ? 'There is a short film on the same page if you would rather watch it first.' : null, '', 'Any questions, just reply.', '', 'Ramy'].filter(x => x !== null).join('\n');
}
function tutorNoteFor(c){
  const centre = c.centreName ? ' at ' + c.centreName : '';
  /* the course admin's card (27 Oct 2026): the message goes to whoever sets the course up */
  return ['Hi,', '', 'Your CELTA course' + centre + ' is ready on Connect Lite. This link is for the course admin, whoever sets it up:', '', base() + 'invite.html?k=' + encodeURIComponent(c.tutorKey) + '&admin=1', '',
    'It opens on a short welcome that takes you through setting the course up: the dates, the trainees, the timetable. When it is set up, Course admin has the tutors\u2019 link for the other tutors. They open the same course.',
    '', 'Keep this link to yourself and the training team. Anyone who has it can read and change every trainee\u2019s record. If it ever gets out, Course admin can change it, and every old copy stops working.', '', 'Any questions, just reply.', '', 'Ramy'].join('\n');
}
function tutorSubject(c){ return 'Your CELTA course on Connect Lite — the course admin\u2019s link' + (c.centreName ? ' (' + c.centreName + ')' : ''); }

/* ---- drawing ---- */
let COURSES = [], INBOX = null, INBOX_ALL = false, BUSY = false;
const chip = (cls, t) => `<span class="state ${cls}">${esc(t)}</span>`;
const kbtn = (attrs, t, primary) => `<button type="button" class="btn small${primary ? ' primary' : ''}" ${attrs}>${t}</button>`;

function demoCard(c){
  const bits = [c.centreName, c.demoToday ? 'pinned to ' + niceDate(c.demoToday) : '', c.trainees ? c.trainees + ' trainees' : ''].filter(Boolean).join(' · ');
  const tutorLink = base() + 'invite.html?k=' + encodeURIComponent(c.tutorKey), assessorLink = base() + 'invite.html?ak=' + encodeURIComponent(c.assessorKey || '');
  const sends = who => ['wa', 'mail'].map(m => `<button type="button" class="linkbtn" data-share="${m}" data-who="${who}" data-demo="mid" data-id="${esc(c.id)}" data-tutor="${esc(tutorLink)}" data-assessor="${esc(assessorLink)}" data-film="${esc(filmLink())}">${m === 'wa' ? 'WhatsApp' : 'Email'}</button>`).join('');
  return `<div class="card demo" id="course-${esc(c.id)}">
    <div class="cover">
      <svg class="big" viewBox="8 28 104 64" fill="none" aria-hidden="true"><path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="currentColor" stroke-width="9" stroke-linecap="round"></path><path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="currentColor" stroke-width="9" stroke-linecap="round"></path></svg>
      <p class="eyebrow">The demo · every card opens this course</p>
      <h3>${esc(c.name || label(c))}</h3>
      <p>${esc(c.courseName || '')}${bits ? ' · ' + esc(bits) : ''}</p>
    </div>
    <!-- each door sent on its own, with the film; the foot sends all four (Ramy, 25 Oct 2026: "add the same
         WhatsApp and email to the mid-course card") -->
    <div class="doors" data-doors="${esc(c.id)}">
      <div class="door"><b>As a tutor</b><span>The whole course: the trainees, their work, the grades and the reports.</span>
        <span class="sendrow"><button type="button" class="btn small" data-copy="${esc(tutorLink)}">Copy the card</button><a class="linkbtn" href="${esc(tutorLink)}" target="_blank" rel="noopener">See the card</a>${sends('tutor')}</span></div>
      <div class="door"><b>As a trainee</b><span id="dt-${esc(c.id)}">One trainee’s own space: plans, self-evaluations, feedback and assignments.</span>
        <span class="sendrow"><button type="button" class="btn small" data-door="trainee" data-id="${esc(c.id)}" disabled>Finding…</button><a class="linkbtn" data-see="trainee" data-id="${esc(c.id)}" href="#" target="_blank" rel="noopener" hidden>See the card</a>${sends('trainee')}</span></div>
      <div class="door"><b>As the assessor</b><span>Read-only: every portfolio, the grades and the double-marking record.</span>
        <span class="sendrow"><button type="button" class="btn small" data-copy="${esc(assessorLink)}">Copy the card</button><a class="linkbtn" href="${esc(assessorLink)}" target="_blank" rel="noopener">See the card</a>${sends('assessor')}</span></div>
      <div class="door"><b>As a volunteer student</b><span id="dv-${esc(c.id)}">Their next class, their days, their certificate.</span>
        <span class="sendrow"><button type="button" class="btn small" data-door="volunteer" data-id="${esc(c.id)}" disabled>Finding…</button><a class="linkbtn" data-see="volunteer" data-id="${esc(c.id)}" href="#" target="_blank" rel="noopener" hidden>See the card</a>${sends('volunteer')}</span></div>
    </div>
    <div class="foot">
      ${passSelect()}<span>All four links, with the film:</span>${sends('all')}
      <a class="linkbtn" data-card="${esc(c.id)}" href="#">See the offer card</a>
      <a class="linkbtn" href="5_tutor_dashboard.html?k=${encodeURIComponent(c.tutorKey)}" target="_blank" rel="noopener">Open it as a tutor</a>
      <span class="right"><code>${esc(c.id)}</code>
        <span class="more"><button type="button" class="moretog" aria-label="More">⋯</button>
          <span class="menu"><button type="button" data-clone="${esc(c.id)}" data-label="${esc(label(c))}">Start a new course from this</button>
            <button type="button" class="danger" data-delete="${esc(c.id)}" data-label="${esc(label(c))}" data-trainees="${c.trainees || 0}">Delete this demo</button></span></span></span>
    </div>
  </div>`;
}
function sendCard(){
  const kind = cardKind();
  return `<div class="card send" id="sendcard">
    <h3>Send Lite to someone</h3>
    <div class="row">
      <select id="cardKind" aria-label="Which card"><option value="">The offer card</option><option value="film"${kind === 'film' ? ' selected' : ''}>Just the film</option><option value="price"${kind === 'price' ? ' selected' : ''}>Just the price</option></select>
      <input type="email" id="cardTo" placeholder="Their email address" autocomplete="off">
      ${passSelect()}
      <button class="btn primary" type="button" id="cardSend">Send</button>
      <button class="btn" type="button" id="cardPreview">Preview</button>
    </div>
    <details><summary>The letter on top, and the rest</summary>
      <textarea id="demoNote" placeholder="Empty sends the card alone, unsigned by a letter.">${esc(demoNote())}</textarea>
      <div class="acts"><button class="linkbtn" type="button" id="noteReset">Put the standard letter back</button>
        <button class="linkbtn" type="button" id="cardCopy">Copy the card, to paste into Gmail</button>
        <select id="cardStyleSel" aria-label="How the card looks"><option value="welcome">Welcome look</option><option value="ticket"${cardStyle() === 'ticket' ? ' selected' : ''}>Ticket look</option></select>
        <input type="email" id="cardCopyTo" placeholder="A copy to you (optional)" value="${esc(cardCopyTo())}" style="flex:0 1 220px">
      </div>
      <p class="note">The offer card carries your letter, the four questions, the doors into the demo and the film, the same as the card on the web. Just the film goes to someone who has never seen Lite. Just the price is the only one with figures in it; the rates are under Settings below. Each kind keeps its own letter.</p>
    </details>
  </div>`;
}
function liveRow(c){
  const [cls, word] = courseState(c);
  const tutor = base() + 'invite.html?k=' + encodeURIComponent(c.tutorKey), assessor = base() + 'invite.html?ak=' + encodeURIComponent(c.assessorKey || '');
  return `<div class="card${c.id === NEW_ID ? ' new' : ''}" id="course-${esc(c.id)}">
    <div class="row-course">
      <div class="name"><b>${esc(c.courseName || c.name || 'New course')}</b><small>${esc([c.centreName, c.centreNumber].filter(Boolean).join(' · '))}</small></div>
      <div class="acts">
        ${kbtn(`data-copy="${esc(tutor)}" title="The training team: their tutors and course admin all use it"`, 'Tutor link')}
        ${kbtn(`data-copy="${esc(assessor)}" title="Read-only, for the visit"`, 'Assessor link')}
        ${kbtn(`data-vol="${esc(c.id)}" data-key="${esc(c.tutorKey)}" title="One student’s own page"`, 'Volunteer link')}
        ${kbtn(`data-note="${esc(c.id)}" data-what="tutor" title="A short message with the course admin\u2019s link in it, for whoever sets the course up at the center"`, 'Message to the center', true)}
        <a class="linkbtn" data-mail="${esc(c.id)}" data-what="tutor" href="#">Email it</a>
      </div>
      <div class="facts">

    const filmLine = mid ? 'The film: ' : 'The film, one TP from the trainee\u2019s side: ';
    const text = head + '\n\n' + need.map(r => LINE[r] + L[r]).join('\n\n') + '\n\n' + (mid ? filmLine + film + '\n\n' : '') + tail + until;   /* day one: the film is on the card itself */
    const subject = 'Connect Lite' + (mid ? ', the demo' : ', day one') + (who === 'all' ? '' : who === 'volunteer' ? ', as a volunteer student' : who === 'assessor' ? ', as the assessor' : ', as a ' + who);
    if (sh.dataset.share === 'wa') { const u = 'https://wa.me/?text=' + encodeURIComponent(text); if (wa) wa.location = u; else window.open(u, '_blank', 'noopener'); }
    else location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(text);
    return;
  }
  const b = T('[data-copy]');
  if (b) {
    const host = b.closest('[data-doors]');
    if (host && /invite\.html\?/.test(b.dataset.copy) && passDays()) {
      try { const m = await mintFor(host.dataset.doors, 'copied'); await hubCopyButton(b, withFilm(dated(b.dataset.copy, m), host.dataset.film)); } catch (err) { await hubCopyButton(b, withFilm(b.dataset.copy, host.dataset.film)); }
      return;
    }
    await hubCopyButton(b, b.dataset.copy); return;
  }
  const pg = T('[data-purge]');
  if (pg) { if (BUSY) return; const files = Number(pg.dataset.files) || 0;
    const typed = await confirmModal(`Empty the materials for ${pg.dataset.purge}? ${files} file${files === 1 ? '' : 's'} go to Drive’s trash, where Drive keeps them for 30 days. The plans that name them will point at nothing.`, 'Empty the materials', { type: pg.dataset.purge, hint: `Type ${pg.dataset.purge} to empty its materials` });
    if (!typed) return; BUSY = true; status('Emptying materials for ' + pg.dataset.purge + '…');
    try { const r = await call({ op: 'purgeMaterials', course: pg.dataset.purge, confirm: typed }); const t = r.trashed || {}; render(r.courses, `Emptied ${r.emptied} — ${t.files || 0} file${t.files === 1 ? '' : 's'} to Drive’s trash.`); } catch (err) { status(err.message); }
    BUSY = false; return; }
  const cl = T('[data-clone]');
  if (cl) { if (BUSY) return;
    const ok = await confirmModal(`Start the next course from ${cl.dataset.label}? The center’s settings, logo, tutors, standing instructions, shared links, assignment wording and observation sheets carry over. Dates, the assessment date, the roster and every record start fresh, and the new course gets its own tutor and assessor links.`, 'Start the next course');
    if (!ok) return; BUSY = true; status('Starting the next course from ' + cl.dataset.label + '…');
    try { const made = await call({ op: 'cloneCourse', from: cl.dataset.clone }); NEW_ID = made.id; render(made.courses, 'Made ' + made.id + ' from ' + cl.dataset.label + '. Open its Course admin, set the dates, then send the message to the center.'); const card = $('course-' + made.id); if (card) hubScrollIntoView(card, 'start'); } catch (err) { status(err.message); }
    BUSY = false; return; }
  const d = T('[data-delete]');
  if (d) { if (BUSY) return; const n = Number(d.dataset.trainees || 0);
    const carries = n ? `Its ${n} trainee${n === 1 ? '' : 's'} and every plan, self-evaluation, feedback and assignment on it go with it.` : 'It has no trainees; anything recorded on it goes with it.';
    const typed = await confirmModal(`Delete ${d.dataset.label}? ${carries} Its tutor and assessor links stop working now. It sits in the bin for 30 days, where you can put it back; after that it is gone for good.`, 'Delete the course', { type: d.dataset.delete, hint: `Type ${d.dataset.delete} to delete this course` });
    if (!typed) return; BUSY = true; status('Deleting ' + d.dataset.label + '…');
    try { const r = await call({ op: 'deleteCourse', course: d.dataset.delete, confirm: typed }); render(r.courses, `${r.deleted} is in the bin. Its links are off; it goes for good on ${niceDate(r.until)}. Put it back from The bin until then.`); } catch (err) { status(err.message); }
    BUSY = false; return; }
  const u = T('[data-undelete]');
  if (u) { if (BUSY) return; BUSY = true; status('Putting ' + u.dataset.label + ' back…');
    try { const r = await call({ op: 'undeleteCourse', course: u.dataset.undelete }); render(r.courses, `${r.restored} is back, with its links working again.`); } catch (err) { status(err.message); }
    BUSY = false; }
});

async function load(msg){
  if (!ownerKey()) { gate(); return; }
  try { const r = await call({ op: 'ownerCourses' }); render(r.courses || [], msg); inbox(); centreBookLoad(); }
  catch (err) {
    if (/not yours/i.test(err.message)) { ls.del(OWNER_STORE); gate('That key was not recognized — check you copied all of it.'); return; }
    $('app').innerHTML = `<div class="empty">${esc(err.message)} <button class="btn small" id="retryBtn" type="button" style="margin-left:8px;">Try again</button> <button class="btn small" id="otherKeyBtn" type="button" style="margin-left:8px;">Use a different key</button></div>`;
  }
}
load();
</script>
