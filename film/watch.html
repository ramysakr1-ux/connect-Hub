<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Lite — the film</title>
<!--
  The film's own page. The card's Watch button used to open the raw video
  file, and a bare file is at the mercy of whatever opens it: Safari would not
  decode the WebM's Opus audio, so the music vanished, and the 60 MB file
  stalled as it streamed (Ramy, 2 Oct 2026: "it froze a lot and also the
  music was gone"). This is a page with a player on it, the film as MP4
  (H.264 + AAC, which everything decodes in hardware), a poster, and nothing
  else to click. No keys, no store.
-->
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@500;600&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../hub-tokens.css?v=202610021014">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0; min-height:100%;}
  body{background:var(--sand); color:var(--ink); font-family:'Karla',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:5vh 18px 48px;}
  .mark{display:inline-flex; align-items:center; gap:10px; margin:0 0 22px;}
  .mark .tile{display:grid; place-items:center; width:34px; height:34px; border-radius:8px; background:var(--ink-warm);}
  .mark .pair{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:1.7rem; line-height:0.85; color:var(--gold);}
  .mark .pair span{font-family:'Instrument Sans','Karla',sans-serif; font-style:normal; font-size:0.62rem; font-weight:500;
    letter-spacing:.24em; text-transform:uppercase; color:var(--ink); margin-left:6px;}
  h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.6rem; line-height:1.2; color:var(--teal);
    margin:0 0 6px; text-align:center; text-wrap:balance; max-width:28ch;}
  .sub{font-size:0.95rem; color:var(--grey); margin:0 0 22px; text-align:center; max-width:48ch; line-height:1.6;}
  .frame{width:100%; max-width:1040px; background:var(--ink-warm); border-radius:var(--r-card); overflow:hidden;
    box-shadow:0 18px 50px oklch(30% 0.04 58 / .18);}
  video{display:block; width:100%; aspect-ratio:8/5; background:#000;}
  .foot{margin:26px 0 0; font-size:0.86rem; color:var(--grey); text-align:center; line-height:1.6;}
  .foot b{color:var(--ink-warm);}
  .foot a{color:var(--teal); font-weight:600;}
  @media(max-width:520px){ body{padding:16px 12px 32px;} h1{font-size:1.3rem;} }
</style>
</head>
<body>
  <div class="mark">
    <span class="tile">
      <svg viewBox="8 30 104 60" width="20" height="12" fill="none" aria-hidden="true">
        <path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="var(--gold-lifted)" stroke-width="13" stroke-linecap="round"></path>
        <path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="var(--paper)" stroke-width="13" stroke-linecap="round"></path>
      </svg>
    </span>
    <span class="pair">Connect<span>Lite</span></span>
  </div>
  <h1>A CELTA course, from the link being sent to the final report</h1>
  <p class="sub">Eight minutes. First the same course run two ways, a centre's Google Drive and then this; then the course itself, start to finish.</p>
  <div class="frame">
    <video controls playsinline preload="metadata" poster="poster.jpg" src="connect-lite-film.mp4"></video>
  </div>
  <p class="foot">designed and built by <b>Ramy</b></p>
</body>
</html>
