<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Lite — the last card</title>
<!--
  The film's last frame. A page of the film's own, like film/open.html: no
  keys, no store, nothing to click. It plays itself, the way the cold open
  does, and the engine simply holds on it.

  The address is NOT in this file. It arrives as ?email= when the film is
  opened, so a public repository never carries anybody's inbox, and the line
  is left out entirely when none is given. Ramy, 30 Sep 2026: end "with my
  card and sort of email me".
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700;1,600&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(98.5% 0.006 85); --paper:oklch(99.5% 0.004 90);
    --ink:oklch(23.5% 0.017 65); --ink-warm:oklch(30% 0.042 58);
    --teal:oklch(37.5% 0.058 195); --gold:oklch(63% 0.096 72);
    --grey:oklch(51% 0.017 70); --line:oklch(88% 0.015 80);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{background:var(--sand); color:var(--ink); font-family:'Karla',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:60px 72px;}
  .card{max-width:60rem; text-align:center;}

  /* The lockup settles rather than arrives. */
  /* The mark, exactly as Lite sets it: Instrument Serif italic in the gold,
     LITE in Instrument Sans on the same baseline. Ramy, 1 Oct 2026. */
  .mark{display:inline-flex; align-items:center; gap:16px; opacity:0; transform:scale(.96);
    transition:opacity 1200ms ease, transform 2400ms cubic-bezier(.2,.7,.2,1);}
  .mark .tile{display:grid; place-items:center; width:64px; height:64px; border-radius:14px;
    background:oklch(30% 0.042 58);}
  .mark .pair{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-weight:400;
    font-size:3.4rem; line-height:0.85; letter-spacing:-0.012em; color:oklch(63% 0.096 72);}
  .mark .pair span{font-family:'Instrument Sans','Karla',sans-serif; font-size:0.9rem; font-weight:500;
    letter-spacing:.24em; text-transform:uppercase; color:oklch(23.5% 0.017 65); margin-left:9px; vertical-align:baseline;}
  .mark.on{opacity:1; transform:none;}

  .line{opacity:0; transform:translateY(10px); transition:opacity 800ms ease, transform 800ms ease;}
  .line.on{opacity:1; transform:none;}

  .one{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:2.5rem; line-height:1.24;
    color:var(--teal); margin:34px auto 0; max-width:26ch; text-wrap:balance;}
  .two{font-size:1.45rem; color:var(--ink-warm); margin:22px auto 0; max-width:34ch;}
  .three{margin:26px auto 0;}
  .three a{font-size:1.7rem; font-weight:700; color:var(--teal); text-decoration:none;
    border-bottom:3px solid var(--gold); padding-bottom:3px;}
  .foot{margin:46px auto 0; font-size:0.9rem; color:var(--grey);}
  .foot b{color:var(--ink-warm);}
  @media (prefers-reduced-motion: reduce){
    .mark, .line{transition:none; opacity:1; transform:none;}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" id="mark">
      <span class="tile">
        <svg viewBox="8 30 104 60" width="36" height="22" fill="none" aria-hidden="true">
          <path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="oklch(70% 0.12 72)" stroke-width="13" stroke-linecap="round"></path>
          <path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="oklch(99.5% 0.004 90)" stroke-width="13" stroke-linecap="round"></path>
        </svg>
      </span>
      <span class="pair">Connect<span>Lite</span></span>
    </div>
    <h1 class="one line" id="l1">Every document a candidate produces, every word a trainer writes, in one place.</h1>
    <p class="two line" id="l2">Centres and trainers: email me for a demo link.</p>
    <p class="three line" id="l3" hidden><a id="mail" href="#"></a></p>
    <p class="foot line" id="l4">designed and built by <b>Ramy</b></p>
  </div>
<script>
  var email = new URLSearchParams(location.search).get('email') || '';
  if (email) {
    var a = document.getElementById('mail');
    a.textContent = email;
    a.href = 'mailto:' + email;
    document.getElementById('l3').hidden = false;
  }
  var at = function (ms, fn) { setTimeout(fn, ms); };
  at(200,  function () { document.getElementById('mark').classList.add('on'); });
  at(1000, function () { document.getElementById('l1').classList.add('on'); });
  at(1800, function () { document.getElementById('l2').classList.add('on'); });
  at(2400, function () { document.getElementById('l3').classList.add('on'); });
  at(3000, function () { document.getElementById('l4').classList.add('on'); });
</script>
</body>
</html>
