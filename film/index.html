<!DOCTYPE html>
<!--
  Connect Lite — the film
  © 2026 Ramy Sakr. All rights reserved.

  The film plays the REAL screens. Every scene loads an actual Lite page in a
  same-origin iframe and drives it: opens menus, types into boxes, clicks
  buttons. Nothing here is a mock-up, so the film cannot drift from the
  product the way a rendered video does -- when a screen changes, the film
  changes with it.

  DEPLOY SPEC: DEMO-ANIMATION-SPEC.md, the file beside this one in the repo.
  Eighteen scenes, captions and music, no narration.

  THREE RULES THIS FILE KEEPS.

  1. It never writes to the store. A film that mints a course every take
     would leave a trail of them, and a roster paste would really add twelve
     people. Ops that CHANGE anything are listed in a scene's `stub` and are
     answered locally instead of being sent -- the interface is real, the
     answer is canned. Everything else (reads) goes to the real store, so
     what you see is the real course.
  2. It carries no key. The tutor key arrives in the film's own URL as ?k=
     and is passed through to the iframe. This repo is public; a key in it
     would be a key anyone could use.
  3. Captions float, and there is never more than one. Spec: in over 400ms,
     still for at least 2.5s, out over 400ms, then a second of silence.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Connect Lite — the film</title>
<link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(98.8% 0.006 85); --sand-line:oklch(85.5% 0.02 80);
    --paper:oklch(99.5% 0.004 90); --surface:oklch(95.2% 0.018 84);
    --ink:oklch(23.5% 0.017 65); --ink-warm:oklch(30% 0.042 58);
    --teal:oklch(37.5% 0.058 195); --gold:oklch(63% 0.096 72);
    --grey:oklch(51% 0.017 70);
    --stage-w:1280px; --stage-h:800px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink, #2b2118);
    background:oklch(17% 0.012 65); min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px;}

  /* The stage. The iframe is always 1280x800 and is scaled to fit, so a
     scene's coordinates never depend on the window. */
  .stage{position:relative; width:var(--stage-w); height:var(--stage-h);
    transform-origin:top left; border-radius:10px; overflow:hidden;
    background:var(--sand, #fbfaf7); box-shadow:0 30px 80px -20px oklch(0% 0 0 / 0.6);}
  /* A FILM, not a demo. The screens are real and would happily be clicked,
     which is exactly what confused the first viewing -- some things opened,
     some did not, and there was no telling which. The demo links are the
     interactive thing; this is a picture of them. So the stage takes no
     clicks at all, and the opening card says so. */
  .stage iframe{width:var(--stage-w); height:var(--stage-h); border:0; display:block; pointer-events:none;}
  .stagewrap{position:relative;}
  /* ?take=1 -- the recording. Only the stage, at its own size, no padding,
     no bar, no tabs, no note: a 1280x800 window records the film and nothing
     else. The engine sets window.filmEnded when the last scene is done, so
     the recorder knows when to stop. */
  html.take body{padding:0; gap:0; background:var(--sand, #fbfaf7); min-height:0; display:block;}
  html.take .stage{border-radius:0; box-shadow:none;}
  html.take .bar, html.take .note{display:none;}

  /* The opening card: what this is, before anything moves. */
  .opening{position:absolute; inset:0; z-index:9; background:var(--sand, #fbfaf7);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:70px;
    transition:opacity 700ms ease;}
  .opening.gone{opacity:0; pointer-events:none;}
  .opening h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:2.1rem; margin:0; color:var(--teal, #1e6b63);}
  .opening p{margin:0; font-size:1rem; line-height:1.7; color:var(--grey, #6b6157); max-width:46ch;}

  /* A still frame for the two cuts that are not Lite at all -- the Classroom
     stream and the Drive folder. Until the captures exist it says so, rather
     than quietly showing nothing. */
  .still{position:absolute; inset:0; display:none; background:var(--sand, #fbfaf7);
    align-items:center; justify-content:center; flex-direction:column; gap:12px; text-align:center; padding:60px;}
  .still.on{display:flex;}
  .still img{max-width:100%; max-height:100%; object-fit:contain;}
  .still img:not([hidden]) ~ .want, .still img:not([hidden]) ~ .how{display:none;}
  .still .want{font-family:'Newsreader',Georgia,serif; font-size:1.3rem; color:var(--ink-warm, #46342a);}
  .still .how{font-size:0.9rem; color:var(--grey, #6b6157); max-width:46ch; line-height:1.6;}

  /* A chapter card. Ramy, 27 Sep 2026: "one screen, big font \u2014 the trainer
     side, then the trainee, then the assessor. It's like this is a new chapter
     in this book." It covers the stage completely, so the cut either side of
     it is clean, and it fades rather than snaps. */
  .chapter{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center; padding:60px;
    background:var(--sand, #fbfaf7); opacity:0; pointer-events:none;
    transition:opacity .55s ease;}
  .chapter.on{opacity:1;}
  .chapter .num{font-size:0.78rem; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--grey, #6b6157);}
  .chapter .who{font-family:'Newsreader',Georgia,serif; font-weight:700;
    font-size:3.4rem; line-height:1.05; margin:0; color:var(--teal, #1e6b63);}
  /* One hairline under the title, in the gold that edges every card in the
     product -- the only ornament the card gets. */
  .chapter .rule{width:84px; height:3px; border-radius:2px;
    background:var(--gold, oklch(63% 0.096 72));}
  .chapter .sub{margin:0; font-size:1.02rem; line-height:1.65; max-width:44ch;
    color:var(--ink-warm, #46342a);}

  /* The cursor. Drawn over the stage, moved with a transition so it glides
     rather than jumps; the click ring is a one-shot. */
  .cursor{position:absolute; top:0; left:0; width:22px; height:22px; pointer-events:none;
    transition:transform 620ms cubic-bezier(.33,.9,.25,1); z-index:6; opacity:0;}
  .cursor.on{opacity:1;}
  .cursor svg{display:block; filter:drop-shadow(0 2px 3px oklch(0% 0 0 / 0.35));}
  .ring{position:absolute; top:0; left:0; width:34px; height:34px; margin:-6px 0 0 -6px;
    border-radius:50%; border:2px solid var(--gold, #b98a3e); opacity:0; pointer-events:none; z-index:5;}
  .ring.pop{animation:pop 520ms ease-out;}
  @keyframes pop{0%{opacity:.9; transform:scale(.4);} 100%{opacity:0; transform:scale(1.5);}}

  /* Captions: one at a time, rising from the bottom, still while read. */
  /* A caption FLOATS. Ramy, 27 Sep 2026: "it shouldn't be like a subtitle, it
     should be kind of floating in the air, crossing the screen."

     So: no pill, no bar pinned to the bottom edge. The words sit over the
     screen in the product's own serif, large enough to read at a glance and
     light enough not to fight what is underneath; they drift up and across
     the whole time they are visible, so they are always moving and never look
     parked. A soft glow behind the glyphs, not a box, is what keeps them
     legible over a pale screen and a dark one alike -- a box would put the
     subtitle back.

     `.caption` drifts on its own timeline (the `drift` animation) rather than
     on the .on transition, because the transition only runs at the two ends
     and the middle is where the floating has to happen. */
  .caption{position:absolute; left:50%; bottom:20%; width:max-content; max-width:58ch;
    padding:0 24px; text-align:center; pointer-events:none; z-index:7;
    font-family:'Newsreader', Georgia, serif; font-weight:600;
    font-size:1.6rem; line-height:1.3; letter-spacing:0.004em;
    /* INK on a light halo, not white on a dark one. Every screen the stage
       ever shows is one of Lite's, and they are all cream -- so pale text
       floating over them was nearly invisible, whatever glow it carried. The
       halo is the paper colour, spread wide and soft, which lifts the words
       off the screen without drawing a box round them. */
    /* WHITE, with a dark aura. Ramy, 27 Sep 2026: "let's try the captions in
       white, like we did before, not black, so it doesn't block the view."
       Ink read as a second layer of content on a screen already full of text;
       white reads as something over the top of it, which is what a floating
       caption should be.
       The aura is what makes white work on Lite's cream screens. The first
       attempt used a wide, soft shadow and the words nearly vanished; this one
       is TIGHT and dense right at the glyph edge and only then spreads, so the
       letters keep their own edge without a box being drawn round them. */
    color:oklch(99% 0.004 85);
    text-shadow:0 0 5px oklch(21% 0.02 65 / .95), 0 0 12px oklch(21% 0.02 65 / .92),
      0 0 26px oklch(21% 0.02 65 / .8), 0 0 54px oklch(21% 0.02 65 / .6),
      0 2px 3px oklch(21% 0.02 65 / .9);
    opacity:0; transform:translate(-50%, 0);
    transition:opacity 700ms ease;}
  /* IT KEEPS FLOATING WHILE IT GOES. The drift used to live on `.on`, so
     taking `.on` away removed the animation and the transform snapped back to
     where it started while the opacity was still fading -- the glitch Ramy
     saw: "it should fade out, not just stop." Now `.on` starts the drift and
     `.out` only touches opacity, so the words carry on travelling the whole
     way out and simply become less and less there. */
  /* TRANSLUCENT. Ramy, 27 Sep 2026: "when I said white I meant more like a
     translucent kind of colour -- so they can read it, but it doesn't block
     the view." Solid white sat ON the screen; at 82% the screen shows through
     the strokes and the words read as something laid over it. The aura stays
     opaque enough to hold the edges, or the letters dissolve into the cream. */
  .caption.on{opacity:.82; animation:drift 13s linear forwards;}
  .caption.on.out{opacity:0; transition:opacity 1600ms ease;}
  /* Up and a little to the right, the whole time it is on screen and all the
     way through the fade. Small: the point is that it is never still, not
     that it travels. */
  @keyframes drift{
    from{ transform:translate(-50%, 10px); }
    to{ transform:translate(calc(-50% + 30px), -46px); }
  }
  @media (prefers-reduced-motion: reduce){
    .caption.on{ animation:none; transform:translate(-50%, 0); }
  }

  /* Top left. It sat bottom left and landed on the screens' own sync pill --
     "DAY 4" printed over "Saved to the course" in the first take (30 Sep
     2026) -- and the bottom of a Lite screen is where the return bar, the
     dictation bar and the save line all live. The top left corner is margin
     on every screen the film uses. */
  /* The curtain. A Lite screen takes six to eighteen seconds to come back
     from the store, and the first take filmed all of it: five of its eleven
     minutes were a half-drawn page with "Loading from the course…" in the
     corner. The curtain goes up while a scene's screen loads and comes down
     when the screen is ready, so the waiting is a quiet ground instead of a
     spinner -- and the cut (film/cut.mjs) can find those stretches by the mark
     in the corner and take them out, which is what turns a take into a film. */
  .curtain{position:absolute; inset:0; z-index:6; display:none;
    background:var(--sand, #fbfaf7); align-items:center; justify-content:center;}
  .curtain.on{display:flex;}
  .curtain .mark{font-family:'Newsreader',Georgia,serif; font-size:1.5rem; color:oklch(45% 0.06 190 / .5);}
  .curtain .mark span{font-family:'Karla',sans-serif; font-size:0.62rem; letter-spacing:.26em; vertical-align:middle;}
  /* Six pixels of a colour no screen uses, so the cut can tell a curtain frame
     from a picture without guessing. It never survives the cut. */
  .curtain .cue{position:absolute; left:0; top:0; width:6px; height:6px; background:#ff00ff;}
  .day{position:absolute; left:28px; top:24px; z-index:7; pointer-events:none;
    font-family:'Karla',sans-serif; font-size:0.72rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    color:oklch(99% 0.004 85); background:oklch(21% 0.02 65 / .82); padding:7px 12px; border-radius:999px;
    opacity:0; transition:opacity 600ms ease;}
  .day.on{opacity:.92;}

  /* Transport. Not part of the film -- it is how we watch it while building. */
  .bar{display:flex; align-items:center; gap:14px; width:var(--stage-w); max-width:100%;
    color:oklch(80% 0.01 85); font-size:0.84rem;}
  .bar button{font-family:'Karla',sans-serif; font-size:0.84rem; font-weight:700;
    color:var(--sand, #fbfaf7); background:oklch(30% 0.02 65); border:1px solid oklch(42% 0.02 65);
    border-radius:20px; padding:7px 16px; cursor:pointer;}
  .bar button:hover{background:oklch(36% 0.03 65);}
  .bar .now{font-variant-numeric:tabular-nums; min-width:112px;}
  .scenes{display:flex; gap:5px; flex-wrap:wrap; flex:1;}
  .scenes b{font-weight:600; font-size:0.72rem; padding:4px 9px; border-radius:20px; cursor:pointer;
    background:oklch(27% 0.015 65); color:oklch(72% 0.012 85); border:1px solid transparent;}
  .scenes b.is{background:var(--teal, #1e6b63); color:var(--paper, #fdfcfa); border-color:var(--teal, #1e6b63);}
  .scenes b:hover{border-color:oklch(52% 0.02 65);}
  .note{width:var(--stage-w); max-width:100%; color:oklch(62% 0.012 85); font-size:0.78rem; line-height:1.6;}
  .note b{color:oklch(78% 0.02 85);}
  .warn{color:oklch(72% 0.13 55);}
</style>
</head>
<body>

<div class="stagewrap">
  <div class="stage" id="stage">
    <iframe id="screen" title="Connect Lite"></iframe>
    <div class="still" id="still">
      <img id="stillImg" alt="" hidden>
      <div class="want" id="stillWant"></div>
      <div class="how" id="stillHow"></div>
    </div>
    <div class="chapter" id="chapter">
      <div class="num" id="chapterNum"></div>
      <h2 class="who" id="chapterWho"></h2>
      <div class="rule"></div>
      <p class="sub" id="chapterSub"></p>
    </div>
    <div class="curtain" id="curtain"><i class="cue"></i><div class="mark">Connect <span>LITE</span></div></div>
    <div class="ring" id="ring"></div>
    <div class="cursor" id="cursor">
      <svg viewBox="0 0 22 22" width="22" height="22" aria-hidden="true">
        <path d="M2 1 L2 17 L6.2 13.2 L9 19.6 L12 18.2 L9.2 12 L15 12 Z"
              fill="#fdfcfa" stroke="#2b2118" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="caption" id="caption"></div>
    <!-- The day stamp (spec, 28 Sep 2026): the calendar is the film's spine,
         so the day sits on screen even when no caption does, and changes only
         on a cut. Bottom left, small caps, the product's own label style. -->
    <div class="day" id="day"></div>
    <div class="opening" id="opening">
      <h1>Connect Lite</h1>
      <p>A CELTA course, from the link being sent to the final report.</p>
      <p style="font-size:0.88rem;">Nothing here needs clicking — sit back. The working demo is a separate link.</p>
    </div>
  </div>
</div>

<!-- The music. One track, under everything, low. Dropped in as
     film/music.mp3, or pointed at with &music=<url>; the film plays without
     one and says so, rather than failing. Volume starts at 0.18 because a
     soundtrack that competes with the screens is the commonest way a product
     film gets turned off. -->
<audio id="music" loop preload="auto"></audio>

<div class="bar">
  <button id="play">Pause</button>
  <button id="again">Replay scene</button>
  <span class="now" id="now">1 / 3 · 0:00</span>
  <div class="scenes" id="scenes"></div>
</div>

<div class="note" id="note"></div>

<script src="scenes.js?v=1"></script>
<script>
/* ============================================================ the engine ==
   A scene is a screen plus a list of steps. Steps run in order; each returns
   how long it takes. The clock is real time, so a scene can be replayed but
   not scrubbed into -- replaying from the top is the only honest way to get
   a deterministic frame when the steps are driving a live page.
   ========================================================================= */
(function () {
  'use strict';

  var KEY = new URLSearchParams(location.search).get('k') || '';
  var stage = document.getElementById('stage');
  var frame = document.getElementById('screen');
  var still = document.getElementById('still');
  var chapter = document.getElementById('chapter');
  var curtain = document.getElementById('curtain');
  var cursor = document.getElementById('cursor');
  var ring = document.getElementById('ring');
  var capEl = document.getElementById('caption');
  var nowEl = document.getElementById('now');
  var tabs = document.getElementById('scenes');
  var note = document.getElementById('note');

  /* Fit the 1280-wide stage into whatever window we are watching in. */
  var TAKE = !!new URLSearchParams(location.search).get('take');
  if (TAKE) document.documentElement.classList.add('take');
  function fit() {
    if (TAKE) { stage.style.transform = 'none'; stage.parentElement.style.width = '1280px'; stage.parentElement.style.height = '800px'; document.documentElement.style.setProperty('--fit', 1); return; }
    var pad = 40;
    var s = Math.min(1, (window.innerWidth - pad) / 1280, (window.innerHeight - 190) / 800);
    stage.style.transform = 'scale(' + s + ')';
    stage.parentElement.style.width = (1280 * s) + 'px';
    stage.parentElement.style.height = (800 * s) + 'px';
    document.documentElement.style.setProperty('--fit', s);
  }
  window.addEventListener('resize', fit);
  fit();

  var OWNER = new URLSearchParams(location.search).get('o') || '';
  /* Three courses, three tutor keys on the film's own URL:
       ?k=  the running demo (c3)      -- most scenes
       ?s=  the scratch course (c5)    -- the one that sets a course up
       ?fk= the finished demo (c4)     -- the assessor, grades and reports
     A scene names which with `course:`. Everything ELSE a scene needs -- a
     candidate's own token, the assessor's key -- is looked up from the store
     with READ ops, so there is nothing more to paste and nothing that can go
     stale between takes. */
  var SCRATCH = new URLSearchParams(location.search).get('s') || '';
  var FINISHED = new URLSearchParams(location.search).get('fk') || '';
  /* The two STANDING demos (30 Sep 2026), pinned by the demo clock so they
     never age: ?sk= the first-week demo (c6, day 6), ?vk= the before-the-visit
     demo (c7, day 17). Parts 1-2 shoot from the first, 3-4 from the second. */
  var START = new URLSearchParams(location.search).get('sk') || '';
  var VISIT = new URLSearchParams(location.search).get('vk') || '';
  var STORE_URL = null;
  var resolved = {};                       /* course+role -> the key to use */

  function tutorKeyFor(course) {
    return course === 'scratch' ? SCRATCH : course === 'finished' ? FINISHED : course === 'start' ? START : course === 'visit' ? VISIT : KEY;
  }
  function storeCall(body) {
    return (STORE_URL ? Promise.resolve(STORE_URL)
      : fetch('../hub-store.js').then(function (r) { return r.text(); })
          .then(function (t) { STORE_URL = (t.match(/https:\/\/script\.google\.com\/macros\/s\/[^'"]+/) || [])[0]; return STORE_URL; }))
      .then(function (url) {
        /* Apps Script answers the odd call with an HTML error page (one in
           three during a bad minute), which is not the film's fault and
           should not cost a scene its person: three tries, a pause between. */
        var tries = 0;
        function once() {
          return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) })
            .then(function (r) { return r.text(); })
            .then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('not JSON'); } })
            .catch(function (e) { if (++tries >= 3) throw e; return new Promise(function (res) { setTimeout(res, 2500); }).then(once); });
        }
        return once();
      });
  }
  /* Read-only: a roster lookup and an assessor link. Nothing here changes
     anything, which is why it may run against the real courses. */
  function keyForScene(sc) {
    var course = sc.course || 'demo';
    var role = sc.role || 'tutor';
    var tag = course + ':' + role + ':' + (sc.as || '');
    if (resolved[tag]) return Promise.resolve(resolved[tag]);
    var tutor = tutorKeyFor(course);
    if (!tutor) return Promise.resolve({ error: 'no key for the ' + course + ' course' });
    if (role === 'tutor') { resolved[tag] = { k: tutor }; return Promise.resolve(resolved[tag]); }
    if (role === 'assessor') {
      return storeCall({ op: 'assessorLink', key: tutor }).then(function (r) {
        var v = r && r.ok ? { ak: r.result.key } : { error: 'assessorLink: ' + ((r && r.error) || '?') };
        resolved[tag] = v; return v;
      });
    }
    /* A volunteer student's own link: their token is on the course's
       register, read with the tutor key and never written down here. */
    if (role === 'volunteer') {
      return storeCall({ op: 'course', key: tutor }).then(function (r) {
        var st = (r && r.ok && r.result && r.result.volunteers && r.result.volunteers.students) || [];
        var want = String(sc.as || '').toLowerCase();
        var who = st.filter(function (p) { return p && p.token && (!want || String(p.name).toLowerCase().indexOf(want) === 0); })[0];
        var v = who ? { v: who.token } : { error: 'no volunteer ' + (sc.as || '') + ' on the ' + course + ' course' };
        resolved[tag] = v; return v;
      });
    }
    return storeCall({ op: 'roster', key: tutor }).then(function (r) {
      if (!r || !r.ok) { return { error: 'roster: ' + ((r && r.error) || '?') }; }
      var people = (r.result && r.result.trainees) || [];
      var who = sc.as ? people.filter(function (p) { return p.name === sc.as; })[0] : people[0];
      var v = who ? { t: who.token } : { error: 'no candidate ' + (sc.as || '') + ' on the ' + course + ' course' };
      resolved[tag] = v; return v;
    });
  }
  /* ?trainee= is a TOKEN on the screens that use it -- the marking sheet reads
     the roster by it -- and a token is a candidate's own way in. None may go
     in this file: the repository is public. So a scene names the candidate and
     the token is looked up here, at run time, from the same read-only roster
     call keyForScene already makes. A prefix is enough ('Zeyne'), which is how
     the scenes were already written. */
  function resolveParams(sc) {
    var ps = sc.params || {};
    if (!ps.trainee) return Promise.resolve(ps);
    var tutor = tutorKeyFor(sc.course || 'demo');
    if (!tutor) return Promise.resolve(ps);
    return storeCall({ op: 'roster', key: tutor }).then(function (r) {
      var people = (r && r.ok && r.result && r.result.trainees) || [];
      var want = String(ps.trainee).toLowerCase();
      var who = people.filter(function (p) { return String(p.name).toLowerCase().indexOf(want) === 0; })[0];
      if (!who) { warn('no candidate whose name starts "' + ps.trainee + '" on the ' + (sc.course || 'demo') + ' course'); return ps; }
      var out = {};
      Object.keys(ps).forEach(function (k) { out[k] = ps[k]; });
      out.trainee = who.token;
      return out;
    });
  }
  var timers = [];
  var playing = true;
  var current = 0;
  var startedAt = 0;
  /* How the captions are paced. The four numbers that decide whether the
     film reads comfortably; nothing else sets it. */
  var CAPTION_CPS = 6;      /* characters a second -- slow, and meant to be */
  var CAPTION_MIN = 3600;   /* even three words get this long */
  var CAPTION_FADE = 500;       /* in; matches .caption's transition */
  var CAPTION_FADE_OUT = 1600;  /* out -- slow, and it drifts the whole way */
  var CAPTION_GAP = 1000;   /* silence before the next one may begin */
  /* How long the film waits before carrying on past a caption -- just enough
     for the words to arrive, not for them to be finished with. Two captions in
     a row need a hold between them or the second lands on the first. */
  var CAPTION_STEP = 1200;

  var stubbed = [];      /* which writes were caught, per scene -- shown below */
  var loadSeq = 0;       /* makes every iframe URL unique, so onload always fires */

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }

  /* ---- the cursor ------------------------------------------------------ */
  function moveTo(x, y) {
    cursor.classList.add('on');
    cursor.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }
  function popAt(x, y) {
    ring.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    ring.classList.remove('pop');
    void ring.offsetWidth;
    ring.classList.add('pop');
  }
  function centreOf(el) {
    /* A rect is already where the thing IS on screen -- the browser has taken
       the scroll off it. Taking the scroll off a second time put the cursor
       as far above the button as the page had been scrolled, which is why the
       cursor was sometimes nowhere near what it was about to press (Ramy,
       30 Sep 2026). The click always landed; only the hand was in the wrong
       place. The iframe sits at the stage's origin at its own size, so the
       rect's numbers are the cursor's numbers. */
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  /* ---- reaching into the screen ---------------------------------------- */
  function doc() { return frame.contentDocument; }
  function find(sel) {
    var d = doc();
    if (!d) return null;
    /* "text:Some words" finds the first element whose own text is that --
       the screens are hand-written HTML and not every button has an id. */
    if (sel.indexOf('text:') === 0) {
      var want = sel.slice(5).toLowerCase();
      var all = d.querySelectorAll('button, a, .btn, [role=button], summary, label, option');
      for (var i = 0; i < all.length; i++) {
        var t = (all[i].textContent || '').trim().toLowerCase();

      }
      return null;

    return d.querySelector(sel);
  }

  /* React-free pages, but the same trap applies: a framework field needs the
     prototype's setter or its listener never fires. Lite is hand-written, so
     a plain assignment plus an input event is enough -- kept in one place so
     there is somewhere to fix it if that ever changes. */
  function setValue(el, v) {
    /* A feedback point is a contenteditable div, not a field -- setting .value
       on one does nothing at all, silently: the scene played, the cursor sat
       in the right place and no words appeared. The tag chips live inside these
       boxes, which is why they are contenteditable in the first place, so the
       text goes in as a text node and the same input event is fired. */
    if (el.isContentEditable) {
      el.textContent = v;
      el.dispatchEvent(new InputEvent('input', { bubbles: true, data: v.slice(-1) }));
      return;
    }
    el.value = v;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }

  /* ---- the steps ------------------------------------------------------- */
  var STEP = {
    caption: function (s) {
      /* Off and reset before it comes back on, with a reflow in between, or
         the browser keeps the old animation running and the new caption
         inherits however far the last one had drifted. */
      capEl.classList.remove('on', 'out');
      void capEl.offsetWidth;
      capEl.textContent = s.text;
      capEl.classList.add('on');
      /* A caption is read WHILE watching something else, so it needs far
         longer than reading speed suggests -- the eye is on the screen and
         comes to the words late. CAPTION_CPS is deliberately slow: at 8
         characters a second a twelve-word line sits for about six seconds.
         Raise the numbers here to slow the whole film's words at once; they
         are the only place the pace of the captions is set.
         Ramy, 27 Sep: still too fast at 13/sec, so 8; then still too fast at
         8 once the film was watched end to end, so 6. A twelve-word line now
         sits for about eight seconds. */
      var hold = Math.max(CAPTION_MIN, (s.text.length / CAPTION_CPS) * 1000);
      later(function () { capEl.classList.add('out'); }, CAPTION_FADE + hold);
      /* A CAPTION DOES NOT STOP THE FILM. It used to return its whole life, so
         the picture froze for six or seven seconds while the words were up --
         which meant every caption described the screen as it had been a moment
         earlier, and by the time the screen moved the words were gone. Ramy,
         27 Sep 2026: "when the caption comes it should be referring to
         something they can see. Everyone gets their own link, but it's not
         showing the links. Why?" Because the scroll that showed them was
         waiting for the caption to finish.
         Now it hands back after a beat and the next step -- the scroll, the
         click, the cursor moving to the thing -- happens UNDER the floating
         words. The caption fades on its own timer regardless. */
      return CAPTION_STEP;
    },
    move: function (s) {
      var el = find(s.to);
      if (!el) { warn('move: no ' + s.to); return 200; }
      var c = centreOf(el);
      moveTo(c.x, c.y);
      return s.ms || 700;
    },
    click: function (s) {
      var el = find(s.on);
      if (!el) { warn('click: no ' + s.on); return 200; }
      var c = centreOf(el);
      moveTo(c.x, c.y);
      later(function () {
        popAt(c.x, c.y);
        /* A real click on a box puts the caret in it. el.click() does not move
           focus at all, which the dictation beat found the hard way: the plan
           clicked into the aim, then pressed Dictate, and Dictate refuses with
           an alert() when nothing is focused -- so the film pressed a button
           that could never turn on. Focus first, the way the mouse would. */
        if (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) {
          try {
            el.focus();
            /* And say so. focus() sets activeElement but fires NO focus event
               while the OS window itself is unfocused (document.hasFocus() is
               false), so the dictation bar -- which learns which box to write
               into from a focusin listener -- never heard about it. True of a
               check run in a background window, and true of a take the moment
               the recording window loses focus, which is the worse case
               because it fails silently and the button just refuses. */
            el.dispatchEvent(new FocusEvent('focus', { bubbles: false }));
            el.dispatchEvent(new FocusEvent('focusin', { bubbles: true }));
          } catch (e) {}
        }
        el.click();
      }, 620);
      return (s.ms || 1200);
    },
    type: function (s) {
      var el = find(s.into);
      if (!el) { warn('type: no ' + s.into); return 200; }
      /* Typing into something nobody can see is the quietest way for a scene
         to look broken -- it plays perfectly and shows nothing. Say so. */
      if (!el.offsetHeight) warn('type: ' + s.into + ' is hidden — open its panel first');
      var c = centreOf(el);
      moveTo(c.x, c.y);
      el.focus();
      var text = s.text, i = 0;
      var each = s.ms ? s.ms / text.length : 34;
      /* A date, time or colour field rejects every partial value as invalid,
         so typing one character at a time leaves it EMPTY until the last
         keystroke and then snaps -- the animation plays and shows nothing.
         Those get the whole value at once, after a beat, which is what the
         field does for a person using the picker anyway. */
      if (/^(date|time|datetime-local|month|week|color)$/.test(el.type || '')) {
        later(function () { setValue(el, text); }, Math.min(600, s.ms || 600));
        return (s.ms || 900) + 400;
      }
      (function tick() {
        if (i > text.length) return;
        setValue(el, text.slice(0, i++));

      })();
      return (s.ms || text.length * 34) + 400;
    },
    scroll: function (s) {
      var d = doc();
      /* A number, 'bottom', or a selector: the element's own top, less a
         little air, so a section heading lands where an eye expects it. */
      var to = s.to === 'bottom' ? d.body.scrollHeight
             : typeof s.to === 'number' ? s.to
             : (function () { var el = find(String(s.to)); if (!el) { warn('scroll: no ' + s.to); return 0; } return Math.max(0, el.getBoundingClientRect().top + (d.documentElement.scrollTop || d.body.scrollTop || 0) - 40); })();

        var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        d.documentElement.scrollTop = d.body.scrollTop = from + (to - from) * e;

    },
    hold: function (s) { return s.ms || 2000; },
    /* Move to another screen inside the same scene, optionally as someone
       else -- {do:'goto', screen:'...', role:'trainee', as:'Emily Carter'}.
       Inherits the scene's course unless the step names its own. */
    goto: function (s) {
      var sc = SCENES[current];
      /* params too, and NOT inherited: a goto usually lands on a different
         screen, where the scene's own ?trainee= or ?a= would be wrong or would
         name somebody who is not on the course it just moved to. */
      var as = { course: s.course || sc.course, role: s.role || 'tutor', as: s.as, params: s.params, stub: s.stub || sc.stub, settle: s.settle || sc.settle };
      cursor.classList.remove('on');
      waiting = true;
      curtain.classList.add('on');
      showScreen(as, s.screen, function () { curtain.classList.remove('on'); waiting = false; });
      return (s.ms || 2200);
    },
    /* A full-screen title between the journeys. It holds, then fades out and
       leaves the screen behind it, which is why the scene it opens still does
       its own settle: the card is covering a real screen that is loading. */
    chapter: function (s) {
      document.getElementById('chapterNum').textContent = s.num || '';
      document.getElementById('chapterWho').textContent = s.text || '';
      document.getElementById('chapterSub').textContent = s.sub || '';
      chapter.classList.add('on');
      cursor.classList.remove('on');
      var hold = s.ms || 3400;
      later(function () { chapter.classList.remove('on'); }, hold);
      return hold + 700;
    },
    /* Draw on the open signature pad (hub-ink), stroke by stroke with pointer
       events from the top-left of the pad, so the ink appears as a hand would
       leave it; type the name if the pad asks for one and it is empty; then
       Sign. The stroke is the same shape every take -- nobody's, and legible
       as a signature. {do:'draw', name:'Jordan Blake', ms} */
    draw: function (s) {
      var d = doc();
      var padEl = d && d.querySelector('.ink-pad');
      if (!padEl) { warn('draw: no signature pad is open'); return 200; }
      /* hub-ink captures the pointer on pointerdown; a synthetic pointer is
         not active, and Chrome throws before the stroke begins. The pad does
         not need capture when the film is the hand. */
      padEl.setPointerCapture = function () {}; padEl.releasePointerCapture = function () {};
      var nameIn = d.querySelector('.ink-name input');
      if (nameIn && !nameIn.value && s.name) setValue(nameIn, s.name);
      /* The overlay is fixed, so its rect is already where the cursor goes:
         the iframe sits at the stage's origin at its own size. */
      var r = padEl.getBoundingClientRect();
      var pts = [[0.08,0.62],[0.13,0.40],[0.18,0.66],[0.24,0.36],[0.29,0.60],[0.35,0.48],[0.41,0.70],[0.47,0.42],[0.53,0.62],[0.59,0.38],[0.65,0.66],[0.71,0.46],[0.78,0.62],[0.85,0.50],[0.91,0.58]];

        fire('pointerdown', pts[0]);
        (function step() {
          i++;
          if (i >= pts.length) {
            fire('pointerup', pts[pts.length - 1]);
            later(function () {
              var ok = d.querySelector('.ink-ok');
              if (!ok) { warn('draw: the pad closed before Sign'); return; }
              var b = ok.getBoundingClientRect();
              moveTo(b.left + b.width / 2, b.top + b.height / 2);
              later(function () {
                if (ok.disabled) { warn('draw: Sign stayed disabled — no stroke was taken'); return; }

                ok.click();

            }, 420);
            return;

          later(step, total / pts.length);

      return total + 1900;
    },
    still: function (s) {
      /* A still with an `img` is a frame made for the film (film/stills/);
         without one it is the placeholder card that says what to capture. */
      var im = document.getElementById('stillImg');
      if (s.img) { im.src = s.img; im.hidden = false; } else { im.hidden = true; im.removeAttribute('src'); }
      document.getElementById('stillWant').textContent = s.img ? '' : s.want;
      document.getElementById('stillHow').textContent = s.img ? '' : (s.how || '');

      cursor.classList.remove('on');
      later(function () { still.classList.remove('on'); }, s.ms || 3000);
      return (s.ms || 3000) + 200;
    }

  function warn(msg) {
    var w = document.createElement('div');
    w.className = 'warn';
    w.textContent = 'scene ' + (current + 1) + ': ' + msg;
    note.appendChild(w);
  }

  /* ---- a scene --------------------------------------------------------- */
  function loadScene(i, then) {
    current = i;
    clearTimers();
    capEl.classList.remove('on');
    cursor.classList.remove('on');
    still.classList.remove('on');
    note.innerHTML = '<b>' + (i + 1) + ' · ' + SCENES[i].title + '</b> — ' + (SCENES[i].about || '');
    var dayEl = document.getElementById('day');
    if (SCENES[i].day) { dayEl.textContent = SCENES[i].day; dayEl.classList.add('on'); } else { dayEl.classList.remove('on'); }
    paintTabs();

    stubbed = [];
    waiting = false;
    /* Up for the load, down when the screen is ready -- scene loads only. A
       `goto` inside a scene keeps its own timing; its steps run to a budget
       the scene author set, and a curtain there would hide them. */
    curtain.classList.add('on');
    showScreen(SCENES[i], SCENES[i].screen, then);
  }

  /* Point the frame at a screen, as whoever that scene is. Also the `goto`
     step, so one scene can follow a document from one side to the other --
     a candidate submits, the tutor marks, the candidate reads it back. */
  function showScreen(sc, screen, then) {
    Promise.all([keyForScene(sc), resolveParams(sc)]).then(function (both) {
      var who = both[0], params = both[1];
      if (who.error) warn(who.error);
      /* A page of the film's own -- the cold open -- rather than one of
         Lite's screens: served from film/, and it gets no keys. */
      var own = screen.indexOf('film/') === 0;
      var url = own ? screen.slice(5) : '../' + screen;
      var q = [];
      if (own) { who = {}; params = {}; }
      if (who.k) q.push('k=' + encodeURIComponent(who.k));
      if (who.t) q.push('t=' + encodeURIComponent(who.t));
      if (who.ak) q.push('ak=' + encodeURIComponent(who.ak));
      if (who.v) q.push('v=' + encodeURIComponent(who.v));
      /* The console is the one screen that needs the OWNER key, and it takes
         it as ?o=. Passed through only to that screen, never to the others. */
      if (OWNER && screen.indexOf('14_owner') === 0) q.push('o=' + encodeURIComponent(OWNER));
      /* Anything else the screen takes in its own URL -- ?trainee= on the
         feedback sheet, say. */
      Object.keys(params || {}).forEach(function (p) {
        q.push(p + '=' + encodeURIComponent(params[p]));
      });
      if (q.length) url += (url.indexOf('?') === -1 ? '?' : '&') + q.join('&');

      /* A unique parameter on every load. Two scenes in a row can want the
         same screen as the same person -- the plan and the analysis sheet,
         the two feedback scenes -- and setting an iframe's src to the URL it
         already has fires no load event at all, so the film simply stopped.
         The screens ignore it. */
      url += (url.indexOf('?') === -1 ? '?' : '&') + '_=' + (++loadSeq);

      /* Forget who the last scene was. The screens remember a key in
         localStorage, which is the right behaviour for a person following a
         link and the wrong one for a film: after the finished-course scenes,
         the closing invite card came back as the finished course instead of the demo,
         because the page preferred what the browser already held. Same
         origin, so the film can clear it from here before the screen boots. */
      try {
        localStorage.removeItem('hub:k');
        localStorage.removeItem('hub:t');
        localStorage.removeItem('hub:a');
        localStorage.removeItem('hub:v');
        /* And forget the last screen's boot, so the wait below sees this
           screen's own. The tutor's name goes in for every tutor screen: the
           dashboard asks for it once and draws nothing until it has it, which
           is right for a person and a blank frame for a film. */
        localStorage.removeItem('hub:booted');
        if (who.k && !who.t && !who.ak && !who.v) localStorage.setItem('chub:tutorName', 'Jordan Blake');
      } catch (e) {}

      frame.onload = function () {
        frame.onload = null;
        /* A caption outlives the step that started it now, which is the point
           -- but it must not outlive the SCENE and float over the next
           chapter's title. It fades rather than vanishing. */
        if (capEl.classList.contains('on')) capEl.classList.add('out');
        silenceDialogs();
        stubStore(sc.stub || []);
        /* A Lite screen paints from static HTML and repaints when the store
           answers, which on Apps Script is anywhere from two to twenty
           seconds; a fixed settle was either wasted or too short (30 Sep
           2026). hub-sync writes hub:booted as "mode:key" when its boot has
           landed, so the film waits for THIS screen's own flag -- the previous
           screen, alive in the frame until replaced, can write its flag a
           moment after the engine cleared it -- up to forty seconds, then the
           scene's settle for the paint, then the first control the scene
           reaches for. A screen with no hub-sync (the card, the console, the
           film's own pages) has no flag to wait for. */
        var d0 = frame.contentDocument;
        var hasSync = !!(d0 && d0.querySelector('script[src*="hub-sync"]'));
        var expect = who.k && !who.t && !who.ak && !who.v ? 'tutor:' + who.k : who.ak ? 'assessor:' + who.ak : who.v ? 'volunteer:' + who.v : who.t ? 'trainee:' + who.t : '';
        var t0 = performance.now();
        (function waitBoot() {
          var booted = false;
          try { booted = expect ? localStorage.getItem('hub:booted') === expect : !!localStorage.getItem('hub:booted'); } catch (e) {}
          if (!hasSync || booted || performance.now() - t0 > 40000) { later(function () { waitFirst(sc, then); }, sc.settle || 900); return; }
          later(waitBoot, 250);
        })();
      };
      frame.src = url;
    });
  }

  /* Then the first thing the scene reaches for, up to thirty seconds. The
     console paints from the store with no hub-sync at all, and a screen with
     one may paint a beat after its flag; a scene judged or played before its
     first control exists fails for nothing. */
  function waitFirst(sc, then) {
    var first = null;
    /* Only up to the first goto: after it the scene is on another screen,
       and its controls are that screen's to wait for. */
    (sc.steps || []).some(function (s) { if (s.do === 'goto') return true; var sel = s.do === 'move' ? s.to : s.do === 'click' ? s.on : s.do === 'type' ? s.into : (s.do === 'scroll' && typeof s.to === 'string' && s.to !== 'bottom') ? s.to : null; if (typeof sel === 'string') { first = sel; return true; } return false; });

      if (ok || performance.now() - t0 > 30000) { then(); return; }
      later(poll, 300);
    })();
  }

  /* Ops that CHANGE something never reach the store. The screen calls what it
     always calls; this answers for it. Read ops are untouched, so the film
     shows the real course.

     It has to catch TWO layers, which is not obvious from the outside:
       - HubStore.call({op}) -- what the owner console uses;
       - HubStore.<name>()   -- what the other screens use, and these do NOT
         go through HubStore.call. hub-store.js builds them on a private
         `call` inside its own closure, so replacing HubStore.call leaves
         HubStore.addTrainees writing to the real store. Found by reading
         course admin, which uses S.addTrainees and never HubStore.call.
     Anything not caught here reaches the live store, so a scene's `stub`
     list is a safety rail, not decoration. */
  /* A modal dialog stops the film dead and cannot be dismissed from out here:
     the frame's script is blocked mid-step, every timer queues up behind it and
     the take is lost. The screens raise a few -- Dictate says "click into the
     box first", a delete asks to be confirmed -- so they are turned into
     warnings in the film's own note panel instead. A confirm answers yes,
     because a scene only ever reaches one on its way somewhere. */
  function silenceDialogs() {
    var w = frame.contentWindow;
    if (!w) return;
    try {
      w.alert = function (m) { warn('the screen tried to say: ' + m); };
      w.confirm = function (m) { warn('the screen asked: ' + m + ' — answered yes'); return true; };
      w.prompt = function (m) { warn('the screen asked for input: ' + m); return null; };
    } catch (e) { /* cross-origin, which cannot happen here */ }
  }

  /* THE TRANSPORT, not the API.
     The stub used to replace HubStore.call and the named write methods, and a
     take still marked six criteria onto a real candidate's assignment on the
     demo course (found 27 Sep 2026, by looking at the marking sheet rather
     than at the stub).
     The path it missed: hub-sync keeps unsent writes in a queue and flushes
     them on `pagehide` through flushBeacon(), which uses navigator.sendBeacon
     — or a raw fetch — straight to the store's URL and never touches
     HubStore. The film changes scene by setting frame.src, which fires
     pagehide on the outgoing document. So every cut posted the queue.
     Stubbing each way in turn is a losing game: the next path added to
     hub-sync would leak in the same silence. So this wraps the two things
     that can actually reach the network, and drops anything addressed to the
     store carrying a stubbed op. */
  function stubTransport(w, ops, reply) {
    var url = STORE_URL || '';

      try { return (typeof body === 'string' ? JSON.parse(body) : JSON.parse(body && body.toString())).op; }
      catch (e) { return null; }

    var realFetch = w.fetch;
    w.fetch = function (u, init) {
      var op = init && init.body ? opOf(init.body) : null;

        stubbed.push(op + ' (fetch)');

      }
      return realFetch.apply(this, arguments);

      nav.sendBeacon = function (u, data) {
        /* A Blob has to be read to be judged, and sendBeacon is synchronous.
           Anything aimed at the store during a take is dropped: a take never
           has a write worth keeping, and answering true is what the caller
           expects from a beacon it will never hear about again. */
        if (mine(u)) { stubbed.push('beacon'); return true; }
        return realBeacon(u, data);
      };
    }
  }

  function stubStore(ops) {
    if (!ops.length) return;
    var w = frame.contentWindow;
    if (!w || !w.HubStore) { warn('no HubStore on this screen — writes are NOT stubbed'); return; }
    var answers = SCENES[current].answers || {};
    var reply = function (op) {
      var canned = answers[op];
      return Promise.resolve(typeof canned === 'function' ? canned() : (canned || { ok: true, result: {} }));
    };
    /* First, because it is the one that cannot be got round. */
    stubTransport(w, ops, reply);

    if (typeof w.HubStore.call === 'function') {
      var realCall = w.HubStore.call;
      w.HubStore.call = function (body) {
        var op = body && body.op;
        if (ops.indexOf(op) !== -1) { stubbed.push(op); return reply(op); }
        return realCall.apply(this, arguments);
      };
    }
    ops.forEach(function (op) {
      if (typeof w.HubStore[op] === 'function') {
        w.HubStore[op] = function () { stubbed.push(op); return reply(op); };
      }
    });
    /* hub-sync pushes localStorage to the store on its own clock, so a screen
       that "saves" locally still reaches it. Held for the length of a scene
       that stubs writes. */
    if (w.HubSync && typeof w.HubSync.flushNow === 'function') {
      w.HubSync.flushNow = function () { stubbed.push('flushNow'); return Promise.resolve({ ok: true }); };
    }
  }

  /* A `goto` loads another screen, and until 30 Sep 2026 the steps after it
     kept running on the engine's clock while that screen was still coming
     back from the store: a click or a scroll would reach for a control that
     did not exist yet, do nothing, and leave the film sitting on a half-drawn
     page. The queue now waits for the screen, behind the curtain, and the
     step's own ms becomes what it was meant to be -- a beat after the screen
     is there, not instead of it. */
  var waiting = false;

  function runSteps(steps, done) {
    var i = 0;
    (function next() {
      if (!playing || waiting) { later(next, 120); return; }
      if (i >= steps.length) { done(); return; }
      var s = steps[i++];
      var fn = STEP[s.do];
      if (!fn) { warn('unknown step ' + s.do); later(next, 50); return; }
      var ms = fn(s) || 200;
      later(next, ms);
    })();
  }

  function play(i) {
    loadScene(i, function () {
      curtain.classList.remove('on');
      startedAt = performance.now();
      tick();
      runSteps(SCENES[i].steps, function () {
        /* Say what was caught. A scene that lists a write and never triggers
           it is fine; a scene that triggers one NOT in its list would have
           reached the store, and that is what this is watching for. */
        if (stubbed.length) {
          var seen = stubbed.filter(function (v, n, a) { return a.indexOf(v) === n; });
          var d = document.createElement('div');
          d.innerHTML = 'writes held back: <b>' + seen.join(', ') + '</b>';
          note.appendChild(d);
        }
        /* Stop at the end rather than loop. Scene 3 WRITES -- it really adds
           twelve people to the scratch course -- and a loop quietly ran it
           again every cycle, so a roster reset was undone seconds later by a
           film nobody was watching. A film that plays once and stops is also
           what you want when recording. */
        if (i + 1 < SCENES.length) { later(function () { play(i + 1); }, 700); }
        else {
          var d = document.createElement('div');
          d.innerHTML = '<b>End.</b> Press Replay scene, or pick one above.';
          note.appendChild(d);
          cursor.classList.remove('on');
          window.filmEnded = true;
        }
      });
    });
  }

  function tick() {
    if (!timers.length && !playing) return;
    var s = Math.floor((performance.now() - startedAt) / 1000);
    nowEl.textContent = (current + 1) + ' / ' + SCENES.length + ' · ' +
      Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    requestAnimationFrame(tick);
  }

  function paintTabs() {
    tabs.innerHTML = '';
    SCENES.forEach(function (sc, i) {
      var b = document.createElement('b');
      b.textContent = (i + 1) + ' ' + sc.title;
      if (i === current) b.className = 'is';
      b.onclick = function () { playing = true; document.getElementById('play').textContent = 'Pause'; play(i); };
      tabs.appendChild(b);
    });
  }

  /* ---- the music ------------------------------------------------------- */
  var music = document.getElementById('music');
  var musicSrc = new URLSearchParams(location.search).get('music') || 'music.mp3';
  music.src = musicSrc;
  music.volume = 0.18;
  var musicOn = false;
  /* Browsers refuse audio until the page has been clicked, which is correct
     and cannot be worked around -- so the first press of Pause/Play starts
     it, and the note says so instead of leaving a silent film unexplained. */
  function startMusic() {
    if (musicOn) return;
    music.play().then(function () { musicOn = true; }).catch(function () {});
  }
  music.addEventListener('error', function () {
    var d = document.createElement('div');
    d.textContent = 'No music track yet — drop one in as film/music.mp3, or add &music=<url>.';
    note.appendChild(d);
  });

  document.getElementById('play').onclick = function () {
    playing = !playing;
    this.textContent = playing ? 'Pause' : 'Play';
    if (playing) { startMusic(); if (musicOn) music.play(); } else { music.pause(); }
  };
  document.addEventListener('click', startMusic, { once: true });
  document.getElementById('again').onclick = function () { play(current); };

  /* The film is shot from the two standing demos now (30 Sep 2026); the old
     running demo (?k=) is optional and may not exist at all. */
  if (!START || !VISIT) {
    note.innerHTML = '<span class="warn">Missing course keys. Open this as <b>film/?sk=&lt;first-week demo&gt;&amp;vk=&lt;before-the-visit demo&gt;&amp;fk=&lt;finished course&gt;&amp;o=&lt;owner&gt;</b> — ' +
      'the owner console writes the whole address (The film · Open the film), and none of it is committed to this repo.</span>';
  }

  /* ?check=1 -- walk every scene, load its screen as whoever that scene is,
     and say whether each selector it reaches for actually exists. Clicks
     nothing and types nothing, so it is safe to run against the real courses
     and cannot add twelve people to the scratch one. This is the film's own
     test: a selector that has gone stale because a screen changed shows up
     here rather than halfway through a take. */
  function check() {
    var out = [];
    var i = 0;
    note.innerHTML = '<b>Checking every scene…</b>';
    (function nextScene() {
      if (i >= SCENES.length) {
        var bad = out.filter(function (r) { return r.missing.length; });
        note.innerHTML = '<b>' + (bad.length ? bad.length + ' scene' + (bad.length === 1 ? '' : 's') + ' with a selector that is not there' : 'All ' + SCENES.length + ' scenes: every selector resolves') + '</b>';
        out.forEach(function (r) {
          var d = document.createElement('div');
          d.className = r.missing.length ? 'warn' : '';
          d.textContent = (r.missing.length ? '  NOT THERE  ' : '  ok          ') + r.n + ' · ' + r.title +
            (r.missing.length ? ' — ' + r.missing.join(', ') : '') +
            (r.later.length ? '   (behind a click, not judged: ' + r.later.join(', ') + ')' : '');
          note.appendChild(d);
        });
        window.FILM_CHECK = out;
        return;
      }
      var sc = SCENES[i];
      current = i;
      var n = i + 1;
      i++;
      note.innerHTML = '<b>Checking scene ' + n + ' of ' + SCENES.length + '…</b> ' + sc.title;
      /* A screen that never fires load would hang the walk silently. */
      var moved = false;
      /* Store-painted screens can take eighteen seconds on Apps Script; and a
         row for a screen that never loaded still needs its `later` list, or
         the report's own loop stops on it (30 Sep 2026). */
      later(function () { if (!moved) { moved = true; out.push({ n: n, title: sc.title, missing: ['(screen did not load)'], later: [] }); nextScene(); } }, 120000);
      showScreen(sc, sc.screen, function () {
        curtain.classList.remove('on');
        if (moved) return;
        moved = true;
        /* What this can and cannot tell you. It sees the screen AS IT LOADS,
           so a control that only exists after a tab is opened or a button is
           pressed is legitimately absent here -- scene 3's paste box is
           behind two clicks, and .confirm-action does not exist until Add all
           is pressed. Reporting those as failures would make the check
           useless, so a selector that comes after a click in its own scene is
           listed as "later" and only one with nothing before it is a real
           miss. A "later" can still be wrong; it just cannot be judged from
           here, and the film warns at play time if it is. */
        var missing = [], later_ = [], clickedYet = false;
        sc.steps.forEach(function (s) {
          var sel = s.do === 'move' ? s.to : s.do === 'click' ? s.on : s.do === 'type' ? s.into : null;
          if (typeof sel === 'string' && !find(sel)) {
            if (clickedYet) { if (later_.indexOf(sel) === -1) later_.push(sel); }
            else if (missing.indexOf(sel) === -1) missing.push(sel);
          }
          if (s.do === 'click' || s.do === 'goto') clickedYet = true;
        });
        out.push({ n: n, title: sc.title, missing: missing, later: later_ });
        later(nextScene, 200);
      });
    })();
  }

  /* The opening card holds for a beat, then lifts into scene 1. Skipped in
     check mode, which is not watching anything. */
  var opening = document.getElementById('opening');
  if (new URLSearchParams(location.search).get('check')) { playing = false; opening.classList.add('gone'); check(); }
  else {
    /* ?scene=N starts at that scene and plays on from there. A take is one
       scene, filmed on its own and often several times over, so watching the
       four minutes in front of it is not on. 1-based, the way the scene list
       and the counter read. */
    var from = parseInt(new URLSearchParams(location.search).get('scene'), 10);
    play(from >= 1 && from <= SCENES.length ? from - 1 : 0);
    later(function () { opening.classList.add('gone'); }, 3200);
  }
})();
</script>
</body>
</html>
