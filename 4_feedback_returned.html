<!DOCTYPE html>
<!--

-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Feedback returned</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(92.5% 0.012 85); --sand-line:oklch(89.5% 0.012 82);
    --paper:oklch(99.5% 0.004 90); --ink:oklch(23.5% 0.017 65);
    --terracotta:oklch(37.5% 0.058 195); --teal:oklch(37.5% 0.058 195);
    --grey:oklch(51% 0.017 70); --gold:oklch(63% 0.096 72); --gold-lifted:oklch(70% 0.12 72); --ink-warm:oklch(30% 0.042 58);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    padding:44px 16px 80px; display:flex; justify-content:center;}
  .board{max-width:860px; width:100%;}
  .header{background:var(--paper); border-radius:6px; margin-bottom:22px; border-top:2px solid var(--terracotta);
    padding:26px 26px 22px; text-align:center;}
  .header h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.5rem; margin:10px 0 0; color:var(--terracotta);}
  .header p{margin:8px auto 0; font-size:0.86rem; color:var(--grey); max-width:560px;}
  .doc{background:var(--paper); border-radius:6px; padding:26px 28px; border:1px solid var(--sand-line);}
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .empty{background:var(--paper); border-radius:6px; padding:30px 26px; text-align:center; color:var(--grey);}
  .actions{text-align:center; margin-top:18px;}
  .actions button{font-family:'Karla',sans-serif; font-size:0.85rem; font-weight:600; padding:10px 22px;
    border-radius:20px; border:1.5px solid var(--teal); background:var(--paper); color:var(--teal); cursor:pointer;}
  @media print{ .back,.actions,.credit-pill{display:none !important;} body{background:#fff; padding:0;} }
  .wordmark-mark-stage{perspective:400px;}
  @keyframes wordmark-spin{0%,11.11%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
  .wordmark-spin{animation:wordmark-spin 90s linear infinite; transform-origin:50% 50%; transform-style:preserve-3d;}
  @media(prefers-reduced-motion:reduce){ .wordmark-spin{animation:none;} }
</style>
</head>
<body>
<div class="board">
  <div class="header">
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;">
      <div class="hub-centre-logo" style="width:44px;height:44px;border-radius:7px;border:1.5px dashed var(--sand-line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;color:var(--grey);text-align:center;line-height:1.2;">Centre<br>logo</div>
      <span id="centreName" class="hub-centre-name" style="font-family:'Newsreader',Georgia,serif;font-size:18px;color:var(--terracotta);"></span>
    </div>
    <h1>Feedback returned</h1>
    <p>Your plan, self-evaluation and tutor's feedback, assembled into one document. Read-only.</p>
  </div>
  <a class="back" href="index.html">← Back</a>
  <div id="content"></div>
</div>
<script src="hub-shared.js?v=202609210106"></script>
<script src="hub-store.js?v=202609210106"></script>
<script src="hub-sync.js?v=202609210106"></script>
<script type="text/x-hub-app">
function rec(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
const fb=rec('chub:feedback');
const plan=rec('chub:plan');
const selfRec=rec('chub:selfeval');
// Reflect before reading: the feedback opens once the self-evaluation is in
// (Connect's rule; Ramy, 20 Sep 2026).
const selfIn = !!(selfRec && selfRec.status==='turned_in');
document.getElementById('centreName').textContent=(window.hubCentre&&hubCentre().name)||(plan&&plan.centreName)||'';
const content=document.getElementById('content');
if(fb && fb.status==='returned' && fb.docHTML && !selfIn){
  content.innerHTML='<div class="empty">Your tutor\u2019s feedback is in. Write and turn in your <a href="2_trainee_self_evaluation.html">self-evaluation</a> first \u2014 teach, reflect, then read the feedback \u2014 and it opens here.</div>';
} else if(fb && fb.status==='returned' && fb.docHTML){
  const doc=document.createElement('div');
  doc.className='doc';
  doc.innerHTML=fb.docHTML;
  content.appendChild(doc);
  const actions=document.createElement('div');
  actions.className='actions';
  actions.innerHTML='<button type="button" id="printBtn">Print / Save as PDF</button> <button type="button" id="nextTpBtn">Start next TP</button>';
  content.appendChild(actions);
  document.getElementById('printBtn').addEventListener('click',()=>window.print());
  document.getElementById('nextTpBtn').addEventListener('click',async ()=>{
    if(!(await confirmModal('This clears your plan, self-evaluation and this feedback from this browser, so you can start your next TP fresh. Your tutor\'s starred action points have already carried forward. Continue?','Start next TP'))) return;
    localStorage.removeItem('chub:plan');
    localStorage.removeItem('chub:selfeval');
    localStorage.removeItem('chub:feedback');
    // Let the store take the three clears before leaving the page.
    if (window.HubSync) { try { await window.HubSync.flushNow(); } catch (e) {} }
    location.href='index.html';
  });
} else {
  content.innerHTML='<div class="empty">'+(window.HubMode==='trainee' ? 'No feedback returned yet \u2014 it appears here once your tutor returns it.' : 'No returned feedback yet in this browser.')+'</div>';
}
</script>
</body>
</html>
