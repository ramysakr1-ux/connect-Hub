<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    padding:44px 16px 80px; display:flex; justify-content:center;}
  .board{max-width:860px; width:100%;}
  .header{background:var(--surface); border-radius:6px; margin-bottom:22px; border-top:2px solid var(--teal);
    padding:26px 26px 22px; text-align:center;}
  .header h1{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:1.5rem; margin:10px 0 0; color:var(--teal);}
  .header p{margin:8px auto 0; font-size:0.86rem; color:var(--grey); max-width:560px;}
  /* ---- sheets on the desk, newest on top -----------------------------------
     Ramy, 26 Sep 2026: "go, A with the stack." Each returned teaching
     practice is a white sheet lying on the ivory desk -- the same sheet the
     assignment record and the course record are, with the hairline edge and
     the two shadows, one tight where it touches the desk and one wide and
     soft. This was the only document screen still drawn as tinted panels.
     The earlier teaching practices sit a step behind the current one: a
     touch smaller, a touch dimmer, their foot tucked under the sheet that
     came after -- a pile of returned work, newest on top. No tilt: the type
     stays the same size from the head of a sheet to its foot, because this
     is read line by line. Mouse on a sheet and it lifts 3px, the landing
     cards' own motion. Print strips all of it; paper has no desk. */
  #content{position:relative;}
  .doc{position:relative; background:var(--paper); border-radius:6px; padding:26px 28px; border:1px solid var(--sand-line);
    margin-bottom:22px;
    box-shadow:0 1px 2px oklch(58% 0.03 70 / 0.11), 0 7px 16px -7px oklch(58% 0.03 70 / 0.09);
    transition:transform .14s ease, box-shadow .14s ease;}
  .doc.earlier{z-index:1; transform:scale(.975); transform-origin:50% 0;
    filter:saturate(.92) brightness(.985);}
  .doc.current{z-index:2;}
  /* The tuck belongs to the sheet ABOVE, whichever it is: it pulls the next
     one up under its own foot. It was on .earlier while the newest sheet was
     last, which worked only for that order. */
  .doc.tucked{margin-bottom:-14px;}
  .doc:hover{z-index:3; transform:translateY(-3px);
    box-shadow:0 2px 4px oklch(58% 0.03 70 / 0.11), 0 16px 28px -12px oklch(58% 0.03 70 / 0.09);}
  .doc.earlier:hover{transform:scale(.975) translateY(-3px); filter:none;}
  @media (prefers-reduced-motion:reduce){ .doc{transition:none;} .doc:hover{transform:none;} .doc.earlier:hover{transform:scale(.975);} }
  /* A phone: the stored plan and analysis tables are wider than 390px, and
     without a scroller of their own the whole page slid sideways (measured,
     24 Sep 2026). The document scrolls inside its own card instead. Print is
     untouched -- paper has no viewport. */
  @media screen and (max-width:640px){ .doc{overflow-x:auto; padding:20px 16px;} }
  /* Which teaching practice a document is, once there is more than one on the
     page. Sits above each, and prints with it. */
  .tpmark{margin:0 0 14px; font-family:'Instrument Sans','Karla',sans-serif; font-size:10px;
    font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--grey);}
  @page{size:A4 landscape; margin:8mm;}
  @media print{ .doc{break-before:page; page-break-before:always; padding:0; border:none; max-width:none; box-shadow:none; transform:none; filter:none; margin:0; background:#fff;} .doc:first-of-type{break-before:auto; page-break-before:auto;} }
  .back{display:inline-block; margin-bottom:14px; font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .empty{background:var(--surface); border-radius:6px; padding:30px 26px; text-align:center; color:var(--grey);}
  .actions{text-align:center; margin-top:18px;}
  .actions button{font-family:'Karla',sans-serif; font-size:0.85rem; font-weight:600; padding:10px 22px;
    border-radius:20px; border:1.5px solid var(--teal); background:var(--box); color:var(--teal); cursor:pointer;}
  @media print{ .back,.actions,.credit-pill{display:none !important;} body{background:#fff; padding:0;} .board{max-width:none;} }  /* the board is capped at 860px on screen; on paper the page is the width */
  .wordmark-mark-stage{perspective:400px;}

  /* ---- v2 moments (7 Oct 2026) ------------------------------------------
     THE SEALED ENVELOPE: the reflect-first gate drawn as an envelope with the
     mark as its wax seal, for the TP that is back but not yet open. THE
     OPENING: once it opens, a panel above the stack -- the grade as a stamp,
     the tutor, and the starred action points that carry forward. Its motion
     runs the first time a TP is opened in this browser, and then it is
     simply the top of the page. Design: Magic Touches.dc.html, 1b. Print
     keeps the panel and drops the motion. */
  .fv2-env{text-align:center; padding:34px 20px 40px; background:var(--surface); border-radius:16px;}
  .fv2-env .kk{margin:0 0 8px; font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--grey);}
  .fv2-env h2{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:clamp(28px,4vw,40px); line-height:1.1; color:var(--teal-deep); text-wrap:balance;}
  .fv2-paper{position:relative; width:min(420px,100%); aspect-ratio:420/270; margin:32px auto 0; animation:fv2-float 5s ease-in-out infinite;}
  .fv2-paper .body{position:absolute; inset:0; border-radius:10px; background:var(--paper); border:1px solid var(--sand-line); box-shadow:0 30px 50px -28px oklch(30% 0.042 58 / .5);}
  .fv2-paper .flap{position:absolute; left:0; right:0; top:0; height:56%; clip-path:polygon(0 0,100% 0,50% 100%); background:var(--box); border-radius:10px 10px 0 0;}
  .fv2-paper .seal{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); width:72px; height:72px; border-radius:50%; background:var(--gold);
    display:flex; align-items:center; justify-content:center; animation:fv2-glow 2.4s ease-in-out infinite;}
  .fv2-paper .seal svg{width:42px; height:auto;}
  .fv2-paper .to{position:absolute; left:0; right:0; bottom:8%; margin:0; font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:20px; color:var(--gold-deep);}
  .fv2-env .why{margin:30px auto 0; max-width:480px; font-size:15px; line-height:1.6; color:var(--ink-warm); text-wrap:pretty;}
  .fv2-env .go{display:inline-flex; align-items:center; gap:10px; margin-top:18px; height:48px; padding:0 26px; border-radius:999px; background:var(--teal); color:var(--paper);
    font-family:'Karla',sans-serif; font-size:15px; font-weight:700; text-decoration:none; transition:background .15s;}
  .fv2-env .go:hover{background:var(--teal-lifted); color:var(--paper);}
  .fv2-env .go:focus-visible{outline:2px solid var(--gold-lifted); outline-offset:3px;}
  .fv2-env + .doc{margin-top:28px;}

  .fv2-open{margin:0 0 26px; padding:26px 28px; border-radius:16px; background:var(--paper); border:1px solid var(--sand-line);}
  .fv2-open .row{display:flex; justify-content:space-between; align-items:flex-start; gap:20px;}
  .fv2-open .kk{margin:0 0 6px; font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--grey);}
  .fv2-open h2{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:clamp(26px,3.4vw,36px); line-height:1.1; color:var(--teal-deep);}
  .fv2-stamp{flex-shrink:0; width:112px; height:112px; border-radius:50%; border:3px solid currentColor; color:var(--teal); transform:rotate(-8deg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:2px;}
  .fv2-stamp b{font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:34px; line-height:1;}
  .fv2-stamp span{font-family:'Instrument Sans','Karla',sans-serif; font-size:9px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; max-width:86px; line-height:1.2;}
  .fv2-stamp.n{color:var(--ink-warm);}
  .fv2-stars{margin:20px 0 0; padding:18px 20px; border-radius:12px; background:var(--gold-wash); border:2px solid var(--gold);}
  .fv2-stars p{margin:0 0 8px; font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold-deep);}
  .fv2-stars ul{margin:0; padding:0 0 0 18px; display:flex; flex-direction:column; gap:6px;}
  .fv2-stars li{font-size:14px; line-height:1.55; color:var(--ink-warm);}
  .fv2-stars li::marker{content:'\2605  '; color:var(--gold-deep);}
  .fv2-open.fresh .fv2-stamp{animation:fv2-stamp .7s cubic-bezier(.2,.7,.2,1) .3s both;}
  .fv2-open.fresh{animation:fv2-in .8s cubic-bezier(.2,.7,.2,1) both;}
  .fv2-open.fresh .fv2-stars{animation:fv2-in .6s cubic-bezier(.2,.7,.2,1) .55s both;}
  .fv2-open.fresh ~ .doc.current{animation:fv2-in .7s cubic-bezier(.2,.7,.2,1) .75s both;}
  /* What worked: the strengths, beside the starred points (Ramy, 7 Oct 2026) */
  .fv2-pair{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:14px; margin:20px 0 0;}
  .fv2-pair .fv2-stars{margin:0;}
  .fv2-good{padding:18px 20px; border-radius:12px; background:var(--paper); border:1px solid oklch(78% 0.04 195);}
  .fv2-good p{margin:0 0 8px; font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--teal);}
  .fv2-good ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px;}
  .fv2-good li{font-size:14px; line-height:1.55; color:var(--ink-warm);}
  .fv2-good .more{font-size:12.5px; color:var(--grey);}
  .fv2-code{display:inline-block; margin-left:6px; padding:0 6px; border-radius:5px; font-size:0.72rem; font-weight:700; vertical-align:1px;
    background:color-mix(in oklab, var(--teal) 10%, var(--paper)); color:var(--teal);}
  .fv2-stars .fv2-code{background:color-mix(in oklab, var(--gold) 16%, var(--paper)); color:var(--gold-deep);}
  .fv2-open.fresh .fv2-good{animation:fv2-in .6s cubic-bezier(.2,.7,.2,1) .45s both;}
  @keyframes fv2-float{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-8px) rotate(-1deg);}}
  @keyframes fv2-glow{0%,100%{box-shadow:0 0 0 0 oklch(70% 0.12 72 / .5);}50%{box-shadow:0 0 0 18px oklch(70% 0.12 72 / 0);}}
  @keyframes fv2-in{from{opacity:0; transform:translateY(24px);}to{opacity:1; transform:none;}}
  @keyframes fv2-stamp{0%{opacity:0; transform:scale(2.2) rotate(-14deg);}60%{opacity:1; transform:scale(.92) rotate(-8deg);}100%{transform:scale(1) rotate(-8deg);}}
  @media(prefers-reduced-motion:reduce){ .fv2-env *, .fv2-open, .fv2-open *, .fv2-open ~ .doc{animation:none !important;} }
  @media(max-width:560px){ .fv2-open{padding:20px 18px;} .fv2-open .row{flex-direction:column-reverse;} .fv2-stamp{width:92px; height:92px;} .fv2-stamp b{font-size:28px;} }
  @media print{ .fv2-env{display:none;} .fv2-open{border:0; padding:0 0 12px; animation:none !important;} .fv2-open *{animation:none !important;} }
  @keyframes wordmark-spin{0%,11.11%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
  .wordmark-spin{animation:wordmark-spin 90s linear infinite; transform-origin:50% 50%; transform-style:preserve-3d;}
  @media(prefers-reduced-motion:reduce){ .wordmark-spin{animation:none;} }
</style>

<body>
<div class="board">
  <!-- Back sits above the header, as on every other screen (walk, 28 Sep 2026: it was under it here) -->
  <a class="back" href="index.html">← Back</a>
  <div class="header">
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;">
      <div class="hub-centre-logo" style="width:44px;height:44px;border-radius:7px;border:1.5px dashed var(--sand-line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;color:var(--grey);text-align:center;line-height:1.2;">Centre<br>logo</div>
      <span id="centreName" class="hub-centre-name" style="font-family:'Newsreader',Georgia,serif;font-size:18px;color:var(--teal);"></span>
    </div>
    <h1 id="recordTitle">Your teaching practice record</h1>
    <p id="recordIntro">Every teaching practice your tutor has returned, newest last, each with your plan, your self-evaluation and their feedback. Read-only. Print the lot as one PDF to keep.</p>
  </div>
  <div id="content"></div>
</div>
<script src="hub-shared.js?v=202610080652"></script>
<script src="hub-store.js?v=202610080652"></script>
<script src="hub-say.js?v=202610080652"></script>
<script src="hub-sync.js?v=202610080652"></script>
<script type="text/x-hub-app">
function rec(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }

/* ?trainee= opens ONE trainee's record, for a tutor or the assessor.
   Without it this screen only ever read chub:* -- whichever records happen to
   be in the browser -- so a tutor could print all twelve trainees at once
   (screen 15) or one assignment (screen 11 already takes ?trainee=), but never
   one trainee's teaching practice record. "Print me Amara's record" was the
   one thing they could not do (Ramy, 23 Sep 2026).

   A TRAINEE LINK IGNORES IT. The parameter names any trainee on the course,
   and the roster it reads is only ever in a tutor's or assessor's browser --
   but leaving the door open and trusting that is how screen 7 came to hand the
   tutor's grid to a trainee, so this refuses by mode rather than by what
   happens to be in storage. */
const VIEW_ID = (window.HubMode === 'tutor' || window.HubMode === 'assessor')
  ? (new URLSearchParams(location.search).get('trainee') || '')
  : '';
const VIEWED = VIEW_ID
  ? ((rec('connect_roster_v1') || { trainees: {} }).trainees || {})[VIEW_ID] || null
  : null;
const OWN = !VIEW_ID;

const fb = OWN ? rec('chub:feedback') : ((VIEWED && VIEWED.tp && VIEWED.tp.feedback) || null);
const plan = OWN ? rec('chub:plan') : ((VIEWED && VIEWED.tp && VIEWED.tp.plan) || null);
const selfRec = OWN ? rec('chub:selfeval') : ((VIEWED && VIEWED.tp && VIEWED.tp.selfeval) || null);
/* Every teaching practice already returned and filed. This page used to show
   the CURRENT one only, so the moment a trainee pressed "Start next TP" the
   document they had just been given became unreachable to them -- while the
   assessor could read all eight of theirs on the pack. Their own record, and
   they could not keep a copy of it (Ramy, 21 Sep 2026: "at the end of the
   course, if they want, can they download this?"). The documents were here in
   chub:tpHistory the whole time; nothing rendered them. */
const history = (OWN ? rec('chub:tpHistory') : ((VIEWED && VIEWED.tp && VIEWED.tp.history))) || {};

/* Whose record this is, said on the page and therefore on the printout. A PDF
   that goes into a portfolio must not be ambiguous about that, and "Your
   teaching practice record" over someone else's work would be exactly that. */
if (VIEW_ID) {
  const who = (VIEWED && VIEWED.name) || 'This trainee';
  const t = document.getElementById('recordTitle');
  const i = document.getElementById('recordIntro');
  if (t) t.textContent = who + ' \u2014 teaching practice record';
  if (i) i.textContent = 'Every teaching practice returned to ' + who + ', newest last, each with the plan, the self-evaluation and the tutor\u2019s feedback. Read-only.';
  const b = document.querySelector('a.back');
  if (b) { b.href = window.HubMode === 'assessor' ? '12_assessor_pack.html?trainee=' + encodeURIComponent(VIEW_ID) : '6_centre_admin_dashboard.html'; b.textContent = window.HubMode === 'assessor' ? '\u2190 Back to the trainee\u2019s pack' : '\u2190 Back to Course admin'; }
}
/* Which teaching practice the live record is, so the page does not show it
   twice. The tutor files a TP into the history at the moment they return it,
   and the same document is also the live one until the trainee presses
   "Start next TP" -- which is where every trainee sits while they read it,
   and they saw it listed twice (trainee walk, 22 Sep 2026). The live copy is
   the one kept: the tutor may have reopened and returned it again since. */
const curN = (function(){
  const m = String((fb && fb.state && fb.state.f && fb.state.f.fTP) || (fb && fb.label) || '').match(/\d+/);
  const n = m ? parseInt(m[0], 10) : 0;
  return n >= 1 && n <= HUB_MAX_TP ? n : 0;
})();
const past = Object.keys(history)
  .map(Number).filter(n => n >= 1 && n <= HUB_MAX_TP)
  /* Newest first: the pile reads the way the desk looks, front sheet on top
     (the comment above the stack has said so since it was built; the order
     did not, and the sheets came out oldest-first -- found 26 Sep 2026). */
  .sort((a, b) => b - a)
  .map(n => ({ n: n, r: history[n] }))
  .filter(x => x.r && x.r.docHTML)
  .filter(x => !(curN && x.n === curN && fb && fb.status === 'returned' && fb.docHTML));
// Reflect before reading: the feedback opens once the self-evaluation is in
// (Connect's rule; Ramy, 20 Sep 2026).
const selfIn = !!(selfRec && selfRec.status==='turned_in');
document.getElementById('centreName').textContent=(window.hubCentre&&hubCentre().name)||(plan&&plan.centreName)||'';
const content=document.getElementById('content');
/* The current one is gated -- reflect before reading -- but the ones already
   returned and read are simply the record, and are never held back. */
const currentOpen = !!(fb && fb.status==='returned' && fb.docHTML && selfIn);
const currentHeld  = !!(fb && fb.status==='returned' && fb.docHTML && !selfIn);

/* Declared before first use: the opening panel below reads these, and as
   delivered they came after it, so a returned TP opened to a blank page
   (ReferenceError on V2_F; caught walking it, 8 Oct 2026). */
/* ---- v2 moments: shared bits (7 Oct 2026) ---- */
const V2_ME = rec('hub:me') || {};
const V2_F = (fb && fb.state && fb.state.f) || {};
const V2_N = (function(){ const m = String(V2_F.fTP || (fb && fb.label) || '').match(/\d+/); return m ? m[0] : ''; })();
const V2_TUTOR = String(V2_F.fTutor || '').trim();
const v2esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const V2_MARK = '<svg viewBox="8 30 104 60" fill="none" aria-hidden="true"><path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="var(--ink-warm)" stroke-width="13" stroke-linecap="round"></path><path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="var(--paper)" stroke-width="13" stroke-linecap="round"></path></svg>';
/* The same reading of the grade as the CELTA 5 (20_celta5.html:657). */
function v2Grade(g){
  g = String(g || '').trim(); if (!g) return null;
  if (/above|^S\+$/i.test(g)) return { mark: 'S+', word: 'Above standard', n: false };
  if (/not|^N$/i.test(g)) return { mark: 'N', word: 'Not to standard', n: true };
  if (/standard|^S$/i.test(g)) return { mark: 'S', word: 'To standard', n: false };
  return { mark: g.slice(0, 3), word: g, n: false };
}


function addDoc(html, heading){
  const doc=document.createElement('div');
  doc.className='doc';
  doc.innerHTML=(heading?'<p class="tpmark">'+heading+'</p>':'')+html;
  if (window.hubStackTables) hubStackTables(doc);
  content.appendChild(doc);
}
/* The current one goes on first so it sits at the front; the returned ones
   follow it, newest to oldest. Held back, it is not drawn at all and the
   earlier ones are the whole pile. */
/* THE OPENING. A panel above the front sheet: the grade as a stamp and the
   starred action points that carry into the next TP. Motion the first time
   this TP is opened in this browser (chub:fbOpened:<n>), still after that. */
if(currentOpen){
  /* No stamp for Not to standard (Ramy, 8 Oct 2026: "if it's not to
     standard, maybe it just shouldn't say anything"). A stamp celebrates; the
     grade is still in the feedback itself, where it belongs. */
  const g0 = v2Grade(V2_F.fGrade), g = g0 && !g0.n ? g0 : null;
  const L = (fb.state && fb.state.lists) || {};
  /* a point is its words plus the criteria tagged in it (the .tag[data-c]
     spans the writer inserts), shown as small codes after the words */
  const point = it => { const d = document.createElement('div'); d.innerHTML = (it && it.html) || '';
    const codes = [...d.querySelectorAll('[data-c]')].map(t => t.getAttribute('data-c')).filter(Boolean);
    d.querySelectorAll('[data-c]').forEach(t => t.remove());
    return { text: d.textContent.replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim(), codes: codes }; };
  const fromLists = (ids, keep) => ids.reduce((a, k) => a.concat((L[k] || []).filter(keep)), []).map(point).filter(p => p.text);
  /* strengths are lSP and lST, action points lAP and lAT (3_tutor_feedback.html) */
  const good = fromLists(['lSP', 'lST'], it => !!it);
  const stars = fromLists(['lAP', 'lAT'], it => it && it.star);
  const line = p => '<li>' + v2esc(p.text) + p.codes.map(c => '<span class="fv2-code">' + v2esc(c) + '</span>').join('') + '</li>';
  const GOOD_MAX = 3;
  let fresh = false; const key = 'chub:fbOpened:' + (V2_N || 'x');
  try { fresh = localStorage.getItem(key) !== '1'; localStorage.setItem(key, '1'); } catch (e) {}
  if (g || stars.length || good.length) {
    const nextN = V2_N ? (parseInt(V2_N, 10) + 1) : 0;
    content.insertAdjacentHTML('beforeend', '<section class="fv2-open' + (fresh ? ' fresh' : '') + '">'
      + '<div class="row"><div><p class="kk">' + (V2_N ? 'Teaching practice ' + v2esc(V2_N) : 'Teaching practice') + (V2_TUTOR ? ' \u00b7 returned by ' + v2esc(V2_TUTOR) : '') + '</p>'
      + '<h2>Before you read it all</h2></div>'
      + (g ? '<div class="fv2-stamp' + (g.n ? ' n' : '') + '" role="img" aria-label="' + v2esc(g.word) + '"><b>' + v2esc(g.mark) + '</b><span>' + v2esc(g.word) + '</span></div>' : '')
      + '</div>'
      + ((good.length || stars.length) ? '<div class="fv2-pair">'
        + (good.length ? '<div class="fv2-good"><p>What worked \u00b7 ' + good.length + '</p><ul>' + good.slice(0, GOOD_MAX).map(line).join('')
            + (good.length > GOOD_MAX ? '<li class="more">and ' + (good.length - GOOD_MAX) + ' more in the feedback below</li>' : '') + '</ul></div>' : '')
        + (stars.length ? '<div class="fv2-stars"><p>\u2605 Carried into ' + (nextN && nextN <= HUB_MAX_TP ? 'TP' + nextN : 'your next TP') + '</p><ul>' + stars.map(line).join('') + '</ul></div>' : '')
        + '</div>' : '')
      + '</section>');
  }
}
if(currentOpen) addDoc(fb.docHTML, past.length ? 'Teaching practice ' + (function(){ const m=String((fb.state&&fb.state.f&&fb.state.f.fTP)||fb.label||'').match(/\d+/); return m?m[0]:''; })() : '');
past.forEach(x => addDoc(x.r.docHTML, 'Teaching practice ' + x.n));

if(currentHeld){
  /* THE SEALED ENVELOPE. Same rule, same link, same words as before; drawn
     as a letter with the mark as its seal, so a gate reads as a gift. */
  const envelope = '<section class="fv2-env">'
    + '<p class="kk">' + (V2_N ? 'Teaching practice ' + v2esc(V2_N) : 'Teaching practice feedback') + '</p>'
    + '<h2>' + (V2_TUTOR ? v2esc(V2_TUTOR.split(/\s+/)[0]) + '\u2019s feedback is in.' : 'Your tutor\u2019s feedback is in.') + '</h2>'
    + '<div class="fv2-paper" aria-hidden="true"><span class="body"></span><span class="flap"></span><span class="seal">' + V2_MARK + '</span>'
    + (V2_ME.name ? '<p class="to">for ' + v2esc(V2_ME.name) + '</p>' : '') + '</div>'
    + '<p class="why">Teach, reflect, then read the feedback. It opens the moment your self-evaluation is in.</p>'
    + '<a class="go" href="2_trainee_self_evaluation.html">Write my self-evaluation <span aria-hidden="true">\u2192</span></a>'
    + '</section>';
  content.insertAdjacentHTML('afterbegin', envelope);
}
if(currentOpen || past.length){
  /* the pile: the first sheet is the front one, and every sheet but the last
     tucks the one after it under its foot */
  const sheets=[...content.querySelectorAll('.doc')];
  sheets.forEach((d,i)=>{
    d.classList.add(i===0?'current':'earlier');
    if(i<sheets.length-1) d.classList.add('tucked');
  });
  const actions=document.createElement('div');
  actions.className='actions';
  actions.innerHTML='<button type="button" class="btn-print" id="printBtn">Print / Save as PDF</button>'
    + (currentOpen ? ' <button type="button" id="nextTpBtn">Start next TP</button>' : '');
  content.appendChild(actions);
  document.getElementById('printBtn').addEventListener('click',()=>window.print());
  if (currentOpen) document.getElementById('nextTpBtn').addEventListener('click',async ()=>{
    /* The wording used to say this "clears ... this feedback", which was true
       when the page showed one teaching practice and nothing else. It is not
       true now: the document stays on this page with the rest of the record. */
    if(!(await confirmModal('This files the teaching practice away and clears your plan and self-evaluation, so you can start the next one fresh. The feedback stays in your record on this page, and your tutor\'s starred action points have already carried forward. Continue?','Start next TP'))) return;

    /* File it before clearing it. The store normally has it in the history
       already -- the tutor's screen puts it there on returning -- and this page
       then reads it back. But this is the click that DELETES the live copy, and
       it should not rely on someone else having saved it first: if the history
       has no record under this number, put it there now. Walking the trainee on
       21 Sep 2026 with a feedback the history had never seen, the document went
       and the trainee could never read it again. */
    try {
      const cur = JSON.parse(localStorage.getItem('chub:feedback') || 'null');
      if (cur && cur.docHTML) {
        const m = String((cur.state && cur.state.f && cur.state.f.fTP) || cur.label || '').match(/\d+/);
        const n = m ? parseInt(m[0], 10) : 0;
        if (n >= 1 && n <= HUB_MAX_TP) {
          const h = JSON.parse(localStorage.getItem('chub:tpHistory') || '{}') || {};
          if (!h[n]) { h[n] = cur; localStorage.setItem('chub:tpHistory', JSON.stringify(h)); }
        }
      }
    } catch (e) {}

    localStorage.removeItem('chub:plan');
    localStorage.removeItem('chub:selfeval');
    localStorage.removeItem('chub:feedback');
    // Let the store take the filing and the three clears before leaving.
    if (window.HubSync) { try { await window.HubSync.flushNow(); } catch (e) {} }
    location.href='index.html';
  });
} else if(!currentHeld){
  content.innerHTML='<div class="empty">'+(window.HubMode==='trainee' ? 'No feedback returned yet \u2014 it appears here once your tutor returns it.' : 'No returned feedback yet in this browser.')+'</div>';
}
</script>
</body>
</html>
