<!DOCTYPE html>
<!--
  Connect Hub — tutor dashboard
  © 2026 Ramy Sakr. All rights reserved.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Hub — Tutor dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(92.5% 0.012 85); --sand-line:oklch(89.5% 0.012 82);
    --paper:oklch(99.5% 0.004 90); --card:oklch(96.2% 0.02 80); --ink:oklch(23.5% 0.017 65);
    --terracotta:oklch(37.5% 0.058 195); --teal:oklch(37.5% 0.058 195);
    --grey:oklch(51% 0.017 70); --gold:oklch(63% 0.096 72); --gold-lifted:oklch(70% 0.12 72); --ink-warm:oklch(30% 0.042 58);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand);
    padding:40px 20px 60px; display:flex; flex-direction:column; align-items:center;}
  .board{max-width:1080px; width:100%;}
  .header{background:var(--card); border-radius:10px; border-top:3px solid var(--terracotta);
    padding:44px 26px 36px; text-align:center; margin-bottom:22px; box-shadow:0 1px 2px rgba(0,0,0,0.03);}
  .header p.tag{margin:16px 0 0; font-size:1rem; color:var(--grey);}
  .header p.role{margin:20px 0 0; font-size:0.9rem; font-weight:700; color:var(--teal); letter-spacing:0.03em;}
  .course-name{margin:2px 0 0; font-size:1.4rem; font-family:'Newsreader',Georgia,serif; font-weight:700; color:var(--ink);}
  .tabs{display:flex; gap:2px; margin-bottom:0; overflow-x:auto; padding:0 4px;}
  .tab{font-family:'Karla',sans-serif; font-size:0.88rem; font-weight:600; color:var(--grey);
    background:transparent; border:none; border-bottom:3px solid transparent; padding:14px 20px 12px; cursor:pointer; white-space:nowrap; transition:color .15s;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--teal); border-bottom-color:var(--teal);}
  .panel{background:var(--card); border-radius:10px; padding:6px; min-height:220px; box-shadow:0 1px 2px rgba(0,0,0,0.03);}
  table{width:100%; border-collapse:collapse;}
  th{text-align:left; font-size:0.7rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--grey); padding:15px 20px; border-bottom:1px solid var(--sand-line);}
  td{padding:17px 20px; border-bottom:1px solid var(--sand-line); font-size:0.92rem; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover td, table tr:not(:first-child):hover td{background:oklch(93.5% 0.02 80);}
  .pill{display:inline-block; background:var(--sand); color:var(--grey); font-size:0.76rem; font-weight:600;
    padding:5px 12px; border-radius:20px; margin-right:6px;}
  .pill.on{background:#EAF3E9; color:#1E6B63;}
  .pill.off{color:var(--grey); opacity:0.55;}
  .btn{font-family:'Karla',sans-serif; font-size:0.83rem; font-weight:700; padding:9px 18px; border-radius:20px;
    border:1.5px solid var(--sand-line); background:var(--card); color:var(--ink); cursor:pointer; transition:opacity .15s;}
  .btn:hover{opacity:0.8;}
  .btn.primary{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .btn.ghost{border-color:var(--teal); color:var(--teal); background:none;}
  .roster-toolbar{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 6px;}
  .roster-toolbar h3{margin:0; font-size:1rem; font-weight:700; color:var(--ink);}
  .link-cell{display:flex; align-items:center; gap:10px; font-family:monospace; font-size:0.78rem; color:var(--grey);}
  .status-pill{display:inline-block; font-size:0.78rem; font-weight:700; padding:5px 12px; border-radius:20px;}
  .status-pill.draft{background:var(--sand); color:var(--grey);}
  .status-pill.submitted{background:#FBF3E4; color:#8A6320;}
  .status-pill.resubmit{background:#FBEAE6; color:#A33227;}
  .status-pill.passed{background:#EAF3E9; color:#1E6B63;}
  .empty{text-align:center; padding:48px 20px; color:var(--grey);}
  .empty .icon{font-size:1.8rem; opacity:0.35; margin-bottom:8px;}
  .footer{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:36px; font-size:0.8rem; color:var(--grey);}
  .footer span.name{font-weight:600; color:var(--ink);}
</style>
</head>
<body>
<div class="board">
  <div class="header">
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;">
      <span style="width:44px;height:44px;border-radius:9px;background:var(--ink-warm);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg viewBox="8 30 104 60" width="27" height="15.5" fill="none">
          <path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="var(--gold-lifted)" stroke-width="13" stroke-linecap="round"></path>
          <path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="var(--paper)" stroke-width="13" stroke-linecap="round"></path>
        </svg>
      </span>
      <span style="font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:34px;color:var(--gold);">Connect</span>
      <span style="font-family:'Karla',sans-serif;font-weight:600;font-size:24px;color:var(--ink);margin-left:-5px;">Hub</span>
    </div>
    <p class="tag">Every submission a trainee has sent you, imported from their export file.</p>
    <p class="course-name">CELTA — August 2026</p>
    <p class="role">Welcome, Ramy — Course tutor</p>
    <div style="margin-top:18px;">
      <button class="btn primary" id="importTriggerBtn" type="button">Import trainee file</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <span id="importStatus" style="margin-left:10px; font-size:0.82rem; color:var(--grey);"></span>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="submissions">Submissions</button>
    <button class="tab" data-tab="assignments">Assignments</button>
    <button class="tab" data-tab="trainees">Trainees</button>
  </div>

  <div class="panel" id="panel-submissions">
    <table>
      <tr><th>Trainee</th><th>TP</th><th>Status</th><th>Grade</th><th></th></tr>
      <tbody id="subsBody"></tbody>
    </table>
  </div>

  <div class="panel" id="panel-trainees" style="display:none;">
    <table>
      <tr><th>Trainee</th><th>Imported</th><th></th></tr>
      <tbody id="traineesBody"></tbody>
    </table>
  </div>

  <div class="panel" id="panel-assignments" style="display:none;">
    <table>
      <tr><th>Trainee</th><th>Assignment</th><th>Status</th><th></th></tr>
      <tbody id="assignBody"></tbody>
    </table>
  </div>

  <p class="footer">
    <span style="width:22px;height:22px;border-radius:5px;background:var(--ink-warm);display:inline-flex;align-items:center;justify-content:center;">
      <svg viewBox="8 30 104 60" width="13" height="7.4" fill="none">
        <path d="M56.1 42.2 A 24 24 0 1 0 56.1 77.8" stroke="var(--gold-lifted)" stroke-width="13" stroke-linecap="round"></path>
        <path d="M96.1 42.2 A 24 24 0 1 0 96.1 77.8" stroke="var(--paper)" stroke-width="13" stroke-linecap="round"></path>
      </svg>
    </span>
    Designed and built by <span class="name">Ramy</span>
  </p>
</div>
<script>
document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
  document.getElementById('panel-'+btn.dataset.tab).style.display='';
});

const ASSIGN_NAMES = { lrt:'LRT — Language Related Tasks', lsrt:'LSRT — Language Skills Related Task', fol:'FOL — Focus on the Learner', lfc:'LFC — Lessons from the Classroom', a5:'Assignment 5' };
const ROSTER_KEY = 'connect_roster_v1';
function loadRoster(){ try{ return JSON.parse(localStorage.getItem(ROSTER_KEY)) || {trainees:{}}; }catch(e){ return {trainees:{}}; } }
function saveRoster(r){ localStorage.setItem(ROSTER_KEY, JSON.stringify(r)); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function tpStatusPill(tr){
  const fb = tr.tp && tr.tp.feedback, plan = tr.tp && tr.tp.plan, self = tr.tp && tr.tp.selfeval;
  if (fb && fb.status==='returned') return {cls:'passed', label:'Returned'};
  if (self && self.status==='turned_in') return {cls:'submitted', label:'Feedback in progress'};
  if (plan && plan.status==='turned_in') return {cls:'draft', label:'Plan only — no self-eval yet'};
  return {cls:'draft', label:'Not yet turned in'};
}
function assignStatusPill(sub){
  if (!sub) return {cls:'draft', label:'Not started'};
  const map = { draft:['draft','Draft — not submitted'], submitted:['submitted','Submitted'], resubmission_needed:['resubmit','Resubmission needed'], resubmitted:['submitted','Resubmission submitted'], closed:['passed', sub.feedback ? sub.feedback.outcome : 'Closed'] };
  const m = map[sub.stage] || ['draft', sub.stage];
  return {cls:m[0], label:m[1]};
}

function render(){
  const roster = loadRoster();
  const trainees = Object.values(roster.trainees||{}).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const subsBody = document.getElementById('subsBody');
  const assignBody = document.getElementById('assignBody');

  const traineesBody = document.getElementById('traineesBody');
  if (!trainees.length){
    subsBody.innerHTML = `<tr><td colspan="5" class="empty"><div class="icon">—</div>No trainee files imported yet. Ask your trainees to export their work and send you the file.</td></tr>`;
    assignBody.innerHTML = `<tr><td colspan="4" class="empty"><div class="icon">—</div>No trainee files imported yet.</td></tr>`;
    traineesBody.innerHTML = `<tr><td colspan="3" class="empty"><div class="icon">—</div>No trainee files imported yet.</td></tr>`;
    return;
  }

  traineesBody.innerHTML = trainees.map(tr=>`<tr>
    <td>${esc(tr.name)}</td>
    <td>${tr.importedAt ? new Date(tr.importedAt).toLocaleString() : '—'}</td>
    <td><button class="btn primary export-return" data-id="${esc(tr.id)}">Export for trainee</button></td>
  </tr>`).join('');

  subsBody.innerHTML = trainees.map(tr=>{
    const p = tpStatusPill(tr);
    const grade = tr.tp && tr.tp.feedback && tr.tp.feedback.state ? (tr.tp.feedback.state.grade||'—') : '—';
    return `<tr>
      <td>${esc(tr.name)}</td>
      <td>TP</td>
      <td><span class="status-pill ${p.cls}">${esc(p.label)}</span></td>
      <td>${esc(grade)}</td>
      <td><a class="btn ${p.cls==='draft'?'primary':'ghost'}" style="text-decoration:none;display:inline-block;" href="3_tutor_feedback.html?trainee=${encodeURIComponent(tr.id)}">${p.label==='Returned'?'View feedback':'Write feedback'}</a></td>
    </tr>`;
  }).join('');

  let assignRows = [];
  trainees.forEach(tr=>{
    const subs = tr.assignments||{};
    Object.keys(ASSIGN_NAMES).forEach(key=>{
      const sub = subs[key];
      if (!sub || sub.stage==='draft') return; // nothing to mark yet
      const p = assignStatusPill(sub);
      const action = (sub.stage==='submitted'||sub.stage==='resubmitted') ? 'Write feedback' : 'View feedback';
      assignRows.push(`<tr>
        <td>${esc(tr.name)}</td>
        <td>${esc(ASSIGN_NAMES[key])}</td>
        <td><span class="status-pill ${p.cls}">${esc(p.label)}</span></td>
        <td><a class="btn ${action==='Write feedback'?'primary':'ghost'}" style="text-decoration:none;display:inline-block;" href="10_tutor_assignment_marking.html?trainee=${encodeURIComponent(tr.id)}&a=${key}">${action}</a></td>
      </tr>`);
    });
  });
  assignBody.innerHTML = assignRows.length ? assignRows.join('') : `<tr><td colspan="4" class="empty"><div class="icon">—</div>No assignments submitted yet.</td></tr>`;
}
render();

document.getElementById('importTriggerBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }catch(err){ document.getElementById('importStatus').textContent = 'Not a valid file.'; return; }
    if (!data || data.schema !== 'connect-hub-export-v1' || !data.traineeId){
      document.getElementById('importStatus').textContent = 'That doesn’t look like a trainee export file.'; return;
    }
    const roster = loadRoster();
    roster.trainees[data.traineeId] = { id:data.traineeId, name:data.traineeName, centreName:data.centreName, importedAt:new Date().toISOString(), tp:data.tp||{}, assignments:data.assignments||{} };
    saveRoster(roster);
    document.getElementById('importStatus').textContent = 'Imported ' + data.traineeName + '.';
    render();
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('traineesBody').addEventListener('click', e=>{
  const btn = e.target.closest('.export-return'); if (!btn) return;
  const roster = loadRoster();
  const tr = roster.trainees[btn.dataset.id];
  if (!tr) return;
  const payload = {
    schema: 'connect-hub-return-v1',
    exportedAt: new Date().toISOString(),
    traineeId: tr.id,
    traineeName: tr.name,
    tp: { feedback: (tr.tp && tr.tp.feedback) || null },
    assignments: tr.assignments || {}
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'connect-hub-return-' + (tr.name||'trainee').toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
