<!--
  Connect Lite — tutor dashboard (v2 layout, 20 Sep 2026)
  © 2026 Ramy Sakr. All rights reserved.

  Drop-in replacement for 5_tutor_dashboard.html. Same three tabs, the same
  data, the same store calls and the same destinations. Layout only — see
  for-claude-code-tutor-dashboard-v2.md.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">

<title>Connect Lite — Tutor dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600;700&family=Karla:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(92.5% 0.012 85); --sand-line:oklch(89.5% 0.012 82);
    --row-line:oklch(91% 0.012 84);
    --paper:oklch(99.5% 0.004 90);
    /* --box: what a control is filled with -- every button, every field.
       It was --paper, stark white (Ramy, 21 Sep 2026: "I'm not a big fan of
       white... all those white boxes could turn into that sort of different
       beige colour"), and is now the tone Course links and the double-marking
       cards already used. Named for its job, not its look, so a control and a
       panel can part company later. --paper stays white for its own two jobs:
       text on a teal fill, and the arcs of the mark. */
    --box:oklch(96.2% 0.02 80); --card:oklch(96.2% 0.02 80); --ink:oklch(23.5% 0.017 65);
    --terracotta:oklch(37.5% 0.058 195); --teal:oklch(37.5% 0.058 195);
    --grey:oklch(51% 0.017 70); --gold:oklch(63% 0.096 72); --gold-lifted:oklch(70% 0.12 72);
    --ink-warm:oklch(30% 0.042 58); --brick:oklch(52% 0.19 32); --amber:oklch(52% 0.11 75);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:0 20px 90px;}
  .board{max-width:1080px; margin:0 auto;}
  a{color:var(--teal);} a:hover{color:var(--ink-warm);}
  input{font-family:'Karla',sans-serif; color:var(--ink);}
  input:focus{outline:none; border-color:var(--teal);}

  /* ---- chrome ---------------------------------------------------------- */
  .chrome{display:flex; align-items:center; justify-content:space-between; gap:24px; height:64px;}
  .lockup{display:flex; align-items:center; gap:9px;}
  .lockup .tile{width:30px; height:30px; border-radius:7px; background:var(--ink-warm);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .lockup .word{font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:21px;
    line-height:0.85; letter-spacing:-0.012em; color:var(--gold);}
  /* Ramy, 20 Sep 2026: "Lite" sits on Connect's baseline, close to it; the credit stays on this screen (index, 5, 12). */
  .hub-pair{display:inline-flex;align-items:baseline;gap:4px;}
  .hub-word{font-family:'Instrument Sans','Karla',sans-serif; font-weight:500; font-size:9px;
    letter-spacing:0.24em; text-transform:uppercase; color:var(--ink); line-height:1; margin-left:1px;}
  .chrome .right{display:flex; align-items:center; gap:14px;}
  /* On a phone the mark, a 178px field and the role do not fit on one line --
     the header pushed the page 23px sideways (measured, 24 Sep 2026). It wraps
     instead, and the name takes the width it is given. */
  @media(max-width:560px){
    .chrome{height:auto; flex-wrap:wrap; gap:10px; padding:10px 0;}
    .chrome .right{width:100%; justify-content:space-between; gap:10px;}
    #tutorName{flex:1; min-width:0; width:auto;}
  }
  #tutorName{font-size:0.82rem; padding:5px 10px; border:1.5px solid var(--sand-line);
    border-radius:6px; background:var(--box); width:178px; transition:border-color .15s, background-color .15s;}
  /* Empty, it asks. This name prefills the first marker on every assignment
     you mark (Handbook 9.2.3) and the tutor line on every feedback form, so a
     blank one leaves both unsigned -- and it was a pale box in the corner that
     read as decoration (Ramy, 24 Sep 2026: "needs to be more visible").
     :placeholder-shown is the empty state itself, so nothing has to track it:
     the cue disappears the moment a name is typed. */
  #tutorName:placeholder-shown{border:1.5px solid var(--gold, oklch(63% 0.096 72));
    border-left-width:4px; background:var(--gold-wash, oklch(94.5% 0.035 78));}
  #tutorName:placeholder-shown::placeholder{color:var(--gold-deep, oklch(52% 0.098 70)); opacity:1; font-weight:600;}
  #tutorName:focus{outline:none; border-color:var(--gold, oklch(63% 0.096 72));}
  /* Ramy, 21 Sep 2026: the credit sits at the foot, as on the trainee home.
     hub-shared hides .hub-credit under 768px because a header band has no room
     for it; the foot does, so this wins on specificity rather than !important. */
  .foot{margin-top:44px; padding-top:16px; border-top:1px solid var(--sand-line);
    display:flex; align-items:center; justify-content:center; gap:8px;}
  /* the mark beside the credit (Ramy, 21 Sep 2026), the header tile at 18px */
  .foot-mark{width:18px; height:18px; border-radius:4px; background:var(--ink-warm);
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  /* hub-shared gives .hub-credit a 12px left margin for the header band; the
     foot spaces with gap instead, so it is zeroed here rather than with !important */
  .foot .hub-credit{display:inline; margin-left:0;}
  .role{font-family:'Instrument Sans','Karla',sans-serif; font-size:10px; font-weight:600;
    letter-spacing:0.22em; text-transform:uppercase; color:var(--grey);}

  /* The mark turns once every ninety seconds, holding still for the first ten
     of them -- the same rule the trainee home and the four documents carry.
     Ramy, 21 Sep 2026: "I still want the logo to slowly spin." It belongs on
     every screen that shows the mark: the mark is the one thing in Lite that is
     identical everywhere, and a logo that moves on one page and not the next is
     two logos. Honoured only where motion is welcome. */
  @keyframes wordmark-spin{0%,11.11%{transform:rotateY(0deg);}100%{transform:rotateY(360deg);}}
  .wordmark-spin{animation:wordmark-spin 90s linear infinite; transform-origin:50% 50%; transform-style:preserve-3d;}
  @media(prefers-reduced-motion:reduce){ .wordmark-spin{animation:none;} }

  /* ---- title ----------------------------------------------------------- */
  .title{border-top:2px solid var(--terracotta); padding-top:26px; display:flex;
    align-items:flex-end; justify-content:space-between; gap:28px; flex-wrap:wrap;}
  .title h1{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:700; font-size:2.1rem; line-height:1.15;}
  .title p{margin:7px 0 0; font-size:0.9rem; color:var(--grey);}
  .titleacts{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

  /* Every control in this row is the same height; only the fill differs. */
  .btn{display:inline-flex; align-items:center; justify-content:center; height:34px; padding:0 14px;
    font-family:'Karla',sans-serif; font-size:0.82rem; font-weight:600; border-radius:6px;
    border:1.5px solid var(--sand-line); background:var(--box); color:var(--ink);
    text-decoration:none; cursor:pointer; transition:border-color .15s,color .15s;}
  .btn.primary{border-color:var(--teal); background:var(--teal); color:var(--paper); font-weight:700; padding:0 15px;}

  /* ---- setting up (day one only) --------------------------------------- */
  .setup{display:flex; flex-direction:column; gap:15px; max-width:600px;}
  .setup h2{margin:0; font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:1.3rem;}
  .setup .lede{margin:0 0 4px; font-size:0.9rem; color:var(--grey); line-height:1.6; text-wrap:pretty;}
  .sstep{display:flex; gap:12px; align-items:flex-start;}
  /* Gold to do, teal done -- the same pair Course admin's tabs use on the same
     three steps, and the same rescue: the digit was --paper on --sand-line,
     1.34:1, all but invisible. Ink on gold-lifted is 5.06:1. */
  .sdot{width:19px; height:19px; border-radius:50%; flex-shrink:0; margin-top:2px;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; background:var(--gold-lifted); color:var(--ink-warm);}
  .sstep.done .sdot{background:var(--teal); color:var(--paper);}
  .sstep b{font-size:0.92rem; font-weight:600;}
  .sstep p{margin:3px 0 0; font-size:0.85rem; color:var(--grey); line-height:1.55; text-wrap:pretty;}
  .setup-go{align-self:flex-start; margin-top:5px;}

  /* ---- queue ----------------------------------------------------------- */
  .queue{display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;}
  .qcard{flex:1 1 200px; min-width:0; text-align:left; font-family:'Karla',sans-serif;
    background:var(--card); border:1px solid var(--sand-line); border-left:5px solid var(--gold, oklch(63% 0.096 72)); border-radius:10px;
    padding:14px 16px; cursor:pointer;} /* gold edges the card, as everywhere a tutor works */
  .qcard .n{font-family:'Newsreader',Georgia,serif; font-size:1.6rem; font-weight:600;
    line-height:1; color:var(--amber);}
  .qcard .l{font-size:0.85rem; color:var(--grey); margin-top:5px; text-wrap:pretty;}
  .qcard.stuck{border-color:color-mix(in oklab, var(--brick) 32%, transparent);}
  .qcard.stuck .n{color:var(--brick);}
  .qcard.zero{background:none;}
  .qcard.zero .n{color:var(--grey);}
  .qcard.zero{border-color:var(--sand-line); cursor:default;}
  .qcard.on{outline:2px solid color-mix(in oklab, var(--teal) 40%, transparent); outline-offset:-1px;}

  /* ---- tabs ------------------------------------------------------------ */
  .tabs{display:flex; gap:26px; margin-top:28px; border-bottom:1px solid var(--sand-line); overflow-x:auto;}
  .tab{font-family:'Karla',sans-serif; font-size:0.9rem; font-weight:600; background:none; border:none;
    border-bottom:2px solid transparent; color:var(--grey); padding:0 0 11px; margin-bottom:-1px;
    cursor:pointer; white-space:nowrap;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--teal); border-bottom-color:var(--teal);}
  .tab .c{color:var(--grey); font-weight:500; margin-left:6px;}

  /* ---- rows ------------------------------------------------------------ */
  .rows{padding-top:26px;}
  .grid{display:grid; gap:16px; align-items:center;}
  .ghead{padding:0 4px 9px; border-bottom:1px solid var(--sand-line);
    font-family:'Instrument Sans',sans-serif; font-size:10px; font-weight:600; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--grey);}
  .grow{padding:13px 4px; border-bottom:1px solid var(--row-line);}
  .grow .nm{font-size:0.92rem; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis;}
  .grow .mid{font-size:0.88rem; color:var(--grey); min-width:0;}
  .grow .st{font-size:0.88rem; min-width:0; text-wrap:pretty; color:var(--grey);}
  .grow .st.amber{color:var(--amber);}
  .grow .st.brick{color:var(--brick);}
  .grow .act{text-align:right;}
  /* One width for every row action, whatever the label. */
  .rowbtn{display:inline-flex; align-items:center; justify-content:center; width:148px; height:32px;
    font-family:'Karla',sans-serif; font-size:0.8rem; font-weight:600; border-radius:6px;
    border:1.5px solid var(--sand-line); background:var(--box); color:var(--ink);
    text-decoration:none; white-space:nowrap; cursor:pointer;}
  .rowbtn.go{border-color:var(--teal); background:var(--teal); color:var(--paper); font-weight:700;}
  .rowbtn.go:hover{background:var(--teal-lifted, oklch(44% 0.062 195)); border-color:var(--teal-lifted, oklch(44% 0.062 195));}
  .empty{padding:26px 4px; font-size:0.9rem; color:var(--grey);}

  @media (max-width:820px){
    .grid{grid-template-columns:1fr auto !important;}
    .grid > .mid{display:none;}
  }
</style>

<script type="text/x-hub-app">
/* Whose room this is -- see hubTutorRoomOnly in hub-shared.js. Only tutor
   screens link here, but a candidate's link opened it and read the course and
   centre off the header (walk, 22 Sep 2026). */
if (window.hubTutorRoomOnly && hubTutorRoomOnly())
  throw new Error('Connect Lite: stopping this page on purpose \u2014 the tutors\u2019 room is not open to this link.');

/* ---------------------------------------------------------------------------
   Tutor dashboard. Three tabs over the same roster; a queue strip above them
   answering the only question a tutor opens this page with — what is waiting
   on me. Clicking a queue card filters its tab to exactly those rows.
--------------------------------------------------------------------------- */
const ROSTER_KEY='connect_roster_v1';
const ASSIGN_NAMES={fol:'FOL', lrt:'LRT', lsrt:'LSRT', lfc:'LFC', a5:'A5'};
const ASSIGN_FULL={fol:'FOL — Focus on the Learner', lrt:'LRT — Language Related Tasks',
  lsrt:'LSRT — Language Skills Related Task', lfc:'LFC — Lessons from the Classroom',
  a5:'Assignment 5 — Plagiarism Reflection'};

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function loadRoster(){ try{ return JSON.parse(localStorage.getItem(ROSTER_KEY)) || {trainees:{}}; }catch(e){ return {trainees:{}}; } }
function saveRoster(r){ localStorage.setItem(ROSTER_KEY, JSON.stringify(r)); }

/* Only a state that needs the tutor is coloured. Amber = waiting on you.
   Brick = back with the candidate. Everything else is grey. */
function tpState(tr){
  const fb=tr.tp&&tr.tp.feedback, plan=tr.tp&&tr.tp.plan, self=tr.tp&&tr.tp.selfeval;
  if (fb && fb.status==='returned') return {label:'Returned', tone:'', act:false};
  if (self && self.status==='turned_in')
    return fb && fb.status==='draft'
      ? {label:'Feedback in progress', tone:'amber', act:true}
      : {label:'Ready for feedback', tone:'amber', act:true};
  if (plan && plan.status==='turned_in') return {label:'Plan in, no self-evaluation', tone:'', act:false};
  return {label:'Not yet turned in', tone:'', act:false};
}
const A_STATE={
  submitted:           {label:'Submitted',              tone:'amber', act:true},
  resubmitted:         {label:'Resubmission submitted', tone:'amber', act:true},
  resubmission_needed: {label:'Resubmission needed',    tone:'brick', act:false},
  returned_unmarked:   {label:'Returned unmarked',      tone:'brick', act:false},
  closed:              {label:'Closed',                 tone:'',      act:false},
  draft:               {label:'Draft',                  tone:'',      act:false}
};

let TAB='tp', FILTER=null;

function people(){
  return Object.values(loadRoster().trainees||{}).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
}
/* Which TP a candidate is on, for the middle column.
   This used to demand the literal text "TP" followed by a digit. The field
   behind it, fTP on screen 3, is free text with "e.g. TP4" only as a
   placeholder, and everywhere else in Lite it is read by pulling the NUMBER out
   of whatever was typed -- hub-tracker's own tpNumberOf strips non-digits. So a
   candidate whose tutor typed "4" showed an em dash here while the same record
   read as TP4 on the tracker and on their own home page. Found walking the
   tutor role, 21 Sep 2026.
   First number wins, not every digit concatenated: a label like "TP4 · Unit 12"
   must be 4, not 412. */
function tpFirstNumber(v){
  const m = String(v == null ? '' : v).match(/\d+/);
  const n = m ? parseInt(m[0], 10) : 0;
  return n >= 1 && n <= HUB_MAX_TP ? n : 0;
}
function tpNumberOf(tr){
  const t = (tr && tr.tp) || {};
  const f = r => r && r.state && r.state.f;
  const n = tpFirstNumber(t.plan && t.plan.label)
         || tpFirstNumber(f(t.plan) && f(t.plan).fTP)
         || tpFirstNumber(f(t.feedback) && f(t.feedback).fTP)
         || tpFirstNumber(t.feedback && t.feedback.label)
         || tpFirstNumber(f(t.selfeval) && f(t.selfeval).fTP);
  if (n) return 'TP' + n;
  // Nothing live says which one, so it is the next after the highest returned.
  const done = Object.keys(t.history || {}).map(Number).filter(x => x >= 1 && x <= HUB_MAX_TP);
  const next = done.length ? Math.max.apply(null, done) + 1 : 0;
  return next >= 1 && next <= HUB_MAX_TP ? 'TP' + next : '\u2014';
}
function assignmentRows(list){
  let wording=null; try{ wording=JSON.parse(localStorage.getItem('connect_assignment_wording_v2')); }catch(e){}
  const order=hubAssignmentOrder(wording);
  const out=[];
  list.forEach(tr=>{
    const subs=tr.assignments||{};
    order.forEach(key=>{
      if (key==='a5' && !a5InPlay(subs)) return;
      const sub=subs[key];
      if (key==='a5' && sub && sub.stage==='draft'){
        out.push({tr, key, stage:'a5set', s:{label:'Set — awaiting submission', tone:'brick', act:false}});
        return;
      }
      if (!sub || sub.stage==='draft') return;
      out.push({tr, key, stage:sub.stage, s:A_STATE[sub.stage] || {label:sub.stage, tone:'', act:false}});
    });
  });
  return out;
}

function paintQueue(){
  const list=people();
  const tpWaiting=list.filter(t=>tpState(t).act).length;
  const aRows=assignmentRows(list);
  const aWaiting=aRows.filter(r=>r.s.act).length;
  const stuck=aRows.filter(r=>r.stage==='resubmission_needed'||r.stage==='returned_unmarked').length;

  // One filter key per card: each card shows exactly its own rows, and clicking
  // another card switches the filter rather than toggling it off.
  /* One of anything is not "1 teaching practices" (tutor walk, 21 Sep 2026). */
  const card=(n,one,many,tab,key,stuckTone)=>`<button type="button" class="qcard ${n===0?'zero':''} ${stuckTone?'stuck':''} ${FILTER===key&&n>0?'on':''}" data-queue="${tab}" data-key="${key}" ${n===0?'disabled':''}>
    <div class="n">${n}</div><div class="l">${n===1?one:many}</div></button>`;

  document.getElementById('queue').innerHTML =
    card(tpWaiting,'teaching practice ready for your feedback','teaching practices ready for your feedback','tp','tp',false) +
    card(aWaiting,'assignment waiting to be marked','assignments waiting to be marked','assignments','mark',false) +
    card(stuck,'assignment back with the candidate','assignments back with the candidate','assignments','stuck',true);
}

function paintTabsCounts(){
  const list=people();
  document.getElementById('cTp').textContent=list.length||'';
  document.getElementById('cAssign').textContent=assignmentRows(list).length||'';
  document.getElementById('cTrainees').textContent=list.length||'';
}

function row(cols, cells){
  return `<div class="grid grow" style="grid-template-columns:${cols}">${cells}</div>`;
}
function action(label, go, href){
  return `<div class="act"><a class="rowbtn ${go?'go':''}" href="${href}">${esc(label)}</a></div>`;
}

function paintRows(){
  const host=document.getElementById('rows');
  const list=people();
  if (!list.length){
    host.innerHTML = '<div class="empty">No trainees on the course yet \u2014 add them on Course admin\u2019s Roster and links tab, and give each their link.</div>';
    return;
  }

  if (TAB==='tp'){
    const cols='1.5fr 0.5fr 1.3fr auto';
    let rows=list.map(tr=>({tr, s:tpState(tr)}));
    if (FILTER==='tp') rows=rows.filter(r=>r.s.act);
    host.innerHTML =
      `<div class="grid ghead" style="grid-template-columns:${cols}"><div>Trainee</div><div class="mid">TP</div><div>Status</div><div></div></div>` +
      (rows.length ? rows.map(({tr,s})=>row(cols,
        `<div class="nm">${esc(tr.name)}</div>
         <div class="mid">${esc(tpNumberOf(tr))}</div>
         <div class="st ${s.tone}">${esc(s.label)}</div>
         ${action(s.act?'Write feedback':s.label==='Returned'?'View feedback':'Open', s.act,
           '3_tutor_feedback.html?trainee='+encodeURIComponent(tr.id))}`
      )).join('') : '<div class="empty">Nothing waiting on this tab.</div>');
    return;
  }

  if (TAB==='assignments'){
    const cols='1.5fr 0.6fr 1.3fr auto';
    let rows=assignmentRows(list);
    if (FILTER==='mark') rows=rows.filter(r=>r.s.act);
    else if (FILTER==='stuck') rows=rows.filter(r=>r.stage==='resubmission_needed' || r.stage==='returned_unmarked');
    host.innerHTML =
      `<div class="grid ghead" style="grid-template-columns:${cols}"><div>Trainee</div><div class="mid">Task</div><div>Status</div><div></div></div>` +
      (rows.length ? rows.map(({tr,key,stage,s})=>{
        const closed = stage==='closed';
        const href = (closed ? '11_assignment_record.html' : '10_tutor_assignment_marking.html') +
          '?trainee='+encodeURIComponent(tr.id)+'&a='+key;
        return row(cols,
          `<div class="nm">${esc(tr.name)}</div>
           <div class="mid" title="${esc(ASSIGN_FULL[key]||key)}">${esc(ASSIGN_NAMES[key]||key)}</div>
           <div class="st ${s.tone}">${esc(s.label)}</div>
           ${action(s.act?'Mark':closed?'Open the record':'Open', s.act, href)}`);
      }).join('') : '<div class="empty">Nothing submitted yet.</div>');
    return;
  }

  const cols='1.7fr 1fr 1.2fr auto';
  host.innerHTML =
    `<div class="grid ghead" style="grid-template-columns:${cols}"><div>Trainee</div><div class="mid">Teaching practice</div><div>Assignments</div><div></div></div>` +
    list.map(tr=>{
      const subs=tr.assignments||{};
      const closed=Object.keys(subs).filter(k=>subs[k] && subs[k].stage==='closed').length;
      const s=tpState(tr);
      return row(cols,
        `<div class="nm">${esc(tr.name)}${tr.group?` <span style="color:var(--grey);font-size:0.8rem;">· group ${esc(tr.group)}</span>`:''}</div>
         <div class="mid">${esc(tpNumberOf(tr))} · ${esc(s.label.toLowerCase())}</div>
         <div class="st">${closed} of 4 closed</div>
         <div class="act"></div>`);
    }).join('');
}

/* Day one, a centre opening its tutor link for the first time met three empty
   tabs and a queue of zeroes: a work queue for work that cannot exist yet
   (Ramy, 21 Sep 2026 -- "this page is supposed to be where the centre creates
   the course and it just doesn't look like one"). Until the course has a name
   and at least one trainee, this screen is the setting-up screen instead. The
   queue and the tabs come back by themselves once both are true, and then they
   never go away again: one home, which changes shape once. Course admin still
   owns the doing; this only says what is left to do. */
function setupState(){
  let cs = null;
  try { cs = JSON.parse(localStorage.getItem('connect_course_settings')); } catch (e) {}
  const named = !!(cs && cs.courseName);
  const dated = !!(cs && cs.start && cs.end);
  const trainees = people().length;
  return { named, dated, trainees, ready: named && trainees > 0 };
}
function paintSetup(s){
  document.getElementById('queue').style.display = 'none';
  document.getElementById('tabs').style.display = 'none';
  /* Candidate tracker, Grades report and Course admin are three doors into
     rooms with nothing in them yet (Ramy, 21 Sep 2026: "it should not have
     those on top, on the right"). The panel's own button is the one door
     worth opening today, so the row goes until there is a course to look at. */
  document.querySelector('.titleacts').style.display = 'none';
  /* "Course name not set yet" as a headline, above a panel that says to set
     the course up, states the same thing twice and wastes the biggest line on
     the page. Named courses keep their own name here (settings paint first). */
  if (!s.named){
    document.getElementById('courseName').textContent = 'Your new course';
    document.getElementById('courseMeta').textContent = 'Nothing set up on it yet.';
  }
  /* Numbered, and the number stays whether the step is done or not -- the same
     rule Course admin's row follows on the same three steps, so the two
     checklists cannot drift apart (Ramy, 21 Sep 2026: "in order of what they
     do"). The fill says done; the digit says which one it is. The titles here
     stay instructions rather than the row's short labels: this panel is read
     by someone who has not done any of it yet. */
  let sn = 0;
  const step = (done, title, note) =>
    `<div class="sstep${done ? ' done' : ''}"><span class="sdot">${++sn}</span>` +
    `<div><b>${title}</b><p>${note}</p></div></div>`;
  document.getElementById('rows').innerHTML =
    '<div class="setup"><h2>Set your course up</h2>' +
    '<p class="lede">Two things on the Course admin page, and this screen becomes your working list: the teaching practices waiting for your feedback, and the assignments waiting to be marked.</p>' +
    step(s.named && s.dated, 'Name the course and set its dates',
         'The centre, the course, and when it runs. The dates also decide when the assessor\u2019s link stops working.') +
    step(s.trainees > 0, 'Add your trainees',
         s.trainees > 0
           ? esc(s.trainees + (s.trainees === 1 ? ' trainee' : ' trainees') + ' on the course. Each one has a personal link to be sent to them.')
           : 'Each one gets a personal link. Paste the whole list in one go if you have it.') +
    step(false, 'Check the assignment wording',
         'Optional. The four assignments are ready to use as they are; change the wording or the order if your centre runs them differently.') +
    '<a class="btn primary setup-go" href="6_centre_admin_dashboard.html">Open Course admin</a></div>';
}
function paint(){
  const s = setupState();
  if (!s.ready) { paintSetup(s); return; }
  document.getElementById('queue').style.display = '';
  document.getElementById('tabs').style.display = '';
  document.querySelector('.titleacts').style.display = '';
  paintQueue(); paintTabsCounts(); paintRows();
}

document.getElementById('tabs').addEventListener('click', e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t===b));
  TAB=b.dataset.tab; FILTER=null; paint();
});
document.getElementById('queue').addEventListener('click', e=>{
  const b=e.target.closest('[data-queue]'); if(!b || b.disabled) return;
  const key=b.dataset.key; TAB=b.dataset.queue; FILTER = (FILTER===key) ? null : key;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===TAB));
  paint();
});

/* Course identity and the tutor's own name. The name is typed once here and
   prefills the tutor and marker fields on screens 3 and 10 in this browser. */
try{
  const cs=JSON.parse(localStorage.getItem('connect_course_settings'));
  if (cs){
    if (cs.courseName) document.getElementById('courseName').textContent = cs.courseName;
    const fmt=d=>{ try{ return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return d; } };
    const bits=[cs.centreName, cs.centreNumber].filter(Boolean);
    if (cs.start && cs.end) bits.push(fmt(cs.start)+' – '+fmt(cs.end));
    const n=people().length; if (n) bits.push(n+' candidate'+(n===1?'':'s'));
    if (bits.length) document.getElementById('courseMeta').textContent = bits.join(' · ');
  }
}catch(e){}

const nameInput=document.getElementById('tutorName');
nameInput.value = localStorage.getItem('chub:tutorName') || '';
nameInput.addEventListener('input', ()=>localStorage.setItem('chub:tutorName', nameInput.value));

paint();
</script>
