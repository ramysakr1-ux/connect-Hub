<!DOCTYPE html>
<!--
  Connect Lite — the Fail letter
  © 2026 Ramy Sakr. All rights reserved.

  Administration Handbook 10.2: "Potential Fail candidates SHOULD also be
  issued with a Fail letter which makes the possible Fail outcome clear and
  draws attention to action points detailed by the tutors in the CELTA 5
  documents. This should be issued sufficiently in advance of the end of the
  course, ideally with at least two lessons left to teach."

  Note the verb. It is a recommendation, not a requirement, and this screen
  says so in Cambridge's words rather than demanding anything (Ramy, 29 Sep
  2026: "when they say should, it's not a must").

  Until 29 Sep 2026 Lite had the trigger, the urgency line and a "Mark as
  issued today" button -- but no letter. The one written warning Cambridge
  recommends was tracked and never produced, and 12.1.1 lists it as portfolio
  evidence ("where appropriate: a fail warning letter from the centre"), so
  the assessor had a date and nothing to read.

  The letter writes itself from what the course already holds: why the
  candidate is a potential Fail, and the action points the tutors wrote in the
  CELTA 5 Stage records. The tutor edits every line before issuing. Once
  issued it is the candidate's to read -- a warning nobody sees is not a
  warning -- and it prints.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<title>Connect Lite — Fail letter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700;1,600&family=Karla:wght@400;500;600;700&family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:oklch(98.8% 0.006 85); --sand-line:oklch(85.5% 0.02 80); --paper:oklch(99.5% 0.004 90); --surface:oklch(95.2% 0.018 84);
    --cream:oklch(97.5% 0.012 85);
    --box:oklch(91.2% 0.03 80); --card:oklch(95.2% 0.018 84); --ink:oklch(23.5% 0.017 65);
    --teal:oklch(37.5% 0.058 195); --grey:oklch(51% 0.017 70);
    --gold:oklch(63% 0.096 72); --gold-ink:oklch(55% 0.11 70); --ink-warm:oklch(30% 0.042 58); --brick:oklch(52% 0.19 32);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Karla',sans-serif; color:var(--ink); background:var(--sand); padding:24px 20px 90px;}
  .board{max-width:820px; margin:0 auto;}
  a{color:var(--teal);} a:hover{color:var(--ink-warm);}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .back{font-size:0.82rem; color:var(--teal); text-decoration:none; font-weight:600;}
  .back:hover{text-decoration:underline;}
  .btn{font-family:'Karla',sans-serif; font-size:0.85rem; font-weight:600; padding:9px 18px; border-radius:6px;
    border:1.5px solid var(--sand-line); background:var(--box); color:var(--ink); cursor:pointer;}
  .note{font-size:0.86rem; color:var(--grey); line-height:1.6; max-width:560px;}

  /* ---- the two sheets ---- */
  .sheet{background:var(--surface); border-radius:6px; padding:44px 52px; margin-bottom:22px; position:relative;
    border-left:5px solid var(--gold); min-height:1000px;}
  .sheet.cover{background:var(--cream); text-align:center;}
  .frame{border:1px solid var(--sand-line); padding:40px 36px; position:relative;}
  .corner{position:absolute; width:22px; height:22px; border-color:var(--gold); border-style:solid;}
  .corner.tl{top:-1px; left:-1px; border-width:2px 0 0 2px;} .corner.tr{top:-1px; right:-1px; border-width:2px 2px 0 0;}
  .corner.bl{bottom:-1px; left:-1px; border-width:0 0 2px 2px;} .corner.br{bottom:-1px; right:-1px; border-width:0 2px 2px 0;}
  .logo{width:72px; height:72px; object-fit:contain; margin:0 auto 10px; display:block;}
  .centre{font-family:'Newsreader',Georgia,serif; font-size:1.25rem; font-weight:700; color:var(--teal); margin:0 0 18px;}
  .eyebrow{font-family:'Instrument Sans',sans-serif; font-size:11px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--grey); margin:0 0 8px;}
  .courseline{font-family:'Newsreader',Georgia,serif; font-size:1.1rem; font-weight:600; margin:0 0 18px;}
  .divider{display:flex; align-items:center; gap:12px; margin:8px auto 22px; max-width:320px;}
  .divider .rule{flex:1; height:1px; background:var(--sand-line);}
  .divider .mark{color:var(--gold); font-size:0.9rem;}
  .body{font-size:0.95rem; line-height:1.6; margin:0 0 10px;}
  .name{font-family:'Newsreader',Georgia,serif; font-size:2rem; font-weight:700; margin:6px 0 12px;}
  .gradelabel{font-family:'Instrument Sans',sans-serif; font-size:10px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--grey); margin:26px 0 8px;}
  .badge{display:inline-block; border:2px solid var(--teal); border-radius:8px; padding:10px 28px; font-family:'Newsreader',Georgia,serif; font-size:1.6rem; font-weight:700; letter-spacing:0.04em; color:var(--teal);}
  .badge.fail{border-color:var(--brick); color:var(--brick);}
  .badge.top{border-color:var(--gold-ink); color:var(--gold-ink);}
  .disclaimer{font-size:0.78rem; color:var(--grey); margin:12px auto 22px; max-width:440px; line-height:1.5;}
  .para{font-size:0.88rem; line-height:1.6; margin:0 auto 10px; max-width:560px; text-align:left;}
  .signrow{display:flex; justify-content:center; gap:40px; flex-wrap:wrap; margin-top:36px;}
  .signblock{min-width:180px; text-align:center;}
  .signature{font-family:'Newsreader',Georgia,serif; font-style:italic; font-size:1.2rem; color:var(--ink-warm); padding-bottom:6px; border-bottom:1px solid var(--ink); margin-bottom:6px;}
  .signname{font-size:0.86rem; font-weight:600;}
  .signrole{font-size:0.74rem; color:var(--grey);}

  .rhead{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; border-bottom:2px solid var(--teal); padding-bottom:12px; margin-bottom:22px;}
  .rhead h1{margin:0; font-family:'Newsreader',Georgia,serif; font-size:1.6rem; font-weight:700;}
  .rhead .meta{font-size:0.82rem; color:var(--grey);}
  .rhead img{width:48px; height:48px; object-fit:contain;}
  .section{margin-bottom:26px;}
  .section h2{margin:0 0 6px; font-family:'Instrument Sans',sans-serif; font-size:10px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--grey);}
  .intro{font-size:0.84rem; color:var(--grey); line-height:1.55; margin:0 0 12px;}
  .grow{display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:9px 0; border-bottom:1px solid var(--sand-line); font-size:0.92rem;}
  .grow.last{border-bottom:none; border-top:2px solid var(--sand-line); margin-top:2px; padding-top:12px;}
  .grow.last .lab{font-family:'Newsreader',Georgia,serif; font-size:1.05rem; font-weight:600;}
  .grow .val{font-weight:700; white-space:nowrap;}
  .grow .val.fail{color:var(--brick);} .grow .val.top{color:var(--gold-ink);} .grow .val.set{color:var(--teal);}
  .desc-intro{font-size:0.92rem; line-height:1.6; margin:0 0 10px;}
  .bullet{display:flex; gap:10px; font-size:0.9rem; line-height:1.55; margin:0 0 7px;}
  .bullet .tick{color:var(--teal); font-weight:700; flex-shrink:0;}
  .closing{font-size:0.9rem; line-height:1.6; margin:12px 0 0; font-style:italic; color:var(--ink-warm);}
  .comment{font-size:0.92rem; line-height:1.65; white-space:pre-wrap;}
  .missing{background:var(--surface); border-radius:6px; border-left:5px solid var(--brick); padding:22px 26px;}
  .missing h2{margin:0 0 8px; font-family:'Newsreader',Georgia,serif; font-size:1.2rem;}

  /* Orientation stated, not left to the print dialog -- see hub-record.css. */
  @page{ size:A4 portrait; margin:12mm; }
  @media print{
    body{background:#fff; padding:0;}
    .bar, #hubSync{display:none !important;}
    .sheet{border-left:none; border-radius:0; margin:0; min-height:0; padding:18mm 16mm; break-after:page; page-break-after:always;}
    .sheet:last-child{break-after:auto; page-break-after:auto;}
    .sheet.cover{background:#fff;}
  }
  @media(max-width:600px){
    .sheet{padding:24px 18px; min-height:0;} .frame{padding:22px 14px;} .name{font-size:1.5rem;}
  }

  .lede{font-size:0.92rem; line-height:1.6; color:var(--ink-soft); margin:0 0 18px; max-width:62ch;}
  .cite{font-size:0.8rem; line-height:1.6; color:var(--ink-soft); background:var(--surface); border-left:3px solid var(--sand-line);
        padding:10px 14px; border-radius:0 8px 8px 0; margin:0 0 18px;}
  .cite b{color:var(--ink);}
  .sheet{background:var(--paper); border:1px solid var(--sand-line); border-radius:12px; padding:30px 34px;}
  .sheet h2{font-family:'Newsreader',serif; font-size:1.25rem; margin:0 0 4px;}
  .meta{font-size:0.8rem; color:var(--ink-soft); margin:0 0 22px;}
  .para{font-size:0.9rem; line-height:1.65; margin:0 0 14px; white-space:pre-wrap;}
  .f{display:block; font-size:0.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; margin:16px 0 6px;}
  textarea{width:100%; min-height:110px; font-family:'Karla',sans-serif; font-size:0.88rem; line-height:1.6; color:var(--ink);
           background:var(--cream); border:1px solid var(--sand-line); border-radius:8px; padding:10px 12px; resize:vertical;}
  textarea:focus{outline:2px solid var(--teal); outline-offset:1px;}
  .acts{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:20px;}
  .status{font-size:0.8rem; color:var(--ink-soft);}
  .pill{display:inline-block; font-size:0.7rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
        padding:3px 9px; border-radius:999px; border:1px solid var(--sand-line); background:var(--surface); color:var(--ink-soft);}
  .pill.on{background:var(--teal); border-color:var(--teal); color:var(--paper);}
  .pill.amb{background:oklch(93% 0.06 75); border-color:oklch(80% 0.09 72); color:oklch(38% 0.09 60);}
  .empty{font-size:0.86rem; color:var(--ink-soft); background:var(--surface); border:1px dashed var(--sand-line);
         border-radius:10px; padding:18px; text-align:center;}
  .sign{margin-top:26px; padding-top:18px; border-top:1px solid var(--sand-line); font-size:0.88rem;}
  @media print{ textarea{border:none; background:transparent; padding:0; resize:none;} .f{margin-top:14px;} .cite, .lede{display:none;} }
</style>
</head>
<body>
<div class="board">
  <div class="bar">
    <a class="back" id="backLink" href="7_candidate_tracker.html">&larr; Candidate tracker</a>
    <button class="btn" type="button" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div id="doc"></div>
</div>

<script src="hub-tracker.js?v=202609291622"></script>
<script src="hub-store.js?v=202609291622"></script>
<script src="hub-shared.js?v=202609291622"></script>
<script src="hub-sync.js?v=202609291622"></script>
<script type="text/x-hub-app">
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const T = window.HubTracker;
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const IS_TRAINEE = window.HubMode === 'trainee', IS_TUTOR = window.HubMode === 'tutor';
const rec = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(e) { return null; } };
const SETTINGS = rec('connect_course_settings') || {};
const when = iso => iso ? new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }) : '';
const tutorName = () => (localStorage.getItem('chub:tutorName') || '').trim();

/* Who this letter is about. A tutor names a candidate in the link; a candidate
   opens their own. */
let who = null, TOKEN = '';
if (IS_TRAINEE) {
  const me = rec('chub:me') || {};
  who = { name: me.name || '', tr: { tracker: rec('chub:tracker') || {}, celta5: rec('chub:celta5') || {}, celta5t: rec('chub:celta5t') || {},
          tp: { history: rec('chub:tpHistory') || {}, feedback: rec('chub:feedback') }, assignments: rec('connect_assignment_submissions_v1') || {} } };
} else {
  TOKEN = P.get('trainee') || '';
  const r = rec('connect_roster_v1') || {};
  const tr = TOKEN && r.trainees ? r.trainees[TOKEN] : null;
  if (tr) who = { name: tr.name, tr };
}

const saveTracker = patch => {
  if (!IS_TUTOR) return;
  const r = rec('connect_roster_v1');
  if (!r || !r.trainees || !r.trainees[TOKEN]) { alert('The roster has not loaded yet \u2014 give it a moment.'); return; }
  const t = r.trainees[TOKEN].tracker = r.trainees[TOKEN].tracker || {};
  Object.assign(t, patch);
  localStorage.setItem('connect_roster_v1', JSON.stringify(r));
  const s = $('status'); if (s) { s.textContent = 'Saved'; setTimeout(() => { if ($('status')) $('status').textContent = ''; }, 1400); }
};

/* The action points the tutors have already written, in the CELTA 5. 10.2 asks
   the letter to draw attention to exactly these, so the letter offers them
   rather than asking a tutor to retype them. */
function actionPoints(){
  const t = (who.tr.celta5t) || {}, out = [];
  const add = (label, text) => { const v = String(text || '').trim(); if (v) out.push(label + ': ' + v); };
  add('Stage 1 action plan', (t.stage1 || {}).actionPlan);
  add('Stage 2 summary and action points', (t.stage2 || {}).summary);
  add('Stage 3 summary and action points', (t.stage3 || {}).summary);
  return out;
}

function draft(r){
  const centre = SETTINGS.centreName || 'the centre';
  const lines = [];
  lines.push('Dear ' + (who.name.split(/\s+/)[0] || who.name) + ',');
  lines.push('');
  lines.push('I am writing to let you know that, on your work so far, you are at risk of being recommended a Fail for this course. I want you to know this now, while there is still time on the course to change it.');
  if (r.failWhy && r.failWhy.length) {
    lines.push('');
    lines.push('This is what stands behind that, as the course record has it:');
    r.failWhy.forEach(w => lines.push('  \u2022 ' + w));
  }
  const ap = actionPoints();
  if (ap.length) {
    lines.push('');
    lines.push('Your tutors have already written the areas to work on in your CELTA 5. These are the ones that matter most now:');
    ap.forEach(a => lines.push('  \u2022 ' + a));
  } else {
    lines.push('');
    lines.push('Your tutors will go through the areas to work on with you, and they are recorded in your CELTA 5.');
  }
  lines.push('');
  if (r.lessonsLeft > 0) lines.push('You have ' + r.lessonsLeft + ' assessed ' + (r.lessonsLeft === 1 ? 'lesson' : 'lessons') + ' left to teach. Please come and talk to us before the next one so we can plan how to use them.');
  else lines.push('Please come and talk to us as soon as you can so we can go through where things stand.');
  lines.push('');
  lines.push('This is not a final grade. The final recommended grade is decided at the end of the course and is subject to confirmation by Cambridge English.');
  return lines.join('\n');
}

function render(){
  if (!who) { $('doc').innerHTML = '<div class="empty">Name a candidate in the link to open their letter.</div>'; return; }
  const r = T.readCandidate(T.recordFor(who.tr));
  const man = who.tr.tracker || {};
  const issuedAt = man.failLetterIssuedAt || '', issuedBy = man.failLetterBy || '';
  const body = man.failLetterDoc != null ? man.failLetterDoc : draft(r);

  /* A candidate sees the letter only once it has been issued. Before that it
     is the tutors' draft, and a half-written warning is worse than none. */
  if (IS_TRAINEE && !issuedAt) {
    $('doc').innerHTML = '<div class="empty">There is no letter for you to read.</div>';
    return;
  }
  const readOnly = !IS_TUTOR;
  const dates = (SETTINGS.start && SETTINGS.end) ? when(SETTINGS.start) + ' \u2013 ' + when(SETTINGS.end) : '';

  $('doc').innerHTML = `
    ${readOnly ? '' : `<p class="lede">The letter writes itself from the course record and the action points in the CELTA 5. Edit it as you like, then issue it. Once issued, ${esc(who.name.split(/\s+/)[0] || 'the candidate')} can read it here and it becomes part of the portfolio.</p>
    <p class="cite"><b>Administration Handbook 10.2</b> \u2014 potential Fail candidates <b>should</b> also be issued with a Fail letter which makes the possible Fail outcome clear and draws attention to action points detailed by the tutors in the CELTA 5 documents. This should be issued sufficiently in advance of the end of the course, ideally with at least two lessons left to teach. <b>Cambridge recommends this; it does not require it.</b></p>`}
    <div class="sheet">
      <h2>${esc(SETTINGS.centreName || '')}</h2>
      <p class="meta">${esc(SETTINGS.courseName || '')}${dates ? ' \u00b7 ' + esc(dates) : ''}<br>
        ${esc(who.name)}${issuedAt ? ' \u00b7 issued ' + esc(when(issuedAt)) + (issuedBy ? ' by ' + esc(issuedBy) : '') : ''}</p>
      ${readOnly
        ? `<div class="para">${esc(body)}</div>`
        : `<label class="f" for="body">The letter</label><textarea id="body" style="min-height:420px">${esc(body)}</textarea>`}
      <div class="sign">${issuedAt ? esc(issuedBy || '') + '<br>' + esc(SETTINGS.centreName || '') : ''}</div>
    </div>
    ${readOnly ? '' : `<div class="acts">
      ${issuedAt
        ? `<span class="pill on">Issued ${esc(when(issuedAt))}</span><button class="btn" type="button" id="unissue">Withdraw the letter</button>`
        : `<button class="btn primary" type="button" id="issue">Issue this letter</button>${r.lessonsLeft <= 2 ? `<span class="pill amb">${r.lessonsLeft <= 0 ? 'no lessons left to teach' : r.lessonsLeft + ' lesson' + (r.lessonsLeft === 1 ? '' : 's') + ' left to teach'}</span>` : `<span class="status">${r.lessonsLeft} lessons left to teach</span>`}`}
      <button class="btn" type="button" id="reset">Start again from the record</button>
      <span class="status" id="status"></span>
    </div>`}`;

  const b = $('body');
  if (b) b.addEventListener('input', () => saveTracker({ failLetterDoc: b.value }));
  const iss = $('issue');
  if (iss) iss.addEventListener('click', () => {
    let name = tutorName();
    name = (prompt('Your name, to issue this letter:', name) || '').trim();
    if (!name) return;
    localStorage.setItem('chub:tutorName', name);
    const today = new Date().toISOString();
    /* failLetter is the date the tracker has always shown; the document and
       the signer sit beside it so the old field keeps working. */
    saveTracker({ failLetterDoc: ($('body') || {}).value || body, failLetterIssuedAt: today, failLetterBy: name,
                  failLetter: new Date().toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) });
    render();
  });
  const un = $('unissue');
  if (un) un.addEventListener('click', () => {
    if (!confirm('Withdraw the letter? It stops being the candidate\u2019s to read. The text stays here.')) return;
    saveTracker({ failLetterIssuedAt: '', failLetterBy: '', failLetter: '' }); render();
  });
  const rs = $('reset');
  if (rs) rs.addEventListener('click', () => {
    if (!confirm('Replace the text with a fresh draft from the course record?')) return;
    saveTracker({ failLetterDoc: draft(r) }); render();
  });
}
render();
</script>
</body>
</html>
